 POD_story_lunar_auspice_theurge: "Общение серповидной луны"
 POD_story_lunar_auspice_theurge_desc: "Cool Text"
 POD_story_lunar_auspice_theurge_extra_text: "$TAB$#FONT:PODSubtitles;size:24 Общение серповидной луны#!\n\nНесмотря на тесную связь #TOOLTIP:GAME_TRAIT,werewolf,[GetNullCharacter] #L гару#!#! с духами, многие из них не понимают всех тонкостей мира духов. Теург может провести большую часть жизни в [Concept('umbra', 'Умбре')|E], но постичь лишь малую долю её силы. Однако это не мешает им пытаться.\n\nТеурги заслуживают благосклонность [Glossary('Луны', 'glossary_luna_tt')], применяя [Concept('character_interaction', 'взаимодействие персонажа')|E] #clickable «Привязать духа»#! к своим [Concept('spirit_companions', 'духам-спутникам')|E]. Это связывает дух с принадлежащим вам каэрном, предоставляя провинции или графству дополнительные бонусы. Духов можно найти, исследуя любое измерение в [UmbraGlossaryLocalized('spirit_wilds','Духовных дебрях')], призвав их или завершив [Concept('journeys', 'странствия')|E] #V поисков духа#!."

 POD_story_lunar_auspice_theurge_spirit_companions: "Духи-спутники"