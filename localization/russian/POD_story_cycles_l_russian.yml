 lunar_auspice_xp_gain_message: "Благосклонность Луны"

 battle_combat_encounters_enabled_tooltip: "Когда вы командуете [Concept('army', 'армией')|E], могут начаться @pod_combat_encounter_icon![Concept('pod_combat_encounters_with_icon', 'боевые столкновения')|E]"

 POD_story_lunar_auspice_ahroun: "Гнев полнолуния"
 POD_story_lunar_auspice_ahroun_desc: "Cool Text"
 POD_story_lunar_auspice_ahroun_extra_text: "$TAB$#FONT:PODSubtitles;size:24 Гнев полнолуния#!\n\nИз всех [Glossary('фера', 'glossary_fera_tt')] #TOOLTIP:GAME_TRAIT,werewolf,[GetNullCharacter] #L гару#!#! являются самыми воинственными. Но даже среди них аруны стоят особняком. Примите свое наследие, покажите миру свою [Concept('prowess', 'доблесть')|E]!\n\nАруны заслуживают благосклонность [Glossary('Луны', 'glossary_luna_tt')], побеждая в @pod_combat_encounter_icon![Concept('pod_combat_encounters_with_icon', 'боевых столкновенияъ')|E] противников с таким же мастерством. Победы над слабыми не приносят славы. Чем сильнее цель, тем больше вы получите [Concept('trait_level_track_xp', 'опыта')|E].\n\nДругим персонажам можно бросить вызов через [Concept('character_interaction', 'взаимодействие персонажа')|E] #V «$POD_rhythm_of_war_interaction$»#!. Эти @pod_combat_encounter_icon![Concept('pod_combat_encounters_with_icon', 'боевые столкновения')|E] почти всегда смертельны, только другие #TOOLTIP:GAME_TRAIT,werewolf,[GetNullCharacter] #L гару#!#! могут соглашаться на несмертельные поединки, и в этом случае награда будет уменьшена.\n\n[GetModifier('POD_werewolf_form_crinos_modifier').GetNameWithTooltip][prowess_i|E]: [Story.GetOwner.MakeScope.ScriptValue('POD_ahroun_true_prowess')|V0]\nСамая слабая подходящая цель[prowess_i|E]: [Story.GetOwner.MakeScope.ScriptValue('POD_ahroun_target_prowess_min')|V0]"
 POD_story_lunar_auspice_ahroun_powerful_target_list: "Ближайшие достойные противники"
 POD_story_lunar_auspice_ahroun_target_list: "Ближайшие противники"
 ahroun_snarl_sgui: "Рык вызова"


 POD_story_lunar_auspice_galliard: "Сказание округлённой луны"
 POD_story_lunar_auspice_galliard_desc: "Cool Text"
 POD_story_lunar_auspice_galliard_extra_text: "$TAB$#FONT:PODSubtitles;size:24 Сказание округлённой луны#!\n\nПесни повествуют о минувших днях, счастливых временах и мучительных событиях, о героях и злодеях. Прислушайтесь к песням галлиардов: они поют о прошлом и о вашем будущем. Смотрите, как их песни оживляют слова и определяют вашу судьбу.\n\nГаллиарды заслуживают благосклонность [Glossary('Луны', 'glossary_luna_tt')], сплетая #clickable песни#! с помощью [Concept('character_interaction', 'взаимодействия персонажа')|E] #V «Первобытная песня»#!. Чем больше в песне #clickable куплетов#!, тем больше вы получаете [Concept('trait_level_track_xp', 'опыта')|E].\n\nПодготовка #clickable песни#! требует времени. Пока она не готова, действует штраф к восстановлению @gnosis_icon!гнозиса. Её эффекты проявятся лишь после завершения подготовки."

 POD_story_lunar_auspice_galliard_song_targets: "Слушатели"

 galliard_song_timer_modifier: "Набирающая силу песня"
 galliard_song_timer_modifier_desc: "Песня галлиарда набирает силу. Лишь время покажет, какую историю она поведает."
 galliard_song_upkeep_modifier: "Первобытная песня"

 galliard_song_galliard_notification: "Первобытная песня"




 POD_story_lunar_auspice_philodox: "Суд полумесяца"
 POD_story_lunar_auspice_philodox_desc: "Cool Text"
 POD_story_lunar_auspice_philodox_extra_text: "$TAB$#FONT:PODSubtitles;size:24 Суд полумесяца#!\n\nВолк опасен, но его легко обойти, обмануть или даже убить. Стая, однако, компенсирует эти недостатки численностью и слаженностью. Стаи #TOOLTIP:GAME_TRAIT,werewolf,[GetNullCharacter] #L гару#!#! ничем не отличаются, и их эффективность зависит от филодокса. Поведёте ли вы свою стаю к славе или в могилу?\n\nФилодоксы заслуживают благосклонность [Glossary('Луны', 'glossary_luna_tt')], завершая [Concept('journeys', 'странствия')|E] #clickable «Тренировка стаи»#!. Количество полученного [Concept('trait_level_track_xp', 'опыта')|E] зависит от их навыков [Concept('stewardship', 'управления')|E] и ранга оборотня. #clickable Тренировка стаи#! улучшается по мере продвижения в [Concept('lifestyle', 'жизненном пути')|E] [Concept('lunar_auspicegifts_lifestyle', 'даров лунного покровительства')|E]."

 POD_story_lunar_auspice_philodox_pack_members: "Члены стаи"



 POD_story_lunar_auspice_ragabash: "Свет новолуния"
 POD_story_lunar_auspice_ragabash_desc: "Cool Text"
 POD_story_lunar_auspice_ragabash_extra_text: "$TAB$#FONT:PODSubtitles;size:24 Свет новолуния#!\n\nКогда ночи темнеют и всевозможные чудовища выходят на охоту, находятся и те, кто выслеживает их самих. Хитрость и терпение позволят клыкам этих хищников добраться до горла добычи. Берегитесь #clickable лунного света#!: он помечает вас как их жертву.\n\nРагабашы заслуживают благосклонность [Glossary('Луны', 'glossary_luna_tt')], добывая [Concept('artifacts', 'артефакты')|E] #clickable «Знак Луны»#!, появляющиеся у других персонажей. Основной способ — [Concept('journey', 'странствие')|E] #V «Кража артефакта»#!, но другие методы, например [Concept('schemes', 'происки')|E], тоже подходят.\n\nУ #clickable знаков#! есть [Concept('artifact_power', 'сила артефакта')|E], которая определяет величину награды. При наличии соответствующего достоинства также могут появляться #clickable озарённые луной знаки#!. Они уникальны и дают гораздо более ценные награды. С повышением вашего ранга среди #TOOLTIP:GAME_TRAIT,werewolf,[GetNullCharacter] #L вервольфов#!#! появляются более сильные #clickable знаки#!.\n\n#clickable Проявилось озарённых луной знаков:#! [Story.MakeScope.Var('total_moonlit_marks_spawned').GetValue|V0]/[EmptyScope.ScriptValue('POD_ragabash_moonlit_marks_max')|V0]"

