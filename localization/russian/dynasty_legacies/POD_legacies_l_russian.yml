 ba_mummy_legacy_1_perk: "Воскрещение из мертвых теперь будет стоить #P -500#! благочестия. Базовая стоимость воскрешения равна 3000, умноженным на количество греховных свойств."

 psyche_mummy_legacy_track_name: "Душа"
 psyche_mummy_legacy_track_desc: "Духовная энергия, которая позволяет мумиям восстанавливать силы после смерти, душа имеет решающее значение для дальнейшего выживания мумии."
