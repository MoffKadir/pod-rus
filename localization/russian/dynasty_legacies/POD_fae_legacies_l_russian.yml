l_russian:
 POD_dynasty_perk_fae_tooltip_gui: "[GetScriptedGui(Concatenate('POD_dynasty_perk_tooltip_', SCOPE.GetFlagName('saved_tooltip'))).IsValidTooltip(GuiScope.SetRoot(GetPlayer.MakeScope).AddScope('perk_level', MakeScopeValue(SCOPE.GetValue('perk_level'))).End)]"
 POD_dynasty_perk_fae_tooltip: "Для разблокировки этого [Concept('dynasty_perk', 'наследия династии')|E] вы должны соответствовать дополнительным требованиям:"

 improve_ravaging: "Улучшает [Concept('ravaging', 'опустошение')|E], принося #P +1#! гламура независимо от [Concept('epiphanies_quality', 'качества')|E]."
 improve_reverie: "Улучшает [Concept('reverie', 'мечтание')|E], действуя так, как если бы все [Concept('relation', 'особые отношения')|E] имели #P дополнительное#! значение [Concept('epiphanies_quality', 'качества')|E]."

 aesin_legacy_track_name: "Наследие Асов"
 aesin_legacy_track_desc: "Дом природы."
 aesin_legacy_1_name: "Зов природы"
 aesin_legacy_1_perk: "#flavor Дом Асов объявил о своей власти над дикой природой. Сами Грёзы направят диких животных исполнять нашу волю.#!"
 aesin_legacy_2_name: "Слуги асов"
 aesin_legacy_2_perk: "#flavor «Сама природа — наши владения. Так провозгласили Грёзы!»#!"
 aesin_legacy_3_name: "Достойная добыча"
 aesin_legacy_3_perk: "Базовые затраты [Concept('gold', 'золота')|E] на проведение [Concept('activity', 'занятия')|E] «[GetActivityType('activity_hunt').GetName]»: #P -50%#!.\n#flavor Мы знаем, как устроена активная охота, особенно в дикой природе.#!"
 aesin_legacy_4_name: "Бой на любой местности"
 aesin_legacy_4_perk: "[Concept('decision', 'Решение')|E]: Позволяет приобрести свойство или накопить [Concept('trait_level_track_xp', 'опыт развития')|E] [Concept('commander_trait', 'свойства командира')|E], основанного на природе.\n#flavor Природа — наш дом, мы знаем о ней всё, и она знает всё о нас.#!"
 aesin_legacy_5_name: "Опытные скальды"
 aesin_legacy_5_perk: "[Concept('decision', 'Решение')|E]: Позволяет приобрести свойство или накопить [Concept('trait_level_track_xp', 'опыт развития')|E] [Concept('trait', 'свойства')|E] «[GetTrait('lifestyle_poet').GetName(GetNullCharacter)]».\n#flavor Красотой природы нужно делиться!#!"

 ailil_legacy_track_name: "Наследие Эйлиля"
 ailil_legacy_track_desc: "Дом амбиций."
 ailil_legacy_1_name: "Используйте любую возможность"
 ailil_legacy_1_perk: "Стоимость [Concept('casus_belli', 'казус белли')|E]: #P -30%#!\n#flavor Нужно воспользоваться любой возможностью, независимо от её цены.#!"
 ailil_legacy_2_name: "Связующие клятвы"
 ailil_legacy_2_perk: "#flavor Клятвы необходимо уважать, только тогда сильный может стать могущественным.#!"
 ailil_legacy_3_name: "Вдохновляющие лидеры"
 ailil_legacy_3_perk: "#flavor Наше правление должно вдохновлять остальных: кто-то должен подавать пример.#!"
 ailil_legacy_4_name: "Мастера светской беседы"
 ailil_legacy_4_perk: "#flavor Мы умеем разговаривать с людьми, поскольку наши амбиции требуют, чтобы другие следовали за нами.#!"
 ailil_legacy_5_name: "Безудержные амбиции"
 ailil_legacy_5_perk: "#flavor Наша цель – слава и победа!#!"

 balor_legacy_track_name: "Наследие Балора"
 balor_legacy_track_desc: "Дом страха."
 balor_legacy_1_name: "Кровь фоморов"
 balor_legacy_1_perk: "#flavor Мы не похожи на других, В наших жилах течёт кровь фоморов. И они будут бояться этого.#!"
 balor_legacy_2_name: "Устранение всякого инакомыслия"
 balor_legacy_2_perk: "[Concept('decision', 'Решение')|E]: Позволяет приобрести свойство или накопить [Concept('trait_level_track_xp', 'опыт развития')|E] [Concept('trait', 'свойств')|E] «[GetTrait('reckless').GetName(GetNullCharacter)]» или «[GetTrait('aggressive_attacker').GetName(GetNullCharacter)]».\n#flavor Никто не устоит перед нами. Они все умрут!#!"
 balor_legacy_3_name: "Совершенная безжалостность"
 balor_legacy_3_perk: "#flavor Слово «безжалостный» должно стать нашим именем, нашим титулом.#!"
 balor_legacy_4_name: "Король ужаса"
 balor_legacy_4_perk: "#flavor Нас все будут бояться, если не за кровь в наших жилах, то за наше прошлое.#!"
 balor_legacy_5_name: "Склонность к Неблагим"
 balor_legacy_5_perk: "$improve_ravaging$\n#flavor Неблагой путь — единственный достойный путь для фей.#!"

 beaumayn_legacy_track_name: "Наследие Бомейн"
 beaumayn_legacy_track_desc: "Дом пророков."
 beaumayn_legacy_1_name: "Оккультисты"
 beaumayn_legacy_1_perk:0 "Базовые затраты [Concept('gold', 'золота')|E] на проведение [Concept('activity', 'занятия')|E] «[GetActivityType('activity_pilgrimage').GetName]»: #P -50%#!.\n#flavor Мы знаем оккультное, как наше собственное прошлое, ничто не должно быть скрыто.#!"
 beaumayn_legacy_2_name: "Дар пророчества"
 beaumayn_legacy_2_perk: "#flavor Сами Грёзы даровали нам пророческий дар. Мы знаем, что грядёт.#!"
 beaumayn_legacy_3_name: "Предвидение"
 beaumayn_legacy_3_perk: "#flavor Ничто сокрытое не останется для нас незамеченным.#!"
 beaumayn_legacy_4_name: "Склонность к Благим"
 beaumayn_legacy_4_perk: "$improve_reverie$\n#flavor Благой путь — единственный достойный путь для фей.#!"
 beaumayn_legacy_5_name: "Мастера оккультизма"
 beaumayn_legacy_5_perk: "#flavor Сами Грёзы откроют нам оккультные тайны.#!"

 danaan_legacy_track_name: "Наследие Данаан"
 danaan_legacy_track_desc: "Дом Грёз."
 danaan_legacy_1_name: "Исследователи Умбры"
 danaan_legacy_1_perk: "#flavor Мы знаем Умбру как свои пять пальцев.#!"
 danaan_legacy_2_name: "Чувство Умбры"
 danaan_legacy_2_perk: "#flavor Понимание того, где человек находится в Умбре, — это то, что мы все знаем.#!"
 danaan_legacy_3_name: "Договоры с химерами"
 danaan_legacy_3_perk: "#flavor Химеры Грёз — наши союзники.#!"
 danaan_legacy_4_name: "Склонность к Благим"
 danaan_legacy_4_perk: "$improve_reverie$\n#flavor Благой путь — единственный достойный путь для фей.#!"
 danaan_legacy_5_name: "Мастера тродов"
 danaan_legacy_5_perk: "Улучшает цепочку [Concept('building', 'построек')|E] «[GetBuilding('trods_02').GetName]», удвоив [Concept('modifier', 'модификатор')|E] содержания [Concept('POD_chimera_maa', 'химер')|E].\n#flavor Мы знаем, как использовать троды таким образом, чтобы значительно повысить их эффективность.#!"

 daireann_legacy_track_name: "Наследие Дайреанн"
 daireann_legacy_track_desc: "Дом страсти."
 daireann_legacy_1_name: "Обученные алхимики"
 daireann_legacy_1_perk: "#flavor Страсть к алхимии нам не чужда.#!"
 daireann_legacy_2_name: "Утончённая вежливость"
 daireann_legacy_2_perk: "#flavor Все феи знают, что двор Дайреанн великолепен.#!"
 daireann_legacy_3_name: "Обильные праздники"
 daireann_legacy_3_perk: "После завершения [Concept('activity', 'занятия')|E] «[GetActivityType('activity_feast').GetName]» будет получен модификатор «[GetModifier('POD_daireann_legacy_3_modifier').GetNameWithTooltip]».\n#flavor Мы с большим удовольствием организуем пиршества.#!"
 daireann_legacy_4_name: "Не навреди"
 daireann_legacy_4_perk: "[Concept('decision', 'Решение')|E]: Позволяет приобрести свойство или накопить [Concept('trait_level_track_xp', 'опыт развития')|E] [Concept('trait', 'свойства')|E] «[GetTrait('lifestyle_physician').GetName(GetNullCharacter)]».\n#flavor Познать жизнь — значит принять участие в величайшей страсти, которая только существует.#!"
 daireann_legacy_5_name: "Кроме тех, кто может причинить вред"
 daireann_legacy_5_perk: "$unlock_brewing_node$ «[GetModifier('alchemy_antidepresants_2_modifier').GetNameWithTooltip]»\n$unlock_brewing_node$ «[GetModifier('alchemy_aphrodisiac_3_modifier').GetNameWithTooltip]»\n$unlock_brewing_node$ «[GetModifier('alchemy_poison_3_modifier').GetNameWithTooltip]»\n$unlock_brewing_node$ «[GetModifier('alchemy_antibiotics_2_modifier').GetNameWithTooltip]»\n$unlock_brewing_node$ Добавляет [Concept('modifier', 'модификатор')|E], увеличивающий случайный [Concept('skill', 'навык')|E] на 1 ([GetModifier('alchemy_stimulant_diplomacy_modifier').GetNameWithTooltip])\n#flavor Сами Грёзы раскрыли нам тайны алхимических искусств.#!"

 dougal_legacy_track_name: "Наследие Дугала"
 dougal_legacy_track_desc: "Дом ремесла."
 dougal_legacy_1_name: "Обученные ремесленники"
 dougal_legacy_1_perk: "#flavor Создание чего-то, что можно держать в руках и греться в его славе, — величайшее удовольствие в жизни.#!"
 dougal_legacy_2_name: "Бережливые ремесленники"
 dougal_legacy_2_perk: "Снижает затраты [Concept('gold', 'золота')|E] на ремесло на 25%.\n#flavor Мы знаем, как срезать углы, не влияя на конечный результат.#!"
 dougal_legacy_3_name: "Качественные инструменты"
 dougal_legacy_3_perk: "Базовая [Concept('durability', 'прочность')|E] [Concept('artifacts', 'артефактов')|E] ковки: #P +20#!.\n#flavor У хорошего мастера всегда под рукой хорошие инструменты.#!"
 dougal_legacy_4_name: "Склонность к Благим"
 dougal_legacy_4_perk: "$improve_reverie$\n#flavor Благой путь — единственный достойный путь для фей.#!"
 dougal_legacy_5_name: "Трудолюбие"
 dougal_legacy_5_perk: "#flavor Члены дома Дугал широко известны как прилежные работники, и мы прилагаем большие усилия, чтобы поддерживать эту репутацию.#!"

 eiluned_legacy_track_name: "Наследие Эйлунд"
 eiluned_legacy_track_desc: "Дом знаний."
 eiluned_legacy_1_name: "Стремление к знаниям"
 eiluned_legacy_1_perk: "#flavor Мы стремимся к знаниям, а не к объяснениям, как смертные мыслители.#!"
 eiluned_legacy_2_name: "Держать карты при себе"
 eiluned_legacy_2_perk: "#flavor То, что мы знаем, не должно распространяться свободно.#!"
 eiluned_legacy_3_name: "Щит знаний"
 eiluned_legacy_3_perk: "@banality_icon![Concept('banality', 'Банальность')|E] от разума: #P -20%#!\n#flavor Наши знания защитят нас от неверия.#!"
 eiluned_legacy_4_name: "Магические эксперты"
 eiluned_legacy_4_perk: "Сложность @changeling_icon![Concept('bunk', 'банка')|E]: #P -20%#!.\n#flavor Магические искусства — это то, о чем мы, Эйлунд, много знаем.#!"
 eiluned_legacy_5_name: "Волшебные знания"
 eiluned_legacy_5_perk: "Можно разблокировать один путь [Concept('sorcery_lifestyle', 'чародейства')|E] через [Concept('character_interaction', 'взаимодействие персонажа')|E].\n#flavor Тайны магии смертных непостижимы для нас, фей, но это не значит, что мы не можем воспроизвести некоторые из них.#!"
 POD_can_obtain_eiluned_dynasty_perk: "У вас должно быть [SCOPE.GetValue('required_arts')|V0] [Concept('traits', 'свойств')|E] искусств #weak ([THIS.Char.MakeScope.ScriptValue('POD_owned_arts_value')|0])#!"

 fiona_legacy_track_name: "Наследие Фиона"
 fiona_legacy_track_desc: "Дом любви."
 fiona_legacy_1_name: "Безграничная страсть"
 fiona_legacy_1_perk: "#flavor Быть Фионой — значит любить и быть любимым.#!"
 fiona_legacy_2_name: "Любовь народа"
 fiona_legacy_2_perk: "#flavor Даже самые банальные смертные будут к нам привязаны. Таково обещание Грёз.#!"
 fiona_legacy_3_name: "Постоянные пирушки"
 fiona_legacy_3_perk: "Снижение затрат на варианты [Concept('activity', 'занятия')|E] «[GetActivityType('activity_feast').GetName]»: #P 50%#!.\n#flavor Мы знаем, как веселиться на вечеринках, в конце концов, мы делаем это постоянно!#!"
 fiona_legacy_4_name: "Борьба за славу"
 fiona_legacy_4_perk: "[Concept('decision', 'Решение')|E]: Позволяет приобрести свойство или накопить [Concept('trait_level_track_xp', 'опыт развития')|E] [Concept('trait', 'свойства')|E] «[GetTrait('reckless').GetName(GetNullCharacter)]».\n#flavor Мы сражаемся за славу и умрём за неё.#!"
 fiona_legacy_5_name: "Любовь ко всем"
 fiona_legacy_5_perk: "#flavor Знать нас — значит любить нас.#!"
 POD_can_obtain_fiona_dynasty_perk_soulmate: "У вас должна быть хотя бы #V 1#! [Concept('soulmate', 'родственная душа')|E]"
 POD_can_obtain_fiona_dynasty_perk_lovers: "У вас должно быть хотя бы [SCOPE.GetValue('required_lovers')|V0] [Concept('lover', 'любовников')|E]"

 gwydion_legacy_track_name: "Наследие Гвидион"
 gwydion_legacy_track_desc: "Дом дворян."
 gwydion_legacy_1_name: "Земельный контроль"
 gwydion_legacy_1_perk: "#flavor Быть хорошим правителем сложно, но это наш долг.#!"
 gwydion_legacy_2_name: "Процветающие земли"
 gwydion_legacy_2_perk: "#flavor Земля под нашей властью будет процветать!#!"
 gwydion_legacy_3_name: "Восхищение вассалов"
 gwydion_legacy_3_perk: "#flavor Никто не может управлять империями в одиночку, знание того, как разделить власть, - это то, что должны знать все хорошие правители. #!"
 gwydion_legacy_4_name: "Рождённые править"
 gwydion_legacy_4_perk:0 "#flavor Нам, дому Гвидион, суждено править. Таков указ Грёз!#!"
 gwydion_legacy_5_name: "Плоды справедливого правления"
 gwydion_legacy_5_perk: "#flavor Всё хорошее в конце концов должно вернуться к нам.#!"
 POD_can_obtain_gwydion_dynasty_perk_vassal: "У вас должно быть хотя бы [SCOPE.GetValue('required_vassals')|V0] [Concept('vassal', 'вассалов')|E]"
 POD_can_obtain_gwydion_dynasty_perk: "У вас должно быть хотя бы [SCOPE.GetValue('required_ruler_friends')|V0] [Concept('friend', 'друзей')|E], которые являются [Concept('independent_ruler', 'независимыми правителями')|E] #weak ([SCOPE.GetValue('independent_ruler_friends')|0])#!"

 leanhaun_legacy_track_name: "Наследие Лианнан"
 leanhaun_legacy_track_desc: "Дом проклятых художников."
 leanhaun_legacy_1_name: "Покровители великих"
 leanhaun_legacy_1_perk: "Затраты [Concept('gold', 'золота')|E] или [Concept('prestige', 'престижа')|E] на найм великих личностей: #P -25%#!\n#flavor Великие художники и смертные должны быть вознаграждены за свою работу, даже если это только для того, чтобы дать нам больше гламура.#!"
 leanhaun_legacy_2_name: "Величайшие из друзей"
 leanhaun_legacy_2_perk: "Разблокированы [Concept('scheme', 'происки')|E] «[GetScheme('befriend').GetTypeName]».\nВсе ваши [Concept('friends', 'друзья')|E] получат [Concept('modifier', 'модификатор')|E] «[GetModifier('POD_leanhaun_legacy_2_modifier').GetNameWithTooltip]».\n#flavor Мы знаем, что значит быть другом.#!"
 leanhaun_legacy_3_name: "Знания смертных"
 leanhaun_legacy_3_perk: "Улучшает модификатор наследия «[GetDynastyPerk('leanhaun_legacy_2').GetName]» до «[GetModifier('POD_leanhaun_legacy_3_modifier').GetNameWithTooltip]».\n#flavor Разум смертных не является для нас загадкой.#!"
 leanhaun_legacy_4_name: "Культурные законодатели"
 leanhaun_legacy_4_perk: "#P +25%#! к скорости смены культуры.\n#flavor Направлять человечество в желаемом направлении сложно, но мы, Лианнан, с этим справились.#!"
 leanhaun_legacy_5_name: "Склонность к Неблагим"
 leanhaun_legacy_5_perk: "$improve_ravaging$\n#flavor Неблагой путь — единственный достойный путь для фей.#!"
 POD_can_obtain_leanhaun_dynasty_perk_friends: "У вас должно быть хотя бы [SCOPE.GetValue('required_friends')|V0] [Concept('friend', 'друзей')|E]"
 POD_can_obtain_fiona_dynasty_perk_great_person_relation: "У вас должны быть положительные [Concept('relation', 'отношения')|E] хотя бы с [SCOPE.GetValue('required_great_person_relation')|V0] #TOOLTIP:GAME_TRAIT,historical_character,[GetNullCharacter] #L [Select_CString( EqualTo_CFixedPoint( SCOPE.GetValue('required_great_person_relation'), '(CFixedPoint)1' ), 'великой личностью', 'великими личностями' )]#!#! #weak ([SCOPE.GetValue('great_relations')|0])#!"

 liam_legacy_track_name: "Наследие Лиам"
 liam_legacy_track_desc: "Дом смертных."
 liam_legacy_1_name: "Союзники против банальности"
 liam_legacy_1_perk: "Скорость [Concept('journey', 'странствия')|E] #V $glamour_quests_name$#!: #P +50%#!\n#flavor Нас всех атакует неверие, но мы не беззащитны!#!"
 liam_legacy_2_name: "Связи с низами"
 liam_legacy_2_perk: "#flavor Связи бесценны, кем бы ни были наши знакомые и откуда бы они ни происходили. #!"
 liam_legacy_3_name: "Величайшие враги банальности"
 liam_legacy_3_perk: "Поиски гламура снижают вдвое больше [Concept('banality', 'банальности')|E].\n#flavor Быть Лиамом — значит быть маяком в борьбе с самой банальностью.#!"
 liam_legacy_4_name: "Поклонение смертных"
 liam_legacy_4_perk: "#flavor Все смертные будут любить нас!#!"
 liam_legacy_5_name: "Склонность к Благим"
 liam_legacy_5_perk: "$improve_reverie$\n#flavor Благой путь — единственный достойный путь для фей.#!"
 POD_can_obtain_liam_dynasty_perk_total_epiphanies_quality: "Совокупное [Concept('epiphanies_quality', 'качество')|E] ваших [Concept('relations', 'отношений')|E] должно быть не ниже, чем [SCOPE.GetValue('required_total_epiphanies_quality')|V0] #weak ([GetPlayer.MakeScope.ScriptValue('total_epiphanies_quality')|0])#!"

 scathach_legacy_track_name: "Наследие Скатах"
 scathach_legacy_track_desc: "Дом битвы."
 scathach_legacy_1_name: "Непреклонные"
 scathach_legacy_1_perk: "#flavor Мы не уступим! Мы не сдадимся!#!"
 scathach_legacy_2_name: "Мастера скрытности"
 scathach_legacy_2_perk: "#flavor Тени во дворе, нас не видно.#!"
 scathach_legacy_3_name: "Известные командиры"
 scathach_legacy_3_perk: "[Concept('decision', 'Решение')|E]: Позволяет приобрести свойство или накопить [Concept('trait_level_track_xp', 'опыт развития')|E] одного [Concept('commander_trait', 'свойства командира')|E].\n#flavor Мы знаем все виды войны.#!"
 scathach_legacy_4_name: "Безжалостные нападающие"
 scathach_legacy_4_perk: "#flavor Вперёд! К славе и победе!#!"
 scathach_legacy_5_name: "Универсальные дуэлянты"
 scathach_legacy_5_perk: "#flavor Искусство дуэлей – это то, что мы очень глубоко понимаем.#!"
 POD_can_obtain_scathach_dynasty_perk_knight_prowess: "Общее значение [Concept('prowess', 'доблести')|E] ваших [Concept('knights', 'рыцарей')|E] должно превышать [SCOPE.GetValue('required_knight_prowess')|V0] #weak ([SCOPE.GetValue('total_knight_prowess')|0])#!"

 varich_legacy_track_name: "Наследие Варич"
 varich_legacy_track_desc: "Дом узоров."
 varich_legacy_1_name: "Предвидение в азартных играх"
 varich_legacy_1_perk: "#flavor Сами Грёзы даровали нам силу предсказывать исход событий.#!"
 varich_legacy_2_name: "Предвидение"
 varich_legacy_2_perk: "#flavor Мы знаем то, чего большинству знать не следует.#!"
 varich_legacy_3_name: "Прогноз будущего"
 varich_legacy_3_perk: "#flavor Мы видим, что нас ждёт впереди.#!"
 varich_legacy_4_name: "Ясное будущее"
 varich_legacy_4_perk: "#flavor Наше видение будущего поистине великолепно.#!"
 varich_legacy_5_name: "Склонность к Неблагим"
 varich_legacy_5_perk: "$improve_ravaging$\n#flavor Неблагой путь — единственный достойный путь для фей.#!"
 POD_can_obtain_varich_dynasty_perk_no_sluagh: "В вашей [Concept('realm', 'державе')|E] не должно быть [Concept('vassals', 'вассалов')|E] со свойством «[GetTrait('sluagh').GetName(GetPlayer)]»"

 inanimae_legacy_track_name: "Наследие Неодушевлённых"
 inanimae_legacy_track_desc: "Рождённые из стихий."
 inanimae_legacy_1_name: "Рождённые из огня"
 inanimae_legacy_1_perk: "Каждый [Concept('nemesis', 'заклятый враг')|E], [Concept('best_friend', 'лучший друг')|E] и [Concept('soulmate', 'родственная душа')|E] улучшает или накладывает [Concept('modifier', 'модификатор')|E], дающий #P +0.75#! [Concept('prestige', 'престижа')|E] и #P +0.2#! [Concept('dynasty_prestige', 'признания')|E].\n#flavor Мы все произошли из огня человеческой мысли...#!"
 inanimae_legacy_2_name: "Созданные ветром"
 inanimae_legacy_2_perk: "#flavor ...Обретшие облик под ветрами непредсказуемых Грёз...#!"
 inanimae_legacy_3_name: "Вскормленные водой"
 inanimae_legacy_3_perk: "[Concept('decision', 'Решение')|E]: Позволяет приобрести свойство или накопить [Concept('trait_level_track_xp', 'опыт развития')|E] [Concept('trait', 'свойства')|E] «[GetTrait('lifestyle_herbalist').GetName(GetNullCharacter)]» или «[GetTrait('lifestyle_physician').GetName(GetNullCharacter)]».\n#flavor ...Вскормленные текучими водами самой обыденной реальности...#!"
 inanimae_legacy_4_name: "Закалённые камнем"
 inanimae_legacy_4_perk: "#flavor ...Закалены ими...#!"
 inanimae_legacy_5_name: "Чтобы мы могли расти"
 inanimae_legacy_5_perk: "$cantrip_hard_bunk$ Можно воскресить #TOOLTIP:GAME_TRAIT,wraith,[GetNullCharacter] #L призрака#!#! как #TOOLTIP:GAME_TRAIT,mortal,[GetNullCharacter] #L смертного#!#!\n$cantrip_hard_bunk$ Можно наложить модификатор «[GetModifier('cantrip_renewal_modifier').GetNameWithTooltip]» на все [Concept('de_jure', 'де-юре')|E] [Concept('counties', 'графства')|E] [Concept('title', 'титула')|E]\n$cantrip_hard_bunk$ Можно полностью восстановить [Concept('durability', 'прочность')|E] [Concept('artifact', 'артефакта')|E]\n#flavor ...Но даже тогда мы всё равно будем расти в будущее.#!"

 POD_can_obtain_inanimae_dynasty_perk_friends: "У вас должно быть хотя бы [SCOPE.GetValue('required_friends')|V0] [Concept('friend', 'друзей')|E] #weak ([THIS.Char.MakeScope.ScriptValue('POD_num_of_friends')|0])#!"
 POD_can_obtain_inanimae_dynasty_perk_lovers: "У вас должно быть хотя [SCOPE.GetValue('required_lovers')|V0] [Concept('lover', 'любовников')|E] #weak ([THIS.Char.MakeScope.ScriptValue('POD_num_of_lovers')|0])#!"
 POD_can_obtain_inanimae_dynasty_perk_income: "Ваш ежемесячный доход должен превышать [SCOPE.GetValue('required_income')|V0] #weak ([GetPlayer.MakeScope.ScriptValue('POD_monthly_character_income')|2])#!"
 POD_can_obtain_inanimae_dynasty_perk_poi_visited: "Вы должны посетить хотя бы [SCOPE.GetValue('required_visited_poi')|V0] [Concept('point_of_interest', 'точек интереса')|E] #weak ([GetPlayer.MakeScope.ScriptValue('poi_visited')])#!"
 POD_can_obtain_inanimae_dynasty_perk_secrets_known: "Вы должно узнать хотя бы [SCOPE.GetValue('required_secrets_known')|V0] [Concept('secret', 'секретов')|E] #weak ([SCOPE.GetValue('secrets_known')|0])#!"
 POD_can_obtain_inanimae_dynasty_perk_mortal_relations: "У вас должно быть хотя бы [SCOPE.GetValue('required_mortal_relations')|V0] [Concept('relation', 'отношений')|E] со #TOOLTIP:GAME_TRAIT,mortal,[GetNullCharacter] #L смертными#!#! #weak ([SCOPE.GetValue('mortal_relations')|0])#!"

 common_fae_legacy_track_name: "Волшебный народ"
 common_fae_legacy_track_desc: "Из Грёз в Осенний мир"
 common_fae_legacy_1_name: "Грёзы в Осеннем мире"
 common_fae_legacy_1_perk: "#flavor Даже в Осеннем мире мы всё ещё мечтаем о лучшем мире.#!"
 common_fae_legacy_2_name: "Волшебники Грёз"
 common_fae_legacy_2_perk: "#flavor Несмотря на то, что Осенний мир забрал у нас, мы продолжаем привносить в это место волшебство.#!"
 common_fae_legacy_3_name: "Преодоление осенних ограничений"
 common_fae_legacy_3_perk: "[GetPlayer.Custom('PODFaeLegacyInanimaeBanality')].\n#flavor Осенний мир суров для нас, но мы всё равно существуем.#!"
 PODFaeLegacyInanimaeBanality_inanimae: "Неудачное наложение [Concept('cantrip', 'чар')|E] возвращает 1 гламур"
 PODFaeLegacyInanimaeBanality_banality: "Неудачное наложение [Concept('cantrip', 'чар')|E] больше не приносит [Concept('banality', 'банальность')|E]"
 common_fae_legacy_4_name: "Верность нашей природе"
 common_fae_legacy_4_perk: "Улучшает [Concept('revelry', 'веселье')|E], удвоив полученный гламур.\n#flavor В конце концов, мы — феи.#!"
 common_fae_legacy_5_name: "Признанные Грёзами"
 common_fae_legacy_5_perk: "[GetPlayer.Custom('PODFaeLegacyNobleHouse')]\nИсследователи [grace_i][Concept('umbra', 'Умбры')|E] больше не требуют содержания.\n@grace_icon![umbra_sense|E]: #P +20%#!\n#flavor Купаясь в славе Грёз, мы будем благородными!#!"
 PODFaeLegacyNobleHouse_noble: "Дополнительные требования для [Concept('dynasty_perks', 'наследий династий')|E] фей: #P -30%#!."
 PODFaeLegacyNobleHouse_commoner: "Разблокирует [Concept('decision', 'цель')|E], позволяющую создать свой благородный дом."

 fae_loved_legacy_track_name: "[GetPlayer.GetDynasty.GetNameNoTooltip]"
 fae_loved_legacy_track_desc: "Дом, любимый Грёзами."
 fae_loved_legacy_1_name: "Любимы везде, где бы мы ни были..."
 fae_loved_legacy_1_perk: "#flavor Любимые Грёзами, любимые всеми остальными.#!"
 fae_loved_legacy_2_name: "...Особенно нашими вассалами"
 fae_loved_legacy_2_perk: "#flavor Наши вассалы тоже родом из Грёз, и они тоже нас любят.#!"
 fae_loved_legacy_3_name: "Мастера многозадачности"
 fae_loved_legacy_3_perk: "#flavor Разве хороший друг не умеет поддерживать сразу множество отношений?#!"
 fae_loved_legacy_4_name: "Лучшие друзья"
 fae_loved_legacy_4_perk: "#flavor Способность поддерживать множество отношений – наша гордость.#!"
 fae_loved_legacy_5_name: "Излюбленные среди любимых"
 fae_loved_legacy_5_perk: "#flavor Во всём остальном нас любят там, откуда мы родом.#!"

 fae_warriors_legacy_track_name: "[GetPlayer.GetDynasty.GetNameNoTooltip]"
 fae_warriors_legacy_track_desc: "Полководцы Грёз"
 fae_warriors_legacy_1_name: "Слава Грёз"
 fae_warriors_legacy_1_perk: "Победа в [Concept('wars', 'войнах')|E] приносит [Concept('prestige', 'престиж')|E], количество зависит от наивысшего ранга [Concept('title', 'титула')|E].\n#flavor За славу, за Грёзы!#!"
 fae_warriors_legacy_2_name: "Но мы не одиноки"
 fae_warriors_legacy_2_perk: "#flavor Мы не ослеплены нашей миссией, У нас есть союзники внутри нашего вида.#!"
 fae_warriors_legacy_3_name: "Ибо наши притязания справедливы"
 fae_warriors_legacy_3_perk: "Стоимость [Concept('casus_belli', 'казус белли')|E]: #P -30%#!\n#flavor Ибо мы — Грёзы, и наше дело правое.#!"
 fae_warriors_legacy_4_name: "Расширение нашего домена"
 fae_warriors_legacy_4_perk: "Доступен [Concept('casus_belli', 'казус белли')|E] #V $invasion_war$#!.\nСокращает промежуток между войнами по казус белли #V $invasion_war$#! со #N 100#! до #P 50#! лет.\n#flavor Наша миссия — расширять земли, доступные влиянию Грёз.#!"
 fae_warriors_legacy_5_name: "Величайшие воины Грёз"
 fae_warriors_legacy_5_perk: "#flavor Ибо мы — полководцы Грёз, стремящиеся к победе!#!"

 fae_respected_legacy_track_name: "[GetPlayer.GetDynasty.GetNameNoTooltip]"
 fae_respected_legacy_track_desc: "Следуя по пути короля Артура."
 fae_respected_legacy_1_name: "Истинные короли"
 fae_respected_legacy_1_perk: "#flavor Мы короли, и наша слава будет распространяться.#!"
 fae_respected_legacy_2_name: "Верные вассалы"
 fae_respected_legacy_2_perk: "#flavor Наши вассалы знают своё место и помогают нам, как следует.#!"
 fae_respected_legacy_3_name: "Мастера управления доменом"
 fae_respected_legacy_3_perk: "Улучшает [Concept('aptitude', 'пригодность')|E] придворных должностей «[GetCourtPositionType('imperial_envoy_court_position').GetName()]», «[GetCourtPositionType('imperial_chancellor_court_position').GetName()]» и «[GetCourtPositionType('imperial_minister_court_position').GetName()]» на #P 20#!.\n#flavor Мы знаем, как править и как управлять большим доменом.#!"
 fae_respected_legacy_4_name: "Величайший из дворов"
 fae_respected_legacy_4_perk: "[GetPlayer.Custom('PODFaeLegacyRoyalCourt')].\n#flavor Двор короля – это то, что показывает миру свою мощь, мы не можем отставать.#!"
 PODFaeLegacyRoyalCourt_court_amenities: "Стоимость [Concept('court_amenities', 'увеселений')|E]: #P -50%#!"
 PODFaeLegacyNobleHouse_invite_buff: "Принятие приглашения ко [Concept('court', 'двору')|E]: #P +20#!"
 FAE_RESPECTED_LEGACY_4: "[GetDynastyPerk('fae_respected_legacy_4').GetName]: $VALUE|=+0$"
 fae_respected_legacy_5_name: "Императоры среди королей"
 fae_respected_legacy_5_perk: "#flavor Ибо мы — короли. Не самих Грёз, а всего, что им принадлежит!#!"

 fae_feared_legacy_track_name: "[GetPlayer.GetDynasty.GetNameNoTooltip]"
 fae_feared_legacy_track_desc: "Дом, которого боятся Заблудшие."
 fae_feared_legacy_1_name: "Искусные выдумщики"
 fae_feared_legacy_1_perk: "Скорость [Concept('councillor_task', 'задания' )|E] «[fabricate_claim|E]»: на #P +50%#! быстрее\n#flavor Фабрикация притязаний — тоже творческий труд, и нам очень нравится им заниматься.#!"
 fae_feared_legacy_2_name: "Кричащая слава"
 fae_feared_legacy_2_perk: "Пытки [Concept('characters', 'персонажей')|E] приносят [Concept('prestige', 'престиж')|E], количество зависит от ранга жертвы.\n#flavor Ибо мы знаем, что крики могут нести информацию о том, что мы можем сделать с врагами Грёз.#!"
 fae_feared_legacy_3_name: "Слава от страха"
 fae_feared_legacy_3_perk: "#flavor Страх может сделать даже мелкого графа серьёзной угрозой.#!"
 fae_feared_legacy_4_name: "Мастера интриг"
 fae_feared_legacy_4_perk: "#flavor Мы кое-что знаем о интригах, поскольку это наш долг.#!"
 fae_feared_legacy_5_name: "Самые грозные среди Заблудших"
 fae_feared_legacy_5_perk: "#flavor Ибо мы — кошмар Заблудших.#!"

 fae_wise_legacy_track_name: "[GetPlayer.GetDynasty.GetNameNoTooltip]"
 fae_wise_legacy_track_desc: "Дом мудрости."
 fae_wise_legacy_1_name: "Учёные имён"
 fae_wise_legacy_1_perk: "Изучение нового языка приносит #P 200#! [Concept('piety', 'благочестия')|E] и #P 200#! [Concept('prestige', 'престижа')|E].\n#flavor Языки имеют вес, вес, который мы должны знать.#!"
 fae_wise_legacy_2_name: "Эксперты-волшебники"
 fae_wise_legacy_2_perk: "#flavor Мудрые феи знают, что силу нельзя игнорировать.#!"
 fae_wise_legacy_3_name: "Изучение путей мечтателей"
 fae_wise_legacy_3_perk: "Через [Concept('character_interaction', 'взаимодействие персонажа')|E] можно выбрать ванильный [Concept('lifestyle', 'жизненный путь')|E], который ежегодно будет получать 100 опыта.\n#flavor Мечтатели знают кое-что, то, что мы тоже можем знать.#!"
 fae_wise_legacy_4_name: "Мастера обучения"
 fae_wise_legacy_4_perk: "#flavor Мы, Заблудшие, медленно адаптируемся и учимся. Но это можно изменить.#!"
 fae_wise_legacy_5_name: "Мудрейшие из мудрых"
 fae_wise_legacy_5_perk: "#flavor Ибо мы храним знания Грёз.#!"

 fae_mighty_legacy_track_name: "[GetPlayer.GetDynasty.GetNameNoTooltip]"
 fae_mighty_legacy_track_desc: "Стражи Грёз."
 fae_mighty_legacy_1_name: "Рыцарская слава"
 fae_mighty_legacy_1_perk: "#flavor Мы — рыцари Грез, и наши рыцари не менее важны, чем мы сами.#!"
 fae_mighty_legacy_2_name: "Боевой клич"
 fae_mighty_legacy_2_perk: "В начале [Concept('war', 'войны')|E] все дружественные [Concept('knights', 'рыцари')|E] получат [Concept('modifier', 'модификатор')|E] «[GetModifier('POD_dynasty_battle_cry_modifier').GetNameWithTooltip]» на 5 лет.\n#flavor «За Грёзы!» — кричим мы, стремясь к славе!#!"
 fae_mighty_legacy_3_name: "Мастера меча"
 fae_mighty_legacy_3_perk: "[Concept('decision', 'Решение')|E]: Позволяет приобрести свойство или накопить [Concept('trait_level_track_xp', 'опыт развития')|E] [Concept('trait', 'свойства')|E] «[GetTrait('lifestyle_blademaster').GetName(GetPlayer)]».\n#flavor Мы знаем, как обращаться с клинком, потому что он нужен нам, чтобы охранять Грёзы.#!"
 fae_mighty_legacy_4_name: "Могучие товарищи"
 fae_mighty_legacy_4_perk: "На время пребывания в вашей [Concept('coterie', 'котерии')|E] все её члены получат [Concept('modifier', 'модификатор')|E] «[GetModifier('POD_dynasty_mighty_companions_modifier').GetNameWithTooltip]».\n#flavor Одна фея не может защитить все Грёзы, но кто сказал, что мы одни?#!"
 fae_mighty_legacy_5_name: "Могущественнейшие из фей"
 fae_mighty_legacy_5_perk: "#flavor Ибо мы — стражи Грёз.#!"