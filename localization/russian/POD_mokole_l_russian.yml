 ####Dream the Beast####
 artifact_archator_name: "Архатор"
 artifact_archator_description: "Крупный гибрид динозавра и формы Архид моколе. Этот огромный зверь свирепо ведёт своего спутника-ящера в бой, где легко может сожрать всех, кто встанет у него на пути."
 artifact_dipelta_name: "Дипельта"
 artifact_dipelta_description: "Возьмите самый крепкий и большой щит, какой только сможете найти, добавьте к нему лапы, и у вас получится дипельта. Этот динозавр будет отражать большинство атак, бросаясь вперёд."
 artifact_avithon_name: "Авитон"
 artifact_avithon_description: "Этот летающий пернатый динозавр перенесёт своего всадника по небу, где они смогут легко избежать большинства опасностей."
 artifact_dicravenator_name: "Дикравенатор"
 artifact_dicravenator_description: "Даже самые быстрые лошади не могут сравниться со скоростью дикравенатора. Он не остановится, пока не доберётся до своей жертвы."
 artifact_rhincanthus_name: "Ринкантус"
 artifact_rhincanthus_description: "Как бы ни был ранен ринкантус, он никогда не остановится. Это целеустремлённая машина разрушения, которая сметает всё на своем пути."
 artifact_baroceratops_name: "Бароцератопс"
 artifact_baroceratops_description: "Если враг прячется за своими стенами и запирает ворота, просто пробейте свой собственный вход с помощью бароцератопса."
 artifact_dracomus_name: "Дракомуза"
 artifact_dracomus_description: "Наносит 1 ед. огненного @health_track_aggravated_damage_icon! [Concept('POD_aggravated_damage', 'серьёзного урона')|E] вражеским [Concept('knights', 'рыцарям')|E] и [Concept('commanders', 'командирам')|E] при участии в [Concept('combat_phase', 'бою')|E] в качестве [Concept('commander', 'командира')|E], или вашим противникам в [Concept('single_combat_duel_plural', 'поединках')|E].\n\nБольшой драконообразный динозавр, покрывающий себя легковоспламеняющейся слизью, которую он поджигает, ударяя когтями друг о друга. Пылающее чудовище, которое никогда не должно было покинуть сны моколе."
 artifact_archeorex_name: "Археорекс"
 artifact_archeorex_description: "Высший хищник, воплощённый в реальность. Огромный зверь, полный голода и разрушений. Если моколе приснится что-то ещё более ужасное, это приведёт к Апокалипсису."

