 ####Court Positions####
 hibernation_attendant_court_position: "Служитель гибернации"
 hibernation_attendant_court_position_desc: "Пребывая в Мнезисе, моколе уязвим как во сне, так и наяву. Служитель гибернации защищает своего хозяина и следит за тем, чтобы ничто не нарушало его сна."
 wallow_warden_court_position: "Страж пруда"
 wallow_warden_court_position_desc: "Пруд - это сердце кладки моколе. Это святилище, школа и, самое главное, дом. Наблюдать за его строительством и охраной - большая честь, но и ещё большая ответственность."
 sun_herald_court_position: "Вестник солнца"
 sun_herald_court_position_desc: "Все моколе способны общаться с Отцом-Солнцем, но именно вестники посвящают своё время попыткам по-настоящему постичь мудрость Солнца."
 crested_purifier_court_position: "Рогатый очиститель"
 crested_purifier_court_position_desc: "Будь то нежить, демоны или даже другие Меняющиеся породы, рогатый очиститель ведёт других моколе против их врагов."
 solar_salvager_court_position: "Солнечный сборщик"
 solar_salvager_court_position_desc: "Моколе - мастера своего дела, их потребность в материалах для ковки безгранична. Сборщик отвечает за выявление и сбор выброшенного оборудования, которое может быть перековано в солнечных кузницах моколе."