 # Intro for characters who have not opened Configure Moves or acknowledged it.
 pod_combat.0200.t: "Познай себя, познай врага"
 pod_combat.0200.desc: "Скоро начнётся пошаговое @pod_combat_encounter_icon![Concept('pod_combat_encounter', 'боевое столкновение')|E]. Каждый раунд вы тратите [Concept('pod_combat_action_points', 'очки действий')|E] на выбранные [Concept('pod_combat_moves', 'боевые приёмы')|E]; схватка заканчивается, когда каждый враг #italic (или вы)#! [Concept('pod_combat_knocked_out', 'выбывает из боя')|E]. Подробнее о механике можно узнать через кнопку #bold Справка#! в окне боя.\n\nВы ещё не меняли набор [Concept('pod_combat_move', 'боевых приёмов')|E] для этого персонажа, поэтому рекомендуем сделать это сейчас. Позже вы сможете воспользоваться [Concept('decision', 'решением')|E] «[GetDecision('pod_combat_configure_moves').GetName]» в любой момент вне боя."
 pod_combat.0200.a: "Сначала проверить свои приёмы."
 pod_combat_intro_review_tt: "Открывает окно [Concept('pod_combat_moves', 'боевых приёмов')|E]. Схватка ждёт, пока вы не решите начать."
 pod_combat.0200.b: "Начать бой со стандартными приёмами."

 pod_combat.0201.t: "ВАС ЖДЁТ #bold БОЙ#!"
 pod_combat.0201.desc: "#italic Выберите нужные приёмы, а затем начните бой, когда будете готовы.#!"
 pod_combat.0201.a: "#bold Начать#! бой"

