 pod_combat_debug_nosummon_interaction: "Бой без призыва"
 pod_combat_debug_nosummon_desc: "Отладка: поединок один на один с запретом призыва — все приёмы призыва недоступны обеим сторонам."
 pod_combat_debug_victory_toast: "Отладочный бой: Победа!"
 pod_combat_debug_defeat_toast: "Отладочный бой: поражение."
 pod_combat_debug_invalid_toast: "Отладочный бой: дуэль недействительна (тот же атакующий/защитник?)."
 pod_combat_debug_draw_toast: "Отладочный бой: нет решающего победителя (ничья/взаимный нокаут)."
 pod_combat_debug_big_interaction: "Большая схватка"
 pod_combat_debug_big_desc: "Отладка: создать большую схватку — вы и ваши вассалы против этого персонажа и его вассалов, до выбранного числа участников с каждой стороны — для проверки команд произвольного размера под нагрузкой. Бойцы за первыми рядами доступны через прокрутку панелей союзников и врагов."
 pod_combat_debug_big_size_8: "Размер команды: 8 персонажей с каждой стороны."
 pod_combat_debug_big_size_12: "Размер команды: 12 персонажей с каждой стороны."
 pod_combat_debug_big_size_20: "Размер команды: 20 персонажей с каждой стороны."
 pod_combat_debug_reinforce_interaction: "Бой с подкреплениями"
 pod_combat_debug_reinforce_desc: "Отладка: 1 на 1 против этого персонажа, затем союзник (ваш вассал) присоединяется во 2-м раунде и враг (его вассал) в 3-м раунде — проверяет отложенное подкрепление."

