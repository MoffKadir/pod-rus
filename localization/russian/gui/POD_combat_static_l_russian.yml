 pod_combat.0001.c: "» Нападение, защита и эффекты"
 pod_combat.0001.d: "» Исходы и управление"
 pod_combat_help_back: "« Назад к темам"
 pod_combat_help_close: "Закрыть"
 pod_combat.0100.t: "Ходы и выбор цели"
 pod_combat.0100.desc: "#bold ВАШ ХОД#!\nВ начале каждого раунда у вас есть #bold [GuiScope.ScriptValue('pod_combat_base_ap')|0]#! [Concept('pod_combat_action_points', 'очков действий')|E] (больше или меньше, если очки действий были усилены, отняты или возвращены). Тратьте ОД на приёмы на панели; те, на которые не хватает очков, отображаются серым. Закончив, нажмите #bold Завершить ход#! — неиспользованные ОД сгорают.\n\nМногие приёмы также расходуют #bold сверхъестественную энергию#!: кровь у вампиров, гнозис у перевёртышей, пафос или ангст у призраков, гламур у подменышей и так далее. Она берётся из обычного запаса вашего вида, поэтому частое использование дорогих дисциплин истощает вас во время боя и оставляет без сил после него. Некоторые приёмы также расходуют золото, благочестие, престиж или [Concept('static_stress', 'психическое напряжение')|E].\n\nЧтобы выбрать приёмы для панели, перед боем откройте [Concept('decision', 'решение')|E] «[GetDecision('pod_combat_configure_moves').GetName|V]». Можно взять не более четырёх приёмов каждой категории (#color_red АТК#! / #color_light_blue ЗАЩ#! / #color_porple КОН#! / #color_pwr_orange СИЛ#!). Включите #bold Показать все приёмы#!, чтобы увидеть ещё не открытые: у каждого указано, каких свойств, сил или достоинств вам не хватает.\n\n#bold ВЫБОР ЦЕЛИ#!\nНажмите на #bold карточку#! союзника или врага (либо его портрет в полосе очерёдности), чтобы сделать его текущей целью. На карточке появится отметка @check_icon! #bold Цель#!, а вверху окна — сама цель и ваш [Concept('pod_combat_hit_chance', 'шанс попадания')|E] по ней. Атакующие приёмы направлены на выбранного врага, поддержка (исцеление, усиления) — на выбранного союзника; приёмы для себя не учитывают выбранную цель. Некоторые приёмы #bold действуют по области#! и затрагивают сразу всех врагов или всех союзников независимо от выбора. При смене цели вероятность попадания пересчитывается по вашей [Concept('prowess', 'доблести')|E] относительно её доблести, действующим модификаторам попадания и вашему бонусу @pod_combat_stealth_icon![Concept('pod_combat_stealth', 'скрытности')|E]. @pod_combat_guard_icon![Concept('pod_combat_guard', 'Защита')|E], @pod_combat_dodge_icon![Concept('pod_combat_dodge', 'уклонение')|E], @pod_combat_stealth_icon![Concept('pod_combat_stealth', 'скрытность')|E] и [Concept('soak_damage', 'поглощение')|E] цели проверяются отдельно и этот процент не меняют.\n\n#bold КОГО АТАКУЕТ ИИ#!\nНа карточке каждого бойца под управлением ИИ есть строка #bold Атакует#! с именем последней атакованной цели. Она есть и у врагов, и у ваших союзников под управлением ИИ (ваша цель указана вверху). Это противник, на котором боец #italic сосредоточился#!: он обычно продолжает бить ту же жертву, но это не гарантия — ИИ может переключиться, чтобы добить почти поверженного врага. Строка пуста до первого хода бойца и пока он #bold подчинён#! (его приоритет на этот ход сбрасывается). Следите за ней, чтобы понять, кому грозит нападение нескольких врагов, и вывести уязвимого союзника из-под удара.\n\n#bold ОЧЕРЁДНОСТЬ ХОДОВ#!\nЕсли бойцов трое или больше, вверху проходит #bold полоса очерёдности ходов#! с портретами: слева направо в порядке действий. Каждый боец один раз определяет [Concept('pod_combat_initiative', 'инициативу')|E] при вступлении в бой и сохраняет её, поэтому очерёдность остаётся неизменной всю схватку и позволяет планировать на несколько ходов вперёд. Изменить её может лишь ослабление инициативы, и только на один раунд. Действующий боец выделен золотом; портреты тускнеют после хода или поражения, а при большом числе участников полоса прокручивается вбок. Новые бойцы могут присоединиться к начавшейся схватке — например, призванный некромантом призрак или прибывшее подкрепление. Они входят в очерёдность со следующего раунда."
 pod_combat.0101.t: "Как читать ход боя"
 pod_combat.0101.desc: "#bold КАРТОЧКИ БОЙЦОВ#!\nКарточка каждого бойца показывает:\n• [POD_health_track|E] — ячейки ранений, заполняющиеся при получении ударов.\n• [Concept('pod_combat_morale', 'Боевой дух')|E] — самообладание, отдельное от здоровья. Прямые ментальные атаки снижают его; каждая ячейка ранения, нанесённая ударом после поглощения, также отнимает #bold [GuiScope.ScriptValue('pod_combat_morale_from_hp_base_ratio')|0]#! боевого духа.\n• [Concept('prowess', 'Доблесть')|E] / [Concept('pod_combat_hit', 'Попадание')|E] / [Concept('soak_damage', 'Поглощение')|E] — показатели нападения и защиты.\nНаведите курсор на карточку для подробностей, включая [Concept('pod_combat_init', 'инициативу')|E] бойца и его порядок [Concept('pod_combat_turn', 'хода')|E] в очерёдности.\nЗначки внизу карточки показывают действующие стойки и состояния (защита, уклонение, скрытность, ответный удар, горение, ошеломление, подчинение). Наведите на любой из них, чтобы узнать подробности.\n\n#bold ЖУРНАЛ БОЯ#!\nПрокручиваемая панель под приёмами записывает все значимые события по порядку; новейшие находятся сверху. Каждая строка показывает действующего бойца, приём, цель и все его последствия: урон, исцеление, истощение, состояния, отдачу и ответные удары, а также остановившие их промахи, блоки и поглощение. Союзники выделены золотом, враги — красным: прокрутив журнал, можно быстро восстановить картину боя.\n\nНесколько особенностей строк:\n• Атаки #bold по области#! создают #bold отдельную строку для каждой цели#!, показывая, кому что досталось (например, «Митра → Все враги (Стив)»).\n• Когда срабатывает стойка вроде ответного удара, вызвавшая его строка получает пометку #bold + Ответный удар#! рядом с основным результатом.\n• Отметки обрамляют бой: «— Бой начинается —» внизу, «— Начинается раунд 2 —» при смене раунда, а после завершения — «— Бой окончен · Победа —» или «— Бой окончен · Поражение —» вверху."
 pod_combat.0102.t: "Нападение, защита и эффекты"
 pod_combat.0102.desc: "#bold ПОПАДАНИЕ#!\nПодсказка приёма указывает, какие этапы защиты он пропускает. Обычная физическая атака прежде всего должна быть способна воздействовать на бестелесного духа. Затем @pod_combat_stealth_icon![Concept('pod_combat_stealth', 'скрытность')|E] или @pod_combat_dodge_icon![Concept('pod_combat_dodge', 'уклонение')|E] позволяют избежать её, проверка [Concept('pod_combat_hit_chance', 'шанса попадания')|E] может дать промах, а @pod_combat_guard_icon![Concept('pod_combat_guard', 'защита')|E] — заблокировать удар, который иначе достиг бы цели. После этого [Concept('soak_damage', 'поглощение')|E] проверяется отдельно для каждой единицы урона: обычно тяжёлый удар ослабляется, а не предотвращается целиком.\n\n#bold Без проверки попадания#! пропускает лишь процентную проверку; #bold невозможно уклониться#! обходит уклонение и скрытность; #bold воздействует на бестелесных духов#! позволяет поразить духа даже там, где это иначе невозможно; #bold игнорирует защиту#! проходит сквозь защиту. #bold Снимает защиту#! или #bold снимает уклонение / скрытность#! удаляет соответствующую стойку до применения прочих эффектов приёма. Сверхъестественные и ментальные атаки обычно пропускают проверку попадания и защиты, но уклонение и скрытность всё ещё позволяют избежать их.\n\n#bold ТИПЫ УРОНА#!\n• [Concept('POD_superficial_damage','Поверхностный')|E]: может поглощаться по единице и заживает между боями.\n• [Concept('POD_aggravated_damage','Серьёзный')|E]: по умолчанию не поглощается и заживает медленно. Стихийные атаки — [fire_damage_short|E], [cold_damage_short|E], [lightning_damage_short|E], [sun_damage_short|E], [silver_damage_short|E], [gold_damage_short|E], [holy_damage_short|E], [balefire_damage_short|E], [poison_damage_short|E] и [cold_iron_damage_short|E] — наносят серьёзный урон только уязвимым к ним видам; некоторые виды полностью #bold невосприимчивы#!. Наведите на тип урона, чтобы узнать об уязвимостях.\nНекоторые приёмы — #bold высасывающие атаки#!: они исцеляют вас, но лишь если после поглощения атака нанесла урон здоровью. Другие при использовании #bold ранят и вас#!: безрассудные атаки в полную силу, жертвующие частью вашего здоровья ради более тяжёлого удара.\n\n#bold ЗАЩИТНАЯ ТАКТИКА#!\nМожно заранее накопить защитные эффекты: они сохраняются до первой проверки. Нередко лучший ход — подготовить защиту вместо нападения:\n• @pod_combat_guard_icon![Concept('pod_combat_guard', 'Защита')|E] — блокирует следующую атаку, проверяющую защиту, которая иначе попала бы в цель.\n• @pod_combat_dodge_icon![Concept('pod_combat_dodge', 'Уклонение')|E] — предотвращает следующую атаку, проверяющую уклонение; приёмы, от которых нельзя уклониться, не расходуют его.\n• @pod_combat_stealth_icon![Concept('pod_combat_stealth', 'Скрытность')|E] — +[GuiScope.ScriptValue('pod_combat_stealth_hit_bonus')|0]% к попаданию, пока действует; расходуется при следующем приёме, наносящем урон здоровью или требующем враждебного контакта, либо при уходе от атаки.\n• #bold Ответный удар при попадании / промахе#! — атакует того, кто испытывает вашу защиту. Подсказка приёма указывает точный ответный эффект и тип урона: поверхностный или серьёзный.\n\n#bold УСИЛЕНИЯ И ОСЛАБЛЕНИЯ#!\nВременные эффекты попадания и поглощения бывают малыми, средними и большими. Усиления и ослабления попадания, а также ослабления поглощения добавляют или отнимают #bold 10 / 20 / 30#! процентных пунктов. Усиления поглощения вместо этого уменьшают оставшийся после текущего поглощения урон на #bold 10 / 20 / 30%#!, поэтому отображаемая прибавка зависит от текущего поглощения бойца.\n\nЭффекты на раунд и на весь бой занимают отдельные ячейки, как и усиления с ослаблениями, поэтому могут действовать одновременно. При одинаковом показателе, направлении и длительности текущий эффект заменяется только строго более сильным; равный или слабый ничего не добавляет. Усиление на раунд исчезает в начале следующего хода владельца, а ослабление сохраняется весь его следующий ход и исчезает в конце. Эффекты на весь бой действуют до его завершения.\n\n#bold НЕДУГИ И КОНТРОЛЬ#!\nНекоторые приёмы оставляют не только раны:\n• #bold Периодический урон#! срабатывает в конце каждого раунда несколько раундов подряд; каждый раз отмечается значком типа урона. Ментальные недуги вместо этого снижают [Concept('pod_combat_morale', 'боевой дух')|E]; недуги без указанного типа просто ранят. На карточке жертвы появляется значок состояния: наведите на него, чтобы узнать урон и число оставшихся раундов.\n• #bold Ошеломление и оглушение#! — некоторые атаки отнимают очки действий цели на следующий ход. При полном истощении этот ход начинается с #bold 0 ОД#!; доступные приёмы за 0 ОД всё ещё можно использовать.\n• #bold Подчинение#! — некоторые ментальные силы похищают следующий ход бойца и обращают его против своих. Сильная ментальная защита предотвращает это, если заклинатель не способен её пробить; #bold ваш#! персонаж никогда не может стать марионеткой."
 pod_combat.0103.t: "Исходы и управление"
 pod_combat.0103.desc: "#bold ВЫБЫВАНИЕ ИЗ БОЯ#!\nБоец выбывает из схватки, если происходит одно из следующего:\n• Его [Concept('POD_health_track', 'шкала здоровья')|E] полностью заполняется.\n• Его [Concept('pod_combat_morale', 'боевой дух')|E] падает до нуля.\n• Он умирает, становится #N недееспособным#!, впадает в торпор или оказывается заточён в Загробном мире либо Бездне.\nКаждое падение потрясает выживших: каждый оставшийся союзник теряет #bold [GuiScope.ScriptValue('pod_combat_ally_down_morale_penalty')|0]#! [Concept('pod_combat_morale', 'боевого духа')|E], но этот шок не может снизить боевой дух ниже 1. Вы #bold побеждаете#!, как только врагов не остаётся. В противном случае, если #bold ваш персонаж#! выбывает, вы сразу проигрываете, даже если союзники ещё сражаются.\n\n#bold ПОСЛЕ БОЯ#!\nВне тренировок каждый живой боец получает #bold [GuiScope.ScriptValue('pod_combat_morale_stress_multiplier')|0]#! [Concept('static_stress', 'психического напряжения')|E] за каждое недостающее в конце боя очко [Concept('pod_combat_morale', 'боевого духа')|E]. Восстановление боевого духа до завершения уменьшает эти долговременные последствия. Раны сохраняются в соответствии с режимом поединка, а потраченная на приёмы сверхъестественная энергия и прочие ресурсы не возвращаются. Выбранный набор приёмов сохраняется между боями.\n\n#bold РЕЖИМЫ ПОЕДИНКА#!\nПравила смертности задаёт событие, вызвавшее бой:\n• #bold Смертельный#!: раны сохраняются; действуют обычные правила PoD для ран, смерти и выживания отдельных видов. Некоторые исходные события гарантируют смерть проигравшего.\n• #bold Несмертельный#!: раны действуют как обычно и могут вывести бойца из строя, но смерть от ран предотвращается. В конце боя полностью заполненная шкала ранений исцеляется так, чтобы осталась одна пустая ячейка.\n• #bold Тренировка#!: урон, исцеление и боевой дух действуют во время схватки и определяют, кто падёт, но затем состояние ранений каждого бойца восстанавливается до исходного, а недостающий боевой дух не оставляет психического напряжения. Обычная стоимость приёмов всё равно уплачивается; полученная при определённых условиях энергия может сохраниться.\n\n#bold КНОПКИ ОКНА#!\n• #bold Завершить ход#!: закончить свой ход и передать очередь следующему бойцу по инициативе. Неиспользованные ОД сгорают.\n• #bold Автоматический исход#!: пропустить оставшуюся часть боя. Текущая [Concept('prowess', 'доблесть')|E] выживших бойцов каждой стороны суммируется; к ней прибавляется случайное число от нуля до этой суммы. Побеждает большее значение; ничья решается в вашу пользу. Боевой дух проигравшего предводителя падает до нуля, вызывая максимальное психическое напряжение от его потери вне тренировок, если предводитель выживет.\n  Пропуск боя не проходит бесследно. В заключительной схватке каждый ещё стоящий боец получает ранения, включая победителей. Тяжесть зависит от решительности исхода: при близком результате обе стороны страдают примерно поровну; разгром оставляет победителей почти невредимыми, а проигравших — тяжело израненными. [Concept('soak_damage', 'Поглощение')|E] проверяется как обычно, поэтому стойкий боец может полностью избежать урона. Тренировочные поединки освобождены от этого.\n  Есть исключение: если ещё стоит враг, которому вы #bold никак не можете навредить#! — бестелесный дух, которого никто на вашей стороне не способен поразить, — никакая сумма не принесёт победы. Автоматический исход тогда означает сдачу без проверки. Кнопка остаётся доступной именно потому, что другого выхода из такой схватки нет; подсказка предупреждает об этом заранее. Обратное также верно, но лишь когда неуязвим #bold ваш собственный персонаж#!: бестелесный союзник не спасёт вас, поскольку вы проигрываете в момент падения своего персонажа.\n• #bold Завершить бой#!: закрыть окно после определения исхода (после победы или поражения заменяет «Завершить ход» и «Автоматический исход»).\n• Флажок #bold Автоматическая смена ходов#!: если включён, все ходы ИИ в раунде отыгрываются одним щелчком, а не по очереди.\n• #bold Справка#!: вновь открыть это руководство в любой момент.\n\nПосле определения победителя появляется вариант #bold $pod_combat.9995.a$#!; выбрав его, вы возвращаетесь к событию, вызвавшему бой. Уйти из поединка на полпути нельзя: доведите его до конца или воспользуйтесь автоматическим исходом."

