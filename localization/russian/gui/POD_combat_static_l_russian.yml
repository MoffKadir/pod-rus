ove').Var('targeting').GetFlagKey] tgt_team=[PODCombatFight.Var('pod_combat_selected_target_team').GetFlagKey] tgt_pos=[PODCombatFight.Var('pod_combat_selected_target_position').GetValue|0] tgt_soak=[PODCombatFight.Var('pod_combat_target_soak').GetValue|0] tgt_morale=[PODCombatFight.Var('pod_combat_target_morale').GetValue|0] act_hit=[PODCombatFight.Var('pod_combat_current_hit_chance').GetValue|0] base_hit=[PODCombatFight.Var('pod_combat_actor_base_hit_chance').GetValue|0] own_pw=[PODCombatFight.Var('pod_combat_actor_prowess').GetValue|0] tgt_pw=[PODCombatFight.Var('pod_combat_target_prowess').GetValue|0] tgt_hit=[PODCombatFight.Var('pod_combat_target_hit_chance').GetValue|0] finishable=[PODCombatFight.Var('pod_combat_ai_enemy_finishable').GetValue|0] pend_drain=[PODCombatFight.Var('pod_combat_ai_tgt_ap_drain').GetValue|0] pend_ctrl=[PODCombatFight.Var('pod_combat_ai_tgt_controlled').GetValue|0] pend_dot=[PODCombatFight.Var('pod_combat_ai_tgt_dot_amount').GetValue|0] pend_dot_r=[PODCombatFight.Var('pod_combat_ai_tgt_dot_rounds').GetValue|0] pend_dot_mor=[PODCombatFight.Var('pod_combat_ai_tgt_dot_morale').GetValue|0] pend_init=[PODCombatFight.Var('pod_combat_ai_tgt_init_bonus').GetValue|0] tgt_hp=[PODCombatFight.Var('pod_combat_ai_tgt_hp').GetValue|0] fin_hp=[PODCombatFight.Var('pod_combat_ai_enemy_finishable_hp').GetValue|0] fin_mor=[PODCombatFight.Var('pod_combat_ai_enemy_finishable_mor').GetValue|0] ctf=[PODCombatFight.Var('pod_combat_ai_cur_target_finishable').GetValue|0] fin_n=[PODCombatFight.Var('pod_combat_ai_fin_n').GetValue|0] fin_team_n=[PODCombatFight.Var('pod_combat_ai_fin_team_n').GetValue|0] fin_pos=[PODCombatFight.Var('pod_combat_ai_fin_pos').GetValue|0] kg_hp=[PODCombatFight.Var('pod_combat_ai_can_dmg_hp').GetValue|0] kg_mor=[PODCombatFight.Var('pod_combat_ai_can_dmg_mor').GetValue|0] th_hp=[GetPlayer.MakeScope.ScriptValue('pod_combat_ai_hp_finish_threshold')|0] th_mor=[GetPlayer.MakeScope.ScriptValue('pod_combat_ai_morale_finish_threshold')|0] th_kil