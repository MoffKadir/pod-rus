 pod_combat_advance_turn_label: "Следующий ход"
 pod_combat_advance_turn_tt: "Отыграть ход следующего бойца и сделать паузу для изучения обстановки. Кнопка появляется во время хода ИИ; включите #bold автоматическую смену ходов#!, чтобы отыгрывать весь раунд одним щелчком."
 pod_combat_auto_advance_label: "Автоматическая смена ходов"
 pod_combat_auto_advance_tt: "#bold Включено:#! ходы ИИ отыгрываются автоматически до вашего следующего хода.\n#bold Выключено:#! каждый щелчок отыгрывает ход одного бойца, с паузами между ходами ИИ для изучения обстановки."
