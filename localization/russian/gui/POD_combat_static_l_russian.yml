 ###### AI DECISION TRACE (debug-gated; emitted via debug_log, not shown in UI)
 # Keep the pod_combat_trace prefix, key=value format and field order stable for parsers.
 # Read the host through GetPlayer.MakeScope; ROOT varies by call site. Numeric reads
 # use GetValue|0; flags use GetFlagKey and must be set when emitted.
 # Target records use numeric teams (1 = player, 2 = enemy), since flags may be unset.
 # Compare pick records' th_* settings before comparing decisions across logs.
