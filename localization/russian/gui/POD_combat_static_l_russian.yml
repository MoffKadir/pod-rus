 ##############################
 ###### DYNAMIC MOVE TOOLTIP (pod_combat_move_desc SGUI)
 ##############################
 # Tooltip values read saved scope story. 
 # each key must restore an explicit color with #medium;outline or equivalent.
 # A trailing $EFFECT_LIST_BULLET$ balances the hidden leading bullet for centering.

 # Capability callouts describe runtime behavior; their SGUI gates test absent capability flags.
 pod_combat_desc_always_hits: "#medium;outline [Concept('pod_combat_hit_chance','Без броска на попадание')|E]#! $EFFECT_LIST_BULLET$"
 pod_combat_desc_undodgeable: "#medium;outline Невозможно уклониться — обходит @pod_combat_dodge_icon![Concept('pod_combat_dodge', 'уклонение')|E] и @pod_combat_stealth_icon![Concept('pod_combat_stealth', 'скрытность')|E]#! $EFFECT_LIST_BULLET$"
 pod_combat_desc_hits_spirits: "#medium;outline Воздействует на бестелесных духов#! $EFFECT_LIST_BULLET$"
 pod_combat_desc_uses_weapon: "#medium;outline Использует ваше [Concept('artifact', 'оружие')|E] #weak (если у него есть бонусы к [Concept('pod_combat_moves', 'боевым приёмам')|E])#!#! $EFFECT_LIST_BULLET$"
 pod_combat_desc_uses_weapon_armed: "#medium;outline Использует ваше [Concept('artifact', 'оружие')|E] ([pod_weapon.GetNameNoTooltip])#! $EFFECT_LIST_BULLET$"
 pod_combat_desc_weapon_empowered: "#medium;outline Использует #bold [pod_weapon.GetNameNoTooltip]#!:$pod_weapon_ovr_line$#! $EFFECT_LIST_BULLET$"
 # Cost fragments include a leading space; energy text is splat-aware.
 pod_combat_costline_energy: " [GetPlayer.Custom('PODEnergySplatIcon')]#bold [Multiply_CFixedPoint( ROOT.Var('energy_cost').GetValue, GetPlayer.MakeScope.ScriptValue('pod_combat_energy_cost_display_multiplier') )|V0]#! #V [GetPlayer.Custom('PODEnergySplatWord')]#!"
 pod_combat_costline_gold: " @gold_icon!#bold [ROOT.Var('gold_cost').GetValue|V0]#! золота"
 pod_combat_costline_piety: " @piety_icon!#bold [ROOT.Var('piety_cost').GetValue|V0]#! благочестия"
 pod_combat_costline_prestige: " @prestige_icon!#bold [ROOT.Var('prestige_cost').GetValue|V0]#! престижа"
 pod_combat_costline_stress: " @stress_icon!#bold [ROOT.Var('stress_cost').GetValue|V0]#! стресса"
 pod_combat_desc_costs: "#medium;outline Стоимость:[story.Custom('PODCombatEnergyCostInline')][story.Custom('PODCombatGoldCostInline')][story.Custom('PODCombatPietyCostInline')][story.Custom('PODCombatPrestigeCostInline')][story.Custom('PODCombatStressCostInline')]#! $EFFECT_LIST_BULLET$"
 pod_combat_desc_steal_gold: "#medium;outline Похитить #bold [story.MakeScope.Var('steal_gold').GetValue|V0]#! золота у врага#! $EFFECT_LIST_BULLET$"
 pod_combat_desc_gain_dread: "#medium;outline Получить #bold [story.MakeScope.Var('gain_dread').GetValue|V0]#! ужаса#! $EFFECT_LIST_BULLET$"
 pod_combat_desc_once_per_round: "#medium;outline Можно использовать один раз за раунд#! $EFFECT_LIST_BULLET$"
 pod_combat_desc_once_per_combat: "#medium;outline Можно использовать один раз за бой#! $EFFECT_LIST_BULLET$"

 # Dispatch elements to namespaced keys to avoid vanilla flag-loc collisions.
 # Omit |E on colored concepts so the element color takes precedence over concept blue.
 pod_combat_desc_hp_damage_basic: "#medium;outline #N Нанести#! #bold [story.MakeScope.Var('hp_damage').GetValue|V0]#! [story.MakeScope.Var('damage_type').GetFlagName] #N урона#! персонажу [story.MakeScope.Var('targeting').GetFlagName]#! $EFFECT_LIST_BULLET$"
 pod_combat_desc_hp_damage_elemental: "#medium;outline #N Нанести#! #bold [story.MakeScope.Var('hp_damage').GetValue|V0]#! [Localize( Concatenate( 'pod_combat_damage_type_', story.MakeScope.Var('damage_type').GetFlagKey ) )] #N урона#! персонажу [story.MakeScope.Var('targeting').GetFlagName]#! $EFFECT_LIST_BULLET$"
 pod_combat_desc_morale_damage: "#medium;outline #N Нанести#! #bold [story.MakeScope.Var('morale_damage').GetValue|V0]#! #N урона#! [Concept('pod_combat_morale', 'боевому духу')|E] персонажа [story.MakeScope.Var('targeting').GetFlagName]#! $EFFECT_LIST_BULLET$"
 pod_combat_desc_morale_damage_on_hp_damage: "#medium;outline #N Нанести#! #bold [story.MakeScope.Var('morale_damage').GetValue|V0]#! #N урона#! [Concept('pod_combat_morale', 'боевому духу')|E] персонажа [story.MakeScope.Var('targeting').GetFlagName], но только если атака наносит урон здоровью после поглощения#! $EFFECT_LIST_BULLET$"
 pod_combat_desc_morale_damage_on_contact: "#medium;outline #N Нанести#! #bold [story.MakeScope.Var('morale_damage').GetValue|V0]#! #N урона#! [Concept('pod_combat_morale', 'боевому духу')|E] персонажа [story.MakeScope.Var('targeting').GetFlagName], но только если атака достигает контакта (включая заблокированный или полностью поглощённый удар)#! $EFFECT_LIST_BULLET$"
 pod_combat_desc_morale_damage_on_miss: "#medium;outline #N Нанести#! #bold [story.MakeScope.Var('morale_damage').GetValue|V0]#! #N урона#! [Concept('pod_combat_morale', 'боевому духу')|E] персонажа [story.MakeScope.Var('targeting').GetFlagName], но только при промахе или уходе от атаки#! $EFFECT_LIST_BULLET$"
 pod_combat_desc_self_damage: "#medium;outline Получить #bold [story.MakeScope.Var('self_damage').GetValue|V0]#! урона самому себе#! $EFFECT_LIST_BULLET$"
 pod_combat_desc_self_damage_on_hp_damage: "#medium;outline Получить #bold [story.MakeScope.Var('self_damage').GetValue|V0]#! урона самому себе, но только если атака наносит урон здоровью после поглощения#! $EFFECT_LIST_BULLET$"
 pod_combat_desc_self_damage_on_contact: "#medium;outline Получить #bold [story.MakeScope.Var('self_damage').GetValue|V0]#! урона самому себе, но только если атака достигает контакта (включая заблокированный или полностью поглощённый удар)#! $EFFECT_LIST_BULLET$"
 pod_combat_desc_self_damage_on_miss: "#medium;outline Получить #bold [story.MakeScope.Var('self_damage').GetValue|V0]#! урона самому себе, но только при промахе или уходе от атаки#! $EFFECT_LIST_BULLET$"
 # POD_combat_move_set_hp_heal always sets heal_type for the wound-box lookup.
 pod_combat_desc_hp_heal: "#medium;outline #P Восстановить#! #bold [story.MakeScope.Var('hp_heal').GetValue|V0]#! [story.MakeScope.Var('heal_type').GetFlagName] персонажу [story.MakeScope.Var('targeting').GetFlagName]#! $EFFECT_LIST_BULLET$"
 # Drain wording must require actual post-soak HP damage.
 pod_combat_desc_drain: "#medium;outline #P Высосать#! #bold [story.MakeScope.Var('hp_heal').GetValue|V0]#! [story.MakeScope.Var('heal_type').GetFlagName] у цели, но только если атака наносит урон здоровью после поглощения#! $EFFECT_LIST_BULLET$"
 # Combine damage and drain on one line. The standalone drain key covers moves without hp_damage.
 pod_combat_desc_hp_damage_basic_drain: "#medium;outline #N Нанести#! #bold [story.MakeScope.Var('hp_damage').GetValue|V0]#! [story.MakeScope.Var('damage_type').GetFlagName] #N урона#! цели [story.MakeScope.Var('targeting').GetFlagName], #P высосать#! #bold [story.MakeScope.Var('hp_heal').GetValue|V0]#! [story.MakeScope.Var('heal_type').GetFlagName], если атака наносит урон здоровью после поглощения#! $EFFECT_LIST_BULLET$"
 pod_combat_desc_hp_damage_elemental_drain: "#medium;outline #N Нанести#! #bold [story.MakeScope.Var('hp_damage').GetValue|V0]#! [Localize( Concatenate( 'pod_combat_damage_type_', story.MakeScope.Var('damage_type').GetFlagKey ) )] #N урона#! цели [story.MakeScope.Var('targeting').GetFlagName], #P высосать#! #bold [story.MakeScope.Var('hp_heal').GetValue|V0]#! [story.MakeScope.Var('heal_type').GetFlagName], если атака наносит урон здоровью после поглощения#! $EFFECT_LIST_BULLET$"
 pod_combat_desc_morale_heal: "#medium;outline #P Восстановить#! #bold [story.MakeScope.Var('morale_heal').GetValue|V0]#! [Concept('pod_combat_morale', 'боевого духа')|E] персонажу [story.MakeScope.Var('targeting').GetFlagName]#! $EFFECT_LIST_BULLET$"
 pod_combat_desc_energy_gain: "#medium;outline #P Восстановить#! #bold [Multiply_CFixedPoint( story.MakeScope.Var('energy_gain').GetValue, GetPlayer.MakeScope.ScriptValue('splat_energy_multiplier') )|V0]#! [GetPlayer.Custom('PODEnergySplatIcon')] #V [GetPlayer.Custom('PODEnergySplatWord')]#!#! $EFFECT_LIST_BULLET$"

