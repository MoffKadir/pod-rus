 pod_combat_debug_practice_interaction: "Тренировочный бой"
 pod_combat_debug_practice_desc: "Отладка: тренировочный поединок один на один — раны не сохраняются."
 pod_combat_debug_nonfatal_interaction: "Несмертельный бой"
