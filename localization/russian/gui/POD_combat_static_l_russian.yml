 game_concept_pod_combat_encounter: "Боевое столкновение"
 game_concept_pod_combat_encounter_with_icon: "@pod_combat_encounter_icon!Боевое столкновение"
 game_concept_pod_combat_encounters: "Боевые столкновения"
 game_concept_pod_combat_encounters_with_icon: "@pod_combat_encounter_icon!Боевые столкновения"
 game_concept_pod_combat_encounter_desc: "Пошаговая тактическая мини-игра, где два или больше персонажей решают разногласия насилием.\n\nБойцы по очереди тратят [Concept('pod_combat_action_points', 'очки действия')|E] на [Concept('pod_combat_moves', 'боевые приёмы')|E], пока враг не [Concept('pod_combat_knocked_out', 'выбывает из боя')|E].\n\nРазнообразные [Concept('pod_combat_moves', 'боевые приёмы')|E] открываются благодаря свойствам [Concept('splat', 'вида')|E], достоинствам и другим источникам. Они могут наносить урон [Concept('POD_health_track', 'здоровью')|E] или [Concept('pod_combat_morale', 'боевому духу')|E], накладывать усиления и ослабления, давать стойки вроде @pod_combat_guard_icon![Concept('pod_combat_guard', 'защиты')|E], @pod_combat_dodge_icon![Concept('pod_combat_dodge', 'уклонения')|E] или @pod_combat_stealth_icon![Concept('pod_combat_stealth', 'скрытности')|E] и многое другое.\n\n[prowess_i][Concept('prowess', 'Доблесть')|E] очень важна в бою, поскольку определяет [Concept('pod_combat_hit_chance', 'вероятность попадания')|E] и [Concept('pod_combat_initiative', 'инициативу')|E].\n\n#I Подробнее о механике боя можно узнать через кнопку #bold Справка#! в боевом интерфейсе.#!"

 game_concept_pod_combat_move: "Боевой приём"
 game_concept_pod_combat_moves: "Боевые приёмы"
 game_concept_pod_combat_move_desc: "#I Используйте [Concept('decision', 'решение')|E] #bold [SelectLocalization(IsInGame,'pod_combat_configure_moves_link_ingame','pod_combat_configure_moves')]#!, чтобы выбрать набор приёмов перед боем.#!\n\nЭто способности, применяемые во время @pod_combat_encounter_icon![Concept('pod_combat_encounters', 'боевых столкновений')|E]. Боевые приёмы делятся на четыре категории:\n\n#color_red;bold АТК (Атака):#! наносят урон [Concept('POD_health_track', 'здоровью')|E]. Некоторые имеют [Concept('POD_damage_types', 'типы урона')|E], например [fire_damage_short_with_icon] или [silver_damage_short_with_icon].\n\n#color_light_blue;bold ЗАЩ (Защита):#! исцеляют, улучшают [Concept('soak_damage', 'поглощение')|E] или [Concept('pod_combat_hit_chance', 'вероятность попадания')|E], либо дают стойки вроде @pod_combat_guard_icon![Concept('pod_combat_guard', 'защиты')|E], @pod_combat_dodge_icon![Concept('pod_combat_dodge', 'уклонения')|E] или @pod_combat_stealth_icon![Concept('pod_combat_stealth', 'скрытности')|E].\n\n#color_porple;bold КОН (Контроль):#! наносят урон [Concept('pod_combat_morale', 'боевому духу')|E], ослабляют [Concept('soak_damage', 'поглощение')|E] или [Concept('pod_combat_hit_chance', 'вероятность попадания')|E] врага, либо отнимают его [Concept('pod_combat_ap', 'ОД')|E].\n\n#color_pwr_orange;bold СИЛ (Сила):#! мощные завершающие приёмы, часто имеющие ограничения.\n\nМожно выбрать по #bold [EmptyScope.ScriptValue('pod_combat_max_per_category_base')|V0]#! приёма каждой категории, всего #bold [EmptyScope.ScriptValue('pod_combat_max_equipped_base')|V0]#!.\n\nБоевые приёмы расходуют [Concept('pod_combat_action_points', 'очки действий')|E] #V (ОД)#! и могут требовать дополнительных затрат, таких как @blood_icon![Concept('hunger', 'голод')|E] или [gold_i][Concept('gold', 'золото')|E]."

 pod_combat_configure_moves_link_ingame: "[GetDecision('pod_combat_configure_moves').GetName]"

 game_concept_pod_combat_action_points: "Очки действий"
 game_concept_pod_combat_ap: "ОД"
 game_concept_pod_combat_action_points_desc: "#bold Очки действий (ОД)#! — основной ресурс во время @pod_combat_encounter_icon![Concept('pod_combat_encounters', 'боевых столкновений')|E].\n\nПо умолчанию каждый раунд начинается с [EmptyScope.ScriptValue('pod_combat_base_ap_base')|V0] очков действий. Некоторые [Concept('pod_combat_moves', 'боевые приёмы')|E] могут прибавлять, отнимать или возвращать ОД.\n\nНеиспользованные ОД сгорают в конце вашего хода."

 game_concept_pod_combat_knocked_out: "Выбытие из боя"
 game_concept_pod_combat_knocked_out_desc: "Боец #bold выбывает из боя#! и покидает @pod_combat_encounter_icon![Concept('pod_combat_encounter', 'боевое столкновение')|E], если происходит одно из следующего:\n$BULLET_WITH_TAB$Его [Concept('POD_health_track', 'шкала здоровья')|E] полностью заполнена\n$BULLET_WITH_TAB$Его [Concept('pod_combat_morale', 'боевой дух')|E] падает до #N нуля#!\n$BULLET_WITH_TAB$Он умирает, становится #N недееспособным#!, впадает в [Glossary('торпор','game_concept_torpor_desc')] или оказывается заточён в Загробном мире либо Бездне\n\nВы побеждаете, когда все враги выбывают. Если вы выбываете сами, вы проигрываете, даже если союзники ещё сражаются."

 ##############################
 ###### GAME CONCEPTS - combat minigame stats
 ##############################

 game_concept_pod_combat_morale: "Боевой дух"
 game_concept_pod_combat_morale_icon: "@stress_icon!"
 game_concept_pod_combat_morale_desc: "#bold Психическая стойкость#! бойца во время @pod_combat_encounter_icon![Concept('pod_combat_encounters', 'боевых столкновений')|E]. Боевой дух обычно начинает с полного значения и снижается от прямых ментальных атак, запугивания и другого давления. Каждая ячейка ранения, нанесённая ударом после [Concept('soak_damage', 'поглощения')|E], также отнимает #N [EmptyScope.ScriptValue('pod_combat_morale_from_hp_base_ratio')|0]#! боевого духа.\n\nКогда боец [Concept('pod_combat_knocked_out', 'выбывает из боя')|E], каждый выживший союзник теряет #N [EmptyScope.ScriptValue('pod_combat_ally_down_morale_penalty')|0]#! боевого духа от потрясения. Эта потеря не опускает боевой дух ниже 1, поэтому само потрясение не может вывести кого-либо из боя.\n\nВне тренировок каждый живой боец получает в конце боя #N [EmptyScope.ScriptValue('pod_combat_morale_base_stress_multiplier')|0]#! [Concept('static_stress', 'психического напряжения')|E] за каждое недостающее очко боевого духа. Восстановление боевого духа до завершения схватки уменьшает это долговременное напряжение. Тренировочные бои не оставляют психического напряжения."

 game_concept_pod_combat_hit_chance: "Вероятностҗ попадания"
 game_concept_pod_combat_hit: "Попадание"
 game_concept_pod_combat_accuracy: "Точность"
 game_concept_pod_combat_hit_chance_desc: "Для [Concept('pod_combat_moves', 'боевых приёмов')|E], требующих #bold проверки попадания#!, вероятность попадания — процентный шанс успешно пройти эту проверку. Основа начинается с [EmptyScope.ScriptValue('pod_combat_hit_chance_base_base')|0]% и изменяется на половину разницы между вашей [Concept('prowess', 'доблестью')|E] и доблестью выбранной цели; затем учитываются действующие усиления и ослабления попадания и бонус @pod_combat_stealth_icon![Concept('pod_combat_stealth', 'скрытности')|E] +[EmptyScope.ScriptValue('pod_combat_stealth_hit_base_bonus')|0]%.\n\n@pod_combat_dodge_icon![Concept('pod_combat_dodge', 'Уклонение')|E] и @pod_combat_stealth_icon![Concept('pod_combat_stealth', 'скрытность')|E] проверяются до попадания, а @pod_combat_guard_icon![Concept('pod_combat_guard', 'защита')|E] может заблокировать атаку, которая иначе достигла бы цели. [Concept('soak_damage', 'Поглощение')|E] и способность воздействовать на бестелесных духов — также отдельные этапы. Ни одна из этих защит не меняет отображаемый процент.\n\nВероятность попадания при проверке ограничена диапазоном от [EmptyScope.ScriptValue('pod_combat_hit_chance_min_base')|0]% до [EmptyScope.ScriptValue('pod_combat_hit_chance_max_base')|0]%. Приёмы с пометкой #bold Без проверки попадания#! пропускают лишь эту проверку; любая другая защита, которую они не игнорируют, всё ещё может их остановить."

 ##############################
 ###### GAME CONCEPTS - combat stances
 ##############################

 game_concept_pod_combat_guard: "Защита"
 game_concept_pod_combat_guard_with_icon: "@pod_combat_guard_icon!Защита"
 game_concept_pod_combat_guarding: "Защищается"
 game_concept_pod_combat_guarding_with_icon: "@pod_combat_guard_icon!Защищается"
 game_concept_pod_combat_guarded: "Под защитой"
 game_concept_pod_combat_guarded_with_icon: "@pod_combat_guard_icon!Под защитой"
 game_concept_pod_combat_guard_desc: "#bold Защитная стойка#!. Если атака, проверяющая защиту, иначе достигла бы цели, она превращается в заблокированный удар и не наносит урон [Concept('POD_health_track', 'здоровью')|E]. Защита расходуется, когда блокирует эту атаку.\n\n#weak Приём, игнорирующий защиту, может попасть в цель, не расходуя её.#!"

 game_concept_pod_combat_dodge: "Уклонение"
 game_concept_pod_combat_dodge_with_icon: "@pod_combat_dodge_icon!Уклонение"
 game_concept_pod_combat_dodging: "Уклоняется"
 game_concept_pod_combat_dodging_with_icon: "@pod_combat_dodge_icon!Уклоняется"
 game_concept_pod_combat_dodged: "Уклонился"
 game_concept_pod_combat_dodged_with_icon: "@pod_combat_dodge_icon!Уклонился"
 game_concept_pod_combat_dodge_desc: "#bold Стойка уклонения#!. Когда атака проверяет уклонение, она автоматически промахивается независимо от [Concept('pod_combat_hit_chance', 'вероятности попадания')|E] атакующего, а уклонение расходуется.\n\n#weak Приём, от которого нельзя уклониться, обходит уклонение, не расходуя его; приём, снимающий уклонение, удаляет стойку до применения прочих эффектов.#!"

 game_concept_pod_combat_stealth: "Скрытность"
 game_concept_pod_combat_stealth_with_icon: "@pod_combat_stealth_icon!Скрытность"
 game_concept_pod_combat_stealthed: "Скрывается"
 game_concept_pod_combat_stealthed_with_icon: "@pod_combat_stealth_icon!Скрывается"
 game_concept_pod_combat_stealth_desc: "#bold Скрытая стойка#!, дающая +[EmptyScope.ScriptValue('pod_combat_stealth_hit_base_bonus')|0]% к [Concept('pod_combat_hit_chance', 'вероятности попадания')|E], пока действует. Скрытность исчезает при первом из следующих событий:\n$TAB$- Боец использует приём, наносящий урон здоровью или требующий враждебного контакта\n$TAB$- Входящая атака проверяет скрытность и автоматически промахивается\n\nАтаки, наносящие только урон боевому духу, не расходуют скрытность атакующего.\n\n#weak Приём, от которого нельзя уклониться, обходит скрытность, не расходуя её. Приём, снимающий скрытность, удаляет стойку до применения прочих эффектов.#!"


 game_concept_pod_combat_initiative: "Инициатива"
 game_concept_pod_combat_init: "Иниц."
 game_concept_pod_combat_initiative_desc: "Проверка, определяющая [Concept('pod_combat_turn_order', 'очерёдность ходов')|E]. Чем выше инициатива, тем раньше действует боец.\n\nКаждый боец проходит проверку один раз при вступлении в бой и сохраняет результат до его конца: очерёдность одна на всю схватку, а не новая каждый раунд. Проверка учитывает [Concept('prowess', 'доблесть')|E] и вид бойца; достоинства и свойства изменяют её. Быстрые бойцы (со сверхъестественными дисциплинами скорости и свойствами быстроты) могут атаковать раньше, чем медленные враги успеют отреагировать.\n\nОслабления инициативы от приёмов меняют результат на #bold один раунд#!, а затем исчезают. Применив их вовремя, вы получаете ровно один ход раньше более быстрого врага."

 game_concept_pod_combat_turn_order: "Очерёдность ходов"
 game_concept_pod_combat_turn: "Ход"
 game_concept_pod_combat_turn_order_desc: "Установленная очерёдность действий бойцов, с номерами от 1 (первый) до N (последний). Определяется [Concept('pod_combat_initiative', 'инициативой')|E] каждого бойца.\n\nПорядок задаётся в начале боя и сохраняется до конца, позволяя планировать на несколько ходов вперёд. Он меняется лишь при изменении инициативы: её ослабление сдвигает цель на один раунд, а присоединившийся к схватке боец входит в очерёдность со следующего раунда.\n\nЕсли бойцов трое или больше, порядок показан полосой портретов вверху окна боя. Действующий боец выделен; после хода или поражения портреты тускнеют. Номер бойца указан в строке [Concept('pod_combat_initiative', 'инициативы')|E] при наведении на его карточку."


 ##############################
 ###### GAME CONCEPTS - damage types
 ##############################
 # Describe player-visible outcomes; avoid internal variable, trigger and death-reason names.

 # ── Elemental damage flavors ──

 game_concept_fire_damage: "Урон от огня"
 game_concept_fire_damage_icon: "@pod_combat_fire_icon!"
 game_concept_fire_damage_short: "#L;color:{1.00,0.55,0.20} Огонь#!"
 game_concept_fire_damage_short_with_icon: "$game_concept_fire_damage_icon$$game_concept_fire_damage_short$"
 game_concept_fire_damage_desc: "$BULLET_WITH_TAB$ @health_track_aggravated_damage_icon! [Concept('POD_aggravated_damage', 'Серьёзный урон')|E] по #bold любому [Concept('splat', 'виду')|E] с телом.#! Ожоги не заживают за одну ночь.\n$BULLET_WITH_TAB$ @health_track_damage_icon! [Concept('POD_superficial_damage', 'Поверхностный урон')|E] по #bold #TOOLTIP:GAME_TRAIT,wraith,[GetNullCharacter] @wraith_icon!#L призракам#!#!#! и #bold #TOOLTIP:GAME_TRAIT,spirit,[GetNullCharacter] @spirit_icon!#L духам#!#!#!, поскольку они бестелесны.\n$BULLET_WITH_TAB$#bold [GetTrait('bushi').GetName(GetNullCharacter)]#! получают #bold двойной урон#! из-за [Glossary('клановой слабости', 'glossary_clan_curse_tt')].\n$BULLET_WITH_TAB$Некоторые редкие достоинства дают #bold невосприимчивость#! к огню.\n\n#weak Древнейшее орудие человечества отгоняет тьму — в прямом и переносном смысле. Даже крестьянин может защититься от чудовищ, размахивая факелом.#!"

 game_concept_cold_damage: "Урон от холода"
 game_concept_cold_damage_icon: "@pod_combat_cold_icon!"
 game_concept_cold_damage_short: "#L;color:{0.55,0.85,1.00} Холод#!"
 game_concept_cold_damage_short_with_icon: "$game_concept_cold_damage_icon$$game_concept_cold_damage_short$"
 game_concept_cold_damage_desc: "$BULLET_WITH_TAB$ @health_track_aggravated_damage_icon! [Concept('POD_aggravated_damage', 'Серьёзный урон')|E] по #bold #TOOLTIP:GAME_TRAIT,mortal,[GetNullCharacter] @mortal_icon!#L смертным#!#!#!: их плоть не выдерживает лютого холода.\n$BULLET_WITH_TAB$ @health_track_damage_icon! [Concept('POD_superficial_damage', 'Поверхностный урон')|E] по другим [Concept('splats', 'видам')|E].\n$BULLET_WITH_TAB$Нет дополнительных множителей урона или невосприимчивости.\n\n#weak Эта стихия особенно тяжело поражает смертных, но даже нежить не защищена от острых кристаллов льда, разрывающих плоть.#!"

 game_concept_lightning_damage: "Урон от молнии"
 game_concept_lightning_damage_icon: "@pod_combat_lightning_icon!"
 game_concept_lightning_damage_short: "#L;color:{1.00,0.95,0.35} Молния#!"
 game_concept_lightning_damage_short_with_icon: "$game_concept_lightning_damage_icon$$game_concept_lightning_damage_short$"
 game_concept_lightning_damage_desc: "$BULLET_WITH_TAB$ @health_track_aggravated_damage_icon! [Concept('POD_aggravated_damage', 'Серьёзный урон')|E] по #bold всем [Concept('splat', 'видам')|E]#!. Живая плоть, мёртвая плоть и духовная материя одинаково проводят ток.\n$BULLET_WITH_TAB$Нет дополнительных множителей урона или невосприимчивости.\n\n#weak Любимое оружие Сусаноо, бога Бурь. Сверхъестественная молния или обычная — ничто не может противостоять её разрушительной силе.#!"

 game_concept_sun_damage: "Урон от солнечного света"
 game_concept_sun_damage_icon: "@pod_combat_sun_icon!"
 game_concept_sun_damage_short: "#L;color:{1.00,0.92,0.50} Солнечный свет#!"
 game_concept_sun_damage_short_with_icon: "$game_concept_sun_damage_icon$$game_concept_sun_damage_short$"
 game_concept_sun_damage_desc: "$BULLET_WITH_TAB$ @health_track_aggravated_damage_icon! [Concept('POD_aggravated_damage', 'Серьёзный урон')|E] по #bold #TOOLTIP:GAME_TRAIT,vampire,[GetNullCharacter] @vampire_icon!#L вампирам#!#!#!, #bold #TOOLTIP:GAME_TRAIT,abomination,[GetNullCharacter] @abomination_icon!#L мерзостям#!#!#! и #bold #TOOLTIP:GAME_TRAIT,kueijin,[GetNullCharacter] @kueijin_icon!#L куэй-дзин#!#!#! — проклятых солнцем. Некоторые [Glossary('дхармы','podgloss.dharma')] [GetTrait('kueijin').GetName(GetNullCharacter)|l] переносят его как поверхностный урон.\n$BULLET_WITH_TAB$Другие [Concept('splats', 'виды')|E] #bold невосприимчивы#!: солнечный свет не ранит живых и тех, кто не проклят.\n$BULLET_WITH_TAB$#bold #TOOLTIP:GAME_TRAIT,setite,[GetNullCharacter] #L Сетиты#!#! и [GetTrait('bushi').GetName(GetNullCharacter)|l]#! получают #bold двойной урон#! из-за [Glossary('клановой слабости', 'glossary_clan_curse_tt')].\n\n#weak Солнце разносит Божье тепло по всему творению. Как же уместно, что проклятые им больше не могут его принять.#!"

 game_concept_silver_damage: "Урон от серебра"
 game_concept_silver_damage_icon: "@pod_combat_silver_icon!"
 game_concept_silver_damage_short: "#L;color:{0.85,0.85,0.95} Серебро#!"
 game_concept_silver_damage_short_with_icon: "$game_concept_silver_damage_icon$$game_concept_silver_damage_short$"
 game_concept_silver_damage_desc: "$BULLET_WITH_TAB$ @health_track_aggravated_damage_icon! [Concept('POD_aggravated_damage', 'Серьёзный урон')|E] по #bold #TOOLTIP:GAME_TRAIT,werewolf,[GetNullCharacter] @werewolf_icon!#L вервольфам#!#!#! и большинству других #bold [Glossary('фера', 'glossary_fera_tt')]#!: их регенерация отказывает при ранениях #italic «металлом [Glossary('Луны', 'glossary_luna_tt')]»#!.\n$BULLET_WITH_TAB$ @health_track_damage_icon! [Concept('POD_superficial_damage', 'Поверхностный урон')|E] по другим [Concept('splats', 'видам')|E].\n$BULLET_WITH_TAB$Нет дополнительных множителей урона или невосприимчивости.\n\n#weak Серебряное оружие может уравнять шансы против оборотня, но не обольщайтесь: даже без регенерации они остаются величайшими машинами убийства Геи.#!"

 game_concept_gold_damage: "Урон от золота"
 game_concept_gold_damage_icon: "@pod_combat_gold_icon!"
 game_concept_gold_damage_short: "#L;color:{1.00,0.75,0.20} Золото#!"
 game_concept_gold_damage_short_with_icon: "$game_concept_gold_damage_icon$$game_concept_gold_damage_short$"
 game_concept_gold_damage_desc: "$BULLET_WITH_TAB$ @health_track_aggravated_damage_icon! [Concept('POD_aggravated_damage', 'Серьёзный урон')|E] по #bold #TOOLTIP:GAME_TRAIT,mokole,[GetNullCharacter] @mokole_icon!#L моколе#!#!#! и #bold #TOOLTIP:GAME_TRAIT,corax,[GetNullCharacter] @corax_icon!#L кораксам#!#!#!: только они уязвимы к солнечному металлу.\n$BULLET_WITH_TAB$ @health_track_damage_icon! [Concept('POD_superficial_damage', 'Поверхностный урон')|E] по другим [Concept('splats', 'видам')|E].\n$BULLET_WITH_TAB$Нет дополнительных множителей урона или невосприимчивости.\n\n#weak Моколе тщательно скрывают свою слабость перед металлом Гелиоса. Им остаётся лишь надеяться, что болтливые кораксы поступают так же.#!"

 game_concept_holy_damage: "Святой урон"
 game_concept_holy_damage_icon: "@pod_combat_holy_icon!"
 game_concept_holy_damage_short: "#L;color:{1.00,0.95,0.65} Святость#!"
 game_concept_holy_damage_short_with_icon: "$game_concept_holy_damage_icon$$game_concept_holy_damage_short$"
 game_concept_holy_damage_desc: "$BULLET_WITH_TAB$ @health_track_aggravated_damage_icon! [Concept('POD_aggravated_damage', 'Серьёзный урон')|E] по #bold #TOOLTIP:GAME_TRAIT,vampire,[GetNullCharacter] @vampire_icon!#L вампирам#!#!#!, #bold #TOOLTIP:GAME_TRAIT,abomination,[GetNullCharacter] @abomination_icon!#L мерзостям#!#!#!, #bold #TOOLTIP:GAME_TRAIT,demon,[GetNullCharacter] @demon_icon!#L демонам#!#!#!, #bold #TOOLTIP:GAME_TRAIT,kueijin,[GetNullCharacter] @kueijin_icon!#L куэй-дзин#!#!#!, #bold #TOOLTIP:GAME_TRAIT,wraith,[GetNullCharacter] @wraith_icon!#L призракам#!#!#! и #bold #TOOLTIP:GAME_TRAIT,fae,[GetNullCharacter] @fae_icon!#L феям#!#!#!: они отшатываются от проявлений [Glossary('истинной веры','game_concept_true_faith_desc')].\n$BULLET_WITH_TAB$ @health_track_damage_icon! [Concept('POD_superficial_damage', 'Поверхностный урон')|E] по #bold #TOOLTIP:GAME_TRAIT,changeling,[GetNullCharacter] @changeling_icon!#L подменышам#!#!#!.\n$BULLET_WITH_TAB$Другие [Concept('splats', 'виды')|E] #bold невосприимчивы#!.\n\n#weak Вот, имя Господа идёт издали, горит гнев Его, и пламя Его сильно; уста Его исполнены негодования, и язык Его как огонь поядающий.#!" # Isaiah 30:27 KJV

 game_concept_poison_damage: "Урон от яда"
 game_concept_poison_damage_icon: "@pod_combat_poison_icon!"
 game_concept_poison_damage_short: "#L;color:{0.55,0.80,0.30} Яд#!"
 game_concept_poison_damage_short_with_icon: "$game_concept_poison_damage_icon$$game_concept_poison_damage_short$"
 game_concept_poison_damage_desc: "$BULLET_WITH_TAB$ @health_track_aggravated_damage_icon! [Concept('POD_aggravated_damage', 'Серьёзный урон')|E] по #bold #TOOLTIP:GAME_TRAIT,mortal,[GetNullCharacter] @mortal_icon!#L смертным#!#!#!: яд разлагает их живую плоть.\n$BULLET_WITH_TAB$#bold #TOOLTIP:GAME_TRAIT,vampire,[GetNullCharacter] @vampire_icon!#L Вампиры#!#!#! и #bold #TOOLTIP:GAME_TRAIT,kueijin,[GetNullCharacter] @kueijin_icon!#L куэй-дзин#!#!#! #bold невосприимчивы#!: у нежити нет живого тела, которое можно отравить.\n$BULLET_WITH_TAB$ @health_track_damage_icon! [Concept('POD_superficial_damage', 'Поверхностный урон')|E] по другим [Concept('splats', 'видам')|E].\n\n#weak Излюбленное оружие госпожи Юл, маэльджина Токсинов. Его часто клеймят орудием предателей и трусов. Но что толку в чести, когда на кону ваша жизнь?#!"

 game_concept_cold_iron_damage: "Урон от холодного железа"
 game_concept_cold_iron_damage_icon: "@pod_combat_cold_iron_icon!"
 game_concept_cold_iron_damage_short: "#L;color:{0.65,0.70,0.78} Холодное железо#!"
 game_concept_cold_iron_damage_short_with_icon: "$game_concept_cold_iron_damage_icon$$game_concept_cold_iron_damage_short$"
 game_concept_cold_iron_damage_desc: "$BULLET_WITH_TAB$ @health_track_aggravated_damage_icon! [Concept('POD_aggravated_damage', 'Серьёзный урон')|E] по #bold #TOOLTIP:GAME_TRAIT,fae,[GetNullCharacter] @fae_icon!#L феям#!#!#! и #bold #TOOLTIP:GAME_TRAIT,changeling,[GetNullCharacter] @changeling_icon!#L подменышам#!#!#!: [Concept('banality', 'банальность')|E] этого металла оставляет на них страшные дымящиеся раны.\n$BULLET_WITH_TAB$ @health_track_damage_icon! [Concept('POD_superficial_damage', 'Поверхностный урон')|E] по другим [Concept('splats', 'видам')|E].\n$BULLET_WITH_TAB$Нет дополнительных множителей урона или невосприимчивости.\n\n#weak Оружие, изготовленное старинным способом из кованого железа. Оно тяжелее и хрупче стали, но именно эта примитивность способна погубить душу феи.#!"



