 pod_combat_log_empty: "#italic Ждёт вашей команды.#!"


 ##############################
 ###### COMBAT LOG - RESULT TEXT
 ##############################
 # Result amounts are captured on the log entry. See COMBAT_REFERENCE.info section 4.
 pod_combat_log_result_text_hp_damage: "#bold;N -[entry.MakeScope.Var('damage').GetValue|0]#! [POD_superficial_box]"
 pod_combat_log_result_text_hp_damage_aggravated: "#bold;N -[entry.MakeScope.Var('damage').GetValue|0]#! [POD_aggravated_box]"
 pod_combat_log_result_text_hp_damage_partial_soak: "#bold;N -[entry.MakeScope.Var('damage').GetValue|0]#! [POD_superficial_box] #weak;italic [entry.MakeScope.Var('soaked_count').GetValue|0] поглощено#!"
 pod_combat_log_result_text_hp_damage_aggravated_partial_soak: "#bold;N -[entry.MakeScope.Var('damage').GetValue|0]#! [POD_aggravated_box] #weak;italic [entry.MakeScope.Var('soaked_count').GetValue|0] поглощено#!"
 pod_combat_log_result_text_guard_blocked: "#bold Заблокировано#!"
 pod_combat_log_result_text_soaked: "#bold Поглощено#!"
 pod_combat_log_result_text_immune: "#bold Невосприимчивость#!"
 pod_combat_log_result_text_missed: "#bold Промах#!"
 pod_combat_log_result_text_dodged: "#bold Уклонение#!"
 pod_combat_log_result_text_stealthed: "#bold Скрытность#!"
