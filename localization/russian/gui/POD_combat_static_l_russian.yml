 pod_combat_configure_moves_tt: "Открыть редактор набора [Concept('pod_combat_move', 'боевых приёмов')|E]: здесь можно выбрать до [EmptyScope.ScriptValue('pod_combat_max_equipped')|V0] приёмов для использования в @pod_combat_encounter_icon![Concept('pod_combat_encounters', 'боевых столкновениях')|E]."
