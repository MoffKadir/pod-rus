 pod_combat.0001.t: "Обзор боевой системы"
 pod_combat.0001.desc: "@pod_combat_encounter_icon![Concept('pod_combat_encounters', 'Боевые столкновения')|E] проходят пошагово: каждый боец тратит [Concept('pod_combat_action_points', 'очки действий')|E] на [Concept('pod_combat_moves', 'боевые приёмы')|E], а вы выбираете из заранее подготовленного набора. Вы побеждаете, когда каждый враг [Concept('pod_combat_knocked_out', 'выбывает из боя')|E]. Если этого не произошло, вы проигрываете, как только ваш персонаж падёт, даже если союзники ещё сражаются. Каждая синяя надпись в окне боя снабжена подсказкой при наведении — пользуйтесь ими, если нужно освежить память.\n\nВыберите тему ниже, чтобы узнать подробности. Это меню можно вновь открыть кнопкой #bold Справка#! в любой момент."
