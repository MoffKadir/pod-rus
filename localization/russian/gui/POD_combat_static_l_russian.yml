 pod_combat_auto_resolve: "Автоматический исход"
 # Keep wounds qualitative: the damage and soak rolls have not happened yet.
 pod_combat_auto_resolve_desc: "Пропустить оставшуюся часть боя. Победитель определяется сравнением доблести.\n\nВ заключительной схватке каждый, кто ещё держится на ногах, рискует получить рану. Тяжесть зависит от исхода: явный победитель уйдёт почти невредимым, проигравшей стороне достанется сильнее всего. На тренировочные поединки это не распространяется.[GetPlayer.Custom('PODCombatAutoResolveVerdict')]"
 pod_combat_auto_resolve_forced_loss_tt: "\n\n@warning_icon!#X Ваша сторона не способна причинить вред бестелесному духу. Автоматический исход приведёт к поражению, а ваши люди понесут самые тяжёлые последствия.#!"
 pod_combat_auto_resolve_forced_win_tt: "\n\n#P Враги не способны причинить вред вашей бестелесной форме, поэтому автоматический исход принесёт вам победу.#!"
 pod_combat_help_button: "Справка"
 pod_combat_help_tooltip: "Открывает обзор боевой системы, чтобы получить краткую информацию о правилах."
 pod_combat_allies_label: "СОЮЗНИКИ"
 pod_combat_enemies_label: "ВРАГИ"

