 POD_combat_move_fae_stratus_flight_desc: "[PODCombatMoveDesc('POD_combat_move_fae_stratus_flight')]"
 POD_combat_move_fae_stratus_flight_tooltip: "#weak;italic Ответь на загадку: как сражаться с пустотой? Нет, это не вопрос с подвохом — мне и правда интересно. Скажи, когда поймёшь. Я слишком много болтаю?#!"
 POD_combat_move_fae_stratus_conceal_confuse: "@fae_icon!Скрыть/запутать"
 POD_combat_move_fae_stratus_conceal_confuse_desc: "[PODCombatMoveDesc('POD_combat_move_fae_stratus_conceal_confuse')]"
 POD_combat_move_fae_stratus_conceal_confuse_tooltip: "#weak;italic Ох, что это там?#!"

 ######### Inanimae Sliver Verdage
 POD_combat_move_fae_verdage_solarium: "@fae_icon!Соларий"
 POD_combat_move_fae_verdage_solarium_desc: "[PODCombatMoveDesc('POD_combat_move_fae_verdage_solarium')]"
 POD_combat_move_fae_verdage_solarium_tooltip: "#weak;italic Вы грезите о жизни, и местная растительность бурно разрастается, мешая вашему противнику.#!"
 POD_combat_move_fae_verdage_coalesce: "@fae_icon!Объединение"
 POD_combat_move_fae_verdage_coalesce_desc: "[PODCombatMoveDesc('POD_combat_move_fae_verdage_coalesce')]"
 POD_combat_move_fae_verdage_coalesce_tooltip: "#weak;italic При правильном шепоте дерево превратится в броню, и дерево станет твердым, как сталь.#!"

 ######### Hekau Alchemy
 POD_combat_move_mummy_alchemy_cloud_of_smoke: "@mummy_icon!Облако дыма"
 POD_combat_move_mummy_alchemy_cloud_of_smoke_desc: "[PODCombatMoveDesc('POD_combat_move_mummy_alchemy_cloud_of_smoke')]"
 POD_combat_move_mummy_alchemy_cloud_of_smoke_tooltip: "#weak;italic Простой трюк для мастера-алхимика, но слепой враг намного слабее.#!"
 POD_combat_move_mummy_alchemy_dangerous_poison: "@mummy_icon!Опасный яд"
 POD_combat_move_mummy_alchemy_dangerous_poison_desc: "[PODCombatMoveDesc('POD_combat_move_mummy_alchemy_dangerous_poison')]"
 POD_combat_move_mummy_alchemy_dangerous_poison_tooltip: "#weak;italic Жало скорпиона в простой смеси.#!"
 POD_combat_move_mummy_alchemy_potion_of_valor: "@mummy_icon!Зелье доблести"
 POD_combat_move_mummy_alchemy_potion_of_valor_desc: "[PODCombatMoveDesc('POD_combat_move_mummy_alchemy_potion_of_valor')]"
 POD_combat_move_mummy_alchemy_potion_of_valor_tooltip: "#weak;italic Настоящим героям не нужны добавки. Но их также трудно найти в наши дни.#!"
 POD_combat_move_mummy_alchemy_potent_tonic: "@mummy_icon!Мощный отвар"
 POD_combat_move_mummy_alchemy_potent_tonic_desc: "[PODCombatMoveDesc('POD_combat_move_mummy_alchemy_potent_tonic')]"
 POD_combat_move_mummy_alchemy_potent_tonic_tooltip: "#weak;italic Бальзам алхимического исцеления, унаследованный от величайших умов, сделавших возможным воскрешение.#!"
 POD_combat_move_mummy_alchemy_vile_body: "@mummy_icon!Зелье жалкого тела"
 POD_combat_move_mummy_alchemy_vile_body_desc: "[PODCombatMoveDesc('POD_combat_move_mummy_alchemy_vile_body')]"
 POD_combat_move_mummy_alchemy_vile_body_tooltip: "#weak;italic Это зелье обнажает истинную природу мумии. Мерзость существа, глумящегося над естественным порядком вещей, поражает тех, кто осмеливается приблизиться.#!"

 ######### Hekau Amulets
 POD_combat_move_mummy_amulets_simple_ward: "@mummy_icon!Простой оберег"
 POD_combat_move_mummy_amulets_simple_ward_desc: "[PODCombatMoveDesc('POD_combat_move_mummy_amulets_simple_ward')]"
 POD_combat_move_mummy_amulets_simple_ward_tooltip: "#weak;italic Простое слово силы, которого достаточно, чтобы защитить вас от вреда, который они замышляют.#!"
 POD_combat_move_mummy_amulets_veil_of_amaunet: "@mummy_icon!Вуаль Амунет"
 POD_combat_move_mummy_amulets_veil_of_amaunet_desc: "[PODCombatMoveDesc('POD_combat_move_mummy_amulets_veil_of_amaunet')]"
 POD_combat_move_mummy_amulets_veil_of_amaunet_tooltip: "#weak;italic Глаз изначальной богини защищает вас от взглядов неверующих.#!"
 POD_combat_move_mummy_amulets_wrappings_imhotep: "@mummy_icon!Пелены Имхотепа"
 POD_combat_move_mummy_amulets_wrappings_imhotep_desc: "[PODCombatMoveDesc('POD_combat_move_mummy_amulets_wrappings_imhotep')]"
 POD_combat_move_mummy_amulets_wrappings_imhotep_tooltip: "#weak;italic Мудрейшим людям в истории пришлось немало потрудиться над мумификацией. Даже малая доля их силы велика сама по себе.#!"
 POD_combat_move_mummy_amulets_eye_of_sekhmet: "@mummy_icon!Око Сахмет"
 POD_combat_move_mummy_amulets_eye_of_sekhmet_desc: "[PODCombatMoveDesc('POD_combat_move_mummy_amulets_eye_of_sekhmet')]"
 POD_combat_move_mummy_amulets_eye_of_sekhmet_tooltip: "#weak;italic Богиня-воительница смотрит на них и находит их недостойными. Они боятся своей слабости.#!"
 POD_combat_move_mummy_amulets_buckle_of_isis: "@mummy_icon!Пряжка Исиды"
 POD_combat_move_mummy_amulets_buckle_of_isis_desc: "[PODCombatMoveDesc('POD_combat_move_mummy_amulets_buckle_of_isis')]"
 POD_combat_move_mummy_amulets_buckle_of_isis_tooltip: "#weak;italic Мать волшебства не имела себе равных. Простое упоминание ее имени приведет к подчинению жалких сверхъестественных существ современности.#!"

 ######### Hekau Celestial
 POD_combat_move_mummy_celestial_book_of_thoth: "@mummy_icon!Книга Тота"
 POD_combat_move_mummy_celestial_book_of_thoth_desc: "[PODCombatMoveDesc('POD_combat_move_mummy_celestial_book_of_thoth')]"
 POD_combat_move_mummy_celestial_book_of_thoth_tooltip: "#weak;italic Тот, самый мудрый, знал всё. Даже понимание части его знаний — огромное преимущество в бою.#!"
 POD_combat_move_mummy_celestial_sahu_ra: "@mummy_icon!Саху-Ра"
 POD_combat_move_mummy_celestial_sahu_ra_desc: "[PODCombatMoveDesc('POD_combat_move_mummy_celestial_sahu_ra')]"
 POD_combat_move_mummy_celestial_sahu_ra_tooltip: "#weak;italic Всемогущему Ра даже не нужно смотреть на них сверху вниз. Одно его сияние сжигает тех, кто прячется в тени.#!"
 POD_combat_move_mummy_celestial_ras_awakening: "@mummy_icon!Пробуждение Ра"
 POD_combat_move_mummy_celestial_ras_awakening_desc: "[PODCombatMoveDesc('POD_combat_move_mummy_celestial_ras_awakening')]"
 POD_combat_move_mummy_celestial_ras_awakening_tooltip: "#weak;italic Бог богов благосклонно смотрит на своих воинов, даже спустя тысячелетия после того, как неблагодарные смертные забыли его.#!"
 POD_combat_move_mummy_celestial_call_the_stars: "@mummy_icon!Зов звёзд"
 POD_combat_move_mummy_celestial_call_the_stars_desc: "[PODCombatMoveDesc('POD_combat_move_mummy_celestial_call_the_stars')]"
 POD_combat_move_mummy_celestial_call_the_stars_tooltip: "#weak;italic В былые века наши мудрецы взирали на звёзды с восхищением. Напомним нынешним неверующим, почему.#!"
 POD_combat_move_mummy_celestial_sandstorm: "@mummy_icon!Песчаная буря"
 POD_combat_move_mummy_celestial_sandstorm_desc: "[PODCombatMoveDesc('POD_combat_move_mummy_celestial_sandstorm')]"
 POD_combat_move_mummy_celestial_sandstorm_tooltip: "#weak;italic Что они могут сделать, когда на них нападает золотая кровь самой пустыни? Ничего, кроме жалоб, что оно проникает повсюду.#!"

 ######### Hekau Effigy
 POD_combat_move_mummy_effigy_false_door: "@mummy_icon!Ложная дверь"
 POD_combat_move_mummy_effigy_false_door_desc: "[PODCombatMoveDesc('POD_combat_move_mummy_effigy_false_door')]"
 POD_combat_move_mummy_effigy_false_door_tooltip: "#weak;italic Нынешние маги перемещаются по полю боя через порталы. Жалкое подобие великолепия сияющей золотой двери, внезапно возникающей и ждущей вашего приказа открыться.#!"
 POD_combat_move_mummy_effigy_command_complex_implement: "@mummy_icon!Выполнение командного приказа"
 POD_combat_move_mummy_effigy_command_complex_implement_desc: "[PODCombatMoveDesc('POD_combat_move_mummy_effigy_command_complex_implement')]"
 POD_combat_move_mummy_effigy_command_complex_implement_tooltip: "#weak;italic Стражи гробниц вашего народа были гораздо более сложными, чем сегодняшние мелкие устройства. Вам не нужен учебник.#!"
 POD_combat_move_mummy_effigy_reflected_strike: "@mummy_icon!Отраженный удар"
 POD_combat_move_mummy_effigy_reflected_strike_desc: "[PODCombatMoveDesc('POD_combat_move_mummy_effigy_reflected_strike')]"
 POD_combat_move_mummy_effigy_reflected_strike_tooltip: "#weak;italic Мумия связана с двумя мирами, не принадлежа ни мёртвым, ни живым. Истинно мудрый знает, как при необходимости ударить по обоим сразу.#!"
 POD_combat_move_mummy_effigy_living_bond: "@mummy_icon!Живые узы судьбы"
 POD_combat_move_mummy_effigy_living_bond_desc: "[PODCombatMoveDesc('POD_combat_move_mummy_effigy_living_bond')]"
 POD_combat_move_mummy_effigy_living_bond_tooltip: "#weak;italic Судьба человека записана в миг его рождения. До того, как вы сковали его собственной судьбой, свободы у него было не больше.#!"

 ######### Hekau Necromancy
 POD_combat_move_mummy_necromancy_deaths_shroud: "@mummy_icon!Завеса смерти"
 POD_combat_move_mummy_necromancy_deaths_shroud_desc: "[PODCombatMoveDesc('POD_combat_move_mummy_necromancy_deaths_shroud')]"
 POD_combat_move_mummy_necromancy_deaths_shroud_tooltip: "#weak;italic Такова сила смерти. Медленная, мучительная неподвижность — лишь прелюдия к тихому финалу.#!"
 POD_combat_move_mummy_necromancy_banish_dead: "@mummy_icon!Изгнание мертвых"
 POD_combat_move_mummy_necromancy_banish_dead_desc: "[PODCombatMoveDesc('POD_combat_move_mummy_necromancy_banish_dead')]"
 POD_combat_move_mummy_necromancy_banish_dead_tooltip: "#weak;italic Мертвые здесь не имеют власти. Кроме вас, конечно.#!"
 POD_combat_move_mummy_necromancy_deaths_hand: "@mummy_icon!Рука смерти"
 POD_combat_move_mummy_necromancy_deaths_hand_desc: "[PODCombatMoveDesc('POD_combat_move_mummy_necromancy_deaths_hand')]"
 POD_combat_move_mummy_necromancy_deaths_hand_tooltip: "#weak;italic На миг мумия отбрасывает подобие жизни, дарованное заклинанием Жизни. Холодные костлявые руки касаются врага, обнажая гротескный ужас её существования.#!"
 POD_combat_move_mummy_necromancy_khaibits_embrace: "@mummy_icon!Объятия хайбита"
 POD_combat_move_mummy_necromancy_khaibits_embrace_desc: "[PODCombatMoveDesc('POD_combat_move_mummy_necromancy_khaibits_embrace')]"
 POD_combat_move_mummy_necromancy_khaibits_embrace_tooltip: "#weak;italic Само присутствие души мумии замедляет ход битвы, как будто сама реальность была озадачена этим анахроничным существом.#!"
 POD_combat_move_mummy_necromancy_scouring_oblivion: "@mummy_icon!Очищающее Забвение"
 POD_combat_move_mummy_necromancy_scouring_oblivion_desc: "[PODCombatMoveDesc('POD_combat_move_mummy_necromancy_scouring_oblivion')]"
 POD_combat_move_mummy_necromancy_scouring_oblivion_tooltip: "#weak;italic Это существо несёт смерть. Оно никогда не ест, никогда не спит и никогда не остановится.#!"

 ######### Hekau Nomenclature
 POD_combat_move_mummy_nomenclature_asking_trees: "@mummy_icon!Проречение древа"
 POD_combat_move_mummy_nomenclature_asking_trees_desc: "[PODCombatMoveDesc('POD_combat_move_mummy_nomenclature_asking_trees')]"
 POD_combat_move_mummy_nomenclature_asking_trees_tooltip: "#weak;italic У дикой природы простые истинные имена. Подчинить её можно лишь отчасти, но даже это способно удивить на поле боя.#!"
 POD_combat_move_mummy_nomenclature_mend_flesh: "@mummy_icon!Ваяние плоти"
 POD_combat_move_mummy_nomenclature_mend_flesh_desc: "[PODCombatMoveDesc('POD_combat_move_mummy_nomenclature_mend_flesh')]"
 POD_combat_move_mummy_nomenclature_mend_flesh_tooltip: "#weak;italic Раны — лишь повреждённый первозданный узор. Истинный мастер имён одной волей возвращает ему первоначальную форму.#!"
 POD_combat_move_mummy_nomenclature_command_thought: "@mummy_icon!Приказная мысль"
 POD_combat_move_mummy_nomenclature_command_thought_desc: "[PODCombatMoveDesc('POD_combat_move_mummy_nomenclature_command_thought')]"
 POD_combat_move_mummy_nomenclature_command_thought_tooltip: "#weak;italic Для этого эффекта некоторые ученики любят размахивать руками перед жертвой. Настоящему мастеру достаточно произнести приказ.#!"
 POD_combat_move_mummy_nomenclature_bodys_destruction: "@mummy_icon!Имя разрушения тела"
 POD_combat_move_mummy_nomenclature_bodys_destruction_desc: "[PODCombatMoveDesc('POD_combat_move_mummy_nomenclature_bodys_destruction')]"
 POD_combat_move_mummy_nomenclature_bodys_destruction_tooltip: "#weak;italic Одно из самых устрашающих умений мумии: произнеся имя части тела, она возвращает её к первозданной форме. Ведь прах должен стать прахом.#!"
 POD_combat_move_mummy_nomenclature_whispers_body: "@mummy_icon!Шёпоты тела"
 POD_combat_move_mummy_nomenclature_whispers_body_desc: "[PODCombatMoveDesc('POD_combat_move_mummy_nomenclature_whispers_body')]"
 POD_combat_move_mummy_nomenclature_whispers_body_tooltip: "#weak;italic Плоть податлива. Напевая истинные имена на множестве непонятных невеждам языков, мумия обращает собственное тело в живое оружие и доспехи.#!"

 ######### Hunter Generic
 POD_combat_move_hunter_silvered_bolt: "@supehunter_icon!Посеребрённый болт"
 POD_combat_move_hunter_silvered_bolt_desc: "[PODCombatMoveDesc('POD_combat_move_hunter_silvered_bolt')]"
 POD_combat_move_hunter_silvered_bolt_tooltip: "#weak;italic Дайте оборотню что-нибудь на память, прежде чем он разорвет вас на куски.#!"
 POD_combat_move_hunter_stake_attack: "@supehunter_icon!Удар колом"
 POD_combat_move_hunter_stake_attack_desc: "[PODCombatMoveDesc('POD_combat_move_hunter_stake_attack')]"
 POD_combat_move_hunter_stake_attack_tooltip: "#weak;italic Я знаю твою слабость, демон.#!"

 ######### Hunter Red
 POD_combat_move_hunter_red_sunstone: "@supehunter_icon!Солнечный камень"
 POD_combat_move_hunter_red_sunstone_desc: "[PODCombatMoveDesc('POD_combat_move_hunter_red_sunstone')]"
 POD_combat_move_hunter_red_sunstone_tooltip: "#weak;italic Опять говорил Иисус к народу и сказал им: Я свет миру; кто последует за Мною, тот не будет ходить во тьме, но будет иметь свет жизни.#!" # John 8:12 KJV

 ######### Hunter Acre
 POD_combat_move_hunter_acre_transfiguration: "@supehunter_icon!Преображение плоти"
 POD_combat_move_hunter_acre_transfiguration_desc: "[PODCombatMoveDesc('POD_combat_move_hunter_acre_transfiguration')]"
 POD_combat_move_hunter_acre_transfiguration_tooltip: "#weak;italic Очи у Него как пламень огненный, и ноги Его подобны халколивану, раскалённому в печи.#!" # Revelation 1:14-15 KJV
 POD_combat_move_hunter_acre_flight_of_angels: "@supehunter_icon!Полёт ангелов"
 POD_combat_move_hunter_acre_flight_of_angels_desc: "[PODCombatMoveDesc('POD_combat_move_hunter_acre_flight_of_angels')]"
 POD_combat_move_hunter_acre_flight_of_angels_tooltip: "#weak;italic А надеющиеся на Господа обновятся в силе: поднимут крылья, как орлы, потекут — и не устанут.#!" # Isaiah 40:31 KJV
 POD_combat_move_hunter_acre_auto_da_fe: "@supehunter_icon!Аутодафе"
 POD_combat_move_hunter_acre_auto_da_fe_desc: "[PODCombatMoveDesc('POD_combat_move_hunter_acre_auto_da_fe')]"
 POD_combat_move_hunter_acre_auto_da_fe_tooltip: "#weak;italic За то и Я начну поражать тебя опустошением за грехи твои.#!" # Micah 6:13 ESV

 ######### Hunter Sisters
 POD_combat_move_hunter_sisters_fiat_lux: "@supehunter_icon!Fiat Lux"
 POD_combat_move_hunter_sisters_fiat_lux_desc: "[PODCombatMoveDesc('POD_combat_move_hunter_sisters_fiat_lux')]"
 POD_combat_move_hunter_sisters_fiat_lux_tooltip: "#weak;italic И сказал Бог: да будет свет. И стал свет.#!" # Genesis 1:3 KJV
 POD_combat_move_hunter_sisters_chorale: "@supehunter_icon!Хор"
 POD_combat_move_hunter_sisters_chorale_desc: "[PODCombatMoveDesc('POD_combat_move_hunter_sisters_chorale')]"
 POD_combat_move_hunter_sisters_chorale_tooltip: "#weak;italic Приидите, воспоём Господу, воскликнем твердыне спасения нашего.#!" # Psalm 95:1 KJV
 POD_combat_move_hunter_sisters_oratorio: "@supehunter_icon!Оратория"
 POD_combat_move_hunter_sisters_oratorio_desc: "[PODCombatMoveDesc('POD_combat_move_hunter_sisters_oratorio')]"
 POD_combat_move_hunter_sisters_oratorio_tooltip: "#weak;italic А я буду воспевать силу Твою и с раннего утра провозглашать милость Твою, ибо Ты был мне защитою и убежищем в день бедствия моего.#!" # Psalm 59:16 KJV

 ######### Hunter Murnau
 POD_combat_move_hunter_murnau_mirror_of_evil: "@supehunter_icon!Зеркало зла"
 POD_combat_move_hunter_murnau_mirror_of_evil_desc: "[PODCombatMoveDesc('POD_combat_move_hunter_murnau_mirror_of_evil')]"
 POD_combat_move_hunter_murnau_mirror_of_evil_tooltip: "#weak;italic Но если вы кусаете и пожираете друг друга, то берегитесь, чтобы вы не были истреблены друг другом.#!" # Galatians 5:15 KJV
 POD_combat_move_hunter_murnau_arcana: "@supehunter_icon!Аркана"
 POD_combat_move_hunter_murnau_arcana_desc: "[PODCombatMoveDesc('POD_combat_move_hunter_murnau_arcana')]"
 POD_combat_move_hunter_murnau_arcana_tooltip: "#weak;italic Ибо наша брань не против крови и плоти, но против вышестоящих, против властей, против мироправителей тьмы века сего.#!" # Ephesians 6:12 KJV

 ######### Hunter Oculi
 POD_combat_move_hunter_oculi_heavenly_shepherd: "@supehunter_icon!Небесный пастырь"
 POD_combat_move_hunter_oculi_heavenly_shepherd_desc: "[PODCombatMoveDesc('POD_combat_move_hunter_oculi_heavenly_shepherd')]"
 POD_combat_move_hunter_oculi_heavenly_shepherd_tooltip: "#weak;italic Тогда Иисус сказал ему: «Потому что ты увидел Меня, ты поверил; блаженны те, кто не видел, но уверовал».#!" # John 20:29 NIV
 POD_combat_move_hunter_oculi_second_sight: "@supehunter_icon!Второе зрение"
 POD_combat_move_hunter_oculi_second_sight_desc: "[PODCombatMoveDesc('POD_combat_move_hunter_oculi_second_sight')]"
 POD_combat_move_hunter_oculi_second_sight_tooltip: "#weak;italic Возлюбленные, не всякому духу верьте, но испытывайте духов, от Бога ли они: потому что много лжепророков вышло в мир.#!" # 1 John 4:1 KJV
 POD_combat_move_hunter_oculi_water_to_wine: "@supehunter_icon!Воду в вино"
 POD_combat_move_hunter_oculi_water_to_wine_desc: "[PODCombatMoveDesc('POD_combat_move_hunter_oculi_water_to_wine')]"
 POD_combat_move_hunter_oculi_water_to_wine_tooltip: "#weak;italic Вот, Я Господь, Бог всякой плоти: есть ли что-нибудь трудное для Меня?#!" # Jeremiah 32:27 KJV

 ######### Theurgy Medicamenti
 POD_combat_move_theurgy_drive_back_pain: "@theurgist_icon!Отогнать боль"
 POD_combat_move_theurgy_drive_back_pain_desc: "[PODCombatMoveDesc('POD_combat_move_theurgy_drive_back_pain')]"
 POD_combat_move_theurgy_drive_back_pain_tooltip: "#weak;italic Теург знает, как сильно разум влияет на материю. Это не настоящее долговременное исцеление, но облегчить боль — первый шаг к выздоровлению.#!"
 POD_combat_move_theurgy_mend_deadly_wounds: "@theurgist_icon!Вылечить смертельные раны"
 POD_combat_move_theurgy_mend_deadly_wounds_desc: "[PODCombatMoveDesc('POD_combat_move_theurgy_mend_deadly_wounds')]"
 POD_combat_move_theurgy_mend_deadly_wounds_tooltip: "#weak;italic Некоторые называют это чудом. Мудрый теург не делает подобных заявлений, прекрасно зная возможные последствия.#!"

 ######### Theurgy Ignis
 POD_combat_move_theurgy_holy_fire: "@theurgist_icon!Святой огонь"
 POD_combat_move_theurgy_holy_fire_desc: "[PODCombatMoveDesc('POD_combat_move_theurgy_holy_fire')]"
 POD_combat_move_theurgy_holy_fire_tooltip: "#weak;italic Святой ли это огонь или его источник менее благороден? Пусть учёные мужи спорят, пока вы побеждаете на поле боя.#!"
 POD_combat_move_theurgy_holy_conflagration: "@theurgist_icon!Пожар священного огня"
 POD_combat_move_theurgy_holy_conflagration_desc: "[PODCombatMoveDesc('POD_combat_move_theurgy_holy_conflagration')]"
 POD_combat_move_theurgy_holy_conflagration_tooltip: "#weak;italic Есть время тонкостей и полумер. Сейчас не такой момент.#!"

 ######### Theurgy Geniorum
 POD_combat_move_theurgy_protective_sigil: "@theurgist_icon!Защитный знак"
 POD_combat_move_theurgy_protective_sigil_desc: "[PODCombatMoveDesc('POD_combat_move_theurgy_protective_sigil')]"
 POD_combat_move_theurgy_protective_sigil_tooltip: "#weak;italic Древние слова силы, заимствованные из традиций старше самого заклинателя, всё ещё достаточно весомы, чтобы остановить даже сверхъестественного противника.#!"

 ######### Theurgy Necromantiae
 POD_combat_move_theurgy_expel_restless_dead: "@theurgist_icon!Изгнать неупокоенных мёртвых"
 POD_combat_move_theurgy_expel_restless_dead_desc: "[PODCombatMoveDesc('POD_combat_move_theurgy_expel_restless_dead')]"
 POD_combat_move_theurgy_expel_restless_dead_tooltip: "#weak;italic Цель демона — не одержимый, а мы, наблюдатели. Он хочет заставить нас отчаяться, отвергнуть человечность, увидеть в себе лишь звериную мерзость и гниль — лишённую достоинства, уродливую, недостойную.#!"

 ######### Theurgy Oraculi
 POD_combat_move_theurgy_foreseen_assault: "@theurgist_icon!Предвиденное нападение"
 POD_combat_move_theurgy_foreseen_assault_desc: "[PODCombatMoveDesc('POD_combat_move_theurgy_foreseen_assault')]"
 POD_combat_move_theurgy_foreseen_assault_tooltip: "#weak;italic Древние оракулы были шарлатанами, язычниками худшего толка. Ваш пророческий дар явно исходит из высшего источника.#!"

 ######### True Faith
 POD_combat_move_truefaith_lay_on_hands: "@truefaith_icon!Возложение рук"
