 POD_combat_move_demon_healing_touch_tooltip: "#weak;italic Вы были первородным разрушением, но вы также были первозданным творением. Сама жизнь отвечает на ваш зов.#!"
 POD_combat_move_demon_preternatural_reflexes: "@demon_icon!Сверхъестественные рефлексы"
 POD_combat_move_demon_preternatural_reflexes_desc: "[PODCombatMoveDesc('POD_combat_move_demon_preternatural_reflexes')]"
 POD_combat_move_demon_preternatural_reflexes_tooltip: "#weak;italic Какой удар они могут нанести, которого вы ещё не видели за бесконечные годы своего существования?#!"
 POD_combat_move_demon_invisibility: "@demon_icon!Невидимость"
 POD_combat_move_demon_invisibility_desc: "[PODCombatMoveDesc('POD_combat_move_demon_invisibility')]"
 POD_combat_move_demon_invisibility_tooltip: "#weak;italic Их глаза никогда не были настроены на присутствие такого божественного существа.#!"
 POD_combat_move_demon_damage_immunity: "@demon_icon!Невосприимчивость к повреждениям"
 POD_combat_move_demon_damage_immunity_desc: "[PODCombatMoveDesc('POD_combat_move_demon_damage_immunity')]"
 POD_combat_move_demon_damage_immunity_tooltip: "#weak;italic Они надеялись сразить вас. Убедитесь, что они понимают правду.#!"
 POD_combat_move_demon_speed_of_thought: "@demon_icon!Скорость мысли"
 POD_combat_move_demon_speed_of_thought_desc: "[PODCombatMoveDesc('POD_combat_move_demon_speed_of_thought')]"
 POD_combat_move_demon_speed_of_thought_tooltip: "#weak;italic Время — всего лишь конструкция. Созданная вами конструкция.#!"
 POD_combat_move_demon_inhuman_strength: "@demon_icon!Нечеловеческая сила"
 POD_combat_move_demon_inhuman_strength_desc: "[PODCombatMoveDesc('POD_combat_move_demon_inhuman_strength')]"
 POD_combat_move_demon_inhuman_strength_tooltip: "#weak;italic Ваше предназначение — быть сильнейшим существом Мироздания. Даже части этой силы будет достаточно, чтобы закончить битву.#!"
 POD_combat_move_demon_celestial_radiance: "@demon_icon!Небесное сияние"
 POD_combat_move_demon_celestial_radiance_desc: "[PODCombatMoveDesc('POD_combat_move_demon_celestial_radiance')]"
 POD_combat_move_demon_celestial_radiance_tooltip: "#weak;italic Однокрылый ангел спускается на поле боя. Восхищайтесь и отчаивайтесь.#!"
 POD_combat_move_demon_lash_of_anguish: "@demon_icon!Мучительный удар"
 POD_combat_move_demon_lash_of_anguish_desc: "[PODCombatMoveDesc('POD_combat_move_demon_lash_of_anguish')]"
 POD_combat_move_demon_lash_of_anguish_tooltip: "#weak;italic Всего лишь малая доля тех мук, что вы пережили в Аду. Но и её хватит, чтобы свести их с ума.#!"

 ######### Lore of the World
 POD_combat_move_demon_manipulate_inertia: "@demon_icon!Манипулирование инерцией"
 POD_combat_move_demon_manipulate_inertia_desc: "[PODCombatMoveDesc('POD_combat_move_demon_manipulate_inertia')]"
 POD_combat_move_demon_manipulate_inertia_tooltip: "#weak;italic Когда-то сама ткань мира подчинялась вам. Разве жалкий закон физики может вам помешать?#!"
 POD_combat_move_demon_manipulate_cohesion: "@demon_icon!Манипулирование сцеплением"
 POD_combat_move_demon_manipulate_cohesion_desc: "[PODCombatMoveDesc('POD_combat_move_demon_manipulate_cohesion')]"
 POD_combat_move_demon_manipulate_cohesion_tooltip: "#weak;italic Вы однажды создали Творение. Вы можете его разрушить.#!"

 ######### Lore of Corruption
 POD_combat_move_demon_reality_tremors: "@demon_icon!Дрожь реальности"
 POD_combat_move_demon_reality_tremors_desc: "[PODCombatMoveDesc('POD_combat_move_demon_reality_tremors')]"
 POD_combat_move_demon_reality_tremors_tooltip: "#weak;italic Логике и разуму нет места на поле битвы, по которому вы идёте. Это всего лишь конструкции слабых умов, пытающихся понять Творение.#!"
 POD_combat_move_demon_wave_of_mutilation: "@demon_icon!Волна искажения"
 POD_combat_move_demon_wave_of_mutilation_desc: "[PODCombatMoveDesc('POD_combat_move_demon_wave_of_mutilation')]"
 POD_combat_move_demon_wave_of_mutilation_tooltip: "#weak;italic Они думают, что познали боль и мучения. Они ошибаются.#!"

 ######### Lore of the Herald
 POD_combat_move_demon_command_the_flame: "@demon_icon!Повелевание пламенем"
 POD_combat_move_demon_command_the_flame_desc: "[PODCombatMoveDesc('POD_combat_move_demon_command_the_flame')]"
 POD_combat_move_demon_command_the_flame_tooltip: "#weak;italic Огонь был инструментом, использованным для самого Творения. Для вас это так же естественно, как дыхание для этих слабых смертных.#!"
 POD_combat_move_demon_hand_of_faith: "@demon_icon!Длань веры"
 POD_combat_move_demon_hand_of_faith_desc: "[PODCombatMoveDesc('POD_combat_move_demon_hand_of_faith')]"
 POD_combat_move_demon_hand_of_faith_tooltip: "#weak;italic Вы отказываетесь принимать удары от столь низшего существа. И потому они вас не касаются.#!"

 ######### Lore of the Life-Bringer
 POD_combat_move_demon_cleanse: "@demon_icon!Очищение"
 POD_combat_move_demon_cleanse_desc: "[PODCombatMoveDesc('POD_combat_move_demon_cleanse')]"
 POD_combat_move_demon_cleanse_tooltip: "#weak;italic Их слабые тела для вас всего лишь глина. Ваше милосердие - их спасение.#!"
 POD_combat_move_demon_wall_of_air: "@demon_icon!Стена воздуха"
 POD_combat_move_demon_wall_of_air_desc: "[PODCombatMoveDesc('POD_combat_move_demon_wall_of_air')]"
 POD_combat_move_demon_wall_of_air_tooltip: "#weak;italic Крылья света уносят вас далеко от опасности.#!"

 ######### Lore of Creation
 POD_combat_move_demon_earth_meld: "@demon_icon!Слияние с землёй"
 POD_combat_move_demon_earth_meld_desc: "[PODCombatMoveDesc('POD_combat_move_demon_earth_meld')]"
 POD_combat_move_demon_earth_meld_tooltip: "#weak;italic Сама земля подчиняется вам. Ведь она помнит своего создателя.#!"
 POD_combat_move_demon_alter_path: "@demon_icon!Изменение пути"
 POD_combat_move_demon_alter_path_desc: "[PODCombatMoveDesc('POD_combat_move_demon_alter_path')]"
 POD_combat_move_demon_alter_path_tooltip: "#weak;italic Лабиринт реальности слишком сложен для их узкого ума.#!"

 ######### Lore of the Seer
 POD_combat_move_demon_foresee: "@demon_icon!Предвидение"
 POD_combat_move_demon_foresee_desc: "[PODCombatMoveDesc('POD_combat_move_demon_foresee')]"
 POD_combat_move_demon_foresee_tooltip: "#weak;italic Вы всё это видели. Даже мелочность Бога не сможет скрыть от вас будущее.#!"
 POD_combat_move_demon_illusion: "@demon_icon!Иллюзия"
 POD_combat_move_demon_illusion_desc: "[PODCombatMoveDesc('POD_combat_move_demon_illusion')]"
 POD_combat_move_demon_illusion_tooltip: "#weak;italic Это действительно иллюзия или их разум слишком мал, чтобы понять?#!"

 ######### Lore of Beauty
 POD_combat_move_demon_inspire: "@demon_icon!Вдохновение"
 POD_combat_move_demon_inspire_desc: "[PODCombatMoveDesc('POD_combat_move_demon_inspire')]"
 POD_combat_move_demon_inspire_tooltip: "#weak;italic Когда-то вам подчинялись целые ангельские легионы. Разве трудно после этого вдохновить одного носителя?#!"
 POD_combat_move_demon_command_the_storm: "@demon_icon!Повелевание бурей"
 POD_combat_move_demon_command_the_storm_desc: "[PODCombatMoveDesc('POD_combat_move_demon_command_the_storm')]"
 POD_combat_move_demon_command_the_storm_tooltip: "#weak;italic Смертные были правы, опасаясь небес. Божественный гнев всегда исходил свыше.#!"

 ######### Lore of the Living
 POD_combat_move_demon_manipulate_flesh: "@demon_icon!Манипулирование плотью"
 POD_combat_move_demon_manipulate_flesh_desc: "[PODCombatMoveDesc('POD_combat_move_demon_manipulate_flesh')]"
 POD_combat_move_demon_manipulate_flesh_tooltip: "#weak;italic Плоть так слаба, так хрупка, но она вам всё ещё нужна.#!"
 POD_combat_move_demon_command_the_wild: "@demon_icon!Повелевание природой"
 POD_combat_move_demon_command_the_wild_desc: "[PODCombatMoveDesc('POD_combat_move_demon_command_the_wild')]"
 POD_combat_move_demon_command_the_wild_tooltip: "#weak;italic Райский сад не был лишен шипов.#!"

 ######### Lore of the Ethereal
 POD_combat_move_demon_command_the_dead: "@demon_icon!Повелевание мёртвыми"
 POD_combat_move_demon_command_the_dead_desc: "[PODCombatMoveDesc('POD_combat_move_demon_command_the_dead')]"
 POD_combat_move_demon_command_the_dead_tooltip: "#weak;italic Когда-то призраки были в ведении вашего рода. С тех пор вы ещё сохранили над ними власть.#!"
 POD_combat_move_demon_extinguish_life: "@demon_icon!Погашение жизни"
 POD_combat_move_demon_extinguish_life_desc: "[PODCombatMoveDesc('POD_combat_move_demon_extinguish_life')]"
 POD_combat_move_demon_extinguish_life_tooltip: "#weak;italic Жнец — это не просто смертный миф. Это их подсознание помнит давний божественный долг вашего рода.#!"

 ######### Innate Kuei-jin
 POD_combat_move_kueijin_bite: "@kueijin_icon!Укус голодного мертвеца"
 POD_combat_move_kueijin_bite_desc: "[PODCombatMoveDesc('POD_combat_move_kueijin_bite')]"
 POD_combat_move_kueijin_bite_tooltip: "#weak;italic Не самый просветлённый способ сражаться, но порой действенность важнее изящества.#!"
 POD_combat_move_kueijin_chi_surge: "@kueijin_icon!Прилив ци"
 POD_combat_move_kueijin_chi_surge_desc: "[PODCombatMoveDesc('POD_combat_move_kueijin_chi_surge')]"
 POD_combat_move_kueijin_chi_surge_tooltip: "#weak;italic Внезапный всплеск ци для получения преимущества в критический момент, долг, который нужно выплатить позже.#!"
 POD_combat_move_kueijin_chi_mending: "@kueijin_icon!Исцеление ци"
 POD_combat_move_kueijin_chi_mending_desc: "[PODCombatMoveDesc('POD_combat_move_kueijin_chi_mending')]"
 POD_combat_move_kueijin_chi_mending_tooltip: "#weak;italic Сами энергии жизни исцеляют ваше мёртвое тело.#!"

 ######### Feng Shui
 POD_combat_move_kueijin_harmonious_wards: "@kueijin_icon!Гармоничная стена"
 POD_combat_move_kueijin_harmonious_wards_desc: "[PODCombatMoveDesc('POD_combat_move_kueijin_harmonious_wards')]"
 POD_combat_move_kueijin_harmonious_wards_tooltip: "#weak;italic Выбор поля боя – половина дела. Если это невозможно, вы всегда можете изменить его по своему вкусу.#!"
 POD_combat_move_kueijin_hand_of_darkness: "@kueijin_icon!Рука тьмы"
 POD_combat_move_kueijin_hand_of_darkness_desc: "[PODCombatMoveDesc('POD_combat_move_kueijin_hand_of_darkness')]"
 POD_combat_move_kueijin_hand_of_darkness_tooltip: "#weak;italic Удача не на их стороне. Винить им стоит лишь себя за неудачное решение сразиться с вами.#!"

 ######### Obligation
 POD_combat_move_kueijin_soul_bridge: "@kueijin_icon!Связь душ"
 POD_combat_move_kueijin_soul_bridge_desc: "[PODCombatMoveDesc('POD_combat_move_kueijin_soul_bridge')]"
 POD_combat_move_kueijin_soul_bridge_tooltip: "#weak;italic Хорошо, пусть страх и гнев поглотят тебя...#!"
 POD_combat_move_kueijin_voice_of_emperor: "@kueijin_icon!Глас императора"
 POD_combat_move_kueijin_voice_of_emperor_desc: "[PODCombatMoveDesc('POD_combat_move_kueijin_voice_of_emperor')]"
 POD_combat_move_kueijin_voice_of_emperor_tooltip: "#weak;italic Вы выстояли в самой преисподней, чтобы вернуться и достичь Сотни облаков. Кто они такие, чтобы осмелиться встать у вас на пути?#!"

 ######### Tapestry
 POD_combat_move_kueijin_chi_shaping: "@kueijin_icon!Формирование ци"
 POD_combat_move_kueijin_chi_shaping_desc: "[PODCombatMoveDesc('POD_combat_move_kueijin_chi_shaping')]"
 POD_combat_move_kueijin_chi_shaping_tooltip: "#weak;italic По вашей команде вырывается сама энергия земли, разрывая все на своем пути.#!"
 POD_combat_move_kueijin_ride_the_dragon: "@kueijin_icon!Оседлать дракона"
 POD_combat_move_kueijin_ride_the_dragon_desc: "[PODCombatMoveDesc('POD_combat_move_kueijin_ride_the_dragon')]"
 POD_combat_move_kueijin_ride_the_dragon_tooltip: "#weak;italic Вы всегда на шаг впереди. Они не смогут конкурировать с мастером линий ци.#!"

 ######### Prana
 POD_combat_move_kueijin_accentuate_chi: "@kueijin_icon!Усиление ци"
 POD_combat_move_kueijin_accentuate_chi_desc: "[PODCombatMoveDesc('POD_combat_move_kueijin_accentuate_chi')]"
 POD_combat_move_kueijin_accentuate_chi_tooltip: "#weak;italic Равновесие их тела восстанавливается благодаря вашему вмешательству, заживляя при этом синяки и раны.#!"
 POD_combat_move_kueijin_yin_nihilus: "@kueijin_icon!Облако Инь"
 POD_combat_move_kueijin_yin_nihilus_desc: "[PODCombatMoveDesc('POD_combat_move_kueijin_yin_nihilus')]"
 POD_combat_move_kueijin_yin_nihilus_tooltip: "#weak;italic Энергия смерти замедляет врага до предела, делая его уязвимым для вашего праведного натиска.#!"

 ######### Kiai
 POD_combat_move_kueijin_battle_cry: "@kueijin_icon!Боевой клич"
 POD_combat_move_kueijin_battle_cry_desc: "[PODCombatMoveDesc('POD_combat_move_kueijin_battle_cry')]"
 POD_combat_move_kueijin_battle_cry_tooltip: "#weak;italic Как банши из самой преисподней, ваш голос поражает их тело и душу.#!"
 POD_combat_move_kueijin_greater_ngilai: "@kueijin_icon!Большой Нгилай"
 POD_combat_move_kueijin_greater_ngilai_desc: "[PODCombatMoveDesc('POD_combat_move_kueijin_greater_ngilai')]"
 POD_combat_move_kueijin_greater_ngilai_tooltip: "#weak;italic Мужество и отвагу легко разрушить, столкнувшись с таким потусторонним криком, как этот.#!"

 ######### Tzu Wei
 POD_combat_move_kueijin_grand_dukes_theorem: "@kueijin_icon!Теорема великого князя"
 POD_combat_move_kueijin_grand_dukes_theorem_desc: "[PODCombatMoveDesc('POD_combat_move_kueijin_grand_dukes_theorem')]"
 POD_combat_move_kueijin_grand_dukes_theorem_tooltip: "#weak;italic Судьба - это всего лишь книга, которую нужно расшифровать. Вы знаете, что ваша судьба на этом не заканчивается.#!"
 POD_combat_move_kueijin_celestial_curse: "@kueijin_icon!Проклятие небес"
 POD_combat_move_kueijin_celestial_curse_desc: "[PODCombatMoveDesc('POD_combat_move_kueijin_celestial_curse')]"
 POD_combat_move_kueijin_celestial_curse_tooltip: "#weak;italic Их тщетной борьбе суждено закончиться здесь. Такова ваша воля.#!"

 ######### Devil Fist
 POD_combat_move_kueijin_infernal_might: "@kueijin_icon!Инфернальная мощь"
 POD_combat_move_kueijin_infernal_might_desc: "[PODCombatMoveDesc('POD_combat_move_kueijin_infernal_might')]"
 POD_combat_move_kueijin_infernal_might_tooltip: "#weak;italic Демон — ваш враг, но он тоже хочет выжить. Без угрызений совести позаимствуйте его силу для боя.#!"
 POD_combat_move_kueijin_devil_fist: "@kueijin_icon!Кулак дьявола"
 POD_combat_move_kueijin_devil_fist_desc: "[PODCombatMoveDesc('POD_combat_move_kueijin_devil_fist')]"
 POD_combat_move_kueijin_devil_fist_tooltip: "#weak;italic Демон - это ты без ограничений, морали и раскаяния. Это то, кем вы должны быть во время битвы.#!"

 ######### Black Wind
 POD_combat_move_kueijin_infernal_speed: "@kueijin_icon!Инфернальная скорость"
 POD_combat_move_kueijin_infernal_speed_desc: "[PODCombatMoveDesc('POD_combat_move_kueijin_infernal_speed')]"
 POD_combat_move_kueijin_infernal_speed_tooltip: "#weak;italic Вы сумели вырваться из самой преисподней. Обогнать этого врага — детская забава.#!"
 POD_combat_move_kueijin_black_wind: "@kueijin_icon!Чёрный ветер"
 POD_combat_move_kueijin_black_wind_desc: "[PODCombatMoveDesc('POD_combat_move_kueijin_black_wind')]"
 POD_combat_move_kueijin_black_wind_tooltip: "#weak;italic Всё, что вам нужно, — это один удар.#!"

 ######### Iron Mountain
 POD_combat_move_kueijin_infernal_fortitude: "@kueijin_icon!Инфернальная стойкость"
 POD_combat_move_kueijin_infernal_fortitude_desc: "[PODCombatMoveDesc('POD_combat_move_kueijin_infernal_fortitude')]"
 POD_combat_move_kueijin_infernal_fortitude_tooltip: "#weak;italic Демон пережил преисподнюю. Он поможет вам пережить и эту схватку.#!"
 POD_combat_move_kueijin_striking_the_fire: "@kueijin_icon!Разжигание огня"
 POD_combat_move_kueijin_striking_the_fire_desc: "[PODCombatMoveDesc('POD_combat_move_kueijin_striking_the_fire')]"
 POD_combat_move_kueijin_striking_the_fire_tooltip: "#weak;italic Само ваше существование доказывает вашу необычайную стойкость. Обратиться к ней — лишь естественное продолжение вашей сущности.#!"

 ######### Demon Regalia
 POD_combat_move_kueijin_infernal_glory: "@kueijin_icon!Инфернальная слава"
 POD_combat_move_kueijin_infernal_glory_desc: "[PODCombatMoveDesc('POD_combat_move_kueijin_infernal_glory')]"
 POD_combat_move_kueijin_infernal_glory_tooltip: "#weak;italic Ваша истинная форма — одновременно демон и вечный заступник. Слабый ум не может постичь такой дисбаланс.#!"
 POD_combat_move_kueijin_spiked_regalia: "@kueijin_icon!Шипастые регалии"
 POD_combat_move_kueijin_spiked_regalia_desc: "[PODCombatMoveDesc('POD_combat_move_kueijin_spiked_regalia')]"
 POD_combat_move_kueijin_spiked_regalia_tooltip: "#weak;italic У демона есть собственная воля, и он яростно бросается на тех, кто пытается навредить его невольному сосуду.#!"

 ######### Ash and Flames Shintai
 POD_combat_move_kueijin_fire_in_the_eye: "@kueijin_icon!Огонь в глазах"
 POD_combat_move_kueijin_fire_in_the_eye_desc: "[PODCombatMoveDesc('POD_combat_move_kueijin_fire_in_the_eye')]"
 POD_combat_move_kueijin_fire_in_the_eye_tooltip: "#weak;italic Сам вид нечестивого пламени невыносим для слабых.#!"
 POD_combat_move_kueijin_mantle_flame_emperor: "@kueijin_icon!Мантия Огненного императора"
 POD_combat_move_kueijin_mantle_flame_emperor_desc: "[PODCombatMoveDesc('POD_combat_move_kueijin_mantle_flame_emperor')]"
 POD_combat_move_kueijin_mantle_flame_emperor_tooltip: "#weak;italic Огненный император — одновременно мудрость и глупость. Его огонь — это проклятие, замаскированное под благословение.#!"

 ######### Blood Shintai
 POD_combat_move_kueijin_flow_like_blood: "@kueijin_icon!Поток крови"
 POD_combat_move_kueijin_flow_like_blood_desc: "[PODCombatMoveDesc('POD_combat_move_kueijin_flow_like_blood')]"
 POD_combat_move_kueijin_flow_like_blood_tooltip: "#weak;italic Более острая версия приёма «Поток воды».#!"
 POD_combat_move_kueijin_bloodlash: "@kueijin_icon!Кровавый удар"
 POD_combat_move_kueijin_bloodlash_desc: "[PODCombatMoveDesc('POD_combat_move_kueijin_bloodlash')]"
 POD_combat_move_kueijin_bloodlash_tooltip: "#weak;italic Мастер синтай Крови никогда не бывает безоружным. Собственная жизненная сущность — его самое смертоносное орудие.#!"

 ######### Bone Shintai
 POD_combat_move_kueijin_relentless_bone: "@kueijin_icon!Безжалостная кость"
 POD_combat_move_kueijin_relentless_bone_desc: "[PODCombatMoveDesc('POD_combat_move_kueijin_relentless_bone')]"
 POD_combat_move_kueijin_relentless_bone_tooltip: "#weak;italic Кости ломаются. По крайней мере, у ваших врагов: для себя вы давно решили эту проблему.#!"
 POD_combat_move_kueijin_skeletal_sculpting: "@kueijin_icon!Скелетная скульптура"
 POD_combat_move_kueijin_skeletal_sculpting_desc: "[PODCombatMoveDesc('POD_combat_move_kueijin_skeletal_sculpting')]"
 POD_combat_move_kueijin_skeletal_sculpting_tooltip: "#weak;italic Чужие плоть и кровь — лишь украшение. Вы скульптор, и сегодня ночью вам хочется устроить беспорядок.#!"

 ######### Devotion Shintai
 POD_combat_move_kueijin_flow_of_worship: "@kueijin_icon!Поток почитания"
 POD_combat_move_kueijin_flow_of_worship_desc: "[PODCombatMoveDesc('POD_combat_move_kueijin_flow_of_worship')]"
 POD_combat_move_kueijin_flow_of_worship_tooltip: "#weak;italic Как некогда ван-сянь, потерянный небесный защитник черпает силу в поклонении людей.#!"
 POD_combat_move_kueijin_touch_of_asura: "@kueijin_icon!Касание Асуры"
 POD_combat_move_kueijin_touch_of_asura_desc: "[PODCombatMoveDesc('POD_combat_move_kueijin_touch_of_asura')]"
 POD_combat_move_kueijin_touch_of_asura_tooltip: "#weak;italic Герои редко сражаются в одиночку. Только в идеальной командной работе можно победить самого сильного врага.#!"

 ######### Flesh Shintai
 POD_combat_move_kueijin_long_neck: "@kueijin_icon!Длинная шея"
 POD_combat_move_kueijin_long_neck_desc: "[PODCombatMoveDesc('POD_combat_move_kueijin_long_neck')]"
 POD_combat_move_kueijin_long_neck_tooltip: "#weak;italic Благодаря вашему полному контролю над своими конечностями ни один враг не останется вне досягаемости. Мастерство йоги не требуется.#!"
 POD_combat_move_kueijin_vital_command: "@kueijin_icon!Жизненный приказ"
 POD_combat_move_kueijin_vital_command_desc: "[PODCombatMoveDesc('POD_combat_move_kueijin_vital_command')]"
 POD_combat_move_kueijin_vital_command_tooltip: "#weak;italic Синтай Плоти требует дани. Помогая своим союзникам, вы восполняете дефицит собственным телом.#!"

 ######### Illusion Shintai
 POD_combat_move_kueijin_non_self: "@kueijin_icon!Отсутствие самосознания"
 POD_combat_move_kueijin_non_self_desc: "[PODCombatMoveDesc('POD_combat_move_kueijin_non_self')]"
 POD_combat_move_kueijin_non_self_tooltip: "#weak;italic Они не могут поразить то, что их разум отказывается признать.#!"
 POD_combat_move_kueijin_rakshasa_blade: "@kueijin_icon!Клинок ракшасы"
 POD_combat_move_kueijin_rakshasa_blade_desc: "[PODCombatMoveDesc('POD_combat_move_kueijin_rakshasa_blade')]"
 POD_combat_move_kueijin_rakshasa_blade_tooltip: "#weak;italic Истинный мастер синтай Иллюзий знает, что величайшая иллюзия – это та, которая перестает быть таковой.#!"

 ######### Jade Shintai
 POD_combat_move_kueijin_stand_dragons_back: "@kueijin_icon!Стоять на спине дракона"
 POD_combat_move_kueijin_stand_dragons_back_desc: "[PODCombatMoveDesc('POD_combat_move_kueijin_stand_dragons_back')]"
 POD_combat_move_kueijin_stand_dragons_back_tooltip: "#weak;italic Нефрит не так хрупок, как думают люди. Глубокая связь с землёй делает его прочнейшим из магических материалов.#!"
 POD_combat_move_kueijin_jade_mantle: "@kueijin_icon!Нефритовая мантия"
 POD_combat_move_kueijin_jade_mantle_desc: "[PODCombatMoveDesc('POD_combat_move_kueijin_jade_mantle')]"
 POD_combat_move_kueijin_jade_mantle_tooltip: "#weak;italic Нефрит — священный материал самого августейшего Нефритового императора. Разрушить его — оскорбить сами Небеса.#!"

 ######### Poxes Shintai
 POD_combat_move_kueijin_hemorrhagic_strike: "@kueijin_icon!Геморрагический удар"
 POD_combat_move_kueijin_hemorrhagic_strike_desc: "[PODCombatMoveDesc('POD_combat_move_kueijin_hemorrhagic_strike')]"
 POD_combat_move_kueijin_hemorrhagic_strike_tooltip: "#weak;italic Чума на их головы! Ваш заражённый удар медленно вытягивает из них жизнь.#!"
 POD_combat_move_kueijin_wild_eyed_bulwark: "@kueijin_icon!Оплот с безумными глазами"
 POD_combat_move_kueijin_wild_eyed_bulwark_desc: "[PODCombatMoveDesc('POD_combat_move_kueijin_wild_eyed_bulwark')]"
 POD_combat_move_kueijin_wild_eyed_bulwark_tooltip: "#weak;italic Мёртвая плоть распадается, чтобы возродиться в гротескном хаосе болезни.#!"

 ######### Storms Shintai
 POD_combat_move_kueijin_duke_of_wind: "@kueijin_icon!Вызов князя Ветра"
 POD_combat_move_kueijin_duke_of_wind_desc: "[PODCombatMoveDesc('POD_combat_move_kueijin_duke_of_wind')]"
 POD_combat_move_kueijin_duke_of_wind_tooltip: "#weak;italic Ветры прислушиваются к вашему зову, поднимая свое первобытное величие, чтобы беспокоить ваших врагов.#!"
 POD_combat_move_kueijin_thunderbolts_caress: "@kueijin_icon!Ласка громовержца"
 POD_combat_move_kueijin_thunderbolts_caress_desc: "[PODCombatMoveDesc('POD_combat_move_kueijin_thunderbolts_caress')]"
 POD_combat_move_kueijin_thunderbolts_caress_tooltip: "#weak;italic Молния у вас под рукой, маленький образец неограниченной силы.#!"

 ######### Smoke Shintai
 POD_combat_move_kueijin_smoke_without_fire: "@kueijin_icon!Дым без огня"
 POD_combat_move_kueijin_smoke_without_fire_desc: "[PODCombatMoveDesc('POD_combat_move_kueijin_smoke_without_fire')]"
 POD_combat_move_kueijin_smoke_without_fire_tooltip: "#weak;italic Исчезнуть в клубе дыма. Кто-то назвал бы это салонным фокусом. Таких потом редко видят снова.#!"
 POD_combat_move_kueijin_hampering_smoke: "@kueijin_icon!Сдерживающий дым Чжоу Чжэна"
 POD_combat_move_kueijin_hampering_smoke_desc: "[PODCombatMoveDesc('POD_combat_move_kueijin_hampering_smoke')]"
 POD_combat_move_kueijin_hampering_smoke_tooltip: "#weak;italic Когда под рукой нет песка, волшебный дым обязательно поможет.#!"

 ######### Ghost Arts
 POD_combat_move_kueijin_death_lines: "@kueijin_icon!Линии смерти"
 POD_combat_move_kueijin_death_lines_desc: "[PODCombatMoveDesc('POD_combat_move_kueijin_death_lines')]"
 POD_combat_move_kueijin_death_lines_tooltip: "#weak;italic В их душе так много трещин. Вы покажете им каждую.#!"
 POD_combat_move_kueijin_death_punch: "@kueijin_icon!Смертельный удар"
 POD_combat_move_kueijin_death_punch_desc: "[PODCombatMoveDesc('POD_combat_move_kueijin_death_punch')]"
 POD_combat_move_kueijin_death_punch_tooltip: "#weak;italic Удар по телу - это так банально. Вместо этого настоящий мастер стремится к душе.#!"

 ######### Heavenly Arts
 POD_combat_move_kueijin_no_mind: "@kueijin_icon!Безмыслие"
 POD_combat_move_kueijin_no_mind_desc: "[PODCombatMoveDesc('POD_combat_move_kueijin_no_mind')]"
 POD_combat_move_kueijin_no_mind_tooltip: "#weak;italic Демону не место на поле боя. Верните его в клетку — туда, где ему и положено быть.#!"
 POD_combat_move_kueijin_distant_death_kata: "@kueijin_icon!Ката Далёкой смерти"
 POD_combat_move_kueijin_distant_death_kata_desc: "[PODCombatMoveDesc('POD_combat_move_kueijin_distant_death_kata')]"
 POD_combat_move_kueijin_distant_death_kata_tooltip: "#weak;italic Завораживающий боевой танец, сбивающий противника с толку, пока он не испытает всю его силу.#!"

 ######### Beast Arts
 POD_combat_move_kueijin_healing_sleep: "@kueijin_icon!Целебный сон"
 POD_combat_move_kueijin_healing_sleep_desc: "[PODCombatMoveDesc('POD_combat_move_kueijin_healing_sleep')]"
 POD_combat_move_kueijin_healing_sleep_tooltip: "#weak;italic Разум не может вечно жаждать насилия. Навязанная передышка, ещё не заслуженная, может дать немалое преимущество.#!"
 POD_combat_move_kueijin_wilding_mantle: "@kueijin_icon!Дикая мантия"
 POD_combat_move_kueijin_wilding_mantle_desc: "[PODCombatMoveDesc('POD_combat_move_kueijin_wilding_mantle')]"
 POD_combat_move_kueijin_wilding_mantle_tooltip: "#weak;italic Как учило древних героев первобытное существо, прячьтесь и наносите удары целенаправленно.#!"

 ######### Devil Arts
 POD_combat_move_kueijin_killing_shriek: "@kueijin_icon!Убийственный вопль"
 POD_combat_move_kueijin_killing_shriek_desc: "[PODCombatMoveDesc('POD_combat_move_kueijin_killing_shriek')]"
 POD_combat_move_kueijin_killing_shriek_tooltip: "#weak;italic Преисподни Йоми научили вас кричать от ужаса. Теперь эти крики стали вашим оружием.#!"
 POD_combat_move_kueijin_crack_tortoise_shell: "@kueijin_icon!Раскол панциря черепахи"
 POD_combat_move_kueijin_crack_tortoise_shell_desc: "[PODCombatMoveDesc('POD_combat_move_kueijin_crack_tortoise_shell')]"
 POD_combat_move_kueijin_crack_tortoise_shell_tooltip: "#weak;italic Нет доспеха без слабого места. Нет крепости без возможной бреши. Дьявол знает, как раскрыть их все.#!"

 ######### Dragon Tear
 POD_combat_move_kueijin_chi_sight: "@kueijin_icon!Зрение ци"
 POD_combat_move_kueijin_chi_sight_desc: "[PODCombatMoveDesc('POD_combat_move_kueijin_chi_sight')]"
 POD_combat_move_kueijin_chi_sight_tooltip: "#weak;italic Каждый связан с драконьими линиями. Перед мастером Слёз Дракона бессмысленно пытаться спрятаться.#!"
 POD_combat_move_kueijin_dragon_medicine: "@kueijin_icon!Драконье врачевание"
 POD_combat_move_kueijin_dragon_medicine_desc: "[PODCombatMoveDesc('POD_combat_move_kueijin_dragon_medicine')]"
 POD_combat_move_kueijin_dragon_medicine_tooltip: "#weak;italic Истинный мастер найдёт ци повсюду. Неудивительно, что его союзники всегда полны жизни.#!"

 ######### Hell Weaving
 POD_combat_move_kueijin_razor_winds: "@kueijin_icon!Бритвенные ветры"
 POD_combat_move_kueijin_razor_winds_desc: "[PODCombatMoveDesc('POD_combat_move_kueijin_razor_winds')]"
 POD_combat_move_kueijin_razor_winds_tooltip: "#weak;italic Единственная, маленькая брешь в ткани реальности, ведущая в миры Йоми. Ужасающая демонстрация того, что будет дальше.#!"
 POD_combat_move_kueijin_dark_cultivation: "@kueijin_icon!Тёмное взращивание"
 POD_combat_move_kueijin_dark_cultivation_desc: "[PODCombatMoveDesc('POD_combat_move_kueijin_dark_cultivation')]"
 POD_combat_move_kueijin_dark_cultivation_tooltip: "#weak;italic Вы так и не покинули преисподни Йоми по-настоящему. Вы лишь присвоили их силу.#!"

 ######### Arcanos Argos
 POD_combat_move_wraith_enshroud: "@arcanos_argos_icon!Закутывание"
 POD_combat_move_wraith_enshroud_desc: "[PODCombatMoveDesc('POD_combat_move_wraith_enshroud')]"
 POD_combat_move_wraith_enshroud_tooltip: "#weak;italic Вам никогда не выбраться из Загробного мира. Он всегда вокруг вас, и это можно обратить себе на пользу.#!"

 ######### Arcanos Castigate
 POD_combat_move_wraith_coax_shadow: "@wraith_icon!Уговорить Тень"
 POD_combat_move_wraith_coax_shadow_desc: "[PODCombatMoveDesc('POD_combat_move_wraith_coax_shadow')]"
 POD_combat_move_wraith_coax_shadow_tooltip: "#weak;italic Тень жаждет Забвения. Но вы можете заставить её немного подождать.#!"

 ######### Arcanos Embody
 POD_combat_move_wraith_statue: "@wraith_icon!Статуя"
 POD_combat_move_wraith_statue_desc: "[PODCombatMoveDesc('POD_combat_move_wraith_statue')]"
 POD_combat_move_wraith_statue_tooltip: "#weak;italic Смерть неподвижна. Как и вы.#!"

 ######### Arcanos Fatalism
 POD_combat_move_wraith_sidestep: "@wraith_icon!Избегание"
 POD_combat_move_wraith_sidestep_desc: "[PODCombatMoveDesc('POD_combat_move_wraith_sidestep')]"
 POD_combat_move_wraith_sidestep_tooltip: "#weak;italic Вам не суждено встретить Забвение здесь. Нужно лишь идти путём своей судьбы.#!"

 ######### Arcanos Inhabit
 POD_combat_move_wraith_lightnings_bite: "@wraith_icon!Укус молнии"
 POD_combat_move_wraith_lightnings_bite_desc: "[PODCombatMoveDesc('POD_combat_move_wraith_lightnings_bite')]"
 POD_combat_move_wraith_lightnings_bite_tooltip: "#weak;italic Внезапная и неожиданная вспышка жизни в спокойной обстановке. Явный признак махинаций призрака.#!"

 ######### Arcanos Keening
 POD_combat_move_wraith_dirge_of_sorrow: "@arcanos_keening_icon!Погребальная песнь печали"
 POD_combat_move_wraith_dirge_of_sorrow_desc: "[PODCombatMoveDesc('POD_combat_move_wraith_dirge_of_sorrow')]"
 POD_combat_move_wraith_dirge_of_sorrow_tooltip: "#weak;italic Они думают, будто знают боль и утрату. Песня вашей души заставит их передумать.#!"

 ######### Arcanos Lifeweb
 POD_combat_move_wraith_lifeline: "@wraith_icon!Мост жизни"
 POD_combat_move_wraith_lifeline_desc: "[PODCombatMoveDesc('POD_combat_move_wraith_lifeline')]"
 POD_combat_move_wraith_lifeline_tooltip: "#weak;italic По иронии судьбы, призраки — идеальные ангелы-хранители. Они ведь знают, что ждёт по ту сторону.#!"

 ######### Arcanos Moliate
 POD_combat_move_wraith_armory: "@wraith_icon!Оружейная"
 POD_combat_move_wraith_armory_desc: "[PODCombatMoveDesc('POD_combat_move_wraith_armory')]"
 POD_combat_move_wraith_armory_tooltip: "#weak;italic Призраки — податливые существа. Некоторые из них превращаются в пепельницы, некоторые — в ходячее оружие войны.#!"

 ######### Arcanos Outrage
 POD_combat_move_wraith_stonehand_punch: "@arcanos_outrage_icon!Каменный удар"
 POD_combat_move_wraith_stonehand_punch_desc: "[PODCombatMoveDesc('POD_combat_move_wraith_stonehand_punch')]"
 POD_combat_move_wraith_stonehand_punch_tooltip: "#weak;italic Злой призрак всегда находит способ заявить о своем присутствии. Швырять предметы издалека - один из верных знаков.#!"

 ######### Arcanos Pandemonium
 POD_combat_move_wraith_weirdness: "@arcanos_pandemonium_icon!Странности"
 POD_combat_move_wraith_weirdness_desc: "[PODCombatMoveDesc('POD_combat_move_wraith_weirdness')]"
 POD_combat_move_wraith_weirdness_tooltip: "#weak;italic Малая проба потустороннего мира. Ужас и безумие затмевают чувства, заставляя приверженцев разума отшатнуться в страхе.#!"

 ######### Arcanos Phantasm
 POD_combat_move_wraith_morphean_embrace: "@wraith_icon!Объятия Морфея"
 POD_combat_move_wraith_morphean_embrace_desc: "[PODCombatMoveDesc('POD_combat_move_wraith_morphean_embrace')]"
 POD_combat_move_wraith_morphean_embrace_tooltip: "#weak;italic У смертных есть свои мифы о духах, усыпляющих их. Правда гораздо страшнее.#!"

 ######### Arcanos Puppetry
 POD_combat_move_wraith_twitch: "@wraith_icon!Подёргивания"
 POD_combat_move_wraith_twitch_desc: "[PODCombatMoveDesc('POD_combat_move_wraith_twitch')]"
 POD_combat_move_wraith_twitch_tooltip: "#weak;italic На миг они подчиняются вам. Заставьте их плясать в насмешку над жизнью, которую вы и ненавидите, и которой завидуете.#!"

 ######### Arcanos Usury
 POD_combat_move_wraith_early_withdrawal: "@wraith_icon!Досрочный выход"
 POD_combat_move_wraith_early_withdrawal_desc: "[PODCombatMoveDesc('POD_combat_move_wraith_early_withdrawal')]"
 POD_combat_move_wraith_early_withdrawal_tooltip: "#weak;italic Украденное дыхание жизни, мимолётное напоминание об утраченном, после которого лишь усиливается печаль.#!"

 ######### Arcanos Flux
 POD_combat_move_wraith_rot: "@wraith_icon!Гниение"
 POD_combat_move_wraith_rot_desc: "[PODCombatMoveDesc('POD_combat_move_wraith_rot')]"
 POD_combat_move_wraith_rot_tooltip: "#weak;italic Смерть никого не ждет, даже самое магическое оружие. Вы просто ускоряете процесс.#!"

 ######### Arcanos Intimation
 POD_combat_move_wraith_the_gleaming: "@wraith_icon!Сияние"
 POD_combat_move_wraith_the_gleaming_desc: "[PODCombatMoveDesc('POD_combat_move_wraith_the_gleaming')]"
 POD_combat_move_wraith_the_gleaming_tooltip: "#weak;italic Призраки познают навязчивые идеи через свои оковы. Они могут на мгновение передать этот недуг своим врагам.#!"

 ######### Arcanos Mnemosynis
 POD_combat_move_wraith_erasure: "@wraith_icon!Стирание"
 POD_combat_move_wraith_erasure_desc: "[PODCombatMoveDesc('POD_combat_move_wraith_erasure')]"
 POD_combat_move_wraith_erasure_tooltip: "#weak;italic Воспоминания причиняют боль. Стоит ли им удерживать вас от Забвения, если перед неизбежным концом они лишь мешают?#!"

 ######### Jade Arcanos Chains of the Emperor
 POD_combat_move_wraith_jade_brilliance: "@wraith_icon!Блеск"
 POD_combat_move_wraith_jade_brilliance_desc: "[PODCombatMoveDesc('POD_combat_move_wraith_jade_brilliance')]"
 POD_combat_move_wraith_jade_brilliance_tooltip: "#weak;italic Краткий миг памяти о былой славе, давно поглощённой смертью — как однажды будет поглощено всё.#!"

