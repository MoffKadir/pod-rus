 POD_combat_move_truefaith_lay_on_hands_tooltip: "#weak;italic И молитва веры исцелит болящего, и восставит его Господь.#!" # James 5:15 NIV
 POD_combat_move_truefaith_penance: "@truefaith_icon!Покаяние"
 POD_combat_move_truefaith_penance_desc: "[PODCombatMoveDesc('POD_combat_move_truefaith_penance')]"
 POD_combat_move_truefaith_penance_tooltip: "#weak;italic Нет, говорю вам: но, если не покаетесь, все так же погибнете.#!" # Luke 13:3 KJV
 POD_combat_move_truefaith_miracle_of_protection: "@truefaith_icon!Чудо заступничества"
 POD_combat_move_truefaith_miracle_of_protection_desc: "[PODCombatMoveDesc('POD_combat_move_truefaith_miracle_of_protection')]"
 POD_combat_move_truefaith_miracle_of_protection_tooltip: "#weak;italic Бог мой — скала моя; на Него я уповаю; Он щит мой, рог спасения моего, ограждение моё, прибежище моё, Спаситель мой.#!" # 2 Samuel 22:3 KJV

 ######### True Faith Patris
 POD_combat_move_truefaith_patris_revelation: "@truefaith_icon!Откровение"
 POD_combat_move_truefaith_patris_revelation_desc: "[PODCombatMoveDesc('POD_combat_move_truefaith_patris_revelation')]"
 POD_combat_move_truefaith_patris_revelation_tooltip: "#weak;italic Открой очи мои, и увижу чудеса закона Твоего.#!" # Psalm 119:18 KJV

 ######### True Faith Filius
 POD_combat_move_truefaith_filius_sunder: "@truefaith_icon!Раскол"
 POD_combat_move_truefaith_filius_sunder_desc: "[PODCombatMoveDesc('POD_combat_move_truefaith_filius_sunder')]"
 POD_combat_move_truefaith_filius_sunder_tooltip: "#weak;italic Сегодня Господь предаст тебя в руки мои; и я поражу тебя.#!" # 1 Samuel 17:46 KJV
 POD_combat_move_truefaith_filius_rod_and_staff: "@truefaith_icon!Жезл и посох"
 POD_combat_move_truefaith_filius_rod_and_staff_desc: "[PODCombatMoveDesc('POD_combat_move_truefaith_filius_rod_and_staff')]"
 POD_combat_move_truefaith_filius_rod_and_staff_tooltip: "#weak;italic Да, хотя я пойду и долиною смертной тени, не убоюсь зла: ибо Ты со мной.#!" # Psalm 23:4 KJV
 POD_combat_move_truefaith_filius_wrath_of_god: "@truefaith_icon!Гнев Божий"
 POD_combat_move_truefaith_filius_wrath_of_god_desc: "[PODCombatMoveDesc('POD_combat_move_truefaith_filius_wrath_of_god')]"
 POD_combat_move_truefaith_filius_wrath_of_god_tooltip: "#weak;italic И совершу над ними великое мщение наказаниями яростными; и узнают, что Я Господь, когда совершу над ними Моё мщение.#!" # Ezekiel 25:17 KJV

 ######### True Faith Spiritus
 POD_combat_move_truefaith_spiritus_aura_of_sanctity: "@truefaith_icon!Аура святости"
 POD_combat_move_truefaith_spiritus_aura_of_sanctity_desc: "[PODCombatMoveDesc('POD_combat_move_truefaith_spiritus_aura_of_sanctity')]"
 POD_combat_move_truefaith_spiritus_aura_of_sanctity_tooltip: "#weak;italic Я освятил сей храм, который ты построил, чтобы пребывать имени Моему там вовек; и будут очи Мои и сердце Моё там во все дни.#!" # 1 Kings 9:3 KJV
 POD_combat_move_truefaith_spiritus_judgement_of_heaven: "@truefaith_icon!Суд небес"
 POD_combat_move_truefaith_spiritus_judgement_of_heaven_desc: "[PODCombatMoveDesc('POD_combat_move_truefaith_spiritus_judgement_of_heaven')]"
 POD_combat_move_truefaith_spiritus_judgement_of_heaven_tooltip: "#weak;italic Ни одно орудие, сделанное против тебя, не будет успешно; и всякий язык, который будет состязаться с тобою на суде, ты обвинишь.#!" # Isaiah 54:17 KJV

