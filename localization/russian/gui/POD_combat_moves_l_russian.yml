 POD_combat_move_mummy_necromancy_deaths_hand_tooltip: "#weak;italic The Mummy, for a moment, drops the mockery of life granted to them by the Spell of Life. The grotesque horror of their condition is revealed as their cold, skeletal hands make contact with the enemy.#!" 
