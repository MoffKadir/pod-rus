 POD_combat_move_demon_healing_touch_tooltip: "#weak;italic Вы были первородным разрушением, но вы также были первозданным творением. Сама жизнь отвечает на ваш зов.#!"
 POD_combat_move_demon_preternatural_reflexes: "@demon_icon!Сверхъестественные рефлексы"
 POD_combat_move_demon_preternatural_reflexes_desc: "[PODCombatMoveDesc('POD_combat_move_demon_preternatural_reflexes')]"
 POD_combat_move_demon_preternatural_reflexes_tooltip: "#weak;italic Какой удар они могут нанести, которого вы ещё не видели за бесконечные годы своего существования?#!"
 POD_combat_move_demon_invisibility: "@demon_icon!Невидимость"
 POD_combat_move_demon_invisibility_desc: "[PODCombatMoveDesc('POD_combat_move_demon_invisibility')]"
 POD_combat_move_demon_invisibility_tooltip: "#weak;italic Их глаза никогда не были настроены на присутствие такого божественного существа.#!"
 POD_combat_move_demon_damage_immunity: "@demon_icon!Невосприимчивость к повреждениям"
 POD_combat_move_demon_damage_immunity_desc: "[PODCombatMoveDesc('POD_combat_move_demon_damage_immunity')]"
 POD_combat_move_demon_damage_immunity_tooltip: "#weak;italic Они надеялись сразить вас. Убедитесь, что они понимают правду.#!"
 POD_combat_move_demon_speed_of_thought: "@demon_icon!Скорость мысли"
 POD_combat_move_demon_speed_of_thought_desc: "[PODCombatMoveDesc('POD_combat_move_demon_speed_of_thought')]"
 POD_combat_move_demon_speed_of_thought_tooltip: "#weak;italic Время — всего лишь конструкция. Созданная вами конструкция.#!"
 POD_combat_move_demon_inhuman_strength: "@demon_icon!Нечеловеческая сила"
 POD_combat_move_demon_inhuman_strength_desc: "[PODCombatMoveDesc('POD_combat_move_demon_inhuman_strength')]"
 POD_combat_move_demon_inhuman_strength_tooltip: "#weak;italic Ваше предназначение — быть сильнейшим существом Мироздания. Даже части этой силы будет достаточно, чтобы закончить битву.#!"
 POD_combat_move_demon_celestial_radiance: "@demon_icon!Небесное сияние"
 POD_combat_move_demon_celestial_radiance_desc: "[PODCombatMoveDesc('POD_combat_move_demon_celestial_radiance')]"
 POD_combat_move_demon_celestial_radiance_tooltip: "#weak;italic Однокрылый ангел спускается на поле боя. Восхищайтесь и отчаивайтесь.#!"
 POD_combat_move_demon_lash_of_anguish: "@demon_icon!Мучительный удар"
 POD_combat_move_demon_lash_of_anguish_desc: "[PODCombatMoveDesc('POD_combat_move_demon_lash_of_anguish')]"
 POD_combat_move_demon_lash_of_anguish_tooltip: "#weak;italic Всего лишь малая доля тех мук, что вы пережили в Аду. Но и её хватит, чтобы свести их с ума.#!"

 ######### Lore of the World
 POD_combat_move_demon_manipulate_inertia: "@demon_icon!Манипулирование инерцией"
 POD_combat_move_demon_manipulate_inertia_desc: "[PODCombatMoveDesc('POD_combat_move_demon_manipulate_inertia')]"
 POD_combat_move_demon_manipulate_inertia_tooltip: "#weak;italic Когда-то сама ткань мира подчинялась вам. Разве жалкий закон физики может вам помешать?#!"
 POD_combat_move_demon_manipulate_cohesion: "@demon_icon!Манипулирование сцеплением"
 POD_combat_move_demon_manipulate_cohesion_desc: "[PODCombatMoveDesc('POD_combat_move_demon_manipulate_cohesion')]"
 POD_combat_move_demon_manipulate_cohesion_tooltip: "#weak;italic Вы однажды создали Творение. Вы можете его разрушить.#!"

 ######### Lore of Corruption
 POD_combat_move_demon_reality_tremors: "@demon_icon!Дрожь реальности"
 POD_combat_move_demon_reality_tremors_desc: "[PODCombatMoveDesc('POD_combat_move_demon_reality_tremors')]"
 POD_combat_move_demon_reality_tremors_tooltip: "#weak;italic Логике и разуму нет места на поле битвы, по которому вы идёте. Это всего лишь конструкции слабых умов, пытающихся понять Творение.#!"
 POD_combat_move_demon_wave_of_mutilation: "@demon_icon!Волна искажения"
 POD_combat_move_demon_wave_of_mutilation_desc: "[PODCombatMoveDesc('POD_combat_move_demon_wave_of_mutilation')]"
 POD_combat_move_demon_wave_of_mutilation_tooltip: "#weak;italic Они думают, что познали боль и мучения. Они ошибаются.#!"

 ######### Lore of the Herald
 POD_combat_move_demon_command_the_flame: "@demon_icon!Повелевание пламенем"
 POD_combat_move_demon_command_the_flame_desc: "[PODCombatMoveDesc('POD_combat_move_demon_command_the_flame')]"
 POD_combat_move_demon_command_the_flame_tooltip: "#weak;italic Огонь был инструментом, использованным для самого Творения. Для вас это так же естественно, как дыхание для этих слабых смертных.#!"
 POD_combat_move_demon_hand_of_faith: "@demon_icon!Длань веры"
 POD_combat_move_demon_hand_of_faith_desc: "[PODCombatMoveDesc('POD_combat_move_demon_hand_of_faith')]"
 POD_combat_move_demon_hand_of_faith_tooltip: "#weak;italic Вы отказываетесь принимать удары от столь низшего существа. И потому они вас не касаются.#!"

 ######### Lore of the Life-Bringer
 POD_combat_move_demon_cleanse: "@demon_icon!Очищение"
 POD_combat_move_demon_cleanse_desc: "[PODCombatMoveDesc('POD_combat_move_demon_cleanse')]"
 POD_combat_move_demon_cleanse_tooltip: "#weak;italic Их слабые тела для вас всего лишь глина. Ваше милосердие - их спасение.#!"
 POD_combat_move_demon_wall_of_air: "@demon_icon!Стена воздуха"
 POD_combat_move_demon_wall_of_air_desc: "[PODCombatMoveDesc('POD_combat_move_demon_wall_of_air')]"
 POD_combat_move_demon_wall_of_air_tooltip: "#weak;italic Крылья света уносят вас далеко от опасности.#!"

 ######### Lore of Creation
 POD_combat_move_demon_earth_meld: "@demon_icon!Слияние с землёй"
 POD_combat_move_demon_earth_meld_desc: "[PODCombatMoveDesc('POD_combat_move_demon_earth_meld')]"
 POD_combat_move_demon_earth_meld_tooltip: "#weak;italic Сама земля подчиняется вам. Ведь она помнит своего создателя.#!"
 POD_combat_move_demon_alter_path: "@demon_icon!Изменение пути"
 POD_combat_move_demon_alter_path_desc: "[PODCombatMoveDesc('POD_combat_move_demon_alter_path')]"
 POD_combat_move_demon_alter_path_tooltip: "#weak;italic Лабиринт реальности слишком сложен для их узкого ума.#!"

 ######### Lore of the Seer
 POD_combat_move_demon_foresee: "@demon_icon!Предвидение"
 POD_combat_move_demon_foresee_desc: "[PODCombatMoveDesc('POD_combat_move_demon_foresee')]"
 POD_combat_move_demon_foresee_tooltip: "#weak;italic Вы всё это видели. Даже мелочность Бога не сможет скрыть от вас будущее.#!"
 POD_combat_move_demon_illusion: "@demon_icon!Иллюзия"
 POD_combat_move_demon_illusion_desc: "[PODCombatMoveDesc('POD_combat_move_demon_illusion')]"
 POD_combat_move_demon_illusion_tooltip: "#weak;italic Это действительно иллюзия или их разум слишком мал, чтобы понять?#!"

 ######### Lore of Beauty
 POD_combat_move_demon_inspire: "@demon_icon!Вдохновение"
 POD_combat_move_demon_inspire_desc: "[PODCombatMoveDesc('POD_combat_move_demon_inspire')]"
 POD_combat_move_demon_inspire_tooltip: "#weak;italic Когда-то вам подчинялись целые ангельские легионы. Разве трудно после этого вдохновить одного носителя?#!"
 POD_combat_move_demon_command_the_storm: "@demon_icon!Повелевание бурей"
 POD_combat_move_demon_command_the_storm_desc: "[PODCombatMoveDesc('POD_combat_move_demon_command_the_storm')]"
 POD_combat_move_demon_command_the_storm_tooltip: "#weak;italic Смертные были правы, опасаясь небес. Божественный гнев всегда исходил свыше.#!"

 ######### Lore of the Living
 POD_combat_move_demon_manipulate_flesh: "@demon_icon!Манипулирование плотью"
 POD_combat_move_demon_manipulate_flesh_desc: "[PODCombatMoveDesc('POD_combat_move_demon_manipulate_flesh')]"
 POD_combat_move_demon_manipulate_flesh_tooltip: "#weak;italic Плоть так слаба, так хрупка, но она вам всё ещё нужна.#!"
 POD_combat_move_demon_command_the_wild: "@demon_icon!Повелевание природой"
 POD_combat_move_demon_command_the_wild_desc: "[PODCombatMoveDesc('POD_combat_move_demon_command_the_wild')]"
 POD_combat_move_demon_command_the_wild_tooltip: "#weak;italic Райский сад не был лишен шипов.#!"

 ######### Lore of the Ethereal
 POD_combat_move_demon_command_the_dead: "@demon_icon!Повелевание мёртвыми"
 POD_combat_move_demon_command_the_dead_desc: "[PODCombatMoveDesc('POD_combat_move_demon_command_the_dead')]"
 POD_combat_move_demon_command_the_dead_tooltip: "#weak;italic Когда-то призраки были в ведении вашего рода. С тех пор вы ещё сохранили над ними власть.#!"
 POD_combat_move_demon_extinguish_life: "@demon_icon!Погашение жизни"
 POD_combat_move_demon_extinguish_life_desc: "[PODCombatMoveDesc('POD_combat_move_demon_extinguish_life')]"
 POD_combat_move_demon_extinguish_life_tooltip: "#weak;italic Жнец — это не просто смертный миф. Это их подсознание помнит давний божественный долг вашего рода.#!"

 ######### Innate Kuei-jin
 POD_combat_move_kueijin_bite: "@kueijin_icon!Укус голодного мертвеца"
 POD_combat_move_kueijin_bite_desc: "[PODCombatMoveDesc('POD_combat_move_kueijin_bite')]"
 POD_combat_move_kueijin_bite_tooltip: "#weak;italic Не самый просветлённый способ сражаться, но порой действенность важнее изящества.#!"
 POD_combat_move_kueijin_chi_surge: "@kueijin_icon!Прилив ци"
 POD_combat_move_kueijin_chi_surge_desc: "[PODCombatMoveDesc('POD_combat_move_kueijin_chi_surge')]"
 POD_combat_move_kueijin_chi_surge_tooltip: "#weak;italic Внезапный всплеск ци для получения преимущества в критический момент, долг, который нужно выплатить позже.#!"
 POD_combat_move_kueijin_chi_mending: "@kueijin_icon!Исцеление ци"
 POD_combat_move_kueijin_chi_mending_desc: "[PODCombatMoveDesc('POD_combat_move_kueijin_chi_mending')]"
 POD_combat_move_kueijin_chi_mending_tooltip: "#weak;italic Сами энергии жизни исцеляют ваше мёртвое тело.#!"

 ######### Feng Shui
 POD_combat_move_kueijin_harmonious_wards: "@kueijin_icon!Harmonious Wards"
 POD_combat_move_kueijin_harmonious_wards_desc: "[PODCombatMoveDesc('POD_combat_move_kueijin_harmonious_wards')]"
 POD_combat_move_kueijin_harmonious_wards_tooltip: "#weak;italic Choosing the battlefield is half the battle. If not possible, you can always change it to your liking.#!" 
 POD_combat_move_kueijin_hand_of_darkness: "@kueijin_icon!Hand of Darkness"
 POD_combat_move_kueijin_hand_of_darkness_desc: "[PODCombatMoveDesc('POD_combat_move_kueijin_hand_of_darkness')]"
 POD_combat_move_kueijin_hand_of_darkness_tooltip: "#weak;italic Luck isn't on their side. They only have their bad life decision of fighting you to blame.#!" 

 ######### Obligation
 POD_combat_move_kueijin_soul_bridge: "@kueijin_icon!Soul Bridge"
 POD_combat_move_kueijin_soul_bridge_desc: "[PODCombatMoveDesc('POD_combat_move_kueijin_soul_bridge')]"
 POD_combat_move_kueijin_soul_bridge_tooltip: "#weak;italic Good, let fear and anger consume you...#!" 
 POD_combat_move_kueijin_voice_of_emperor: "@kueijin_icon!Voice of the Emperor"
 POD_combat_move_kueijin_voice_of_emperor_desc: "[PODCombatMoveDesc('POD_combat_move_kueijin_voice_of_emperor')]"
 POD_combat_move_kueijin_voice_of_emperor_tooltip: "#weak;italic You braved the very Hells to come back and reach the Hundred Clouds. Who are they to dare standing in your path?#!" 

 ######### Tapestry
 POD_combat_move_kueijin_chi_shaping: "@kueijin_icon!Chi Shaping"
 POD_combat_move_kueijin_chi_shaping_desc: "[PODCombatMoveDesc('POD_combat_move_kueijin_chi_shaping')]"
 POD_combat_move_kueijin_chi_shaping_tooltip: "#weak;italic The very energy of the land bursts from your command, tearing apart anything in its path.#!" 
 POD_combat_move_kueijin_ride_the_dragon: "@kueijin_icon!Ride the Dragon"
 POD_combat_move_kueijin_ride_the_dragon_desc: "[PODCombatMoveDesc('POD_combat_move_kueijin_ride_the_dragon')]"
 POD_combat_move_kueijin_ride_the_dragon_tooltip: "#weak;italic You are always one step ahead. They can't compete against a master of the Chi lines.#!" 

 ######### Prana
 POD_combat_move_kueijin_accentuate_chi: "@kueijin_icon!Accentuate Chi"
 POD_combat_move_kueijin_accentuate_chi_desc: "[PODCombatMoveDesc('POD_combat_move_kueijin_accentuate_chi')]"
 POD_combat_move_kueijin_accentuate_chi_tooltip: "#weak;italic The balance of their body is realigned by your intervention, mending bruises and wounds in the process.#!" 
 POD_combat_move_kueijin_yin_nihilus: "@kueijin_icon!Yin Nihilus"
 POD_combat_move_kueijin_yin_nihilus_desc: "[PODCombatMoveDesc('POD_combat_move_kueijin_yin_nihilus')]"
 POD_combat_move_kueijin_yin_nihilus_tooltip: "#weak;italic The energies of death slow down your foe to a crawl, leaving them vulnerable to your righteous assault.#!" 

 ######### Kiai
 POD_combat_move_kueijin_battle_cry: "@kueijin_icon!Battle Cry"
 POD_combat_move_kueijin_battle_cry_desc: "[PODCombatMoveDesc('POD_combat_move_kueijin_battle_cry')]"
 POD_combat_move_kueijin_battle_cry_tooltip: "#weak;italic As a banshee from the very Hells, your voice strikes their body and soul.#!" 
 POD_combat_move_kueijin_greater_ngilai: "@kueijin_icon!Greater Ngilai"
 POD_combat_move_kueijin_greater_ngilai_desc: "[PODCombatMoveDesc('POD_combat_move_kueijin_greater_ngilai')]"
 POD_combat_move_kueijin_greater_ngilai_tooltip: "#weak;italic Courage and bravery are easily shattered when confronted by an otherworldly scream such as this.#!" 

 ######### Tzu Wei
 POD_combat_move_kueijin_grand_dukes_theorem: "@kueijin_icon!Grand Duke's Theorem"
 POD_combat_move_kueijin_grand_dukes_theorem_desc: "[PODCombatMoveDesc('POD_combat_move_kueijin_grand_dukes_theorem')]"
 POD_combat_move_kueijin_grand_dukes_theorem_tooltip: "#weak;italic Fate is a but a book to decipher. You know your destiny doesn't end here.#!" 
 POD_combat_move_kueijin_celestial_curse: "@kueijin_icon!Celestial Curse"
 POD_combat_move_kueijin_celestial_curse_desc: "[PODCombatMoveDesc('POD_combat_move_kueijin_celestial_curse')]"
 POD_combat_move_kueijin_celestial_curse_tooltip: "#weak;italic Their vain struggle is fated to end here. You have decided it.#!" 

 ######### Devil Fist
 POD_combat_move_kueijin_infernal_might: "@kueijin_icon!Infernal Might"
 POD_combat_move_kueijin_infernal_might_desc: "[PODCombatMoveDesc('POD_combat_move_kueijin_infernal_might')]"
 POD_combat_move_kueijin_infernal_might_tooltip: "#weak;italic The demon is your enemy but it also wants to survive. Borrow its strength for the fight without remorse.#!" 
 POD_combat_move_kueijin_devil_fist: "@kueijin_icon!Devil Fist"
 POD_combat_move_kueijin_devil_fist_desc: "[PODCombatMoveDesc('POD_combat_move_kueijin_devil_fist')]"
 POD_combat_move_kueijin_devil_fist_tooltip: "#weak;italic The demon is you without restraint, morality or remorse. It is who you should be during battle.#!" 

 ######### Black Wind
 POD_combat_move_kueijin_infernal_speed: "@kueijin_icon!Infernal Speed"
 POD_combat_move_kueijin_infernal_speed_desc: "[PODCombatMoveDesc('POD_combat_move_kueijin_infernal_speed')]"
 POD_combat_move_kueijin_infernal_speed_tooltip: "#weak;italic You managed to escape the very Hells, outrunning this foe will be child's play.#!" 
 POD_combat_move_kueijin_black_wind: "@kueijin_icon!Black Wind"
 POD_combat_move_kueijin_black_wind_desc: "[PODCombatMoveDesc('POD_combat_move_kueijin_black_wind')]"
 POD_combat_move_kueijin_black_wind_tooltip: "#weak;italic A single strike is all you need.#!" 

 ######### Iron Mountain
 POD_combat_move_kueijin_infernal_fortitude: "@kueijin_icon!Infernal Fortitude"
 POD_combat_move_kueijin_infernal_fortitude_desc: "[PODCombatMoveDesc('POD_combat_move_kueijin_infernal_fortitude')]"
 POD_combat_move_kueijin_infernal_fortitude_tooltip: "#weak;italic The demon survived the Hells. It will help you survive this fight.#!" 
 POD_combat_move_kueijin_striking_the_fire: "@kueijin_icon!Striking the Fire"
 POD_combat_move_kueijin_striking_the_fire_desc: "[PODCombatMoveDesc('POD_combat_move_kueijin_striking_the_fire')]"
 POD_combat_move_kueijin_striking_the_fire_tooltip: "#weak;italic Your very existence is proof of your extraordinary resilience. Tapping into this is a simple natural extension of your very nature.#!" 

 ######### Demon Regalia
 POD_combat_move_kueijin_infernal_glory: "@kueijin_icon!Infernal Glory"
 POD_combat_move_kueijin_infernal_glory_desc: "[PODCombatMoveDesc('POD_combat_move_kueijin_infernal_glory')]"
 POD_combat_move_kueijin_infernal_glory_tooltip: "#weak;italic Your true form is both demon and eternal champion. The feeble mind can't comprehend such unbalance.#!" 
 POD_combat_move_kueijin_spiked_regalia: "@kueijin_icon!Spiked Regalia"
 POD_combat_move_kueijin_spiked_regalia_desc: "[PODCombatMoveDesc('POD_combat_move_kueijin_spiked_regalia')]"
 POD_combat_move_kueijin_spiked_regalia_tooltip: "#weak;italic The demon has a mind of its own and strikes wildly against those trying to harm its unwilling host.#!" 

 ######### Ash and Flames Shintai
 POD_combat_move_kueijin_fire_in_the_eye: "@kueijin_icon!Fire in the Eye"
 POD_combat_move_kueijin_fire_in_the_eye_desc: "[PODCombatMoveDesc('POD_combat_move_kueijin_fire_in_the_eye')]"
 POD_combat_move_kueijin_fire_in_the_eye_tooltip: "#weak;italic The very sight of the unholy flame is too much for the weak to bear.#!" 
 POD_combat_move_kueijin_mantle_flame_emperor: "@kueijin_icon!Mantle of the Flame Emperor"
 POD_combat_move_kueijin_mantle_flame_emperor_desc: "[PODCombatMoveDesc('POD_combat_move_kueijin_mantle_flame_emperor')]"
 POD_combat_move_kueijin_mantle_flame_emperor_tooltip: "#weak;italic The Flame Emperor is both wisdom and folly. Its fire is a curse disguised as a blessing.#!" 

 ######### Blood Shintai
 POD_combat_move_kueijin_flow_like_blood: "@kueijin_icon!Flow Like Blood"
 POD_combat_move_kueijin_flow_like_blood_desc: "[PODCombatMoveDesc('POD_combat_move_kueijin_flow_like_blood')]"
 POD_combat_move_kueijin_flow_like_blood_tooltip: "#weak;italic A more edgy version of the \"Flow like Water\" move.#!" 
 POD_combat_move_kueijin_bloodlash: "@kueijin_icon!Bloodlash"
 POD_combat_move_kueijin_bloodlash_desc: "[PODCombatMoveDesc('POD_combat_move_kueijin_bloodlash')]"
 POD_combat_move_kueijin_bloodlash_tooltip: "#weak;italic The Blood Shintai master is never without a weapon. Their very life essence is their deadliest tool.#!" 

 ######### Bone Shintai
 POD_combat_move_kueijin_relentless_bone: "@kueijin_icon!Relentless Bone"
 POD_combat_move_kueijin_relentless_bone_desc: "[PODCombatMoveDesc('POD_combat_move_kueijin_relentless_bone')]"
 POD_combat_move_kueijin_relentless_bone_tooltip: "#weak;italic Bones break. Those of your foe at least, you solved that problem for yourself long ago.#!" 
 POD_combat_move_kueijin_skeletal_sculpting: "@kueijin_icon!Skeletal Sculpting"
 POD_combat_move_kueijin_skeletal_sculpting_desc: "[PODCombatMoveDesc('POD_combat_move_kueijin_skeletal_sculpting')]"
 POD_combat_move_kueijin_skeletal_sculpting_tooltip: "#weak;italic Their flesh and blood are merely decorations. You are the sculptor and tonight you are making a mess.#!" 

 ######### Devotion Shintai
 POD_combat_move_kueijin_flow_of_worship: "@kueijin_icon!Flow of Worship"
