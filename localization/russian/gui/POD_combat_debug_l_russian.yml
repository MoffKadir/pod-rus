 ##############################################################################
 ###### POD COMBAT - DEBUG TUNING WINDOW
 ##############################################################################
 # Labels and tooltips for pod_combat_tuning_window.gui, the runtime balancing
 # panel opened by pod_combat_debug_tuning_interaction (debug builds only).
 #
 # TRANSLATORS: this file is OPTIONAL. Nothing here is reachable in normal
 # play - it is a developer tool for tuning combat numbers, and the text is
 # dense jargon about internal mechanics. The player-facing combat  UI 
 # is in POD_combat_static_l_english.yml.
 #
 # Each knob is a pair: _label for the row, _tt for its hover text. Checkbox
 # rows add a _cb_tt for the box itself, and the two clearable knobs add a
 # _clear_tt for their X button.
 ##############################################################################

 ###### Window chrome
 pod_combat_tune_window_title: "#high;bold Настройка боя (отладка)#!"
 pod_combat_tune_reset_all: "Сбросить всё"
 pod_combat_tune_reset_all_tt: "Сбросить все изменённые значения к исходным настройкам"
 pod_combat_tune_footer: "#weak * = изменённое значение (сохраняется в файле сохранения). Настройки ОД / инициативы / попадания / уровней вступают в силу со следующего хода или проверки; начальный боевой дух — со следующей схватки; ограничения набора — в редакторе.#!"

 ###### AP economy
 pod_combat_tune_base_ap_label: "Максимальный запас ОД"
 pod_combat_tune_base_ap_tt: "Максимум ОД за ход (полная шкала). Действует со следующего хода. Полоса отметок показывает не более 6."
 pod_combat_tune_ap_regen_label: "Восстановление ОД / раунд"
 pod_combat_tune_ap_regen_tt: "ОД, восстанавливаемые каждый ход; неизрасходованные ОД сохраняются до предела запаса. Не задано = полное восстановление шкалы. Первый ход бойца всегда начинается с полного запаса."
 pod_combat_tune_ap_regen_clear_tt: "Сброс: полное восстановление шкалы каждый ход"
 pod_combat_tune_ap_cap_start_label: "Начальный предел ОД (раунд 1)"
 pod_combat_tune_ap_cap_start_tt: "Растущий предел: запас ОД в первом раунде. Имеет значение только при заданном приросте предела ОД за раунд."
 pod_combat_tune_ap_cap_increment_label: "Прирост предела ОД / раунд"
 pod_combat_tune_ap_cap_increment_tt: "Растущий предел: запас ОД увеличивается на это значение каждый раунд (начало + N за раунд), пока не достигнет максимума. Сброс = выключено."
 pod_combat_tune_ap_cap_increment_clear_tt: "Сброс: без растущего предела"

 ###### Morale
 pod_combat_tune_starting_morale_label: "Начальный боевой дух"
 pod_combat_tune_starting_morale_tt: "Боевой дух, с которым каждый боец вступает в схватку (индивидуальные эффекты прибавляются сверху; минимум 1). Действует со следующего боя."
 pod_combat_tune_max_morale_label: "Предел духа (6 ячеек)"
 pod_combat_tune_max_morale_tt: "Предел боевого духа для бойца с 6 ячейками ранений (вампир, куэй-дзин, восставший). Каждая ячейка сверх или ниже 6 сдвигает его собственный предел на 5, поэтому настройка меняет всю шкалу, а не задаёт единый максимум. Влияет на исцеление и дефицит духа при расчёте напряжения в конце боя. Действует сразу."
 pod_combat_tune_morale_stress_mult_label: "Множитель дух → стресс"
 pod_combat_tune_morale_stress_mult_tt: "Стресс за каждое недостающее очко боевого духа в конце боя (психическое напряжение, применяется один раз по завершении)."

 ###### Loadout caps
 pod_combat_tune_max_per_category_label: "Набор / категория"
 pod_combat_tune_max_per_category_tt: "Предел выбранных приёмов в каждой категории (АТК / ЗАЩ / КОН / СИЛ). Проверяется в редакторе набора; полосы отметок всё ещё показывают 4. Окно боя расширяется, чтобы вместить 5+ приёмов в строке; при значении выше 5 оно может выйти за границы экрана шириной 1920."
 pod_combat_tune_max_equipped_label: "Общий размер набора"
 pod_combat_tune_max_equipped_tt: "Общий предел выбранных приёмов всех категорий. Проверяется в редакторе набора."

 ###### Initiative
 pod_combat_tune_init_reroll_label: "Инициатива: перебрасывать каждый раунд"
 pod_combat_tune_init_reroll_tt: "Повторно определять инициативу каждого бойца в начале каждого раунда вместо сохранения исходного результата. По умолчанию выключено. В обоих случаях ослабления инициативы действуют лишь один раунд."
 pod_combat_tune_init_reroll_cb_tt: "Перебрасывать инициативу каждый раунд вместо того, чтобы сохранять бросок, с которым вступил каждый боец."
 pod_combat_tune_init_decouple_prowess_label: "Инициатива: отвязать от доблести"
 pod_combat_tune_init_decouple_prowess_tt: "Использовать постоянную основу инициативы вместо доблести. Основа задаётся настройкой ниже (по умолчанию 20). Начальная инициатива определяется один раз для бойца, поэтому изменение действует со следующей схватки (или при вступлении нового бойца), если не включён пересчёт каждый раунд."
 pod_combat_tune_init_decouple_prowess_cb_tt: "Использовать постоянную основу инициативы вместо доблести"
 pod_combat_tune_init_base_label: "Основа инициативы"
 pod_combat_tune_init_base_tt: "Постоянная основа инициативы, используемая ВМЕСТО доблести при включённой отвязке от доблести (иначе игнорируется). Начальная инициатива определяется один раз для бойца, поэтому изменение действует со следующей схватки (или при вступлении нового бойца), если не включён пересчёт каждый раунд."
 pod_combat_tune_init_roll_max_label: "Максимальный бросок инициативы"
 pod_combat_tune_init_roll_max_tt: "Случайная часть инициативы: значение от 1 до N прибавляется к основе (доблести или постоянному значению при отвязке). 1 = почти предопределённый результат (решает основа). Начальная инициатива определяется один раз для бойца, поэтому изменение действует со следующей схватки (или при вступлении нового бойца), если не включён пересчёт каждый раунд."
 pod_combat_tune_init_celerity_bonus_label: "Инициатива / достоинство скорости"
 pod_combat_tune_init_celerity_bonus_tt: "Инициатива за каждое имеющееся достоинство в ветке скорости Стремительности (вампиры) или Чёрного Ветра (куэй-дзин); 0 = выключено. Включается в основу, определяемую один раз для бойца, поэтому изменение действует со следующей схватки (или при вступлении нового бойца), если не включён пересчёт каждый раунд."

 ###### Hit chance
 pod_combat_tune_hit_base_label: "Основа вероятности попадания"
 pod_combat_tune_hit_base_tt: "Базовая вероятность попадания до учёта разницы в доблести. Действует со следующего пересчёта вероятности."
 pod_combat_tune_hit_min_label: "Минимум вероятности попадания"
 pod_combat_tune_hit_min_tt: "Нижний предел текущей вероятности попадания."
 pod_combat_tune_hit_max_label: "Максимум вероятности попадания"
 pod_combat_tune_hit_max_tt: "Верхний предел текущей вероятности попадания (также ограничивает условный бонус к попаданию)."

 ###### Buff / debuff tiers
 pod_combat_tune_tier_small_label: "Сила малого уровня"
 pod_combat_tune_tier_small_tt: "Величина усилений и ослаблений 1-го уровня для поглощения урона и попадания. Действует при текущих пересчётах."
 pod_combat_tune_tier_medium_label: "Сила среднего уровня"
 pod_combat_tune_tier_medium_tt: "Величина усилений и ослаблений 2-го уровня."
 pod_combat_tune_tier_large_label: "Сила большого уровня"
 pod_combat_tune_tier_large_tt: "Величина усилений и ослаблений 3-го уровня."
 pod_combat_tune_stealth_bonus_label: "Бонус скрытного попадания"
 pod_combat_tune_stealth_bonus_tt: "Бонус к вероятности попадания в скрытности (расходуется при следующей атаке). В справке остаётся +30, пока значение не будет перенесено."

 ###### AI behaviour
 pod_combat_tune_ai_trace_label: "Трассировка решения ИИ"
 pod_combat_tune_ai_trace_tt: "Записывает в debug.log по одной строке для каждого выбора приёма ИИ и каждого хода ИИ (ищите «pod_combat_trace»). Запись содержит выбранный приём, состояние на момент выбора и причину завершения каждого хода. Только для отладки: во включённом состоянии примерно удваивает объём вычислений при выборе действий."
 pod_combat_tune_ai_trace_cb_tt: "Записывать решения ИИ в debug.log (снижает производительность, пока включено)"
 pod_combat_tune_ai_hp_finish_label: "Порог добивания ИИ"
 pod_combat_tune_ai_hp_finish_tt: "Число пустых ячеек ранений, при котором или ниже которого ИИ считает врага пригодным для добивания; влияет на отказ от срочного исцеления. Действует сразу. По умолчанию 1."
 pod_combat_tune_ai_band_width_label: "Ширина лучших вариантов ИИ"
 pod_combat_tune_ai_band_width_tt: "Насколько оценка приёма может уступать ЛУЧШЕЙ и всё ещё рассматриваться. Меньше = точнее и предсказуемее; 0 означает, что ИИ всегда выбирает лучший приём (или один из равных ему). При значении выше ~100 ограничение теряет смысл. Внутри диапазона ИИ по-прежнему выбирает пропорционально оценке."
 pod_combat_tune_ai_kill_priority_label: "Ячейки приоритета добивания ИИ"
 pod_combat_tune_ai_kill_priority_tt: "Число пустых ячеек ранений, при котором или ниже которого выбор цели ИИ утраивает вес цели (сосредоточение на почти погибшем). Действует сразу. По умолчанию 2."
 pod_combat_tune_ai_mor_finish_label: "Порог добивания духа ИИ"
 pod_combat_tune_ai_mor_finish_tt: "Боевой дух врага, при котором или ниже которого ИИ считает его пригодным для добивания уроном духу. Задаёт признак возможности добивания и через него — бонусы убийства при выборе намерения и отказ умирающего бойца от лечения вместо добивания. ВЫБОР цели задаёт следующая строка приоритета добивания духа, а не эта. Действует сразу. По умолчанию 2."
 pod_combat_tune_ai_mor_kill_label: "Приоритет добивания духа ИИ"
 pod_combat_tune_ai_mor_kill_tt: "Боевой дух врага, при котором или ниже которого выбор цели ИИ утраивает её вес для бойца, способного наносить урон духу. Аналог приоритета добивания по ячейкам ранений. Значение должно быть не ниже порога добивания духа, иначе ИИ сосредоточится на врагах, которых не сможет добить. Действует сразу. По умолчанию 3."