l_russian:
 aye_disconnected_modifier: "Отрыв от Айи"
 aye_disconnected_modifier_desc: "Вы потеряли связь с миром живых. Смертные чувствуют в вас что-то глубоко неправильное."
 orun_disconnected_modifier: "Отрыв от Оруна"
 orun_disconnected_modifier_desc: "Духовный мир отвернулся от вас. Ваши предки молчат. Вы одни в темноте."
 guruhi_beauty_1_modifier: "Отвратительный гурухи"
 guruhi_beauty_2_modifier: "Неприметный гурухи"
 guruhi_beauty_3_modifier: "Человекоподобный гурухи"
 guruhi_beauty_4_modifier: "Сияющий гурухи"
 spirit_blessed_modifier: "Благословение духа"
 spirit_blessed_modifier_desc: "Великий дух признал вас. Его сила сохраняется в вашей крови."
 spirit_beast_wound_modifier: "Рана духа-зверя"
 spirit_beast_wound_modifier_desc: "Отказ духа-зверя оставил рану, которая не поддаётся исцелению."
 beasts_counsel_modifier: "Совет Зверя"
 beasts_counsel_modifier_desc: "Ваш Зверь поделился своим пониманием природы дикой природы."
 fury_prowess_modifier: "Ярость Осебо"
 fury_prowess_modifier_desc: "Воинственные духи предков придают силу вашей руке."
 fury_unleashed_modifier: "Высвобождённая ярость"
 fury_unleashed_modifier_desc: "Вы полностью отдались ярости. Сила опьяняет и опасна."
 scholars_insight_modifier: "Взгляд учёного"
 scholars_insight_modifier_desc: "Древние знания открыли новые пути понимания."
 invoke_authority_of_the_living_modifier: "Авторитет живых"
 invoke_authority_of_the_living_modifier_desc: "Вы говорите голосом живого мира. Смертные подчиняются, потому что им приказывает сама земля."
 laibon_vassal_authority_modifier: "Айя: власть сюзерена"
 laibon_vassal_authority_modifier_desc: "Ваш сюзерен говорит с авторитетом живого мира. Даже мёртвые слушают."
 commune_with_ancestors_modifier: "Общение с предками"
 commune_with_ancestors_modifier_desc: "Предки ответили. Их сила течёт через вас, и их взгляд показывает то, что другие скрывают."
 mortal_petitioner_success_modifier: "Справедливый арбитр"
 mortal_petitioner_success_modifier_desc: "Ваше справедливое суждение заслужило уважение смертных в ваших владениях."
 mortal_petitioner_failure_modifier: "Несправедливый арбитр"
 mortal_petitioner_failure_modifier_desc: "Ваша попытка вынести приговор заставила смертных опасаться вашего авторитета."
 gathering_fire_modifier: "Костёр собрания"
 gathering_fire_modifier_desc: "Огонь собрания до сих пор горит в воспоминаниях тех, кто присутствовал на нём."
 harvest_celebration_modifier: "Страж урожая"
 harvest_celebration_modifier_desc: "Смертные помнят ваше присутствие на празднике. Вы их защитник."
 masquerade_breach_modifier: "Нарушение Маскарада"
 masquerade_breach_modifier_desc: "Слухи распространились среди смертных. С их правителем что-то не то."
 ancestors_grave_development_modifier: "Очищенная земля предков"
 ancestors_grave_development_modifier_desc: "Расчищенная земля была использована продуктивно, хотя духи этого не одобряют."
 guruhi_crown_modifier: "Тяжесть короны"
 guruhi_crown_modifier_desc: "Ваше личное вмешательство восстановило порядок среди ваших вассалов."
 vice_spreads_failure_modifier: "Безудержный порок"
 vice_spreads_failure_modifier_desc: "Ваша снисходительность оставила след в обществе. Смертные насторожены."