l_russian:
 # Phase Completion Rewards
 POD_asakku_phase1_reward: "Основание"
 POD_asakku_phase1_reward_desc: "Первые семена пустили корни. Другие уже несут инфекцию, и вы можете почувствовать каждого из них, слабые пульсации на грани сознания. Сущность удовлетворена таким образом, что это не имеет ничего общего с удовлетворением. Она просто признаёт прогресс."
 POD_asakku_phase3_reward: "Чистка западных узурпаторов"
 POD_asakku_phase3_reward_desc: "Западное направление Теневого крестового похода завершено. Камуты, которые охотились на вас, ушли, умерли или изменились. Голос в ваших мыслях не удовлетворён. Это означало бы конец."
 POD_asakku_phase4_reward: "Восточная расплата"
 POD_asakku_phase4_reward_desc: "Восток готов. Элиуды ушли. Истинная Рука выстояла, ослабленная и озадаченная. У Наблюдателя есть то, за чем он пришёл. Победа для вас или для них? Возможно, на данный момент это не имеет значения."

 POD_asakku_spread_wider: "Обширное распространение"
 POD_asakku_spread_wider_desc: "Инфекция распространяется дальше и быстрее. Терпение сущности уступило место целеустремлённости, и семена, которые вы посадите, пускают корни прежде, чем почва успеет возразить."
 POD_asakku_consolidated_network: "Консолидированная сеть"
 POD_asakku_consolidated_network_desc: "Выводок смыкает ряды. Его члены охраняют подступы друг к другу; при враждебных действиях любой путь нападения уже находится под наблюдением глаз, о которых никто не подозревал."
 POD_asakku_press_advantage: "Развитие успеха"
 POD_asakku_press_advantage_desc: "Элиуды пошатнулись, и вы не намерены позволить им прийти в себя. Сущность реализует ваши планы с острой настойчивостью."

 POD_asakku_sinister_mastery_1: "Зловещее мастерство"
 POD_asakku_sinister_mastery_1_desc: "Влияние сущности обостряет ваши инстинкты Изменчивости. Холерические искусства теперь стали более естественными."
 POD_asakku_sinister_mastery_2: "Зловещее мастерство (вознесение)"
 POD_asakku_sinister_mastery_2_desc: "Владение существа плотью глубже любой дисциплины. Ваше понимание Изменчивости превосходит то, что мог бы предложить любой наставник."
 POD_asakku_andeleon_brood: "Выводок Анделеона"
 POD_asakku_andeleon_brood_desc: "Те, кого вы развратили, движутся по миру как продолжение вашей воли. Больше рук, больше глаз, больше вас."
 POD_asakku_occultation: "Затемнение"
 POD_asakku_occultation_desc: "Сущность внутри учит вас прятаться способами, не имеющими ничего общего с тенями. Вас становится трудно воспринимать даже тем, кто точно знает, куда смотреть."
 POD_asakku_inner_babble: "Внутренний лепет"
 POD_asakku_inner_babble_desc: "Постоянный ропот мыслей сущности создаёт стену шума, через которую не могут проникнуть враждебные замыслы. Те, кто проникает в ваш разум, находят не тишину, а хор.\nНаделяет #P сильной ментальной защитой#!."
 POD_asakku_vicissitude_taint: "Скверна Изменчивости"
 POD_asakku_vicissitude_taint_desc: "Кровь погрузилась в саму землю. Земля становится странной, оборонительной, враждебной по отношению к посторонним, живой, не имеющей ничего общего с природой."
 POD_asakku_hunted: "Преследование элиудов"
 POD_asakku_hunted_desc: "Элиуд наметили этого [Glossary('каинита','game_concept_cainite_desc')] к уничтожению. Их камуты обмениваются разведданными, и будущие операции против этой цели станут эффективнее."
 POD_asakku_soul_infection_resistant: "Сопротивление заражению души"
 POD_asakku_soul_infection_resistant_desc: "Этот [Glossary('каинит','game_concept_cainite_desc')] едва избежал нежелательного вторжения чуждой сущности. В ближайшем будущем такие попытки будут встречать большую осторожность."