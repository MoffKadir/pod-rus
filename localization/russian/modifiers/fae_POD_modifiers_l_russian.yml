 PODElementalAscensionBuff_glome: "Ячейки [Concept('POD_health_track', 'здоровья')|E]: #P +1#!\nУлучшает базовые [Concept('crafting_nodes', 'узлы')|E] [Concept('crafting_forging', 'ковки')|E]."
 PODElementalAscensionBuff_kubera: "Затраты золота на [Concept('crafting', 'ремесло')|E]: #P -25%#!\n$passive_cantrip_actor$ Исцеляет [EmptyScope.ScriptValue('POD_ascended_kubera_heal')] ед. @health_track_damage_icon! [Concept('POD_superficial_damage', 'поверхностного урона')|E] союзным [Concept('knights', 'рыцарям')|E] при участии в [Concept('combat_phase', 'бою')|E] в качестве [Concept('commander', 'командира')|E], или вам самим во время [Concept('single_combat_duel_plural', 'поединков')|E]."
 PODElementalAscensionBuff_ondine: "$cantrip_standard_bunk$ Призывает цель к вашему двору.\n$cantrip_hard_bunk$ Призывает цель в вашу [Concept('prison', 'темницу')|E]"
 PODElementalAscensionBuff_paroseme: "Улучшает [Concept('cantrip', 'заклятие')|E] достоинства «[GetTrait('art_stratus').GetName(GetPlayer)]», удаляя ограничение размера [Concept('army', 'армии')|E]."
 PODElementalAscensionBuff_solimond: "$passive_cantrip_nature$ В зависимости от уровня #TOOLTIP:GAME_TRAIT,realm_nature,[GetNullCharacter] #L Природы#!#! #underline;TOOLTIP:PODElementalAscensionBuff_solimond_tt наносит#! @health_track_damage_icon! [Concept('POD_superficial_damage', 'поверхностный')|E] или @health_track_aggravated_damage_icon! [Concept('POD_aggravated_damage', 'серьёзный урон')|E] вражеским [Concept('knights', 'рыцарям')|E] при участии в [Concept('combat_phase', 'бою')|E] в качестве [Concept('commander', 'командира')|E], или вашим противникам во время [Concept('single_combat_duel_plural', 'поединков')|E]."
 PODElementalAscensionBuff_solimond_tt: "[GetPerk('realm_nature_1_perk').GetName(GetPlayer)]: 0 ед. @health_track_damage_icon! [Concept('POD_superficial_damage', 'поверхностного урона')|E]\n[GetPerk('realm_nature_2_perk').GetName(GetPlayer)]: 1 ед. @health_track_damage_icon! [Concept('POD_superficial_damage', 'поверхностного урона')|E]\n[GetPerk('realm_nature_3_perk').GetName(GetPlayer)]: 2 ед. @health_track_damage_icon! [Concept('POD_superficial_damage', 'поверхностного урона')|E]\n[GetPerk('realm_nature_4_perk').GetName(GetPlayer)]: 1 ед. @health_track_aggravated_damage_icon! [Concept('POD_aggravated_damage', 'серьёзного урона')|E]\n[GetPerk('realm_nature_5_perk').GetName(GetPlayer)]: 1 ед. @health_track_aggravated_damage_icon! [Concept('POD_aggravated_damage', 'серьёзного')|E] и 2 ед. @health_track_damage_icon! [Concept('POD_superficial_damage', 'поверхностного урона')|E]"
 PODElementalAscensionBuff_mannikin: "Даёт возможность использовать [Concept('noble_arts_lifestyle', 'благородные искусства')|E] с ограничением: нельзя разблокировать [Concept('perks', 'достоинства')|E] #N 4 уровня#! и выше."

