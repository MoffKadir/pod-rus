 POD_santa_modifier: "Санта"
 POD_santa_modifier_desc: "#flavor Санта-Клаус, Дед Мороз, Святой Николай, Веселый Старый Святой Ник, Йоулупукки, Крис Крингл, Синтерклаас, Вайнахтсманн, Белсникель, Юльнир, Микулаш, Пьер Ноэль, Святый Миколай, Дед Мороз, Лангбарр, Аяз Ата, Мош Герила, Йольский Козел, Человек с мешком#!\nРазблокировано новое [Concept('decision', 'решение')|E], позволяющее восстановить #V 5#! гламура за 125 [gold_i][Concept('gold', 'золота')|E]."

 POD_desperate_for_immortality: "Отчаянное стремление к бессмертию"
 POD_desperate_for_immortality_desc: "Вы были бессмертны, а теперь время идет..."
 POD_useless_dreamers: "Бесполезные мечтатели"
 POD_useless_dreamers_desc: "Благодаря изучению Банальности вы временно утратили способность эффективно осушать мечтателей.\nВы не можете получить гламур через [Concept('reverie', 'мечтание')|E]"
 POD_weird_dreaming_contection: "Странная связь с Грёзами"
 POD_weird_dreaming_contection_desc: "Из-за изучения гламура вы временно нарушили связь с [UmbraGlossaryLocalized('dreaming','Грёзами')], сделав заклятия более дорогостоящими.\nСтоимость #TOOLTIP:game_concept_cantrip_desc #E заклятий#!#! умножена на #N 2#!"
