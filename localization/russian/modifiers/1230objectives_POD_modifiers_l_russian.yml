 vatican_secrets_modifier: "Тайны Ватикана"
 vatican_secrets_modifier_desc: "Влияние Ласомбра на Святой Престол обеспечивает эзотерические знания и позволяет тайно перенаправлять их средства."

 beast_unleashed_modifier: "Зверь на свободе"
