 custom_mummy_dynasty_secured_future_modifier: "Основана Пятая династия"

 wutian_protector_of_knowledge_modifier: "Защитник знаний"
 wutian_protector_of_knowledge_modifier_desc: "Вы больше не получаете дополнительное #TOOLTIP:game_concept_static_stress_desc #E психическое напряжение#!#!, открывая [Concept('perks', 'достоинства')|E] из противоположного дерева Тан."

 wutian_protector_of_people_modifier: "Защитник народа"
 wutian_protector_of_people_modifier_desc: "Вы больше не получаете дополнительное #TOOLTIP:game_concept_static_stress_desc #E психическое напряжение#!#!, открывая [Concept('perks', 'достоинства')|E] из противоположного дерева Тан."

 wutian_protector_of_shen_modifier: "Защитник шэнь"
 wutian_protector_of_shen_modifier_desc: "Принятие предложения [Concept('vassalization', 'вассализации')|E]: #P +50#!\nВы больше не получаете дополнительное #TOOLTIP:game_concept_static_stress_desc #E психическое напряжение#!#!, открывая [Concept('perks', 'достоинства')|E] из противоположного дерева Тан."
 wutian_protector_of_shen_modifier_tt: "У вас есть модификатор [GetModifier('wutian_protector_of_shen_modifier').GetNameWithTooltip]: $VALUE|=+0$"

 wutian_ninth_immortal: "Девятый бессмертный"
 wutian_ninth_immortal_desc: "Этот персонаж поднялся до положения Девятого бессмертного, открыв в процессе новые могущественные знания."

 nomenclature_master_modifier: "Мастер онимики"
 nomenclature_master_modifier_desc: "Несмотря на неудачу в достижении Ра-Хекау, этот персонаж достиг чего-то близкого.\nМожно изменить любое базовое [Concept('trait', 'свойство')|E] через взаимодействие «Принять личность»"

 POD_all_is_well_under_heaven_modifier: "Всё хорошо под небесами"
