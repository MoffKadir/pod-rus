 lutetian_roots_modifier: "Лютецианские корни"
 lutetian_roots_modifier_desc: "Древние галльские традиции, защитные чары крови и ваши усилия очистили эту землю от адской скверны. Под вашим чутким руководством держава, наконец, будет процветать."

