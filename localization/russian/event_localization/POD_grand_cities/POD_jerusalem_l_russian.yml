 setites_corrupt_hunters_decision: "Безмолвная змеиная спираль"
 setites_corrupt_hunters_decision_desc: "Охотники уже давно беспокоят нас, укрепляя тюрьму, построенную эонами Ра, и истребляя тех, кто пытался из неё сбежать. Они очень отчаянно нуждаются в одобрении своего так называемого «бога».\n\nМы могли бы воспользоваться необычным безумием вокруг Иерусалима и использовать его значение как святого места, чтобы перенаправить пыл этих охотников. Некоторые из них уже принимают магию и обещают своим членам множество глубоких тайн. Мы можем просто вставить ещё несколько «освобождающих» идей, перенаправить их тайны на Сета и проникнуть в их причудливые «ячейки». Вскоре их фанатизм и оружие послужат Сету."
 setites_corrupt_hunters_decision_confirm: "Добро пожаловать, братья."
 setites_corrupt_hunters_decision_tooltip: "Охотники тратят столько ресурсов на своего так называемого «бога» — ресурсов, которые лучше послужили бы целям Сета."
 setites_corrupt_hunters_decision_effect: "#TOOLTIP:GAME_TRAIT,supehunter,[GetNullCharacter] #L Охотники#!#! перестанут воспринимать вампиров, особенно сетитов, как непримиримых врагов. Вместо этого вас будут воспринимать как ангелов, пророков, чудотворцев и святых."
 setites_corrupt_hunters_decision_holy_city_jerusalem_requirement_tooltip: "Вы должны контролировать и обратить город [GetTitleByKey('c_jerusalem').GetNameNoTier], поскольку это ключевая святыня авраамических верований, что увеличит ваше влияние на охотников"
 setites_corrupt_hunters_decision_holy_city_mecca_requirement_tooltip: "Вы должны контролировать и обратить город [GetTitleByKey('c_mecca').GetNameNoTier], поскольку это ключевая святыня авраамических верований, что увеличит ваше влияние на охотников"
 setites_corrupt_hunters_decision_holy_city_constantinople_requirement_tooltip: "Вы должны контролировать и обратить город [GetTitleByKey('c_byzantion').GetNameNoTier], поскольку это ключевая святыня авраамических верований, что увеличит ваше влияние на охотников"
 setites_corrupt_hunters_decision_holy_city_rome_requirement_tooltip: "Вы должны контролировать и обратить город [GetTitleByKey('c_roma').GetNameNoTier], поскольку это ключевая святыня авраамических верований, что увеличит ваше влияние на охотников"



 demons_temptation_revelry_decision: "Насладиться своей порочностью"
 demons_temptation_revelry_decision_desc: "По мере того, как вы глубже осознаёте свою греховную развращённость, ментальное эхо распространяется среди населения, окружающего Иерусалим, соблазняя их отправиться в такие же глубины. Каждый грех становится поклонением вашему славному величию. Каждое падение усиливает вашу власть над этой так называемой Святой Землёй. Со временем они узнают вашу истинную силу и назовут это место его подлинным именем, которое будет почитать вас должным образом: Адская Земля."
 demons_temptation_revelry_decision_confirm: "Все будут служить мне!"
 demons_temptation_revelry_decision_tooltip: "Я направлю отголоски этой земли для своих целей"
 demons_temptation_revelry_decision_effect: "Если у цели [Concept('character_interaction', 'взаимодействия персонажа')|E] «$POD_read_the_heart_interaction$» есть [Concept('trait', 'свойство')|E], соответствующее #bold любому#! греху, этот персонаж примет вашу [Concept('faith', 'конфессию')|E]"



 salubri_saulots_plans_decision: "Замыслы Саулота"
 salubri_saulots_plans_decision_desc: "Несмотря на усилия узурпаторов, у нашего основателя Саулота было много замыслов и намерений. По причинам, которые никто из нас не понял, многие из них касались Иерусалима. Возможно, именно тёмное присутствие, дремлющее неподалёку, привлекло его внимание. Возможно, это была религиозная мания, охватившая этот регион. Возможно, это был его вечный поиск центра мира, точки, вокруг которой, казалось, вращались все события и кружилась вся политика. Возможно, он нашёл его в Иерусалиме, на землях, которым поклонялись многие, недалеко от многих других больших и важных городов. Несмотря на это, у нас есть потенциал достичь одной из его целей и получить вознаграждение, которое он искал."
 salubri_saulots_plans_decision_confirm: "Его замыслы осуществятся."
 salubri_saulots_plans_decision_tooltip: "У Саулота были замыслы относительно Иерусалима. Мы должны завершить их, какими бы они ни были."
 salubri_saulots_plans_decision.second_step: "Его замысел состоял в том, чтобы..."
 salubri_saulots_plans_decision_requirement_prowess: "Ваша [GetPlayer.Custom('PODCoterie')|l] должна иметь не менее 125 [Concept('prowess', 'доблести')|E]"
 salubri_saulots_plans_decision_requirement_prowess_alt: "Ваша [GetPlayer.Custom('PODCoterie')|l] должна иметь не менее 75 [Concept('prowess', 'доблести')|E]"
 salubri_saulots_plans_decision_requirement_regiment: "В баронстве [GetTitleByKey('b_jerusalem').GetName] размещён полк [Concept('men_at_arms', 'профессионалов')|E]"
 salubri_saulots_plans_decision_requirement_freed: "[GetTitleByKey('c_jerusalem').GetName] #bold не#! имеет модификатора «[GetModifier('freed_from_taint_modifier').GetNameWithTooltip]»"
 salubri_saulots_plans_decision_requirement_soothed: "[GetTitleByKey('c_jerusalem').GetName] #bold не#! имеет модификатора «[GetModifier('soothed_mania_modifier').GetNameWithTooltip]»"
 salubri_saulots_plans_decision_requirement_not_already_done: "Вы ещё #bold не#! выполнили «$salubri_saulots_plans_decision.tt.watcher_route$»"
 salubri_saulots_plans_decision_requirement_baali: "Вы пленили как минимум #V 3#! персонажей со свойством «[GetTrait('baali').GetName( GetPlayer )]»"
 salubri_saulots_plans_decision_requirement_baali_alt: "Вы пленили как минимум #V 1#! персонажа со свойством «[GetTrait('baali').GetName( GetPlayer )]»"
 salubri_saulots_plans_decision_requirement_malkavian: "Вы пленили как минимум #V 5#! персонажей со свойством «[GetTrait('malkavian').GetName( GetPlayer )]»"
 salubri_saulots_plans_decision_requirement_malkavian_alt: "Вы пленили как минимум #V 3#! персонажей со свойством «[GetTrait('malkavian').GetName( GetPlayer )]»"
 salubri_saulots_plans_decision.tt.warrior_route: "Уничтожить порчу"
 salubri_saulots_plans_decision.tt.warrior_route_desc: "Тёмные сущности таятся под Иерусалимом. Хотя сами они вне нашей досягаемости, мы могли бы уничтожить пятерых вампиров, запятнанных их влиянием, которые теперь известны только по числу, которое они повторяют бесконечно. Без сомнения, порча со временем вернётся, но на какое-то время она даст нам покой."
 warrior_route_tooltip: "#bold $salubri_saulots_plans_decision.tt.warrior_route$#!\n\n#weak $salubri_saulots_plans_decision.tt.warrior_route_desc$#!"
 salubri_saulots_plans_decision.tt.healer_route: "Успокоить то, что спит"
 salubri_saulots_plans_decision.tt.healer_route_desc: "Иерусалим охватила тьма и безумие, зло, пробуждённое недавними событиями. Если бы их снова погрузили в сон, возможно, мир вернулся бы в это беспокойное место, и земля могла бы начать исцеляться."
 healer_route_tooltip: "#bold $salubri_saulots_plans_decision.tt.healer_route$#!\n\n#weak $salubri_saulots_plans_decision.tt.healer_route_desc$#!"
 salubri_saulots_plans_decision.tt.watcher_route: "Украсть из тьмы"
 salubri_saulots_plans_decision.tt.watcher_route_desc: "Что-то дремлет под Иерусалимом, оказывая своё влияние на смертных и даже на вампиров. Инферналисты-баали и безумные малкавиане кажутся особенно затронутыми и заинтересованными, поэтому они могут иметь некоторые ключи к разгадке более глубоких тайн. Мы могли бы найти гораздо лучшее применение этим секретам и силам."
 watcher_route_tooltip: "#bold $salubri_saulots_plans_decision.tt.watcher_route$#!\n\n#weak $salubri_saulots_plans_decision.tt.watcher_route_desc$#!"
 freed_from_taint_modifier: "Освобождение от порчи"
 freed_from_taint_modifier_desc: "Марионетки инфернальной порчи были истреблены, временно освободив землю от её прямого влияния."
 soothed_mania_modifier: "Усмирённая мания"
 soothed_mania_modifier_desc: "По мере того как религиозная мания утихает, земля восстанавливается, а город стабилизируется."











 jerusalem_shift_balance_of_power_decision: "Изменить баланс сил в Иерусалиме"
 jerusalem_shift_balance_of_power_decision_desc: "[Concept('grand_city', 'Великий город')|E] #TOOLTIP:game_concept_holy_jerusalem_desc #E Священный Иерусалим#!#! балансирует на острие ножа, балансируя между тремя основными религиозными группировками. Евреи, христиане и мусульмане постоянно борются за дальнейший контроль над своим священным городом. Их сверхъестественные собраться часто вовлекаются в эти конфликты с той или иной целью. Если у вас есть ресурсы, вы могли бы изменить баланс сил в пользу предпочитаемой вами фракции или попытаться сохранить баланс."
