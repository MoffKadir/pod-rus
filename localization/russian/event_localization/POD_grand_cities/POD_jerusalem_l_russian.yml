 POD_jerusalem.35.t: "Баланс сил"
 POD_jerusalem.35.desc: "[Concept('grand_city', 'Великий город')|E] #TOOLTIP:game_concept_holy_jerusalem_desc #E Священный Иерусалим#!#! балансирует на острие ножа, лавируя между тремя основными религиозными фракциями. В зависимости от ваших целей вам нужно будет сместить равновесие сил в пользу той или иной фракции. Помните, что равновесие будет смещаться каждый год на #TOOLTIP:POD_jerusalem_tt_muslim #L;V [GetPlayer.MakeScope.ScriptValue('POD_jerusalem_muslim_influence_passive')|=2]% в пользу мусульман#!#!, на #TOOLTIP:POD_jerusalem_tt_christian #L;V [GetPlayer.MakeScope.ScriptValue('POD_jerusalem_christian_influence_passive')|=2]% в пользу христиан#!#! и на #TOOLTIP:POD_jerusalem_tt_jewish #L;V [GetPlayer.MakeScope.ScriptValue('POD_jerusalem_jewish_influence_passive')|=2]% в пользу иудеев#!#!, постепенно приближаясь к равновесным значениям: #V [GetPlayer.MakeScope.ScriptValue('POD_jerusalem_equilibrium_muslim_influence')|0]%#! для мусульман, #V [GetPlayer.MakeScope.ScriptValue('POD_jerusalem_equilibrium_christian_influence')|0]%#! для христиан и #V [GetPlayer.MakeScope.ScriptValue('POD_jerusalem_equilibrium_jewish_influence')|0]%#! для иудеев. Помните, что равновесие смещается по мере изменения сил смертных и демографической ситуации."
 POD_jerusalem_tt_christian: "[GetPlayer.MakeScope.GetScriptValueDesc('POD_jerusalem_christian_influence_passive')]"
