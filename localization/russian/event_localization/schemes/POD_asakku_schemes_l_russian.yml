 # Soul Infection scheme event chain
 POD_asakku.0030.t: "Нечто в крови"
 POD_asakku.0030.desc: "Вы чувствуете это раньше, чем понимаете: неправильность в движении вашей крови, словно что-то проверяет поток. Что-то глубоко, глубоко не так. Изменчивость в ваших жилах сегодня ощущается по-другому. Тяжелее.\n\nПо правде говоря, это началось не сегодня вечером. Такие мелочи, как привкус в задней части горла, не связанный с каким-либо кормлением, или момент дезориентации, когда вы потянулись к знакомой дисциплине и на кратчайшее мгновение почувствовали, что что-то ещё потянулось вместе с вами. Руки, которыми вы не владеете, двигаются в тандеме с вашими.\n\nВы не знаете, что с вами это делает. Знаете только, что оно терпеливо и что сегодня оно ближе, чем накануне."
 POD_asakku.0030.a: "Бороться с этим."
 POD_asakku.0030.b: "Впустить это."
 POD_asakku.0031.t: "Борьба"
 POD_asakku.0031.desc: "[defender.GetFirstName] сопротивляется в крови. [defender.GetSheHe|U] ещё не осознает, что движется через н[defender.GetHerHis], упрямство древней [Glossary('витэ','game_concept_vitae_desc')], распознавшей чужую волю. Вы чувствуете отторжение, как давление на сжатый кулак. Вы можете прорваться через это. Вопрос в том, стоит ли платить сегодня вечером эту цену."
 POD_asakku.0031.a: "Преодолеть сопротивление."
 POD_asakku.0031.a.success.desc: "Инфекция одерживает верх. Сопротивление персонажа [defender.GetFirstName] рушится."
 POD_asakku.0031.a.failure.desc: "[defender.GetFirstName] сопротивляется. Кровь отвергает семя."
 POD_asakku.0031.b: "Отказаться от попытки."
 POD_asakku_cancel_scheme_tt: "Отменить происки «Заражение души»."
 POD_asakku.0032.t: "Семя пускает корни"
 POD_asakku.0032.desc: "Дело сделано. Инфекция взяла верх. Это можно почувствовать, как чувствуешь биение собственного сердца в чужой крови. [defender.GetSheHe|U] пока не знает, что случилось с [Select_CString(defender.IsFemale, 'ней', 'ним' )]. Но [defender.GetSheHe] узнает.\n\nГолос в ваших мыслях отмечает завершение так, как мастер отмечает завершённую работу. В этом есть своего рода удовлетворение, но это удовлетворение не полностью ваше. Вы [Select_CString(ROOT.Char.IsFemale, 'та', 'тот' )], кто [Select_CString(ROOT.Char.IsFemale, 'сделала', 'сделал' )] всю работу. Сущность – это то, для чего была выполнена работа. В такие ночи становится трудно сказать, кто держит вожжи."
 POD_asakku.0032.a: "Больше рук в мире."
 POD_asakku.0033.t: "Сопротивление"
 POD_asakku.0033.desc: "Попытка не удалась. [defender.GetFirstName] сопротивляется чем-то в своей крови, не пониманием, не верой, а простым упрямством библейского проклятия, чувствующего, когда что-то глубоко неправильно и не должно быть здесь."
 POD_asakku.0033.a: "[defender.GetSheHe|U] [Select_CString(defender.IsFemale, 'оказалась', 'оказался' )] сильнее, чем ожидалось."
 POD_asakku.0034.t: "Что-то изменилось"
 POD_asakku.0034.desc: "Вы просыпаетесь с голосом, который не принадлежит вам. Оно не говорит словами. Оно говорит с голодом, и с терпением, и с уверенностью, не имеющей ничего общего с верой. Вы изменились.\n\nИзменчивость, которая была с вами на протяжении веков, теперь ощущается по-другому, как будто она вспомнила что-то, что забыла. Когда вы тянетесь к этому сегодня вечером, что-то возвращается обратно. Дисциплину у вас не отобрали, это лишь показало, что вы никогда не были её [Select_CString(ROOT.Char.IsFemale, 'единственной обладательницей', 'единственным обладателем' )].\n\nВы всё ещё вы. По большей части. Та часть вас, которая всё ещё является вами, уже пытается определить, что представляет собой другая часть, и уже обнаруживает, что это более сложный вопрос, чем должен быть."
 POD_asakku.0034.a: "Кем я [Select_CString(ROOT.Char.IsFemale, 'стала', 'стал' )]?"
 POD_asakku.0035.t: "Ваше сопротивление"
 POD_asakku.0035.desc: "Кто-то пытался что-то заронить в вашу кровь. На этот раз вы справились с этим. Память о вторжении сохраняется, как вкус, который вы не можете определить.\n\nЧто бы это ни было, оно интересовалось не вами конкретно, а Изменчивостью, а вы были просто комнатой, в которой Изменчивость жила. Эта мысль не утешает. Это подразумевает, среди прочего, что следующая попытка не потребует новых усилий. Комната всё ещё там. Кто-то уже нанёс на карту дверь."
 POD_asakku.0035.a: "Я буду осторожнее."

 # Kamut Recruitment scheme event chain
 POD_asakku.0250.t: "Предложение"
 POD_asakku.0250.desc: "[attacker.GetSheHe|U] приходит к вам так же, как люди, несущие ужасные знания, приходят к другим: осторожно, с особым терпением [Select_CString(attacker.IsFemale, 'той', 'того' )], кто [Select_CString(attacker.IsFemale, 'усвоила', 'усвоил' )], что большинство людей не хотят слышать то, что они говорят.\n\nСвидетельства не являются драматичными. Модель поведенческих изменений среди [Glossary('каинитов','game_concept_cainite_desc')], владеющих Изменчивостью. Серия исчезновений при дворах, которые, если их разложить, сводятся к одной расходящейся точке на Кавказе. Имена, которые всплывают в отчётах разведки, а затем перестают всплывать, не потому, что люди умерли, а потому, что они перестали быть самими собой в каком-либо значимом смысле.\n\nЭлиуд, [Select_CString(attacker.IsFemale, 'которая', 'который' )] приносит вам это, не [Select_CString(attacker.IsFemale, 'похожа', 'похож' )] на [Select_CString(attacker.IsFemale, 'охотницу', 'охотника' )]. [attacker.GetSheHe|U] выглядит [Select_CString(attacker.IsFemale, 'усталой', 'усталым' )], как будто кто-то, кто носил эти знания в одиночку дольше, чем это необходимо для здоровья.\n\n[attacker.GetSheHe|U] просит вас принять на себя часть этих знаний."
 POD_asakku.0250.a: "Отказаться. Это не мой бой."
 POD_asakku.0250.b: "Согласиться. Покажи мне, что нас преследует."
 POD_asakku.0251.t: "[Select_CString(defender.IsFemale, 'Новая охотница', 'Новый охотник' )]"
 POD_asakku.0251.desc: "[defender.GetFirstName|U] соглашается. Не с энтузиазмом, который вызвал бы беспокойство, и не с нежеланием, которое было бы бесполезно. [defender.GetSheHe|U] принимает это с мрачной ясностью человека, который взглянул на доказательства и понял, что они означают. Это тот вид принятия, который длится долго.\n\nВы показываете [defender.GetHerHim] протоколы. Железные иглы, которые Ямаданда разработал для обозначения искажённых. Признаки, которые следует искать в [Glossary('каинитах','game_concept_cainite_desc')], чья Изменчивость начала отвечать чему-то другому, а не своему владельцу. Особая тишина, окутывающая двор, где пустила корни инфекция.\n\n[defender.GetSheHe|U] принимает всё. К [defender.GetHerHis] чести, [defender.GetSheHe] не вздрагивает. Когда вы закончили, [defender.GetSheHe] задаёт вопрос, который задаёт каждый новый охотник, который отделяет тех, кто выдержит, от тех, кто не выдержит: «Как мы узнаем, что победили?»\n\nВы даёте [defender.GetHerHim] ответ, который даёт каждый опытный охотник: «Никак. Мы знаем лишь, что ещё не проиграли»."
 POD_asakku.0251.a: "Добро пожаловать в камут."
 POD_asakku.0252.t: "Отказ в вербовке"
 POD_asakku.0252.desc: "[defender.GetFirstName] внимательно слушает и раздумывает. И тогда [defender.GetSheHe] отказывается, как разумные люди отказываются от необоснованных просьб, с осторожной вежливостью [Select_CString(defender.IsFemale, 'той', 'того' )], кто [Select_CString(defender.IsFemale, 'решила', 'решил' )], что говорящий с ними либо ошибается, либо нездоров.\n\nВы не можете винить [defender.GetHerHis]. Доказательства, изложенные для человека, который не потратил годы на то, чтобы научиться их читать, выглядят как паранойя. Закономерности исчезновений во дворе. Поведенческие изменения, которые можно объяснить десятком обыденных причин. Теория заговора о древней сущности, которая живёт в крови носителей Изменчивости. Для непосвящённых это звучит точно так же, как говорят себе [Glossary('каиниты','game_concept_cainite_desc')], когда Долгая ночь затянулась и тени начали выглядеть так, будто у них есть намерения.\n\nВы складываете улики. Вы благодарите [defender.GetHerHis] за уделённое время. Вы выходите в ночь, зная, что в следующий раз, когда увидите [defender.GetHerHis], вы будете следить за знаками. Потому что сущности не нужны верующие. Ей нужны только носители."
 POD_asakku.0252.a: "Будут и другие."

 # Decision events
 POD_asakku.0301.t: "Зарождение в крови"
 POD_asakku.0301.desc: "Сущность, поднимающаяся из колодца, не наделяет, она заменяет. Вы открываете жилу и даёте [Select_CString(target.IsFemale, 'пленнице', 'пленнику' )] пить до тех пор, пока [target.GetSheHe] не перестанет быть [Select_CString(target.IsFemale, 'пустой', 'пустым' )].\n\n[target.GetSheHe|U] сначала сопротивляется. Затем вкус достигает [target.GetHerHis], и сопротивление слабеет. [target.GetSheHe|U] пьёт, пройдя тот момент, когда обычная кровь перестаёт быть интересной. [target.GetSheHe|U] пьёт до тех пор, пока что-то в [target.GetHerHis] лице не меняется, появляется небольшое расслабление в уголках рта, неподвижность в глазах, которой раньше не было.\n\nУтром [target.GetSheHe] проснётся, и [target.GetHerHis] глазами будет смотреть что-то, чего не было раньше. [target.GetSheHe|U] не запомнит это изменение как насилие. [target.GetSheHe|U] запомнит это, если [target.GetSheHe] вообще запомнит, как возвращение домой."
 POD_asakku.0301.a: "Больше рук в мире."
 POD_asakku.0302.t: "На следующее утро"
 POD_asakku.0302.desc: "[target.GetFirstName|U] просыпается [Select_CString(target.IsFemale, 'дезориентированной', 'дезориентированным' )], как вы и ожидали. Чего вы не ожидали, так это того, что [target.GetSheHe] смотрит на вас так, как выглядит зеркало, без выражения лица, полностью принадлежащего [target.GetHerHim].\n\n[target.GetSheHe|U] говорит другим голосом.\n\nВы заметили. И голос в вашей крови замечает, что вы это заметили, и между вами наступает момент чего-то вроде общего веселья, в котором вы не можете точно уловить нить. Когда вы перестаёте смеяться, вы не уверены, кто из вас начал."
 POD_asakku.0302.a: "Хорошо."
 POD_asakku.0310.t: "Засеивание сада"
 POD_asakku.0310.desc: "Кровь впитывается быстрее, чем должна. К утру трава на границе ваших владений приобрела красноватый оттенок. Голос в ваших мыслях удовлетворён, как это редко бывает с людьми."
 POD_asakku.0310.a: "Пусть оно прорастёт."
 POD_asakku.0320.t: "Шёпот души"
 POD_asakku.0320.desc: "Вы достигли единения. С каждым разом требуется меньше усилий. Через вложенную кровь вы чувствуете то же, что они, и учитесь тому, чему научились они."
 POD_asakku.0320.a: "Знание – это сила."

 # Character Interaction descriptions
 POD_asakku_soul_infection_interaction: "Заражение души"
 POD_asakku_soul_infection_interaction_desc: "Распространить влияние Асакку на этого вампира через вектор Изменчивости."
 POD_asakku_only_one_soul_infection_at_time: "Одновременно вы можете начать только одни происки «Заражение души»."
 scheme_interaction_tt_POD_asakku_soul_infection_scheme_approved: "Начать распространение влияния Асакку на этого вампира."
 POD_asakku_kamut_recruitment_interaction: "Завербовать в камут"
 POD_asakku_kamut_recruitment_interaction_desc: "Завербовать этого персонажа в сеть охотников-элиудов для борьбы с угрозой Асакку."
 POD_asakku_only_one_kamut_at_time: "Одновременно вы можете завербовать только одного члена камута."
 POD_asakku_blood_inception_interaction: "Зарождение в крови"
 POD_asakku_blood_inception_interaction_desc: "Вскрыть жилу и позволить пленнику испить, заменив то, что есть, на то, что вы носите с собой."