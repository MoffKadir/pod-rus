l_russian:

 # SETITE — Serpent's Embrace: Success
 pod_setite_serpent_embrace.0001.t: "Кольца Змея затягиваются"
 pod_setite_serpent_embrace.0001.desc: "Свершилось.\n\nДлительное ухаживание наконец окончено. Сегодня [target.GetFirstNameNoTooltip] [Select_CString(target.GetFirstNameNoTooltip, 'прибыла', 'прибыл' )] к вас по своей воле, с глазами впалыми от тяжести каждого убеждения, что вы терпеливо разрушали, каждого удобства, что вы медленно отравляли, каждого недоступного удовольствия, которыми вы дразнили [Select_CString(target.GetFirstNameNoTooltip, 'её', 'его' )]. [target.GetSheHe|U] [Select_CString(target.GetFirstNameNoTooltip, 'преклонилась', 'преклонился' )], не перед вами, но перед истиной, которую вы нашёптывали в [target.GetHerHis] душу ночь за ночью: что весь мир отвернулся от [Select_CString(target.GetFirstNameNoTooltip, 'неё', 'него' )], что только мудрость Сета может придать смысл этим страданиям.\n\n[target.GetSheHe|U] произносит слова обращения с дрожью и пылом того, кто был рождён снова. Змея не гонится за добычей; она выжидает, и наблюдает, зная, что добыча сама заползет в её пасть. Вы чувствуете благосклонность Сета, словно холодная чешуя скользит по вашей спине, очередная душа втянута в извивающуюся тьму, очередная лампа потухла в верхнем мире. Весть об этом обращении разлетится, и иные, кто считал, что [target.GetFirstNameNoTooltip] [Select_CString(target.GetFirstNameNoTooltip, 'непоколебима', 'непоколебим' )], начнуть гадать, насколько они сами непоколебимы.\n\nЕщё одна душа вступила на Путь Сета. Верхний мир становится чуть более тусклым, и чешуйки великого змея простираются шире."
 pod_setite_serpent_embrace.0001.a: "Сет вознаграждает своих терпеливых слуг."

 pod_setite_serpent_embrace.0002.t: "Шёпот Змея"
 pod_setite_serpent_embrace.0002.desc: "Прошли месяцы, быть может дольше, с тех пор как [scheme_owner.GetFirstNameNoTooltip] впервые [Select_CString(target.GetFirstNameNoTooltip, 'повстречалась', 'повстречался' )] вам. В то время вас ничего не настораживало; случайная встреча, подаренный кувшин вина, остроумный пируэт в диалоге. Затем, ещё одна встреча. После этого - письмо. Затем тихий вечер, наполненный философскими изречениями и смехом, каким-то образом, заставил вас усомниться в вещах, в которые вы искренне верили.\n\nЭтой ночью вы осознали. Сны, от которых вы просыпались с именем Сета на устах. Аргументы ваших прошлых убеждений, которые вдруг стали звучать неубедительно, когда вы пытаетесь декламировать их. Странная уверенность, когда смыкаются ваши глаза, что весь мир - ложь, похожая на светлая оболочку, под которой скрывается более глубокая и тёмная истина.\n\n[scheme_owner.GetFirstNameNoTooltip] снова перед вами, и вы, наконец, понимаете, что [scheme_owner.GetSheHe] [Select_CString(target.GetFirstNameNoTooltip, 'делала', 'делал' )] всё это время. Змеиная чешуя уже обвивает вас. Вопрос не в том, обратитесь ли вы, а примете ли это как прозрение, или будете с боем выбираться из учения, что уже практически захватило вашу душу."
 pod_setite_serpent_embrace.0002.a: "Истина Сета нашла меня. Я ступлю на тёмную дорогу добровольно."
 pod_setite_serpent_embrace.0002.b: "Меня не сделают слугой Сета."