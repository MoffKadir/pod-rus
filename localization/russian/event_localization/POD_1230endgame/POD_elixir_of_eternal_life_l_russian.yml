l_russian:
 POD_mummy_elixir_of_eternal_life.001.t: "Просьба о помощи"
 POD_mummy_elixir_of_eternal_life.001.desc: "«Путь необъясним, Тропа за пределами учения, Дорога за пределами слов. Попытка поведать о нём — или, что ещё хуже, успешная попытка — стала бы проклятием для вашего будущего. Даже могучее дерево не может вырасти в полную высоту с украденным светом. Только обучаясь, вы доказываете, что достойны учить. Только своими собственными усилиями вы сможете продвинуться вперёд и по-настоящему приблизиться к Третьему воплощению. Тем не менее, мы будем точильным камнем для вашего клинка. С каждым вашим шагом мы будем направлять вас, чтобы вы могли сделать следующий, поскольку эти шаги — ваши собственные»."
 POD_mummy_elixir_of_eternal_life.001.a: "Благодарю вас за наставления."
 POD_mummy_elixir_of_eternal_life.001.a.tt: "Каждый раз, когда вы завершаете [Concept('journey', 'странствие')|E], прозрения Восьми бессмертных приносят #color_white 5.00#! дополнительного [Concept('trait_level_track_xp', 'опыта')|E] в изучении эликсира Вечной жизни #weak ([GetTrait('eternal_rebirth_seeker').GetName( GetPlayer )])#!"

 POD_mummy_elixir_of_eternal_life.002.t: "Внутреннее мастерство"
 POD_mummy_elixir_of_eternal_life.002.desc: "Пришло время изменить себя, избавиться от тех свойств, которые меня сдерживают. Путь, конечно, трудный, но необходимый."
 POD_mummy_elixir_of_eternal_life.002.option.desc: "Испытание себя"
 POD_mummy_elixir_of_eternal_life.002.success: "Вы успешно прошли испытание"
 POD_mummy_elixir_of_eternal_life.002.failure: "Вы провалили испытание"
 POD_mummy_elixir_of_eternal_life.002.a: "Алкоголь не затуманит мой разум."
 POD_mummy_elixir_of_eternal_life.002.a.tt: "Вы попытаетесь избавиться от свойства «[GetTrait('drunkard').GetName(GetNullCharacter)]»"
 POD_mummy_elixir_of_eternal_life.002.b: "Я не буду наказывать себя."
 POD_mummy_elixir_of_eternal_life.002.b.tt: "Вы попытаетесь избавиться от свойства «[GetTrait('flagellant').GetName(GetNullCharacter)]»"
 POD_mummy_elixir_of_eternal_life.002.c: "Возможно, я ем слишком много."
 POD_mummy_elixir_of_eternal_life.002.c.tt: "Вы попытаетесь избавиться от свойства «[GetTrait('comfort_eater').GetName(GetNullCharacter)]»"
 POD_mummy_elixir_of_eternal_life.002.d: "Я не позволю гневу контролировать меня."
 POD_mummy_elixir_of_eternal_life.002.d.tt: "Вы попытаетесь избавиться от свойства «[GetTrait('irritable').GetName(GetNullCharacter)]»"
 POD_mummy_elixir_of_eternal_life.002.e: "Я не позволю похоти руководить мной."
 POD_mummy_elixir_of_eternal_life.002.e.tt: "Вы попытаетесь избавиться от свойства «[GetTrait('rakish').GetName(GetNullCharacter)]»"
 POD_mummy_elixir_of_eternal_life.002.f: "Я не могу спрятаться от своих проблем."
 POD_mummy_elixir_of_eternal_life.002.f.tt: "Вы попытаетесь избавиться от свойства «[GetTrait('hashishiyah').GetName(GetNullCharacter)]»"
 POD_mummy_elixir_of_eternal_life.002.g: "Жадность – это нехорошо."
 POD_mummy_elixir_of_eternal_life.002.g.tt: "Вы попытаетесь избавиться от свойства «[GetTrait('profligate').GetName(GetNullCharacter)]»"
 POD_mummy_elixir_of_eternal_life.002.h: "Бегу ли я от того, что нужно сделать?"
 POD_mummy_elixir_of_eternal_life.002.h.tt: "Вы попытаетесь избавиться от свойства «[GetTrait('craven').GetName(GetNullCharacter)]»"
 POD_mummy_elixir_of_eternal_life.002.i: "Позволяю ли я гневу подпитывать меня?"
 POD_mummy_elixir_of_eternal_life.002.i.tt: "Вы попытаетесь избавиться от свойства «[GetTrait('wrathful').GetName(GetNullCharacter)]»"
 POD_mummy_elixir_of_eternal_life.002.j: "Позволяю ли я похоти одолеть меня?"
 POD_mummy_elixir_of_eternal_life.002.j.tt: "Вы попытаетесь избавиться от свойства «[GetTrait('lustful').GetName(GetNullCharacter)]»"
 POD_mummy_elixir_of_eternal_life.002.k: "Не слишком ли я гонюсь за своей силой?"
 POD_mummy_elixir_of_eternal_life.002.k.tt: "Вы попытаетесь избавиться от свойства «[GetTrait('ambitious').GetName(GetNullCharacter)]»"
 POD_mummy_elixir_of_eternal_life.002.l: "Избегаю ли я того, что должен сделать?"
 POD_mummy_elixir_of_eternal_life.002.l.tt: "Вы попытаетесь избавиться от свойства «[GetTrait('lazy').GetName(GetNullCharacter)]»"
 POD_mummy_elixir_of_eternal_life.002.m: "Люблю ли я деньги больше, чем людей?"
 POD_mummy_elixir_of_eternal_life.002.m.tt: "Вы попытаетесь избавиться от свойства «[GetTrait('greedy').GetName(GetNullCharacter)]»"
 POD_mummy_elixir_of_eternal_life.002.n: "Позволяю ли я еде поглотить меня?"
 POD_mummy_elixir_of_eternal_life.002.n.tt: "Вы попытаетесь избавиться от свойства «[GetTrait('gluttonous').GetName(GetNullCharacter)]»"
 POD_mummy_elixir_of_eternal_life.002.o: "Наслаждаюсь ли я жестокостью?"
 POD_mummy_elixir_of_eternal_life.002.o.tt: "Вы попытаетесь избавиться от свойства «[GetTrait('sadistic').GetName(GetNullCharacter)]»"
 POD_mummy_elixir_of_eternal_life.002.p: "Неважно."

 POD_mummy_elixir_of_eternal_life.003.t: "Одно завершено, другое начато"
 POD_mummy_elixir_of_eternal_life.003.desc: "Теперь, когда вы достигли базового понимания эликсира Вечной жизни, прежнего пути уже недостаточно для дальнейшего роста. Чтобы создать эликсир, человек должен понять себя и вселенную, в которой он живёт. Для этого вам нужно будет путешествовать по всему миру, чтобы собирать древние записи, учиться на ошибках других и размышлять над уроками, которые вы собрали. Кроме того, вам нужно будет потратить время на проведение исследований, медленный перевод записей, варку зелий и укрепление своей базы совершенствования.\n\n#help Чтобы достичь 90 [Concept('trait_level_track_xp', 'опыта')|E] эликсира Вечной жизни и продвинуться дальше, вам нужно будет пассивно накапливать его и завершать [Concept('journeys', 'странствия')|E]. Чтобы узнать больше, см. [Concept('POD_elixir_of_eternal_life', 'эту подсказку')|E] и описание свойства «Искатель вечного перерождения» под вашим персонажем.#!"
 POD_mummy_elixir_of_eternal_life.003.a: "Мои поиски ещё не окончены..."

 POD_mummy_elixir_of_eternal_life.100.t: "Навеки связующий купорос"
 POD_mummy_elixir_of_eternal_life.100.desc: "Мужчина в идеально сшитом костюме входит в ваш тронный зал, минуя стражу. Его волосы зачёсаны назад и настолько гладки и идеально сформированы, что напоминают шлем, надетый на его голову. Части металлических механизмов, торчащие из его плоти, лишь усиливают созданный образ.\n\nОн представляется агентом [Glossary('повелителя Яма','podgloss.yamaking')] [Glossary('Микабоши','podgloss.mikaboshi')]. Он слышал о ваших поисках эликсира Вечной жизни и хочет сделать вам предложение. Вы свяжете свой ритуал с [Glossary('Городом чудищ','podgloss.wickedcity')] и используете свои знания для создания войска Ву-Куэй — мумий, работающих над созданием машинного государства. В обмен он поможет вам превратить вашу державу в державу обыденной и роботизированной работы, максимизируя прибыльность, минимизируя потери и постоянно внедряя инновации.\n\nГрядёт [Glossary('Шестая эпоха','game_concept_sixth_age_desc')], так почему бы вам не присоединиться к победившей стороне? Вам не нужно доживать своё бессмертное существование в страданиях или даже быть [Select_CString(ROOT.Char.IsFemale, 'раздавленной', 'раздавленным' )] пятой владык Йоми, как простые массы, когда вы можете жить в комфорте и роскоши. Вы действительно хотите выбрать бесчисленные столетия жизни в преисподней только для того, чтобы сохранить знания и мудрость, которые могут по-настоящему оценить лишь немногие? Неужели ваш долг перед отсутствующим Небом действительно так важен для вас? Неужели вы откажетесь от такого щедрого предложения?"
 POD_mummy_elixir_of_eternal_life.100.a: "Сделка, которую стоит заключить."
 POD_mummy_elixir_of_eternal_life.100.b: "Ты никогда не получишь мою душу!"
 POD_mummy_elixir_of_eternal_life.100.c: "Моя душа уже потеряна."
 POD_mummy_elixir_of_eternal_life.100.d: "Моё владение магией делает твои силы здесь бесполезными."
 POD_mummy_elixir_of_eternal_life.100.d.tt: "Приготовив множество зелий и взаимодействовав с [Concept('umbra', 'Умброй')|E], вы сможете противостоять инфернальной силе."
 POD_mummy_elixir_of_eternal_life.100.effect.success: "Вы сопротивляетесь нападению агента"
 POD_mummy_elixir_of_eternal_life.100.effect.failure: "Нападение подавляет ваш разум"
 POD_mummy_elixir_of_eternal_life.100.effect.pactadvantage: "Ваш договор с [Glossary('повелителем Яма','podgloss.yamaking')] облегчит защиту от нападений его соперников"
 POD_eoel_mikaboshi_boon_modifier: "Дар [Glossary('Микабоши','podgloss.mikaboshi')]"
 POD_eoel_mikaboshi_boon_modifier_desc: "Владыка [Glossary('Города чудищ','podgloss.wickedcity')] знает, как выжать из региона как можно больше прибыли."

 POD_mummy_elixir_of_eternal_life.101.desc: "В ваш тронный зал, минуя стражу, входит рябая женщина, вся в вечно сочащихся гнойничках. Её волосы скользкие от гноя, а кожа покрыта слоем пота. Кислый запах наполняет воздух, обжигая волосы в носу.\n\nОна представляется агентом [Glossary('повелителя Яма','podgloss.yamaking')] [GetFaithByKey('thousandhells_tou_shen').GetAdjective]. Он прослышал о ваших поисках эликсира Вечной жизни и хочет сделать вам предложение. Вы свяжете свой ритуал с Лихорадочной преисподней и используете свои знания, чтобы создать войско Ву-Куэй, мумий, способствующих распространению оспы. Взамен он поможет вам превратить вашу державу в державу болезней, где мор и страх приносят прибыль. Он готов предложить немало за шанс одолеть Рангду.\n\nГрядёт [Glossary('Шестая эпоха','game_concept_sixth_age_desc')], так почему бы вам не встать на сторону победителей? Вам не нужно доживать своё бессмертное существование в страданиях или даже [Select_CString(ROOT.Char.IsFemale, 'раздавленной', 'раздавленным' )] пятой владык Йоми, как простые массы, когда вы можете жить в комфорте и роскоши. Вы действительно хотите выбрать бесчисленные столетия жизни в преисподней только для того, чтобы сохранить знания и мудрость, которые могут по-настоящему оценить лишь немногие? Неужели ваш долг перед отсутствующим Небом действительно так важен для вас? Неужели вы откажетесь от такого щедрого предложения?"
 POD_eoel_tou_shen_boon_modifier: "Дар Тоу Шэня"
 POD_eoel_tou_shen_boon_modifier_desc: "Повелитель Лихорадочной преисподней знает, как превратить страх в прибыль."

 POD_mummy_elixir_of_eternal_life.102.desc: "Мужчина в доспехах в стиле буси входит в ваш тронный зал, минуя стражу. В его руке лежит доска, а на поясе свисают связка верёвок и кнут, усыпанный осколками стекла.\n\nОн представляется агентом [Glossary('повелителя Яма','podgloss.yamaking')] [Glossary('Ву Хуа','podgloss.wuhua')]. Он прослышал о ваших поисках эликсира Вечной жизни и хочет сделать вам предложение. Вы свяжете свой ритуал с Ямой соли и железа и используете свои знания, чтобы создать войско Ву-Куэй, мумий, работающих над достижением идеальной эффективности. В обмен он поможет вам превратить вашу державу в царство хорошего порядка, максимальной производительности и бесконечной бюрократии.\n\nГрядёт [Glossary('Шестая эпоха','game_concept_sixth_age_desc')], так почему бы вам не встать на сторону победителей? Вам не нужно доживать своё бессмертное существование в страданиях или даже [Select_CString(ROOT.Char.IsFemale, 'раздавленной', 'раздавленным' )] пятой владык Йоми, как простые массы, когда вы можете жить в комфорте и роскоши. Вы действительно хотите выбрать бесчисленные столетия жизни в преисподней только для того, чтобы сохранить знания и мудрость, которые могут по-настоящему оценить лишь немногие? Неужели ваш долг перед отсутствующим Небом действительно так важен для вас? Неужели вы откажетесь от такого щедрого предложения? Ведь [Glossary('Ву-Хуа','podgloss.wuhua')] всегда награждает верных и уничтожает непослушных."
 POD_eoel_wu_hua_boon_modifier: "Дар [Glossary('Ву-Хуа','podgloss.wuhua')]"
 POD_eoel_wu_hua_boon_modifier_desc: "Владыка Ямы соли и железа хорошо знает, что послушные рабы — выгодные рабы."

 POD_mummy_elixir_of_eternal_life.110.t: "Вечно меняющийся ил"
 POD_mummy_elixir_of_eternal_life.110.desc: "Сгорбленный мужчина, словно сделанный из почерневшего железа, входит в ваш тронный зал, минуя стражу. Его три многогранных глаза светятся красным цветом пустыни в сумерках. Песок вытекает из суставов, оставляя за существом след.\n\nОн представляется агентом [Glossary('повелительницы Яма','podgloss.yamaking')] [Glossary('Тоу-Му','podgloss.toumu')]. Она прослышала о ваших поисках эликсира Вечной жизни и хочет сделать вам предложение. Вы свяжете свой ритуал с [UmbraGlossaryLocalized('hell_of_being_skinned_alive','адом Свежевания')] и используете свои знания, чтобы создать войско Ву-Куэй, мумий, работающих над её восхождением на трон [Glossary('Императора демонов','podgloss.demonemperor')]. Взамен она поможет вам отомстить всем, кто обидел вас, превзойдя их в славе и мучая их вечно.\n\nГрядёт [Glossary('Шестая эпоха','game_concept_sixth_age_desc')], так почему бы вам не встать на сторону победителей? Вам не нужно доживать своё бессмертное существование в страданиях или даже [Select_CString(ROOT.Char.IsFemale, 'раздавленной', 'раздавленным' )] пятой владык Йоми, как простые массы, когда вы можете жить в комфорте и роскоши. Вы действительно хотите выбрать бесчисленные столетия жизни в аду только для того, чтобы сохранить знания и мудрость, которые могут по-настоящему оценить лишь немногие? Неужели ваш долг перед отсутствующим Небом действительно так важен для вас? Она предлагает грандиозные возможности, прежде чем даровать вам быструю смерть — милость в сравнении с миром, который она создаст."
 POD_mummy_elixir_of_eternal_life.110.a: "Мы можем прийти к соглашению."
 POD_mummy_elixir_of_eternal_life.110.b: "Ты никогда не получишь мою душу!"
 POD_mummy_elixir_of_eternal_life.110.c: "Моя душа уже потеряна."
 POD_mummy_elixir_of_eternal_life.110.d: "Я [Select_CString(ROOT.Char.IsFemale, 'взрастила', 'взрастил' )] своё измерение. У тебя здесь нет власти."
 POD_mummy_elixir_of_eternal_life.110.d.tt: "Овладев своим измерением и семьей, вы сможете противостоять их инфернальным силам"
 POD_mummy_elixir_of_eternal_life.110.effect.success: "Вы сопротивляетесь нападению агента"
 POD_mummy_elixir_of_eternal_life.110.effect.failure: "Нападение подавляет ваш разум"
 POD_eoel_tou_mu_boon_modifier: "Дар [Glossary('Тоу-Му','podgloss.toumu')]"
 POD_eoel_tou_mu_boon_modifier_desc: "Повелительница [UmbraGlossaryLocalized('hell_of_being_skinned_alive','Ада свежевания')] овладела искусством железной власти над своими владениями."

 POD_mummy_elixir_of_eternal_life.111.desc: "Человек, окутанный тенями, которые, казалось бы, светятся, но поглощают свет, материализуется в вашем тронном зале, минуя стражу. У него лицо невинного ребенка, затемнённое глазами, которые видели слишком много. Как ни странно, в его манерах есть что-то птичье.\n\nОн представляется агентом [Glossary('повелителя Яма','podgloss.yamaking')] Бао Чжуна. Он слышал о ваших поисках эликсира Вечной жизни и хочет сделать вам предложение. Вы свяжете свой ритуал с адом Неугасимой скорби и используете свои знания, чтобы создать войско Ву-Куэй, мумий, работающих над истреблением всех остальных [Glossary('повелителей Яма','podgloss.yamaking')]. В обмен он поможет вам создать новый мир, свободный от тирании Нефритового императора, мир, в котором вы станете [Select_CString(ROOT.Char.IsFemale, 'славной поборницей', 'славным поборником' )] Бао Чжуна.\n\nГрядёт [Glossary('Шестая эпоха','game_concept_sixth_age_desc')], так почему бы вам не встать на сторону победителей? Вам не нужно доживать свое бессмертное существование в страданиях или даже [Select_CString(ROOT.Char.IsFemale, 'раздавленной', 'раздавленным' )] пятой владык Йоми, как простые массы, когда вы можете жить в комфорте и роскоши. Вы действительно хотите выбрать бесчисленные столетия жизни в аду только для того, чтобы сохранить знания и мудрость, которые могут по-настоящему оценить лишь немногие? Неужели ваш долг перед отсутствующим Небом действительно так важен для вас? Он предлагает такие грандиозные возможности."
 POD_eoel_bao_zhong_boon_modifier: "Дар Бао Чжуна"
 POD_eoel_bao_zhong_boon_modifier_desc: "Владыка ада Неугасимой скорби помнит многое: он один из четырёх Ван-Сянь, избежавших проклятия Нефритового императора."

 POD_mummy_elixir_of_eternal_life.112.desc: "Человек, источающий инфернальное влияние, входит в ваш тронный зал, минуя вашу стражу. Странные драгоценные камни и безделушки свисают с каждого предмета одежды, звеня при каждом шаге. От этих предметов исходит необычная сила, которая давит на вас, как тяжесть океана, убийственное намерение вселяет в вас страх.\n\nОн представляется агентом [Glossary('повелительницы Яма','podgloss.yamaking')] Бабушки-ведьмы. Она слышала о ваших поисках эликсира Вечной жизни и хочет сделать вам предложение. Вы свяжете свой ритуал с адом Жалкой магии и используете свои знания, чтобы создать войско Ву-Куэй, мумий, работающих над сбором всей магии, включая ту, которую лучше оставить неизвестной. В обмен она подарит вам великие знания и адскую силу.\n\nГрядёт [Glossary('Шестая эпоха','game_concept_sixth_age_desc')], так почему бы вам не встать на сторону победителей? Вам не нужно доживать свое бессмертное существование в страданиях или даже [Select_CString(ROOT.Char.IsFemale, 'раздавленной', 'раздавленным' )] пятой владык Йоми, как простые массы, когда вы можете жить в комфорте и роскоши. Вы действительно хотите выбрать бесчисленные столетия жизни в аду только для того, чтобы сохранить знания и мудрость, которые могут по-настоящему оценить лишь немногие? Неужели ваш долг перед отсутствующим Небом действительно так важен для вас? Она предлагает такие грандиозные возможности."
 POD_eoel_grandmother_witch_boon_modifier: "Дар Бабушки-ведьмы"
 POD_eoel_grandmother_witch_boon_modifier_desc: "Повелительница ада Жалкой магии научилась использовать своё положение, чтобы собирать ещё больше знаний и магии."

 POD_mummy_elixir_of_eternal_life.120.t: "Всеслышащая мгла"
 POD_mummy_elixir_of_eternal_life.120.desc: "Мимо ваших стражников проходит женщина неземной красоты, они не замечают ничего, кроме неё. Подобно статуе, вырезанной мастером изо льда, она безупречна. В каждом шаге проявляется смертоносная грация, кошка готовится наброситься.\n\nОна представляется агентом [Glossary('повелителя Яма','podgloss.yamaking')] [Glossary('Эмма-О','podgloss.emmao')]. Он слышал о ваших поисках эликсира Вечной жизни и хочет сделать вам предложение. Вы свяжете свой ритуал с [Glossary('Какури','podgloss.kakuri')] и используете свои знания, чтобы создать войско Ву-Куэй, мумий, работающих над бесконечной пустотой льда и снега. Взамен он подарит вам великую силу, превратив вас в свой нож в темноте. С его помощью мало кто сможет вам противостоять.\n\nГрядёт [Glossary('Шестая эпоха','game_concept_sixth_age_desc')], так почему бы вам не встать на сторону победителей? Вам не нужно доживать свое бессмертное существование в страданиях или даже [Select_CString(ROOT.Char.IsFemale, 'раздавленной', 'раздавленным' )] пятой владык Йоми, как простые массы, когда вы можете жить в комфорте и роскоши. Вы действительно хотите выбрать бесчисленные столетия жизни в аду только для того, чтобы сохранить знания и мудрость, которые могут по-настоящему оценить лишь немногие? Неужели ваш долг перед отсутствующим Небом действительно так важен для вас? Просто откажитесь от обязанностей, навязанных вам вашим равнодушным хозяином, Нефритовым императором, и примите нового хозяина, который будет деятельно вам помогать."
 POD_mummy_elixir_of_eternal_life.120.a: "Сюрприз, но долгожданный."
 POD_mummy_elixir_of_eternal_life.120.b: "Ты никогда не получишь мою душу!"
 POD_mummy_elixir_of_eternal_life.120.c: "Моя душа уже потеряна."
 POD_mummy_elixir_of_eternal_life.120.d: "Я [Select_CString(ROOT.Char.IsFemale, 'овладела', 'овладел' )] собой. У тебя здесь нет власти."
 POD_mummy_elixir_of_eternal_life.120.d.tt: "Овладев своим телом и разумом, вы сможете противостоять их инфернальным силам"
 POD_mummy_elixir_of_eternal_life.120.effect.success: "Вы сопротивляетесь нападению агента"
 POD_mummy_elixir_of_eternal_life.120.effect.failure: "Нападение подавляет ваш разум"
 POD_eoel_emmao_boon_modifier: "Дар [Glossary('Эмма-О','podgloss.emmao')]"
 POD_eoel_emmao_boon_modifier_desc: "Владыка [Glossary('Какури','podgloss.kakuri')] в совершенстве владеет искусством обмана."

 POD_mummy_elixir_of_eternal_life.121.desc: "Мужчина с символикой одной из основных религий входит в ваш тронный зал, минуя стражу. Вера и фанатизм сияют в его глазах, едва затемнённых красными складками, покрывающими каждый дюйм видимой плоти.\n\nОн представляется представителем божества, голосом того, известного как Хен-Тянь. Божество услышало о ваших поисках эликсира Вечной жизни и желает сделать вам предложение. Вы свяжете свой ритуал с [UmbraGlossaryLocalized('hell_of_bitter_truth','царством Искупления и Истины')] и используете свои знания, чтобы создать войско Ву-Куэй, мумий, работающих над спасением всех и раскрытием абсолютной истины. Взамен он поможет вам тайно распространить это искупление, чтобы враги истины не смогли вас остановить.\n\nГрядёт [Glossary('Шестая эпоха','game_concept_sixth_age_desc')], так почему бы вам не встать на сторону победителей? Вам не нужно доживать свое бессмертное существование в страданиях или даже [Select_CString(ROOT.Char.IsFemale, 'раздавленной', 'раздавленным' )] пятой владык Йоми, как простые массы, когда вы можете жить в комфорте и роскоши. Вы действительно хотите выбрать бесчисленные столетия жизни в аду только для того, чтобы сохранить знания и мудрость, которые могут по-настоящему оценить лишь немногие? Неужели ваш долг перед отсутствующим Небом действительно так важен для вас? Просто откажитесь от обязанностей, навязанных вам вашим равнодушным хозяином, Нефритовым императором, и примите нового хозяина, который будет деятельно вам помогать."
 POD_eoel_hen_tian_boon_modifier: "Дар Хен-Тяня"
 POD_eoel_hen_tian_boon_modifier_desc: "Владыка [UmbraGlossaryLocalized('hell_of_bitter_truth','царства Искупления и Истины')] мастерски подчиняет людей своим целям, обманом заставляя их исполнять свои замыслы."

 POD_mummy_elixir_of_eternal_life.122.desc: "Человек, чья кожа заметно и навсегда запачкана кровью, входит в ваш тронный зал, минуя стражу. Он напоминает свою повелительницу, от его туловища и спины простирается множество рук, каждая из которых заканчивается ртом со скрежетающими зубами.\n\nОн представляется агентом [Glossary('повелительницы Яма','podgloss.yamaking')] Яргры Многоустой. Она слышала о ваших поисках эликсира Вечной жизни и хочет сделать вам предложение. Вы свяжете свой ритуал с Пуэлеко и используете свои знания, чтобы создать войско Ву-Куэй, мумий, работающих над созданием бесконечных адов и поглощением всего сущего. Взамен она поможет вам сожрать всё, что встанет на вашем пути.\n\nГрядёт [Glossary('Шестая эпоха','game_concept_sixth_age_desc')], так почему бы вам не встать на сторону победителей? Вам не нужно доживать свое бессмертное существование в страданиях или даже [Select_CString(ROOT.Char.IsFemale, 'раздавленной', 'раздавленным' )] пятой владык Йоми, как простые массы, когда вы можете жить в комфорте и роскоши. Вы действительно хотите выбрать бесчисленные столетия жизни в аду только для того, чтобы сохранить знания и мудрость, которые могут по-настоящему оценить лишь немногие? Неужели ваш долг перед отсутствующим Небом действительно так важен для вас? Просто откажитесь от обязанностей, навязанных вам вашим равнодушным хозяином, Нефритовым императором, и примите нового хозяина, который будет деятельно вам помогать."
 POD_eoel_yargra_boon_modifier: "Дар Яргры"
 POD_eoel_yargra_boon_modifier_desc: "Повелительница Пуэлеко подкрадывается к добыче, прежде чем пожрать её."
 POD_eoel_yargra_vampiric_boon_modifier: "Дар Яргры"
 POD_eoel_yargra_vampiric_boon_modifier_desc: "Повелительница Пуэлеко подкрадывается к добыче, прежде чем пожрать её."

 POD_mummy_elixir_of_eternal_life.130.t: "Всепоглощающее жертвенное пламя"
 POD_mummy_elixir_of_eternal_life.130.desc: "Мужчина в монгольском дээле входит в ваш тронный зал, минуя стражу. Его тело кажется раздутым от искажённой энергии, в глазах горит ненаправленная ненависть. Вместо шагов его туфли издают звуки звенящих цепей и душераздирающие крики.\n\nОн представляется агентом [Glossary('повелителя Яма','podgloss.yamaking')] [Glossary('Дохор-хана','podgloss.dokhorkhan')]. Он слышал о ваших поисках эликсира Вечной жизни и хочет сделать вам предложение. Вы свяжете свой ритуал с [Glossary('адом Шипастых цепей','podgloss.hellspikedchains')] и используете свои знания, чтобы создать войско Ву-Куэй — мумий, которые сокрушат последних противников, мешающих ему стать [Glossary('Императором демонов','podgloss.demonemperor')]. Взамен он наделит вас силой сокрушать ваших врагов и заставлять их страдать.\n\nГрядёт [Glossary('Шестая эпоха','game_concept_sixth_age_desc')], так почему бы вам не встать на сторону победителей? Вам не нужно доживать свое бессмертное существование в страданиях или даже [Select_CString(ROOT.Char.IsFemale, 'раздавленной', 'раздавленным' )] пятой владык Йоми, как простые массы, когда вы можете жить в комфорте и роскоши. Вы действительно хотите выбрать бесчисленные столетия жизни в аду только для того, чтобы сохранить знания и мудрость, которые могут по-настоящему оценить лишь немногие? Неужели ваш долг перед отсутствующим Небом действительно так важен для вас? Великая сила, превосходящая воображение дряхлых дураков на Небесах, может стать вашей. Ваша преданность настолько устойчива, что вы откажетесь от нее?"
 POD_mummy_elixir_of_eternal_life.130.a: "Безграничная сила!"
 POD_mummy_elixir_of_eternal_life.130.b: "Ты никогда не получишь мою душу!"
 POD_mummy_elixir_of_eternal_life.130.c: "Моя душа уже потеряна."
 POD_mummy_elixir_of_eternal_life.130.effect.success: "Вы сопротивляетесь нападению агента"
 POD_mummy_elixir_of_eternal_life.130.effect.failure: "Нападение подавляет ваш разум"
 POD_eoel_dokhor_khan_boon_modifier: "Дар [Glossary('Дохор-хана','podgloss.dokhorkhan')]"
 POD_eoel_dokhor_khan_boon_modifier_desc: "Повелитель [Glossary('ада Шипастых цепей','podgloss.hellspikedchains')] достиг своей власти, сокрушая всё, что стояло перед ним, часто совершенно безрассудно."

 POD_mummy_elixir_of_eternal_life.131.desc: "Женщина, почти раздетая, с гниющими ранами, покрывающими её тело, входит в ваш тронный зал, минуя стражу. Запах гниения, звук хлюпанья, вид плавящейся плоти и личинок, извивающихся под её кожей, вызывают инстинктивную тошноту.\n\nОна представляется агентом [Glossary('повелительницы Яма','podgloss.yamaking')] Рангды. Она слышала о ваших поисках эликсира Вечной жизни и хочет сделать вам предложение. Вы свяжете свой ритуал с [UmbraGlossaryLocalized('hell_of_burrowing_maggots','адом Роящихся личинок')] и используете свои знания, чтобы создать войско Ву-Куэй, мумий, работающих над вечной агонией всех живых существ. Взамен она превратит ваших людей в монстров, неспособных испытывать боль и разложение, которые они распространяют с каждым шагом.\n\nГрядёт [Glossary('Шестая эпоха','game_concept_sixth_age_desc')], так почему бы вам не встать на сторону победителей? Вам не нужно доживать свое бессмертное существование в страданиях или даже [Select_CString(ROOT.Char.IsFemale, 'раздавленной', 'раздавленным' )] пятой владык Йоми, как простые массы, когда вы можете жить в комфорте и роскоши. Вы действительно хотите выбрать бесчисленные столетия жизни в аду только для того, чтобы сохранить знания и мудрость, которые могут по-настоящему оценить лишь немногие? Неужели ваш долг перед отсутствующим Небом действительно так важен для вас? Великая сила, превосходящая воображение дряхлых дураков на Небесах, может стать вашей. Ваша преданность настолько устойчива, что вы откажетесь от неё?"
 POD_eoel_rangda_boon_modifier: "Дар Рангды"
 POD_eoel_rangda_boon_modifier_desc: "Повелительница [UmbraGlossaryLocalized('hell_of_burrowing_maggots','ада Роящихся личинок')] затопит мир личинками. Ваши солдаты — всего лишь первый шаг."

 POD_mummy_elixir_of_eternal_life.132.desc: "Мужчина со шрамами от ударов плетьми и ожогами входит в ваш тронный зал, минуя стражу. С девятихвостой плети, усеянной осколками стекла и подвешенной к его поясу, капает кровь. На его шлеме покоится свеча, горящая зеленым пламенем, яростно горящая и заставляющая капать на него воск. Тем не менее, свеча никогда не убывает.\n\nОн представляется агентом [Glossary('повелителя Яма','podgloss.yamaking')] Данору Ка. Он слышал о ваших поисках эликсира Вечной жизни и хочет сделать вам предложение. Вы свяжете свой ритуал с Пещерой Вечного мрака и используете свои знания, чтобы создать войско Ву-Куэй — мумий, добывающих духов, чтобы завершить его туннель в [UmbraGlossaryLocalized('shadowlands','Загробном мире')]. В обмен он превратит ваших рыцарей в надзирателей, способных справиться с огромными ордами рабов.\n\nГрядёт [Glossary('Шестая эпоха','game_concept_sixth_age_desc')], так почему бы вам не встать на сторону победителей? Вам не нужно доживать свое бессмертное существование в страданиях или даже [Select_CString(ROOT.Char.IsFemale, 'раздавленной', 'раздавленным' )] пятой владык Йоми, как простые массы, когда вы можете жить в комфорте и роскоши. Вы действительно хотите выбрать бесчисленные столетия жизни в аду только для того, чтобы сохранить знания и мудрость, которые могут по-настоящему оценить лишь немногие? Неужели ваш долг перед отсутствующим Небом действительно так важен для вас? Великая сила, превосходящая воображение дряхлых дураков на Небесах, может стать вашей. Ваша преданность настолько устойчива, что вы откажетесь от нее?"
 POD_eoel_danoru_ka_boon_modifier: "Дар Данору Ка"
 POD_eoel_danoru_ka_boon_modifier_desc: "Владыка Пещеры Вечного мрака поработил множество существ и создал немало надсмотрщиков, чтобы завершить свой туннель. О том, куда он ведёт, ходят самые разные догадки..."

 POD_mummy_elixir_of_eternal_life.140.t: "Последний шаг"
 POD_mummy_elixir_of_eternal_life.140.desc: "На протяжении всей истории эликсир Вечной жизни обнаруживался бесчисленное количество раз, но эти знания терялись. Некоторые предполагают, что Восемь бессмертных намеренно усиливают цикл повторных открытий, используя эти поиски как испытание для выявления тех, кто достоин вечного возрождения. Они позволяют добродетельным пить эликсир и даруют его рецепт самым достойным. Это будет не первый раз, когда они делают это; ведь если Третье воплощение существует, то достигшим его просветлённым Ву-Тянь запрещено рассказывать о своих достижениях. В конце концов, люди не могут прокладывать свой собственный путь, когда стремятся идти по дорогам, проложенным другими.\n\nКак бы то ни было, разобравшись с [Glossary('повелителями Яма','podgloss.yamaking')], вы стоите на пороге успеха. Собрать несколько последних вещей и принять последнее решение — это всё, что стоит между вами и последним испытанием ваших поисков."
 POD_mummy_elixir_of_eternal_life.140.a: "Пришло время изложить свою позицию и занять своё место."

 POD_mummy_elixir_of_eternal_life.201.t: "Умиротворение"
 POD_mummy_elixir_of_eternal_life.201.desc: "В тот час, когда вы когда-то родились, вы занимаете удобное положение. Вы приводите к покою тело, разум и душу. Каждый удар вашего сердца становится всё медленнее, каждый стук всё тише. Мысли отскакивают от вашего разума, не в силах вторгнуться в спокойствие. Заботы, страхи, беды этого мира утекают из вашей души, постепенно иссякая до едва заметного ручейка. Каждое мгновение тянется в вечность, поскольку вы теряете всякое ощущение течения времени, пока ваши глаза не закрываются.\n\nНесмотря на отсутствие тела, вы чувствуете мучительную боль, когда ваше тело, разум и душа отрываются друг от друга. Своим духовным оком вы видите три сферы, вращающиеся вокруг друг друга. По мере того, как орбиты ускоряются, сущность начинает течь между ними, поскольку сферы теряют чёткие очертания, а их сущность разлетается кружащимся облаком. Лишь ускоряясь с каждым мгновением, красные пучки энергии начинают кружиться внутрь к сформировавшемуся единому белому ядру, становясь всё ярче по мере приближения к центру. Когда всё это слилось в одну, бесконечно малую точку, ваша форма снова появляется, и вы снова можете видеть своими глазами, и перед вами предстают закрытые Врата Небес. Ворота имеют сложную кованую конструкцию, но выкованы из красного золота, замок изготовлен из драгоценного нефрита. По обе стороны от него расположены стены, сделанные из бесчисленных жемчужин, соединенных как единое целое. Перед воротами стоят восемь существ, похожих на людей, но несравненно больше, чем просто людей.\n«Скажи нам, [Select_CString(ROOT.Char.IsFemale, 'юная', 'юный' )], чего ты ищешь?»$POD_debate_debate_explanation_footer_description$ #R Бессмертные посоветуются с шестью старейшими доступными для игры Ву-Тянь, которые продолжают действовать среди сверхъестественных существ. Их мнение о вас и ваши прошлые поступки, например число совершённых вами убийств, определят силу противника в дебатах.#!$POD_debate_debate_explanation_footer_initial_score$"
 POD_mummy_elixir_of_eternal_life.201.a: "Я ищу эликсир Вечной жизни!"
 POD_mummy_elixir_of_eternal_life.201.b: "С другой стороны..."

 POD_mummy_elixir_of_eternal_life.202.t: "Последний отвар"
 POD_mummy_elixir_of_eternal_life.202.desc: "Пришло время сварить последний необходимый эликсир. Вы поднимаетесь на самую высокую вершину в благоприятный день вооружившись талисманом. Вы говорите с духом горы, чтобы получить Дыхание Девяти небес. Девять раз через равные промежутки киноварь подвергают воздействию огня, попеременно обращая её в твёрдое вещество и в пар, — таков способ её приготовления. Вы позволяете солнечному свету течь через сосуд, добавляя в него золотые цветы, нефритовую росу, серу, ртуть, сосновую смолу, персиковые косточки, чертополох, свинец, растворенный жемчуг, осадок воды и огня, остатки ушедших зверей, несколько смертельных токсинов и вашу собственную кровь. Многие составляющие становятся единым целым, сияя всеми цветами божественного света. Вы моете его, чтобы он стал чистым, как выпавший снег. Вы измельчаете его, чтобы он стал совершенным, как киноварь. Вы растворяете его в ароматной воде и вине из ярко-красной травы. Наконец, вы пьёте жидкость, сияющую цветом небес, чтобы она могла сублимировать земное и очистить плоть, оставив только незапятнанное.\n\nОгромная тяжесть тянет ваши веки, закрывая их, когда вы чувствуете себя [Select_CString(ROOT.Char.IsFemale, 'отделённой', 'отделённым' )] от мира смертных. Когда тяжесть исчезнет и вы сможете открыть их еще раз, вы увидите закрытые Врата Небес. Ворота имеют сложную кованую конструкцию, но выкованы из красного золота, замок изготовлен из драгоценного нефрита. По обе стороны от него расположены стены, сделанные из бесчисленных жемчужин, соединенных как единое целое. Перед воротами стоят восемь существ, похожих на людей, но несравненно больше, чем просто людей.\n«Скажи нам, [Select_CString(ROOT.Char.IsFemale, 'юная', 'юный' )], чего ты ищешь?»$POD_debate_debate_explanation_footer_description$#R Бессмертные посоветуются с шестью старейшими доступными для игры Ву Тянь, которые продолжают действовать среди сверхъестественных существ. Их мнение о вас и ваши прошлые поступки, например число совершённых вами убийств, определят силу противника в дебатах.#!$POD_debate_debate_explanation_footer_initial_score$"
 POD_mummy_elixir_of_eternal_life.202.a: "Я ищу эликсир Вечной жизни!"
 POD_mummy_elixir_of_eternal_life.202.b: "С другой стороны..."

 POD_mummy_elixir_of_eternal_life.203.t: "Второе рождение"
 POD_mummy_elixir_of_eternal_life.203.desc: "С помощью друзей вы провели сокровенный ритуал, кульминацией которого стало самоубийство с помощью тщательно разработанного оружия. Когда средоточие вашей жизни смещается, внутренний взор опускается к пупку. Светящаяся галактика вращается, ожидая, пока вы приложите силу и сожмёте её в новую жизнь. Когда вы сосредотачиваетесь на ней, вы начинаете культивировать и направлять в неё сущность. Когда сущность возвращается в пустоту, внутри вас пробуждается бессмертный зародыш. С каждым криком младенец растёт, пока не становится вами. Один элемент толкает, другой тянет. Итак, колесо вращается. Так рождается [Select_CString(ROOT.Char.IsFemale, 'новая бессмертная', 'новый бессмертный' )]. Итак, вы рождаетесь, стоя перед закрытыми Вратами Небес. Ворота имеют сложную кованую конструкцию, но выкованы из красного золота, замок изготовлен из драгоценного нефрита. По обе стороны от него расположены стены, сделанные из бесчисленных жемчужин, соединенных как единое целое. Перед воротами стоят восемь существ, похожих на людей, но несравненно больше, чем просто людей.\n«Скажи нам, [Select_CString(ROOT.Char.IsFemale, 'юная', 'юный' )], чего ты ищешь?»$POD_debate_debate_explanation_footer_description$#R Бессмертные посоветуются с шестью старейшими доступными для игры Ву Тянь, которые продолжают действовать среди сверхъестественных существ. Их мнение о вас и ваши прошлые поступки, например число совершённых вами убийств, определят силу противника в дебатах.#!$POD_debate_debate_explanation_footer_initial_score$"
 POD_mummy_elixir_of_eternal_life.203.a: "Я ищу эликсир Вечной жизни!"
 POD_mummy_elixir_of_eternal_life.203.b: "С другой стороны..."

 POD_mummy_elixir_of_eternal_life.21.t: "Аудиенция: бремя бессмертия"
 POD_mummy_elixir_of_eternal_life.21.desc: "$POD_debate_debate_strength_header$«Ты не [Select_CString(ROOT.Char.IsFemale, 'первая', 'первый' )] и не [Select_CString(ROOT.Char.IsFemale, 'последняя', 'последний' )], кто отправляется в такие поиски. Однако взбираться на гору — значит нести её тяжесть на своей спине. Бессмертие, даже если оно связано циклами перерождений, как наше собственное, — это бремя, которое меняет душу. С каждым шагом твоего восхождения ты будешь накапливать потери, а твои воспоминания будут разрушаться. Ты откажешься от всего, что придаёт смысл смертным. Если у горы нет вершины, есть ли смысл в восхождении? Есть ли смысл в бесконечной борьбе? Не для всех. Подобные вещи подобны реке, прорезающей каньон. Хотя разделение начинается с малого, наступает момент, когда ничто не может преодолеть разрыв между тобой и смертным опытом. Ты отстранишься от него и не сможешь полностью участвовать в нём. Такая боль только усиливается, когда у тебя есть сила даровать бессмертие, но ты знаешь, что не [Select_CString(ROOT.Char.IsFemale, 'должна', 'должен' )] её использовать».\n\n«Это проклятие и бремя. Будешь ли ты по-прежнему видеть в метели каждую отдельную снежинку, такую же, как многие до неё, но при этом совершенно уникальную? Будешь ли ты по-прежнему любить их, заботиться о них, защищать их? Сможешь ли ты вынести это или станешь чудовищем? Будешь ли ты по-прежнему мудро использовать свои знания, даруя вечное возрождение только тем, кто сможет вынести его сам?»"
 POD_mummy_elixir_of_eternal_life.21.a: "Мы уже несём бремя бессмертия."
 POD_mummy_elixir_of_eternal_life.21.b: "Предоставленное вами предназначение не даёт жизни лишиться смысла."
 POD_mummy_elixir_of_eternal_life.21.c: "Вы приспособились; сможем и мы."

 POD_mummy_elixir_of_eternal_life.22.t: "Аудиенция: поддержание равновесия"
 POD_mummy_elixir_of_eternal_life.22.desc: "$POD_debate_debate_strength_header$«Подобно тому, как бессмертие и способность даровать его изменяют отношения между тобой и другими, так оно изменяет и твои отношения с миром. Жизнь и смерть, порядок и хаос, рождение и распад. Всё существует в идеальном равновесии, и мы его хранители. Создавая каждого Бессмертного, мы уже приближаемся к грани дисбаланса, сотрясая дерево. Несколько потрясений не будут угрожать миру. Однако если ты получишь знания о приготовлении эликсира, ты рискуешь слишком часто трясти дерево, оставляя дерево без листьев. Расширение нашего круга не было бы нейтральным действием, служащим лишь напряжением духовных экосистем. Если напряжение станет слишком большим, слова о ряби уже не смогут передать масштаба невидимых долгов и кармических переплетений».\n\n«Будешь ли ты поддерживать равновесие между мирами? Или же злоупотребишь этими знаниями, чтобы создать армию Бессмертных, прорывающую дыру в самой смерти?»"
 POD_mummy_elixir_of_eternal_life.22.a: "Равновесие меняется; оно не застывает."
 POD_mummy_elixir_of_eternal_life.22.b: "Вы продолжите регулировать нашу численность."
 POD_mummy_elixir_of_eternal_life.22.c: "Мы наносим меньший ущерб, чем другие, и устраняем ущерб от них."

 POD_mummy_elixir_of_eternal_life.23.t: "Аудиенция: ценность смертности"
 POD_mummy_elixir_of_eternal_life.23.desc: "$POD_debate_debate_strength_header$«Вред не ограничивается нарушением равновесия или тяжестью бремени бессмертия. Как мы уже говорили ранее, бессмертие отделяет нас от смертных, оставляя нас оторванными от их мира и без сочувствия. Без песка, стекающего из песочных часов, нам не хватает срочности или потребности в росте. Удалить давление смерти и остановить песочные часы — значит потерять стремление стать чем-то новым или большим, измениться. Если мы дадим тебе рецепт эликсира Вечной жизни, ты используешь его, чтобы создать ещё больше Бессмертных, тем самым лишив их возможности испытать полноценное человеческое существование. Вместо этого ты обречёшь их на жизнь, состоящую из бесконечных дней, нескончаемую монотонность и утомление работой, от которой им никогда не уйти. Даже если они захотят этого или будут искать тебя для этого, никто не сможет по-настоящему понять потерю, которую несёт бессмертие, прежде чем обретёт его. Ты крадёшь у них всё это, и они даже не осознают своей потери. Были даже те, кто использовал бессмертие, чтобы наказывать и пытать своих соперников, лишая их нормальной жизни».\n\n«[Select_CString(ROOT.Char.IsFemale, 'Готова', 'Готов' )] ли ты украсть такой потенциал? Станешь ли вы злоупотреблять силой, не размышляя и не учитывая причиняемую боль? Причинишь ли вред и страдания?»"
 POD_mummy_elixir_of_eternal_life.23.a: "Мы сохраняем, а не уничтожаем человечность."
 POD_mummy_elixir_of_eternal_life.23.b: "Бессмертие — это не конец, а лишь начало нового путешествия."
 POD_mummy_elixir_of_eternal_life.23.c: "Смертность приводит к страданиям, невежеству и растрате потенциала."

 POD_mummy_elixir_of_eternal_life.24.t: "Аудиенция: ваша незавершённость"
 POD_mummy_elixir_of_eternal_life.24.desc: "$POD_debate_debate_strength_header$«Знание – сила. Эликсир Вечной жизни обладает силой управлять Колесом, контролировать цикл перерождений, позволяя человеку существовать далеко за пределами его естественного конца. Для смертных сила служит лишь раскрытию внутренней истины, но она гораздо более опасна для бессмертных. Ты будешь [Select_CString(ROOT.Char.IsFemale, 'окружена', 'окружён' )] волшебством, силой. Знать, что ты можешь что-то изменить, что ты можешь что-то исправить, не многие хорошие люди могут вынести это бремя. Не поддаться искушению построить идеальный мир, этой песне сирен — это истощающее усилие, которое с каждым проходящим столетием подрывает волю. Власть способствует развращению даже самых чистых сердцем и даже тех, кто имеет самые благие намерения. Только лучшие могут справиться с этим, хотя однажды гора разрушится, но это займет гораздо больше времени, чем куча пыли».\n\n«Предоставить тебе такую силу до того, как ты будешь [Select_CString(ROOT.Char.IsFemale, 'готова', 'готов' )], — это жестокость по отношению к тебе и верх глупости, мало чем отличающаяся от дарования всемогущества ребёнку. Чтобы нести знания, лежащие в основе создания эликсира, требуется тот, кто усвоил определённые уроки, касающиеся отстранённости, смирения и гармонии».\n\n«Ты не обязательно [Select_CString(ROOT.Char.IsFemale, 'недостойна', 'недостоин' )]. Скорее, ты ещё [Select_CString(ROOT.Char.IsFemale, 'молода и несовершенна', 'молод и несовершенен' )]. Предоставить тебе то, что ты ищешь, было бы безответственно. Почему мы должны это делать? Какие доказательства своей зрелости и способности противостоять порче ты можешь предложить?»"
 POD_mummy_elixir_of_eternal_life.24.a: "Мы уже проявили себя, достигнув этой точки."
 POD_mummy_elixir_of_eternal_life.24.b: "Совершенство невозможно, а рост вечен."
 POD_mummy_elixir_of_eternal_life.24.c: "Рост требует ответственности."

 POD_mummy_elixir_of_eternal_life.25.t: "Аудиенция: наследие власти"
 POD_mummy_elixir_of_eternal_life.25.desc: "$POD_debate_debate_strength_header$«Допустим, мы признаем твоё достоинство и способность правильно обращаться с силой, присущей эликсиру Вечной жизни. Сила этого знания — наследие, такое же вечное, как и созданные им существа. Каждое изменение вызывает рябь в людском пруду, распространяясь все дальше. Предоставляя тебе знания по приготовлению эликсира, мы увековечиваем это наследие, наследие, которое ты передашь всем, кого ты трансформируешь или кого ты ему обучишь. Доверие к тебе теперь требует от нас доверять всем, кто придёт после тебя, доверять наследию, которое ты создашь. Даже небольшая рябь может однажды превратиться в приливную волну, которую даже нам не под силу сдержать. В великой поэме истории такие рифмованные строки часто повторяются, а доверие редко вознаграждается».\n\n«Почему мы должны проявлять такое доверие в этот момент? Почему мы должны доверять тем, кто придёт позже? Даже если твои намерения благородны, разделят ли будущие поколения твои добродетели и ценности? Почему мы должны идти на такой риск?»"
 POD_mummy_elixir_of_eternal_life.25.a: "Стагнация сама по себе опасна."
 POD_mummy_elixir_of_eternal_life.25.b: "Любая традиция рискует подвергнуться порче, но это не повод от неё отказываться."
 POD_mummy_elixir_of_eternal_life.25.c: "Хотя это и сложно, но меры безопасности могут быть установлены."

 POD_mummy_elixir_of_eternal_life.26.t: "Аудиенция: зачем..."
 POD_mummy_elixir_of_eternal_life.26.desc: "$POD_debate_debate_strength_header$«Перед нами стоит последний вопрос: ты. Что привело тебя к тому, что ты делаешь сейчас? В конце концов, твои поиски были долгими, непростыми и полными трудностей. Что придавало тебе силы, когда ты [Select_CString(ROOT.Char.IsFemale, 'подвергала', 'подвергал' )] сомнению свою цель? Каковы были твои намерения, в глубине, под всеми практическими соображениями и философскими доводами? Ты стремишься к контролю или к тому, чтобы тебя помнили? Ты ищешь из страха или из неповиновения? Если да, то удовлетворение твоих желаний только усилит эти недостатки. Есть ли у тебя причина, превосходящая такие базовые импульсы?»"
 POD_mummy_elixir_of_eternal_life.26.a: "Чтобы защитить мир."
 POD_mummy_elixir_of_eternal_life.26.b: "Чтобы преодолеть ограничения."
 POD_mummy_elixir_of_eternal_life.26.c: "Возвыситься в просветлении."
 POD_mummy_elixir_of_eternal_life.26.d: "Нести бремя, которое другие не могут."
 POD_mummy_elixir_of_eternal_life.26.e: "Чтобы сохранить знания и цель."

 POD_mummy_elixir_of_eternal_life.270.t: "Аудиенция: успех"
 POD_mummy_elixir_of_eternal_life.270.desc.internal: "«После долгих размышлений мы приняли твоё предложение и восполним пробелы в твоих знаниях. Ты также можешь выпить его, если хочешь. Если ты откажешься сейчас и изменишь своё решение позже, тебе придётся выпить его без нашей помощи. Будем надеяться, что наше доверие к тебе оправдано».\n\n«Чтобы начать варить эликсир Вечной жизни, соберите свои слёзы с 23:00 до 3:00, пот с 11:00 до 15:00, слюну с 7:00 до 11:00, слизь с 3:00 до 7:00 и мочу с 15:00 до 19:00. Затем перемешивайте их на огне в течение 15 минут...»"
 POD_mummy_elixir_of_eternal_life.270.desc.external: "«После долгих размышлений мы приняли твоё предложение и восполним пробелы в твоих знаниях. Ты также можешь выпить его, если хочешь. Будем надеяться, что наше доверие к тебе оправдано».\n\n«Чтобы начать варить эликсир Вечной жизни, измельчите нефрит в мелкий порошок и всыпьте в небольшое количество расплавленного золота...»"
 POD_mummy_elixir_of_eternal_life.270.desc.nourishing: "«После долгих размышлений мы приняли твоё предложение и восполним пробелы в твоих знаниях. Ты также можешь выпить его, если хочешь. Будем надеяться, что наше доверие к тебе оправдано».\n\n«Чтобы начать варить эликсир Вечной жизни, выполните технику «Игры пяти животных» с несколькими надёжными союзниками, каждый из вас направляет свою сущность, дыхание и дух в котёл с кипящей водой. Тогда...»"
 POD_mummy_elixir_of_eternal_life.270.a: "Благодарю вас за наставления."
 POD_mummy_elixir_of_eternal_life.270.b: "Благодарю вас за эту возможность."
 eoel_become_mummy_wutian_tt: "Вы станете мумией, что радикально изменит ваш игровой процесс, отключит ваши постройки и уничтожит высшие титулы державы.\nЕсли вы не готовы к этому, то, скорее всего, ваша игровая партия окажется под угрозой срыва."

 POD_mummy_elixir_of_eternal_life.271.t: "Аудиенция: частичный успех"
 POD_mummy_elixir_of_eternal_life.271.desc: "«Как и многим до тебя, мы не предоставим тебе знания, необходимые для совершенствования эликсира Вечной жизни. Однако ты [Select_CString(ROOT.Char.IsFemale, 'проявила', 'проявил' )] мудрость, необходимую для того, чтобы испить его. Итак, мы предлагаем тебе возможность оставить свою нынешнюю форму позади и обрести новую жизнь и новую цель – вечное возрождение в служении Нефритовому императору. Если ты откажешься сейчас и изменишь своё решение позже, тебе придётся выпить его без нашей помощи. Ты [Select_CString(ROOT.Char.IsFemale, 'согласна', 'согласен' )]?»"
 POD_mummy_elixir_of_eternal_life.271.a: "Благодарю вас за щедрое предложение."
 POD_mummy_elixir_of_eternal_life.271.b: "Мне придётся отклонить ваше щедрое предложение."

 POD_mummy_elixir_of_eternal_life.272.t: "Аудиенция: неудача"
 POD_mummy_elixir_of_eternal_life.272.desc: "«После долгих размышлений мы сочли тебя слишком [Select_CString(ROOT.Char.IsFemale, 'юной', 'юным' )]. Ты — персиковая косточка, которая только начинает прорастать. Если мы предоставим тебе знания, необходимые для приготовления эликсира Вечной жизни, мы будем нести ответственность за то, что оно развратит тебя. Ты можешь научить этому недостойных. Ты можешь подвергнуть пыткам своих соперников или украсть преимущества смертности у тех, кто не готов к такой потере»."
 POD_mummy_elixir_of_eternal_life.272.a: "Я вернусь позже."
 POD_mummy_elixir_of_eternal_life.272.b: "Дряхлые глупцы! Я найду тех, кто оценит моё мастерство!"

 POD_mummy_elixir_of_eternal_life.30.t: "Место среди мучений"
 POD_mummy_elixir_of_eternal_life.30.desc: "У Мудрейшего мастера на вас грандиозные планы. Вы спустились во владения Могущественнейшего мастера и стоите перед ним, выслушивая новое задание. Благоразумнейший мастер заявляет о необходимости большего числа таких, как вы. Таким слугам потребуется обучение и подготовка под присмотром Грознейшего мастера. К сожалению, во владениях Непостижимейшего мастера нет места, предназначенного для такой цели. Таким образом, Всемогущий мастер поручает вам заявить права на фрагмент его Ада, чтобы вырастить больше слуг. Вы не хотите разочаровывать Грознейшего мастера, но вам придётся бороться со своими соперниками среди других слуг Господствующего мастера и жителей земли.\n\n #R В этом начинании используется показатель, называемый «военной мощью». Начальное значение определяется доблестью вашего персонажа и ваших воителей. Во время самого начинания этот показатель будет увеличиваться или уменьшаться.\nВаша стартовая военная мощь — [GetPlayer.MakeScope.GetVariable('character_eoel_wk_force').GetValue|0]#!."
 POD_mummy_elixir_of_eternal_life.30.a: "Я докажу, что [Select_CString(ROOT.Char.IsFemale, 'достойна', 'достоин' )]."
 POD_mummy_elixir_of_eternal_life.30.b: "Я соберу свои силы и вернусь."
 POD_mummy_elixir_of_eternal_life.30.tt.east: "Дар восточного [Glossary('повелителя Яма','podgloss.yamaking')] поможет вашим усилиям."
 POD_mummy_elixir_of_eternal_life.30.tt.north: "Дар северного [Glossary('повелителя Яма','podgloss.yamaking')] поможет вашим усилиям."
 POD_mummy_elixir_of_eternal_life.30.tt.west: "Дар западного [Glossary('повелителя Яма','podgloss.yamaking')] поможет вашим усилиям."
 POD_mummy_elixir_of_eternal_life.30.tt.south: "Дар южного [Glossary('повелителя Яма','podgloss.yamaking')] поможет вашим усилиям."

 POD_mummy_elixir_of_eternal_life_rivals_start_hunt_tt: "Военная мощь ваших соперников оценивается в #V 2000#!"
 POD_CHANGE_CHARACTER_EOEL_WK_FORCE_ADD: "Вы #P получаете#! $VALUE|0V$ ед. военной мощи"
 POD_CHANGE_CHARACTER_EOEL_WK_FORCE_SUBTRACT: "Вы #N теряете#! $VALUE|0V$ ед. военной мощи"
 POD_CHANGE_RIVALS_EOEL_WK_FORCE_ADD: "Ваши соперники #N получают#! $VALUE|0V$ ед. военной мощи"
 POD_CHANGE_RIVALS_EOEL_WK_FORCE_SUBTRACT: "Ваши соперники #P теряют#! $VALUE|0V$ ед. военной мощи"
 POD_mummy_elixir_of_eternal_life_military_strength: "#clickable Ваша текущая военная мощь - [GetPlayer.MakeScope.GetVariable('character_eoel_wk_force').GetValue|V0]\nВоенная мощь ваших соперников оценивается в [GetPlayer.MakeScope.GetVariable('rivals_eoel_wk_force').GetValue|V0]#!\n\n"

 POD_mummy_elixir_of_eternal_life.31.t: "Уроки проклятия"
 POD_mummy_elixir_of_eternal_life.31.desc: "$POD_mummy_elixir_of_eternal_life_military_strength$Вы приняли повеление Владычествующего мастера, и теперь пришло время получить урок Мудрейшего мастера. Он станет основой ваших владений и определит, какими будут новые Ву-Куэй. Насколько хорошо вы усвоите и примените эти мудрые слова?"
 POD_mummy_elixir_of_eternal_life.31.a: "Страдание – высшая цель жизни."
 POD_mummy_elixir_of_eternal_life.31.b: "Используй страдания как разменную монету."
 POD_mummy_elixir_of_eternal_life.31.c: "Страх – это самая чистая прибыль."
 POD_mummy_elixir_of_eternal_life.31.d: "Сломленные духи приносят прибыль."
 POD_mummy_elixir_of_eternal_life.31.e: "Контроль должен быть абсолютным."
 POD_mummy_elixir_of_eternal_life.31.f: "Память – это сила."
 POD_mummy_elixir_of_eternal_life.31.g: "Знания превыше всего."
 POD_mummy_elixir_of_eternal_life.31.h: "Хитрость выигрывает войны."
 POD_mummy_elixir_of_eternal_life.31.i: "Пользуйся чужой слепотой."
 POD_mummy_elixir_of_eternal_life.31.j: "Бей незримо; пожирай всё."
 POD_mummy_elixir_of_eternal_life.31.k: "Сокруши всё на своём пути."
 POD_mummy_elixir_of_eternal_life.31.l: "Неси порчу и муки."
 POD_mummy_elixir_of_eternal_life.31.m: "Расширяйся через рабство."
 POD_mummy_elixir_of_eternal_life.31.effect.success.desc: "Урок запечатлевается в вашей памяти"
 POD_mummy_elixir_of_eternal_life.31.effect.failure.desc: "Урок скользит по вашему разуму, не оставляя следа"

 POD_mummy_elixir_of_eternal_life.32.t: "Ничейная яма"
 POD_mummy_elixir_of_eternal_life.32.desc: "$POD_mummy_elixir_of_eternal_life_military_strength$Выслушав урок Августейшего мастера и усвоив его, вы отправляетесь на землю, отведенную вам Великодушным мастером. Путь долгий и утомительный. В то время как размер ваших сил отпугивает мелких тварей от нападений, завистливые дураки среди последователей Милосердного мастера стремятся узурпировать ваше привилегированное положение. Отражение их бессмысленных нападений — нетрудная задача для человека, столь благословленного Всемогущим мастером, как вы. Однако такие перерывы утомляют более слабые части ваших сил. Таких слабаков оставляют в адской глуши. Сильнейшие из них выживут и завершат путешествие самостоятельно, так что мало что будет потеряно.\n\nХотя ни один из других главных слуг Выдающегося мастера в настоящее время не претендует на эту землю, яма, раскинувшаяся сейчас перед вами, все еще населена некоторыми из меньших существ, которые бродят по царству Высочайшего мастера. Изгнать их не составит большого труда, но для целей вашей текущей задачи от этого будет мало пользы. В качестве альтернативы вы можете рискнуть некоторыми из своих ресурсов и отложить свои усилия, чтобы получить возможность поработить их и направить на поддержку своих усилий."
 POD_mummy_elixir_of_eternal_life.32.a: "Прогнать их обратно в дикие земли."
 POD_mummy_elixir_of_eternal_life.32.b: "Поработить их и заставить работать."
 POD_mummy_elixir_of_eternal_life.32.c: "Связать их магией."
 POD_mummy_elixir_of_eternal_life.32.effect.success.desc:0 "С угрозой покончено. Навсегда."
 POD_mummy_elixir_of_eternal_life.32.effect.failure.desc: "С угрозой удалось справиться, но часть ресурсов была потрачена впустую"

 POD_mummy_elixir_of_eternal_life.33.t: "Соперники при дворе преисподней"
 POD_mummy_elixir_of_eternal_life.33.desc: "$POD_mummy_elixir_of_eternal_life_military_strength$После того, как ваша яма захвачена, а её с бывшими обитателями покончено, ваши соперники при дворе Самовластного мастера предпринимают более активные действия, чтобы вмешаться в вашу задачу. За то, что осмелились помешать выполнению задания Неумолимого мастер, вы должны позаботиться, чтобы они были должным образом наказаны и унижены в глазах Проницательнейшего мастер. Хотя их устранение было бы более удовлетворительным, Благоразумнейший мастер не одобряет растрату ресурсов. Возможно, Щедрейший мастер отдал бы вам их души для наказания и обучения. Однако прежде чем рассматривать подобные соображения, вы должны определить лучший способ противодействовать их интригам. Возможно, вы воспользуетесь этим для продвижения своей легенды или накажете их за неосторожность, позволившую вам узнать об их усилиях. Либо можно просто игнорировать их назло им."
 POD_mummy_elixir_of_eternal_life.33.a: "Воспользоваться их ненавистью, чтобы подпитывать свою славу."
 POD_mummy_elixir_of_eternal_life.33.b: "Превзойти их в строительстве и стойкости. Я переживу бурю."
 POD_mummy_elixir_of_eternal_life.33.c: "Разоблачить их происки. Такая невнимательность будет наказываться."
 POD_mummy_elixir_of_eternal_life.33.effect.success.desc: "Их величайшие планы — всего лишь мелочи"
 POD_mummy_elixir_of_eternal_life.33.effect.failure.desc: "Как хлопотно..."

 POD_mummy_elixir_of_eternal_life.34.t: "Дрова для костров проклятия"
 POD_mummy_elixir_of_eternal_life.34.desc: "$POD_mummy_elixir_of_eternal_life_military_strength$Чтобы заправить машины пыток в вашей яме, вам потребуется огромное количество эссенции. Эту сущность можно извлечь, только причинив огромную боль и страдания собранным душам, выжав всю жизненную силу до последней капли. Вы должны переработать эти сырьевые ресурсы в нечто более полезное для планов Могущественного мастера, заполнив этим огромные чаны. Каждая капля должна быть тщательно очищена и обработана, чтобы её можно было бросить в печи для создания извращённого подобия пара, который будет питать двигатели разрушения. Однако мирская агония недостаточна для ваших целей. Если вы не хотите сжигать огромное количество душ ради одной капли, вам понадобится мощная магия, чтобы усилить страдания и дистиллировать необходимую вам сущность. Вы с нетерпением ждете симфонии разрушения!"
 POD_mummy_elixir_of_eternal_life.34.a: "Совершить набег на близлежащие преисподнии."
 POD_mummy_elixir_of_eternal_life.34.b: "Переработать существующие души."
 POD_mummy_elixir_of_eternal_life.34.c: "Принести в жертву смертных, чтобы получить больше душ."
 POD_mummy_elixir_of_eternal_life.34.effect.success.desc: "Теперь у нас будет много топлива"
 POD_mummy_elixir_of_eternal_life.34.effect.failure.desc: "Такая трата ресурсов"

 POD_mummy_elixir_of_eternal_life.35.t: "Создание проклятых"
 POD_mummy_elixir_of_eternal_life.35.desc: "$POD_mummy_elixir_of_eternal_life_military_strength$Во всем мире существует бесчисленное множество трущоб, ветхих регионов и обедневших земель. В каждой стране и в каждом месте бездомные, голодные и отчаявшиеся знают правду! О них никто не заботится! Никто даже не подозревает об их существовании! У них ничего нет! У них никогда не будет ничего... кроме своей злости! Их ненависть! Какая восхитительная ненависть! Вы возьмёте эту искру и превратите её в пламя, который сожжёт сами небеса!\n\nОднако для разжигания пламени потребуется внушительная кочерга, и прежде чем они смогут служить Властнейшему мастеру, их необходимо перековать в полезные инструменты. Как вы превратите эти жалкие обрывки в то, что вам нужно? Вы просто предоставите им снаряжение, чтобы компенсировать слабость их плоти? Возьмёте только величайших и отточите их? Сможете ли вы превратить даже самых жалких во что-то стоящее?"
 POD_mummy_elixir_of_eternal_life.35.a: "Я прибегну к жестокой дрессировке."
 POD_mummy_elixir_of_eternal_life.35.b: "Я оптимизирую их обучение."
 POD_mummy_elixir_of_eternal_life.35.c: "Я наберу только лучших."
 POD_mummy_elixir_of_eternal_life.35.d: "Я снаряжу их лучшим оружием и доспехами."
 POD_mummy_elixir_of_eternal_life.35.effect.success.desc: "Выковано до тёмного совершенства"
 POD_mummy_elixir_of_eternal_life.35.effect.failure.desc: "Многие умирают до того, как программа будет усовершенствована"

 POD_mummy_elixir_of_eternal_life.36.t: "Необузданные мучения"
 POD_mummy_elixir_of_eternal_life.36.desc: "$POD_mummy_elixir_of_eternal_life_military_strength$Как и положено, Владычествующий мастер обладает абсолютной властью в своих владениях. Однако управление захваченной ямой — ваша ответственность. К сожалению, вас отвлекало множество дел, в том числе владения среди смертных. Это создало возможность, которой воспользовались ваши приспешники.\n\nНекоторые из младших рабов дико бегают, устраивая беспорядочные пожары и выпуская на волю пойманных вами зверей. Прислужники просто замышляют вашу гибель, в то время как более дальновидные стремятся вытеснить вас в глазах Августейшего мастера.\n\nГлупцы не представляют большого риска в долгосрочной перспективе. Во всяком случае, вы слишком важны для планов Проницательнейшего мастера. Однако они могут оказаться неудобствами и задержать ваши инициативы. Как вы справитесь с их глупым восстанием?"
 POD_mummy_elixir_of_eternal_life.36.a: "Восстановить контроль силой!"
 POD_mummy_elixir_of_eternal_life.36.b: "Использовать хаос, чтобы усовершенствовать их."
 POD_mummy_elixir_of_eternal_life.36.c: "Возможно, необходима помощь Всемогущего мастера."
 POD_mummy_elixir_of_eternal_life.36.effect.success.desc: "Всё по плану"
 POD_mummy_elixir_of_eternal_life.36.effect.failure.desc: "Столько потерь!"

 POD_mummy_elixir_of_eternal_life.37.t: "Решение мастера"
 POD_mummy_elixir_of_eternal_life.37.desc: "$POD_mummy_elixir_of_eternal_life_military_strength$После долгого труда яма, которую вы высекли из преисподней Неумолимейшего мастера, стонет от мук. Цепи гремят по железным мосткам, подвешенным над морями кричащих душ. Печи, питаемые очищенной агонией, ревут, как голодные львы, пока первых сломленных духов тащат к чанам порчи, их сущность готова быть помещена в смертные сосуды.\n\nПрежде чем вы сможете найти дураков, чтобы вселить в них духов, вас вызывают к Проницательнейшему мастеру. Когда на вас останавливается взгляд Августейшего мастера, двор замолкает. Ваши соперники с нетерпением ждут вашего унижения, в то время как бесчисленное множество меньших слуг рушатся в трепете от ужаса. Пришло время оценить качество страданий и мучений, которые вы порождаете. Вы просто построили ещё одну кричащую яму среди тысячи, или вы построили землю отчаяния, действительно достойную царства Всевышнего мастера? Будут ли ваши усилия способствовать грандиозным амбициям Неумолимейшего мастера или будут тратить ресурсы, лучше подходящие для других начинаний? Только испытание боем определит судьбу вас и ваших усилий."
 POD_mummy_elixir_of_eternal_life.37.a: "Покажите свою мощь, мои прислужники!"
 POD_mummy_elixir_of_eternal_life.37.b: "Я [Select_CString(ROOT.Char.IsFemale, 'набрала', 'набрал' )] не просто крестьян, но своих лучших воинов!"
 POD_mummy_elixir_of_eternal_life.37.c: "Я [Select_CString(ROOT.Char.IsFemale, 'устроила', 'устроил' )] настоящую кампанию по набору!"
 POD_mummy_elixir_of_eternal_life.37.d: "Устройте представление, мои прислужники!"
 POD_mummy_elixir_of_eternal_life.37.effect.success.desc: "Даже Неумолимейший мастер, кажется, слегка впечатлён"
 POD_mummy_elixir_of_eternal_life.37.effect.failure.desc: "Их выступление лишь подтверждает слова ваших соперников"
 POD_mummy_elixir_of_eternal_life.37.final_check: "Сравнит вашу военную мощь с силой ваших соперников и врагов, чтобы определить окончательные результаты"

 POD_mummy_elixir_of_eternal_life.38.t: "Ад Суверенного мастера"
 POD_mummy_elixir_of_eternal_life.38.desc: "Мудрейший мастер оценил вас по достоинству. Единственный кивок подтверждает ваш успех.\n\nВернувшись к своей яме, которая теперь поистине ваша, вы смотрите на неё. Горят печи, работают заводы. Дымятся трубы, растекаются тени. Цепи гремят, проклятия ползут. Души кричат, спектры струятся. Несчастные плачут, призраки корчатся. Улыбка мелькает на вашем лице, когда в вашем сознании кристаллизуются грандиозные амбиции. Щедрейший мастер предоставил вам эту возможность, и было бы грубо не воспользоваться ею в полной мере."
 POD_mummy_elixir_of_eternal_life.38.a: "Так много душ ждут, чтобы стать Ву-Куэй."
 POD_mummy_elixir_of_eternal_life.38.b: "Я буду [Select_CString(ROOT.Char.IsFemale, 'первой', 'первым' )] среди них."

 POD_mummy_elixir_of_eternal_life.39.t: "Окончательная цена"
 POD_mummy_elixir_of_eternal_life.39.desc: "Высочайший мастер не терпит слабости, и ваших усилий оказалось недостаточно. Ваши соперники теперь наслаждаются вашей неудачей, разрывая на куски каркас вашей ямы. Для вас это не имеет большого значения, поскольку разочарование Ужаснейшего мастера длится гораздо дольше, чем ваше существование."
 POD_mummy_elixir_of_eternal_life.39.a: "Нет. НЕТ. НЕТ! НЕЕЕТ!! ААААААААААА!!!"

 # TODO YK: turn these into proper events
 # TODO YK: balance costs and skill requirements based on final YK design
 POD_mummy_elixir_of_eternal_life.40.t: "Подобие жизни"
 POD_mummy_elixir_of_eternal_life.40.desc: "Крики проклятых окружают вас, сливаясь в единую стену. Там, где другие могут чувствовать, что оно сжимает их ощутимым давлением, оно омолаживает вас. Из их страданий вы образовали горы. Из их сожалений вы вырезали реки. Из их вины вы построили своё царство. От их ненависти вы питаетесь. Их муки — ваши. Их тела принадлежат вам. Их души принадлежат вам.\n\nОднако их души остаются в ловушке в вашем царстве и бесполезны для ваших великих амбиций. Даже если они вернутся в мир смертных как [Glossary('ван-куэй','game_concept_kuei_jin_desc')], это будет грубая копия жизни. Ву-Куэй предлагают потенциал для создания бессмертных существ, способных к истинной жизни, существ, которые будут перерождаться вечно. Ву-Куэй заполняют свою нишу, но имеют определённые... ограничения, особенно по сравнению со своими так называемыми «праведными» родичами. Если вы завершите эликсир Вечной жизни, можно будет создать подходящий противовес Ву Тянь.\n\n#R В этом начинании используется оценка под названием «экспериментальные знания». Начальное значение определяется вашими знаниями и силой. Оно будет увеличиваться или уменьшаться во время самого процесса.\nВаши стартовые экспериментальные знания — [GetPlayer.MakeScope.GetVariable('character_eoel_diy_knowledge').GetValue|0]#!"
 POD_mummy_elixir_of_eternal_life.40.a: "Ничто не встанет на моём пути!"
 POD_mummy_elixir_of_eternal_life.40.b: "У меня есть столетия, чтобы добиться этого."

 POD_mummy_elixir_of_eternal_life_diy_start_hunt_tt: "Требуемые экспериментальные знания оцениваются в #V 2500#!"
 POD_CHANGE_CHARACTER_EOEL_DIY_FORCE_ADD: "Вы #P получаете#! $VALUE|0V$ экспериментальных знаний"
 POD_CHANGE_CHARACTER_EOEL_DIY_FORCE_SUBTRACT: "Вы #N теряете#! $VALUE|0V$ экспериментальных знаний"
 POD_CHANGE_OPPOSITION_EOEL_DIY_FORCE_ADD: "Вы #N получаете#! $VALUE|0V$ требуемых экспериментальных знаний"
 POD_CHANGE_OPPOSITION_EOEL_DIY_FORCE_SUBTRACT: "Вы #P теряете#! $VALUE|0V$ требуемых экспериментальных знаний"
 POD_mummy_elixir_of_eternal_life_experimental_knowledge: "#clickable Ваши текущие экспериментальные знания: [GetPlayer.MakeScope.GetVariable('character_eoel_diy_knowledge').GetValue|V0]\nВаши требуемые экспериментальные знания оцениваются в [GetPlayer.MakeScope.GetVariable('opposition_eoel_diy_knowledge').GetValue|V0]#!\n\n"

 POD_mummy_elixir_of_eternal_life.41.t: "Лаборатория тысячи агоний"
 POD_mummy_elixir_of_eternal_life.41.desc: "$POD_mummy_elixir_of_eternal_life_experimental_knowledge$Ваши прошлые усилия дали много знаний, достаточных, чтобы даже создать Ву-Куэй. Однако одних знаний недостаточно. Необходим активный опыт и практическая реализация. Печи должны быть зажжены. Рабы будут работать. Души будут преобразованы в память и эссенцию. Жизнь и смерть будут препарироваться до тех пор, пока в них не останется никаких тайн для вас.\n\nМожет потребоваться множество неудач. Много ресурсов может быть потрачено. Это затраты, которые вы готовы нести."
 POD_mummy_elixir_of_eternal_life.41.a: "Экспериментировать над проклятыми."
 POD_mummy_elixir_of_eternal_life.41.b: "Честолюбивые сами с радостью вызовутся."
 POD_mummy_elixir_of_eternal_life.41.c: "Можно раздобыть живых подопытных."
 POD_mummy_elixir_of_eternal_life.41.effect.success.desc: "Как... увлекательно"
 POD_mummy_elixir_of_eternal_life.41.effect.failure.desc: "Жертвы были неизбежны"

 POD_mummy_elixir_of_eternal_life.42.t: "Первая дистилляция"
 POD_mummy_elixir_of_eternal_life.42.desc: "$POD_mummy_elixir_of_eternal_life_experimental_knowledge$Начались эксперименты. Был установлен последовательный процесс с контролем каждой переменной. Каждый подопытный классифицирован и каждая неудача каталогизирована. Ничто не упущено и не забыто, ибо истина может лежать где угодно.\n\nСотня погибнет. Потом тысяча. Потом десять тысяч. Потом сто тысяч. Большинство душ превращается в пепел, если от них вообще хоть что-то остаётся. Лишь немногие выживают в этом процессе в течение нескольких мгновений, прежде чем распасться.\n\nС каждой неудачей чему-то учатся, поскольку осадок остаётся позади. Пятно. Вы не можете определить, что это. Пока не можете."
 POD_mummy_elixir_of_eternal_life.42.a: "Усовершенствовать процесс."
 POD_mummy_elixir_of_eternal_life.42.b: "Отобрать удачные образцы для дальнейшего изучения."
 POD_mummy_elixir_of_eternal_life.42.c: "[Select_CString(ROOT.Char.IsFemale, 'Самой', 'Самому' )] поглотить остаток."
 POD_mummy_elixir_of_eternal_life.42.effect.success.desc: "Вот что он делает!"
 POD_mummy_elixir_of_eternal_life.42.effect.failure.desc: "Столько потраченных ресурсов"

 POD_mummy_elixir_of_eternal_life.43.t: "Сокровищница скорбей"
 POD_mummy_elixir_of_eternal_life.43.desc: "$POD_mummy_elixir_of_eternal_life_experimental_knowledge$После бесчисленных экспериментов недостающий ингредиент наконец-то обнаружен. Более того, вы нашли надёжный способ его создания. В отличие от золота, его нельзя просто добыть. В отличие от шёлка, его нельзя просто собрать. В отличие от товара, его нельзя просто купить. Только моменты истинных, глубоких, изменяющих жизнь страданий могут сформировать его. Страдания рождения, старости, болезни, смерти, встречи с неприятным, потери приятного, неполучения желаемого. Страдания формы, чувства, восприятия, формирования и сознания. Сожаление. Предательство. Одержимость. Отчаяние. Каждый момент создает каплю, которую можно превратить в эссенцию, эссенцию, которую вы можете использовать.\n\nК счастью, у вас есть множество трагедий. Души акума и их слуг заключены в нефритовые украшения и запечатаны в вашей сокровищнице дверями из чёрного дерева. Каждый из них представляет собой жизнь, добровольно отдавшуюся развращению, часто после великих страданий, при жизни или после смерти. Хотя они могут содержать недостающую сущность, это будет стоить очень дорого, поэтому альтернатива может быть лучше."
 POD_mummy_elixir_of_eternal_life.43.a: "Расширить фабрики пыток."
 POD_mummy_elixir_of_eternal_life.43.b: "Создать новые формы страданий."
 POD_mummy_elixir_of_eternal_life.43.c: "Вырвать души из скупой хватки Юй Хуана."
 POD_mummy_elixir_of_eternal_life.43.d: "Открыть хранилища!"
 POD_mummy_elixir_of_eternal_life.43.effect.success.desc: "Наконец! Эссенции более чем достаточно!"
 POD_mummy_elixir_of_eternal_life.43.effect.failure.desc: "На это ушло слишком много душ"

 POD_mummy_elixir_of_eternal_life.44.t: "Глаза за завесой"
 POD_mummy_elixir_of_eternal_life.44.desc: "$POD_mummy_elixir_of_eternal_life_experimental_knowledge$По Загробному миру уже распространились слухи, что ваше внимание сосредоточено на другом. Соперничающие короли-демоны рассылают шпионов и проводят разведывательные набеги. Жёлтые источники и его хозяин задают вопросы. Он так и не простил повелителям Яма кражу части Загробного мира и давно пытался вернуть её.\n\nВаши истинные цели не останутся скрытыми навсегда, отчасти из-за ресурсов, которые вы потратили и тратите. Однако те же затраченные ресурсы ослабляют ваши позиции. Хуже того, возможность приобретения такой власти может побудить противников вмешаться до того, как вы её достигнете."
 POD_mummy_elixir_of_eternal_life.44.a: "Пусть приходят!"
 POD_mummy_elixir_of_eternal_life.44.b: "Скормить им ложные выводы."
 POD_mummy_elixir_of_eternal_life.44.c: "Пожертвовать несколькими пешками, которых не жалко."
 POD_mummy_elixir_of_eternal_life.44.effect.success.desc: "Вы отвлекли их внимание"
 POD_mummy_elixir_of_eternal_life.44.effect.failure.desc: "Борьба с ними потребовала бесчисленных ресурсов"

 POD_mummy_elixir_of_eternal_life.45.t: "Неизбежные недостатки"
 POD_mummy_elixir_of_eternal_life.45.desc: "$POD_mummy_elixir_of_eternal_life_experimental_knowledge$Благодаря последним усовершенствованиям и добавлению этого специального ингредиента испытуемые больше не распадаются на бесчисленные нити плоти и костей. Хотя эти нити были полезны для создания вечно визжащей одежды, они никогда не представляли собой улучшенных Ву-Куэй, которых вы желаете.\n\nВместо того чтобы погибнуть, им осталось нечто меньшее, чем жизнь. Их раны закрываются. Их плоть выдерживает. Тем не менее, они остаются вопиющими мерзкими существами, поддерживаемыми исключительно вашей волей. Если они когда-нибудь покинут ваше царство, их тела распадутся на новые нити. Даже несмотря на то, что их физическая форма сохраняется, их разум деградирует до безумия, голода и отчаяния.\n\nВ процессе по-прежнему скрыт какой-то изъян."
 POD_mummy_elixir_of_eternal_life.45.a: "Укрепить подопытных дисциплиной."
 POD_mummy_elixir_of_eternal_life.45.b: "Изучить их желания и амбиции."
 POD_mummy_elixir_of_eternal_life.45.c: "Препарировать их до вырождения."
 POD_mummy_elixir_of_eternal_life.45.effect.success.desc: "Вот что это делает!"
 POD_mummy_elixir_of_eternal_life.45.effect.failure.desc: "Опять приходится избавляться от неудачных образцов"

 POD_mummy_elixir_of_eternal_life.46.t: "Мятежный прототип"
 POD_mummy_elixir_of_eternal_life.46.desc: "$POD_mummy_elixir_of_eternal_life_experimental_knowledge$Наконец, НАКОНЕЦ один из подопытных сохраняет прежний облик, не превращаясь в чудовище, на которое даже вы едва можете смотреть. Оно говорит. Оно помнит. Оно мыслит!\n\nСперва оно позволяет вам продолжать опыты. Вы делаете несколько открытий, но затем оно СМЕЕТ не выполнить приказ! СМЕЕТ действовать против вашей воли! УТВЕРЖДАЕТ, что обладает #italic «свободой воли»#!! #italic Якобы#! существуют истины, скрытые от ВАШЕГО ВЗОРА! По его словам, страданий #italic «недостаточно»#! и необходима именно #italic «свобода»#!! Как будто вашей славы и могущества может быть #bold недостаточно#! для чего бы то ни было! Сама эта мысль — полный абсурд!\n\nКак бы то ни было, прототип нужен вам для продолжения экспериментов."
 POD_mummy_elixir_of_eternal_life.46.a: "Пытки сломят его волю."
 POD_mummy_elixir_of_eternal_life.46.b: "Уничтожить его и сохранить останки."
 POD_mummy_elixir_of_eternal_life.46.c: "Предложить выгодную сделку."
 POD_mummy_elixir_of_eternal_life.46.d: "ОНО ПОВИНУЕТСЯ МНЕ!"
 POD_mummy_elixir_of_eternal_life.46.effect.success.desc: "ТЫ ПОСМЕЛ МЕНЯ ОСЛУШАТЬСЯ!"
 POD_mummy_elixir_of_eternal_life.46.effect.failure.desc: "Мне придётся создать ещё один"

 POD_mummy_elixir_of_eternal_life.47.t: "Последнее испытание"
 POD_mummy_elixir_of_eternal_life.47.desc: "$POD_mummy_elixir_of_eternal_life_experimental_knowledge$Каждый год труда, каждый эксперимент, каждая неудача, каждая жертва ресурсами — всё это привело вас к этому моменту. Вы верите, что успешно создали эликсир Вечной жизни, формулу, способную даровать вечное возрождение. Однако вы не сможете быть в этом уверены, если не протестируете окончательную версию должным образом. Изготовление было трудным и чрезвычайно дорогим. Если у вас ничего не получится, может пройти некоторое время, прежде чем вы сможете собрать необходимые материалы и попытаться ещё раз."
 POD_mummy_elixir_of_eternal_life.47.a: "Провести испытание на осужденной душе."
 POD_mummy_elixir_of_eternal_life.47.b: "Провести испытание на сильном пленнике."
 POD_mummy_elixir_of_eternal_life.47.c: "Провести испытание на верном рабе."
 POD_mummy_elixir_of_eternal_life.47.d: "Провести испытание на моём самом способном слуге."
 POD_mummy_elixir_of_eternal_life.47.effect.success.desc: "Мой успех был неизбежен"
 POD_mummy_elixir_of_eternal_life.47.effect.failure.desc: "Смерть подопытного... прискорбна"
 POD_mummy_elixir_of_eternal_life.47.final_check: "Сравнит ваши экспериментальные знания с необходимым количеством, чтобы определить окончательный результат"

 #success
 POD_mummy_elixir_of_eternal_life.48.t: "Вечное возрождение"
 POD_mummy_elixir_of_eternal_life.48.desc: "Все живут и умирают. Некоторые возвращаются в мир смертных в промежуточном состоянии. Лишь немногие живут, умирают и возвращаются к жизни самими собой. Ваша прошлая работа над эликсиром Вечной жизни позволила вам создать грубую версию этих Бессмертных существ, которых вы называете Ву-Куэй. Однако у них всегда были свои ограничения, и их души не обладали целостностью, свойственной тем, кого создали высокомерные Восемь бессмертных.\n\nТеперь вы наблюдаете, как подопытный умирает под вашими инструментами, прежде чем снова воскреснуть. Каждое испытание подтверждает, что его тело живо, а преданность абсолютна. Он ваш, и скоро их станет легион."
 POD_mummy_elixir_of_eternal_life.48.a: "Пусть Небеса содрогнутся!"

 #failure
 POD_mummy_elixir_of_eternal_life.480.t: "Великое заражение"
 POD_mummy_elixir_of_eternal_life.480.desc: "Ваша лаборатория замолкает. Формула, расчёты, приготовления. Всё было безупречно! Ваша работа была безупречна! Однако это не удалось! Хуже того, с каждой секундой плоть вашего испытуемого отслаивается от костей, которые активно разжижаются. Лужа бронзовой плоти, алой крови и белых, как слоновая кость, костей собирается у ваших ног, а затем яростно разлетается по стенам, когда душа разрывается. Целые секции лаборатории превращаются в кричащую пустошь. Части вашего измерения и его барьера раскалываются, когда на них обрушивается духовная ударная волна взрыва.\n\nПотребуется время, чтобы исправить ущерб и ещё раз укрепить свои позиции среди повелителей Яма. На данный момент работу придётся прекратить..."
 POD_mummy_elixir_of_eternal_life.480.a: "Но у меня есть вечность, чтобы завершить работу..."