 POD_mummy_spell_of_life.1.t: "Запрос доступа"
 POD_mummy_spell_of_life.1.desc: "Чтобы продолжить наши исследования способов вечного возрождения, нам понадобится доступ к Тайным письменам Кабира. [Select_CString(writings_cabirus_owner.IsFemale, 'Нынешняя владелица', 'Нынешний владелец' )], [writings_cabirus_owner.GetFirstName], любезно [Select_CString(writings_cabirus_owner.IsFemale, 'согласилась', 'согласился' )] предоставить нам аудиенцию. Однако [writings_cabirus_owner.GetSheHe] захочет что-то в обмен на предоставление нам доступа к артефакту."
 POD_mummy_spell_of_life.1.a: "У меня есть книги для торговли."
 POD_mummy_spell_of_life.1.b: "Я поддержу ваши военные усилия."
 POD_mummy_spell_of_life.1.c: "Я обеспечу топливо для ваших экспериментов."
 POD_mummy_spell_of_life.1.c.fuel_experiments: "Уровень [Concept('development', 'развития')|E] всех графств в [Concept('de_jure', 'де-юре')|E] границах вашего столичного [Concept('duchy', 'герцогства')|E] снизится на 5, и они получат модификатор «[GetModifier('extinguish_life_modifier').GetNameWithTooltip]» на 1 год."
 POD_mummy_spell_of_life.1.d: "Как член Внутреннего совета, я требую доступа."
 POD_mummy_spell_of_life.1.e: "Цена слишком высока."

 POD_mummy_spell_of_life.2.t: "Последняя копия уничтожена"
 # Inspired by karde mentioning that Horus rampaged through Marseilles while looking for the Uraeus of Orisis, among other things
 POD_mummy_spell_of_life.2.desc: "Посредством жёсткого контроля Гор надеялся сохранить тайны бессмертия, чтобы никто, недостойный этого дара, не получил его. Однако тайны имеют свойство становиться известными. Согласно легендам, молодая мумия по имени Кабир отправился в Грецию в шестом веке до нашей эры и продал книгу смертному волшебнику, который вернулся домой и медленно скопировал её сам. Затем текст был передан нескольким другим смертным волшебникам, и было создано несколько мумий на основе версии великого обряда Осириса, сохранившейся в том, что стало #italic Тайными письменами Кабира#!. На протяжении веков Гор и его слуги выследили и сожгли почти каждую копию. Однако получить все копии им не удалось. Одна осталась в безопасности в великой горной крепости Цеорис, цитадели вампирского клана Тремер. Они терпели неудачу... до сих пор.\n\nПока пожары инквизиции бушуют по всей Европе, новообращённые, фурии, Бруха и многие другие восстали против своих старейшин в ходе того, что сейчас называется Восстанием анархов. Среди хаоса Гор увидел возможность. Собрав свои войско из вампиров, фера и мумий, он проложил себе путь через залы Цеориса. Хотя они и не были проклятыми отродьями его дяди, их тёмная магия, жестокие эксперименты и безрассудная жажда знаний сделали их немногим более достойными Великого обряда. Когда его магия принесла солнечный свет в затемнённые залы, он двинулся вперёд, не упиваясь им, как некоторые из его товарищей, а просто принимая необходимость. С каждым взмахом его клинок отделял их головы от отвратительных тел, и он приближался к их скрытому хранилищу. Их заклинания и ритуалы не могли причинить ему вреда, и даже защита хранилища не смогла его остановить. С щелчком хищное пламя вспыхнуло вокруг конкретной книги, последней копии текста, созданного глупцом так давно. Когда страницы горели и скручивались сами собой, когда пепел падал на стол и дым наполнял его ноздри, когда огонь потрескивал и пламя распространялось, лёгкая улыбка ползла по его лицу."
 POD_mummy_spell_of_life.2.a: "Так много потеряно и так быстро."
 POD_mummy_spell_of_life.2.a.tt: "Требования для решения «$spell_of_life_stage1_cabirus_phase1_decision$» изменились"

 POD_mummy_spell_of_life.3.t: "Одно завершено, другое начато"
 POD_mummy_spell_of_life.3.desc: "Теперь, когда вы достигли базового понимания заклинания Жизни, ваш наставник больше не может ничему вас научить. Наставник говорит вам, что магией нужно овладевать самостоятельно, а не преподавать в классе. Возможно, дело лишь в нежелании раскрывать вам дальнейшие подробности, но результат тот же. Вам придётся путешествовать по всему миру, чтобы собирать древние записи, учиться на ошибках других и учиться у тех, кто частично понимает заклинание. В конце концов, услышать один и тот же урок из разных уст часто бывает полезно при попытке освоить тему. Кроме того, вам нужно будет тратить время на исследования, медленный перевод записей и проведение экспериментов.\n\n#help Чтобы достичь 90 [Concept('trait_level_track_xp', 'опыта')|E] заклинания Жизни и продвинуться дальше, вам нужно будет накапливать его пассивно и завершая [Concept('journeys', 'странствия')|E]. Чтобы узнать больше, см. [Concept('story_cycle', 'историю')|E] «$POD_story_spell_of_life_explanation$» и описание свойства «Искатель вечного возрождения» под вашим персонажем.#!"
 POD_mummy_spell_of_life.3.desc.b: "Теперь, когда вы достигли базового понимания заклинания Жизни, одними экспериментами уже не продвинуться дальше. Магия – это то, что нужно осваивать на практике, а не преподавать в классе. Вам придётся путешествовать по всему миру, чтобы собирать древние записи, учиться на ошибках других и учиться у тех, кто частично понимает заклинание. В конце концов, услышать один и тот же урок из разных уст часто бывает полезно при попытке освоить тему. Кроме того, вам нужно будет тратить время на исследования, медленный перевод записей и проведение большего количества экспериментов.\n\n#help Чтобы достичь 90 [Concept('trait_level_track_xp', 'опыта')|E] заклинания Жизни и продвинуться дальше, вам нужно будет накапливать его пассивно и завершая [Concept('journeys', 'странствия')|E]. Чтобы узнать больше, см. [Concept('story_cycle', 'историю')|E] «$POD_story_spell_of_life_explanation$» и описание свойства «Искатель вечного возрождения» под вашим персонажем.#!"
 POD_mummy_spell_of_life.3.a: "Мои поиски ещё не окончены..."

 POD_mummy_spell_of_life.4.t: "Предупреждение о необходимости остановиться"
 POD_mummy_spell_of_life.4.desc: "Что-то происходит... меняется... рвется. В Барьере, который нависает между материальными и теневыми землями, появляются разрывы. Штормы проносятся по землям мертвых, их недостаточно, чтобы ознаменовать новую эпоху, но они всё ещё уносят множество духов в тёмные места. Звери поднимаются, монстры распространяются, а духи собираются.\n\nЗатмение скрывает лик Солнца, отбрасывая тени, несущие смысл. Мужчины и женщины, дети и старики, смертные всех мастей, встречая вас, произносят странные вещи, их глаза сверкают золотом, а в их голосах слышится бремя веков, немыслимое для таких, как они. Куда бы вы ни посмотрели, появляются загадочные сообщения, выжженные на стенах и говорящие о беспокойных мертвецах. То, что вы можете извлечь, указывает на то, что создание вами мумий и использование магии вечного возрождения наносит ущерб... #bold ЕМУ#!."
 POD_mummy_spell_of_life.4.a: "Действительно, странная новость..."

 POD_mummy_spell_of_life.5.t: "Путешествие долгого дня в ночь"
 POD_mummy_spell_of_life.5.desc: "Возможно, это следствие несдержанности, того, что некоторые вещи не спрятаны. Возможно, это была ваша цель с самого начала, когда вы искали магию вечного возрождения. В конце концов, это не имеет значения. Так мало что уже имеет значение.\n\nСуществует много историй о конце времени и много названий для него. Некоторые видели поток крови, очищающий мир. Другие предсказывали появление аватара абсолютного зла. Мало кто был прав в том, что это закончится разрывом завесы между мирами.\n\nТо, что когда-то было разрывами, теперь превратилось в огромные дыры, от которых от Завесы остались лишь клочья занавеси. Разломы в бесконечной пропасти источают тошнотворный зелёный туман, пожирающий землю. Бродят кошмары, обретшие форму всех наших страхов, страхов, обретших новую жизнь в эти мрачные дни. Живые тени, остатки тех, кто сдался внутренней тьме, бродят по затянутым туманом долинам и окутанным туманом лесам. Формы, разум, тело и дух которых одержимы ужасами, недоступными пониманию смертных, бродят по землям, соблазняя и искушая. Невиданный ранее шторм поглощает земли мёртвых, бросая их в пасть, не знающую насыщения. От таких ветров треснули даже печати на самой Бездне. Ярость ветров распространяется даже на материальный мир, поглощая солнечный свет и позволяя свободно передвигаться тем, кто боится его лучей. Те, чьи тела давно превратились в прах, бродят по землям в поисках тел, которые можно украсть, чтобы стать неживыми бессмертными, пирующими кровью и дыханием. Воды становятся красными от крови, когда источники бездны открываются. Саранча с золотыми коронами, лицами людей, зубами львов и хвостами скорпионов опустошает земли, распространяясь такими огромными стаями, что одних их крыльев достаточно, чтобы оглушить мертвых.\n\nСреди ужасов смертные слышат голоса в своей голове и видят сообщения на стенах, наделяя их силой совершать подвиги, которые даже бессмертные с трудом смогут повторить. Первой среди их целей являются Бессмертные, те, кто возрождается вечно и чье создание привело к этому. С каждым ударом они стремятся залатать разрывы. Продолжают распространяться слухи о двух странных светящихся крылатых существах, которые помогают этим охотникам и пытаются вновь отделить мёртвых от живых. Только время покажет, принесут ли их усилия плоды, но это уже история для другого дня..."
 POD_mummy_spell_of_life.5.a: "На этом всё и заканчивается..."
 POD_mummy_spell_of_life.5.a.tt: "Мир подходит к концу, поскольку [Concept('umbra', 'Умбра')|E] продолжает сливаться с Землями плоти. #X Игра окончена, миру, который вы знали, пришёл конец.#!"

 POD_mummy_spell_of_life.10.t: "Аудиенция у Гора"
 POD_mummy_spell_of_life.10.desc: "$POD_debate_debate_strength_header$Только Гор владеет заклинанием Жизни. Он очень давно не создавал новую мумию с помощью заклинания. Он определённо не поделится с вами заклинанием в нынешнем положении дел.\n\nОднако вашей предыдущей услуги было достаточно, чтобы он дал вам аудиенцию. Если бы вы могли представить достаточно убедительные аргументы, вы могли бы получить его помощь в своих поисках, что существенно облегчило бы задачу.$POD_debate_debate_explanation_footer$"
 POD_mummy_spell_of_life.10.a: "Я отправлюсь к его двору."
 POD_mummy_spell_of_life.10.b: "Если подумать..."

 POD_mummy_spell_of_life.11.t: "Аудиенция: Хранитель или купец?"
 POD_mummy_spell_of_life.11.desc: "$POD_debate_debate_strength_header$«Итак... ты молодой щенок, который стремится изучить заклинание Жизни. Твоя служба заслужила тебе аудиенцию, но не более того.\n«Помни, я не простой торгаш. Меня невозможно купить. Я не стану #italic просто#! продавать заклинание Жизни. Я хранитель могущественных знаний. Отдать тебе заклинание Жизни — всё равно, что вручить корону неиспытанному правителю. Некоторые дураки могут даже использовать его, пытаясь стать равными Осирису или Судьям Маат. Так много глупцов ищут божественности, силы, которая сделает их более великими. По правде говоря, заклинание свяжет тебя с последствиями, которых ты не сможешь избежать, за тобой будут наблюдать силы, от которых не скрыться, и судить тебя за каждое восстановленное тобой дыхание».\n\n«Что ты предложишь в ответ?»"
 POD_mummy_spell_of_life.11.a: "Орудие хранителя действует по закону. Сделайте меня таким орудием."
 POD_mummy_spell_of_life.11.b: "Если вы откажете всем, заклинанием завладеют лишь недостойные."
 POD_mummy_spell_of_life.11.c: "Цена — само заклинание; большей цены быть не может."

 POD_mummy_spell_of_life.12.t: "Аудиенция: А что насчёт трусости?"
 POD_mummy_spell_of_life.12.desc: "$POD_debate_debate_strength_header$«На протяжении многих тысячелетий я вёл одну войну — войну против хаоса и предателей. Те, кому даровано вечное возрождение благодаря заклинанию Жизни моей матери, призваны помочь этой войне. И всё же были предатели и трусы, которые отказались от нашего дела. Столетия возрождения сделали их апатичными и трусливыми. Некоторые покончили с собой, бросив нас. Другие заботились только о своем дальнейшем, кратковременном существовании и удовольствиях и поэтому ушли в пустыню, чтобы скитаться».\n«Насколько больше эта ответственность лежит на том, кто владеет самим заклинанием? Каким существом ты станешь через столетие, пять, сто? Останешься ли ты [Select_CString(ROOT.Char.IsFemale, 'верна', 'верен' )]? Будешь ли ты искать облегчения в истинной смерти? Будешь ли бежать в страхе, когда впервые увидишь Дитя Сета, будь то кровосос или бессмертный?»"
 POD_mummy_spell_of_life.12.a: "Я [Select_CString(ROOT.Char.IsFemale, 'сражалась', 'сражался' )] с сетитами, чтобы захватить Верхний Египет. Я их не боюсь."
 POD_mummy_spell_of_life.12.b: "Я не [Select_CString(ROOT.Char.IsFemale, 'новообращённая', 'новообращённый' )]. Я знаю, что делают годы."

 POD_mummy_spell_of_life.13.t: "Аудиенция: А что насчёт предательства?"
 POD_mummy_spell_of_life.13.desc: "$POD_debate_debate_strength_header$«Возможно, ты предашь меня более откровенно, хм? Кеминтири когда-то служила среди последователей моей матери, но она была шпионкой Сета. Ты [Select_CString(ROOT.Char.IsFemale, 'шпионка', 'шпион' )]? Когда она поделилась со мной своими истинными намерениями, я простил её. Однако Сет схватил её и пытал много-много лун. Хотя ей придётся пострадать за многие другие свои преступления, я признаю, что она не отдала ему заклинание. Можешь ли ты сказать то же самое? А как насчёт македонского шпиона, который внедрился в ряды жрецов моей матери в моё отсутствие? Ему почти удалось украсть заклинание Жизни, чему помешало только его собственное высокомерие. Это создало мерзости, которые другие называют проклятыми мумиями».\n\n«Попадешься ли ты на такую уловку? Проникнут ли шпионы в ряды твоих последователей, чтобы украсть заклинание Жизни? Что, если Сет предложит тебе миллион золотых монет или все удовольствия, которые может предложить этот мир? Он не лишён своей силы. Искусит ли тебя такое предложение? Ты передашь ему заклинание Жизни?»"
 POD_mummy_spell_of_life.13.a: "Я могу противостоять чему угодно, пыткам или удовольствиям."
 POD_mummy_spell_of_life.13.b: "Я [Select_CString(ROOT.Char.IsFemale, 'осторожна', 'осторожен' )] и умею хранить секреты."
 POD_mummy_spell_of_life.13.c: "Возьми моё истинное имя как залог верности."
 POD_mummy_spell_of_life.13.c.prohibited_from_teaching: "Гор запрещает вам обучать других заклинанию Жизни"

 POD_mummy_spell_of_life.14.t: "Аудиенция: Взгляд сквозь века?"
 POD_mummy_spell_of_life.14.desc: "$POD_debate_debate_strength_header$«В моё отсутствие жрецы моей матери предлагали вечное возрождение многим недостойным. Вместо того, чтобы сохранять лучших и самых ярких, они позволили политике и золоту определять их решения. Даже когда они выбирали тех, кто заслуживал этого в данный момент, они игнорировали долгосрочную устойчивость выбранных. Умы и храбрость многих таких избранных были подорваны тысячелетиями».\n\n«Проявишь ли ты такую степень #italic мудрости#!? Возможно, в силу твоей молодости тебе не хватает перспективы? Позволишь ли ты личным чувствам и эмоциям влиять на тебя? Пренебрежёшь ли ты их пригодностью ради сохранения близких и дорогих тебе людей?»"
 POD_mummy_spell_of_life.14.a: "Я бы никогда!"
 POD_mummy_spell_of_life.14.b: "Судьи распознают недостойных."
 POD_mummy_spell_of_life.14.c: "Ты будешь наставлять меня."

 POD_mummy_spell_of_life.15.t: "Аудиенция: Поддержание Маат?"
 POD_mummy_spell_of_life.15.desc: "$POD_debate_debate_strength_header$«Заклинание Жизни — это гораздо больше, чем просто заклинание. Мумии существуют вне естественного порядка вещей. Неправильно снова и снова возвращаться в одно и то же тело. Мы причиняем меньше вреда, чем мертвецы, которые сохраняются за счет крови или жизни. Мы — защитники Маат, равновесия, в [Glossary('вечной войне','podgloss.warofbalance')]. Мы выслеживаем и убиваем тех, кто пытается разрушить его и внести хаос. И всё же, в силу самого своего существования, мы являемся препятствиями на пути его восстановления. В небольших количествах ущерб незначителен и во многом компенсируется нашей войной. У нас есть механизмы, позволяющие контролировать ущерб и осторожно высвобождать яд. Однако придёт время, когда Маат потребует, чтобы мы убили себя и прекратили циклы перерождения. С каждой новой мумией мы завязываем и скручиваем цикл смерти, насылая парадокс нашего существования на Загробный мир. Каждая новая мумия всё больше нарушает равновесие и истончает Завесу, отделяющую Загробный мир от земель живых. Каждая новая мумия приближает день нашего конца, момент, когда ущерб, который мы наносим, слишком велик и слишком необратим».\n\n«Передав тебе тайну заклинания Жизни, я гарантирую, что будут созданы новые мумии, потому что нет другой причины продолжать его. Почему я должен идти на такой риск и помогать тебе? Компенсируешь ли ты нанесённый ущерб?»"
 POD_mummy_spell_of_life.15.a: "Обучение заклинанию сдержит их число по сравнению с независимым открытием."
 POD_mummy_spell_of_life.15.b: "Если вы научите меня, вы будете контролировать то, что будет дальше."
 POD_mummy_spell_of_life.15.c: "Отвергать новых защитников — больший вред для Маат."

 POD_mummy_spell_of_life.16.t: "Аудиенция: Успех"
 POD_mummy_spell_of_life.16.desc: "«Хорошо... твои аргументы убедительны. Если ты проявишь себя и продемонстрируешь свою приверженность войне, я помогу тебе в поисках заклинания Жизни. Я не дам тебе заклинание. Только раскрыв его тайну самостоятельно, ты сможешь по-настоящему оценить и понять его. Тем не менее, я дам некоторые советы, которые помогут тебе собрать воедино осколки знаний, разбросанные во все стороны»."
 POD_mummy_spell_of_life.16.a: "Я [Select_CString(ROOT.Char.IsFemale, 'благодарна', 'благодарен' )] за ваше наставничество."

 POD_mummy_spell_of_life.17.t: "Аудиенция: Провал"
 POD_mummy_spell_of_life.17.desc: "«[Select_CString(ROOT.Char.IsFemale, 'Дура', 'Дурак' )]! Я охранял Маат более шести тысячелетий! Думаешь, таких красивых слов будет достаточно, чтобы меня поколебать? Считаешь ли ты меня политиком, который будет следовать за ветром перемен? Считаешь ли ты меня торговцем, который изменит своё мнение за золото?»\n\n«Возможно, через несколько лет или десятилетий ты проявишь большую мудрость. Ступай прочь!»"
 POD_mummy_spell_of_life.17.a: "Очень хорошо, я вернусь позже."



 POD_mummy_spell_of_life.20.t: "Совет: кого созвать?"
 POD_mummy_spell_of_life.20.desc: "Поиски заклинания Жизни — дело непростое и потребует от нас огромного внимания. Если бы вы могли заручиться поддержкой своих близких, у вас было бы больше времени и ресурсов, которые можно было бы посвятить своим усилиям. Даже обещания невмешательства было бы достаточно.\n\nВопрос в том, кого пригласитҗ. Вы можете пригласить только самых сильных, поэтому вы не можете выбирать, кого конкретно пригласить. Вместо этого вы должны подумать, кто с наибольшей вероятностью согласится на ваше предложение. Кто окажет наибольшую помощь?"
 POD_mummy_spell_of_life.20.a: "Собрать нашу семью."
 POD_mummy_spell_of_life.20.c: "Созвать последователей нашего пути."
 POD_mummy_spell_of_life.20.d: "С другой стороны..."

 POD_mummy_spell_of_life.21.t: "Совет: пора начинать"
 POD_mummy_spell_of_life.21.desc: "$POD_debate_debate_strength_header$Прошло некоторое время. Однако вы наконец-то созвали совет из 5 представителей. Продолжение исследования потребует много времени и ресурсов. Вам нужно убедить их присоединиться к вашим усилиям и посвятить свои ресурсы вашему делу. Такое обещание ускорит ваши усилия и поможет оградить вас от внешних сил. Даже обещание невмешательства могло бы снизить риск. В конце концов, вы же не хотите иметь дело с родственниками-идиотами, пытающимися украсть ваши исследования.$POD_debate_debate_explanation_footer$"
 POD_mummy_spell_of_life.21.a: "Присаживайтесь. Нам предстоит многое сделать."
 POD_mummy_spell_of_life.21.b: "С другой стороны..."

 POD_mummy_spell_of_life.22.t: "Совет: там, где другие потерпели неудачу"
 POD_mummy_spell_of_life.22.desc: "$POD_debate_debate_strength_header$«Заклинание Жизни — это пустая трата времени, поиски ещё более глупые, чем поиск Грааля. Очень, очень немногие когда-либо владели заклинанием Жизни, и каждый из них получил его от другого. Исида, одна из величайших магов в истории, получила его в подарок от существа, которого она звала Тот. Гор, один из двоих, кто знает его в нынешнюю эпоху, научился этому от своей матери. Кабир, другой из двоих, практиковал неполную и ошибочную версию, модифицированную на основе копии, подаренной ему неизвестным ишмаэлитом. Несколько других подтверждённых обладателей принадлежат к культу Исиды и прошли аналогичное обучение у других. Всё остальное — всего лишь слухи».\n«Многие, многие пытались получить его другими способами. Сет провёл бесчисленные столетия в поисках заклинания. Будь то проникновение в культ Исиды, пытки обладателя заклинания Жизни или проведение экспериментов невероятного масштаба, он, [Glossary('каинитский','game_concept_cainite_desc')] [Glossary('допотопный','game_concept_antediluvian_desc')], каждый раз терпел неудачу. Лучшее, что ему удалось, — это глубоко искажённые Проклятые мумии. Сами проклятые мумии провели столетия в одних и тех же бесплодных поисках. Несколько ишмаэлитов тоже пытались. Ближе всего они когда-либо подходили к заклинанию, создающему вампиров».\n\n«Вы действительно верите, что можете создать заклинание Жизни, не получив его в дар? Считаете ли вы себя [Select_CString(ROOT.Char.IsFemale, 'такой особенной, такой непохожей', 'таким особенным, таким непохожим' )], что добьётесь успеха там, где многие великие потерпели неудачу?»"
 POD_mummy_spell_of_life.22.a: "С тех пор инструменты, знания и магия изменились."
 POD_mummy_spell_of_life.22.b: "Это заклинание со многими слоями и вариантами."
 POD_mummy_spell_of_life.22.c: "Они работали порознь. Поэтому я и [Select_CString(ROOT.Char.IsFemale, 'созвала', 'созвал' )] вас..."

 POD_mummy_spell_of_life.23.t: "Совет: какова цена?"
 POD_mummy_spell_of_life.23.desc: "$POD_debate_debate_strength_header$«Вы хотите золота? Ресурсов? Рабочей силы? Доступ к нашим библиотекам? Самое ценное, даже для нас, время? Возможно, вы не заметили, но наш вид постоянно находится в состоянии войны, внутренней и внешней. Охотники становятся всё более решительными, настойчивыми и многочисленными. Некоторые из самых старых среди нас исчезли, закончили свою жизнь или были выслежены. Наши соперники запускают всё более сложные политические махинации. Наши собственные планы и исследования требуют всё больших затрат. Вы не можете всерьёз ожидать, что мы будем рисковать тем немногим, что у нас есть, ради какого-то эзотерического занятия, которое может принести только неудачу. Даже если мы признаем, что заклинание Жизни теоретически возможно, альтернативные издержки неприемлемы»."
 POD_mummy_spell_of_life.23.a: "Это решение проблемы выживания, а не отвлечение от него."
 POD_mummy_spell_of_life.23.b: "Вы уже принимаете рискованные исследования, соответствующие вашим традициям."
 POD_mummy_spell_of_life.23.c: "Это потребует меньше, чем вы думаете."

 POD_mummy_spell_of_life.24.t: "Совет: какова награда?"
 POD_mummy_spell_of_life.24.desc: "$POD_debate_debate_strength_header$«У нас есть свои дела, свои собственные базы власти, владения, верные последователи. Нам придётся пожертвовать некоторыми из наших ресурсов, чтобы помочь вам, ослабляя себя и создавая бреши. Если вы потерпите неудачу, мы потратим драгоценное время, деньги и усилия на глупую затею. Однако давайте оставим это в стороне и скажем, что мы принимаем ваши аргументы. Если вам это удастся... ну, это уже другая проблема. Мы ослабим себя, чтобы сделать вас сильнее. Вы станете [Select_CString(ROOT.Char.IsFemale, 'конкуренткой', 'конкурентом' )]. После этого вы можете стать [Select_CString(ROOT.Char.IsFemale, 'соперницей, способной', 'соперником, способным' )] свергнуть нас. Если сравнить, мы ничего не получим. Почему бы нам не потребовать ресурсы? Почему бы нам не украсть у вас заклинание? Проще говоря, какая нам от этого выгода?»"
 POD_mummy_spell_of_life.24.a: "У меня много золота."
 POD_mummy_spell_of_life.24.b: "Я буду в долгу перед вами."
 POD_mummy_spell_of_life.24.c: "Я одолжу вам свои силы."

 POD_mummy_spell_of_life.25.t: "Совет: навстречу катастрофе?"
 POD_mummy_spell_of_life.25.desc: "$POD_debate_debate_strength_header$«Многие другие искали заклинание Жизни, очень многие. Такие существа живут долго, обладают мощными способностями и не откажутся от своих поисков. Если вам удастся добиться успеха там, где они потерпели неудачу, это может привлечь внимание могущественных существ. Их внимание приносит не что иное, как катастрофу для вас... и для нас, если мы вам поможем. Верите ли вы, что таким силам можно противостоять? Что вы сможете противостоять таким силам? Возможно, вы думаете, что они будут слишком напуганы, чтобы вмешиваться?»"
 POD_mummy_spell_of_life.25.a: "Их давно нет. Нет причин их бояться."
 POD_mummy_spell_of_life.25.b: "Мои рыцари и я будем стоять твёрдо."
 POD_mummy_spell_of_life.25.c: "Мы все вместе должны противостоять им."

 POD_mummy_spell_of_life.26.t: "Совет: успех"
 POD_mummy_spell_of_life.26.desc: "«Хорошо... ваши аргументы убедительны. Мы предоставим вам некоторые ресурсы для продолжения ваших экспериментов, хотя мы не будем полностью посвящать себя начинанию, которое почти гарантированно провалится. Не потратьте их зря»."
 POD_mummy_spell_of_life.26.a: "Я благодарю вас за вашу помощь."

 POD_mummy_spell_of_life.27.t: "Совет: провал"
 POD_mummy_spell_of_life.27.desc: "«Глупец! Вы просите слишком многого за слишком мало. Мы не будем поддерживать ваше безрассудство».\n\n«Возможно, через несколько лет или десятилетий вы докажете, что способны представить убедительные аргументы. Созовите нас тогда!»"
 POD_mummy_spell_of_life.27.a: "Ладно, поговорим позже."



 POD_mummy_spell_of_life.30.t: "Нападение Гора"
 POD_mummy_spell_of_life.30.desc: "Гор всегда был хранителем заклинания Жизни, единственным из ныне живущих, кто знает полное заклинание. Он живёт по своему кодексу Ват-Гор и применяет его в мире. Шестой принцип запрещает создание мумий, что по сути ограничивает доступ к заклинанию Жизни. Он охотится за Тайными письменами Кабира, в которых содержится лишь неполная информация о заклинании Жизни. Вы подошли очень близко к созданию полного заклинания Жизни, вызвав ярость Гора в размерах, далеко превосходящих всё, что когда-либо вызывали письмена Кабира.\n\nТеперь Гор и его последователи-мумии прибыли к вашему пристанищу, планируя атаковать днём, когда они будут наиболее сильны под золотым светом Ра. Они формируют ряды, готовясь сокрушить вашу оборону. Их мечи блестят в полуденном солнце, жаждущие пролить вашу кровь. Их магия собирается вокруг них, искажая местность, как жаркий туман над факелом или каменной крышей летом. По неслышимому сигналу они атакуют. У вас нет другого выбора, кроме как противостоять их нападению."
 POD_mummy_spell_of_life.30.a: "Держитесь. Держитесь! ДЕРЖИТЕСЬ!"
 POD_mummy_spell_of_life.30.b: "Пожалуйста! Позвольте мне жить! Прошу вас!"
 POD_mummy_spell_of_life.30.stage3.success: "Каким-то образом, несмотря на всё, вы одержали верх"
 POD_mummy_spell_of_life.30.stage3.successful_groveling: "Гор принимает вашу жалкую мольбу"
 POD_mummy_spell_of_life.30.stage3.failure: "Вы падаете, как пшеница перед косой"
 POD_mummy_spell_of_life.30.stage3.successful_sale: "Вы передаёте им свои исследования в обмен на то, что вас оставят в покое"
 POD_mummy_spell_of_life.30.kemintiri_fight: "Поддержка Кеминтири уменьшила силы, выставленные против вас"
 POD_mummy_spell_of_life.30.kemintiri_begging: "Поддержка Кеминтири говорит о вашей надёжности"
 POD_mummy_spell_of_life.30.stage3.successful_groveling.tt: "Ваш прогресс в поисках заклинания Жизни будет сброшен. Хотя вы сохраните заработанную ранее поддержку, вам придётся снова выбрать новый путь решений, чтобы продвинуться дальше."
 POD_mummy_spell_of_life_total_prowess_check: "Совокупное значение [Concept('prowess', 'доблести')|E] вашей [Concept('coterie', 'котерии')|E] будет сравнено с вражеским. Противник получает бонус за масштаб влияния, определяемый распространением его [Concept('faith', 'конфессии')|E]"
 POD_mummy_spell_of_life_total_learning_check: "Совокупное значение [Concept('learning', 'учёности')|E] вашей [Concept('coterie', 'котерии')|E] будет сравнено с вражеским. Противник получает бонус за масштаб влияния, определяемый распространением его [Concept('faith', 'конфессии')|E]"
 POD_mummy_spell_of_life_total_intrigue_check: "Совокупное значение [Concept('intrigue', 'интриг')|E] вашей [Concept('coterie', 'котерии')|E] будет сравнено с вражеским. Противник получает бонус за масштаб влияния, определяемый распространением его [Concept('faith', 'конфессии')|E]"
 POD_mummy_spell_of_life_total_stewardship_check: "Совокупное значение [Concept('stewardship', 'управления')|E] вашей [Concept('coterie', 'котерии')|E] будет сравнено с вражеским. Противник получает бонус за масштаб влияния, определяемый распространением его [Concept('faith', 'конфессии')|E]"

 POD_mummy_spell_of_life.31.t: "Нападение шемсу-геру"
 POD_mummy_spell_of_life.31.desc: "Гор всегда был хранителем заклинания Жизни, единственным из ныне живущих, кто знает полное заклинание. Он живёт по своему кодексу Ват-Гор и применяет его в мире. Шестой принцип запрещает создание мумий, что по сути ограничивает доступ к заклинанию Жизни. Он охотится за Тайными письменами Кабира, в которых содержится лишь неполная информация о заклинании Жизни. Хотя Гор может отсутствовать, вы подошли очень близко к созданию полного заклинания Жизни, которое привлекло к вам ярость последователей Гора в масштабах, далеко превосходящих всё, что когда-либо вызывали письмена Кабира.\n\nТеперь шемсу-геру прибыли к вашему пристанищу, планируя атаковать днём, когда они будут наиболее сильны под золотым светом Ра. Они формируют ряды, готовясь сокрушить вашу оборону. Их мечи блестят в полуденном солнце, жаждущие пролить вашу кровь. Их магия собирается вокруг них, искажая местность, как жаркий туман над факелом или каменной крышей летом. По незримому сигналу они атакуют. У вас нет другого выбора, кроме как противостоять их нападению."
 POD_mummy_spell_of_life.31.a: "Держитесь. Держитесь! ДЕРЖИТЕСЬ!"
 POD_mummy_spell_of_life.31.b: "Пожалуйста! Позвольте мне жить! Прошу вас!"
 POD_mummy_spell_of_life.31.stage3.successful_groveling: "Ваша жалкая мольба принята"

 POD_mummy_spell_of_life.300.t: "Письмо Гора"
 POD_mummy_spell_of_life.300.desc: "Вы получили письмо от Гора. В этом нет ничего необычного или удивительного, поскольку именно так вы общались, работая над углублением своего точного понимания заклинания Жизни. Однако на этот раз письмо не содержит ни намёка, не сбивает с толку, но, в конечном итоге, является содержательным документом, который предшествует большинству известных вам цивилизаций.\n\n«Судя по твоим успехам, ты приближаешься к моменту, когда привяжешь своё заклинание к определённому миру теней. Хотя поначалу я не решался терпеть или поддерживать твои поиски, когда придёт время, я рекомендую тебе посетить Аменти. Я считаю, что ты [Select_CString(ROOT.Char.IsFemale, 'заслужила', 'заслужил' )] право представить своё дело Судьям Маат»."
 POD_mummy_spell_of_life.300.a: "Хм, интересная мысль..."

 POD_mummy_spell_of_life.32.t: "Предложение Селестина"
 POD_mummy_spell_of_life.32.desc: "Некогда маги дома Тремер, входившего в Орден Гермеса, искали разные способы обрести бессмертие. Первые исследования привели их к вампиризму, однако некоторые так и не отказались от дальнейших поисков. Селестин, главный библиотекарь и исследователь, не чуждый полевой работе, особенно заинтересовался мумиями. Ему даже удалось раздобыть один из последних — если не последний — экземпляров Тайных писаний Кабира. Вы почти восстановили заклинание Жизни и тем самым привлекли его пристальное внимание. В надежде обрести бессмертие без вампирского проклятия сюда прибыли многочисленные «полевые исследователи» клана Тремер и их слуги-гаргульи. Селестин выступает вперёд:\n\n«Мы с вами коллеги. Чтобы зайти так далеко в изучении заклинания Жизни, нужно обладать выдающимся умом. Вы наверняка понимаете, что мы гораздо сильнее вас и способны разнести ваше убежище своими дисциплинами. Но кровопролитие ни к чему. Отдайте нам свои исследования, и мы оставим вас в покое, позволив продолжить работу»."
 POD_mummy_spell_of_life.32.a: "Ты задумал украсть мою работу?!"
 POD_mummy_spell_of_life.32.b: "Вот! Забирай и оставь меня в покое!"

 POD_mummy_spell_of_life.33.t: "Предложение клана Тремер"
 POD_mummy_spell_of_life.33.desc: "Некогда маги дома Тремер, входившего в Орден Гермеса, искали разные способы обрести бессмертие. Первые исследования привели их к вампиризму, однако некоторые так и не отказались от дальнейших поисков. Главный библиотекарь клана Тремер особенно заинтересовался мумиями и даже раздобыл один из последних — если не последний — экземпляров Тайных писаний Кабира. Сам он здесь не присутствует, но вы почти восстановили заклинание Жизни и тем самым привлекли пристальное внимание всего клана. В надежде обрести бессмертие без вампирских проклятий сюда прибыли многочисленные «полевые исследователи» из клана Тремер и их слуги-гаргульи. Один из них выступает вперёд:\n\n«Мы с вами коллеги. Чтобы зайти так далеко в изучении заклинания Жизни, нужно обладать выдающимся умом. Вы наверняка понимаете, что мы гораздо сильнее вас и способны разнести ваше убежище своими дисциплинами. Но кровопролитие ни к чему. Отдайте нам свои исследования, и мы оставим вас в покое, позволив продолжить работу»."
 POD_mummy_spell_of_life.33.a: "Ты задумал украсть мою работу?!"
 POD_mummy_spell_of_life.33.b: "Вот! Забирай и оставь меня в покое!"

 POD_mummy_spell_of_life.320.t: "Помощь Кабира"
 POD_mummy_spell_of_life.320.desc: "На протяжении тысячелетий Кабир подвергался давлению со всех сторон со стороны тех, кто искал его знаний, или тех, кто хотел убить его за то, что он обладал ими. Совсем недавно это был вампирский клан Тремер. Учитывая ваше постоянно улучшающееся понимание заклинания Жизни, они, скорее всего, обратили на вас своё внимание. К счастью, вы разрушили их базу власти и предотвратили любые сосредоточенные усилия по отнятию знаний Кабира или ваших исследований. Хотя Кабир всегда неохотно использовал свои способности, опасаясь привлечь внимание, ослабление тремеров позволило ему действовать более свободно. С разрозненными отрядами легко справится обладатель такой силы, как он. Кроме того, Кабир предложил вам возможность связать ваше заклинание Жизни с Аидом, используя его в качестве мира теней. Хотя ему потребуется стабилизация и расширение, такие усилия будут проще, чем создание собственного измерения."
 POD_mummy_spell_of_life.320.a: "Интересное предложение..."

 POD_mummy_spell_of_life.34.t: "Удар Кеминтири"
 POD_mummy_spell_of_life.34.desc: "Хотя им не хватает подавляющего фанатизма Гора и шемсу-геру, Дети Осириса и культ Исиды, тем не менее, преданы защите тайны заклинания Жизни. Несмотря на то, что Сет неоднократно внедрял в их ряды шпионов и едва не отнял у них заклинание Жизни, они остаются верными миссии по предотвращению злоупотреблений им. Сама Кеминтири сильно пострадала от рук Сета, отказываясь предоставить ему какую-либо информацию об этом.\n\nТеперь они обнаружили ваши исследования и выступили против вас. Там, где другие могут напасть на ваше убежище с армией, они послали убийц и саму Кеминтири, чтобы остановить ваши исследования. К несчастью для вас, это означает и ваше уничтожение."
 POD_mummy_spell_of_life.34.a: "Найдите её! Обыщите всё до последнего уголка..."
 POD_mummy_spell_of_life.34.b: "Сжечь исследования, и молиться, чтобы она оставила нас в покое!"
 POD_mummy_spell_of_life.34.stage3.successful_groveling: "Вы просыпаетесь в целости: видимо, вас пощадили"
 POD_mummy_spell_of_life.34.horus_fight: "Поддержка Гора уменьшила количество убийц, посланных против вас"
 POD_mummy_spell_of_life.34.horus_begging: "Поддержка Гора говорит о вашей надёжности"

 POD_mummy_spell_of_life.35.t: "Удар Детей Осириса"
 POD_mummy_spell_of_life.35.desc: "Хотя им не хватает подавляющего фанатизма Гора и шемсу-геру, Дети Осириса и культ Исиды, тем не менее, преданы защите тайны заклинания Жизни. Хотя Сет неоднократно внедрял в их ряды шпионов и едва не отнял у них заклинание Жизни, они остаются верными миссии по предотвращению злоупотреблений им.\n\nТеперь они обнаружили ваши исследования и выступили против вас. В то время как другие могут атаковать ваше убежище с армией, они послали убийц, чтобы остановить ваши исследования. К несчастью для вас, это означает и ваше уничтожение."
 POD_mummy_spell_of_life.35.a: "Найдите их! Обыщите всё до последнего уголка..."
 POD_mummy_spell_of_life.35.b: "Сжечь исследования, и молиться, чтобы нас оставили в покое!"

 POD_mummy_spell_of_life.340.t: "Поддержка Кеминтири"
 POD_mummy_spell_of_life.340.desc: "Когда вы выходите из тронного зала, по спине внезапно пробегает покалывание, а тени в коридоре начинают двигаться. Они текут внутрь, отходя от боков и покрывая пол. Они начинают сливаться в лужу, а затем поднимаются вверх, принимая гуманоидную форму. Сначала это выглядит как манекен с грубыми чертами, затем статуя с более точными разрезами, а затем, наконец, превращается в плоть кого-то, кого вы узнаете: Кеминтири.\n\n«Я благодарю тебя за то, что [Select_CString(ROOT.Char.IsFemale, 'помогла', 'помог' )] мне восстановить мою память. Чтобы отплатить за услугу, знай, что я обратилась от твоего имени к последователям Осириса и Исиды. Они не помешают твоим поискам заклинания Жизни. Кроме того, ты получишь возможность поговорить с Судьями Маат и сделать Аменти своим домом»."
 POD_mummy_spell_of_life.340.a: "Благодарю за поддержку."

 POD_mummy_spell_of_life.36.t: "Осада Куфура-ам-Херу"
 POD_mummy_spell_of_life.36.desc: "Сет, древний допотопный, провёл многие тысячелетия в поисках заклинания Жизни, которое наделило его племянника силой. Произошли неописуемые ужасы. В его экспериментах погибло бесчисленное количество людей. Чтобы украсть его, были разработаны бесчисленные интриги. Ближе всего он подошёл к этому, обманом заставив Никлоса, верховного жреца культа Исиды, принять одного из слуг Сета в качестве своего протеже. Тем не менее, даже это представляло собой лишь частичную версию заклинания Жизни, ведущую к чудовищам, известным как Проклятые мумии. Хотя Сет, возможно, и отступил, его потомки не отказались от его поисков. Теперь Куфур ам-Херу, избранник Сета, стоит перед вашим убежищем с великим войском.\n\n«Отдай нам заклинание Жизни, и мы, возможно, позволим тебе продолжить исследования. Воспротивься, и мы извлечём нужные нам знания из разбитых фрагментов твоего разума. Мы получим то, что хотим; всё, что меняется, это то, сколько времени это займёт».\n\n#clickable Сила вашей [Concept('coterie', 'котерии')|E] – [GetPlayer.MakeScope.GetVariable('total_character_coterie_stewardship').GetValue|V0].\nСила вражеской [Concept('coterie', 'котерии')|E] – [GetPlayer.MakeScope.GetVariable('total_opponent_coterie_stewardship').GetValue|V0].#!"
 POD_mummy_spell_of_life.36.a: "Подготовиться к обороне..."
 POD_mummy_spell_of_life.36.b: "Забирайте..."

 POD_mummy_spell_of_life.37.t: "Сетитская осада"
 POD_mummy_spell_of_life.37.desc: "Сет, древний допотопный, провёл многие тысячелетия в поисках заклинания Жизни, которое наделило его племянника силой. Произошли неописуемые ужасы. В его экспериментах погибло бесчисленное количество людей. Чтобы украсть его, были разработаны бесчисленные интриги. Ближе всего он подошёл к этому, обманом заставив Никлоса, верховного жреца культа Исиды, принять одного из слуг Сета в качестве своего протеже. Тем не менее, даже это представляло собой лишь частичную версию заклинания Жизни, ведущую к чудовищам, известным как Проклятые мумии. Хотя Сет, возможно, и отступил, его потомки не отказались от его поисков. Теперь сетиты стоят перед вашим убежищем, собрав великое войско.\n\n«Отдай нам заклинание Жизни, и мы, возможно, позволим тебе продолжить исследования. Воспротивься, и мы извлечём нужные нам знания из разбитых фрагментов твоего разума. Мы получим то, что хотим; всё, что меняется, это то, сколько времени это займёт».\n\n#clickable Сила вашей [Concept('coterie', 'котерии')|E] – [GetPlayer.MakeScope.GetVariable('total_character_coterie_stewardship').GetValue|V0].\nСила вражеской [Concept('coterie', 'котерии')|E] – [GetPlayer.MakeScope.GetVariable('total_opponent_coterie_stewardship').GetValue|V0].#!"
 POD_mummy_spell_of_life.37.a: "Подготовиться к обороне..."
 POD_mummy_spell_of_life.37.b: "Забирайте..."

 POD_mummy_spell_of_life.360.t: "Поддержка союзников"
 POD_mummy_spell_of_life.360.desc: "Ваш канцлер и тайный советник сообщают о том, что сетиты и Проклятые мумии мобилизуются против вас. Поскольку вы ближе всего к раскрытию тайны заклинания Жизни со времён самого Сета, они видят потенциал для завершения его поисков. Однако вы обратились к своим союзникам и сторонникам. Используя свои предыдущие соглашения, вы можете прямо или косвенно оказывать на сетитов как дипломатическое, так и военное давление. Даже странники, у которых нет владений, которые можно было бы защитить, не имеют возможности нанести вам удар."
 POD_mummy_spell_of_life.360.a: "Хорошо. Эти воры не выиграют от моей работы!"



 POD_mummy_spell_of_life.40.t: "Аудиенция у Судей Маат"
 POD_mummy_spell_of_life.40.desc: "$POD_debate_debate_strength_header$С помощью двух ваших друзей-призраков вы открыли дверь в [UmbraGlossaryLocalized('dark_kingdom_of_sand','Аменти')]. К сожалению, постоянно меняющееся, непостижимое море песка и воды окружает вас со всех сторон, и кажется, что вода меняется с песком местами, когда вы фокусируете на ней своё внимание. Тени скрывают большую часть его во тьме, скрывая от вашего взгляда неизвестные опасности и сокровища. Что-то, что вы можете воспринимать только как ураган воспоминаний и чистой энергии, кружится вокруг вас, сотрясая вас. Плазма и безымянные материалы обрушиваются на вашу голову. Ваши шаги не продвигаются вперёд, поскольку дюны движутся вместе с вами, океан отступает и наступает, ветры борются с вами и странные звери нападают на вас. Впереди вас ждёт только один ясный путь — река, которую вы считаете [UmbraGlossaryLocalized('river_of_death','Рекой смерти')]. Вы не сможете продолжить без помощи Анубиса. Пока он не прибудет, чтобы исследовать ваш необычный вход, вы должны отбиваться от любых монстров, которые могут таиться среди песчаных морей.$POD_debate_debate_explanation_footer$"
 POD_mummy_spell_of_life.40.a: "Мы дождёмся Анубиса."
 POD_mummy_spell_of_life.40.b: "Вернёмся, прежде чем дверь закроется."
 POD_mummy_spell_of_life.40.effect.success.desc: "Вы держите оборону до его прибытия"
 POD_mummy_spell_of_life.40.critical.failure.effect.desc: "Спектры подавляют вас, заставив отступить"

 POD_mummy_spell_of_life.41.t: "Аудиенция: прибытие Анубиса"
 POD_mummy_spell_of_life.41.desc: "$POD_debate_debate_strength_header$Через часы?... дни?... над [UmbraGlossaryLocalized('river_of_death','Рекой смерти')] появляются огромные ворота из тёмного, стеклянного камня. Когда вы протягиваете руку, чтобы коснуться рукояти, странное существо поднимается из зыбучих песков слева от вас. Даже больше, чем у большинства #TOOLTIP:GAME_TRAIT,wraith,[GetNullCharacter] #L призраков#!#!, его тело кажется жидким и твёрдым, текучим, но сохраняющим форму. Эта форма представляет собой частично трансформировавшегося #TOOLTIP:GAME_TRAIT,werewolf,[GetNullCharacter] #L гару#!#! с головой шакала. Цвет его кожи — смола, тёмная, как сама смерть. Он несёт светящийся фонарь, подвешенный на длинном шесте. Голосом, похожим на оползень в полом колодце, он говорит:\n\n«Почему бы мне не казнить тебя немедленно за то, что ты [Select_CString(ROOT.Char.IsFemale, 'осмелилась', 'осмелился' )] вторгнуться в пределы [UmbraGlossary('neter_khertet')], куда не осмеливаются ступать даже призраки [UmbraGlossaryLocalized('dark_kingdom_of_iron','Тёмного королевства Железа')]? Почему я вообще должен рассматривать возможность отвести тебя к Судьям Маат?»"
 POD_mummy_spell_of_life.41.a: "Я не [Select_CString(ROOT.Char.IsFemale, 'связана', 'связан' )] договорами с Хароном."
 POD_mummy_spell_of_life.41.b: "Взвесь моё сердце и прими решение."
 POD_mummy_spell_of_life.41.c: "Я хочу защитить Нетер-хертет. Пусть судьи сочтут меня [Select_CString(ROOT.Char.IsFemale, 'недостойной', 'недостойным' )]."

 POD_mummy_spell_of_life.42.t: "Аудиенция: сохранишь ли ты верность?"
 POD_mummy_spell_of_life.42.desc: "$POD_debate_debate_strength_header$Ворота распахиваются, и Анубис проводит вас. Идя по земле, вы оглядываетесь вокруг. [UmbraGlossaryLocalized('dark_kingdom_of_sand','Аменти')] несёт в себе отголоски живых земель, созданных страстями и желаниями, возложенными на великие города, гробницы и храмы измерения. Однако это гораздо больше, чем просто руины или отголоски. Субстанция измерения легко обрабатывается его жителями. Тысячелетия времени дали Судьям Маат и шемсу-геру, которые вернулись более чем достаточно времени, чтобы создать ошеломляющую демонстрацию величия. Вдали возвышаются невероятные вершины из золота и белого известняка, простирающиеся над окружающими вас дюнами. Без каких-либо заметных изменений, 42 человека теперь окружают вас и Анубиса, одетые в богато украшенные шендиты и держащие в руках фараонские посохи. Они говорят по очереди, каждый произносит следующее предложение.\n\n«Заклинание Жизни не просто воскрешает. Оно удерживает душу в бесчисленных циклах. Тебя не выковали, не обучили и не превратили в сосуд, способный поддерживать эту архитектуру. Даровать тебе возрождение означало бы вызвать твоё собственное разложение. Если не завтра, то через сто, тысячу, десять тысяч лет. Хотя мы могли бы бросить тебя в Амемайт, зачем нам идти на такой риск? До этого момента ты можешь причинить много вреда. Хуже того, ты ищешь перерождения не только для равновесия, но и для продолжения себя, воли, идентичности. Аменти – это инструменты Маат, а не выжившие. Твоё желание жить делает тебя [Select_CString(ROOT.Char.IsFemale, 'уязвимой', 'уязвимым' )] для нашёптываний наших врагов. Одна жизнь — даже праведная — не перевесит долгую память на весах и не докажет твою способность сохранять стойкость»."
 POD_mummy_spell_of_life.42.a: "Я не [Select_CString(ROOT.Char.IsFemale, 'новообращённая', 'новообращённый' )]. Мне по силам сопротивляться порче веков."
 POD_mummy_spell_of_life.42.b: "Мне не устоять против вашего приговора."
 POD_mummy_spell_of_life_42_b_note: "Ваши шансы на успех увеличиваются, если судьи сильнее вас"
 POD_mummy_spell_of_life.42.c: "Я останусь [Select_CString(ROOT.Char.IsFemale, 'верной', 'верным' )], как это делали другие до меня."

 POD_mummy_spell_of_life.43.t: "Аудиенция: вы достойны?"
 POD_mummy_spell_of_life.43.desc: "$POD_debate_debate_strength_header$«Когда процесс правильно управлялся и контролировался, шемсу-геру были выбраны, потому что они доказали свою ценность. Их навыки заслуживали сохранения. Их служение Маат было истинным и охватило многие воплощения. Амен Хал, Хетч-Абеху и Нейт были опытными солдатами и тактиками, проявившими себя на поле боя. Саху-Ра был несравненным писцом и мастером. Тьехену показал себя магом с огромным потенциалом. Мерит-неферу была необычайно искусной и верной торговкой. Хотя она была царицей, имеющей политическое значение, Неферухаёт была выбрана за свою учёность, эрудицию и жажду знаний».\n\n«Что в тебе заслуживает сохранения? Что ты [Select_CString(ROOT.Char.IsFemale, 'сделала', 'сделал' )], чтобы заслужить место среди шемсу-геру?»"
 POD_mummy_spell_of_life.43.a: "Я [Select_CString(ROOT.Char.IsFemale, 'обнаружила', 'обнаружил' )] большую часть заклинания Жизни."
 POD_mummy_spell_of_life.43.b: "Я тоже тактик с хорошей репутацией."
 POD_mummy_spell_of_life.43.c: "Мало кто из мастеров может сравниться с моими творениями."

 POD_mummy_spell_of_life.44.t: "Аудиенция: не отвлечёшься ли ты?"
 POD_mummy_spell_of_life.44.desc: "$POD_debate_debate_strength_header$«Твои убеждения и воспоминания не связаны с крестовым походом. Помимо Бессмертных, ты хранишь верность неизвестным нам силам. Ты можешь вовлечь их в свои планы. Ты можешь вовлечь нас во внешние конфликты, отвлекая от важнейшего крестового похода против потомков Сета.\n\nНе менее важно и то, что равновесие между Аменти тщательно поддерживается. Некоторые, так называемые ишмаэлиты, сошли с правильного пути. Однако они ещё многие столетия были верны войне, прежде чем стали предателями. Твоё присутствие в этом месте восстановления разрушило бы наше тщательно сохраняемое единство целей. Среди Бессмертных возродятся древние распри и расколы, усугубленные твоей внешней лояльностью. Они перенаправят свои клинки от глоток сетитов к глоткам друг друга. Подобная фракционность и отвлечение внимания означают катастрофу»."
 POD_mummy_spell_of_life.44.a: "Я разрешаю конфликты, а не вызываю их."
 POD_mummy_spell_of_life.44.b: "Моя лояльность ещё больше стабилизирует это равновесие."

 POD_mummy_spell_of_life.45.t: "Аудиенция: просители и интриганы"
 POD_mummy_spell_of_life.45.desc: "$POD_debate_debate_strength_header$«Допустим, мы примем твои аргументы и разрешим использовать это измерение. Затем ты привяжешь своё заклинание Жизни к [UmbraGlossaryLocalized('dark_kingdom_of_sand','Аменти')]. Однако такое действие позволит любому, на кого ты направишь своё заклинание Жизни, войти в наше царство в непомерном количестве, количестве, которое нарушит равновесие. Ты бы всегда [Select_CString(ROOT.Char.IsFemale, 'отбирала', 'отбирал' )] в наши ряды только достойных? Искатели, просители, интриганы – все обратятся к тебе. Неисчислимое количество амбициозных людей будет охотиться за тобой. Ты бы [Select_CString(ROOT.Char.IsFemale, 'исполнила', 'исполнил' )] все их желания, будь то бессмертие или само заклинание? Проявишь ли должную проницательность при выборе тех, кому будет даровано вечное возрождение? Останешься ли ты [Select_CString(ROOT.Char.IsFemale, 'стойкой защитницей', 'стойким защитником' )] секрета заклинания или его украдут, если ты доверишься тому, кто этого не заслуживает? Каждый новый бессмертный разрушает Маат и должен работать над его восстановлением. Разрушишь ли ты Маат, предложив вечное возрождение слишком многим?»"
 POD_mummy_spell_of_life.45.a: "Я умею определять достойных."
 POD_mummy_spell_of_life.45.b: "Я могу защитить заклинание. Что ещё имеет значение?"

 POD_mummy_spell_of_life.46.t: "Аудиенция: успех"
 POD_mummy_spell_of_life.46.desc: "Судьи поворачиваются друг к другу и, кажется, спорят между собой. Несмотря на то, что они не уходят и вы можете видеть, как шевелятся их губы, вы не можете их услышать или определить, что они говорят, по движениям их губ. В какой-то момент к их разговору присоединяется Анубис. Кажется, что земля почти трясётся, хотя его слова тоже неясны. В конце концов они поворачиваются к вам.\n\n«Очень хорошо. Мы предоставим тебе разрешение использовать [UmbraGlossaryLocalized('dark_kingdom_of_sand','Аменти')] для восстановления до тех пор, пока ты не будешь [Select_CString(ROOT.Char.IsFemale, 'готова', 'готов' )] снова вселиться в своё тело. Анубис предоставит тебе сведения, необходимые для изменения твоего заклинания Жизни по мере необходимости»."
 POD_mummy_spell_of_life.46.a: "Спасибо, я использую его с умом."

 POD_mummy_spell_of_life.47.t: "Аудиенция: провал"
 POD_mummy_spell_of_life.47.desc: "Судьи поворачиваются друг к другу и, кажется, спорят между собой. Несмотря на то, что они не уходят и вы можете видеть, как шевелятся их губы, вы не можете их услышать или определить, что они говорят, по движениям их губ. В какой-то момент к их разговору присоединяется Анубис. Кажется, что земля почти трясётся, хотя его слова тоже неясны. В конце концов они поворачиваются к вам.\n\n«Мы выслушали твои слова и сочли, что им недостаёт мудрости. Если мы позволим тебе восстановиться в [UmbraGlossaryLocalized('dark_kingdom_of_sand','Аменти')], это в конечном итоге приведёт к нашей гибели и гибели самой Маат. В качестве любезности мы позволим тебе уйти с миром, в сопровождении Анубиса. Однако, если ты вернёшься, Анубис позаботится о том, чтобы ты больше не [Select_CString(ROOT.Char.IsFemale, 'донимала', 'донимал' )] нас своими пустыми речами».\nХищная улыбка расползается по шакальей морде Анубиса, обнажая острые зубы."
 POD_mummy_spell_of_life.47.a: "Хорошо, я принимаю ваш приговор."
 POD_mummy_spell_of_life.47.b: "Вы, дряхлые глупцы, вспомните этот день, когда я низвергну ваши троны."

 POD_mummy_spell_of_life_stage4_umbra_battles_strengths: "#clickable Ваша текущая военная мощь - [GetPlayer.MakeScope.GetVariable('character_shadow_realm_force').GetValue|V0]\nВоенная мощь [Concept('umbra', 'Умбры')|E] и #TOOLTIP:GAME_TRAIT,spectre,[GetNullCharacter] #L спектров#!#! оценивается в [GetPlayer.MakeScope.GetVariable('spectre_shadow_realm_force').GetValue|V0]#!\n\n"
 POD_CHANGE_CHARACTER_SHADOW_REALM_FORCE_ADD: "Вы #P получите#! $VALUE|0V$ ед. военной мощи"
 POD_CHANGE_CHARACTER_SHADOW_REALM_FORCE_SUBTRACT: "Вы #N теряете#! $VALUE|0V$ ед. военной мощи"
 POD_CHANGE_SPECTRE_SHADOW_REALM_FORCE_ADD: "[Concept('umbra', 'Умбра')|E] и #TOOLTIP:GAME_TRAIT,spectre,[GetNullCharacter] #L спектры#!#! #N получат#! $VALUE|0V$ ед. военной мощи"
 POD_CHANGE_SPECTRE_SHADOW_REALM_FORCE_SUBTRACT: "[Concept('umbra', 'Умбра')|E] и #TOOLTIP:GAME_TRAIT,spectre,[GetNullCharacter] #L спектры#!#! #P потеряют#! $VALUE|0V$ ед. военной мощи"

 POD_mummy_spell_of_life.50.t: "Победа над мертвецами"
 POD_mummy_spell_of_life.50.desc: "Когда [GetScriptedCharacterByHistoryID('792600').GetFirstName] впервые создал свою версию заклинания Жизни, он столкнулся с проблемой невозможности войти в [UmbraGlossaryLocalized('dark_kingdom_of_sand','Аменти')], древнеегипетское царство мёртвых, где мумии проводят время, восстанавливая себя между каждой смертью. Поэтому он захватил очень небольшую часть [UmbraGlossaryLocalized('shadowlands','Загробного мира')], которую он назвал «Аид», как свой собственный [UmbraGlossaryLocalized('shadow_realm','мир теней')], и каким-то образом сумел убедить Харона, владыку [UmbraGlossaryLocalized('shadowlands','Загробного мира')], принять этот анклав. Некоторые легенды приписывают этот успех их общему микенскому происхождению, а в одном тексте говорится, что Кабир имеет связь с паромщиками, многие из которых тоже являются микенцами. Независимо от правды, [UmbraGlossary('hades')] по-прежнему является жалкой копией [UmbraGlossaryLocalized('dark_kingdom_of_sand','Аменти')] и едва ли способен помочь мумиям достичь истинного бессмертия.\n\nЕсли мы тоже хотим использовать [UmbraGlossary('hades')], нам нужно будет расширить его территорию и стабилизировать её. Учитывая трудности, с которыми столкнулся [GetScriptedCharacterByHistoryID('792600').GetFirstName], это будет непростая задача. Нужно будет удовлетворить требования правителей [UmbraGlossaryLocalized('shadowlands','Загробного мира')], чтобы они не действовали против нас. #TOOLTIP:GAME_TRAIT,spectre,[GetNullCharacter] #L Спектров#!#! придётся отбросить. Новому царству потребуются защитники. Так много дел нужно сделать...\n\n #R В этой битве используется показатель «военная мощь». Начальное значение определяется доблестью вашего персонажа, ваших воителей и вашей [Concept('coterie', 'котерии')|E]. Она будет увеличиваться или уменьшаться во время самого конфликта.\nВаша начальная военная мощь — [GetPlayer.MakeScope.GetVariable('character_shadow_realm_force').GetValue|0]#!"
 POD_mummy_spell_of_life.50.a: "Пришло время начать."
 POD_mummy_spell_of_life.50.b: "Это слишком рискованно."
 POD_mummy_spell_of_life_hades_start_battle_tt: "Военная мощь [Concept('umbra', 'Умбры')|E] и #TOOLTIP:GAME_TRAIT,spectre,[GetNullCharacter] #L спектров#!#! #italic оценивается#! в #V 1800#!"

 POD_mummy_spell_of_life.51.t: "Сладкие речи"
 POD_mummy_spell_of_life.51.desc: "$POD_mummy_spell_of_life_stage4_umbra_battles_strengths$Каким-то образом Кабир убедил Харона разрешить создание анклава. Никто не знает, как он этого добился. К счастью, вам не нужно его убеждать, поскольку анклав уже создан. Вам нужно поговорить с местным правителем, чтобы разрешить расширение [UmbraGlossaryLocalized('hades','Аида')]. Маршалы наблюдают и координируют патрули в регионе, чтобы именно они столкнулись с [UmbraGlossaryLocalized('hades','Аидом')]. Инспекторы и министры руководят административной частью местной бюрократии. Однако ни у одного из них нет полномочий санкционировать расширение. Встреча с местным советом анакреонов — ваш лучший шанс убедить тех, у кого достаточно власти, чтобы гарантировать успех.\n\nС помощью Кабира и ваших союзных призраков вы можете добраться до ближайшего некрополя и начать заполнять формы для запроса аудиенции. Формы и процедуры занимают несколько дней. Затем служащий вручает вам номер, который объявят, когда придёт время вашей аудиенции. Номер 10 712 461.\n\nПосле нескольких недель ожидания вы предстаёте перед советом и начинаете излагать своё дело."
 POD_mummy_spell_of_life.51.a: "Для начала объясню почему..."
 POD_mummy_spell_of_life.51.b: "Я верю, что мы сможем прийти к соглашению."
 POD_mummy_spell_of_life.51.effect.success.critical.desc: "Они нам помогут!"
 POD_mummy_spell_of_life.51.effect.success.desc: "Успешное убеждение!"
 POD_mummy_spell_of_life.51.critical.failure.effect.desc: "Упрямые глупцы..."

 POD_mummy_spell_of_life.52.t: "Заручиться помощью местных"
 POD_mummy_spell_of_life.52.desc: "$POD_mummy_spell_of_life_stage4_umbra_battles_strengths$После смерти призрак попадает в загробный мир в коконе из плазмы, называемом оболочкой. Пока оболочка не снята, она удерживает его в покорном, спокойном, похожем на сон состоянии, в котором он почти не осознаёт окружающего. В это время призрак крайне уязвим для нападений, преобразований, порабощения, ваяния или перековки души. Снять оболочку может лишь другой призрак, но у нас нет ни стигийских жнецов, ни помощи Анубиса. Кабир нашёл одного согласившегося призрака, который с тех пор снимает оболочки. Однако одного его недостаточно для наплыва мумий, который можете создать вы. Нужна большая группа постоянных жителей [UmbraGlossaryLocalized('hades','Аида')], которые будут снимать оболочки.\n\nК сожалению, у призраков странная экономика. Они торгуют изделиями из перекованных душ, кристаллами пламени души, жидким пафосом, порошком тоски, реликвиями, стигийской бумагой, плазмой [UmbraGlossaryLocalized('sunless_sea','Сумрачного моря')], рудой смерти и подобными вещами. Мы не можем эффективно и регулярно добывать всё это для оплаты их труда. Придётся найти иной способ получить и удержать их на службе."
 POD_mummy_spell_of_life.52.a: "Хватит и моих связанных призраков."
 POD_mummy_spell_of_life.52.b: "Мои исследования должны найти решение."
 POD_mummy_spell_of_life.52.c: "Мы придём к соглашению."
 POD_mummy_spell_of_life.52.effect.success.desc: "Успешное убеждение!"
 POD_mummy_spell_of_life.52.critical.failure.effect.desc: "Еле-еле, но хватит..."

 POD_mummy_spell_of_life.53.t: "Отсечь себя от мира"
 POD_mummy_spell_of_life.53.desc: "$POD_mummy_spell_of_life_stage4_umbra_battles_strengths$Древние записи свидетельствуют, что [UmbraGlossaryLocalized('dark_kingdom_of_sand','Аменти')] и [UmbraGlossaryLocalized('shadowlands','Загробный мир')] были втянуты в войну, длившуюся бесчисленные десятилетия или даже столетия. Она закончилась лишь тогда, когда Анубис добился заключения договора. До этого [UmbraGlossary('neter_khertet')] быстро пал, но жители [UmbraGlossaryLocalized('dark_kingdom_of_sand','Аменти')], уступавшие противнику размерами и численностью, всё же сумели удержать позиции. Воспроизведя некоторые из их укреплений, вы сможете выдержать любые нападения спектров. Даже если анакреоны изменят своё решение, вы продержитесь до разрешения этой проблемы.\n\nОдним из их величайших достижений стало отделение [UmbraGlossaryLocalized('dark_kingdom_of_sand','Аменти')] от остального [UmbraGlossaryLocalized('shadowlands','Загробного мира')]. Теперь это было самостоятельное измерение, а не просто место внутри более обширного мира. Попасть туда можно было лишь по тщательно поддерживаемым и охраняемым путям. Подобная система позволила бы вам ограничить доступ в [UmbraGlossaryLocalized('hades','Аид')] и уменьшить угрозу извне. Однако это не будет ни просто, ни дёшево и, возможно, окажется вовсе неосуществимым. Ведь прежде такое удавалось лишь Осирису — невероятно могущественному вампиру, каким-то образом превзошедшему свою вампирскую природу, — и Анубису, призраку, понимавшему природу [Concept('umbra', 'Умбры')|E] глубже, чем паромщики."
 POD_mummy_spell_of_life.53.a: "Я сделаю это самостоятельно."
 POD_mummy_spell_of_life.53.b: "Наверняка есть доступный вариант."
 POD_mummy_spell_of_life.53.c: "Цена не проблема."
 POD_mummy_spell_of_life.53.d: "Безумная затея."
 POD_mummy_spell_of_life.53.effect.success.desc: "Сработало!"
 POD_mummy_spell_of_life.53.critical.failure.effect.desc: "Мы в безопасности, но не отрезаны..."

 POD_mummy_spell_of_life.54.t: "Неутомимая орда"
 POD_mummy_spell_of_life.54.desc: "$POD_mummy_spell_of_life_stage4_umbra_battles_strengths$Древние записи свидетельствуют, что [UmbraGlossaryLocalized('dark_kingdom_of_sand','Аменти')] и [UmbraGlossaryLocalized('shadowlands','Загробный мир')] были втянуты в войну, длившуюся бесчисленные десятилетия или даже столетия. Она закончилась лишь тогда, когда Анубис добился заключения договора. До этого [UmbraGlossary('neter_khertet')] быстро пал, но жители [UmbraGlossaryLocalized('dark_kingdom_of_sand','Аменти')], уступавшие противнику размерами и численностью, всё же сумели удержать позиции. Воспроизведя некоторые из их укреплений, вы сможете выдержать любые нападения спектров. Даже если анакреоны изменят своё решение, вы продержитесь до разрешения этой проблемы.\n\nВойско [UmbraGlossaryLocalized('dark_kingdom_of_sand','Аменти')] состояло из огромных легионов ушабти. Эти оживлённые статуи были неутомимыми работниками в мирное время и неустанными бойцами на войне. Тщательно подобранные слова силы, начертанные на их телах, наделяли могуществом обычные творения из дерева, металла и камня. Вы могли бы создать собственные конструкции или привязать призраков, чтобы получить подобную защиту. Если повезёт, их хватит не только для несения караула."
 POD_mummy_spell_of_life.54.a: "Вызвать мастеров."
 POD_mummy_spell_of_life.54.b: "Достать лучшие материалы для ремесла."
 POD_mummy_spell_of_life.54.c: "Подготовить медиумов."
 POD_mummy_spell_of_life.54.effect.success.desc: "Взгляните на мою армию!"
 POD_mummy_spell_of_life.54.critical.failure.effect.desc: "Еле-еле..."
 POD_mummy_spell_of_life_bound_wraith_strength_bonus: "Каждый связанный призрак приносит мощь"

 POD_mummy_spell_of_life.55.t: "Сохранение воспоминаний"
 POD_mummy_spell_of_life.55.desc: "$POD_mummy_spell_of_life_stage4_umbra_battles_strengths$[UmbraGlossaryLocalized('shadowlands','Загробный мир')] — это царство воспоминаний. Реликвии и места исчезают, когда о них забывают. Как греческое царство мёртвых, [UmbraGlossaryLocalized('hades','Аид')] неразрывно связан с греческой религией. С подъёмом христианства и упадком эллинистической культуры [UmbraGlossaryLocalized('hades','Аид')] пришёл в упадок вместе с ней. Это во многом способствовало общему упадку и нестабильности [UmbraGlossaryLocalized('shadow_realm','мира теней')].\n\nК нашему счастью, христианство использует греческое слово «Аид» для обозначения места временного содержания душ, как хороших, так и плохих, в ожидании суда. Одну из трёх частей христианского Аида иногда называют Тартаром. Если бы вы могли укрепить эту связь, вы могли бы утвердить [UmbraGlossaryLocalized('hades','Аид')] в сознании смертных и тем самым стабилизировать его до тех пор, пока христианство остаётся в народном сознании. К сожалению, такое действие ослабило бы нашу связь с нашим греческим наследием."
 POD_mummy_spell_of_life.55.a: "Поговорить со жрецами."
 POD_mummy_spell_of_life.55.b: "Мы возродим эллинистическую культуру."

 POD_mummy_spell_of_life.56.t: "Налётчики"
 POD_mummy_spell_of_life.56.desc: "$POD_mummy_spell_of_life_stage4_umbra_battles_strengths$Время пришло. Нынешние границы [UmbraGlossaryLocalized('hades','Аида')] были защищены и стабилизированы, насколько это было возможно. Ваши силы готовы выступить вперёд и отбросить орды спектров. Ваши призраки готовы захватить территорию и вернуть наши души, когда придёт время. Ваши солдаты собираются, чтобы удерживать захваченную территорию.\n\n[UmbraGlossaryLocalized('hades','Аид')] всегда существовал в изолированной области [UmbraGlossaryLocalized('shadowlands','Загробного мира')], позволяя спектрам свирепствовать за её пределами. Прежде чем начнётся нападение, существует возможность отправить отряды налётчиков, чтобы преследовать их. Если это сработает, набеги снизят их численность и облегчат предстоящий конфликт. Однако такие набеги влекут за собой большие риски."
 POD_mummy_spell_of_life.56.a: "Подойти к ним слева..."
 POD_mummy_spell_of_life.56.b: "Некоторые из вас могут погибнуть..."
 POD_mummy_spell_of_life.56.c: "Это не стоит риска."
 POD_mummy_spell_of_life.56.effect.success.desc: "Их ряды поредели, [Select_CString(ROOT.Char.IsFemale, 'моя госпожа', 'мой господин' )]"
 POD_mummy_spell_of_life.56.critical.failure.effect.desc: "Вы потеряли весь отряд, [Select_CString(ROOT.Char.IsFemale, 'моя госпожа', 'мой господин' )]"

 POD_mummy_spell_of_life.57.t: "Начало битвы"
 POD_mummy_spell_of_life.57.desc: "$POD_mummy_spell_of_life_stage4_umbra_battles_strengths$Это последняя битва. Если к концу ваша военная мощь окажется ниже, чем у противостоящих вам сил, ваш путь закончится здесь.#!\n\nВы выводите свои войска из защищенного анклава [UmbraGlossaryLocalized('hades','Аида')]. Вас ждёт бесконечная орда спектров, которые, кажется, постоянно атакуют возведённую вами защиту. Их бледные, вытянутые формы сразу же ощущают ваше появление и начинают устремляться к вашей армии. Концентрированное присутствие порчи Забвения представляет собой ощутимый смрад, загрязняющий воздух. Подавляющее большинство представляют собой скелетные фигуры с когтями, способными разрывать плоть, или с ледяным чёрным огнем, горящим в их глазах. Несколько зверей размером с ребёнка бегают между ног, безумно хохоча. В первых рядах маршируют дикие, звероподобные монстры с множеством рядов акульих зубов и разорванными массами тканей, свисающими с деформированных скелетов. Их похоть, ненависть и страсть легко видны, и кажется, будто они исходят из их неповоротливых форм. Все они жаждут вкусить крови живых, украсть хоть каплю этой жизненной силы и причинить боль и разрушения. Несмотря на эту жажду, они действуют согласованно, как единая масса, а не рвутся вперед. Несколько существ с неоднородными, просачивающимися поражениями и опухолями гонят их вперёд организованными формированиями в соответствии с каким-то скрытым планом.\n\nПока ими командуют и фокусируют внимание, эти обычные спектры не обладают независимым разумом и не способны к стратегическому реагированию на быстрые действия. Если у вас есть время и пространство для манёвра, своевременный натиск может разрушить орду и позволить вашим силам сокрушить часть из них. В качестве альтернативы можно было бы призвать ваши резервы, которые до сих пор в основном оставались в мире смертных. Хотя они будут служить не более чем пушечным мясом, это всё равно может иметь значение."
 POD_mummy_spell_of_life.57.a: "Мы не можем остановиться сейчас! ВПЕРЁД!"
 POD_mummy_spell_of_life.57.b: "Призвать наши резервы! Всех до единого!"

 POD_mummy_spell_of_life.58.t: "Святой поглощённых тенью"
 POD_mummy_spell_of_life.58.desc: "$POD_mummy_spell_of_life_stage4_umbra_battles_strengths$Орда начинает слабеть. В их рядах открываются бреши, позволяя вам ещё глубже проникнуть в их порядки. Только одно препятствие стоит на пути расширения [UmbraGlossaryLocalized('hades','Аида')], предводитель спектров.\n\nПрорубившись через бесчисленных спектров, вы видите человека в маске, созданной по образцу греческой маски трагедии. Существо одето в рваные чёрные одежды, испещрённые белыми пятнами проказы, и держит в руках сломанную косу. Потускневшие и зазубренные шипы торчат из мантии, и вязкая чёрная жидкость медленно капает и разбрызгивается на землю, где кажется, что она шипит. Его защищают многочисленные зияющие пасти и злые когти, скреплённые переплетением сухожилий и туго натянутой кожи. Полупрозрачные щупальца появляются из некоторых опухолевых масс плоти, кружась и убивая любого спектра, который подойдёт слишком близко, отражая их едва сдерживаемую жестокость. Вы и ваши союзники приближаетесь к грандиозному противостоянию.\n\nКаждый удар владельца косы точен, и его удары обрушиваются на ваши силы так же неизбежно, как энтропия. Кажется, что каждый поражённый солдат распадается на однородную каплю углерода, некоторых металлов и медленно расширяющееся облако газов, хотя даже они быстро разлагаются на невидимые компоненты, прежде чем они тоже уничтожаются полностью. Это резко контрастирует с чудовищами, чьи сокрушительные удары обрушиваются вокруг вас. Каждый удар прикрывает перемещение их хозяина, позволяя использовать более сложные стратегии. Хотя звери демонстрируют множество эмоций, ни одна из этих эмоций не дает вам понимания, которое можно было бы прочитать, или слабостей, которыми можно было бы воспользоваться. Вам удаётся сбросить маску, но это мало помогает. Почерневшее, безглазое и безротое лицо этой живой тени мало что раскрывает, кроме неизбежных объятий всего сущего в объятиях Бездны.\n\nДаже когда ваши силы окружают вас и начинают догонять орду спектров, нет никаких сомнений в том, что это будет битва за ваше существование, борьба, которая подтолкнёт вас к вашим пределам. Если это существо победит, битва обернётся против вашей армии, и надежды на успех будет мало."
 POD_mummy_spell_of_life.58.a: "Пути назад нет..."
 POD_mummy_spell_of_life.58.b: "В атаку!"
 POD_mummy_spell_of_life.58.c: "Даже если это будет стоить мне разума!"
 POD_mummy_spell_of_life.58.d: "Любой ценой!"
 POD_mummy_spell_of_life.58.effect.success.desc: "Они все пали..."
 POD_mummy_spell_of_life.58.effect.failure.desc: "Сладкое небытие Пустоты..."
 POD_mummy_spell_of_life.58.final_check: "Сравнит вашу военную мощь с силой спектров, чтобы определить окончательные результаты"
 POD_mummy_spell_of_life.58.critical.failure.effect.desc: "Одинокие и ровные пески простираются вдаль..."

 POD_mummy_spell_of_life.59.t: "Долгожданная победа"
 POD_mummy_spell_of_life.59.desc: "После нескольких часов (?) боя вы, наконец, добили последнего зверя и заставили хозяина косы отступить. Затем, всего за мгновение, его тело начинает смещаться, распушаться, искажаться, сморщиваться и складываться, пока оно просто... не исчезает. Когда вы переводите дыхание (по крайней мере, это успокаивающий жест), вы на мгновение оглядываетесь вокруг. Вы видите, как уничтожают последних спектров. Ваши солдаты уже начинают возводить оборону и укрепления, чтобы удерживать территорию, пока ваши люди не смогут её должным образом захватить.\n\nНесколько дней спустя вы наблюдаете, как перед вами стабилизируются новые границы [UmbraGlossaryLocalized('hades','Аида')]. Его границы становятся чёткими, отбрасывая вездесущие вихри душ и полностью заявляя права на землю. Призраки готовы собрать и помочь любым мумиям, которые могут прибыть сюда. С этим пришло время вернуться домой и закончить последнюю часть заклинания Жизни."
 POD_mummy_spell_of_life.59.a: "Эта руна подходит, теперь мне просто нужно..."




 POD_mummy_spell_of_life.60.t: "Победа над мертвецами"
 POD_mummy_spell_of_life.60.desc: "Когда [GetScriptedCharacterByHistoryID('792600').GetFirstName] впервые создал свою версию заклинания Жизни, он столкнулся с проблемой невозможности войти в [UmbraGlossaryLocalized('dark_kingdom_of_sand','Аменти')], древнеегипетское царство мёртвых, где мумии проводят время, восстанавливая себя между каждой смертью. Таким образом, он получил очень небольшую часть [UmbraGlossaryLocalized('shadowlands','Загробного мира')], которую он назвал «Аид» как свой собственный [UmbraGlossaryLocalized('shadow_realm','мир теней')], и каким-то образом сумел убедить Харона, владыку [UmbraGlossaryLocalized('shadowlands','Загробного мира')], принять этот анклав. Несмотря на это, [UmbraGlossaryLocalized('hades','Аид')] по-прежнему остаётся жалкой копией [UmbraGlossaryLocalized('dark_kingdom_of_sand','Аменти')].\n\nНесмотря на его недостатки, вам придётся повторить подвиг Кабира по созданию нового [UmbraGlossaryLocalized('shadow_realm','мира теней')]. Учитывая трудности, с которыми столкнулся Кабир, это будет непростая задача. У вас нет такой связи с Хароном, чтобы получить разрешение, поэтому стигийское правительство нужно будет обойти или успокоить, чтобы оно не действовало против нас. #TOOLTIP:GAME_TRAIT,spectre,[GetNullCharacter] #L Спектров#!#! нужно будет отбросить. Заклинания должны быть подготовлены для захвата и удержания территории. Новому царству потребуются защитники. К сожалению, вам придётся утвердиться до того, как стигийская бюрократия обнаружит ваше присутствие и оправится достаточно, чтобы атаковать. Кроме того, простое ваше присутствие будет привлекать всё большие орды спектров, пока работа не будет завершена, поэтому любые задержки сделают финальную битву сложнее. Так много дел, так мало времени...\n\n#R В этом сражении используется показатель военной мощи. Начальное значение определяется доблестью вашего персонажа, ваших воителей и вашей [Concept('coterie', 'котерии')|E]. Оно будет повышаться или понижаться в ходе самого конфликта.\nВаша начальная военная мощь — [GetPlayer.MakeScope.GetVariable('character_shadow_realm_force').GetValue|0]#!."
 # Triggers if recent Great Maelstrom
 POD_mummy_spell_of_life.60.desc.b: "Когда [GetScriptedCharacterByHistoryID('792600').GetFirstName] впервые создал свою версию заклинания Жизни, он столкнулся с проблемой невозможности войти в [UmbraGlossaryLocalized('dark_kingdom_of_sand','Аменти')], древнеегипетское царство мертвых, где мумии проводят время, восстанавливая себя между каждой смертью. Таким образом, он получил очень небольшую часть [UmbraGlossaryLocalized('shadowlands','Загробного мира')], которую он назвал «Аид» как свой собственный [UmbraGlossaryLocalized('shadow_realm','мир теней')], и каким-то образом сумел убедить Харона, владыку [UmbraGlossaryLocalized('shadowlands','Загробного мира')], принять этот анклав. Несмотря на это, [UmbraGlossaryLocalized('hades','Аид')] по-прежнему остаётся жалкой копией [UmbraGlossaryLocalized('dark_kingdom_of_sand','Аменти')].\n\nНесмотря на его недостатки, вам придётся повторить подвиг Кабира по созданию нового [UmbraGlossaryLocalized('shadow_realm','мира теней')]. Учитывая трудности, с которыми столкнулся Кабир, это будет непростая задача. У вас нет такой связи с Хароном, чтобы получить разрешение, поэтому стигийское правительство нужно будет обойти или успокоить, чтобы оно не действовало против нас. #TOOLTIP:GAME_TRAIT,spectre,[GetNullCharacter] #L Спектров#!#! нужно будет отбросить. Из-за недавнего Великого вихря их особенно много, хотя отвлечение Стигии может нам помочь. Заклинания должны быть подготовлены для захвата и удержания территории. Новому царству потребуются защитники. К сожалению, вам придётся утвердиться до того, как стигийская бюрократия обнаружит ваше присутствие и оправится достаточно, чтобы атаковать. Кроме того, простое ваше присутствие будет привлекать всё большие орды спектров, пока работа не будет завершена, поэтому любые задержки сделают финальную битву сложнее. Так много дел, так мало времени...\n\n#R В этом сражении используется показатель военной мощи. Начальное значение определяется доблестью вашего персонажа, ваших воителей и вашей [Concept('coterie', 'котерии')|E]. Она будет повышаться или понижаться в ходе самого конфликта.\nВаша начальная военная мощь — [GetPlayer.MakeScope.GetVariable('character_shadow_realm_force').GetValue|0]#!."
 POD_mummy_spell_of_life.60.a: "Пришло время начать."
 POD_mummy_spell_of_life.60.b: "Это слишком рискованно."
 POD_mummy_spell_of_life_independent_start_battle_tt: "Военная мощь [Concept('umbra', 'Умбры')|E] и #TOOLTIP:GAME_TRAIT,spectre,[GetNullCharacter] #L спектров#!#! #italic оценивается#! в #V 2300#!"

 POD_mummy_spell_of_life.61.t: "Ночной дозор"
 POD_mummy_spell_of_life.61.desc: "$POD_mummy_spell_of_life_stage4_umbra_battles_strengths$Вы готовитесь к отбытию в [Concept('umbra', 'Умбру')|E]. Однако было бы глупо думать, что ваши усилия, даже в случае успеха, будут быстрыми, и вы не сможете вернуться даже на короткое время, поскольку такие проекты нельзя остановить, пока они не будут завершены. Призраки, выступающие против вашего плана, могут войти в [Glossary('земли Плоти','game_concept_skinlands_desc')] и угрожать вашей державе. Гораздо более проблематично то, что ваши соперники, враги и нелояльные вассалы наверняка обрушатся на ваши силы. Некоторые будут стремиться к вашему исследованию заклинания Жизни, в то время как другие просто попытаются узурпировать ваше влияние в ваше отсутствие. Такие атаки перережут линии связи и снабжения, заключив вас в ловушку [UmbraGlossaryLocalized('shadowlands','Загробного мира')] и лишив вас возможности получить помощь.\n\nЭто оставляет вам два варианта. Вы можете уйти и надеяться, что ваша держава уцелеет без вашего непосредственного надзора. В качестве альтернативы вы можете разместить здесь часть своих сил для охраны тыла, прекрасно зная, что на другой стороне их не будет хватать."
 POD_mummy_spell_of_life.61.a: "Моя держава сильна."
 POD_mummy_spell_of_life.61.b: "Наш тыл должен быть защищён."
 POD_mummy_spell_of_life.61.effect.success.desc: "Мы стоим плечом к плечу!"
 POD_mummy_spell_of_life.61.critical.failure.effect.desc: "Мы стоим плечом к плечу?"

 POD_mummy_spell_of_life.62.t: "Местные царства мёртвых"
 POD_mummy_spell_of_life.62.desc: "$POD_mummy_spell_of_life_stage4_umbra_battles_strengths$Ваши обширные исследования открыли интересную возможность. [UmbraGlossaryLocalized('dark_kingdom_of_sand','Аменти')] был построен внутри [UmbraGlossary('neter_khertet')], старого египетского подземного мира. [Glossary('Какури','podgloss.kakuri')] был подземным миром айнов до того, как [Glossary('Эмма-О','podgloss.emmao')], когда-то хранитель душ умерших айнов, превратил его в [UmbraGlossaryLocalized('yomi_wan','ад Йоми')], соответствующий [Glossary('повелителю Яма','podgloss.yamaking')]. Эти прецеденты показывают, что местные царства мёртвых обладают огромным потенциалом в качестве плацдарма для более крупных начинаний. Они сравнительно свободны от спектров и могут опираться на местные верования, чтобы обеспечить определённую стабильность. Кроме того, их наставники, смотрители и опекуны дополнили бы наши собственные усилия.\n\nХотя господство христианства уничтожило большинство таких измерений, некоторые всё ещй остаются. Стигия может претендовать на все западные подземные миры, но [UmbraGlossary('umi')] аналогичным образом претендует на весь Тихий океан, и ему так и не удалось раздавить все независимые миры духов. Ваше безумное стремление сформировать независимый [UmbraGlossaryLocalized('shadow_realm','мир теней')] потерпит неудачу, если вы не обнаружите местное царство мёртвых и не займёте его должным образом. Таким образом, единственный вопрос заключается в том, сколько времени это займёт."
 POD_mummy_spell_of_life.62.a: "Обыскать архивы!"
 POD_mummy_spell_of_life.62.b: "Нанять ещё библиотекарей в помощь."
 POD_mummy_spell_of_life.62.effect.success.desc: "Нашли!"
 POD_mummy_spell_of_life.62.critical.failure.effect.desc: "Столько задержек..."

 POD_mummy_spell_of_life.620.t: "Боги смерти"
 POD_mummy_spell_of_life.620.desc: "$POD_mummy_spell_of_life_stage4_umbra_battles_strengths$После смерти призрак попадает в загробный мир в коконе из плазмы, называемом оболочкой. Пока оболочка не снята, она удерживает его в покорном, спокойном, похожем на сон состоянии, в котором он почти не осознаёт окружающего. В это время призрак крайне уязвим для нападений, преобразований, порабощения, ваяния или перековки души. Снять оболочку может лишь другой призрак, но у нас нет ни стигийских жнецов, ни помощи Анубиса.\n\nМестное царство мёртвых, который вы будете использовать, представляет интересную возможность: нашего собственного Анубиса. В таком царстве уже будет много постоянных жителей, и им будет управлять и охранять бог смерти. Он может собирать только что прибывшие сюда мумии и дополнять ваши оборонительные усилия. Однако его преданность принадлежит его народу, поэтому вам придётся склонить его на свою сторону. Это будет нелегко, поскольку он может рассматривать вас как силу вторжения, немногим лучше, чем властная бюрократия Стигии. Одна вещь, которая может помочь в вашем случае, это то, что вам не нужна всё его царство, по крайней мере, на начальном этапе."
 # Triggers if recent Great Maelstrom
 POD_mummy_spell_of_life.620.desc.b: "$POD_mummy_spell_of_life.620.desc$ Ещё одно преимущество – это хаос, вызванный недавним Великим вихрем. Наплыв спектров заставит их ещё больше нуждаться в вашей поддержке."
 POD_mummy_spell_of_life.620.a: "Мы предложим защиту небольшого региона."
 POD_mummy_spell_of_life.620.effect.success.desc: "Они согласны"
 POD_mummy_spell_of_life.620.critical.failure.effect.desc: "Столько задержек..."

 POD_mummy_spell_of_life.63.t: "Рыбалка посреди хаоса"
 POD_mummy_spell_of_life.63.desc: "$POD_mummy_spell_of_life_stage4_umbra_battles_strengths$Древние записи указывают на то, что [UmbraGlossaryLocalized('dark_kingdom_of_sand','Аменти')] и Стигия были вовлечены в войну на протяжении бесчисленных десятилетий или столетий. [UmbraGlossary('neter_khertet')] быстро пал, и война закончилась только тогда, когда Анубис преподнёс паромщикам невероятный дар.\n\nЭто было давно, а Стигия только ещё больше затвердела. Вне всякого сомнения, Стигия не допустит ни создания нового [UmbraGlossaryLocalized('shadow_realm','мира теней')], ни независимости подчинённого царства мёртвых. Они могут послать против вас свои силы или ещё больше спровоцировать против вас спектров. В любом случае их вмешательство сильно осложнит ситуацию. Однако, чтобы Стигия могла действовать против вас, им необходимо вовремя обнаружить ваши действия, вмешаться и иметь силы для действий.\n\nЭто интересная возможность ослабить обоих потенциальных врагов. Если вы найдёте «приманку» для спектров, можно направить их на соседние некрополи. Однако, если вашего агента поймают, это может раскрыть ваши намерения, и они могут обернуться против вас."
 POD_mummy_spell_of_life.63.a: "Приготовить приманку и найти призрака, который её забросит."
 POD_mummy_spell_of_life.63.b: "Мы усугубим хаос Великого вихря."
 POD_mummy_spell_of_life.63.effect.success.desc: "Ваш агент сбегает незамеченным"
 POD_mummy_spell_of_life.63.critical.failure.effect.desc: "Ваш агент пойман"

 POD_mummy_spell_of_life.630.t: "Подкуп"
 POD_mummy_spell_of_life.630.desc: "$POD_mummy_spell_of_life_stage4_umbra_battles_strengths$Хотя близлежащие некрополи и стигийские бюрократы могут быть отвлечены, они всё равно представляют угрозу. Ваши действия незаконны и никогда не будут допущены публично. Однако их смерть не сделала этих призраков неподкупными. Маршалы наблюдают и координируют патрули в регионе, чтобы именно они могли вас встретить. Инспекторы и министры руководят административной частью местной бюрократии и управляют разведывательными сетями. Удачно сделанная взятка обеспечит перенаправление патрулей вокруг вашей территории, чтобы задержать официальное раскрытие. Больше взяток гарантирует, что первоначальные атаки против нас будут символическими.\n\nСтоимость такой услуги будет высокой. У призраков странная экономика. Они торгуют изделиями из перекованных душ, кристаллами огня души, жидким пафосом, порошком тоски, стигийской бумагой, плазмой [UmbraGlossaryLocalized('sunless_sea','Сумрачного моря')], рудой смерти и подобными предметами, но эти предметы недостижимы или недостаточно стоят. Реликвии, воспоминания, обретшие форму, когда они пересекли Завесу, — идеальный вариант. Они не ломаются, заменяют расходные предметы, их невозможно связать с нами, и их можно легко обменять на другие нужные предметы.\n\nЕсли у вас есть способности, вы, возможно, сможете их изготовить. Десятина мёртвых ясно даёт понять, что реликвии иногда могут быть созданы из предметов, прижатых к глазам мертвых, даже если они не были греками и не исповедовали греческую религию. Некоторые виды магии могут устранить неопределённость этого процесса или даже устранить необходимость жертвоприношений."
 POD_mummy_spell_of_life.630.a: "Эффигии могут пронзить Завесу."
 POD_mummy_spell_of_life.630.b: "Отдать его пленникам... а затем казнить их."
 POD_mummy_spell_of_life.630.c: "Привести пленников и подготовить ритуал."
 POD_mummy_spell_of_life.630.d: "Где мой медиум?"
 POD_mummy_spell_of_life.630.e: "Призвать медиума к моему двору."

 POD_mummy_spell_of_life.64.t: "Отсечь себя от мира"
 POD_mummy_spell_of_life.64.desc: "$POD_mummy_spell_of_life_stage4_umbra_battles_strengths$Древние записи указывают на то, что [UmbraGlossaryLocalized('dark_kingdom_of_sand','Аменти')] и Стигия были вовлечены в войну на протяжении бесчисленных десятилетий или столетий. [UmbraGlossary('neter_khertet')] быстро пал, и война закончилась только тогда, когда Анубис преподнёс паромщикам невероятный дар. Если вы скопируете некоторые защитные механизмы [UmbraGlossaryLocalized('dark_kingdom_of_sand','Аменти')], вы сможете противостоять любым нападениям спектров. Даже если Стигия неизбежно обратит на вас внимание, вы сможете выжить, пока проблема не будет решена.\n\nОдним из их величайших подвигов было отрезать [UmbraGlossaryLocalized('dark_kingdom_of_sand','Аменти')] от остальной части [UmbraGlossaryLocalized('shadowlands','Загробного мира')]. Это больше не было простым местом внутри более крупного измерения. Скорее, оно стало отдельным царством, доступным только по тщательно поддерживаемым и контролируемым путям. Имитация такой системы позволит вам ограничить доступ к вашему новому [UmbraGlossaryLocalized('shadow_realm','миру теней')], ограничив угрозу, исходящую от внешних сил. Однако осуществить это будет непросто, недёшево и, возможно, вовсе невозможно. В конце концов, ранее это было сделано только Осирисом, вампиром огромной силы, который каким-то образом превзошёл свою вампирскую природу, и Анубисом, призраком, который продемонстрировал большее понимание природы [Concept('umbra', 'Умбры')|E], чем паромщики."
 # Triggers if recent Great Maelstrom
 POD_mummy_spell_of_life.64.desc.b: "$POD_mummy_spell_of_life.64.desc$К счастью, недавний Великий вихрь немного ослабил [Concept('umbra', 'Умбру')|E] и сделал вмешательство в неё проще, чем обычно."
 POD_mummy_spell_of_life.64.a: "Я сделаю это самостоятельно."
 POD_mummy_spell_of_life.64.b: "Наверняка есть доступный вариант."
 POD_mummy_spell_of_life.64.c: "Цена не проблема."
 POD_mummy_spell_of_life.64.d: "Безумная затея."
 POD_mummy_spell_of_life.64.effect.success.desc: "Вы свободно плывёте по сумрачному морю..."
 POD_mummy_spell_of_life.64.critical.failure.effect.desc: "Привязаны к реальности..."

 POD_mummy_spell_of_life.640.t: "Неутомимая орда"
 POD_mummy_spell_of_life.640.desc: "$POD_mummy_spell_of_life_stage4_umbra_battles_strengths$Древние записи указывают на то, что [UmbraGlossaryLocalized('dark_kingdom_of_sand','Аменти')] и Стигия были вовлечены в войну на протяжении бесчисленных десятилетий или столетий. [UmbraGlossary('neter_khertet')] быстро пал, и война закончилась только тогда, когда Анубис преподнёс паромщикам невероятный дар. Если вы скопируете некоторые защитные механизмы [UmbraGlossaryLocalized('dark_kingdom_of_sand','Аменти')], вы сможете противостоять любым нападениям спектров. Даже если Стигия неизбежно обратит на вас внимание, вы сможете выжить, пока проблема не будет решена.\n\nАрмия [UmbraGlossaryLocalized('dark_kingdom_of_sand','Аменти')] состояла из огромных легионов ушабти. Эти оживлённые статуи служили неутомимой рабочей силой в мирное время и неустанной силой на войне. Тщательно выбранные слова силы, вписанные в их тела, придали силу этим обычным конструкциям из дерева, металла и камня. Мы могли бы создать собственные конструкции или связать призраков, чтобы создать аналогичную защитную силу. Если повезёт, их хватит не только для несения караула."
 POD_mummy_spell_of_life.640.a: "Вызвать мастеров."
 POD_mummy_spell_of_life.640.b: "Достать лучшие материалы для ремесла."
 POD_mummy_spell_of_life.640.c: "Подготовить медиумов."
 POD_mummy_spell_of_life.640.effect.success.desc: "Взгляните на мою армию!"
 POD_mummy_spell_of_life.640.critical.failure.effect.desc: "Еле-еле..."

 POD_mummy_spell_of_life.65.t: "Ушедшие, но не забытые"
 POD_mummy_spell_of_life.65.desc: "$POD_mummy_spell_of_life_stage4_umbra_battles_strengths$[UmbraGlossaryLocalized('shadowlands','Загробный мир')] собирает души на протяжении веков и тысячелетий. В частности, призраками обычно становятся те, у кого есть незавершённые дела или насильственная смерть. Можно с уверенностью сказать, что среди них есть некоторые из ваших бывших защитников и союзников. Если их завербовать, они станут верными и могущественными помощниками. Их помощь будет неоценима, поскольку она пополнит ваши силы в предстоящей битве и позаботится о вашем [UmbraGlossaryLocalized('shadow_realm','мире теней')] в будущем. Однако нет никаких сомнений в том, что их разум и корпус будут сильно ослаблены. Чтобы найти и восстановить их, потребуется драгоценное время."
 POD_mummy_spell_of_life.65.a: "Вспомните, кем вы были..."
 POD_mummy_spell_of_life.65.b: "Это не стоит потраченного времени."
 POD_mummy_spell_of_life.65.effect.success.desc: "С возвращением"
 POD_mummy_spell_of_life.65.critical.failure.effect.desc: "Пустая трата времени..."

 POD_mummy_spell_of_life.66.t: "Налётчики"
 POD_mummy_spell_of_life.66.desc: "$POD_mummy_spell_of_life_stage4_umbra_battles_strengths$Время пришло. Ваши силы готовы выступить вперед и отбросить орды спектров. Ваши призраки готовы захватить территорию и вернуть наши души, когда придёт время. Местный бог смерти добавил свою силу к вашей магии. Ваши солдаты собираются, чтобы удерживать захваченную территорию.\n\nИзбранное вами за удалённость от центров стигийской власти царство мёртвых всегда существовало в изолированной области, позволяя спектрам свирепствовать за его пределами. Прежде чем начнётся нападение, существует возможность отправить отряды налётчиков, чтобы преследовать их. Если это сработает, набеги уменьшат их численность и облегчат предстоящий конфликт. Однако такие налёты влекут за собой большие риски."
 POD_mummy_spell_of_life.66.a: "Во-первых, вам нужно будет..."
 POD_mummy_spell_of_life.66.b: "Некоторые из вас могут погибнуть..."
 POD_mummy_spell_of_life.66.c: "Это не стоит риска."
 POD_mummy_spell_of_life.66.effect.success.desc: "Их ряды поредели, [Select_CString(ROOT.Char.IsFemale, 'моя госпожа', 'мой господин' )]"
 POD_mummy_spell_of_life.66.critical.failure.effect.desc: "Вы потеряли весь отряд, [Select_CString(ROOT.Char.IsFemale, 'моя госпожа', 'мой господин' )]"

 POD_mummy_spell_of_life.67.t: "Начало битвы"
 POD_mummy_spell_of_life.67.desc: "$POD_mummy_spell_of_life_stage4_umbra_battles_strengths$Это последняя битва. Если к концу ваша военная мощь окажется ниже, чем у противостоящих вам сил, ваш путь закончится здесь.#!\n\nВы выводите свои силы из защищённого анклава выбранного вами подземного мира. Вас ждёт бесконечная орда спектров, которые, кажется, постоянно атакуют возведённую вами защиту. Их бледные, вытянутые формы сразу же ощущают ваше появление и начинают устремляться к вашей армии. Концентрированное присутствие порчи Забвения представляет собой ощутимый смрад, загрязняющий воздух. Подавляющее большинство представляют собой скелетные фигуры с когтями, способными разрывать плоть, или с ледяным чёрным огнем, горящим в их глазах. Несколько зверей размером с ребёнка бегают между ног, безумно хохоча. В первых рядах маршируют дикие, звероподобные монстры с множеством рядов акульих зубов и разорванными массами тканей, свисающими с деформированных скелетов. Их похоть, ненависть и страсть легко видны, и кажется, будто они исходят из их неповоротливых форм. Все они жаждут вкусить крови живых, украсть хоть каплю этой жизненной силы и причинить боль и разрушения. Несмотря на эту жажду, они действуют согласованно, как единая масса, а не рвутся вперёд. Несколько существ с неоднородными, просачивающимися поражениями и опухолями гонят их вперед организованными формированиями в соответствии с каким-то скрытым планом.\n\nПока ими командуют и фокусируют внимание, эти обычные спектры не обладают независимым разумом и не способны к стратегическому реагированию на быстрые действия. Если у вас есть время и пространство для манёвра, своевременный натиск может разрушить орду и позволить вашим силам сокрушить часть из них. В качестве альтернативы можно было бы призвать ваши резервы, которые до сих пор в основном оставались в мире смертных. Хотя они будут служить не более чем пушечным мясом, это всё равно может иметь значение."
 POD_mummy_spell_of_life.67.a: "Мы не можем остановиться! ВПЕРЁД!"
 POD_mummy_spell_of_life.67.b: "Призвать наши резервы! Всех до единого!"
 POD_mummy_spell_of_life.67.critical.failure.effect.desc: "Одинокие и ровные пески простираются вдаль..."

 POD_mummy_spell_of_life.670.t: "Святой поглощённых тенью"
 POD_mummy_spell_of_life.670.desc: "$POD_mummy_spell_of_life_stage4_umbra_battles_strengths$Орда начинает слабеть. В их рядах открываются бреши, позволяя вам ещё глубже проникнуть в их порядки. Только одно препятствие стоит на пути создания [UmbraGlossaryLocalized('shadow_realm','мира теней')], предводитель спектров.\n\nПрорубившись сквозь бесчисленных спектров, вы видите человека в маске, созданной по образцу греческой маски трагедии. Существо одето в рваные чёрные одежды, испещрённые белыми пятнами проказы, и держит в руках сломанную косу. Потускневшие и зазубренные шипы торчат из мантии, и вязкая чёрная жидкость медленно капает и разбрызгивается на землю, где кажется, что она шипит. Его защищают многочисленные зияющие пасти и злые когти, скреплённые переплетением сухожилий и туго натянутой кожи. Полупрозрачные щупальца появляются из некоторых опухолевых масс плоти, кружась и убивая любого спектра, который подойдёт слишком близко, отражая их едва сдерживаемую жестокость. Вы и ваши союзники приближаетесь к грандиозному противостоянию.\n\nКаждый удар владельца косы точен, и его удары обрушиваются на ваши силы так же неизбежно, как энтропия. Кажется, что каждый поражённый солдат распадается на однородную каплю углерода, некоторых металлов и медленно расширяющееся облако газов, хотя даже они быстро разлагаются на невидимые компоненты, прежде чем они тоже уничтожаются полностью. Это резко контрастирует с чудовищами, чьи сокрушительные удары обрушиваются вокруг вас. Каждый удар прикрывает перемещение их хозяина, позволяя использовать более сложные стратегии. Хотя звери демонстрируют множество эмоций, ни одна из этих эмоций не даёт вам понимания, которое можно было бы прочитать, или слабостей, которыми можно было бы воспользоваться. Вам удаётся сбросить маску, но это мало помогает. Почерневшее, безглазое и безротое лицо этой живой тени мало что раскрывает, кроме неизбежных объятий всего сущего в объятиях Бездны.\n\nДаже когда ваши силы окружают вас и начинают догонять орду спектров, нет никаких сомнений в том, что это будет битва за ваше существование, борьба, которая подтолкнёт вас к вашим пределам."
 POD_mummy_spell_of_life.670.a: "Пути назад нет..."
 POD_mummy_spell_of_life.670.b: "В атаку!"
 POD_mummy_spell_of_life.670.c: "Даже если это будет стоить мне разума!"
 POD_mummy_spell_of_life.670.d: "Любой ценой!"
 POD_mummy_spell_of_life.670.effect.success.desc: "Они все пали..."
 POD_mummy_spell_of_life.670.effect.failure.desc: "Сладкое небытие Пустоты..."
 POD_mummy_spell_of_life.670.final_check: "Сравнит вашу военную мощь с силой спектров, чтобы определить окончательные результаты"
 POD_mummy_spell_of_life.670.critical.failure.effect.desc: "Одинокие и ровные пески простираются вдаль..."

 POD_mummy_spell_of_life.68.t: "Долгожданная победа"
 POD_mummy_spell_of_life.68.desc: "После нескольких часов (?) боя вы, наконец, добили последнего зверя и заставили владельца косы отступить. Затем, всего за мгновение, его тело начинает смещаться, распушаться, искажаться, сморщиваться и складываться, пока оно просто... не исчезает. Когда вы переводите дыхание (по крайней мере, это успокаивающий жест), вы на мгновение оглядываетесь вокруг. Вы видите, как уничтожают последних спектров. Ваши солдаты уже начинают возводить оборону и укрепления, чтобы удерживать территорию, пока ваши люди не смогут её должным образом занять.\n\nНесколько дней спустя вы наблюдаете, как перед вами стабилизируются новые границы вашего личного [UmbraGlossaryLocalized('shadow_realm','мира теней')]. Его границы становятся чёткими, отбрасывая вездесущие вихри душ и полностью заявляя права на землю. Призраки готовы собрать и помочь любым мумиям, которые могут прибыть сюда. С этим пришло время вернуться домой и закончить последнюю часть заклинания Жизни."
 POD_mummy_spell_of_life.68.a: "Эта руна подходит, теперь мне просто нужно..."

 POD_mummy_spell_of_life.610.t: "Живой кошмар"
 POD_mummy_spell_of_life.610.desc: "После нескольких часов (?) боя вы, наконец, добили последнего зверя и заставили владельца косы отступить. Затем, всего за мгновение, его тело начинает смещаться, распушаться, искажаться, сморщиваться и складываться, пока оно просто... не исчезает. Когда вы переводите дыхание (по крайней мере, это успокаивающий жест), вы на мгновение оглядываетесь вокруг. Вы видите, как уничтожают последних спектров. Ваши солдаты уже начинают возводить оборону и укрепления, чтобы удерживать территорию, пока ваши люди не смогут её должным образом занять.\n\nНесколько дней спустя вы чувствуете, как ваш новый [UmbraGlossaryLocalized('shadow_realm','мир теней')] стабилизируется вокруг вас. Его границы становятся чёткими, отодвигая вездесущие вихри душ. На этом настало время вернуться домой.\n\nК сожалению, ваше длительное отсутствие и предполагаемая смерть или ослабление высвободили фракции внутри вашего двора, в то время как ваши соперники ведут борьбу за ваши земли. Вся держава находится в хаосе, поскольку различные силы пытаются одержать верх. Что ещё хуже, все они придерживаются одной и той же идеи: устранив вас сейчас, пока вы ослаблены, они получат самые серьёзные права на всё, что останется после того, как этот водоворот насилия наконец прекратится. В одном последнем конфликте ваша потрепанная армия должна найти в себе силы и харизму, чтобы собрать воедино любые остатки лоялистов и напомнить этим глупцам, почему этот трон с самого начала принадлежал вам. Только тогда у вас будет время закончить заклинание Жизни."
 POD_mummy_spell_of_life.610.a: "Мой народ остаётся стойким и верным."
 POD_mummy_spell_of_life.610.b: "Мои агенты знают лоялистов и могут убить остальных."
 POD_mummy_spell_of_life.610.c: "Мой тактический гений обеспечит победу в бою."
 POD_mummy_spell_of_life.610.d: "Единоборство определит достойного претендента."
 POD_mummy_spell_of_life.610.e: "Народ со мной. Никто не устоит перед его волной."
 POD_mummy_spell_of_life.610.f: "Вы не первые, кто пытается это сделать, поэтому я [Select_CString(ROOT.Char.IsFemale, 'подготовилась', 'подготовился' )]."
 POD_mummy_spell_of_life.610.effect.success.desc:0 "Вы восстанавливаете некое подобие порядка"
 POD_mummy_spell_of_life.610.critical.failure.effect.desc: "Вернитесь! НЕТ! Не делайте этого!"

 POD_mummy_spell_of_life.70.t: "Милость Гора"
 # not horus phase 3
 POD_mummy_spell_of_life.70.desc: "Вы прибываете на аудиенцию к Гору. «Приветствую, повелитель. Я знаю, что вы подвергли сомнению мои действия и мотивы. Вы считаете, что я [Select_CString(ROOT.Char.IsFemale, 'нарушила', 'нарушил' )] шестой принцип вашего кодекса. В течение долгого времени я [Select_CString(ROOT.Char.IsFemale, 'отслеживала', 'отслеживал' )] все зацепки, связанные с заклинанием Жизни, которое когда-то использовалось для создания нас, шемсу-геру. Я [Select_CString(ROOT.Char.IsFemale, 'собрала', 'собрал' )] различные исторические и магические записи, в которых сохранились некоторые подробности заклинания. Я [Select_CString(ROOT.Char.IsFemale, 'провела', 'провёл' )] время в [Concept('umbra', 'Умбре')|E], чтобы определить правильную связь между [UmbraGlossaryLocalized('shadow_realm','миром теней')] и заклинанием Жизни. Завершив исследование, я [Select_CString(ROOT.Char.IsFemale, 'получила', 'получил' )] большую часть сохранившихся записей. Я намеренно [Select_CString(ROOT.Char.IsFemale, 'искала', 'искал' )] альтернативные источники помимо вас, чтобы получить как можно более широкую коллекцию. Теперь я передаю всё это вам на уничтожение и прошу стереть заклинание Жизни из моих воспоминаний».\n\nНа мгновение Гор сидит, тихо рассматривая вас. «После первого нападения на твою гробницу я подумывал о нескончаемой череде нападений, пока ты не падешь перед своими более лояльными братьями и твои исследования не будут сожжены. Я рад, что отказался от этого, ведь сегодня ты [Select_CString(ROOT.Char.IsFemale, 'искупила', 'искупил' )] свою вину. Я благодарю тебя за службу и с радостью уничтожу эти записи. Однако твои действия демонстрируют большую мудрость. Там, где многие другие потерпели неудачу, ты [Select_CString(ROOT.Char.IsFemale, 'показала', 'показал' )], что можешь ответственно использовать заклинание Жизни. Хотя я запрещаю тебе обучать заклинанию других, я позволю тебе сохранить воспоминания о нём и использовать его по своему усмотрению. Ты [Select_CString(ROOT.Char.IsFemale, 'доказала', 'доказал' )], что [Select_CString(ROOT.Char.IsFemale, 'достойна', 'достоин' )] этого внимания. Я даже помогу усовершенствовать твоё заклинание Жизни. Кроме того, я издам среди шемсу-геру указ о твоей защите, оберегая столь [Select_CString(ROOT.Char.IsFemale, 'верную помощницу', 'верного помощника' )] в войне против Сета и предотвратив кражу твоих знаний. Отлично, мой добрый и верный слуга»."
 # horus phase 3 done
 POD_mummy_spell_of_life.70.desc.b: "Вы прибываете на аудиенцию к Гору. «Приветствую, повелитель. Как вы знаете, я [Select_CString(ROOT.Char.IsFemale, 'потратила', 'потратил' )] много времени на поиск всех зацепок, связанных с заклинанием Жизни, которое когда-то использовалось для создания шемсу-геру. С вашей помощью я [Select_CString(ROOT.Char.IsFemale, 'попыталась', 'попытался' )] понять заклинание. Я [Select_CString(ROOT.Char.IsFemale, 'собрала', 'собрал' )] различные исторические и магические записи, в которых сохранились некоторые подробности заклинания. Я [Select_CString(ROOT.Char.IsFemale, 'провела', 'провёл' )] время в [Concept('umbra', 'Умбре')|E], чтобы определить правильную связь между [UmbraGlossaryLocalized('shadow_realm','миром теней')] и заклинанием Жизни. Завершив исследование, я [Select_CString(ROOT.Char.IsFemale, 'получила', 'получил' )] большую часть сохранившихся записей. Теперь я передаю всё это вам на уничтожение и прошу стереть заклинание Жизни из моих воспоминаний».\n\nНа мгновение Гор сидит, тихо рассматривая вас. «Хотя я когда-то сомневался в целесообразности разрешения твоих поисков, теперь я вижу, что моё решение помочь тебе в работе было правильным. Я благодарю тебя за службу и с радостью уничтожу эти записи. Однако твои действия демонстрируют большую мудрость. Там, где многие другие потерпели неудачу, ты [Select_CString(ROOT.Char.IsFemale, 'показала', 'показал' )], что можешь ответственно использовать заклинание Жизни. Хотя я запрещаю тебе обучать заклинанию других, я позволю тебе сохранить воспоминания о нём и использовать его по своему усмотрению. Ты [Select_CString(ROOT.Char.IsFemale, 'доказала', 'доказал' )], что [Select_CString(ROOT.Char.IsFemale, 'достойна', 'достоин' )] этого внимания. Я даже помогу усовершенствовать твоё заклинание Жизни. Кроме того, я издам среди шемсу-геру указ о твоей защите, оберегая столь [Select_CString(ROOT.Char.IsFemale, 'верную помощницу', 'верного помощника' )] в войне против Сета и предотвратив кражу твоих знаний. Отлично, мой добрый и верный слуга»."
 POD_mummy_spell_of_life.70.a: "Благодарю, повелитель."
 POD_mummy_spell_of_life_cant_teach_spell_of_life: "Больше нельзя обучать заклинанию Жизни"
 POD_mummy_spell_of_life_make_only_shemsuheru: "Теперь ваше заклинание Жизни создаёт шемсу-геру, если ещё не делало этого"
 blessing_of_horus_modifier: "Благословение Гора"
 blessing_of_horus_modifier_desc: "В награду за вашу выдающуюся службу и преданность Гор благословил вас великой силой, которая возрастает вместе с вашим рвением и преданностью."

 POD_mummy_spell_of_life.71.t: "[Select_CString(ROOT.Char.IsFemale, 'Вестница', 'Вестник' )] Сета"
 POD_mummy_spell_of_life.71.desc: "«Кто тревожит мой сон?»\n\n«Мой господин. Я здесь, чтобы предложить вам заклинание Жизни, похищенное у выводка Гора».\n\n«Ты [Select_CString(ROOT.Char.IsFemale, 'преуспела', 'преуспел' )] там, где все прочие мои потомки потерпели неудачу. Что ж, тебя ждёт награда».\n\n«Б-благодарю, мой повелитель».\n\nВы чувствуете рывок внутри разума, а затем — совершенную ясность и покой: к вашему сознанию присоединяется нечто новое.\n\n«Малкав поступил глупо, уничтожив своё материальное тело, но и у более слабой формы связи есть преимущества. Теперь твой разум един с моим, и ты сможешь лучше служить мне. Вернись к своим собратьям. Напомни им об их предназначении и подготовь путь для меня. Моё пробуждение близко. Я вернусь во главе великого воинства бессмертных, чтобы вознаградить верных и проклясть врагов»."
 POD_mummy_spell_of_life.71.a: "Я возвещу ваше имя."
 set_mind_control_tooltip: "Ваша личность меняется, поскольку разум Сета поглощает ваш"
 herald_of_set_modifier: "Глашатай Сета"
 # chose to use only a few middle english words to make it feel old-timey but still recognizable
 herald_of_set_modifier_desc: "Имеющий уши да слышит. Пришествие нашего владыки Сета близко. Все вы, неверные, трепещите и отчаивайтесь."
 sets_herald_tooltip: "Все #TOOLTIP:GAME_TRAIT,setite,[GetNullCharacter] #L сетиты#!#! и последователи Сета с более высокой вероятностью примут предложение о вассализации."
 recreate_setite_empire_effect_tooltip: "С помощью Сета вы воссоздадите [Concept('title', 'титул')|E] империи Сетитов."
 transfer_setite_empire_effect_tooltip: "По приказу Сета вы примете под свой контроль [Concept('title', 'титул')|E] империи Сетитов."

 POD_mummy_spell_of_life.72.t: "Последний пир"
 POD_mummy_spell_of_life.72.desc: "Вы насыщаетесь ужасом, страданиями и агонией своих пленников. При этом вы чувствуете странную связь через дух, который слился с вами. Ваше знание заклинания Жизни течёт через ваш разум и по этой связи к вашему скрытому хозяину.\n\nПосле завершения передачи странные вибрации распространяются по миру, когда баланс рушится. Чистая ярость, безумие и злоба проникают в смертных по всему миру. Их наполняет мучительный голод, жадность и похоть. Безнадёжность поглощает их, заставляя искать удовлетворения перед неизбежным крахом всего. Бэйны сливаются с душами смертных, как и вы когда-то, трансформируя их с помощью недавно завершённого заклинания Жизни. Вы можете почувствовать, как невиданный вихрь проносится через [UmbraGlossaryLocalized('shadowlands','Загробный мир')]. Бесконечные осколки джиннов и душ проскальзывают сквозь барьер, позволяя вам насытиться ими. Через [UmbraGlossary('pod_realm_labyrinth')] прорываются разломы, позволяя бесчисленным армиям спектров выйти наружу. Среди хаоса пробуждаются древние потомки и слуги вашего хозяина. Ваш хозяин поднимается из-под [UmbraGlossaryLocalized('well_of_the_void','Колодца Пустоты')], пробуждаясь, чтобы поглотить сам мир."
 POD_mummy_spell_of_life.72.a: "Остаётся лишь пировать! Пировать! ПИРОВАТЬ!"


 POD_mummy_spell_of_life.80.t: "Новое название"
 POD_mummy_spell_of_life.80.desc: "После вашего успеха пришло время дать вашей новой династии #TOOLTIP:GAME_TRAIT,mummy,[GetNullCharacter] #L бессмертных#!#! название. Шемсу-геру получили от Гора бессмертие и следовали его кодексу. Кабириты были созданы заклинанием Жизни Кабира. Апепну были созданы ошибочными ритуалами Сета \n\nКак вы хотите назвать тех, кому вы даруете вечное возрождение через свою версию заклинания? Возможно, вы назовёте себя Инанна-эне или Бальдаром в честь богов, которые умерли и возродились заново. Возможно, вы назовёте себя в честь групп, практиковавших мумификацию, таких как болотные или дымные мумии, или в честь проклятых странников из бесчисленных сказок. Возможно, вы назовёте себя в честь нетленных святых, монахов-аскетов и великих алхимиков, от Баруха до Терезы и от Сокушинбуцу до Фламеля, чьи тела никогда не разлагались и которые, как говорят некоторые, всё ещё ходят среди нас. Есть много названий, которые вы могли бы использовать."
 POD_mummy_spell_of_life.80.a: "Выбрать это название."
 POD_mummy_spell_of_life.80.b: "Оставить обычное название #italic ([GetPlayer.Custom('PODGetDefaultCustomMummyDynastyName')])#!."

 POD_mummy_spell_of_life.81.t: "Новое измерение"
 POD_mummy_spell_of_life.81.desc: "После вашего успеха пришло время дать вашему новому [UmbraGlossaryLocalized('shadow_realm','миру теней')] название. После своей смерти шемсу-геру возвращаются в [UmbraGlossaryLocalized('dark_kingdom_of_sand','Аменти')], пока не возродятся заново. Кабириты отправляются в [UmbraGlossaryLocalized('hades','Аид')].\n\nТеперь, когда вы создали своё собственное измерение, как вы хотите назвать это царство, куда души ваших последователей будут возвращаться для отдыха между перерождениями? Возможно, вы назовёте его Хельхейм, Шеол, Йоми, Иркалла, Туонела, Зелёные острова, Обитель Песни, Горы Бессмертных, Преисподняя, Лимбо, Зал ожидания, Земля возвращения или Залы покоя. Есть много загробных жизней и названий, которые вы можете использовать."
 POD_mummy_spell_of_life.81.a: "Выбрать это название."
 POD_mummy_spell_of_life.81.b: "Оставить обычное название #italic ([GetPlayer.Custom('PODGetDefaultCustomMummyDynastyShadowRealm')])#!."

 POD_mummy_spell_of_life.82.t: "Новый путь"
 POD_mummy_spell_of_life.82.desc: "Благодаря вашему успеху пришло время построить путь, который поведёт ваших последователей в будущее, кодекс, который будет управлять их действиями, позицию, которая определит их место в Войне равновесия, землю, которую они назовут своим домом. Выбирайте мудро, ведь ваши слова будут высечены в камне и неизменны на протяжении веков."
 POD_mummy_spell_of_life.82.a: "Провозгласить наш новый путь!"
 POD_mummy_spell_of_life.82.b: "Более простой путь подойдёт..."
 POD_mummy_spell_of_life.82.b.tt: "Вы кодифицируете #L [GetFaithByKey('custom_mummy_dynasty').GetName|l]ую#! [Concept('faith', 'конфессию')|E]:"
 POD_mummy_spell_of_life.82.mummy_caveat: "Примите [Concept('decision', 'решение')|E] «$spell_of_life_find_new_home_decision$», чтобы присоединиться к новой династии"
 POD_mummy_spell_of_life.82.splat_caveat: "К вашей новой династии могут присоединиться только #TOOLTIP:GAME_TRAIT,mummy,[GetNullCharacter] #L мумии#!#!. Возможно, вы могли бы стать одним из них..."
 POD_mummy_spell_of_life.82.framework: "Основа"
 POD_mummy_spell_of_life.82.practice: "Обряд"
 POD_mummy_spell_of_life.82.radical: "Радикализм"
 POD_mummy_spell_of_life.82.flexibility: "Гибкость"
 POD_mummy_spell_of_life.82.alignment: "Принадлежность"
 POD_can_select_custom_religion_tenet_tt: "[current_location.GetName] #bold не#! находится в регионе [homeland_region.GetName] #bold И#! #L [current_culture.GetCollectiveNoun|l]ая#! [Concept('culture', 'культура')|E] #bold не#! имеет [Concept('heritage', 'наследия')|E] из этого региона. Выполните хотя бы одно требование, чтобы выбрать [Concept('POD_homeland', 'родину')|E]"