l_russian:

 POD_fae_maintenance.1.t: "Кризалис"
 POD_fae_maintenance.1.desc: "Кризалис - это процесс, в ходе которого подменыш осознает свою природу феи."
 POD_fae_maintenance.1.option.a: "Я [Select_CString(ROOT.Char.IsFemale, 'пробудилась', 'пробудился' )]."

 POD_fae_maintenance.21.t: "Раскол"
 POD_fae_maintenance.21.desc: "Вы не сумели предотвратить Пророчество.\nВ конце концов нити между миром смертных и [UmbraGlossaryLocalized('dreaming','Грёзами')] стали насколько тонкими, что начали рваться. Этот разрыв привёл к [Glossary('Расколу','game_concept_shattering_desc')]. Он не только разрушил связи между [UmbraGlossaryLocalized('arcadia','Аркадией')] и Землёй, но и уничтожил надежды на то, что их можно обратить вспять.\nВы должны выбрать способ справиться с этим."
 POD_fae_maintenance.21.a: "Ну и что?"
 POD_fae_maintenance.21.b: "Принять Путь подменыша и отказаться от бессмертия."
 POD_fae_maintenance.21.c: "Бежать в Аркадию."
 POD_fae_maintenance.21.d: "Перейти во фригольд." #Become a Lost One.
 POD_fae_maintenance.22.t: "Раскол"
 POD_fae_maintenance.22.desc: "В конце концов нити, которые были так тонко натянуты между миром смертных и [UmbraGlossaryLocalized('dreaming','Грёзами')] начали рваться. Этот разрыв и есть [Glossary('Раскол','game_concept_shattering_desc')]. Он не только разрушил связи между [UmbraGlossaryLocalized('arcadia','Аркадией')] и Землёй, но и уничтожил надежды на то, что их можно обратить вспять."
 POD_fae_maintenance.22.a: "Ура?"

 POD_fae_maintenance.31.t: "Междуцарствие"
 POD_fae_maintenance.31.desc: "Период, когда на Земле не было ни ши, ни истинных фей, а оставшиеся «разбавленные» подменыши вынуждены были сами добывать себе пропитание после окончательной агонии во время [Glossary('Раскола','game_concept_shattering_desc')] около 1400 года, - это Междуцарствие, поскольку подменыши должны были пытаться выжить самостоятельно."
 POD_fae_maintenance.31.a: "Наше время ушло."
 POD_fae_maintenance.31.b: "Наше время настало."

 POD_fae_maintenance.40.t: "Сказки"
 POD_fae_maintenance.40.desc: "$POD_fable_decision_desc$"
 POD_fae_maintenance.40.a: "Сказка о вестнике"
 POD_fae_maintenance.40.a.tt: "Чтобы улучшить эту сказку, вам придётся выполнить множество [Concept('diplomacy', 'дипломатических')|E] контрактов, а также увеличить свой [Concept('prestige_level', 'уровень репутации')|E]. В награду вы будете постепенно открывать [Concept('domicile_building_upgrade', 'улучшения постройки имения')|E] «[GetDomicileBuilding('fae_the_appearance_legendary_01').GetName]» и его следующие уровни с каждым продвижением сказки."
 POD_fae_maintenance.40.b: "Сказка о маршале"
 POD_fae_maintenance.40.b.tt: "Чтобы улучшить эту сказку, вам придётся выполнить множество [Concept('martial', 'военных')|E] контрактов, а также выиграть множество сражений в роли [Concept('commander', 'командира')|E]. В награду вы будете постепенно открывать [Concept('domicile_building_upgrade', 'улучшения постройки имения')|E] «[GetDomicileBuilding('fae_the_interior_training_ground_of_marshal_01').GetName]» и его следующие уровни с каждым продвижением сказки."
 POD_fae_maintenance.40.c:0 "Сказка об управляющем"
 POD_fae_maintenance.40.c.tt: "Чтобы улучшить эту сказку, вам придётся выполнить множество [Concept('stewardship', 'управленческих')|E] контрактов, а также накопить большое количество [Concept('gold', 'золота')|E]. В награду вы будете постепенно открывать [Concept('domicile_building_upgrade', 'улучшения постройки имения')|E] «[GetDomicileBuilding('fae_the_appearance_perfect_01').GetName]» и его следующие уровни с каждым продвижением сказки."
 POD_fae_maintenance.40.d: "Сказка о тени"
 POD_fae_maintenance.40.d.tt: "Чтобы улучшить эту сказку, вам придётся выполнить множество [Concept('intrigue', 'интриганских')|E] контрактов, а также добиться успеха во многих [Concept('hostile_schemes', 'агрессивных происках')|E]. В награду вы будете постепенно открывать [Concept('domicile_building_upgrade', 'улучшения постройки имения')|E] «[GetDomicileBuilding('fae_the_atmosphere_oppressive_01').GetName]» и его следующие уровни с каждым продвижением сказки."
 POD_fae_maintenance.40.e: "Сказка о мудреце"
 POD_fae_maintenance.40.e.tt: "Чтобы улучшить эту сказку, вам придётся выполнить множество [Concept('learning', 'учёных')|E] контрактов, а также передать множество очков [Concept('perk', 'достоинств')|E] другим [Concept('characters', 'персонажам')|E]. В награду вы будете постепенно открывать [Concept('domicile_building_upgrade', 'улучшения постройки имения')|E] «[GetDomicileBuilding('fae_the_interior_library_of_the_sage_01').GetName]» и его следующие уровни с каждым продвижением сказки."