l_russian:
 POD_fae_house_event.1.t: "Железный раскол"
 POD_fae_house_event.1.desc: "Спор о последнем роковом пророчестве герцога #TOOLTIP:CHARACTER,[GetScriptedCharacterByHistoryID('POD_fae_character_52').GetID] #L Геремина#!#! завершился уничтожением другой стороны спора. Благодаря крови единство дома было восстановлено, и ваше лидерство в доме Бомейн не вызывает сомнений."
 POD_fae_house_event.1.a: "Последователи #TOOLTIP:CHARACTER,[GetScriptedCharacterByHistoryID('POD_fae_character_53').GetID] #L Бранделла#!#! одержали победу и обеспечат соблюдение Закона!"
 POD_fae_house_event.1.b: "Предвестники Исхода поведут всех нас по Железной дороге."

 POD_fae_house_event.2.t: "Золото в сталь"
 POD_fae_house_event.2.desc: "Несмотря на огромные затраты, под вашим руководством ремесленники дома Дугал создали арсенал поистине легендарной мощи и размаха. С таким оружием, как это, феи могут завоевать весь мир. Тысячи воинов с оружием в руках с нетерпением ждут знака к восхождению!"
 POD_fae_house_event.2.a: "К оружию! К оружию!"

 POD_fae_house_event.3.t: "Укреплённые фригольды"
 POD_fae_house_event.3.desc: "Предупреждён - значит вооружён. Благодаря вашему сверхъестественному пониманию будущих возможностей, архитекторы дома Эйлунд построили сложные оборонительные сооружения, способные выдержать любую осаду. Ваша оборона полна тайных проходов, лабиринтов, лазов для побега, мест для убийств и магических ловушек. Наконец-то вы чувствуете себя в безопасности."
 POD_fae_house_event.3.a: "Пусть придут мои враги — они разобьются о камни!"

 POD_fae_house_event.4.t: "Величайшие любовники"
 POD_fae_house_event.4.desc: "Барды будут вечно воспевать ваши романтические подвиги с огромным желанием в сердце. Вы научились искусству любви у мифологических олицетворений похоти — сатиров. Вы олицетворяете красоту прекраснейших из ши. Вы укротили свирепое сердце гневных оборотней и подчинили их своим желаниям. Великие люди отказались бы от своих самых грандиозных замыслов ради вечера в вашей постели. Все будут любить вас и отчаиваться!"
 POD_fae_house_event.4.a: "Люби меня, люби меня, просто скажи, что любишь меня."

 POD_fae_house_event.5.t.king: "Коронация истинного короля"
 POD_fae_house_event.5.t.queen: "Коронация истинной королевы"
 POD_fae_house_event.5.desc.king: "Благодаря героическим усилиям дом Гвидион под вашим руководством проявил себя как самый благородный из всех ши. Кто ещё мог бы найти и овладеть молнией — Мечом света — клинком миротворца - #L [GetPODArtifact('caliburn_link').GetName]ом#!, как не вы, истинный король! Все феи должны склониться перед вашим величием и признать вашу верховную власть."
 POD_fae_house_event.5.desc.queen: "Благодаря героическим усилиям дом Гвидион под вашим руководством проявил себя как самый благородный из всех ши. Кто ещё мог бы найти и овладеть молнией — Мечом света — клинком миротворца - #L [GetPODArtifact('caliburn_link').GetName]ом#!, как не вы, истинная королева! Все феи должны склониться перед вашим величием и признать вашу верховную власть."
 POD_fae_house_event.5.a: "Теперь все могут выразить почтение."

 POD_fae_house_event.6.t: "Песня смертных"
 POD_fae_house_event.6.desc: "Дело сделано. Паства приняла фей в качестве своих пастырей и проводников. Церковь больше не будет представлять угрозу для фей, какой она была раньше, и все всё это благодаря усилиям, которые предпринял [Select_CString(ROOT.Char.IsFemale, 'предприняла', 'предпринял' )] [ROOT.Char.GetFullName]. Дому [ROOT.Char.GetHouse.GetName] будут воспеваться хвалы во веки веков.\n\nКаждой фее на земле и на небесах нужно будет задуматься о своих взаимоотношениях со Святой Церковью и ее священными заступниками — домом [ROOT.Char.GetHouse.GetName]. Молитесь, чтобы они избрали праведный путь к спасению, иначе их наверняка ждет зияющая пасть ада во веки веков. Избавление близко!\n\nСмертные должны помогать всем, чем могут, создавая величественные соборы, великолепное искусство и торжествующую музыку во славу божественного и его святых посланников. Построим сияющий город на холме, который станет маяком надежды и спасения для всех, у кого есть уши, чтобы услышать нашу блаженную песнь!"
 POD_fae_house_event.6.a: "Аллилуйя!"

 POD_fae_house_event.7.t: "Захват Мидгарда"
 POD_fae_house_event.7.desc: "Поскольку все сверхъестественные существа Мидгарда попали под власть вашей державы, христианизация Скандинавии пошла вспять. Скандинавы будут чтить старые обычаи и будут почитать асов как богов на Земле.\n\n«Внемлите моим словам, люди всех сословий, вы, великие и малые дети Хеймдалля. Вы призвали нас, асов, чтобы рассказать то, что мы помним о древнейших деяниях богов и людей»."
 POD_fae_house_event.7.a: "Мои вороны, каждый день облетайте весь мир."

 POD_fae_house_event.8.t: "Эйлиль на все времена года"
 POD_fae_house_event.8.desc: "Благодаря вашим навыкам интриги и дипломатии, вам удалось положить конец ужасному конфликту, который так долго разделял фей. Под вашим руководством дом Эйлиль поднялся над всеми мелкими дрязгами других домов ши. Теперь, благодаря превосходству вашего дома, усилия фей могут быть сосредоточены на возобновлении древних договоров с человечеством. Они поверят снова и навсегда."
 POD_fae_house_event.8.a: "Время войны и время мира."

 POD_fae_house_event.9.t: "Вечные фоморы"
 POD_fae_house_event.9.desc.start: "Дом Балор проследил вашу родословную до линии ши, которые смешали свою кровь с кровью фоморов. Близится Бесконечная зима, и вам нужно провести через неё фей, независимо от того, согласны они с вашим правлением или нет. Вы подготовили ритуал слияния вашей сущности феи с могущественным духом-бэйном, чтобы создать гибрид феи и фомора - фомарха. Хрустальный глаз Балора светится тускло-красным и излучает сильный жар."
 POD_fae_house_event.9.desc.steaming_spear_of_vengeance: "Подняв [GetPODArtifact('steaming_spear_of_vengeance_link').GetName], вы слизываете горячую кровь с его лезвия, чувствуя, как вас переполняет ярость."
 POD_fae_house_event.9.desc.cauldron_of_fear: "Используя [GetPODArtifact('cauldron_of_fear_link').GetName], вы сварили отвратительное, мистическое варево и испиваете его до дна."
 POD_fae_house_event.9.desc.blood_dross: "Раздавив крошечный флакончик с кристаллизованным сахаром, вы пьёте вампирскую кровь, содержащуюся в нём, и наполняетесь тёмным гламуром."
 POD_fae_house_event.9.desc.end: "Вы открываете трод в [Concept('umbra', 'Умбру')|E], чтобы призвать нексусного ползуна.\nВ воздухе появляется чёрное мерцание, сопровождаемое пронзительным вибрирующим стоном. У вас на коже возникает ощущение, будто ногти царапают классную доску. Воздух пропитан миазматическим запахом, напоминающим о раковой болезни. Дух [Glossary('Вирма', 'glossary_wyrm_tt')] проявляется в виде отвратительного и ужасающего существа. Его когти и клыки разрывают вашу плоть, и он яростно вонзается в вашу грудную клетку. Вы испытываете мучительную боль. И затем...\nМы едины. Навсегда."
 POD_fae_house_event.9.a: "Мы - фомарх!"

 POD_fae_house_event.10.t: "[Select_CString(ROOT.Char.IsFemale, 'Воительница-целительница', 'Воин-целитель' )]"
 POD_fae_house_event.10.desc: "Как глава дома Дайреанн, вы стремились показать двойственную природу целителей и воинов. Ваша рука может исцелять, а может и вредить. Вы подобны чаше, в которой может содержаться как яд, так и противоядие, подобно лезвию, которое можно использовать для исцеления или для того, чтобы оборвать нить жизни."
 POD_fae_house_event.10.a: "[Select_CString(ROOT.Char.IsFemale, 'Воительница-целительница', 'Воин-целитель' )]." 

 POD_fae_house_event.14.t: "Проклятие Лианнан"
 POD_fae_house_event.14.desc: "Как глава дома Лианнан, вы нашли способ ослабить проклятие всей вашей династии. Вместо рапсодизации одного восторженного смертного в то время, когда он отчаянно нуждается, вы создаете большое количество стабильных смертных для сбора урожая, включая несколько отличных призов, которые переполнены гламуром. Постоянно истощая такой большой запас гламура, вы смогли ослабить действие проклятия."
 POD_fae_house_event.14.a: "Проклятие Лианнан."

 POD_fae_house_event.11.t: "Духи Руси"
 POD_fae_house_event.11.desc: "Как глава дома Варич, вы наладили прочные отношения с духами природы земли Руси. Для фей эти духи были частью всего: земли, рек, их фригольдов и бескрайней тайги, окружающей их. Вы понимаете, как угодить этим духам, а также как их использовать. Духи домашнего очага так же могущественны и полезны, как размер и великолепие их якорей, а также степень уважения, которое вы им оказываете. Обязанности дворян и слуг двояки, и Неодушевлённые готовы действовать по вашей воле."
 POD_fae_house_event.11.a: "Они - духи доброй земли."

 POD_fae_house_event.12.t: "Эдикты морфейских оракулов"
 POD_fae_house_event.12.desc.fae: "Хотя эдикты морфейских оракулов не всегда имеют смысл для членов дома, дом единодушен в следовании им. Как первородный лидер фей дома Скатах, вы отправились на поиски [UmbraGlossaryLocalized('deep_dreaming','Глубоких Грёз')] и [UmbraGlossaryLocalized('sea_of_silver','Моря серебра')], чтобы найти то, что было предсказано. Будет ли этого достаточно?"
 POD_fae_house_event.12.desc.changeling: "Хотя эдикты морфейских оракулов не всегда имеют смысл для членов дома, дом единодушен в следовании им. Как глава дома подменышей, вы строго следовали указаниям коменданта Скатах, чтобы остаться в Осеннем мире, несмотря на растущую банальность. Будет ли этого достаточно?"
 POD_fae_house_event.12.a: "Как и всегда, мы чтим морфейских оракулов."

 POD_fae_house_event.13.t: "На страже Грёз"
 POD_fae_house_event.13.desc: "Как глава дома Данаан, вы прошли множество троп через [UmbraGlossaryLocalized('dreaming','Грёзы')]. Теперь вы охраняете троды и прокладываете новые тропы. Вы служили [Select_CString(ROOT.Char.IsFemale, 'проводницей', 'проводником' )] для многих мечтателей. Своей клятвой Дракона вы снискали расположение многих химер. Вы собрали внушительную орду химер, которые ждут ваших приказов, готовые даже вторгнуться в Осенний мир по вашему зову."
 POD_fae_house_event.13.a: "На защиту тродов в Аркадию!"

 POD_fae_house_event.15.t: "Инертное холодное железо"
 POD_fae_house_event.15.desc: "«Естественные философы» ошибаются, считая, что Вселенная ограничена жесткими, поддающимися открытию законами. С помощью огромных усилий, времени, затрат и силы воли вы доказали то, о чем подозревали все алхимики, искавшие философский камень. Проводя тысячи экспериментов, вы упорствовали и в конце концов добились искомых результатов. Реальность изменяется по воле тех, у кого есть разум и уверенность в себе, чтобы реализовать свои желания. Если возможно нечто столь низменное, как легендарные поиски алхимиков, превращающих свинец в золото, то почему бы не трансмутировать холодное железо, чтобы свести на нет его свойства уничтожать бессмертные души фей. Эврика! Вы сделали это!"
 POD_fae_house_event.15.a: "Реальность такова, какой я её считаю!"

 POD_fae_house_event.16.t: "Под взором Грёз"
 POD_fae_house_event.16.desc: "Мы... нет, я [Select_CString(ROOT.Char.IsFemale, 'сделала', 'сделал' )] это.\n\nЯ [Select_CString(ROOT.Char.IsFemale, 'совершила', 'совершил' )] нечто настолько великое, что сами Грёзы оценили мои усилия и наградили меня титулом [Select_CString(ROOT.Char.IsFemale, 'дворянки', 'дворянина' )]."
 POD_fae_house_event.16.a: "Когда-то [Select_CString(ROOT.Char.IsFemale, 'простолюдинка', 'простолюдин' )], теперь [Select_CString(ROOT.Char.IsFemale, 'дворянка', 'дворянин' )]."