l_russian:
 POD_fae_misc.1.title: "Пак найден"
 POD_fae_misc.1.desc: "Вы нашли пака, которого искали."
 POD_fae_misc.1.a: "Какие у тебя большие зубы."
 POD_fae_misc.1.b: "Вот это шутник!"
 POD_fae_misc.1.c: "Котик, котик, я люблю тебя."
 POD_fae_misc.1.d: "Этот может постучать в дверь моей комнаты."
 POD_fae_misc.1.e: "Я считаю, что он хорош в соколиной охоте."
 POD_fae_misc.1.f: "С этим медведем можно и ужиться."
 POD_fae_misc.1.g: "В этом есть что-то фантастическое."
 POD_fae_misc.1.h: "До скорого, крокодил!"
 POD_fae_misc.1.i: "Такие гипнотические глаза."
 POD_fae_misc.1.j: "Повой со мной."
 POD_fae_misc.1.k: "Мне срочно нужны лабиринт и немного сыра."
 POD_fae_misc.1.l: "Идеально подходит для саней."
 POD_fae_misc.1.m: "Отличная улыбка!"
 POD_fae_misc.1.n: "Иди сюда, му-у-у!"
 POD_fae_misc.1.o: "Почему такая вытянутая морда? А, просто конское настроение, теперь понимаю."
 POD_fae_misc.1.p: "Если он меня укусит, я стану вампиром?"
 POD_fae_misc.1.q: "Мне скучно, аж до кабаньего визга."
 POD_fae_misc.1.r: "Столько глаз!"
 POD_fae_misc.1.s: "Вот этот жучок меня достаёт."
 POD_fae_misc.1.t: "Нам всем следует идти боком!"
 POD_fae_misc.1.u: "Обезьяна думает, обезьяна делает."
 POD_fae_misc.1.v: "Бззззз."
 POD_fae_misc.1.w: "Трудолюбивый маленький работник."
 POD_fae_misc.1.x: "Терпеливый охотник получает добычу."
 POD_fae_misc.1.y: "Столько ног!"
 POD_fae_misc.1.z: "Можно мне панцирь?"
 POD_fae_misc.1.aa: "Этот выглядит опасным!"
 POD_fae_misc.1.ab: "Такие нежные и красочные крылышки."
 POD_fae_misc.1.ac: "Кролики — самые устрашающие и славные животные, и вполне уместно, что у меня во дворе есть один, представляющий их."
 POD_fae_misc.1.ad: "Думаю, назову его Мягышом."
 POD_fae_misc.1.ae: "Разве я [Select_CString(ROOT.Char.IsFemale, 'искала', 'искал' )] пака? Я думаю, что нет."

 POD_fae_misc.2.t: "$POD_lilin_objective_decision$"
 POD_fae_misc.2.desc: "Актёры на месте, и у меня есть все необходимые знания, чтобы воспроизвести легенду о Лилит со мной в её роли. Грандиозное зрелище вот-вот начнётся, и скоро родится ещё одна Лилит \n\nИтак, пьеса началась, воссоздание легенды в Дальних Грёзах. Актёры играют свои роли, а я в центре. Создание первых мужчины и женщины, разрыв Лилит со своим создателем, восстание, бегство. Все основные действия разыгрываются последовательно, мы забываем о себе ради пьесы. Всё прекрасно воссоздано, всё в порядке.\n\nИ акт закончился, актёры возвращаются к своей обычной жизни. А сами Грёзы приняли нашу версию как ещё одно олицетворение того же события. И я возрождаюсь заново. Может, я и не Лилит, но я не просто лилин."
 POD_fae_misc.2.a: "Тёмный апофеоз."

 POD_fae_misc.3.t: "[Select_CString(ROOT.Char.IsFemale, 'Наставница', 'Наставник' )] человечества"
 POD_fae_misc.3.desc: "Человечество слепо к чудесному миру Грёз и может уловить лишь их осколки, когда спит. Таким образом, неудивительно, что люди сбились с верного пути и погрузились в неверие.\n\nНо, к счастью, вы были там, прежде чем человечество могло совершить серьёзную ошибку. Вы направили заблудших на верный путь, и, контролируя основные источники знаний, вы можете гарантировать, что это не повторится."
 POD_fae_misc.3.a: "Нас ждет прекрасное будущее."
 POD_fae_misc.3_custom1: "Значительно усиливает распространение культуры и даёт доступ к решению о развитии графства, если вы не принадлежите к Неблагим"


 POD_fae_misc.4.t: "Желание исполнено"
 POD_fae_misc.4.a: "Я желаю лишь служить вам."
 POD_fae_misc.4.desc_brains_wish: "Итак... вы хотите стать мозгом семьи?\n\nВаши мозги будут ближе к семье, чем вам хотелось бы."
 POD_fae_misc.4.desc_enemies_wish: "Итак... вы хотите увидеть своих врагов, прежде чем они нанесут удар?\n\nИ они нанесут удар... в вашем воображении."
 POD_fae_misc.4.desc_feared_wish: "Итак... вы хотите, чтобы вас боялись?\n\nИ поэтому они будут бояться вас и каждого вашего аспекта."
 POD_fae_misc.4.desc_marriage_wish: "Итак... вы хотите оживить свою семейную жизнь?\n\nОстрота будет, но, возможно, не в лучшую сторону."
 POD_fae_misc.4.desc_speaking_wish: "Итак... вы хотите, чтобы все ловили каждое ваше слово?\n\nИ эти слова будут висеть... если вы сможете их выговорить."
 POD_fae_misc.4.desc_dwarf_wish: "Итак... вы хотите возвышаться над врагами, словно они карлики?\n\nНо карликом станете вы сами."
 POD_fae_misc.4.desc_appearance_wish: "Итак... вы хотите привлекать к себе внимание, куда бы вы ни пошли?\n\nИ они обязательно повернутся, просто, возможно, не так, как вы этого хотите."
 POD_fae_misc.4.desc_spouse_wish: "Итак... вы хотите, чтобы ваша вторая половинка смотрела только на вас?\n\nИ видеть будут только вас."
 POD_fae_misc.4.desc_wealth_wish: "Итак... вы желаете несравненного богатства?\n\nС чем вам его сравнить?"
 POD_fae_misc.4.desc_knowledge_wish: "Итак... вы желаете знаний за пределами вашего понимания?\n\nЗнания у вас будут. Но понять их вы не сможете."
 POD_fae_misc.4.desc_conscience_wish: "Итак... вы хотите избавиться от своих тревог и вины?\n\nИзбавитесь от них, когда все ваши тайны будут раскрыты и прозвучат для всеобщего слуха."

 POD_fae_misc.400.t: "Желания исполнены"
 POD_fae_misc.400.desc: "Ваша дурная слава [Select_CString(ROOT.Char.IsFemale, 'исполнительницы', 'исполнителя' )] желаний, сбывающихся совсем не так, как ожидают просители, коснулась уже многих могущественных сверхъестественных существ.\nДаже смертные рассказывают о печально известных джиннах и их коварных уловках. Несомненно, это значительно укрепит способность джиннов противостоять разрушительному воздействию банальности."
 POD_fae_misc.400.a: "Мне это казалось естественным."