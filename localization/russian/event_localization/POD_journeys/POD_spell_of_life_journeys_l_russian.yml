 POD_mummy_elixir_of_eternal_life_journeys.27.desc: "В поисках эзотерических записей об эликсире Вечной жизни вы нашли доказательства того, что некоторые подсказки скрыты в древнем храме. Эта секта была известна своими эзотерическими учениями о математике и божественной симметрии. Согласно сохранившимся записям, они верили, что только с помощью математики можно понять, отследить или повлиять на Колесо эпох. Однако их внутренние тайны и природа этих уравнений были утеряны, когда популярность секты упала.\n\nПосле прибытия вы поняли, что храм был не более чем небольшим местом для встреч с сиденьями, расставленными вокруг ямы с песком. Напротив входа была дверь, запертая какой-то магией. Хотя большая часть песочницы была унесена ветром, перед дверью можно было увидеть несколько каменных плит, воткнутых в песок. Очистив их от песка, вы поняли, что на каждой табличке указан номер. Вы подозреваете, что вам нужно нарисовать недостающие цифры на песке между табличками.\n4 a 8\nb 5 c\n2 d 6"
