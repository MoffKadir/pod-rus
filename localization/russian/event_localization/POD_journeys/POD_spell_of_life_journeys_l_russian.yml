 POD_mummy_elixir_of_eternal_life_journeys.28.t: "Великий цикл поколений"
 POD_mummy_elixir_of_eternal_life_journeys.28.desc: "В поисках эзотерических записей об эликсире Вечной жизни вы нашли доказательства того, что некоторые подсказки скрыты в зале секты. Их древний зал, спрятанный в изолированном месте и защищённый древней магией, ныне заброшен. Вокруг него выросли деревья и растения, образующие вторую крышу над удивительно нетронутым сооружением. Лозы и трава почти служат барьером вокруг зала, останавливаясь прямо перед его стенами. Перед запечатанными воротами по кругу расположены 5 статуй. Их терракотовые тела имеют замысловатую форму и поразительно похожи на живые. Их доспехи изготовлены с любовью и окрашены в зелёный, серый, синий, красный и жёлтый цвета. Их топоры... ну, их топоры вообще не отлиты. Топоры настоящие, сделаны из рукоятки из персикового дерева и с головками из холодного железа. Вокруг оснований статуй вы видите странные потёртости, а некоторые краткие эксперименты показывают, что каждая статуя легко вращается. Над воротами висит табличка:\n«Лес превратился в бушующий ад, сменивший ночь на день. Горячие источники и магма превратились в камень, когда земля тряслась и вздымалась, как живое существо. Огромные камни врезались в землю. Мрамор и гранит превратились в железо и олово, убивая землю и отравляя воду. Огромные шахты взорвались, когда руда превратилась в воду в десять раз больше своего объёма. Озёра и реки были заглушены бесконечным пространством зелени, которую предстояло снова сжечь. И так было, когда мир был переделан. Так и случилось, когда колесо снова повернулось».\n\nКак вращать каждую статую? К какой статуе обращён каждый из них?"
 POD_mummy_elixir_of_eternal_life_journeys.28.a: "Зелёную к жёлтой. Жёлтую к синей. Синюю к красной. Красную к серой. Серую к зелёной."
 POD_mummy_elixir_of_eternal_life_journeys.28.b: "Зелёную к красной. Красную к жёлтой. Жёлтую к серой. Серую к синей. Синюю к зелёной."
 POD_mummy_elixir_of_eternal_life_journeys.28.c: "Зелёную к серой. Серую к красной. Красную к синей. Синюю к жёлтой. Жёлтую к зелёной."
 POD_mummy_elixir_of_eternal_life_journeys.28.d: "Зелёную к синей. Синюю к серой. Серую к жёлтой. Жёлтую к красной. Красную к зелёной."
 POD_mummy_elixir_of_eternal_life_journeys.28.e: "Узнаю ли я этот цикл?"
 POD_mummy_elixir_of_eternal_life_journeys.28.effect.success: "Статуи смотрят на ворота и опускают топоры вниз, открывая двери"
 POD_mummy_elixir_of_eternal_life_journeys.28.effect.failure: "Статуи смотрят на вас и поворачивают свои топоры вниз, изгоняя вас"

 POD_mummy_elixir_of_eternal_life_journeys.29.t: "Правильный порядок"
 POD_mummy_elixir_of_eternal_life_journeys.29.desc: "После обширных исследований и отправки своих агентов повсюду, вы получили 5 склянок отвара от алхимика, который несколько столетий назад стал ву-тянь. Красная склянка горит внутренним пламенем, радостно танцуя внутри стеклянных стенок. Зелёная склянка гудит с едва уловимой жизненной силой, усики раскрываются и снова скручиваются, словно медленное сердцебиение. Синяя склянка плещется с врождённой текучестью, течёт, словно часть прилива. Жёлтая склянка тяжело сидит в вашей руке, и каждую минуту вы чувствуете, как будто гора оседает. Наконец, белая склянка звенит звоном колоколов, сверкая зеркальным блеском. Если вы объедините их в правильном порядке, это принесёт существенные преимущества для вашего развития. К сожалению, из его записей сохранился лишь один отрывок:\n«Белое зелье не первое. Красное зелье находится перед жёлтым зельем. Зелёное зелье находится не перед белым, а перед жёлтым. Синее зелье должно идти вторым»."
 POD_mummy_elixir_of_eternal_life_journeys.29.a: "Красный, синий, белый, зелёный, жёлтый."
 POD_mummy_elixir_of_eternal_life_journeys.29.b: "Красный, синий, зелёный, белый, жёлтый."
 POD_mummy_elixir_of_eternal_life_journeys.29.c: "Красный, синий, зелёный, жёлтый, белый."
 POD_mummy_elixir_of_eternal_life_journeys.29.d: "Синий, красный, белый, зелёный, жёлтый."
 POD_mummy_elixir_of_eternal_life_journeys.29.e: "Хм, возможно, тот, а потом тот..."
 POD_mummy_elixir_of_eternal_life_journeys.29.effect.success: "Со вспышкой становится идеально прозрачным"
 POD_mummy_elixir_of_eternal_life_journeys.29.effect.failure: "При вспышке из него вырывается шлейф дыма"

 POD_mummy_elixir_of_eternal_life_journeys.30.t: "Странные ингредиенты"
 POD_mummy_elixir_of_eternal_life_journeys.30.desc: "После обширных исследований и отправки своих агентов повсюду вы получили древнюю книгу алхимических рецептов, хотя большинство её устаревших страниц не подлежат восстановлению. На первой странице перечислены полынь, спорыш, жемчужная пыль, паучий ихор, лунная роса, листья теневого цветка, порошок рыбы фугу, змеиная желчь, медовая вода и лягушачьи глаза. Лунная роса — особенно странный ингредиент, поскольку сама по себе представляет собой жидкую смесь нескольких других ингредиентов, и её было трудно достать. Единственный сохранившийся рецепт, похоже, был написан поэтически. Однако расшифровка может принести значительную пользу и позволить сварить очень мощный эликсир.\n\n«Пять следует отбросить.\nЧтобы начать варку, вы не должны выбирать ни один из концов\nВторой с краю — лишь один из двух поможет\nВам не понадобятся никакие существа земли\nИ только одно растение протянет руку помощи\nТри нужны тебе, и все стоят подряд\nПоследний — это порошок, выращенный в водном рассоле\nЧтобы приготовить эликсир, добавьте соседей и хорошо перемешайте по часовой стрелке\nДалее добавьте жидкость, и должны появиться пузырьки\nПоследний ингредиент посыпьте сверху и перемешайте\nТеперь пора выпить до дна»."
 POD_mummy_elixir_of_eternal_life_journeys.30.a: "Полынь, спорыш, жемчужная пыль, лунная роса, порошок рыбы фугу."
 POD_mummy_elixir_of_eternal_life_journeys.30.b: "Жемчужная пыль, лунная роса, листья теневого цветка, змеиная желчь, порошок рыбы фугу."
 POD_mummy_elixir_of_eternal_life_journeys.30.c: "Листья теневого цветка, порошок рыбы фугу, медовая вода, жемчужная пыль, лунная роса."
 POD_mummy_elixir_of_eternal_life_journeys.30.d: "Лунная роса, листья теневого цветка, порошок рыбы фугу, медовая вода, жемчужная пыль."
 POD_mummy_elixir_of_eternal_life_journeys.30.e: "Щепотка того и щепотка того..."
 POD_mummy_elixir_of_eternal_life_journeys.30.effect.success: "Со вспышкой становится идеально прозрачным"
 POD_mummy_elixir_of_eternal_life_journeys.30.effect.failure: "При вспышке он сгорает"

 POD_mummy_elixir_of_eternal_life_journeys.31.t: "Странные отвары"
 # Yes, my notes do look like this. It works... mostly
 POD_mummy_elixir_of_eternal_life_journeys.31.desc: "После обширных исследований и отправки своих агентов повсюду вы получили единственный флакон. Когда его откупоривают, из загадочной жидкости внутри поднимается коктейль ароматов, очевидно, это зелье, которое готовится. Судя по вашему опыту создания отваров и слухам, собранным вашими агентами, во флаконе не хватает только одного ингредиента. Рядом с флаконом в тайнике находился набор из 7 ингредиентов: гарнизонный корень, масло радужного платана, псионная соль, петрушка, скелетная фиалка, золотой шлемник, львиный зёв. Каждый ингредиент придаст флакону разный эффект, а добавление нескольких ингредиентов может привести к взрыву всей смеси. К сожалению, для завершения текущего эксперимента вам понадобится именно приворотное зелье. Однако все сохранившиеся записи написаны стенографически, и чернила выцвели за долгие годы, пока они оставались без присмотра. Либо так, либо автор не был обучен правильной каллиграфии.\n\nGldn ht drns fyr and prmots yin. Rnbw yl trgrs cmbstn in jain from sn. Erb tsts gud fr sup, lv it. Rd Npdrg prvd brth of fyr. Grsnrt prvnt gngrne in wuwnds. Cyon s curus rsidu frm ndrgnd lks; prmots obsshon wt tgt. Prpls eet meet dislvd bye its hcid."
 POD_mummy_elixir_of_eternal_life_journeys.31.a: "Золотой шлемник."
 POD_mummy_elixir_of_eternal_life_journeys.31.b: "Петрушка."
 POD_mummy_elixir_of_eternal_life_journeys.31.c: "Псионная соль."
 POD_mummy_elixir_of_eternal_life_journeys.31.d: "Скелетная фиалка."
 POD_mummy_elixir_of_eternal_life_journeys.31.e: "Попробовать добавить всё."
 POD_mummy_elixir_of_eternal_life_journeys.31.effect.success: "С хлопком появляется пузырь в форме сердца"
 POD_mummy_elixir_of_eternal_life_journeys.31.effect.failure: "Он поднимает облако обжигающего дыма"

 POD_mummy_elixir_of_eternal_life_journeys.32.t: "Спуск с вершины"
 POD_mummy_elixir_of_eternal_life_journeys.32.desc: "В своём последнем путешествии вы отыскали древнюю устную легенду, которая, как предполагается, содержит один из секретов вознесения. Найти рассказчика, который знал бы это, было чрезвычайно сложно и в конечном итоге привело вас к старухе. Пока её тело дрожало, ей не составило труда пересказать эту историю.\n\n«Много лет и династий назад жил практик самосовершенствования по имени Цзянь. Как и многие другие, он искал Небесные Врата, чтобы подняться за пределы смертных границ. Сто лет он медитировал на самой высокой вершине, ни разу не разговаривая ни с одной душой. Он усовершенствовал своё ядро до такой степени, что даже ветер не осмелился коснуться его. Однажды зимой духовная метель, питаемая отчаянием земли, поглотила гору. Среди безумия, но совершенно нетронутого, Цзянь достиг всего, чего искал, и наконец предстал перед Вратами. Однако ветры донесли крики голодающей деревни у подножия горы, застывшей в свирепой метели. Одним лишь шагом он мог бы подняться. Оставь их, и вознесение досталось ему. Останься, и буря поглотит большую часть его с трудом заработанного развития. Помоги им, и это будет стоить ещё дороже.\nНе раздумывая, Цзянь спустился с горы. Он дал им огненные камни, чтобы согреть их, талисманы, чтобы защитить их, и, в конце концов, своё собственное дыхание, согревающее их тела, в то время как его собственное остывает. Метель, разгневанная кражей своих жертв, обрушила на него всю свою силу, и его культивирование раскололось, как тонкий лёд. На рассвете буря мгновенно утихла, её голод был утолён не отчаянием, а подавлен щедростью. Тем не менее Врата стояли на вершине и ждали, но Цзянь больше не мог их видеть. Когда солнечный свет осветил его, его тело превратилось в пыль, и каждый из его долгих лет настигал его в мгновение ока. Последним, что исчезло, была его улыбка».\n\nКакой урок вы извлекли из этой истории?"
 POD_mummy_elixir_of_eternal_life_journeys.32.a: "Если бы он был мудрее, он мог бы помочь им и сохранить свои силы."
 POD_mummy_elixir_of_eternal_life_journeys.32.b: "Отказавшись от бессмертия, он превзошёл поиски себя."
 POD_mummy_elixir_of_eternal_life_journeys.32.c: "Видимая жертва – единственный путь к трансцендентности."
 POD_mummy_elixir_of_eternal_life_journeys.32.d: "Мир наказывает добродетель и щедрость."
 POD_mummy_elixir_of_eternal_life_journeys.32.e: "Действительно сложный вопрос."
 POD_mummy_elixir_of_eternal_life_journeys.32.effect.success: "Применение этого урока улучшит ваше собственное совершенствование"
 POD_mummy_elixir_of_eternal_life_journeys.32.effect.failure: "Кажется, этот урок не поможет вашим усилиям"

 POD_mummy_elixir_of_eternal_life_journeys.33.t: "Бессмертный и целитель"
 POD_mummy_elixir_of_eternal_life_journeys.33.desc: "В своём последнем путешествии вы отыскали древнюю устную легенду, которая, как предполагается, содержит один из секретов вознесения. Найти рассказчика, который знал бы об этом, было чрезвычайно сложно и в конечном итоге привело вас к травнику в маленьком городке. Измельчая травы и продавая сельским жителям пилюли, он пересказал историю, переданную ему от его наставника.\n\n«Много лет и династий назад один из Восьми бессмертных странствовал по землям и наткнулся на город, охваченный смертельной болезнью. Больные заполонили улицы, и среди них был алхимик, испытывавший на умирающих недоказанные эликсиры. Некоторых удалось спасти, в то время как конец других был ускорен или стал гораздо более мучительным. Когда бессмертный увидел это, он заявил: «Играть жизнью — значит игнорировать повеление Небес. Стремиться к яркому свету желаемого будущего, не заботясь о рисках, — значит поджечь лес». Одним вздохом он полностью вылечил город, но обрушил на алхимика всю причиненную им агонию. Он бродил по земле как сумасшедший, его чувства поглощала боль. Город радовался, восхваляя его милосердие.\nОднако со временем пришла ещё одна болезнь, и ни один из целителей не осмелился рискнуть ошибиться. Они цеплялись за то, что было известно, парализованные страхом. Многие из тех, кто мог бы быть спасен, вместо этого были похоронены с молитвами».\n\nКакой урок вы извлекли из этой истории?"
 POD_mummy_elixir_of_eternal_life_journeys.33.a: "Только дурак поклоняется слепо, и даже мудрые делают сомнительный выбор."
 POD_mummy_elixir_of_eternal_life_journeys.33.b: "Если бы бессмертный остался, болезнь не вернулась бы."
 POD_mummy_elixir_of_eternal_life_journeys.33.c: "Страдания — необходимая цена за прогресс."
 POD_mummy_elixir_of_eternal_life_journeys.33.d: "Стремление к знаниям порождает жестокость."
 POD_mummy_elixir_of_eternal_life_journeys.33.e: "Действительно сложный вопрос."
 POD_mummy_elixir_of_eternal_life_journeys.33.effect.success: "Применение этого урока улучшит ваше собственное совершенствование"
 POD_mummy_elixir_of_eternal_life_journeys.33.effect.failure: "Кажется, этот урок не поможет вашим усилиям"

 POD_mummy_elixir_of_eternal_life_journeys.34.t: "Сейте и пожинайте"
 POD_mummy_elixir_of_eternal_life_journeys.34.desc: "В своём последнем путешествии вы отыскали древнюю устную легенду, которая, как предполагается, содержит один из секретов вознесения. Найти рассказчика, который знал бы об этом, было чрезвычайно сложно и в конечном итоге привело вас к старому фермеру. Его спина сгорбилась, а кожа потемнела от многих лет ухода за посевами. С каждым ударом мотыги он передавал историю, которую узнал от своего деда.\n\n«После многих долгих лет боёв солдат ушёл из армии и скитался по земле. Он наткнулся на бесплодную долину, заросшую древней растительностью. Река в долине бушевала, разрывая всё на своём пути. Почва была усыпана валунами, способными сломать плуг, а металл отравил землю. Вместо того чтобы проклинать судьбу, он срубил деревья одно за другим, хотя его топор трижды сломался. Он отводил воду через терпеливо вырезанные каналы, хотя наводнения каждый сезон сводили на нет его работу. Он разбивал камни огнём и молотом, хотя его руки кровоточили. Он выщелачивал сорняки, сажая грибы и разбрасывая древесный уголь, хотя каждый сезон видел только увядание того, что было посажено.\nПрошли годы, прежде чем он посеял хоть одно семя. Многие смеялись, потому что видели только труд и никаких плодов, но он никогда не колебался. Когда наконец долина смягчилась, он посадил. Когда шли дожди, они питали, а не разрушали. С приближением осени он собрал урожай, достаточно большой, чтобы прокормить десять деревень».\n\nКакой урок вы извлекли из этой истории?"
 POD_mummy_elixir_of_eternal_life_journeys.34.a: "Всегда разрушай то, что существует, чтобы можно было построить что-то лучшее."
 POD_mummy_elixir_of_eternal_life_journeys.34.b: "Преобразуй себя, чтобы успех стал неизбежным."
 POD_mummy_elixir_of_eternal_life_journeys.34.c: "Не обращай внимания на предупреждения других, потому что они глупцы."
 POD_mummy_elixir_of_eternal_life_journeys.34.d: "Прежде чем искать власти, очисти то, что тебе мешает."
 POD_mummy_elixir_of_eternal_life_journeys.34.e: "Действительно сложный вопрос."
 POD_mummy_elixir_of_eternal_life_journeys.34.effect.success: "Применение этого урока улучшит ваше собственное совершенствование"
 POD_mummy_elixir_of_eternal_life_journeys.34.effect.failure: "Кажется, этот урок не поможет вашим усилиям"

 POD_mummy_elixir_of_eternal_life_journeys.35.t: "Забытые чудеса"
 POD_mummy_elixir_of_eternal_life_journeys.35.desc: "В поисках эзотерических записей об эликсире Вечной жизни вы нашли доказательства того, что некоторые подсказки скрыты в древнем храме. Бог или боги, которым поклонялись внутри, давно забыты. Даже его предназначение как храма является лишь предположением. Около полудня вы, наконец, добрались до храма, погребённого под бесчисленными веками зарослей леса.\n\nДвери открываются в страну вечной ночи, но не тьмы. Мерцающий свет бесчисленных звёзд разгоняет тени, оставленные деревьями, во много раз превышающими ваш собственный рост. Сквозь ветви высоко над вашей головой струится нежный свет, играя на цветущих полевых цветах. Там, где обычно ожидаются призрачные звери и где обычно прячутся скрытые хищники, есть только радостные силуэты, отбрасываемые звездами, прыгающие среди калейдоскопа цветов. Птицы, лягушки, сверчки и многие другие, которых вы не можете назвать, объединяются в гармонии, потерянной для человечества, ни одна из которых не подавляет другую, а скорее один великий оркестр, вспоминающий песню давно минувших дней.\n\nНа дальней стороне находится запертая дверь. На перемычке написано:\nЧто такое, если вы утверждаете, что имеете это, но вам этого не хватает?\nЕсли вам кажется, что вам этого недостаёт, вы можете это иметь."
 POD_mummy_elixir_of_eternal_life_journeys.35.a: "Уверенность."
 POD_mummy_elixir_of_eternal_life_journeys.35.b: "Здравомыслие."
 POD_mummy_elixir_of_eternal_life_journeys.35.c: "Мудрость."
 POD_mummy_elixir_of_eternal_life_journeys.35.d: "Смирение."
 POD_mummy_elixir_of_eternal_life_journeys.35.e: "Несёт ли окружающая среда подсказку?"
 POD_mummy_elixir_of_eternal_life_journeys.35.effect.success: "Двери распахиваются"
 POD_mummy_elixir_of_eternal_life_journeys.35.effect.failure: "Двери исчезают в деревьях"