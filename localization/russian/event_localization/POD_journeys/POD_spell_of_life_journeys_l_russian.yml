 POD_mummy_spell_of_life_journeys.36.effect.failure: "Статуя загорается"

 # I made up a name for a half man-half scorpion creature, loosely based on a minotaur and Serket (scorpion goddess of protection, healing, magic)
 POD_mummy_spell_of_life_journeys.37.t: "Страж-серкетавр"
 POD_mummy_spell_of_life_journeys.37.desc: "В поисках эзотерических записей о заклинании Жизни вы обнаружили доказательства того, что некоторые подсказки лежат внутри пирамиды. Подробности о его содержимом скудны, хотя вы слышали о его могучем хранителе. Насколько правдивы эти сказки, ещһ неизвестно.\n\nВ воздухе пропитан неестественный туман, более густой, чем любой суп, который вы съели, и странно похожий по запаху. Когда вы проходите через него, кажется, что он внезапно останавливается, словно его удерживает невидимый барьер. Перед вами простираются бесконечные волны багрового от крови песка, подсвеченного солнцем. Серебряная вершина пирамиды возвышается вдалеке, медленно опускаясь в чһрный мрамор по мере того, как вы поднимаетесь на дюны и приближаетесь всһ ближе. Запечатанная дверь окружена двумя обелисками, которые, кажется, почти поглощают солнечный свет и посылают его пульсацию по жилкам мрамора. Перед дверью стоит то, что на первый взгляд кажется гигантским мужчиной с топором, хотя песок быстро расступается, обнажая ноги скорпиона и жало ниже его талии. Когда вы приближаетесь, серкетавр преграждает вам путь и говорит.\n\n«Ты можешь сделать одно утверждение. Если это правда, я отрублю тебе голову. Если это ложь, я вспорю тебе живот»."
 POD_mummy_spell_of_life_journeys.37.a: "Ты отрубишь мне голову."
 POD_mummy_spell_of_life_journeys.37.b: "Ты вспорешь мне живот."
 POD_mummy_spell_of_life_journeys.37.c: "Ты убьёшь меня."
 POD_mummy_spell_of_life_journeys.37.d: "Я убью тебя [Select_CString(ROOT.Char.IsFemale, 'первой', 'первым' )]!"
 POD_mummy_spell_of_life_journeys.37.effect.success: "Топор отходит в сторону, позволяя вам пройти"
 POD_mummy_spell_of_life_journeys.37.effect.failure: "Топор падает туда, где вы когда-то были"

 POD_mummy_spell_of_life_journeys.38.t: "Сила отряда"
 POD_mummy_spell_of_life_journeys.38.desc: "В поисках эзотерических записей о заклинании Жизни вы нашли доказательства того, что некоторые подсказки находятся в гробнице. В то время как большинство искателей заклинания Жизни работали самостоятельно, этот кабал магов работал сообща для достижения своих целей. В то время как другие преследовали только магию заклинания Жизни, они искали более целостный подход, позволяющий улучшить тело, разум и душу. Некоторые говорят, что на них повлияли традиции, пришедшие из земель к востоку от Кемета, расположенных по торговым путям. От их работы сохранилось мало подробностей, хотя слово «акаша» появляется несколько раз, и их неудача очевидна.\n\nПоначалу кажется, что это не что иное, как яма в земле, засыпанная землей давно прошедших веков. Вы ожидали лестницу или стремянку, но вместо этого перед вами опускается пандус, изгибающийся вправо. С каждым шагом и каждым поворотом вы движетесь вниз. Шаг за шагом, поворот за поворотом вы проходите мимо резных изображений, изображающих множество сцен учёбы, пения, медитации, рукоделия, роста, танцев и многого другого. Так продолжается, пока вы проходите через ворота за воротами, пока за вами не оказываются 4 ворот. Наконец, вы предстали перед закрытыми воротами. Над ними написано несколько слов. «Говори правду, чтобы продолжить. Когда меня двое, мы лучше, чем один. Когда меня двести, мы — громкие глупцы. Когда мы движемся как единое целое, ничто не сможет противостоять нам. Когда мы движемся в противоположных направлениях, мы никуда не движемся. Что я?»"
 POD_mummy_spell_of_life_journeys.38.a: "Умы."
 POD_mummy_spell_of_life_journeys.38.b: "Быки."
 POD_mummy_spell_of_life_journeys.38.c: "Барабаны."
 POD_mummy_spell_of_life_journeys.38.d: "Колёса."
 POD_mummy_spell_of_life_journeys.38.e: "Я позволю своей интуиции вести меня."
 POD_mummy_spell_of_life_journeys.38.effect.success: "Ворота распахиваются..."
 POD_mummy_spell_of_life_journeys.38.effect.failure: "Повороты ведут только вверх"

 POD_mummy_spell_of_life_journeys.39.t: "Что остаётся?"
 # Poem by W.H. Auden from 1940. Chosen for being generally close in theme, the repeated lines (what I use for the puzzle), and its structure as a villanelle
 POD_mummy_spell_of_life_journeys.39.desc: "В поисках эзотерических записей о заклинании Жизни вы нашли доказательства того, что некоторые подсказки находятся в гробнице. Согласно легендам, гробница теперь является домом искателя, который соткал свою магию через поэзию. Он искал бессмертия. С помощью своей магии он продлил свою жизнь только для того, чтобы обнаружить присущее ей проклятие. С каждым годом уходил ещё один родственник. С каждой великой войной терялось всё больше друзей. И всё же он остался. Когда времена года шли, а листья опадали только для того, чтобы снова вырасти новыми, он отказался от поисков вечного возрождения. Он позволил времени настичь его. И теперь... теперь его могила готова для поиска в поисках бессмертия.\n\nНа вершине гробницы находится простая фраза «Бойся того, что осталось вне времени». Интерьер гробницы выполнен из простого камня, хорошо сделанного, но не богато украшенного. В конце концов вы добираетесь до длинного коридора с нажимными пластинами, каждая из которых имеет номер от 1 до 19. На дальней стороне находится гроб с 13 тусклыми драгоценными камнями. Перед нажимными пластинами стоит постамент со стихотворением.\n\n«Время скажет лишь: «Я предупреждала»,\nВремя знает только цену, которую нам придётся заплатить;\nЕсли бы я могла сказать вам, я бы дала вам знать.\n\nЕсли бы мы плакали, когда шуты дают представление,\nЕсли мы споткнёмся, когда играют музыканты,\nВремя скажет лишь: «Я предупреждала».\n\nОднако судьбы не предсказать,\nПотому что я люблю тебя больше, чем могу сказать,\nЕсли бы я могла сказать тебе, я бы дала тебе знать.\n\nВетер должен откуда-то дуть,\nДолжны быть причины, почему листья гниют;\nВремя скажет лишь: «Я предупреждала».\n\nВозможно, розы действительно хотят расти,\nВидение серьёзно намерено остаться;\nЕсли бы я могла сказать тебе, я бы дала тебе знать.\n\nПредположим, все львы встанут и уйдут,\nИ все ручьи и солдаты убегут;\n Скажет ли Время лишь: «Я предупреждала»?\nЕсли бы я могла сказать тебе, я бы дала тебе знать»."
 POD_mummy_spell_of_life_journeys.39.a: "Нажать всё, кроме пластин 3,6,9,12,15,18."
 POD_mummy_spell_of_life_journeys.39.b: "Нажать всё, кроме пластин 3,5,7,11,13,17."
 POD_mummy_spell_of_life_journeys.39.c: "Нажать всё, кроме пластин 4,6,9,12,15,19."
 POD_mummy_spell_of_life_journeys.39.d: "Нажать всё, кроме пластин 6,9,12,15,18,19."
 POD_mummy_spell_of_life_journeys.39.e: "Нажать всё, кроме пластин 1,6,9,12,15,19."
 POD_mummy_spell_of_life_journeys.39.f: "Нажать как можно больше комбинаций."
 POD_mummy_spell_of_life_journeys.39.effect.success: "Драгоценные камни светятся, а крышка откидывается в сторону"
 POD_mummy_spell_of_life_journeys.39.effect.failure: "Плиты падают в лаву"

 POD_mummy_spell_of_life_journeys.40.t: "Путь в ад"
 POD_mummy_spell_of_life_journeys.40.desc: "В поисках эзотерических записей о заклинании Жизни вы обнаружили доказательства того, что в затерянной пирамиде можно найти несколько подсказок. Некоторые говорят, что древние пирамиды собирали солнечный свет на своей вершине, используя его для создания реки света, по которой душа могла следовать в загробную жизнь. Однако не все считали солнечный свет лучшим путем в Загробный мир. Некоторые пытались направить темные энергии из глубоких подземелий, используя их в своих неудачных попытках создать заклинание Жизни. Они построили перевёрнутую пятиугольную пирамиду, которая вдавилась очень глубоко в скалу. Слухи также говорят об их одержимости ролью нумерологии в магических ритуалах, включая конкретную серию, которая служила их опознавательным знаком.\n\nВы проходите мимо входа и смотрите в пустую пустоту с пятью лестницами, ведущими вниз. Огромное пространство наполнено пустым эхом, отражающимся бесконечно. Тёмная пустота скрывает странные каналы, высеченные в почерневшем камне, образующем стены пирамиды. Стигийские цепи с серебряными прожилками толще ствола дерева тянутся от потолка до пола и ключевых точек стен. На каждом из 5 этажей нанесён ряд цифр.\n13\n1113\n3113\n132113\n1113122113\n\nВ самой нижней точке пирамиды находится треугольный алтарь, соединённый с каналами вдоль стен. По бокам алтаря расположены три кнопки, каждая с номером от 1 до 3."
 POD_mummy_spell_of_life_journeys.40.a: "Нажать «132»."
 POD_mummy_spell_of_life_journeys.40.b: "Нажать «213»."
 POD_mummy_spell_of_life_journeys.40.c: "Нажать «212323132132»."
 POD_mummy_spell_of_life_journeys.40.d: "Нажать «111311121113»."
 POD_mummy_spell_of_life_journeys.40.e: "Нажать «311311222113»."
 POD_mummy_spell_of_life_journeys.40.f: "Я позволю своей интуиции вести меня."
 POD_mummy_spell_of_life_journeys.40.effect.success: "Когда каналы светятся, на алтаре появляются слова"
 POD_mummy_spell_of_life_journeys.40.effect.failure: "Когда каналы светятся, вы оказываетесь в другом месте"

 POD_mummy_spell_of_life_journeys.41.t: "Рассыпающиеся камни"
 POD_mummy_spell_of_life_journeys.41.desc: "В поисках эзотерических записей о заклинании Жизни вы обнаружили доказательства того, что некоторые подсказки можно найти на месте ритуала искателя, который исчез после завершения своей версии заклинания Жизни. От этой гробницы осталось меньше, чем почти от любого другого места, которое вы посетили. Туман кружится в воздухе, образуя росу на ваших руках. Воздух пропитан озоном, забивающим ноздри. Растения скрипят, а звуки животных мягко доносятся до ваших ушей, словно с большого расстояния. Когда вы проходите мимо, папоротники наклоняются под вашими ногами, а затем медленно поднимаются позади вас, удаляя все следы вашего пути. Природа настигла некогда величественный храм. Замковые камни колонн лежат среди корней деревьев, возможно, существовавших ещё до вас. Резные каменные кирпичи рушатся с каждым шагом. В конце концов, вы достигаете того, что когда-то было фундаментом гробницы, но теперь представляет собой круг потрескавшихся камней. В центре — полупрозрачный мужчина неразличимого возраста, который, кажется, сидит на невидимом стуле.\n\n«Ах, немногие глупцы добираются до этого места. Давно прошло с тех пор, как их видели. Ответь на мою загадку, и я дам тебе то, что ты [Select_CString(ROOT.Char.IsFemale, 'искала', 'искал' )] в своей глупости. Магу столько же лет, сколько будет колдуну, когда магу будет вдвое больше, чем было колдуну, когда возраст мага составлял половину суммы их нынешних возрастов. Сколько лет каждому?»"
 POD_mummy_spell_of_life_journeys.41.a: "Магу 30. Колдуну 20."
 POD_mummy_spell_of_life_journeys.41.b: "Магу 60. Колдуну 20."
 POD_mummy_spell_of_life_journeys.41.c: "Магу 45. Колдуну 30."
 POD_mummy_spell_of_life_journeys.41.d: "Магу 60. Колдуну 45."
 POD_mummy_spell_of_life_journeys.41.e: "Я позволю своей интуиции вести меня."
 POD_mummy_spell_of_life_journeys.41.effect.success: "«Тайна, которую ты ищешь, это...»"
 POD_mummy_spell_of_life_journeys.41.effect.failure: "«Оставь меня ждать глупца, достойного моих тайн»"

 POD_mummy_spell_of_life_journeys.42.t: "Загадочные глифы"
 # Symbols CK3 supports that resemble hieroglyphs 𓋴 𓊪 𓉔 𓇋 𓈖 𓐍 which spell out solution
 # Also, only SPHINX has right number of letters without repeating characters
 # Finally, it's a riddle so of course the answer is SPHINX
 POD_mummy_spell_of_life_journeys.42.desc: "В поисках эзотерических записей о заклинании Жизни вы обнаружили свидетельства того, что некоторые подсказки можно найти среди руин древнего храма. Вы пришли и обнаружили, что храм похоронен, а остатки его крыши хрустят под вашими ногами. Всһ, что осталось видимым, — это одинокий обелиск, каким-то образом оставшийся нетронутым с течением времени. Золотой пик словно улавливает солнечный свет, прежде чем перенаправить его вам в глаза, ещһ больше подчеркивая блеск камня: маленькие точки кристалла отражают свет во всех направлениях. На основании обелиска находится мемориальная доска.\n\n«Говори, искатель, и тщательно выбирай слово\nИбо истина — это свет, который отвечает только достойным.\nПроизнеси правильное слово и осветись его сиянием\nНо произнеси ложь, и тьма навсегда отберһт твой шанс.\n∫ ο љ ₫ …  ҈»"
 POD_mummy_spell_of_life_journeys.42.a: "ГОР"
 POD_mummy_spell_of_life_journeys.42.b: "КЕМЕТ"
 POD_mummy_spell_of_life_journeys.42.c: "ОСИРИС"
 POD_mummy_spell_of_life_journeys.42.d: "СФИНКС"
 POD_mummy_spell_of_life_journeys.42.e: "Я позволю своей интуиции вести меня."
 POD_mummy_spell_of_life_journeys.42.effect.success: "Свет обелиска освещает вас, раскрывая..."
 POD_mummy_spell_of_life_journeys.42.effect.failure: "Золотая вершина чернеет, прежде чем рассыпаться"

 POD_mummy_spell_of_life_journeys.43.t: "Потерянные места"
 POD_mummy_spell_of_life_journeys.43.desc: "В поисках эзотерических записей о заклинании Жизни вы обнаружили доказательства того, что некоторые подсказки можно найти на месте ритуала искателя, который исчез после завершения своей версии заклинания Жизни. В большей степени, чем в любом другом месте, которое вы посетили, здесь мало что осталось от того, чем оно когда-то было. Даже ваши острые чувства не смогут сказать, что когда-то находилось на этом месте. Туман кружится в воздухе, образуя росу на ваших руках. Воздух пропитан озоном, забивающим ноздри. Растения скрипят, а звуки животных мягко доносятся до ваших ушей, словно с большого расстояния. Когда вы проходите мимо, папоротники наклоняются под вашими ногами, а затем медленно поднимаются позади вас, удаляя все следы вашего пути. История пошла дальше, оставив это место заброшенным. Магия струится в воздухе, пульсируя, как сердцебиение. Тем не менее, это кажется вялым. В центре поля полупрозрачный мужчина неразличимого возраста, кажется, сидит на невидимом стуле.\n\n«Ах, немногие глупцы добираются до этого места. Давно прошло с тех пор, как их видели. Ответь на мою загадку, и я дам тебе то, что ты [Select_CString(ROOT.Char.IsFemale, 'искала', 'искал' )] в своей глупости. Что летает и не может стоять на месте? Что пожирает всё, к чему прикасается, но ничего не ест? Что никогда нельзя одолжить, но всегда тратится впустую? Что всегда тратится, но никогда не зарабатывается?»"
 POD_mummy_spell_of_life_journeys.43.a: "Смерть."
 POD_mummy_spell_of_life_journeys.43.b: "Время."
 POD_mummy_spell_of_life_journeys.43.c: "Ветер."
 POD_mummy_spell_of_life_journeys.43.d: "Богатство."
 POD_mummy_spell_of_life_journeys.43.e: "Я позволю своей интуиции вести меня."
 POD_mummy_spell_of_life_journeys.43.effect.success: "«Тайна, которую ты ищешь, это...»"
 POD_mummy_spell_of_life_journeys.43.effect.failure: "«Оставь меня ждать глупца, достойного моих тайн»"

 POD_mummy_spell_of_life_journeys.44.t: "Древние залы"
 POD_mummy_spell_of_life_journeys.44.desc: "В поисках эзотерических записей о заклинании Жизни вы обнаружили доказательства того, что некоторые подсказки можно найти в древней крепости. По мере вашего приближения перед вами встают могучие вершины, словно стремящиеся постичь бессмертие богов. Вы идёте по тому, что когда-то было дорогой, а теперь представляет собой поле, где вдалеке свалены несколько оставшихся каменных кирпичей как часть забора. В ваших книгах утверждается, что раньше это был оживлённый торговый путь, ведущий к шахтерскому городу, охраняемому цитаделью среди гор. Трудно представить себе большие караваны, когда видишь только траву. В самом городе осталось немного больше, чем гнилая древесина, остальное забрали те, кто остался в этом районе. Некогда величественная лестница, высеченная внутри горы, ведущая в крепость, теперь неотличима от заброшенной шахты. Даже сама лестница была разрушена, оставив то, что можно смело назвать пандусом. Каждый шаг эхом отражается от изогнутых стен, подпрыгивая в тишине. Наверху находятся ворота, уже не украшенные, как когда-то, но всё ещё стоящие. Узоры, когда-то кропотливо вырезанные на нём, стерлись, краска потускнела, золотые украшения были украдены. Тем не менее, дверь и её вывеска остались.\n\n«Меня никогда не было, но я всегда наступлю; никто не видел меня и никогда не увидит; никому не принадлежу, но тебе подвластно моё течение. И всё же я — уверенность всех, кто живёт и дышит в этом священном зале»."
 POD_mummy_spell_of_life_journeys.44.a: "Надежда."
 POD_mummy_spell_of_life_journeys.44.b: "Время."
 POD_mummy_spell_of_life_journeys.44.c: "Завтра."
 POD_mummy_spell_of_life_journeys.44.d: "Душа."
 POD_mummy_spell_of_life_journeys.44.e: "Я позволю своей интуиции вести меня."
 POD_mummy_spell_of_life_journeys.44.effect.success: "Двери скрипят..."
 POD_mummy_spell_of_life_journeys.44.effect.failure: "Двери остаются закрытыми, непреклонными"

 POD_mummy_spell_of_life_journeys.45.t: "Забытые неудачи"
 # § - a whole is 1 so this represents 1
 # Ð - life and death are 2 things so 2
 # ß - 3 things so 3
 # Ǿ - 4 cardinal directions so 4
 # Ѭ - 5 fingers in a fist so 5
 # 5x5 Sudoku puzzle with unicode characters with the completed grid being:
 # 2 1 3 4 5
 # 4 2 5 3 1
 # 5 3 4 1 2
 # 1 4 2 5 3
 # 3 5 1 2 4
 POD_mummy_spell_of_life_journeys.45.desc: "В поисках эзотерических записей о заклинании Жизни вы обнаружили доказательства того, что некоторые подсказки можно найти в некоторых руинах, хотя никто не помнит предназначения этого места. Мощёные дорожки изрезаны прожилками травы. Когда-то величественные колонны лежали разбитыми на земле. Мало что осталось от того места, где когда-то гордо развевались знамена. Стены обветшали, обрушились по всей конструкции и ещё больше скрыли то, чем она была когда-то. Внушительный зал, кажется, предназначен для того, чтобы направлять людей к определённой точке. На каждом шагу вы проходите мимо замысловатых фресок и детальной резьбы, лежащих среди грязи на земле. На нескольких отдельных плитках есть символы, а на некоторых камнях — полные предложения. «§ Я — источник, Вселенная, неразделимое целое §» — говорит первый камень, с которым вы столкнулись. Второй читается «Ð Я властелин, хозяин жизни и смерти Ð». Так продолжается «ß Я всё, что есть, было и будет ß» и «Ǿ Я главное направление на планете, символ ложной свободы Ǿ». Далее вы видите ещё один камень. «Ѭ Я — хватка существования, удерживаемая в кулаке Ѭ». Любопытно, как некоторые символы узнаваемы, в то время как другие сбивают вас с толку.\n\nСо временем вы достигаете врат, запечатанных магией и силой смертных. На дверях грубо вырезаны слова «И так дворец мира становится тюрьмой для глупцов», за которым следует сетка с некоторыми пропущенными символами. Чтобы продолжить, вам нужно будет разместить упавшие плитки в нужных местах.\n\n Ð (a) ß (b) Ѭ \n(c) Ð  Ѭ  ß (d)\n Ѭ (e) Ǿ (f) Ð \n §  Ǿ  Ð  Ѭ (g)\n ß  Ѭ (h) Ð (i)"
 POD_mummy_spell_of_life_journeys.45.a: "a=§, b=Ǿ, c=Ǿ, d=§, e=ß, f=§, g=ß, h=§, i=Ǿ"
 POD_mummy_spell_of_life_journeys.45.b: "a=§, b=§, c=§, d=§, e=§, f=§, g=§, h=§, i=§"
 POD_mummy_spell_of_life_journeys.45.c: "a=§, b=Ð, c=Ð, d=§, e=Ǿ, f=§, g=Ǿ, h=§, i=Ð"
 POD_mummy_spell_of_life_journeys.45.d: "a=Ð, b=§, c=§, d=Ð, e=Ǿ, f=Ð, g=Ǿ, h=§, i=Ð"
 POD_mummy_spell_of_life_journeys.45.e: "a=ß, b=ß, c=§, d=Ð, e=Ð, f=ß, g=Ð, h=ß, i=§"
 POD_mummy_spell_of_life_journeys.45.effect.success: "Ворота с грохотом открываются..."

 POD_mummy_spell_of_life_journeys.46.t: "Забытые неудачи"
 POD_mummy_spell_of_life_journeys.46.desc: "После выбора ответа из стен и места за дверями доносится скрежет, лязг и разрушение. Двери, возможно, и распахиваются, но у вас возникает ощущение, что эти древние механизмы не сработали должным образом с вашим неверным ответом.\n\nВойдя в комнату, вы видите два красных шара, слабо светящиеся среди теней. Под ними два клыка свисают с губ, искривленных в хищной улыбке. «Освобождение всегда было вопросом времени. Эти смертные глупцы никогда не могли принять мою новую, славную форму и не могли понять, что у меня есть целая вечность, чтобы они вымерли. Они никогда не понимали, какой силой я сейчас обладаю, что я действительно являюсь хозяином жизни и смерти, каким МНЕ ВСЕГДА БЫЛО ПРЕДНАЗНАЧЕНО БЫТЬ! СЕЙЧАС, сейчас...», - говорит искажённое, истощённое тело, карабкаясь к вам. «Ты наделишь меня силой, чтобы я мог занять своё законное место ХОЗЯИНА этого мира! Всё, что мне нужно от тебя, это такая мелочь: твоя жизнь. Но не волнуйся, я позабочусь о том, чтобы мои прихожане почитали тебя как [Select_CString(ROOT.Char.IsFemale, 'мученицу', 'мученика' )]». Эти блестящие клыки бросаются на вас..."
 POD_mummy_spell_of_life_journeys.46.a: "Я низвергну глупца."
 POD_mummy_spell_of_life_journeys.46.effect.success: "Его голова опрокидывается"
 POD_mummy_spell_of_life_journeys.46.effect.failure: "Вы победили, но какой ценой"




 POD_mummy_elixir_of_eternal_life_journeys.10.t: "Размышления о вечности"
 POD_mummy_elixir_of_eternal_life_journeys.10.desc: "Только посредством медитации мы можем по-настоящему понять цикл перерождений.\n\nХотя это означает пренебрежение другими моими обязанностями, уединившись для медитации, я могу больше узнать о себе и о том, как достичь вечного перерождения."
 POD_mummy_elixir_of_eternal_life_journeys.10.a: "[ROOT.Char.Custom('ResidenceBuilding')] станет местом моего уединения."
 POD_mummy_elixir_of_eternal_life_journeys.10.b: "Я найду место среди дикой природы."
 POD_mummy_elixir_of_eternal_life_journeys.10.c: "Я уйду в изолированное место."
 POD_mummy_elixir_of_eternal_life_journeys.10.a.tt: "Вместо того, чтобы начинать [Concept('journey', 'странствие')|E], вам следует помедитировать здесь, в #P безопасном и простом#! месте"
 POD_mummy_elixir_of_eternal_life_journeys.10.b.tt: "Вы начнёте [Concept('journey', 'странствие')|E] #bold $elixir_of_eternal_life_stage2_meditation_name$#!, отправившись в #Z умеренно сложное#! место для медитации"
 POD_mummy_elixir_of_eternal_life_journeys.10.c.tt: "Вы начнёте [Concept('journey', 'странствие')|E] #bold $elixir_of_eternal_life_stage2_meditation_name$#!, отправившись в #N трудное и опасное#! место для медитации"
 POD_mummy_elixir_of_eternal_life_journeys.10.success: "Ваше совершенствование даёт некоторое понимание"
 POD_mummy_elixir_of_eternal_life_journeys.10.failure: "Ваша медитация не даёт никаких прозрений"

 POD_mummy_elixir_of_eternal_life_journeys.11.t: "Размышления о вечности"
 POD_mummy_elixir_of_eternal_life_journeys.11.desc: "Путешествуя среди дикой природы, я [Select_CString(ROOT.Char.IsFemale, 'обнаружила', 'обнаружил' )], что мой разум не скован и свободен блуждать. Благодаря посту и медитации мои мысли обратились внутрь себя. Я [Select_CString(ROOT.Char.IsFemale, 'обдумала', 'обдумал' )] всё, что [Select_CString(ROOT.Char.IsFemale, 'узнала', 'узнал' )]. Я [Select_CString(ROOT.Char.IsFemale, 'работала', 'работал' )] над укреплением своей базы совершенствования и углублением своего понимания вечного возрождения."
 POD_mummy_elixir_of_eternal_life_journeys.11.a: "Перебои создавали некоторые трудности..."
 POD_mummy_elixir_of_eternal_life_journeys.11.a.success.critical: "Но это ускользнуло из моего сознания, как вода по стеклу"
 POD_mummy_elixir_of_eternal_life_journeys.11.a.success: "Но я [Select_CString(ROOT.Char.IsFemale, 'преодолела', 'преодолел' )] их"
 POD_mummy_elixir_of_eternal_life_journeys.11.a.failure: "И помешали мне обрести внутренний покой"
 POD_mummy_elixir_of_eternal_life_journeys.11.a.failure.critical: "И бесконечная какофония загнала меня в тупик"
 POD_mummy_elixir_of_eternal_life_journeys.11.b: "Само странствие и изоляция представляли собой некоторые трудности..."
 POD_mummy_elixir_of_eternal_life_journeys.11.b.success.critical: "Но лишение дало мне прозрение"
 POD_mummy_elixir_of_eternal_life_journeys.11.b.success: "Но я [Select_CString(ROOT.Char.IsFemale, 'преодолела', 'преодолел' )] их"
 POD_mummy_elixir_of_eternal_life_journeys.11.b.failure: "И заставили меня отступить в убежище"
 POD_mummy_elixir_of_eternal_life_journeys.11.b.failure.critical: "И мои губы быстро треснули от жажды"
 POD_mummy_elixir_of_eternal_life_journeys.11.internal: "Ваш опыт медитации и владения своим телом увеличивает ваши шансы на критический успех и снижает вероятность критических неудач"

 POD_mummy_elixir_of_eternal_life_journeys.21.t: "[Concept('translation_minigame', 'Перевод')|E] эзотерических записей"
 POD_mummy_elixir_of_eternal_life_journeys.21.desc: "Ваши усилия привели к неким эзотерическим записям неизвестного возраста. Несмотря на ваше знание нескольких языков и лингвистические способности ваших придворных, ваших совместных усилий оказалось недостаточно, чтобы расшифровать их. Невидимые чернила скрывают важные детали. Зашифрованные слова испещряют текст. Части, написанные на знакомом языке, с трудом поддаются интерпретации и требуют технического и магического мастерства, которого вы только начинаете достигать. Авторские сокращения только ещё больше усложняет ваши усилия по переводу.\n\nОдно конкретное слово из пяти букв, похоже, является ключом к переводу остальной части. К сожалению, у вас будет только 6 возможностей, поскольку ваши усилия весьма разрушительны."
 POD_mummy_elixir_of_eternal_life_journeys.21.b: "Я сдаюсь!"
 POD_mummy_elixir_of_eternal_life_journeys.21.effect.success: "Ваш перевод успешен"
 POD_mummy_elixir_of_eternal_life_journeys.21.effect.failure: "Ваш перевод не удался"
 POD_mummy_elixir_of_eternal_life_journeys.21.effect.failure.details: "Ваши неудачные попытки уничтожили записи"

 POD_mummy_elixir_of_eternal_life_journeys.22.t: "Залы бесконечного отражения"
 POD_mummy_elixir_of_eternal_life_journeys.22.desc:0 "Благодаря своим изысканиям и исследованиям вы открыли древнюю технику, помогающую в совершенствовании: Залы бесконечного отражения. Если вы расположитесь в центре ритуальной формации из зеркал, сила внутри вас будет много раз отражаться сама по себе, прежде чем снова войти в ваше тело. Эта сила будет ещё больше усиливаться по мере того, как она проходит через геометрические формы, используемые для построения формации.\n\nКогда вы размещаетесь в ядре формации, вы видите два зеркала, установленных почти друг напротив друга, так что вы можете видеть себя через плечо, бесконечно [Select_CString(ROOT.Char.IsFemale, 'изгибающуюся', 'изгибающегося' )] во вселенную внутри зеркала. Когда вы обращаете взгляд внутрь себя, вы можете почувствовать, как вы вливаетесь в себя, умножаясь посредством бесконечных отражений. С точки зрения постороннего было бы практически невозможно определить, где заканчиваются зеркала и начинается вы.\n\nПоначалу всё идёт хорошо. Ваше совершенствование продвигается семимильными шагами. Затем вы чувствуете, что трескаетесь и разбиваетесь на бесконечные осколки, каждый из которых является фрактальным отражением вашей формы, а затем растекается по посеребрённой поверхности зеркала перед вами. Когда вы просыпаетесь, перед вами расстилается многослойный серебристый мир, идеально гладкий, совершенно бесконечный. На каждом шагу есть ваше отражение, идеальное, но иллюзорное, отражающее вас, но у каждого своё выражение, уникальное даже среди всех остальных. Нет двух одинаковых улыбок и нет двух одинаковых хмурых взглядов. Они не двигаются, когда вы проходите среди них и сквозь них, а лишь поворачиваются, чтобы их глаза могли следовать за вами. Сквозь удивление и панику на ум приходит старая история Зеркального мира. «Только найдя настоящее, можно выбраться из тюрьмы собственного отражения»."
 POD_mummy_elixir_of_eternal_life_journeys.22.a: "Указать на себя."
 POD_mummy_elixir_of_eternal_life_journeys.22.b: "Попробовать найти несовершенную копию."
 POD_mummy_elixir_of_eternal_life_journeys.22.c: "Закрыть глаза и пробежаться по копиям."
 POD_mummy_elixir_of_eternal_life_journeys.22.d: "Искать узоры и формы."
 POD_mummy_elixir_of_eternal_life_journeys.22.e: "Помню ли я ещё что-нибудь из этой истории?"
 POD_mummy_elixir_of_eternal_life_journeys.22.effect.success: "Отражения разбиваются, растворяясь в вас"
 POD_mummy_elixir_of_eternal_life_journeys.22.effect.failure: "Вы проходите через множество отражений, прежде чем сбежать"

 POD_mummy_elixir_of_eternal_life_journeys.23.t: "Тайник с пилюлями"
 POD_mummy_elixir_of_eternal_life_journeys.23.desc: "Ваша последняя экспедиция привела вас к тайнику с четырьмя лекарственными пилюлями, оставленным кем-то, кто ранее искал эликсир Вечной жизни. Среди остатков заметок вы узнаёте, что вы бы получили большую пользу, если бы принимали ровно по одной пилюле каждого из двух типов каждый день. Однако приём слишком большого количества какого-либо одного типа сведёт на нет преимущества. К сожалению, пилюли смешаны в одном флаконе, не имеют маркировки и выглядят одинаково. Как убедиться, что вы принимаете правильные пилюли?"
 POD_mummy_elixir_of_eternal_life_journeys.23.a: "Принять 3 пилюли в первый день и 1 во второй день."
 POD_mummy_elixir_of_eternal_life_journeys.23.b: "Приняит по 1 случайной пилюле каждый день, чтобы избежать штрафа."
 POD_mummy_elixir_of_eternal_life_journeys.23.c: "Съесть по 1 половине каждой пилюли каждый день."
 POD_mummy_elixir_of_eternal_life_journeys.23.d: "Растолочь 2 пилюли, смешать их и принимать каждый день."
 POD_mummy_elixir_of_eternal_life_journeys.23.e: "Принимать по 2 случайные пилюли каждый день."
 POD_mummy_elixir_of_eternal_life_journeys.23.effect.success: "Пилюли улучшают ваше совершенствование"
 POD_mummy_elixir_of_eternal_life_journeys.23.effect.failure: "После сильной рвоты вы не видите никакой пользы"

 POD_mummy_elixir_of_eternal_life_journeys.24.t: "Числа на песке"
 POD_mummy_elixir_of_eternal_life_journeys.24.desc: "В поисках эзотерических записей об эликсире Вечной жизни вы нашли доказательства того, что некоторые подсказки скрыты в древнем храме. Эта секта была известна своими эзотерическими учениями о математике и божественной симметрии. Согласно сохранившимся записям, они верили, что только с помощью математики можно понять, отследить или повлиять на Колесо эпох. Однако их внутренние тайны и природа этих уравнений были утеряны, когда популярность секты упала.\n\nПосле прибытия вы поняли, что храм был не более чем небольшим местом для встреч с сиденьями, расставленными вокруг ямы с песком. Напротив входа была дверь, запертая какой-то магией. Хотя большая часть песочницы была унесена ветром, перед дверью можно было увидеть несколько каменных плит, воткнутых в песок. Очистив их от песка, вы поняли, что на каждой табличке указан номер. Вы подозреваете, что вам нужно нарисовать недостающие цифры на песке между табличками.\na 1 b\n3 5 7\nc 9 d"
 POD_mummy_elixir_of_eternal_life_journeys.24.a: "a=8, b=6, c=4, d=2"
 POD_mummy_elixir_of_eternal_life_journeys.24.b: "a=6, b=8, c=2, d=4"
 POD_mummy_elixir_of_eternal_life_journeys.24.c: "a=5, b=9, c=5, d=1"
 POD_mummy_elixir_of_eternal_life_journeys.24.d: "a=-1, b=3, c=7, d=11"
 POD_mummy_elixir_of_eternal_life_journeys.24.e: "Я пробьюсь силой."
 POD_mummy_elixir_of_eternal_life_journeys.24.effect.success: "Магия развеивается, и перед вами открывается путь"
 POD_mummy_elixir_of_eternal_life_journeys.24.effect.failure: "Магия взрывается, уничтожая всё, что было внутри"

