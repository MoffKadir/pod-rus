 POD_mummy_spell_of_life_journeys.10.t: "Уроки Упуаута"
 POD_mummy_spell_of_life_journeys.10.desc: "Упуаут не владеет заклинанием Жизни. Однако он знает о нём достаточно, чтобы дать некоторые идеи, которые помогут вашим собственным усилиям. Мало что может помочь лучше, чем услышать тот же материал от другого человека.\n\nТаким образом, вы разыскали Упуаута и нашли его среди кружащихся песков Африки. Когда-то он был одним из величайших воинов Безмолвных странников, кровным братом Шу Гора и дипломатом шемсу-геру. Он помогал своему народу вести великие битвы против культа Сутеха на землях Кхема. Теперь он живёт среди руин своего народа в чужой стране, отрезанный от духов своих предков проклятием Сета. Он пытался обмануть проклятие, служа Гору, но дух Совы наказал его за нарушение замысла Геи. Ему остаётся попытаться сохранить историю и знания своего народа в той, хотя и вечной, жизни, которая у него осталась. Как единственный, кто способен слышать предков племени, он существует между жизнью и смертью, направляя свой народ, общаясь с духами на их племенной родине и пытаясь воскресить воспоминания об их былой славе со времён Кхема.\n\nСреди знаний Упуаута есть несколько фрагментов, касающихся заклинания Жизни. Однако он безмерно лоялен к Гору, который запрещает делиться такими подробностями. Кроме того, его история заставила его недоверчиво относиться к незнакомцам. Вам нужно будет убедить его научить вас."
 POD_mummy_spell_of_life_journeys.10.a: "Пожалуйста, научи меня как коллегу-[Select_CString(ROOT.Char.IsFemale, 'учёную', 'учёного' )]."
 POD_mummy_spell_of_life_journeys.10.b: "Что, если я помогу твоему народу?"
 POD_mummy_spell_of_life_journeys.10.c: "Гор дал мне разрешение"
 POD_mummy_spell_of_life_journeys.10.effect.success.desc: "Вам удалось его убедить"
 POD_mummy_spell_of_life_journeys.10.critical.failure.effect.desc: "Вам не удалось его переубедить"

 POD_mummy_spell_of_life_journeys.11.t: "Уроки Миларепы"
 POD_mummy_spell_of_life_journeys.11.desc: "Миларепа не владеет заклинанием Жизни. Однако он знает о нём достаточно, чтобы дать некоторые идеи, которые помогут вашим собственным усилиям. Мало что помогает лучше, чем услышать тот же материал от другого человека.\n\nТаким образом, вы разыскали Миларепу и нашли его среди высоких вершин Гималаев. Когда-то Хетамон был философом и магом при дворе Осириса, обращённым ради сохранения своих умений. Один из немногих потомков Осириса, переживших битву у Месты, Хетамон повёл Детей Осириса в духовное путешествие на восток, следуя по стопам собственного путешествия Осириса. Когда Осирис вернулся, он пришёл с учением Бардо, и поэтому Хетамон искал тот же источник просветления. Своего учителя сопровождал поэт-колдун Миларепа, ученик Хетамона. Отдыхая в Гималаях, Миларепа помог Звездочётам, друзьям Безмолвных странников и племени друга Миларепы Юстиниана, убить зверя, называемого нексусным ползуном и в конце концов достиг собственного просветления, состояния под названием Голконда.\n\nБлагодаря работе вместе с мистиками шемсу-геру и культом Исиды, он узнал некоторые фрагменты, касающиеся заклинания Жизни. Однако он предан силам Осириса, и он считает, что многие сверхъестественные существа в лучшем случае заблуждаются. Вам нужно будет доказать, что вы соответствуете его этическим, интеллектуальным и метафизическим стандартам."
 POD_mummy_spell_of_life_journeys.11.a: "Позволь мне медитировать рядом с тобой."
 POD_mummy_spell_of_life_journeys.11.b: "Ничто не сравнится с настоящей философской дискуссией."

 POD_mummy_spell_of_life_journeys.12.t: "Уроки Астрохена"
 POD_mummy_spell_of_life_journeys.12.desc: "Астрохен не владеет заклинанием Жизни. Однако он знает о нём достаточно, чтобы дать некоторые идеи, которые помогут вашим собственным усилиям. Мало что поможет лучше, чем услышать тот же материал от другого человека.\n\nТаким образом, вы разыскали Астрохена и нашли его прячущимся среди зыбучих песков Африки. Когда-то Астрохен был магом в землях Кхема, искавшим бессмертия. В своём высокомерии он приказал Гору использовать на нём заклинание Жизни, что закончилось плохо. После многих лет поисков он наткнулся на записи другого мага, называющего себя Гермесом. Используя все свои ресурсы, чтобы следовать по давно мёртвому следу, Астрохен в конце концов нашёл «Гермеса», которым оказался Кабир, маг, который, по-видимому, изобрёл (или украл) заклинание Жизни. Когда Гор обнаружил, что Астрохен обрёл бессмертие, он проклял его, обязав вечно защищать мощные артефакты Гора и искать дополнительные артефакты, нуждающиеся в защите. Собственная любовь Астрохена к тайнам и скрытым знаниям усилила проклятие, гарантируя, что он провёл бесчисленные столетия в поисках древних фолиантов и скрытых сил. Мораль никогда не имела для него большого значения.\n\nСреди этих тайн есть несколько фрагментов, касающихся заклинания Жизни. Кроме проклятия, его ничто не связывает с Гором. Если вы удовлетворите нужды проклятия и временно облегчите его бремя, он, возможно, согласится расстаться с некоторыми лакомыми кусочками информации."
 POD_mummy_spell_of_life_journeys.12.a: "У меня есть своя коллекция."
 POD_mummy_spell_of_life_journeys.12.b: "Я могу профинансировать твои усилия."
 POD_mummy_spell_of_life_journeys.12.c: "Я отказываюсь помогать такому человеку."
 POD_mummy_spell_of_life_journeys.12.effect.success.desc: "Вы побеждаете Астрохена и совершаете набег на его хранилища"
 POD_mummy_spell_of_life_journeys.12.critical.failure.effect.desc: "Он отражает ваше нападение"

 POD_mummy_spell_of_life_journeys.13.t: "Уроки Инаухатена"
 POD_mummy_spell_of_life_journeys.13.desc: "Инаухатен не владеет заклинанием Жизни. Однако он знает о нём достаточно, чтобы дать некоторые идеи, которые помогут вашим собственным усилиям. Мало что может помочь лучше, чем услышать тот же материал от другого человека.\n\nТаким образом, вы разыскали Инаухатена и нашли его среди множества скрытых пещер Гималайских гор. Когда-то смертный архитектор, превращённый культом Исиды в мумию, он решил потратить своё обретённое бессмертие на изучение смерти и загробной жизни. Со временем он решил, что крестовый поход Гора против Сета был отвлечением от более важных дел: наблюдения за величественным, лишённым солнца городом среди мёртвых, дерзко парящим над концом всего сущего. Впечатлённый их знаниями о некромантии, Инаухатен предложил сделку культу магов. В обмен на их помощь в уходе за забытым городом он использовал фрагментированную версию заклинания Жизни, чтобы превратить Идран в ямасаттв. Через них он связался с древней сектой вампиров, поклонявшейся патриархам. Он рассказал им о Загробном мире и его правительстве. Он привёл их к городу и помог им захватить его. Он подарил им серию томов, в которых отражен его тысячелетний опыт некромантской практики. Он помог им собрать один из самых полных архивов ранней истории каинитов в мире, размер которого превосходил даже легендарную Библиотеку забытых. Он осветил путь Тал'махе'Ра и направил их на курс, от которого они не могли отклониться.\n\nХотя он знает только искажённую форму заклинания Жизни, он мог бы многому вас научить. Однако вам, возможно, придется заключить с ним сделку, как давным-давно это сделали Идран."
 POD_mummy_spell_of_life_journeys.13.a: "Я уже [Select_CString(ROOT.Char.IsFemale, 'связана', 'связан' )] сделкой с Идран."
 POD_mummy_spell_of_life_journeys.13.b: "Я клянусь служить этому делу."
 POD_mummy_spell_of_life_journeys.13.c: "Нужны ли им какие-то ресурсы?"

 POD_mummy_spell_of_life_journeys.14.t: "Уроки Месты"
 POD_mummy_spell_of_life_journeys.14.desc: "Места не владеет заклинанием Жизни. Однако он знает о нём достаточно, чтобы дать некоторые идеи, которые помогут вашим собственным усилиям. Мало что поможет лучше, чем услышать тот же материал от другого человека.\n\nТаким образом, вы разыскали Месту и нашли его живущим на тихой ферме недалеко от реки Нил. Когда-то он был простым фермером в Нижнем Ниле, обрабатывая ту же землю, что и его отец, отец своего отца, на протяжении многих поколений. Его сыновья служили в смертных армиях Осириса и Гора, храбрые, ревностные и в конечном итоге мёртвые. Его второй сын привёл Исиду и Гора на ферму Месты, и тот дал им приют. Места принёс в жертву быка, кровь которого способствовала выздоровлению Осириса. Он наблюдал за созданием и подготовкой заклинания Жизни. Когда Исида не захотела испытать заклинание на своём раненом сыне, Места предложил пройти его, принял яд, чтобы остановить своё сердце, почувствовал, как его Ба перешло в мир духов, и впервые возродился. Он был свидетелем ритуала, даровавшего Гору вечную жизнь. Пока его бессмертие продолжалось, он служил доверенным лицом Осириса в тех редких случаях, когда его хозяин покидал Аменти.\n\nЗа свои тысячелетия он повидал многое, дав ему несколько фрагментов знаний о заклинании Жизни. Однако его преданность Осирису и Гору абсолютна."
 POD_mummy_spell_of_life_journeys.14.a: "Он дружелюбный человек. Побеседуем с ним."
 POD_mummy_spell_of_life_journeys.14.b: "Он может быть верным, но он всё равно чувствует боль..."



 POD_mummy_spell_of_life_journeys.20.t: "[Concept('translation_minigame', 'Перевод')|E] эзотерических записей"
 POD_mummy_spell_of_life_journeys.20.desc: "Ваши усилия привели к неким эзотерическим записям неизвестного возраста. Несмотря на ваше знание нескольких языков и лингвистические способности ваших придворных, ваших совместных усилий оказалось недостаточно, чтобы расшифровать их. Невидимые чернила скрывают важные детали. Зашифрованные слова испещряют текст. Части, написанные на знакомом языке, с трудом поддаются интерпретации и требуют технического и магического мастерства, которого вы только начинаете достигать. Авторские сокращения только ещё больше усложняет ваши усилия по переводу.\n\nОдно конкретное слово из пяти букв, похоже, является ключом к переводу остальной части. К сожалению, у вас будет только 6 возможностей, поскольку ваши усилия весьма разрушительны."
 POD_mummy_spell_of_life_journeys.20.a: "Попробуем."
 POD_mummy_spell_of_life_journeys.20.b: "Я сдаюсь!"
 POD_mummy_spell_of_life_journeys.20.effect.success: "Ваш перевод успешен"
 POD_mummy_spell_of_life_journeys.20.effect.failure: "Ваш перевод не удался"
 POD_mummy_spell_of_life_journeys.20.effect.failure.details: "Ваши неудачные попытки уничтожили записи"

 POD_mummy_spell_of_life_journeys.21.t: "Разветвлённые пути"
 POD_mummy_spell_of_life_journeys.21.desc: "В поисках эзотерических записей о заклинании Жизни вы узнали, что некоторые подсказки скрыты в древнем храме. Но внутри ждёт смертельное испытание: жрецы строго судили о том, кто достоин их священных тайн. За алтарём вы находите потайной люк, ведущий во тьму. Пройдя лабиринт узких туннелей, вы выходите в большую круглую камеру. Перед вами трое врат, словно вырезанных из чистой тьмы пустоты и обрамлённых золотой гравировкой. Над каждыми — голова: красная, зелёная и синяя. Вы запускаете невидимый механизм, и все три головы начинают говорить в унисон.\n\n«Внемлите нам, искатели запретного знания.\nПеред вами пути суждения.\nИз голосов, что ныне обращаются к вам, хотя бы один говорит только правду,\nи хотя бы один говорит только ложь.\nЗнайте также: лишь одна дверь ведёт дальше,\nа две другие сулят только смерть — быструю, верную и окончательную.\nПеред вами вечность или гибель.\nВыбирайте путь осторожно».\n\nКрасная голова говорит: «Над безопасным путём находится лживая голова».\nЗелёная голова говорит: «Красная голова говорит только правду».\nСиняя голова говорит: «Над безопасным путём находится красная голова»."
 POD_mummy_spell_of_life_journeys.21.a: "Я выбираю красные врата."
 POD_mummy_spell_of_life_journeys.21.b: "Я выбираю зелёные врата."
 POD_mummy_spell_of_life_journeys.21.c: "Я выбираю синие врата."
 POD_mummy_spell_of_life_journeys.21.effect.success: "Путь ведёт к знаниям"

 POD_mummy_spell_of_life_journeys.22.desc: "В поисках эзотерических записей о заклинании Жизни вы узнали, что некоторые подсказки скрыты в древнем храме. Но внутри ждёт смертельное испытание: жрецы строго судили о том, кто достоин их священных тайн. За алтарём вы находите потайной люк, ведущий во тьму. Пройдя лабиринт узких туннелей, вы выходите в большую круглую камеру. Перед вами трое врат, словно вырезанных из чистой тьмы пустоты и обрамлённых золотой гравировкой. Над каждыми — голова: красная, зелёная и синяя. Вы запускаете невидимый механизм, и все три головы начинают говорить в унисон.\n\n«Внемлите нам, искатели запретного знания.\nПеред вами пути суждения.\nИз голосов, что ныне обращаются к вам, хотя бы один говорит только правду,\nи хотя бы один говорит только ложь.\nЗнайте также: лишь одна дверь ведёт дальше,\nа две другие сулят только смерть — быструю, верную и окончательную.\nПеред вами вечность или гибель.\nВыбирайте путь осторожно».\n\nКрасная голова говорит: «Над безопасным путём находится зелёная голова».\nСиняя голова говорит: «Зелёная голова говорит только ложь».\nЗелёная голова молчит."

 POD_mummy_spell_of_life_journeys.23.desc: "В поисках эзотерических записей о заклинании Жизни вы узнали, что некоторые подсказки скрыты в древнем храме. Но внутри ждёт смертельное испытание: жрецы строго судили о том, кто достоин их священных тайн. За алтарём вы находите потайной люк, ведущий во тьму. Пройдя лабиринт узких туннелей, вы выходите в большую круглую камеру. Перед вами трое врат, словно вырезанных из чистой тьмы пустоты и обрамлённых золотой гравировкой. Над каждыми — голова: красная, зелёная и синяя. Вы запускаете невидимый механизм, и все три головы начинают говорить в унисон.\n\n«Внемлите нам, искатели запретного знания.\nПеред вами пути суждения.\nИз голосов, что ныне обращаются к вам, хотя бы один говорит только правду,\nи хотя бы один говорит только ложь.\nЗнайте также: лишь одна дверь ведёт дальше,\nа две другие сулят только смерть — быструю, верную и окончательную.\nПеред вами вечность или гибель.\nВыбирайте путь осторожно».\n\nКрасная голова говорит: «Только одна голова лжёт».\nЗелёная голова говорит: «Только одна голова говорит правду».\nСиняя голова говорит: «Над безопасным путём находится лживая голова»."

 POD_mummy_spell_of_life_journeys.24.desc: "В поисках эзотерических записей о заклинании Жизни вы узнали, что некоторые подсказки скрыты в древнем храме. Но внутри ждёт смертельное испытание: жрецы строго судили о том, кто достоин их священных тайн. За алтарём вы находите потайной люк, ведущий во тьму. Пройдя лабиринт узких туннелей, вы выходите в большую круглую камеру. Перед вами трое врат, словно вырезанных из чистой тьмы пустоты и обрамлённых золотой гравировкой. Над каждыми — голова: красная, зелёная и синяя. Вы запускаете невидимый механизм, и все три головы начинают говорить в унисон.\n\n«Внемлите нам, искатели запретного знания.\nПеред вами пути суждения.\nИз голосов, что ныне обращаются к вам, хотя бы один говорит только правду,\nи хотя бы один говорит только ложь.\nЗнайте также: лишь одна дверь ведёт дальше,\nа две другие сулят только смерть — быструю, верную и окончательную.\nПеред вами вечность или гибель.\nВыбирайте путь осторожно».\n\nКрасная голова говорит: «Синяя голова говорит только ложь».\nЗелёная голова говорит: «Синяя голова говорит только правду».\nСиняя голова говорит: «Над безопасным путём находится лживая голова»."

 POD_mummy_spell_of_life_journeys.25.desc: "В поисках эзотерических записей о заклинании Жизни вы узнали, что некоторые подсказки скрыты в древнем храме. Но внутри ждёт смертельное испытание: жрецы строго судили о том, кто достоин их священных тайн. За алтарём вы находите потайной люк, ведущий во тьму. Пройдя лабиринт узких туннелей, вы выходите в большую круглую камеру. Перед вами трое врат, словно вырезанных из чистой тьмы пустоты и обрамлённых золотой гравировкой. Над каждыми — голова: красная, зелёная и синяя. Вы запускаете невидимый механизм, и все три головы начинают говорить в унисон.\n\n«Внемлите нам, искатели запретного знания.\nПеред вами пути суждения.\nИз голосов, что ныне обращаются к вам, хотя бы один говорит только правду,\nи хотя бы один говорит только ложь.\nЗнайте также: лишь одна дверь ведёт дальше,\nа две другие сулят только смерть — быструю, верную и окончательную.\nПеред вами вечность или гибель.\nВыбирайте путь осторожно».\n\nКрасная голова говорит: «Над безопасным путём находится другая голова».\nЗелёная голова говорит: «Другая голова говорит только правду».\nСиняя голова говорит: «Другая голова сказала «другая голова»."

 POD_mummy_spell_of_life_journeys.26.desc: "В поисках эзотерических записей о заклинании Жизни вы узнали, что некоторые подсказки скрыты в древнем храме. Но внутри ждёт смертельное испытание: жрецы строго судили о том, кто достоин их священных тайн. За алтарём вы находите потайной люк, ведущий во тьму. Пройдя лабиринт узких туннелей, вы выходите в большую круглую камеру. Перед вами трое врат, словно вырезанных из чистой тьмы пустоты и обрамлённых золотой гравировкой. Над каждыми — голова: красная, зелёная и синяя. Вы запускаете невидимый механизм, и все три головы начинают говорить в унисон.\n\n«Внемлите нам, искатели запретного знания.\nПеред вами пути суждения.\nИз голосов, что ныне обращаются к вам, хотя бы один говорит только правду,\nи хотя бы один говорит только ложь.\nЗнайте также: лишь одна дверь ведёт дальше,\nа две другие сулят только смерть — быструю, верную и окончательную.\nПеред вами вечность или гибель.\nВыбирайте путь осторожно».\n\nКрасная голова говорит: «Безопасный путь лежит под единственной головой, говорящей правду».\nЗелёная голова говорит: «Только одна голова говорит правду».\nСиняя голова говорит: «Над безопасным путём находится красная голова»."

 POD_mummy_spell_of_life_journeys.27.t: "Путь тьмы"
 POD_mummy_spell_of_life_journeys.27.desc: "Вы проходите между золотыми гравюрами и входите в пустоту, позволяя ей поглотить вас. Тьма тянет вас за собой, распутывая ваше тело, как свободно связанный клубок пряжи. На руке, которую вы держите перед лицом, ваши пальцы вытягиваются, словно натянута нить. Несмотря на то, что в этой бесконечной пустоте вам не с чем сравнивать себя, вы знаете, что ваше тело становится длиннее и тоньше, растягивается и скручивается, скручивается и поворачивается. На ткацком станке пространства ваша нить вытягивается и вплетается в новое место, когда ваше тело покидает храм.\n\nВы знаете, что ваш единственный шанс — это восстановить своё тело вокруг вашего разума и воли, чтобы вы могли продвигаться дальше в храм."
 POD_mummy_spell_of_life_journeys.27.a: "Я соберу свою волю..."
 POD_mummy_spell_of_life_journeys.27.effect.success: "Вы получаете свою награду"
 POD_mummy_spell_of_life_journeys.27.effect.failure: "Храм вас выплёвывает"

 POD_mummy_spell_of_life_journeys.28.t: "Грохот костей"
 POD_mummy_spell_of_life_journeys.28.desc: "В поисках эзотерических записей в заклинании Жизни вы нашли доказательства того, что некоторые подсказки скрыты в древней гробнице. Исторические записи различаются относительно его обитателей. Некоторые говорят, что там похоронен маг или колдун. Возможно, остатки лича поместили туда его последователи. Другие говорят, что мумия, возможно, сам Гор, когда-то хранила своё тело в этой гробнице между перерождениями. Независимо от правды, среди тел лежат улики.\n\nПосле того, как вы разбили камни, от которых отпадало больше лет, чем вы видели, как падают листья, вы попадаете в странную пещеру. В центре стоит странный постамент, а четыре саркофага стоят вертикально, выровненные по сторонам света. На вершине постамента находится свиток в запечатанном контейнере, а по бокам постамента торчат четыре кнопки. На их гранях изображены восьмиугольник, квадрат, две параллельные линии, идущие от верхнего левого угла к правому нижнему, и вертикальная линия. По комнате разбросаны странные фразы, начертанные на саркофагах, вырезанные на полу, напечатанные на стенах. «Грохот костей» появляется 4 раза. «Проклятые кости» появляется 4 раза. «Запертая гибель» появляется 3 раза."
 POD_mummy_spell_of_life_journeys.28.a: "Нажать кнопки восьмиугольника, квадрата и вертикальной линии."
 POD_mummy_spell_of_life_journeys.28.b: "Нажать квадратную кнопку."
 POD_mummy_spell_of_life_journeys.28.c: "Нажать кнопку параллельной линии."
 POD_mummy_spell_of_life_journeys.28.d: "Нажать кнопки квадрата, параллельной и вертикальной линии."
 POD_mummy_spell_of_life_journeys.28.e: "Нажать кнопки восьмиугольника, параллельной и вертикальной линии."
 POD_mummy_spell_of_life_journeys.28.f: "Нажать кнопки параллельной и вертикальной линии."
 POD_mummy_spell_of_life_journeys.28.effect.success: "Контейнер отодвигается"

 POD_mummy_spell_of_life_journeys.29.t: "Восставшие статуи"
 POD_mummy_spell_of_life_journeys.29.desc: "Когда вы начинаете вводить выбранную последовательность, пьедестал заливает оранжевое свечение. При последнем нажатии мягкое оранжевое свечение сменяется красной вспышкой и визгом со всех сторон. Резные крышки саркофагов, стоящих по сторонам света соскальзывают с болезненными стонами человека, такого же старого, как сама гробница. Из некогда скрытых глубин выходят четыре оживлённые статуи в высеченных доспехах и с каменными мечами. В камень встроены человеческие кости, покрытые древними рунами, оживляющими эти гуманоидные изображения. Работая слаженно, они начинают атаковать вас, с лёгкостью размахивая клинками, которые весят столько же, сколько и вы."
 POD_mummy_spell_of_life_journeys.29.a: "Никакая антикварная статуэтка не сможет меня победить!"
 POD_mummy_spell_of_life_journeys.29.effect.success: "Они распадаются перед вами"
 POD_mummy_spell_of_life_journeys.29.effect.failure: "Они отгоняют вас"

 POD_mummy_spell_of_life_journeys.30.t: "Как вверху, так и внизу"
 POD_mummy_spell_of_life_journeys.30.desc: "В поисках эзотерических записей в заклинании Жизни вы нашли доказательства того, что некоторые подсказки скрыты в древнем храме. Когда-то здесь располагался таинственный культ. Некоторые предполагают, что здешние жрецы поклонялись Осирису и Исиде, хотя их истинные боги затерялись в песках времени. Предположительно, культ подчёркивал продолжение жизни после смерти. Сегодня всё, что осталось, это каменное здание их места поклонения.\n\nПод храмом погребено сооружение, находящееся в гораздо лучшем состоянии и некогда являющееся свидетелем внутренних тайн культа. Это идеальное отражение того, что когда-то находилось над поверхностью, перевёрнутое вверх дном, так что, спускаясь по лестнице, вы приближаетесь к тому, что могло быть башней, устремлённой к небу. На самой глубокой глубине находится идеально круглая комната. Луч света падает из ряда зеркал, спрятанных под потолком комнаты, освещая пустую часть комнаты. На удивительно лёгком постаменте в центре комнаты находится свиток папируса, древний, но нетронутый. На лицевой стороне свитка находится печать с Пером Правосудия. Ниже на пьедестале написаны слова: «Нет ли хорошего писца и учёного человека, который мог бы прочитать это письмо, которое я принёс в Египет, перед фараоном, не испортив его печати? Кто прочитает написанное внутри, не сломав воск?»"
 POD_mummy_spell_of_life_journeys.30.a: "Я сделаю порез и капну кровью на печать."
 POD_mummy_spell_of_life_journeys.30.b: "Я заверну его в папирус, чтобы прочесть."
 POD_mummy_spell_of_life_journeys.30.c: "Я вздремну, положив голову рядом с ним."
 POD_mummy_spell_of_life_journeys.30.d: "Я перемещу его под зеркала."
 POD_mummy_spell_of_life_journeys.30.e: "Я сотворю заклинание, чтобы прочесть содержимое свитка."
 POD_mummy_spell_of_life_journeys.30.effect.success: "Вы запоминаете слова, которые видите"
 POD_mummy_spell_of_life_journeys.30.effect.failure: "Свиток рассыпается от вашего прикосновения"

 POD_mummy_spell_of_life_journeys.31.t: "То, что осталось"
 # Note: wen - an overcrowded city, a boil/cyst/tumor
 POD_mummy_spell_of_life_journeys.31.desc: "В поисках эзотерических записей в заклинании Жизни вы нашли свидетельства того, что некоторые подсказки лежат погребёнными среди руин города, трупные и похороненные, но не мёртвые. За Столпами Мелькарта и Вратами Гадеса нечестивые существа захватили город и пировали. Их отвратительность просачивалась в поверхности, напоминающие сферы, углы, торчащие в невидимые пространства. Плоская поверхность стала наклонённой, выпуклая стала вогнутой, а углы превратились в рты. Начались кошмары, пришёл Циклоп, семеро ушли, а великий жировик утонул. Ну... так говорят истории.\n\nКогда вы плывёте вниз, вы видите болезненную каменную кладку, так похожую на знакомую архитектуру, но в то же время раковую, такую твердую и всё же сочащуюся, как будто слизь, вдоль береговой линии. Массы плоти и щупалец бесшумно скользят по ухмылкам лиц, покоящихся во тьме, в то время как над ними прошли столетия. Возможно, они ждут лопнувших зёрен. Вы направляетесь к увенчанной монолитом цитадели, украшенной изображениями, не поддающимися описанию, и иероглифами, не поддающимися определению. На вершине находится мемориальная доска, символы которой колеблются и извиваются под вашим взглядом.\n«Держите свой разум. Произнесите фразу.\n2-1-20 1-2-3 1-2-12»."
 # Book cipher decoded via paragraph - sentence - word
 POD_mummy_spell_of_life_journeys.31.a: "Раковую Мелькарта пировали."
 POD_mummy_spell_of_life_journeys.31.b: "Мёртвые, но мечтающие."
 POD_mummy_spell_of_life_journeys.31.c: "Трупные циклоп утонул."
 POD_mummy_spell_of_life_journeys.31.d: "За жировиком выпуклое стало вогнутым, смещалось и извивалось."
 POD_mummy_spell_of_life_journeys.31.e: "Я позволяю своей интуиции вести меня."
 POD_mummy_spell_of_life_journeys.31.effect.success: "Извивающаяся тайна раскрывает себя"
 POD_mummy_spell_of_life_journeys.31.effect.failure: "Она ускользает от вас"

 POD_mummy_spell_of_life_journeys.32.t: "Плотина снов"
 POD_mummy_spell_of_life_journeys.32.desc: "В поисках эзотерических записей о заклинании Жизни вы нашли доказательства того, что некоторые подсказки кроются в остатках дворянского дома. Руины погребены под землей, оставленной бесчисленными разливами близлежащей реки. В доме должна быть книга, запертая в железном ящике. В железном ящике лежит медный ящик. В медном ящике лежит ящик из можжевельника. В шкатулке из можжевельника находится шкатулка из слоновой кости и черного дерева. В шкатулке из слоновой кости и чёрного дерева лежит шкатулка из серебра. В ящике с серебром находится ящик с золотом, а в нём книга.\n\nВы соскребаете слои грязи и проходите через то, что когда-то было дверным проёмом. Вы проходите через древние залы и спускаетесь в то, что когда-то было подвалом, а теперь представляет собой не более чем дыру, освещённую неестественным зеленым светом. И он такой зелёный, исходящий со всех сторон, но явно берущий своё начало в неровных разрывах реальности. Истории рассказывали вам о так называемой Плотине снов. Пройдя через неё, вы оказываетесь на краю обрыва. Воздух гудит зеленью, которую вы видели раньше, пульсируя в такт вашему сердцебиению. Перед вами и под вами простираются шесть миль гигантских змей, крокодилов, пауков, скорпионов и всех форм рептилий и паукообразных, которые когда-либо видели или себе представляли. Они скручиваются и разворачиваются, образуя огромные живые узоры. Круги внутри кругов, хвосты касаются зубов, бесконечно пожирая себя. За Змеиным морем покоится уроборос, клыки которого впились в собственный хвост и вечно окружают ящик, который вы ищете.\n\nВ старых историях говорится, что эти существа ждут единственной команды. Одно слово, чтобы остановить их движения, изменить их образ действий, образовать мост."
 POD_mummy_spell_of_life_journeys.32.a: "Заключение."
 POD_mummy_spell_of_life_journeys.32.b: "Конфликт."
 POD_mummy_spell_of_life_journeys.32.c: "Непрерывность."
 POD_mummy_spell_of_life_journeys.32.d: "Космический."
 POD_mummy_spell_of_life_journeys.32.e: "Я изваяю восковую команду и пробью себе путь."
 POD_mummy_spell_of_life_journeys.32.effect.success: "Вы разворачиваете свою награду"
 POD_mummy_spell_of_life_journeys.32.effect.failure: "Море змей бесконечно"

 POD_mummy_spell_of_life_journeys.33.t: "Склонность или смерть!"
 POD_mummy_spell_of_life_journeys.33.desc: "В поисках эзотерических записей о заклинании Жизни вы нашли свидетельства того, что некоторые подсказки кроются в древней гробнице, хотя есть ли в ней тело — предмет серьезных споров. Легенды рассказывают о мудром учителе, который довёл нескольких учеников до безумия и даже хуже. Он был печально известен своими испытаниями и наказаниями за несоответствие стандартам. По его мнению, те, кто недостоин его знаний, должны доказать, что они достойны жить. Если нет, он был более чем счастлив исправить проблему.\n\nОткрыв гробницу и спустившись вниз, вы входите и видите статую высотой 30 футов, держащую резной свиток, лежащий на постаменте с мемориальной доской и пятью кнопками. По порядку кнопки имеют красный, оранжевый, жёлтый, зелёный и синий цвета. Табличка под статуей гласит: «Расшифруй мои учения, чтобы доказать свою склонность к магии и получить мои знания. Возможно, ты сможешь описать автоморфизм аффинного пространства. Если ты окажешься не в состоянии прочитать такое простое сообщение или выполнить такие простые математические действия, все мои знания будут уничтожены. Не пытайся прорваться вперёд, как невежественная скотина». На свитке, который держит статуя, написано следующее:\nТы иещшь миох занний о мигаи — так дажкои, что хтоь очстати кмопеетнтен. Нмажи онаружвею кконпу."
 # Affine Cipher: coefficients are a=5 and b=30 (the only numbers in the event) - я не знаю, как это будет на русском
 # Ultimately just a monoalphabetic substitution cipher, so o always means e
 # Decodes to "You seek my knowledge of magic so prove yourself partway competent. You should press the orange button."
 POD_mummy_spell_of_life_journeys.33.a: "Нажать красную кнопку."
 POD_mummy_spell_of_life_journeys.33.b: "Нажать оранжевую кнопку."
 POD_mummy_spell_of_life_journeys.33.c: "Нажать желтую кнопку."
 POD_mummy_spell_of_life_journeys.33.d: "Нажать зеленую кнопку."
 POD_mummy_spell_of_life_journeys.33.e: "Нажать синюю кнопку."
 POD_mummy_spell_of_life_journeys.33.f: "Я позволю своей интуиции вести меня."
 POD_mummy_spell_of_life_journeys.33.effect.success: "Свиток рассыпается, обнажая бумагу"
 POD_mummy_spell_of_life_journeys.33.effect.failure: "Статуя загорается"

 POD_mummy_spell_of_life_journeys.34.t: "Логово искателя"
 POD_mummy_spell_of_life_journeys.34.desc: "В поисках эзотерических записей о заклинании Жизни вы обнаружили ингредиент, необходимый для финального ритуала. Этим ингредиентом является желчь давно вымершей рептилии, которая, как говорят, способна открывать рот достаточно широко, чтобы человек мог пройти через него, не пригибаясь. К сожалению, бывший искатель заклинания Жизни истребил всех этих рептилий после собственных неудачных попыток. К счастью, вы нашли место, которое считается хранилищем этого искателя.\n\nВы маршируете по лесу, прокладывая себе путь сквозь растительность и зверей. Сучки в дереве словно следуют за вашими движениями, упрекая каждый ваш шаг. Тяжёлые ветки свисают вниз, царапая вашу броню и кожу, словно когти. Наконец, вы достигаете этого. Пожелтевшие кости торчат из грязи, из ландшафта вырисовывается зияющая пасть. Ветер свистит между зубами, точит их, как невидимые точильные камни. Осторожно спустившись по лестнице, вы позволяете тьме поглотить вас. У основания сначала находится открытая пара челюстей, а затем закрытая пара челюстей. На зубах обоих были вырезаны резкие угловатые буквы. Если читать слева направо от верхнего угла, открытая пара читается: «Докажи, что достоин быть здесь, и войди». Закрытая пара читает что-то более запутанное. «МЧОЖИМНДЯСВДТЯЕОМАЯ,МЕЧОНАЕЯЛСЬСЯРОИТЬ»."
 # Rail fence cipher decodes to "BY THE BLADE I LIVED BY THE BLADE I HOPED TO BE REBORN" with 2 rows (like teeth)
 POD_mummy_spell_of_life_journeys.34.a: "Поднять флакон с кислотой."
 POD_mummy_spell_of_life_journeys.34.b: "Поднять труп."
 POD_mummy_spell_of_life_journeys.34.c: "Поднять меч."
 POD_mummy_spell_of_life_journeys.34.d: "Поднять колокольчик."
 POD_mummy_spell_of_life_journeys.34.effect.success: "Желчь ваша"

 POD_mummy_spell_of_life_journeys.35.t: "Беспорядок челюстей"
 POD_mummy_spell_of_life_journeys.35.desc: "Челюсти раскрываются со скрежетом, похожим на звук меча, извлекаемого из ножен. Там, где вы ожидали лестницу вниз или, возможно, полупустую склянку с желчью, оказались звери, рептилии, каких вы никогда раньше не видели. Они напоминают крокодилов, хотя их 6 ног сочленены больше, как у аллигатора, а за их похожим на ствол телом следует хвост с шипами. Направляя вверх и вниз, изо рта заметно выступают десятки зубов. Судя по всему, этот искатель прошлого решил, что разводить этих зверей ради их желчи гораздо проще, чем охотиться на них в дикой природе. Полезные, хотя за прошедшие века они, кажется, одичали."
 POD_mummy_spell_of_life_journeys.35.a: "Нет ничего, что меч не мог бы исправить."
 POD_mummy_spell_of_life_journeys.35.effect.success: "Желчь ваша"
 POD_mummy_spell_of_life_journeys.35.effect.failure: "Они отгоняют вас"

 POD_mummy_spell_of_life_journeys.36.t: "Эзотерические фигуры"
 POD_mummy_spell_of_life_journeys.36.desc: "В поисках эзотерических записей о заклинании Жизни вы нашли свидетельства того, что некоторые подсказки кроются в древней гробнице, хотя есть ли в ней тело — предмет серьёзных споров. Легенды рассказывают о мудром учителе, который довёл нескольких учеников до безумия и даже хуже. Он был печально известен своими испытаниями и наказаниями за несоответствие стандартам. По его мнению, те, кто недостоин его знаний, должны доказать, что они достойны жить. Если нет, он был более чем рад исправить проблему.\n\nОткрыв гробницу и спустившись вниз, вы входите и видите статую высотой 30 футов, держащую резной свиток, покоящийся на постаменте с мемориальной доской и четырьмя кнопками. На каждой кнопке указан номер. Табличка под статуей гласит: «Расшифруй мои учения, чтобы доказать свою склонность к магии и получить мои знания. Если ты окажешься не в состоянии прочитать такое простое сообщение или выполнить такие простые математические действия, все мои знания будут уничтожены. Не пытайся прорваться вперёд, как невежественное животное». На свитке, который держит статуя, написано следующее:\n\nОранжевый + Синий = 5 ; Синий + Красный = 3; Оранжевый + Красный = 4; Фиолетовый = ?."
 POD_mummy_spell_of_life_journeys.36.a: "Нажать 3."
 POD_mummy_spell_of_life_journeys.36.b: "Нажать 4."
 POD_mummy_spell_of_life_journeys.36.c: "Нажать 5."
 POD_mummy_spell_of_life_journeys.36.d: "Нажать 6."
 POD_mummy_spell_of_life_journeys.36.e: "Я позволю своей интуиции вести меня."
