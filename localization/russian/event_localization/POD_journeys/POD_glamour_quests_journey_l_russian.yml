l_russian:
 POD_glamour_quests_journey.1.t: "Поиски гламура"
 POD_glamour_quests_journey.1.desc: "Феи могут помешать банальности закрепиться в их душах, как описано выше, но чтобы освободить душу, которая уже почувствовала ледяное прикосновение банальности, необходимо принять более серьёзные меры. Единственный способ согреть душу — это взяться за поиски, которые перекликаются со Грёзами, связать свою душу с этими поисками клятвой и выполнить клятву. Такие клятвы могут быть приняты индивидуально или группой — феи из разношёрстной группы, которые все клянутся в одной и той же цели, все получат выгоду, если они добьются успеха.\n\nИ я, после многих долгих лет, наконец, [Select_CString(ROOT.Char.IsFemale, 'исполнила', 'исполнил' )] то, чего требовала от меня моя клятва. И вместе с этим я чувствую, что власть банальности над моей душой значительно ослабевает."
 POD_glamour_quests_journey.1.a: "Моя клятва исполнена."
 glamour_quest_widget_tt: "Вы сразу приступите к ещё одному [Concept('journey', 'странствию')|E] того же типа."
 glamour_quest_widget_desc: "Продолжить очищать себя от [Concept('banality', 'банальности')|E]?"