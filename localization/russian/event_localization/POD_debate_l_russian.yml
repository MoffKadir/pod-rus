 POD_debate_debate_explanation_footer_description: "\n\n#R В этих дебатах используется показатель силы. Его начальное значение зависит от вашей дипломатии и дипломатии вашего канцлера, а также от ваших свойств, славы, благочестия и отношений с оппонентом. Во время дебатов показатель будет повышаться или понижаться в зависимости от силы ваших аргументов.#!"
 POD_debate_debate_explanation_footer_initial_score: "\n#R Ваша начальная сила в дебатах — [GetPlayer.MakeScope.GetVariable('character_debate_force').GetValue|0].#!"
