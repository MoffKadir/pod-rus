l_russian:
 POD_mummy_resurrection.1.t: "Истинное бессмертие?"
 POD_mummy_resurrection.1.desc: "Умирая, мумии подвергаются длительному (и неприятному) процессу, во время которого их душа попадает в духовное царство, называемое [UmbraGlossaryLocalized('tempest','Бурей')]. Там они медленно возвращаются на [UmbraGlossaryLocalized('earth','Землю')]. Кроме того, некоторые типы мумий также подвергаются суду.\nМумии Шемсу-геру отправляются в Аменти, египетское царство мертвых, чтобы встретиться с Анубисом и судьями Маат, в то время как мумии Кабири отправляются в Аид, где им приходится выживать самостоятельно в более враждебном окружении."
 POD_mummy_resurrection.1.a: "Судите меня."
 POD_mummy_resurrection.1.a.tt: "После смерти вас будут судить по вашей целостности."
 POD_mummy_resurrection.1.b: "Я [Select_CString(ROOT.Char.IsFemale, 'потеряла', 'потерял' )] что-то важное..."
 POD_mummy_resurrection.1.b.tt: "Из-за вашей шаткой основы вы потеряли часть себя в [UmbraGlossaryLocalized('tempest','Буре')]"
 POD_mummy_resurrection.1.c: "Учитель, я [Select_CString(ROOT.Char.IsFemale, 'потерпела', 'потерпел' )] неудачу."
 POD_mummy_resurrection.1.c.tt: "[Glossary('Апофис', 'glossary_wyrm_tt')] не славится своей снисходительностью к неудачам..."
 POD_mummy_resurrection.1.d: "Я вернусь."
 POD_mummy_resurrection.1.d.tt: "Благодаря вашей прочной основе, вам удалось выжить в [UmbraGlossaryLocalized('tempest','Буре')], ничего не потеряв"

 POD_mummy_resurrection.2.t: "Весы Маат"
 POD_mummy_resurrection.2.desc: "Вы были убиты, теперь вы оказались в [UmbraGlossaryLocalized('shadowlands','Загробном мире')] и должны понести приговор, чтобы доказать, что вы достойны воскрешения.\nВсё начинается с ожидания, пока Анубис не найдёт вас, что может быть долгим и напряжённым процессом, прежде чем вы предстанете перед судьями Маат, которые оценят, усердно ли вы трудились для достижения равновесия в своей прошлой жизни."
 POD_mummy_resurrection.2.t.wutian: "Весы Восьмерых"
 POD_mummy_resurrection.2.desc.wutian: "Вы были убиты, теперь вы оказались в [UmbraGlossaryLocalized('shadowlands','Загробном мире')] и должны понести приговор, чтобы доказать, что вы достойны воскрешения.\nСтоя перед Вратами Небес, вы ожидаете Восьми бессмертных, которые оценят, усердно ли вы трудились над выполнением порученного вам задания и дела Небес в своей прошлой жизни."
 POD_mummy_resurrection.2.t.custom: "Весы Единого"
 POD_mummy_resurrection.2.desc.custom: "Вы были убиты, теперь вы оказались в [UmbraGlossaryLocalized('shadowlands','Загробном мире')] и должны понести приговор, чтобы доказать, что вы достойны воскрешения.\nВсё начинается с ожидания, пока вас не найдут призраки, поклявшиеся собирать души, когда это измерение было впервые основано, прежде чем предстать перед тем, кто стабилизировал [GetPlayer.Custom('PODGetCustomMummyDynastyShadowRealm')] и утвердился в качестве судьи династии [GetTrait('custom_mummy_dynasty').GetName(GetPlayer)]."
 POD_mummy_resurrection.2.t.evil: "Весы Мастера"
 POD_mummy_resurrection.2.desc.evil: "Вы были убиты, теперь вы оказались в [UmbraGlossaryLocalized('shadowlands','Загробном мире')] и должны понести приговор, чтобы доказать, что вы достойны воскрешения.\nВы были призваны обратно прямо в объятия Мастера. Время, проведённое вами на их службе, будет оценено с учётом вашей недавней неспособности остаться в живых. Необходимо выделить время для того, чтобы убедиться, что вы правильно усвоили урок."
 POD_mummy_resurrection.2.a: "Взвесьте мои грехи."
 POD_mummy_resurrection.2.a.tt: "Наказание, которое вы получите, зависит от вашего уровня целостности."
 POD_mummy_resurrection.2.a.tt.forgiveness: "Ваша служба сочтена... приемлемой"
 POD_mummy_resurrection.2.a.tt.evil: "Вас ждёт весьма #italic болезненный#! урок от Мастера"
 POD_mummy_resurrection.2.b: "Вы мне не нужны."
 POD_mummy_resurrection.2.b.tt: "Вы будете искать другого хозяина, став тем, кого поклялись уничтожить."
 POD_mummy_resurrection.2.c: "Я сделаю всё возможное!"
 POD_mummy_resurrection.2.c.tt: "Вы оправдаетесь перед судьями. В ближайшие 50 лет это больше не сработает."
 POD_mummy_resurrection.2.d: "Я - судья!"
 POD_mummy_resurrection.2.d.tt: "Вы заявляете о себе идеально и без изъянов. Никакой проверки не производится"
 POD_mummy_resurrection.2.e: "Я - [Select_CString(ROOT.Char.IsFemale, 'Девятая', 'Девятый' )]!"

 podmummy.1.homelandandtomb: "#TOOLTIP:game_concept_POD_homeland_desc #E Родина#!#! и гробница"
 podmummy.1.homeland: "#TOOLTIP:game_concept_POD_homeland_desc #E Родина#!#!:"
 podmummy.1.tomb: "Из-за вашей гробницы:"
 POD_not_in_homelands_tt: "Вы находитесь не на своей #TOOLTIP:game_concept_POD_homeland_desc #E родине#!#! и не получаете от неё воспоминаний."
 POD_no_tomb_memory_tt: "\nВаша гробница не предоставляет воспоминаний."

 podmummy.3.t: "Нарушенные мандаты"
 podmummy.3.desc: "Внезапно, без помпы и дыма, перед вами оказывается мужчина, одетый в белое одеяние. На его лице нет шрамов возраста, но тяжесть и разочарование в глазах с лихвой компенсируют это. Возможно, для большинства он незнаком, но вы хорошо его знаете, потому что именно его лицо вы видите всякий раз, когда возвращаетесь к Вратам Небес.\n\n«Наше зрение не потускнело с возрастом, и мы не стали более снисходительными с течением времени. Во всех случаях, за исключением некоторых, мы даём каждому ву-тянь целую жизнь, чтобы совершать ошибки и каяться. Однако существуют определённые нарушения Небесных Мандатов, которые необходимо устранить, прежде чем можно будет создать настоящие ужасы. Ты [Select_CString(ROOT.Char.IsFemale, 'продала', 'продал' )] свою душу тёмной силе, душу, которую добровольно [Select_CString(ROOT.Char.IsFemale, 'связала', 'связал' )] с небесными поисками. Теперь... теперь ты [Select_CString(ROOT.Char.IsFemale, 'предпочла', 'предпочёл' )] власть долгу и поэтому потеряешь эту власть»."
 podmummy_3_wutian_witch: "@warning_icon! #X #TOOLTIP:GAME_TRAIT,witch,GetNullCharacter #L Инфернализм#!#! — это тяжкое нарушение Десяти мандатов Небес, которыми связаны все ву-тянь!#!"

 podmummy.1000.t: "Расхитители гробниц!"
 podmummy.1000.desc: "В вашей гробнице хранится множество ценных вещей, относящихся к вашим прошлым жизням... которые для неотёсанного современного человека кажутся бесценными сокровищами. Набеги на гробницы были традицией с тех пор, как существовали сами гробницы, и были проклятием существования мумий, которые часто теряли ключевые реликвии, пробуждаясь для нового цикла.\nПоэтому они создали культы и ловушки, чтобы защитить то, что принадлежит им по праву, от жадных людей, но иногда даже самая тщательно выстроенная защита может быть сломлена по чистой случайности этими надоедливыми искателями приключений."
 podmummy.1000.a: "Кто посмел потревожить мой сон?!"
 podmummy.1000.b: "Пришло время раздавить этих назойливых букашек."
 podmummy.1000.c: "У меня есть дела поважнее."

 podmummy.1001.t: "Вампиры-расхитители гробниц!"
 podmummy.1001.desc: "Вампиры были очарованы мумиями с тех пор, как вступили в контакт друг с другом. Эта (по-видимому) более «чистая» форма бессмертия, свободная от проклятия Каина, привлекает их, особенно потому, что они видят в мумиях «истинных бессмертных», поскольку даже окончательная смерть только начинает для них новый цикл. Поэтому неудивительно, что многие вампиры были одержимы попытками раскрыть секреты вашего вида.\nК сожалению, это часто делает их похожими на обычных расхитителей гробниц, поскольку они видят в ваших реликвиях потенциальные ключи к вашим тайнам. Однако вампиры часто представляют гораздо большую угрозу, потому что знают, на что вы способны, и имеют доступ к способностям, о которых смертные искатели приключений могут только мечтать."
 podmummy.1001.a: "Мне следовало бы соорудить гробницу, залитую солнцем..."
 podmummy.1001.b: "Я покажу вам истинное бессмертие!"
 podmummy.1001.c: "У меня есть дела поважнее."

 podmummy.6000.t: "Новый путь"
 podmummy.6000.desc: "Когда вы впервые стали ву-тянь, ваша личность определила ваш выбор между династиями [GetDynastyByID( 'POD_mummy_dynasty_xianlung' ).GetBaseName] и [GetDynastyByID( 'POD_mummy_dynasty_wufeng' ).GetBaseName]. Однако вечность – это очень долгое время, и того, что когда-то тянуло вас на один путь, больше нет. Изменив равновесие своего аспекта, вы можете выбрать новый путь, приняв на себя его преимущества и недостатки."
 podmummy.6000.a: "[GetDynastyHouseByID( 'house_white_lotus_society' ).GetBaseName]"
 podmummy.6000.b: "[GetDynastyHouseByID( 'house_twilight_scholars' ).GetBaseName]"
 podmummy.6000.c: "[GetDynastyHouseByID( 'house_jade_sentinels' ).GetBaseName]"
 podmummy.6000.d: "[GetDynastyHouseByID( 'house_celestial_arrows' ).GetBaseName]"
 podmummy.6000.e: "[GetDynastyHouseByID( 'house_righteous_peach_blossoms' ).GetBaseName]"
 podmummy.6000.f: "[GetDynastyHouseByID( 'house_brotherhood_of_the_scarlet_lantern' ).GetBaseName]"

 podmummy.6001.t: "Выбор аспекта"
 podmummy.6001.desc.xianlung: "Ваша душа переходит в мир Инь, страну отстранённости. Вдали горбатые духи бредут под неподвижной, безоблачной пустотой вдоль дорог, словно гладкие черные осколки костей. Из тишины вылетает золотой дракон. Поприветствовав вас, дракон готовится открыть портал к Вратам Небес. Когда вы пройдёте через него, в вашу нынешнюю сущность вольётся дух, подчёркивая то, что уже есть. Однако сначала вы должны выбрать свой аспект, который повлияет на вашу роль в замыслах Небес. По мнению дракона, хотя ваша душа предрасположена к замыслу [GetDynastyByID( 'POD_mummy_dynasty_xianlung' ).GetBaseName], возможно, вы осознаёте дисбаланс внутри себя и ищете перемен.\n\nК какому дому вы присоединитесь? Какие задачи вы желаете?"
 podmummy.6001.desc.wufeng: "Ваша душа попадает в мир Ян, страну дикости. Вдалеке в бушующем море хаоса жужжат огромные насекомые. Как лесной пожар, вас охватывает бурлящая и капризная энергия. Из безумия улетает золотой феникс. Поприветствовав вас, феникс готовится открыть портал к Вратам Небес. Когда вы пройдёте через него, в вашу нынешнюю сущность вольётся дух, подчёркивая то, что уже есть. Однако сначала вы должны выбрать свой аспект, который повлияет на вашу роль в замыслах Небес. По мнению дракона, хотя ваша душа предрасположена к замыслу [GetDynastyByID( 'POD_mummy_dynasty_wufeng' ).GetBaseName], возможно, вы осознаете дисбаланс внутри себя и ищете перемен.\n\nК какому дому вы присоединитесь? Какие задачи вы желаете?"

 POD_mummy_hekau.201.t: "Отделение хайбит"
 POD_mummy_hekau.201.desc: "С вашим мастерством в некромантии вы можете попытаться отделить свой хайбит для использования в качестве слуги-спектра."
 POD_mummy_hekau.201.option.a: "Выйди из моей тени! Служи мне."
 POD_mummy_hekau.201.option.a.tt: "Вы попытаетесь отделить свой хайбит"
 POD_mummy_hekau.201.option.a.desc: "Борьба с вашей внутренней тенью"
 POD_mummy_hekau.201.option.a.tt.success: "Ваш хайбит успешно отделён"
 POD_mummy_hekau.201.option.a.tt.failure: "Вам не удалось отделить свой хайбит"
 POD_mummy_hekau.201.option.b: "Сейчас не самое подходящее время."
 POD_mummy_hekau.201.option.b.tt: "Вы откажетесь от своей идеи отделить свой хайбит"

 POD_mummy_hekau.202.t: "Отделение хайбит II"
 POD_mummy_hekau.202.desc: "Благодаря вашему мастерству в некромантии, вам удалось успешно отделить свой хайбит от себя, теперь пришло время отдавать приказы."
 POD_mummy_hekau.202.option.a: "Мой собственный спектр."
 POD_mummy_hekau.202.option.a.tt: "Ваш хайбит успешно отделён."

 POD_mummy_hekau.203.t: "Отделение хайбит II"
 POD_mummy_hekau.203.desc: "Даже вашего мастерства в некромантии недостаточно, чтобы отделить ваш хайбит на данный момент."
 POD_mummy_hekau.203.option.a: "Я ещё не [Select_CString(ROOT.Char.IsFemale, 'готова', 'готов' )]."
 POD_mummy_hekau.203.option.a.tt: "Вам не удалось отделить свой хайбит"

 POD_mummy_hekau.204.t: "Возвращение хайбит"
 POD_mummy_hekau.204.desc: "С вашим отделённым хайбит произошёл инцидент, и он вынужден вернуться к вам."
 POD_mummy_hekau.204.option.a: "Моя тень вернулась."
 POD_mummy_hekau.204.option.a.tt: "Ваш хайбит и вы снова едины"

 learning_true_names_head: "Изучение истинных имён:"


 POD_mummy_scheme.100.t: "Глаз Сехмет"
 POD_mummy_scheme.100.desc: "Вы нанесли символ Сехмет на цель, что сделает заживление ран более трудным и длительным."
 POD_mummy_scheme.100.a: "Хорошо."

 POD_discover_true_name_outcome.2000.t: "[target.GetTitledFirstName]: Неудачное изучение рен!"
 POD_discover_true_name_outcome.2000.desc: "Потратив месяцы на разбиение имени на составные слоги, изучая их правильное произношение, изучая значение каждого из них и пытаясь раскрыть их сокровенную природу, вы потерпели неудачу."
 POD_discover_true_name_outcome.2000.a: "Я сдаюсь."
 POD_discover_true_name_outcome.2000.b: "Рен и [target.GetTitledFirstName] в моём распоряжении!"

 POD_command_effigy_ongoing.1030.option.b.t.PAY_MINOR: "Выгодная сделка"
 POD_command_effigy_ongoing.1030.option.b.t.PAY_MEDIUM: "Достойная сделка"
 POD_command_effigy_ongoing.1030.option.b.t.PAY_MAJOR: "Ужасная сделка"

 POD_show_known_true_names_events.100.t: "Известные рен"
 POD_show_known_true_names_events.100.desc: "[PlayerGuiBuildTooltip('POD_display_known_ren_sgui')]"
 POD_show_known_true_names_events.100.option.a: "ОК"
 POD_show_known_true_names_events.100.option.b: "Что можно сделать с флорой?"
 POD_show_known_true_names_events.100.option.c: "Что можно сделать с анатомией человека?"
 POD_show_known_true_names_events.100.option.d: "Что можно сделать с животными?"
 POD_show_known_true_names_events.100.option.e: "Что можно сделать с металлами?"
 POD_show_known_true_names_events.110.t: "Флора"
 POD_show_known_true_names_events.110.desc: "Аменти, знающие рен флора, могут накладывать на землю различные благословения или проклятия. Они также могут превращать свою кожу в растительную материю."
 POD_show_known_true_names_events.110.option.a: "Ок"
 POD_show_known_true_names_events.110.option.b: "Вернуться к предыдущему меню"
 POD_show_known_true_names_events.130.t: "Животные"
 POD_show_known_true_names_events.130.desc: "Аменти, знающие рен различных животных, могут призывать их к себе на помощь (профессионалы или превращаться в них."
 POD_show_known_true_names_events.140.t: "Металлы"
 POD_show_known_true_names_events.140.desc: "Аменти, знающие рен различных металлов, могут сотворить драгоценные металлы или превращать свою кожу в этот металл."