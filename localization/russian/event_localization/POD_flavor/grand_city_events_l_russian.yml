l_russian:

 #Paris
 podgrandcity.01.t: "Плата по долгам"
 podgrandcity.01.desc: "Для остальных вампиров Парижа не секрет, что вы профинансировали расширение капеллы тремеров. Такие поступки в вампирском обществе никогда не совершаются просто так, и ваши подданные это прекрасно понимают.\nТремеры явились к вам с множеством даров. На самом деле эти дары — это плата за их долг перед вами. Для них лучше предложить то, что у них есть, чем ждать, пока вы потребуете то, чего у них нет."
 podgrandcity.01.option.a: "Научите меня вашим тайнам."
 podgrandcity.01.option.b: "Продвиньте мои исследования."
 podgrandcity.01.option.c: "Покажите мне силу Камня."
 podgrandcity.01.tooltip: "Узнать, как создавать собственных слуг-#TOOLTIP:GAME_TRAIT,gargoyle,[GetNullCharacter] #L гаргулий#!#!\n\n@warning_icon! #N Вам всё равно потребуется #TOOLTIP:GAME_TRAIT,bloodsorceryadvanced,[GetNullCharacter] #L мастерство кровавого чародейства#!#!#!"

 #Cairo
 podgrandcity.100.t: "Учения Двора грёз"
 podgrandcity.100.desc: "Благодаря вашим усилиям большая часть храма была восстановлена. Многие сетиты теперь ходят по этим залам, шепчутся, плетут интриги и по-своему прославляя Сета.\nОднако по причинам, которые вам не объяснить, многие из сетитов, приходящих сюда, забывают о своей изначальной цели и начинают искать новые удовольствия. Быть может, это тоже форма поклонения, которая начинает вас привлекать."
 podgrandcity.100.option.a: "Плотские удовольствия освободят меня."
 podgrandcity.100.tooltip.a: "Ваша будущая [Concept('faith', 'конфессия')|E] получит доктрину [GetDoctrine('tenet_carnal_exaltation').GetBaseName]."
 podgrandcity.100.option.b: "Для чего ещё они существуют, если не ради личного наслаждения?"
 podgrandcity.100.tooltip.b: "Ваша будущая [Concept('faith', 'конфессия')|E] получит доктрину [GetDoctrine('tenet_hedonistic').GetBaseName]."
 podgrandcity.100.option.c: "Чем больше людей — тем веселее!"
 podgrandcity.100.tooltip.c: "Ваша будущая [Concept('faith', 'конфессия')|E] получит доктрину [GetDoctrine('tenet_ritual_celebrations').GetBaseName]."

 podgrandcity.101.t: "Учения Двора праха и костей"
 podgrandcity.101.desc: "Этот храм назван очень удачно, ведь что еще остается, кроме пыли и костей, когда на них воздействует магия крови? Многочисленные тома здесь повествуют о Сете, его достижениях и силе. Перед вами кладезь знаний — нужно лишь протянуть руку и взять их."
 podgrandcity.101.option.a: "Сет — король."
 podgrandcity.101.tooltip.a: "Ваша будущая [Concept('faith', 'конфессия')|E] получит доктрину [GetDoctrine('tenet_ashen_faith').GetBaseName]."
 podgrandcity.101.option.b: "Сет — Тифон."
 podgrandcity.101.tooltip.b: "Ваша будущая [Concept('faith', 'конфессия')|E] получит доктрину [GetDoctrine('tenet_sacred_shadows').GetBaseName]."
 podgrandcity.101.option.c: "Сет — триумфатор."
 podgrandcity.101.tooltip.c: "Ваша будущая [Concept('faith', 'конфессия')|E] получит доктрину [GetDoctrine('tenet_pursuit_of_power').GetBaseName]."

 podgrandcity.102.t: "Учения храма Крокодила"
 podgrandcity.102.desc: "Здесь покоится Собек, благословлённое дитя Сета. Говорят, что Сет превратил моколе в мерзость с помощью мощных ритуалов крови. Являясь одновременно мафусаилом и мерзостью, Собек — одно из самых могущественных существ на свете. Теперь он дремлет здесь, являясь воплощением самого Голода. В этом голоде есть сила, хаос и кровопролитие. Поклоняясь Богу-крокодилу, возможно, вы сможете обрести эту силу."
 podgrandcity.102.option.a: "Голод — вечная борьба."
 podgrandcity.102.tooltip.a: "Ваша будущая [Concept('faith', 'конфессия')|E] получит доктрину [GetDoctrine('tenet_struggle_submission').GetBaseName]."
 podgrandcity.102.option.b: "Ритуальные жертвы утолят жажду крови."
 podgrandcity.102.tooltip.b: "Ваша будущая [Concept('faith', 'конфессия')|E] получит доктрину [GetDoctrine('tenet_gruesome_festivals').GetBaseName]."
 podgrandcity.102.option.c: "С яростью мои оковы рвутся."
 podgrandcity.102.tooltip.c: "Ваша будущая [Concept('faith', 'конфессия')|E] получит доктрину [GetDoctrine('tenet_warmonger').GetBaseName]."

 podgrandcity.103.t: "Открытие нового пути"
 podgrandcity.103.desc: "Все три храма восстановлены. Полученные знания открывают перед вами новые горизонты в поклонении Сету.\nМожет быть, пришло время поведать об этом миру?\nИли же эти еретические мысли стоит оставить?"
 podgrandcity.103.option.a: "Таков путь."
 podgrandcity.103.option.b: "Интересно, но мой путь остаётся прежним."


 #Baghdad
 podgrandcity.201.t: "Багдадский костёр"
 podgrandcity.201.desc: "Ни один город не стоит вечно. Такая простая истина известна вашему виду, но вы всё равно не были готовы к тому, что произошло. Разграбление Багдада произошло в течение целой недели грабежей и убийств, пока монгольские войска Хулагу проносились через то, что когда-то было жемчужиной ислама. Возможно, погибло около миллиона человек, а, вероятно, даже больше из-за эпидемий, вызванных множеством трупов.\nТак много книг из багдадских библиотек было брошено в Тигр, что цвет реки из-за их множества стал чёрным. 500-летний Аббасидский халифат рушится, а вместе с ним и центр обучения на Ближнем Востоке.\n\nХотя сверхъестественное, как известно, хорошо скрывается, резня и кровопролитие всё же довели многих до мук безумия, и многие сверхъестественные существа пали от рук победоносных монголов.\n\nТеперь вы правите городом пепла, блох и смерти."
 podgrandcity.201.option.a: "Что мы можем сделать перед лицом такого разрушения?"
 podgrandcity.201.tooltip.a: "Багдад больше не тот великий город, которым он был когда-то, и никогда больше не достигнет того положения, которое он когда-то занимал. Но, возможно, вы ещё сможете его восстановить."

 podgrandcity.202.t: "Багдад исцеляется"

 podgrandcity.203.t: "Из пепла"
 podgrandcity.203.desc: "Хотя Багдад всегда будет страдать от случившегося, он выстоял. Заметная роль города на Ближнем Востоке снизилась, но он по-прежнему остаётся местом, где люди живут, учатся и умирают. Ваш город, ваша драгоценность, уже не так отполирован, как раньше, но ему удалось выжить. Возможно, эта перековка огнём под вашим влиянием и будет тем, что необходимо для того, чтобы он вернул себе прежние высоты или даже превзошёл их."
 podgrandcity.203.option.a: "Новое начало для почтенного города."
 podgrandcity.203.tooltip.a: "Новые истории, которые нужно рассказывать, новые люди, которыми нужно править, те же амбиции."