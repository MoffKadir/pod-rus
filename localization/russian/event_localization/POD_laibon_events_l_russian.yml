l_russian:
 pod_laibon.100.t: "Смертный проситель"
 pod_laibon.100.desc: "Смертный из ваших владений просит аудиенции. Он просит рассудить дела, у которых нет простых решений: конфликт о границах земель между двумя семьями, обвинение в колдовстве в адрес целителя, просьба вмешаться в засуху, обратившись к духам. По старым обычаям Лайбон — больше, чем правители: они — живой мост между общиной и силами, управляющими её судьбой. Смертный не знает, кто вы на самом деле, но понимает, что ваш приговор обладает весом, на который не способен ни один обычный старейшина. Отказать ему — значит позволить миру живых ещё немного ускользнуть из вашей власти."
 pod_laibon.100.a: "Рассмотреть дела лично."
 pod_laibon.100.a.success: "Ваш приговор мудр и справедлив. Смертные впечатлены."
 pod_laibon.100.a.failure: "Ваш приговор не попадает в цель. Смертные разочарованы."
 pod_laibon.100.b: "Поручить дело смертному советнику."
 pod_laibon.100.c: "У вас есть более неотложные дела. Прогнать их."
 pod_laibon.101.t: "Голоса на ветру"
 pod_laibon.101.desc: "В предрассветные часы вы слышите нечто — не ушами, а глубже. Голос, который может быть предком, духом земли или вашим собственным [Glossary('Зверем','game_concept_beast_desc')], говорящим на наречиях, которые вы почти понимаете. Он предлагает крупицу знания, но требует вашего внимания. Лайбон всегда ходили между миром живых и миром духов — эти голоса не галлюцинация и не благословение, а нечто более древнее, чем обе эти категории. Ваши старейшины предупреждали, что Лайбон, игнорирующие голоса Оруна, делают это на свой страх и риск, но тот, кто идёт за каждым шёпотом во тьму, редко возвращается целым."
 pod_laibon.101.a: "Слушать и следовать за голосом в уединение."
 pod_laibon.101.a.success: "Голос раскрывает скрытые истины о соседнем правителе."
 pod_laibon.101.a.failure: "Голос водит вас кругами. Вы возвращаетесь ни с чем, лишь с чувством тревоги."
 pod_laibon.101.b: "Выслушать голос, но не следовать ему."
 pod_laibon.101.c: "Отгородиться от него. Мир духов полон обманщиков и лжецов."
 pod_laibon.102.t: "Костёр собрания"
 pod_laibon.102.desc: "Вы устраиваете собрание местных Лайбон — не формальное Собрание наследий, а неформальную встречу у костра. Здесь делятся историями, выносят на обсуждение тяжбы и соблюдают старые обряды. В жертву приносят козу, делят кровь, взывают к предкам. Эти малые собрания — основа общества Лайбон, напоминание о том, что нежить всё ещё связана обязательствами живой общины, к которой когда-то принадлежала. Узы, заключённые у огня, часто крепче клятв, данных на торжественных собраниях, а долги, помянутые в дыму подношения, редко остаются неуплаченными."
 pod_laibon.102.a: "Лично провести обряд, почтив и живых, и мёртвых."
 pod_laibon.102.b: "Сосредоточить собрание на политических делах."
 pod_laibon.102.c: "Сосредоточить собрание на духовном общении."
 pod_laibon.103.t: "Смертный потомок"
 pod_laibon.103.desc: "В ваших владениях появляется [Select_CString(descendant.IsFemale, 'смертная', 'смертный' )], поразительно [Select_CString(descendant.IsFemale, 'похожая', 'похожий' )] на того, кого вы знали при жизни, — потомок вашей смертной семьи, несущий кровь, что была вашей столетия назад. [Select_CString(descendant.IsFemale, 'Она', 'Он' )] не знает, кто вы, но в [Select_CString(descendant.IsFemale, 'её', 'его' )] глазах есть узнавание. Это одно из самых сбивающих с толку ощущений, какие может испытать Лайбон, — видеть собственный жест, собственный смех, тот же наклон головы, чтобы лучше слышать, в теле, которое всё ещё дышит и стареет. Предки говорят, что такие совпадения никогда не случайны. Что-то незавершенное передалось через кровь, ожидая подходящего момента, чтобы быть улаженным."
 pod_laibon.103.a: "Присматривать за [Select_CString(descendant.IsFemale, 'ней', 'ним' )] из тени. Позаботиться о том, чтобы [Select_CString(descendant.IsFemale, 'она процветала', 'он процветал' )]."
 pod_laibon.103.b: "Даровать [Select_CString(descendant.IsFemale, 'ей', 'ему' )] объятия. [Select_CString(descendant.IsFemale, 'Она', 'Он' )] несёт вашу кровь. [Select_CString(descendant.IsFemale, 'Она', 'Он' )] заслуживает дара вечной жизни."
 pod_laibon.103.a.success: "[Select_CString(descendant.IsFemale, 'Смертную', 'Смертного' )] приведут ко вашему двору, чтобы подготовить к объятиям."
 pod_laibon.103.a.message: "Потомок прибыл"
 pod_laibon.103.c: "Это вас не касается."
 pod_laibon.104.t: "Дух-Зверь"
 pod_laibon.104.desc: "Рядом с вашим убежищем проявляется дух — не призрак, а нечто более древнее. Он принимает облик огромного зверя: льва, змеи, паука, орла. Он смотрит на вас глазами, что видят сквозь плоть. Ему что-то нужно. Звериные духи — древнейшие посланцы Оруна: они старше предков, старше даже первого Лайбон, и они не ведут дел словами. Дух, который сам ищет вас, — не то дело, которое можно оставить без ответа. Чего бы он ни хотел, сам факт того, что он пришёл к вам, а не стал ждать вызова, означает, что переговоры уже начались."
 pod_laibon.104.a: "Приблизиться и предложить ему кровь."
 pod_laibon.104.a.success: "Дух принимает ваше подношение. Его благословение ложится на вас, как броня."
 pod_laibon.104.a.failure: "Дух яростно отвергает ваше подношение."
 pod_laibon.104.b: "Наблюдать с расстояния. Его присутствие уже даёт урок."
 pod_laibon.104.c: "Прогнать его. Духам, требующим кровавых подношений, нельзя доверять рядом с вашими владениями."
 pod_laibon.105.t: "Урожай"
 pod_laibon.105.desc: "У смертных в ваших владениях был хороший сезон. Урожай богат, торговля процветает, дети здоровы. Ваше руководство, сколь бы косвенным оно ни было, сдерживало хищников. Община процветает. Лайбон понимает лучше любого, что благополучные смертные — основа всего: они источник крови, Айи, связи с миром живых, что отделяет вас от пустых мёртвецов, дрейфующих через Орун, которым не за что больше держаться. Сегодня бьют барабаны и ярко горят костры. Вы хорошо сделали свою работу."
 pod_laibon.105.a: "Пройти среди них во время празднества и побыть рядом."
 pod_laibon.105.b: "Взять свою долю - большую десятину из излишка."
 pod_laibon.105.c: "Взять то, что вам нужно, - излишек означает больше смертных, которыми можно питаться без последствий."
 pod_laibon.106.t: "Дух перекрёстка"
 pod_laibon.106.desc: "В полночь вы набредаете на перекрёсток — место, где встречаются пути и истончается граница между Айей и Оруном. Кто-то оставил подношение: глиняный горшок, связку перьев, резную фигурку. Оно предназначено вам. Или чему-то вроде вас. Перекрёстки всегда были пороговыми местами — священными для духов, опасными для беспечных и особенно притягательными для тех, кто и без того существует на границе между мирами. Подношение говорит о том, что кто-то знает: вы проходите этой дорогой. Хотят ли вам сделать подарок, предложить сделку или отвлечь ваше внимание от чего-то, что делают поблизости, — это уже совсем другой вопрос."
 pod_laibon.106.a: "Оставить собственное подношение и помедитировать на перекрёстке."
 pod_laibon.106.b: "Взять подношение. Сила ждёт, чтобы её взяли."
 pod_laibon.106.c: "Взять подношение, но не задерживаться - перекрёстки притягивают вещи похуже духов предков."
 pod_laibon.107.t: "Сон Кагна"
 pod_laibon.107.desc: "Вам снится сон - для вампиров это редкость. Во сне вы видите фигуру, которая может быть Кагном, первым Лайбон, а может быть вашим собственным [Glossary('Зверем','game_concept_beast_desc')], носящим лицо Кагна. Он говорит на языке древнее любого, что вы знаете, но вы понимаете. Он показывает вам видение. Говорят, Кагн первым обнаружил равновесие между Айей и Оруном и заплатил за это знание огромную цену. Истинный ли он предок, духовная ли конструкция или миф, которым кровь объясняет собственную природу, - спор, который старейшие Лайбон ведут на протяжении веков без результата. В чём никто из них не сомневается, так это в том, что сон о нём означает: что-то вот-вот изменится."
 pod_laibon.107.a: "Видение показывает мир смертных - ваши владения такими, какими они могли бы быть: процветающими и защищёнными."
 pod_laibon.107.b: "Видение показывает мир духов - огромный, светящийся и зовущий вас."
 pod_laibon.107.c: "Расспросить фигуру. Это действительно Кагн или нечто, носящее его лицо?"
 pod_laibon.107.c.success: "Фигура улыбается. Это и то, и другое, и ни то, и ни другое. Понимание наполняет вас."
 pod_laibon.107.c.failure: "Улыбка фигуры становится холодной. Вы оскорбили нечто, чего не понимаете."
 pod_laibon.108.t: "Нарушение Маскарада"
 pod_laibon.108.desc: "Ваша растущая связь с миром духов становится заметной. Один из смертных в ваших владениях, жрец или знахарка, заметил что-то неладное. Они ещё не дали этому названия, но уже начинают шептаться. Тайна под угрозой. Маскарад для Лайбон сложнее, чем для сородичей, которые скрываются полностью: от Лайбон ожидают, что он будет фигурой духовного авторитета, а значит, некая сверхъестественная природа уже подразумевается. Но есть грань между почитаемым проводник духов и тем, кого распознали как одного из нежити, и кто-то в ваших владениях только что подошёл к ней слишком близко."
 pod_laibon.108.a: "Разобраться со смертным напрямую. Применить Доминирование или заставить их замолчать."
 pod_laibon.108.a.success: "Смертный забывает. Шёпот стихает."
 pod_laibon.108.a.failure: "Вам не удалось сдержать ситуацию. Шёпот превратился в слухи."
 pod_laibon.108.b: "Временно отойти от дел смертных. Пусть слухи угаснут."
 pod_laibon.108.c: "Сыграть на этом. Пусть они думают, что вы — дух предка."
 pod_laibon.109.t: "Могила предка"
 pod_laibon.109.desc: "Вы обнаруживаете или вспоминаете место погребения ваших смертных предков. Могила стара, заросла, возможно, забыта живыми. Но духи там не ушли. Для Лайбон мёртвые не исчезают - они пребывают в Оруне, в самой земле, в крови потомков, что несут их дальше, сами того не зная. Забытая могила это рана в памяти общины, а духи заброшенных мёртвых могут становиться беспокойными так, что это затрудняет существование всем. Вы кое-что должны этим людям. Заплатите ли вы этот долг - уже другой вопрос."
 pod_laibon.109.a: "Восстановить могилу и совершить старые обряды."
 pod_laibon.109.b: "Пообщаться с духами, но оставить могилу как есть."
 pod_laibon.109.c: "Могила находится на ценной земле. Расчистить место и построить что-нибудь полезное."
 pod_laibon.200.t: "Тяжесть короны"
 pod_laibon.200.desc: "Тяжба среди ваших вассалов грозит перелиться в мир смертных: враждующие Лайбон питаются неосторожно, нарушают торговлю, пугают смертных поддерживающих домен. Как Гурухи, это ваша ответственность. Земля это ваша забота. Гурухи не правители лишь по праву завоевания, они правители потому, что приняли договор с землёй и людьми, что её обрабатывают. Когда земля страдает, за неё отвечают именно Гурухи: перед смертными, перед другими наследиями и перед предками, что взирают из Оруна. Вы не просили эту корону. Вы носите её, несмотря ни на что."
 pod_laibon.200.a: "Вмешаться лично. Восстановить порядок и среди Лайбон, и среди смертных."
 pod_laibon.200.b: "Уладить только тяжбу Лайбон. Смертные разберутся сами."
 pod_laibon.201.t: "Тьма внутри"
 pod_laibon.201.desc: "Тени в вашем убежище движутся сами по себе: тянутся, хватают, шепчут. Они не совсем живые, но всё-же что-то в них есть. Тьма это дверь в Орун, и она всегда открыта для вас. Другие сородичи, повелевающие тьмой, обращаются с ней как с оружием, инструментом страха и сокрытия. Вы знаете её иначе. Тени не пустое пространство, а вещество границы между мирами, и то, что вы лепите из них, касается чего-то, что существует по обе стороны завесы. Сегодня ночью они активнее обычного. Что-то прижалось к двери с той стороны."
 pod_laibon.201.a: "Шагнуть во тьму. Пусть она покажет вам, что лежит по ту сторону."
 pod_laibon.201.b: "Повелевать тенями, но не входить. Сохранять дистанцию."
 pod_laibon.202.t: "Совет Зверя"
 pod_laibon.202.desc: "Ваш [Glossary('Зверь','game_concept_beast_desc')] шевелится, не от голода и не от ярости, а в разговоре. Он показывает вам нечто через звериные чувства: пути миграции антилоп гну, метки территории леопарда, общественные связи слоновьего стада. Здесь есть урок, если вы сумеете его понять. Лайбон говорят о [Glossary('Звере','game_concept_beast_desc')] не так, как европейские сородичи, не как о демоне, которого надо запереть в клетку, а как о более древнем себе, о части вас, что помнит то, что человечество забыло, когда построило свой первый город. Мудрость ли это понимание или удобная ложь, которой кровь утешает вас насчёт того, кто вы есть, это вопрос, на который каждый Лайбон в конце концов должен ответить сам."
 pod_laibon.202.a: "Слушать Зверя. Учиться у мира животных."
 pod_laibon.202.b: "Использовать прозрение Зверя для практической выгоды."
 pod_laibon.203.t: "Требование ярости"
 pod_laibon.203.desc: "Ваша ярость поднимается, знакомый огонь, что определяет ваше наследие. Но ярость бесформенна без направления. Что движет вами сегодня ночью? Воинские наследия Лайбон всегда понимали, что гнев и тяга к действию это в равной мере дары и проклятия, но если Бруха воюют за философию, то воин Лайбон сражается за нечто более древнее и непосредственное: защиту, справедливость, честь, обретшую форму через действие. И всё же грань между праведной яростью и простым голодом [Glossary('Зверя','game_concept_beast_desc')] до насилия сегодня ночью тоньше, чем была вчера. Убедитесь, что знаете, на какой её стороне вы стоите."
 pod_laibon.203.a: "Сражаться за своих людей. Смертным под моей защитой угрожают."
 pod_laibon.203.b: "Сражаться за честь. Воинские духи моих предков требуют совершенства."
 pod_laibon.203.c: "Отдаться ярости полностью. Не сдерживаться ни в чём."
 pod_laibon.204.t: "Дилемма Судьи-Бури"
 pod_laibon.204.desc: "Перед вами предстаёт дело: Лайбон обвиняют в неосторожном питании, что ставит под угрозу Тайну. Доказательства неясны. Обвинитель могуществен. Обвиняемый заявляет о невиновности. Как Шанго, ваш приговор несёт вес бури. Шанго это арбитры Лайбон, роль, что дана им не по праву, а заслужена веками разрешения тяжб, которые никто другой не мог уладить, не начав войну. Когда Шанго выносит приговор, его слова несут власть каждого предка, что стоял на вашем месте до вас. Эта власть ничего не значит, если вы не владеете ею с осторожностью."
 pod_laibon.204.a: "Воззвать к предкам. Пусть духи направят мой приговор."
 pod_laibon.204.a.success: "Предки говорят ясно. Справедливость вершится."
 pod_laibon.204.a.failure: "Предки молчат. Ваше суждение колеблется."
 pod_laibon.204.b: "Судить только по доказательствам и показаниям. Путь смертных."
 pod_laibon.205.t: "Порок распространяется"
 pod_laibon.205.desc: "Ваш порок зовёт. Мир смертных предлагает свои удовольствия: праздник, рынок, собрание прекрасных и готовых на всё смертных. Ваше тело жаждет предаться порокам. Это и связь с миром живых, и то, что может её оборвать. Иштарри всегда понимали то, что более аскетичные сородичи отказываются признавать: удовольствие не слабость, а привязь. Вампир, не чувствующий ничего к радостям смертных, уже начал дрейфовать к пустым местам между мирами. Но есть разница между тем, чтобы потакать своим порокам осознанно, и тем, чтобы утонуть в них, и сегодня ночью это различие кажется очень тонким."
 pod_laibon.205.a: "Потворствовать себе с осторожностью. Насладиться удовольствиями смертного мира, не разрушая его."
 pod_laibon.205.a.success: "Вы шагаете по грани между потворством и сдержанностью. Смертные ни о чём не догадываются."
 pod_laibon.205.a.failure: "Ваши аппетиты взяли верх. Община это запомнит."
 pod_laibon.205.b: "Направить голод в мир духов. Найти вместо этого сверхъестественное удовольствие."
 pod_laibon.206.t: "Перекрёсток устроителя"
 pod_laibon.206.desc: "Вы приходите на перекрёсток, буквальный и переносный. Каравану смертных нужна защита от разбойников. Старейшине Лайбон нужно вернуть духа-хранителя из священной рощи. И то и другое прибыльно. Время позволяет лишь одно. Раманга всегда занимали это место между мирами: переговорщики, посредники, те, кто понимает, что мир смертных и мир Лайбон не так раздельны, как делают вид другие. Каждый такой выбор это небольшой акт торговли между этими двумя мирами, и ваша репутация в обоих зависит от того, как вы с ним обойдётесь. Хитрость в том, чтобы с каждой стороны вам заплатили как следует."
 pod_laibon.206.a: "Защитить караван."
 pod_laibon.206.b: "Вернуть духа-хранителя."
 pod_laibon.206.c: "Заключить сделку, по которой охрана каравана сопроводит вас в рощу, решив обе задачи."
 pod_laibon.206.c.success: "Ваше красноречие творит чудеса. Обе работы сделаны, оба клиента довольны."
 pod_laibon.206.c.failure: "Сделка срывается. Вам достаются лишь крохи от обеих сторон - и никого это не удовлетворяет полностью."
 pod_laibon.207.t: "Память Земли"
 pod_laibon.207.desc: "Во время вашего погребального отдыха земля говорит. Не словами, а ощущениями. Вес камня, движение корней, медленный пульс вещей, что были стары уже тогда, когда человечество было молодым. Глубинный Орун давит на ваше сознание. Наглопер всегда утверждали, что древнейшая часть мира духов находится не в небе и не на горизонте, а под ногами, там, где мёртвые возвращаются в землю и земля впитывает всё, что когда-либо было живым. Большинство Лайбон спят над землёй, рядом с миром, который знают. Вы спите под ней, а значит, слышите то, чего не слышат они."
 pod_laibon.207.a: "Открыться недрам земли."
 pod_laibon.207.b: "Сопротивляться. Вы вампир, а не корень."
 pod_laibon.208.t: "Дар Бомкази"
 pod_laibon.208.desc: "Ваша Бомкази приходит к вам в сумерках, как всегда. Кормление это обряд древнее вас обоих: жизнь, отданная свободно, чтобы поддерживать смерть. Но сегодня она задерживается дольше обычного. Ей есть чем поделиться. Бомкази уникальны для Лайбон: женщины, что добровольно связывают свою кровь с вампиром, отдавая регулярно в обмен на защиту, положение и место на краю мира между живыми и мёртвыми. Эти отношения не собственничество, не совсем. Это договор между двумя людьми, каждый из которых по-своему выбрал жить за обычными границами человеческой жизни."
 pod_laibon.208.a: "Выслушать её. Поделиться тем, что знаете о мёртвых, в обмен на то, что она знает о живых."
 pod_laibon.208.b: "Позаботиться о её нуждах. Она стареет, и её магия обходится ей дорого."
 pod_laibon.208.c: "Попросить её помочь вам связаться с конкретным предком через совместный обряд."
 pod_laibon.208.c.success: "Совместный обряд удаётся. Предок говорит через границу миров."
 pod_laibon.208.c.failure: "Обряд глохнет и угасает. Предок не отвечает."
 pod_laibon.209.t: "Тьма прежде"
 pod_laibon.209.desc: "Охота окончена. Лес безмолвен. В затишье после убийства в вас шевелится нечто, что не [Glossary('Зверь','game_concept_beast_desc')], а может, это [Glossary('Зверь','game_concept_beast_desc')] до того, как у него появилось имя. Первозданная тьма, что создала вашего основателя, движется в вашей крови. Она не говорит. Она просто есть: огромная, терпеливая и древнее предков. Бонсам не обсуждают это открыто, даже между собой. Устои общества Лайбон были построены на понимании того, что Айя и Орун уравновешивают друг друга. То, что шевелится в вашей крови, старше этого равновесия: третье, что отказывается поддаваться категориям. Научиться жить рядом с этим, не будучи поглощённым им, это первый и последний урок вашего наследия."
 pod_laibon.209.a: "Спуститься во тьму. Пусть она покажет вам то, что существовало до миров."
 pod_laibon.209.b: "Открыться тьме, но не терять опоры в мире."
 pod_laibon.209.c: "Отвергнуть это. Лучше заняться охотой. Найти смертного, зверя, что-то настоящее."
 pod_laibon.210.t: "Дилемма учёного"
 pod_laibon.210.desc: "До вас доходит слух: смертный учёный в далёком городе приобрёл собрание текстов. Среди них, возможно, есть фрагмент чего-то более древнего: запись о Лайбон до того, как были написаны Устои. Такое знание недолго остаётся скрытым. Мёртвые шепчут, что вы должны пойти первым. Мла Вату были изгнаны из старого порядка по причинам, которые разные наследия объясняют по-разному, смотря у кого спросить, но в чём никто не сомневается, так это в том, что вы понимаете знание как силу так, как другие предпочитают оставлять в теории. Если существует запись о том, кем были Лайбон до того, как Устои их сформировали, вы намерены прочесть её прежде, чем кто-либо другой получит шанс решить, что она значит."
 pod_laibon.210.a: "Послать связанного призрака украсть тексты прежде, чем кто-либо другой доберётся до них."
 pod_laibon.210.b: "Лично отправиться к учёному сами. Подойти как коллега по поиску знания."
 pod_laibon.210.b.success: "Учёный впечатлён вашей эрудицией. Рождается партнёрство."
 pod_laibon.210.b.failure: "Учёный видит вас насквозь. Вы уходите с фрагментами, а не с целым."
 pod_laibon.210.c: "Поднять мёртвых в городе учёного. Расспросить тех, кто писал эти тексты при жизни."
 pod_laibon.300.t: "Откровение Странника"
 pod_laibon.300.desc: "Это происходит между одним ударом сердца и следующим, хотя ваше сердце больше не бьётся. Два мира совпадают. Вы видите их оба сразу: смертную деревню, спящую в лунном свете, и деревню духов, мерцающую позади неё, живых и мёртвых, идущих одними тропами, разделённых завесой тонкой, как дыхание. Каждому Лайбон говорят, что это возможно. Очень немногие живут достаточно долго, чтобы стоять здесь и знать это таким, какое оно есть. Старейшины говорят, что сам Кагн однажды стоял на этом же перекрёстке и видел всё творение, раскинувшееся перед ним, и свет, и тьму, и живых, и мёртвых, и понимал, что ни одно из них не реальнее другого."
 pod_laibon.300.a: "Вы на обеих сторонах."
 pod_laibon.301.t: "Пустота"
 pod_laibon.301.desc: "Теперь тишина полная. Ни шёпота предков. Ни тепла живых. Вы стоите в месте, которое не Айя и не Орун: пустота между мирами, где ничто не растёт и ничто не умирает. [Glossary('Зверь','game_concept_beast_desc')] наблюдает за вами из-за этой пустоты, терпеливый, как камень. Он ждал этого. Лайбон называют это Пустотой: не место, а состояние, духовный эквивалент раны, что не затягивается. Другие сородичи падают к [Glossary('Зверю','game_concept_beast_desc')] через голод и ярость. Лайбон может пасть через отсутствие: просто позволяя обеим связям угаснуть, пока не останется ничего, кроме хищника, носящего ваше лицо и ждущего разрешения взять всё полностью."
 pod_laibon.301.a: "Потянуться к Айе. Вспомнить живых: лицо, имя, неоплаченный долг."
 pod_laibon.301.a.success: "Всплывает воспоминание, тёплое, яркое, настоящее. Мир живых тянет вас обратно."
 pod_laibon.301.a.failure: "Воспоминание рассыпается. Держаться больше не за что. Зверь забирает то, что осталось."
 pod_laibon.301.b: "Потянуться к Оруну. Воззвать к предкам. Умолять их ответить."
 pod_laibon.301.b.success: "Голос отвечает с той стороны. Предки не оставили вас."
 pod_laibon.301.b.failure: "Тишина. Предки отвернулись. Зверь делает шаг вперёд."
 pod_laibon.301.c: "Сдаться. Вы слишком устали бороться."
 pod_laibon.400.t: "Два мира"
 pod_laibon.400.desc.intro: "Вы погружаетесь в неподвижность и обращаете сознание внутрь, туда, где кровь встречается с духом. Каждый Лайбон ходит между двумя мирами; #bold Айей#!, миром живых, и #bold Оруном#!, миром духов и предков. Ваша сила течёт из равновесия, которое вы между ними храните.\n\n"
 pod_laibon.400.desc.aye_tier3: "#bold Айя:#! Вы #bold Дитя Айи#! - глубоко укоренены в мире живых. Смертные нутром чуют твою власть.\n"
 pod_laibon.400.desc.aye_tier2: "#bold Айя:#! Ваша связь с миром живых #bold сильна#!. Смертные вокруг процветают под вашим влиянием.\n"
 pod_laibon.400.desc.aye_tier1: "#bold Айя:#! У вас #bold умеренная#! связь с миром живых. Смертные что-то ощущают, но не могут дать этому название.\n"
 pod_laibon.400.desc.aye_none: "#bold Айя:#! Вы #bold утратили связь#! с миром живых. Смертные не чувствуют вашего присутствия.\n"
 pod_laibon.400.desc.orun_tier3: "#bold Орун:#! Вы #bold Дитя Оруна#! - мир духов отвечает, когда вы зовёте. Предки идут рядом с вами.\n"
 pod_laibon.400.desc.orun_tier2: "#bold Орун:#! Ваша связь с миром духов #bold сильна#!. Предки шепчут наставления в предрассветные часы.\n"
 pod_laibon.400.desc.orun_tier1: "#bold Орун:#! У вас #bold умеренная#! связь с миром духов. Предки отзываются, когда вы рядом.\n"
 pod_laibon.400.desc.orun_none: "#bold Орун:#! Вы #bold утратили связь#! с миром духов. Предки молчат.\n"
 pod_laibon.400.desc.walker: "\n#bold Вы — [Select_CString(ROOT.Char.IsFemale, 'Идущая', 'Идущий' )]-Между-Мирами#! - вы овладели и Айей, и Оруном, стоя на перекрёстке самого бытия."
 pod_laibon.400.desc.hollow: "\n#bold Вы - Пустота#! - отсечены от обоих миров, дрейфуете в пустоте между ними. [Glossary('Зверь','game_concept_beast_desc')] наблюдает и ждёт."
 pod_laibon.400.a: "Что такое Айя - мир живых?"
 pod_laibon.400.b: "Что такое Орун - мир духов?"
 pod_laibon.400.c: "На чём держится равновесие?"
 pod_laibon.400.d: "Я понимаю."
 pod_laibon.401.t: "Мир живых"
 pod_laibon.401.desc.intro: "#bold Айя#! это ваша связь с миром смертных: землёй, людьми, живым пульсом ваших владений. Лайбон, сильный в Айе, правит не только через страх - его власть ощутима в самом мире живых. Смертные повинуются, потому что чувствуют вес вашей власти. Сама земля признаёт вас [Select_CString(ROOT.Char.IsFemale, 'своей хранительницей', 'своим хранителем' )].\n\nПо мере роста вашей Айи вы получаете влияние на мнение смертных, управление и стабильность ваших владений. На пике вы можете призвать Власть живых - силу, которая требует повиновения и от смертных, и от Лайбон.\n\n"
 pod_laibon.401.desc.tier3: "#bold Текущий статус:#! Вы достигли высшего уровня Айи - #bold Дитя Айи#!. Мир живых подвластен вашей воле."
 pod_laibon.401.desc.tier2: "#bold Текущий статус:#! Ваша Айя #bold сильна#! - вы прочно укоренены в мире живых, но ещё не достигли вершины."
 pod_laibon.401.desc.tier1: "#bold Текущий статус:#! Ваша Айя #bold умеренная#! - это основа, но впереди ещё большой путь."
 pod_laibon.401.desc.none: "#bold Текущий статус:#! Вы #bold утратили связь#! с Айей. Без этой связи вы получаете штрафы к влиянию на смертных."
 pod_laibon.401.desc.factors: "\n\n#bold Что усиливает Айю:#!\n- Дисциплины Присутствие и Доминирование\n- Содержание стада и участие в делах смертных\n- Наследия, склонные к Айе (Гурухи, Иштарри), и пути веры\n- События, связывающие вас с миром смертных\n\n#bold Что ослабляет Айю:#!\n- Неистовство и потеря контроля\n- Безрассудные убийства или истощение смертных\n- Естественное угасание со временем - Айю нужно активно поддерживать"
 pod_laibon.401.a: "Расскажите подробнее о двух мирах."
 pod_laibon.401.b: "Я [Select_CString(ROOT.Char.IsFemale, 'увидела', 'увидел' )] достаточно."
 pod_laibon.402.t: "Мир духов."
 pod_laibon.402.desc.intro: "#bold Орун#! это ваша связь с миром по ту сторону завесы: царством предков, духов и мёртвых. Лайбон, сильный в Оруне, ходит вместе с незримым. Предки делятся своими тайнами, духи дают свою силу, а граница между жизнью и смертью истончается до нуля\n\nПо мере роста вашего Оруна вы получаете мастерство, внушаете ужас и обретаете устойчивость к враждебным замыслам. На пике вы можете вступить в общение с предками - ритуал, который вырывает тайны из мира духов и окутывает вас силой мёртвых.\n\n"
 pod_laibon.402.desc.tier3: "#bold Текущий статус:#! Вы достигли высшего уровня Оруна - #bold Дитя Оруна#!. Мир духов отвечает на ваш зов."
 pod_laibon.402.desc.tier2: "#bold Текущий статус:#! Ваш Орун #bold сильный#! - предки говорят отчётливо, но глубочайшие тайны остаются скрытыми."
 pod_laibon.402.desc.tier1: "#bold Текущий статус:#! Ваш Орун #bold умеренный#! - духи отзываются, но их голоса едва слышны."
 pod_laibon.402.desc.none: "#bold Текущий статус:#! Вы #bold утратили связь#! с Оруном. Без этой связи вы уязвимы и ослаблены."
 pod_laibon.402.desc.factors: "\n\n#bold Что усиливает Орун:#!\n- Дисциплины Власть над Тенью и Некромантия\n- Питание вампирами и кровные узы\n- Наследия, склонные к Оруну (Раманга, Наглопер, Бонсам, Импундулу, Мла Вату), и пути веры\n- События, связывающие вас с миром духов\n\n#bold Что ослабляет Орун:#!\n- Естественное угасание со временем. Орун нужно активно поддерживать\n- Пренебрежение миром духов ради смертных забот"
 pod_laibon.403.t: "Равновесие"
 pod_laibon.403.desc.intro: "Система Айя/Орун отслеживает ваше духовное положение по двум осям. Каждая варьируется от пустой до полной, с порогами на трёх уровнях. Ваше наследие, конфессия, дисциплины и выборы определяют, где вы находитесь.\n\n"
 pod_laibon.403.desc.decay: "#bold Ежегодное угасание:#! И Айя, и Орун естественным образом ослабевают со временем. Чем выше ваш уровень, тем быстрее идёт угасание. Вы должны активно поддерживать свои связи, иначе рискуете их потерять. Если обе оси упадут ниже первого порога, вы станете #bold Пустотой#! - [Select_CString(ROOT.Char.IsFemale, 'отсечённой', 'отсечённым' )] от обоих миров и [Select_CString(ROOT.Char.IsFemale, 'получающей', 'получающим' )] серьёзные штрафы, пока не сумеете вернуть утраченное.\n\n"
 pod_laibon.403.desc.affinity: "#bold Наследие и конфессия:#! Ваше наследие Лайбон (клан) и путь веры слегка смещают ваш баланс. Наследия, склонные к Айе, вроде Гурухи и Иштарри, естественным образом тянут вас к миру живых. Наследия, склонные к Оруну, вроде Раманга и Наглопер, тянут к духам. Сбалансированные наследия, вроде Осебо и Акунансе, оставляют выбор за вами. Путь веры действует похожим образом: выберите тот, что соответствует желаемому пути, или тот, что уравновешивает ваше наследие.\n\n"
 pod_laibon.403.desc.special: "#bold Мастерство:#! Если вы одновременно достигнете высшего уровня и в Айе, и в Оруне, вы станете #bold [Select_CString(ROOT.Char.IsFemale, 'Идущей', 'Идущим' )]-Между-Мирами#! - редким состоянием духовной гармонии, дарующим прозрение, спокойствие и уважение соратников.\n\n#bold Способности третьего уровня:#! Достижение высшего уровня по любой из осей открывает мощное решение. Дитя Айи может призвать Власть живых, чтобы резко усилить влияние на смертных. Дитя Оруна может вступить в общение с предками, чтобы вырвать тайны из мира духов.\n\n#bold Дисциплины:#! Присутствие и Доминирование пассивно усиливают Айю. Власть над Тенью и Некромантия пассивно усиливают Оруна.\n\n#bold Питание и неистовство:#! Содержание стада усиливает Айю. Питание вампирами или узы крови усиливают Оруна. Убийства или осушение смертных ослабляют Айю. Впадение в неистовство смещает вас в сторону Оруна."