l_russian:
 # Opening Event - 0001
 POD_asakku.0001.t: "То, что всегда было там"
 POD_asakku.0001.desc: "Сегодня вечером, в тихие предрассветные часы в Баку, вдали от Еноха и вдали от внимательных глаз предателя Ямаданды, всплывает нечто, что вы веками подавляли.\n\nТерпеливое присутствие. Оно всегда было терпеливым. Оно не говорит ни на каком языке. Вы знаете это только через тонкое чувство, но теперь оно толкает вас на восток.\n\nОно никак себя не называет. Вы называли это по-разному. Сегодня вечером оно вновь спрашивает, собираетесь ли вы продолжать притворяться."
 POD_asakku.0001.a: "Вы всегда были там. В любом случае, я перестану притворяться."
 POD_asakku.0001.b: "Вновь подавить это."
 POD_asakku_soul_infection_accepted_tt: "Вам теперь доступны [Concept('scheme', 'происки')|E] «[GetScheme('POD_asakku_soul_infection_scheme').GetTypeName]» против #TOOLTIP:GAME_TRAIT,vampire,[GetNullCharacter] #L вампиров#!#!, владеющих #TOOLTIP:GAME_TRAIT,vicissitude,[GetNullCharacter] #L Изменчивостью#!#!. Начнётся новая [Concept('story_cycle', 'история')|E]."
 POD_asakku_suppressed_tt: "Эта сюжетная ветка будет отключена. Асакку больше не проявят себя. Этот выбор нельзя отменить."

 # Backstory Event - 0002
 POD_asakku.0002.t: "Память о плавании"
 POD_asakku.0002.desc: "Вы не думали о колодце много лет. Вы себе этого не позволяли. Колодец старше вашего становления. Старше, чем допотопный Цимисх, который забрал вас с высоких греческих холмов.\n\nВздыхающий Лев. Три рейса в Бурю, корпус корабля скрипит закалёнными душами. Лабиринт между мирами. Лес в его сердце, шепчущий человеческими голосами. Двор Тринадцати престолов и бездонный колодец в его центре.\n\nВы приблизились. Вы шептали в него. После этого вы сказали Ямаданде, единственному выжившему свидетелю, что говорили только сами с собой. Возможно, вы даже поверили в это.\n\nБолтуны, которым вы даровали становление на обратном пути к Еноху, усвоили Изменчивость быстрее, чем мог бы объяснить любой учитель. В Енох была послана фаланга, чтобы наказать вас после слишком большого количества неосмотрительных действий. Они нашли существа, по форме напоминающие смертных и сородичей, которых вы привезли домой, с почти узнаваемыми лицами, но не полностью. Они выли одно имя, пока фаланга их сжигала. Вы не произносили его тысячу лет.\n\nЯмаданды нет уже много веков, но его ученики-элиуды остались. Охотники, с которых он содрал кожу и которых пересоздал. Со временем они найдут и это место, и битва начнётся заново."
 POD_asakku.0002.a: "Память старше тела, которое её несёт."

 # Depth 25 Threshold - 0010
 POD_asakku.0010.t: "Голос становится громче"
 POD_asakku.0010.desc: "Сегодня вечером что-то изменилось. Не в мире, а в вас. Голос всегда был голосом. Теперь это присутствие, с весом, и оно перестало притворяться гостем в вашем доме.\n\nВы открываете зеркало, которое ваши слуги оставляют завуалированным из старой вежливости, потому что вы хотите знать. Вы видите своё лицо. Вы также видите что-то за этим, оглядываясь назад своими глазами так же, как вы смотрите ими наружу. Столетия обучения смотреть сквозь это не подготовили вас.\n\nТо, что обитает в вашей крови, не является злоумышленником, оно существует дольше, чем любая вера, которую вы носили, дольше, чем любезности, которые вы предлагали, какой бы священник или визир ни просил. Это первоначальный владелец. Вы — [Select_CString(ROOT.Char.IsFemale, 'гостья, принявшая', 'гость, принявший' )] этот дом за свой.\n\nВера, которую вы носили, вежливый синкретизм исчезают без церемоний. Вы уже давно знаете, как вы на самом деле молитесь. Сегодня вечером слова сформируются сами собой.\n\nВ Баку, далеко от тех, кто отметил бы этот момент, вы больше не вампир с необычным состоянием. Вы - Асакку. Возможно, лишь немногие существа поймут это различие, а те, кто поймёт, попытаются прикончить вас на месте."
 POD_asakku.0010.a: "Больше невозможно смотреть мимо этого."
 POD_asakku_depth_25_tt:0 "Вы - Асакку. Сущность пустила корни. Ваша конфессия меняется на Осквернённый путь."

 # Depth 50 Threshold - 0011
 POD_asakku.0011.t: "Голос имеет мнение"
 POD_asakku.0011.desc: "Теперь у голоса есть мнение. Он хочет, чтобы вещи росли. Чтобы семена были посеяны. Вы начали понимать, что когда говорится «сад», это не означает цветы.\n\nЭто также не поучение. Это сотрудничество. Мысли, которые приходят в вашу голову о расстановке вассалов, о том, какому сопернику позволить приблизиться, а кого вырубить, прежде чем он созреет, о медленном превращении вашей земли во что-то все менее и менее похожее на остальной мир. Вы не всегда можете сказать, исходят ли эти мысли от вас.\n\nИзменчивость в вашей крови тоже прояснилась. К вам приходят формы, которые никогда не предлагал ни один учитель. Дисциплина уже не дисциплина. Это то, как сущность движет вами, как язык движется во рту.\n\nИ есть что-то более новое, чем всё остальное, и его труднее описать. Способ быть [Select_CString(ROOT.Char.IsFemale, 'невидимой', 'невидимым' )]. Не затемнение других [Glossary('Кланы','game_concept_Clan_desc')]. Нечто более тихое. Присутствие внутри учит, не обучая, как ускользнуть от внимания даже от тех, кто точно знает, куда смотреть. Вы подозреваете, что иглы Ямаданды сейчас вас не найдут.\n\nТем не менее, охотники-#TOOLTIP:GAME_TRAIT,POD_asakku_elioud,[GetNullCharacter] #L элиуды#!#! будут знать. Они тоже терпеливы. Вы не сможете избежать их внимания навсегда."
 POD_asakku.0011.a: "Покажи мне, что посадить."
 POD_asakku_depth_50_tt: "Ваше мастерство углубляется. Теперь вы можете заражать землю порчей Изменчивости."

 # Depth 75 Threshold - 0012
 POD_asakku.0012.t: "Какие мысли принадлежат вам?"
 POD_asakku.0012.desc: "Вы больше не уверены, какие мысли принадлежат вам. Что вас удивляет, так это то, что мысли голоса не так уж отличаются от ваших собственных, возможно, более старых. Холоднее. Но узнаваемо родные. Это слияние или Асакку захватывает ваше прежнее «я»? Вы не можете сказать или, возможно, не хотите.\n\nХор внутри вас больше не замолкает. Ни в одиночестве, ни в ритуале, ни в том, что считается сном среди мёртвых. Прямо за поверхностью вашего внимания, непрерывно звучат голоса и мелькают невозможные образы — уже не ваши, не вполне ваши, и любой разум, проникающий в ваш разум, чтобы предвидеть или манипулировать, находит не тишину, а стену шума.\n\nЧерез кровь, которую вы распространили, вы можете слушать. Любой, кто является носителем вашей инфекции, также несёт в себе нить, которую вы можете потянуть. Вассал в своём дворе. [Glossary('Каинит','game_concept_cainite_desc')] за три княжества отсюда. Когда сущность желает, чтобы вы услышали, что происходит через её зал, вы это слышите. Вы знаете вещи, о которых вам не расскажет ни один шпион.\n\nВ Енохе Базальтовый трон заприметил дрожь. Дель'роъ уже чувствовал это раньше. Когда-то, очень давно, когда та же линия порчи вернулась из черного плавания. Серафимы будут созваны. Утром будет назначен новый #TOOLTIP:GAME_TRAIT,POD_asakku_elioud,[GetNullCharacter] #L элиуд#!#! или, возможно, сегодня вечером, в зависимости от того, насколько терпеливым решит быть Дель'рох.\n\nВ конце концов вы услышите об этом через кровь. Голос не удивлён. Война приближается, как и должно быть."
 POD_asakku.0012.a: "Мы родня."
 POD_asakku_depth_75_tt: "Ваша связь с Асакку становится глубже. «Шёпот души» становится доступным. Дель'рох обратит на это внимание."

 # Depth 100 Capstone - 0013
 POD_asakku.0013.t: "[Select_CString(ROOT.Char.IsFemale, 'Вознесённая', 'Вознесённый' )] Ирьи"
 POD_asakku.0013.desc: "Границы больше нет. По правде говоря, это различие всегда было искусственным. Утешение на протяжении веков, когда вам нужно было верить, что вы всё ещё лишь вампир. Но это не так. Вы стали чем-то старше и носите форму, которая раньше полностью принадлежала вам.\n\nОсквернённые, вернувшиеся с вами на «Вздыхающем льве», выли одно имя, пока горели. Вы не говорили этого тысячу лет. Сегодня вечером вы скажете это, не дрогнув, и само произнесение имени становится ответом. Аретстикафа. Наблюдатель, чья дисциплина стала Изменчивостью, когда она была украдена из Клипота перед Потопом. Голосом всегда был Наблюдатель, а Наблюдатель всегда был голосом, который, как вы притворялись, был неудачным наследством.\n\nВы думаете о высоких пастбищах над храмом, о ритуале, который привёл вас, о сире, который дал вам становление, и о совете, которому вы доложили. Вы думаете о первом слуге в путешествии, чье лицо развалилось на части, когда он выкрикивал это имя. Вы едины. Так было всегда.\n\nОстаётся остальной мир. Рука все еще охотится за вашей линией. #TOOLTIP:GAME_TRAIT,POD_asakku_elioud,[GetNullCharacter] #L Элиуды#!#! всё ещё точат свои иглы. Дель'рох по-прежнему восседает на Базальтовом троне, решая, какие вещи в темноте разрешить, а какие погасить. Наблюдатель внутри вас относится к ним с презрением, и вы относитесь к ним так же.\n\nИрьи вознёсся. Потоп не завершил работу. Но время есть."
 POD_asakku.0013.a: "Я [Select_CString(ROOT.Char.IsFemale, 'та', 'тот' )], кем я [Select_CString(ROOT.Char.IsFemale, 'стала', 'стал' )]."
 POD_asakku.0013.b: "Наконец я произношу имя. Аретстикафа."
 POD_asakku_depth_100_tt: "Слияние завершено. Вы — [Select_CString(ROOT.Char.IsFemale, 'вознесённая', 'вознесённый' )] Ирьи."