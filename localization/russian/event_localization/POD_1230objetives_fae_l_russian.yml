l_russian:

 pod1230objectives_fae.1.t: "Конец инквизиции"
 pod1230objectives_fae.1.desc: "Создание Инквизиции стало кульминацией Разъединения, когда Церковь в своих доктринальных поисках пыталась устранить из мира все нежелательные сверхъестественные элементы, включая фей. Но теперь все закончилось."
 pod1230objectives_fae.1.a: "Больше суеверий!"

 pod1230objectives_fae.2.t: "Константинианский катехизис"
 pod1230objectives_fae.2.desc: "Отче наш, сущий на небесах!\nДа святится имя Твоё;\nДа приидет Царствие Твоё.\nДа приидут твои святые духи и очистят наш.\nДа будет воля Твоя и на земле, как на небе;\nХлеб наш насущный подавай нам на каждый день;\nИ прости нам грехи наши, ибо и мы прощаем всякому должнику нашему;\nИ не введи нас во время испытаний - Раскола, но избавь нас от банальности.\nИбо Твоё есть Царство и сила и слава во веки."
 pod1230objectives_fae.2.a: "Аминь."

 pod1230objectives_fae.3.t: "За гранью разумного"
 pod1230objectives_fae.3.desc: "Происки ордена Разума сорваны. Их замыслы связать мир Разумом и Наукой потерпели крах. Их стальные мастерские замолкли. Тремеры уничтожены, война Массасы с орденом Гермеса закончилась поражением неживых колдунов-узурпаторов. Объединенные герметические дома могли обратить все свое внимание и гнев за разрушение Мистриджа на ремесленников и их тайный союз с единомышленниками-учеными, скупердяями, ханжами-богоборцами и прочими распространителями банальностей. Без «рациональных» философов человечество уже возвращается к своим старым верованиям и старым договорам с феями, чтобы понять смысл фантастического мира и выжить в нем."
 pod1230objectives_fae.3.a: "На небе и на земле существует больше вещей, чем можно представить в вашей философии."

 pod1230objectives_fae.4.t: "Козни раткинов"
 pod1230objectives_fae.4.desc: "Мерзкие раткины разработали темный план и создали самую смертоносную болезнь, известную как Черная чума. Вы рады, что остановили их до того, как они полностью распространили ее по миру."
 pod1230objectives_fae.4.a: "Мерзкие крысы."

 pod1230objectives_fae.5.t: "КОТострофа"
 pod1230objectives_fae.5.desc: "Сейчас все в мире обожают кошек, Пророчество крысы не исполнится, но может возникнуть другая проблема."
 pod1230objectives_fae.5.a: "О мой..."

 pod1230objectives_fae.6.t: "Восстановление Аркадии"
 pod1230objectives_fae.6.desc: "И когда занавес закрылся на великой сцене Осеннего мира, вы откинулись назад и позволили себе улыбнуться.\n\nВы добились своего. Банальности, великого дракона, безмолвной смерти, ненасытного прилива, гасящего истинную жизнь, больше нет. Искра в глазах мечтателей никогда не угаснет, потому что [UmbraGlossaryLocalized('arcadia','Аркадия')] пришла и останется здесь. Человечество вернуло себе чувство чуда.\n\nВы сотворили прекрасную историю. Осталось лишь несколько завершающих слов.\n\nКак насчёт «и жили они долго и счастливо»?"
 pod1230objectives_fae.6.a: "Объединить Грёзы с Землёй."
 pod1230objectives_fae.6.b: "Начать процесс, но не завершить его."
 pod1230objectives_fae.6.a.tt: "После слияния [UmbraGlossaryLocalized('arcadia','Аркадии')] с Землёй ваша игра закончится, поскольку мир, который вы когда-то знали, изменится навсегда."
 pod1230objectives_fae.6.b.tt: "Хотя слияние Земли и [UmbraGlossaryLocalized('dreaming','Грёз')] и не завершено, оно всё же приводит к тому, что Осенний мир становится похожим на сон, в результате чего любой [Concept('bunk', 'банк')|E] всегда будет успешным, а гламур полностью восстанавливается каждый месяц."

 # The Latin text is probably a musical parody of an earlier 12th century song beginning "intonent hodie voces ecclesie", written in honour of Saint Nicholas, the patron saint of Russia, sailors and children – to whom he traditionally brings gifts on his feast day, 6 December. https://en.wikipedia.org/wiki/Personent_hodie
 pod1230objectives_fae.7.t: "Вечный Санта!"
 pod1230objectives_fae.7.desc: "Свершилось! Бесчисленному множеству детей были вручены химерические подарки. Бесчисленное множество детей верят в вас! Их мечты наполняют вас бесконечным гламуром! Мир может быть охвачен кровопролитными войнами, ужасающими эпидемиями, ужасными инквизициями и душераздирающей банальностью — но вы выстоите!\n\n #EMP «В этот день земля зазвонит \nс песней поют дети \nГосподу, Христу, Царю нашему, \nрожден на земле, чтобы спасти нас; \nЕго Отец даровал его нам нам. \nИтак, слава в вышних Богу \nЕго смерть будет нашим искуплением; \nкогда он спустился на землю, \nВифлеем увидел его рождение; \nкорова и ослица рядом с ним \nот холода скроет его. \nИтак, слава в вышних Богу\nБожественная звезда сияет у него над головой, \nТрое волхвов пришли к нему; \nпреклонить колени у его кровати, \nони кладут перед ним свои дары, \nхвалите его и обожайте его. \nИтак, слава в вышних Богу \nВ этот день поют ангелы; \nот их песни земля звенит, \nвосхваляя Христа, Царя небес, \nрожденного на земле, чтобы спасти нас; \nмир и любовь он дал нам».#!"
 pod1230objectives_fae.7.a: "Хо-хо-хо!"

