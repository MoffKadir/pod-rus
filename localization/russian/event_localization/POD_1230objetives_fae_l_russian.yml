 pod1230objectives_fae.15.t: "Дао Те Сянь"
 pod1230objectives_fae.15.desc: "Изучив Нэй Тан и получив самое мощное гнездо дракона, вы стало Дао Те Сянь и теперь снова можете взаимодействовать с Небом."
 pod1230objectives_fae.15.a: "Я [Select_CString(ROOT.Char.IsFemale, 'вернулась', 'вернулся' )]."

 #########################################

 pod1230objectives_fae.30.t: "Война времён года: победа"
 pod1230objectives_fae.30.desc: "Война времён года завершилась. Вы — [Select_CString(ROOT.Char.IsFemale, 'несомненная победительница', 'несомненный победитель' )], и всё общество #TOOLTIP:GAME_TRAIT,fae,[GetNullCharacter] #L фей#!#! теперь в ваших руках."
 pod1230objectives_fae.30.a: "Как сладок вкус победы!"

 pod1230objectives_fae.31.t: "Война времён года: Вечное перемирие"
 pod1230objectives_fae.31.desc: "Война времён года завершилась. Все #TOOLTIP:GAME_TRAIT,fae,[GetNullCharacter] #L феи#!#! наконец-то примирились друг с другом."
 pod1230objectives_fae.31.a: "Нет ничего лучше мира."

 #########################################

 pod1230objectives_fae.150.t: "[Select_CString(ROOT.Char.IsFemale, 'Королева', 'Король' )] Подземного моста"
 pod1230objectives_fae.150.desc: "Я [Select_CString(ROOT.Char.IsFemale, 'захватила', 'захватил' )] всё больше и больше мостов и [Select_CString(ROOT.Char.IsFemale, 'превратила', 'превратил' )] своё королевство Подземного моста в могущественную державу. Я получу свою плату. Горе бедному путнику, который не сможет заплатить за проезд. Неблагие феи и ужасные чудовища стекаются под мои знамёна и к тёмному течению."
 pod1230objectives_fae.150.a: "Никто не пройдёт без моего дозволения."

 pod1230objectives_fae.151.t: "[Select_CString(ROOT.Char.IsFemale, 'Верховная королева', 'Верховный король' )] Подземного моста"
 pod1230objectives_fae.151.desc: "После того как реки Восточной Европы перешли под ваш контроль, пугающее пространство под множеством мостов станет вашим владением. Никто не сможет перебраться через ревущие воды без вашего согласия. Все будут платить вам дань, в то время как вы сможете перемещать в этот мир порождения чистого кошмара так же легко, как на приятную прогулку."
 pod1230objectives_fae.151.a: "Никто не пройдёт без моего дозволения."

 pod1230objectives_fae.1100.t: "Борбетомаг возвращён!"
 pod1230objectives_fae.1100.desc: "Древняя столица старой Бургундии стала частью вашей державы."
 pod1230objectives_fae.1100.a: "Путь к Рейну открыт передо мной."

 pod1230objectives_fae.1200.t: "[Select_CString(ROOT.Char.IsFemale, 'Королева', 'Король' )] Рейна!"
 pod1230objectives_fae.1200.desc: "Теперь вся река Рейн находится под вашим контролем. Где-то на её берегах, несомненно, протекает золото Рейна."
 pod1230objectives_fae.1200.a: "В земле Рейна будет... [Select_CString(ROOT.Char.IsFemale, 'королева, королева, королева, королева', 'король, король, король, король' )]!"

 pod1230objectives_fae.1300.t: "Рейнская империя!"
 pod1230objectives_fae.1300.desc: "Теперь, когда вы захватили все герцогства вдоль Рейна и вернули золота Рейна в свою казну, никто не сможет оспорить ваше право править Рейном."
 pod1230objectives_fae.1300.a: "Рейн - мой и вовек!"