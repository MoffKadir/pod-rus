l_russian:

 # A Curious Investigation - 0205
 POD_asakku.0205.t: "Любопытное расследование"
 POD_asakku.0205.desc: "Ваш тайный советник сообщил о незнакомце, задающем вопросы при дворах недалеко от Баку. Конкретные вопросы. Такой вопрос может задать только тот, кто знает, что искать. Незнакомец расспрашивал об #TOOLTIP:GAME_TRAIT,vicissitude,GetNullCharacter #L Изменчивости#!#!."
 POD_asakku.0205.a: "Найти его."
 POD_asakku.0205.b: "Подстроить несчастный случай."
 POD_asakku_reveal_elioud_tt: "Будут раскрыты личность и местонахождение ближайшего элиуда."
 POD_asakku_assassinate_elioud_tt: "Вы можете начать происки против ближайшего элиуда."

 # The Phalanx - Warning (0210)
 POD_asakku.0210.t: "Фаланга: предупреждение"
 POD_asakku.0210.desc: "Они пришли группой. Не убийца, а отряд. Ваш тайный советник насчитал как минимум троих, и они двигаются вместе с такой дисциплиной, которая предполагает всю жизнь в такой работе. Они знают, где находится ваше убежище, и, что более важно, они знают, кто вы. Информаторы называют имя охотника-#TOOLTIP:GAME_TRAIT,POD_asakku_elioud,GetNullCharacter #L элиуда#!#!, которого ваша сеть уже заприметила ранее.\n\nТерпеливый. Методичный. Опасный."
 POD_asakku.0210.a: "Подготовиться к их приходу."

 # The Phalanx - Assault (0211)
 POD_asakku.0211.t: "Фаланга: нападение"
 POD_asakku.0211.desc: "Они напали на убежище за час до рассвета. Охотник-#TOOLTIP:GAME_TRAIT,POD_asakku_elioud,GetNullCharacter #L элиуд#!#! идёт впереди. Признак того, кто верит в правоту своего дела. Остальные удерживают выходы.\n\nУ вас есть секунды, чтобы решить, как их встретить."
 POD_asakku.0211.a: "Встретить их со всем, что у вас есть. #weak (Доблесть)#!"
 POD_asakku.0211.a.success: "Их лидер дрогнул первым. Остальные разбежались. Вы стоите среди развалин своего собственного убежища и, как ни странно, чувствуете что-то вроде удовлетворения, хотя уже и не уверены, принадлежит ли оно вам."
 POD_asakku.0211.a.success.desc: "Их лидер дрогнул. Остальные разбежались"
 POD_asakku.0211.a.wounded: "Вы отбросили их, но охотник пускает кровь, прежде чем отступить. Они вернутся. Однако сегодня вы уцелели."
 POD_asakku.0211.a.wounded.desc: "Вы отбросили их назад"
 POD_asakku.0211.a.grave: "Они почти схватили вас. Охотник-элиуд уходит с чем-то, что можно продемонстрировать за свои усилия. Вы живы, но цена была тяжёлой."
 POD_asakku.0211.a.grave.desc: "Они почти поймали вас"
 POD_asakku.0211.b: "Использовать против них паутину. #weak (Интриги)#!"
 POD_asakku.0211.b.success: "Вы передаёте заражённым ложную информацию, заманивая камут не в то убежище и исчезаете прежде, чем они это осознают. К тому времени, когда они перегруппируются, вы уже находитесь в трёх улицах от них и наблюдаете, как они объясняют друг другу, что пошло не так."
 POD_asakku.0211.b.success.desc: "Обман удался"
 POD_asakku.0211.b.failure: "Обман рушится. Охотник уже видел это раньше или что-то в этом роде. Вы сбегаете, но с трудом, и они точно знают, как вы мыслите."
 POD_asakku.0211.b.failure.desc: "Обман рушится"
 POD_asakku.0211.c: "Исчезнуть. Они ничего не найдут. #weak (Бежать)#!"
 POD_asakku_phalanx_vanish_tt: "Вы покидаете убежище и исчезаете. Вы выживете, но элиуды узнают, что вы сбежали, и связь с Асакку ослабнет под тяжестью страха. Будет потеряно 5 единиц глубины и получен модификатор «Цель охоты»."

 # The Phalanx - Aftermath (0212)
 POD_asakku.0212.t: "Фаланга: последствия"
 POD_asakku.0212.desc.fight_clean: "Фаланга явилась. Вы выжили. Вы сидите, пытаясь извлечь уроки из того, что произошло. Они знали, что ищут. У них были для этого названия, протоколы, годы практики по выявлению того, что живёт в крови других. Они пришли специально за вами, и были компетентны, но всё равно проиграли.\n\nОдин из них, умирая, смотрел на вас без ненависти. Не без страха, а с чем-то вроде изнеможения. Для них это была работа. Необходимая работа. Вопрос, когда он прозвучал, не был обвинением.\n\n«Это всё ещё ты внутри?»\n\n Вы не ответили. Вы боитесь того, каким был бы ответ."
 POD_asakku.0212.desc.fight_wounded: "Фаланга явилась. Вы отбросили их назад. Вы сидите наедине с тем, чего вам стоила эта ночь. Они знали, что ищут. У них были для этого названия, протоколы, годы практики. Они пролили кровь, прежде чем отступить, и вы провели часы до рассвета, оценивая ущерб, задаваясь вопросом, что было потеряно, что можно исцелить, а что нет.\n\nНичто из этого не тревожило сущность внутри вас. Возможно, она была убеждена в вашей окончательной победе. Или, возможно, ей было всё равно."
 POD_asakku.0212.desc.fight_grave: "Фаланга явилась. Вы едва выжили. Вы сидите, медленно отделяясь от бури, чтобы оценить, что произошло на самом деле. Они знали, что ищут. У них были для этого названия, протоколы, годы практики. Они почти схватили вас.\n\nЗа несколько мгновений до того, как ситуация изменилась, прошёл отрезок времени, который вы не можете вспомнить. Разрыв, в котором что-то ещё управляло телом, которое вы называете своим. Вы живы. Вы не совсем уверены, кого из вас благодарить за это. Возможно, вам следует беспокоиться об этом больше, чем вы в конечном итоге делаете."
 POD_asakku.0212.desc.outmaneuvered: "Фаланга явилась. Вы выжили и более того. Вы сидите и гадаете, что рассказала ночь о них и, что более важно, о вас самих. Они знали, что ищут. Они пришли специально за вами, с именами, протоколами и годами практики.\n\nВы скормили им ложную информацию через заражённых. Они попали не в то убежище, ничего не нашли и потратили большую часть часа, пытаясь понять, что пошло не так. Вы почувствовали, как внимание сущности обострилось вместе с вашим, не направляя вас, а наблюдая. Заинтересовано.\n\nВы также думаете, что остались довольны результатами. А может, довольна была она? Вы задаётесь вопросом, где проходит линия в наши дни, существует ли она вообще."
 POD_asakku.0212.desc.intrigue_failed: "Фаланга явилась. Вы выжили, но не так, как собирались. Вы сидите, и погоня наконец осталась позади, и у вас есть время (мысленно) вздохнуть. Они знали, что ищут. У них были для этого названия, протоколы, годы практики. Сегодня вечером к этому списку добавилось что-то новое: то, как вы думаете.\n\nОбман рухнул быстрее, чем следовало бы. Вы едва сбежали, и к тому времени, как вы выбрались из убежища, вы поняли, что изменилось. Они знают, как вы мыслите теперь. Они знают, как сущность движется сквозь вас, как использует ваши связи, как передает разведданные. Такие знания не устаревают. Они используют это."
 POD_asakku.0212.desc.fled: "Фаланга явилась. Вы выжили ценой, которая ещё не подсчитана. Вы сидите с тем, что осталось, и воспоминаниями о событиях сегодняшнего вечера. Они знали, что ищут. У них были для этого названия, протоколы, годы практики по выявлению того, что живёт в крови других. Сегодня вечером вы не дали им ничего найти.\n\nВы покинули убежище и двинулись быстро, без сантиментов, не оглядываясь назад. Голос в вашей крови всё время молчал. Не одобряя решение. Не противодействуя этому. Просто присутствуя, как присутствует прилив. Терпеливость, не имеющая ничего общего с прощением. Для [Select_CString(ROOT.Char.IsFemale, 'той', 'того' )], кто [Select_CString(ROOT.Char.IsFemale, 'могла', 'мог' )] быть [Select_CString(ROOT.Char.IsFemale, 'свидетельницей', 'свидетелем' )] начала всего сущего, ваше ничтожное «бессмертие» — капля в океане."
 POD_asakku.0212.a: "Это всё ещё я. По большей части."
 POD_asakku.0212.b: "Мы выиграли. Я всё ещё решаю, подходящее ли это слово."
 POD_asakku.0212.c: "Теперь они знают, как я мыслю. И сущность тоже."
 POD_asakku.0212.d: "Я [Select_CString(ROOT.Char.IsFemale, 'сделала', 'сделал' )] правильный выбор."

 # Eastern Shadows (0215)
 POD_asakku.0215.t: "Восточные тени"
 POD_asakku.0215.desc.base: "Западные владения разрушены. Камуты, преследовавшие вас по всему христианскому миру, замолчали. Но сущность внутри вас не отдыхает и не даёт вам уверенности в том, что работа завершена. Остаётся восток, где всё началось. Наследие писца-предателя Ямаданды, который однажды остановил вас, не умерло вместе с ним. Оно было унаследовано, усовершенствовано и заточено руками, которые никогда не знали первоначального кузнеца, но понимали назначение клинка.\n\nДва имени всплывают из сведений, которые несёт в себе ваша кровь. Фигуры, действующие в восточных пределах Истинной Руки, каждая из которых опасна в том смысле, в каком не были западные охотники. Западные элиуды были солдатами. Это нечто другое. Они знают, что являются последней стеной перед чем-то ужасным, возможно, даже более ужасным, чем Геенна.\n\nПеред вами."
 POD_asakku.0215.desc.mokhadaji: "\n\nПервый — Мохададжи Ранпур. Князь Нагараджа из предгорий Бенгалии, потративший два столетия на составление досье на заражённых. Там, где западные элиуды наносили удары железом и огнём, Мохададжи работает чернилами и терпением. Он каталогизирует. Он делает перекрестные ссылки. Он отображает форму вашей инфекции в разных дворах и линиях крови с точностью учёного, комментирующего Священные Писания. Он никогда не поднимал против вас оружие. Он сделал нечто худшее: он понимает вас.\nПервый предатель, Ямаданда, сам был писцом. Вы слишком хорошо знаете, что нельзя недооценивать этих людей слова."
 POD_asakku.0215.desc.nattadevi: "\n\nВторая — Наттадеви. В восточных владениях её называют Красным пальцем. Там, где Мохададжи чертит карту, она перерезает связи. Полевой оперативник, вмешательство которого в ваши операции было хирургическим, целенаправленным и невероятно эффективным. Она не составляет досье. Она действует, перемещаясь по вашей сети с уверенностью человека, который точно знает, где соединяется каждая нить."
 POD_asakku.0215.a: "Теперь я знаю их имена."

 # The Final Accounting (0220)
 POD_asakku.0220.t: "Окончательный учёт"
 POD_asakku.0220.desc.base: "Из Еноха пришли новости. Дель'Рох издал директиву. Язык клинический: на Кавказе выявлена ​​«духовная зараза». Они не называют вас.\n\nИм это не нужно."
 POD_asakku.0220.desc.pietro_asakku: "Один из назначенных ими камутов больше недоступен. Вы знаете, где он. Он при вашем дворе и смотрит на мир чужими глазами. Враг стал союзником, как и все в конце концов."
 POD_asakku.0220.a: "Пусть приходят."

 # Objective Phase Events
 POD_asakku.0401.t: "Фаза завершена: заражение души"
 POD_asakku.0401.desc: "Семена посажены. Зараза распространяется по Изменчивости, как огонь распространяется по сухому дереву. При вашем дворе есть носители. В вашей сети есть носители. Как и в случае с болезнью, вы начали терять счёт того, сколько людей может быть заражено, а может и нет.\n\nГолос внутри вас доволен, хотя слово «доволен» подразумевает эмоцию, которой он не совсем обладает. Что у него есть, так это признание: этот этап работы завершён. Голос делал это раньше, возможно, при дворах, комнатах и ​​столетиях, которые прошли за пределами вашей памяти, но, как вы подозреваете, не за пределами его собственной.\n\nВы больше не одиноки в своей работе. По правде говоря, вы уже очень давно ни в чём не одиноки."
 POD_asakku.0401.a: "Углубить корни."
 POD_asakku.0401.b: "Распространиться шире."
 POD_asakku_phase1_deepen_tt: "Связь с Асакку усиливается. Будет получено #bold 5 глубины#!."
 POD_asakku_phase1_spread_tt: "Инфекция ускоряется. Будет получен модификатор #bold Широкое распространение#! на 10 лет, что повысит вероятность успеха происков и снизит риск обнаружения."

 POD_asakku.0402.t: "Фаза завершена: распространяющееся пятно"
 POD_asakku.0402.desc: "Элиуды пришли за вами, и они потерпели неудачу. Какова бы ни была цена, измеряемая в сожжённых убежищах, в не переживших ночь вассалах, в планах, которые пришлось переделывать в темноте. Вы уцелели. Камут, которого Вазир выбрал для вашего уничтожения, мёртв, развоплощён или носит ваше лицо в их отчётах.\n\nЗарождение крови дало вам новообращённых. Руки при дворах, где вы не бывали. Глаза в комнатах, которых вы никогда не видели. Рты, которые говорят вашим голосом, когда говорят о чем-то важном, и своими собственными голосами, когда говорят о чем-то несущественном.\n\nСущность вознаграждает лояльность в единственной монете, которую она понимает: больше себя. Вы, возможно, начали подозревать, что торг был проявлением вежливости."
 POD_asakku.0402.a: "Консолидировать сеть."
 POD_asakku.0402.b: "Развить успех."
 POD_asakku_phase2_consolidate_tt: "Укрепить свою позицию. Будет получен модификатор #bold Консолидированная сеть#!, который снижает вероятность успеха вражеских происков и замедляет вражеские происки против вас."
 POD_asakku_phase2_press_tt: "Нанести удар, пока они не оправились. Будет получен модификатор #bold Развитие успеха#!, который увеличивает силу враждебных происков и снижает риск раскрытия."
 POD_asakku_war_forms_unlocked_tt: "Будут разблокированы профессионалы - #bold боевые формы Асакку#!. Гули, чья плоть преобразована волей сущности."

 POD_asakku.0403.t: "Чистка западных узурпаторов"
 POD_asakku.0403.desc: "Западное направление Теневого крестового похода завершено. Камуты, которые охотились за вами от Константинополя до Сарагосы и на Кавказе, убежища, которые они использовали, владения, которые информировали их, цепочки разведки, которые снабжали их целями, — всё исчезло. Убиты там, где убийство было эффективным. Изменены там, где изменение было полезно. Опустошены и продолжают выполнять свои старые роли, где обман обещал больше, чем могло бы дать убийство.\n\nДель'рох смирился с потерей, если выбранный им способ можно назвать смирением. Восточные владения действуют с новой настойчивостью. Истинная Рука выстояла. Рука всегда продолжает существовать.\n\nВы также продолжаете, а голос ведёт вас к триумфу, который придёт в этой жизни или в следующей."
 POD_asakku.0403.a: "На восток."

 POD_asakku.0404.t: "Голос наблюдателя"
 POD_asakku.0404.desc: "Вы больше не уверены, когда в последний раз у вас была мысль, которая была полностью вашей собственной. Неопределённость уже не так тревожна, как раньше. Это просто положение вещей. Что бы ни было в этом колодце, оно было с вами с тех пор, как Вздыхающий лев повернул нос обратно к верхнему миру, и вы поняли, что «одержимость» — неподходящее слово для обозначения того, что произошло в последующие столетия.\n\nЦимисх, обративший вас, понимал это по-своему. Колдуны в своих башнях иногда видели это. Сущность всегда была участником дисциплины, которую они называют Изменчивостью, возможно, первоначальным участником, возможно, единственным, чьё участие действительно имеет значение, и это участие не является настоящим хищничеством. Это соавторство. Автор просто терпеливо ждал, прежде чем заявить свои права.\n\nВы не потеряли себя. Вы стали чем-то, что содержит в себе и то, и другое. Шов, где вы двое встречаетесь, растворился, и это растворение не означает, как вы когда-то боялись, смерть одной из сторон. Это становление третьего.\n\nГде-то в глубине ваших мыслей ждёт имя. Вы провели тысячу лет, притворяясь, что не слышали этого. В данный момент не кажется, что это притворство можно продолжать долго. Но сегодня не тот вечер, когда вы произнесёте его. Еще нет."
 POD_asakku.0404.a: "Пока нет. Но скоро."

 POD_asakku.0405.t: "Восточная расплата"
 POD_asakku.0405.desc.base: "Восток готов. Здесь традиция Ямаданды заканчивается не учеными, железными иглами и тщательно выбранными наследниками, а огнём или кровью и вашей победой. Восточные владения Вазира погрузились в молчание. Ячейки, которые они создавали, были расформированы по той простой причине, что им некому было отчитываться. В библиотеках Еноха всё ещё хранятся его сочинения, но читать их некому.\n\nЭлиудов больше нет. Истинная Рука продолжает существовать, Рука всегда продолжается, но теперь она ослаблена и пребывает в недоумении, невиданном со времён Долгой Ночи, не зная точно, что стало с её пропавшими членами.\n\nОстается только Наблюдатель. Остаётся работа. Работа находится на грани. Вы находитесь на краю. Это далеко от высоких пастбищ над храмом, где вы впервые научились правильно отделять плоть от костей, но вы шли по нему еще до того, как поняли, что идёте."
 POD_asakku.0405.desc.both_converted: "Мохададжи и Наттадеви. Князь Нагараджа в предгорьях, который два столетия собирал на вас досье. Красный палец, которая вмешивалась в ваши дела. Они оба сейчас сидят при вашем дворе и смотрят не совсем своими глазами. Они прислушиваются к голосу, который несёт ваша кровь, к той части, которая получает инструкции в промежутках между вашими словами.\n\nОни были вашими самыми терпеливыми врагами. Теперь они, возможно, ваши самые полезные инструменты. Ямаданда, куда бы он ни пошёл, нашёл бы это либо великолепным, либо невыносимым. Он больше не в состоянии выбирать между ними."
 POD_asakku.0405.a: "Дело сделано."

 # What Remains - 0406 (Yamadanda coda, fires 6 months after 0405)
 POD_asakku.0406.t: "То, что осталось"
 POD_asakku.0406.desc: "Рано утром вы сидите и ловите себя на мысли о самом основателе. [yamadanda.GetName] изчес почти тысячу лет назад. Официальные записи не упоминают ни уничтожения, ни достойного торпора старейшины, решившего на время отстраниться от мира.\n\nЭлиуды, с которых он содрал кожу и которых пересоздал, были лишь средством для достижения цели. Рука сломлена, но цель остаётся. В библиотеках Еноха до сих пор хранятся его записи. Протоколы всё ещё циркулируют, даже несмотря на то, что не осталось ни одной ячейки, которая могла бы действовать в соответствии с ними. И где-то, в какой-то палате или в каком-то длинном тихом лабиринте Бури, сам маг. Ямасаттва, душа, заключенная в тело старше большинства империй, всё ещё слушает.\n\nВы не знаете, достигнет ли его уничтожение его элиудов. Но голос в вашей крови насторожен, чего не было с тех пор, как пришла фаланга. Он что-то заметил. Он ещё не скажет вам, что именно.\n\nВы закрыли восточную рану. Возможно, вы не закрыли книгу."
 POD_asakku.0406.a: "Тогда мы тоже подождем."