 POD_mokole.101.t: "[Select_CString(ROOT.Char.IsFemale, 'Повелительница', 'Повелитель' )] зверей"
 POD_mokole.101.desc: "После многих лет постоянных поисков в Умбре и забытых уголках мира вы нашли последних выживших родичей королей-драконов. После того, как вы внесёте их в каталог, они, возможно, будут возвращены в мир живыми и невредимыми под вашим присмотром."
 POD_mokole.101.option.a: "Жизнь нашла путь..."


 POD_mokole.300.t: "Под песками"
 POD_mokole.300.desc: "По мере того, как вы получаете сообщения о завершении текущего этапа восстановления Крокодилополя, вы получили ещё более любопытное сообщение. Были найдены два древних мумифицированных «мертвеца», которые, будучи подняты на поверхность, выбрались из своих реликвариев и преобразились. Когда вы поприветствовали их, два древних моколе рассказали вам на своём общем языке, что когда-то они были детьми великого воина, но с падением города все они погрузились в дремоту. Они благодарны вам за то, что вы разбудили их, и присоединились к числу ваших воителей. Однако они просят вас копать глубже, так как есть вероятность, что их более сильный родитель находится в таком же состоянии, как и они."
 POD_mokole.300.option.a: "Если они ученики, то что же скрывается ещё глубже?"


 POD_mokole.301.t: "Древний воин"
 POD_mokole.301.desc: "Пока вы наблюдаете за последними этапами восстановления Крокодилополя, в вашей голове эхом отдаются слова собрата, который обнаружил последнюю гробницу. Как только гробницу открыли и внутрь попали солнечные лучи, из неё выскочил огромный крокодил с молочно-голубыми глазами. Он вытягивается, прежде чем снова принять человеческий облик. Вы подходите к нему, и они узнают старейшину из народа, который разбудил его. Несмотря на его слепоту, по одному их движению вы можете сказать, что по остроте инстинктов он не имеет себе равных. Одетый в регалии защитника Анубиса, он - настоящий тритон, вытащенный из воды. Через несколько дней он понимает мир настолько, насколько вам известно, и решил присоединиться к вам, чтобы восстановить свой дом. Учитывая бесчисленное количество трупов древних сетитов в его гробнице, это была чрезвычайно ценная находка."
 POD_mokole.301.option.a: "Анубис преподнёс нам ещё один великий дар."


 POD_mokole.502.t: "Четыре части одного целого"
 POD_mokole.502.desc: "Когда-то все моколе принадлежали к одному течению. При королях-драконах не было никаких Моколе-мбембе, Гумаган, Макара или Чжун-лун, а были просто Короли. Когда вам снятся те времена, ваше течение начинает сходиться, и перед вами открываются новые возможности."
 POD_mokole.502.option.a: "Сны Моколе-мбембе."
 POD_mokole.502.option.b: "Сны Гумаган."
 POD_mokole.502.option.c: "Сны Макара."
 POD_mokole.502.option.d: "Сны Чжун-лун."




 mnesis_quest_message_title: "Мнезис"


 POD_mokole.600.desc: "Вам снятся более спокойные времена."
 POD_mokole.601.desc: "Вам снятся умершие моколе."
 POD_mokole.602.desc: "Вам снятся мирные времена."
 POD_mokole.603.desc: "Вам снятся мрачные, сбивающие с толку кошмары."
 POD_mokole.604.desc: "Вам снится, словно вы купаетесь в гнозисе."
 POD_mokole.605.desc: "Вам снится давно потерянная кладка, где вы прижимались друг к другу в поисках тепла и безопасности."
 POD_mokole.606.desc: "Вам снятся джунгли Амбаласокеи, свирепые и дико красивые."
 POD_mokole.607.desc: "Вам снится война и разрушенные останки, бесконечные раздоры и страх."
 POD_mokole.608.desc: "Вам снится Гендаси, бескрайние равнины, успокаивающие ваш сон."
 POD_mokole.609.desc: "Вам снится Речной договор, беспрецедентная надежда на мир между ящерами и волками."
 POD_mokole.610.desc: "Вам снится угасшая дружба, породившая ожесточённое соперничество."
 POD_mokole.611.desc: "Вам снится могучий Дерзкий Бивень Могучее Копыто, последний король грондр, павший от когтей гару."
 POD_mokole.612.desc: "Вам снится последний апис Крита, оклеветанный в памяти гару и смертных."
 POD_mokole.613.desc: "Вам снится древний Кхем, где родня моколе заботилась о том, чтобы Солнцу поклонялись должным образом."
 POD_mokole.614.desc: "Вам снится начало жизни в Энтобане, задолго до того, как появилось всё остальное."
 POD_mokole.615.desc: "Вам снится выжженный солнцем Бандайян, навеки свободный от скверны."
 POD_mokole.616.desc: "Вам снится, как вы видите сны в Эпоху сна."
 POD_mokole.617.desc: "Вам снятся люди, устилающие города золотом, прежде чем затопить их реками крови."
 POD_mokole.618.desc: "Вам снится Оаннес, где делились мудростью и крали её."
 POD_mokole.619.desc: "Вам снятся потерянные и утраченные мечты."
 POD_mokole.620.desc: "Вам снятся цели Геи, которые вы не можете постичь."
 POD_mokole.621.desc: "Вам снятся короли динозавров, свирепо рычащие и не подозревающие об ожидающей их участи."
 POD_mokole.622.desc: "Вам снятся Последние времена, где всё началось и кончилось."
 POD_mokole.623.desc: "Вам снятся короны и скипетры, которые превращаются в пыль, когда время превращает их в ничто."
 POD_mokole.624.desc: "Вам снятся змеиные судьи, а они пытаются украсть ваш сон так же, как они крадут вашу форму."
 POD_mokole.625.desc: "Вам снятся уани, которые отдают свои яйца королеве-матери, чтобы та привезла их в Поднебесную."
 POD_mokole.626.desc: "Вас снятся хаккен, отправляющиеся в самоизгнание на острова Нихон."
 POD_mokole.627.desc: "Вам снятся древние храмы королей-ящеров, посвящённых Гелиосу, Отцу-Солнцу."
 POD_mokole.628.desc: "Вам снится Война позора и создание Звериных дворов."
 POD_mokole.629.desc: "Вам снится провал моколе и решение Геи создать другие породы [Glossary('фера', 'glossary_fera_tt')]."
 POD_mokole.630.desc: "Вам снятся великие динозавры и их укротители из числа королей-ящеров."












 POD_mokole.681.t: "Утраченные сны"
 POD_mokole.681.desc: "В то время как большинство моколе замыкаются в себе и прячутся в своих снах, ностальгия всегда таит в себе угрозу. Что касается моколе, то именно охотники за сновидениями, умбральные ловчие, преследующие и извращающие их сны, стремятся заглушить свою тоску. К сожалению, пока вы спите, кто-то начал вторгаться в ваши мысли, стремясь вас уничтожить."
 POD_mokole.681.option.a: "Убедить его уйти."
 POD_mokole.681.option.b: "Прогнать его прочь."

 POD_mokole.682.t: "Незваный гость"
 POD_mokole.682.desc: "Погрузиться в приятные воспоминания Мнезиса - это роскошь, присущая только моколе, но не лишённая риска. Охотники за сновидениями, умбральные ловчие, которые преследуют моколе во время всех их личных побегов, пришли, чтобы найти вас в вашем собственном убежище в Мнесисе, желая добавить вашу смерть в память предков Мнезиса."
 POD_mokole.682.option.a: "Перехитрить их."
 POD_mokole.682.option.b: "Прогнать их."




 POD_mokole.689.good: "Вам удалось кое-чему научиться у побеждённого охотника за сновидениями."




 POD_mokole.690.t: "Пробуждение"
 POD_mokole.690.desc: "Когда поиски Мнезиса подходят к концу, мир живых и смертных снова зовёт вас. Вы просыпаетесь вместе с воспоминаниями, и всё больше общих воспоминаний моколе становятся вашими собственными. Вы пробуждаетесь от воспоминаний, и теперь выбор за вами, что с ними делать."
 POD_mokole.690.option.a: "Спать, возможно, видеть сны."

 mokole_mnesis_quest_widget_tt: "Вы немедленно начнёте другое [Concept('journey', 'странствие')|E] #bold Мнезиса#!."
 mokole_mnesis_quest_widget_desc: "Отправиться на очередное [Concept('journey', 'странствие')|E] #bold Мнезиса#!?"







 POD_mokole.torment: "Истязания!"
 POD_mokole.torment_desc: "Один из ваших [Concept('tormentors', 'истязателей')|E] действует против вас!"

 POD_mokole.700.t: "Нападение невинного"
 POD_mokole.700.desc: "[Concept('innocent', 'Невинный')|E] напал на вас!"
 POD_mokole.701.t: "Преследование"
 POD_mokole.701.desc: "Что-то зловещее преследует вас в Умбре."
 POD_mokole.702.t: "Истощение"
 POD_mokole.702.desc: "Затаившийся [Concept('innocent', 'невинный')|E] истощил вашу силу."
 POD_mokole.703.t: "Нападение"
 POD_mokole.703.desc: "На вас напала парочка [Concept('innocents', 'невинных')|E]!"
 POD_mokole.704.t: "Серебряная засада"
 POD_mokole.704.desc: "[Concept('innocent', 'Невинный')|E], усиленный серебром, устроил вам засаду!"
 POD_mokole.705.t: "Ужас"
 POD_mokole.705.desc: "Ужасные звуки [Concept('innocents', 'невинных')|E] сумели запугать вас."
 POD_mokole.706.t: "Сломленное тело"
 POD_mokole.706.desc: "[Concept('innocents', 'Невинные')|E] растерзали ваше тело!"


 POD_mokole.720.t: "Надвигающаяся тьма"
 POD_mokole.720.desc: "Многие моколе не в состоянии сдержать свои эмоции, когда сталкиваются с мрачными воспоминаниями во время своего Мнезиса, в результате чего появляются [Concept('innocents', 'невинные')|E]. Эти негативные эмоции объединяются в злобный дух, который стремится уничтожить как своего создателя, так и всех остальных моколе. К сожалению, поскольку они питаются гнозисом, один из невинных начал преследовать вас с желанием превратить в ужин."
 POD_mokole.720.a: "Я [Select_CString(ROOT.Char.IsFemale, 'должна', 'должен' )] сопротивляться!"
 POD_mokole.720.b: "Защити меня!"
 POD_mokole.720.c: "Я больше не выдержу..."

 POD_mokole.721.t: "Воплощение кошмара"
 POD_mokole.721.desc: "Многие моколе не в состоянии сдержать свои эмоции, когда сталкиваются с мрачными воспоминаниями во время своего Мнезиса, в результате чего появляются [Concept('innocents', 'невинные')|E]. Эти негативные эмоции объединяются в злобный дух, который стремится уничтожить как своего создателя, так и всех остальных моколе. К сожалению, один из них украл форму другого моколе и решил, что хочет присвоить себе вашу форму Архид."
 POD_mokole.721.a: "В бой!"
 POD_mokole.721.b: "Это отвлечёт его!"
 POD_mokole.721.c: "Мне нужно бежать!"