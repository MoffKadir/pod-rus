 mokole_3_pulse_title: "Моколе"




 POD_mokole.100.t: "Сны о вашей форме"
 POD_mokole.100.desc: "В отличие от большинства [Glossary('фера', 'glossary_fera_tt')], боевые формы которых выглядят почти идентично, вы никогда не найдёте двух моколе с одинаковой формой Архид.\nФорма Архид взята из сновидения, которое появляется при Первом изменении моколе. С помощью Мнезиса они видят сны о рептилиях, птицах и динозаврах прошлого, что определяет характеристики их новой формы Архид. В этом мистическом опыте моколе действительно переживает жизнь своих предков, о которых помнит, и его форма Архид создаётся из их телосложения.\nФорма обычно напоминает крокодила, динозавра или дракона, хотя встречаются птерозавры и морские змеи моколе. У этих форм обычно есть части тела, которые в природе не встречаются у одного и того же животного, например, крылья у крокодила - эти формы являются фантазией, а не точной памятью.\n\nКакова ваша форма?"
 POD_mokole.100.option.a: "Мои сны сформировали меня."
 POD_mokole.100.tooltip1: "@warning_icon!#warning Вы должны выбрать все доступные варианты, чтобы продолжить#!"
 POD_mokole.100.tooltip2: "[GetModifier('POD_mokole_form_archid_modifier').GetNameWithTooltip] получит все выбранные опции"


