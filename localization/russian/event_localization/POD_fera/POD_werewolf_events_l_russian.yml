l_russian:

 POD_werewolves.1.t: "Первобытная песня"
 POD_werewolves.1.desc: "Оборотни-галлиарды - это голос народа, зовущий его на битву и вдохновляющий на величие в жизни и в смерти. Они также являются хранителями традиций, неся в себе предания племён до самых истоков.\nКак сказители у костра, галлиарды передают истории и песни, рассказанные с начала времён. Какая из них будет сегодня?"
 POD_werewolves.1.option.a: "Песня о единстве племени."
 primal_song_modifier: "Песня единства"
 primal_song_modifier_desc: "Подобно героям древности, мы должны держаться вместе!"
 POD_werewolves.1.option.b: "Сказание о древних победах."
 song_heroes_modifier: "Песня героев"
 song_heroes_modifier_desc: "В победах и даже поражениях наших предков можно найти мудрость."
 POD_werewolves.1.option.c: "Сказание о крови и сражениях."
 song_rage_modifier: "Песня [Glossary('ярости', 'glossary_rage_tt')]"
 song_rage_modifier_desc: "Прежде всего, мы - воины и должны всегда помнить о своём воинственном духе."
 POD_werewolves.1.option.d: "История о единстве и мужестве."


 POD_werewolves.2.t: "Призыв тени-двойника"
 POD_werewolves.2.desc: "С вашим мастерством владения даром духа ночи вы можете попытаться призвать в бою свои тени-двойники."
 POD_werewolves.2.option.a: "Я призываю тебя!"
 POD_werewolves.2.option.a.tt: "Вы попытаетесь призвать тень-двойника"
 POD_werewolves.2.option.a.desc: "Борьба со своей силой воли"
 POD_werewolves.2.option.a.tt.success: "Ваша тень-двойник успешно призвана"
 POD_werewolves.2.option.a.tt.failure: "Вы не смогли призвать свою тень-двойника"
 POD_werewolves.2.option.b: "Сейчас не самое подходящее время."
 POD_werewolves.2.option.b.tt: "Вы откажетесь от затеи призыва тени-двойника"
 POD_werewolves.3.t: "Призыв тени-двойника"
 POD_werewolves.3.desc: "Благодаря вашему мастерскому владению даром духа ночи, вам удалось успешно призвать свои тени-двойники, теперь пришло время отдавать приказы."
 POD_werewolves.3.option.a: "Поддержите меня в битвах."
 POD_werewolves.3.option.a.tt: "Ваша тень-двойник успешно призвана."
 POD_werewolves.4.t: "Призыв тени-двойника"
 POD_werewolves.4.desc: "Даже вашего владения даром ночного духа недостаточно, чтобы призвать свою тень-двойника... на данный момент."
 POD_werewolves.4.option.a: "Я ещё не [Select_CString(ROOT.Char.IsFemale, 'готова', 'готов' )]."
 POD_werewolves.4.option.a.tt: "Вы не смогли призвать свою тень-двойника"
 POD_werewolves.5.t: "Исчезновение тени-двойника"
 POD_werewolves.5.desc: "С вашей тенью-двойником произошёл инцидент, и она исчезла."
 POD_werewolves.5.option.a: "Моя тень-двойник уничтожена."
 POD_werewolves.5.option.a.tt: "Вашей тени-двойника больше нет"


 POD_werewolves.7.t: "Это мальчик..."
 POD_werewolves.7.desc: "Похоже, Гея не посчитала нужным благословить вас сегодня: ваш ребёнок - мальчик. Общество Чёрных фурий очень строго относится к тому, что следует делать, и вы знаете, что так было принято в вашем племени уже несколько поколений назад.\nСреди вашего народа есть несколько мужчин, так что ваше решение оставить ребёнка не будет беспрецедентным, если вы захотите, но это всё равно будет очень большим нарушением традиций и будет расценено вашими сёстрами как признак слабости. В конце концов, выбор остаётся только за вами."
 POD_werewolves.7.option.a: "Слабому мужчине не место среди нас!"
 POD_werewolves.7.option.b: "Я всё ещё его мать!"


 POD_werewolves.100.t: "Барабаны битвы"
 POD_werewolves.100.desc: "Сделав все необходимые приготовления, вы и [recipient.GetTitledFirstName] предстали друг перед другом. Ваше сердцебиение ускоряется в ответ на предстоящую битву, бьётся в собственном громовом ритме. Вы двое готовы.\n\nТеперь наступает настоящее испытание... выстоять или погибнуть?"
 POD_werewolves.100.option.a: "Сразись со мной!"
 POD_werewolves.100.option.b: "Возможно, это не очень хорошая идея..."

 POD_werewolves.103.t: "Победа"
 POD_werewolves.103.desc: "Неважно, что принесло вам победу — сила, мастерство или удача. [recipient.GetTitledFirstName] лежит у ваших ног в крови, без сил. Победа за вами. [recipient.GetHerHis|U] судьба не имеет значения: даже если [recipient.GetSheHe] выживет, прежней угрозы уже не будет."
 POD_werewolves.103.option.a: "Очередной претендент пал передо мной."

 POD_werewolves.104.t: "[Select_CString(ROOT.Char.IsFemale, 'Побитая и изломанная', 'Побитый и изломанный' )]"
 POD_werewolves.104.desc: "Кажется, ваша сила оказалась меньше, чем вы думали. [recipient.GetTitledFirstName] [Select_CString(recipient.IsFemale, 'победила', 'победил' )] вас, оставив на произвол судьбы. Выживете ли вы или умрёте, теперь зависит от вашего собственного тела."
 POD_werewolves.104.option.a: "Я... [Select_CString(ROOT.Char.IsFemale, 'потерпела', 'потерпел' )] неудачу..."

 POD_werewolves.105.t: "Победа"
 POD_werewolves.105.desc: "Кажется, что [Glossary('Луна', 'glossary_luna_tt')] благоволила вам в этом поединке, чему [recipient.GetTitledFirstName] явно не [Select_CString(recipient.IsFemale, 'рада', 'рад' )]. Победа за вами."
 POD_werewolves.105.option.a: "Хороший бой."

 POD_werewolves.106.t: "lost practice"
 POD_werewolves.106.desc: "lol how did you lose?"
 POD_werewolves.106.option.a: "idk"

 POD_werewolves.107.t: "Появление [Select_CString(ahroun_target.IsFemale, 'новой претендентки', 'нового претендента' )]"
 POD_werewolves.107.desc: "[ahroun_target.GetTitledFirstName] [Select_CString(ahroun_target.IsFemale, 'обратила', 'обратил' )] внимание на ваш рык. [ahroun_target.GetSheHe] приближается к вам, [Select_CString(ahroun_target.IsFemale, 'готовая', 'готовый' )] принять ваш вызов.\n\nСмерть приходит за всеми нами, но кого она достигнет первой?"
 POD_werewolves.107.option.a: "Слава будет моей!"
 POD_werewolves.107.option.b: "Это не та битва, которую я выиграю."

 POD_werewolves.108.t: "Останется лишь "
 POD_werewolves.108.desc.a: "$POD_werewolves.103.desc$"
 POD_werewolves.108.desc.b: "$POD_werewolves.104.desc$"
 POD_werewolves.108.option.a: "$POD_werewolves.103.option.a$"
 POD_werewolves.108.option.b: "$POD_werewolves.104.option.a$"

 POD_werewolves.109.t: "[Select_CString(ROOT.Char.IsFemale, 'Неудержимая воительница', 'Неудержимый воин' )]"
 POD_werewolves.109.desc: "Куда бы вы ни пошли, за вами остаётся полоса разрушений. Снова и снова ваши враги восстают против вас только для того, чтобы пасть от вашей руки. О вашей мощи говорят многие, будь то с восхищением или страхом. Многие говорят, что никто не может сравниться с вами, возможно, они правы.\n\nТеперь, благодаря последнему дару [Glossary('Луны', 'glossary_luna_tt')], вас действительно невозможно остановить."
 POD_werewolves.109.option.a: "Смерть заберёт меня тогда, когда она меня заслужит."

 POD_werewolves.119.t: "[Select_CString(ROOT.Char.IsFemale, 'Сказительница', 'Сказитель' )]"
 POD_werewolves.119.desc: "В каждой скорбной песне, боевом гимне и нежной колыбельной вы пронесли бремя своих предков, пересказывая их великие истории. Создавая истории и песни, которые могут тронуть даже самых бессердечных ваших родственников, ваш голос стал сердцем вашего народа. Делясь древними историями о героях, злодеях, победах и поражениях, вы гарантируете, что память о ваших предках никогда не угаснет.\n\nПосле получения последнего дара [Glossary('Луны', 'glossary_luna_tt')] ваш голос наверняка будет формировать поколения."
 POD_werewolves.119.option.a: "Лучшие истории переживают века."

 POD_werewolves.129.t: "Разорвать узы"
 POD_werewolves.129.desc: "Под ровным светом половины луны вы стали опорой своей стаи. Неутомимыми тренировками и твёрдым руководством вы создали узы крепче железа. Каждый улаженный спор, порождённый яростью и гордыней, каждая слабость, которую вы превратили в новую силу, утвердили ваше положение [Select_CString(ROOT.Char.IsFemale, 'верховной хранительницы', 'верховного хранителя' )] закона.\n\nТеперь, когда вы создали идеальную стаю и получили последний дар [Glossary('Луны', 'glossary_luna_tt')], ваше слово становится законом."
 POD_werewolves.129.option.a: "Пик лидерства."

 POD_werewolves.139.t: "[Select_CString(ROOT.Char.IsFemale, 'Поджигательница', 'Поджигатель' )]"
 POD_werewolves.139.desc: "Вас называют бродягой. [Select_CString(ROOT.Char.IsFemale, 'Бесчестной воровкой. Спорщицей, презирающей', 'Бесчестным вором. Спорщиком, презирающим' )] проверенные пути. Пусть они придерживаются своих жёстких традиций. Ваши подрывные действия осветят истинный путь вперёд. Вы уже высмеяли самодовольных, снова и снова завоёвывая благосклонность [Glossary('Луны', 'glossary_luna_tt')].\n\nДоказав свою хитрость, вы стали [Select_CString(ROOT.Char.IsFemale, 'волчицей', 'волком' )] среди овец. С последним даром [Glossary('Луны', 'glossary_luna_tt')] новолуние ярко сияет над вами, [Select_CString(ROOT.Char.IsFemale, 'величайшей обманщицей', 'величайшим обманщиком' )]."
 POD_werewolves.139.option.a: "Ничто не останется бесспорным и неоспоримым."

 POD_werewolves.149.t: "Призывающее присутствие"
 POD_werewolves.149.desc: "Вы уже пересекали завесу между материальным и духовным миром бесчисленное количество раз. Вы снова и снова переходили в мир духов, подчиняя обитателей этого мира своей воле, имея дело с озорными духами и исследуя самые глубокие части Умбры. Другие стекаются вокруг вас в каэрнах, с благоговением вслушиваясь в вашу с трудом заработанную мудрость.\n\nПосле того, как вам был дарован последний дар [Glossary('Луны', 'glossary_luna_tt')], тайны обоих миров теперь раскрыты."
 POD_werewolves.149.option.a: "Знания – сила, и их у меня предостаточно."