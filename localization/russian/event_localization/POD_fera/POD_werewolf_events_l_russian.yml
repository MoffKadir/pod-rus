l_russian:

 POD_werewolves.1.t: "Первобытная песня"
 POD_werewolves.1.desc: "Оборотни-галлиарды - это голос народа, зовущий его на битву и вдохновляющий на величие в жизни и в смерти. Они также являются хранителями традиций, неся в себе предания племён до самых истоков.\nКак сказители у костра, галлиарды передают истории и песни, рассказанные с начала времён. Какая из них будет сегодня?"
 POD_werewolves.1.option.a: "Песня о единстве племени."
 primal_song_modifier: "Песня единства"
 primal_song_modifier_desc: "Подобно героям древности, мы должны держаться вместе!"
 POD_werewolves.1.option.b: "Сказание о древних победах."
 song_heroes_modifier: "Песня героев"
 song_heroes_modifier_desc: "В победах и даже поражениях наших предков можно найти мудрость."
 POD_werewolves.1.option.c: "Сказание о крови и сражениях."
 song_rage_modifier: "Песня [Glossary('ярости', 'glossary_rage_tt')]"
 song_rage_modifier_desc: "Прежде всего, мы - воины и должны всегда помнить о своём воинственном духе."
 POD_werewolves.1.option.d: "История о единстве и мужестве."


 POD_werewolves.2.t: "Призыв тени-двойника"
 POD_werewolves.2.desc: "С вашим мастерством владения даром духа ночи вы можете попытаться призвать в бою свои тени-двойники."
 POD_werewolves.2.option.a: "Я призываю тебя!"
 POD_werewolves.2.option.a.tt: "Вы попытаетесь призвать тень-двойника"
 POD_werewolves.2.option.a.desc: "Борьба со своей силой воли"
 POD_werewolves.2.option.a.tt.success: "Ваша тень-двойник успешно призвана"
 POD_werewolves.2.option.a.tt.failure: "Вы не смогли призвать свою тень-двойника"
 POD_werewolves.2.option.b: "Сейчас не самое подходящее время."
 POD_werewolves.2.option.b.tt: "Вы откажетесь от затеи призыва тени-двойника"
 POD_werewolves.3.t: "Призыв тени-двойника"
 POD_werewolves.3.desc: "Благодаря вашему мастерскому владению даром духа ночи, вам удалось успешно призвать свои тени-двойники, теперь пришло время отдавать приказы."
 POD_werewolves.3.option.a: "Поддержите меня в битвах."
 POD_werewolves.3.option.a.tt: "Ваша тень-двойник успешно призвана."
 POD_werewolves.4.t: "Призыв тени-двойника"
 POD_werewolves.4.desc: "Даже вашего владения даром ночного духа недостаточно, чтобы призвать свою тень-двойника... на данный момент."
 POD_werewolves.4.option.a: "Я ещё не [Select_CString(ROOT.Char.IsFemale, 'готова', 'готов' )]."
 POD_werewolves.4.option.a.tt: "Вы не смогли призвать свою тень-двойника"
 POD_werewolves.5.t: "Исчезновение тени-двойника"
 POD_werewolves.5.desc: "С вашей тенью-двойником произошёл инцидент, и она исчезла."
 POD_werewolves.5.option.a: "Моя тень-двойник уничтожена."
 POD_werewolves.5.option.a.tt: "Вашей тени-двойника больше нет"


 POD_werewolves.7.t: "Это мальчик..."
 POD_werewolves.7.desc: "Похоже, Гея не посчитала нужным благословить вас сегодня: ваш ребёнок - мальчик. Общество Чёрных фурий очень строго относится к тому, что следует делать, и вы знаете, что так было принято в вашем племени уже несколько поколений назад.\nСреди вашего народа есть несколько мужчин, так что ваше решение оставить ребёнка не будет беспрецедентным, если вы захотите, но это всё равно будет очень большим нарушением традиций и будет расценено вашими сёстрами как признак слабости. В конце концов, выбор остаётся только за вами."
 POD_werewolves.7.option.a: "Слабому мужчине не место среди нас!"
 POD_werewolves.7.option.b: "Я всё ещё его мать!"


 POD_werewolves.100.t: "Drums of Battle"
 POD_werewolves.100.desc: "After making all the necessary preparations, you have arrived before [recipient.GetTitledFirstName]. Your heartbeat quickens in response to the coming battle, beating in its own thundering rhythm. The two of you are ready.\n\nNow comes the true test...hold fast, or expire?"
 POD_werewolves.100.option.a: "Face me!"
 POD_werewolves.100.option.b: "Perhaps this isn't a good idea..."

 POD_werewolves.103.t: "Victory"
 POD_werewolves.103.desc: "Whether it was strength, skill, or luck, it does not matter. [recipient.GetTitledFirstName] lies bloodied and broken at your feet. The victory is yours. [recipient.GetHerHis] fate is of no consequence, even should [recipient.GetSheHe] survive they will no longer be a threat."
 POD_werewolves.103.option.a: "Another falls before me."

 POD_werewolves.104.t: "Battered and Broken"
 POD_werewolves.104.desc: "It seems you were not as powerful as you thought you were. [recipient.GetTitledFirstName] has managed to defeat you and has left you to your fate. Whether you live or die is now up to your own body."
 POD_werewolves.104.option.a: "I...have failed..."

 POD_werewolves.105.t: "Victory"
 POD_werewolves.105.desc: "Much to the disappointment of [recipient.GetTitledFirstName], it seems that $glossary_luna$ has favored you in this match. Victory is yours."
 POD_werewolves.105.option.a: "A good fight."

 POD_werewolves.106.t: "lost practice"
 POD_werewolves.106.desc: "lol how did you lose?"
 POD_werewolves.106.option.a: "idk"

 POD_werewolves.107.t: "A New Challenger Appears"
 POD_werewolves.107.desc: "Your Snarl has attracted the attention of [ahroun_target.GetTitledFirstName]. [ahroun_target.GetSheHe] approaches you, ready to meet your challenge.\n\nDeath comes for us all, but who will it reach first?"
 POD_werewolves.107.option.a: "Glory will be mine!"
 POD_werewolves.107.option.b: "This is not a battle I will win."

 POD_werewolves.108.t: "Only one Remains"
 POD_werewolves.108.desc.a: "$POD_werewolves.103.desc$"
 POD_werewolves.108.desc.b: "$POD_werewolves.104.desc$"
 POD_werewolves.108.option.a: "$POD_werewolves.103.option.a$"
 POD_werewolves.108.option.b: "$POD_werewolves.104.option.a$"

 POD_werewolves.109.t: "Unstoppable Warrior"
 POD_werewolves.109.desc: "Wherever you go, a path of destruction follows. Time and time again have your foes stood against you only to fall by your hand. Your might is a subject on many lips, whether in admiration or fear. Many say that none can match you, perhaps they are right.\n\nNow with $glossary_luna$'s final Gift, you are truly unstoppable."
 POD_werewolves.109.option.a: "Death can have me when it earns me."

 POD_werewolves.119.t: "Storyteller"
 POD_werewolves.119.desc: "Through every sorrowful song, battle hymn and gentle lullaby, you have carried the weight of your ancestors, retelling their grand tales. Crafting stories and songs that could touch even the most cold-hearted of your kin, your voice has become the heart of your people. By sharing the ancient tales of heroes, villains, victories and defeats, you have ensured that the memory of your ancestors will never fade away.\n\nHaving earned $glossary_luna$'s final Gift, your voice is certain to shape generations."
 POD_werewolves.119.option.a: "The best tales are the ones that last."

 POD_werewolves.129.t: "Break the Bonds"
 POD_werewolves.129.desc: "Under the steady light of the half moon, you have stood as the pillar that your pack rests on. Through tireless training and your steady hand guiding them, you have forged bonds stronger than iron. Every bitter dispute born of rage and pride settled, every weakness forged into a new strength by your leadership, they have solidified your role as the supreme law-keeper.\n\nHaving forged the perfect pack and blessed with $glossary_luna$'s final Gift, your word becomes law."
 POD_werewolves.129.option.a: "Leadership at its pinnacle."

 POD_werewolves.139.t: "Firebringer"
 POD_werewolves.139.desc: "They call you a vagabond. A dishonorable thief. A contrarian that scorns the tried and true ways. Let them cling to their rigid traditions. Your subversions will light the true path forward. You have made a mockery of the self-righteous already, taking $glossary_luna$'s favor for yourself time and time again.\n\nHaving proven your cunning, you stand as a wolf amongst sheep. With $glossary_luna$'s final Gift, the New Moon shines brightly upon you, the greatest trickster."
 POD_werewolves.139.option.a: "Let nothing go unquestioned and unchallenged."

 POD_werewolves.149.t: "Invoked Presence"
 POD_werewolves.149.desc: "The veil between the material and the spirit world is one you have crossed innumerable times now. You have stepped sideways again and again, binding the denizens of the realm to your will, dealing with mischievous Spirits and exploring the deepest parts of the Umbra. Others flock around you in Caerns, listening to your hard-earned wisdom with reverence.\n\nWith the last Gift of $glossary_luna$ bestowed upon you, the secrets of both worlds are now laid bare."
 POD_werewolves.149.option.a: "Knowledge is power, and I have plenty of it."