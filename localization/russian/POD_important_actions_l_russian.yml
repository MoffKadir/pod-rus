 action_ghoul_dangerous_vitae_level_alert_desc: "У вас крайне низкое значение [Glossary('витэ','game_concept_vitae_desc')], займитесь охотой или [Concept('masterless_ghoul_imprisoned_drinking', 'испейте от пленника-вампира')|E]!"
 action_ghoul_dangerous_vitae_level_alert_click: ""

 action_high_banality_alert: "Вы близки к развоплощению!"
 action_high_banality_alert_label: "Вы близки к развоплощению!"
 action_high_banality_alert_desc: "Ваша [Concept('banality', 'банальность')|E] критически высока. Если она достигнет значения #N 100#!, вы #N умрёте#!. Воспользуйтесь одним из [Concept('journeys', 'странствий')|E] #V Поиски гламура#!, чтобы снизить банальность."
 action_high_banality_alert_click: ""

 action_can_ravage_mortal_alert: "Вы можете опустошить смертного!"
 action_can_ravage_mortal_alert_label: "Есть смертный, которого можно опустошить ради гламура!"
 action_can_ravage_mortal_alert_desc: "[GetDoctrine('doctrine_fae_morality_unseelie').GetBaseName] #TOOLTIP:GAME_TRAIT,fae,[GetNullCharacter] #L феи#!#! могут опустошать #TOOLTIP:GAME_TRAIT,mortal,[GetNullCharacter] #L смертных#!#! от их творческого потенциала без каких-либо последствий."
 action_can_ravage_mortal_alert_click: "#I Нажмите, чтобы опустошить случайного #TOOLTIP:GAME_TRAIT,mortal,[GetNullCharacter] #L смертного#!#!#!"

 reactive_advice_banality: "Банальность: Проклятие фей"
 action_reactive_advice_banality: "Совет: Банальность"
 action_reactive_advice_banality_desc: "[Concept('banality', 'Банальность')|E] является основной механикой фей. Откройте эту вкладку, чтобы узнать больше о том, что это значит для вас."
 action_reactive_advice_banality_click: "$click_to_open_lesson$"
 lesson_about_banality: "$reactive_advice_banality$"
 lesson_about_banality_desc: "Сила человеческого неверия, банальность, является главной угрозой для фей, поскольку она олицетворяет противоположность их существованию, самой магии.\n\nНо для фей существование в Осеннем мире означает постепенное усиление скептицизма окружающих их смертных. Что-то, что может привести к #R смерти#!."
 lesson_gaining_banality: "Прирост банальности: Путь к гибели"
 lesson_gaining_banality_desc: "Каждый год все феи получают некоторое количество [Concept('banality', 'банальности')|E], проявляющееся в [Concept('trait', 'свойстве')|E] #V Банальность#!. Если её значение когда-либо достигнет #V 100#!, персонаж #R умрёт#!.\n\nВсего существует 5 способов получить [Concept('banality', 'банальность')|E]: $game_concept_banality_realm_disbelief$, $game_concept_banality_local_disbelief$, $game_concept_banality_reason$, $game_concept_banality_fae_hunting$ и $game_concept_banality_despair$.\n\nКроме того, неудача в наложении [Concept('cantrip', 'чар')|E] приведёт к росту [Concept('banality', 'банальности')|E] на #N +1#!."
 lesson_losing_banality: "Снижение банальности: Поиски гламура"
 lesson_losing_banality_desc: "Снижение [Concept('banality', 'банальности')|E] требует #V активных#! усилий с вашей стороны.\n\nЕсть только один реальный способ снизить [Concept('banality', 'банальность')|E], и это завершение [Concept('journey', 'странствия')|E] #V Поиски гламура#!.\n\nЕсть 3 типа миссий, которые вы можете начать. Каждая из них приводит к одинаковым результатам, но требует разных [Concept('skills', 'навыков')|E] и имеет разные недостатки."
 lesson_banality_objectives: "Противостояние банальности"
 lesson_banality_objectives_desc: "Важным аспектом [Concept('banality', 'банальности')|E] являются связанные с ней цели.\n\nНемногие способы получить [Concept('banality', 'банальность')|E] также имеет цель, которая их отключает. Или, по крайней мере, делает их менее болезненными для вас.\n\nНапример, «$game_concept_banality_reason$» отключается после выполнения цели #V $destroy_order_of_reason_objective_decision$#!."
 lesson_banality_ending_notes: "Банальность: Общее представление"
 lesson_banality_ending_notes_desc: "Вкратце:\n$BULLET_WITH_TAB$Сведите к минимуму свой ежегодный прирост [Concept('banality', 'банальности')|E] и не используйте [Concept('cantrips', 'чары')|E] с низкой вероятностью успеха\n$BULLET_WITH_TAB$Когда ваша [Concept('banality', 'банальность')|E] достигнет примерно #V 30#!, отправляйтесь в [Concept('journey', 'странствия')|E]. Выберите то, которое лучше всего соответствует вашим [Concept('skills', 'навыкам')|E], либо то, недостаток которого наименее ощутим для вас.\n$BULLET_WITH_TAB$Некоторые важные [Concept('decisions', 'решения')|E] могут отключить источники [Concept('banality', 'банальности')|E].\n$BULLET_WITH_TAB$И самое главное, #bold не позволяйте ей достичь 100!#!"