 action_ghoul_can_drink_safety_from_vampire_alert: "Вы можете испить от [Concept('prisoner', 'узника')|E]"
 action_ghoul_can_drink_safety_from_vampire_alert_label: "Вы можете испить от [Concept('prisoner', 'узника')|E]"
 action_ghoul_can_drink_safety_from_vampire_alert_desc: "Узы крови с одним из ваших [Concept('prisoners', 'узников')|E]-вампиров ослабли, теперь вы можете безопасно испить от него. Помните, что вы всё ещё в опасности, если они владеют ментальными [Glossary('дисциплинами','game_concept_discipline_desc')]!"
 action_ghoul_can_drink_safety_from_vampire_alert_click: "#I Нажмите, чтобы безопасно испить от вампира!#!"

 action_ghoul_dangerous_vitae_level_alert: "Опасно низкий показатель витэ!"
