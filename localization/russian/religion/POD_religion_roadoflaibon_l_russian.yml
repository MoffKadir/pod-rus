 #Laibon-Group Faiths
 laibon: "Небо-земск"
 laibon_adj: "Путь Неба и Земли"
 laibon_adherent: "Странник Неба и Земли"
 laibon_adherent_plural: "Странники Неба и Земли"
 laibon_desc: "Путь Неба и Земли — центральная духовная практика Лайбон, равновесие двух сил: Орун и Айе — божественного неба и материального мира. Его последователи стремятся к гармонии между духовным голодом Зверя и обязательствами перед миром живых, идя по узкому пути между трансцендентностью и проклятием. Потерять это равновесие — значит оказаться во власти одного из полюсов: раствориться в отстранённой божественности или пасть в бездну ненасытной чудовищности."
 laibon_nyayo: "Ниайонск"
 laibon_nyayo_adj: "Ньяйоск"
 laibon_nyayo_adherent: "Ниайо"
 laibon_nyayo_adherent_plural: "Ниайо"
 laibon_nyayo_desc: "Ниайо, идущие по стопам предков, — лайбон, убеждённые, что доменами Эбенового королевства следует управлять на своих условиях. Сотрудничество возможно. Подчинение — нет."
 laibon_luo: "Луонск"
 laibon_luo_adj: "Луо"
 laibon_luo_adherent: "Луо"
 laibon_luo_adherent_plural: "Луо"
 laibon_luo_desc: "Там, где Ниайо призывают к бдительности, Луо требуют войны. Каждый оплот каинитов в Африке — акт колонизации. Их вера требует возвращать утраченное силой."
 laibon_daughters_of_arawelo: "Аравелойск"
 laibon_daughters_of_arawelo_adj: "Дочери Аравело"
 laibon_daughters_of_arawelo_adherent: "Дочь Аравело"
 laibon_daughters_of_arawelo_adherent_plural: "Дочери Аравело"
 laibon_daughters_of_arawelo_desc: "Аравело была царицей, сокрушавшей каждого мужчину, который противостоял ей. Дочери почитают её как доказательство того, что личность выковывают, а не получают в дар: лишь сила, хитрость и безжалостное честолюбие дают подлинное право на наследие."
 laibon_birds_of_huur: "Хуурск"
 laibon_birds_of_huur_adj: "Птицы Хуура"
 laibon_birds_of_huur_adherent: "Киньони"
 laibon_birds_of_huur_adherent_plural: "Киньони"
 laibon_birds_of_huur_desc: "Хуур — вестник смерти, и его люди-птицы следуют философии парадокса, преломлённой через африканскую космологию. Для киньони странствие — богослужение, а сам путь — единственная честная цель."
 laibon_appeasers_of_eebo: "Ээбонск"
 laibon_appeasers_of_eebo_adj: "Умиротворители Ээбо"
 laibon_appeasers_of_eebo_adherent: "Умиротворитель Ээбо"
 laibon_appeasers_of_eebo_adherent_plural: "Умиротворители Ээбо"
 laibon_appeasers_of_eebo_desc: "Ээбо — бог неба, чей пылающий глаз — солнце. Глубоко созвучные Орун, умиротворители стремятся полностью преодолеть свою чудовищную природу."
 laibon_nidars_punishers: "Каратели Нидарск"
 laibon_nidars_punishers_adj: "Каратели Нидара"
 laibon_nidars_punishers_adherent: "Каратель Нидара"
 laibon_nidars_punishers_adherent_plural: "Каратели Нидара"
 laibon_nidars_punishers_desc: "Этот орден гробовщиков и убийц посвятил себя уничтожению магаджи, злоупотребляющих властью. Глубоко созвучные Айе, они верят, что справедливость принадлежит материальному миру."
 laibon_children_of_sarapion: "Сарапионск"
 laibon_children_of_sarapion_adj: "Дети Сарапиона"
 laibon_children_of_sarapion_adherent: "Дитя Сарапиона"
 laibon_children_of_sarapion_adherent_plural: "Дети Сарапиона"
 laibon_children_of_sarapion_desc: "Сарапион неизмеримо древен. Дети не признают ложных богов и низвергают любое существо, обретающее слишком большую силу, ибо никто не смеет соперничать со славой Сарапиона."
 laibon_asiman: "Асиманск"
 laibon_asiman_adj: "Асиман"
 laibon_asiman_adherent: "Асиман"
 laibon_asiman_adherent_plural: "Асиман"
 laibon_asiman_desc: "Асиман — Достойные. Это лайбон, отвергающие власть и старейшин, и магаджи и полагающие, что ни один вампир не вправе властвовать над другим лишь в силу возраста или крови."
 laibon_tariq_alsama_walard: "Ва-ль-ардск"
 laibon_tariq_alsama_walard_adj: "Тарик ас-Сама ва-ль-Ард"
 laibon_tariq_alsama_walard_adherent: "Последователь Тарика"
 laibon_tariq_alsama_walard_adherent_plural: "Последователи Тарика"
 laibon_tariq_alsama_walard_desc: "Тарик ас-Сама ва-ль-Ард объединяет мусульман Аширры и духовную традицию Лайбон. Африканская самобытность и преданность исламу — не соперничающие привязанности, а единая, неразделимая истина."
 laibon_path_of_terror: "Ужасо-рождённск"
 laibon_path_of_terror_adj: "Путь ужаса"
 laibon_path_of_terror_adherent: "Сеятель ужаса"
 laibon_path_of_terror_adherent_plural: "Сеятели ужаса"
 laibon_path_of_terror_desc: "Путь ужаса укоренён в первобытном страхе. Чтобы стать чем-то великим, сперва нужно стать чем-то ужасным."
 laibon_flowers_of_indulgence: "Наслажденческ"
 laibon_flowers_of_indulgence_adj: "Цветы наслаждения"
 laibon_flowers_of_indulgence_adherent: "Цветок наслаждения"
 laibon_flowers_of_indulgence_adherent_plural: "Цветы наслаждения"
 laibon_flowers_of_indulgence_desc: "Гедонизм — лишь маска, а не лицо. Под наслаждениями скрывается паутина макиавеллистских интриг. Вино всегда сладко. Расплата всегда приходит позже."