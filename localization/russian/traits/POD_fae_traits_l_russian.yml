 YEARLY_BANALITY_REASON: "[Concept('banality', 'Банальность')|E] от разума ([GetPlayer.GetCurrentLocation.GetCounty.GetTitle.GetNameNoTier])"
 YEARLY_BANALITY_SI: "[Concept('banality', 'Банальность')|E] от охоты на фей"
 YEARLY_BANALITY_GHOUL: "[Concept('banality', 'Банальность')|E] за принадлежность к #TOOLTIP:GAME_TRAIT,ghoul,[GetNullCharacter] #L гулям#!#!"