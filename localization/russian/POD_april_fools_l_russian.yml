 POD_april_fools.102.t: "Парадоксальные дни"
 POD_april_fools.102.desc: "Всё, чего вы хотели, - это немного тишины. Вы вышли прогуляться на улицу, и вот оно, первое знамение грядущего безумия: дерево, сделанное из чистого золота.\n\n[Select_CString(ROOT.Char.IsFemale, 'Поражённая', 'Поражённый' )], вы протянули руку, чтобы дотронуться до него. Дерево превратилось в облако порхающих мотыльков, каждый из которых кричал: «Поздравляю! Поздравляю! Поздравляю!», вращаясь вокруг вашей головы, как самый отвратительный нимб, который только можно вообразить. Когда вы ударили по рою, он рассеялся и превратился обратно в совершенно обычное дерево.\n\nВы поспешили вернуться в свой двор и обнаружили, что там царит хаос. Мебель плавала, или парила, или прилипала к потолку. Чья-то одежда превратилась в сороконожек. Воздух переливался всеми цветами радуги.\n\nЕсли это иллюзия, то вы содрогаетесь при мысли о том, кто был бы достаточно силен, чтобы создать её такого масштаба. Но если это не так..."
 POD_april_fools.102.a: "Как я вообще начну искать причину?"
 POD_april_fools.102.tt.1: "Ваши [Concept('skills', 'навыки')|E] будут перемешиваться случайным образом каждый месяц."
 POD_april_fools.102.tt.2: "Ваши [Concept('personality_traits', 'свойства личности')|E] будут перемешиваться случайным образом каждый год."
 POD_april_fools.102.tt.3: "Разумеется, это всего лишь временное явление, и вам следует просто подождать, пока всё это уляжется."

 # reused
 POD_april_fools.103.desc.intro: "[Select_CString(courtier.IsFemale, 'Ваша', 'Ваш' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('courtier'))] [courtier.GetFirstName] приходит к вам с новостями о разворачивающемся хаосе."

 POD_april_fools.103.desc: "«Я [Select_CString(courtier.IsFemale, 'нашла', 'нашёл' )] это. Разве это не прелестный малыш? Мы должны хорошо заботиться о нём и вырастить его достойным членом семьи».\n\n«Милый малыш», о котором идёт речь, - это дракон."
 POD_april_fools.103.a: "Мило, я всегда [Select_CString(ROOT.Char.IsFemale, 'хотела', 'хотел' )] завести дракона."

 POD_april_fools.104.desc: "Не то чтобы вам это было нужно, потому что то, что произошло, очевидно. [Select_CString(courtier.IsFemale, 'Она стала золотой', 'Он стал золотом' )]. Как и вы. Как и весь [ROOT.Char.Custom('GetCourt')|l], и вся ваша мебель, и всё ваше оружие."
 POD_april_fools.104.a: "Мы можем извлечь из этого выгоду, но очень жаль, что у нас не осталось оружия."

 POD_april_fools.105.desc: "«Этим утром я [Select_CString(courtier.IsFemale, 'проверяла', 'проверял' )] наши темницы и мне на глаза [Select_CString(prisoner.IsFemale, 'попалась', 'попался' )] [prisoner.GetName]. Понятия не имею, как [prisoner.GetSheHe] [Select_CString(prisoner.IsFemale, 'попала', 'попал' )] туда. [prisoner.GetSheHe|U] тоже не знает. Но дарёному коню в зубы не смотрят, а?»"
 POD_april_fools.105.a: "Я [Select_CString(ROOT.Char.IsFemale, 'должна', 'должен' )] решить, что с [Select_CString(prisoner.IsFemale, 'ней', 'ним' )] делать."

 POD_april_fools.106.desc: "«У меня пропали волосы». В [courtier.GetHerHis] глазах глубокая грусть, которая застаһт вас врасплох. Вы никогда не думали, что [courtier.GetFirstNameNoTooltip] так заботится о своей внешности."
 POD_april_fools.106.a: "Да, я [Select_CString(ROOT.Char.IsFemale, 'заметила', 'заметил' )]. Мои тоже пропали."
 POD_april_fools.106.a.alreadybald: "Ага. Должно быть, это ужасно."

 POD_april_fools.107.desc: "«Сыр». Отказываясь вдаваться в подробности, [courtier.GetSheHe] протягивает вам вышеупомянутый сыр."
 POD_april_fools.107.a: "Хмм. Спасибо?"

 POD_april_fools.108.desc: "«Да, итак, э-э, важные новости». [courtier.GetSheHe|U] нервно ёрзает. «Вы знаете о том сильном взрыве на днях? Этот столб зелёного пламени, вздымающийся к небу и вопящий, как хор проклятых душ?»\n\nДа, вы видели. Это было трудно не заметить. Не то чтобы вас это сильно волновало в то время. На фоне всего происходящего это было похоже на обычный вторник.\n\n«Что ж, это произвело сильное впечатление на местных #TOOLTIP:GAME_TRAIT,supehunter,[GetNullCharacter] #L охотников#!#!. Они разослали это по всей цепочке, и теперь Святой Престол мобилизует свои ресурсы, чтобы искоренить «дьяволов среди нас».\n\n«Они называют это Инквизицией»."
 POD_april_fools.108.a: "Как будто у нас и без того мало неприятностей."
 POD_april_fools.108.a.hunter: "Полагаю, это хорошо для нас."
 POD_april_fools.108.a.premature: "ЕЩЁ ОДНА??"
 POD_april_fools.108.a.premature.hunter: "Ещё одна? Аллилуя."

 POD_april_fools.109.desc: "«Там просто сумасшедший дом. Инквизиторы выходят на свет и поджигают убежища повсюду. Такими темпами они нас уничтожат».\n\nВы потираете виски. «Означает ли это, что мы наконец-то можем забыть о наших разногласиях и объединиться против общего врага?»\n\n«Что? Нет, это безумие. Послушайте, вы мыслите неправильно. Это прекрасная возможность ограбить всех остальных вслепую. Никто не будет ожидать, что мы ударим им в спину, пока они заняты более серьёзными проблемами»."
 POD_april_fools.109.desc.hunter: "«Там настоящий сумасшедший дом. Инквизиторы съезжаются и поджигают убежища повсюду. Кровососы начинают нервничать. Они знают, что им недолго осталось жить в этом мире».\n\nВы вздыхаете. «Да, и что? Ватикан позаботится об этом. Мы можем переждать это время. Нет необходимости рисковать своими жизнями, когда их дважды благословенные, трижды помазанные верховные ублюдки готовы умереть на передовой».\n\n«Что? Нет, это безумие. Послушайте, вы мыслите неправильно. Это прекрасная возможность ограбить всех остальных вслепую. Никто не ожидает, что мы ударим им в спину, пока они заняты другими проблемами»."
 POD_april_fools.109.a: "Это самая глупая вещь, которую я когда-либо [Select_CString(ROOT.Char.IsFemale, 'слышала', 'слышал' )]."
 POD_april_fools.109.tt: "Теперь все могут [Concept('raid', 'совершать набеги')|E]."

 POD_april_fools.110.desc: "«Aboeisrd moieaon kstlbv og. Goob broncpsdz ib? Plib e bib. Zbilbrekwlommbiorbeon aglonmeqwas eorleor ir immnimnim plembaf, nor limnon leqbaf, nor zeblorneqis rirghhb nekbaf. Ya bib?»"
 POD_april_fools.110.a: "Hor hor hor! Sik nempis irliq nempo bib."
 POD_marauder_mode_tongues: "Беседа на языке богов"
 POD_marauder_mode_tongues_desc: "Ha blemqas nirtuilzvkkir tiglpvnmbonan giruen bib. Giruen? Og pilnis? Hor hor hor."

 POD_april_fools.111.desc: "«Я вас ненавижу. Просто хочу, чтобы вы знали»."
 POD_april_fools.111.a: "Что?"

 POD_april_fools.112.t: "Первопричина"
 POD_april_fools.112.desc: "Низкий гул возвещает о его приближении. Пол и потолок разлетаются на тысячи разноцветных осколков, а затем превращаются в спиралевидные кристаллические решетки. Свет в ваших покоях изгибается под тошнотворными углами. Реальность плачет и признает своё поражение.\n\nВ эпицентре этого шторма находится чёрная дыра, силуэт которой имеет форму человека. По крайней мере, вы думаете, что это человек. Различимых черт нет. Сущность видна только по своим очертаниям и силе притяжения, которую она оказывает на своё окружение, как нечто, что одновременно является неотъемлемой частью существования этого мира, но не может существовать внутри него.\n\nВам удалось продержаться так долго, потому что вы знали, когда нужно сражаться, а когда сдаться. В этой битве вам не победить. Всё, что вы можете делать, - это наблюдать и надеяться на лучшее."
 # ellipsis
 
 POD_april_fools.113.t: "Мародёр"
 POD_april_fools.113.desc: "Нечто приветствует вас раскатистым звуком, доносящимся прямо из ада.\n\nОно произносит что-то отдалённо напоминающее «Бонжур».\n\nКроме того, оно кажется вполне расположенным для вежливой беседы. Оно приносит извинения за все причинённые неудобства и приводит пространные обоснования, полные научного жаргона, о «сферах», «инструментах» и «зонах реальности мародеров». Вы догадываетесь, что он скрывается от «этого морщинистого #italic филс де путе#!» и что его визит в эти края был «слишком преждевременным», но однажды, «когда придёт время», вы сможете встретить других таких же, как он. Затем он открывает портал и собирается уходить.\n\nВы взываете к существу, всё ещё пребывая в замешательстве. «Кто ты?»\n\nОно произносит: «Можешь называть меня Жан»."
 POD_april_fools.113.a: "И я думаю, что на этом всё."
 POD_april_fools.113.a.tt: "Безумие наконец подошло к концу."
 POD_april_fools.113.b: "Знаешь, это было довольно весело."
 POD_april_fools.113.b.tt: "Ваши [Concept('skills', 'навыки')|E] и [Concept('personality_traits', 'свойства личности')|E] продолжат меняться случайным образом."