 building_type_cairo_khitta_fen_01: "Бану аль-Фен"
 building_type_cairo_khitta_fen_01_desc: "#F [Glossary('Хитта', 'glossary_khitta_tt')], связанная с Аширрой.\n\nВ этой хитте живут тореадоры Аширры, которые проводят свои дни, рисуя каллиграфию и другие виды искусства. В основном они держатся особняком, лишь изредка обсуждая с другими философию или искусство.#!"
