l_russian:
 grand_city_holding: "Великий город"
 grand_city_holding_concept_key: "#TOOLTIP:game_concept_grand_city_desc #E Великий город#!#!"
 building_type_grand_city_01: "Великий город"
 building_type_grand_city_01_desc: "Крупный населенный пункт, имеющий огромное значение как для смертного, так и для сверхъестественного мира."
 building_grand_city_01: "Где люди собираются"
 building_grand_city_01_desc: "Этот город с его многочисленным смертным населением представляет собой чистый, неиспользованный потенциал. Не хватает только предприимчивого правителя, который осмелится им воспользоваться."
 building_grand_city_02: "Где люди процветают"
 building_grand_city_02_desc: "Этот город известен на весь мир как место, где открываются новые возможности. Смертные толпами стекаются сюда в поисках лучшей жизни. А где процветают они, процветаете и вы."
 building_grand_city_03: "Где формируется культура"
 building_grand_city_03_desc: "Этот всемирно известный город является местом рождения инноваций и трендов, отбрасывающих большую тень на остальную цивилизацию."
 building_grand_city_04: "Где творится история"
 building_grand_city_04_desc: "Монументальные события, происходящие в этом городе, гарантируют, что его название никогда не будет забыто."


 #############################
 ##### Rome for Vampires #####
 #############################

 building_type_rome_roma_aeterna_01: "Roma Aeterna"
 building_type_rome_roma_aeterna_01_desc: "#F Рим был центром как [Glossary('каинитского','game_concept_cainite_desc')], так и человеческого мира. Восстановление его неживого величия было бы огромным достижением.#!"
 building_rome_roma_aeterna_01: "Roma Dividua"
 building_rome_roma_aeterna_01_desc: "Святые люди бродят по улицам, оспаривая любую попытку прямого контроля над центром европейского мира. На данном этапе титул Рим - престижный для его владельца, но и опасный."
 building_rome_roma_aeterna_02: "Roma Invicta"
 building_rome_roma_aeterna_02_desc: "Постепенно вера Рима ослабевает, и вампиры снова могут использовать свое тонкое влияние на благо князя."
 building_rome_roma_aeterna_03: "Roma Aeterna"
 building_rome_roma_aeterna_03_desc: "Наконец-то Рим снова в руках вампиров. Святые люди прячутся в темноте, а дети Каина воспевают хвалу великому правителю, завоевавшему священный город."

 POD_rome_ventrue_desc: "Здесь находится почтенный Римский форум, служивший сердцем города в давно минувшие века. За его разрушенным внешним видом скрываются уютные и красивые покои."
 POD_rome_ventrue_bonus: "#P Владение этим кварталом открывает [sell_titles_decision|El] и снижает его стоимость.#!"
 building_type_rome_ventrue_01: "Montium et Biberatice"
 building_type_rome_ventrue_01_desc: "Исторический квартал #TOOLTIP:game_concept_eternal_rome_desc #E Roma Aeterna#!#!, вверенный клану [GetTrait('ventrue').GetName(GetNullCharacter)].\n\n$POD_rome_ventrue_desc$"
 building_rome_ventrue_01: "Montium et Biberatice"
 building_rome_ventrue_01_desc: "Исторический квартал #TOOLTIP:game_concept_eternal_rome_desc #E Roma Aeterna#!#!, доверенный клану [GetTrait('ventrue').GetName(GetNullCharacter)].\n\n$POD_rome_ventrue_desc$\n\n#X Если вы хотите улучшить этот квартал, у вас должен быть нанят [GetCourtPositionType('ventrue_primogen_court_position').GetName()] и вы должны владеть титулом [Concept('king', 'королевского')|E] уровня.#!"
 building_rome_ventrue_02: "Montium et Biberatice"
 building_rome_ventrue_02_desc: "Исторический квартал #TOOLTIP:game_concept_eternal_rome_desc #E Roma Aeterna#!#!, доверенный #TOOLTIP:game_concept_primogen_desc #E примогену#!#! [GetTrait('ventrue').GetName(GetPlayer)].\n\n$POD_rome_ventrue_desc$\n\n#X Если вы хотите улучшить этот квартал, у вас должен быть нанят [GetCourtPositionType('ventrue_primogen_court_position').GetName()] с [Concept('ventrue_primogen', 'хорошей пригодностью')|E] или выше.#!"
 building_rome_ventrue_03: "Montium et Biberatice"
 building_rome_ventrue_03_desc: "Исторический квартал #TOOLTIP:game_concept_eternal_rome_desc #E Roma Aeterna#!#!, доверенный уважаемому #TOOLTIP:game_concept_primogen_desc #E примогену#!#! [GetTrait('ventrue').GetName(GetNullCharacter)].\n\n$POD_rome_ventrue_desc$\n\n#X Если вы хотите улучшить этот квартал, у вас должен быть нанят [GetCourtPositionType('ventrue_primogen_court_position').GetName()] с [Concept('ventrue_primogen', 'отличной пригодностью')|E].#!"
 building_rome_ventrue_04: "Montium et Biberatice"
 building_rome_ventrue_04_desc: "Исторический квартал #TOOLTIP:game_concept_eternal_rome_desc #E Roma Aeterna#!#!, доверенный могущественному #TOOLTIP:game_concept_primogen_desc #E примогену#!#! [GetTrait('ventrue').GetName(GetNullCharacter)].\n\n$POD_rome_ventrue_desc$"

