 building_type_cairo_khitta_zamalek_01: "Бану Замалек"
 building_type_cairo_khitta_zamalek_01_desc: "#F Один из девяти каирских [Glossary('хитта', 'glossary_khitta_tt')].\n\nБану Замалек, населенный множеством разных вампиров, приветствует всех, независимо от клана или происхождения. Многие из вампиров здесь - каитиффы. Несмотря на это, другие хитта относятся к Бану Замалек одинаково.#!"
