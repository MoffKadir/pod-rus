 building_paris_umbral_carnivals_04_desc: "$building_paris_umbral_carnivals_01_desc$"


 building_type_paris_umbral_notre_dame_01: "Нотр-Дам"
 building_type_paris_umbral_notre_dame_01_desc: "#F Этот великолепный собор, также известный как «Парижская Богоматерь», посвящен Деве Марии. Построенный в готическом стиле, он поражает многочисленными статуями и огромными разноцветными «окнами-розами».\n\nМесто поклонения, готовое к осквернению.#!"
 building_paris_umbral_notre_dame_01: "Контролируемый Нотр-Дам"
 building_paris_umbral_notre_dame_01_desc: "Этот великолепный собор, также известный как «Парижская Богоматерь», посвящен Деве Марии. Построенный в готическом стиле, он поражает многочисленными статуями и огромными разноцветными «окнами-розами».\n\nМесто поклонения, готовое к осквернению."
