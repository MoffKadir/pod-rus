 building_type_cairo_khitta_yashkur_01_desc: "#F [Glossary('Хитта', 'glossary_khitta_tt')], связанная с Аширрой.\n\nОдин из старейших вампирских владений в Каире. Ассамиты здесь уважительно относятся к смертным и яростно охраняют свои владения от других вампиров.#!"
