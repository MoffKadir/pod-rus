 building_type_cairo_khitta_raya_01: "Бану Аль ар-Райя"
 building_type_cairo_khitta_raya_01_desc: "#F Один из девяти каирских [Glossary('хитта', 'glossary_khitta_tt')].\n\nВ древнейших владениях вампиров обитают Истинные бруха. Эти ученые-воины живут здесь со времен зарождения ислама. В то время как остальная часть Каира развивается, они остаются прежними. Это капсула традиционной аскетической жизни, навсегда застывшая во времени.#!"
