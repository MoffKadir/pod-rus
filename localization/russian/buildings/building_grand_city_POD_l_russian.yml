 POD_rome_toreador_desc: "Люди с художественным складом ума приходят в этот квартал, чтобы поразмышлять о славе минувших веков. Здесь Помпей Великий построил первый римский театр, а император Домициан приказал построить стадион, облицованный мрамором. Оба сейчас находятся в руинах."
