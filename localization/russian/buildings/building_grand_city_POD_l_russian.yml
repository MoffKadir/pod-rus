 building_type_paris_free_chatelet_01: "Ле Шатле"
 building_type_paris_free_chatelet_01_desc: "#F Солдаты Парижа готовы защищать город от тех, кто может причинить ему вред.\n\nС вашей помощью они добьются успеха.#!"
