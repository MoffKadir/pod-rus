 building_paris_umbral_notre_dame_04_desc: "$building_paris_umbral_notre_dame_01_desc$"


 building_type_paris_umbral_louvre_01: "Луврский дворец"
 building_type_paris_umbral_louvre_01_desc: "#F Те, кто был призван консультировать французского короля по вопросам управления королевством, сформировали особый институт, называемый королевским двором. В его состав входили несколько доверенных советников короля, но лишь немногие из них постоянно путешествовали с королем.\n\nАмбициозных дураков легко увлечь за собой.#!"
 building_paris_umbral_louvre_01: "Влияние на Луврский дворец"
 building_paris_umbral_louvre_01_desc: "Те, кто был призван консультировать французского короля по вопросам управления королевством, сформировали особый институт, называемый королевским двором. В его состав входили несколько доверенных советников короля, но лишь немногие из них постоянно путешествовали с королем.\n\nАмбициозных дураков легко увлечь за собой."
 building_paris_umbral_louvre_02: "Контролируемый Луврский дворец"
 building_paris_umbral_louvre_02_desc: "$building_paris_umbral_louvre_01_desc$"
