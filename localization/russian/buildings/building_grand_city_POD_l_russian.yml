 building_type_cairo_khitta_saidi_01: "Бану аль-ас-Са'иди"
 building_type_cairo_khitta_saidi_01_desc: "#F Один из девяти каирских [Glossary('хитта', 'glossary_khitta_tt')].\n\nДругие вампиры обходят владения сетитов стороной. Эти змеи-обманщики были возведены в ранг хитта главным образом для того, чтобы избежать недовольства тем, что они не являются таковыми.#!"
