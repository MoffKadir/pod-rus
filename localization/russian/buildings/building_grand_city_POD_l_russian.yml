 building_type_paris_umbral_carnivals_01: "Парижские карнавалы"
 building_type_paris_umbral_carnivals_01_desc: "#F Каждая из гильдий и корпораций города имеет своего святого покровителя и празднует этот день. Незамужние служащие королевского дворца имеют свою собственную корпорацию Ле Базош, которая отмечает свой праздник парадом, фарсами и сатирическими театральными постановками.\n\nПрекрасная возможность усмирить население.#!"
 building_paris_umbral_carnivals_01: "Влияние на карнавалы"
 building_paris_umbral_carnivals_01_desc: "Каждая из гильдий и корпораций города имеет своего святого покровителя и празднует этот день. Незамужние служащие королевского дворца имеют свою собственную корпорацию Ле Базош, которая отмечает свой праздник парадом, фарсами и сатирическими театральными постановками.\n\nПрекрасная возможность усмирить население."
 building_paris_umbral_carnivals_02: "Контролируемые Парижские карнавалы"
 building_paris_umbral_carnivals_02_desc: "$building_paris_umbral_carnivals_01_desc$"
