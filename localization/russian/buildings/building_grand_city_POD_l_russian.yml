 building_type_paris_free_temple_01: "Л'Энкло дю Темпль"
 building_type_paris_free_temple_01_desc: "#F Рыцари-тамплиеры и рыцари-госпитальеры, а также доминиканский и францисканский ордены - все они имеют значительное присутствие в городе. Хотя они и не являются частью Теневой инквизиции, они остаются могущественными смертными, движимыми верой.\n\nСвет разгонит тьму.#!"
 building_paris_free_temple_01: "Л'Энкло дю Темпль"
 building_paris_free_temple_01_desc: "Рыцари-тамплиеры и рыцари-госпитальеры, а также доминиканский и францисканский ордены - все они имеют значительное присутствие в городе. Хотя они и не являются частью Теневой инквизиции, они остаются могущественными смертными, движимыми верой.\n\nСвет разгонит тьму."
