 building_type_rome_st_peters_city_01: "Ватикан"
 building_type_rome_st_peters_city_01_desc: "Ватикан является резиденцией папства с тех пор, как святой Петр создал этот институт."
 building_rome_st_peters_city_01: "Надежда святого Петра"
 building_rome_st_peters_city_01_desc: "$building_type_rome_st_peters_city_01_desc$\n\nСвятой Отец высоко ценит присутствие инквизиции, но ей ещё предстоит проявить себя."
 building_rome_st_peters_city_02: "Решимость святого Петра"
 building_rome_st_peters_city_02_desc: "$building_type_rome_st_peters_city_01_desc$\n\nИнквизиция была занята очищением города от сверхъестественной заразы."
 building_rome_st_peters_city_03: "Город святого Петра"
 building_rome_st_peters_city_03_desc: "$building_type_rome_st_peters_city_01_desc$\n\nНаконец-то город Рим спасен. Его жители могут быть спокойны, зная, что в ночи их больше не подстерегают опасности."

 POD_rome_san_michele_library_desc: "Это одно из самых впечатляющих в мире собраний оккультной литературы. Здесь можно найти книги о сверхъестественном, демонологии и магии. Различные инквизиторы также передали в библиотеку свои частные коллекции."
 POD_rome_san_michele_library_bonus: "#P Когда владелец этой постройки использует заступничество, цель всегда получает свойство «[GetTrait('truefaith').GetName(GetNullCharacter)]».#!"
 building_type_rome_san_michele_library_01: "Библиотека Сан-Микеле"
 building_type_rome_san_michele_library_01_desc: "Часть монастыря Сан-Микеле, отведенная для будущего использования Красным орденом.\n\n$POD_rome_san_michele_library_desc$"
 building_rome_san_michele_library_01: "Библиотека Сан-Микеле"
 building_rome_san_michele_library_01_desc: "Часть монастыря Сан-Микеле, отведенная для будущего использования Красным орденом."
 building_rome_san_michele_library_02: "Библиотека Сан-Микеле"
 building_rome_san_michele_library_02_desc: "Часть монастыря Сан-Микеле, занятая Красным орденом.\n\n$POD_rome_san_michele_library_desc$\n\n#X Если вы хотите улучшить его, вам необходимо выполнить [decision|El] поддержки Красного ордена.#!"
 building_rome_san_michele_library_03: "Библиотека Сан-Микеле"
 building_rome_san_michele_library_03_desc: "Часть монастыря Сан-Микеле, занятая торжествующим Красным орденом.\n\n$POD_rome_san_michele_library_desc$"

 POD_rome_san_michele_aedificium_desc: "В этом грандиозном сооружении находятся административные учреждения Инквизиции, включая служебные покои генерала-инквизитора, управляющего, цензора канцелярии, генерала-кондотьера и множества менее важных администраторов."
 POD_rome_san_michele_aedificium_bonus: "#P Пока инквизиция контролирует эту постройку, Папа всегда будет поддерживать её.#!"
 building_type_rome_san_michele_aedificium_01: "Строение Сан-Микеле"
 building_type_rome_san_michele_aedificium_01_desc: "Часть монастыря Сан-Микеле, отведенная для будущего использования домом Мурнау.\n\n$POD_rome_san_michele_aedificium_desc$"
 building_rome_san_michele_aedificium_01: "Строение Сан-Микеле"
 building_rome_san_michele_aedificium_01_desc: "Часть монастыря Сан-Микеле, отведенная для будущего использования домом Мурнау."
 building_rome_san_michele_aedificium_02: "Строение Сан-Микеле"
 building_rome_san_michele_aedificium_02_desc: "Часть монастыря Сан-Микеле, занятая домом Мурнау.\n\n$POD_rome_san_michele_aedificium_desc$\n\n#X Если вы хотите улучшить его, вам необходимо выполнить [decision|El] поддержки дома Мурнау.#!"
 building_rome_san_michele_aedificium_03: "Строение Сан-Микеле"
 building_rome_san_michele_aedificium_03_desc: "Часть монастыря Сан-Микеле, занимаемая торжествующим домом Мурнау.\n\n$POD_rome_san_michele_aedificium_desc$"

 POD_rome_san_michele_reliquary_desc: "В этом хранилище хранятся многочисленные реликвии инквизиции. В хранилище есть прихожая, которая используется для случайных выставок. К ней примыкает кабинет хранителя реликвий."
 POD_rome_san_michele_reliquary_bonus: "#P Владелец этой постройки может покупать [Concept('artifact_claims', 'претензии на артефакты')|E] по сниженной цене.#!"
 building_type_rome_san_michele_reliquary_01: "Великий реликварий Сан-Микеле"
 building_type_rome_san_michele_reliquary_01_desc: "Часть монастыря Сан-Микеле, отведенная для будущего использования рыцарями Акры.\n\n$POD_rome_san_michele_reliquary_desc$"
 building_rome_san_michele_reliquary_01: "Великий реликварий Сан-Микеле"
 building_rome_san_michele_reliquary_01_desc: "Часть монастыря Сан-Микеле, отведенная для будущего использования рыцарями Акры."
 building_rome_san_michele_reliquary_02: "Великий реликварий Сан-Микеле"
 building_rome_san_michele_reliquary_02_desc: "Часть монастыря Сан-Микеле, занимаемая рыцарями Акры.\n\n$POD_rome_san_michele_reliquary_desc$\n\n#X Если вы хотите улучшить его, вам необходимо выполнить [decision|El] поддержки рыцарей Акры.#!"
 building_rome_san_michele_reliquary_03: "Великий реликварий Сан-Микеле"
 building_rome_san_michele_reliquary_03_desc: "Часть монастыря Сан-Микеле, занятая торжествующими рыцарями Акры.\n\n$POD_rome_san_michele_reliquary_desc$"

 POD_rome_san_michele_basilica_desc: "Эта вдохновляющая базилика является главным местом поклонения для всех, кто находится в стенах монастыря. Она представляет собой сложное сооружение, выполненное в контрастных архитектурных стилях. На нижнем уровне базилики расположено несколько небольших часовен, обычно предназначенных для частного поклонения."
 POD_rome_san_michele_basilica_bonus: "#P Владелец этой постройки может медитировать в уединении, что дает лучшие результаты, когда это делается в базилике.#!"
 building_type_rome_san_michele_basilica_01: "Базилика Сан-Микеле"
 building_type_rome_san_michele_basilica_01_desc: "Часть монастыря Сан-Микеле, отведенная для будущего использования сестрами святого Иоанна.\n\n$POD_rome_san_michele_basilica_desc$"
 building_rome_san_michele_basilica_01: "Базилика Сан-Микеле"
 building_rome_san_michele_basilica_01_desc: "Часть монастыря Сан-Микеле, отведенная для будущего использования сестрами святого Иоанна."
 building_rome_san_michele_basilica_02: "Базилика Сан-Микеле"
 building_rome_san_michele_basilica_02_desc: "Часть монастыря Сан-Микеле, занимаемая сестрами святого Иоанна.\n\n$POD_rome_san_michele_basilica_desc$\n\n#X Если вы хотите улучшить его, вам необходимо выполнить [decision|El] поддержки сестёр святого Иоанна.#!"
 building_rome_san_michele_basilica_03: "Базилика Сан-Микеле"
 building_rome_san_michele_basilica_03_desc: "Часть монастыря Сан-Микеле, занимаемая торжествующими сестрами святого Иоанна.\n\n$POD_rome_san_michele_basilica_desc$"

 POD_rome_san_michele_cloisters_desc: "В этом трехэтажном сооружении находятся все инквизиторы, живущие в резиденции. В нём находятся две кухни, обеденный зал и две небольшие столовые. На первом этаже клуатра находится большая часовня, обычно используемая только для частных богослужений, а на двух верхних этажах можно найти небольшие частные часовни."
 POD_rome_san_michele_cloisters_bonus: "#P У владельца этой постройки удвоенная #TOOLTIP:game_concept_planning_speed_desc #E скорость планирования#!#! [Concept('journey', 'странствия')|E] по поиску логова.#!"
 building_type_rome_san_michele_cloisters_01: "Клуатр Сан-Микеле"
 building_type_rome_san_michele_cloisters_01_desc: "Часть монастыря Сан-Микеле, отведенная для будущего использования Oculi Dei.\n\n$POD_rome_san_michele_cloisters_desc$"
 building_rome_san_michele_cloisters_01: "Клуатр Сан-Микеле"
 building_rome_san_michele_cloisters_01_desc: "Часть монастыря Сан-Микеле, отведенная для будущего использования Oculi Dei."
 building_rome_san_michele_cloisters_02: "Клуатр Сан-Микеле"
 building_rome_san_michele_cloisters_02_desc: "Часть монастыря Сан-Микеле, занимаемая Oculi Dei.\n\n$POD_rome_san_michele_cloisters_desc$\n\n#X Если вы хотите улучшить его, вам необходимо выполнить [decision|El] поддержки Oculi Dei.#!"
 building_rome_san_michele_cloisters_03: "Клуатр Сан-Микеле"
 building_rome_san_michele_cloisters_03_desc: "Часть монастыря Сан-Микеле, занимаемая торжествующими Oculi Dei.\n\n$POD_rome_san_michele_cloisters_desc$"


