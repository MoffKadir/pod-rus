 building_type_baghdad_sinful_baghdad_01: "Вавилон, Ад на Земле"
 building_type_baghdad_sinful_baghdad_01_desc: "Месопотамские чародеи стремились к богатству и власти через благосклонность Загробного мира. До того, как ад существовал в человеческом воображении, Вавилон претендовал на то, чтобы стать адом на земле."
 building_baghdad_sinful_baghdad_01: "Вавилон, Воспоминания о грехе"
 building_baghdad_sinful_baghdad_01_desc: "В пятом веке до нашей эры Геродот путешествовал по Средиземноморью. О Вавилоне он написал разоблачающее и пугающее повествование. Конечно, это было совершенно неточно.\n\nПравда, которую он упустил, была намного хуже."
 building_baghdad_sinful_baghdad_02: "Вавилон, Город греха"
 building_baghdad_sinful_baghdad_02_desc: "В город пришли слуги энтропии, служащие первозданному духу разрушения; инфернальные демоны, вероятно, слуги ада, скрытого глубоко в [Concept('umbra', 'Умбре')|E] или в разломе пространства; и То-Чего-Не-Должно-Быть — обитатели внешней тьмы, Пустоты, непостижимые бормочущие существа, жаждущие проникнуть в эту вселенную.\n\nВсе три группы разделили Вавилон между собой."
 building_baghdad_sinful_baghdad_03: "Вавилон, Ад на Земле"
 building_baghdad_sinful_baghdad_03_desc: "Это было славное время потерять душу. Существа из Пустоты, а вскоре и малфеане и другие демоны получили полную свободу действий в городе. Они тревожили сон детей и нашёптывали на ухо царям."

 building_type_baghdad_sinful_palace_of_etemenanki_01: "Дворец Этеменанки"
 building_type_baghdad_sinful_palace_of_etemenanki_01_desc: "У западной стены старого Вавилона стоял семиярусный зиккурат «Этеменанки», что означает «основа неба и земли»."
 building_baghdad_sinful_palace_of_etemenanki_01: "Ануннаку"
 building_baghdad_sinful_palace_of_etemenanki_01_desc: "До Сотворения существовали Ануннаку. Чистые экспериментировали с квинтэссенцией, которая однажды станет Теллурианом — мирозданием. Но некоторые из старых богов запутались в узлах нитей Гобелена. Эти пойманные в ловушку боги стали Пустотой, а звёзды стали их тюрьмами."
 building_baghdad_sinful_palace_of_etemenanki_02: "Сила из Пустоты"
 building_baghdad_sinful_palace_of_etemenanki_02_desc: "Но ещё с начала времён человечество знало имена безымянных богов. Ночью люди шептались с небесами, глядя на звёзды и умоляя о силе. Их молитвы были услышаны."
 building_baghdad_sinful_palace_of_etemenanki_03: "Возвышение общества Этеменанки"
 building_baghdad_sinful_palace_of_etemenanki_03_desc: "Ко времени Навуходоносора почти половина сановников и жрецов Вавилона присоединилась к тёмному обществу. Влиятельные последователи Пустоты добились того, чтобы Эн Мардука, когда он сам не участвовал в заговоре, закрывал глаза на ночные ритуалы, проходившие в храме Мардука на вершине Этеменанки."
 building_baghdad_sinful_palace_of_etemenanki_04: "Нечестивые жрецы"
 building_baghdad_sinful_palace_of_etemenanki_04_desc: "Заговорщики выбрали из своих рядов жреца, названного в насмешку над Мардуком Белом. Процесс отбора менялся на протяжении веков, но во времена Навуходоносора это было соревнование за вызов самого могущественного демона."
 building_baghdad_sinful_palace_of_etemenanki_05: "Этеменанки: Первый лабиринт"
 building_baghdad_sinful_palace_of_etemenanki_05_desc: "Под руководством того или иного Бела Этеменанки стал первым «Лабиринтом» ещё до появления этого названия. С высокой площадки над городом астрологи изучали знамения и исполняли желания своих повелителей."

 building_type_baghdad_sinful_hanging_gardens_01: "Висячие сады"
 building_type_baghdad_sinful_hanging_gardens_01_desc: "Самый знаменитый уголок древнего Вавилона, ожидающий открытия и завоевания достойным завоевателем, который оценит его неземную красоту."
 building_baghdad_sinful_hanging_gardens_01: "Обычные сады"
 building_baghdad_sinful_hanging_gardens_01_desc: "Чудо человечества всё ещё находится в плачевном состоянии. Однако восстановление и работа уже начались, возможно, однажды они вернут ему прежнюю славу."
 building_baghdad_sinful_hanging_gardens_02: "Величественные сады"
 building_baghdad_sinful_hanging_gardens_02_desc: "$building_baghdad_sinful_hanging_gardens_01_desc$"
 building_baghdad_sinful_hanging_gardens_03: "Создание висячих садов"
 building_baghdad_sinful_hanging_gardens_03_desc: "Эти величественные сады ещё не похожи на сады древнего Вавилона, но их разнообразие и богатство заставят любого дважды подумать, прежде чем обвинить вас во лжи."
 building_baghdad_sinful_hanging_gardens_04: "Висячие сады"
 building_baghdad_sinful_hanging_gardens_04_desc: "Свершилось! Даже демоны, жившие в славные дни прошлого, признали бы ваш престиж и силу в восстановлении чуда Навуходоносора II!"
 building_baghdad_sinful_hanging_gardens_05: "Парящие сады"
 building_baghdad_sinful_hanging_gardens_05_desc: "Висячие сады? Как заурядно! Ваши сады парят. Пусть каждый гость города посетит их и преклонится перед вашим могуществом. Ведь это первый шаг к почитанию."

 building_type_baghdad_sinful_gate_of_ishtar_01: "Врата Иштар"
 building_type_baghdad_sinful_gate_of_ishtar_01_desc: "Название «Вавилон» означает «врата Божьи», но то, что проходило через эти ворота, было далеко не святым."
 building_baghdad_sinful_gate_of_ishtar_01: "Инфернальный перекрёсток"
 building_baghdad_sinful_gate_of_ishtar_01_desc: "В то время как таинственный Восток и призрачные леса языческой Европы знали демонов с доисторических времён, город Вавилон был перекрёстком для инфернальных сущностей."
 building_baghdad_sinful_gate_of_ishtar_02: "Ворота в энтропию"
 building_baghdad_sinful_gate_of_ishtar_02_desc: "Слуги энтропии, привязанные к звёздам существа из внешней Пустоты и обитатели Ямы гнездились в стенах первого великого города."
 building_baghdad_sinful_gate_of_ishtar_03: "Место рождения призыва"
 building_baghdad_sinful_gate_of_ishtar_03_desc: "Хотя общение с демонами и связывание нечистых духов теперь является стандартной практикой для Нефанди и других продажных душ, Вавилон был родиной искусства призыва."
 building_baghdad_sinful_gate_of_ishtar_04: "Город злобы и святотатства"
 building_baghdad_sinful_gate_of_ishtar_04_desc: "Вавилон кишел демонами. Со времён Хаммурапи и до упадка города под властью Селевкии заговор Этеменанки привёл в его стены злобу и святотатство."
 building_baghdad_sinful_gate_of_ishtar_05: "Демонические врата Иштар"
 building_baghdad_sinful_gate_of_ishtar_05_desc: "В конце концов, город определяют его демоны."

 building_type_baghdad_sinful_tower_of_babel_01: "Вавилонская башня"
 building_type_baghdad_sinful_tower_of_babel_01_desc: "И сказали они: построим себе город и башню, высотою до небес, и сделаем себе имя, прежде нежели рассеемся по лицу всей земли."
 building_baghdad_sinful_tower_of_babel_01: "Раскрытие башни"
 building_baghdad_sinful_tower_of_babel_01_desc: "И на всей земле был один язык и одно наречие. И было, когда они шли с востока, нашли они равнину в земле Сеннаар; и они жили там."
 building_baghdad_sinful_tower_of_babel_02: "Руины башни"
 building_baghdad_sinful_tower_of_babel_02_desc: "И сказали друг другу: наделаем кирпичей и обожжём огнём. И стали у них кирпичи вместо камней, а земляная смола вместо извести."
 building_baghdad_sinful_tower_of_babel_03: "Восстановление башни"
 building_baghdad_sinful_tower_of_babel_03_desc: "И сказали они: построим себе город и башню, высотою до небес, и сделаем себе имя, прежде нежели рассеемся по лицу всей земли."
 building_baghdad_sinful_tower_of_babel_04: "Восстановленная башня"
 building_baghdad_sinful_tower_of_babel_04_desc: "И сошёл Господь посмотреть город и башню, которые построили сыны человеческие. И сказал Господь: вот, народ один, и один у всех язык; и это они начинают делать; и теперь ничто не будет удержано от них, что они задумали сделать."
 building_baghdad_sinful_tower_of_babel_05: "Вавилонская башня: Оскорбление Бога"
 building_baghdad_sinful_tower_of_babel_05_desc: "Поэтому и имя ему: Вавилон; потому что Господь смешал там язык всей земли, и оттуда рассеял их Господь по всей земле."

 building_type_baghdad_sinful_tomb_of_nergal_01: "Проклятая гробница"
 building_type_baghdad_sinful_tomb_of_nergal_01_desc: "Недавно раскопанный храм стал местом странных событий. Некоторые говорят, что это могила, проклятая забытым божеством. Лишь немногие осмеливаются приблизиться, если их не заставят это сделать."
 building_baghdad_sinful_tomb_of_nergal_01: "Открытие гробницы"
 building_baghdad_sinful_tomb_of_nergal_01_desc: "Реальность мерцает и искажается по мере того, как вы продвигаетесь глубже в гробницу, только что-то действительно огромной силы могло сделать это. И существо такой силы никогда не бывает таким мёртвым, как кажется..."
 building_baghdad_sinful_tomb_of_nergal_02: "Расчистка завалов"
 building_baghdad_sinful_tomb_of_nergal_02_desc: "$building_baghdad_sinful_tomb_of_nergal_01_desc$"
 building_baghdad_sinful_tomb_of_nergal_03: "Идентификация существа"
 building_baghdad_sinful_tomb_of_nergal_03_desc: "Вы нашли саркофаг и выведенные на нём надписи, не может быть никаких сомнений в том, что вы нашли... в том, кого вы нашли."
 building_baghdad_sinful_tomb_of_nergal_04: "Открытие саркофага"
 building_baghdad_sinful_tomb_of_nergal_04_desc: "$building_baghdad_sinful_tomb_of_nergal_03_desc$"
 building_baghdad_sinful_tomb_of_nergal_05: "Открытая гробница"
 building_baghdad_sinful_tomb_of_nergal_05_desc: "Саркофаг пуст, его владелец уже давно покинул его пределы, но никому не нужно знать об этом, поскольку их страх — мощное оружие, способное заставить их повиноваться."

 building_type_baghdad_sinful_temples_of_the_gods_01: "Храмы царей-демонов"
 building_type_baghdad_sinful_temples_of_the_gods_01_desc: "Вавилон впервые пал, когда Мардук одержал победу над адским городом. Но крах греческой и римской цивилизаций открыл новую эру: эпоху царей-демонов."
 building_baghdad_sinful_temples_of_the_gods_01: "Забытые храмы"
 building_baghdad_sinful_temples_of_the_gods_01_desc: "Храмы вновь возвысились. И снова чёрные камни были подняты на место демоническими руками, и легионы жертв кричали под ножом свежевателя."
 building_baghdad_sinful_temples_of_the_gods_02: "Возобновление церемоний"
 building_baghdad_sinful_temples_of_the_gods_02_desc: "$building_baghdad_sinful_temples_of_the_gods_01_desc$"
 building_baghdad_sinful_temples_of_the_gods_03: "Восстановленные храмы"
 building_baghdad_sinful_temples_of_the_gods_03_desc: "Череда могущественных жрецов-чародеев восстановила славу Вавилона и Ура и построила небольшие города, погрязшие в роскоши и пороке."
 building_baghdad_sinful_temples_of_the_gods_04: "Подтверждение доминирования"
 building_baghdad_sinful_temples_of_the_gods_04_desc: "Почти 600 лет привратники и их союзники наслаждались плодами магического господства."
 building_baghdad_sinful_temples_of_the_gods_05: "Реликвии царей-демонов"
 building_baghdad_sinful_temples_of_the_gods_05_desc: "К тому времени, когда воинства мусульман наконец положили конец их возвращению, цари-демоны построили под своими городами сложные храмы, библиотеки и катакомбы. Даже победившие армии не смогли раскрыть их все."

 building_type_baghdad_sinful_desecrated_second_temple_01: "Руины Бхата"
 building_type_baghdad_sinful_desecrated_second_temple_01_desc: "Город, населённый демонами, бросил ужасную тень на древний Вавилон. Его окончательное поражение принесло много инфернальных реликвий, которые могли бы пригодиться и сегодня."
 building_baghdad_sinful_desecrated_second_temple_01: "Остатки живого города"
 building_baghdad_sinful_desecrated_second_temple_01_desc: "В немногих сохранившихся сведениях о городе говорится, что демонические слуги Нергала и Эрешкигаль воздвигли его за одну ночь. За огромной стеной из чёрного мрамора колючие растения и искривленное дерево сформировали причудливый живой город."
 building_baghdad_sinful_desecrated_second_temple_02: "Остатки крови"
 building_baghdad_sinful_desecrated_second_temple_02_desc: "Днём жители спали или собирали с деревьев сладко пахнущие плоды, политые человеческой кровью; по ночам горожане устраивали жестокие оргии или устраивали набеги на близлежащие города-государства."
 building_baghdad_sinful_desecrated_second_temple_03: "Остатки поражения Вавилона"
 building_baghdad_sinful_desecrated_second_temple_03_desc: "С помощью демонических слуг и устрашающих боевых машин (сделанных из того же дерева, из которого был построен сам город), бхаторийцы несколько раз разрушали стены самого Вавилона и уводили пленников для принесения в жертву."
 building_baghdad_sinful_desecrated_second_temple_04: "Остатки триумфа царя Шамши-Адада"
 building_baghdad_sinful_desecrated_second_temple_04_desc: "Наконец соседи дали отпор; после дорогостоящей кампании царь Ассура Шамши-Адад возглавил огромные силы конфедерации против бхаторитов. По обычаю той эпохи, каждый мужчина, женщина и ребёнок в Бхате были преданы мечу."
 building_baghdad_sinful_desecrated_second_temple_05: "Остатки военных трофеев"
 building_baghdad_sinful_desecrated_second_temple_05_desc: "Говорят, что многие гримуары вавилонской эпохи были написаны на свитках из кожи бхаторитов; предположительно, чародеи со всей державы заплатили целые состояния, чтобы получить трофеи, которые, как полагают, обладают мистическими свойствами более 3000 лет после падения города."

 building_type_baghdad_sinful_prideful_statue: "Иезавель Вавилонская"
 building_type_baghdad_sinful_prideful_statue_desc: "Эта статуя чтит эту дочь Евы (или, что ещё хуже, Лилит), забывшую христианское целомудрие ради более земных страстей. Подобно Вавилонской блуднице, она одевается в богатые одежды и часто следит за тем, чтобы невинные люди подвергались пыткам и убийствам."
 building_baghdad_sinful_prideful_statue: "Иезавель Вавилонская"
 building_baghdad_sinful_prideful_statue_desc: "$building_type_baghdad_sinful_prideful_statue_desc$"

 building_type_baghdad_sinful_enforced_rest_times: "Город, построенный на слезах"
 building_type_baghdad_sinful_enforced_rest_times_desc: "Пока рабы умирают и заменяются новыми, демоны питаются чёрствостью и праздностью правящего класса, которые они сами взрастили."
 building_baghdad_sinful_enforced_rest_times: "Город, построенный на слезах"
 building_baghdad_sinful_enforced_rest_times_desc: "$building_type_baghdad_sinful_enforced_rest_times_desc$"

 building_type_baghdad_sinful_pleasure_houses: "Священные браки"
 building_type_baghdad_sinful_pleasure_houses_desc: "Жрецы адского заговора использовали ритуал под названием «Священный брак», чтобы активировать свои врата. Они ослабили Барьер, чтобы лишить храм Мардука его святой цели. Статуи, обычно с трепетом глядящие на богов, закрыли глаза. В центре целлы оказался алтарь с вырезанными наподобие животных ногами."
 building_baghdad_sinful_pleasure_houses: "Священные браки"
 building_baghdad_sinful_pleasure_houses_desc: "Заговорщики приводили жён, дочерей и рабынь наверх по лестнице зиккурата. «Инанна» ждала внимания Бела. Часы напряжённых песнопений и соития — Бел стоял, а Инанна лежала на алтаре — давали Пустоте силу проявиться в Вавилоне."

 building_type_baghdad_sinful_feast_halls: "Мершакушту Курду"
 building_type_baghdad_sinful_feast_halls_desc: "Ритуал «Победоносного Мардука» проводился в начале каждого года, храмовые жрецы объявляли период обновления, сопровождаемый застольями, общением и другими праздниками..."
 building_baghdad_sinful_feast_halls: "Мершакушту Курду"
 building_baghdad_sinful_feast_halls_desc: "$building_type_baghdad_sinful_feast_halls_desc$"

 building_type_baghdad_sinful_spy_passages: "Плач по Таммузу"
 building_type_baghdad_sinful_spy_passages_desc: "Каждый год в начале посевного сезона шумерские города проводили инсценировку возвращения Таммуза в Загробный мир. Каждый город выбирал своего самого любимого юношу и хоронил его заживо. Все население одевалось в чёрное в течение восьми дней, а жрецы и жрицы Иштар одевались в чёрное в течение месяца, оплакивая символическую смерть бога."
 building_baghdad_sinful_spy_passages: "Плач по Таммузу"
 building_baghdad_sinful_spy_passages_desc: "$building_type_baghdad_sinful_spy_passages_desc$"

 building_type_baghdad_sinful_gold_hoard: "Золото и сера"
 building_type_baghdad_sinful_gold_hoard_desc: "Вавилон был проклятым городом. Но, тем не менее, чертовски богатый город. В результате торга с демонами появилось много заблудших душ, но также и несколько могущественных победителей."
 building_baghdad_sinful_gold_hoard: "Золото и сера"
 building_baghdad_sinful_gold_hoard_desc: "$building_type_baghdad_sinful_gold_hoard_desc$"

 building_type_baghdad_sinful_fighting_pits: "Ямы Анзу"
 building_type_baghdad_sinful_fighting_pits_desc: "Огромная птица с головой льва Анзу появляется в одном из преданий о Гильгамеше. Гнездясь на дереве хулупа, Анзу, очевидно, жила и с великим змеем, и с самой Лилит."
 building_baghdad_sinful_fighting_pits: "Ямы Анзу"
 building_baghdad_sinful_fighting_pits_desc: "$building_type_baghdad_sinful_fighting_pits_desc$"

 #############################
 ####### Muslim baghdad ######
 #############################

 building_type_baghdad_jewel_of_allah_baghdad_01: "Багдад: Город тысячи мечетей"
 building_type_baghdad_jewel_of_allah_baghdad_01_desc: "Жемчужина золотого века ислама поблекла, но её репутация сохранилась. Многое можно перестроить и восстановить."
 building_baghdad_jewel_of_allah_baghdad_01: "Багдад: Город одной мечети"
 building_baghdad_jewel_of_allah_baghdad_01_desc: "Это не та жемчужина ислама, которой она была во времена Аббасидов, но, возможно, при наличии воли и усилий она могла бы стать таковой снова."
 building_baghdad_jewel_of_allah_baghdad_02: "Багдад: Город дюжины мечетей"
 building_baghdad_jewel_of_allah_baghdad_02_desc: "Путь к выздоровлению долог, но большая часть его уже пройдена, осталось всего пара шагов до триумфального возвращения к славе."
 building_baghdad_jewel_of_allah_baghdad_03: "Багдад: Город тысячи мечетей"
 building_baghdad_jewel_of_allah_baghdad_03_desc: "Жемчужина ислама, равная по важности даже Мекке и Медине, никогда не запятнанная!"

 building_type_baghdad_jewel_of_allah_palace_of_the_abbasids_01: "Дворец Аббасидов"
 building_type_baghdad_jewel_of_allah_palace_of_the_abbasids_01_desc: "Дворец Аббасидов, отсюда они правили от Кордовы до Китая, память о них была гордой и использовалась во славу Багдада."
 building_baghdad_jewel_of_allah_palace_of_the_abbasids_01: "Захват дворца"
 building_baghdad_jewel_of_allah_palace_of_the_abbasids_01_desc: "Череда некомпетентных правителей и равнодушных завоевателей привела дворец в смятение. Пора навести порядок в этой ситуации."
 building_baghdad_jewel_of_allah_palace_of_the_abbasids_02: "Избавление от любых претендентов"
 building_baghdad_jewel_of_allah_palace_of_the_abbasids_02_desc: "$building_baghdad_jewel_of_allah_palace_of_the_abbasids_01_desc$"
 building_baghdad_jewel_of_allah_palace_of_the_abbasids_03: "Контроль над стражей"
 building_baghdad_jewel_of_allah_palace_of_the_abbasids_03_desc: "Вы сообщили о своём присутствии. Ваше влияние последует."
 building_baghdad_jewel_of_allah_palace_of_the_abbasids_04: "Контроль над дворянами"
 building_baghdad_jewel_of_allah_palace_of_the_abbasids_04_desc: "Влиятельным людям нужен здравый совет. Вы единственный, кто может это предоставить."
 building_baghdad_jewel_of_allah_palace_of_the_abbasids_05: "Влияние на халифа"
 building_baghdad_jewel_of_allah_palace_of_the_abbasids_05_desc: "Здесь переплетаются духовные и мирские вопросы. Хотя демонстрируемая вера может быть сдерживающим фактором, ваше влияние, тем не менее, растет."

 building_type_baghdad_jewel_of_allah_house_of_wisdom_01: "Дом мудрости"
 building_type_baghdad_jewel_of_allah_house_of_wisdom_01_desc: "Дом мудрости, также известный как Большая библиотека Багдада, является крупной общественной академией и интеллектуальным центром эпохи Аббасидов в Багдаде. Во времена золотого века ислама она служила одной из крупнейших общественных библиотек в мире."
 building_baghdad_jewel_of_allah_house_of_wisdom_01: "Невежественные массы"
 building_baghdad_jewel_of_allah_house_of_wisdom_01_desc: "Ваша власть мало что значит для этих учёных, слишком интересующихся своими книгами, чтобы обращать внимание на остальной мир. Вам придётся научить их слушать вас."
 building_baghdad_jewel_of_allah_house_of_wisdom_02: "Невежественные наставники"
 building_baghdad_jewel_of_allah_house_of_wisdom_02_desc: "$building_baghdad_jewel_of_allah_house_of_wisdom_01_desc$"
 building_baghdad_jewel_of_allah_house_of_wisdom_03: "Контролируемые исследования"
 building_baghdad_jewel_of_allah_house_of_wisdom_03_desc: "Гранты и советы, нашёптанные в нужные уши, позволили вам стать самым важным игроком во внутренней политике Дома мудрости, но не единственным."
 building_baghdad_jewel_of_allah_house_of_wisdom_04: "Контролируемая мудрость"
 building_baghdad_jewel_of_allah_house_of_wisdom_04_desc: "$building_baghdad_jewel_of_allah_house_of_wisdom_03_desc$"
 building_baghdad_jewel_of_allah_house_of_wisdom_05: "Ваш Дом мудрости"
 building_baghdad_jewel_of_allah_house_of_wisdom_05_desc: "Здесь можно узнать удивительные вещи, и многие надеются, что тайный хозяин Дома откроет им доступ."

 building_type_baghdad_jewel_of_allah_abou_hanifaa_mosque_01: "Мечеть Аллаха Абу Ханифаа"
 building_type_baghdad_jewel_of_allah_abou_hanifaa_mosque_01_desc: "Самая большая мечеть в городе – это центр обучения, благочестия и, что более важно, влияния."
 building_baghdad_jewel_of_allah_abou_hanifaa_mosque_01: "Своенравный имам"
 building_baghdad_jewel_of_allah_abou_hanifaa_mosque_01_desc: "Самая большая мечеть в городе не уступит одной только вежливой просьбе. Вера – это препятствие, но его можно преодолеть."
 building_baghdad_jewel_of_allah_abou_hanifaa_mosque_02: "Глухая паства"
 building_baghdad_jewel_of_allah_abou_hanifaa_mosque_02_desc: "$building_baghdad_jewel_of_allah_abou_hanifaa_mosque_01_desc$"
 building_baghdad_jewel_of_allah_abou_hanifaa_mosque_03: "Внимательный хадис"
 building_baghdad_jewel_of_allah_abou_hanifaa_mosque_03_desc: "Они следуют вашим словам, слушают ваш голос, подчиняются вашим приказам, просто они ещё этого не знают."
 building_baghdad_jewel_of_allah_abou_hanifaa_mosque_04: "Контролируемые учёные"
 building_baghdad_jewel_of_allah_abou_hanifaa_mosque_04_desc: "$building_baghdad_jewel_of_allah_abou_hanifaa_mosque_03_desc$"
 building_baghdad_jewel_of_allah_abou_hanifaa_mosque_05: "Влияние на посетителей"
 building_baghdad_jewel_of_allah_abou_hanifaa_mosque_05_desc: "Каждый, кто проходит здесь, в конечном итоге становится частью ваших замыслов. Знают они это или нет."

 building_type_baghdad_jewel_of_allah_al_mustansiriyah_university_01: "Университет Аль-Мустансирия"
 building_type_baghdad_jewel_of_allah_al_mustansiriyah_university_01_desc: "Первый мусульманский университет, основанный аббасидским халифом Аль-Мустансиром."
 building_baghdad_jewel_of_allah_al_mustansiriyah_university_01: "Подача прошения"
 building_baghdad_jewel_of_allah_al_mustansiriyah_university_01_desc: "Оказывается, не всех пускают. Здесь вам придётся повысить свое влияние... или пройти испытание."
 building_baghdad_jewel_of_allah_al_mustansiriyah_university_02: "Вторая попытка"
 building_baghdad_jewel_of_allah_al_mustansiriyah_university_02_desc: "$building_baghdad_jewel_of_allah_al_mustansiriyah_university_01_desc$"
 building_baghdad_jewel_of_allah_al_mustansiriyah_university_03: "Наконец внутри"
 building_baghdad_jewel_of_allah_al_mustansiriyah_university_03_desc: "Они не смогли остановить вас три раза, и теперь все знания этого университета в вашем распоряжении! Как только вы соберётесь это прочитать."
 building_baghdad_jewel_of_allah_al_mustansiriyah_university_04: "Учимся учиться"
 building_baghdad_jewel_of_allah_al_mustansiriyah_university_04_desc: "Здесь нет никаких великих тайн, но коллективная мудрость величайшего города ислама по-прежнему остаётся сокровищем, которое нужно беречь."
 building_baghdad_jewel_of_allah_al_mustansiriyah_university_05: "Бесконечный путь"
 building_baghdad_jewel_of_allah_al_mustansiriyah_university_05_desc: "Важны не только знания, но и учёба, и удовольствие от самого процесса. Здесь не место тем, кто считает свою башню уже построенной; сюда приходят те, кто любит добавлять к ней новые кирпичи, понимает, что всегда есть чему учиться, и радуется этому."

 building_type_baghdad_jewel_of_allah_madrasa_mirjaniyya_01: "Медресе Мирджания и комплекс Хана Мирджана"
 building_type_baghdad_jewel_of_allah_madrasa_mirjaniyya_01_desc: "Центр обучения и гостиница умело объединены, так что ни один из них не может подчинить друг друга."
 building_baghdad_jewel_of_allah_madrasa_mirjaniyya_01: "Контроль над учёными"
 building_baghdad_jewel_of_allah_madrasa_mirjaniyya_01_desc: "Захватить власть будет сложно, вам придётся двигаться с обеих сторон одновременно, чтобы ни одна из сторон не могла вмешаться."
 building_baghdad_jewel_of_allah_madrasa_mirjaniyya_02: "Контроль над купцами"
 building_baghdad_jewel_of_allah_madrasa_mirjaniyya_02_desc: "$building_baghdad_jewel_of_allah_madrasa_mirjaniyya_01_desc$"
 building_baghdad_jewel_of_allah_madrasa_mirjaniyya_03: "Обирание путешественников"
 building_baghdad_jewel_of_allah_madrasa_mirjaniyya_03_desc: "У вас нет тотального контроля. Пока что. Но у вас достаточно средств, чтобы поднять цены и гарантировать, что студенты не наткнутся на вещи, о которых им лучше не знать."
 building_baghdad_jewel_of_allah_madrasa_mirjaniyya_04: "Ложь студентам"
 building_baghdad_jewel_of_allah_madrasa_mirjaniyya_04_desc: "$building_baghdad_jewel_of_allah_madrasa_mirjaniyya_03_desc$"
 building_baghdad_jewel_of_allah_madrasa_mirjaniyya_05: "Вымогательство богатства и знаний в равной степени"
 building_baghdad_jewel_of_allah_madrasa_mirjaniyya_05_desc: "Одна сторона не смогла одолеть другую, но это просто сделало их слабыми перед внешним вмешательством, и теперь в ваших руках и богатство, и знания."

 building_type_baghdad_jewel_of_allah_zumurrud_kathun_mausoleum_01: "Мавзолей Зумурруд-хатун"
 building_type_baghdad_jewel_of_allah_zumurrud_kathun_mausoleum_01_desc: "Мавзолей, посвящённый жене халифа аль-Мустади, самый верный знак любви, эхом отзывающийся сквозь века."
 building_baghdad_jewel_of_allah_zumurrud_kathun_mausoleum_01: "Обычный мавзолей"
 building_baghdad_jewel_of_allah_zumurrud_kathun_mausoleum_01_desc: "Мавзолей среди многих в этом городе, особенный только своим величием, свидетельство того, что всё умирает. Но ваши чувства подсказывают вам, что всё может быть немного сложнее..."
 building_baghdad_jewel_of_allah_zumurrud_kathun_mausoleum_02: "Знаменитый мавзолей"
 building_baghdad_jewel_of_allah_zumurrud_kathun_mausoleum_02_desc: "$building_baghdad_jewel_of_allah_zumurrud_kathun_mausoleum_01_desc$"
 building_baghdad_jewel_of_allah_zumurrud_kathun_mausoleum_03: "Интригующий мавзолей"
 building_baghdad_jewel_of_allah_zumurrud_kathun_mausoleum_03_desc: "Духи усопших стекаются вокруг этого мавзолея, все плачут, воздух здесь разрежен, грань между мирами легко разрывается."
 building_baghdad_jewel_of_allah_zumurrud_kathun_mausoleum_04: "Контакт с призраками"
 building_baghdad_jewel_of_allah_zumurrud_kathun_mausoleum_04_desc: "$building_baghdad_jewel_of_allah_zumurrud_kathun_mausoleum_03_desc$"
 building_baghdad_jewel_of_allah_zumurrud_kathun_mausoleum_05: "Проход в Загробный мир"
 building_baghdad_jewel_of_allah_zumurrud_kathun_mausoleum_05_desc: "Подобно Орфею, вы вошли в Загробный мир благодаря силе истинной любви. То, что любовь была не вашей, не имеет значения."

 building_type_baghdad_jewel_of_allah_al_adudi_bimaristan_01: "Лечебница Аль-Адуди"
 building_type_baghdad_jewel_of_allah_al_adudi_bimaristan_01_desc: "Лечебница возникла, когда эмир из династии Буидов Адуд ад-Даула решил построить лечебницу за несколько лет до своей смерти. Аль-Адуди считается одной из самых инновационных и современных лечебниц мусульманского мира."
 building_baghdad_jewel_of_allah_al_adudi_bimaristan_01: "Развращение врачей"
 building_baghdad_jewel_of_allah_al_adudi_bimaristan_01_desc: "У вас есть знания и лекарства, которые они желают, и вы дадите им это за определённую плату."
 building_baghdad_jewel_of_allah_al_adudi_bimaristan_02: "Изучение методов"
 building_baghdad_jewel_of_allah_al_adudi_bimaristan_02_desc: "$building_baghdad_jewel_of_allah_al_adudi_bimaristan_01_desc$"
 building_baghdad_jewel_of_allah_al_adudi_bimaristan_03: "Приведение странных пациентов"
 building_baghdad_jewel_of_allah_al_adudi_bimaristan_03_desc: "С помощью врачей вы сможете начать исследовать более... эзотерических существ на этой земле."
 building_baghdad_jewel_of_allah_al_adudi_bimaristan_04: "Увлекательные открытия"
 building_baghdad_jewel_of_allah_al_adudi_bimaristan_04_desc: "$building_baghdad_jewel_of_allah_al_adudi_bimaristan_03_desc$"
 building_baghdad_jewel_of_allah_al_adudi_bimaristan_05: "Теневая лечебница"
 building_baghdad_jewel_of_allah_al_adudi_bimaristan_05_desc: "Вы исцеляете тех, кого хотите сохранить в живых, и учитесь на тех, кого не хотите. Совершенная система."

 building_type_baghdad_jewel_of_allah_taj_palace_01: "Дворец Тадж"
 building_type_baghdad_jewel_of_allah_taj_palace_01_desc: "Расположенный на берегу реки Тигр на юге восточного Багдада, к югу от старого дворца Хасани, он, таким образом, был самой южной частью обширного дворцового комплекса, «Обителью халифата»."
 building_baghdad_jewel_of_allah_taj_palace_01: "Проникновение во дворец"
 building_baghdad_jewel_of_allah_taj_palace_01_desc: "Во дворце до сих пор проживает множество стражников и дворян, которые разжирели в отсутствие угроз. Прекрасная возможность."
 building_baghdad_jewel_of_allah_taj_palace_02: "Контроль над стражей"
 building_baghdad_jewel_of_allah_taj_palace_02_desc: "$building_baghdad_jewel_of_allah_taj_palace_01_desc$"
 building_baghdad_jewel_of_allah_taj_palace_03: "Набор новых гарнизонов"
 building_baghdad_jewel_of_allah_taj_palace_03_desc: "Теперь, когда люди под контролем, настало время гарантировать, что в вашем городе ничего не произойдёт без вашего ведома."
 building_baghdad_jewel_of_allah_taj_palace_04: "Увеличение патрулей"
 building_baghdad_jewel_of_allah_taj_palace_04_desc: "$building_baghdad_jewel_of_allah_taj_palace_03_desc$"
 building_baghdad_jewel_of_allah_taj_palace_05: "Надзор за городом"
 building_baghdad_jewel_of_allah_taj_palace_05_desc: "Отсюда вы видите всё: каждое преступление, каждый шёпот, каждую попытку государственного переворота, в этом городе ничего не происходит без вашего разрешения, и все это знают."

 #############################
 ####### Looted Baghdad ######
 #############################

 building_type_baghdad_looted_baghdad_01: "Разграбленный Багдад"
 building_type_baghdad_looted_baghdad_01_desc: "Хулагу-хан предал этот город мечу, и он всё ещё умирает медленной и мучительной смертью."
 building_baghdad_looted_baghdad_01: "Багдад в руинах"
 building_baghdad_looted_baghdad_01_desc: "Я низвергну тебя с небесной выси,\nКак лев, я сброшу тебя в глубочайшую бездну.\nЯ не оставлю ни одного человека в живых в твоей стране,\nЯ предам огню твой город, земли и державу. Если у тебя хватит духу спасти свою голову и древний род,\nВнимательно выслушай мой совет.\nЕсли откажешься принять его, я покажу тебе, что значит воля Бога."
 building_baghdad_looted_baghdad_02: "Восстановленный Багдад"
 building_baghdad_looted_baghdad_02_desc: "Багдад, возможно, и был сожжён, но он не был разрушен. Приложив огромные усилия, можно залечить шрамы и вернуть себе свой статус в мире."
 POD_baghdad_rebuild_tooltip: "Багдад будет #P восстановлен#!, и станут доступны новые [Concept('buildings', 'постройки')|E]"

 building_type_baghdad_starving_population_01: "Голодающее население"
 building_type_baghdad_starving_population_01_desc: "Еда и запасы уничтожены: есть нечего. Вам придётся потратить средства из своей казны, чтобы жители не умерли от голода и не покинули город."
 building_baghdad_starving_population_01: "Полномасштабный голод"
 building_baghdad_starving_population_01_desc: "$building_type_baghdad_starving_population_01_desc$"
 building_baghdad_starving_population_02: "Непреходящий голод"
 building_baghdad_starving_population_02_desc: "$building_type_baghdad_starving_population_01_desc$"
 building_baghdad_starving_population_03: "Уменьшающийся голод"
 building_baghdad_starving_population_03_desc: "$building_type_baghdad_starving_population_01_desc$"

 building_type_baghdad_destroyed_infrastructure_01: "Горящий город"
 building_type_baghdad_destroyed_infrastructure_01_desc: "Неизвестно, сколько жителей было убито: мусульманские писатели оценивают от 800 000 до двух миллионов смертей, а сам Хулагу в письме Людовику IX Франции отмечал, что его армия перебила 200 000 человек."
 building_baghdad_destroyed_infrastructure_01: "Бесконечный кошмар"
 building_baghdad_destroyed_infrastructure_01_desc: "$building_type_baghdad_destroyed_infrastructure_01_desc$"
 building_baghdad_destroyed_infrastructure_02: "Распространённый хаос"
 building_baghdad_destroyed_infrastructure_02_desc: "$building_type_baghdad_destroyed_infrastructure_01_desc$"
 building_baghdad_destroyed_infrastructure_03: "Свет в конце"
 building_baghdad_destroyed_infrastructure_03_desc: "$building_type_baghdad_destroyed_infrastructure_01_desc$"

 building_type_baghdad_rivers_of_ink_01: "Реки чернил"
 building_type_baghdad_rivers_of_ink_01_desc: "В Тигр было выброшено столько книг из багдадских библиотек, что от их числа «река почернела»."
 building_baghdad_rivers_of_ink_01: "Почерневшие реки"
 building_baghdad_rivers_of_ink_01_desc: "$building_type_baghdad_rivers_of_ink_01_desc$"
 building_baghdad_rivers_of_ink_02: "Разлив чернильных рек"
 building_baghdad_rivers_of_ink_02_desc: "$building_type_baghdad_rivers_of_ink_01_desc$"
 building_baghdad_rivers_of_ink_03: "Запятнанные реки"
 building_baghdad_rivers_of_ink_03_desc: "$building_type_baghdad_rivers_of_ink_01_desc$"

 building_type_baghdad_desecrated_mosques_01: "Город тысячи горящих мечетей"
 building_type_baghdad_desecrated_mosques_01_desc: "Больше не слышны голоса, сигнализирующие о времени молитвы, теперь они лишь демонстрируют боль и ужас, охватившие Багдад."
 building_baghdad_desecrated_mosques_01: "Город тысячи горящих мечетей"
 building_baghdad_desecrated_mosques_01_desc: "$building_type_baghdad_desecrated_mosques_01_desc$"
 building_baghdad_desecrated_mosques_02: "Город тысячи разрушающихся мечетей"
 building_baghdad_desecrated_mosques_02_desc: "$building_type_baghdad_desecrated_mosques_01_desc$"
 building_baghdad_desecrated_mosques_03: "Город тысячи мечетей со шрамами"
 building_baghdad_desecrated_mosques_03_desc: "$building_type_baghdad_desecrated_mosques_01_desc$"

 building_type_baghdad_ruined_palaces_01: "Разрушенные дворцы"
 building_type_baghdad_ruined_palaces_01_desc: "Хулагу запер халифа в темнице, окружённой его сокровищами, после чего он умер от голода через четыре дня. Всё остальное было возвращено монгольским завоевателям, и, вероятно, их больше никогда не видели в Багдаде."
 building_baghdad_ruined_palaces_01: "Разрушенные дворцы"
 building_baghdad_ruined_palaces_01_desc: "$building_type_baghdad_ruined_palaces_01_desc$"
 building_baghdad_ruined_palaces_02: "Разграбленные дворцы"
 building_baghdad_ruined_palaces_02_desc: "$building_type_baghdad_ruined_palaces_01_desc$"
 building_baghdad_ruined_palaces_03: "Покинутые дворцы"
 building_baghdad_ruined_palaces_03_desc: "$building_type_baghdad_ruined_palaces_01_desc$"

 #############################
 #### Ctesiphon Pheonix ######
 #############################

 building_type_ctesiphon_the_shadowed_pheonix_ctesiphon_01: "Ктесифон: Персидский феникс"
 building_type_ctesiphon_the_shadowed_pheonix_ctesiphon_01_desc: "Ктесифон служил столицей царей иранских империй более восьмисот лет, в парфянский и сасанидский периоды. Жемчужина мира, она могла бы стать такой ещё раз."
 building_ctesiphon_the_shadowed_pheonix_ctesiphon_01: "Ктесифон: Угли"
 building_ctesiphon_the_shadowed_pheonix_ctesiphon_01_desc: "Ктесифон, выросший из небольшого военного лагеря, ставшего деревней, начинался скромно."
 building_ctesiphon_the_shadowed_pheonix_ctesiphon_02: "Ктесифон: Пламя"
 building_ctesiphon_the_shadowed_pheonix_ctesiphon_02_desc: "Будучи столицей Сасанидской империи, Ктесифон стал богатым торговым мегаполисом, сливающимся с окружающими городами по обоим берегам реки."
 building_ctesiphon_the_shadowed_pheonix_ctesiphon_03: "Ктесифон: Феникс"
 building_ctesiphon_the_shadowed_pheonix_ctesiphon_03_desc: "Некоторые говорили, что в конце VI и начале VII веков он стал крупнейшим городом в мире, создав наследие, которое сохранилось до наших дней."

 building_type_ctesiphon_the_shadowed_pheonix_white_palace_01: "Белый дворец"
 building_type_ctesiphon_the_shadowed_pheonix_white_palace_01_desc: "Белый дворец был главной резиденцией сасанидского царя царей в столице Ктесифона, скорее всего, основанной вторым сасанидским монархом Шапуром I."
 building_ctesiphon_the_shadowed_pheonix_white_palace_01: "Дворец пыли"
 building_ctesiphon_the_shadowed_pheonix_white_palace_01_desc: "Он не использовался на протяжении веков, и на это есть веские причины. Чтобы восстановить это место, потребуется много работы."
 building_ctesiphon_the_shadowed_pheonix_white_palace_02: "Сломанные стены"
 building_ctesiphon_the_shadowed_pheonix_white_palace_02_desc: "$building_ctesiphon_the_shadowed_pheonix_white_palace_01_desc$"
 building_ctesiphon_the_shadowed_pheonix_white_palace_03: "Найм стражи"
 building_ctesiphon_the_shadowed_pheonix_white_palace_03_desc: "Обновленный Белый дворец снова стал пригодным для проживания и теперь нуждается в квалифицированном персонале."
 building_ctesiphon_the_shadowed_pheonix_white_palace_04: "Придворные приёмы"
 building_ctesiphon_the_shadowed_pheonix_white_palace_04_desc: "$building_ctesiphon_the_shadowed_pheonix_white_palace_03_desc$"
 building_ctesiphon_the_shadowed_pheonix_white_palace_05: "Дворец шахиншаха"
 building_ctesiphon_the_shadowed_pheonix_white_palace_05_desc: "Время словно не сказалось на Белом дворце. Это снова двор яркой персидской династии, хотя и более незримой."

 building_type_ctesiphon_the_shadowed_pheonix_taq_kasra_01: "Так Касра"
 building_type_ctesiphon_the_shadowed_pheonix_taq_kasra_01_desc: "Иногда называемая Ктесифонской аркой, это был фасад главного дворца города и единственное видимое сохранившееся строение древней столицы."
 building_ctesiphon_the_shadowed_pheonix_taq_kasra_01: "Руины имперского комплекса"
 building_ctesiphon_the_shadowed_pheonix_taq_kasra_01_desc: "Арка была частью имперского дворцового комплекса. Тронный зал — предположительно под аркой или за ней — уже давно затерян в капризах времени."
 building_ctesiphon_the_shadowed_pheonix_taq_kasra_02: "Остаток имперского комплекса"
 building_ctesiphon_the_shadowed_pheonix_taq_kasra_02_desc: "$building_ctesiphon_the_shadowed_pheonix_taq_kasra_01_desc$"
 building_ctesiphon_the_shadowed_pheonix_taq_kasra_03: "Разрушенный зал приёмов"
 building_ctesiphon_the_shadowed_pheonix_taq_kasra_03_desc: "Сохранившееся до наших дней сооружение было главным портиком зала аудиенций Сасанидов, которые сохранили то же место, которое выбрали парфяне."
 building_ctesiphon_the_shadowed_pheonix_taq_kasra_04: "Восстановленный зал аудиенций"
 building_ctesiphon_the_shadowed_pheonix_taq_kasra_04_desc: "$building_ctesiphon_the_shadowed_pheonix_taq_kasra_03_desc$"
 building_ctesiphon_the_shadowed_pheonix_taq_kasra_05: "Так Касра"
 building_ctesiphon_the_shadowed_pheonix_taq_kasra_05_desc: "Из единственной уцелевшей колонны вы восстановили славный главный дворец Ктесифона. Символ вашей силы и стойкости на всеобщее обозрение."

 building_type_ctesiphon_the_shadowed_pheonix_veh_ardashir_01: "Вех Ардашир"
 building_type_ctesiphon_the_shadowed_pheonix_veh_ardashir_01_desc: "Первоначально известный как Селевкия, этот город был самым богатым пригородом Ктесифона."
 building_ctesiphon_the_shadowed_pheonix_veh_ardashir_01: "Остатки наводнения"
 building_ctesiphon_the_shadowed_pheonix_veh_ardashir_01_desc: "В середине V века в Вех-Ардашире произошло наводнение, которое разделило город на две части и привело к его упадку. Вашей первой задачей будет залечить нанесённый урон."
 building_ctesiphon_the_shadowed_pheonix_veh_ardashir_02: "Строительство мостов"
 building_ctesiphon_the_shadowed_pheonix_veh_ardashir_02_desc: "$building_ctesiphon_the_shadowed_pheonix_veh_ardashir_01_desc$"
 building_ctesiphon_the_shadowed_pheonix_veh_ardashir_03: "Резиденция патриарха"
 building_ctesiphon_the_shadowed_pheonix_veh_ardashir_03_desc: "Когда-то здесь располагалась Церковь Востока. Воспоминания об этом времени могут стать полезным инструментом для возвращения людей в ваш обновлённый Ктесифон."
 building_ctesiphon_the_shadowed_pheonix_veh_ardashir_04: "Новое место паломничества"
 building_ctesiphon_the_shadowed_pheonix_veh_ardashir_04_desc: "$building_ctesiphon_the_shadowed_pheonix_veh_ardashir_03_desc$"
 building_ctesiphon_the_shadowed_pheonix_veh_ardashir_05: "Вех Ардашир"
 building_ctesiphon_the_shadowed_pheonix_veh_ardashir_05_desc: "Благодаря возрождению этого пригорода Ктесифон стал на шаг ближе к полному восстановлению."

 building_type_ctesiphon_the_shadowed_pheonix_bagh_i_hinduvan_01: "Баг и Хиндуван"
 building_type_ctesiphon_the_shadowed_pheonix_bagh_i_hinduvan_01_desc: "«Индийский сад» построен во времена правления царя Хосрова II. Место красоты и передышки, которое понадобится в вашем амбициозном проекте для Ктесифона."
 building_ctesiphon_the_shadowed_pheonix_bagh_i_hinduvan_01: "Пыль и песок"
 building_ctesiphon_the_shadowed_pheonix_bagh_i_hinduvan_01_desc: "Ныне от этого чуда классического мира не осталось ничего, кроме пыли и песка, кроме воспоминаний."
 building_ctesiphon_the_shadowed_pheonix_bagh_i_hinduvan_02: "Прорастающая зелень"
 building_ctesiphon_the_shadowed_pheonix_bagh_i_hinduvan_02_desc: "$building_ctesiphon_the_shadowed_pheonix_bagh_i_hinduvan_01_desc$"
 building_ctesiphon_the_shadowed_pheonix_bagh_i_hinduvan_03: "Робкое цветение"
 building_ctesiphon_the_shadowed_pheonix_bagh_i_hinduvan_03_desc: "Растущий сад в растущем городе: оба созданы, чтобы утолить ностальгию своего тайного правителя."
 building_ctesiphon_the_shadowed_pheonix_bagh_i_hinduvan_04: "Теневой навес"
 building_ctesiphon_the_shadowed_pheonix_bagh_i_hinduvan_04_desc: "$building_ctesiphon_the_shadowed_pheonix_bagh_i_hinduvan_03_desc$"
 building_ctesiphon_the_shadowed_pheonix_bagh_i_hinduvan_05: "Баг и Хиндуван"
 building_ctesiphon_the_shadowed_pheonix_bagh_i_hinduvan_05_desc: "Вероятно, не совсем такой же, как классический, этот сад по-прежнему представляет собой великолепное зрелище в восстановленном Ктесифоне."

 building_type_ctesiphon_the_shadowed_pheonix_veh_antiok_xusro_01: "Вех Антиок Хосров"
 building_type_ctesiphon_the_shadowed_pheonix_veh_antiok_xusro_01_desc: "Вех Антиок Хосров, буквально «лучшая Антиохия, построенная Хосровом», — город, основанный шахом Хосровом I на восточном берегу Тигра в окрестностях Ктесифона, населённый переселёнными римскими военнопленными."
 building_ctesiphon_the_shadowed_pheonix_veh_antiok_xusro_01: "Не лучше Антиохии"
 building_ctesiphon_the_shadowed_pheonix_veh_antiok_xusro_01_desc: "Название обещает многое любому, кто его услышит, и вашей задачей будет убедиться, что это обещание выполнено."
 building_ctesiphon_the_shadowed_pheonix_veh_antiok_xusro_02: "Почти так же хороша, как Антиохия"
 building_ctesiphon_the_shadowed_pheonix_veh_antiok_xusro_02_desc: "$building_ctesiphon_the_shadowed_pheonix_veh_antiok_xusro_01_desc$"
 building_ctesiphon_the_shadowed_pheonix_veh_antiok_xusro_03: "Лучше Антиохии"
 building_ctesiphon_the_shadowed_pheonix_veh_antiok_xusro_03_desc: "Что ж, официальных соревнований между городами не проводится, чтобы узнать, выиграли ли вы, но вы хорошо это показали, если можете сами так сказать."
 building_ctesiphon_the_shadowed_pheonix_veh_antiok_xusro_04: "Построенное вами"
 building_ctesiphon_the_shadowed_pheonix_veh_antiok_xusro_04_desc: "$building_ctesiphon_the_shadowed_pheonix_veh_antiok_xusro_03_desc$"
 building_ctesiphon_the_shadowed_pheonix_veh_antiok_xusro_05: "Вех Антиок"
 building_ctesiphon_the_shadowed_pheonix_veh_antiok_xusro_05_desc: "Исключение упоминания Хосрова из названия кажется мелочным, но давайте будем честными, само название изначально было мелочным."

 building_type_ctesiphon_the_shadowed_pheonix_dastagerd_01: "Дастагирд"
 building_type_ctesiphon_the_shadowed_pheonix_dastagerd_01_desc: "Царская резиденция Сасанидов с собственным двором и крепостью была важной частью политической власти Ктесифона."
 building_ctesiphon_the_shadowed_pheonix_dastagerd_01: "Византийские шрамы"
 building_ctesiphon_the_shadowed_pheonix_dastagerd_01_desc: "В 628 году Дастагирд был разграблен византийским императором Ираклием. После этого о городе ничего не было слышно. Пришло время восстановить то, что разрушили римляне."
 building_ctesiphon_the_shadowed_pheonix_dastagerd_02: "Пережить Ираклия"
 building_ctesiphon_the_shadowed_pheonix_dastagerd_02_desc: "$building_ctesiphon_the_shadowed_pheonix_dastagerd_01_desc$"
 building_ctesiphon_the_shadowed_pheonix_dastagerd_03: "Старая Артемита"
 building_ctesiphon_the_shadowed_pheonix_dastagerd_03_desc: "Когда-то здесь стоял древний город, он был перекрёстком между греческим и парфянским миром. Он мог бы снова стать таким центром."
 building_ctesiphon_the_shadowed_pheonix_dastagerd_04: "Обновление двух старых городов"
 building_ctesiphon_the_shadowed_pheonix_dastagerd_04_desc: "$building_ctesiphon_the_shadowed_pheonix_dastagerd_03_desc$"
 building_ctesiphon_the_shadowed_pheonix_dastagerd_05: "Дастагирд"
 building_ctesiphon_the_shadowed_pheonix_dastagerd_05_desc: "Пока вы любуетесь из окна Тигром, Дастагирд вновь становится политическим и дипломатическим центром восстановленного Ктесифона."

 building_type_ctesiphon_the_shadowed_pheonix_valashabad_01: "Валашабад"
 building_type_ctesiphon_the_shadowed_pheonix_valashabad_01_desc: "Пригород Ктесифона, этот город стал свидетелем решающей битвы при падении Сасанидов. Его восстановление пошлёт мощный сигнал."
 building_ctesiphon_the_shadowed_pheonix_valashabad_01: "Наследие Парфии"
 building_ctesiphon_the_shadowed_pheonix_valashabad_01_desc: "Валашабад был основан парфянским царем Вологезом I до его захвата Сасанидами. Эта давняя традиция персидской культуры будет и дальше поддерживаться под вашим присмотром."
 building_ctesiphon_the_shadowed_pheonix_valashabad_02: "Парфянский и сасанидский"
 building_ctesiphon_the_shadowed_pheonix_valashabad_02_desc: "$building_ctesiphon_the_shadowed_pheonix_valashabad_01_desc$"
 building_ctesiphon_the_shadowed_pheonix_valashabad_03: "Мертвецы Шабата"
 building_ctesiphon_the_shadowed_pheonix_valashabad_03_desc: "Здесь произошла решающая битва между арабами и персами. Завеса тонка, поскольку вы подозреваете, что давно умершие солдаты всё ещё сражаются в загробной жизни."
 building_ctesiphon_the_shadowed_pheonix_valashabad_04: "Преисподняя Шабата"
 building_ctesiphon_the_shadowed_pheonix_valashabad_04_desc: "$building_ctesiphon_the_shadowed_pheonix_valashabad_03_desc$"
 building_ctesiphon_the_shadowed_pheonix_valashabad_05: "Валашабад"
 building_ctesiphon_the_shadowed_pheonix_valashabad_05_desc: "Этот восстановленный город всё ещё кажется непосвящённым кощунственным. Однако те, кто понимает мёртвых, знают: [UmbraGlossary('shadowlands')] нигде не бывает так близок, как здесь."

 building_type_ctesiphon_the_shadowed_pheonix_grandest_blasphemy_shrine: "Тифонический Ктесифон"
 building_type_ctesiphon_the_shadowed_pheonix_grandest_blasphemy_shrine_desc: "Хотя Египет никогда не владел этим регионом, его расширение во время Нового царства привело с собой некоторых смелых сетитов. Кажется, городу всегда была предназначена слава Сета."
 building_ctesiphon_the_shadowed_pheonix_grandest_blasphemy_shrine: "Тифонический Ктесифон"
 building_ctesiphon_the_shadowed_pheonix_grandest_blasphemy_shrine_desc: "$building_type_ctesiphon_the_shadowed_pheonix_grandest_blasphemy_shrine_desc$"

 building_type_ctesiphon_the_shadowed_pheonix_first_holdouts_of_the_cult: "До Еноха"
 building_type_ctesiphon_the_shadowed_pheonix_first_holdouts_of_the_cult_desc: "Тал’махе’Ра древнее самого города. Но эта организация помнит о своих корнях в этом регионе и размышляет о будущем."
 building_ctesiphon_the_shadowed_pheonix_first_holdouts_of_the_cult: "До Еноха"
 building_ctesiphon_the_shadowed_pheonix_first_holdouts_of_the_cult_desc: "$building_type_ctesiphon_the_shadowed_pheonix_first_holdouts_of_the_cult_desc$"

 building_type_ctesiphon_the_shadowed_pheonix_newest_pyramid: "Пирамидальный вкус дома"
 building_type_ctesiphon_the_shadowed_pheonix_newest_pyramid_desc: "Никогда ещё Древний Египет не заходил так далеко, даже в период своего расцвета, до сих пор. Вы должны быть уверены, что никто никогда этого не забудет."
 building_ctesiphon_the_shadowed_pheonix_newest_pyramid: "Пирамидальный вкус дома"
 building_ctesiphon_the_shadowed_pheonix_newest_pyramid_desc: "$building_type_ctesiphon_the_shadowed_pheonix_newest_pyramid_desc$"

 building_type_ctesiphon_the_shadowed_pheonix_the_suns_birth: "Место рождения Солнца"
 building_type_ctesiphon_the_shadowed_pheonix_the_suns_birth_desc: "Здесь родилось само солнце, и теперь это место снова в руках верующих. Предательство египетских соблазнительниц и завоевание римских стервятников на этот раз нас не сломят."
 building_ctesiphon_the_shadowed_pheonix_the_suns_birth: "Место рождения Солнца"
 building_ctesiphon_the_shadowed_pheonix_the_suns_birth_desc: "$building_type_ctesiphon_the_shadowed_pheonix_the_suns_birth_desc$"

 building_type_ctesiphon_the_shadowed_pheonix_sacred_flame: "Священное пламя"
 building_type_ctesiphon_the_shadowed_pheonix_sacred_flame_desc: "Священное пламя Ахура Мазды вновь озаряет его город. Возможно, вскоре оно осветит и весь мир."
 building_ctesiphon_the_shadowed_pheonix_sacred_flame: "Священное пламя"
 building_ctesiphon_the_shadowed_pheonix_sacred_flame_desc: "$building_type_ctesiphon_the_shadowed_pheonix_sacred_flame_desc$"

 building_type_ctesiphon_the_shadowed_pheonix_temple_of_osiris: "Храм Осириса"
 building_type_ctesiphon_the_shadowed_pheonix_temple_of_osiris_desc: "[UmbraGlossary('shadowlands')] здесь близок. Если Осирис будет наблюдать за нами из Аменти, это будет идеальное место для создания новое средоточие силы для его использования."
 building_ctesiphon_the_shadowed_pheonix_temple_of_osiris: "Храм Осириса"
 building_ctesiphon_the_shadowed_pheonix_temple_of_osiris_desc: "$building_type_ctesiphon_the_shadowed_pheonix_temple_of_osiris_desc$"

 #building_type_ctesiphon_the_shadowed_pheonix_second_alamut: "Alamut's Outpost"
 #building_type_ctesiphon_the_shadowed_pheonix_second_alamut_desc: "Not as storied as the clan's true headquarters, but the perfect place for an outpost to protect Persia and launch attacks outside of the Children of Haqim's domain."
 #building_ctesiphon_the_shadowed_pheonix_second_alamut: "Alamut's Outpost"
 #building_ctesiphon_the_shadowed_pheonix_second_alamut_desc: "$building_type_ctesiphon_the_shadowed_pheonix_second_alamut_desc$"

 building_type_ctesiphon_the_shadowed_pheonix_temple_to_jupiter: "Храм Олимпа"
 building_type_ctesiphon_the_shadowed_pheonix_temple_to_jupiter_desc: "Храм старых богов из времён до Креста и Полумесяца, когда вы открыто правили и делили мир со своими собратьями-бессмертными."
 building_ctesiphon_the_shadowed_pheonix_temple_to_jupiter: "Храм Олимпа"
 building_ctesiphon_the_shadowed_pheonix_temple_to_jupiter_desc: "$building_type_ctesiphon_the_shadowed_pheonix_temple_to_jupiter_desc$"

 #############################
 ###### Rebuilt baghdad ######
 #############################

 building_type_baghdad_rebuilt_baghdad_01: "Восстановленный Багдад"
 building_type_baghdad_rebuilt_baghdad_01_desc: "$building_baghdad_rebuilt_baghdad_01_desc$"
 building_baghdad_rebuilt_baghdad_01: "Багдад: Деревня"
 building_baghdad_rebuilt_baghdad_01_desc: "Ветер качает ветки. Туманы исчезли, теперь мы молимся о чистом небе."
 building_baghdad_rebuilt_baghdad_02: "Багдад: Город"
 building_baghdad_rebuilt_baghdad_02_desc: "На этом месте стоит вечность. Ни бури, ни человек не смогут положить этому конец."
 building_baghdad_rebuilt_baghdad_03: "Багдад: Мегаполис"
 building_baghdad_rebuilt_baghdad_03_desc: "На Багдад обрушились небеса. Теперь, восстановленный, он жаждет жить."

 building_type_baghdad_city_of_a_thousand_mosques_01: "Город тысячи мечетей"
 building_type_baghdad_city_of_a_thousand_mosques_01_desc: "$building_baghdad_city_of_a_thousand_mosques_01_desc$"
 building_baghdad_city_of_a_thousand_mosques_01: "Город одной мечети"
 building_baghdad_city_of_a_thousand_mosques_01_desc: "Один раз пал, дважды возвысился. Небеса манят. Можем ли мы быть достойными?"
 building_baghdad_city_of_a_thousand_mosques_02: "Город дюжины мечетей"
 building_baghdad_city_of_a_thousand_mosques_02_desc: "Это Око мира. Молитва всегда идёт вверх. Там нет ничего."
 building_baghdad_city_of_a_thousand_mosques_03: "Город тысячи мечетей"
 building_baghdad_city_of_a_thousand_mosques_03_desc: "Пришло бедствие. Мы выстояли. Поднимемся достаточно высоко."

 building_type_baghdad_center_of_the_world_learning_01: "Центр мирового обучения"
 building_type_baghdad_center_of_the_world_learning_01_desc: "$building_baghdad_center_of_the_world_learning_01_desc$"
 building_baghdad_center_of_the_world_learning_01: "Неграмотный Багдад"
 building_baghdad_center_of_the_world_learning_01_desc: "Чёрный и красный потускнели вместе. Вновь испробуем своё ремесло. Вспомним."
 building_baghdad_center_of_the_world_learning_02: "Мудрый Багдад"
 building_baghdad_center_of_the_world_learning_02_desc: "Память. Только в записях мы можем сохранить жизнь. Так будет всегда."
 building_baghdad_center_of_the_world_learning_03: "Центр мирового обучения"
 building_baghdad_center_of_the_world_learning_03_desc: "Можем ли мы забыть ужас? Нет, его нельзя забыть. Ведь в нашем бедствии слова вновь обрели крылья."

 building_type_baghdad_oldest_city_01: "Старейший город"
 building_type_baghdad_oldest_city_01_desc: "$building_baghdad_oldest_city_01_desc$"
 building_baghdad_oldest_city_01: "Забытые руины"
 building_baghdad_oldest_city_01_desc: "И всё же призрачные земли Вавилона наблюдают. На его камнях мы построим новый город."
 building_baghdad_oldest_city_02: "Город, возвращённый памяти"
 building_baghdad_oldest_city_02_desc: "На берегах Евфрата стоял Вавилон. Гордыня привела его к гибели — и эта гибель придаёт Багдаду смелости."
 building_baghdad_oldest_city_03: "Вечное наследие"
 building_baghdad_oldest_city_03_desc: "Мы не могли исправить то, что сделала гордыня. В служении искупление отмечает наши шаги."

 building_type_baghdad_heart_of_trade_01: "Сердце торговли"
 building_type_baghdad_heart_of_trade_01_desc: "$building_baghdad_heart_of_trade_01_desc$"
 building_baghdad_heart_of_trade_01: "Шумные рынки"
 building_baghdad_heart_of_trade_01_desc: "Под тяжестью солнца вновь бьётся золотая река."
 building_baghdad_heart_of_trade_02: "Центр торговли"
 building_baghdad_heart_of_trade_02_desc: "Взгляните и изумитесь! Здесь сходятся все пути, на перекрёстке мироздания."
 building_baghdad_heart_of_trade_03: "Сердце торговли"
 building_baghdad_heart_of_trade_03_desc: "Бешеные вены, вечное сердце. Багдад – это сердце."

 POD_baghdad_sacked_rebuilt_modifier: "Возрождение из пепла"
 POD_baghdad_complacency_modifier: "Великолепное самодовольство"
 POD_baghdad_complacency_modifier_desc: "Багдад, центр мира, уже идеален. Больше ничего делать не нужно.\n\n#R Однако некоторые предсказатели прогнозируют радикальные изменения, которые произойдут в 1258 году...#!\n\n"
 POD_baghdad_looted_1_modifier: "Сожжённый дотла"
 POD_baghdad_looted_1_modifier_desc: "Смертные понесли огромные потери, и их городу потребуется много лет, чтобы восстановиться.\n#help Все раны рано или поздно заживут...#!"
 POD_baghdad_looted_2_modifier: "Затянувшаяся смерть"
 POD_baghdad_looted_2_modifier_desc: "Большую часть завалов уже убрали, но запах смерти всё ещё пропитывает воздух."
 POD_baghdad_looted_3_modifier: "Заживающие шрамы"
 POD_baghdad_looted_3_modifier_desc: "Посевы были пересеяны. Дома восстановлены. Жители Багдада усердно работают над залечиванием последних ран своего некогда великого города."

 #############################
 ##### Hollr Bjarkarey #######
 #############################

 building_type_bjarkarey_hollr_01: "Холльр Бьяркарей"
 building_type_bjarkarey_hollr_01_desc: "#F Снег становится красным в честь асов. Тень Всеотца всё ещё задерживается здесь, бросая вызов Кресту.#!"
 building_bjarkarey_hollr_01: "Отриггр Бьяркарей"
 building_bjarkarey_hollr_01_desc: "Мир труден, великое блудство, век топора, век меча, щиты будут расколоты, век ветра, век волка, прежде чем мир утонет."
 building_bjarkarey_hollr_02: "Трюгг Бьяркарей"
 building_bjarkarey_hollr_02_desc: "Умирает скот, умирают родичи, и поэтому человек умирает сам. Единственное, что никогда не умирает, — слава о поступках мертвеца."
 building_bjarkarey_hollr_03: "Каппсамр Бьяркарей"
 building_bjarkarey_hollr_03_desc: "Солнце чернеет, земля погружается в море, с неба падают яркие звезды. Пламя опаляет листья Иггдрасиля, огромный костёр достигает самых высоких облаков."

 building_type_bjarkarey_leynikirkja_01: "Лейникиркья"
 building_type_bjarkarey_leynikirkja_01_desc: "#F Некоторые каиниты до сих пор презирают асов и придерживаются своих еретических убеждений, восхваляя не Всеотца, а Первого убийцу.#!"
 building_bjarkarey_leynikirkja_01: "Дулинн Лейникиркья"
 building_bjarkarey_leynikirkja_01_desc: "Еретики собираются в темноте, пряча свои лица от гнева асов."
 building_bjarkarey_leynikirkja_02: "Ундирокадр Лейникиркья"
 building_bjarkarey_leynikirkja_02_desc: "Их пристанища сожжены, имена прокляты скальдами, а неверующие всё ещё упорно цепляются за свою веру."
 building_bjarkarey_leynikirkja_03: "Мулинн Лейникиркья"
 building_bjarkarey_leynikirkja_03_desc: "Кровь еретиков пролита на снегу, а их потайные залы разрушены. Лишь немногие сломленные остаются, взывая к богу, который не отвечает."
 building_bjarkarey_leynikirkja_04: "Умскипадр Лейникиркья"
 building_bjarkarey_leynikirkja_04_desc: "Все лжесвященники были преданы кровавому орлу. Их скрытые алтари теперь открыты для истинных богов холодного севера."
 POD_bjarkarey_leynikirkja_bonus: "К вашему [Concept('court', 'двору')|E] присоединятся три могущественных #TOOLTIP:GAME_TRAIT,gangrel,[GetPlayer] #L гангрела#!#!"

 building_type_bjarkarey_throndarnes_01: "Трондарнес"
 building_type_bjarkarey_throndarnes_01_desc: "#F Сердце христианского мира на Бьяркарее, церковь всегда полна смертных, молящихся своему южному богу.#!"
 building_bjarkarey_throndarnes_01: "Миннкадр Трондарнес"
 building_bjarkarey_throndarnes_01_desc: "Колокола всё ещё звонят во славу Белого Христа, но паства становится всё меньше."
 building_bjarkarey_throndarnes_02: "Скуггвадр Трондарнес"
 building_bjarkarey_throndarnes_02_desc: "Голос священника дрожит, когда начинают звучать молитвы Всеотцу."
 building_bjarkarey_throndarnes_03: "Холр Трондарнес"
 building_bjarkarey_throndarnes_03_desc: "Церковь осквернена, крест перевёрнут, а вороны лакомятся плотью принесённых в жертву священников."
 building_bjarkarey_throndarnes_04: "Умбрейт Трондарнес"
 building_bjarkarey_throndarnes_04_desc: "Христос забыт и похоронен в снегу рядом со своим храмом. Открытая площадка для ритуальных блотов запятнала некогда святое место."
 POD_bjarkarey_throndarnes_bonus: "Будет получено [Concept('trait', 'свойство')|E] «[GetTrait('reaver').GetName(GetPlayer)]»\nДоступны [Concept('men_at_arms', 'профессионалы')|E] - [GetMaA('blood_thralls_maa').GetName]"

 building_type_bjarkarey_drekafloti_01: "Дрекафлоти"
 building_type_bjarkarey_drekafloti_01_desc: "#F На берегу, рядом с хрупкими рыбацкими лодками, стоит флот чёрных кораблей с красными парусами. С этого берега ведомые жаждой крови и золота эйнхерии отправились в мир.#!"
 building_bjarkarey_drekafloti_01: "Свефнди Дрекафлоти"
 building_bjarkarey_drekafloti_01_desc: "Корабли стоят на берегу рядом с работающими рыбаками, смертные боятся ночей, когда они распускают свои багровые паруса."
 building_bjarkarey_drekafloti_02: "Брюггюр Херья"
 building_bjarkarey_drekafloti_02_desc: "Готовится всё больше и больше лодок, поскольку скромных рыбаков оттесняют в сторону. Экипаж беспокойно сидит, ожидая ночи, когда они наконец покинут тихий берег."
 building_bjarkarey_drekafloti_03: "Ульфрескр Берсеркир"
 building_bjarkarey_drekafloti_03_desc: "Берсерки сидят наготове на могучих кораблях, а багровые паруса развёрнуты, закрывая ночное небо. Армада готова пронестись по южным побережьям и разграбить всё на своём пути."
 building_bjarkarey_drekafloti_04: "Рагнафлоти"
 building_bjarkarey_drekafloti_04_desc: "Море почернело под тёмными корпусами кровавого флота. Когда эти бесспорные хозяева моря приближаются к чужому берегу, и на горизонте становятся видны их багровые паруса, местные молят о пощаде."

 building_type_bjarkarey_blodga_langhus_01: "Блодга Лангус"
 building_type_bjarkarey_blodga_langhus_01_desc: "#F На холме, где когда-то стоял этот высокий зал, раньше стояла причудливая церковь. Теперь бессмертный правитель Бьяркарея бросает на него длинную тень.#!"
 building_bjarkarey_blodga_langhus_01: "Аска-Салир"
 building_bjarkarey_blodga_langhus_01_desc: "Камни часовни были снесены, чтобы построить на холме мрачный и жестокий зал."
 building_bjarkarey_blodga_langhus_02: "Сталсалир"
 building_bjarkarey_blodga_langhus_02_desc: "Стены украшают мечи и щиты павших врагов эйнхерий. Встревоженные смертные отводят взгляды, чтобы не навлечь на себя гнев одного из своих тёмных повелителей."
 building_bjarkarey_blodga_langhus_03: "Херхёфдингья Сэти"
 building_bjarkarey_blodga_langhus_03_desc: "Тёмные деревянные стены всегда кажутся окрашенными в свежий алый цвет. Грозные воины с комфортом сидят внутри, смеются, хвастаются и сражаются в своё удовольствие."
 building_bjarkarey_blodga_langhus_04: "Эйлифар Халлар"
 building_bjarkarey_blodga_langhus_04_desc: "Пропитанный кровью длинный дом — несокрушимая крепость на холме. Хирдманы пьют до дна, пока кровавые трэллы прислуживают. В этих стенах правление Всеотца абсолютно."

 building_type_bjarkarey_frjalsir_menn_01: "Фрьялсир Менн"
 building_type_bjarkarey_frjalsir_menn_01_desc: "#F Местные жители трудятся на фермах и на побережье, надеясь умилостивить своих повелителей и не навлечь на себя их гнев.#!"
 building_bjarkarey_frjalsir_menn_01: "Сьялфрадр Менн"
 building_bjarkarey_frjalsir_menn_01_desc: "Жители этих земель работают на себя, пренебрегая подношениями вам и асам."
 building_bjarkarey_frjalsir_menn_02: "Скилдумадр Менн"
 building_bjarkarey_frjalsir_menn_02_desc: "Люди посвятили себя усердной работе на благо своих тёмных повелителей."
 building_bjarkarey_frjalsir_menn_03: "Траустр Менн"
 building_bjarkarey_frjalsir_menn_03_desc: "Бьяркарей растёт, и вместе с ним растёт преданность людей вам, Всеотцу, и своему дому."
 building_bjarkarey_frjalsir_menn_04: "Каппсамр Менн"
 building_bjarkarey_frjalsir_menn_04_desc: "Граждане Бьяркарея теперь полностью преданы своим хозяевам. Ничто не помешает их долгу."
 bjarkarey_frjalsir_menn_bonus: "Будут разблокированы [Concept('court_positions', 'придворные должности')|E] «[GetCourtPositionType('kertilsveinr_court_position').GetName()]» и «[GetCourtPositionType('skutilsveinr_court_position').GetName()]»."

 building_type_bjarkarey_blothaugr_01: "Блотаугр"
 building_type_bjarkarey_blothaugr_01_desc: "#F На уединённом холме находится кровавое место жертвоприношения, руны и камни покрывают всю территорию. Здесь часто проводятся блоты в честь асов.#!"
 building_bjarkarey_blothaugr_01: "Литилль Блотаугр"
 building_bjarkarey_blothaugr_01_desc: "Место жертвоприношения представляет собой лишь небольшой круг, покрытый рунами и камнем."
 building_bjarkarey_blothaugr_02: "Вакса Блотаугр"
 building_bjarkarey_blothaugr_02_desc: "Жертвенный курган разросся, и число верующих, участвующих в блотах, увеличивается каждую ночь."
 building_bjarkarey_blothaugr_03: "Сторр Блотаугр"
 building_bjarkarey_blothaugr_03_desc: "Сейчас место жертвоприношения занимает обширную территорию. Холмы покраснели от крови, поднесённой Одину."
 building_bjarkarey_blothaugr_04: "Оенданлигр Блотаугр"
 building_bjarkarey_blothaugr_04_desc: "Весь Бьяркарей теперь участвует в великих блотах. Бесчисленное множество верующих, как смертных, так и бессмертных, приходят в эти холмы, чтобы умилостивить асов."

 building_type_bjarkarey_solarhvelfing_01: "Солархвелфинг"
 building_type_bjarkarey_solarhvelfing_01_desc: "#F Под длинным домом на холме находится обширная территория, где хирдманы могут отдохнуть в безопасности от палящих лучей солнца.#!"
 building_bjarkarey_solarhvelfing_01: "Берр Солархвелфинг"
 building_bjarkarey_solarhvelfing_01_desc: "Солнечные хранилища остаются спартанской территорией под длинным домом, пригодной только для уединения и не более того."
 building_bjarkarey_solarhvelfing_02: "Приддр Солархвелфинг"
 building_bjarkarey_solarhvelfing_02_desc: "Теперь стены хранилищ украшены десятками трофеев, что является свидетельством силы верующих, живущих в них."
 building_bjarkarey_solarhvelfing_03: "Бринкледдр Солархвелфинг"
 building_bjarkarey_solarhvelfing_03_desc: "Солнечные хранилища, и без того грозные места, были дополнительно улучшены, чтобы защитить воинов внутри. Теперь ничто их не сломает."
 building_bjarkarey_solarhvelfing_04: "Сторр Солархвелфинг"
 building_bjarkarey_solarhvelfing_04_desc: "Солнечные хранилища — это не просто подземное убежище, а величественный памятник силе и настойчивости всех эйнхерий."

 building_type_bjarkarey_myrkvidir_01: "Мирквидир"
 building_type_bjarkarey_myrkvidir_01_desc: "#F Опасные заросшие леса, окружающие Бьяркарей, служат естественной линией обороны города. Бесчисленное количество людей исчезло в его глубинах, и их больше никогда не видели.#!"
 building_bjarkarey_myrkvidir_01: "Ифирваксинн Мирквидир"
 building_bjarkarey_myrkvidir_01_desc: "Лес остаётся опасным и пугающим местом даже для местных жителей. Никто не входит в него добровольно. Мало кто когда-либо возвращается."
 building_bjarkarey_myrkvidir_02: "Вильтр Мирквидир"
 building_bjarkarey_myrkvidir_02_desc: "В диких лесах было наведено подобие порядка благодаря многочисленным трудягам и охотникам, посвятившим себя обеспечению безопасности окраин Бьяркарея."
 building_bjarkarey_myrkvidir_03: "Радр Мирквидир"
 building_bjarkarey_myrkvidir_03_desc: "Лесные деревья способствуют развитию торговли в Бьяркарее, в то время как дикая природа и охотники держат её под контролем."
 building_bjarkarey_myrkvidir_04: "Бундинн Мирквидир"
 building_bjarkarey_myrkvidir_04_desc: "Дикие животные теперь защищают леса Бьяркарея от любых внешних угроз, а обширные леса снабжают людей богатым материалом."

 building_type_bjarkarey_gullveigr_lundi_01: "Гуллвейгр Лунди"
 building_type_bjarkarey_gullveigr_lundi_01_desc: "#F Священная роща, по слухам, это место, где Гулльвейг была пронзена копьём асов, трижды сожжена и трижды возродилась.#!"
 building_bjarkarey_gullveigr_lundi_01: "Аскр Лунди"
 building_bjarkarey_gullveigr_lundi_01_desc: "Для большинства эта роща — просто нервирующий участок леса. Однако для приверженцев старых обычаев это святое место, почва которого всё ещё сохраняет силу."
 building_bjarkarey_gullveigr_lundi_02: "Эльдсглодр Лунди"
 building_bjarkarey_gullveigr_lundi_02_desc: "Удушливый запах пепла наполняет воздух, а древесные соки приобретают цвет чистого золота. Ведьмы и колдуны стекаются в эту рощу, чтобы прикоснуться к древней силе."
 building_bjarkarey_gullveigr_lundi_03: "Бреннанди Лунди"
 building_bjarkarey_gullveigr_lundi_03_desc: "Память о сожжении и возрождении Гулльвейг теперь запечатлена в самых корнях земли. Даже смертные чувствуют силу этого."
 building_bjarkarey_gullveigr_lundi_04: "Логанди Лунди"
 building_bjarkarey_gullveigr_lundi_04_desc: "Роща превратилась в прекрасное и жуткое место, плюющее в лицо Белому Христу. Неестественный пепел наполняет воздух, а роща краснеет от свежей витэ."
 POD_bjarkarey_gullveigr_lundi_rune_wise: "Будет получено [Concept('trait', 'свойство')|E] «[GetTrait('rune_wise').GetName(GetNullCharacter)]», разблокирующее скандинавские рунные пути #TOOLTIP:GAME_TRAIT,sorcerer,[GetNullCharacter] #L чародейства#!#!."

 building_type_bjarkarey_ulfahus_01: "Ульфахус"
 building_type_bjarkarey_ulfahus_01_desc: "#F Диких волков и гончих Бьяркарея держат в клетках, ожидая, когда их выпустят на любого, кто достаточно глуп, чтобы напасть на них.#!"
 building_bjarkarey_ulfahus_01: "Вильр Ульфахус"
 building_bjarkarey_ulfahus_01_desc: "В грубом домике глубоко в лесу обитают необыкновенно сильные и жестокие звери Бьяркарея. Смертные обычно избегают их, но, когда это необходимо, животные выступают в роли грозных защитников города."
 building_bjarkarey_ulfahus_02: "Градигр Ульфахус"
 building_bjarkarey_ulfahus_02_desc: "Домик был расширен, чтобы вместить больше животных, а зал теперь украшен массивными шкурами ужасных зверей. Их вой, слышимый за многие мили, служит эффективным предупреждением для посторонних."
 building_bjarkarey_ulfahus_03: "Блодугр Ульфахус"
 building_bjarkarey_ulfahus_03_desc: "То, что раньше было простой хижиной с клетками, превратилось в устрашающую цитадель для главных ночных хищников. Половицы теперь, кажется, навсегда пропитаны кровью."
 building_bjarkarey_ulfahus_04: "Фенрир Ульфахус"
 building_bjarkarey_ulfahus_04_desc: "Это обширное логово зверей теперь может соперничать с огромными залами для медовых пиров прошлого. Жители Бьяркарея утверждают, что за обитающими в нем существами наблюдает сам Фенрир."

 ###################################
 ##### Hvítakristr Bjarkarey #######
 ###################################


 building_type_bjarkarey_hvitakristr_01: "Хвитакристр Бьяркарей"
 building_type_bjarkarey_hvitakristr_01_desc: "#F Снег становится красным от подношений Богу. Крест сокрушил последние, упрямые остатки старых обычаев.#!"
 building_bjarkarey_hvitakristr_01: "Покорённый Бьяркарей"
 building_bjarkarey_hvitakristr_01_desc: "Не думайте, что я пришёл принести мир на землю: не мир пришёл я принести, но меч. - Матфей 10:34"
 building_bjarkarey_hvitakristr_02: "Истязанный Бьяркарей"
 building_bjarkarey_hvitakristr_02_desc: "И жертвенники их разрушьте, и столбы их сокрушите, и рощи их сожгите огнём; и срубите истуканы богов их... - Второзаконие 12:3"
 building_bjarkarey_hvitakristr_03: "Освящённый Бьяркарей"
 building_bjarkarey_hvitakristr_03_desc: "Убитые их будут выброшены, и смрад их выйдет из трупов их, и горы расплавятся от крови их. - Исайя 34:3"

 building_type_bjarkarey_cathedral_god_01: "Собор Божий"
 building_type_bjarkarey_cathedral_god_01_desc: "#F Трондарнес возвышается как бастион христианского мира на этой холодной и чужой земле.#!"
 building_bjarkarey_cathedral_god_01: "Часовня Христа"
 building_bjarkarey_cathedral_god_01_desc: "Здесь, в этой скромной церкви, верующие собираются, чтобы отогнать лютый холод и чудовищ во тьме, молясь Господу о защите.\n«И свет сияет во тьме, и тьма не объяла его». - Иоанна 1:5"
 building_bjarkarey_cathedral_god_02: "Святилище верующих"
 building_bjarkarey_cathedral_god_02_desc: "По мере того как укрепляется вера паствы, крепнет и церковь. Дерево уступило место крепкому камню, и люди дышат легче внутри этих стен.\n«И Я говорю тебе: что ты — Пётр, и на этом камне Я построю Церковь Мою, и врата ада не одолеют её». - Матфей 16:18"
 building_bjarkarey_cathedral_god_03: "Растущий собор"
 building_bjarkarey_cathedral_god_03_desc: "Звонят колокола, шпили устремляются к небу, а языческие верования рассеиваются. Трондарнес является сильным доказательством того, что сияющий свет Господа достигает даже этих холодных земель.\n«Я построил тебе дом для проживания, устойчивое место, где ты сможешь жить вечно». - Три царства 8:13"
 building_bjarkarey_cathedral_god_04: "Свет Божий"
 building_bjarkarey_cathedral_god_04_desc: "Трондарнес стал маяком веры на краю света. Белый Христос прогнал тьму из этих земель, и люди возрадуются.\n«И услышал я громкий голос с неба, говорящий: вот, скиния Божия с человеками, и Он будет обитать с ними...» - Откровение 21:3"
 POD_bjarkarey_cathedral_pilgrimage_bonus_desc: "Затраты на проведение [Concept('activity', 'занятия')|E] «[GetActivityType('activity_pilgrimage').GetName]»: #P -50%#!"
 POD_bjarkarey_cathedral_pilgrimage_bonus_activity: "[hollr_bjarkarey|E]"

 building_type_bjarkarey_cathedral_caine_01: "Собор Каина"
 building_type_bjarkarey_cathedral_caine_01_desc: "#F Когда-то Трондарнес был убежищем для христиан, теперь служит для поклонения более тёмному богу.#!"
 building_bjarkarey_cathedral_caine_01: "Часовня Тёмного отца"
 building_bjarkarey_cathedral_caine_01_desc: "Эта скромная церковь действует как одинокий маяк надежды для почитателей Тёмного отца.\n«И Господь поставил Каину знак, чтобы никто, встретив его, не убил его». - Бытие 4:15"
 building_bjarkarey_cathedral_caine_02: "Тёмное святилище"
 building_bjarkarey_cathedral_caine_02_desc: "Церковь укрепляется по мере роста влияния ереси. Свет Божий избегается в этом святом месте, поскольку всё поклонение вместо этого обращено к Каину.\n«Кто ест Мою плоть и пьёт Мою кровь, имеет жизнь вечную, и Я воскрешу его в последний день». — Иоанна 6:54"
 building_bjarkarey_cathedral_caine_03: "Укоренённый собор"
 building_bjarkarey_cathedral_caine_03_desc: "В насмешке над Богом тёмные искривленные шпили устремляются к небу, а каждую ночь звонят предвещающие колокола, давая людям понять, что их бессмертные пастыри бодрствуют и голодны.\n«И почти всё по закону очищается кровью, и без пролития крови не бывает прощения». - Послание евреям 9:22"
 building_bjarkarey_cathedral_caine_04: "Ярость Первого убийцы"
 building_bjarkarey_cathedral_caine_04_desc: "Каинитская ересь теперь обрела новый оплот в этой церкви из почерневшего стекла и камня. Её великая тень покрывает весь Бьяркарей, возвещая великую победу еретиков.\n«Ибо душа тела в крови, и Я дал её вам для жертвенника, чтобы совершить искупление душ ваших...» - Левит 17:11"

 building_type_bjarkarey_knight_fortress_01: "Рыцарская крепость"
 building_type_bjarkarey_knight_fortress_01_desc: "#F То, что раньше было пропитанным кровью, грубым длинным домом, теперь превращено в оружейную для верных рыцарей Бога.#!"
 building_bjarkarey_knight_fortress_01: "Освящённый длинный дом"
 building_bjarkarey_knight_fortress_01_desc: "Старые деревянные стены, пропитанные кровью христиан, были очищены святой водой. Теперь он служит скромным форпостом и оружейным складом для первых христианских воинов, достаточно храбрых, чтобы удержать эту ледяную землю.\n«И что общего между храмом Божиим и идолами? Ибо вы храм Бога живого...» - 2 Коринфянам 6:16"
 building_bjarkarey_knight_fortress_02: "Ревностный гарнизон"
 building_bjarkarey_knight_fortress_02_desc: "Вокруг старого длинного дома возведены тяжёлые каменные стены, которые охраняют дисциплинированные рыцари, вооружённые благословенными мечами и щитами. Все варварские трофеи внутри зала заменены крестами.\n«Облекитесь во всеоружие Божие, чтобы вы могли стать против козней диавольских». - Ефесянам 6:11"
 building_bjarkarey_knight_fortress_03: "Дом северных крестоносцев"
 building_bjarkarey_knight_fortress_03_desc: "Длинный дом полностью переоборудован и превратился в грозную крепость веры и военной мощи. По залам бродят монахи, кузнецы и воины, работающие в унисон, чтобы создать силу, достаточно сильную, чтобы укротить эти земли.\n«Благословен Господь, сила моя, которая учит мои руки войне и мои пальцы сражаться». - Псалом 144:1"
 building_bjarkarey_knight_fortress_04: "Оружейная палата Бога"
 building_bjarkarey_knight_fortress_04_desc: "Теперь крепость представляет собой сияющий, неприступный арсенал защитников Белого Христа, где святые рыцари собирают свои силы, чтобы вести вечную войну с язычниками.\n«Ты мой боевой топор и оружие войны: ибо с тобою я разобью народы, и с тобою я разрушу королевства». - Иеремия 51:20"
 POD_bjarkarey_knight_fortress_bonus: "Три опытных воина клана [GetTrait('ventrue').GetName(GetPlayer)] присоединятся к вашему [Concept('court', 'двору')|E]."

 building_type_bjarkarey_hammer_god_01: "Молот Бога"
 building_type_bjarkarey_hammer_god_01_desc: "#F Флоты драконов, которые когда-то были могущественным флотом языческих скандинавов, теперь вместо этого служат для уничтожения врагов Бога.#!"
 building_bjarkarey_hammer_god_01: "Переоборудованные корабли"
 building_bjarkarey_hammer_god_01_desc: "Флоты драконов, которые когда-то вселяли страх в христианские берега, были распилены и заменены святым крестом.\n«Те, кто спускается в море на кораблях, делают дела в великих водах; Они видят дела Господа и чудеса Его в глубине». - Псалом 107:23-24"
 building_bjarkarey_hammer_god_02: "Благословенные паруса"
 building_bjarkarey_hammer_god_02_desc: "Могучие корабли, укомплектованные верными моряками и священниками, рассекают северные волны, чтобы нести божественное правосудие.\n«Так говорит Господь, прокладывающий путь в море и стезю в сильных водах». - Исайя 43:16"
 building_bjarkarey_hammer_god_03: "Армада Креста"
 building_bjarkarey_hammer_god_03_desc: "В Бьяркарее создан грозный флот, сделанный из благословенного дуба и железа.\n«Ты управляешь бушующим морем: когда поднимаются его волны, Ты успокаиваешь их». - Псалом 89:9"
 building_bjarkarey_hammer_god_04: "Божий гром"
 building_bjarkarey_hammer_god_04_desc: "Огромная, громоподобная армада Бога теперь контролирует северные моря. Грозные Флоты драконов возродились как Молот Божий, готовый сокрушить любого еретика и неверующего.\n«Десница Твоя, Господи, прославилась в силе: десница Твоя, Господи, сокрушила врага». - Исход 15:6"
 POD_bjarkarey_hammer_raid_bonus_desc: "Разблокирована возможность [Concept('raid', 'совершать набеги')|E]"

 building_type_bjarkarey_hammer_caine_01: "Молот Каина"
 building_type_bjarkarey_hammer_caine_01_desc: "#F Могущественная армада эйнхерий теперь несёт слово и ужас Тёмного отца.#!"
 building_bjarkarey_hammer_caine_01: "Крещёные кровью паруса"
 building_bjarkarey_hammer_caine_01_desc: "Захваченные корабли викингов были крещены в крови неверных. Эти тёмные корабли теперь служат Ереси.\n«И второй ангел вылил чашу свою на море, и она стала как кровь мертвеца: и всякая живая душа умерла в море». - Откровение 16:3"
 building_bjarkarey_hammer_caine_02: "Сокрытые флоты"
 building_bjarkarey_hammer_caine_02_desc: "Корабли, укомплектованные верными гулями и управляемые капитанами, связанными узами крови, являются ужасающе эффективным средством распространения дела еретиков.\n«Бушующие морские волны, пенящиеся в пене от собственного позора; блуждающие звезды, которым уготована чернота тьмы навеки». - Иуда 1:13"
 building_bjarkarey_hammer_caine_03: "Армада Тёмного отца"
 building_bjarkarey_hammer_caine_03_desc: "Эти корабли налётчиков теперь печально известны среди северных берегов своим ужасом, который они внушают. Тёмные знамёна трепещут на горьком ветру, в то время как воины-нежить, дремлющие внутри флота, терпеливо ждут, чтобы обрушить гнев Отца.\n«И второй ангел вострубил, и как бы великая гора, пылающая огнем, была брошена в море: и третья часть моря сделалась кровью...» - Откровение 8:8"
 building_bjarkarey_hammer_caine_04: "Ярость Каина"
 building_bjarkarey_hammer_caine_04_desc: "Армада превратилась в апокалиптическую, претендующую на господство над морями. Флотов драконов больше нет. Остался только Молот Каина и их желание утопить мир в крови.\n«Я положу руку его в море, и правую руку его в реки». - Псалом 89:25"

 building_type_bjarkarey_godfearing_subjects_01: "Богобоязненные подданные"
 building_type_bjarkarey_godfearing_subjects_01_desc: "#F Будучи когда-то языческими рабами жестоких хозяев, народ Бьяркарея по-прежнему сомневается в своих новых повелителях.#!"
 building_bjarkarey_godfearing_subjects_01: "Кающаяся паства"
 building_bjarkarey_godfearing_subjects_01_desc: "Потомки языческих рабов понимают, кто их новые хозяева. Хотя их понимание просто, эти новообращённые селяне уже с верой смотрят на Крест.\n«Итак, кто во Христе, тот новая тварь: древнее прошло, теперь всё новое». - 2 Коринфянам 5:17"
 building_bjarkarey_godfearing_subjects_02: "Благочестивые работники"
 building_bjarkarey_godfearing_subjects_02_desc: "Старые языческие суеверия были прочно искоренены, заменены жесткой и непоколебимой преданностью.\n«Страх Господень - начало мудрости: добрый разум имеют все, исполняющие заповеди Его...» - Псалом 111:10"
 building_bjarkarey_godfearing_subjects_03: "Истинно верующие"
 building_bjarkarey_godfearing_subjects_03_desc: "Вера стала основой этого сообщества. Объединённый в своем праведном рвении, народ Бьяркарея готов упорно трудиться и защищать своих хозяев.\n«В страхе Господнем - твёрдая уверенность, и дети Его будут иметь прибежище». - Притчи 14:26"
 building_bjarkarey_godfearing_subjects_04: "Ревностная длань Христа"
 building_bjarkarey_godfearing_subjects_04_desc: "Жители Бьяркарея превратились в отчаянно лояльных и набожных подданных.\n«Выслушаем вывод всего этого: бойся Бога и соблюдай Его заповеди: ибо в этом весь долг человека». - Экклезиаст 12:13"

 building_type_bjarkarey_terror_christ_01: "Ужас Христа"
 building_type_bjarkarey_terror_christ_01_desc: "#F Некогда спокойная городская площадь превратилась в жестокую и кровавую арену божественного возмездия.#!"
 building_bjarkarey_terror_christ_01: "Столб грешника"
 building_bjarkarey_terror_christ_01_desc: "На городской площади установлен простой деревянный столб, где воров и мелких грешников связывают и бьют плетью, чтобы они служили предостережением для других.\n«Приговоры уготованы для насмешников и удары для спины дураков». - Притчи 19:29"
 building_bjarkarey_terror_christ_02: "Поражение грешников"
 building_bjarkarey_terror_christ_02_desc: "Площадь была расширена и теперь здесь установлены виселицы и прочные столбы для порки. Крики грешников и неверных эхом разносятся по всему Бьяркарею, гарантируя, что праведная паства останется боязливой, послушной и не поддающейся искушению старыми языческими обычаями.\n«Тогда Я накажу их преступление розгой и их беззаконие ранами». - Псалом 89:32"
 building_bjarkarey_terror_christ_03: "Клетки покаяния"
 building_bjarkarey_terror_christ_03_desc: "Теперь площадь навсегда залита кровью и посвящена наказанию. Костры и жестокие казни представляют собой ужасающее, обязательное зрелище, которое очищает общество посредством явного ужаса.\n«И ныне и секира при корне дерев лежит: всякое дерево, не приносящее доброго плода, срубают и бросают в огонь». - Матфея 3:10"
 building_bjarkarey_terror_christ_04: "Праведный гнев Божий"
 building_bjarkarey_terror_christ_04_desc: "Городская площадь представляет собой памятник ужасающему божественному возмездию. Трупы висят в маленьких железных клетках, подвешенных в воздухе, а некоторые из живых среди них молят, чтобы смерть освободила их. Жители Бьяркарея теперь знают, что власть Господа абсолютна, и ни один грех не останется без ответа.\n«Страшно попасть в руки живого Бога». - Послание евреям 10:31"
 POD_terror_christ_bonus: "Разблокирован новый метод [Concept('execution', 'казни')|E]"

 building_type_bjarkarey_hall_judgment_01: "Зал правосудия"
 building_type_bjarkarey_hall_judgment_01_desc: "#F То, что когда-то было ратушей местных смертных, превратилось во внушительную резиденцию священного закона.#!"
 building_bjarkarey_hall_judgment_01: "Палата света"
 building_bjarkarey_hall_judgment_01_desc: "Скромная бревенчатая лачуга в центре города, где разрешаются споры и зачитываются королевские законы. Местные жители находят утешение в том, что закон сохраняется даже сейчас.\n«Господь познаётся по суду, который Он производит: нечестивый уловлен в сети в деле своих рук». - Псалом 9:16"
 building_bjarkarey_hall_judgment_02: "Трибунал веры"
 building_bjarkarey_hall_judgment_02_desc: "Строгие судьи, назначенные властью Церкви, взвешивают дела и преступления людей, наводя суровый, но необходимый порядок.\n«Праведным радость вершить суд, а делающим беззаконие — погибель». - Притчи 21:15"
 building_bjarkarey_hall_judgment_03: "Суд Божий"
 building_bjarkarey_hall_judgment_03_desc: "Небольшая ратуша превратилась в величественное здание суда. Тяжёлые знамена с мечом и крестом висят над сиденьем судьи, поскольку каждое постановление выносится в соответствии с законами человека и Бога.\n«Вот что вы должны делать: говорите каждый ближнему правду; исполняйте суд истины и мира у ворот ваших». - Захария 8:16"
 building_bjarkarey_hall_judgment_04: "Престол праведности"
 building_bjarkarey_hall_judgment_04_desc: "Под бдительным, немигающим оком резных ангелов судьи решают судьбы каждого мужчины и женщины в Бьяркарее.\n«Ибо всякое дело Господь приведёт на суд, и всё тайное, хорошо ли оно, или худо». - Экклезиаст 12:14"
 POD_bjarkarey_hall_judgment_bonus: "Будет получено [Concept('trait', 'свойство')|E] «[GetTrait('truefaith').GetName(GetPlayer)]»"

 building_type_bjarkarey_dark_libraries_01: "Тёмные библиотеки"
 building_type_bjarkarey_dark_libraries_01_desc: "#F Глубоко в секретных хранилищах сохранились запретные знания, еретические писания и оккультные знания, скрытые от ортодоксальной церкви.#!"
 building_bjarkarey_dark_libraries_01: "Скрытые архивы"
 building_bjarkarey_dark_libraries_01_desc: "Учёные Бьяркарея спрятали собрание запрещённых свитков и еретических текстов вдали от глаз ревностных ортодоксов.\n«И дам тебе сокровища тьмы и сокровища, сокрытые в тайных местах...» - Исайя 45:3"
 building_bjarkarey_dark_libraries_02: "Тайный скрипторий"
 building_bjarkarey_dark_libraries_02_desc: "Христианские писцы неустанно копируют запрещённые рукописи в своих попытках использовать оккультные знания для борьбы с язычниками.\n«И далее, сын мой, увещевайся: созданию множества книг нет конца; и долгое изучение — утомление плоти». - Экклезиаст 12:12"
 building_bjarkarey_dark_libraries_03: "Проклятые архивы"
 building_bjarkarey_dark_libraries_03_desc: "Маленькие хранилища превратились в огромный архив. Полки стонут под тяжестью богохульных текстов.\n«Эта мудрость нисходит не свыше, но земная, чувственная, дьявольская». - Иаков 3:15"
 building_bjarkarey_dark_libraries_04: "Лабиринт греха"
 building_bjarkarey_dark_libraries_04_desc: "Архивы теперь напоминают лабиринт с бесконечными запретными знаниями. Любой, кто достаточно смел, чтобы искать мудрости здесь, может найти больше, чем он рассчитывал.\n«Но я говорю вам... тем, кто не имеет этого учения и которые не познали глубины Сатаны, как они говорят; Я не возложу на вас никакого другого бремени». - Откровение 2:24"

 ###################################
 ######## Taema Bjarkarey ##########
 ###################################

 building_type_bjarkarey_taema_01: "Темья Бьяркарей"
 building_type_bjarkarey_taema_01_desc: "#F Зал Ульфа, спрятанный на окутанном туманом острове, доступном только для тех, кто разбирается в рунах, представляет собой дом огромного богатства, оставшийся со времён викингов. Сама деревня может быть маленькой и незначительной, всё ещё придерживающейся старых обычаев, но сам зал по-прежнему обладает огромным богатством и властью.#!"
 building_bjarkarey_taema_01: "Бьяркарей Ньёрда"
 building_bjarkarey_taema_01_desc: "Я знаю, что висел на ветреном дереве,\nВисел там девять полных ночей;\nПронзённый копьём, принесённый в жертву\nОдину, самому себе,\nНа дереве, о котором никто не знает,\nОткуда растут его корни."
 building_bjarkarey_taema_02: "Бьяркарей Ворона"
 building_bjarkarey_taema_02_desc: "Никто не дал мне ни хлеба, ни питья из рога,\nИ вниз я взглянул;\nЯ поднял руны, с воплем поднял их,\nИ тут же упал назад."
 building_bjarkarey_taema_03: "Бьяркарей Ульфа"
 building_bjarkarey_taema_03_desc: "Руны найдёшь ты и роковые знаки,\nКоторые раскрасил царь певцов,\nИ сотворили могучие боги;\nСильны эти знаки, могучи эти знаки,\nКоторые пишет владыка богов."

 building_type_bjarkarey_ulf_hall_01: "Зал Ульфа"
 building_type_bjarkarey_ulf_hall_01_desc: "#F На северной окраине Бьяркарея находится зал на туманном острове, где и простолюдины, и волшебники практикуют старые обычаи в безопасности от креста. Те, у кого нет дара зрения Одина, никогда не найдут эти залы, но самые мудрые могут стать свидетелями великолепия зала.#!"
 building_bjarkarey_ulf_hall_01: "Скрытый длинный дом"
 building_bjarkarey_ulf_hall_01_desc: "Залы выполнены из прочного дерева, скрытого суровой северной стихией. Они служат убежищем для тех, кто сторонится вторгающейся смертной Церкви."
 building_bjarkarey_ulf_hall_02: "Защищённое убежище"
 building_bjarkarey_ulf_hall_02_desc: "Деревянные колонны залов покрыты мистическими рунами, защищающими мудрецов от любопытных глаз посторонних."
 building_bjarkarey_ulf_hall_03: "Пепельные залы"
 building_bjarkarey_ulf_hall_03_desc: "Зал Ульфа остаётся великим оплотом языческой власти. Здесь истинные мастера старины спокойно практикуют своё ремесло."
 building_bjarkarey_ulf_hall_04: "Дом Ульфа"
 building_bjarkarey_ulf_hall_04_desc: "Легендарное святилище Ульфа Гримссона сохранилось в Бьяркарее во всей своей красе. Сами корни этого зала связаны со скандинавскими землями, и ничто не сможет разорвать эту связь."

 building_type_bjarkarey_ashen_throne_01: "Пепельный трон Ульфа"
 building_type_bjarkarey_ashen_throne_01_desc: "#F Трон легендарного Ульфа Гримссона, обладающий значительной властью в этих землях, хотя прошло много лет с тех пор, как он в последний раз восседал на нём.#!"
 building_bjarkarey_ashen_throne_01: "Резной высокий престол"
 building_bjarkarey_ashen_throne_01_desc: "Для Ульфа всегда стоял тяжёлый стул из тёмного дерева, всегда оставленный пустым. Детальная резьба огромных кракенов и рычащих зверей украшает дерево вдоль трона."
 building_bjarkarey_ashen_throne_02: "Окровавленный трон"
 building_bjarkarey_ashen_throne_02_desc: "Вдоль трона всё ещё можно увидеть давно засохшую кровь, наводящую ужас на любого потенциального претендента на высокое место."
 building_bjarkarey_ashen_throne_03: "Престол язычников"
 building_bjarkarey_ashen_throne_03_desc: "Хотя никто не знает, из чего именно сделан трон, многие утверждают, что Ульф сам вырезал его из священного ясеня, который срубил сам."
 building_bjarkarey_ashen_throne_04: "Престол власти Ульфа"
 building_bjarkarey_ashen_throne_04_desc: "Сам престол является великим символом язычников всей Скандинавии. Пока этот зал и трон существуют, они никогда не будут побеждены. Древние обычаи будут жить."
 POD_bjarkarey_ashen_throne_bonus: "По завершении строительства этого здания вы получите могущественный артефакт."

 building_type_bjarkarey_grimsson_armory_01: "Оружейная Гримссона"
 building_type_bjarkarey_grimsson_armory_01_desc: "#F Ульф Гримссон хранил в своём зале множество сокровищ. Оружие, которое он оставил, — лучшее в этих землях.#!"
 building_bjarkarey_grimsson_armory_01: "Тайник налётчика"
 building_bjarkarey_grimsson_armory_01_desc: "Вход в арсенал встречает воинов скромной коллекцией ржавого железа, исцарапанных щитов и окровавленных топоров, собранных в забытых стычках."
 building_bjarkarey_grimsson_armory_02: "Арсенал полководца"
 building_bjarkarey_grimsson_armory_02_desc: "Высококачественное стальное оружие и тяжёлые кольчужные доспехи обнаруживаются глубже в арсенале, демонстрируя трофеи, взятые во время заморских набегов Ульфа."
 building_bjarkarey_grimsson_armory_03: "Хранилища павших"
 building_bjarkarey_grimsson_armory_03_desc: "Искусные клинки, разбитые доспехи павших чужеземных рыцарей и добыча из сотни сожжённых деревень хранятся в полной готовности."
 building_bjarkarey_grimsson_armory_04: "Оружейная асов"
 building_bjarkarey_grimsson_armory_04_desc: "Оружие в этом легендарном зале может отразить даже Рагнарёк."
 POD_bjarkarey_grimsson_armory_bonus: "По завершении строительства этого здания вы получите могущественный артефакт."

 building_type_bjarkarey_prized_jewels_01: "Ценные драгоценности"
 building_type_bjarkarey_prized_jewels_01_desc: "#F Ульф накопил огромные сокровища в многочисленных приключениях за свою жизнь. Его сокровищница, хранящая безделушки всех видов, свидетельствует о том, как далеко он плавал по миру.#!"
 building_bjarkarey_prized_jewels_01: "Награбленное серебро"
 building_bjarkarey_prized_jewels_01_desc: "В хранилищах хранятся потускневшие серебро, медь и золото, отобранные у чужестранцев на чужбине."
 building_bjarkarey_prized_jewels_02: "Клад Дракона"
 building_bjarkarey_prized_jewels_02_desc: "Тяжёлые железные сундуки, до краёв наполненные блестящей добычей, являются доказательством доблести Ульфа и его налётчиков."
 building_bjarkarey_prized_jewels_03: "Глубокие хранилища"
 building_bjarkarey_prized_jewels_03_desc: "В самых глубоких хранилищах хранятся впечатляющие сокровища, захваченные у бессмертных соперников и легендарных героев, осмелившихся бросить вызов Ульфу Гримссону."
 building_bjarkarey_prized_jewels_04: "Драгоценности Гримссона"
 building_bjarkarey_prized_jewels_04_desc: "В легендарном кладе Ульфа хранятся безупречные рубины, искусное оружие и другие бесценные безделушки, излучающие опьяняющую ауру власти и богатства."
 POD_bjarkarey_prized_jewels_bonus: "По завершении строительства этого здания вы получите могущественный артефакт."

 building_type_bjarkarey_bones_njord_01: "Кости Ньёрда"
 building_type_bjarkarey_bones_njord_01_desc: "#F На берегах Бьяркарея находится скелет огромного морского зверя, которого смертные используют как место поклонения.#!"
 building_bjarkarey_bones_njord_01: "Отбеленные ребра глубин"
 building_bjarkarey_bones_njord_01_desc: "На берегу Бьяркарея покоятся массивные бледно-белые кости. Смертные рыбаки, которые до сих пор поклоняются асам, часто приходят сюда, чтобы оставить подношения, молясь о хорошем улове или ветре."
 building_bjarkarey_bones_njord_02: "Храм Морского зверя"
 building_bjarkarey_bones_njord_02_desc: "Высокие ребра были подняты вертикально и соединены вместе, образуя внушительную арку. Под этими костями потомки трэллов собираются, чтобы поклоняться и умолять Ньёрда даровать им попутный ветер на море."
 building_bjarkarey_bones_njord_03: "Храм Прилива"
 building_bjarkarey_bones_njord_03_desc: "Песок под костями, кажется, несёт на себе постоянное красное пятно, поскольку песнопения и молитвы верующих смешиваются с грохотом морских волн."
 building_bjarkarey_bones_njord_04: "Большой собор Ньёрда"
 building_bjarkarey_bones_njord_04_desc: "Под костями этого мёртвого морского зверя было создано величественное, захватывающее дух святилище для последователей старых обычаев."

 building_type_bjarkarey_loyal_thralls_01: "Верные трэллы"
 building_type_bjarkarey_loyal_thralls_01_desc: "#F Смертные Бьяркарея трудятся на берегах и в полях, и их тяжёлый труд приносит пользу только их новым повелителям.#!"
 building_bjarkarey_loyal_thralls_01: "Покорённые рыбаки"
 building_bjarkarey_loyal_thralls_01_desc: "Жители деревни бесконечно трудятся на ледяных берегах, охотно обменивая свою свободу на обещание защиты. Они предпочитают темноту холоду."
 building_bjarkarey_loyal_thralls_02: "Связанные слуги"
 building_bjarkarey_loyal_thralls_02_desc: "Страх стал движущей силой для местных жителей. Они бороздят ледяные моря с пустыми глазами и наблюдают, как их усилия идут в карманы их хозяев."
 building_bjarkarey_loyal_thralls_03: "Присяжные крепостные"
 building_bjarkarey_loyal_thralls_03_desc: "Поколения ужаса и манипуляций сломили смертных. Жители деревни теперь без вопросов жертвуют своим трудом, детьми и собственной кровью."
 building_bjarkarey_loyal_thralls_04: "Преданные вассалы"
 building_bjarkarey_loyal_thralls_04_desc: "Жители Бьяркарея превратились в полностью сломленное и отчаянно преданное население. Лишённые всякой автономии и надежды, они испытывают извращённую гордость за то, что делают своих хозяев счастливыми."

 building_type_bjarkarey_divided_throndarnes_01: "Разделённый Трондарнес"
 building_type_bjarkarey_divided_throndarnes_01_desc: "#F Единственная христианская церковь Бьяркарея остаётся отделённой от остального языческого населения.#!"
 building_bjarkarey_divided_throndarnes_01: "Скомпрометированный приход"
 building_bjarkarey_divided_throndarnes_01_desc: "Священники Белого Христа проповедуют, но их слова стали удивительно терпимы. Шёпот в темноте убедил их, что это лучший способ сохранить мир."
 building_bjarkarey_divided_throndarnes_02: "Синкретическая конгрегация"
 building_bjarkarey_divided_throndarnes_02_desc: "Граница между асами и Крестом намеренно размыта. И христиане, и язычники теперь посещают терпимые проповеди Трондарнеса."
 building_bjarkarey_divided_throndarnes_03: "Ведомая паства"
 building_bjarkarey_divided_throndarnes_03_desc: "Церковь взята под контроль, и духовенство исполняет волю своих тайных хозяев, проповедуя единство и тяжёлый труд, чтобы смешанное население неустанно трудилось ради процветания княжества."
 building_bjarkarey_divided_throndarnes_04: "Объединённый Трондарнес"
 building_bjarkarey_divided_throndarnes_04_desc: "Теперь Трондарнес стоит как памятник умению нежити манипулировать. Христиане и язычники Бьяркарея объединились в единое эффективное население."

 building_type_bjarkarey_shadow_fleets_01: "Теневые флоты"
 building_type_bjarkarey_shadow_fleets_01_desc: "#F Драконий флот эпохи викингов, лишённый своей языческой славы и преобразованный в эффективную тёмную армаду.#!"
 building_bjarkarey_shadow_fleets_01: "Ночные охотники"
 building_bjarkarey_shadow_fleets_01_desc: "Драконьи носы кораблей окрашены в чёрный как смоль цвет, как и паруса. Эти быстрые корабли больше не стремятся устрашать, а бесшумно скользят по тёмным водам, совершая набеги и грабежи."
 building_bjarkarey_shadow_fleets_02: "Тихая флотилия"
 building_bjarkarey_shadow_fleets_02_desc: "Этот растущий флот, укомплектованный совершенно молчаливыми, трэллами, связанными узами крови, бесшумно нападает по ночам, грабя города в поисках крови и золота."
 building_bjarkarey_shadow_fleets_03: "Корабли-призраки"
 building_bjarkarey_shadow_fleets_03_desc: "Жители Скандинавии шепчут о флоте кораблей-призраков, жаждущих их крови."
 building_bjarkarey_shadow_fleets_04: "Армада ночи"
 building_bjarkarey_shadow_fleets_04_desc: "Эта апокалиптическая армада претендует на господство над северными морями. Флоты драконов похоронены, их заменили Теневые флоты, неудержимая армада, которая гарантирует, что бессмертные хозяева севера могут атаковать и совершать набеги на берега по всему миру."
 POD_bjarkarey_shadow_fleets_bonus: "Вы разблокируете возможность совершать набеги после завершения строительства этого здания."