 building_type_jerusalem_jewish_third_temple_01: "Третий храм"
 building_type_jerusalem_jewish_third_temple_01_desc: "#F Храм — центр всего иудейского богослужения. Хотя раввинистические учения дают замену, все евреи ждут дня, когда снова смогут использовать Храм как истинный центр своего служения.#!"
 building_jerusalem_jewish_third_temple_01: "Стена Плача"
 building_jerusalem_jewish_third_temple_01_desc: "Эта подпорная стена — всё, что осталось от Второго храма после его снесения во время Войны разрушения. Возможно, мы сможем воздвигнуть Храм заново на этих руинах..."
 building_jerusalem_jewish_third_temple_02: "Внешние дворы и Улам"
 building_jerusalem_jewish_third_temple_02_desc: "Прежде чем мы сможем восстановить Храм, нам нужно восстановить внешние дворы, жертвенники, омовения и две бронзовые колонны Улама: Иахин и Боаз. Это место — предел, до которого дойдут большинство неевреев и евреев, и оно станет центром возобновлённых жертвоприношений. Поэтому мы должны создать пространство, соответствующее этой цели и достойно отражающее Шхину."
 building_jerusalem_jewish_third_temple_03: "Притвор и Хейхал"
 building_jerusalem_jewish_third_temple_03_desc: "Главное святилище — место служения коэнов и дом многих важных символов. Мы отыщем или воссоздадим эти символы, чтобы они вновь украсили зал Храма."
 building_jerusalem_jewish_third_temple_04: "Завершённый Третий храм"
 building_jerusalem_jewish_third_temple_04_desc: "С завершением Святая Святых и обретением Ковчега Завета Третий храм снова завершён. Левитское священство вновь приносит жертвы и наставляет Народ Бога, который поднимается в Священный город на праздники. Да простоит он семь раз по семь раз по семь дольше, чем храм Соломона! Да станет он для всех народов знаком верности Бога его избранному народу!"
 JERUSALEM_JEWISH_THIRD_TEMPLE: "[GetBuilding('jerusalem_jewish_third_temple_04').GetName]"
 POD_jerusalem_jewish_third_temple_ark_unlock: "$EFFECT_LIST_BULLET$Даёт доступ к [Concept('decision', 'решению')|E] «$jerusalem_recover_ark_covenant_decision$», если он ещё не возвращён\n"
 POD_jerusalem_jewish_third_temple_bonus: "$EFFECT_LIST_BULLET$Разблокирует придворную должность «[GetCourtPositionType('jerusalem_socher_court_position').GetName()]»\n"

 building_type_jerusalem_jewish_library_01: "$building_jerusalem_jewish_library_02$"
 building_type_jerusalem_jewish_library_01_desc: "#F $building_jerusalem_jewish_library_02_desc$#!"
 building_jerusalem_jewish_library_01: "Иерусалимская гениза"
 building_jerusalem_jewish_library_01_desc: "Как Народ Писания, евреи всегда понимали ценность письменного слова. На данный момент у нас есть только место для хранения устаревших или повреждённых текстов, административных документов, писем и расчётов. Возможно, в будущем нам понадобится и мы сможем приобрести помещение побольше."
 building_jerusalem_jewish_library_02: "Иерусалимский архив"
 building_jerusalem_jewish_library_02_desc: "Как Народ Писания, евреи всегда понимали ценность письменного слова. Теперь пришло время собрать наши знания в архив, который сможет соперничать с величайшими библиотеками в истории."
 building_jerusalem_jewish_library_03: "Иерусалимская библиотека"
 building_jerusalem_jewish_library_03_desc: "Хотя наша работа ещё не завершена, мы уже хорошо продвинулись в создании централизованного собрания наших знаний о мире естественном и сверхъестественном."
 building_jerusalem_jewish_library_04: "Великая библиотека Иерусалима"
 building_jerusalem_jewish_library_04_desc: "Когда-то греческие переводы Танаха стояли на полках Великой библиотеки Александрии. Теперь переводы #italic «Государства»#! Платона и #italic «Энеиды»#! Вергилия на иврите стоят на полках Великой библиотеки Иерусалима рядом с нашим полным собранием трудов об происхождении, природе и слабостях всех сотворённом — живом, мёртвом и неживом."
 JERUSALEM_JEWISH_LIBRARY: "[GetBuilding('jerusalem_jewish_library_04').GetName]"

 building_type_jerusalem_jewish_castle_01: "Башня Давида"
 building_type_jerusalem_jewish_castle_01_desc: "#F $building_jerusalem_jewish_castle_01_desc$#!"
 building_jerusalem_jewish_castle_01: "Башня Давида"
 building_jerusalem_jewish_castle_01_desc: "Построенная на руинах укреплений, эпохи Хасмонеев и Ирода, нынешняя Башня Давида была возведена в V веке н.э. С момента мусульманского завоевания Иерусалима и изгнания монахов из башни она используется как военная крепость."
 building_jerusalem_jewish_castle_02: "Донжон Давида"
 building_jerusalem_jewish_castle_02_desc: "Хотя византийцы ошибочно приписывали эту башню дворцу Давида, она всё равно остаётся важной частью обороны и истории Иерусалима. В знак этого мы расширили башню до полноценного донжона."
 building_jerusalem_jewish_castle_03: "Твердыня Давида"
 building_jerusalem_jewish_castle_03_desc: "Там, где когда-то стояла башня, теперь возвышается могучая крепость. Недавно построенная крепость защитит наш народ и послужит надёжным пунктом, с которого наши армии смогут действовать."
 building_jerusalem_jewish_castle_04: "Цитадель Давида"
 building_jerusalem_jewish_castle_04_desc: "Город Иерусалим слишком много раз в истории падал на колени перед вражескими войсками. С завершением строительства Цитадели Давида все угрозы еврейскому Иерусалиму столкнутся с куда более серьёзным препятствием, если осмелятся попытаться вновь взять город."
 JERUSALEM_JEWISH_CASTLE: "[GetBuilding('jerusalem_jewish_castle_04').GetName]"
 POD_jerusalem_jewish_castle_bonus: "$EFFECT_LIST_BULLET$#help Если вам уже доступны [GetMaA('shomer').GetName]:#!\n[GetMaA('shomer').GetName] будут улучшены до [GetMaA('blessed_shomer').GetName]\n$EFFECT_LIST_BULLET$#help Если нет:#!\nСтанут доступны профессионалы - [GetMaA('shomer').GetName]"

 building_type_jerusalem_jewish_palace_01: "$building_jerusalem_jewish_palace_01$"
 building_type_jerusalem_jewish_palace_01_desc: "#F $building_jerusalem_jewish_palace_01_desc$#!"
 building_jerusalem_jewish_palace_01: "Разрушенный особняк Анны"
 building_jerusalem_jewish_palace_01_desc: "Бывшее резиденцией первосвященника Анны при царе Ироде, это сооружение было разрушено вместе с остальным Иерусалимом в 70 году н.э., и от него мало что осталось, кроме руин."
 building_jerusalem_jewish_palace_02: "Восстановленный особняк Анны"
 building_jerusalem_jewish_palace_02_desc: "Это величественное сооружение, восстановленное из сгоревшего остова, которым оно когда-то было, напоминает о тех временах, когда Иерусалим был домом для первосвященника."
 building_jerusalem_jewish_palace_03: "Роскошный особняк Анны"
 building_jerusalem_jewish_palace_03_desc: "После полной реконструкции и даже расширения, это поистине царский дом."
 building_jerusalem_jewish_palace_04: "Царский дворец"
 building_jerusalem_jewish_palace_04_desc: "Это сооружение, построенное на месте особняка в еврейском квартале, который когда-то был резиденцией первосвященника Анны во времена царя Ирода, является мощным символом возвращения евреев в Иерусалим. Это поистине дворец и резиденция правительства, достойные царя, правящего из священного города Иерусалима."
 JERUSALEM_JEWISH_PALACE: "[GetBuilding('jerusalem_jewish_palace_04').GetName]"

 building_type_jerusalem_jewish_pools_01: "Иерусалимская система водоёмов"
 building_type_jerusalem_jewish_pools_01_desc: "#F Как и многие крупные города в пустыне, Иерусалим имеет сложную, хотя и обветшавшую, систему водоснабжения. Восстановление этой древней системы позволит населению Иерусалима вновь вырасти, чтобы торговля текла рекой.#!"
 #also one of the few locations mentioned in Fountains of Bright Crimson & Jerusalem By Night
 building_jerusalem_jewish_pools_01: "Езекиев бассейн"
 building_jerusalem_jewish_pools_01_desc: "Этот древний водоём был построен царём Езекией, чтобы снабжать город 11 миллионами литров воды. Бассейн когда-то была окружена высокими башнями и колоннами, поэтому цари использовали её как место встреч с зарубежными послами."
 building_jerusalem_jewish_pools_02: "Тоннель Езекии"
 building_jerusalem_jewish_pools_02_desc: "Этот древний тоннель направляет воду от источника Гихон далеко за пределами города на 583 ярда в Силоамский пруд внутри стен. Источник Гихон — главный, но перемежающийся источник воды в Иерусалиме, поэтому акведук и Силоамский пруд необходимы на то время, когда источник не бьёт."
 building_jerusalem_jewish_pools_03: "Циннор Давида"
 building_jerusalem_jewish_pools_03_desc: "Во втором тысячелетии до н.э. рядом с источником Гихон были построены водопровод и несколько укреплений. В последующие века они были углублены и удлинены, чтобы перекрыть доступ осаждающим и в то же время защитить водоснабжение города. Некоторые говорят, что именно по этим туннелям Давид нанёс удар. В любом случае, раскопки обеспечили более надёжный источник воды."
 building_jerusalem_jewish_pools_04: "Соломоновы водохранилища"
 building_jerusalem_jewish_pools_04_desc: "Когда они были впервые построены, эти три водохранилища к юго-западу от Вифлеема вмещали почти 285 миллионов литров воды. Через пять акведуков они снабжали водой Вифлеем, Храмовую гору и дворец Ирода. После всех наших ремонтов вода снова поступает в Иерусалим и полностью покрывает наши нужды."
 JERUSALEM_JEWISH_POOLS: "[GetBuilding('jerusalem_jewish_pools_04').GetName]"
 POD_jerusalem_jewish_pools_bonus: "#P Владельцу этого здания доступно решение «[diligent_development_focus_decision|E]», если Иерусалим является его столицей.#!"

 building_type_jerusalem_jewish_synagogue_01: "$building_jerusalem_jewish_synagogue_02$"
 building_type_jerusalem_jewish_synagogue_01_desc: "#F Когда раввин Моше бен Нахман, более известный как Нахманид или Рамбан, прибыл в Иерусалим, его глубоко опечалило малое число евреев в городе и власть, которой пользовались нежить в Святом городе. Ещё до его прибытия его ученики уже действовали в городе.#!"
 building_jerusalem_jewish_synagogue_01: "Шул Рамбана"
 building_jerusalem_jewish_synagogue_01_desc: "Прежде чем стать синагогой, где собираются верующие, это должно быть школой, которая наставляет и учит их."
 building_jerusalem_jewish_synagogue_02: "Синагога Рамбана"
 building_jerusalem_jewish_synagogue_02_desc: "По мере роста числа евреев Шул Рамбана превратился в полноценную синагогу, где могут собираться верующие."
 building_jerusalem_jewish_synagogue_03: "Бейт-кнессет Рамбана"
 building_jerusalem_jewish_synagogue_03_desc: "То, что когда-то было небольшим местом собраний и школой, теперь выросло в великий дом собраний для верных. Ходят слухи о Судьях, которые съезжаются сюда со всего мира, выдавая себя за паломников и обмениваясь сведениями."
 building_jerusalem_jewish_synagogue_04: "Бейт-кнессет Нахманида"
 building_jerusalem_jewish_synagogue_04_desc: "С прибытием в Иерусалим Нахманид и его последователи возглавили синагогу, носящую его имя. Под его руководством был достигнут значительный прогресс, помогающий Судьям в их миссии."
 JERUSALEM_JEWISH_SYNAGOGUE: "[GetBuilding('jerusalem_jewish_synagogue_04').GetName]"
 POD_jerusalem_jewish_synagogue_bonus: "$EFFECT_LIST_BULLET$#help Если вы уже можете использовать [Concept('interaction', 'взаимодействие')|E] $literalist_debate_interaction$:#!\nДаёт +100% благочестия при победе и -50% при проигрыше\n$EFFECT_LIST_BULLET$#help Если нет:#!\nМожно вызывать на дебаты других правителей державы ценой [Concept('opinion', 'мнения')|E], чтобы получить или потерять [Concept('piety', 'благочестие')|E]"

 building_type_jerusalem_jewish_demonology_01: "$building_jerusalem_jewish_demonology_01$"
 building_type_jerusalem_jewish_demonology_01_desc: "#F Слава Божья – скрывать, а слава царей – выискивать. Это стало целью этой синагоги.#!"
 #also one of the few locations mentioned in Fountains of Bright Crimson & Jerusalem By Night
 building_jerusalem_jewish_demonology_01: "Синагога Тиферет Исраэль"
 building_jerusalem_jewish_demonology_01_desc: "Построенная на руинах времён Иудейского царства синагога Тиферет Исраэль стала местом, где преподают мистические искусства царя Соломона и раскрывают сокровенные тайны творения. В её тенях бродит странный человек, который живёт здесь столько, сколько кто-либо себя помнит."
 building_jerusalem_jewish_demonology_02: "Отреставрированная синагога Тиферет Исраэль"
 building_jerusalem_jewish_demonology_02_desc: "После недавней реконструкции синагога теперь стала местом, куда ученики приходят, чтобы познать более глубокие секреты магии. Некоторых даже отбирают для обучения у старого раввина, известного своими тонкими седыми волосами, что помогает ему в его исследованиях."
 building_jerusalem_jewish_demonology_03: "Украшенная синагога Тиферет Исраэль"
 building_jerusalem_jewish_demonology_03_desc: "Опираясь на искусство инфернализма, царь Соломон Мудрый нашел способ очистить свои ритуалы и заклинания, устранив опасность заражения. Такие знания составляют основу нашей нынешней магии и дают нам уникальные способности, которые другие могут счесть неестественными. Наши усилия только подкрепляются проницательностью местного раввина, раскрывающего истины, скрытые во многих текстах."
 building_jerusalem_jewish_demonology_04: "Освящённая синагога Тиферет Исраэль"
 building_jerusalem_jewish_demonology_04_desc: "Говорят, что Священная Книга находится за пределами понимания смертных до прихода Мессии, когда он истолкует каждый отрывок, каждое слово, каждое пространство между буквами. Сама Тора является проектом творения, и только Второзаконие 32 содержит всю историю Израиля. На её страницах заключены все тайны творения, тайны, которые мы изучаем под руководством раввина Авраама. Будь то гематрия, нотарикон, темура, числа, акростихи, кластеризация, макрокоды, равноотстоящие буквенные последовательности, анализ имён, стеганографический анализ, гептадический структурный анализ или что-то ещё, каждый подход должен быть использован для обработки предоставленной нам скрытой информации."
 JERUSALEM_JEWISH_DEMONOLOGY: "[GetBuilding('jerusalem_jewish_demonology_04').GetName]"
 JERUSALEM_JEWISH_DEMONOLOGY_1: "[GetBuilding('jerusalem_jewish_demonology_01').GetName]"
 JERUSALEM_JEWISH_DEMONOLOGY_2: "[GetBuilding('jerusalem_jewish_demonology_02').GetName]"
 JERUSALEM_JEWISH_DEMONOLOGY_3: "[GetBuilding('jerusalem_jewish_demonology_03').GetName]"
 POD_jerusalem_jewish_demonology_bonus: "$EFFECT_LIST_BULLET$#help Если вы можете использовать [Glossary('дисциплины','game_concept_discipline_desc')]:#!\nБонус +10% к скорости ритуалов кровавого чародейства\n$EFFECT_LIST_BULLET$#help Если нет:#!\nВы получаете доступ ко всем ритуалам Дур-Ан-Ки"



 building_type_jerusalem_christian_holy_sepulcher_01: "Храм Гроба Господня"
 building_type_jerusalem_christian_holy_sepulcher_01_desc: "#F Считающийся святейшим местом христианства, Храм Гроба Господня возведён на месте смерти Иисуса и Его пустого гроба. Кроме того, в храме находятся последние 4 стояния Крестного пути — Via Dolorosa.#!"
 building_jerusalem_christian_holy_sepulcher_01: "Часовня Гроба Господня"
 building_jerusalem_christian_holy_sepulcher_01_desc: "Хотя византийцы и крестоносцы предпринимали попытки восстановить храм, большая его часть до сих пор лежит в руинах после разрушения аль-Хакимом."
 building_jerusalem_christian_holy_sepulcher_02: "Храм Гроба Господня"
 building_jerusalem_christian_holy_sepulcher_02_desc: "Храм Гроба Господня наконец восстановлен в своём древнем великолепии — таким, каким он был освящён и возведён при Константине Великом."
 building_jerusalem_christian_holy_sepulcher_03: "Кафедральный собор Гроба Господня"
 building_jerusalem_christian_holy_sepulcher_03_desc: "Храм был расширен и стал полноценной кафедрой и для православного, и для латинского патриархов Иерусалима."
 building_jerusalem_christian_holy_sepulcher_04: "Великий собор Гроба Господня"
 building_jerusalem_christian_holy_sepulcher_04_desc: "Наконец это святое место украшено собором, которого оно заслуживает, — таким, что по-настоящему отражает славу и величие Бога. Весь христианский мир будет дивиться ему."
 JERUSALEM_CHRISTIAN_HOLY_SEPULCHER: "[GetBuilding('jerusalem_christian_holy_sepulcher_04').GetName]"
 POD_jerusalem_christian_holy_sepulcher_bonus: "$EFFECT_LIST_BULLET$[Concept('holy_wars', 'Священные войны')|E] за королевства можно объявлять каждые 25 лет, а не 50\n"
 POD_jerusalem_christian_holy_sepulcher_bonus2: "$EFFECT_LIST_BULLET$Разблокирует придворную должность «[GetCourtPositionType('jerusalem_puppeteer_grand_masters_court_position').GetName()]»\n"

 building_type_jerusalem_christian_lazarus_01: "Орден святого Лазаря"
 building_type_jerusalem_christian_lazarus_01_desc: "#F Более известный как орден прокажённых рыцарей, орден святого Лазаря обеспечивает многие госпитали лекарями и защищает их от возможных угроз. Кроме того, он даёт тем, кто страдает смертельной формой проказы, шанс умереть со славой и честью на службе Богу.#!"
 building_jerusalem_christian_lazarus_01: "Капитул ордена св. Лазаря"
 building_jerusalem_christian_lazarus_01_desc: "Этот капитул предоставляет жильё для небольшого числа прокажённых рыцарей и служит карантинной станцией."
 building_jerusalem_christian_lazarus_02: "Анклав рыцарей-братьев св. Лазаря"
 building_jerusalem_christian_lazarus_02_desc: "Этот анклав предоставляет жильё для значительного числа прокажённых рыцарей и служит полевым госпиталем."
 building_jerusalem_christian_lazarus_03: "Командория Креста св. Лазаря"
 building_jerusalem_christian_lazarus_03_desc: "В этой командории размещён большой контингент прокажённых рыцарей, и она действует как региональный центр по управлению различными госпиталями и оказанию помощи раненым братьям-рыцарям."
 building_jerusalem_christian_lazarus_04: "Бастион Креста св. Лазаря"
 building_jerusalem_christian_lazarus_04_desc: "Этот бастион предоставляет жильё для многочисленных прокажённых рыцарей, посвящённых продвижению дела Креста военной силой и широкомасштабной медицинской помощью."
 JERUSALEM_CHRISTIAN_LAZARUS: "[GetBuilding('jerusalem_christian_lazarus_04').GetName]"

 building_type_jerusalem_christian_john_01: "Орден святого Иоанна"
 building_type_jerusalem_christian_john_01_desc: "#F Более известный как Госпитальеры, орден святого Иоанна заботится о больных, раненых и бедных паломниках, прибывающих в Святую землю, и защищает их. Кроме того, они известны тем, что управляют ключевыми крепостями, такими как Крак де Шевалье, и иногда помогают устраивать отдельные договоры между христианскими правителями.#!"
 building_jerusalem_christian_john_01: "Капитул ордена св. Иоанна"
 building_jerusalem_christian_john_01_desc: "Этот капитул предоставляет жильё для небольшого числа госпитальеров и служит небольшим укреплением для паломников, ищущих защиты."
 building_jerusalem_christian_john_02: "Анклав рыцарей-братьев св. Иоанна"
 building_jerusalem_christian_john_02_desc: "Этот анклав предоставляет жильё для значительного числа госпитальеров и служит средним по размеру укреплением для паломников, ищущих защиты."
 building_jerusalem_christian_john_03: "Командория Креста св. Иоанна"
 building_jerusalem_christian_john_03_desc: "В этой командории размещён большой контингент рыцарей-госпитальеров, и она действует как региональный центр для управления различными благотворительными организациями и защиты паломников на дорогах Святой земли."
 building_jerusalem_christian_john_04: "Бастион Креста св. Иоанна"
 building_jerusalem_christian_john_04_desc: "Этот бастион предоставляет жильё для многочисленных госпитальеров, посвящённых продвижению дела Креста военной силой и защите всех паломников."
 JERUSALEM_CHRISTIAN_JOHN: "[GetBuilding('jerusalem_christian_john_04').GetName]"
 POD_crusader_siege_tactics_modifier: "Осадная тактика крестоносцев"
 POD_crusader_siege_tactics_modifier_desc: "Многовековой опыт бесконечных священных войн позволил получить уникальные знания о подкопах, разрушении укреплений и других тактиках осады. Большинство врагов обнаруживают это слишком поздно."
 POD_jerusalem_christian_john_bonus: "При начале [Concept('war', 'войны')|E] в качестве основного нападающего или защитника вражеские [Concept('rulers', 'правители')|E] получат модификатор «[GetModifier('POD_crusader_siege_tactics_modifier').GetNameWithTooltip]»."

 building_type_jerusalem_christian_sepulchre_01: "Орден Гроба Господня"
 building_type_jerusalem_christian_sepulchre_01_desc: "#F Более известный как «Milites Sancti Sepulcri», Орден Гроба Господня охраняет и управляет ключевыми святынями в Иерусалиме. Кроме того, он посвящает своих лучших воинов в рыцари, что делает их более привлекательными для простого люда.#!"
 building_jerusalem_christian_sepulchre_01: "Капитул ордена Гроба Господня"
 building_jerusalem_christian_sepulchre_01_desc: "Этот капитул предоставляет жильё для небольшого числа Milites Sancti Sepulcri и служит небольшим центром набора."
 building_jerusalem_christian_sepulchre_02: "Анклав рыцарей-братьев ордена Гроба Господня"
 building_jerusalem_christian_sepulchre_02_desc: "Этот анклав предоставляет жильё для значительного числа Milites Sancti Sepulcri и служит средним по размеру центром набора."
 building_jerusalem_christian_sepulchre_03: "Командория Креста ордена Гроба Господня"
 building_jerusalem_christian_sepulchre_03_desc: "В этой командории размещается большой контингент Milites Sancti Sepulcri, и она действует как региональный центр по набору братьев-рыцарей для защиты ключевых объектов на Святой земле."
 building_jerusalem_christian_sepulchre_04: "Бастион Креста ордена Гроба Господня"
 building_jerusalem_christian_sepulchre_04_desc: "Этот бастион предоставляет жильё для многочисленных Milites Sancti Sepulcri, посвящённых продвижению дела Креста военной силой и привлечению простого люда к этому делу."
 JERUSALEM_CHRISTIAN_SEPULCHRE: "[GetBuilding('jerusalem_christian_sepulchre_04').GetName]"

 building_type_jerusalem_christian_supreme_templar_01: "Орден храма Соломона"
 building_type_jerusalem_christian_supreme_templar_01_desc: "#F Более известный как рыцари-тамплиеры, Орден храма Соломона — один из самых военизированных из пяти главных крестоносных орденов в Иерусалиме. Особенно известен своей тяжёлой кавалерией и пехотой.#!"
 building_jerusalem_christian_supreme_templar_01: "Капитул Верховного ордена"
 building_jerusalem_christian_supreme_templar_01_desc: "Этот капитул предоставляет жильё для небольшого числа рыцарей-тамплиеров и служит учебным лагерем."
 building_jerusalem_christian_supreme_templar_02: "Анклав рыцарей-братьев Верховного ордена"
 building_jerusalem_christian_supreme_templar_02_desc: "Этот анклав предоставляет жильё для значительного числа рыцарей-тамплиеров и служит учебным лагерем среднего размера."
 building_jerusalem_christian_supreme_templar_03: "Командория Креста Верховного ордена"
 building_jerusalem_christian_supreme_templar_03_desc: "В этой командории размещён большой контингент рыцарей-тамплиеров, и она действует как региональный центр подготовки братьев-рыцарей, способных противостоять любому нападению."
 building_jerusalem_christian_supreme_templar_04: "Бастион Креста Верховного ордена"
 building_jerusalem_christian_supreme_templar_04_desc: "Этот бастион предоставляет жильё для многочисленных рыцарей-тамплиеров, посвятивших себя продвижению дела Креста сокрушительной военной силой."
 JERUSALEM_CHRISTIAN_SUPREME_TEMPLAR: "[GetBuilding('jerusalem_christian_supreme_templar_04').GetName]"

 building_type_jerusalem_christian_german_mary_01: "Орден святой Марии"
 building_type_jerusalem_christian_german_mary_01_desc: "#F Более известный как Тевтонский орден, орден святой Марии помогает поддерживать порядок и контроль на своих землях. Хотя им ещё далеко до будущего могущества в Ливонии, они всё же полезны для урегулирования отношений между прочими фракциями в Иерусалиме.#!"
 building_jerusalem_christian_german_mary_01: "Капитул ордена св. Марии"
 building_jerusalem_christian_german_mary_01_desc: "Этот капитул предоставляет жильё для небольшого числа тевтонских рыцарей и служит временной тюрьмой."
 building_jerusalem_christian_german_mary_02: "Анклав рыцарей-братьев св. Марии"
 building_jerusalem_christian_german_mary_02_desc: "Этот анклав предоставляет жильё для значительного числа тевтонских рыцарей и служит второстепенным судом."
 building_jerusalem_christian_german_mary_03: "Командория Креста св. Марии"
 building_jerusalem_christian_german_mary_03_desc: "В этой командории размещён большой контингент тевтонских рыцарей, и она действует как региональный центр по обеспечению соблюдения законов христианского мира."
 building_jerusalem_christian_german_mary_04: "Бастион Креста св. Марии"
 building_jerusalem_christian_german_mary_04_desc: "Этот бастион предоставляет жильё для многочисленных тевтонских рыцарей, посвятивших себя продвижению дела Креста военной силой и судебными мерами."
 JERUSALEM_CHRISTIAN_GERMAN_MARY: "[GetBuilding('jerusalem_christian_german_mary_04').GetName]"
 POD_jerusalem_christian_german_mary_bonus: "[Concept('convert_county', 'Обращение графств')|E] будет продвигаться на #color_green +25%#! быстрее"



 #mentioned by Fountains of Bright Crimson and Jerusalem By Night
 building_type_jerusalem_divided_temple_mount_catacombs_01: "Катакомбы Храмовой горы"
 building_type_jerusalem_divided_temple_mount_catacombs_01_desc: "#F В отличие от Храма Гроба Господня, туннели под Храмовой горой почти не вызывают сложностит, ведь вера смертных направляет их вверх. Переплетаясь в трёх измерениях на многих уровнях под землёй и имея странно смещающиеся ходы, эти катакомбы нельзя исследовать легкомысленно. Здесь и правда можно блуждать вечность, питаясь крысами и кровью слепых рыб, — и больше никогда не увидеть свет. Однако это по-прежнему отличное убежище от других сородичей и от солнца.#!" 
 building_jerusalem_divided_temple_mount_catacombs_01: "Обветшалый лабиринтный комплекс"
 building_jerusalem_divided_temple_mount_catacombs_01_desc: "Пещеры под Храмовой горой и Иерусалимом сырые и скользкие, изъедены обвалами и извилистыми ходами. Даже небольшой удар может обрушить огромный участок коридора."
 building_jerusalem_divided_temple_mount_catacombs_02: "Скрытые катакомбы"
 building_jerusalem_divided_temple_mount_catacombs_02_desc: "После усиления сводов под Храмовой горой нижние уровни стали надёжнее. Как и прежде, множество залов, ловушек и ходов остаются запутанными и меняющимися за спиной, но теперь куда реже обрушиваются."
 building_jerusalem_divided_temple_mount_catacombs_03: "Призрачные залы"
 building_jerusalem_divided_temple_mount_catacombs_03_desc: "Похоже, в глубине туннелей дремлет древняя тьма, а многие из нижних ходов были некогда прорыты снизу вверх. Но главное препятствие это другие Сородичи, живущие в катакомбах. Вернее, были…"
 building_jerusalem_divided_temple_mount_catacombs_04: "Дворец теней"
 building_jerusalem_divided_temple_mount_catacombs_04_desc: "У туннелей нет конца: они ведут к спрятанным тайнам, утерянным реликвиям и городам, древнее почти всех мафусаилов. Ваши поиски и труды дали невероятные плоды, позволив возвести в катакомбах огромный дворец. Из этого тайного дворца вы правите святым городом железной рукой, а тех, кто осмелится вам досаждать, ждёт бесконечный лабиринт, уходящий вниз через безумно меняющиеся коридоры, в которых застрянет любой. Цена — лишь безумные смешки и крики, доносящиеся из тех залов, — что ж, малая цена."
 POD_jerusalem_divided_temple_mount_catacombs_bonus_threshold_tier1: "#color_green -1%#! к влиянию, необходимому для достижения каждого #TOOLTIP:POD_jerusalem_modifier_tooltip #L;V;italic порога модификатора#!#!"
 POD_jerusalem_divided_temple_mount_catacombs_bonus_threshold_tier2: "#color_green -2%#! к влиянию, необходимому для достижения каждого #TOOLTIP:POD_jerusalem_modifier_tooltip #L;V;italic порога модификатора#!#!"
 POD_jerusalem_divided_temple_mount_catacombs_bonus_threshold_tier3: "#color_green -3%#! к влиянию, необходимому для достижения каждого #TOOLTIP:POD_jerusalem_modifier_tooltip #L;V;italic порога модификатора#!#!"
 POD_jerusalem_divided_temple_mount_catacombs_bonus_threshold_tier4:0 "$EFFECT_LIST_BULLET$#color_green -5%#! к влиянию, необходимому для достижения каждого #TOOLTIP:POD_jerusalem_modifier_tooltip #L;V;italic порога модификатора#!#!\n"
 POD_jerusalem_divided_temple_mount_catacombs_bonus_equilibrium: "$EFFECT_LIST_BULLET$Значения равновесия влияния становятся #color_white 34#! для мусульман, #color_white 33#! для христиан и #color_white 33#! для иудеев\n"
 JERUSALEM_DIVIDED_TEMPLE_MOUNT_CATACOMBS: "[GetBuilding('building_jerusalem_divided_temple_mount_catacombs_04').GetName]"



 building_type_jerusalem_muslim_dome_rock_01: "Купол Скалы"
 building_type_jerusalem_muslim_dome_rock_01_desc: "#F Купол Скалы был построен в 690-х годах н.э. на месте сотворения Адама, где Авраам почти принёс в жертву своего сына и откуда Мухаммед начал Ночное путешествие. Хотя строение и поныне в хорошем состоянии, за века его потрепали крестовые походы и землетрясения.#!"
 building_jerusalem_muslim_dome_rock_01: "Купол Скалы"
 building_jerusalem_muslim_dome_rock_01_desc: "Купол Скалы был построен в 690-х годах н.э. на месте сотворения Адама, где Авраам почти принёс в жертву своего сына и откуда Мухаммед начал Ночное путешествие. Хотя строение и поныне в хорошем состоянии, за века его потрепали крестовые походы и землетрясения."
 building_jerusalem_muslim_dome_rock_02: "Обновлённый Купол Скалы"
 building_jerusalem_muslim_dome_rock_02_desc: "$building_jerusalem_muslim_dome_rock_01_desc$"
 building_jerusalem_muslim_dome_rock_03: "Украшенный Купол Скалы"
 building_jerusalem_muslim_dome_rock_03_desc: "$building_jerusalem_muslim_dome_rock_01_desc$"
 building_jerusalem_muslim_dome_rock_04: "Освящённый Купол Скалы"
 building_jerusalem_muslim_dome_rock_04_desc: "Купол Скалы был построен в 690-х годах н.э. на месте сотворения Адама, где Авраам почти принёс в жертву своего сына и откуда Мухаммед начал Ночное путешествие. Теперь, когда весь ущерб устранён, третья по святости святыня ислама наконец готова должным образом прославлять великие деяния Аллаха в этом месте"
 JERUSALEM_MUSLIM_DOME_ROCK: "[GetBuilding('building_jerusalem_muslim_dome_rock_04').GetName]"
 POD_jerusalem_muslim_dome_rock_bonus: "$EFFECT_LIST_BULLET$Разблокирована придворная должность «[GetCourtPositionType('jerusalem_ashen_muhtasib_court_position').GetName()]»\n"
 POD_jerusalem_muslim_dome_rock_bonus2: "$EFFECT_LIST_BULLET$#help Если у вас уже есть свойство «[GetTrait('truefaith').GetName(GetNullCharacter)]»:#!\nЗавершение хаджа приносит [piety_i|E] #V 2500#! [Concept('piety', 'благочестия')|E] и #V 1#! [Concept('piety_level', 'уровень набожности')|E]\n$EFFECT_LIST_BULLET$#help Если у вас нет этого свойства:#!\nЗавершив хадж, вы получите свойство «[GetTrait('truefaith').GetName(GetNullCharacter)]»"

 #from Jerusalem by Night
 building_type_jerusalem_muslim_damascus_market_01: "$building_jerusalem_muslim_damascus_market_02$"
 building_type_jerusalem_muslim_damascus_market_01_desc: "#F $building_jerusalem_muslim_damascus_market_02_desc$#!"
 building_jerusalem_muslim_damascus_market_01: "Дамасский рынок"
 building_jerusalem_muslim_damascus_market_01_desc: "В лабиринте переулков можно купить и продать всё, от привозных товаров до домашнего скота."
 building_jerusalem_muslim_damascus_market_02: "Дамасская рыночная площадь"
 building_jerusalem_muslim_damascus_market_02_desc: "В основном на прилавках представлены красочные специи, сладости, изделия из дерева, керамика, свежие продукты, текстиль и многое другое. Чего здесь только нет."
 building_jerusalem_muslim_damascus_market_03: "Дамасский базар"
 building_jerusalem_muslim_damascus_market_03_desc: "Дамасский рынок торгует всем — от завозных товаров до скота — и является финансовым сердцем Иерусалима. Здесь можно найти всё, что разрешено к продаже."
 building_jerusalem_muslim_damascus_market_04: "Великий дамасский базар"
 building_jerusalem_muslim_damascus_market_04_desc: "Дамасский рынок торгует всем — от завозных товаров до скота — и является финансовым сердцем Иерусалима. Иерусалим — узел, вокруг которого вращается мировая торговля, а Великий дамасский базар — центр этого узла."
 JERUSALEM_MUSLIM_DAMASCUS_MARKET: "[GetBuilding('building_jerusalem_muslim_damascus_market_04').GetName]"

 building_type_jerusalem_muslim_zawiya_01: "$building_jerusalem_muslim_zawiya_01$"
 building_type_jerusalem_muslim_zawiya_01_desc: "#F $building_jerusalem_muslim_zawiya_02_desc$#!"
 building_jerusalem_muslim_zawiya_01: "Завия Ахмада"
 building_jerusalem_muslim_zawiya_01_desc: "Названная в честь важного, но по большей части забытого религиозного лидера, она служит местом отправления культа, школой, монастырём и домом для местного братства."
 building_jerusalem_muslim_zawiya_02: "Обновлённая завия Ахмада"
 building_jerusalem_muslim_zawiya_02_desc: "После недавней реконструкции Завия Ахмада вновь напоминает людям о древнем традиционалисте и воине джихада. Когда-то он вдохновлял многих солдат и охотников; возможно, он вдохновит и снова."
 building_jerusalem_muslim_zawiya_03: "Расширенная завия Ахмада"
 building_jerusalem_muslim_zawiya_03_desc: "Братство воспользовалось недавним расширением своего дома, чтобы завербовать новых братьев и начать готовить их к войне."
 building_jerusalem_muslim_zawiya_04: "Освящённая Завия Ахмада"
 building_jerusalem_muslim_zawiya_04_desc: "После недавнего повторного освящения и других улучшений эта завия поистине прославляет того, в честь кого названа: Ахмада ибн Харба, «Сына войны». Из её залов выходит организованная и преданная сила, готовая защищать и расширять эти земли."
 JERUSALEM_MUSLIM_ZAWIYA: "[GetBuilding('building_jerusalem_muslim_zawiya_04').GetName]"

 building_type_jerusalem_muslim_madrasa_01: "Медресе Зу-н-Нуна"
 building_type_jerusalem_muslim_madrasa_01_desc: "#F $building_jerusalem_muslim_madrasa_02_desc$#!"
 building_jerusalem_muslim_madrasa_01: "Медресе Зу-н-Нуна"
 building_jerusalem_muslim_madrasa_01_desc: "Названное в честь важного, но в основном забытого религиозного лидера, медресе служит учебным заведением как по светским, так и по религиозным вопросам."
 building_jerusalem_muslim_madrasa_02: "Обновлённое медресе Зу-н-Нуна"
 building_jerusalem_muslim_madrasa_02_desc: "После недавних ремонтных работ медресе Зу-н-Нуна вновь напоминает людям о древнем мистике и святом. Когда-то он вдохновлял многих учёных и охотников; возможно, он вдохновит и снова."
 building_jerusalem_muslim_madrasa_03: "Расширенное медресе Зу-н-Нуна"
 building_jerusalem_muslim_madrasa_03_desc: "Учёные воспользовались недавним расширением своего дома, чтобы провести несколько новых занятий по определённым мистическим искусствам."
 building_jerusalem_muslim_madrasa_04: "Освящённое медресе Зу-н-Нуна"
 building_jerusalem_muslim_madrasa_04_desc: "После недавнего повторного освящения и других улучшений это медресе поистине прославляет того, в честь кого названо: Зу-н-Нуна аль-Мисри. Из его залов выходит множество студентов, готовых применить свои знания по светским, религиозным и мистическим темам."
 JERUSALEM_MUSLIM_MADRASA: "[GetBuilding('building_jerusalem_muslim_madrasa_04').GetName]"
 POD_jerusalem_muslim_madrasa_bonus: "$EFFECT_LIST_BULLET$Пассивный [Concept('trait_level_track_xp', 'опыт')|E] [Concept('crafting_brewing', 'варки отваров')|E] #weak ([GetTrait('pod_crafter').GetName( GetNullCharacter )])#!: #P +0,25#!\n$EFFECT_LIST_BULLET$"

 building_type_jerusalem_muslim_al_yaqubi_01: "Мечеть аль-Якуби"
 building_type_jerusalem_muslim_al_yaqubi_01_desc: "#F $building_jerusalem_muslim_al_yaqubi_02_desc$#!"
 building_jerusalem_muslim_al_yaqubi_01: "Мечеть аль-Якуби"
 building_jerusalem_muslim_al_yaqubi_01_desc: "Названная в честь важного, но в основном забытого лидера, она служит обычной мечетью, хотя и поощряет исследования и изучение истории."
 building_jerusalem_muslim_al_yaqubi_02: "Обновлённая мечеть аль-Якуби"
 building_jerusalem_muslim_al_yaqubi_02_desc: "После недавних ремонтных работ мечеть аль-Якуби вновь напоминает людям о древнем историке и географе. Когда-то он вдохновлял многих исследователей и охотников; возможно, он вдохновит и снова."
 building_jerusalem_muslim_al_yaqubi_03: "Расширенная мечеть аль-Якуби"
 building_jerusalem_muslim_al_yaqubi_03_desc: "Исследователи, торговцы и историки воспользовались недавним расширением мечети, чтобы стимулировать исследования, собирать устные рассказы и распространять имя покровителя мечети."
 building_jerusalem_muslim_al_yaqubi_04: "Освящённая мечеть аль-Якуби"
 building_jerusalem_muslim_al_yaqubi_04_desc: "$building_jerusalem_muslim_al_yaqubi_01_desc$"
 JERUSALEM_MUSLIM_AL_YAQUBI: "[GetBuilding('building_jerusalem_muslim_al_yaqubi_04').GetName]"

 building_type_jerusalem_muslim_al_khanqah_salahiyya_01: "Мечеть аль-Ханка ас-Салахия"
 building_type_jerusalem_muslim_al_khanqah_salahiyya_01_desc: "#F $building_jerusalem_muslim_al_khanqah_salahiyya_02_desc$#!"
 building_jerusalem_muslim_al_khanqah_salahiyya_01: "Мечеть аль-Ханка ас-Салахия"
 building_jerusalem_muslim_al_khanqah_salahiyya_01_desc: "Мечеть, названная в честь Салах ад-Дина Юсуфа ибн Айюба, является обычной мечетью и хранит память о его пребывании здесь.  По углам сохранились остатки ханаки."
 building_jerusalem_muslim_al_khanqah_salahiyya_02: "Обновлённая мечеть аль-Ханка ас-Салахия"
 building_jerusalem_muslim_al_khanqah_salahiyya_02_desc: "После недавней реконструкции мечеть аль-Ханка ас-Салахийя вновь напоминает людям о великом полководце и султане, сохраняя при этом традиции ханаки. Он вдохновлял многих правителей и охотников. Возможно, это место сыграет свою роль в сохранении его наследия."
 building_jerusalem_muslim_al_khanqah_salahiyya_03: "Расширенная мечеть аль-Ханка ас-Салахия"
 building_jerusalem_muslim_al_khanqah_salahiyya_03_desc: "Местные власти воспользовались недавним расширением мечети, чтобы укрепить свой авторитет и увековечить собственные легенды."
 building_jerusalem_muslim_al_khanqah_salahiyya_04: "Освящённая мечеть аль-Ханка ас-Салахия"
 building_jerusalem_muslim_al_khanqah_salahiyya_04_desc: "После недавней реконструкции и других улучшений эта мечеть по праву носит имя своего основателя — Салах ад-Дина Юсуфа ибн Айюба. В его время мечеть служила жильем для его военачальников и была его личным духовным пристанищем. Его наследие служит ориентиром для будущих султанов и правителей, когда они строят планы на будущее."
 JERUSALEM_MUSLIM_AL_KHANQAH_SALAHIYYA: "[GetBuilding('building_jerusalem_muslim_al_khanqah_salahiyya_04').GetName]"



 building_type_pit_of_malkav_01: "Яма Кетеф-Хиннома"
 building_type_pit_of_malkav_01_desc: "#F Под Иерусалимом лежит открытая пропасть. Даже приближаться к ней больно. Кажется, что голова вот-вот взорвётся.#!"
 building_pit_of_malkav_01: "Открытая яма Кетеф-Хиннома"
 building_pit_of_malkav_01_desc: "Так много голосов, говорящих о противоречащих вещах... хотя в некоторых из них всё же можно разглядеть слабые грани мудрости."
 building_pit_of_malkav_02: "Сокрытая яма Кетеф-Хиннома"
 building_pit_of_malkav_02_desc: "Яма завалена камнями, и голоса теперь звучат не так яростно. Вы стали лучше понимать их."
 building_pit_of_malkav_03: "Закрытая яма Кетеф-Хиннома"
 building_pit_of_malkav_03_desc: "Голоса теперь звучат тихо, если только вы не находитесь очень близко к самой яме. Находясь рядом с ней, вы теперь с лёгкостью отделяете безумные голоса от проницательных."
 building_pit_of_malkav_04: "Освящённая яма Кетеф-Хиннома"
 building_pit_of_malkav_04_desc: "Там, где когда-то звучали безумные голоса, теперь ветер шепчет гимны. Там, где когда-то на эту святую землю изливалось безумие, теперь изливаются благословения и мудрость. Там, где когда-то злое чудовище опустошало умы всех, кто был поблизости, теперь с земли доносятся молитвы. Там, где когда-то хищная пасть пожирала неосторожных и грешных, теперь верующие совершают паломничества в величественный храм, построенный на некогда нечестивом месте."
 POD_requirements_purified_pit_malkav: "[Concept('holder', 'Владелец')|E] должен иметь свойство «[GetTrait('supehunter').GetName( GetPlayer )]» и очистить Яму через [Concept('decision', 'решение')|E]."