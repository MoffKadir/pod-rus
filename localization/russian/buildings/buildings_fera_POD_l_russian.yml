 building_type_temple_bast_01: "Храм Баст"
 building_type_temple_bast_01_desc: "#F Давно прошли те времена, когда детям Баст поклонялись как богам древние египтяне. Однако Бубасти не забыли об этом и однажды поставят человечество на колени, где им и место.#!"
 building_temple_bast_01: "Малый храм Баст"
 building_temple_bast_01_desc: "Давно прошли те времена, когда детям Баст поклонялись как богам древние египтяне. Однако Бубасти не забыли об этом и однажды поставят человечество на колени, где им и место."
 building_temple_bast_02: "Храм Баст"
 building_temple_bast_02_desc: "$building_temple_bast_01$"
 building_temple_bast_03: "Большой храм Баст"
 building_temple_bast_03_desc: "$building_temple_bast_01$"


 building_type_samhain_grounds_01: "Площадка самхайна"
 building_type_samhain_grounds_01_desc: "#F Несмотря на свое шаткое положение, цейликан по-прежнему упиваются своими экстремальными страстями, используя свой традиционный праздник Самхайн, чтобы заманить смертных (и других людей) в такое же безумие эмоций.#!"
 building_samhain_grounds_01: "Малая площадка самхайна"
 building_samhain_grounds_01_desc: "Несмотря на свое шаткое положение, цейликан по-прежнему упиваются своими экстремальными страстями, используя свой традиционный праздник Самхайн, чтобы заманить смертных (и других людей) в такое же безумие эмоций."
 building_samhain_grounds_02: "Площадка самхайна"
 building_samhain_grounds_02_desc: "$building_samhain_grounds_01_desc$"
 building_samhain_grounds_03: "Большая площадка самхайна"
 building_samhain_grounds_03_desc: "$building_samhain_grounds_01_desc$"


 building_type_warrior_scholar_lodge_01: "Ложа воинов-учёных"
 building_type_warrior_scholar_lodge_01_desc: "#F Хан стремятся к совершенству в себе, как разума, так и тела, чтобы подавать пример нации Бастет.#!"
 building_warrior_scholar_lodge_01: "Малая ложа воинов-учёных"
 building_warrior_scholar_lodge_01_desc: "Хан стремятся к совершенству в себе, как разума, так и тела, чтобы подавать пример нации Бастет."
 building_warrior_scholar_lodge_02: "Ложа воинов-учёных"
 building_warrior_scholar_lodge_02_desc: "$building_warrior_scholar_lodge_01_desc$"
 building_warrior_scholar_lodge_03: "Великая ложа воинов-учёных"
 building_warrior_scholar_lodge_03_desc: "$building_warrior_scholar_lodge_01_desc$"


 building_type_feline_throne_01: "Трон царей кошек"
 building_type_feline_throne_01_desc: "#F Симба считают себя законными правителями кошачьего рода. Их высокомерие граничит с жестокостью, когда кто-то оспаривает это утверждение.#!"
 building_feline_throne_01: "Незначительный трон царей кошек"
 building_feline_throne_01_desc: "Симба считают себя законными правителями кошачьего рода. Их высокомерие граничит с жестокостью, когда кто-то оспаривает это утверждение."
 building_feline_throne_02: "Трон царей кошек"
 building_feline_throne_02_desc: "$building_feline_throne_01_desc$"
 building_feline_throne_03: "Величественный трон царей кошек"
 building_feline_throne_03_desc: "$building_feline_throne_01_desc$"



 building_type_chui_mal_01: "Чуй Мал"
 building_type_chui_mal_01_desc: "#F Багира - самое близкое к человечеству племя бастет. По всей Индии такие общества, как Амбари Махо, Чуи Май, Берал Мейе и люди-леопарды Чупа, почитают их как дары небес.#!"
 building_chui_mal_01: "Чуй Мал"
 building_chui_mal_01_desc: "Багира - самое близкое к человечеству племя бастет. По всей Индии такие общества, как Амбари Махо, Чуи Май, Берал Мейе и люди-леопарды Чупа, почитают их как дары небес. Они готовы отдать жизнь за своих божеств."

 building_type_temple_bastet_01: "Храмовый комплекс бастет"
 building_type_temple_bastet_01_desc: "#F Храм бастет в Саккаре был построен на обширной территории к юго-востоку от пирамиды Тети. Он включал в себя святилище богини, ее культовый комплекс и катакомбы. Его разрушение сетитами ознаменовало конец господства Бубасти в египетской политике.#!"
 building_temple_bastet_01: "Храмовый комплекс бастет"
 building_temple_bastet_01_desc: "Храм бастет в Саккаре был построен на обширной территории к юго-востоку от пирамиды Тети. Он включал в себя святилище богини, ее культовый комплекс и катакомбы. Его разрушение сетитами ознаменовало конец господства Бубасти в египетской политике."

 building_type_ransacked_court_samhach_01: "Разграбленный двор самхах"
 building_type_ransacked_court_samhach_01_desc: "#F Разобравшись со своими заклятыми врагами-самхах и освободив наконец своих пленных сородичей, цейликан наконец-то могут насладиться всеми радостями жизни, как они так долго хотели. А что может быть лучше, чем бесконечная пирушка в руинах двора их павшего врага?#!"
 building_ransacked_court_samhach_01: "Разграбленный двор Самхаха"
 building_ransacked_court_samhach_01_desc: "Разобравшись со своими заклятыми врагами-самхах и освободив наконец своих пленных сородичей, цейликан наконец-то могут насладиться всеми радостями жизни, как они так долго хотели. А что может быть лучше, чем бесконечная пирушка в руинах двора их павшего врага?"

 building_type_court_bright_kings_01: "Двор светлых королей"
 building_type_court_bright_kings_01_desc: "#F Что бы ни делали хан, они делают это с полной отдачей, будь то бой, охота или даже созерцание. Двор светлых королей отражает эту безрассудную страсть, кипящую жизненной силой и энергией.#!"
 building_court_bright_kings_01: "Двор светлых королей"
 building_court_bright_kings_01_desc: "Что бы ни делали хан, они делают это с полной отдачей, будь то бой, охота или даже созерцание. Двор светлых королей отражает эту безрассудную страсть, кипящую жизненной силой и энергией."

 building_type_throne_sunlight_01: "Трон солнечного света"
 building_type_throne_sunlight_01_desc: "#F Подобно пылающим гривам на головах своих королей, симба сравнивают себя с солнцем. Для других племен они - «темные короли», тираны, устанавливающие порядок с помощью запугивания и страха.#!"
 building_throne_sunlight_01: "Трон солнечного света"
 building_throne_sunlight_01_desc: "Подобно пылающим гривам на головах своих королей, симба сравнивают себя с солнцем. Для других племен они - «темные короли», тираны, устанавливающие порядок с помощью запугивания и страха."

 building_type_silver_refuge_01: "Серебряное убежище"
 building_type_silver_refuge_01_desc: "#F Свара, или Серебряный народ, как они себя называют, - неутомимые целители духовно заряженных мест. Их скорость и преданность своему предназначению сияют в этом мирном и успокаивающем убежище.#!"
 building_silver_refuge_01: "Серебряное убежище"
 building_silver_refuge_01_desc: "Свара, или Серебряный народ, как они себя называют, - неутомимые целители духовно заряженных мест. Их скорость и преданность своему предназначению сияют в этом мирном и успокаивающем убежище."




 ####Mokole

 building_type_scaled_encampment_01: "Чешуйчатый лагерь"
 building_type_scaled_encampment_01_desc: "Воины моколе проводят время, обмениваясь ударами по толстой шкуре друг друга."
 building_scaled_encampment_01: "Небольшой чешуйчатый лагерь"
 building_scaled_encampment_01_desc: "Время от времени слышен лязг металла, когда моколе готовятся к бою."
 building_scaled_encampment_02: "Чешуйчатый лагерь"
 building_scaled_encampment_02_desc: "Устрашающие боевые кличи ящеров наполняют воздух, когда громадные воины сражаются друг с другом.$POD_fera_requirements_development_below_t2$"
 building_scaled_encampment_03: "Большой чешуйчатый лагерь"
 building_scaled_encampment_03_desc: "Звуки оружия, когтей и всевозможного оружия Архид повторяются хором на протяжении многих дней.$POD_fera_requirements_development_below_t3$"

 building_type_saurian_armory_01: "Оружейная ящеров"
 building_type_saurian_armory_01_desc: "Иногда надёжный меч в ящике так же эффективен, как когти Архид."
 building_saurian_armory_01: "Небольшая оружейная ящеров"
 building_saurian_armory_01_desc: "Стены этой оружейной украшены несколькими искусно выкованными клинками."
 building_saurian_armory_02: "Оружейная ящеров"
 building_saurian_armory_02_desc: "Более острый меч, более прочный щит. Всё, что угодно, лишь бы продлить жизнь воина.$POD_fera_requirements_development_below_t2$"
 building_saurian_armory_03: "Большая оружейная ящеров"
 building_saurian_armory_03_desc: "Древние мечи, копья, булавы и топоры моколе украшают этот зал. Они только и ждут, когда кто-нибудь из них возьмёт их в руки.$POD_fera_requirements_development_below_t3$"

 building_type_hall_elders_01: "Зал старейшин"
 building_type_hall_elders_01_desc: "Являясь памятью Геи, моколе помнят и старательно передают эти знания следующему поколению."
 building_hall_elders_01: "Малый зал старейшин"
 building_hall_elders_01_desc: "Даже один уважаемый старейшина - это благо для общины моколе."
 building_hall_elders_02: "Зал старейшин"
 building_hall_elders_02_desc: "Тем, кто ближе к королям-ящерам, чем мы, предстоит многому научиться.$POD_fera_requirements_development_below_t2$"
 building_hall_elders_03: "Большой зал старейшин"
 building_hall_elders_03_desc: "Здесь можно услышать, как воспоминания, возникшие задолго до Эпохи людей, пересказываются в ярких образах.$POD_fera_requirements_development_below_t3$"

 building_type_crafters_district_01: "Ремесленный квартал"
 building_type_crafters_district_01_desc: "Моколе - уважаемые ремесленники в мире перевёртышей. Некоторые из их творений пережили многие эпохи."
 building_crafters_district_01: "Небольшой ремесленный квартал"
 building_crafters_district_01_desc: "Самый минимум для растущего сообщества моколе, но при этом он по-прежнему является уважаемой опорой общественной жизни в этом районе."
 building_crafters_district_02: "Ремесленный квартал"
 building_crafters_district_02_desc: "Цены на некоторые из представленных товаров могут показаться высокими, но они свидетельствуют о таланте ремесленников моколе за работой.$POD_fera_requirements_development_below_t2$"
 building_crafters_district_03: "Большой ремесленный квартал"
 building_crafters_district_03_desc: "Чужеземные правители с гордостью носят изделия из этого квартала, не подозревая о происхождении их чешуйчатых создателей.$POD_fera_requirements_development_below_t3$"

 building_type_nest_defences_01: "Оборона гнезда"
 building_type_nest_defences_01_desc: "Кто был бы настолько глуп, чтобы напасть на логово моколе? Кто-то очень храбрый... или очень отчаянный."
 building_nest_defences_01: "Слабая оборона гнезда"
 building_nest_defences_01_desc: "Несколько патрулей, несколько деревянных заграждений... это убежище в основном полагается на силу своих защитников."
 building_nest_defences_02: "Оборона гнезда"
 building_nest_defences_02_desc: "Хотя это гнездо и не является по-настоящему могущественным замком, в нём царит дисциплина и достаточно припасов, чтобы защитить себя в случае необходимости.$POD_fera_requirements_development_below_t2$"
 building_nest_defences_03: "Сильная оборона гнезда"
 building_nest_defences_03_desc: "Настоящая крепость древних королей-ящеров, пробить которую может только метеорит.$POD_fera_requirements_development_below_t3$"

 building_type_fields_strife_01: "Поля раздора"
 building_type_fields_strife_01_desc: "Воины Энтобана терпели неудачи, но нанесли гораздо больше потерь, чем понесли сами. Этот неукротимый дух продолжает жить."
 building_fields_strife_01: "Небольшие поля раздора"
 building_fields_strife_01_desc: "Завтрашние победы строятся на сегодняшнем режиме тренировок."
 building_fields_strife_02: "Поля раздора"
 building_fields_strife_02_desc: "Дисциплинированный моколе-мбембе, смотрящий на вас сверху вниз, пожалуй, более устрашающее зрелище, чем свирепый зверь, бросающийся на вас.$POD_fera_requirements_development_below_t2$"
 building_fields_strife_03: "Огромные поля раздора"
 building_fields_strife_03_desc: "Воспроизводя некоторые из славных сражений своего прошлого, моколе-мбембе совершенствуют свою тактику для сражений завтрашнего дня.$POD_fera_requirements_development_below_t3$"

 building_type_dry_den_01: "Сухое логово"
 building_type_dry_den_01_desc: "Дети Радужного змея живут изолированно и в суровых условиях. Они извлекают из этого максимум пользы."
 building_dry_den_01: "Небольшое сухое логово"
 building_dry_den_01_desc: "Для хладнокровных людоящеров пустыня - всего лишь упрямый друг."
 building_dry_den_02: "Сухое логово"
 building_dry_den_02_desc: "Посетители этого места немногочисленны, и это то, что Гумаган с радостью сохраняют таким, какое оно есть.$POD_fera_requirements_development_below_t2$"
 building_dry_den_03: "Огромное сухое логово"
 building_dry_den_03_desc: "Если Солнце является покровителем моколе в целом, то Гумаган - это те, кто понимает его больше всего.$POD_fera_requirements_development_below_t3$"

 building_type_motley_haunt_01: "Пёстрое пристанище"
 building_type_motley_haunt_01_desc: "Течение воздуха - самые близкие к человечеству моколе, они прислушиваются и понимают о современном мире больше, чем многие их коллеги."
 building_motley_haunt_01: "Небольшое пёстрое пристанище"
 building_motley_haunt_01_desc: "Солнце - это свет, но солнце также и просветление. Мудрые Макара знают разницу."
 building_motley_haunt_02: "Пёстрое пристанище"
 building_motley_haunt_02_desc: "Здесь звучат беседы об Агни, а успокаивающий звук огня успокаивает умы его обитателей.$POD_fera_requirements_development_below_t2$"
 building_motley_haunt_03: "Огромное пёстрое пристанище"
 building_motley_haunt_03_desc: "Некоторые из величайших дипломатов моколе обучались здесь под мудрым космическим руководством Дзии.$POD_fera_requirements_development_below_t3$"

 building_type_dragon_temple_01: "Храм дракона"
 building_type_dragon_temple_01_desc: "Течение воды наблюдает за окружающим миром и размышляет. Их мысли могут быть ключом к сохранению космического равновесия."
 building_dragon_temple_01: "Небольшой храм дракона"
 building_dragon_temple_01_desc: "Прародители королей-драконов издалека наблюдают за усилиями своих преемников."
 building_dragon_temple_02: "Храм дракона"
 building_dragon_temple_02_desc: "В то время как его обитатели ценят уединение, здесь родились легенды о мудрых и могущественных драконах.$POD_fera_requirements_development_below_t2$"
 building_dragon_temple_03: "Огромный храм дракона"
 building_dragon_temple_03_desc: "Храбрый человек ищет дракона, который обещает ему сокровища. Мудрый человек вместо этого ищет обещания просветления.$POD_fera_requirements_development_below_t3$"


 building_type_crocodilopolis_01: "Крокодилополь"
 building_type_crocodilopolis_01_desc: "Крокодилополь, некогда бывший центром почитания могущественного Собека, стал остатком того благоговейного страха, который короли ящеров внушали человечеству."
 building_crocodilopolis_01: "Разрушенный Крокодилополь"
 building_crocodilopolis_01_desc: "Когда-то в городе поклонялись прирученному священному крокодилу Петсухосу, «Сыну Сухоса», которого украшали золотыми подвесками и драгоценными камнями. С тех пор о нём уже давно забыли."
 building_crocodilopolis_02: "Восстановленный Крокодилополь"
 building_crocodilopolis_02_desc: "Аменемхет III создал ту часть города, которая была отведена священным крокодилам. Повлияли ли на него моколе? Ныне даже они не уверены."
 crocodilopolis_02_effect_desc: "Поиски в гробнице выявят двух древних [GetTrait('mokole').GetName(GetNullCharacter)|l]."
 building_crocodilopolis_03: "Чудесный Крокодилополь"
 building_crocodilopolis_03_desc: "Говорят, что лабиринт Крокодилополя грандиознее и запутаннее, чем даже лабиринты пирамид. Кто знает, что или кто находится внутри?"
 crocodilopolis_03_effect_desc: "Обнаружена последняя гробница [GetTrait('mokole').GetName(GetNullCharacter)|l]."

 building_type_oogleforp_01: "Углфорп"
 building_type_oogleforp_01_desc: "Именно на берегах Нила моколе сражались за [Glossary('Осирианскую лигу', 'glossary_osirian_league_tt')]. Несмотря на то, что тогда они потерпели поражение, у них достаточно терпения, чтобы дождаться подходящего момента для реванша."
 building_oogleforp_01: "Перестроенный Углфорп"
 building_oogleforp_01_desc: "Место неповиновения скверне Детей Змеи. Возможно, это начало новой истории."
 building_oogleforp_02: "Углфорп"
 building_oogleforp_02_desc: "Воспоминания о славном прошлом сталкиваются с мрачным настоящим, но, возможно, являются ключом к светлому будущему."
 building_oogleforp_03: "Великий Углфорп"
 building_oogleforp_03_desc: "В Углфорпе снова можно увидеть готовых к бою моколе. Без своего проклятого прародителя Сетиты снова научатся бояться королей-ящеров."
 oogleforp_03_effect_desc: "Форма Архид получает: [GetModifier('archid_glittering_scales_modifier').GetNameWithTooltip]"


 building_type_umbral_lake_tele_01: "Умбральное озеро Теле"
 building_type_umbral_lake_tele_01_desc: "Родина Моколе-Мбембе давно исчезла из поля зрения смертных, и её хранитель предпочёл перенести её в Умбру, подальше от любопытных глаз."
 building_umbral_lake_tele_01: "Окутанное озеро Теле"
 building_umbral_lake_tele_01_desc: "Суровые климатические условия Умбры ухудшают состояние озера Теле, вынуждая обитателей-моколе использовать ценные ресурсы для поддержания его функционирования."
 building_umbral_lake_tele_02: "Сокрытое озеро Теле"
 building_umbral_lake_tele_02_desc: "Теперь, когда ситуация стабилизировалась, озеро Теле стало тихим местом для тех, кто хочет приобщиться к мудрости своего прародителя, Моколе-Мбембе."
 building_umbral_lake_tele_03: "Умбральное озеро Теле"
 building_umbral_lake_tele_03_desc: "Новая процветающая столица моколе, озеро Теле, стало источником вдохновения для тех, кто хочет ещё раз увидеть величие королей-ящеров."


 building_type_oannes_01: "Оаннес"
 building_type_oannes_01_desc: "Однажды некоторые моколе увидели потенциал в развитии человечества. Именно здесь они решили научить его, как духовно вырасти из своего животного состояния."
 building_oannes_01: "Перестроенный Оаннес"
 building_oannes_01_desc: "Смертные до сих пор помнят, как Оаннес пришёл из-за моря, чтобы обучать людей искусству и философии. Моколе только улыбаются при этой мысли."
 building_oannes_02: "Оаннес"
 building_oannes_02_desc: "Оаннес стал синонимом слова «мудрый» для обозначения благоговейных людей, которых обучали моколе. Возможно, это воспоминание можно будет использовать снова."
 building_oannes_03: "Великий Оаннес"
 building_oannes_03_desc: "Город, человек или бог, Оаннес по-прежнему занимает почётное место в памяти моколе. Несмотря на то, что эксперимент закончился печально, он всё же показал возможность сотрудничества человечества с королями-ящерами."


 building_type_rainbow_stone_01: "Радужный камень"
 building_type_rainbow_stone_01_desc: "#F Радужный камень, символ Радужной змеи и источник силы для Гумаган.#!"
 building_rainbow_stone_01: "Радужный камень"
 building_rainbow_stone_01_desc: "Радужный камень, символ Радужной змеи и источник силы для Гумаган. Хотя он традиционно остаётся в Бандайяне, его можно перенести, когда течению нужен символ сплочения на пути к общей цели."


 building_type_sacred_sky_temple_01: "Священный Небесный храм"
 building_type_sacred_sky_temple_01_desc: "Если мы хотим восславить солнце, то сначала должны найти подходящее место, чтобы смотреть на него."
 building_sacred_sky_temple_01: "Небесный храм"
 building_sacred_sky_temple_01_desc: "Самый маленький проход к самому великому из покровителей."
 building_sacred_sky_temple_02: "Большой Небесный храм"
 building_sacred_sky_temple_02_desc: "Если они устремятся к небу, возможно, однажды они смогут достичь его. Видят ли они это в Мнезисе?"
 building_sacred_sky_temple_03: "Священный Небесный храм"
 building_sacred_sky_temple_03_desc: "Подходящее сооружение для многих моколе, желающих погреться в лучах славы своего благодетеля."

 building_type_sacred_crocodile_temple_01: "Священный храм Крокодила"
 building_type_sacred_crocodile_temple_01_desc: "Друзья из числа родни моколе когда-то поклонялись им как богам. В этом месте им снова оказывают эту честь."
 building_sacred_crocodile_temple_01: "Храм Крокодила"
 building_sacred_crocodile_temple_01_desc: "Найдя место по своему вкусу, некоторые крокодилы, похоже, заселяют пространство, которое однажды станет храмом их славы."
 building_sacred_crocodile_temple_02: "Большой храм Крокодила"
 building_sacred_crocodile_temple_02_desc: "Смертные собираются, чтобы засвидетельствовать почтение чешуйчатым богам, будь то те, что на четырёх ногах, или те, что на двух."
 building_sacred_crocodile_temple_03: "Священный храм Крокодила"
 building_sacred_crocodile_temple_03_desc: "Очевидно, понимая, какое уважение и поклонение им здесь оказывают, всё больше и больше крокодилов собираются в окрестностях храма под бдительным присмотром стражей-моколе."

 building_type_sacred_eighth_sun_temple_01: "Священный храм Восьми солнц"
 building_type_sacred_eighth_sun_temple_01_desc: "В наши дни могучим моколе оказывают должное уважение лишь в нескольких отдалённых местах. Это одно из таких мест."
 building_sacred_eighth_sun_temple_01: "Храм Восьми солнц"
 building_sacred_eighth_sun_temple_01_desc: "Ищут ли они благодеяний или испытывают первобытный страх человечества перед королями-ящерами?"
 building_sacred_eighth_sun_temple_02: "Большой храм Восьми солнц"
 building_sacred_eighth_sun_temple_02_desc: "Учитывая, что вокруг так много смертных верующих, неудивительно, что и в этом районе начала возникать каста родни."
 building_sacred_eighth_sun_temple_03: "Священный храм Восьми солнц"
 building_sacred_eighth_sun_temple_03_desc: "Со своей роднёй, выступающей в роли жрецов и стражников, моколе почитаются как боги в этом престижном храме."

 building_type_sacred_scorched_temple_01: "Священный выжженный храм"
 building_type_sacred_scorched_temple_01_desc: "Моколе не любят показушных построек. Но иногда их внимание привлекает конкретное место, часто богатое энергией или, казалось бы, благословлённое солнцем. Тогда начинается работа."
 building_sacred_scorched_temple_01: "Выжженный храм"
 building_sacred_scorched_temple_01_desc: "Растущий храм, всё ещё небольшой по высоте, возвышающийся над бескрайней пустыней и бескрайним морем вдалеке."
 building_sacred_scorched_temple_02: "Большой выжженный храм"
 building_sacred_scorched_temple_02_desc: "Возможно, именно здесь, между песком и морем, можно найти истинное равновесие. По крайней мере, моколе находят этот район очень подходящим для своего положения."
 building_sacred_scorched_temple_03: "Священный выжженный храм"
 building_sacred_scorched_temple_03_desc: "Это впечатляющее здание, ставшее одним из самых могущественных храмов королей-ящеров, является свидетельством терпения и усердия Детей Солнца."