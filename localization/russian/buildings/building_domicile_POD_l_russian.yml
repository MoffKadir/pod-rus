 belial_throne_shang_cultists_domicile_building: "Добродетель безграничной глубины"
 belial_throne_shang_cultists_domicile_building_desc: "#weak (Требуется [GetDomicileBuilding('belial_throne_01').GetName])#!\nВпервые призванный магами династии Шан, Велиал привык к тому, что ему служат высококвалифицированные и престижные рабы."
 belial_throne_elite_cults_domicile_building: "Элитные культы"
 belial_throne_elite_cults_domicile_building_desc: "#weak (Требуется [GetDomicileBuilding('belial_throne_01').GetName])#!\nВелиал всегда предпочитал качество количеству. Его культы, несмотря на малочисленность, были очень способными и преданными."
 belial_throne_unlimited_hatred_domicile_building: "Вечная ненависть"
 belial_throne_unlimited_hatred_domicile_building_desc: "#weak (Требуется [GetDomicileBuilding('belial_throne_01').GetName])#!\nНенависть Велиала к Люциферу вошла в легенду. По его мнению, всё Мироздание могло сгореть дотла, если бы это означало уничтожение Утренней Звезды."
