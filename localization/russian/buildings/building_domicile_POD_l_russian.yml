 dagon_throne_lord_of_genhinnom_domicile_building: "Владыка Генхиннома"
 dagon_throne_lord_of_genhinnom_domicile_building_desc: "#weak (Требуется [GetDomicileBuilding('dagon_throne_01').GetName])#!\nДагон и его легион построили огромные бастионы, включая сам Генхинном. Чёрный собор был величайшей крепостью восставших и домом самого Люцифера."
 dagon_throne_lord_of_shanmukha_domicile_building: "Повелитель Шанмукха"
 dagon_throne_lord_of_shanmukha_domicile_building_desc: "#weak (Требуется [GetDomicileBuilding('dagon_throne_01').GetName])#!\nПоследователи Дагона в Мохенджо-Даро были известны как Шанмукха. Он наделил их знаниями, превратив в культ безумных зодчих."
 dagon_throne_that_withstands_lightning_domicile_building: "Тот, кто выдержал удар молнии"
 dagon_throne_that_withstands_lightning_domicile_building_desc: "#weak (Требуется [GetDomicileBuilding('dagon_throne_01').GetName])#!\nРеликварий Дагона представляет собой массивную, богохульную, странную каменную машину с зубчатыми колёсами и магматическими рычагами, на которых вырезаны богохульные молитвы. Техника - это его область, и будущее, которое он готовит человечеству."
