 kj_east_direction_harvesters_domicile_building: "Восточные жнецы"
 kj_east_direction_harvesters_domicile_building_desc: "#weak (Требуется [GetDomicileBuilding('kj_east_direction_01').GetName])#!\nИногда смертные превосходят свои возможности и требуют вашего личного внимания. Жнецы стараются как можно скорее выявить таких смертных."
 kj_east_direction_farmers_domicile_building: "Восточные фермеры"
 kj_east_direction_farmers_domicile_building_desc: "#weak (Требуется [GetDomicileBuilding('kj_east_direction_01').GetName])#!\nСмертные - существа нуждающиеся. Поддерживать их здоровье и продуктивность - задача этих [Glossary('куэй-дзин','game_concept_kuei_jin_desc')]."
