 abbadon_throne_01_domicile_building: "Трон Аваддона"
 abbadon_throne_01_domicile_building_desc: "«Крылатая грация», серафим из Чёрного легиона, был одним из первых, кто присоединился к Люциферу, и одним из первых, кто предал его. Его легион сражался, проливал кровь и убивал больше, чем любой другой."
