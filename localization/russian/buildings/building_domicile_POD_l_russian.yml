 azrael_throne_angel_shadows_domicile_building: "Ангел теней"
 azrael_throne_angel_shadows_domicile_building_desc: "#weak (Требуется [GetDomicileBuilding('azrael_throne_01').GetName])#!\nСотворив второй мир без присмотра Бога или Люцифера, Азраил, таким образом, сыграл важную роль в рождении того, что впоследствии стало известно как Загробный мир."
 azrael_throne_heitsi_eibib_domicile_building: "Хэйци-Эйбиб"
 azrael_throne_heitsi_eibib_domicile_building_desc: "#weak (Требуется [GetDomicileBuilding('azrael_throne_01').GetName])#!\nКульт Азраила был известен своей склонностью к наукам, изучением некромантии и других запрещённых практик, чтобы угодить своему покровителю."
 azrael_throne_scarecrow_domicile_building: "Пугало"
 azrael_throne_scarecrow_domicile_building_desc: "#weak (Требуется [GetDomicileBuilding('azrael_throne_01').GetName])#!\nРеликварий Азраила представляет собой эффигию-пугало, сделанную из тысяч костей, скелет которой задрапирован серой тканью, а глаза украшены изогнутыми изумрудами."
