 tower_of_pride_01_domicile_building: "Вавилонская башня"
 tower_of_pride_01_domicile_building_desc: "#italic Посему дано ему имя: Вавилон, ибо там смешал Господь язык всей земли, и оттуда рассеял их Господь по всей земле.#!"
 treasury_of_avarice_01_domicile_building: "Золотой телец"
 treasury_of_avarice_01_domicile_building_desc: "#italic Они думают только о Маммоне, чей бог - кошель.#!"
 pit_of_wrath_01_domicile_building: "Яма гнева"
 pit_of_wrath_01_domicile_building_desc: "#italic Гневаясь, не согрешайте: солнце да не зайдёт во гневе вашем; и не давайте места диаволу.#!"
 hall_of_gluttony_01_domicile_building: "Зал чревоугодия"
 hall_of_gluttony_01_domicile_building_desc: "#italic Ибо многие, о которых я часто говорил вам, а теперь даже со слезами говорю, поступают как враги креста Христова. Их конец – погибель, их бог – чрево, и слава их - в сраме, они мыслят о земном.#!"
