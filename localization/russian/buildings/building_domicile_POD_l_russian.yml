 asmodeus_throne_lord_of_anthropomancy_domicile_building: "Владыка антропомантии"
 asmodeus_throne_lord_of_anthropomancy_domicile_building_desc: "#weak (Требуется [GetDomicileBuilding('asmodeus_throne_01').GetName])#!\nИзначально призванный кабалом шумерских царских магов, Асмодей обещает видения будущего художникам и учёным, которые присягнут ему на верность."
 asmodeus_throne_fear_humanity_domicile_building: "Страх перед человечеством"
 asmodeus_throne_fear_humanity_domicile_building_desc: "#weak (Требуется [GetDomicileBuilding('asmodeus_throne_01').GetName])#!\nИменно страх Асмодея перед тем, что человечество превзойдёт Небесное воинство, заставил его попытаться втянуть их в эксперименты нефилимов. Вскоре он осознал, какую серьёзную ошибку совершил."
 domicile_building_parameter_improved_nephilim_parameters: "Ваши #TOOLTIP:GAME_TRAIT,nephilim,[GetNullCharacter] #L нефилимы#!#! получат положительное физическое свойство при рождении, если у них его ещё нет"
 asmodeus_throne_rome_china_domicile_building: "От Рима до Китая"
 asmodeus_throne_rome_china_domicile_building_desc: "#weak (Требуется [GetDomicileBuilding('asmodeus_throne_01').GetName])#!\nБлагодаря своему влиянию на Римскую империю, Асмодей на некоторое время стал выдающимся эрцгерцогом. Его культ не имел себе равных среди его «братьев»."
 domicile_building_parameter_unlock_nephilim_parameter: "Ваши дети-#TOOLTIP:GAME_TRAIT,laham,[GetNullCharacter] #L лахамы#!#! вместо этого будут #TOOLTIP:GAME_TRAIT,nephilim,[GetNullCharacter] #L нефилимами#!#!, которые бессмертны, сильнее и могут использовать демонические [Concept('lore_lifestyle','знания')|E] #weak (если вы являетесь #TOOLTIP:GAME_TRAIT,demon,[GetNullCharacter] #L демоном#!#!)#!"
 domicile_building_parameter_increased_thrall_cap_parameter: "Максимальное количество ваших [Concept('thralls', 'рабов')|E] повышается на #V 1#!"

 azrael_throne_01_domicile_building: "Трон Азраила"
 azrael_throne_01_domicile_building_desc: "Культ Повелителя Алебастрового легиона процветал в богатом регионе Аксум, где ему поклонялись как богу смерти и загробного мира."
