 asmodeus_throne_01_domicile_building: "Трон Асмодея"
 asmodeus_throne_01_domicile_building_desc: "Эрцгерцог Серебряного легиона стоял за отчаянными и ужасающими действиями, которые привели к созданию нефилимов. Его грехопадение было жестоким и абсолютным."
