 abbadon_throne_fifth_domicile_building: "Повелитель мерзости"
 abbadon_throne_fifth_domicile_building_desc: "#weak (Требуется [GetDomicileBuilding('abbadon_throne_01').GetName])#!\nАваддон - повелитель плоти, её разложения и упадка. Он часто наделяет своих рабов как иммунитетом к болезням, так и способностью передавать их другим."
 abbadon_throne_lord_wrath_domicile_building: "Повелитель гнева"
 abbadon_throne_lord_wrath_domicile_building_desc: "#weak (Требуется [GetDomicileBuilding('abbadon_throne_01').GetName])#!\nАваддон - демон гнева, хотя он и сдерживает свою постоянную ярость с помощью нечеловеческого интеллекта, так что его истинная цель всегда первая падает перед его неудержимым неистовством."
 abbadon_throne_black_blood_tribe_domicile_building: "Племя Чёрной крови"
 abbadon_throne_black_blood_tribe_domicile_building_desc: "#weak (Требуется [GetDomicileBuilding('abbadon_throne_01').GetName])#!\nПлемя Чёрной крови было группой диких воинов, которые поклонялись Аваддону под личиной Локи. Эти викинги-захватчики нападали на бесчисленные города от Скандинавии до Англии, разграбляя поселение за поселением. Боевыми отрядами командовали одни из самых ценных рабов эрцгерцога, люди, искушённые в насилии и ужасе."
 abbadon_throne_thrall_strength_domicile_building: "Повелитель зверства"
 abbadon_throne_thrall_strength_domicile_building_desc: "#weak (Требуется [GetDomicileBuilding('abbadon_throne_01').GetName])#!\nАваддон может изменять форму плоти своих рабов или беспомощных невинных существ по своей прихоти, поражая их опухолями или разрывая на части мышечными спазмами. Он часто наделяет своих рабов нечеловеческой силой или выносливостью."
 abbadon_throne_vampire_thrall_domicile_building: "Эксперименты с вампирами"
 abbadon_throne_vampire_thrall_domicile_building_desc: "#weak (Требуется [GetDomicileBuilding('abbadon_throne_01').GetName])#!\nАваддон проявил интерес к каинитам, проводя эксперименты с кровью своих рабов, надеясь сделать её одновременно заразной и вызывающей привыкание у каинитов, чтобы завоевать их поклонение."
 domicile_building_parameter_abbadon_wrath_parameter: "После приказа [Concept('thrall', 'рабам')|E] отправиться на войну, они получат модификатор «[GetModifier('warfare_wrathful_strategy_modifier').GetNameWithTooltip]» на #V 5#! лет"
 domicile_building_parameter_black_blood_tribe_parameter: "Доступны [Concept('men_at_arms', 'профессионалы')|E] — [GetMaA('black_blood_tribe_maa').GetName]"
 domicile_building_parameter_thrall_strength_parameter: "Все ваши [Concept('thralls', 'рабы')|E] получат #V 5#! [Concept('prowess', 'доблести')|E]"
 domicile_building_parameter_vampire_thrall_parameter: "#TOOLTIP:GAME_TRAIT,vampire,[GetNullCharacter] #L Вампиры#!#! будут легче поддаваться [Concept('thrall', 'порабощению')|E]"

 black_blood_tribe_maa: "Племя Чёрной крови"
 black_blood_tribe_maa_desc: "Группа свирепых воинов, поклонявшихся Аваддону под личиной Локи. Во главе военных отрядов стояли самые ценные рабы эрцгерцога, люди, обученные методам насилия и ужаса. Чёрная кровь вступила в конфликт с местными гару."

 dagon_throne_01_domicile_building: "Трон Дагона"
 dagon_throne_01_domicile_building_desc: "Эрцгерцог Железного легиона на протяжении веков маскировался под дюжину богов и богинь. Огромная вера, которую он собрал, укрепила его замыслы и культы, как немногие другие."
