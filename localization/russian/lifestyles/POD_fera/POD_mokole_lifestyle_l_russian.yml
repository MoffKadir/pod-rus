 rulers_of_the_sky_perk_name: "Правители неба"
 RULERS_OF_THE_SKY_PERK_EFFECT: "Все принадлежащие вам [Concept('baronies', 'баронства')|E] с горами или пустынными горами получат модификатор «[GetModifier('POD_mokole_rulers_of_the_sky_modifier').GetNameWithTooltip]».\nЕсли у вас есть достоинство «[GetPerk('open_sun_bridge_perk').GetName(GetPlayer)]», удаляет ограничения на пункт назначения, в противном случае разблокирует [Concept('character_interaction', 'взаимодействие персонажа')|E] «Открыть солнечный мост»."
 draconic_rumination_perk_name: "Драконьи размышления"
