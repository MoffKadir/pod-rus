l_russian:



 ####Common Gifts####

 razor_claws_perk_name: "Острые когти"
 RAZOR_CLAWS_PERK_EFFECT: "#flavor Проводя когтями по камню, стали или какой-либо другой твёрдой поверхности, моколе оттачивает их до остроты бритвы.#!"
 talk_perk_name: "Речь"
 TALK_PERK_EFFECT: "Можно выучить #V 1#! дополнительный [Concept('language', 'язык')|E] без штрафов.\n#flavor Этот дар позволяет моколе говорить на любом человеческом языке, который он знает, находясь в форме Сухид или Архид.#!"
 blessings_of_the_nest_perk_name: "Благословения гнезда"
 BLESSINGS_OF_THE_NEST_PERK_EFFECT: "Доступны [Concept('men_at_arms', 'профессионалы')|E] — [GetMaA('crocodiles').GetName].\n#flavor Прошипев благословение на драконьем языке, моколе дарует дар плодородия.#!"
 mokole_axis_mundi_perk_name: "Axis Mundi"
 MOKOLE_AXIS_MUNDI_PERK_EFFECT: "#flavor Моколе тянется своим духом, чтобы ощутить присутствие Геи, сосредотачиваясь на своей Матери.#!"
 dragonfear_perk_name: "Драконий страх"
 DRAGONFEAR_PERK_EFFECT: "#flavor Моколе демонстрирует всю свою устрашающую мощь - скалит зубы или когти, рычит или просто зловеще нависает над врагом.#!"
 mokole_walking_between_worlds_perk_name: "Блуждание между мирами"
 MOKOLE_WALKING_BETWEEN_WORLDS_PERK_EFFECT: "#flavor Моколе может прорваться сквозь Барьер и войти в Умбру. Хотя ему следует опасаться [Concept('innocents', 'невинных')|E], пересекая её.#!"
 dragons_breath_perk_name: "Дыхание дракона"
 DRAGONS_BREATH_PERK_EFFECT: "Открывает новое движение в [Concept('single_combat_duel', 'поединке')|E].\n#flavor Моколе изрыгает огонь в своих врагов.#!"
 cocoon_perk_name: "Кокон"
 COCOON_PERK_EFFECT: "$countermeasures_unlocks_t2_supernatural_high_alert$\n#flavor Моколе закутывается в толстый, непрозрачный хитиновый саркофаг, обездвиживая себя, но при этом становясь почти неуязвимым.#!"
 serenity_perk_name: "Безмятежность"
 SERENITY_PERK_EFFECT: "#flavor Моколе может наполнить горячее сердце покоем Геи даже в разгар битвы.#!"
 grasp_the_beyond_perk_name: "Постижение запредельного"
 GRASP_THE_BEYOND_PERK_EFFECT: "Можно сменить облик и сохранить форму, оставаясь в [Concept('umbra', 'Умбре')|E].\n#flavor Моколе может переносить вещи в Умбру и вынимать их из неё, не посвящая их себе.#!"
 song_of_the_great_beast_perk_name: "Песнь Великого зверя"
 SONG_OF_THE_GREAT_BEAST_PERK_EFFECT: "При начале [Concept('war', 'войны')|E] в качестве основного нападающего или защитника вражеские [Concept('rulers', 'правители')|E] получат сильный негативный [Concept('modifier', 'модификатор')|E] за каждый ранг [GetTrait('mokole').GetName(GetNullCharacter)|l].\n#flavor Моколе отправляется в глухие дебри и издаёт протяжный, скорбный рёв. Один из Величайших зверей древности откликается на зов, появляясь в измерении рядом с оборотнем-ящером.#!"



 ####Stream Gifts####
 streamgifts_lifestyle_name: "Дары течения"
 streamgifts_lifestyle_desc: "Все четыре течения моколе сформированы в соответствии с природой выбранных ими земель и обитающими там видами рептилий."
 streamgifts_lifestyle_highlight_desc: "Из-за вашего @gnosis_icon!гнозиса ваш прирост [Concept('experience', 'опыта')|E] для этого образа жизни увеличен на #P [GetPlayer.MakeScope.ScriptValue('gnosis_lifestyle_xp_mult')|%0]#!."
 monthly_streamgifts_lifestyle_xp_gain_mult: "Ежемесячный прирост [Concept('experience', 'опыта')|E] на [Concept('lifestyle', 'пути')|E] даров течения"
 streamgifts_mokole_mbembe_visible: "Дары Моколе-мбембе"
 streamgifts_gumagan_visible: "Дары Гумаган"
 streamgifts_makara_visible: "Дары Макара"
 streamgifts_zhong_lung_visible: "Дары Чжун-лун"

 streamgifts_mokole_mbembe_focus: "Моколе-мбембе"
 streamgifts_mokole_mbembe_focus_modifier: "[GetFocus('streamgifts_mokole_mbembe_focus').GetName]"
 streamgifts_mokole_mbembe_focus_desc: "Дары течения Воинов."
 streamgifts_mokole_mbembe_focus_effect_desc: "Сосредоточившись на дарах Моколе-мбембе, персонаж получает:"

 streamgifts_gumagan_focus: "Гумаган"
 streamgifts_gumagan_focus_modifier: "[GetFocus('streamgifts_gumagan_focus').GetName]"
 streamgifts_gumagan_focus_desc: "Дары течения Предтеч."
 streamgifts_gumagan_focus_effect_desc: "Сосредоточившись на дарах Гумаган, персонаж получает:"

 streamgifts_makara_focus: "Макара"
 streamgifts_makara_focus_modifier: "[GetFocus('streamgifts_makara_focus').GetName]"
 streamgifts_makara_focus_desc: "Дары течения Народа."
 streamgifts_makara_focus_effect_desc: "Сосредоточившись на дарах Макара, персонаж получает:"

 streamgifts_zhong_lung_focus: "Чжун-лун"
 streamgifts_zhong_lung_focus_modifier: "[GetFocus('streamgifts_zhong_lung_focus').GetName]"
 streamgifts_zhong_lung_focus_desc: "Дары течения Философов."
 streamgifts_zhong_lung_focus_effect_desc: "Сосредоточившись на дарах Чжун-лун, персонаж получает:"

 NEEDS_MOKOLE_MBEMBE_STREAM: "@warning_icon!#X Ваше течение должно быть Моколе-мбембе#!"
 NEEDS_GUMAGAN_STREAM: "@warning_icon!#X Ваше течение должно быть Гумаган#!"
 NEEDS_MAKARA_STREAM: "@warning_icon!#X Ваше течение должно быть Макара#!"
 NEEDS_ZHONG_LUNG_STREAM: "@warning_icon!#X Ваше течение должно быть Чжун-лун#!"


 speed_of_thought_perk_name: "Скорость мысли"
 SPEED_OF_THOUGHT_PERK_EFFECT: "#flavor Моколе удваивает скорость бега.#!"
 sense_dissolver_perk_name: "Чувство [Glossary('Расплетателя', 'glossary_wyrm_tt')]"
 SENSE_DISSOLVER_PERK_EFFECT: "$countermeasures_unlocks_t1_all_seeing_eye$\n#flavor Моколе может чувствовать приближающиеся проявления [Glossary('Расплетателя', 'glossary_wyrm_tt')].#!"
 silver_claws_perk_name: "Серебряные когти"
 SILVER_CLAWS_PERK_EFFECT: "[character_interaction|E]: Можно наделить себя модификатором «[GetModifier('POD_mokole_silver_claws_modifier').GetNameWithTooltip]» на 3 года.\n#flavor Луна посылает своих детей, чтобы они научили этому могущественному, но болезненному дару тех воинов, которые заслужат её благосклонность. При использовании он превращает когти моколе в серебро.#!"
 bark_of_the_mudpuppy_perk_name: "Лай грязевого щенка"
 BARK_OF_THE_MUDPUPPY_PERK_EFFECT: "Открывает новое движение в [Concept('single_combat_duel', 'поединке')|E].\n#flavor Этот дар позволяет моколе громко лаять на любого человека или предмет, разбивать стекло, раскалывать лёгкое дерево или даже наносить раны живому существу.#!"
 beak_of_the_finch_perk_name: "Клюв вьюрка"
 BEAK_OF_THE_FINCH_PERK_EFFECT: "#flavor Моколе приспосабливаются к новым ситуациям, чтобы выжить. Для этого они принимают форму, которая позволяет им достичь поставленной цели.#!"
 heat_wave_perk_name: "Волна жара"
 HEAT_WAVE_PERK_EFFECT: "#flavor Моколе может испепелять своих врагов жаром Владыки-Солнца.#!"
 walk_into_my_eyes_perk_name: "Загляни мне в глаза"
 WALK_INTO_MY_EYES_PERK_EFFECT: "[character_interaction|E]: Позволяет навязать цели [Concept('truce', 'перемирие')|E]. Когда перемирие истечёт, одно из её [Concept('personality_traits', 'свойств личности')|E] сменится на противоположное.\n#flavor Этот мощный дар заставляет цель смотреть на мир глазами моколе. В течение этого времени он не сможет атаковать моколе. После возвращения в себя цель часто сильно меняется.#!"

 songlines_perk_name: "Строки из песен"
 SONGLINES_PERK_EFFECT: "#flavor Этот дар наполняет ландшафт песнями. Гумаган может перемещаться из одного конца Бандаяна в другой, используя легенды.#!"
 dreamwalk_perk_name: "Снохождение"
 DREAMWALK_PERK_EFFECT: "Можно манипулировать Барьером.\n#flavor Гумаган может использовать свою связь со Сновидением, чтобы ослабить Барьер.#!"
 bunyips_boom_perk_name: "Грохот Буньип"
 BUNYIPS_BOOM_PERK_EFFECT: "Вражеские [Concept('knights', 'рыцари')|E], выступающие в роли [Concept('commander', 'командиров')|E] в [Concept('combat_phase', 'бою')|E] или ваши противники в [Concept('single_combat_duel_plural', 'поединках')|E] получат модификатор «[GetModifier('POD_mokole_bunyips_boom_modifier').GetNameWithTooltip]».\n#flavor Гумаган может обратиться к Мнезису и имитировать скорбный крик Буньип.#!"
 landspeak_perk_name: "Язык земли"
 LANDSPEAK_PERK_EFFECT: "$countermeasures_unlocks_t2_all_seeing_eye$\nДаёт вероятность пассивно раскрыть [Concept('secret', 'секрет')|E] одного из ваших [Concept('vassals', 'вассалов')|E] каждые три года.\n#flavor Внимательно прислушиваясь, гумаган может услышать песни Земли.#!"
 nightmare_mnesis_perk_name: "Кошмарный Мнезис"
 NIGHTMARE_MNESIS_PERK_EFFECT: "[character_interaction|E]: Можно заставить персонажа испытать [Concept('mental_break', 'нервный срыв')|E].\n#flavor Гумаган может одолеть любого врага с помощью Мнезиса, заставляя его вспомнить о совершенных им зверствах.#!"
 bilabong_walk_perk_name: "Хождение по Билабонгу"
 BILABONG_WALK_PERK_EFFECT: "#flavor Гумаган использует этот дар, чтобы успешно пересекать большие пространства местности, используя воду в качестве кратчайшего пути.#!"
 bloody_mindedness_perk_name: "Кровожадность"
 BLOODY_MINDEDNESS_PERK_EFFECT: "Если у вас есть [Concept('nemesis', 'заклятый враг')|E], вы получите модификатор «[GetModifier('POD_mokole_bloody_mindedness_nemesis_modifier').GetNameWithTooltip]», а если есть [Concept('rival', 'соперник')|E] - «[GetModifier('POD_mokole_bloody_mindedness_rival_modifier').GetNameWithTooltip]».\n#flavor Гумаган может «направить себя» на выбранную цель или врага. Он будет преследовать эту цель до самой смерти и после неё.#!"

 sense_prey_perk_name: "Чувство добычи"
 SENSE_PREY_PERK_EFFECT: "Снижает стоимость [Concept('activity', 'занятия')|E] «Охота» на #P -10%#!\n#flavor Этот дар позволяет оборотню-ящеру находить достаточно добычи, чтобы прокормить свою кладку.#!"
 SENSE_PREY_REASON: "$sense_prey_perk_name$: $VALUE|+=0$"
 scent_of_sweet_nectar_perk_name: "Запах сладкого нектара"
 SCENT_OF_SWEET_NECTAR_PERK_EFFECT: "[character_interaction|E]: Можно наделить персонажа модификатором «[GetModifier('POD_mokole_scent_of_sweet_nectar_modifier').GetNameWithTooltip]».\nДоступны [Concept('men_at_arms', 'профессионалы')|E] - [GetMaA('insects').GetName].\n#flavor Жертва моколе начинает источать удивительно сладкий аромат. Вскоре появляются всевозможные паразиты и обволакивают жертву. Образующийся слой из комаров, мух, пчёл и жуков ползает, жалит и в целом ухудшает зрение и слух.#!"
 shed_perk_name: "Сбрасывание кожи"
 SHED_PERK_EFFECT: "Повышает вероятность успеха [Concept('decision', 'решения')|E] «Бежать из темницы».\n#flavor Моколе может сбросить слой кожи и/или перьев, легко выскальзывая из рук противника или освобождаясь от пут.#!"
 waxwork_monster_perk_name: "Восковое чудовище"
 WAXWORK_MONSTER_PERK_EFFECT: "$countermeasures_unlocks_t3_supernatural_high_alert$\n#flavor Этот дар позволяет моколе воспользоваться тем фактом, что «динозавры вымерли», и спрятаться у всех на виду.#!"
 view_the_seed_perk_name: "Взор семени"
 VIEW_THE_SEED_PERK_EFFECT: "$countermeasures_unlocks_t2_all_seeing_eye$\n[character_interaction|E]: Можно раскрыть случайные [Concept('scheme', 'происки')|E] или [Concept('secret', 'секрет')|E] персонажа.\n#flavor Этот дар исходит из убеждения, что все вещи - всего лишь мечта об идее или объекте, которые их породили. Это позволяет пользователю увидеть «зерно» чего угодно, от родителей ребенка до вдохновителя заговора.#!"
 the_thousand_arrows_perk_name: "Тысяча стрел"
 THE_THOUSAND_ARROWS_PERK_EFFECT: "#flavor Этот дар позволяет стрелку-макара значительно увеличить количество своих снарядов в полёте.#!"
 great_as_a_white_hill_perk_name: "Величие Белого холма"
 GREAT_AS_A_WHITE_HILL_PERK_EFFECT: "#flavor Макара вырастает в три раза больше своего обычного размера или сжимается до размеров небольшого крокодила-грабителя.#!"


 dragon_milk_perk_name: "Драконье молоко"
 DRAGON_MILK_PERK_EFFECT: "[character_interaction|E]: Позволяет исцелить 1 ед. @health_track_aggravated_damage_icon! [Concept('POD_aggravated_damage', 'серьёзного урона')|E] у другого персонажа.\n#flavor Чжун-лун пропускает духовную силу через свою кровь, залечивая раны любого другого живого существа.#!"
 chiih_ming_perk_name: "Ци'и Мин"
 CHIIH_MING_PERK_EFFECT: "#flavor Этот дар позволяет чжун-лун ходить по воздуху.#!"
 clap_of_thunder_perk_name: "Раскат грома"
 CLAP_OF_THUNDER_PERK_EFFECT: "Открывает новое движение в [Concept('single_combat_duel', 'поединке')|E].\n#flavor Чжун-лун хлопает в ладоши, создавая мощный раскат грома, который оглушает тех, кто его слышит.#!"
 the_dragons_tongue_perk_name: "Язык дракона"
 THE_DRAGONS_TONGUE_PERK_EFFECT: "[character_interaction|E]: Наносит персонажу до 2 ед. @health_track_aggravated_damage_icon! [Concept('POD_aggravated_damage', 'серьёзного урона')|E].\n#flavor Чжун-лун призывает молнию на своего врага.#!"
 anger_of_the_wani_perk_name: "Гнев Уани"
 ANGER_OF_THE_WANI_PERK_EFFECT: "Открывает опцию магии погоды: #V шторм#! и #V метель#!\n#flavor Чжун-лун может вызвать практически любой погодный эффект, который пожелает: туман, торнадо, снежные бури и грозы - все они ждут призыва.#!"
 sleep_of_hsi_wang_mu_perk_name: "Сон Си Ван-му"
 SLEEP_OF_HSI_WANG_MU_PERK_EFFECT: "#flavor Этот дар позволяет чжун-лун впадать в спячку, концентрируя свою жизненную силу для продления жизни.#!"
 a_thousand_secret_faces_perk_name: "Лик тысячи тайн"
 A_THOUSAND_SECRET_FACES_PERK_EFFECT: "[character_interaction|E]: Позволяет изменить свои [Concept('personality_traits', 'свойства личности')|E] или скопировать внешний вид другого персонажа.\n#flavor Этот дар позволяет чжун-лун принимать идеальный облик любого человека, любого возраста, этнической принадлежности или положения.#!"



 ####Solar Auspice Gifts####
 solar_auspicegifts_lifestyle_name: "Солнечные дары"
 solar_auspicegifts_lifestyle_desc: "Фокус на дарах, исходящих от солнечного покровительства."
 solar_auspicegifts_lifestyle_highlight_desc: "Из-за вашего @gnosis_icon!гнозиса ваш прирост [Concept('experience', 'опыта')|E] для этого образа жизни увеличен на #P [GetPlayer.MakeScope.ScriptValue('gnosis_lifestyle_xp_mult')|%0]#!."
 monthly_solar_auspicegifts_lifestyle_xp_gain_mult: "Ежемесячный прирост [Concept('experience','опыта')E] на [Concept('lifestyle','пути')E] даров солнечного покровительства"
 solar_auspicegifts_rising_sun_visible: "Восход"
 solar_auspicegifts_noonday_sun_visible: "Полдень"
 solar_auspicegifts_setting_sun_visible: "Закат"
 solar_auspicegifts_midnight_sun_visible: "Полночь"
 solar_auspicegifts_shrouded_sun_visible: "Покров"
 solar_auspicegifts_decorated_sun_visible: "Украшение"
 solar_auspicegifts_eclipsed_sun_visible: "Затмение"


 solar_auspicegifts_focus: "Дары солнечного покровительства"
 solar_auspicegifts_focus_modifier: "[GetFocus('solar_auspicegifts_focus').GetName]"
 solar_auspicegifts_focus_desc: "Великое солнце."
 solar_auspicegifts_focus_effect_desc: "Сосредоточившись на дарах солнечного покровительства, персонаж получает:"


 RISING_SUN_PERK_REQ: "@warning_icon!#warning Требуется одно из следующих свойств:\n$BULLET_WITH_TAB$[GetTrait('rising_sun').GetName(GetPlayer)]\n$BULLET_WITH_TAB$[GetTrait('vasanta').GetName(GetPlayer)]#!"
 NOONDAY_SUN_PERK_REQ: "@warning_icon!#warning Требуется одно из следующих свойств:\n$BULLET_WITH_TAB$[GetTrait('noonday_sun').GetName(GetPlayer)]\n$BULLET_WITH_TAB$[GetTrait('nam_hsia').GetName(GetPlayer)]#!"
 SETTING_SUN_PERK_REQ: "@warning_icon!#warning Требуется одно из следующих свойств:\n$BULLET_WITH_TAB$[GetTrait('setting_sun').GetName(GetPlayer)]\n$BULLET_WITH_TAB$[GetTrait('tung_chun').GetName(GetPlayer)]#!"
 MIDNIGHT_SUN_PERK_REQ: "@warning_icon!#warning Требуется одно из следующих свойств:\n$BULLET_WITH_TAB$[GetTrait('midnight_sun').GetName(GetPlayer)]\n$BULLET_WITH_TAB$[GetTrait('hemanta').GetName(GetPlayer)]\n$BULLET_WITH_TAB$[GetTrait('pei_tung').GetName(GetPlayer)]#!"
 SHROUDED_SUN_PERK_REQ: "@warning_icon!#warning Требуется одно из следующих свойств:\n$BULLET_WITH_TAB$[GetTrait('shrouded_sun').GetName(GetPlayer)]\n$BULLET_WITH_TAB$[GetTrait('zarad').GetName(GetPlayer)]#!"
 DECORATED_SUN_PERK_REQ: "@warning_icon!#warning Требуется одно из следующих свойств:\n$BULLET_WITH_TAB$[GetTrait('decorated_sun').GetName(GetPlayer)]\n$BULLET_WITH_TAB$[GetTrait('grisma').GetName(GetPlayer)]#!"
 ECLIPSED_SUN_PERK_REQ: "@warning_icon!#warning Требуется одно из следующих свойств:\n$BULLET_WITH_TAB$[GetTrait('eclipsed_sun').GetName(GetPlayer)]\n$BULLET_WITH_TAB$[GetTrait('sai_chau').GetName(GetPlayer)]#!"



 bellow_perk_name: "Рёв"
 BELLOW_PERK_EFFECT: "#flavor Моколе издаёт мощный и устрашающий рев рептилии.#!"
 master_of_fire_perk_name: "Мастерство огня"
 MASTER_OF_FIRE_PERK_EFFECT: "Иммунитет к огненному урона.\n#flavor Моколе помнят о древнем договоре, заключённом с духами огня, который позволяет укрыться от надвигающегося пожара Апокалипсиса.#!"
 eye_of_the_raptor_perk_name: "Глаз раптора"
 EYE_OF_THE_RAPTOR_PERK_EFFECT: "#flavor Моколе может ясно видеть на многие мили вокруг.#!"
 paint_the_meadows_perk_name: "Раскрашенные луга"
 PAINT_THE_MEADOWS_PERK_EFFECT: "#flavor Моколе может издавать жалобные стоны, чтобы подманить добычу поближе.#!"
 call_the_tides_perk_name: "Зов течений"
 CALL_THE_TIDES_PERK_EFFECT: "Открывает опцию магии погоды: #V наводнение#!\nСнижает затраты и повышает длительность #V наводнения#!, если у вас есть достоинство «[GetPerk('flood_the_land_perk').GetName(GetPlayer)]»\n#flavor Этот дар позволяет моколе подчинять течения своей воле.#!"
 might_of_kings_perk_name: "Могущество королей"
 MIGHT_OF_KINGS_PERK_EFFECT: "При участии в [Concept('combat_phase', 'бою')|E] в качестве [Concept('knight', 'рыцаря')|E] вы получаете повышенную вероятность ранить вражеских [Concept('knights', 'рыцарей')|E].\n#flavor Моколе может значительно увеличить свою силу, чтобы лучше сокрушать своих врагов.#!"
 lash_of_ages_perk_name: "Хлыст эпох"
 LASH_OF_AGES_PERK_EFFECT: "#flavor Восходящее солнце может уничтожить любое вещество, созданное человеком.#!"
 scream_of_gaia_perk_name: "Крик Геи"
 SCREAM_OF_GAIA_PERK_EFFECT: "[character_interaction|E]: Наносит 1 ед. @health_track_damage_icon! [Concept('POD_superficial_damage', 'поверхностного урона')|E] всем [Concept('knights', 'рыцарям')|E] вашей цели.\n#flavor Моколе издаёт ужасный, прерывистый крик, наполненный яростью и болью Геи.#!"
 jointsnakes_mojo_perk_name: "Змеиное моджо"
 JOINTSNAKES_MOJO_PERK_EFFECT: "#flavor Моколе может срастить отрезанные части тела, даже не прикасаясь к ним.#!"
 wall_of_granite_perk_name: "Гранитная стена"
 WALL_OF_GRANITE_PERK_EFFECT: "$unlock_forging_node$ «[GetModifier('shards_of_granite_modifier').GetNameWithTooltip]»\n#flavor Соприкасаясь с землёй или скалой, восходящее солнце может возвести стену, чтобы защитить себя.#!"


 truth_of_olodumare_perk_name: "Истина Олодумара"
 TRUTH_OF_OLODUMARE_PERK_EFFECT: "Скорость прогресса [Concept('espionage', 'шпионажа')|E]: #P +25%#!\n#flavor Как судьи обязанностей, полуденные солнца могут легко отличить правду от лжи.#!"
 TRUTH_OF_OLODUMARE_REASON: "$truth_of_olodumare_perk_name$: $VALUE|+=0$"
 fangs_of_judgement_perk_name: "Клыки правосудия"
 FANGS_OF_JUDGEMENT_PERK_EFFECT: "Вероятность [Concept('imprison', 'заключения в темницу')|E] с [Concept('imprisonment_reason', 'поводом')|E]: #P +20%#!\nПринятие [Concept('revoke', 'отзыва')|E] титула: #P +10#!\n#flavor Полуденному солнцу принадлежит право вершить не только суд, но и наказание над теми, кто сошёл со своего истинного пути.#!"
 strength_of_purpose_perk_name: "Целеустремлённость"
 STRENGTH_OF_PURPOSE_PERK_EFFECT: "#flavor Полуденные солнца используют этот дар, чтобы укрепить себя перед лицом апокалипсиса, превращая горячую страсть и жгучую ярость в холодную, стальную решимость.#!"
 tame_sunbeam_perk_name: "Укрощение солнечных лучей"
 TAME_SUNBEAM_PERK_EFFECT: "[character_interaction|E]: Наносит 2 ед. @health_track_aggravated_damage_icon! [Concept('POD_aggravated_damage', 'серьёзного урона')|E] другому персонажу со слабостью к солнцу, который нельзя исцелить в течение 5 лет.\n#flavor Солнце уже давно является самым верным союзником моколе и посылает свой свет, когда они больше всего в нём нуждаются.#!"
 clear_mind_perk_name: "Ясный ум"
 CLEAR_MIND_PERK_EFFECT: "#flavor Этот дар способствует ясности мышления, независимо от отвлекающих факторов.#!"
 weak_arm_perk_name: "Слабая рука"
 WEAK_ARM_PERK_EFFECT: "#flavor Наблюдая за стилем боя противника, полуденное солнце может быстро оценить его сильные и слабые стороны.#!"
 eye_of_the_cobra_perk_name: "Глаз кобры"
 EYE_OF_THE_COBRA_PERK_EFFECT: "При участии в [Concept('combat_phase', 'бою')|E] в качестве [Concept('commander', 'командира')|E] вражеские [Concept('knights', 'рыцари')|E], или ваши противники в [Concept('single_combat_duel_plural', 'поединках')|E] получат модификатор «[GetModifier('POD_mokole_eye_of_the_cobra_modifier').GetNameWithTooltip]».\n#flavor Обладая неземным взглядом, оборотень-ящер может привлечь любого на расстояние удара.#!"
 raptors_gaze_perk_name: "Взгляд раптора"
 RAPTORS_GAZE_PERK_EFFECT: "#flavor Один из глаз моколе светится мертвенно-красным, и все враги, попавшие под его пристальный взгляд, испытывают ужасные мучения.#!"
 wisdom_of_the_sun_perk_name: "Мудрость солнца"
 WISDOM_OF_THE_SUN_PERK_EFFECT: "$unlock_forging_node$ «[GetModifier('suns_wisdom_modifier').GetNameWithTooltip]».\n#flavor Медитируя под ликом Владыки-Солнца, полуденное солнце становится проводником земной мудрости и может найти ответ практически на любой вопрос.#!"
 sleep_of_the_dragon_perk_name: "Сон дракона"
 SLEEP_OF_THE_DRAGON_PERK_EFFECT: "#flavor Моколе впадает в спячку. Во время сна он не стареет, хотя ему могут сниться сны.#!"


 resist_pain_perk_name: "Сопротивление боли"
 RESIST_PAIN_PERK_EFFECT: "#flavor Укрепляя себя целеустремлённостью и волей, моколе заглушает боль от своих ран.#!"
 rage_of_the_nest_mother_perk_name: "Ярость матери гнезда"
 RAGE_OF_THE_NEST_MOTHER_PERK_EFFECT: "За каждого вашего несовершеннолетнего ребёнка вы получите складывающийся модификатор «[GetModifier('POD_mokole_rage_of_the_nest_mother_modifier').GetNameWithTooltip]».\n#flavor Столкнувшись с угрозой для беспомощного члена семьи или кладки моколе, заходящее солнце может подняться выше своих обычных пределов, чтобы защитить их.#!"
 combat_healing_perk_name: "Боевое исцеление"
 COMBAT_HEALING_PERK_EFFECT: "#flavor Этот дар позволяет оборотню-ящеру залечивать свои раны без отдыха и колебаний, даже в разгар битвы.#!"
 warding_dance_perk_name: "Защитный танец"
 WARDING_DANCE_PERK_EFFECT: "#flavor Направляя огонь из своего сердца в конечности, заходящее солнце целым и невредимым прорывается сквозь ряды врагов Геи.#!"
 clenched_jaw_perk_name: "Стиснутая челюсть"
 CLENCHED_JAW_PERK_EFFECT: "После успешной [Concept('siege', 'осады')|E] или [Concept('raid', 'набега')|E] [Concept('characters', 'персонажи')|E] чаще [Concept('imprison', 'попадают в темницу')|E].\n#flavor Оборотень-ящер кусает с такой силой, что его хватка не ослабевает до тех пор, пока он сам этого не захочет; даже после смерти его челюсти остаются сомкнутыми.#!"
 armor_of_the_tortoise_perk_name: "Панцирь черепахи"
 ARMOR_OF_THE_TORTOISE_PERK_EFFECT: "#flavor Моколе может образовывать твёрдую оболочку вокруг своей кожи, защищая себя от повреждений.#!"
 clarity_perk_name: "Ясность"
 CLARITY_PERK_EFFECT: "$countermeasures_unlocks_t1_all_seeing_eye$\n#flavor Этот дар даёт способность видеть сквозь туман, кромешную тьму, быть невидимым и распознавать иллюзии.#!"
 hand_of_the_earth_lords_perk_name: "Длань повелителей земли"
 HAND_OF_THE_EARTH_LORDS_PERK_EFFECT: "Доступны [Concept('men_at_arms', 'профессионалы')|E] - [GetMaA('earth_elemental').GetName].\n#flavor Используя энергию земли, заходящее солнце может двигать любой объект, просто указывая на него жестом.#!"
 halo_of_the_sun_perk_name: "Солнечный ореол"
 HALO_OF_THE_SUN_PERK_EFFECT: "$unlock_forging_node$ «[GetModifier('cleansing_sun_modifier').GetNameWithTooltip]».\n#flavor The character speaks an ancient word sacred to Helios and is immediately surrounded by a sphere of blazing sunlight.#!"
 fossilize_perk_name: "Окаменение"
 FOSSILIZE_PERK_EFFECT: "[character_interaction|E]: Отправляет персонажа в [GetTrait('torpor').GetName(GetNullCharacter)|l].\n#flavor Моколе увековечивает память о врагах, превращая их в окаменелости в назидание будущим поколениям.#!"


 brothers_scent_perk_name: "Запах брата"
 BROTHERS_SCENT_PERK_EFFECT: "#flavor Опираясь на всеобщее братство всех созданий Геи, моколе, кажется, вписывается во всё, куда бы он ни пошёл.#!"
 spirits_of_laughter_perk_name: "Духи смеха"
 SPIRITS_OF_LAUGHTER_PERK_EFFECT: "Предел [Concept('faction_military_power', 'силы фракций')|E] для [Concept('vassals', 'вассалов')|E]: #P +10%#!\n#flavor Полуночное солнце пробуждает хорошее настроение, поднимая всем настроение.#!"
 FACTION_POWER_SPIRITS_OF_LAUGHTER: "$spirits_of_laughter_perk_name$: $VALUE|+=0$"
 glib_tongue_perk_name: "Бойкий язык"
 GLIB_TONGUE_PERK_EFFECT: "#flavor Слушатели слышат всё, что хочет моколе. Полуночное солнце может говорить что угодно, даже полную чушь, но любой слушающий от души согласится с этим.#!"
 GLIB_TONGUE_ACCEPTANCE: "$glib_tongue_perk_name$: $VALUE|+=0$"
 dreamspeak_perk_name: "Речь снов"
 DREAMSPEAK_PERK_EFFECT: "Скорость прогресса [Concept('espionage', 'шпионажа')|E]: #P +25%#!\n#flavor Полуночное солнце может проникать в чужие сны и, следовательно, влиять на их ход.#!"
 DREAMSPEAK_REASON: "$dreamspeak_perk_name$: $VALUE|+=0$"
 invisibility_perk_name: "Невидимость"
 INVISIBILITY_PERK_EFFECT: "Открывает вариант смены облика «[GetModifier('POD_shapeshift_form_invisible_modifier').GetNameWithTooltip]».\n#flavor Моколе может исчезать из виду, хотя ему приходится концентрироваться, чтобы оставаться невидимым.#!"
 shadows_by_the_firelight_perk_name: "Тени в свете костра"
 SHADOWS_BY_THE_FIRELIGHT_PERK_EFFECT: "[character_interaction|E]: Можно снизить свой [Concept('stress', 'стресс')|E].\n#flavor Полуночное солнце вызывает тени и мечтает создать сцену для спектакля, в котором другие моколе сыграют свою роль.#!"
 open_sun_bridge_perk_name: "Открытый солнечный мост"
 OPEN_SUN_BRIDGE_PERK_EFFECT: "[character_interaction|E]: Позволяет телепортировать в пруд или каэрн при [Concept('army_commander', 'командовании войском')|E] или во время [Concept('traveling', 'путешествия')|E].\n#flavor У оборотня-ящера есть возможность открыть солнечный мост, с разрешения или без разрешения тотема этого пруда.#!"
 take_the_true_form_perk_name: "Прими истинный облик"
 TAKE_THE_TRUE_FORM_PERK_EFFECT: "[character_interaction|E]: Отменяет облик у персонажа и лишает его возможности сменить облик на 10 лет.\n#flavor Полуночное солнце может заставить существо принять свой истинный облик.#!"
 fools_luck_perk_name: "Удача глупцов"
 FOOLS_LUCK_PERK_EFFECT: "#flavor Этот дар даёт временный иммунитет к невезению.#!"
 thousand_forms_perk_name: "Тысяча форм"
 THOUSAND_FORMS_PERK_EFFECT: "Открывает различные звериные формы смены облика.\n$unlock_forging_node$ «[GetModifier('beast_rampage_modifier').GetNameWithTooltip]».\n#flavor Оборотень-ящер, обладающий этим даром, может превращаться в любое животное размером от небольшой птицы до бизона.#!"



 sense_magic_perk_name: "Чувство магии"
 SENSE_MAGIC_PERK_EFFECT: "В вас больше не могут вселиться #TOOLTIP:GAME_TRAIT,wraith,[GetNullCharacter] #L призраки#!#!.\n#flavor Оборотни-ящеры могут чувствовать пульсацию и течение мистических энергий, независимо от их происхождения.#!"
 mokole_spirit_speech_perk_name: "Речь духа"
 MOKOLE_SPIRIT_SPEECH_PERK_EFFECT: "#flavor Этот дар даёт понимание языка мира духов, позволяя моколе ясно понимать любого духа, с которым он сталкивается, и разговаривать с ним.#!"
 command_spirit_perk_name: "Приказ духу"
 COMMAND_SPIRIT_PERK_EFFECT: "Доступны [Concept('men_at_arms', 'профессионалы')|E] - [GetMaA('jagglings').GetName].\n#flavor Окутанное солнце может отдавать приказы духам, с которыми он встречается, и ожидать повиновения.#!"
 COMMAND_SPIRIT_REASON: "$command_spirit_perk_name$: $VALUE|+=0$"
 umbral_shadow_wings_perk_name: "Умбральные теневые крылья"
 UMBRAL_SHADOW_WINGS_PERK_EFFECT: "#flavor Этот дар позволяет моколе летать сквозь «ничто» Умбры, игнорируя различные пути и тропинки в пользу более прямого маршрута из измерения в измерение.#!"
 breaking_the_tomorrow_wall_perk_name: "Ломая стену завтрашнего дня"
 BREAKING_THE_TOMORROW_WALL_PERK_EFFECT: "$countermeasures_unlocks_t2_all_seeing_eye$\nВы получите уведомление, если кто-то задумает убить ваших друзей или членов семьи.\n#flavor Моколе плывёт вверх по течению реки Мнезиса, улавливая смутные проблески будущего.#!"
 call_water_spirit_perk_name: "Призыв духа воды"
 CALL_WATER_SPIRIT_PERK_EFFECT: "Доступны [Concept('men_at_arms', 'профессионалы')|E] - [GetMaA('water_elemental').GetName].\n#flavor Моколе способен призвать себе на помощь элементаля воды.#!"
 walk_the_matres_mind_perk_name: "Хождение по разуму матерей"
 WALK_THE_MATRES_MIND_PERK_EFFECT: "Можно физически войти в [Concept('umbra', 'Умбру')|E].\n#flavor Этот дар позволяет моколе физически проникнуть в Умбру, не оставляя за собой беспомощного тела и серебряного шнура.#!"
 gorgons_gaze_perk_name: "Взгляд горгоны"
 GORGONS_GAZE_PERK_EFFECT: "[character_interaction|E]: Снижает [Concept('prowess', 'доблесть')|E] персонажа и наделяет его [Concept('trait', 'свойством')|E] «[GetTrait('scaly').GetName(GetNullCharacter)]».\n#flavor Глаза моколе горят красным, золотым и зелёным, когда эта ужасная способность из легенд превращает живую плоть в камень одним лишь взглядом.#!"
 mokole_living_treasure_perk_name: "Живое сокровище"
 MOKOLE_LIVING_TREASURE_PERK_EFFECT: "Стоимость взаимодействий «[buy_claim_interaction|E]» и «[buy_artifact_claim_interaction|E]»: #P -25%#!\n$unlock_forging_node$ «[GetModifier('inscribed_legacy_modifier').GetNameWithTooltip]».\n#flavor Окутанное солнце может убедить дух сокровища рассказать о его истории и преданиях.#!"
 malleable_spirit_perk_name: "Податливый дух"
 MALLEABLE_SPIRIT_PERK_EFFECT: "#flavor Моколе может изменить форму или предназначение духа.#!"



 mercy_perk_name: "Милосердие"
 MERCY_PERK_EFFECT: "#flavor Украшенные солнца не видят смысла в применении смертоносной силы, когда не сражаются с приспешниками [Glossary('Расплетателя', 'glossary_wyrm_tt')].#!"
 mokole_pack_tactics_perk_name: "Тактика стаи"
 MOKOLE_PACK_TACTICS_PERK_EFFECT: "#flavor Взяв на себя инициативу и координируя действия других моколе, украшенное солнце дарит всем своим товарищам по кладке большую компетентность в пылу битвы.#!"
 mothers_touch_perk_name: "Касание матери"
 MOTHERS_TOUCH_PERK_EFFECT: "[character_interaction|E]: Исцеляет 1 ед. @health_track_damage_icon! [Concept('POD_superficial_damage', 'поверхностного урона')|E] у другого персонажа.\n#flavor Украшенное солнце передаёт духовную силу через свои руки, залечивая раны любого живого существа.#!"
 pilot_snake_perk_name: "Летучая змея"
 PILOT_SNAKE_PERK_EFFECT: "Доступны [Concept('men_at_arms', 'профессионалы')|E] - [GetMaA('snakes').GetName].\n#flavor Этот дар позволяет моколе вызывать полезную летучую змею, существо, которое знает, как добраться до нужного места.#!"
 wind_beneath_my_wings_perk_name: "Ветер под моими крыльями"
 WIND_BENEATH_MY_WINGS_PERK_EFFECT: "#flavor Этот дар помогает моколе легче передвигаться, маршируя или летая в строю.#!"
 call_to_duty_perk_name: "Зов долга"
 CALL_TO_DUTY_EFFECT: "#flavor Имена обладают силой в мире духов, и украшенное солнце может использовать это, чтобы вызывать и повелевать любым духом, имя которого он знает.#!"
 dragon_drill_perk_name: "Тренировка дракона"
 DRAGON_DRILL_PERK_EFFECT: "При участии в [Concept('combat_phase', 'бою')|E] в качестве [Concept('commander', 'командира')|E] союзные [Concept('knights', 'рыцари')|E], или вы сами в [Concept('single_combat_duel_plural', 'поединках')|E] получите модификатор «[GetModifier('POD_mokole_dragon_drill_modifier').GetNameWithTooltip]».\n#flavor Моколе может объединить своих союзников в мощную рабочую силу, делясь приобретёнными способностями со всеми членами команды.#!"
 reshape_object_perk_name: "Изменение объекта"
 RESHAPE_OBJECT_PERK_EFFECT: "Уничтожение [Concept('artifacts', 'артефактов')|E] приносит [Concept('gold', 'золото')|E]\n#flavor Моколе может мгновенно превратить некогда живой материал во что-то другое.#!"
 chaos_mechanics_perk_name: "Механика хаоса"
 CHAOS_MECHANICS_PERK_EFFECT: "$unlock_forging_node$ Добавляет один из четырёх случайных модификаторов.\n#flavor Этот дар позволяет оборотню-ящеру призывать первобытную энергию и мистическую форму одновременно.#!"
 strength_of_the_dominator_perk_name: "Сила владыки"
 STRENGTH_OF_THE_DOMINATOR_PERK_EFFECT: "[character_interaction|E]: Снижает ресурс [Concept('splat', 'вида')|E] персонажа и предоставляет [Concept('prowess', 'доблесть')|E] в размере трети от его доблести.\n#flavor Оборотень-ящер использует гнев жертвы, чтобы подпитать свой собственный.#!"




 mokole_aura_of_confidence_perk_name: "Аура уверенности"
 MOKOLE_AURA_OF_CONFIDENCE_PERK_EFFECT: "$countermeasures_unlocks_t1_mental_fortress$\n#flavor Моколе создаёт ауру превосходства, предотвращая попытки найти недостатки или прочитать ауру.#!"
 lambent_flame_perk_name: "Сверкающее пламя"
 LAMBENT_FLAME_PERK_EFFECT: "#flavor Оборотень-ящер заставляет своё тело гореть серебристым светом.#!"
 mokole_awe_perk_name: "Трепет"
 MOKOLE_AWE_PERK_EFFECT: "#flavor Моколе становится безошибочным воплощением первобытной славы и величия, увенчанным солнцем и окутанным пеленой лет.#!"
 dazzle_perk_name: "Поразительность"
 DAZZLE_PERK_EFFECT: "#flavor Моколе может наполнить разум цели славой и любовью Геи.#!"
 dragon_kings_majesty_perk_name: "Величие короля-дракона"
 DRAGON_KINGS_MAJESTY_PERK_EFFECT: "#flavor Солнечное затмение, кажется, становится всё больше и внушительнее, превращаясь в ужасную тёмную версию самого себя.#!"
 wrath_of_the_dragon_perk_name: "Гнев дракона"
 WRATH_OF_THE_DRAGON_PERK_EFFECT: "При участии в [Concept('combat_phase', 'бою')|E] в качестве [Concept('commander', 'командира')|E] вражеские [Concept('knights', 'рыцари')|E] и [Concept('commanders', 'командиры')|E], или ваши противники в [Concept('single_combat_duel_plural', 'поединках')|E] получат 40 [Concept('stress', 'стресса')|E], если они служат [Glossary('Вирму', 'glossary_wyrm_tt')].\n#flavor Моколе показывает себя во всей своей ужасающей красе как избранный воин Геи. Его великолепие поражает приспешников [Glossary('Расплетателя', 'glossary_wyrm_tt')].#!"
 mokole_mastery_perk_name: "Власть"
 MOKOLE_MASTERY_PERK_EFFECT: "[character_interaction|E]: Предоставляет [Concept('strong_hook', 'сильное влияние')|E] на другого [GetTrait('mokole').GetName(GetNullCharacter)|l].\n#flavor Солнечное затмение может приказывать другим моколе, даже тем, кто подчинился [Glossary('Расплетателю', 'glossary_wyrm_tt')], выполнять свои приказы.#!"
 army_of_the_ancestors_perk_name: "Войско предков"
 ARMY_OF_THE_ANCESTORS_PERK_EFFECT: "Во время войны призываются три могущественных [Concept('ancestor_spirits', 'духа предков')|E], которые помогут вам в качестве [Concept('knights', 'рыцарей')|E].\n#flavor Моколе может обратиться к предкам, которые придали ему тот облик, который он носит, вызволяя их из глубин памяти, чтобы бросить вызов своим противникам.#!"
 sun_enfleshed_perk_name: "Солнечная плоть"
 SUN_ENFLESHED_PERK_EFFECT: "При участии в [Concept('combat_phase', 'бою')|E] в качестве [Concept('commander', 'командира')|E] вражеские [Concept('knights', 'рыцари')|E] и [Concept('commanders', 'командиры')|E], или ваши противники в [Concept('single_combat_duel_plural', 'поединках')|E] получат 1 ед. @health_track_aggravated_damage_icon! [Concept('POD_aggravated_damage', 'серьёзного урона')|E], если они испытывают слабость к солнцу.\n$unlock_forging_node$ «[GetModifier('sun_scales_modifier').GetNameWithTooltip]».\n#flavor Моколе становится живым воплощением священного огня солнца. Он вспыхивает тихим солнечным пламенем, сжигая своих противников одним прикосновением.#!"
 dream_semblence_perk_name: "Подобие сна"
 DREAM_SEMBLENCE_PERK_EFFECT: "[character_interaction|E]: Наделяет модификатором «[GetModifier('POD_mokole_dream_semblence_modifier').GetNameWithTooltip]» на год и максимально увеличивает ваш [Concept('dread', 'ужас')|E].\n#flavor Этот редкий дар позволяет моколе превращаться во сне в истинного дракона. Как только противостояние закончится, сон развеется.#!"







