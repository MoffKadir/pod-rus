 rulers_of_the_earth_perk_name: "Правители земли"
 RULERS_OF_THE_EARTH_PERK_EFFECT: "[character_interaction|E]: Подконтрольный титул [Concept('de_jure_drift', 'войдёт в де-юре состав')|E] вашего [Concept('primary_title', 'основного титула')|E]."
 rulers_of_the_sea_perk_name: "Правители моря"
