 kings_call_perk_name: "Королевский зов"
 KINGS_CALL_PERK_EFFECT: "Улучшает достоинство «[GetPerk('stampede_perk').GetName(GetPlayer)]», добавляя к созданной армии дополнительных профессионалов ([GetMaA('archators').GetName] и [GetMaA('baroceratops').GetName]), и позволяя выбрать до 2 дополнительных провинций."