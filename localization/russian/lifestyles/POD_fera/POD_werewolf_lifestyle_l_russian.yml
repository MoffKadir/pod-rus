l_russian:




 ####Breed Gifts####

 #Homid
 persuasion_perk_name: "Убеждение"
 PERSUASION_PERK_EFFECT: "#flavor Этот дар позволяет хомиду стать более убедительным в общении с другими; его заявления и аргументы наполнены смыслом и достоверностью.#!"
 apecrafts_blessings_perk_name: "Благословение обезьян"
 APECRAFTS_BLESSING_PERK_EFFECT: "#flavor Хотя многие дети Геи используют инструменты, никто не освоил их так тщательно, как человечество. Хомид фокусирует это мастерство на инструментах, которые он использует, заставляя их духи пробуждаться и оказывать ему помощь.#!"
 divide_perk_name: "Разделение"
 DIVIDE_PERK_EFFECT: "[character_interaction|E]: Накладывает отрицательный модификатор мнения вассала.\n#flavor Этот дар вызывает ненависть и подозрения среди врагов гару.#!"
 staredown_perk_name: "Пристальный взгляд"
 STAREDOWN_PERK_EFFECT: "[PODUnlocksCombatMove('POD_combat_move_werewolf_staredown')]\n#flavor [Glossary('Ярость', 'glossary_rage_tt')] горит в глазах оборотня, вселяя страх в сердца смертных и животных, заставляя их бежать, спасая свою жизнь.#!"
 reshape_object_perk_name: "Видоизменение объекта"
 RESHAPE_OBJECT_PERK_EFFECT: "$unlock_forging_node$ Добавляет модификатор в зависимости от типа артефакта и [GetModifier('artifact_minor_monthly_prestige_mult_2_modifier').GetNameWithTooltip]\n#flavor Гару могут превращать некогда живой материал в различные предметы. Деревья могут стать убежищем, оленьи рога - копьем, шкуры животных - доспехами, а цветы - благовониями.#!"
 weave_of_steel_perk_name: "Плетение стали"
 WEAVE_OF_STEEL_PERK_EFFECT: "#flavor Хомид может мистическим образом укрепить любую искусственную конструкцию или материал, придавая доскам прочность стали, а стали — твёрдость алмаза.#!"
 body_shift_perk_name: "Сдвиг тела"
 BODY_SHIFT_PERK_EFFECT: "[PODImprovesCombatMove('POD_combat_move_werewolf_fang_rush')]\n#flavor Гару, выросшие в меняющемся лабиринте человеческого общества, хорошо подготовлены к бесконечной адаптации, которую Гея требует от своих защитников.#!"
 false_comfort_perk_name: "Ложное утешение"
 FALSE_COMFORT_PERK_EFFECT: "[PODUnlocksCombatMove('POD_combat_move_werewolf_false_comfort')]\nПри начале [Concept('war', 'войны')|E] в качестве нападающего или защитника все вражеские [Concept('rulers', 'правители')|E] получат модификатор [GetModifier('false_comfort_modifier').GetNameWithTooltip].\n#flavor Человечество многое сделало, чтобы окружить себя комфортом и безопасностью. Гару, использующий этот дар, не кромсает броню и не пробивает двери, он просто полностью их игнорирует. Безопасность — это иллюзия.#!"
 false_comfort_modifier: "Ложное утешение"


 #Lupus
 cousins_coat_perk_name: "Шкура сородича"
 COUSINS_COAT_PERK_EFFECT: "[PODUnlocksCombatMove('POD_combat_move_werewolf_cousins_coat')]\n#flavor Гару с этим даром могут легче сливаться с окружающей средой, чем другие представители их вида.#!"
 hares_leap_perk_name: "Заячий прыжок"
 HARES_LEAP_PERK_EFFECT: "#flavor С помощью этого дара оборотень может прыгать на поистине невероятные расстояния.#!"
 sense_the_unnatural_perk_name: "Чувство неестественности"
 SENSE_THE_UNNATURAL_PERK_EFFECT: "[PODImprovesCombatMove('POD_combat_move_werewolf_bloodhound')]\n$countermeasures_unlocks_t1_supernatural_high_alert$\n#flavor Оборотень может распознать любое неестественное присутствие, оценив его приблизительную силу и тип.#!"
 devils_child_perk_name: "Дитя Дьявола"
 DEVILS_CHILD_PERK_EFFECT: "#flavor Волков часто считают отпрысками самого Дьявола, и, хотя они не до конца понимают этот смысл, люпусы рады извлечь выгоду из страха, который они внушают. Гару издаёт яростный рык, который пугает противников и заставляет их подчиниться.#!"
 gift_of_the_porcupine_perk_name: "Дар дикобраза"
 GIFT_OF_THE_PORCUPINE_PERK_EFFECT: "[PODUnlocksCombatMove('POD_combat_move_werewolf_gift_of_the_porcupine')]\n#flavor Этот дар позволяет меху гару стать щетинистым и острым, как иглы дикобраза, и вы никогда не будете связываться с дикобразом.#!"
 lord_of_the_wilds_perk_name: "Владыка дикой природы"
 LORD_OF_THE_WILDS_PERK_EFFECT: "#flavor Гару могут не только общаться с животными, но и привлекать их и командовать ими.#!"
 umbral_body_perk_name: "Умбральное тело"
 UMBRAL_BODY_PERK_EFFECT: "Можно менять облик и поддерживать изменённую форму, оставаясь в [Concept('umbra', 'Умбре')|E].\n#flavor С помощью этого дара пользователь может частично проникнуть в Умбру, отправляя в неё определённые части тела, сохраняя при этом другие в физическом мире.#!"
 elemental_gift_perk_name: "Дар стихий"
 ELEMENTAL_GIFT_PERK_EFFECT: "Доступны элементальные [Concept('men_at_arms', 'профессионалы')|E].\n#flavor Оборотень призывает первобытную силу самой Геи, тем самым приказав духам стихий подняться, двигаться вперёд и даже поглотить врагов.#!"




 ####Lunar Auspice####
 lunar_auspicegifts_lifestyle_name: "Лунные дары"
 lunar_auspicegifts_lifestyle_desc: "Фокус на дарах, сопутствующих вашему лунному покровительству."
 lunar_auspicegifts_lifestyle_highlight_desc: "Из-за вашего #L $POD_energy_gnosis$а#! ваш прирост [Concept('experience', 'опыта')|E] для этого образа жизни увеличен на #P [GetPlayer.MakeScope.ScriptValue('gnosis_lifestyle_xp_mult')|%0]#!."
 monthly_lunar_auspicegifts_lifestyle_xp_gain_mult: "Ежемесячный прирост [Concept('experience','опыта')E] на [Concept('lifestyle','пути')E] даров лунного покровительства"
 lunar_auspicegifts_focus: "Дары лунного покровительства"
 lunar_auspicegifts_focus_modifier: "[GetFocus('lunar_auspicegifts_focus').GetName]"
 lunar_auspicegifts_focus_desc: "Дары пяти фаз луны."
 lunar_auspicegifts_focus_effect_desc: "Сосредоточившись на дарах лунного покровительства, персонаж получает:"
 lunar_auspicegifts_ahroun_visible: "Арун"
 lunar_auspicegifts_galliard_visible: "Галлиард"
 lunar_auspicegifts_ragabash_visible: "Рагабаш"
 lunar_auspicegifts_philodox_visible: "Филодокс"
 lunar_auspicegifts_theurge_visible: "Теург"
 NEEDS_AHROUN_TEXT: "@warning_icon!#X Для разблокировки достоинств в этом древе требуются [Concept('traits', 'свойства')|E] «[GetTrait('ahroun').GetName( GetPlayer )]».#!"
 NEEDS_GALLIARD_TEXT: "@warning_icon!#X Для разблокировки достоинств в этом древе требуются [Concept('traits', 'свойства')|E] «[GetTrait('galliard').GetName( GetPlayer )]».#!"
 NEEDS_PHILODOX_TEXT: "@warning_icon!#X Для разблокировки достоинств в этом древе требуются [Concept('traits', 'свойства')|E] «[GetTrait('philodox').GetName( GetPlayer )]».#!"
 NEEDS_RAGABASH_TEXT: "@warning_icon!#X Для разблокировки достоинств в этом древе требуются [Concept('traits', 'свойства')|E] «[GetTrait('ragabash').GetName( GetPlayer )]».#!"
 NEEDS_THEURGE_TEXT: "@warning_icon!#X Для разблокировки достоинств в этом древе требуются [Concept('traits', 'свойства')|E] «[GetTrait('theurge').GetName( GetPlayer )]».#!"
 AUSPICE_ENDPERK_REQUIREMENT: "@warning_icon#!#X Это достоинство можно получить, только завершив [Concept('story_cycle', 'историю')|E] своего покровительства."


 #Ahroun
 rhythm_of_war_perk_name: "Ритм войны"
 RHYTHM_OF_WAR_PERK_EFFECT: "#clickable [character_interaction|E]: Можно бросить вызов другому персонажу в @pod_combat_encounter_icon![Concept('pod_combat_encounter', 'боевом столкновении')|E].#!\n#flavor Пока арун продолжает сражаться в ритме своего внутреннего боевого барабана, его невозможно остановить. Удары, которые могли бы сразить менее сильного бойца, подобны укусам осы для самых могущественных воинов гару.#!"
 steadfast_perk_name: "Стойкость"
 STEADFAST_PERK_EFFECT: "#flavor Независимо от задачи, арун не устаёт. Этот дар позволяет гару работать, бегать или сражаться далеко за пределами своих обычных возможностей.#!"
 iron_claws_perk_name: "Железные когти"
 IRON_CLAWS_PERK_EFFECT: "[PODImprovesCombatMove('POD_combat_move_fera_beast_strike')]\n#flavor Когти гару становятся острыми, как железо, позволяя ему легко разрывать и плоть, и броню.#!"
 true_fear_perk_name: "Истинный страх"
 TRUE_FEAR_PERK_EFFECT: "[PODUnlocksCombatMove('POD_combat_move_werewolf_true_fear')]\n#flavor Арун может сокрушить конкретного противника величиной своей силы, пугая противника и заставляя его бездействовать.#!"
 snarl_of_challenge_perk_name: "Рык вызова"
 SNARL_OF_CHALLENGE_PERK_EFFECT: "#flavor Устрашающим рыком арун может заставить врага сражаться с ним, пока земля не станет красной от крови.#!"
 primal_anger_perk_name: "Первобытный гнев"
 PRIMAL_ANGER_PERK_EFFECT: "[PODUnlocksCombatMove('POD_combat_move_werewolf_primal_anger')]\nУбирает все затраты на принятие формы [GetModifier('POD_werewolf_form_crinos_modifier').GetNameWithTooltip]\n#flavor Арун позволяет своей ярости расходовать его собственную жизненную силу для дальнейшего разрушения.#!"
 strength_of_will_perk_name: "Сила воли"
 STRENGTH_OF_WILL_PERK_EFFECT: "[PODImprovesCombatMove('POD_combat_move_werewolf_face_the_apocalypse')]\n#flavor Гару с этим даром — столп неукротимой воли. Он также может поделиться этой ужасающей целеустремлённостью с другими, приводя их даже к верной гибели без малейшего страха.#!"
 shake_the_earth_perk_name: "Тряска земли"
 SHAKE_THE_EARTH_PERK_EFFECT: "[PODUnlocksCombatMove('POD_combat_move_werewolf_shake_the_earth')]\n#flavor Сила ярости аруна раскалывает землю перед ним, нанося огромный ущерб его окружению.#!"
 lunas_armor_perk_name: "Броня [Glossary('Луны', 'glossary_luna_tt')]"
 LUNAS_ARMOR_PERK_EFFECT: "Даёт иммунитет к @pod_combat_fire_icon!#L;color:{1.00,0.55,0.20} [Concept('fire_damage', 'огненному урону')|E]#!.\n#flavor Арун купается в чистом лунном свете Луны, защищая его от пламени врагов.#!"
 full_moons_light_perk_name: "Свет полной луны"
 FULL_MOONS_LIGHT_PERK_EFFECT: "#flavor Полнолуние — это фаза воина [Glossary('Луны', 'glossary_luna_tt')], когда она принимает облик Дианы-Охотницы и ищет своих врагов. Арун может использовать решимость Луны в поиске врагов, освещая любого, кто противостоит ей.#!"
 unstoppable_warrior_perk_name: "Неудержимый воин"
 UNSTOPPABLE_WARRIOR_PERK_EFFECT: "Ячейки [Concept('POD_health_track', 'здоровья')|E]: #P +1#!\nПобеда в [Concept('pod_combat_encounter', 'боевом столкновении')|E] исцеляет #V 2#![POD_aggravated_box|E]\n#flavor Оборотень стал главным представителем своего покровительства. Никакие раны не смогут остановить его, только смерть.#!"
 UNSTOPPABLE_WARRIOR_REQUIREMENT: "@warning_icon!#X Чтобы разблокировать это достоинство, вам нужно выполнить задание инкарны-воина (разместите исследователя в любом измерении Умбры, чтобы найти подсказку о местоположении, и начните #TOOLTIP:game_concept_umbra_expedition_desc #E путешествие в Умбру#!#!, чтобы добраться до него, а затем получить задание).#!"




 #Galliard
 primal_song_perk_name: "Первобытная песня"
 PRIMAL_SONG_PERK_EFFECT: "[character_interaction|E]: Сплетите #clickable куплеты песен#! вместе для создания различных эффектов.\n#clickable Куплет: [GetModifier('galliard_song_development_decline_modifier').GetNameWithTooltip]#!\n#clickable Куплет: Призывает случайного духа#!\n#flavor Галлиард сплетает мощные песни со своим гнозисом. Казалось бы, обычная песня может иметь самые непредсказуемые последствия.#!"
 galliard_song_development_decline_modifier: "Возвращение к первобытности"
 song_of_valor_perk_name: "Песня доблести"
 SONG_OF_VALOR_PERK_EFFECT: "#clickable Куплет: Исцеляет 2 [POD_aggravated_box|E]#!\n#clickable Куплет: [GetModifier('galliard_song_prowess_modifier').GetNameWithTooltip]#!\n[PODUnlocksCombatMove('POD_combat_move_werewolf_song_of_valor')]\n#flavor Песня о героических подвигах древних гару, чтобы поддержать слушателей. Жажда героизма гонит их вперёд.#!"
 galliard_song_prowess_modifier: "Доблестная сила"
 canine_call_perk_name: "Зов псовых"
 CANINE_CALL_PERK_EFFECT: "[PODUnlocksCombatMove('POD_combat_move_werewolf_canine_call')]\n[character_interaction|E]: Можно получить модификатор [GetModifier('dog_story_modifier').GetNameWithTooltip]\n#flavor Со времён Владычества и Войны Гнева все остальные на планете жили в трепете и ужасе перед звуками воя волков. Именно таким голосом галлиард издаёт призыв, который слышат только собаки.#!"
 song_of_rage_perk_name: "Песня ярости"
 SONG_OF_RAGE_PERK_EFFECT: "#clickable Куплет: [GetModifier('galliard_song_irrational_modifier').GetNameWithTooltip]#!\n#clickable Куплет: [GetModifier('galliard_song_countermeasure_modifier').GetNameWithTooltip]#!\n#flavor Крик оборотня выпускает животное в сердце цели, доводя его до безумия.#!"
 galliard_song_irrational_modifier: "Неистовый военачальник"
 galliard_song_irrational_modifier_desc: "Этот персонаж настолько зол, что потерял способность действовать рационально."
 galliard_song_irrational_storyteller_modifier: "Легендарный неистовый военачальник"
 galliard_song_irrational_storyteller_modifier_desc: "$galliard_song_irrational_modifier_desc$"
 galliard_song_countermeasure_modifier: "Ослепляющая ярость"
 galliard_song_countermeasure_modifier_desc: "Столько ярости ослепляет их от скрытых опасностей. [Concept('scheme_countermeasures', 'Выбор мер противодействия')|E] больше не эффективен."
 galliard_song_countermeasure_storyteller_modifier: "Легендарная ослепляющая ярость"
 galliard_song_countermeasure_storyteller_modifier_desc: "$galliard_song_countermeasure_modifier_desc$"
 words_like_wind_perk_name: "Слова словно ветер"
 WORDS_LIKE_WIND_PERK_EFFECT: "#clickable Песни игнорируют [Concept('diplomatic_range', 'дипломатического радиуса')|E]#!\n#flavor Музыка, поэзия и крылатые фразы заразительны, они проносятся по культурам и сообществам, как ветерок сквозь деревья. Галлиард знает, как воспользоваться этой привычкой социальных существ, отправляя свои сообщения по всему миру от одного слушателя к другому.#!"
 song_of_the_siren_perk_name: "Песня сирены"
 SONG_OF_THE_SIREN_PERK_EFFECT: "#clickable Куплет: Увеличивает [Concept('opinion', 'мнение')|E] о галлиарде.#!\n#clickable Куплет: Можно получить [Concept('hook', 'рычаг влияния')|E]#!\n#flavor Звук голоса гару может очаровать любого, кто его слышит. Обычно гару поёт или воет, используя этот дар, хотя некоторые стали читать стихи.#!"
 galliard_song_of_the_siren_opinion: "Искушение сирены"
 song_of_the_siren_weak_hook: "Власть сирены"
 song_of_the_siren_strong_hook: "Контроль сирены"
 howl_of_assembly_perk_name: "Вой собрания"
 HOWL_OF_ASSEMBLY_PERK_EFFECT: "Согласие #TOOLTIP:GAME_TRAIT,werewolf,[GetNullCharacter] #L вервольфов#!#! на приглашение ко [Concept('court', 'двору')|E]: #P +10#!\n#flavor Вой галлиарда слышен на большом расстоянии, призывая гару на битву.#!"
 HOWL_OF_ASSEMBLY_INVITE: "[GetPerk('howl_of_assembly_perk').GetName(GetPlayer)]: $VALUE|=+0$"
 song_of_mockery_perk_name: "Песня насмешки"
 SONG_OF_MOCKERY_PERK_EFFECT: "#clickable Куплет: [GetModifier('galliard_song_vassal_opinion_modifier').GetNameWithTooltip]#!\n#clickable Куплет: Передаёт [Concept('prestige', 'престиж')|E] галлиарду#!\n[PODUnlocksCombatMove('POD_combat_move_werewolf_song_of_mockery')]\n#flavor Эти песни предназначены для того, чтобы высмеять врагов галлиарда. К сожалению, большинство из них слишком некультурны, чтобы осознать это.#!"
 galliard_song_vassal_opinion_modifier: "Насмешливая ода"
 song_of_serenity_perk_name: "Песня спокойствия"
 SONG_OF_SERENITY_PERK_EFFECT: "#clickable Куплет: Снижает [Concept('stress', 'стресс')|E]#!\n#clickable Куплет: [GetModifier('galliard_song_no_war_modifier').GetNameWithTooltip] и останавливает активные наступательные войны#!\n#flavor Самые успокаивающие звуки могут успокоить даже самые жестокие сердца.#!"
 galliard_song_no_war_modifier: "Полное спокойствие"
 galliard_song_no_war_modifier_desc: "Разум настолько спокоен, что они даже не могут подумать о разжигании [Concept('wars', 'войн')|E]."
 galliard_song_no_war_storyteller_modifier: "Легендарное полное спокойствие"
 galliard_song_no_war_storyteller_modifier_desc: "$galliard_song_no_war_modifier_desc$"
 song_of_the_storm_perk_name: "Песня шторма"
 SONG_OF_THE_STORM_PERK_EFFECT: "#clickable Куплет: Наносит @pod_combat_lightning_icon!#L;color:{1.00,0.95,0.35} [Concept('lightning_damage', 'урон от молнии')|E]#!#!\n#clickable Куплет: [GetModifier('galliard_song_speed_modifier').GetNameWithTooltip]#!\n#flavor Галлиард может коснуться самой ткани Штормовой Умбры своей песней, вызывая хаотический поток энергий Вильда, чтобы изменить окружающий мир или тех, кто оказался в нём.#!"
 galliard_song_speed_modifier: "Шаги бури"
 storyteller_perk_name: "Сказитель"
 STORYTELLER_PERK_EFFECT: "#clickable Стихи песен теперь срабатывают дважды или получают дополнительные эффекты.#!\n#flavor Вместо того, чтобы просто рассказывать и пересказывать старые истории или даже ждать, пока события дня станут новыми историями, галлиард может изменить события продолжающейся драмы, разворачивающейся вокруг него. Он может добавлять новых «персонажей», менять цепочки событий и даже менять мотивацию основных участников.#!"



 #Philodox
 command_the_gathering_perk_name: "Власть над собранием"
 COMMAND_THE_GATHERING_PERK_EFFECT: "#flavor Филодокс приковывает к себе взгляды громким восклицанием, хлопком в ладоши, ударом клэйва по щиту или каким-либо другим подобным жестом. Пока он не скажет своё слово, никто не имеет права отходить или прерывать его.#!"
 aura_of_the_just_perk_name: "Аура справедливости"
 AURA_OF_THE_JUST_PERK_EFFECT: "#flavor Когда пользователь дара совершает справедливый поступок, все вокруг узнают об этом, просто взглянув на него. Аура справедливости провозглашает всем и каждому, что этот гару прав. Там, где обстоятельства или представления могут омрачить суждения свидетелей, дар рассеивает все сомнения.#!"
 building_a_legend_perk_name: "Создание легенды"
 BUILDING_A_LEGEND_PERK_EFFECT: "#clickable Тренировка стаи:#! Все #TOOLTIP:GAME_TRAIT,werewolf,[GetNullCharacter] #L гару#!#! получают [Concept('trait_level_track_xp', 'опыт')|E] своих покровительств.\n#flavor Филодоксы являются естественными лидерами гару в мирное время, подкреплённые верой и доверием, оказываемыми им их подопечными.#!"
 truth_of_gaia_perk_name: "Истина Геи"
 TRUTH_OF_GAIA_PERK_EFFECT: "$countermeasures_unlocks_t1_supernatural_high_alert$\nСкорость прогресса [Concept('espionage', 'шпионажа')|E]: #P +25%#!\n#flavor Будучи судьями [Glossary('Литании', 'glossary_werewolf_litany_tt')], филодоксы обладают способностью чувствовать, говорят ли другие правду или ложь.#!"
 TRUTH_OF_GAIA_REASON: "$truth_of_gaia_perk_name$: $VALUE|+=0$"
 bonds_that_tie_us_perk_name: "Связующие узы"
 BONDS_THAT_TIE_US_PERK_EFFECT: "#clickable Тренировка стаи:#! Каждый участник получает [Concept('modifier', 'модификатор')|E] за каждое уникальное лунное покровительство в стае.\nЧлены стаи больше не могут [Concept('rival', 'соперничать')|E] друг с другом.\n#flavor Филодокс является посредником и судьей, но также и лидером. Этот дар помогает филодоксу в таких вопросах, раскрывая любые эмоции и мнения, существующие между другими.#!"
 philodox_pack_auspice_ahroun_modifier: "Мощь аруна"
 philodox_pack_auspice_galliard_modifier: "Песня галлиарда"
 philodox_pack_auspice_philodox_modifier: "Воля филодокса"
 philodox_pack_auspice_ragabash_modifier: "Тень рагабаша"
 philodox_pack_auspice_theurge_modifier: "Мудрость теурга"
 curse_the_betrayer_perk_name: "Проклятие предателя"
 CURSE_THE_BETRAYER_PERK_EFFECT: "[PODUnlocksCombatMove('POD_combat_move_werewolf_curse_the_betrayer')]\n[character_interaction|E]: Накладывает модификатор [GetModifier('curse_the_betrayer_modifier').GetNameWithTooltip] на [Glossary('фера', 'glossary_fera_tt')] из другой [Concept('religious_family', 'религиозной концепции')|E].\nВероятность [Concept('imprison', 'заключения в темницу')|E]: #P +10%#!\n#flavor Любой, кто предаёт филодокса, платит за свою нечестность. Суда не избежать.#!"
 CURSE_THE_BETRAYER_REASON: "$curse_the_betrayer_perk_name$: $VALUE|+=0$"
 curse_the_betrayer_modifier: "Проклятие предателя"
 rally_to_the_cause_perk_name: "Сплотиться за дело"
 RALLY_TO_THE_CAUSE_PERK_EFFECT: "#clickable Тренировка стаи:#! Все участники теряют [Concept('stress', 'стресс')|E].\nСоюзные [Concept('knights', 'рыцари')|E]-[Glossary('фера', 'glossary_fera_tt')] в [Concept('combat_phase', 'бою')|E] или вы сами во время [Concept('single_combat_duel_plural', 'поединков')|E] получите модификатор [GetModifier('rally_to_the_cause_modifier').GetNameWithTooltip].\n#flavor Иногда филодоксу необходимо сплотить Гару для достижения цели. Этот дар помогает филодоксу вдохновить других гару следовать его делу, несмотря на племенные или личные разногласия.#!"
 rally_to_the_cause_modifier: "Приказ филодокса"
 balance_man_and_beast_perk_name: "Баланс человека и зверя"
 BALANCE_MAN_AND_BEAST_PERK_EFFECT: "Удаляет все затраты на принятие формы [GetModifier('POD_werewolf_form_hispo_modifier').GetNameWithTooltip]\n#flavor Филодоксу необходимо крепко держать свою звериную сторону под контролем, опасаясь потерять контроль и, что ещё хуже, позволить своим страстям контролировать его суждения. Однако гару не могут отрицать свою животную природу; рациональность не может править в одиночку.#!"
 honour_bound_perk_name: "Связанный честью"
 HONOUR_BOUND_PERK_EFFECT: "Доступный участник вашей группы ([GetPlayer.Custom('PODCoterie')]) присоединится к вам в @pod_combat_encounter_icon![Concept('pod_combat_encounters', 'боевых столкновениях')|E]\n#clickable Тренировка стаи:#! Все [Glossary('фера', 'glossary_fera_tt')] получат [Concept('prestige', 'престиж')|E] и [Concept('legitimacy', 'легитимность')|E] соразмерно своему рангу.\n#flavor Многие стаи гару связаны крепкими узами. Этот дар укрепляет их чувство чести и взаимного уважения.#!"
 wisdom_of_the_ancient_ways_perk_name: "Мудрость древних путей"
 WISDOM_OF_THE_ANCIENT_WAYS_PERK_EFFECT: "[PODUnlocksCombatMove('POD_combat_move_werewolf_wisdom_of_the_ancient_ways')]\n#clickable Тренировка стаи:#! Все участники получат модификатор [GetModifier('philodox_ancient_ways_modifier').GetNameWithTooltip] и восстановят 2@gnosis_icon!гнозиса, если у вас есть [Concept('pack_totem', 'тотем стаи')|E].\n#flavor Все гару обладают врождённой связью со своими тотемными духами, формой расового бессознания, к которому можно получить доступ посредством интенсивной медитации. Гару могут глубоко проникнуть в эти глубокие воспоминания и вспомнить древние факты и знания, которые могут пригодиться сегодня.#!"
 philodox_ancient_ways_modifier: "Древние пути"
 break_the_bonds_perk_name: "Разорвать узы"
 BREAK_THE_BONDS_PERK_EFFECT: "[character_interaction|E]: Можно освободить персонажа из [Concept('imprisoned', 'темницы')|E].\nДаёт сильную ментальную защиту.\nНе может быть целью [Concept('blackmailed', 'шантажа')|E].\n#flavor Этот дар разрушает все узы, физические или психические, от крепких железных цепей до рабства заколдованной крови вампира.#!"


 #Ragabash
 fools_gold_perk_name: "Золото дураков"
 FOOLS_GOLD_PERK_EFFECT: "#clickable Теперь могут появляться Знаки Луны.#!\n#flavor То, что бесполезно для одного, бесценно для другого. Благосклонность Луны предназначена для тех, кто её ищет.#!"
 open_seal_perk_name: "Открытая печать"
 OPEN_SEAL_PERK_EFFECT: "#flavor С помощью этого дара гару может открыть практически любое закрытое или запертое устройство.#!"
 reynards_lie_perk_name:0 "Ложь Рейнарда"
 REYNARDS_LIE_PERK_EFFECT: "#flavor Рагабаш с этим даром может спокойно объяснять, что небо зелёное, или радостно потчевать других подвигами одинокого героического рагабаша и не бояться, что его уличат во лжи.#!"
 taking_the_forgotten_perk_name: "Забрать забытое"
 TAKING_THE_FORGOTTEN_PERK_EFFECT: "[PODUnlocksCombatMove('POD_combat_move_werewolf_taking_the_forgotten')]\nУдаляет все [Concept('artifact_claims', 'претензии')|E] у любых полученных [Concept('artifacts', 'артефактов')|E]\n#flavor Рагабаш не только опытный вор, но и те, у кого он крадёт, часто даже не осознают, что их ограбили.#!"
 turn_the_moon_perk_name: "Поворот Луны"
 TURN_THE_MOON_PERK_EFFECT: "#clickable Теперь могут появиться озарённые луной знаки Луны#!\n[Concept('schemes', 'Происки')|E] при использовании [Concept('secrecy_grace', 'снисхождения')|E] начинаются с дополнительными 12 месяцами.\nОткрывает [buy_artifact_claim_interaction|El]\n#flavor Сила гару возрастает и убывает вместе с луной. Но рагабаш снова переворачивает песочные часы.#!"
 terrain_shift_perk_name: "Смена ландшафта"
 TERRAIN_SHIFT_PERK_EFFECT: "#flavor Природа принимает рагабаша как союзника и рассматривает его преследователей как врагов. Земля и камни отодвигаются, образуя туннели или точки опоры, по которым можно подняться, за ним непроходимо скапливается листва, а реки создают сухие места, по которым он может перейти на другой берег.#!"
 chimerical_form_perk_name: "Химерическая форма"
 CHIMERICAL_FORM_PERK_EFFECT: "Открывает различные звериные формы смены облика.\n#flavor Все великие обманщики из легенд — мастера изменения формы, и рагабаш, овладевший этим даром, не является исключением. Используя его, он может изменить свою форму в форму любого животного размером от крошечного зяблика до огромного моржа.#!"
 mark_of_shame_perk_name: "Знак позора"
 MARK_OF_SHAME_PERK_EFFECT: "Каждый раз, когда вы получаете [Concept('artifact', 'артефакт')|E], его предыдущий владелец получает модификатор [GetModifier('mark_of_shame_modifier').GetNameWithTooltip]\n#flavor Рагабаш может наложить ужасное проклятие на тело противника, заставляя его ослабевать или увядать, часто в качестве возмездия за какое-то действие. Ужасное и разочаровывающее напоминание о смущении, причинённом жертве.#!"
 mark_of_shame_modifier: "Знак позора"
 umbral_dodge_perk_name: "Умбральное уклонение"
 UMBRAL_DODGE_PERK_EFFECT: "[PODUnlocksCombatMove('POD_combat_move_werewolf_umbral_dodge')]\n#flavor Рагабаш считает, что лучший способ справиться с врагом — отправить его подальше, возможно, туда, где он поймёт глупость своих действий. Он может прорвать дыру в Барьере, уклоняясь от атаки врага, отправив его в страну духов.#!"
 madness_season_perk_name: "Сезон безумия"
 MADNESS_SEASON_PERK_EFFECT: "[PODImprovesCombatMove('POD_combat_move_werewolf_bloodhound')]\nОткрывает вариант путешествия «[GetTravelOption('werewolf_ragabash_option').GetName]»\n#flavor Между безумным юмором и пропастью безумия часто проходит тонкая грань. Понимание новолунием этой границы позволяет ей сводить врагов на грань безумия.#!"
 madness_season_modifier: "Сезон безумия"
 madness_season_modifier_desc: "Этот персонаж дошёл до полного безумия, заставившей его присоединятся к [Concept('factions', 'фракциям')|E] без всякой причины."
 MADNESS_SEASON_FACTION_REASON: "[GetModifier('madness_season_modifier').GetNameWithTooltip]: $VALUE|0+=$"
 firebringer_perk_name: "Пламеносец"
 FIREBRINGER_PERK_EFFECT: "#clickable При получении знаков с 75 или более [Concept('artifact_power', 'силой артефакта')|E] вы получаете очки [Concept('perk', 'достоинств')|E], соответствующие [Concept('education', 'образованию')|E] владельца#!\nЦели вашего [Concept('character_interaction', 'взаимодействия')|E] #V «Обучить дару»#! получают дополнительные [Concept('perk', 'достоинства')|E].\n#flavor Рагабаш совершает величайший трюк, крадя силу и превращая её в свою собственную. Более того, этой силе можно научить других, как если бы новолуние было духовным учителем.#!"


 #Theurge
 airt_perception_perk_name: "Восприятие аэрта"
 AIRT_PERCEPTION_PERK_EFFECT: "#clickable[character_interaction|E]: Можно привязать [Concept('spirit_companion', 'духа-спутника')|E] к провинции с каэрном#!\n#flavor Теург может приблизительно идентифицировать дух по его аэрту, следу, оставленному после его прохождения. По сути, это работает так же, как отслеживание в материальном мире, и не более информативно.#!"
 sense_chiminage_perk_name: "Чувство пути"
 SENSE_CHIMINAGE_PERK_EFFECT: "#flavor Теурги с этим даром могут с первого взгляда узнать, где находится равновесие шиминажа у любого духовно сознающего существа.#!"
 eyes_of_the_lynx_perk_name: "Глаза рыси"
 EYES_OF_THE_LYNX_PERK_EFFECT: "$countermeasures_unlocks_t2_all_seeing_eye$\n#flavor Духи-рыси, воплощающие умбральный идеал мощного зрения своих земных собратьев, могут видеть даже за пределами физических препятствий. Теурги, изучающие этот дар, могут заглянуть сквозь стены или под землю.#!"
 spirit_skin_perk_name: "Шкура духа"
 SPIRIT_SKIN_PERK_EFFECT: "Можно сменить облик и поддерживать измененную форму, оставаясь в [Concept('umbra', 'Умбре')|E]\n#flavor Теург маскируется под дух волка в Умбре. Физически он по-прежнему выглядит точно так же, как форма люпуса, просто он производит впечатление духа, а не гару.#!"
 SPIRIT_SKIN_REASON: "$spirit_skin_perk_name$: $VALUE|+=0$"
 name_the_spirit_perk_name: "Узнать имя духа"
 NAME_THE_SPIRIT_PERK_EFFECT: "Доступны [Concept('men_at_arms', 'профессионалы')|E] - [GetMaA('jagglings').GetName].\n[PODUnlocksCombatMove('POD_combat_move_werewolf_name_the_spirit')]\n#flavor Гару способен определять тип и приблизительные уровни способностей духа, благодаря чему он затем сможет призвать духа к себе.#!"
 placation_perk_name: "Умиротворение"
 PLACATION_PERK_EFFECT: "Все ваши [Concept('spirit_companions', 'духовные спутники')|E] получат [Concept('trait_level_track_xp', 'опыт')|E] в конце [Concept('journeys', 'странствий')|E] #V Поиск духа#!.\nМожно выучить #V 2#! дополнительных [Concept('language', 'языка')|E] без каких-либо штрафов.\n#flavor Теург с этим даром всегда точно знает, какую жертву необходимо принести, чтобы искупить оскорбление духовного мира или просто отдать дань уважения.#!"
 prophecy_perk_name: "Пророчество"
 PROPHECY_PERK_EFFECT: "Доступно [Concept('decision', 'решение')|E] «Прорицание по звёздам».\n[PODImprovesCombatMove('POD_combat_move_werewolf_face_the_apocalypse')]\n#flavor Этот дар предлагает теургу истинное представление о будущем. Такие видения спорадичны и иногда загадочны, но если не предпринимать особых усилий, чтобы изменить то, что впереди, они всегда точны.#!"
 healing_the_soul_perk_name: "Исцеление души"
 HEALING_THE_SOUL_PERK_EFFECT: "#clickable Привязывание духа: Исцеляет все [Concept('diseases', 'хвори')|E] и снижает [Concept('stress', 'стресс')|E] всех [Concept('courtiers', 'придворных')|E]#!\n#clickable Привязывание духа: Привязка духа с максимальным рангом удалит ваши отрицательные [Concept('traits', 'свойства')|E] [Concept('stress', 'стресса')|E]#!\n#flavor После недели поста, трансов и общения с духами теург способен привести составляющие души в совершенное равновесие.#!"
 mold_the_spirit_perk_name: "Ваяние духа"
 MOLD_THE_SPIRIT_PERK_EFFECT: "#flavor Гару может изменить форму или предназначение духа. Как ни странно, дух не против.#!"
 spirit_vessel_perk_name: "Сосуд духа"
 SPIRIT_VESSEL_PERK_EFFECT: "#clickable Привязывание духа: Можно получить модификатор [GetModifier('theurge_spirit_vessel_modifier').GetNameWithTooltip], уровень которого зависит от ранга духа.#!\nДоступны элементальные формы смены облика.\n[PODUnlocksCombatMove('POD_combat_move_werewolf_spirit_vessel')]\n#flavor Один из наиболее тщательно охраняемых секретов теургов-старейшин — способность направлять дух. На короткое время гару и дух становятся одним существом, обладающим способностями обоих.#!"
 theurge_spirit_vessel_modifier: "Необузданная сила"
 SPIRIT_VESSEL_SCALE: "Ранг связанного духа"
 invoked_presence_perk_name: "Призванное присутствие"
 INVOKED_PRESENCE_PERK_EFFECT: "[character_interaction|E]: Можно принести [Concept('spirit_companion', 'духа-спутника')|E] с максимальным рангом в жертву, чтобы получить свойство «[GetTrait('truefaith').GetName(GetPlayer)]»\n#flavor Теург может напрямую призвать инкарну или целестина, сосредоточив их внимание на области вокруг себя. Это не вызывает аватара; скорее, присутствие — это мистическое проникновение принципа, который представляет призванный дух. Однако такая великая сила обходится дорого.#!"