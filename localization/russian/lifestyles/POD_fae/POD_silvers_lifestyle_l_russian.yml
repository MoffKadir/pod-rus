 slivers_verdage_uncontrolled_perk_name: "$sliver_1_name$ осколок Зелени"
 slivers_verdage_unstable_perk_name: "$sliver_2_name$ осколок Зелени"
 slivers_verdage_semi_stable_perk_name: "$sliver_3_name$ осколок Зелени"
 slivers_verdage_stable_perk_name: "$sliver_4_name$ осколок Зелени"
 slivers_verdage_perfect_perk_name: "$sliver_5_name$ осколок Зелени"

 sliver_verdage_flavor: "Зелень предполагает контроль над живой природой, начиная от растений и заканчивая животными и даже предметами, изготовленными из натуральных материалов (без химической обработки и т.д.). С помощью этой осколка пользователи создают и нейтрализуют природные яды, находят следы движения своей цели, расчищают заросшую местность и гадают, глядя на нити судьбы как на корни самой жизни. Зелень вызывает диких животных и химер, рожденных по их образу, и позволяет общаться с ними, вселяя чувство близости между практикующим и целью. Более того, она создаёт растения, делает почву плодородной или бесплодной, перемещает молодые побеги и заставляет растения цвести. Тем не менее, несмотря на свою способность оживлять растения, она не может создать разум. Осколок также позволяет заклинателям создавать объекты из природных ресурсов, представляя их в уме, а также преобразовывать органические вещества из одного в другое."

