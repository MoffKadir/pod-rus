 sliver_pyros_flavor: "Огонь горит. Такова его природа, и когда он действует бесконтрольно, он обеспечивает чрезвычайную интенсивность, свет и тепло. Пирос раскрывает ложь, поскольку она является неверным направлением и уловкой, проливая свет на тени жизни. Он создаёт огонь, контролируя и перенаправляя его, но никогда не удушая пламя, потому что огонь должен гореть. Он охватывает кулаки, позволяя голым кулакам наносить летальный урон, и усиливает гламур внутри Сокровищ, меняя их урон на серьёзный. Пламя поднимается, чтобы защитить своего владельца и ослепить противников, затрудняя им попадание в цель или облегчая побег после обнаружения. Яркость огня пылает в сердцах всех живых существ (и даже некоторых блудных детей-нежити), а Пирос усиливает ненависть и любовь до таких высот, что в конечном итоге поглощает цель, вселяя паранойю или страх быть отвергнутым. Он никогда не имеет дело с умеренными эмоциями и всегда доводит последствия до крайности или вызывает полное эмоциональное оцепенение, как будто пламя внутри души замерцало и погасло."

