 sliver_petros_flavor: "Петрос приносит выносливость, стойкость, долговечность и силу, которые присущи камням и самой земле. Используя только руки, заклинатель может за несколько часов вылепить из камня статуи в натуральную величину, изменить саму суть того, что представляет собой тип почвы или камня, и даже трансмутировать минералы (но никогда в железо). Он создаёт броню из минералов и изменяет массу и форму земли, заставляя её подниматься из земли в виде стен. Петрос связывает своего пользователя с древними временами, позволяя получить доступ к давно утерянным знаниям и информации, которая поможет в текущих затруднениях. Гломы часто используют осколок для обеспечения исполнения клятв и контрактов, связывая их прочностью самого камня и заставляя Грёзы обеспечивать их соблюдение. Хотя Петрос не может вызывать другие эмоции, он способен вселить в других преданность, что делает его отличным волшебством для лидеров всех мастей."

