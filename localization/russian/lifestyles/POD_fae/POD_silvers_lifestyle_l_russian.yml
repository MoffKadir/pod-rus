 sliver_stratus_flavor: "Стратус – это сущность воздуха. Спокойный бриз или бушующая буря, тёмные облака или чистое небо, тихий дождь или гроза — всё попадает в сферу действия этой магии. В то же время ветер также несёт сообщения для доставки или подслушивания. Шёпоты, предназначенные для отдельного человека, набирают силу, как если бы они передавались через динамики, а крики быстро заглушаются, когда воздух отказывается передавать их звуковые волны. Движение может быть медленным или чрезвычайно быстрым, в зависимости от того, как представитель филы высвобождает силу этого осколка, пока его союзники атакуют своих врагов. Он также создает временные иллюзии, уговаривая тени скрыть движение и отвлекающие уловки, чтобы успешно оставаться скрытыми, когда это необходимо. Хотя Стратус может создавать дикие порталы, если что-то пойдёт не так, он также позволяет телепортироваться на короткие расстояния (например, в пределах города или небоскреба)."

