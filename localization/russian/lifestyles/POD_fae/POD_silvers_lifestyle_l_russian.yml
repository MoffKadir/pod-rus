 sliver_aquis_flavor: "Вода — это жизнь. Она необходима для поддержания жизни смертных, животных и растений. Она разделяет и объединяет, а её форма постоянно меняется в зависимости от сосуда, если он есть. С помощью Аквиса Неодушевлённые могут вселить надежду, смывая сомнения, или вызвать горе от потери близкого в море. Они могут исцелять слезами, созданными этим заклинанием, и ранить жертв, топя их. Аквис позволяет разрушать иллюзии и миражи, открывая истину всем. В отражениях на воде практикующие видят прошлое и далёкие события, происходящие в этот момент. Аквис управляет водами: поднимает, разделяет, замораживает, растапливает и даже испаряет их. Вода встаёт на защиту, отталкивая врагов и прижимая их к земле, а туман скрывает движение. В Глубоких Грёзах Аквис исцеляет серьёзные раны и успокаивает эмоции, усиленные Пиросом."

 SLIVERS_AQUIS_UNCONTROLLED_PERK_EFFECT: "Улучшает [Concept('cantrips', 'заклятия')|E] искусства [GetTrait('art_aquis').GetName(GetPlayer)], снижая сложность [Concept('bunk', 'банка')|E] и затраты гламура на #P 1#! #weak (минимальная стоимость - 1 гламур)#!\nУлучшает [Concept('passive_cantrip', 'пассивное заклятие')|E] искусства [GetTrait('art_aquis').GetName(GetPlayer)], вместо этого накладывая модификатор [GetModifier('cantrip_uncontrolled_aquis_modifier').GetNameWithTooltip].\n#flavor $sliver_aquis_flavor$#!"
