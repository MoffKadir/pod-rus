 COMMON_ARTS_OMEN_PERK_EFFECT: "$cantrip_easy_bunk$ Раскрывает случайный [Concept( 'secret', 'секрет')|E] цели.\n$countermeasures_unlocks_t2_all_seeing_eye$\n[PODUnlocksCombatMove('POD_combat_move_fae_soothsay_omen')].\n#flavor Это элементарное заклятие позволяет на мгновение заглянуть в нить судьбы человека, места или вещи. Предсказание всегда расплывчато и редко касается непосредственных событий — на этом уровне провидец может в лучшем случае увидеть общую природу судьбы цели.#!"
 COMMON_ARTS_SEERS_WISP_PERK_EFFECT: "$cantrip_standard_bunk$ Раскрывает (призывает) [Concept('artifact', 'артефакт')|E] с [Concept('rarity', 'редкостью')|E], основанной на вашем [Concept('fae_realm', 'королевстве')|E] #TOOLTIP:GAME_TRAIT,realm_prop,[GetNullCharacter] #L Опоры#!#!.\n$cantrip_easy_bunk$ Можно получить [Concept('gold', 'золото')|E], количество зависит от вашего [Concept( 'fae_realm', 'королевства')|E] #TOOLTIP:GAME_TRAIT,realm_prop,[GetNullCharacter] #L Опоры#!#!.\n#flavor Провидец обретает способность вызвать яркий фрагмент из сердца Грёз, чтобы прийти туда, куда нужно отправиться. Нужно прошептать огоньку имя или описание предмета, человека или места, которые нужно найти, и он безошибочно приведёт вас туда по тропам Дан.#!"
 COMMON_ARTS_TATTLETALE_PERK_EFFECT: "Улучшает [Concept('cantrips', 'заклятия')|E] достоинств «[GetPerk('common_arts_omen_perk').GetName(GetPlayer)]» и «[GetPerk('common_arts_seers_wisp_perk').GetName(GetPlayer)]»: $cantrip_difficulty_reduce$.\n$countermeasures_unlocks_t3_all_seeing_eye$\n#flavor Это полезное заклятие позволяет провидцу видеть отдалённые сцены с помощью объекта или человека, которых он заворожил для этой цели. Традиционно всё, что находится в непосредственной близости от фокуса, отображается на ближайшей отражающей поверхности по выбору феи. Фея может использовать любое заклятие, основанное на восприятии, через фокус, как только связь будет установлена.#!"
 COMMON_ARTS_AUGURY_PERK_EFFECT: "$cantrip_standard_bunk$ Призывает #TOOLTIP:GAME_TRAIT,mortal,[GetNullCharacter] #L смертного#!#! с нужными вам [Concept('skills', 'навыками')|E] ко [Concept('court', 'двору')|E].\n$countermeasures_unlocks_t4_all_seeing_eye$\n#flavor Провидец проникает глубоко в ткань Дан, уговаривая силы судьбы и Грёзы указать путь к исполнению заветного желания. Предсказание — коварное и ненадежное искусство, поскольку путь, который оно открывает, всегда обрывист и туманен, но, если следовать ему старательно, оно приведёт к будущему, к которому стремится фея. Вместо того, чтобы дать указания для достижения поставленной цели, Пророчество предоставляет дразнящие намеки, подсказки, знаки и видения. Чем более ценно будущее, к которому стремится заклятие, тем более требовательным оказывается путь, который оно прокладывает.#!"
 COMMON_ARTS_FACE_FATE_PERK_EFFECT: "$cantrip_standard_bunk$ Накладывает на цель модификатор «[GetModifier('cantrip_face_fate_positive_modifier').GetNameWithTooltip]».\n$cantrip_standard_bunk$ Накладывает на цель модификатор «[GetModifier('cantrip_face_fate_negative_modifier').GetNameWithTooltip]».\n[PODUnlocksCombatMove('POD_combat_move_fae_soothsay_face_fate')].\n#flavor В этом величайшем искусстве предсказания провидец кладёт руки прямо на нити, из которых состоит великий гобелен Дан, и подчиняет их своей воле, благословляя субъекта удачей или проклиная его страшными предзнаменованиями. Точное проявление этого манипулирования судьбой трудно предсказать, но в знаках нельзя ошибиться.#!"

 common_arts_trick_of_the_light_perk_name: "Игра света"
 common_arts_veiled_eyes_perk_name: "Закрытые глаза"
 common_arts_dream_logic_perk_name: "Логика сновидений"
 common_arts_veiled_mind_perk_name: "Затуманенный разум"
 common_arts_lost_in_the_mists_perk_name: "Затерянные в туманах"

 COMMON_ARTS_TRICK_OF_THE_LIGHT_PERK_EFFECT: "$passive_cantrip_fae$ Вражеские [Concept('knights', 'рыцари')|E] в [Concept('combat_phase', 'бою')|E] или ваши противники во время [Concept('single_combat_duel_plural', 'поединков')|E] получат модификатор [GetModifier('cantrip_trick_of_the_light_modifier').GetNameWithTooltip].\n#flavor Тонкая манипуляция гламуром с целью запутать восприятие, приводит к недоразумениям и ошибкам. Пак, занимающийся похищением людей, говорит по телефону точь-в-точь как мать жертвы. Эшу, преследуемая сумасшедшим охотником, заходит на рынок и смешивается с толпой. Когда ей не везёт, ши отдаёт одну монету стократно, чтобы поужинать сегодня вечером.#!"
 COMMON_ARTS_VEILED_EYES_PERK_EFFECT: "$cantrip_hard_bunk$ Уничтожает [Concept('artifact', 'артефакт')|E], лимит [Concept('rarity', 'редкости')|E] которого зависит от вашего [Concept('fae_realm', 'королевства')|E] #TOOLTIP:GAME_TRAIT,realm_prop,[GetNullCharacter] #L Опоры#!#!.\n[PODUnlocksCombatMove('POD_combat_move_fae_chicanery_veiled_eyes')].\n#flavor Там, где «Игра света» заставляет зрителя путать одно с другим, это заклятие использует Туман, чтобы мгновенно сделать цель забывчивой. Китэйн, облачённый в придворные одежды, может пройти незамеченным сквозь толпу смертных, богато украшенный меч тролля свободно висит у него на бедре, но на него не обращают внимания, когда он входит в банк, а враги феи не обращают внимания на грозовые тучи, надвигающиеся по небу на их дом. Цель не становится физически невидимой, просто ее не замечают. Подменыши могут создавать вредоносные приложения, из-за чего мчащиеся повозки или приближающиеся враги остаются незамеченными, пока не станет слишком поздно.#!"
 COMMON_ARTS_DREAM_LOGIC_PERK_EFFECT: "$cantrip_easy_bunk$ Накладывает на цель модификатор [GetModifier('cantrip_dream_logic_modifier').GetNameWithTooltip].\n#flavor В хаосе Грёз процветают разрозненные и нелогичные связи, а подменыши, искусные в хитросплетениях, извлекают выгоду из странностей этих мест. Когда разум жертвы окутывается гламуром и последующим Туманом, она теряет ориентацию и не задаёт вопросов просьбам или приказам, которые обычно не имеют для нее никакого смысла. Шпионы эшу передают сообщения и посылки сбитыми с толку смертным гонцам. Тролль-смотритель зоопарка приручает новых животных, к которым никто другой не может безопасно приблизиться.#!"
 COMMON_ARTS_DREAM_LOGIC_PERK_REASON: "[GetPerk('common_arts_dream_logic_perk').GetName(GetPlayer)]: $VALUE|0+=$"
 COMMON_ARTS_VEILED_MIND_PERK_EFFECT: "$cantrip_standard_bunk$ Разрушает случайные [Concept('relation', 'отношения')|E] цели.\nУлучшает [Concept('passive_cantrip', 'пассивное заклятие')|E] достоинства «[GetPerk('common_arts_trick_of_the_light_perk').GetName(GetPlayer)]», накладывая модификатор [GetModifier('cantrip_veiled_mind_modifier').GetNameWithTooltip] вместо старого.\n#flavor Легенды и мифы рассказывают фантастические и вполне случавшиеся истории, в которых феи крадут воспоминания смертных. Выходя за рамки простого зрения или слуха, феи окутывают цель своего колдовства гламуром и сопутствующим Туманом, чтобы на время стереть цель из памяти каждого. Возлюбленная, которая отвергла китэйн, может понять, что её семья смотрит на неё с пустыми лицами, когда она приезжает домой на каникулы, или что соперница феи забывает вытащить свой меч во время дуэли.#!"
 COMMON_ARTS_LOST_IN_THE_MISTS_PERK_EFFECT: "$cantrip_hard_bunk$ Изменяет [Concept('personality_traits', 'свойства личности')|E] цели.\n[PODUnlocksCombatMove('POD_combat_move_fae_chicanery_lost_in_mists')].\n#flavor Что может быть хуже, чем не доверять своим чувствам, быть невидимым или даже забытым? Мастера Обмана используют самые совершенные методы манипулирования Туманом, чтобы скрыть личность своей жертвы. Цель этого колдовства не только забывает, кто она такая, фея может использовать свои знания королевств, чтобы заставить его поверить, что он - нечто совершенно иное. Соперник нокера начинает вести себя как собака, когда представляет новое изобретение. Вампир, терроризирующий местных мотли, просыпается, не помня о своем состоянии нежити, и впадает в панику, когда выходит на улицу и солнечный свет обжигает его кожу. Клюрикон заставляет смертного поверить, что он дождевая туча, чтобы тот совершил перформанс.#!"

 common_arts_ensnare_perk_name: "Пленение"
 common_arts_mooch_perk_name: "Похищение"
 common_arts_effigy_perk_name: "Подобие"
 common_arts_gimmix_perk_name: "Притягивание"
 common_arts_smoke_and_mirrors_perk_name: "Дым и зеркала"

 COMMON_ARTS_ENSNARE_PERK_EFFECT: "$passive_cantrip_fae$ Накладывает модификатор [GetModifier('cantrip_ensnare_modifier').GetNameWithTooltip] на вражеских [Concept('knights', 'рыцарей')|E] в начале войны.\n[PODUnlocksCombatMove('POD_combat_move_fae_legerdemain_ensnare')].\n#flavor Пленение полезно для того, чтобы убежать от цели или догнать кого-то, кто задолжал персонажу деньги, заставляя цель замедляться или становиться неподвижной. Кажется, что мебель прыгает на пути цели, выбоины сплющивают шины и ломают оси, или земля поднимается, чтобы отвести потоки воды. Даже при отсутствии поблизости какой-либо правдоподобной причины для возникновения помех, завитки гламура, создаваемые этим заклинанием, всё равно сбивают с толку, замедляют и отягощают цель.#!"
 COMMON_ARTS_MOOCH_PERK_EFFECT: "$cantrip_exceptional_bunk$ Позволяет украсть [Concept('artifact', 'артефакт')|E].\n#flavor Похищение предоставляет подменышам быстрый и простой способ заплатить за еду. В случае успеха мгновенно передает один неодушевленный предмет из рук жертвы в руки феи. Предмет может оказаться в руке, кармане или носке персонажа — в любом месте на его теле, которое он пожелает.#!"
 COMMON_ARTS_EFFIGY_PERK_EFFECT: "Доступны различные [Concept('men_at_arms', 'профессионалы')|E]-[Concept('POD_construct_maa', 'конструкты')|E].\n$cantrip_standard_bunk$ Позволяет скопировать принадлежащий вам [Concept('artifact', 'артефакт')|E].\n#flavor Манипулирование гламуром, достаточно сложное, чтобы что-то скопировать, требует времени и терпения, но, освоив его, можно создавать копии, достаточно хорошие, чтобы одурачить наблюдателя, по крайней мере, на некоторое время. Воровка-пак может сделать хорошую копию картины, которую она согласилась украсть и продать, но теперь хочет сохранить для своей коллекции. Продавец-красношапка, который ходит от двери к двери, может вылепить точную копию мопса, которого он только что съел, чтобы семья не заметила пропажи собаки, пока он не уйдёт.#!"
 COMMON_ARTS_GIMMIX_PERK_EFFECT: "[PODUnlocksCombatMove('POD_combat_move_fae_legerdemain_gimmix')].\n#flavor Смертные маги тратят бессчетное количество часов, демонстрируя сложные трюки, чтобы убедить других, что они могут перемещать предметы и управлять ими силой своего разума. Используя заклинание «Притягивание», фее достаточно использовать чары, чтобы перемещать и манипулировать всем, что она видит, с достаточной точностью и силой. Рыцарь-ши останавливает стрелу, выпущенную в нескольких дюймах от груди своего сюзерена. Парковщик-слуаг отправляет фургон, управляемый вампиром, за пределы парковки. Хирург красношапка удерживает своего «пациента» достаточно долго, чтобы надеть на него наручники. Нокер вскрывает замок на двери своей камеры без каких-либо инструментов.#!"
 COMMON_ARTS_SMOKE_AND_MIRRORS_PERK_EFFECT: "Улучшает [Concept('passive_cantrip', 'пассивное заклятие')|E] достоинства «[GetPerk('common_arts_ensnare_perk').GetName(GetPlayer)]», вместо этого накладывая модификатор [GetModifier('cantrip_smoke_and_mirrors_modifier').GetNameWithTooltip].\n#flavor Мастера Фокусов выходят за рамки жалких копий или временных манипуляций и могут создавать долговечные, убедительные иллюзии с помощью своего гламура. Разрушенный мост может показаться достаточно прочным, чтобы по нему могла проехать повозка, или тролль-громила может отступить, увидев сатира с целой толпой разъярённых (и иллюзорных) друзей за его спиной. Персонаж может даже устроить целую вечеринку с едой, гостями и музыкой.#!"

 common_arts_willow_whispers_perk_name: "Шёпот ивы"
 common_arts_eldritch_prime_perk_name: "Изначальная мощь"
 common_arts_oakenshield_perk_name: "Дубовый щит"
 common_arts_elder_form_perk_name: "Старший облик"
 common_arts_dance_of_the_five_kings_perk_name: "Танец пяти королей"

 COMMON_ARTS_WILLOW_WHISPERS_PERK_EFFECT: "#flavor Эти полезные чары позволяют фее разговаривать с миром и слышать его ответы. Она может использовать «Шёпот ивы», чтобы разговаривать с любым растением, животным, предметом или природной особенностью — любым камнем, любым украшенным драгоценностями кольцом, любым сверкающим клинком, любым животным, обычно неспособным говорить.#!"
 COMMON_ARTS_ELDRITCH_PRIME_PERK_EFFECT: "$cantrip_standard_bunk$ Манипулирует погодой области в зависимости от вашей #TOOLTIP:GAME_TRAIT,realm_scene,[GetNullCharacter] #L Сцены#!#! и #TOOLTIP:GAME_TRAIT,realm_nature,[GetNullCharacter] #L Природы#!#!.\nДоступны различные элементальные [Concept('men_at_arms', 'профессионалы')|E].\n#flavor Это заклятие позволяет феям вызывать проявления стихий земли, воды, дерева, огня или воздуха. Это проявляется в наиболее естественной форме — например, вода льётся с неба в виде дождя или бьёт из-под земли в виде небольшого родника. Камни с грохотом вырываются из земли. Растения вырастают с неестественной скоростью. Эти явления могут происходить в совершенно неестественных местах, например, когда внутри здания идет дождь, или цветущие ветви вырастают из головы сердитого учителя математики, как красивые оленьи рога.#!"
 COMMON_ARTS_OAKENSHIELD_PERK_EFFECT: "$cantrip_standard_bunk$ Накладывает на цель модификатор [GetModifier('cantrip_oakenshield_modifier').GetNameWithTooltip].\n[PODUnlocksCombatMove('POD_combat_move_fae_primal_oakenshield')].\n#flavor Это полезное заклятие укрепляет свою цель защитной оболочкой из стихий. Несмотря на название, это не обязательно должен быть слой коры, похожий на броню; оно также может сделать кожу человека твердой, как мрамор, а кажущаяся твердой поверхность двери при ударе может разбрызгиваться и превращаться в воду.#!"
 COMMON_ARTS_ELDER_FORM_PERK_EFFECT: "Вариант [Concept('shapeshift', 'смены облика')|E]: можно стать элементалем.\n#flavor Это мощное заклятие позволяет фее наполнить кого-то или что-то самой сущностью одной из стихий, превращая их в живое проявление силы стихии.#!"
 COMMON_ARTS_DANCE_OF_THE_FIVE_KINGS_PERK_EFFECT: "$unlock_forging_node$ Добавляет [Concept('modifier', 'модификатор')|E] в зависимости от типа [Concept('artifact', 'артефакта')|E], сила которого основана на #TOOLTIP:GAME_TRAIT,realm_prop,[GetNullCharacter] #L Опоре#!#!.\n[PODUnlocksCombatMove('POD_combat_move_fae_primal_dance_five_kings')].\n#flavor Это мощное заклятие подчиняет фее пять стихий. Она приказывает, и пламя, земля и вода повинуются ей. Она может направлять любые проявления стихий, которые уже присутствуют, атаковать, сдерживать, заманивать в ловушку, расчищать путь или просто изменять форму по своему вкусу.#!"

 common_arts_hopscotch_perk_name: "Прыжок"
 common_arts_quicksilver_perk_name: "Быстрота"
 common_arts_portal_passage_perk_name: "Проход через портал"
 common_arts_wind_runner_perk_name: "Бегущий-по-ветру"
 common_arts_flicker_flash_perk_name: "Мгновенный переход"

 COMMON_ARTS_HOPSCOTCH_PERK_EFFECT: "#flavor Это искусство невероятных прыжков, которое потенциально позволяет субъекту перепрыгивать через высокие здания одним махом. Прыжок перемещает объект вперёд или вверх по желанию феи, а использование гламура гарантирует, что приземление всегда будет без повреждений, независимо от того, как далеко цель упадёт. Некоторые паки утверждают, что когда—то Прыжок был их особой магией, украденной ловкачом-эшу во времена легенд и распространившейся среди остальных фей, но кто поверит в это?#!"
 COMMON_ARTS_QUICKSILVER_PERK_EFFECT: "[PODUnlocksCombatMove('POD_combat_move_fae_wayfare_quicksilver')].\n#flavor С лёгкой усмешкой субъект этого заклятия буквально размывается, оставляя за собой следы израсходованного гламура в виде скоростных линий, потрескивающих молний или какого-либо другого визуального эффекта. Пёстрая компания пикси мчится навстречу фургону, перевозящему украденные сокровища, сжигая дорогу на своём пути. Рыцарь-ши превращается в сгусток сверкающей стали и испепеляющей магии.#!"
 COMMON_ARTS_PORTAL_PASSAGE_PERK_EFFECT: "$cantrip_standard_bunk$ Телепортирует вашу армию.\n#flavor Это искусство входить или выходить, когда и где пожелает фея. Проход через портал создаёт дверь, достаточно большую для того, чтобы в неё могла пройти фея, и пробивает любую преграду толщиной до 10 футов — будь то кирпичная стена, живая изгородь или борт движущегося фургона, - для заклинания это не имеет значения. Двери, созданные с помощью чар, уникальны для феи, создающей их, и могут быть распознаны теми, кто знаком с ней.#!"
 COMMON_ARTS_WIND_RUNNER_PERK_EFFECT: "#flavor Бегущий-по-ветру - это великолепное искусство полёта. Большинство считает, что это особое волшебство было выменяно или украдено у неодушевлённых или каких-то похожих духов ветров, хотя наннехи поговаривают, что изначально оно принадлежало им, и они научились ему дорогой ценой у ужасного зверя, известного как вендиго.#!"
 COMMON_ARTS_FLICKER_FLASH_PERK_EFFECT: "[PODUnlocksCombatMove('POD_combat_move_fae_wayfare_flicker_flash')].\n#flavor Это внушающее страх заклятие позволяет фее идти куда ей заблагорассудится, и никто не может помешать ей. Это удивительный трюк исчезающих колдунов и злорадствующих воров, позволяющий субъекту исчезать и появляться там, где он пожелает.#!"

 common_arts_dream_walk_perk_name: "Снохождение"
 common_arts_dream_craft_perk_name: "Сотворение грёз"
 common_arts_dream_portal_perk_name: "Портал грёз"
 common_arts_manifest_perk_name: "Проявление"
 common_arts_dream_puppet_perk_name: "Кукла грёз"

 COMMON_ARTS_DREAM_WALK_PERK_EFFECT: "$cantrip_easy_bunk$ Вызывает у цели #V 20#! [Concept('static_stress', 'психического напряжения')|E].\n#flavor После изучения первого заклинания онейромантии фея может установить мост между Грёзами и разумом своей цели, что позволяет ей полностью погрузиться в сон. Она должна нацелиться на кого-то или что-то спящее, кого она либо хорошо знает, либо может видеть. Затем персонаж полностью проникает в сны объекта и исчезает из обычного мира. Субъект может осознавать, а может и не осознавать, что фея - это нечто большее, чем просто часть его сна, но он вспомнит этот сон после пробуждения.#!"
 COMMON_ARTS_DREAM_CRAFT_PERK_EFFECT: "$cantrip_standard_bunk$ Снижает [Concept('stress', 'стресс')|E] цели на #V 30#!.\nУлучшает [Concept('cantrip', 'заклятие')|E] достоинства «[GetPerk('common_arts_dream_walk_perk').GetName(GetPlayer)]», вызывая вместо этого #V 40#! [Concept('static_stress', 'психического напряжения')|E].\n#flavor Некоторые сны остаются с теми, кто спит, даже после пробуждения, окрашивая настроение их дня. Онейромант больше не ограничивается проникновением в сон жертвы и минимальным взаимодействием с ней, он может управлять пейзажем сна, создавая мирные картины в сознании спящего или вызывая ужасные кошмары, которые будут преследовать его на следующий день.#!"
 COMMON_ARTS_DREAM_PORTAL_PERK_EFFECT: "$cantrip_easy_bunk$ Телепортирует вас к цели [Concept('travel', 'путешествия')|E].\n#flavor Используя тонкую грань между сознанием сновидца и самими Грёзами, онейромант может наложить их друг на друга, чтобы создать портал. Сон субъекта становится промежуточной станцией, которая соединяет местоположение заклинателя и спящего.#!"
 COMMON_ARTS_MANIFEST_PERK_EFFECT: "Если вы являетесь #TOOLTIP:GAME_TRAIT,changeling,[GetNullCharacter] #L подменышем#!#!, доступны различные [Concept('POD_chimera_maa', 'химерические')|E] [Concept('men_at_arms', 'профессионалы')|E].\n#flavor Под руководством онейроманта элементы сновидения могут оживать в химере бодрствующего мира. Она сохраняет ограниченный контроль над разумной химерой на некоторое время после пробуждения сновидца, но без гламура заклинателя химера исчезнет, когда сон забудется. Вкладывая свою волю в это проявление, онейромант может даже притянуть химеру в обычный мир, хотя она исчезнет ещё быстрее.#!"
 COMMON_ARTS_DREAM_PUPPET_PERK_EFFECT: "$cantrip_exceptional_bunk$ [Concept('imprison', 'Заключает в темницу')|E] цель.\n#flavor Некоторые ученики онейромантии оставляют этот путь, когда становится ясна кульминация их обучения. Мастер-онейромант больше не ограничивается манипуляцией снами или их пересечением с Грёзами, онейромант может вторгаться в разум цели и брать под контроль её облик, пока она спит.#!"

 common_arts_sparrows_and_nightingales_perk_name: "Воробьи и соловьи"
 common_arts_worms_and_giants_perk_name: "Черви и великаны"
 common_arts_thousandskins_perk_name: "Тысяча шкур"
 common_arts_beastskin_perk_name: "Звериная шкура"
 common_arts_chimeric_exultation_perk_name: "Химерическое торжество"

 COMMON_ARTS_SPARROWS_AND_NIGHTINGALES_PERK_EFFECT: "Вариант [Concept('shapeshift', 'смены облика')|E]: Можно изменить свой визуальный возраст и черты лица.\n#flavor Это заклятие позволяет фее отделить свою цель от неё самой, изменив одну фундаментальную черту на какую-то схожую альтернативу. Она может превратить мужчину в женщину, рыжего в брюнета, невысокую женщину сделать высокой, а чернокожего мужчину - белым.#!"
 COMMON_ARTS_WORMS_AND_GIANTS_PERK_EFFECT: "Вариант [Concept('shapeshift', 'смены облика')|E]: Можно получить свойство «[GetTrait('dwarf').GetName(GetPlayer)]» или «[GetTrait('giant').GetName(GetPlayer)]».\nМожет оседлать небольших животных, таких как кошки.\n[PODUnlocksCombatMove('POD_combat_move_fae_metamorphosis_giants_stature')].\n#flavor Это легендарное заклятие можно использовать для того, чтобы уменьшить или расширить цель, создавая ездовых мышей для межевого рыцаря-пака, уменьшая размеры богганов, чтобы по-настоящему проработать детали обуви, превращая столовые ножи в импровизированные мечи или наказывая неотёсанных смертных истинным взглядом червяка на Осенний мир.#!"
 COMMON_ARTS_THOUSANDSKINS_PERK_EFFECT: "Вариант [Concept('shapeshift', 'смены облика')|E]: Можно принять звериный облик.\n#flavor Это могущественное заклятие позволяет фее превращать человека или предмет в животное. Люди, преобразованные таким образом, сохраняют свой разум и инстинкты, но приобретают физические черты, сенсорные способности и ограничения, а также особые способности любого животного, в которое они были превращены. Объекты, превращенные в животных, приобретают разум «типичного» представителя того вида, которым они стали на время трансформации, так что кролик будет пугливым, лев - охотящимся и так далее. Трансформированные люди и феи сохраняют дар речи, но только для тех, кто способен воспринимать химерическую реальность.#!"
 COMMON_ARTS_BEASTSKIN_PERK_EFFECT: "$cantrip_easy_bunk$ Накладывает на цель [Concept('modifier', 'модификатор')|E], увеличивающий один [Concept('skill', 'навык')|E] на #P 5#!.\n[PODUnlocksCombatMove('POD_combat_move_fae_metamorphosis_beastskin_talons')].\n#flavor Это удобное благословение или проклятие улучшает метаморфозу, позволяя частично трансформироваться. Грубый смертный может получить морду свиньи, благородный скакун - крылья лебедя, а загнанный в угол простолюдин может получить свирепые когти или ядовитые клыки, с помощью которых можно сражаться.#!"
 COMMON_ARTS_CHIMERIC_EXULTATION_PERK_EFFECT: "Вариант [Concept('shapeshift', 'смены облика')|E]: Можно принять облик мифического зверя.\n#flavor Это фантастическое заклятие позволяет фее превратить свою цель в легендарное существо или даже в фантастического зверя, которого она сама придумает, смешивая черты и природу разных существ. Драконы, мантикоры, грифоны, легендарный кракен — любой может быть вызван «Химерическим торжеством».#!"

 common_arts_kindle_perk_name: "Кресало"
 common_arts_illuminate_perk_name: "Озарение"
 common_arts_purity_perk_name: "Очищение"
 common_arts_engulf_perk_name: "Поглощение"
 common_arts_phoenix_song_perk_name: "Песнь феникса"

 COMMON_ARTS_KINDLE_PERK_EFFECT: "$passive_cantrip_fae$ Вражеские [Concept('knights', 'рыцари')|E] и [Concept('commanders', 'командиры')|E] в [Concept('combat_phase', 'бою')|E] или ваши противники во время [Concept('single_combat_duel_plural', 'поединков')|E] получат модификатор [GetModifier('cantrip_kindle_modifier').GetNameWithTooltip].\n#flavor Простой, но в высшей степени полезный инструмент, Кресало нагревает цёль гламура настолько, чтобы вызвать дискомфорт, но не навредить. С помощью Кресала можно приготовить еду, разжечь огонь или заставить кого-то вспотеть и выглядеть возбуждённым.#!"
 COMMON_ARTS_ILLUMINATE_PERK_EFFECT: "$passive_cantrip_fae$ Вражеские [Concept('knights', 'рыцари')|E] и [Concept('commanders', 'командиры')|E] в [Concept('combat_phase', 'бою')|E] или ваши противники во время [Concept('single_combat_duel_plural', 'поединков')|E] получат модификатор [GetModifier('cantrip_illuminate_modifier').GetNameWithTooltip].\n[PODUnlocksCombatMove('POD_combat_move_fae_pyretics_illuminate')].\n#flavor Бесчисленные мифы смертных о сотворении мира начинаются с того, что божественный свет пронзает тьму. В основе таких историй лежит сила подменышей, искусных в Пламени. Направляя гламур в это заклятие, китэйн может создать свет, который рассеивает тьму, иллюзии и мелкие уловки.#!"
 COMMON_ARTS_PURITY_PERK_EFFECT: "$cantrip_standard_bunk$ Можно исцелить любую хворь.\n$cantrip_standard_bunk$ Исцеляет [EmptyScope.ScriptValue('POD_pyretics_interaction_superficial_heal_value')] ед. @health_track_damage_icon! [Concept('POD_superficial_damage', 'поверхностного урона')|E].\n$cantrip_standard_bunk$ Исцеляет [EmptyScope.ScriptValue('POD_pyretics_interaction_aggravated_heal_value')] ед. @health_track_aggravated_damage_icon! [Concept('POD_aggravated_damage', 'серьёзного урона')|E].\n#flavor Никакая нечисть не выдерживает высокой температуры, но изучающий Пламя может выжечь загрязнения химерическим огнём, который не навредит объекту и не уничтожит его. Очищение делает воду и продукты безопасными для употребления, может уничтожать инфекцию или яд и даже временно излечивать болезни. Связывая заклинание с королевством фей, заклинатель может даже сжигать проклятия и эффекты от других заклинаний.#!"
 COMMON_ARTS_ENGULF_PERK_EFFECT: "$passive_cantrip_fae$ Наносит [EmptyScope.ScriptValue('common_arts_engulf_perk_damage')] ед. @health_track_aggravated_damage_icon! [Concept('POD_aggravated_damage', 'серьезного урона')|E] вражеским Concept('knights', 'рыцарям')|E] в [Concept('combat_phase', 'бою')|E], или вашим противникам во время [Concept('single_combat_duel_plural', 'поединков')|E].\n[PODUnlocksCombatMove('POD_combat_move_fae_pyretics_engulf')].\n#flavor Иногда фее просто нужно что-то поджечь. Простое и мощное заклятие «Поглощение» заставляет цель гореть. Фея может выбрать, сгорит ли цель магии от пламени или останется защищённой от венца магического огня.#!"
 COMMON_ARTS_PHOENIX_SONG_PERK_EFFECT: "$cantrip_hard_bunk$ Накладывает на цель модификатор [GetModifier('extra_life_1_modifier').GetNameWithTooltip].\n#flavor Феникс сгорает дотла, и после уничтожения пламя возрождается вновь. Мастерство Пламени даёт фее силу новой жизни перед лицом разрушения. После того, как фея призовёт «Песнь феникса», если получатель этого благословения умрёт или будет уничтожен иным образом, он или оно превратится в пепел и вскоре переродится вновь.#!"

 common_arts_howling_gale_perk_name: "Воющая буря"
 common_arts_electric_gremlins_perk_name: "Электрические гремлины"
 common_arts_hurricane_speed_perk_name: "Ураганная скорость"
 common_arts_storm_shroud_perk_name: "Грозовой барьер"
 common_arts_lord_of_levin_perk_name: "Повелитель молнии"

 COMMON_ARTS_HOWLING_GALE_PERK_EFFECT: "$cantrip_standard_bunk$ Накладывает на цель модификатор [GetModifier('cantrip_howling_gale_modifier').GetNameWithTooltip].\n[PODUnlocksCombatMove('POD_combat_move_fae_skycraft_howling_gale')].\n#flavor Фея может вызывать мощный ветер, используя его, чтобы ускорить передвижение себя или своих союзников, сбить с толку своих врагов или просто дуть, как она пожелает.#!"
 COMMON_ARTS_ELECTRIC_GREMLINS_PERK_EFFECT: "$cantrip_hard_bunk$ Накладывает на выбранный [Concept('artifact', 'артефакт')|E] модификатор [GetModifier('cantrip_electric_gremlins_modifier').GetNameWithTooltip].\n#flavor Это заклятие призывает множество гремлинов — мелких химер, которые разрушают сложные предметы. Гремлины - это крошечные зеленовато-жёлтые существа, наделённые способностью прятаться за чем угодно, каким бы маленьким оно ни было, при непосредственном наблюдении, и их присутствие разрушает сложные предметы.#!"
 COMMON_ARTS_HURRICANE_SPEED_PERK_EFFECT: "Улучшает [Concept('cantrip', 'заклятие')|E] достоинства «[GetPerk('common_arts_howling_gale_perk').GetName(GetPlayer)]», вместо этого накладывая модификатор [GetModifier('cantrip_hurricane_speed_modifier').GetNameWithTooltip].\n#flavor Феи взывают к самой сути ветра и вселяют ее в человека или вещь. Те, кто наделен ураганной скоростью, приобретают не только стремительность ветра, но и его экспансивность, ускоряя рефлексы и реакции. Объекты становятся единым целым с ветром, перенося себя на огромные расстояния, как только их приводят в движение.#!"
 COMMON_ARTS_STORM_SHROUD_PERK_EFFECT: "$passive_cantrip_fae$ Наносит [EmptyScope.ScriptValue('common_arts_storm_shroud_perk_damage')] ед. @health_track_damage_icon! [Concept('POD_superficial_damage', 'поверхностного урона')|E] вражеским [Concept('knights', 'рыцарям')|E] в [Concept('combat_phase', 'бою')|E], или вашим противникам во время [Concept('single_combat_duel_plural', 'поединков')|E].\n#flavor Фея призывает сущность молнии в цель этого заклинания, окружая его мерцающим ореолом электрического разрушения.#!"
 COMMON_ARTS_LORD_OF_LEVIN_PERK_EFFECT: "$cantrip_hard_bunk$ Наносит цели [EmptyScope.ScriptValue('common_arts_lord_of_levin_perk_interaction_damage')] ед. @health_track_aggravated_damage_icon! [Concept('POD_aggravated_damage', 'серьёзного урона')|E].\nУлучшает [Concept('passive_cantrip', 'пассивное заклятие')|E] достоинства «[GetPerk('common_arts_howling_gale_perk').GetName(GetPlayer)]», вместо этого нанося [EmptyScope.ScriptValue('common_arts_lord_of_levin_perk_damage')] ед. @health_track_damage_icon! [Concept('POD_superficial_damage', 'поверхностного урона')|E].\n[PODUnlocksCombatMove('POD_combat_move_fae_skycraft_lord_of_levin')].\n#flavor Мастер ремесла бурь повелевает самим небесным огнём и может посылать молнии, чтобы поражать своих врагов. Обычно это заклятие действует только под открытым небом, но фея, зачаровавшая себя «Грозовым барьером», может использовать «Повелителя молний», чтобы метать молнии кончиками пальцев, пока действует «Грозовой барьер».#!"