 noble_arts_backwards_glance_perk_name: "Взгляд в прошлое"
 noble_arts_effect_and_cause_perk_name: "Следствие и причина"
 noble_arts_set_in_stone_perk_name: "Высечено в камне"
 noble_arts_deja_vu_perk_name: "Дежавю"
 noble_arts_time_dilation_perk_name: "Искажение времени"

 NOBLE_ARTS_BACKWARDS_GLANCE_PERK_EFFECT: "Если кто-то из ваших родственников или друзей будет убит при загадочных обстоятельствах, вы узнаете их убийц.\n#flavor Для начала изучающий магию времени учится заглядывать в прошлое. Несмотря на то, что использование Хроноса считается элементарным, полезность заклинания делает востребованными даже новичков во фригольдах. Ши, расследующий исчезновение своего вассала, просматривает прошлое того места, где его видели в последний раз. Подозревая свою возлюбленную, тролль заглядывает в её день и видит встречу с её любовником.#!"
 NOBLE_ARTS_EFFECT_AND_CAUSE_PERK_EFFECT: "$passive_cantrip_fae$ Вражеские [Concept('knights', 'рыцари')|E] в [Concept('combat_phase', 'бою')|E] или ваши противники во время [Concept('single_combat_duel_plural', 'поединков')|E] получат модификатор [GetModifier('cantrip_effect_and_cause_modifier').GetNameWithTooltip].\n[PODUnlocksCombatMove('POD_combat_move_fae_chronos_effect_and_cause')].\n#flavor Первое заклятие, связанное с искажением времени, нарушает нормальное течение времени для цели. Звук бьющегося стекла может предшествовать падению бокала на землю, или рана может появиться до того, как меч опустится на плоть.#!"
 NOBLE_ARTS_SET_IN_STONE_PERK_EFFECT: "$cantrip_standard_bunk$ Делает [Concept('artifact', 'артефакт')|E] неразрушимым и добавляет модификатор [GetModifier('cantrip_set_in_stone_modifier').GetNameWithTooltip].\nВаши питомцы больше не умрут от старости.\n#flavor Незначительные манипуляции с течением времени предшествуют тому, что китэйн научится перекрывать реку и временно останавливать само время. Наложение заклятия на цель предотвращает обычные эффекты старения и воздействия на внешний мир, но не препятствует нормальному взаимодействию с целью или намеренному уничтожению. Время больше не оказывает такого же воздействия на объект, предотвращая рост, старение, порчу, а иногда и прогресс. Погодные условия могут оставаться неизменными в течение нескольких недель, в то время как продукты будут оставаться спелыми и съедобными неопределённое время. Заклятие не предотвращает преднамеренное нанесение вреда или порчи, а это означает, что меч китэйн, возможно, никогда не будет нуждаться в уходе, но всё равно получит повреждения при ударе.#!"
 NOBLE_ARTS_DEJA_VU_PERK_EFFECT: "$cantrip_standard_bunk$ Накладывает на цель модификатор [GetModifier('cantrip_deja_vu_modifier').GetNameWithTooltip].\n#flavor Помимо манипулирования восприятием времени, включая остановку времени вокруг цели, фея учится заново переживать недавний момент и заново переживать настоящее со знаниями о будущем. По мере того, как время движется вперед, возможности ветвления делают любое долгосрочное применение заклинания бесполезным, но на несколько минут адепт Хроноса становится путешественником во времени. Обладая такой неоспоримой силой, фея также принимает риск оказаться перегруженной возможными вариантами будущего. Повторное использование «Дежавю» в одной и той же сцене становится всё более трудным по мере того, как нити судьбы запутываются.#!"
 NOBLE_ARTS_TIME_DILATION_PERK_EFFECT: "$cantrip_hard_bunk$ Можно состарить цель на #V 25#! лет.\n$passive_cantrip_fae$ Вражеские [Concept('knights', 'рыцари')|E] в [Concept('combat_phase', 'бою')|E] или ваши противники во время [Concept('single_combat_duel_plural', 'поединков')|E] получат модификатор [GetModifier('cantrip_time_dilation_modifier').GetNameWithTooltip].\n[PODUnlocksCombatMove('POD_combat_move_fae_chronos_time_dilation')].\n#flavor Источник легенд о Рипе ван Винкле, замедление времени, толкает цель вперёд во времени и выводит её из синхронизации с остальным миром. Цель будет стареть и страдать от обычных последствий течения времени, но мир вокруг неё почти не изменится.#!"

 noble_arts_burning_chew_perk_name: "Burning Chew"
 noble_arts_confounding_coils_perk_name: "Confounding Coils"
 noble_arts_dragonscales_perk_name: "Dragonscales"
 noble_arts_holy_strike_perk_name: "Holly-Strike"
 noble_arts_tripping_the_ire_perk_name: "Tripping the Ire"

 NOBLE_ARTS_BURNING_CHEW_PERK_EFFECT: "$unlock_forging_node$ Добавляет модификатор [GetModifier('artifact_prowess_2_modifier').GetNameWithTooltip].\n$cantrip_standard_bunk$ Накладывает на цель модификатор [GetModifier('cantrip_burning_chew_modifier').GetNameWithTooltip].\n$passive_cantrip_actor$ Союзные [Concept('knights', 'рыцари')|E] в [Concept('combat_phase', 'бою')|E] или вы сами во время [Concept('single_combat_duel_plural', 'поединков')|E] получите модификатор [GetModifier('cantrip_burning_chew_modifier').GetNameWithTooltip].\n$countermeasures_unlocks_t1_supernatural_high_alert$\n#flavor Это заклятие наполняет свою цель пылающей легендарной мощью, даруя ей огромную силу и разрушительную мощь. Тем, у кого глаза фей, кажется, что объект окутан золотистой аурой, которая поднимается и мерцает, как языки пламени.#!"
 NOBLE_ARTS_CONFOUNDING_COILS_PERK_EFFECT: "$unlock_forging_node$ Добавляет модификатор [GetModifier('artifact_soak_2_modifier').GetNameWithTooltip].\n$cantrip_standard_bunk$ Накладывает на цель модификатор [GetModifier('cantrip_confounding_coils_modifier').GetNameWithTooltip].\n$passive_cantrip_actor$ Союзные [Concept('knights', 'рыцари')|E] в [Concept('combat_phase', 'бою')|E] или вы сами во время [Concept('single_combat_duel_plural', 'поединков')|E] получите модификатор [GetModifier('cantrip_confounding_coils_modifier').GetNameWithTooltip].\n$countermeasures_unlocks_t2_supernatural_high_alert$\n#flavor Ши танцует по полю боя, сражая своих врагов, оставаясь при этом нетронутым даже кровью. Цель этого заклинания обладает грацией извивающейся змеи. Её движения становятся плавными, почти гипнотическими, и она может легко избежать вреда. Даже неодушевлённый предмет, благословлённый этим заклятием, кажется, неуловимо корчится и сдвигается, избегая попытки ударить по нему.#!"
 NOBLE_ARTS_DRAGONSCALES_PERK_EFFECT_TT: "Заменяет [Concept('cantrip', 'заклятия')|E] достоинств «[GetPerk('noble_arts_burning_chew_perk').GetName(GetPlayer)]» и «[GetPerk('noble_arts_confounding_coils_perk').GetName(GetPlayer)]»"
 NOBLE_ARTS_DRAGONSCALES_PERK_EFFECT_TT2: "Заменяет [Concept('passive_cantrip', 'пассивные заклятия')|E] достоинств «[GetPerk('noble_arts_burning_chew_perk').GetName(GetPlayer)]» и «[GetPerk('noble_arts_confounding_coils_perk').GetName(GetPlayer)]»"
 NOBLE_ARTS_DRAGONSCALES_PERK_EFFECT: "$cantrip_standard_bunk$ #underline;TOOLTIP:NOBLE_ARTS_DRAGONSCALES_PERK_EFFECT_TT @warning_icon!#! Накладывает на цель модификатор [GetModifier('cantrip_dragonscales_modifier').GetNameWithTooltip].\n$passive_cantrip_actor$ #underline;TOOLTIP:NOBLE_ARTS_DRAGONSCALES_PERK_EFFECT_TT2 @warning_icon!#! Союзные [Concept('knights', 'рыцари')|E] в [Concept('combat_phase', 'бою')|E] или вы сами во время [Concept('single_combat_duel_plural', 'поединков')|E] получите модификатор [GetModifier('cantrip_dragonscales_modifier').GetNameWithTooltip].\n$countermeasures_unlocks_t3_supernatural_high_alert$\n[PODUnlocksCombatMove('POD_combat_move_fae_dragons_ire_dragonscales')].\n#flavor Фея придаёт своей цели мистическую прочность драконьей шкуры. Тем, кто способен видеть сквозь Туман, кажется, что объект окутан тепловым маревом, а его кожа блестит под прямыми лучами солнца.#!"
 NOBLE_ARTS_HOLY_STRIKE_PERK_EFFECT: "$cantrip_hard_bunk$ Наносит цели [EmptyScope.ScriptValue('noble_arts_holy_strike_interaction_damage')] ед. @health_track_aggravated_damage_icon! [Concept('POD_aggravated_damage', 'серьёзного урона')|E].\n$passive_cantrip_fae$ Наносит [EmptyScope.ScriptValue('noble_arts_holy_strike_perk_damage')] ед. @health_track_damage_icon! [Concept('POD_superficial_damage', 'поверхностного урона')|E] вражеским [Concept('knights', 'рыцарям')|E] при участии в [Concept('combat_phase', 'бою')|E] в качестве [Concept('commander', 'командира')|E], или вашему противнику во время [Concept('single_combat_duel_plural', 'поединков')|E].\n[PODUnlocksCombatMove('POD_combat_move_fae_dragons_ire_holy_strike')].\n#flavor Названное в честь растения легендарного воина, это заклятие чистого разрушения, внешнее проявление которого соответствует природе феи, владеющей им. Это всегда проявляется в виде взрыва сверхъестественной силы, но это может быть что угодно: от холодной волны испепеляющей тьмы до изумрудной вспышки, которая раскалывает цель на куски, или ревущей волны драконьего пламени.#!"
 NOBLE_ARTS_TRIPPING_THE_IRE_PERK_EFFECT: "$cantrip_standard_bunk$ Накладывает на цель модификатор [GetModifier('cantrip_tripping_the_ire_modifier').GetNameWithTooltip].\n$passive_cantrip_actor$ Союзные [Concept('knights', 'рыцари')|E] в [Concept('combat_phase', 'бою')|E] или вы сами во время [Concept('single_combat_duel_plural', 'поединков')|E] получите модификатор [GetModifier('cantrip_tripping_the_ire_modifier').GetNameWithTooltip].\n$countermeasures_unlocks_t4_supernatural_high_alert$\n#flavor Фея призывает мудрость бесчисленных воинов из легенд Аркадии, чтобы вселиться в своего подопечного, исполняя ужасающий боевой танец, с которым ни один враг не сможет справиться.#!"

 noble_arts_between_the_lines_perk_name: "Между строк"
 noble_arts_nicknames_perk_name: "Прозвища"
 noble_arts_saining_perk_name: "Благословение"
 noble_arts_runic_imprint_perk_name: "Рунический отпечаток"
 noble_arts_reweaving_perk_name: "Переплетение"

 NOBLE_ARTS_BETWEEN_THE_LINES_PERK_EFFECT: "#flavor Умение различать - первый урок магии именования. Пока фея не сможет понять истинный смысл сказанного или написанного, она не сможет постичь сокровенное знание, скрытое в истинных именах. Обманчиво мощный «Между строк» даёт китэйн возможность понимать любой язык или узнавать предполагаемый смысл всего, что он может увидеть или услышать.#!"
 NOBLE_ARTS_NICKNAMES_PERK_EFFECT: "$cantrip_easy_bunk$ Цель потеряет 500 [Concept('prestige', 'престижа')|E] и получит 25 [Concept('stress', 'стресса')|E].\n#flavor Прежде чем фея разовьёт в себе талант и проницательность, необходимые для раскрытия истинных имён, она учится навешивать на что-то или кого-то более поверхностные ярлыки. Со временем эффект ослабевает, но личность цели искажается и сводится к прозвищу, которое даёт фея. Пока заклятие остаётся в силе, все, кто находится вокруг цели, видят её через призму псевдонима.#!"
 NOBLE_ARTS_SAINING_PERK_EFFECT: "Можно использовать [Concept('journey', 'странствие')|E] «Узнать истинное имя».\nМожет узнать [Glossary('истинные имена','podgloss.truename')] [Concept('traits', 'свойств')|E].\n#flavor Способность различать истинные имена лежит в основе магии Именования. Как только фея может определить внутреннюю природу объекта, она получает глубокое представление о том, кто или что это такое, а также силу, позволяющую использовать любую магию против него без особого сопротивления. Власть, которую мистик обретает над кем-то, на первый взгляд может показаться благотворной, но привязанности меняются, друзья становятся врагами, и ничто не остаётся тайной навсегда.#!"
 NOBLE_ARTS_RUNIC_IMPRINT_PERK_EFFECT: "$unlock_forging_node$ Добавляет 2 [Concept('modifiers', 'модификатора')|E] в зависимости от типа [Concept('artifact', 'артефакта')|E].\n$cantrip_standard_bunk$ Накладывает на цель модификатор [GetModifier('cantrip_runic_imprint_survival_modifier').GetNameWithTooltip].\n$cantrip_standard_bunk$ Накладывает на цель модификатор [GetModifier('cantrip_runic_imprint_scholar_modifier').GetNameWithTooltip].\n$cantrip_standard_bunk$ Накладывает на цель модификатор [GetModifier('cantrip_runic_imprint_ruler_modifier').GetNameWithTooltip]).\n[PODUnlocksCombatMove('POD_combat_move_fae_naming_runic_imprint')].\n#flavor Научившись видеть истинную природу всего, что её окружает, фея теперь разбирается в древнем языке рун и в том, как применять их, чтобы усилить своих союзников или ослабить врагов. Заклятие «Рунический отпечаток» всегда включает в себя написание или физическое движение, чтобы сформировать руну на цели или рядом с ней. После этого фея может формировать основные атрибуты фокуса заклятия так, как считает нужным.#!"
 NOBLE_ARTS_REWEAVING_PERK_EFFECT: "$cantrip_hard_bunk$ Можно свободно менять [Concept('traits', 'свойства')|E] личности, здоровья, стресса и физические свойства цели, чьё [Glossary('истинное имя','podgloss.truename')] вам известно.\n#flavor Узнав истинное имя объекта, мастер Именования может переписать это имя, в корне изменив цель. Благие могут стать Неблагими, наследие может быть изменено и т.д. Даже места могут быть изменены, а их назначение или структура - пересмотрена.#!"

 noble_arts_protocol_perk_name: "Протокол"
 noble_arts_grandeur_perk_name: "Величие"
 noble_arts_guest_list_perk_name: "Список гостей"
 noble_arts_dictum_perk_name: "Диктум"
 noble_arts_geas_perk_name: "Гейс"

 NOBLE_ARTS_PROTOCOL_PERK_EFFECT: "$cantrip_standard_bunk$ Можно получить [Concept('weak_hook', 'слабое влияние')|E] на цель.\n#flavor Правила китэйн, регулирующие придворные отношения, часто загадочны, а иногда и непостижимы. Первое заклятие применяет этот этикет практически к любой ситуации. Любой, кто действует в соответствии с Протоколом, становится связанным правилами приличия китэйн и страдает от последствий нарушения этих правил, даже непреднамеренного.#!"
 NOBLE_ARTS_GRANDEUR_PERK_EFFECT: "$passive_cantrip_fae$ Повышает принятие предложения [Concept('peace', 'мира')|E] на #P +10#!.\n$passive_cantrip_fae$ Повышает принятие приглашения ко [Concept('court', 'двору')|E] на #P +20#!.\n[PODUnlocksCombatMove('POD_combat_move_fae_sovereign_grandeur')].\n#flavor С помощью простого заклятия фея воплощает Величие, присущее всем детям Аркадии, заставляя окружающих обращать на неё внимание и избегать конфликтов. Все, кто находятся под влиянием заклятия, смотрят на фею как на лидера, спасителя или королевскую особу. Возможно, на самом деле она и не обладает той осанкой и грацией, которые приписывались королям и королевам древности, но Величие - удобная замена настоящему.#!"
 noble_arts_grandeur_perk_modifier: "У вас есть достоинство «[GetPerk('noble_arts_grandeur_perk').GetName(GetPlayer)]»: $VALUE|0P=$"
 NOBLE_ARTS_GUEST_LIST_PERK_EFFECT: "#flavor Использование этого заклятия запрещает кому-либо или чему-либо входить, использовать или взаимодействовать с объектом заклятия без разрешения заклинателя. Фея может ввести пароль, состоящий из фразы или действия, который добавляет субъекта в «список» и открывает ему доступ к фокусу заклятия.#!"
 NOBLE_ARTS_DICTUM_PERK_EFFECT: "Улучшает [Concept('cantrip', 'заклятие')|E] достоинства «[GetPerk('noble_arts_protocol_perk').GetName(GetPlayer)]», давая [Concept('perpetual_hook', 'вечное влияние')|E] вместо [Concept('weak_hook', 'слабого')|E].\n[PODUnlocksCombatMove('POD_combat_move_fae_sovereign_dictum')].\n#flavor Титула и положения часто бывает достаточно, чтобы заставить окружающих фей выполнять приказы. Когда атрибутов благородства недостаточно, Диктум служит безошибочным напоминанием о том, кто здесь главный. Фея произносит заклятие, а затем отдаёт простую команду цели, которую они должны выполнить. Цель Диктума может сопротивляться приказу, но у большинства из них нет воли, и они становятся, по крайней мере, временными слугами.#!"
 NOBLE_ARTS_GEAS_PERK_EFFECT: "Улучшает [Concept('cantrip', 'заклятие')|E] достоинства «[GetPerk('noble_arts_dictum_perk').GetName(GetPlayer)]», давая [Concept('strong_hook', 'сильное влияние')|E] вместо [Concept('perpetual_hook', 'вечного')|E].\n#flavor Рассказы о заданиях, дарованных героям и злодеям, отправленным в изгнание, наполняют фольклор, а бывшие обитатели Грёз воплощают эти истории в реальность с мастерством Правления. Гейс превращает гламур в директиву, подобную клятве или контракту, но без обычно требуемой взаимности. Фея накладывает на цель предписание или запрет вместе с сопутствующим проклятием, если она не выполнит указ.#!"

 noble_arts_done_deal_perk_name: "Заключённая сделка"
 noble_arts_liars_bell_perk_name: "Колокол лжеца"
 noble_arts_castigate_perk_name: "Клеймение"
 noble_arts_casual_contract_perk_name: "Случайный контракт"
 noble_arts_sanctified_words_perk_name: "Священные слова"

 NOBLE_ARTS_DONE_DEAL_PERK_EFFECT: "$cantrip_standard_bunk$ Даёт цели [Concept('strong_hook', 'сильное влияние')|E] на вас взамен выполнения специфичной задачи (объявить войну, отдать золото, начать происка убийства или пригласить к двору). Цель должна иметь #V 50#! мнения о вас.\n#flavor Это могущественное заклятие позволяет фее заключать обязывающие клятвы с другими или освящать клятвы, которые она официально подтверждает. Те, кто нарушает соглашения и контракты, скреплённые гламуром, наказываются самими силами Грёз.#!"
 NOBLE_ARTS_LIARS_BELL_PERK_EFFECT: "$passive_cantrip_actor$ [Concept('characters', 'Персонажи')|E], на которых у вас имеется [Concept('hook', 'рычаг влияния')|E], не могут присоединиться ни к [Concept('scheme', 'проискам')|E], ни к [Concept('factions', 'фракциям')|E] против вас.\n$passive_cantrip_actor$ Ваши [Concept('councillors', 'советники')|E] не могут присоединиться ни к [Concept('schemes', 'проискам')|E], ни к [Concept('factions', 'фракциям')|E] против вас.\n#flavor По мере того, как растёт мастерство феи в Контрактах, она становится очень восприимчивой к нарушениям в наложенном ей гламуре. Она мгновенно замечает, когда кто—то нарушает освящённый ею контракт - она не обязательно знает, где и почему, но она точно знает, кто и когда. Более того, ей становится легко использовать искусство Грёз, чтобы найти нарушителя клятвы.#!"
 faction_noble_arts_liars_bell_perk_hook_modifier: "Невозможно основать или присоединиться к [Concept('faction', 'фракции')|E] против персонажа с достоинством «[GetPerk('noble_arts_liars_bell_perk').GetName(GetNullCharacter)]», у которого есть [Concept('hook', 'рычаг влияния')|E] на вас."
 faction_noble_arts_liars_bell_perk_councillor_modifier: "Невозможно основать или присоединиться к [Concept('faction', 'фракции')|E] против персонажа с достоинством «[GetPerk('noble_arts_liars_bell_perk').GetName(GetNullCharacter)]», если вы состоите в его [Concept('council', 'совете')|E]."
 noble_arts_liars_bell_perk_hook_modifier: "Цель имеет достоинство «[GetPerk('noble_arts_liars_bell_perk').GetName(GetNullCharacter)]» и [Concept('hook', 'рычаг влияния')|E] на меня: $VALUE|0N=$"
 noble_arts_liars_bell_perk_councillor_modifier: "Цель имеет достоинство «[GetPerk('noble_arts_liars_bell_perk').GetName(GetNullCharacter)]» и я являюсь его [Concept('councillor', 'советником')|E]: $VALUE|0N=$"
 NOBLE_ARTS_CASTIGATE_PERK_EFFECT: "Улучшает [Concept('cantrip', 'заклятие')|E] достоинства «[GetPerk('noble_arts_done_deal_perk').GetName(GetPlayer)]», давая цели [Concept('weak_hook', 'слабое влияние')|E] на вас вместо [Concept('strong_hook', 'сильного')|E].\n#flavor Фея не только знает, когда кто-то нарушил клятву, которую она дала, но и может применить к нарушителю своё собственное наказание в дополнение к обычным за нарушение Контракта.#!"
 NOBLE_ARTS_CASUAL_CONTRACT_PERK_EFFECT: "Улучшает [Concept('cantrip', 'заклятие')|E] достоинства «[GetPerk('noble_arts_done_deal_perk').GetName(GetPlayer)]», также позволяя использовать его против любой цели в той же локации.\n#flavor Это внушающее страх колдовство даёт фее власть даже над самыми обычными соглашениями, позволяя ей освящать легкомысленные обязательства («конечно, я буду там»), праздное хвастовство («если нога этого краснокожего появится в этом баре, я выпорю его и всю его компанию разом») и даже саркастические реплики («о, конечно, я поддержу герцога Дрея, ведь я так сильно люблю дворян»).#!"
 NOBLE_ARTS_SANCTIFIED_WORDS_PERK_EFFECT: "$passive_cantrip_actor$ Союзные [Concept('knights', 'рыцари')|E] в [Concept('combat_phase', 'бою')|E] или вы сами во время [Concept('single_combat_duel_plural', 'поединков')|E] получите модификатор [GetModifier('cantrip_sanctified_words_modifier').GetNameWithTooltip].\n[PODUnlocksCombatMove('POD_combat_move_fae_contract_sanctified_words')].\n#flavor Это удивительное колдовство позволяет фее вплести гламур в контракт, даруя могущественные благословения тем, кто связан им. Сила священных слов может быть использована только для содействия выполнению контракта, но некоторые клятвы могут быть действительно очень широкими («Я клянусь защищать герцога ценой своей жизни»).#!"

 noble_arts_creeping_shadows_perk_name: "Ползущие тени"
 noble_arts_autumn_eyes_perk_name: "Глаза осени"
 noble_arts_the_poisoned_apple_perk_name: "Отравленное яблоко"
 noble_arts_the_withering_perk_name: "Увядание"
 noble_arts_shivers_perk_name: "Трепет"

 NOBLE_ARTS_CREEPING_SHADOWS_PERK_EFFECT: "$countermeasures_unlocks_t1_obfuscated_court$.\n#flavor Фея приказывает ближайшим теням подчиниться её прихоти. Сатир призывает тень партнёра, которая неохотно танцует с ним. Слуаг превращает ночные тени в спальне хулигана в театр ужасов. Это искусство может быть использовано тонко, искажая или слегка манипулируя тенями, чтобы придать сцене зловещий вид, или оно может быть использовано для того, чтобы заставить тени превратиться в огромные зловещие существа, совершенно не связанные с действиями тех, кто их отбрасывает, или даже для того, чтобы поглотить фею (или кого-то другого) и скрыть их из виду.#!"
 NOBLE_ARTS_AUTUMN_EYES_PERK_EFFECT: "$cantrip_standard_bunk$ Раскрывает случайные [Concept('scheme', 'происки')|E] против цели.\n#flavor Наполняя свои глаза гламуром Осени, фея настраивает свои чувства на распад и гибель. Она может видеть болезни и немощи в окружающих её людях, распознавать слабые места и стрессовые точки предметов или даже распознавать те, которые отмечены каким-то великим или надвигающимся роком.#!"
 NOBLE_ARTS_THE_POISONED_APPLE_PERK_EFFECT: "$cantrip_standard_bunk$ Цель получает случайное [Concept('trait', 'свойство')|E] заболевания.\n$cantrip_standard_bunk$ Снижает [Concept('durability', 'прочность')|E] артефакта на #V 20#!.\n$passive_cantrip_fae$ Вражеские [Concept('knights', 'рыцари')|E] в [Concept('combat_phase', 'бою')|E] или ваши противники во время [Concept('single_combat_duel_plural', 'поединков')|E] получат модификатор [GetModifier('cantrip_the_poisoned_apple_modifier').GetNameWithTooltip].\n[PODUnlocksCombatMove('POD_combat_move_fae_autumn_poisoned_apple')].\n#flavor Это ужасное колдовство дало многим поколениям смертных достаточно оснований опасаться как даров, так и гнева волшебного народа. Превращая свой гнев в смертоносное заклятие, направленное на то, до чего можно дотянуться рукой, фея отравляет свою цель.#!"
 NOBLE_ARTS_THE_WITHERING_PERK_EFFECT: "Улучшает [Concept('cantrip', 'заклятие')|E] достоинства «[GetPerk('noble_arts_the_poisoned_apple_perk').GetName(GetPlayer)]», наложенное на [Concept('character', 'персонажа')|E], накладывая модификатор [GetModifier('cantrip_the_withering_modifier').GetNameWithTooltip].\nУлучшает [Concept('cantrip', 'заклятие')|E] достоинства «[GetPerk('noble_arts_the_poisoned_apple_perk').GetName(GetPlayer)]», наложенное на [Concept('artifact', 'артефакт')|E], вместо этого снижая [Concept('durability', 'прочность')|E] на #V 40#!.\nУлучшает [Concept('passive_cantrip', 'пассивное заклятие')|E] достоинства «[GetPerk('noble_arts_the_poisoned_apple_perk').GetName(GetPlayer)]», вместо этого накладывая модификатор [GetModifier('cantrip_the_withering_knight_modifier').GetNameWithTooltip].\n[PODUnlocksCombatMove('POD_combat_move_fae_autumn_withering')].\n#flavor Злобным жестом фея лишает цель жизненных сил, оставляя лишь видимость старения и разложения.#!"
 NOBLE_ARTS_SHIVERS_PERK_EFFECT: "$cantrip_standard_bunk$ Цель получает #V 100#! [Concept('stress', 'стресса')|E] (50, если имеется свойство «[GetTrait('brave').GetName(GetPlayer)]», и 150 при наличии свойства «[GetTrait('craven').GetName(GetPlayer)]»).\n$cantrip_standard_bunk$ Накладывает на артефакт [Concept('modifier', 'модификатор')|E], снижающий выбранный [Concept('skill', 'навык')|E] на 1. Каждый [Concept('modifier', 'модификатор') [Concept('skill', 'навыка')|E] применяется один раз на артефакт.\n#flavor Фея воплощает свои собственные мечты о смерти и тьме и передаёт их цели. Человек или вещь, подвергшиеся такому проклятию, становятся маяком для призраков и некоторое время после этого страдают от внимания неупокоенных мертвецов.#!"

 noble_arts_awaken_perk_name: "Пробуждение"
 noble_arts_verdant_reclamation_perk_name: "Зеленеющее восстановление"
 noble_arts_well_of_life_perk_name: "Колодец жизни"
 noble_arts_faerie_ring_perk_name: "Кольцо фей"
 noble_arts_renewal_perk_name: "Возрождение"

 NOBLE_ARTS_AWAKEN_PERK_EFFECT: "$cantrip_standard_bunk$ Накладывает на все [Concept('counties', 'графства')|E] выбранного [Concept('title', 'титула')|E] модификатор [GetModifier('cantrip_awaken_title_modifier').GetNameWithTooltip].\n$cantrip_standard_bunk$ Накладывает на цель модификатор [GetModifier('cantrip_awaken_modifier').GetNameWithTooltip].\n#flavor Новая жизнь, прорастающее семя — в основе Весны лежит обещание начала и пробуждения от спячки. Фея начинает своё путешествие в искусство Весны с того, что учится прекращать зимнюю спячку и стимулировать рост. Фея сажает семя гламура, а затем наблюдает, как цель пускает корни.#!"
 NOBLE_ARTS_VERDANT_RECLAMATION_PERK_EFFECT: "Улучшает [Concept('cantrip', 'заклятие')|E] достоинства «[GetPerk('noble_arts_awaken_perk').GetName(GetPlayer)]», накладываемое на [Concept('title', 'титул')|E], вместо этого применяя модификатор [GetModifier('cantrip_verdant_reclamation_title_modifier').GetNameWithTooltip].\nУлучшает [Concept('cantrip', 'заклятие')|E] достоинства «[GetPerk('noble_arts_awaken_perk').GetName(GetPlayer)]», накладываемое на [Concept('character', 'персонажа')|E], вместо этого применяя модификатор [GetModifier('cantrip_verdant_reclamation_modifier').GetNameWithTooltip].\n#flavor Всё, что есть на земле, и всё, что должно вернуться в землю. Если дать природе достаточно времени, она всё восстановит, и, применив немного чар, феи, создающие заклинание восстановления, могут ускорить этот процесс. Полезные для демонстрации силы и отвлечения внимания, растения и листва, покрывающие цель, продолжают расти и подавлять всю сцену.#!"
 NOBLE_ARTS_WELL_OF_LIFE_PERK_EFFECT: "$passive_cantrip_actor$ Исцеляет [EmptyScope.ScriptValue('POD_base_heal_value')] ед. @health_track_damage_icon! [Concept('POD_superficial_damage', 'поверхностного урона')|E] союзным [Concept('knights', 'рыцарям')|E] при участии в [Concept('combat_phase', 'бою')|E] в качестве [Concept('commander', 'командира')|E], или вам самим во время [Concept('single_combat_duel_plural', 'поединков')|E].\n$cantrip_standard_bunk$ Исцеляет [EmptyScope.ScriptValue('POD_spring_interaction_superficial_heal_value')] ед. @health_track_damage_icon! [Concept('POD_superficial_damage', 'поверхностного урона')|E] цели.\n[PODUnlocksCombatMove('POD_combat_move_fae_spring_well_of_life')].\n#flavor Легенды о воде жизни, мистическом источнике или эликсире, который исцеляет раны или дарует вечную жизнь, появляются в большинстве культур на протяжении веков. Это весеннее заклятие не отменяет старение и не дарует бессмертие, но наделяет цель гламуром, который исцеляет любого, кто находится поблизости или соприкасается с заклятием. Клюрикон, наблюдающий за поединком двух друзей, встаёт между ними и исцеляет их раны. Отчаявшись из-за потерь с обеих сторон, рыцарь-тролль заставляет дождь возвращать жизнь раненым на поле боя. Надеясь утешить уставшего лекаря, пак превращает его в сосуд для исцеления, когда тот начинает свой обход. Попав в засаду, красная шапка предлагает плоть и кровь своего побеждённого врага, чтобы вылечить свой табор.#!"
 NOBLE_ARTS_FAERIE_RING_PERK_EFFECT: "[PODUnlocksCombatMove('POD_combat_move_fae_spring_faerie_ring')].\n#flavor Человеческие легенды рассказывают о кругах из грибов, полевых цветов или камней, известных как кольца фей, — опасных местах для смертных, потому что феи, которые живут и танцуют в кольцах, могут похитить или проклясть любого, кто вторгнется в их пределы. В фольклоре есть доля правды. Кольцо фей - это весеннее заклятие, которое позволяет фее создать круг, обеспечивающий защиту и сокрытие от любых посторонних, с серьёзными последствиями для любого, кто вторгнется.#!"
 NOBLE_ARTS_RENEWAL_PERK_EFFECT: "$cantrip_hard_bunk$ Воскрешает #TOOLTIP:GAME_TRAIT,wraith,[GetNullCharacter] #L призрака#!#! как #TOOLTIP:GAME_TRAIT,mortal,[GetNullCharacter] #L смертного#!#!.\n$cantrip_hard_bunk$ Накладывает на все [Concept('counties', 'графства')|E] выбранного [Concept('title', 'титула')|E] модификатор [GetModifier('cantrip_renewal_modifier').GetNameWithTooltip].\n$cantrip_hard_bunk$ Полностью восстанавливает [Concept('durability', 'прочность')|E] [Concept('artifact', 'артефакта')|E].\n#flavor Каждый год весна совершает величайшее чудо, оттаивая почву и возрождая жизнь в ландшафте, временно опустевшем из-за зимы. Мастера весенней магии используют цикл смерти и возрождения, чтобы временно оживить всё инертное или мёртвое. Однако вскоре круг замыкается, поскольку чары поддерживают воскрешение лишь на несколько драгоценных мгновений.#!"

 noble_arts_flicker_files_perk_name: "Мерцающие светлячки"
 noble_arts_enkindle_perk_name: "Разжигание"
 noble_arts_aphrodisia_perk_name: "Афродизия"
 noble_arts_vestas_blessing_perk_name: "Благословение Весты"
 noble_arts_the_beltane_blade_perk_name: "Клинок Бельтайна"

 NOBLE_ARTS_FLICKER_FILES_PERK_EFFECT: "$cantrip_standard_bunk$ Призывает цель к вашему [Concept('court', 'двору')|E].\n#flavor Это заклятие вызывает яркие, танцующие пылинки разноцветного света из субстанции Грёз. Мерцающие светлячки не только освещают пространство вокруг себя, но и их мягко пульсирующие цвета вызывают у тех, кто смотрит на них, едва уловимый резонанс эмоций, выбранных феями. И мерцающие светлячки, и излучаемый ими свет невидимы для обычных существ, но смертные, которых касается их свет, всё равно реагируют на их эмоциональный резонанс.#!"
 NOBLE_ARTS_ENKINDLE_PERK_EFFECT: "$passive_cantrip_fae$ Вражеские [Concept('knights', 'рыцари')|E] в [Concept('combat_phase', 'бою')|E] получат модификатор [GetModifier('cantrip_enkindle_modifier').GetNameWithTooltip].\n[PODUnlocksCombatMove('POD_combat_move_fae_summer_enkindle')].\n#flavor Хулиган дрожит в темноте, а слуаг превращает это напряжение в крик ужаса. Шутка пака вызывает не более чем смешки — до тех пор, пока она не привносит немного волшебства в реакцию своей аудитории, наполняя комнату беспомощным смехом. Испуская дуновение очарования, фея раздувают пламя страсти до ревущей и маниакальной высоты. Любая эмоция, которую испытывает человек, очарованный «Разжиганием», резко усиливается — раздражение превращается в бурлящее негодование, гнев - в полномасштабную ярость, грусть перерастает в сокрушительную печаль, счастье перерастает в безудержную радость, а любовь превращается во всепоглощающую страсть. Если он направлен на какой-либо объект, то любые эмоции, которые этот объект вызывает у тех, кто взаимодействует с ним, разгораются подобным образом.#!"
 NOBLE_ARTS_APHRODISIA_PERK_EFFECT: "$cantrip_standard_bunk$ Накладывает на цель модификатор [GetModifier('cantrip_aphrodisia_modifier').GetNameWithTooltip].\nУлучшает [Concept('cantrip', 'заклятие')|E] достоинства «[GetPerk('noble_arts_flicker_files_perk').GetName(GetPlayer)]», снижая затраты гламура на 1.\n#flavor Это заклятие, пользующееся большой популярностью у русалок, сатиров, клюриконов и некоторых других фей, является искусством создания всеобъемлющего благоговения, очарования и даже желания. Субъект этого заклятия приобретает магнетическую притягательность. Если человек очарован, каждое его слово и действие становятся чарующими. Если объект вызывает возбуждение, каждый, кто видит этот объект, немедленно начинает его желать.#!"
 NOBLE_ARTS_VESTAS_BLESSING_PERK_EFFECT: "$passive_cantrip_actor$ Союзные [Concept('knights', 'рыцари')|E] в [Concept('combat_phase', 'бою')|E] или вы сами во время [Concept('single_combat_duel_plural', 'поединков')|E] получите модификатор [GetModifier('cantrip_vestas_blessing_modifier').GetNameWithTooltip].\n#flavor Домашний очаг олицетворяет безопасность и гостеприимство. Используя «Благословение Весты», феи создают домашний уют везде, где они могут создать укрытие или развести огонь. Гламур полезен путешественникам и всем, на кого охотятся, он действует как часовой и инстинктивно предупреждает о любом вторжении. Кроме того, каждый, кто приглашён в освященное пространство, чувствует себя восстановленным и помолодевшим.#!"
 NOBLE_ARTS_THE_BELTANE_BLADE_PERK_EFFECT: "Скорость [Concept('journey', 'странствия')|E] #V $glamour_quests_name$#!: #P +100%#!\n[PODUnlocksCombatMove('POD_combat_move_fae_summer_beltane_blade')].\n#flavor Фея делает жест, и налёт банальности на её цели вспыхивает ослепительным красно-золотым пламенем. Когда-то давным-давно это заклинание было великим и сияющим мечом Лета, используемым для изгнания смертных и скверны обыденного из тайных владений фей. Теперь, когда Осенний мир погряз в банальности, это заклинание остаётся мощным оружием, но его свирепого жара явно недостаточно, чтобы сдержать приближающуюся Зиму.#!"

 noble_arts_chill_perk_name: "Охлаждение"
 noble_arts_hardened_heart_perk_name: "Закалённое сердце"
 noble_arts_terror_of_the_long_night_perk_name: "Ужас долгой ночи"
 noble_arts_sculpt_perk_name: "Скульптура"
 noble_arts_stasis_perk_name: "Стазис"

 NOBLE_ARTS_CHILL_PERK_EFFECT: "$passive_cantrip_fae$ Вражеские [Concept('knights', 'рыцари')|E] в [Concept('combat_phase', 'бою')|E] или ваши противники во время [Concept('single_combat_duel_plural', 'поединков')|E] получат модификатор [GetModifier('cantrip_chill_modifier').GetNameWithTooltip].\n[PODUnlocksCombatMove('POD_combat_move_fae_winter_chill')].\n#flavor Первое и самое базовое применение магии Зимы позволяет фее значительно понизить температуру цели за короткое время. Холод не наносит вреда живым существам, но растения и объекты могут иссохнуть или сломаться. При условии, что китэйн видит цель, возможно призвать глубокий и неприятный холод.#!"
 NOBLE_ARTS_HARDENED_HEART_PERK_EFFECT: "Даёт иммунитет к враждебным ментальным [Concept('character_interaction', 'взаимодействиям')|E].\n$countermeasures_unlocks_t3_mental_fortress$\n#flavor Зима не скорбит по потерявшемуся страннику, замерзающему в снегах. Зима не защищает добычу от волков или ловушек охотника. Стучась в сердце хлада, адепты Зимы заглушают эмоции и ограждают цель от манипуляций и воздействий. Цель становится неспособной выказывать желания и волю, что является существенной ценой за сопротивление перед самыми мощным манипуляциями.#!"
 NOBLE_ARTS_TERROR_OF_THE_LONG_NIGHT_PERK_EFFECT: "$passive_cantrip_fae$ При участии в [Concept('combat_phase', 'битве')|E] в качестве [Concept('commander', 'командира')|E] вражеские [Concept('knights', 'рыцари')|E] со свойством «[GetTrait('craven').GetName(GetNullCharacter)]» выйдут из боя.\n[PODUnlocksCombatMove('POD_combat_move_fae_winter_terror_long_night')].\n#flavor Истинная зима укрощает свет и пожирает тепло. Одинокие и замёрзшие, даже самые храбрые испытывают дикий страх, сталкиваясь с бесконечной, ледяной тьмой. Рыцарь-слуаг вынуждает врага отступить перед лицом всего двора. Чары пака заставляют смертных сбежать, оставляя плоды для воровства. Пробираясь через дворы, чтобы сбежать от даунтэйна, нокер распугивает немецких овчарок обратно по будкам.#!"
 NOBLE_ARTS_SCULPT_PERK_EFFECT: "$passive_cantrip_fae$ Наносит [EmptyScope.ScriptValue('noble_arts_sculpt_perk_damage')] ед. @health_track_damage_icon! [Concept('POD_superficial_damage', 'поверхностного урона')|E] вражеским [Concept('knights', 'рыцарям')|E] при участии в [Concept('combat_phase', 'бою')|E] в качестве [Concept('commander', 'командира')|E], или вашим противникам во время [Concept('single_combat_duel_plural', 'поединков')|E].\n[PODUnlocksCombatMove('POD_combat_move_fae_winter_ice_shackles')].\n#flavor Превзойдя базовые возможности холода, фея совмещает лед со своим гламуром и придаёт необходимую форму получившемуся. Творение будем ничем иным, как льдом, и ощущается холодным, но скульптура не тает, пока не подвергнется магическому теплу или пламени.#!"
 NOBLE_ARTS_STASIS_PERK_EFFECT: "$passive_cantrip_fae$ При участии в [Concept('combat_phase', 'битве')|E] в качестве [Concept('commander', 'командира')|E] вражеские [Concept('knights', 'рыцари')|E] с самым высоким показателем [Concept( 'prowess', 'доблести')|E] выйдут из боя (если они не защищены от ментальных заклятия).\n$cantrip_exceptional_bunk$ Отправляет цель в [GetTrait('torpor').GetName(GetPlayer)|l].\n#flavor Последнее заклятие мастеров Зимы позволяет фее заточить цель в магическом морозе на длительный период времени, оставив цель как она есть, но неподвижной и (если возможно) бессознательной. Всё и вся в стазисе не стареет, не рушится, не меняется. В течение действия заклятия цель остаётся подвешенной во времени. Прорыв через мороз требует сильной магии, например от мастеров Пламени или Весны.#!"