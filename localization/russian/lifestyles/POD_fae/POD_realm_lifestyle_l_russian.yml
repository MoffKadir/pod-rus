 REALM_ACTOR_1_PERK_EFFECT: "Теперь вы можете наложить [Concept('cantrips', 'заклятия')|E] на [Concept('friend', 'друзей')|E], [Concept('lover', 'любовников')|E], [Concept('courtier', 'придворных')|E], [Concept('direct_vassal', 'прямых вассалов')|E], членов дома, персонажей, на титулы которых у вас есть сильная [Concept('title_claim', 'претензия')|E] или [Concept('strong_hook', 'сильное влияние')|E], или персонажей, чем преступный [Concept('secret', 'секрет')|E] вам известен.\nТакже персонаж не должен иметь с вами плохих отношений, не находиться в состоянии [Concept('war', 'войны')|E] или [Concept('truce', 'перемирия')|E] или находиться в вашей темнице."
 REALM_ACTOR_2_PERK_EFFECT: "Теперь вы можете наложить [Concept('cantrips', 'заклятия')|E] на [Concept('friend', 'друзей')|E], [Concept('lover', 'любовников')|E], [Concept('courtier', 'придворных')|E], [Concept('guest', 'гостей')|E], [Concept('vassal', 'вассалов')|E], [Concept('liege', 'сюзеренов')|E], членов династии, персонажей, на титулы которых у вас есть [Concept('title_claim', 'претензия')|E] или [Concept('hook', 'слабое влияние')|E], или персонажей, чем [Concept('secret', 'секрет')|E] вам известен.\nТакже персонаж не должен иметь с вами плохих отношений, не находиться в состоянии [Concept('war', 'войны')|E] или [Concept('truce', 'перемирия')|E] или находиться в вашей темнице."
 REALM_ACTOR_3_PERK_EFFECT: "Теперь вы можете наложить [Concept('cantrips', 'заклятия')|E] на персонажа с любым положительным отношением, [Concept('courtier', 'придворных')|E], [Concept('guest', 'гостей')|E], [Concept('vassal', 'вассалов')|E], [Concept('liege', 'сюзеренов')|E], членов династии, [Concept('ally', 'союзников')|E], персонажей, на титулы которых у вас есть [Concept('title_claim', 'претензия')|E] или [Concept('hook', 'слабое влияние')|E], или персонажей, чем [Concept('secret', 'секрет')|E] вам известен.\nТакже персонаж не должен иметь с вами плохих отношений или находиться в состоянии [Concept('war', 'войны')|E]."
 REALM_ACTOR_4_PERK_EFFECT: "Теперь вы можете наложить [Concept('cantrips', 'заклятия')|E] на любого персонажа, если он не является вашим [Concept('rival', 'соперником')|E] или не находится в состоянии [Concept('war', 'войны')|E]."
 REALM_ACTOR_5_PERK_EFFECT: "Теперь вы можете наложить [Concept('cantrips', 'заклятия')|E] на любого персонажа, даже на [Concept('rival', 'соперников')|E] или во время [Concept('war', 'войны')|E]."
 REALM_FAE_1_PERK_EFFECT: "Теперь вы можете наложить [Concept('cantrips', 'заклятия')|E] на меньших сверхъестественных существ или смертных с меньшими способностями."
 REALM_FAE_2_PERK_EFFECT: "Теперь вы можете наложить [Concept('cantrips', 'заклятия')|E] на подменышей."
 REALM_FAE_3_PERK_EFFECT: "Теперь вы можете наложить [Concept('cantrips', 'заклятия')|E] на фей."
 REALM_FAE_4_PERK_EFFECT: "Теперь вы можете наложить [Concept('cantrips', 'заклятия')|E] на большинство сверхъестественных существ или смертных с мощными способностями."
 REALM_FAE_5_PERK_EFFECT: "Теперь вы можете наложить [Concept('cantrips', 'заклятия')|E] даже на самых редких сверхъестественных существ."
 REALM_PROP_1_PERK_EFFECT: "Теперь вы можете наложить [Concept('cantrips', 'заклятия')|E] на обычные/мастерские разные/придворные артефакты."
 REALM_PROP_2_PERK_EFFECT: "Теперь вы можете наложить [Concept('cantrips', 'заклятия')|E] на обычные/мастерские артефакты."
 REALM_PROP_3_PERK_EFFECT: "Теперь вы можете наложить [Concept('cantrips', 'заклятия')|E] на не уникальные знаменитые/великолепные артефакты."
 REALM_PROP_4_PERK_EFFECT: "Теперь вы можете наложить [Concept('cantrips', 'заклятия')|E] на уникальные знаменитые артефакты."
 REALM_PROP_5_PERK_EFFECT: "Теперь вы можете наложить [Concept('cantrips', 'заклятия')|E] на уникальные великолепные артефакты."
 REALM_NATURE_1_PERK_EFFECT: "Можно накладывать [Concept('cantrips', 'заклятия')|E] на неживые, органические материалы."
 REALM_NATURE_2_PERK_EFFECT: "Можно накладывать [Concept('cantrips', 'заклятия')|E] на живые, органические растительные материалы."
 REALM_NATURE_3_PERK_EFFECT: "Можно накладывать [Concept('cantrips', 'заклятия')|E] на живых, неразумных животных."
 REALM_NATURE_4_PERK_EFFECT: "Можно накладывать [Concept('cantrips', 'заклятия')|E] на природные явления."
 REALM_NATURE_5_PERK_EFFECT: "Можно накладывать [Concept('cantrips', 'заклятия')|E] на природные элементы в чистом виде."
 REALM_SCENE_1_PERK_EFFECT: "Теперь вы можете наложить [Concept('cantrips', 'заклятия')|E] на персонажа, находящегося на расстоянии примерно небольшого королевства (пример: Уэльс с севера на юг).\nМожно накладывать [Concept('cantrips', 'заклятия')|E] на графство."
 REALM_SCENE_2_PERK_EFFECT: "Теперь вы можете наложить [Concept('cantrips', 'заклятия')|E] на персонажа, находящегося на расстоянии примерно среднего королевства (пример: Ирландия с севера на юг).\nМожно накладывать [Concept('cantrips', 'заклятия')|E] на герцогство."
 REALM_SCENE_3_PERK_EFFECT: "Теперь вы можете наложить [Concept('cantrips', 'заклятия')|E] на персонажа, находящегося на расстоянии примерно большого королевства (пример: Франция с севера на юг).\nМожно накладывать [Concept('cantrips', 'заклятия')|E] на королевство."
 REALM_SCENE_4_PERK_EFFECT: "Теперь вы можете наложить [Concept('cantrips', 'заклятия')|E] на персонажа, находящегося на расстоянии примерно огромного королевства (пример: Священная Римская империя с запада на восток).\nМожно накладывать [Concept('cantrips', 'заклятия')|E] на империю."
 REALM_SCENE_5_PERK_EFFECT: "Теперь вы можете наложить [Concept('cantrips', 'заклятия')|E] на любого персонажа на карте.\nМожно накладывать [Concept('cantrips', 'заклятия')|E] в глобальном масштабе."
 REALM_TIME_1_PERK_EFFECT: "Модификаторы [Concept('cantrip', 'заклятия')|E] теперь действуют #V 1#! год вместо #V 4#! месяцев.\nСнижает время восстановления [Concept('cantrip', 'заклятия')|E] до 3/4."
 REALM_TIME_2_PERK_EFFECT: "Модификаторы [Concept('cantrip', 'заклятия')|E] теперь действуют #V 2#! года вместо #V 1#! года.\nСнижает время восстановления [Concept('cantrip', 'заклятия')|E] наполовину."
 REALM_TIME_3_PERK_EFFECT: "Модификаторы [Concept('cantrip', 'заклятия')|E] теперь действуют #V 5#! лет вместо #V 2#! лет.\nСнижает время восстановления [Concept('cantrip', 'заклятия')|E] до 1/4."
 REALM_TIME_4_PERK_EFFECT: "Модификаторы [Concept('cantrip', 'заклятия')|E] теперь действуют #V 10#! лет вместо #V 5#! лет.\nСнижает время восстановления [Concept('cantrip', 'заклятия')|E] на одну единицу."
 REALM_TIME_5_PERK_EFFECT: "Модификаторы [Concept('cantrip', 'заклятия')|E] теперь действуют вечно.\nБольше нет времени восстановления [Concept('cantrip', 'заклятия')|E]."

