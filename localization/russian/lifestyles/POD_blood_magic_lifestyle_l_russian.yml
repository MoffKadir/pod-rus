 BS_CANDLE_PERK_EFFECT: "[PODUnlocksCombatMove('POD_combat_move_fire_control')].\n#flavor Сородич может заключить временный союз со своим величайшим врагом и вызвать на кончике пальца небольшой огонь, похожий на свечу. Огонь не обжигает ни заклинателя, ни кого-либо ещё, но вызывает стандартные психологические реакции у других вампиров.#!"
 BS_PALM_OF_FIRE_PERK_EFFECT: "[PODImprovesCombatMove('POD_combat_move_fire_control')].\n#flavor Вампир может поджечь собственную ладонь, огонь не наносит урон заклинателю, но нанесёт урон любому, кто к нему прикоснётся.#!"
 BS_CAMPFIRE_PERK_EFFECT: "#flavor Тауматург может одним прикосновением вызвать возгорание легковоспламеняющегося объекта. Созданный таким образом огонь повредит всё, включая заклинателя.#!"
 BS_BONFIRE_PERK_EFFECT: "[PODImprovesCombatMove('POD_combat_move_fire_control')].\n#flavor На этом уровне тауматург может поджечь сам воздух, создавая различные формы из воспламенённого воздуха.#!"
 BS_INFERNO_PERK_EFFECT: "[PODUnlocksCombatMove('POD_combat_move_inferno')].\n#flavor В моменты больших неприятностей заклинатель может зажечь собственное витэ и выпустить его в мир величественным огненным адом, созданный таким образом огонь нанесет огромный ущерб всему, включая заклинателя.#!"

