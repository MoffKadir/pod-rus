 FORCE_BOLT_PERK_EFFECT: "[PODUnlocksCombatMove('POD_combat_move_force_bolt')].\n#flavor Простым жестом чародей может вызвать до 2 снарядов чистой силы и выстрелить ими со скоростью, достаточной для того, чтобы нарушить движение противника и сбить его с ног.#!"
 MANIPULATE_PERK_EFFECT: "#flavor Контроль вампира над своей силой возрастает до такой степени, что он может манипулировать предметами на расстоянии. Движение на расстоянии довольно медленное, и пока невозможно бросать предметы с силой, достаточной для нанесения какого-либо урона.#!"
 BS_FLIGHT_PERK_EFFECT: "#flavor Тауматург может использовать эту способность, чтобы поднять в воздух себя или кого-то другого и взлететь в небеса, не касаясь земли. Скорость полёта определяется базовой скоростью вампира, но может быть увеличена за счет усилия воли.#!"
 REPULSE_PERK_EFFECT: "[PODImprovesCombatMove('POD_combat_move_force_bolt')].\n#flavor Вампир, обладающий этой способностью, может с огромной силой толкать объект или существо в нужном заклинателю направлении. Ускорение может быть как медленным, так и быстрым, по желанию заклинателя, но максимальная скорость не может превышать 30 километров в час.#!"
 CONTROL_PERK_EFFECT: "[PODImprovesCombatMove('POD_combat_move_force_bolt')].\n#flavor Вершина этого пути - «Контроль», позволяющий сородичу манипулировать объектом на расстоянии до 5 километров с точностью, сравнимой с непосредственным удержанием объекта в руке.#!"

 bs_candle_perk_name: "Свеча"
 bs_palm_of_fire_perk_name: "Огненная ладонь"
