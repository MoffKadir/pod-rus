 LOSS_PERK_EFFECT: "Вы можете уничтожить случайный не уникальный [Concept('artifact', 'артефакт')|E] цели, применив это #TOOLTIP:game_concept_bloodmagic_spell_desc #E заклинание#!#!.\n#flavor Вызывает у жертвы потерю ценного имущества#!"
 PERIL_PERK_EFFECT: "Вы можете наделить цель модификатором [GetModifier('peril_modifier').GetNameWithTooltip] на 5 лет, применив это #TOOLTIP:game_concept_bloodmagic_spell_desc #E заклинание#!#!.\n[PODUnlocksCombatMove('POD_combat_move_peril')]\n#flavor Вызвать у жертвы опасный несчастный случай#!"
 ENEMY_PERK_EFFECT: "Вы можете заставить случайного соседнего правителя/члена совета/придворного стать [Concept('rival', 'соперником')|E] цели, применив это #TOOLTIP:game_concept_bloodmagic_spell_desc #E заклинание#!#!.\n#flavor Заставляет жертву потерять союзников#!"
