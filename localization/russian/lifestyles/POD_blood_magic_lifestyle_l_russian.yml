 HAND_OF_PTAH_PERK_EFFECT: "Вы можете повредить случайный [artifact|El] цели, применив это #TOOLTIP:game_concept_bloodmagic_spell_desc #E заклинание#!#!. Если накладывается на себя, чинит артефакт.\n#flavor Повредить или починить объект весом 90 кг или менее на расстоянии#!"
 HAND_OF_KHNUM_PERK_EFFECT: "Вы можете наделить #TOOLTIP:GAME_TRAIT,mortal,[GetNullCharacter] #L смертную#!#! цель свойством «[GetTrait('maimed').GetName(GetNullCharacter)]» или «[GetTrait('wounded_3').GetName(GetNullCharacter)]».\n#flavor Повредить или починить животное, смертного или предмет весом 453 кг или менее на расстоянии#!"
 HAND_OF_ANUBIS_PERK_EFFECT: "Улучшает достоинство «[GetPerk('hand_of_khnum_perk').GetName(GetPlayer)]», позволяя выбирать целью виды, обладающие материальными телами.\n[PODUnlocksCombatMove('POD_combat_move_hand_of_anubis')]\n#flavor Повредить или починить телесное сверхъестественное существо или предмет весом не более 2 тонн на расстоянии#!"
 HAND_OF_THOTH_PERK_EFFECT: "Улучшает достоинство «[GetPerk('hand_of_khnum_perk').GetName(GetPlayer)]», снимая ограничения [Concept('character', 'персонажей')|E]\n#flavor Повредить или починить бесплотное сверхъестественное существо или предмет весом не более 9 тонн на расстоянии#!"
 HAND_OF_HEKA_PERK_EFFECT: "Улучшает достоинство «[GetPerk('hand_of_khnum_perk').GetName(GetPlayer)]», повышая шанс успеха.\n#flavor Дистанционное применение дисциплины или другой магической способности к существам, а также повреждение или ремонт объектов весом 45 тонн или менее#!"

