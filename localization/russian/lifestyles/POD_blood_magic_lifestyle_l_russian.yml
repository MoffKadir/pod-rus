 COMMUTA_PERK_EFFECT: "#flavor Лёгким движением руки и ритуальным пусканием витэ заклинатель может использовать своё витэ, чтобы «заморозить» жидкости в твёрдое состояние или позволить твёрдым частицам течь как жидкости.#!"
 CONFORMA_PERK_EFFECT: "Улучшает [Concept('crafting_node', 'узел')|E] [Concept('crafting_forging', 'ковки')|E] #V $basic_node_general_improvment_loca$#!, повышая вероятность [Concept('modifier', 'модификатора')|E] на #P +50%#!, но повышая затраты на [PlayerBlood('(CFixedPoint)1')]#!\n#flavor Пробуждая своё витэ, тауматург может медленно придавать объектам форму небольшими, но важными способами, такими как заточка лезвия или добавление декоративных гравюр.#!"
 SCINDE_PERK_EFFECT: "Затраты на [Concept('reforge', 'перековку')|E] и [Concept('repair', 'починку')|E] [Concept('artifact', 'артефактов')|E]: #P -50%#!.\n#flavor Эта способность позволяет заклинателю полностью изменять форму неодушевлённого предмета по своей воле, процесс очень медленный, но позволяет значительно изменить форму, например, превратить меч в щит.#!"
 MUTATE_PERK_EFFECT: "#flavor С помощью силы мутации тауматург может незаметно изменять саму элементарную структуру неодушевлённого природного объекта. Превращать железо в сталь или наоборот. Невозможно воздействовать на предметы, созданные человеком, такие как монеты или столовое серебро.#!"
 TRANSMUTATE_PERK_EFFECT: "[Concept('bs_spell', 'Заклинание')|E]: Можно получить [gold_i|E]25 [Concept('gold', 'золота')|E] за [PlayerBloodValue('bs_transmutate_cost')], [piety_i]20 [Concept('piety', 'благочестия')|E] и [prestige_i]20 [Concept('prestige', 'престижа')|E]\n#flavor Являясь вершиной алхимии, трансмутация позволяет заклинателю изменять элементарную структуру неодушевлённого предмета, а также изменять его форму одним движением. Из куска свинца в несколько золотых монет. К сожалению, процесс полной трансмутации является очень сложным для самого объекта, нанося ему непоправимый ущерб и приводя к тому, что через несколько недель он превращается в бесполезную пыль.#!"

 summon_the_simplest_form_perk_name: "Призыв простой формы"
 bs_permanency_perk_name: "Пермаментность"
 magic_of_the_smith_perk_name: "Магия кузнеца"
 reverse_conjuration_perk_name: "Обратное заклинание"
 power_over_life_perk_name: "Власть над жизнью"

 SUMMON_THE_SIMPLEST_FORM_PERK_EFFECT: "[Concept('bs_spell', 'Заклинание')|E]: Можно получить #COMMONBROWN обычный#! [Concept('artifact', 'артефакт')|E] с максимальной [Concept('durability', 'прочностью')|E] #V 5#! за [PlayerBloodValue('bs_summon_the_simplest_form_cost')].\n#flavor На этом уровне мастерства заклинатель может создавать простые неодушевлённые предметы. Объект не может иметь движущихся частей и не может быть изготовлен из нескольких материалов.#!"
 BS_PERMANENCY_PERK_EFFECT: "Улучшает [Concept('bs_spell', 'заклинание')|E] достоинства «[GetPerk('summon_the_simplest_form_perk').GetName(GetNullCharacter)]», повышая максимальную [Concept('durability', 'прочность')|E] до #V 25#!.\n#flavor На этом уровне заклинателю больше не нужно прилагать силу воли, чтобы поддерживать существование объекта. Объект является постоянным, хотя всё, что можно создать, - это простые предметы.#!"
 MAGIC_OF_THE_SMITH_PERK_EFFECT: "Улучшает [Concept('bs_spell', 'заклинание')|E] достоинства «[GetPerk('summon_the_simplest_form_perk').GetName(GetNullCharacter)]», повышая редкость полученного [Concept('artifact', 'артефакта')|E] до #color_dark_green мастерского#!.\n#flavor Сородичи теперь могут создавать сложные объекты, состоящие из множества компонентов и с движущимися частями, а также из более экзотических материалов, которые «подверглись» более сложной закалке.#!"
 REVERSE_CONJURATION_PERK_EFFECT: "При уничтожении [Concept('artifact', 'артефакта')|E], полученного через [Concept('bs_spell', 'заклинание')|E] «[GetPerk('summon_the_simplest_form_perk').GetName(GetNullCharacter)]», возвращает половину $POD_energy_blood_icon$, использованной для его создания в первую очередь.\n#flavor Эта способность позволяет заклинателю «изгнать» в небытие любой объект, ранее вызванный этим способом.#!"
 POWER_OVER_LIFE_PERK_EFFECT: "[Concept('bs_spell', 'Заклинание')|E]: Призывает [Concept('army', 'армию')|E] из #V 150#! солдат ([GetMaA('animal_simulacra').GetName]) на время [Concept('war', 'войны')|E] за [PlayerBloodValue('bs_power_over_life_cost')].\n#flavor Эта способность не может создать настоящую жизнь, хотя и может вызывать впечатляющие подобия. Существа, призванные с помощью этой способности, лишены свободы воли действовать самостоятельно, вместо этого они бездумно следуют простым инструкциям своего заклинателя.#!"

 contradict_perk_name: "Противоречие"
 subvert_perk_name: "Низвержение"
 dissociate_perk_name: "Разъединение"
 addiction_perk_name: "Привыкание"
 dependence_perk_name: "Зависимость"

 CONTRADICT_PERK_EFFECT: "[Concept('bs_spell', 'Заклинание')|E]: Можно получить модификатор «[GetModifier('contradict_modifier').GetNameWithTooltip]» за [PlayerBloodValue('bs_contradict_cost')].\n#flavor Вампир может прервать мыслительный процесс субъекта, вынудив жертву изменить свой текущий курс действий. Результаты «Противоречия» никогда не бывают точно известны тауматургу заранее, но они всегда принимают форму более негативного действия, чем то, которое субъект изначально намеревался совершить.#!"
 SUBVERT_PERK_EFFECT: "[Concept('bs_spell', 'Заклинание')|E]: Можно заставить цель потерять [prestige_i]100 [Concept('prestige', 'престижа')|E] и [piety_i]100 [Concept('piety', 'благочестия')|E] за [PlayerBloodValue('bs_subvert_cost')].\n#flavor Эта способность действует по тому же принципу, что и «Противоречие», высвобождая тёмную, склонную к саморазрушению сторону субъекта. Однако эффект «Низвержения» более длительный, чем кратковременная вспышка противоречия. Под влиянием этой силы жертвы действуют в соответствии со своими собственными подавленными соблазнами, преследуя цели, которым их мораль или самоконтроль не позволили бы им следовать при обычных обстоятельствах.#!"
 DISSOCIATE_PERK_EFFECT: "[Concept('bs_spell', 'Заклинание')|E]: Снижает уровень случайных [Concept('relation', 'отношений')|E] цели до тех пор, пока одна из сторон не получит сильную ментальную защиту за [PlayerBloodValue('bs_dissociate_cost')].\n#flavor «Разделяй и властвуй» - это принцип, который хорошо понимают тремеры, а «Разъединение» - мощный инструмент, с помощью которого можно разделить врагов клана. Эта способность используется для разрыва социальных связей и межличностных отношений. Даже самый страстный роман или самая давняя дружба могут быть охлаждены с помощью разъединения, а более слабые личные связи могут быть полностью разрушены.#!"
 ADDICTION_PERK_EFFECT: "[Concept('bs_spell', 'Заклинание')|E]: Можно наделить цель случайным подходящим [Concept('trait', 'свойством')|E] нервного срыва за [PlayerBloodValue('bs_addiction_cost')].\n#flavor Эта способность является гораздо более мощной и потенциально разрушительной формой «Низвержения». Зависимость вызывает именно это у жертвы. Просто подвергая цель воздействию определённого ощущения, вещества или действия, заклинатель создает сильную психологическую зависимость.#!"
 DEPENDENCE_PERK_EFFECT: "[Concept('courtiers', 'Придворные')|E] с сильной ментальной защитой автоматически вернутся к вашему [Concept('court', 'двору')|E] после ухода.\n#flavor Многие бывшие пешки клана Тремер утверждают, что испытывали странное чувство, похожее на депрессию, когда не находились в присутствии своих хозяев. Обычно это объясняется узами крови, но иногда это результат того, что вампир научился управлять «Зависимостью». Последняя способность «Пути искажения» позволяет вампиру привязать душу своей жертвы к своей собственной, вызывая чувство вялости и беспомощности, когда жертва не находится рядом с ней или не действует в угоду своим желаниям.#!"

 readiness_perk_name: "Готовность"
 centering_perk_name: "Сосредоточение"
 one_tracked_mind_perk_name: "Однозадачный разум"
 dual_thought_perk_name: "Двойственное мышление"
 perfect_clarity_perk_name: "Совершенная ясность"

 READINESS_PERK_EFFECT: "[Concept('bs_spell', 'Заклинание')|E]: Можно получить модификатор «[GetModifier('readiness_modifier').GetNameWithTooltip]» за [PlayerBloodValue('bs_contradict_cost')].\n#flavor Использование «Готовности» позволяет заклинателю быстрее разобраться в затруднительной ситуации. Повышенная ясность мышления помогает заклинателю лучше реагировать на меняющиеся ситуации и повышает его сообразительность.#!"
 CENTERING_PERK_EFFECT: "[Concept('bs_spell', 'Заклинание')|E]: Можно заставить цель потерять #P @stress_loss_icon!20#! [Concept('static_stress', 'психического напряжения')|E], #V 10#! если нацелено на себя.\n#flavor Призывая эту способность, тауматург вызывает внезапное, полное спокойствие у объекта, нашёптывая ему успокаивающие слова. Находясь в состоянии такого спокойствия, объект способен лучше сосредоточиться на текущих задачах, игнорируя отвлекающие факторы и неприятности, включая серьезные телесные повреждения.#!"
 ONE_TRACKED_MIND_PERK_EFFECT: "Снижает сложность проверки [Concept('skill', 'навыков')|E] в [Concept('infiltration_missions', 'миссиях проникновения')|E] на #P 5#!.\n#flavor Распространяя свои способности на других людей, тауматург способен зацикливаться на одном действии. Эта целеустремлённость цели такова, что она игнорирует всё остальное, что происходит вокруг неё. Стражники легко отвлекаются с помощью этой способности, поскольку их внимание переключается на что-то другое, и исследование становится целенаправленной задачей.#!"
 DUAL_THOUGHT_PERK_EFFECT: "Улучшает [Concept('bs_spell', 'заклинание')|E] достоинства «[GetPerk('readiness_perk').GetName(GetNullCharacter)]», вместо этого наделяя модификатором «[GetModifier('dual_thought_modifier').GetNameWithTooltip]».\n#flavor При должной концентрации, необходимой для изучения тауматургии, многие тремеры способны быстро и полностью контролировать ситуацию. Обладая этой способностью, тауматург может без проблем распределять своё внимание на две совершенно разные задачи.#!"
 PERFECT_CLARITY_PERK_EFFECT: "Улучшает [Concept('bs_spell', 'заклинание')|E] достоинства «[GetPerk('readiness_perk').GetName(GetNullCharacter)]», вместо этого наделяя модификатором «[GetModifier('perfect_clarity_modifier').GetNameWithTooltip]».\n#flavor «Совершенная ясность» вызывает у тауматурга момент беспрепятственного прозрения, подобный дзену. Достигается чистая сосредоточенность, мысль и действие становятся единым целым, и на магов-сородичей нисходит полная безмятежность ума. Эта ясность сознания защищает тауматурга от влияний как внутренних, так и внешних; даже Зверь внутри него не способен вырваться наружу.#!"

 warcry_perk_name: "Боевой клич"
 strike_true_perk_name: "Истинный удар"
 wind_dance_perk_name: "Танец ветра"
 fearless_heart_perk_name: "Бесстрашное сердце"
 comrades_at_arms_perk_name: "Товарищи по оружию"

 WARCRY_PERK_EFFECT: "#flavor Атакующий вампир может сконцентрировать свою волю, что делает его менее восприимчивым к страху битвы или силам нежити. Вампир издаёт первобытный крик, чтобы запустить эффект, хотя известно, что некоторые тауматурги вместо этого разрисовывают себе лица или вскрывают себе животы.#!"
 STRIKE_TRUE_PERK_EFFECT: "#flavor Вампир совершает одиночную атаку, ведомый нечестивой силой своей крови. Эта атака безошибочно поражает противника.#!"
 WIND_DANCE_PERK_EFFECT: "[PODImprovesCombatMove('POD_combat_move_blood_surge')].\n#flavor Тауматург призывает силу ветров, двигаясь как в тумане. Он получает сверхъестественное преимущество, уклоняясь от ударов своих врагов, уходя с их пути прежде, чем у врага появится шанс нанести удар.#!"
 FEARLESS_HEART_PERK_EFFECT: "#flavor Вампир временно увеличивает свои способности воина. Благодаря мистической силе магии крови персонаж становится мощной боевой силой.#!"
 COMRADES_AT_ARMS_PERK_EFFECT: "Все члены [Concept('coterie', 'котерии')|E] получат те же преимущества, что и вы. Эти бонусы не складываются.\n#flavor Эта способность увеличивает силу предыдущих способностей на пути. Она позволяет применять любой из предыдущих эффектов к группе, такой как стая или боевой отряд.#!"

 hermetic_sight_perk_name: "Взгляд герметика"
 astral_chant_perk_name: "Астральное наречие"
 voice_of_command_perk_name: "Командный глас"
 entrap_ephemera_perk_name: "Ловля духа"
 duality_perk_name: "Двойственность"

 HERMETIC_SIGHT_PERK_EFFECT: "Можно взаимодействовать с обитателями [Concept('umbra', 'Умбры')|E], оставаясь на земле.\n#flavor Вампир может улавливать мир духов, либо пристально вглядываясь в него, либо воспринимая присутствие близлежащих духов как туманное наложение на материальный мир.#!"
 ASTRAL_CHANT_PERK_EFFECT: "Позволяет заключить [Concept('spirit_pact', 'духовный договор')|E] без знания языка за #N -30#! принятия.\n#flavor Наречия мира духов бесконечно разнообразны и в основном непостижимы для смертных (и бессмертных) разумов. «Астральное наречие» не учит тауматурга языкам духов, но позволяет ему понимать их, когда они обращаются к нему, и отвечать на их родных языках.#!"
 VOICE_OF_COMMAND_PERK_EFFECT: "#flavor Это, пожалуй, самая опасная способность в арсенале манипулирования духами, поскольку последствия неудачи могут быть особенно неприятными. Командный глас позволяет тауматургу отдавать приказы духу, заставляя его прислушиваться к приказам, хочет он того или нет.#!"
 ENTRAP_EPHEMERA_PERK_EFFECT: "Можно использовать [Concept('artifacts', 'артефакты')|E]-[Concept('fetish', 'фетиши')|E].\n#flavor Эта способность позволяет тауматургу заключать дух в физический объект. Это может быть сделано для того, чтобы заключить цель в темницу, но чаще всего это делается для создания фетиша — артефакта, который даёт мистические преимущества, питаемые духом. Фетиши, созданные этой силой, часто ненадёжны и выходят из строя в неподходящий момент, поскольку духи, находящиеся внутри, по понятным причинам недовольны своим положением и используют любую возможность, чтобы сбежать или помешать своим похитителям.#!"
 DUALITY_PERK_EFFECT: "Удаляет плату за вход в [Concept('umbra', 'Умбру')|E].\n#flavor Тауматург теперь может полноценно взаимодействовать с миром духов — странным местом, которое лишь иногда напоминает реальный мир. Используя эту способность, он существует на обоих планах бытия одновременно. Он способен брать предметы из физического мира и помещать их в мир духов, и наоборот. Существа и особенности ландшафта в обоих мирах для него очевидны, и он может взаимодействовать с ними любым способом. Он даже может использовать тауматургию и другие дисциплины в обоих мирах.#!"

 vertigo_perk_name: "Головокружение"
 contortion_perk_name: "Искажение"
 seizure_perk_name: "Припадок"
 body_failure_perk_name: "Отказ тела"
 blood_marionette_perk_name: "Марионетка"

 VERTIGO_PERK_EFFECT: "После успешного нанесения ранения жертве она получит на 1 год модификатор «[GetModifier('vertigo_modifier').GetNameWithTooltip]».\n#flavor Тауматург вызывает лёгкую дезориентацию и головокружение с помощью тонких манипуляций с телом субъекта. Физический дискомфорт является временным и незначительным, но умный тауматург может использовать его против соперников в самый неподходящий момент, заставляя их терять свой апломб.#!"
 CONTORTION_PERK_EFFECT: "Улучшает модификатор достоинства «[GetPerk('vertigo_perk').GetName(GetNullCharacter)]» до «[GetModifier('contortion_modifier').GetNameWithTooltip]».\n.#flavor Одним прикосновением тауматург заставляет группу мышц противника непроизвольно сокращаться, что приводит к судорожным припадкам. Этот эффект приводит субъекта в крайнее замешательство, делая конечность или группу мышц непригодными для использования.#!"
 SEIZURE_PERK_EFFECT: "Улучшает модификатор достоинства «[GetPerk('vertigo_perk').GetName(GetNullCharacter)]» до «[GetModifier('seizure_modifier').GetNameWithTooltip]».\n#flavor Припадок приводит к тому, что тело сотрясается в конвульсиях. Все мышцы тела неконтролируемо сокращаются, при этом у жертвы изо рта идет пена, а спазмы причиняют ему мучительную боль. Смертный может даже задохнуться, когда его язык перекроет доступ воздуха.#!"
 BODY_FAILURE_PERK_EFFECT: "Участвуя в [Concept('combat_phase', 'бою')|E] в качестве [Concept('knight', 'рыцаря')|E], вы получаете повышенный шанс ранить вражеских [Concept('knights', 'рыцарей')|E].\n#flavor Тауматурги, владеющие этой ужасающей способностью, получают потрясающее представление о работе организма, что приводит к полному отключению его систем. Эта внезапная биологическая перегрузка часто оказывается смертельной для смертных и наносит ущерб другим сверхъестественным существам.#!"
 BLOOD_MARIONETTE_PERK_EFFECT: "В начале сражения случайный вражеский [Concept('knight', 'рыцарь')|E] выйдет из боя.\n#flavor Тауматург, вызывающий «Марионетку», обретает такую власть над телами других людей, что может магическим образом захватить контроль над другим существом и заставить свою жертву действовать в соответствии с собственными прихотями. Этот контроль не так совершенен, как прямое и личное управление способности Доминирования «Одержимость», но истинное тело тауматурга не так уязвимо во время манипуляций.#!"

 control_fog_perk_name: "Управление туманом"
 manipulate_rain_perk_name: "Управление дождём"
 command_wind_perk_name: "Управление ветром"
 summon_storm_perk_name: "Управление бурей"
 dominate_lightning_perk_name: "Управление молнией"

 CONTROL_FOG_PERK_EFFECT: "Вражеские [Concept('knights', 'рыцари')|E], выступающие в роли [Concept('commander', 'командиров')|E] в ходе [Concept('combat_phase', 'фазы битвы')|E] получат модификатор «[GetModifier('control_fog_modifier').GetNameWithTooltip]».\n[PODUnlocksCombatMove('POD_combat_move_weather_control')].\n#flavor Тауматург может превратить своё витэ в тонкий туман, который быстро увеличивается в размерах, используя всё, что находится поблизости, в качестве «топлива».#!"
 MANIPULATE_RAIN_PERK_EFFECT: "Улучшает [Concept('modifier', 'модификатор')|E] битвы достоинства «[GetPerk('control_fog_perk').GetName(GetNullCharacter)]» до «[GetModifier('manipulate_rain_modifier').GetNameWithTooltip]».\n#flavor Используя сверхъестественную силу крови, сородичи могут манипулировать облаками на небесах, чтобы начался дождь, или наоборот.#!"
 COMMAND_WIND_PERK_EFFECT: "Улучшает [Concept('modifier', 'модификатор')|E] битвы достоинства «[GetPerk('control_fog_perk').GetName(GetNullCharacter)]» до «[GetModifier('command_wind_modifier').GetNameWithTooltip].\n[PODImprovesCombatMove('POD_combat_move_weather_control')].\n#flavor После довольно утомительного ритуала вампир может отдать одну команду ближайшим ветрам, увеличив их скорость до 50 километров в час. Каждая последующая команда требует дополнительных затрат витэ и силы воли.#!"
 SUMMON_STORM_PERK_EFFECT: "Улучшает [Concept('modifier', 'модификатор')|E] битвы достоинства «[GetPerk('control_fog_perk').GetName(GetNullCharacter)]» до «[GetModifier('summon_storm_modifier').GetNameWithTooltip]».\n#flavor Призвав врождённую силу крови, заклинатель может призвать мощную бурю среди ясного неба. После того, как буря вызвана, она не поддаётся никаким попыткам дальнейшего контроля или смягчения, пока не закончится сама по себе.#!"
 DOMINATE_LIGHTNING_PERK_EFFECT: "Улучшает [Concept('modifier', 'модификатор')|E] битвы достоинства «[GetPerk('control_fog_perk').GetName(GetNullCharacter)]» до «[GetModifier('dominate_lightning_modifier').GetNameWithTooltip].\n[PODImprovesCombatMove('POD_combat_move_weather_control')]».\n#flavor Обладая этой способностью, умелый тауматург может призвать молнию, чтобы поразить своих врагов, независимо от погоды или любых внешних условий.#!"

 elemental_strength_perk_name: "Сила стихии"
 wooden_tongues_perk_name: "Древесный язык"
 animate_the_unmoving_perk_name: "Оживление недвижимого"
 elemental_form_perk_name: "Облик элементаля"
 summon_elemental_perk_name: "Призыв элементаля"

 ELEMENTAL_STRENGTH_PERK_EFFECT: "#flavor Вампир может использовать силу и упругость земли или окружающих его предметов, чтобы увеличить свою физическую мощь без необходимости в большом количестве крови.#!"
 WOODEN_TONGUES_PERK_EFFECT: "#flavor Вампир может общаться, хотя и в ограниченной степени, с духом любого неодушевлённого предмета. Разговор может быть не очень интересным, поскольку большинство камней и стульев не имеют особого отношения к тому, что происходит вокруг них, но вампир может получить хотя бы общее представление о том, что «пережил» субъект.#!"
 ANIMATE_THE_UNMOVING_PERK_EFFECT: "Доступны [Concept('men_at_arms', 'профессионалы')|E] - [GetMaA('golems').GetName].\n#flavor Объекты, на которые воздействует эта способность, перемещаются по указанию вампира, использующего её. Объект не может совершить действие, которое было бы совершенно немыслимым для объекта с его формой — например, дверь не может сорваться с петель и перенести кого-то через улицу.#!"
 ELEMENTAL_FORM_PERK_EFFECT: "#flavor Вампир может принимать форму любого неодушевлённого предмета, масса которого примерно равна его собственной. Стол, статуя или карета были бы вполне осуществимы, но дом или загон оказались бы за пределами возможностей этой способности.#!"
 SUMMON_ELEMENTAL_PERK_EFFECT: "Доступны [Concept('men_at_arms', 'профессионалы')|E] - [GetMaA('fire_elemental').GetName], [GetMaA('air_elemental').GetName], [GetMaA('earth_elemental').GetName] и [GetMaA('water_elemental').GetName].\n#flavor Вампир может призвать одного из традиционных духов стихий: саламандру (огонь), сильфиду (воздух), гнома (земля) или ундину (вода). Заклинатель может выбрать, какого типа элементаля он хочет призвать и управлять им.#!"

 bs_a_taste_for_blood_perk_name: "Вкус крови"
 blood_rage_perk_name: "Неистовство крови"
 bs_blood_of_potency_perk_name: "Сила крови"
 bs_theft_of_vitae_perk_name: "Кража витэ"
 bs_cauldron_of_blood_perk_name: "Котёл крови"

 BS_A_TASTE_FOR_BLOOD_PERK_EFFECT: "[Concept('bs_spell', 'Заклинание')|E]: Позволяет раскрыть [Concept('secret', 'секрет')|E] цели-[Glossary('диаблериста','game_concept_diablerie_desc')], если она является им, за [PlayerBloodValue('bs_a_taste_for_blood_cost')].\n#flavor Эта способность была разработана как средство проверки мощи противника — чрезвычайно важная способность в бурные ранние ночи клана Тремер. Просто прикоснувшись к крови своего объекта, заклинатель может определить, сколько витэ осталось в объекте, и, если объект является вампиром, как недавно он питался, и примерное его поколение.#!"
 BLOOD_RAGE_PERK_EFFECT: "[Concept('bs_spell', 'Заклинание')|E]: Можно получить или удалить модификатор «[GetModifier('blood_rage_modifier').GetNameWithTooltip]» за [PlayerBloodValue('bs_blood_rage_cost')].\n#flavor Эта способность позволяет вампиру заставлять другого сородича расходовать кровь против его воли. Чтобы эта способность подействовала, заклинатель должен прикоснуться к своему предмету, хотя необходим лишь самый лёгкий контакт. Вампир, на которого воздействует эта способность, может почувствовать физический прилив, когда тауматург усиливает его физические характеристики, может внезапно обнаружить, что он становится более похожим на человека, или даже может оказаться на грани безумия, поскольку его запасы витэ мистическим образом истощаются.#!"
 BS_BLOOD_OF_POTENCY_PERK_EFFECT: "[Concept('bs_spell', 'Заклинание')|E]: Повышает вашу силу крови на #V 1#! на 10 лет за [PlayerBloodValue('bs_blood_of_potency_cost')].\n#flavor Тауматург получает такой контроль над своей собственной кровью, что может эффективно «концентрировать» её, делая на короткое время более мощной. По сути, он может временно увеличить силу своей собственной крови с помощью этой способности.#!"
 BS_THEFT_OF_VITAE_PERK_EFFECT: "#P -1#! к крови, необходимой для утоления @blood_icon![Concept('hunger', 'голода')|E].\n#flavor Тауматург, использующий эту способность, высасывает витэ из своего объекта. Ему не нужно вступать в контакт с объектом — кровь буквально физическим потоком течёт от объекта к сородичу (хотя часто она мистическим образом поглощается и не обязательно поступает через рот).#!"
 BS_CAULDRON_OF_BLOOD_PERK_EFFECT: "При участии в [Concept('combat_phase', 'бою')|E] в качестве [Concept('commander', 'командира')|E] #V 3#! случайных вражеских [Concept('knights', 'рыцаря')|E] получат #V [EmptyScope.ScriptValue('POD_base_wound_damage')|V0]#! ед. [Concept('POD_aggravated_damage', 'серьёзного урона')|E].\n#flavor Тауматург, использующий эту способность, кипятит кровь в жилах субъекта, как воду на плите. Сородич должен прикоснуться к субъекту, и именно этот контакт вскипятит его кровь. Эта способность всегда смертельна для смертных и наносит огромный урон даже самым могущественным вампирам.#!"

 eyes_of_the_sea_perk_name: "Глаза моря"
 prison_of_water_perk_name: "Водяная тюрьма"
 blood_to_water_perk_name: "Кровь в воду"
 flowing_wall_perk_name: "Текучая стена"
 dehydrate_perk_name: "Обезвоживание"

 EYES_OF_THE_SEA_PERK_EFFECT: "#flavor Тауматург может вглядываться в водоём и рассматривать события, происходящие на нём, в нём или вокруг него, с точки зрения воды. Некоторые старшие сородичи, практикующие это искусство, утверждают, что вампир общается с духами вод, когда использует эту способность; младшие сородичи смеются над такими утверждениями.#!"
 PRISON_OF_WATER_PERK_EFFECT: "[Concept('bs_spell', 'Заклинание')|E]: Позволяет начать против цели @pod_combat_encounter_icon![Concept('pod_combat_encounter', 'боевое столкновение')|E]. В случае победы вы [Concept('imprison', 'плените')|E] её за [PlayerBloodValue('bs_a_taste_for_blood_cost')] и [prestige_i|E]#N 2000#! [Concept('prestige', 'престижа')|E].\n#flavor Тауматург может повелевать достаточно большим количеством воды, чтобы оживить себя и заключить в темницу субъекта. Для полной эффективности этой способности требуется значительное количество жидкости.#!"
 BLOOD_TO_WATER_PERK_EFFECT: "[Concept('bs_spell', 'Заклинание')|E]: Выбранный #TOOLTIP:GAME_TRAIT,vampire,[GetNullCharacter] #L вампир#!#! получит #N 3$POD_energy_blood_icon$#! (другие [Concept('splats', 'виды')|E] теряют кровь) за [PlayerBloodValue('bs_blood_to_water_cost')].\n#flavor Тауматург теперь обладает достаточной властью над водой, чтобы превращать другие жидкости в этот базовый элемент. Чаще всего эта способность используется для нападения; всего лишь одним прикосновением кровь жертвы превращается в воду, ослабляя вампиров и убивая смертных в считанные мгновения.#!"
 FLOWING_WALL_PERK_EFFECT: "#flavor Рассказы о неспособности вампиров пересекать текучую воду, возможно, частично возникли из искажённых описаний этой способности в действии. Тауматург может оживлять воду в ещё большей степени, чем это возможно при использовании «Водяной тюрьмы», приказывая ей подниматься, образуя барьер, непреодолимый практически для любого существа.#!"
 DEHYDRATE_PERK_EFFECT: "[PODUnlocksCombatMove('POD_combat_move_dehydrate')].\n#flavor На этом уровне мастерства тауматург может напрямую атаковать живые и неживые объекты, удаляя воду из их тел. Жертвы, убитые этой способностью, оставляют после себя отвратительные мумифицированные трупы.#!"

 simple_nectar_perk_name: "Простой нектар"
 nectar_perk_name: "Нектар"
 complex_nectar_perk_name: "Сложный нектар"
 high_nectar_perk_name: "Высший нектар"
 ungodly_nectar_perk_name: "Нечестивый нектар"

 SIMPLE_NECTAR_PERK_EFFECT: "Вы можете заставить цель выучить ваши достоинства [Glossary('дисциплины','game_concept_discipline_desc')] до 1 точки, применив это #TOOLTIP:game_concept_bloodmagic_spell_desc #E заклинание#!#!.\n#weak Сварив зелье из собственной [Glossary('витэ','game_concept_vitae_desc')], ракта-садху может наделить пьющего одним уровнем дисциплины или пути#!"
 NECTAR_PERK_EFFECT: "Улучшает эффект #TOOLTIP:game_concept_bloodmagic_spell_desc #E заклинания#!#! [GetPerk('simple_nectar_perk').GetName(GetPlayer)] до 2 точек.\n#weak Сварив зелье из собственной [Glossary('витэ','game_concept_vitae_desc')], ракта-садху может наделить пьющего двумя уровнями дисциплины или пути#!"
 COMPLEX_NECTAR_PERK_EFFECT: "Улучшает эффект #TOOLTIP:game_concept_bloodmagic_spell_desc #E заклинания#!#! [GetPerk('nectar_perk').GetName(GetPlayer)] до 3 точек.\n#weak Сварив зелье из собственной [Glossary('витэ','game_concept_vitae_desc')], ракта-садху может наделить пьющего тремя уровнями дисциплины или пути#!"
 HIGH_NECTAR_PERK_EFFECT: "Улучшает эффект #TOOLTIP:game_concept_bloodmagic_spell_desc #E заклинания#!#! [GetPerk('complex_nectar_perk').GetName(GetPlayer)] до 4 точек.\n#weak Сварив зелье из собственной [Glossary('витэ','game_concept_vitae_desc')], ракта-садху может наделить пьющего четырмя уровнями дисциплины или пути#!"
 UNGODLY_NECTAR_PERK_EFFECT: "Улучшает эффект #TOOLTIP:game_concept_bloodmagic_spell_desc #E заклинания#!#! [GetPerk('high_nectar_perk').GetName(GetPlayer)] до 5 точек.\n#weak Сварив зелье из собственной [Glossary('витэ','game_concept_vitae_desc')], ракта-садху может наделить пьющего пятью уровнями дисциплины или пути#!"

 a_sending_of_serpents_perk_name: "Гнездо змей"
 darkness_of_duat_perk_name: "Тьма Дуата"
 suffocation_of_the_tomb_perk_name: "Бездыханность мёртвых"
 the_narrow_house_perk_name: "Тесный дом"
 consignment_to_duat_perk_name: "Отправка в Дуат"

 A_SENDING_OF_SERPENTS_PERK_EFFECT: "Вражеские [Concept('knights', 'рыцари')|E], выступающие в роли [Concept('commander', 'командиров')|E] в ходе [Concept('combat_phase', 'фазы битвы')|E], или ваши противники в [Concept('single_combat_duel_plural', 'поединке')|E] получат модификатор [GetModifier('a_sending_of_serpents_modifier').GetNameWithTooltip].\n[PODUnlocksCombatMove('POD_combat_move_a_sending_of_serpents')].\n#weak Вызывает у цели галлюцинации, что на нее напали змеи.#!"
 DARKNESS_OF_DUAT_PERK_EFFECT: "Вы можете дать цели свойство [GetTrait('blind').GetName(GetPlayer)] на 5 лет, применив это #TOOLTIP:game_concept_bloodmagic_spell_desc #E заклинание#!#!.\n[PODUnlocksCombatMove('POD_combat_move_darkness_of_duat')].\n#weak Ослепляет субъекта.#!"
 SUFFOCATION_OF_THE_TOMB_PERK_EFFECT: "Вы можете дать цели модификатор [GetModifier('suffocation_of_the_tomb_modifier').GetNameWithTooltip] на 1 год, применив это #TOOLTIP:game_concept_bloodmagic_spell_desc #E заклинание#!#!.\n#weak Лишает жертву способности говорить и дышать.#!"
 THE_NARROW_HOUSE_PERK_EFFECT: "Вражеские [Concept('knights', 'рыцари')|E], выступающие в роли [Concept('commander', 'командиров')|E] в ходе [Concept('combat_phase', 'фазы битвы')|E], или ваши противники в [Concept('single_combat_duel_plural', 'поединке')|E] получат модификатор [GetModifier('the_narrow_house_modifier').GetNameWithTooltip]\n[PODUnlocksCombatMove('POD_combat_move_the_narrow_house')].\n#weak Парализует цель.#!"
 CONSIGNMENT_TO_DUAT_PERK_EFFECT: "Вы можете убить не бессмертного персонажа или ввергнуть бессмертного персонажа в [GetTrait('torpor').GetName(GetPlayer)|l].\n[PODUnlocksCombatMove('POD_combat_move_consignment_to_duat')].\n#weak Убивает смертного или погружает вампира в торпор.#!"

