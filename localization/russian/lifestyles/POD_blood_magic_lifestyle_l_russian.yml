 PAST_LIVES_PERK_EFFECT: "Вы можете наделить цель [Concept('modifier', 'модификатором')|E], дающим +4 к случайному [Concept('skill', 'навыку')|E] ([GetModifier('past_lives_diplomacy_modifier').GetNameWithTooltip]) на 10 лет, применив это #TOOLTIP:game_concept_bloodmagic_spell_desc #E заклинание#!#!.\n[PODUnlocksCombatMove('POD_combat_move_past_lives')]\n#flavor Получить умеренно подробную биографию вашего предыдущего воплощения#!"
 MASTER_OF_SAMSARA_PERK_EFFECT: "Вы можете улучшить случайный [Concept('skill', 'навык')|E] на 1 ценой постоянного [Concept('modifier', 'модификатора')|E] ([GetModifier('master_of_samsara_penality_modifier').GetNameWithTooltip]), применив это #TOOLTIP:game_concept_bloodmagic_spell_desc #E заклинание#!#!.\nВаш убийца получит модификатор [GetModifier('master_of_samsara_modifier').GetNameWithTooltip] на 50 лет.\n#flavor Получить ограниченную власть над будущим воплощением цели#!"

