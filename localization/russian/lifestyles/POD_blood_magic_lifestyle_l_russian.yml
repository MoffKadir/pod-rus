 RAVAGES_OF_THE_BEAST_PERK_EFFECT: "[Concept('bs_spell', 'Заклинание')|E]: Заставляет выбранного #TOOLTIP:GAME_TRAIT,vampire,[GetNullCharacter] #L вампира#!#! впасть в неистовство.\n#flavor С того момента, как сородич получает становление, он испытывает ярость и инстинкты первобытного Зверя; это первое проклятие, сопровождающее превращение. Если спровоцировать Зверя внутри вампира, он впадёт в бессмысленное неистовство берсерка. Некоторые сородичи изо всех сил стараются держать своих Зверей в узде, в то время как другие наслаждаются, катаясь на волнах этой неистовой ярости. Тауматург, призывающий эту способность, уговаривает Зверя всплыть на поверхность внутри своей цели, выпуская на волю свирепого убийцу.#!"
 WEIGHT_OF_THE_SUN_PERK_EFFECT: "[Concept('bs_spell', 'Заклинание')|E]: Выбранный #TOOLTIP:GAME_TRAIT,vampire,[GetNullCharacter] #L вампир#!#! получит модификатор «[GetModifier('weight_of_the_sun_modifier').GetNameWithTooltip]».\n#flavor Сопутствующим проклятием становления является неспособность бодрствовать в дневное время. Вынужденный вести тайное существование по ночам, сородич теряет возможность когда-либо снова увидеть солнце. Когда этот огненно-белый шар поднимается на востоке, сородичи ощущают его давящую тяжесть, погружающую их в дремоту. Эта сила позволяет тауматургу вызывать тот же тип летаргии, который навевает солнце в течение долгих часов дня.#!"
 ABATED_TOOTH_PERK_EFFECT: "[Concept('bs_spell', 'Заклинание')|E]: Выбранный #TOOLTIP:GAME_TRAIT,vampire,[GetNullCharacter] #L вампир#!#! получит модификатор «[GetModifier('abated_tooth_modifier').GetNameWithTooltip]».\n#flavor Всем вампирам нужна кровь, чтобы выжить; они зависят от смертных сосудов для пропитания и поцелуя для поддержания своей нежизни. Когда сородичи питаются, они обычно выпускают клыки, чтобы легче было пронзить плоть своей жертвы. Используя эту способность, тауматург мистическим образом притупляет клыки субъекта, лишая его возможности эффективно использовать их. Его клыки настолько сильно притупляются, что становится практически невозможно эффективно прокалывать плоть, заставляя поражённых сородичей искать альтернативные способы питания.#!"
 TREACHEROUS_BONDS_PERK_EFFECT: "[Concept('bs_spell', 'Заклинание')|E]: Случайный #TOOLTIP:GAME_TRAIT,ghoul,[GetNullCharacter] #L гуль#!#! или дитя цели потеряют о ней #N 20#! [Concept('opinion', 'мнения')|E].\n#flavor Тауматург, призывающий эту способность, мгновенно вызывает у раба-регнанта эмоциональное состояние, вызванное ненавистью; там, где когда-то была любовь, теперь его эмоциями управляет только ненависть. Эта способность вызывает обратную реакцию в крови цели, временно разрушая все связи, которыми она связана, от самых новых до тех, что создавались годами.#!"
 THE_WITHERING_OF_AGES_PERK_EFFECT: "В начале сражения 3 случайных [Concept('knights', 'рыцаря')|E]-#TOOLTIP:GAME_TRAIT,vampire,[GetNullCharacter] #L вампира#!#! получат модификатор «[GetModifier('the_withering_of_ages_modifier').GetNameWithTooltip]» при участии в [Concept('combat_phase', 'бою')|E] в качестве [Concept('commander', 'командира')|E].\n#flavor Эта разрушительная способность искажает кровь вампиров, временно приостанавливая действие свойств, поддерживающих их бессмертие. Тауматург, вступающий в физический контакт с жертвой, может лишить её возраста и ненадолго одряхлеть. Через несколько мгновений тело жертвы выдаст её истинный возраст, сморщившись и скукожившись под тяжестью прожитых лет.#!"

 force_bolt_perk_name: "Силовой снаряд"
