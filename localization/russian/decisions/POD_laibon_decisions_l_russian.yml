l_russian:
 pod_laibon_explain_aye_orun_decision: "Размышлять о двух мирах"
 pod_laibon_explain_aye_orun_decision_desc: "Обратите свои мысли внутрь себя и поразмышляйте о двух столпах существования Лайбон: Айе, мире живых, и Оруне, мире духов. Где вы стоите между ними?"
 pod_laibon_explain_aye_orun_decision_tooltip: "Поразмыслить о своей связи с двумя мирами и узнать, как система Айя/Орун формирует вашу силу."
 pod_laibon_explain_aye_orun_decision_confirm: "Направить свои мысли вовнутрь."
 pod_laibon_invoke_authority_decision: "Призвать власть живых"
 pod_laibon_invoke_authority_decision_desc: "Вы говорите голосом мира живых — смертные подчиняются, потому что им повелевает сама земля, а другие Лайбон признают вашу Айю - авторитет."
 pod_laibon_invoke_authority_decision_confirm: "Призвать авторитет Айи."
 pod_laibon_invoke_authority_decision_tooltip: "Даёт +10 к народному мнению и +10% к приросту контроля на 5 лет. Мнение всех вассалов-лайбон о вас повышается на +5 на тот же промежуток."
 pod_laibon_commune_ancestors_decision: "Общение с предками"
 pod_laibon_commune_ancestors_decision_desc: "Вы откроете врата Оруна, и предки ответят, показав вам, что скрыто в ваших владениях, и наделив вас своей силой."
 pod_laibon_commune_ancestors_decision_confirm: "Открыть врата Оруна."
 pod_laibon_commune_ancestors_decision_tooltip: "Раскрывает секрет персонажа в вашей державе. Даёт +5 к доблести и +25% к сопротивлению враждебным проискам на 5 лет."
 pod_laibon_commune_reveal_secret_tt: "Предки могут раскрыть скрытую правду о ком-то в вашей державе."
 pod_laibon_remember_the_living_decision: "Вспомнить о живых"
 pod_laibon_remember_the_living_decision_desc: "Пройдите среди смертных, чтобы вспомнить тепло жизни. Не охотьтесь и не правьте: посидите у очага, послушайте семейный спор о пустяках. Посмотрите, как дети играют в игру, правила которой вы когда-то знали. Возвращаться к Айе после долгого пренебрежения всегда больно. Но хотя бы этой ночью мир живых вновь станет реальным."
 pod_laibon_remember_the_living_decision_tooltip: "Получить опыт Айи за благочестие и стресс. Доступно только тогда, когда ваша связь с живым миром исчезла."
 pod_laibon_remember_the_living_decision_confirm: "Прогуляться среди живых."
 pod_laibon_call_to_ancestors_decision: "Обратиться к предкам"
 pod_laibon_call_to_ancestors_decision_desc: "Отправляйтесь в тихое место, к могиле, к перекрёстку, к корням старого дерева и впервые за десятилетия взовите к предкам. Тишина тянется. Затем, слабый ответ. Не слова, давление, присутствие, напоминание о том, что духовный мир не покинул вас, даже если вы его покинули. Воссоединение болезненно, как кровь возвращается в онемевшую конечность. Но вы можете услышать их снова."
 pod_laibon_call_to_ancestors_decision_tooltip: "Получить опыт Оруна за благочестие и стресс. Доступно только тогда, когда ваша связь с миром духов исчезла."
 pod_laibon_call_to_ancestors_decision_confirm: "Воззвать к предкам."
 pod_laibon_walker_between_worlds_tt: "Вы достигли идеала Лайбон, равновесия между Айей и Оруном. Вы — [Select_CString(ROOT.Char.IsFemale, 'путешественница', 'путешественник' )] между мирами."