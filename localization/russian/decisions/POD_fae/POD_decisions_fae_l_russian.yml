 POD_santa_presents_decision: "Доставить подарки"
 POD_santa_presents_decision_desc: "Раздавать подарки — радостное дело!\nТрудно не поверить в того, кто приносит всем радость и веселье."
 POD_santa_presents_decision_tooltip: "Звените, бубенцы"
 POD_santa_presents_decision_confirm: "Распространить радость по всему миру"

 POD_grigori_faith_channel_decision: "Божественные молитвы"
 POD_grigori_faith_channel_decision_desc: "Вы — [Select_CString(ROOT.Char.IsFemale, 'пророчица', 'пророк' )], божественная фигура для этих смертных. Их вера защищает вас от любого неверия, которое мир может навязать вам, но это ещё не всё...\n\nИх молитвы несут гламур; гламур, который по праву принадлежит вам, вам нужно только прислушаться и выслушать их самые сокровенные потребности."
 POD_grigori_faith_channel_decision_tooltip: "Внимательно прислушаться"
 POD_grigori_faith_channel_decision_confirm: "Возможно, вы не знаете, но я слушаю"


