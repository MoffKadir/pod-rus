 POD_inanimae_legacy_3_decision: "Обучение природного целителя"
 POD_inanimae_legacy_3_decision_desc: "Среди Неодушевлённых, владеющих Аквисом, немало искусных целителей. Они могут поделиться знаниями о природных лекарствах и способах исцеления. Хотите ли вы пройти обучение?"
 POD_inanimae_legacy_3_decision_tooltip: "Я хочу стать [Select_CString(ROOT.Char.IsFemale, 'лучшей', 'лучшим' )]"
