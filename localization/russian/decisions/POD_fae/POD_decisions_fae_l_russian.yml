l_russian:
 POD_region_seasons_struggle: "Сражение времён года"

 the_red_and_white_apple_of_avalon_decision: "Красное и белое яблоко Авалона"
 the_red_and_white_apple_of_avalon_decision_desc: "На вершине Гластонбери-Тор находятся два источника - Белый и Красный, олицетворяющие силы жизни и смерти. Рядом с двумя источниками растёт небольшая яблоня, которая приносит яблоки круглый год, будь то зима, лето или весна. Половина яблок красные, а у другой половины кожица белая, как снег."
 the_red_and_white_apple_of_avalon_decision_confirm: "Сорвать яблоко"
 the_red_and_white_apple_of_avalon_decision_tooltip: "Вы получите артефакт-яблоко."

 albion_pools_decision: "Пруды Альбиона"
 albion_pools_decision_desc: "Три мистических Альбионских пруда, спрятанные в Кимру, Альбе и Брейже соответственно, являются одними из самых желанных сокровищ, за которыми охотятся маги, поскольку считается, что тот, кто обладает властью над тремя прудами, будет править всей Англией. Считалось, что один из них дарует вечную молодость, другой исцеляет все раны, а третий якобы дает контроль над сердцами смертных."
 albion_pools_decision_confirm: "Альбион должен стать моим"
 albion_pools_decision_tooltip: "Претендовать на Альбион."
 albion_pools_decision_custom: "Ваша [Concept('realm_capital', 'столица')|E] расположена в [Concept('region', 'регионе')|E] [GetGeographicalRegion('ghw_region_britannia').GetName]"

 foster_sprite_decision: "Найти наследника"
 foster_sprite_decision_tooltip: "Ваши слуги предложат несколько подходящих кандидатур"
 foster_sprite_decision_desc: "Истинные феи не плодовиты, но могут зачать спрайта, чтобы создать истинную фею. Поэтому, если вы не хотите, чтобы ваши труды пропали даром в случае несчастного случая, вы должны быть готовы. Вы попросите своих слуг привести несколько подходящих кандидатур."
 foster_sprite_decision_effect_tooltip: "Вам будет представлена группа кандидатов, и вы сможете принять одного из них в качестве своего ребёнка в обмен на престиж"
 foster_sprite_decision_confirm: "Начать поиски"

 POD_fable_decision: "Сказания"
 POD_fable_decision_desc: "Феи тесно связаны с мифами мечтателей, можно даже сказать, созданы и разрушаются ими.\n\nТаким образом, многие феи, которые либо потерпели неудачу, либо не заинтересованы в политических интригах дворов, решили создать собственный миф.\n\nЭто важный выбор. Возможно, я стану Великой тенью, печально известной тем, что манипулировала целыми королевствами, или Великим вестником, чья легендарная дипломатия объединила злейших врагов. Какое сказание я воплощу?"
 POD_fable_decision_tooltip: "Новая легенда."
 POD_fable_decision_confirm: "Моё собственное сказание"
 POD_fable_decision_advance: "Вы поднимете своё сказание на следующий уровень: оно откроет более сильные [Concept('domicile_building_upgrade', 'улучшения поместья')|E], но требования для дальнейшего продвижения также вырастут."
 POD_fable_decision_chose_fable: "Вы выберете одно сказание, которое будете воплощать. #X Этот выбор нельзя будет изменить или отменить позже.#!"

 # TODO FAE
 POD_eccentric_pooka_decision: "Найти пака"
 POD_eccentric_pooka_decision_desc: "Паки такие забавные! Существует столько разных видов — я непременно хочу одного себе! (Поиски могут занять некоторое время)"
 POD_eccentric_pooka_decision_tooltip: "Я хочу этого!"
 POD_eccentric_pooka_decision_confirm: "Пушистый спутник!"

 POD_lilin_objective_decision: "Единение с Лилит"
 POD_lilin_objective_decision_desc: "Подобно блудным детям, называющим себя вампирами, мы, лилины, произошли от Лилит, демоницы, которая восстала против своего создателя и отказалась подчиниться мужчине, за которого её заставили выйти замуж. Но нас от неё отличает многое: нам не хватает её силы, её статуса и, самое главное, её сущности.\n\nНо мы феи, невозможное возможно! Если бы мне удалось собрать артефакты, связанные с Тёмной матерью, и поработить её брата и сестёр, я, возможно, [Select_CString(ROOT.Char.IsFemale, 'смогла', 'смог' )] бы воспроизвести жизнь Лилит."
 POD_lilin_objective_decision_tooltip: "Благословение Тёмной матери"
 POD_lilin_objective_decision_confirm: "Воспроизвести легенду"
 POD_lilin_objective_decision_custom1: "Вы должны узнать [Glossary('истинные имена','podgloss.truename')] #V 3#! #TOOLTIP:GAME_TRAIT,demon,[GetNullCharacter] #L демонов#!#!"
 POD_lilin_objective_decision_effect: "Вы разблокируете [Concept('journeys', 'странствия')|E], которые позволят изучить новые [Concept('bs_traditions', 'традиции')|E] #TOOLTIP:GAME_TRAIT,bloodsorcery,[GetPlayer] #L кровавого чародейства#!#!"

 POD_qareen_objective_decision: "[Select_CString(ROOT.Char.IsFemale, 'Советница', 'Советник' )] человечества"
 POD_qareen_objective_decision_desc: "Вы [Select_CString(ROOT.Char.IsFemale, 'бессмертная', 'бессмертный' )] с огромными знаниями о мире, вы одарены или, возможно, прокляты, чтобы никогда ничего не забывать, и есть много смертных, лишённых какого-либо руководства, слепо спотыкающихся в надежде найти путь вперёд.\n\nНеудивительно, что смертные находят путь, который плох для всех фей. Но, обладая контролем над основными источниками знаний, вы находитесь в превосходной позиции, чтобы вести человечество к будущему, которое принесёт пользу феям вашего вида."
 POD_qareen_objective_decision_tooltip: "Обратиться к джиннам"
 POD_qareen_objective_decision_confirm: "Стать путеводной звездой человечества"
 POD_qareen_objective_decision_mutually_exclusive: "#X Эта цель и «$destroy_order_of_reason_objective_decision$» являются взаимоисключающими#!."
 POD_qareen_objective_decision_effect1: "Задание совета @task_promote_culture! #V $task_promote_culture$#! будет значительно улучшено и откроется доступ к решению «[diligent_development_focus_decision|E]», если нет доктрины «[GetDoctrine('doctrine_fae_morality_unseelie').GetBaseName]»."
 POD_fae_qareen_goal_achieved_modifier_culture: "Вы повели человечество за собой"

 POD_shaytan_objective_decision: "Наследие желаний джиннов"
 POD_shaytan_objective_decision_desc: "Вы — шайтан, и проделки вам хорошо знакомы. Хитростью убедите власть имущих принять ваше предложение исполнить их желания. Так джинны переживут разрушительную силу банальности: ведь рассказы о джиннах, исполняющих желания, будут жить вечно."
 POD_shaytan_objective_decision_tooltip: "Ваше желание — закон для меня"
 POD_shaytan_objective_decision_confirm: "Об этом расскажут много историй"
 POD_shaytan_objective_decision_custom1: "Вы должны успешно использовать [Concept('character_interaction', 'взаимодействие персонажа')|E] #V $POD_shaytan_trick_wish_interaction$#! не менее 30 раз."
 POD_shaytan_objective_decision_info: "#I [Concept('character_interaction', 'Взаимодействие персонажа')|E] #V $POD_shaytan_trick_wish_interaction$#! разблокируется при наличии свойств «[GetTrait('art_naming_advanced').GetName(GetPlayer)]», «[GetTrait('realm_fae').GetName(GetPlayer)]», «[GetTrait('realm_scene').GetName(GetPlayer)]» и «[GetTrait('realm_time').GetName(GetPlayer)]»#!."

 POD_aesin_legacy_4_decision: "Тренировка командира дома"
 POD_aesin_legacy_4_decision_desc: "Дом Асов искусен в командовании при любой погоде и на любой местности. Вы хотите пройти тренировку?"
 POD_aesin_legacy_4_decision_tooltip: "Я хочу стать [Select_CString(ROOT.Char.IsFemale, 'лучшей', 'лучшим' )]"
 POD_aesin_legacy_4_decision_confirm: "Приступим к тренировке"
 POD_aesin_legacy_4_decision_effect1: "Вы можете получить только до #V 4#! [Concept('commander_traits', 'свойств командира')|E]!"

