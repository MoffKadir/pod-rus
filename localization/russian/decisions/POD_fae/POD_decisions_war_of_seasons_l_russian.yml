l_russian:
 POD_war_of_seasons_war_victory_objective: "Победоносный [GetPlayer.Custom('PODFaeCourt')]"
 POD_war_of_seasons_war_victory_objective_desc: "Война времён года в самом разгаре, постоянные войны между [Concept('religion','дворами')] — это норма. Но победу может одержать только одно время года, и это будет [GetPlayer.Custom('PODFaeCourt')]!"
 POD_war_of_seasons_war_victory_objective_tooltip: "Конец Войны времён года"
 POD_war_of_seasons_war_victory_objective_confirm: "Победа будет за нами!"
 POD_war_of_seasons_war_victory_objective_custom1: "Вы должны быть [Concept('court_leader', 'предводителем двора')|E]"
 POD_war_of_seasons_war_victory_objective_custom2: "$PODWarOfSeasonsLeader_spring$ [GetSituation('PoD_war_of_seasons').MakeScope.GetVariable('spring_leader').Char.GetName] должен быть безземельным!"
