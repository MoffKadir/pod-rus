 POD_war_of_seasons_peace_victory_objective: "Вечный мир"
 POD_war_of_seasons_peace_victory_objective_desc: "Война времён года становится далеким кошмаром, китэйн постепенно забывают о войне. И это создаёт идеальную атмосферу для истинного вечного мира."
 POD_war_of_seasons_peace_victory_objective_tooltip: "Мир, который продлится вечно"
 POD_war_of_seasons_peace_victory_objective_confirm: "Забудем о войне"
 POD_war_of_seasons_peace_victory_objective_custom1: "Вы должны быть [Concept('court_leader', 'предводителем двора')|E]"
 POD_war_of_seasons_peace_victory_objective_custom2: "Не должно быть никаких [Concept('independent', 'независимых')|E] китэйн, которые являются вашими [Concept('rival', 'соперниками')|E] или [Concept('nemesis', 'заклятыми врагами')|E] и имеют менее 50 [Concept('opinion', 'мнения')|E]"
 POD_war_of_seasons_peace_victory_objective_effect0: "[GetSituation('PoD_war_of_seasons').GetName] подойдёт к концу"
 POD_war_of_seasons_peace_victory_objective_effect1: "[Glossary('Раскол','game_concept_shattering_desc')] будет предотвращен!"
 POD_war_of_seasons_peace_victory_objective_custom2_ex: "$POD_war_of_seasons_peace_victory_objective_custom2$ #weak ([example.GetName])#!"
 POD_war_of_seasons_peace_victory_objective_effect2:0 "Как только вы станете землевладельцем, вам станет доступно [Concept('decision', 'решение')|E], которое позволит создать титул [GetTitleByKey('h_united_seasons').GetName]"

 POD_form_united_seasons_decision: "Единые времена года"
 POD_form_united_seasons_decision_desc: "По вашему указу Война времён года завершилась, и все #TOOLTIP:GAME_TRAIT,fae,[GetNullCharacter] #L феи#!#! считает вас своим очевидным лидером. И пришло время вам заявить притязания на свой [Concept('title', 'титул')|E]."
 POD_form_united_seasons_decision_tooltip: "Единые времена года"
 POD_form_united_seasons_decision_confirm: "Единые времена года"