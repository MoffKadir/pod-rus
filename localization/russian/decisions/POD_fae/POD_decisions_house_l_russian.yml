 recognition_from_the_dreaming_path_of_prowess_full_coterie: "В вашей [Concept('coterie', 'котерии')|E] должно быть #V 5#! участников #weak ([GetPlayer.MakeScope.ScriptValue('coterie_size')|0])#!"
 recognition_from_the_dreaming_path_of_prowess_average_coterie_prowess: "Среднее значение [Concept('prowess', 'доблести')|E] в вашей [Concept('coterie', 'котерии')|E] должно быть выше #V 60#! #weak ([SCOPE.GetValue('average_coterie_prowess')|0])#!"
 recognition_from_the_dreaming_path_of_prowess_total_knight_prowess: "Общая [Concept('prowess', 'доблесть')|E] ваших [Concept('knights', 'рыцарей')|E] должна быть выше #V 400#! #weak ([SCOPE.GetValue('total_knight_prowess')|0])#!"

 sidhe_house_dominance_beaumayn_objective_decision: "Братская война"
 sidhe_house_dominance_beaumayn_objective_decision_desc: "Дом Бомейн был разделён из-за ожесточённой негласной вражды между братьями - #TOOLTIP:CHARACTER,[GetScriptedCharacterByHistoryID('POD_fae_character_53').GetID] #L Бранделлом#!#! и #TOOLTIP:CHARACTER,[GetScriptedCharacterByHistoryID('POD_fae_character_54').GetID] #L Маркешом#!#!. Все члены дома одержимы последним роковым пророчеством герцога #TOOLTIP:CHARACTER,[GetScriptedCharacterByHistoryID('POD_fae_character_52').GetID] #L Геремина#!#!: сулит ли Железная дорога спасение или разрушение? Дому предстоит определить свой путь в тайной войне."
 sidhe_house_dominance_beaumayn_objective_decision_tooltip: "Вы окончательно опровергнете доводы другой стороны."
 sidhe_house_dominance_beaumayn_objective_decision_confirm: "Раз и навсегда уладить спор."
 sidhe_house_dominance_beaumayn_objective_decision_custom: "[TARGET_CHARACTER.GetFirstName] должен быть мёртв"
 brandell_victory_modifier: "Хранители Закона"
 markesh_victory_modifier: "Предвестники Исхода"

 sidhe_house_dominance_dougal_objective_decision: "Золото в сталь"
 sidhe_house_dominance_dougal_objective_decision_desc: "Дом Дугал известен среди ши как кузнецы. Многие считают, что в политических махинациях дом Дугал не имеет особого значения, но именно их изобретения подпитывают интриги дома Эйлунд. Вспыльчивые Фиона ссорятся из-за их прекрасных изобретений. Властители дома Гвидион совершают свои великие подвиги с мечами Дугалов, облачённые в кольчуги Дугалов. В то время как большинство других домов ссорятся, дуются и пустословят, Дугалы работают, строят и созидают. Теперь, когда бронзу вытеснили железо и сталь, дому Дугал необходимо создать обширное хранилище оружия и доспехов. Подмастерья и мастерские Дугалов будут сосредоточены на создании такого арсенала, но это обойдётся недёшево."
 sidhe_house_dominance_dougal_objective_decision_tooltip: "Вы соберёте огромное количество оружия и доспехов"
 sidhe_house_dominance_dougal_objective_decision_confirm: "Удар кузнечного молота равен сотне ударов ювелира"
 dougal_victory_modifier: "Золото в сталь"

 sidhe_house_dominance_eiluned_objective_decision: "Укреплённые фригольды"
 sidhe_house_dominance_eiluned_objective_decision_desc: "Дом тайн вступил в сговор со многими тёмными и таинственными существами и силами, чтобы собрать магические знания. Эйлунд, обладающие многими способностями провидцев, предупреждены и поэтому стремятся быть вооружёнными. Получив видения и пророчества о будущем, архитекторы Эйлунд предлагают тщательно продуманные фортификационные сооружения, способные выдержать любую осаду, с потайными ходами, лабиринтами, лазами для укрытий и убийств и магическими ловушками. Строительство таких сложных укреплений обойдётся недёшево."
 sidhe_house_dominance_eiluned_objective_decision_tooltip: "Дальновидность подсказывает построить тщательно продуманные укрепления"
 sidhe_house_dominance_eiluned_objective_decision_confirm: "Предупреждены и вооружены."
 eiluned_victory_modifier: "Укреплённые фригольды"

 sidhe_house_dominance_fiona_objective_decision: "Великие любовники"
 sidhe_house_dominance_fiona_objective_decision_desc: "Для Фиона гораздо лучше быть любимыми, чем вызывающими страх. Практически все Фиона - романтики; они с радостью предаются изысканной любви и строят сложные игры и ритуалы вокруг всех сердечных дел. Дворы Фиона - это места красоты и страсти, часто наполненные игривыми интригами, тайными свиданиями и запретной любовью. Фиона могут прославиться, обладая большим мастерством в любовных утехах, повышая свою и без того сверхъестественную привлекательность, а также имея разнообразных и сильных любовников, которые пригодятся в их будущих происках."
 sidhe_house_dominance_fiona_objective_decision_tooltip: "У вас должно быть шесть интересных любовников."
 sidhe_house_dominance_fiona_objective_decision_confirm: "Любовь - это нечто большее."
 sidhe_house_dominance_fiona_objective_decision_custom1: "Есть #V 3#! великие личности в качестве [Concept('lovers', 'любовников')|E]"
 sidhe_house_dominance_fiona_objective_decision_custom2: "Есть [Concept('lover', 'любовник')|E]-[Concept('landed', 'землевладелец')|E] со свойством «[GetTrait('sidhe').GetName( GetPlayer )]»"
 sidhe_house_dominance_fiona_objective_decision_custom3: "Есть [Concept('lover', 'любовник')|E] со свойством «[GetTrait('satyr').GetName( GetPlayer )]»"
 sidhe_house_dominance_fiona_objective_decision_custom4: "Есть [Concept('lover', 'любовник')|E] со свойством «[GetTrait('werewolf').GetName( GetPlayer )]»"
 fiona_victory_modifier: "Великие любовники"

 sidhe_house_dominance_gwydion_objective_decision: "Истинные короли"
 sidhe_house_dominance_gwydion_objective_decision_desc: "После Разъединения Туата де Данан покинули Землю и переселились в [UmbraGlossaryLocalized('arcadia','Аркадию')]. Дом Гвидион, давно привыкший к роли странствующих рыцарей, вместе с Разъединением осознал новую ответственность - возглавить всех фей. Теперь дому Гвидион было необходимо заявить о своих правах на земли и защитить эти владения от набегов заблудших и отчаявшихся. Гвидион фаб Дон, племянник венедского короля, #TOOLTIP:CHARACTER,[GetScriptedCharacterByHistoryID('POD_fae_character_84').GetID] #L Мата, сына Матонви#!#!, имеет четкую линию происхождения от Огмы и самой Дану. В легендах говорится, что лорд [GetScriptedCharacterByHistoryID('POD_fae_character_03').GetFirstName] присутствовал на коронации первого верховного короля, когда-либо правившего страной, и что он подарил новому лорду пару огромных серых грифонов. Он утверждает: «Если когда-нибудь сомнение овладеет сердцами ваших подданных, пусть они обратят свой взор на грифонов, которые станут вестниками истинного Верховного короля». Лорды Дома Гвидион обладают храбростью, амбициями и родословной, чтобы по праву привести всех Благих ши к обновлённому золотому веку. Кто ещё мог бы найти и овладеть молнией — Мечом света — клинком миротворца - #L [GetPODArtifact('caliburn_link').GetName]ом#!, как не истинные короли!"
 sidhe_house_dominance_gwydion_objective_decision_tooltip: "Вы должны доказать всему дому Гвидион, что они известны во всём мире благодаря долгому правлению во многих фригольдах, защите почитаемых мест, приобретению замечательных артефактов и созданию великих эпосов, рассказывающих о ваших подвигах, которые убедят всех фей в вашем легендарном великолепии. И, наконец, поиски меча истинных королей — Экскалибура — #L [GetPODArtifact('caliburn_link').GetName]а#! докажет ваше неоспоримое величие."
 sidhe_house_dominance_gwydion_objective_decision_confirm: "Приступим к коронации!"
 sidhe_house_dominance_gwydion_objective_decision_custom1: "Вы должны вернуть [GetPODArtifactName('caliburn_link')] из [Glossary('Великой пропасти','umbra_realm_great_chasm_desc')]"
 gwydion_victory_modifier: "Истинные короли"

 sidhe_house_dominance_liam_objective_decision: "Песня смертных"
 sidhe_house_dominance_liam_objective_decision_desc: "Воображение смертных загнано в рамки Церкви. Дом Лиам возглавляет фей в попытке понять мистическую власть, которую Церковь имеет над человечеством. Либо самая тираническая организация Церкви должна быть нейтрализована, либо Церкви нужно увести фей от банальности. Если дом Лиам добьётся успеха, они смогут направить развитие человечества в русло творчества."
 sidhe_house_dominance_liam_objective_decision_tooltip: "Интегрировать или нейтрализовать Церковь"
 sidhe_house_dominance_liam_objective_decision_confirm: "Здесь прямо стою перед Богом, уставши. Пред песенным богом." # With nothing, nothing on my tongue but Hallelujah
 sidhe_house_dominance_liam_objective_decision_custom1: "Вы завершили [Concept('decision', 'решение')|E] «$destroy_inquisition_objective_decision$»"
 sidhe_house_dominance_liam_objective_decision_custom2: "Ваша конфессия имеет доктрину «[GetFaithDoctrine('doctrine_fae_agenda_constantinian').GetBaseName]» и вы завершили [Concept('decision', 'решение')|E] «$constantinian_objective_decision$»"
 sidhe_house_dominance_liam_objective_decision_custom3: "На карте не должно быть [Concept('independent_ruler', 'независимых правителей')|E] со свойством «[GetTrait('supehunter').GetName( GetPlayer )]»"
 sidhe_house_dominance_liam_objective_decision_custom3_ex: "$sidhe_house_dominance_liam_objective_decision_custom3$ #weak ([example.GetFirstName])#!"
 liam_victory_modifier: "Песня смертных"

 sidhe_house_dominance_aesin_objective_decision: "Мидгардский оплот"
 sidhe_house_dominance_aesin_objective_decision_desc: "Последователи Пригвожденного Бога распространились по всем скандинавским землям, заставляя людей нарушать их соглашения с асами и ванами. Самозванцы-вампиры, называемые [GetFaithByKey('viaeinherjar').GetAdjective], удерживают старые храмы #L [GetTitleByKey('e_midgard').GetNameNoTier]а#!, включая Уппсалу, извращая наши древние обряды в свой банальный культ крови. [GetFaithByKey('getoffenris').GetAdjective] из владения [GetTitleByKey('k_fimbul_winter').GetNameNoTier] бродят по северным пустошам Швеции, и их необходимо обуздать. [GetTitleByKey('d_crystal_fortress').GetNameNoTier] находится в руках Летнего двора #TOOLTIP:GAME_TRAIT,changeling,[GetPlayer] #L подменышей#!#! из дома [GetDynastyByID( 'POD_fae_dynasty_gwydion' ).GetBaseName] и она по праву должна принадлежать нам. Мы возьмём в руки наше древнее и священное оружие и вернём нашу родину кровью."
 sidhe_house_dominance_aesin_objective_decision_tooltip: "Отвоевать весь Мидгард для асов"
 sidhe_house_dominance_aesin_objective_decision_confirm: "Лучше умереть с честью, чем жить в позоре."
 sidhe_house_dominance_aesin_objective_decision_custom1: "Есть два [Concept('powerful_vassals', 'могущественных вассала')|E], которые принадлежат к киту «[GetTrait('troll').GetName( GetPlayer )]»."
 sidhe_house_dominance_aesin_objective_decision_custom2: "Есть два [Concept('councillors', 'советника')|E], которые принадлежат к киту «[GetTrait('troll').GetName( GetPlayer )]»."
 sidhe_house_dominance_aesin_objective_decision_custom3: "Есть пять [Concept('courtiers', 'придворных')|E], которые принадлежат к киту «[GetTrait('troll').GetName( GetPlayer )]»."
 sidhe_house_dominance_aesin_objective_decision_custom4: "Есть два [Concept('knights', 'рыцаря')|E], которые принадлежат к киту «[GetTrait('troll').GetName( GetPlayer )]»."
 aesin_victory_modifier: "Захват Мидгарда"

 sidhe_house_dominance_ailil_objective_decision: "Окончание Войны времён года"
 sidhe_house_dominance_ailil_objective_decision_desc: "Дом Эйлиль процветает благодаря власти и отточил свои навыки в дипломатии и интригах. Благие феи предали законную смену престола между времени года и тем самым лишили Эйлиль их законного права править. Чтобы восстановить равновесие, Война времён года должна прекратиться. Если Эйлиль смогут положить конец Войне времён года, их превосходство среди всех домов ши станет неоспоримым."
 sidhe_house_dominance_ailil_objective_decision_tooltip: "Завершить Войну времён года или завладеть всей Ирландией и добиться признания"
 sidhe_house_dominance_ailil_objective_decision_confirm: "Для каждой вещи есть своё время года, и для каждой цели своё время"
 sidhe_house_dominance_ailil_objective_decision_custom1: "Борьба «Война времён года» подошла к концу"
 ailil_victory_modifier: "Завершение Войны времён года"

 sidhe_house_dominance_balor_objective_decision: "Наследие фоморов"
 sidhe_house_dominance_balor_objective_decision_desc: "Дом Балор ведёт свою родословную от линии ши, которые смешали свою кровь с кровью фоморов. Они верят, что Бесконечная зима уже почти наступила, и что нужна сильная рука, направляющая фей, чтобы пережить её. Благодаря своей связи с Вирмом, они стремятся к союзу между Неблагими, Танцорами Чёрной спирали и фоморами. Учитывая родственные связи между домом Балор и фоморами, возможно, с помощью мощного ритуала можно объединить фею с могущественным духом-бэйном, чтобы создать гибрид феи и фомора - фомарха."
 sidhe_house_dominance_balor_objective_decision_tooltip: "Слиться с духом-бэйном, чтобы стать гибридом феи и фомора"
 sidhe_house_dominance_balor_objective_decision_confirm: "Призвать нексусного ползуна."
 sidhe_house_dominance_balor_objective_decision_custom1: "Вы должны владеть [Concept('artifact', 'Кровавым дроссом')|E]"
 balor_victory_modifier: "Фомор"

 sidhe_house_dominance_daireann_objective_decision: "Воин-целитель"
 sidhe_house_dominance_daireann_objective_decision_desc: "Дом обрёл своё высокое положение благодаря тому, что [GetScriptedCharacterByHistoryID('POD_fae_character_21').GetFirstName] исцелил лорда Гвидиона, но истинное уважение они завоевали благодаря доблести своего воина #L [GetScriptedCharacterByHistoryID('POD_fae_character_88').GetFirstName]а#!. Дайреанн очень хорошо знают, что рука, способная исцелять, может также причинять вред. В чаше может быть как яд, так и противоядие. Клинок можно использовать для исцеления, а можно и для того, чтобы оборвать нить жизни."
 sidhe_house_dominance_daireann_objective_decision_tooltip: "Развить способности как в военном деле, так и в врачевательстве"
 sidhe_house_dominance_daireann_objective_decision_confirm: "Всему своё время."
 daireann_victory_modifier: "Воин-целитель"

 sidhe_house_dominance_varich_objective_decision: "Духи Руси"
 sidhe_house_dominance_varich_objective_decision_desc: "Неодушевлённые, духи земли и неба, всегда были слугами [GetScriptedCharacterByHistoryID('POD_fae_character_19').GetFirstName]; их детьми. Когда-то земля Руси кишела Неодушевлёнными. Для фей эти духи были частью всего: земли, рек, их владений и бескрайней тайги, окружающей их. Варич знают, как угодить этим духам, а также как их использовать. Духи домашнего очага настолько могущественны и услужливы, насколько им позволяют размеры и великолепие их якорей, а также степень оказываемого им уважения. Ни одно владение Варичей не обходится без них, и ни один член дома Варич сознательно не оскорбит этих полезных духов. Укрепите ряды дома Варич, взяв в вассалы как можно больше Неодушевлённых."
 sidhe_house_dominance_varich_objective_decision_tooltip: "Возглавить русскую культуру и получить много неодушевлённых сосудов"
 sidhe_house_dominance_varich_objective_decision_confirm: "Нет плохой земли, есть плохие хозяева."
 sidhe_house_dominance_varich_objective_decision_custom1: "Есть пять [Concept('powerful_vassals', 'могущественных вассалов')|E], которые имеют свойство Неодушевлённых «[GetTraitGroup('phyla').GetName()]» и принадлежат к русской [Concept('culture', 'культуре')|E]."
 sidhe_house_dominance_varich_objective_decision_custom2: "Вы являетесь [Concept('cultural_head', 'культурным идеологом')|E]."
 varich_victory_modifier: "Духи Руси"

 sidhe_house_dominance_scathach_objective_decision: "Эдикты морфейских оракулов"
 sidhe_house_dominance_scathach_objective_decision_desc: "Начиная со #TOOLTIP:CHARACTER,[GetScriptedCharacterByHistoryID('POD_fae_character_17').GetID] #L Скатаха#!#!, одержав победу над Октриаллахом, Белым королём фоморов, в Войне деревьев, морфейские оракулы стали определяющей силой в доме Скатах. Хотя эдикты морфейских оракулов не всегда имеют смысл для членов дома, дом единодушно следует им. Однако оракулы предвидели бедствие, если Меч Тетры попадёт в сердце [UmbraGlossaryLocalized('dreaming','Грёз')], и Скатах напал на Гвидиона, пытаясь сдвинуть его с места. Во время последовавшего кровопролития клинок исчез в окружающих Грёзах. Политические последствия битвы привели к тому, что Скатах стали домом изгнанников, и Благие стали избегать их. Тем не менее, члены дома следуют эдиктам оракулов. Несмотря на это единство, дом разделён между подменышами, которые остаются позади, поскольку большинство ши бегут в [UmbraGlossaryLocalized('arcadia','Аркадию')], и [GetScriptedCharacterByHistoryID('POD_fae_character_87').GetFirstName], и её последователями-первородными феями, ищущими [UmbraGlossaryLocalized('sea_of_silver','Море серебра')] в [UmbraGlossaryLocalized('deep_dreaming','Глубоких Грёзах')] для того, чтобы сохранить Осенний мир и победить фоморов."
 sidhe_house_dominance_scathach_objective_decision_tooltip: ""
 sidhe_house_dominance_scathach_objective_decision_confirm: "Сохранить пути."
 sidhe_house_dominance_scathach_objective_decision_custom1: "[Glossary('Раскол','game_concept_shattering_desc')] предотвращён"
 scathach_victory_modifier: "Эдикты морфейских оракулов"

 sidhe_house_dominance_danaan_objective_decision: "На страже Грёз"
 sidhe_house_dominance_danaan_objective_decision_desc: "Дом Данаан бродит по многочисленным тропам в [UmbraGlossaryLocalized('dreaming','Грёзах')]. Они охраняют троды и прокладывают новые тропы. Они направляют мечтателей и благодаря своей Клятве дракона завоевывают расположение многих химер. Лидер дома, который много путешествовал по [UmbraGlossaryLocalized('dreaming','Грёзам')], может собрать внушительную орду химер, чтобы в нужный момент обрушиться на Осенний мир."
 sidhe_house_dominance_danaan_objective_decision_tooltip: "Путешествовать по миру и [UmbraGlossaryLocalized('dreaming','Грёзам')] и узнать его секреты, чтобы создать армию химер."
 sidhe_house_dominance_danaan_objective_decision_confirm: "Две дороги расходились в тумане, и я выберу ту, по которой меньше ходили."
 sidhe_house_dominance_danaan_objective_decision_custom1: "У вас есть свойство «[GetTrait('eshu').GetName( GetPlayer )]», «[GetTrait('lifestyle_traveler').GetName( GetPlayer )]», «[GetTrait('pilgrim').GetName( GetPlayer )]» или «[GetTrait('adventurer').GetName( GetPlayer )]»."
 sidhe_house_dominance_danaan_objective_decision_custom2: "Есть скакун: [GetPODArtifactName('ship_of_the_four_quarters_link')], [GetPODArtifactName('nightmare_horse_link')], [GetPODArtifactName('sorn_link')], [GetPODArtifactName('vozhd_palanquin_link')], [GetPODArtifactName('sorel_link')], лошадь, волк, медведь, лев или тигр"
 danaan_victory_modifier: "Поиски стражей Грёз"

 sidhe_house_dominance_leanhaun_objective_decision: "Проклятие Лианнан"
 sidhe_house_dominance_leanhaun_objective_decision_desc: "Тайное проклятие, наложенное на [GetScriptedCharacterByHistoryID('POD_fae_character_15').GetFirstName], распространяется на весь её дом и заставляет его членов быстро стареть без рапсодизации смертных. Предсказано, что это не закончится, «пока звёзды не прольют кровавые слёзы и сама земля не похолодеет под ногами», что, похоже, вряд ли произойдёт в ближайшее время. Обычно Лианнан очаровывают и рапсодизируют одну смертную жертву за раз. Предполагается, что если культивировать достаточное количество мечтателей и наваждение этих мечтателей будет очень сильным, то воздействие проклятия может быть ослаблено, если не устранено вовсе."
 sidhe_house_dominance_leanhaun_objective_decision_tooltip: "Ослабить проклятие, использовав мечтателей"
 sidhe_house_dominance_leanhaun_objective_decision_confirm: "Наши муки могут стать нашей стихией."
 sidhe_house_dominance_leanhaun_objective_decision_custom1: "У вас должно быть хотя бы #bold 4#! положительных #weak ([Concept('friends', 'друзья')|E] или [Concept('soulmates', 'родственные души')|E])#! [Concept('relations', 'отношений')|E] с [Concept('epiphanies_quality', 'качеством')|E] выше #bold 0#! #weak ([SCOPE.GetValue('sidhe_house_dominance_leanhaun_objective_decision_custom1_val')])#!"
 sidhe_house_dominance_leanhaun_objective_decision_custom2: "У вас должно быть хотя бы #bold 1#! положительное #weak ([Concept('friends', 'друзья')|E] или [Concept('soulmates', 'родственные души')|E])#! [Concept('relation', 'отношение')|E] с великой личностью #weak ([SCOPE.GetValue('sidhe_house_dominance_leanhaun_objective_decision_custom2_val')])#!"
 leanhaun_victory_modifier: "Ослабленное проклятие Лианнан"

 sidhe_inert_cold_iron_objective_decision: "Инертное холодное железо"
 sidhe_inert_cold_iron_objective_decision_tooltip: "Вы измените научную «реальность», ища способ трансмутировать или иным образом изменить свойства холодного железа, чтобы сделать его инертным."
 sidhe_inert_cold_iron_objective_decision_desc: "Феи пытаются понять, почему холодное железо вредит им. Оно может привести к необратимому разрушению духа фей. [GetScriptedCharacterByHistoryID('POD_fae_character_04').GetFirstName] отдал свою жизнь, чтобы попытаться разорвать хватку холодного железа над феями. Многие считают, что железо олицетворяет собой силу Разъединения; философское разделение между человечеством и воплощёнными [UmbraGlossaryLocalized('dreaming','Грёзами')]. Он был сформирован не какой-то «вещью», а как «естественный» эффект, когда банальность достигла критического уровня. Феи должны изучить холодное железо и каким-то образом сделать его инертным."
 sidhe_inert_cold_iron_objective_decision_confirm: "Трансмутировать парадигму!"
 sidhe_inert_cold_iron_objective_decision_custom1: "Вы должны принадлежать к дому [GetDynastyByID( 'POD_fae_dynasty_dougal' ).GetBaseName]."
 sidhe_inert_cold_iron_objective_decision_custom2: "Вы [Concept('completely_control', 'полностью контролируете')|E] Кузню Дугала в Страчкруахе ([GetTitleByKey('c_lennox').GetNameNoTier]), а также окружающее герцогство [GetTitleByKey('d_galloway').GetNameNoTier]"
 sidhe_inert_cold_iron_objective_decision_custom3: "Вы [Concept('completely_control', 'полностью контролируете')|E] Кузню Доблести ([GetTitleByKey('c_warwickshire').GetNameNoTier]), а также герцогства [GetTitleByKey('d_valiant_forge').GetNameNoTier] и [GetTitleByKey('d_hereford').GetNameNoTier]"
 sidhe_inert_cold_iron_objective_decision_custom4: "Вы [Concept('completely_control', 'полностью контролируете')|E] Затерянную кузню Вулкана ([GetTitleByKey('c_messina').GetNameNoTier]), а также герцогство [GetTitleByKey('d_sicily').GetNameNoTier]"
 sidhe_inert_cold_iron_objective_decision_custom5: "Вы потратили 10000 золотых или [Concept('completely_control', 'полностью контролируете')|E] хотя бы одну из этих золотых шахт: [GetTitleByKey('b_turoc').GetNameNoTier], [GetTitleByKey('b_abrudbanya').GetNameNoTier], [GetTitleByKey('c_chalkidike').GetNameNoTier], [GetTitleByKey('c_allaqi').GetNameNoTier], [GetTitleByKey('b_wasulu').GetNameNoTier], [GetTitleByKey('b_diakha').GetNameNoTier], [GetTitleByKey('b_goundafa').GetNameNoTier]"
 sidhe_inert_cold_iron_objective_decision_effect1: "Холодное железо станет инертным и больше не будет угрожать духам фей. Все Первородные феи больше не будут подходящими целями для происков убийств."
 sidhe_inert_cold_iron_objective_decision_effect2: "#X Это [Concept('decision', 'решение')|E] и #V $destroy_order_of_reason_objective_decision$#! являются взаимоисключающими!#!"