 recognition_from_the_dreaming_path_of_martial_number_of_wild_hunt: "У вас должно быть нанято не менее #V 500#! профессионалов типа «[GetMaA('sidhe_wild_hunt').GetName]» #weak ([SCOPE.GetValue('number_of_wild_hunt')|0])#!."
 recognition_from_the_dreaming_path_of_martial_number_of_troll_berserker: "У вас должно быть нанято не менее #V 1250#! профессионалов типа «[GetMaA('troll_berserkers').GetName]» #weak ([SCOPE.GetValue('number_of_troll_berserker')|0])#!."

