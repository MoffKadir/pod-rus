l_russian:
 recognition_from_the_dreaming_objective_decision: "Оставить свой след в Грёзах"
 recognition_from_the_dreaming_objective_decision_desc: "Мы проявили себя выдающимися среди простолюдинов, но нам всё ещё не хватает уважаемого положения дворян. Если бы я [Select_CString(ROOT.Char.IsFemale, 'достигла', 'достиг' )] поистине легендарного величия, мои подвиги поднимут престиж всего моего дома. Наша история станет неотъемлемой частью анналов [UmbraGlossaryLocalized('arcadia','Аркадии')], мифом среди мифов."
 recognition_from_the_dreaming_objective_decision_tooltip: "Пришло время занять место среди дворян"
 recognition_from_the_dreaming_objective_decision_confirm: "От второстепенных персонажей до главных героев"
 recognition_from_the_dreaming_objective_decision_effect1: "Грёзы признают ваш [Concept('house', 'дом')|E] благородным, даруя [Concept('dynasty_perk', 'наследие')|E] в зависимости от выбранного пути."

