 destroy_inquisition_objective_decision: "Уничтожить Теневую инквизицию"
 destroy_inquisition_objective_decision_desc: "Церковь и её грозная инквизиция преследуют язычников и фей. Она обращает в веру мечом, пытает или сжигает до смерти последователей Старых богов и практиков мистических искусств. Её священники проводят ритуальное крещение детей подменышей, чтобы навсегда лишить их зачарованной природы и погасить искру гламура. Чтобы феи остались на Земле, настало время положить этому конец."
 destroy_inquisition_objective_decision_tooltip: "Вы уничтожите Теневую инквизицию."
 destroy_inquisition_objective_decision_confirm: "Положить конец Пылающим временам"
 destroy_inquisition_objective_decision_custom: "На карте не должно быть [Concept('independent_ruler', 'независимых правителей')|E], исповедующих #L [GetFaithByKey('shadowinquisition').GetName|l]ую#! [Concept('faith', 'конфессию')|E]"
 destroy_inquisition_objective_decision_custom_ex: "$destroy_inquisition_objective_decision_custom$ #weak ([example.GetFirstName])#!"  
 destroy_inquisition_objective_decision_custom1: "[GetTitleByKey('c_roma').GetNameNoTier] принадлежит #TOOLTIP:GAME_TRAIT,fae,[GetNullCharacter] #L фее#!#! или #TOOLTIP:GAME_TRAIT,changeling,[GetNullCharacter] #L подменышу#!#! с конфессией без доктрин «[GetFaithDoctrine('doctrine_fae_agenda_constantinian').GetBaseName]» или «[GetFaithDoctrine('special_doctrine_ecumenical_hunters').GetBaseName]»"
 destroy_inquisition_objective_decision_custom2: "В графстве [GetTitleByKey('c_roma').GetNameNoTier] должна быть постройка «[GetBuilding('grand_city_04').GetName]»"
 destroy_inquisition_objective_decision_effect1: "Событие Века инквизиции не произойдёт в будущем"

 constantinian_objective_decision: "Интегрироваться с церковью"
 constantinian_objective_decision_desc: "Вместо того чтобы рассматривать Церковь как врага, которому нужно противостоять и остановить, константинианцы считают ее тайной, которую нужно раскрыть, изучить и направить. Когда сила верований смертных будет понята, возможно, даже Туманы вернутся к своему более благосклонному равновесию, а феи смогут пожинать гламур творчества верующих."
 constantinian_objective_decision_tooltip: "Церковь станет воспринимать фей как святых служителей божественного: ангелов, пророков, чудотворцев и истинно благословенных."
 constantinian_objective_decision_confirm: "Учредить константинианский катехизис."
 constantinian_objective_decision_custom_artifact: "У вас должна быть одна из святых [Concept('artifacts', 'реликвий')|E] христианства: Святой Грааль, Фрагмент Истинного креста, Лампа Константина, Флагрум страстей, Копьё Судьбы, Валенсийская чаша или Труба Гавриила."
 constantinian_objective_decision_custom1: "[GetTitleByKey('c_byzantion').GetNameNoTier] принадлежит #TOOLTIP:GAME_TRAIT,fae,[GetNullCharacter] #L фее#!#!/#TOOLTIP:GAME_TRAIT,changeling,[GetNullCharacter] #L подменышу#!#! с доктриной «[GetFaithDoctrine('doctrine_fae_agenda_constantinian').GetBaseName]» или #L [GetFaithByKey('shadowinquisition').GetName|l]ому#! #TOOLTIP:GAME_TRAIT,supehunter,[GetNullCharacter] #L охотнику#!#!"
 constantinian_objective_decision_custom2: "[GetTitleByKey('c_roma').GetNameNoTier] принадлежит #TOOLTIP:GAME_TRAIT,fae,[GetNullCharacter] #L фее#!#!/#TOOLTIP:GAME_TRAIT,changeling,[GetNullCharacter] #L подменышу#!#! с доктриной «[GetFaithDoctrine('doctrine_fae_agenda_constantinian').GetBaseName]» или #L [GetFaithByKey('shadowinquisition').GetName|l]ому#! #TOOLTIP:GAME_TRAIT,supehunter,[GetNullCharacter] #L охотнику#!#!"
 constantinian_objective_decision_custom3: "[GetTitleByKey('c_jerusalem').GetNameNoTier] принадлежит #TOOLTIP:GAME_TRAIT,fae,[GetNullCharacter] #L фее#!#!/#TOOLTIP:GAME_TRAIT,changeling,[GetNullCharacter] #L подменышу#!#! с доктриной «[GetFaithDoctrine('doctrine_fae_agenda_constantinian').GetBaseName]» или #L [GetFaithByKey('shadowinquisition').GetName|l]ому#! #TOOLTIP:GAME_TRAIT,supehunter,[GetNullCharacter] #L охотнику#!#!"
 constantinian_objective_decision_effect1: "Все [Concept('faiths', 'конфессии')|E] западных #TOOLTIP:GAME_TRAIT,supehunter,[GetNullCharacter] #L охотников#!#! #weak ([GetFaithByKey('shadowinquisition').GetAdjective], [GetFaithByKey('akritai').GetAdjective], [GetFaithByKey('independenthunters').GetAdjective] и прочие)#! получат доктрину [GetFaithDoctrine('special_doctrine_constantinian_catechism').GetBaseName] и примут #TOOLTIP:GAME_TRAIT,fae,[GetNullCharacter] #L фей#!#! как ангелов"
 constantinian_objective_decision_effect2: "Доступны [men_at_arms|El] - [GetMaA('witchhunters').GetName]"
 constantinian_objective_decision_effect3: "Охотники с доктриной «[GetFaithDoctrine('special_doctrine_constantinian_catechism').GetBaseName]» всегда примут ваше предложение о вассализации"
 constantinian_objective_decision_effect4: "#TOOLTIP:GAME_TRAIT,fae,[GetNullCharacter] #L Феи#!#! больше не будут получать [GetTrait('banality').GetName(GetNullCharacter)|l] от [Concept('counties', 'графств')|E] под #L [GetFaithByKey('shadowinquisition').GetName|l]им#! правлением"
 
 prevent_black_death_objective_decision_before_last_date: "Эта цель должна быть выполнена до #V 1347#! года"

 prevent_black_death_rat_objective_decision: "Козни раткинов"
 prevent_black_death_rat_objective_decision_desc: "Многие феи видят пророческие сны о катаклизме в будущем, который убьет миллионы мечтателей. Подробности неясны, но, похоже, речь идет о полчищах крыс, появляющихся с восходом солнца, грудах горящих трупов, танцующих скелетах, почерневших пальцах рук и ног. Некоторые феи убеждены, что раткины и их заражённые вирмские прихвостни должны быть уничтожены."
 prevent_black_death_rat_objective_decision_tooltip: "Вы попытаетесь помешать исполнению Пророчества крысы."
 prevent_black_death_rat_objective_decision_confirm: "Предотвратить Чёрную смерть"
 prevent_black_death_rat_objective_decision_custom1: "У вас должен быть нанят [GetCourtPositionType('court_physician_court_position').GetName()] с отличной [Concept('aptitude', 'пригодностью')|E]"
 prevent_black_death_rat_objective_decision_custom2: "На карте не должно быть [Concept('independent_ruler', 'независимых правителей')|E], исповедующих #L [GetReligionFamily('rf_wyrm').GetName|l]ую#! [Concept('religion', 'религию')|E]"
 prevent_black_death_rat_objective_decision_custom2_ex: "$prevent_black_death_rat_objective_decision_custom2$ #weak ([example.GetFirstName])#!"

 prevent_black_death_cat_objective_decision: "Кошечки!"
 prevent_black_death_cat_objective_decision_desc: "Очевидно, чтобы предотвратить Пророчество крысы, нужно заставить всех любить кошек!"
 prevent_black_death_cat_objective_decision_tooltip: "Вы предотвратите Пророчество крысы, заставив всех обожать кошек."
 prevent_black_death_cat_objective_decision_confirm: "Мяу!"
 prevent_black_death_cat_objective_decision_custom1: "Все короли и императоры должны иметь модификатор «[GetModifier('cat_story_modifier').GetNameWithTooltip]»"
 prevent_black_death_cat_objective_decision_custom1_ex: "$prevent_black_death_cat_objective_decision_custom1$ #weak ([example.GetFirstName])#!"
 prevent_black_death_cat_objective_decision_custom2: "Доступны [men_at_arms|El] - [GetMaA('cats').GetName]"

 destroy_order_of_reason_objective_decision: "За гранью разумного"
 destroy_order_of_reason_objective_decision_desc: "Ученые люди стремятся связать мир Разумом и Наукой. Их мирские усилия по каталогизации, определению и ограничению мира грозят положить конец вере в таинственное и неконтролируемое. Они прослеживают лей-линии, чтобы найти очаги гламура, которые они называют узлами, которые они затем выкачивают и уничтожают. Эти «разумные люди» уничтожили всех ведьм и фей, которых смогли найти в руинах Мистриджа и его окрестностей. Их нужно остановить любой ценой!"
 destroy_order_of_reason_objective_decision_tooltip: "Вы не позволите ордену Разума принести в мир ещё больше банальности."
 destroy_order_of_reason_objective_decision_confirm: "Больше никакого застоя"
 destroy_order_of_reason_objective_decision_mutually_exclusive: "#X Эта цель и «$POD_qareen_objective_decision$» являются взаимоисключающими#!."
 destroy_order_of_reason_objective_decision_effect1: "#TOOLTIP:GAME_TRAIT,fae,[GetNullCharacter] #L Феи#!#! больше не будут получать [GetTrait('banality').GetName(GetNullCharacter)|l] от [Concept('era', 'эпохи')|E]"

 arcadian_restoration_objective_decision: "Восстановление Аркадии"
 arcadian_restoration_objective_decision_desc: "Даже в [Glossary('Мифическую эпоху','game_concept_mythic_age_desc')] Осенний мир не был так близок к [UmbraGlossaryLocalized('dreaming','Грёзам')]. Но эта эпоха неизбежно закончится, наши мечты обречены на угасание, и банальность снова начнёт своё неумолимое наступление на реальность.\n\nИ я говорю: нет! Мы не повторим ошибок наших предков! Мы не будем безучастно смотреть, как наши надежды и радость обращаются в ничто, задушенные миром, который ненавидит то, чего не может объяснить. Мы принесём сами Грёзы в Осенний мир, и мифы сольются с реальностью."
 arcadian_restoration_objective_decision_tooltip: "Вы вернёте [Glossary('Мифическую эпоху','game_concept_mythic_age_desc')]." 
 arcadian_restoration_objective_decision_confirm: "Мечты навсегда"
 arcadian_restoration_objective_decision_custom1: "Вы выполнили [Concept('decision', 'цель')|E] «[GetDecision('destroy_inquisition_objective_decision').GetName]»"
 arcadian_restoration_objective_decision_custom2: "Вы выполнили [Concept('decision', 'цель')|E] «[GetDecision('constantinian_objective_decision').GetName]»"
 arcadian_restoration_objective_decision_custom3: "Вы выполнили одну из следующих [Concept('decision', 'целей')|E]: «[GetDecision('destroy_order_of_reason_objective_decision').GetName]», «[GetDecision('sidhe_inert_cold_iron_objective_decision').GetName]» или «[GetDecision('POD_qareen_objective_decision').GetName]»"
 arcadian_restoration_objective_decision_custom4: "Вы выполнили [Concept('decision', 'цель')|E] «[GetDecision('prevent_black_death_rat_objective_decision').GetName]»"
 arcadian_restoration_objective_decision_custom5: "Вы выполнили [Concept('decision', 'цель')|E] «[GetDecision('prevent_black_death_cat_objective_decision').GetName]»"
 arcadian_restoration_objective_decision_custom6: "Вы выполнили [Concept('decision', 'цель')|E] «[GetDecision('POD_war_of_seasons_war_victory_objective').GetName]»"
 arcadian_restoration_objective_decision_custom7: "Вы выполнили [Concept('decision', 'цель')|E] «[GetDecision('POD_war_of_seasons_peace_victory_objective').GetName]»"

 become_santa_objective_decision: "Стать Сантой"
 become_santa_objective_decision_desc: "У вас есть один безумный план, как избежать потери бессмертия, которая наступит вместе с Расколом. Регулярно раздавая химерические игрушки бесчисленному количеству детей на каждый Йоль, вы будете жить вечно, потому что они будут верить в вас. Они будут писать вам письма с просьбой о помощи. Они будут чтить старые обычаи и оставят подношения, чтобы утолить ваш безграничный голод."
 become_santa_objective_decision_shattering: "Вы должны стать Сантой до [Glossary('Раскола','game_concept_shattering_desc')] или после завершения его худшего периода. #weak У вас не должно быть ни одного из этих [Concept('modifiers', 'модификаторов')|E]: «[GetModifier('POD_shattering_1_modifier').GetNameWithTooltip]», «[GetModifier('POD_shattering_2_modifier').GetNameWithTooltip]», «[GetModifier('POD_shattering_3_modifier').GetNameWithTooltip]» или «[GetModifier('POD_shattering_4_modifier').GetNameWithTooltip]»#!."
 become_santa_objective_decision_winter_capital: "В вашей столице должна быть зима"
 become_santa_objective_decision_court_antiquarian_excellent: "У вас должен быть нанят [GetCourtPositionType('antiquarian_court_position').GetName()] со свойством «[GetTrait('boggan').GetName( GetPlayer )]» или «[GetTrait('nocker').GetName( GetPlayer )]» с отличной [Concept('aptitude', 'пригодностью')|E]"
 become_santa_objective_decision_tooltip: "Вы обретёте бессмертие, раздавая химерические игрушки бесчисленному количеству детей на каждый Йоль"
 become_santa_objective_decision_deer_pooka: "У вас должен быть один придворный со свойством «[GetTrait('pooka').GetName( GetPlayer )]» с модификатором [GetModifier('POD_pooka_deer_affinity_modifier').GetNameWithTooltip]. Санте нужен северный олень!"
 become_santa_objective_decision_elves: "У вас должны быть три придворных со свойством «[GetTrait('nocker').GetName( GetPlayer )]» и три придворных со свойством «[GetTrait('boggan').GetName( GetPlayer )]». Мастерской Санты нужны «эльфы»."
 become_santa_objective_decision_confirm: "Я стану Сантой, [Select_CString(ROOT.Char.IsFemale, 'приносящей', 'приносящим' )] подарки."
 become_santa_objective_decision_louhi: "Злая [GetScriptedCharacterByHistoryID('790633').GetFirstName] может попытаться помешать вашему вознесению, она должна быть мертва или находиться в [Glossary('торпоре','game_concept_torpor_desc')]"
 become_santa: "Вы становитесь Сантой!"

