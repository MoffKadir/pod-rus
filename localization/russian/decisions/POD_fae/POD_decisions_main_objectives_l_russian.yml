 the_peace_of_making_objective_decision_effect2: "Как только вы станете землевладельцем, вам станет доступно [Concept('decision', 'решение')|E], которое позволит создать титул [GetTitleByKey('e_gladeling_empire').GetName]."
 the_peace_of_making_objective_decision_effect3: "Пока [GetTitleByKey('e_gladeling_empire').GetName] принадлежит вам, все неодушевлённые примут ваши предложения о вассализации"
