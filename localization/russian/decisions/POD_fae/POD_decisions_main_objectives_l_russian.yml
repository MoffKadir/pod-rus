 elemental_ascension_objective_decision: "Вознесение стихии"
 elemental_ascension_objective_decision_desc: "#TOOLTIP:GAME_TRAIT,fae,GetPlayer #L Феи#!#! практически являются духами природы, но не совсем. Среди фей они наиболее близки к чистым стихиям, но некоторые #TOOLTIP:GAME_TRAIT,fae,GetPlayer #L феи#!#! считают это «несовершенство» в слиянии со стихией недостатком, который нужно исправить.\n\nПо-настоящему думая и действуя как стихия, #TOOLTIP:GAME_TRAIT,fae,GetPlayer #L фея#!#! может стать совершенной!"
 elemental_ascension_objective_decision_tooltip: "Единение со стихией"
 elemental_ascension_objective_decision_confirm: "$elemental_ascension_objective_decision$"
 elemental_ascension_objective_decision_custom1: "Вы или ваши [Concept('vassals', 'вассалы')|E] должны контролировать хотя бы #V 5#! [Concept('holy_sites', 'священных мест')|E] вашей [Concept('faith', 'конфессии')|E] #weak ([GetPlayer.MakeScope.ScriptValue('POD_num_of_controlled_holy_sites')])#!"
 elemental_ascension_objective_decision_custom2: "Владельцы хотя бы #V 5#! [Concept('holy_sites', 'священных мест')|E] вашей [Concept('faith', 'конфессии')|E] должны иметь о вас положительное [Concept('opinion', 'мнение')|E]"
 elemental_ascension_objective_decision_custom2_ex: "$elemental_ascension_objective_decision_custom2$ #weak ([example.GetFirstName])#!"
 elemental_ascension_objective_decision_custom3: "Вы должны были посетить как минимум #V 5#! [Concept('holy_sites', 'священных мест')|E] в ходе #TOOLTIP:ACTIVITY_TYPE,activity_pilgrimage паломничества#! #weak ([GetPlayer.MakeScope.ScriptValue('POD_num_of_visited_holy_sited')])#!"

 the_peace_of_making_objective_decision: "Мир творения"
 the_peace_of_making_objective_decision_desc: "Создания ремесла ошибаются. Чтобы отсрочить Долгую зиму, мы должны не отказываться от природы ради человечества, а оттеснить человечество и заставить его вернуться к природе! Первый шаг — очистить #TOOLTIP:GAME_TRAIT,fae,GetPlayer #L фей#!#! от созданий ремесла и наконец объединиться под единым знаменем стихий!"
 the_peace_of_making_objective_decision_tooltip: "Природа объединилась против человечества"
 the_peace_of_making_objective_decision_confirm: "Конец войне"
 the_peace_of_making_objective_decision_custom1: "Не должно быть никаких независимых [Concept('landed', 'землевладельцев')|E] со свойством «[GetTrait('mannikin').GetName(GetPlayer)]»"
 the_peace_of_making_objective_decision_custom1_ex: "$the_peace_of_making_objective_decision_custom1$ #weak ([example.GetFirstName])#!"
 the_peace_of_making_objective_decision_custom2: "У вас должны быть любые положительные [Concept('relation', 'отношения')|E] с независимым персонажем со свойством «[GetTrait('glome').GetName(GetPlayer)]»"
 the_peace_of_making_objective_decision_custom3: "У вас должны быть любые положительные [Concept('relation', 'отношения')|E] с независимым персонажем со свойством «[GetTrait('kubera').GetName(GetPlayer)]»"
 the_peace_of_making_objective_decision_custom4: "У вас должны быть любые положительные [Concept('relation', 'отношения')|E] с независимым персонажем со свойством «[GetTrait('ondine').GetName(GetPlayer)]»"
