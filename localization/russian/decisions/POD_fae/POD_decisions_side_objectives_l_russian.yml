l_russian:
 underbridge_kingdom_objective_decision: "[Select_CString(ROOT.Char.IsFemale, 'Королева', 'Король' )] Подземного моста"
 underbridge_kingdom_objective_decision_desc: "Захватывая всё новые и новые мосты, вы превратите владения Подземного моста в могущественное королевство. Вы получите свою долю. Горе бедному путнику, который не сможет заплатить за проезд."
 underbridge_kingdom_objective_decision_tooltip: "Вы станете [Select_CString(ROOT.Char.IsFemale, 'королевой', 'королём' )] Подземного моста."
 underbridge_kingdom_objective_decision_confirm: "Никто не пройдёт без моего дозволения."
 underbridge_kingdom_objective_decision_custom: "Вы сможете использовать [Concept('casus_belli', 'казус белли')|E] «Война за мост»"
 underbridge_kingdom_objective_decision_custom2: "$unlocks_sailable_major_rivers$"
 underbridge_kingdom_objective_decision_custom3: "$culture_parameter_culture_can_raid_at_sea_even_if_feudal_no_restrictions$"
 underbridge_kingdom_objective_decision_riverside_county_contol_tt: "Вы [Concept('completely_control', 'полностью контролируете')|E] все речные [Concept('counties', 'графства')|E] региона [GetTitleByKey('k_novgorod').GetNameNoTier] ([SCOPE.ScriptValue('underbridge_kingdom_controlled_riverside_county_value')|0]/[SCOPE.ScriptValue('underbridge_kingdom_total_riverside_county_value')|0])"
 underbridge_king_modifier: "Король Подземного моста"

 underbridge_empire_objective_decision: "[Select_CString(ROOT.Char.IsFemale, 'Верховная королева', 'Верховный король' )] Подземного моста"
 underbridge_empire_objective_decision_desc: "Когда реки Восточной Европы перейдут под ваш контроль, пугающее пространство под множеством мостов станет вашим великим владением. Никто не сможет перебраться через ревущие воды без вашего согласия. Все будут платить вам дань, в то время как вы сможете легко перемещать в этот мир порождения чистого кошмара так же легко, как совершать приятную прогулку."
 underbridge_empire_objective_decision_tooltip: "Вы станете [Select_CString(ROOT.Char.IsFemale, 'верховной королевой', 'верховным королём' )] Подземного моста."
 underbridge_empire_objective_decision_confirm: "Никто не пройдёт без моего дозволения."
 underbridge_empire_objective_decision_custom: "Все приречные графства, захваченные с помощью [Concept('casus_belli', 'казус белли')|E] «Война за мост» станут [Concept('de_jure', 'де-юре')|E] [Concept('counties', 'графствами')|E] державы [GetTitleByKey('e_underbridge').GetNameNoTier]"
 underbridge_empire_objective_decision_riverside_county_contol_tt: "Вы [Concept('completely_control', 'полностью контролируете')|E] все приречные [Concept('counties', 'графства')|E] державы [GetTitleByKey('e_shadow_curtain').GetNameNoTier] ([SCOPE.ScriptValue('underbridge_empire_controlled_riverside_county_value')|0]/[SCOPE.ScriptValue('underbridge_empire_total_riverside_county_value')|0])"
 underbridge_empire_objective_decision_artifact_cauldron_of_fear: "[GetPODArtifactName('cauldron_of_fear_link')] принадлежит вам"
 underbridge_emperor_modifier: "Верховный король Подземного моста"

 rhineland_duchy_objective_decision: "Вернуть Борбетомаг"
 rhineland_duchy_objective_decision_desc: "Легенды о Зигфриде, Гюнтере и нибелунгах до сих пор звучат в каждом немецком доме. Даже нынешних смертных архиепископов Майнца зовут Зигфрид. Родовое поместье Гибихунгов, столица старой Бургундии, должно вновь вернуться под контроль фей. Захват контроля над Вормсом - это следующий шаг в возвращении Рейна феям."
 rhineland_duchy_objective_decision_tooltip: "Захватить древнюю столицу старой Бургундии"
 rhineland_duchy_objective_decision_confirm: "Вернуть Борбетомаг."
 rhineland_duchy_objective_rhineland_dejure: "[GetTitleByKey('d_rhineland').GetName] становится [Concept('de_jure', 'де-юре')|E] сюзереном графств [GetTitleByKey('c_worms').GetNameNoTier], [GetTitleByKey('c_speyer').GetNameNoTier] и [GetTitleByKey('c_kaiserslautern').GetNameNoTier]"
 rhineland_duchy_objective_rhineland_county_claims: "Будет получена [Concept('unpressed_claims', 'слабая претензия')|E] на Оберрейн ([GetTitleByKey('d_alsace').GetName] и [Concept('counties', 'графства')|E] [GetTitleByKey('c_breisgau').GetNameNoTier], [GetTitleByKey('c_sundgau').GetNameNoTier], [GetTitleByKey('c_colmar').GetNameNoTier], [GetTitleByKey('c_strassburg').GetNameNoTier], [GetTitleByKey('c_baden').GetNameNoTier], [GetTitleByKey('c_erbach').GetNameNoTier], [GetTitleByKey('c_frankfurt').GetNameNoTier] и [GetTitleByKey('c_mainz').GetNameNoTier]) и часть Миттельрейна ([GetTitleByKey('c_koblenz').GetNameNoTier] и [GetTitleByKey('c_sayn').GetNameNoTier])."

 rhineland_kingdom_objective_decision: "Королевство Рейнланд"
 rhineland_kingdom_objective_decision_tooltip: "Расширить [GetTitleByKey('d_rhineland').GetName] в соответствующее [Concept('kingdom', 'королевство')|E] вдоль реки Рейн."
 rhineland_kingdom_objective_decision_desc: "Как только в древней столице Бургундии [GetTitleByKey('d_rhineland').GetName] будет создан двор, весь Рейнланд станет открытым для завоеваний. Когда Рейн будет захвачен, можно будет всерьёз начать поиски легендарного сокровища нибелунгов — и вернуть [GetGlobalVariable('rhinegold').Artifact.GetName]."
 rhineland_kingdom_objective_decision_confirm: "Провести коронацию."
 rhineland_duchy_objective_rhineland_duchy_claims: "Будут получены [Concept('pressed_claims', 'обоснованные претензии')|E] на все [Concept('duchies', 'герцогства')|E] вдоль реки Рейн — [GetTitleByKey('d_currezia').GetNameNoTier], [GetTitleByKey('d_augsburg').GetNameNoTier], [GetTitleByKey('d_swabia').GetNameNoTier], [GetTitleByKey('d_alsace').GetNameNoTier], [GetTitleByKey('d_west_franconia').GetNameNoTier], [GetTitleByKey('d_lower_lorraine').GetNameNoTier], [GetTitleByKey('d_julich').GetNameNoTier], [GetTitleByKey('d_gelre').GetNameNoTier], [GetTitleByKey('d_brabant').GetNameNoTier] и [GetTitleByKey('d_holland').GetNameNoTier]."
 POD_rhinegold_heist_tt: "Вы получите доступ к #TOOLTIP:game_concept_infiltration_desc #E миссии проникновения#!#!, чтобы вернуть [GetGlobalVariable('rhinegold').Artifact.Custom('ColorizedArtifactName')]."

 rhineland_empire_objective_decision: "Имперский Рейнланд"
 rhineland_empire_objective_decision_tooltip: "Расширить [GetTitleByKey('k_rhineland').GetName] вдоль реки, чтобы держава стала [Concept('empire', 'империей')|E]."
 rhineland_empire_objective_decision_desc: "Захватив все [Concept('duchies', 'герцогства')|E] державы [GetTitleByKey('e_rhineland').GetNameNoTier], уничтожив деспотичных вампиров, которые когда-то претендовали на эту землю и вернув золото Рейна в казну, все должны признать вашу власть над всем Рейном."
 rhineland_empire_objective_decision_confirm: "Весь Рейн!"
 rhineland_empire_objective_dead_stiffs: "Видные вампиры, претендующие на Рейнланд, должны быть мертвы или находиться в [Glossary('торпоре','game_concept_torpor_desc')] — [GetScriptedCharacterByHistoryID('505050').GetFirstName], [GetScriptedCharacterByHistoryID('505096').GetFirstName], [GetScriptedCharacterByHistoryID('505086').GetFirstName] и [GetScriptedCharacterByHistoryID('505121').GetFirstName]"
 rhineland_empire_objective_dejure_done: "[GetTitleByKey('k_rhineland').GetName] станет [Concept('de_jure', 'де-юре')|E] сюзереном [Concept('duchies', 'герцогств')|E] реки Рейн — [GetTitleByKey('d_currezia').GetNameNoTier], [GetTitleByKey('d_augsburg').GetNameNoTier], [GetTitleByKey('d_swabia').GetNameNoTier], [GetTitleByKey('d_alsace').GetNameNoTier], [GetTitleByKey('d_west_franconia').GetNameNoTier], [GetTitleByKey('d_lower_lorraine').GetNameNoTier], [GetTitleByKey('d_julich').GetNameNoTier], [GetTitleByKey('d_gelre').GetNameNoTier], [GetTitleByKey('d_brabant').GetNameNoTier] и [GetTitleByKey('d_holland').GetNameNoTier]."
 POD_region_borbetomagus: "Борбетомаг"
 POD_region_rhineland: "Рейнланд"
 POD_region_rhineland_empire: "Имперский Рейнланд"