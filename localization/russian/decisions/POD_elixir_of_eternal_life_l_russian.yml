l_russian:
 elixir_of_eternal_life_starter_decision: "Поиски [Concept('POD_elixir_of_eternal_life', 'эликсира Вечной жизни')|E]"
 elixir_of_eternal_life_starter_decision_desc: "Многим эликсир Вечной жизни был дарован Восемью бессмертными или их слугами ву-тянь. Однако легенды рассказывают о тех, кто достиг такого состояния просветления и сопутствующего бессмертия без их помощи. Многие считают такой подвиг невозможным. Как говорил сам Мастер, хотя глухие не могут услышать гром и оценить музыку, а солнце и великолепие одеяний Императора невидимы для слепых, это не значит, что этих вещей не существует. Некоторые говорят, что самостоятельное создание эликсира — это испытание, которое покажет, что вы его достойны. Другие говорят, что это Небеса дают вам выбор, проклинать ли себя.\n\n#R Ваши шансы на успех в этих поисках абсурдно низки. Не пытайтесь сделать это, если вы заботитесь о благополучии вашего персонажа.\nВас не спасут даже сохранение и перезагрузка игры. Вас предупредили.#!"
 elixir_of_eternal_life_starter_decision_tooltip: "Эликсир Вечной жизни мог бы даровать нам бессмертие без каких-либо недостатков."
 elixir_of_eternal_life_starter_decision_confirm: "Приступим."
 elixir_of_eternal_life_starter_decision_requirement_you: "У вас есть не менее @skill_learning_icon!#color_white 25#! [Concept('learning', 'учёности')|E], хотя бы #color_white 50#! [Concept('trait_level_track_xp', 'опыта пути развития')|E] создания отваров #weak ([GetTrait('pod_crafter').GetName(GetNullCharacter)])#!, имеется свойство «[GetTrait('erudite').GetName(GetNullCharacter)]» и «[GetTrait('sorcerer').GetName(GetNullCharacter)]» или «[GetTrait('theurgist').GetName(GetNullCharacter)]»"
 elixir_of_eternal_life_starter_decision_requirement_courtiers: "Имеет не менее @skill_learning_icon!#color_white 15#! [Concept('learning', 'учёности')|E], хотя бы #color_white 20#! [Concept('trait_level_track_xp', 'опыта пути развития')|E] создания отваров #weak ([GetTrait('pod_crafter').GetName(GetNullCharacter)])#!, имеет свойство «[GetTrait('erudite').GetName(GetNullCharacter)]» и «[GetTrait('sorcerer').GetName(GetNullCharacter)]» «[GetTrait('theurgist').GetName(GetNullCharacter)]»"
 elixir_of_eternal_life_starter_decision_requirement_dutchman: "Владеть и экипировать [Concept('artifact', 'артефакт')|E] #TOOLTIP:artifact_flying_dutchman_description #L $artifact_flying_dutchman_name$#!#!"
 elixir_of_eternal_life_starter_decision_requirement_redeyes: "Владеть и экипировать [Concept('artifact', 'артефакт')|E] #TOOLTIP:artifact_redeyes_description #L $artifact_redeyes_name$#!#!"
 elixir_of_eternal_life_starter_decision_requirement_quarters: "Владеть и экипировать [Concept('artifact', 'артефакт')|E] #TOOLTIP:artifact_ship_of_the_four_quarters_description #L $artifact_ship_of_the_four_quarters_name$#!#!"
 elixir_of_eternal_life_starter_decision_requirement_zadkiel: "Владеть и экипировать [Concept('artifact', 'артефакт')|E] #TOOLTIP:artifact_lens_of_zadkiel_description #L $artifact_lens_of_zadkiel_name$#!#!"
 elixir_of_eternal_life_starter_decision_requirement_mooncrystal: "Владеть и экипировать [Concept('artifact', 'артефакт')|E] #TOOLTIP:artifact_mooncrystal_description #L $artifact_mooncrystal_name$#!#!"
 elixir_of_eternal_life_stage1_unlock_next_phase: "Открывает следующий шаг на текущем пути"
 elixir_of_eternal_life_stage1_unlock_next_phase_caveat: "$spell_of_life_stage1_unlock_next_phase$, если у вас получится"
 elixir_of_eternal_life_stage1_do_multiple_stages: "#help \n\nХотя это и сложнее, вы можете обнаружить, что завершение пути предлагает дополнительные награды на более позднем этапе.#!"
 elixir_of_eternal_life_stage1_warning: "\n\n#R Будьте готовы пожертвовать всем в поисках истинного бессмертия, ибо путь таит в себе опасность!#!"
 elixir_of_eternal_life_stage1_decision_completion_message_title: "Ваше понимание углубляется"
 elixir_of_eternal_life_stage1_decision_completion_message_desc: "Вы открыли следующую цель на этом пути"

 elixir_of_eternal_life_request_aid_decision: "Запросить помощь"
 elixir_of_eternal_life_request_aid_decision_desc: "Вы уже достигли того, что немногие даже считали возможным: защитили Поднебесную от возвышения [Glossary('Императора демонов','podgloss.demonemperor')]. При этом вы были возведены в ряды Восьми Бессмертных, управляющих Ву-Тянь. Теперь, когда вы ищете эликсир Вечной жизни, Восьмёрка, возможно, пожелает вам помочь."
 elixir_of_eternal_life_request_aid_decision_confirm: "Я буду искать их руководства"
 elixir_of_eternal_life_request_aid_decision_tooltip: "Вы — [Select_CString(ROOT.Char.IsFemale, 'Девятая бессмертная', 'Девятый бессмертный' )]. Возможно, остальные захотят помочь вам в новых поисках"
 elixir_of_eternal_life_ninth_immortal_bonus_xp: "Каждый раз, когда вы завершаете [Concept('journey', 'странствие')|E], прозрения Восьми бессмертных приносят #color_white 5.00#! дополнительного [Concept('trait_level_track_xp', 'опыта пути развития')|E] эликсира Вечной жизни #weak ([GetTrait('eternal_rebirth_seeker').GetName( GetPlayer )])#!"


 elixir_of_eternal_life_remove_bad_traits_decision: "Внутреннее совершенство"
 elixir_of_eternal_life_remove_bad_traits_decision_tooltip: "Дисциплина, выкованная в трудностях, ясность, рождённая в суматохе."
 elixir_of_eternal_life_remove_bad_traits_decision_desc: "Бремя, которое я несу, не должно определять меня. Там, где раньше я [Select_CString(ROOT.Char.IsFemale, 'терпела', 'терпел' )] неудачу из-за напряжения, теперь я вижу возможности.\n\nЯ больше не буду потакать разрушительным привычкам. Вместо этого я овладею собой."
 elixir_of_eternal_life_remove_bad_traits_decision_confirm: "Я овладею собой."
 elixir_of_eternal_life_remove_bad_traits_decision_effect: "Свойства будут заменены новыми"

 elixir_of_eternal_life_stage1_internal_phase1_decision: "Преобразовать эссенцию в дыхание"
 elixir_of_eternal_life_stage1_internal_phase1_decision_desc: "В ходе изучения [Concept('POD_elixir_of_eternal_life', 'Эликсира вечного возрождения')|E] каждый из трёх основных компонентов космоса и человека – дух, дыхание и эссенция – реинтегрируется в предыдущий. Это делается для того, чтобы инвертировать последовательность, в которой они исходят из Дао, и тем самым вернуться к началу процесса. Благодаря такому возвращению дыхание сохраняется и узлы смерти могут быть развязаны.\n\nДля начала внутренняя эссенция ума должна быть очищена, сконцентрирована и свернута, чтобы зародить внутренний эмбрион, состоящий из дыхания. $elixir_of_eternal_life_stage1_do_multiple_stages$ $elixir_of_eternal_life_stage1_warning$"
 elixir_of_eternal_life_stage1_internal_phase1_decision_tooltip: "Преобразовать эссенцию в дыхание, чтобы вернуться к истоку."
 elixir_of_eternal_life_stage1_internal_phase1_decision_confirm: "Итак, началось"
 elixir_of_eternal_life_stage1_internal_phase1_decision_requirement_stress: "У вас есть #color_white 0#! [Concept('stress', 'стресса')|E]"
 elixir_of_eternal_life_stage1_internal_phase1_decision_requirement_illness: "У вас #bold нет#! никаких хворей"

 elixir_of_eternal_life_stage1_internal_phase2_decision: "Преобразовать дыхание в дух"
 elixir_of_eternal_life_stage1_internal_phase2_decision_desc: "Когда зародыш перерождения зародился, пришло время продолжить совершенствование и объединение тройственных внутренних сил. Все хвори и недуги вашей формы исходят из узлов, которые блокируют циркуляцию дыхания и сдавливают 5 внутренних органов. Правильная внутренняя циркуляция скрытого дыхания, не сдерживаемая телом, излечит такие проблемы. Как и всё остальное, ваше дыхание должно течь циклично, образуя бесконечный узор. Этот процесс объединяет различные физические движения, включая сгибание, расширение, сжатие и растяжение, а также технику дыхания."
 elixir_of_eternal_life_stage1_internal_phase2_decision_tooltip: "Преобразовать дыхание в дух, чтобы вернуться к истоку."
 elixir_of_eternal_life_stage1_internal_phase2_decision_confirm: "Второе становится первым"

 elixir_of_eternal_life_stage1_internal_phase3_decision: "Очистить дух для возвращения к пустоте"
 elixir_of_eternal_life_stage1_internal_phase3_decision_desc: "По мере очищения вашего духа ваши органы будут один за другим превращаться в золото и нефрит. Дыхание станет как сера, а кровь — как киноварь. Со временем, изоляцией и самоанализом ваш дух очищается до небытия, пока ваше тело не останется пустым. Там, где невежественные люди видят конец в пустоте, вы видите потенциал бесконечной связи.\n\nЕсли все вещи не имеют пустоты в центре, если они не имеют формы как субстанции, если Инь не имеет Ян, как они могут возникнуть? Познайте свет и держитесь тьмы. Это тайна существования, тайна, известная немногим и теперь... известная вам."
 elixir_of_eternal_life_stage1_internal_phase3_decision_tooltip: "Вернуться к началу процесса."
 elixir_of_eternal_life_stage1_internal_phase3_decision_confirm: "Первый возвращается к Дао"
 elixir_of_eternal_life_stage1_internal_phase3_decision_requirement_schemes: "Количество ваших активных [Concept('schemes', 'происков')|E] должно быть равно #color_white 0#!"

 elixir_of_eternal_life_stage1_external_phase1_decision: "Сбор золотых цветов и нефритовой росы"
 elixir_of_eternal_life_stage1_external_phase1_decision_desc: "Ваши эксперименты и ритуалы по созданию [Concept('POD_elixir_of_eternal_life', 'эликсира Вечного возрождения')|E] потребуют огромного количества ингредиентов, не все из которых растут на вашей родине. Вам понадобится свободный доступ к этим ингредиентам и их родным биомам, если вы надеетесь завершить свои поиски. $elixir_of_eternal_life_stage1_do_multiple_stages$ $elixir_of_eternal_life_stage1_warning$"
 elixir_of_eternal_life_stage1_external_phase1_decision_tooltip: "Ингредиенты необходимо собирать из многих мест"
 elixir_of_eternal_life_stage1_external_phase1_decision_confirm: "Пересадить их в мои сады"
 elixir_of_eternal_life_stage1_external_phase1_decision_requirement_desert: "На ваших землях есть провинции с [Concept('terrain', 'местностью')|E] засушливых земель, пустынь или пустынных гор"
 elixir_of_eternal_life_stage1_external_phase1_decision_requirement_cold: "На ваших землях есть провинции с горной или таёжной [Concept('terrain', 'местностью')|E]"
 elixir_of_eternal_life_stage1_external_phase1_decision_requirement_cultivated: "На ваших землях есть провинции с [Concept('terrain', 'местностью')|E] сельскохозяйственных угодий или террасных холмов"
 elixir_of_eternal_life_stage1_external_phase1_decision_requirement_water: "На ваших землях есть провинции с [Concept('terrain', 'местностью')|E] пойм или оазиса"
 elixir_of_eternal_life_stage1_external_phase1_decision_requirement_forest: "На ваших землях есть провинции с лесной или холмистой [Concept('terrain', 'местностью')|E]"
 elixir_of_eternal_life_stage1_external_phase1_decision_requirement_wet_forest: "На ваших землях есть провинции с джунглевой или болотной [Concept('terrain', 'местностью')|E]"
 elixir_of_eternal_life_stage1_external_phase1_decision_requirement_plains: "На ваших землях есть провинции с равнинной или степной [Concept('terrain', 'местностью')|E]"

 elixir_of_eternal_life_stage1_external_phase2_decision: "Приготовить настойку Тлеющих углей"
 elixir_of_eternal_life_stage1_external_phase2_decision_desc: "Собрав все растительные ингредиенты, пришло время приготовить настойку Тлеющих углей. Чтобы его приготовить, вам нужно будет собирать разнообразные предметы, улучшающие разные части вашего физического тела. Если вы захотите заняться исследованием, в [Concept('umbra', 'Умбре')|E] можно найти альтернативные ингредиенты."
 elixir_of_eternal_life_stage1_external_phase2_decision_tooltip: "Чтобы продолжить, вам необходимо собрать разнообразные ингредиенты."
 elixir_of_eternal_life_stage1_external_phase2_decision_confirm: "Сперва измельчите коготь виверны и гриб с девятью стебельками..."
 elixir_of_eternal_life_stage1_external_phase2_decision_requirement_bygones: "У вас есть хотя бы 1 великий или могущественный [Concept('POD_bygones_maa', 'ушедший')|E]"
 elixir_of_eternal_life_stage1_external_phase2_decision_requirement_umbra_aptitude: "У вас есть #V 150%#! [Concept('umbra_aptitude', 'пригодности Умбры')|E]"
 elixir_of_eternal_life_stage1_external_phase2_decision_requirement_bound_wraith_skills: "Общая сумма навыков ваших привязанных #TOOLTIP:GAME_TRAIT,wraith,[GetNullCharacter] #L призраков#!#! должна превышать #V 100#!"
 elixir_of_eternal_life_stage1_external_phase2_decision_requirement_can_use: "#color_white Вы#! можете использовать артефакт"
 elixir_of_eternal_life_stage1_external_phase2_decision_requirement_health: "Имеет модификатор артефакта, который усиливает [Concept('health', 'здоровье')|E] или компенсирует штрафы к нему"
 elixir_of_eternal_life_stage1_external_phase2_decision_requirement_diplomacy: "Имеет модификатор артефакта, который увеличивает навык [Concept('diplomacy', 'дипломатии')|E] или компенсирует штрафы к ней"
 elixir_of_eternal_life_stage1_external_phase2_decision_requirement_martial: "Имеет модификатор артефакта, который увеличивает навык [Concept('martial', 'военного дела')|E] или компенсирует штрафы к нему"
 elixir_of_eternal_life_stage1_external_phase2_decision_requirement_stewardship: "Имеет модификатор артефакта, который увеличивает навык [Concept('stewardship', 'управления')|E] или компенсирует штрафы к нему"
 elixir_of_eternal_life_stage1_external_phase2_decision_requirement_intrigue: "Имеет модификатор артефакта, который увеличивает навык [Concept('intrigue', 'интриг')|E] или компенсирует штрафы к ним"
 elixir_of_eternal_life_stage1_external_phase2_decision_requirement_learning: "Имеет модификатор артефакта, который увеличивает навык [Concept('learning', 'учёности')|E] или компенсирует штрафы к ней"

 elixir_of_eternal_life_stage1_external_phase3_decision: "Приготовить Фиолетово-золотой эликсир"
 elixir_of_eternal_life_stage1_external_phase3_decision_desc: "После завершения вливания следующим шагом станет приготовление Фиолетово-золотого эликсира в самом сердце драконьего гнезда. Небесная аметистовая орхидея души необходима, и её можно достать только в [UmbraGlossaryLocalized('heavenly_flower_garden','Небесном цветочном саду')]. Что касается других ингредиентов, вы можете смешать содержимое других зелий и извлечь свойства сильнодействующих предметов. Альтернативно, договоры с определёнными духами могут предоставить необходимые компоненты и магию."
 elixir_of_eternal_life_stage1_external_phase3_decision_tooltip: "У этого эликсира довольно необычные требования к ингредиентам."
 elixir_of_eternal_life_stage1_external_phase3_decision_confirm: "Оставьте лепестки в ванне с травяным вином..."
 elixir_of_eternal_life_stage1_external_phase3_decision_requirement_health: "Имеет модификатор артефакта, который существенно усиливает [Concept('health', 'здоровью')|E] или существенно нивелирует штрафы к нему, не считая суммируемых бонусов от нескольких копий одного и того же модификатора"
 elixir_of_eternal_life_stage1_external_phase3_decision_requirement_diplomacy: "Имеет модификатор артефакта, который существенно увеличивает навык [Concept('diplomacy', 'дипломатии')|E] или существенно нивелирует штрафы к ней, не считая суммируемых бонусов от нескольких копий одного и того же модификатора"
 elixir_of_eternal_life_stage1_external_phase3_decision_requirement_martial: "Имеет модификатор артефакта, который существенно увеличивает навык [Concept('martial', 'военного дела')|E] или существенно нивелирует штрафы к нему, не считая суммируемых бонусов от нескольких копий одного и того же модификатора"
 elixir_of_eternal_life_stage1_external_phase3_decision_requirement_stewardship: "Имеет модификатор артефакта, который существенно увеличивает навык [Concept('stewardship', 'управления')|E] или существенно нивелирует штрафы к нему, не считая суммируемых бонусов от нескольких копий одного и того же модификатора"
 elixir_of_eternal_life_stage1_external_phase3_decision_requirement_intrigue: "Имеет модификатор артефакта, который существенно увеличивает навык [Concept('intrigue', 'интриг')|E] или существенно нивелирует штрафы к ним, не считая суммируемых бонусов от нескольких копий одного и того же модификатора"
 elixir_of_eternal_life_stage1_external_phase3_decision_requirement_learning: "Имеет модификатор артефакта, который существенно увеличивает навык [Concept('learning', 'учёности')|E] или существенно нивелирует штрафы к ней, не считая суммируемых бонусов от нескольких копий одного и того же модификатора"

 elixir_of_eternal_life_stage1_nourishing_phase1_decision: "Одно видение, одна цель"
 elixir_of_eternal_life_stage1_nourishing_phase1_decision_desc: "Прежде чем человек сможет подпитать свою [Concept('POD_elixir_of_eternal_life', 'внутреннюю жизнь')|E], он должен подпитать жизни окружающих. В отличие от дышащих мехами, истинный последователь Дао ищет бессмертия вместе с тем, чтобы принести пользу своей семье и сообществу. Одна рука борется там, где строят многие руки, и бесконечная жизнь возникает из плодотворной связи со всем творением. $elixir_of_eternal_life_stage1_do_multiple_stages$ $elixir_of_eternal_life_stage1_warning$"
 elixir_of_eternal_life_stage1_nourishing_phase1_decision_tooltip: "Встанем как один"
 elixir_of_eternal_life_stage1_nourishing_phase1_decision_confirm:0 "Вместе мы выстоим; по-одиночке мы падём."
 elixir_of_eternal_life_stage1_nourishing_phase1_decision_requirement_development: "В вашей державе есть как минимум 100 [Concept('development', 'развития')|E]"
 elixir_of_eternal_life_stage1_nourishing_phase1_decision_requirement_prisoners: "У вас #bold нет#! [Concept('prisoners', 'пленников')|E]"
 elixir_of_eternal_life_stage1_nourishing_phase1_decision_requirement_dread:0 "У вас менее #color_white 10#! [Concept('dread', 'ужаса')|E]"
 elixir_of_eternal_life_stage1_nourishing_phase1_decision_requirement_vassals: "Все ваши могущественные вассалы имеют о вас хотя бы #color_green 20#! мнения."

 elixir_of_eternal_life_stage1_nourishing_phase2_decision: "Слияние дыханий"
 elixir_of_eternal_life_stage1_nourishing_phase2_decision_desc: "Когда жизнь других людей улучшилась, пришло время обратить свой взгляд внутрь себя, на развитие своей внутренней жизни. Вы должны создать внутренний эмбрион, который не будет затронут смертью и который станет семенем вашего будущего перерождения. Там, где другие стремятся улучшить своё внутреннее дыхание, вы знаете альтернативный путь. Чтобы породить зародыш, вы должны стимулировать и обмениваться своей ци с другими. Инь должно встретиться с Ян."
 elixir_of_eternal_life_stage1_nourishing_phase2_decision_tooltip: "Инь должно встретиться с Ян."
 elixir_of_eternal_life_stage1_nourishing_phase2_decision_confirm: "Два дыхания должны стать одним"
 elixir_of_eternal_life_stage1_nourishing_phase2_decision_requirement_relations: "У вас есть как минимум #color_white 1#! [Concept('spouse', 'супруга')|E], [Concept('concubine', 'наложница')|E] или [Concept('lover', 'любовница')|E]"
 elixir_of_eternal_life_stage1_nourishing_phase2_decision_requirement_spouses_skills: "Средний уровень всех навыков ваших [Concept('spouses', 'супругов')|E] не ниже #color_white 15#!."
 elixir_of_eternal_life_stage1_nourishing_phase2_decision_requirement_spouses_opinions: "Все ваши [Concept('spouses', 'супруги')|E] имеют о вас как минимум #color_green 25#! мнения."
 elixir_of_eternal_life_stage1_nourishing_phase2_decision_requirement_concubines_skills: "Средний уровень всех навыков ваших [Concept('concubines', 'наложниц')|E] не ниже #color_white 15#!."
 elixir_of_eternal_life_stage1_nourishing_phase2_decision_requirement_concubines_opinions: "Все ваши [Concept('concubines', 'наложницы')|E] имеют о вас как минимум #color_green 25#! мнения."
 elixir_of_eternal_life_stage1_nourishing_phase2_decision_requirement_lovers_skills: "Средний уровень всех навыков ваших [Concept('lovers', 'любовников')|E] не ниже #color_white 15#!."
 elixir_of_eternal_life_stage1_nourishing_phase2_decision_requirement_lovers_opinions: "Все ваши [Concept('lovers', 'любовники')|E] имеют о вас как минимум #color_green 25#! мнение."
 elixir_of_eternal_life_stage1_nourishing_phase2_decision_requirement_high_skill: "Хотя бы #color_white 1#! [Concept('spouse', 'супруга')|E], [Concept('concubine', 'наложница')|E] или [Concept('lover', 'любовница')|E] имеет среднее значение всех навыков не ниже #color_white 25#!."

 elixir_of_eternal_life_stage1_nourishing_phase3_decision: "Достижение цели без странствия"
 elixir_of_eternal_life_stage1_nourishing_phase3_decision_desc: "Преследуемая цель никогда не достигается. Мудрец не действует, но ничего не остаётся незавершённым. Мириады вещей, укоренённые в тишине, процветают. Богатство и жизнь текут, а не накапливаются. Подобно воде, мудрец приносит пользу всему живому, оставаясь незамеченным. Они текут даже в самые низкие места, где никто не хочет находиться, неизменные и постоянные, но способные изменить ландшафт."
 elixir_of_eternal_life_stage1_nourishing_phase3_decision_tooltip: "Без действий ничего не останется незавершённым"
 elixir_of_eternal_life_stage1_nourishing_phase3_decision_confirm:0 "Я [Select_CString(ROOT.Char.IsFemale, 'могла', 'мог' )] бы действовать, но [Select_CString(ROOT.Char.IsFemale, 'решила', 'решил' )] не делать этого"
 elixir_of_eternal_life_stage1_nourishing_phase3_decision_requirement_child_count: "У вас есть как минимум #color_white 5#! детей"
 elixir_of_eternal_life_stage1_nourishing_phase3_decision_requirement_friends_skills: "Все ваши [Concept('friends', 'друзья')|E] имеют средний уровень всех навыков не ниже #color_white 15#!"
 elixir_of_eternal_life_stage1_nourishing_phase3_decision_requirement_friends_lowborn: "Хотя бы #color_white 1#! [Concept('friend', 'друг')|E] является [Concept('lowborn', 'низкородным')|E] или имеет [Concept('prestige_level', 'уровень репутации')|E] @prestige_level_1_icon! [GetModifier( 'prestige_level_1' ).GetNameWithTooltip|L] или ниже"
 elixir_of_eternal_life_stage1_nourishing_phase3_decision_requirement_income: "Ваш [Concept('income', 'доход')|E] не ниже [gold_i] #color_white 10#! [Concept('gold', 'золотых')|E]"
 elixir_of_eternal_life_stage1_nourishing_phase3_decision_requirement_gold_hoard: "У вас есть максимум [gold_i] #color_white 250#! [Concept('gold', 'золотых')|E]"
 elixir_of_eternal_life_stage1_nourishing_phase3_decision_requirement_lifestyle_perks: "Сумма неизрасходованных очков достоинств [Concept('diplomacy_lifestyle', 'пути дипломатии')|E], [Concept('martial_lifestyle', 'войны')|E], [Concept('stewardship_lifestyle', 'управления')|E], [Concept('intrigue_lifestyle', 'интриг')|E] и [Concept('learning_lifestyle', 'учёности')|E] составляет не менее #color_white 10#!"

 elixir_of_eternal_life_stage2_meditation_decision: "Помедитировать о вечности"
 elixir_of_eternal_life_stage2_meditation_decision_tooltip: "Медитирование над тем, что вы узнали, может углубить ваше понимание."
 elixir_of_eternal_life_stage2_meditation_decision_desc: "Хотя исследования и учёба важны, ничто не может превзойти уединённую медитацию на уроках, которые вы усвоили. Предстоящий путь может быть медленным и трудным, поскольку рассматривать такие глубокие вопросы непросто. Однако учения будут укрепляться, а концепции уточняться."
 elixir_of_eternal_life_stage2_meditation_decision_confirm: "Пришло время совершенствоваться."
 elixir_of_eternal_life_stage2_meditation_decision_effect: "Вы выберете место для медитации и [Concept('journey', 'отправитесь')|E] туда"

 elixir_of_eternal_life_stage4_internal_decision: "Совершенное равновесие"
 elixir_of_eternal_life_stage4_internal_decision_tooltip: "Я обрету равновесие, прежде чем окончательно остановить своё сердце."
 elixir_of_eternal_life_stage4_internal_decision_desc: "Когда придёт время, вы завершите начатое так давно. В годовщину своего зачатия вы начнёте развязывать узлы смерти. Постепенно сердце, селезёнка, лёгкие, печень и почки станут подобны нефриту. В час своего рождения вы остановите сердце одной лишь мыслью. Так разорвутся телесные узы: скованное земным не может стать небесным. Так вознесётся дух: смертное нельзя очистить до совершенства. Если Восемь бессмертных сочтут вас достойными эликсира, вы вернётесь в новом облике, подобающем слуге Нефритового императора.\n\n#N В случае неудачи Восемь бессмертных не дадут вам новой аудиенции целое столетие, чтобы вы успели достичь большего.#!"
 elixir_of_eternal_life_stage4_internal_decision_confirm:0 "Я изолирую себя."
 #elixir_of_eternal_life_stage4_internal_decision_skills: "No [skill|E] is more than #color_white 15#! above the average of your [skills|E] #weak ([GetPlayer.MakeScope.ScriptValue('average_of_all_skills')])#!"
 elixir_of_eternal_life_stage4_internal_decision_skills: "Ваша Ян ([diplomacy_i][Concept('diplomacy', 'Дипломатия')|E] + [martial_i][Concept('martial', 'военное дело')|E]) отличается от среднего значения вашей Инь ([intrigue_i][Concept('intrigue', 'Интриги')|E] + [stewardship_i][Concept('stewardship', 'управление')|E]) #bold не#! более чем на #color_white 15%#! в любую сторону"

 elixir_of_eternal_life_stage4_external_decision: "Приготовление эликсира Девяти циклов"
 elixir_of_eternal_life_stage4_external_decision_tooltip: "Я приготовлю идеальный эликсир, чтобы поговорить с Восьмью бессмертными."
 elixir_of_eternal_life_stage4_external_decision_desc: "Пришло время сварить последний необходимый эликсир. Вам нужно будет подняться на самую высокую вершину в благоприятный день и безупречно сварить эликсир, приготовленный из множества экзотических ингредиентов, включая компоненты ушедших существ. Никаких ошибок быть не может. Попытки недопустимы. Те, кого Восемь бессмертных сочтут праведными, вернутся в новое тело.\n\n#N Если вы потерпите неудачу, Восемь бессмертных не предоставят вам новую аудиенцию в течение ста лет, чтобы вы могли достичь большего.#!"
 elixir_of_eternal_life_stage4_external_decision_confirm: "Начнём восхождение."
 elixir_of_eternal_life_stage4_external_decision_bygones: "У вас есть хотя бы 3 разных великих или могущественных [Concept('POD_bygones_maa', 'ушедших')|E] #weak ([GetPlayer.MakeScope.ScriptValue('number_maa_regiments_greater_and_potent_bygones')])#!."
 elixir_of_eternal_life_stage4_external_decision_dragon_nest: "Вы напрямую контролируете одно из уникальных драконьих гнёзд"

 elixir_of_eternal_life_stage4_nourishing_decision: "Рождение эмбриона бессмертного"
 elixir_of_eternal_life_stage4_nourishing_decision_tooltip: "Вместе мы начнём ритуал трансцендентности."
 elixir_of_eternal_life_stage4_nourishing_decision_desc: "Вы не возноситесь в одиночку; другие являются повитухами вашего возрождения. Когда придёт время, ваша доверенная котерия приступит к довольно интимному ритуалу трансцендентности. После того, как вы убьёте себя лично изготовленным церемониальным оружием, которое сместит ваше место жизни, они продолжат ритуал. Они нарисуют на вашем трупе символы, оденут вас в специальную одежду и поместят ваш труп в локус ци. Пока солнце не сядет или не взойдёт, они будут медитировать, молиться и петь, чтобы подготовить путь для вашего возвращения. Без сомнения, вы вернётесь с триумфом, поколебав Восемь бессмертных.\n\n#N Если вы потерпите неудачу, Восемь бессмертных не предоставят вам новую ауденцию в течение ста лет, чтобы вы успели достичь большего.#!"
 elixir_of_eternal_life_stage4_nourishing_decision_confirm: "Подготовить ритуал."
 elixir_of_eternal_life_stage4_nourishing_decision_coterie_size: "В вашей группе ([GetPlayer.Custom('PODCoterie')]) состоят [EmptyScope.ScriptValue('coterie_max_size')] членов"
 elixir_of_eternal_life_stage4_nourishing_decision_coterie_skills: "Ваша [GetPlayer.Custom('PODCoterie')|l] должна иметь не менее 25 во всех [Concept('skills', 'навыках')|E]"
 elixir_of_eternal_life_stage4_nourishing_decision_wu_shi: "Владеть и экипировать [Concept('artifact', 'артефакт')|E] «[GetPODArtifactName('wu_shi_link')]»"
 elixir_of_eternal_life_stage4_nourishing_decision_demon_jade: "Владеть и экипировать [Concept('artifact', 'артефакт')|E] «[GetPODArtifactName('demon_jade_talisman_link')]»"

 elixir_of_eternal_life_stage4_infernalist_decision: "Прокладывание путей"
 elixir_of_eternal_life_stage4_infernalist_decision_tooltip: "С помощью Великодушнейшего учителя вы сможете войти в их владения"
 elixir_of_eternal_life_stage4_infernalist_decision_desc: "У Мудрейшего учителя есть замыслы. В отличие от рабов-акума, вы действительно живы, а не просто призраки, оживляющие мёртвую плоть, что открывает множество возможностей. Благоразумнейший учитель заявляет, что вас должно быть больше. Многие смертные стремятся к вечной жизни. Через Щедрейшего учителя они получают его всего лишь ценой услуги, такой же вечной, как и их новая жизнь. Однако таким, как они, потребуется место, чтобы подготовиться во владениях Всемогущего учителя, получить силу жизненной ци Сильнейшего учителя, чтобы они могли вернуться к жизни, и получить наставления, если глупцы подведут Милосерднейшего учителя. Щедрейший учитель подарил вам алхимическую формулу, чтобы вы могли спуститься во владения самого Сильнейшего учителя и выкроить такое пространство."
 elixir_of_eternal_life_stage4_infernalist_decision_confirm: "Возвышеннейший учитель ждёт меня"
 elixir_of_eternal_life_stage4_infernalist_decision_effect: "Вы войдёте во владения Всевластного учителя"
 elixir_of_eternal_life_stage4_infernalist_decision_success: "Великодушнейший учитель дарует великую силу"
 elixir_of_eternal_life_stage4_infernalist_decision_failure: "Разочарование Грознейшего учителя сохранится очень надолго"

 elixir_of_eternal_life_stage4_success_eoel_caveat: "Если добьётесь успеха, вы получите полноценный эликсир Вечной жизни"
 POD_mummy_elixir_of_eternal_life_wutian: "Получена возможность создавать мумии Ву-Тянь"
 POD_mummy_elixir_of_eternal_life_wukuei: "Получена возможность создавать мумии Ву-Куэй"