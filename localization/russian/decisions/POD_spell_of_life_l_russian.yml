 spell_of_life_stage1_setite_phase3_decision_sorcerer_prisoner: "У вас должно быть хотя бы #color_white 3#! [Concept('prisoners', 'пленников')|E] со свойством «[GetTrait('sorcerer').GetName(GetNullCharacter)]» или «[GetTrait('theurgist').GetName(GetNullCharacter)]»."
 spell_of_life_stage1_setite_phase3_decision_sorcery_prisoner: "У вас есть хотя бы #color_white 10#! [Concept('prisoners', 'пленников')|E], которые #italic могут#! научиться #TOOLTIP:GAME_TRAIT,sorcerer,[GetNullCharacter] #L чародейству#!#! #weak ([GetTrait('bastet').GetName(GetNullCharacter)] или [Concept('mortal_like_splats', 'смертные виды')|E])#!"
 spell_of_life_stage1_setite_phase3_decision_knowledgeable_people: "#color_white Любой#! из следующих персонажей должен находиться в вашей темнице: [GetScriptedCharacterByHistoryID('792600').GetFirstName], [GetScriptedCharacterByHistoryID('792593').GetFirstName], [GetScriptedCharacterByHistoryID('790512').GetFirstName], [GetScriptedCharacterByHistoryID('792870').GetFirstName], [GetScriptedCharacterByHistoryID('792804').GetFirstName], [GetScriptedCharacterByHistoryID('792605').GetFirstName], [GetTrait('ferryman').GetName(GetNullCharacter)|l] или другой персонаж, который знает часть заклинания Жизни #weak (имеет более 15 [Concept('trait_level_track_xp', 'опыта пути развития')|E] «$trait_track_spell_of_life$» свойства «[GetTrait('eternal_rebirth_seeker').GetName(GetNullCharacter)]»)#!."
 spell_of_life_stage1_setite_phase3_decision_knowledgeable_people_no_mummies: "#color_white Любой#! из следующих персонажей должен находиться в вашей темнице: [GetScriptedCharacterByHistoryID('790512').GetFirstName], [GetScriptedCharacterByHistoryID('792870').GetFirstName], [GetTrait('ferryman').GetName(GetNullCharacter)|l] или другой персонаж, который знает часть заклинания Жизни #weak (имеет не менее 16 [Concept('trait_level_track_xp', 'опыта пути развития')|E] «$trait_track_spell_of_life$» свойства «[GetTrait('eternal_rebirth_seeker').GetName(GetNullCharacter)]»)#!."
