 spell_of_life_starter_decision: "Поиски [Concept('POD_spell_of_life', 'заклинания Жизни')|E]"
 spell_of_life_starter_decision_desc: "Многие искали способ вечного возрождения, чистую форму бессмертия, лишённую слабостей и проклятий, присущих другим вариантам. Один проверенный метод, заклинание Жизни, используется #TOOLTIP:GAME_TRAIT,mummy,[GetNullCharacter] #L мумиями#!#! Запада. Хотя это может занять всю жизнь, и вы должны быть готовы пожертвовать всем, поиск истинного бессмертия может оказаться стоящим.\n\n#R Ваши шансы на успех в этих поисках абсурдно низки. Не пытайтесь сделать это, если вы заботитесь о благополучии своего персонажа.\nДаже сохранение и загрузка игры ради удачного исхода вас не спасут. Вас предупредили.#!"
 spell_of_life_starter_decision_tooltip: "Заклинание Жизни могло бы даровать нам бессмертие без каких-либо недостатков."
 spell_of_life_starter_decision_confirm: "Приступим."
 spell_of_life_starter_decision_requirement_you: "У вас есть как минимум @skill_learning_icon!#color_white 25#! [Concept('learning', 'учёности')|E], имеются свойства «[GetTrait('erudite').GetName(GetNullCharacter)]» и «[GetTrait('sorcerer').GetName(GetNullCharacter)]» или «[GetTrait('theurgist').GetName(GetNullCharacter)]»"
 spell_of_life_starter_decision_requirement_courtiers: "У них есть как минимум @skill_learning_icon!#color_white 15#! [Concept('learning', 'учёности')|E], имеются свойства «[GetTrait('erudite').GetName(GetNullCharacter)]» и «[GetTrait('sorcerer').GetName(GetNullCharacter)]» или «[GetTrait('theurgist').GetName(GetNullCharacter)]»"
 spell_of_life_starter_decision_requirement_sorcery_of_life: "У вас есть [Concept('perk', 'достоинство')|E] «[GetPerk('the_sorcery_of_life_perk').GetName(GetPlayer)]» #weak ($blood_magic_revelations_of_duat_visible$)#!"
 spell_of_life_starter_decision_requirement_hand_of_heka: "У вас есть [Concept('perk', 'достоинство')|E] «[GetPerk('hand_of_heka_perk').GetName(GetPlayer)]» #weak ($blood_magic_divine_hand_visible$)#!"
 spell_of_life_starter_decision_requirement_dark_invocation: "У вас есть [Concept('perk', 'достоинство')|E] «[GetPerk('dark_invocation_perk').GetName(GetPlayer)]» #weak ($blood_magic_immanence_of_set_visible$)#!"
 spell_of_life_starter_decision_requirement_mutate: "У вас есть [Concept('perk', 'достоинство')|E] «[GetPerk('mutate_perk').GetName(GetPlayer)]» #weak ($blood_magic_alchemy_visible$)#!"
 spell_of_life_starter_decision_requirement_power_over_life: "У вас есть [Concept('perk', 'достоинство')|E] «[GetPerk('power_over_life_perk').GetName(GetPlayer)]» #weak ($blood_magic_conjuring_visible$)#!"
 spell_of_life_starter_decision_requirement_duality: "У вас есть [Concept('perk', 'достоинство')|E] «[GetPerk('duality_perk').GetName(GetPlayer)]» #weak ($blood_magic_spirit_manipulation_visible$)#!"
 spell_of_life_stage1_unlock_next_phase: "Открывает следующий шаг на текущем пути."
 spell_of_life_stage1_unlock_next_phase_caveat: "$spell_of_life_stage1_unlock_next_phase$, если у вас получится"
 spell_of_life_stage1_do_multiple_stages: "#help \n\nХотя это и сложнее, вы можете обнаружить, что завершение пути предлагает дополнительные награды на более позднем этапе.#!"
 spell_of_life_stage1_warning: "\n\n#R Будьте готовы пожертвовать всем в поисках истинного бессмертия, ибо путь таит в себе опасность!#!"
 spell_of_life_stage1_hide_requirement: ""
 spell_of_life_stage1_decision_completion_message_title: "Ваше понимание углубляется"
 spell_of_life_stage1_decision_completion_message_desc: "Вы открыли следующую цель на этом пути"

 spell_of_life_stage1_horus_phase1_decision: "Добиться аудиенции"
 spell_of_life_stage1_horus_phase1_decision_desc: "Шестой принцип Кодекса Гора гласит: «Старайтесь не создавать других, подобных нам». Убедить его нарушить Кодекс практически невозможно. Однако преимущества невыразимы, поскольку он является единственным, кто владеет полным и безупречным [Concept('POD_spell_of_life', 'заклинанием Жизни')|E]. Прежде чем мы сможем убедить его, нам нужно заслужить у него аудиенцию. Возможно, дар привлечёт его внимание. $spell_of_life_stage1_do_multiple_stages$ $spell_of_life_stage1_warning$"
 spell_of_life_stage1_horus_phase1_decision_tooltip: "Чтобы убедить Гора, нам нужно заслужить у него аудиенцию."
 spell_of_life_stage1_horus_phase1_decision_confirm: "Мы дарим вам... Верхний Египет!"
 spell_of_life_stage1_horus_phase1_decision_cairo: "Вы или [GetScriptedCharacterByHistoryID('792593').GetFirstName] [Concept('completely_control', 'полностью контролируете')|E] провинцию [GetTitleByKey('d_cairo').GetNameNoTier]"
 spell_of_life_stage1_horus_phase1_decision_delta: "Вы или [GetScriptedCharacterByHistoryID('792593').GetFirstName] [Concept('completely_control', 'полностью контролируете')|E] провинцию [GetTitleByKey('d_delta').GetNameNoTier]"
 spell_of_life_stage1_horus_phase1_decision_alexandria: "Вы или [GetScriptedCharacterByHistoryID('792593').GetFirstName] [Concept('completely_control', 'полностью контролируете')|E] провинцию [GetTitleByKey('d_alexandria').GetNameNoTier]"

 spell_of_life_stage1_horus_phase2_decision: "Значимый довод"
 spell_of_life_stage1_horus_phase2_decision_desc: "Если мы сможем подружиться с Гором, нашего дара или предыдущей услуги будет достаточно, чтобы добиться аудиенции у него. Это будет нелегко, но никто не знает о [Concept('POD_spell_of_life', 'заклинании Жизни')|E] больше, чем он."
 spell_of_life_stage1_horus_phase2_decision_tooltip: "Мы добились аудиенции благодаря дару. Воспользуемся ею сполна."
 spell_of_life_stage1_horus_phase2_decision_confirm: "Отправиться к его двору"

 spell_of_life_stage1_horus_phase3_decision: "Доказать свою достойность"
 spell_of_life_stage1_horus_phase3_decision_desc: "Наши доводы убедили Гора, соизволив предоставить нам возможность доказать, что мы верные союзники его дела. Дети Сета и предатели должны пасть от наших клинков. Только тогда Гор поможет нам в поисках заклинания Жизни, хотя и не даст нам всего. Только разгадав его тайну самостоятельно, мы можем продемонстрировать, что достойны его использовать."
 spell_of_life_stage1_horus_phase3_decision_tooltip: "Чтобы получить знания Гора, мы должны доказать, что достойны"
 spell_of_life_stage1_horus_phase3_decision_confirm: "И пески окрасились в красный..."
 spell_of_life_stage1_horus_phase3_decision_no_emperor_requirement: "Ни один #TOOLTIP:GAME_TRAIT,setite,[GetNullCharacter] #L сетит#!#! или последователь [Concept('faith', 'конфессии')|E] с [Concept('doctrine', 'доктринами')|E] «[GetDoctrineType('special_doctrine_set_pillars_kindred').GetBaseName]» или «[GetDoctrineType('special_doctrine_set_corrupted_kindred').GetBaseName]» не должен владеть [Concept('title', 'титулом')|E] ранга империи"
 spell_of_life_stage1_horus_phase3_bonus_xp: "Каждый раз, когда вы завершаете [Concept('journey', 'странствие')|E], прозрения Гора приносят #color_white 5.00#! дополнительных ед. [Concept('trait_level_track_xp', 'опыта')|E] заклинания Жизни #weak ([GetTrait('eternal_rebirth_seeker').GetName( GetPlayer )])#!"
 spell_of_life_stage1_horus_phase3_decision_effect: "Со временем вы можете попасть в [UmbraGlossaryLocalized('dark_kingdom_of_sand','Аменти')] благодаря вашим отношениям"

 spell_of_life_stage1_kemintiri_phase1_decision: "Восстановить утраченные воспоминания"
 spell_of_life_stage1_kemintiri_phase1_decision_desc: "Будучи когда-то жрицей Исиды и обладательницей [Concept('POD_spell_of_life', 'заклинания Жизни')|E], Кеминтири многое потеряла за время, проведённое под #EMP нежной заботой#! Сета. Если бы мы смогли заслужить её доверие и восстановить остатки её прошлой жизни, мы, возможно, смогли бы помочь восстановить некоторые из этих утраченных воспоминаний. $spell_of_life_stage1_do_multiple_stages$ $spell_of_life_stage1_warning$"
 spell_of_life_stage1_kemintiri_phase1_decision_tooltip: "Кеминтири когда-то знала заклинание Жизни. Возможно, она вспомнит его..."
 spell_of_life_stage1_kemintiri_phase1_decision_confirm: "Я говорю о начале времён..."

 spell_of_life_stage1_kemintiri_phase2_decision: "Давно потерянные друзья"
 spell_of_life_stage1_kemintiri_phase2_decision_desc: "Читая артефакт, который она помогла создать, в воспоминаниях Кеминтири осталось слишком много пробелов. Однако она упомянула, что другие пытались помочь ей в прошлом, и вы знаете, что многие истории из её прошлого сохранились в определённых традициях. Если бы мы смогли связаться и завоевать доверие этих людей, они, возможно, смогли бы восстановить то, что Кеминтири потерялаа, включая знания о [Concept('POD_spell_of_life', 'заклинании Жизни')|E]."
 spell_of_life_stage1_kemintiri_phase2_decision_tooltip: "Мы не первые, кто пытается помочь Кеминтири. Возможно, остальные могут быть полезны."
 spell_of_life_stage1_kemintiri_phase2_decision_confirm: "Многое из того, что когда-то было, потеряно, но это осталось..."
 spell_of_life_stage1_kemintiri_phase2_decision_osiris_requirement: "Член [Concept('house', 'дома')|E] [GetDynastyHouseByID('house_osiris').GetName] является вашим [Concept('friend', 'другом')|E], [Concept('best_friend', 'лучшим другом')|E], членом [Concept('coterie', 'котерии')|E], [Concept('lover', 'любовником')|E] или [Concept('soulmate', 'родственной душой')|E]"
 spell_of_life_stage1_kemintiri_phase2_decision_bubasti_requirement: "[GetFaithByKey('bubasti').GetAdjective] является вашим [Concept('friend', 'другом')|E], [Concept('best_friend', 'лучшим другом')|E], членом [Concept('coterie', 'котерии')|E], [Concept('lover', 'любовником')|E] или [Concept('soulmate', 'родственной душой')|E]"
 spell_of_life_stage1_kemintiri_phase2_decision_sobek_requirement: "#TOOLTIP:FAITH,children_sobek #L Дитя Собека#!#!#! является вашим [Concept('friend', 'другом')|E], [Concept('best_friend', 'лучшим другом')|E], членом [Concept('coterie', 'котерии')|E], [Concept('lover', 'любовником')|E] или [Concept('soulmate', 'родственной душой')|E]"
 spell_of_life_stage1_kemintiri_phase2_decision_silent_strider_requirement: "#TOOLTIP:RELIGION,silentstrider_religion #L Безмолвный странник#!#!#! является вашим [Concept('friend', 'другом')|E], [Concept('best_friend', 'лучшим другом')|E], членом [Concept('coterie', 'котерии')|E], [Concept('lover', 'любовником')|E] или [Concept('soulmate', 'родственной душой')|E]"
 spell_of_life_stage1_kemintiri_phase2_decision_khetamon_requirement: "[GetScriptedCharacterByHistoryID('791151').GetFirstName], который когда-то был близок к исцелению психики Кеминтири, активен и либо находится при вашем [Concept('court', 'дворе')|E], либо является вашим [Concept('friend', 'другом')|E], [Concept('best_friend', 'лучшим другом')|E], членом [Concept('coterie', 'котерии')|E], [Concept('lover', 'любовником')|E] или [Concept('soulmate', 'родственной душой')|E]"
 spell_of_life_stage1_kemintiri_phase2_decision_effect: "[GetScriptedCharacterByHistoryID('790512').GetFirstName] узнает заклинание Жизни"

 spell_of_life_stage1_kemintiri_phase3_decision: "Месть лучше всего подавать холодной"
 spell_of_life_stage1_kemintiri_phase3_decision_desc: "Хотя большая часть её воспоминаний вернулась и она вспомнила достаточно тонкостей [Concept('POD_spell_of_life', 'заклинания Жизни')|E], чтобы помочь нам, Кеминтири сообщила нам, что она не может уделять время нашему обучению, пока не отомстит. Та-урт и весь её [Concept('house', 'дом')|E] должны быть уничтожены. Только тогда она переключит своё внимание на другие дела."
 spell_of_life_stage1_kemintiri_phase3_decision_tooltip: "Кеминтири должна отомстить, прежде чем она захочет нас учить"
 spell_of_life_stage1_kemintiri_phase3_decision_confirm: "Месть, затем уроки"
 spell_of_life_stage1_kemintiri_phase3_decision_tawaret_landed: "Ни один вампир-член [Concept('house', 'дома')|E] [GetDynastyHouseByID('house_tawaret').GetName] не является [Concept('ruler', 'правителем')|E]"
 spell_of_life_stage1_kemintiri_phase3_decision_tawaret_landed_ex: "$spell_of_life_stage1_kemintiri_phase3_decision_tawaret_landed$ #weak ([landed_tawaret_example.GetFirstName])#!"
 spell_of_life_stage1_kemintiri_phase3_decision_tawaret_living: "5 или менее членов [Concept('house', 'дома')|E] [GetDynastyHouseByID('house_tawaret').GetName] живы, активны и являются вампирами"
 spell_of_life_stage1_kemintiri_phase3_decision_tawaret_living_ex: "$spell_of_life_stage1_kemintiri_phase3_decision_tawaret_living$ #weak ([living_tawaret_example.GetFirstName])#!"
 spell_of_life_stage1_kemintiri_phase3_decision_effect: "Со временем вы можете попасть в [UmbraGlossaryLocalized('dark_kingdom_of_sand','Аменти')] благодаря вашим отношениям"

 spell_of_life_stage1_cabirus_phase1_decision: "Прочесть тайные письмена Кабира"
 spell_of_life_stage1_cabirus_phase1_decision_desc: "Тайные письмена Кабира представляют собой полную, но плохо переведённую версию оригинальной книги Кабира. Тем не менее, они описывают внутреннюю работу [Concept('POD_spell_of_life', 'заклинания Жизни')|E] Осириса и могли бы дать некоторые полезные сведения, если бы у нас был к ним доступ и знания для его использования. $spell_of_life_stage1_do_multiple_stages$ $spell_of_life_stage1_warning$"
 spell_of_life_stage1_cabirus_phase1_decision_alt_desc: "Тайные письмена Кабира когда-то представляли собой полную, но плохо переведённую версию оригинальной книги Кабира. Перед своим разрушением они описывали внутреннюю работу [Concept('POD_spell_of_life', 'заклинания Жизни')|E] Осириса и могли бы дать некоторые полезные сведения, поэтому Гор позаботился об их уничтожении.\n\nХотя оригинальная рукопись утеряна, фрагменты сохранились в виде истлевших папирусов, повреждённых пергаментов, палимпсестов, выдержек на черепках, надписей на разрушающихся зданиях, устных записей, учебников магов и лекционарии, комментарии и записанные дебаты. Если будет собрано достаточное количество материалов, правильная текстовая критика может позволить реконструировать сочинения Кабира. $spell_of_life_stage1_do_multiple_stages$"
 spell_of_life_stage1_cabirus_phase1_decision_tooltip: "Если бы мы могли перевести сочинения Кабира, мы могли бы получить некоторое представление."
 # Those are accurate translations for that bohairic coptic word, though I did have to transliterate it into latin characters to be displayed properly
 spell_of_life_stage1_cabirus_phase1_decision_confirm: "Означает ли «эбол» «выход» или «смерть»?"
 spell_of_life_stage1_cabirus_phase1_decision_alt_confirm: "Мало какие знания утрачены безвозвратно."
 spell_of_life_stage1_cabirus_phase1_decision_writing_access: "[GetPODArtifactName('writings_cabirus_link')] находится в вашей досягаемости"
 spell_of_life_stage1_cabirus_phase1_decision_university: "В одном из ваших [Concept('counties', 'графств')|E] находится [Concept('building', 'постройка')|E] университета, [GetBuilding('black_college_01').GetName], [GetBuilding('library_malta_01').GetName], [GetBuilding('vienna_chantry_01').GetName], [GetBuilding('erciyes_01').GetName] или одно из их улучшений"

 request_access_writings_cabirus_decision: "Попросить доступ к тайным письменам Кабира"
 request_access_writings_cabirus_decision_desc: "Чтобы продолжить наши исследования способов вечного возрождения, нам придётся заглянуть в тайные письмена Кабира. К счастью, мы можем либо убедить их нынешнего владельца, либо использовать наше влияние, чтобы потребовать доступа. Однако за это могут потребовать плату."
 request_access_writings_cabirus_decision_tooltip: "Возможно, мы могли бы запросить доступ, а не украсть их"
 request_access_writings_cabirus_decision_confirm: "Узнаем цену"
 request_access_writings_cabirus_decision_effect: "Вам станут доступны [GetPODArtifactName('writings_cabirus_link')]"

 spell_of_life_stage1_cabirus_phase2_decision: "Поговорить с Кабиром"
 spell_of_life_stage1_cabirus_phase2_decision_desc: "Книги не могут конкурировать с первоначальным автором. Если бы [GetScriptedCharacterByHistoryID('792600').GetFirstName] согласился помочь нам благодаря обращению к его академической стороне, мы могли бы многое узнать о [Concept('POD_spell_of_life', 'заклинании Жизни')|E]. При этом нам нужно больше узнать о магии, если мы надеемся понять его уроки."
 spell_of_life_stage1_cabirus_phase2_decision_tooltip: "Книги не могут конкурировать с оригиналом."
 spell_of_life_stage1_cabirus_phase2_decision_confirm: "Поговорим с ним"

 spell_of_life_stage1_cabirus_phase3_decision: "Ослабить давление"
 spell_of_life_stage1_cabirus_phase3_decision_desc: "Ближайшие тремеры отнимают слишком много времени Кабира в своих поисках бессмертия, заставляя его постоянно передвигаться. Если бы мы ослабили их влияние, у него могло бы быть больше времени, чтобы помочь нам, хотя его беспокойство по поводу Гора не позволит ему дать нам полное заклинание Жизни."
 spell_of_life_stage1_cabirus_phase3_decision_tooltip: "Кабир находится под слишком сильным давлением со стороны тремеров"
 spell_of_life_stage1_cabirus_phase3_decision_confirm: "Вернёмся к нашим урокам"
 spell_of_life_stage1_cabirus_phase3_decision_no_emperor_requirement: "Ни один #TOOLTIP:GAME_TRAIT,tremere,[GetNullCharacter] #L тремер#!#! или последователь #L [GetReligionByKey('codeoftremere_religion').GetName|l]ой#! [Concept('faith', 'конфессии')|E] не должен владеть [Concept('title', 'титулом')|E] ранга империи"
 spell_of_life_stage1_cabirus_phase3_decision_effect: "Со временем вы можете попасть в [UmbraGlossary('hades')] благодаря вашим отношениям"

 spell_of_life_stage1_setite_phase1_decision: "Первые эксперименты в перерождении"
 spell_of_life_stage1_setite_phase1_decision_desc: "Хотя существует множество способов достижения вечного возрождения, [Concept('POD_spell_of_life', 'заклинание Жизни')|E] — проверенный подход. Хотя всем остальным оно было подарено, такие дары — не единственный способ его получить. Как Сет и другие пытались до вас, при наличии достаточного количества экспериментов и подопытных мы могли бы провести постижение самостоятельно. $spell_of_life_stage1_do_multiple_stages$ $spell_of_life_stage1_warning$"
 spell_of_life_stage1_setite_phase1_decision_tooltip: "Эксперименты будут продолжаться, пока мое моральное состояние не улучшится"
 spell_of_life_stage1_setite_phase1_decision_bean_nighe_caul: "Должен быть экипирован артефакт $artifact_bean_nighe_caul_name$"
 spell_of_life_stage1_setite_phase1_decision_confirm: "Начнём эксперименты..."
 spell_of_life_stage1_setite_phase1_decision_mummy_prisoner: "У вас есть хотя бы #color_white 1#! [Concept('prisoner', 'пленник')|E] со свойством «[GetTrait('mummy').GetName(GetNullCharacter)]»."
 spell_of_life_stage1_setite_phase1_decision_sorcery_prisoner: "У вас есть хотя бы #color_white 5#! [Concept('prisoners', 'пленников')|E], которые #italic могут#! научиться #TOOLTIP:GAME_TRAIT,sorcerer,[GetNullCharacter] #L чародейству#!#! #weak ([GetTrait('bastet').GetName(GetNullCharacter)] или [Concept('mortal_like_splats', 'смертные виды')|E])#!"
 spell_of_life_stage1_setite_phase1_decision_execution_effect: "Все пленники, использованные для наших экспериментов, умрут"

 spell_of_life_stage1_setite_phase2_decision: "Созвать Совет"
 spell_of_life_stage1_setite_phase2_decision_desc: "Погоня за [Concept('POD_spell_of_life', 'заклинанием Жизни')|E] — непростая задача, требующая огромного внимания. Если бы мы могли заручиться поддержкой наших товарищей, у нас было бы больше времени и ресурсов, которые можно было бы посвятить нашим усилиям. Даже обещания невмешательства было бы достаточно."
 spell_of_life_stage1_setite_phase2_decision_tooltip: "Возможно, мы могли бы получить помощь или, по крайней мере, предотвратить вмешательство"
 spell_of_life_stage1_setite_phase2_decision_confirm: "Собрать их!"
 spell_of_life_stage1_setite_phase2_decision_house_head: "#color_white Вы#! возглавляете #color_white свой#! [Concept('house', 'дом')|E]"
 spell_of_life_stage1_setite_phase2_decision_dynasty_members: "Хотя бы #color_white 5#! членов вашей [Concept('dynasty', 'династии')|E] должны владеть землями"
 spell_of_life_stage1_setite_phase2_decision_faith_members: "Хотя бы #color_white 5#! последователей вашей [Concept('faith', 'конфессии')|E] должны владеть землями"
 spell_of_life_stage1_setite_phase2_decision_debate: "Если у вас есть хотя бы #color_white 5#! членов вашей [Concept('dynasty', 'династии')|E] или [Concept('faith', 'конфессии')|E], вы пригласите их на совет."

 spell_of_life_stage1_setite_phase3_decision: "Расширенные эксперименты в перерождении"
 spell_of_life_stage1_setite_phase3_decision_desc: "Мы приближаемся к следующему этапу понимания. Однако кое-что об основах заклинания Жизни до сих пор ускользает от нас. Очевидно, что нам нужно больше текстов, больше ресурсов и больше испытуемых. Но цена несущественна. Что такое несколько жизней по сравнению со всей вечностью, моей вечностью."
 spell_of_life_stage1_setite_phase3_decision_tooltip: "При достаточном количестве испытаний и избытке жизней, которые можно потратить, даже невозможное становится правдоподобным."
 spell_of_life_stage1_setite_phase3_decision_confirm: "Продолжим эксперименты..."
