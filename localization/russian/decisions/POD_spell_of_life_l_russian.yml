 spell_of_life_stage1_setite_phase3_decision_big_3_prisoner: "#color_white Любой#! из следующих персонажей должен находиться в вашей темнице: [GetScriptedCharacterByHistoryID('792600').GetFirstName], [GetScriptedCharacterByHistoryID('792593').GetFirstName], [GetScriptedCharacterByHistoryID('790512').GetFirstName] или другой персонаж, знающий полное заклинание Жизни."
 spell_of_life_stage1_setite_phase3_decision_big_3_prisoner_no_mummies: "#color_white Любой#! из следующих персонажей должен находиться в вашей темнице: [GetScriptedCharacterByHistoryID('790512').GetFirstName] или другой персонаж, знающий полное заклинание Жизни."
 spell_of_life_stage1_setite_phase3_decision_fallback_prisoner: "#color_white Любой#! из следующих персонажей должен находиться в вашей темнице: [GetScriptedCharacterByHistoryID('792870').GetFirstName], [GetScriptedCharacterByHistoryID('792804').GetFirstName], [GetScriptedCharacterByHistoryID('792605').GetFirstName], [GetTrait('ferryman').GetName(GetNullCharacter)|l] или другой персонаж, знающий полное заклинание Жизни."
 spell_of_life_stage1_setite_phase3_decision_fallback_prisoner_no_mummies: "#color_white Любой#! из следующих персонажей должен находиться в вашей темнице: [GetScriptedCharacterByHistoryID('792870').GetFirstName], [GetTrait('ferryman').GetName(GetNullCharacter)|l] или другой персонаж, знающий полное заклинание Жизни."
 spell_of_life_stage1_setite_phase3_bonus_xp: "Ваши обширные эксперименты приносят #color_white 1.00#! ед. дополнительного пассивного [Concept('trait_level_track_xp', 'опыта')|E] заклинания Жизни #weak ([GetTrait('eternal_rebirth_seeker').GetName( GetPlayer )])#!"

 spell_of_life_stage4_warning: "\n\n#warning Ваши шансы на успех в этих поисках абсурдно низки. Не пытайтесь сделать это, если вы заботитесь о благополучии своего персонажа.\nДаже сохранение и загрузка игры ради удачного исхода вас не спасут.\nВас предупредили.#!"
 spell_of_life_stage4_amenti_decision: "Сделать Аменти своим домом"
 spell_of_life_stage4_amenti_decision_desc: "Последним шагом к созданию [Concept('POD_spell_of_life', 'заклинания Жизни')|E] является привязка заклинания к пространству внутри [UmbraGlossaryLocalized('shadowlands','Загробного мира')], чтобы наши души могли обитать там до тех пор, пока не возродятся заново. В то время как другим, возможно, придётся выкроить своё собственное пространство, наши хорошие отношения с Первой династией Бессмертных и их сторонниками, такими как Кеминтири, предоставили более легкую альтернативу. Если бы мы могли отправиться в [UmbraGlossaryLocalized('dark_kingdom_of_sand','Аменти')], мы могли бы встретиться с агентами Осириса и убедить их предоставить нам дом в [UmbraGlossaryLocalized('dark_kingdom_of_sand','Аменти')].\n\n#warning Этот последний этап несёт в себе некоторую опасность, и судьи Маат дадут вам только один шанс высказать свои аргументы.#!"
 spell_of_life_stage4_amenti_decision_tooltip: "Возможно, мы сможем найти дом в [UmbraGlossaryLocalized('dark_kingdom_of_sand','Аменти')]"
 spell_of_life_stage4_amenti_decision_confirm: "Откройте дверь!"
 spell_of_life_stage4_amenti_decision_wraith_friends: "Вы поддерживаете [Concept('friends', 'дружбу')|E] или другие положительные [Concept('relations', 'отношения')|E] хотя бы с 2 #TOOLTIP:GAME_TRAIT,wraith,[GetNullCharacter] #L призраками#!#!"
 spell_of_life_stage4_amenti_decision_control_land: "Вы [Concept('hold', 'контролируете')|E] как минимум #Z [SCOPE.ScriptValue('POD_mummy_lands_of_faith_target_percent_value')|0]%#! [Concept('counties', 'графств')|E] в [Concept('region', 'регионе')|E] [GetGeographicalRegion('pod_lands_of_faith').GetName] (Текущее значение: [SCOPE.ScriptValue('POD_mummy_lands_of_faith_percent_value')|0]%)\n"
 spell_of_life_stage4_amenti_decision_underworld_access: "Вы или ваш [Concept('friend', 'друг')|E], [Concept('lover', 'любовник')|E], член [Concept('coterie', 'котерии')|E], связанный призрак или связанный демон имеют $underworld_access$"

 spell_of_life_stage4_hades_decision: "Расширить и стабилизировать Аид"
 spell_of_life_stage4_hades_decision_desc: "Последним шагом к созданию [Concept('POD_spell_of_life', 'заклинания Жизни')|E] является привязка заклинания к пространству внутри [UmbraGlossaryLocalized('shadowlands','Загробного мира')], чтобы наши души могли обитать там до тех пор, пока не возродятся заново. После ваших усилий по оказанию ему помощи, Кабир согласился позволить вам использовать [UmbraGlossary('hades')] в качестве нашего [UmbraGlossaryLocalized('shadow_realm','мира теней')]. Это избавит от необходимости выделять собственное пространство для заклинания Жизни. Однако [UmbraGlossary('hades')] не так стабилен, как египетский [UmbraGlossaryLocalized('dark_kingdom_of_sand','Аменти')], и вызывает серьёзные проблемы при воскрешении после смерти. Такие проблемы будут только усугубляться увеличением количества жильцов, как только вы начнете его использовать. Если вы надеетесь использовать [UmbraGlossary('hades')], вам нужно будет улучшить это измерение.$spell_of_life_stage4_warning$"
 spell_of_life_stage4_hades_decision_tooltip: "Возможно, мы сможем найти дом в [UmbraGlossaryLocalized('hades','Аиде')]."
 spell_of_life_stage4_hades_decision_confirm: "Наточите свои мечи!"
 spell_of_life_stage4_hades_decision_pomegranate: "[GetPODArtifactName('pomegranate_link')] принадлежит вам"

 spell_of_life_stage4_custom_decision: "Создать новое измерение"
 spell_of_life_stage4_custom_decision_desc: "Последним шагом к созданию [Concept('POD_spell_of_life', 'заклинания Жизни')|E] является привязка заклинания к пространству внутри [UmbraGlossaryLocalized('shadowlands','Загробного мира')], где ваши души будут находиться до тех пор, пока они не возродятся заново. Поскольку у вас нет союзников с собственными [UmbraGlossaryLocalized('shadow_realm','мирами теней')], вам придётся выкроить собственное пространство для заклинания Жизни. Это будет сложно, так как против вас выступит [Concept('umbra', 'Умбра')|E] и все её обитатели.$spell_of_life_stage4_warning$"
 spell_of_life_stage4_custom_decision_tooltip: "Возможно, мы сможем создать новый [UmbraGlossaryLocalized('shadow_realm','мир теней')]"
