 spell_of_life_abandon_vampirism_decision_sol_knower: "Хотя бы #color_white 1#! [Concept('courtier', 'придворный')|E] должен знать заклинание Жизни или эликсир Вечной жизни"
 spell_of_life_abandon_vampirism_decision_sol_knower_ex: "$spell_of_life_abandon_vampirism_decision_sol_knower$ #weak ([mummy_maker.GetFirstName])#!"
 spell_of_life_abandon_vampirism_decision_wraith_summoner: "Хотя бы #color_white 1#! [Concept('courtier', 'придворный')|E] может призвать призрака."
 spell_of_life_abandon_vampirism_decision_wraith_summoner_ex: "$spell_of_life_abandon_vampirism_decision_wraith_summoner$ #weak ([wraith_maker.GetFirstName])#!"
 POD_newborn_mummy_modifier: "Новорождённая мумия"
 POD_newborn_mummy_modifier_desc: "#help Будет потеряно после смерти#!\nВы новичок в мире #TOOLTIP:GAME_TRAIT,mummy,[GetNullCharacter] #L мумий#!#!. Вы ещё не прошли цикл перерождения и не провели много времени в своей новой форме."

 spell_of_life_give_to_horus_decision: "Передать заклинание Жизни Гору"
 spell_of_life_give_to_horus_decision_desc: "Шестой принцип Кодекса Гора запрещает использование заклинания Жизни или создание новых мумий. Если бы вы были [Select_CString(ROOT.Char.IsFemale, 'верной последовательницей', 'верным последователем' )] Гора, вы бы передали ему все свои исследования и позволили бы ему удалить знания из ваших воспоминаний. Такой подарок, скорее всего, искупит вас в его глазах за любые совершенные вами запрещённые действия. Кроме того, Гор всегда награждал великие дела в соответствии с оказанными услугами."
 spell_of_life_give_to_horus_decision_confirm: "Попросить аудиенцию"
 spell_of_life_give_to_horus_decision_tooltip: "Верные шемсу-геру откажутся от заклинания Жизни"
 spell_of_life_decision_must_know_sol: "Знает полное заклинание Жизни #weak (Имеет 100 [Concept('trait_level_track_xp', 'опыта пути развития')|E] «$trait_track_spell_of_life$» свойства «[GetTrait('eternal_rebirth_seeker').GetName(GetNullCharacter)]»)#!"

 spell_of_life_give_to_kemintiri_decision: "Использовать заклинание Жизни на Кеминтири"
 spell_of_life_give_to_kemintiri_decision_desc: "Когда-то Кеминтири была жрицей Исиды, но Сет обратил её только для того, чтобы наказать её за верность. С того момента она провела значительное количество времени в охоте на сетитов. Верная учению Исиды, она не желала отдать вам заклинание Жизни только ради себя. Однако, учитывая вашу дружбу с ней и ваши новые знания о заклинании, не составит труда убедить её позволить вам наложить на неё заклинание Жизни."
 spell_of_life_give_to_kemintiri_decision_confirm: "Побеседуем с последней жрицей Исиды."
 spell_of_life_give_to_kemintiri_decision_tooltip: "Становление некогда было для Кеминтири пыткой. Возможно, она заинтересуется способом избавиться от вампиризма"

 spell_of_life_give_to_set_decision: "Передать заклинание Жизни Сету"
 spell_of_life_give_to_set_decision_desc: "Сет провёл тысячелетия в поисках заклинания Жизни и придумал невероятное количество заговоров, чтобы украсть его. Там, где он потерпел неудачу, вы преуспели и теперь у вас есть возможность дать ему это. Если вы достаточно услужливы, он будет вам благодарен и щедро вознаградит вас, а не накажет из ревности."
 spell_of_life_give_to_set_decision_confirm: "Я слуга Сета"
 spell_of_life_give_to_set_decision_tooltip: "Сет ищет заклинание Жизни, и у вас есть возможность отдать его ему."

 spell_of_life_give_to_apophis_decision: "Преподнести мир на золотом блюдце"
 spell_of_life_give_to_apophis_decision_desc: "[UmbraGlossaryLocalized('oblivion','Апофис')] ищет заклинание Жизни. Подайте заклинание на пиру и наблюдайте, как мир поглощается магией заклинания Жизни. Пришло время [UmbraGlossaryLocalized('oblivion','Апофису')] насладиться миром."
 spell_of_life_give_to_apophis_decision_confirm: "Конец наступил"
 spell_of_life_give_to_apophis_decision_tooltip: "Пир Апофиса"
 spell_of_life_give_to_apophis_decision_prisoners: "У вас должно быть хотя бы #color_white 25#! пленников с не менее чем #color_white 50#! ед. [Concept('prowess', 'доблести')|E], чтобы полакомиться ими"

 spell_of_life_find_new_home_decision: "Найти новый дом"
 spell_of_life_find_new_home_decision_desc: "После долгих исследований вы получили версию заклинания Жизни. Однако оно предназначено для привязки душ к другому [UmbraGlossaryLocalized('shadow_realm','миру теней')], отличному от того, куда вы отправляетесь после смерти. Хотя вы не можете модифицировать заклинание Жизни, чтобы использовать тот же [UmbraGlossaryLocalized('shadow_realm','мир теней')], что и ваша собственная душа, у вас должна быть возможность повторно привязать свою душу к другому миру, наложив на себя заклинание Жизни с небольшой модификацией."
 spell_of_life_find_new_home_decision_confirm: "К новым начинаниям!"
 spell_of_life_find_new_home_decision_tooltip: "Ваше заклинание Жизни связано с другим миром теней, отличным от вашей собственной души."

 spell_of_life_stabilize_new_realm_decision: "Стабилизировать [GetPlayer.Custom('PODGetCustomMummyDynastyShadowRealm')]"
 spell_of_life_stabilize_new_realm_decision_desc: "В отличие от более устоявшегося [UmbraGlossaryLocalized('dark_kingdom_of_sand','Аменти')], вашему недавно созданному [UmbraGlossaryLocalized('shadow_realm','миру теней')] не хватает стабильности. Воскрешение — опасное путешествие со многими рисками. Без судей могут появляться новые Бессмертные и действовать без надзора. [GetPlayer.Custom('PODGetCustomMummyDynastyShadowRealm')] нуждается в стабилизации."
 spell_of_life_stabilize_new_realm_decision_confirm: "Я возьму судейский молоток"
 spell_of_life_stabilize_new_realm_decision_tooltip: "Наше место для покоя"
 spell_of_life_stabilize_new_realm_decision_wraith_friends: "Вы поддерживаете [Concept('friends', 'дружбу')|E] или другие положительные [Concept('relations', 'отношения')|E] хотя бы с 5 #TOOLTIP:GAME_TRAIT,wraith,[GetNullCharacter] #L призраками#!#!"
 spell_of_life_stabilize_new_realm_decision_faith_followers: "[GetFaithByKey('custom_mummy_dynasty').GetAdjective] имеет как минимум 10 последователей"
 spell_of_life_stabilize_new_realm_decision_effect1: "Все #TOOLTIP:GAME_TRAIT,mummy,[GetNullCharacter] #L мумии#!#! из династии [GetTrait('custom_mummy_dynasty').GetName(GetPlayer)] больше не будут терять воспоминания в двойном размере после смерти"
 spell_of_life_stabilize_new_realm_decision_effect2: "Все #TOOLTIP:GAME_TRAIT,mummy,[GetNullCharacter] #L мумии#!#! из династии [GetTrait('custom_mummy_dynasty').GetName(GetPlayer)] получат свойство «[GetTrait('integrity').GetName(GetNullCharacter)]»"

 spell_of_life_preserving_roots_decision: "Защитить наши корни"
 spell_of_life_preserving_roots_decision_desc: "[GetPlayer.Custom('PODGetCustomMummyDynastyShadowRealm')] основан на определённой культуре в пределах определённой земли, придав эти характеристики династии [GetTrait('custom_mummy_dynasty').GetName(GetPlayer)] и необратимо привязав [UmbraGlossaryLocalized('shadow_realm','мир теней')] к этой конкретной культурной памяти. Однако с каждым годом то, что когда-то было великой цивилизацией, постепенно теряется в песках времени. Мы не можем этого допустить, поскольку именно наши воспоминания делают нас людьми и сохраняют наш новый дом."
 spell_of_life_preserving_roots_decision_confirm: "Остаться в памяти смертных"
 spell_of_life_preserving_roots_decision_tooltip: "Придать сил сердцам"
 spell_of_life_preserving_roots_decision_custom1: "Не менее #V 10#! графств должны иметь вашу [Concept('culture', 'культуру')|E]"
 spell_of_life_preserving_roots_decision_custom2: "Должно быть не менее #V 5#! правителей-#TOOLTIP:GAME_TRAIT,mummy,[GetNullCharacter] #L мумий#!#! с вашей [Concept('culture', 'культурой')|E]"
 spell_of_life_preserving_roots_decision_effect1: "#TOOLTIP:GAME_TRAIT,mummy,[GetNullCharacter] #L Мумии#!#! из династии [GetTrait('custom_mummy_dynasty').GetName(GetPlayer)] станут воскресать в два раза быстрее #weak (5 лет вместо 10)#!"

 spell_of_life_establish_ourselves_decision: "Пятая династия"
 spell_of_life_establish_ourselves_decision_desc: "Мы заново открыли для себя заклинание Жизни. Мы создали новый [UmbraGlossaryLocalized('shadow_realm','мир теней')], [GetPlayer.Custom('PODGetCustomMummyDynastyShadowRealm')]. Мы основали династию [GetTrait('custom_mummy_dynasty').GetName(GetPlayer)] на основе этого заклинания, базирующегося в этом измерении. Однако шемсу-геру, ишмаэлиты, кабириты и апепну считают нас не более чем выскочками, вмешивающимися в игру, которую мы слишком молоды, чтобы понять.\n\nКак мало они знают. Мы превзойдём древних глупцов. Мы докажем, что достойны быть причисленными к их числу!"
 spell_of_life_establish_ourselves_decision_confirm: "Мы - Пятая династия!"
 spell_of_life_establish_ourselves_decision_tooltip: "Сегодня - выскочки. Завтра - победители!"
 spell_of_life_establish_ourselves_decision_custom1: "Не менее #V 25#! графств должно принадлежать к #L [GetFaithByKey('custom_mummy_dynasty').GetName|l]ой#! [Concept('faith', 'конфессии')|E]"
 spell_of_life_establish_ourselves_decision_custom2: "Должно быть не менее #V 5#! правителей-#TOOLTIP:GAME_TRAIT,mummy,[GetNullCharacter] #L мумий#!#! из династии [GetTrait('custom_mummy_dynasty').GetName(GetPlayer)]"
 spell_of_life_establish_ourselves_decision_effect1: "Все #TOOLTIP:GAME_TRAIT,mummy,[GetNullCharacter] #L мумии#!#! из династии [GetTrait('custom_mummy_dynasty').GetName(GetPlayer)] получат модификатор «[GetModifier('custom_mummy_dynasty_secured_future_modifier').GetNameWithTooltip]»"

 spell_of_life_joining_the_league_decision: "Вступить в Лигу"
 spell_of_life_joining_the_league_decision_desc: "Несмотря на поддержку его дела, Гор не простит вашего существования. Однако существуют альтернативы.\n\nКогда он в последний раз отсутствовал какое-то время, его последователи поддались скверне и начали проигрывать войну. Если это произойдёт снова, они встретят вас с распростёртыми объятиями, а по возвращении Гор, возможно, не захочет вас изгонять. Возможно, вы могли бы ускорить такие дела."
 spell_of_life_joining_the_league_decision_confirm: "Благодарим за радушие"
 spell_of_life_joining_the_league_decision_tooltip: "Нам следует рассмотреть возможность вступления в Осирианскую лигу"
 spell_of_life_joining_the_league_decision_custom1: "Не должно быть #TOOLTIP:GAME_TRAIT,mummy,[GetNullCharacter] #L мумий#!#! [GetTrait('shemsuheru').GetName(GetPlayer)] с #L [GetFaithByKey('code_of_horus').GetName|l]ой#! [Concept('faith', 'конфессией')|E], чьё [Concept('opinion', 'мнение')|E] о вас ниже #V 25#!"
 spell_of_life_joining_the_league_decision_custom1_ex: "$spell_of_life_joining_the_league_decision_custom1$ #weak ([example.GetFirstName])#!"

 spell_of_life_ending_the_hunt_decision: "Завершить охоту"
 spell_of_life_ending_the_hunt_decision_desc: "Слишком многие жаждут получить вашу голову, ваши знания или и то, и другое. Если бы вы могли устранить лидеров самых могущественных фракций и большинство искателей, вы могли бы положить конец этой угрозе своему существованию. Вам больше не придётся постоянно оглядываться через плечо, ожидая, пока следующая группа выследит вас. В качестве дополнительного преимущества смерть таких ключевых фигур повергнет их фракции в хаос, оставив вам возможность укрепить свою власть."
 spell_of_life_ending_the_hunt_decision_confirm: "Наконец-то покой..."
 spell_of_life_ending_the_hunt_decision_tooltip: "Может ли охота наконец закончиться?"
 spell_of_life_ending_the_hunt_decision_custom1: "Не должно быть #TOOLTIP:GAME_TRAIT,eternal_rebirth_seeker,[GetNullCharacter] #L искателей заклинания Жизни#!#!, которые не являются #TOOLTIP:GAME_TRAIT,mummy,[GetNullCharacter] #L мумиями#!#!, не являются безмозглыми и не являются вашими [Concept('friend', 'друзьями')|E], [Concept('best_friend', 'лучшими друзьями')|E], членами [Concept('coterie', 'котерии')|E], [Concept('lover', 'любовниками')|E] или [Concept('soulmate', 'родственными душами')|E]"
 spell_of_life_ending_the_hunt_decision_custom1_ex: "$spell_of_life_ending_the_hunt_decision_custom1$ #weak ([example.GetFirstName])#!"
 spell_of_life_ending_the_hunt_decision_custom2: "У вас должно быть больше [Concept('prowess', 'доблести')|E], чем у #TOOLTIP:CHARACTER,[GetScriptedCharacterByHistoryID('505094').GetID] #L Нахтхорхеба#!#! #weak (#V [GetPlayer.GetProwess]#! против #V [GetScriptedCharacterByHistoryID('505094').GetProwess]#!)#!"
 spell_of_life_ending_the_hunt_decision_remove_eternally_hunted: "Все последователи вашей конфессии потеряют модификатор «[GetModifier('hunted_down_eternity_modifier').GetNameWithTooltip]»"

 spell_of_life_correcting_your_form_decision: "Исправить вашу форму"
 spell_of_life_correcting_your_form_decision_desc: "Вы получили увеличенную продолжительность жизни благодаря неполной форме магии, дарующей бессмертие. По мере расширения ваших знаний о магии появляется возможность исправить свою искажённую форму и улучшить текущий источник бессмертия. К сожалению, такая магия позволяет вам только улучшить свою собственную форму, а не улучшать несовершенные тела других."
 spell_of_life_correcting_your_form_decision_confirm: "Ничто не удержит меня"
 spell_of_life_correcting_your_form_decision_tooltip: "Ваше бессмертие нуждается в некоторых улучшениях"