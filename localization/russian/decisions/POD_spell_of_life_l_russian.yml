 spell_of_life_abandon_vampirism_decision: "Отказаться от вампиризма ради вечного возрождения"
 spell_of_life_abandon_vampirism_decision_desc: "Хотя вампиризм может иметь некоторые преимущества, он несёт в себе множество проклятий. Однако ваши знания предлагают альтернативную форму бессмертия, которая даёт меньше недостатков: вечное возрождение.\n\nК сожалению, нежить, подобная вампирам, не может стать мумией. Кроме того, вампиры не могут использовать магию, подобную заклинанию Жизни. Таким образом, вам нужно будет найти способ обойти такие проблемы... и определить, готовы ли вы это сделать. В конце концов, вы должны умереть во время ритуала, поэтому вам нужно будет найти доверенного человека для его выполнения.\n\n#warning Если вы выживете, вы станете мумией, что радикально изменит ваш игровой процесс, отключит ваши постройки и потенциально уничтожит ваши титулы державы.\n Это может нанести вред вашей кампании, если вы к этому не готовы.#!"
 spell_of_life_abandon_vampirism_decision.second_step: "Как я этого добьюсь?"
