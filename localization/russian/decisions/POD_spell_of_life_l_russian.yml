 spell_of_life_stage4_custom_decision_vassago_earring: "Владеть и экипировать [Concept('artifact', 'артефакт')|E] «[GetPODArtifactName('vassago_earring_link')]»"
 spell_of_life_stage4_custom_decision_elenas_mirror: "Владеть и экипировать [Concept('artifact', 'артефакт')|E] #TOOLTIP:artifact_elenas_mirror_description #L $artifact_elenas_mirror_name$#!#!"
