 ####### POD glossary

 glossary_clan_curse: "[Glossary('Проклятие клана', 'glossary_clan_curse_tt')]"
 glossary_clan_curse_tt: "Клановое проклятие - это сверхъестественная слабость, с которой сталкивается вампир в зависимости от принадлежности к [Glossary('клану','game_concept_Clan_desc')].\n\nЭти недостатки оказывают глубокое психологическое воздействие на нового вампира и часто заставляют его полностью изменить свое ночное существование. Однако некоторые кланы находят рациональное объяснение своему проклятию. Другие интерпретируют его как скрытый дар или побочный эффект великого просветления, или преимущество, позволяющее ввести себя в заблуждение.\n\nСогласно «Книге Нод», клановые проклятия являются результатом гнева Каина на #TOOLTIP:GAME_TRAIT,vampgeneration3,[GetNullCharacter] #L третье поколение#!#! после уничтожения #TOOLTIP:GAME_TRAIT,vampgeneration2,[GetNullCharacter] #L второго поколения#!#!."

 glossary_courts_of_love: "[Glossary('Дворы любви', 'glossary_courts_of_love_tt')]"
 glossary_courts_of_love_tt: "Дворы любви - это #TOOLTIP:GAME_TRAIT,vampire,[GetNullCharacter] #L вампирские#!#! владения и феодальный институт, который был создан французскими #TOOLTIP:GAME_TRAIT,toreador,[GetNullCharacter] #L тореадорами#!#!. Он состоит из множества Дворов любви, каждый из которых является владением могущественного тореадора.\n\nСамыми известными и влиятельными из этих дворов и их историческими владельцами были:\n$BULLET_WITH_TAB$Валуа, принадлежащая матриарху Салианне\n$BULLET_WITH_TAB$Шампань, принадлежащая королеве Элен «ла Жюст»\n$BULLET_WITH_TAB$Пуатье, принадлежащая королю Этьену де Пуатье\n$BULLET_WITH_TAB$Анжу, принадлежащая королеве Изуде де Блез\n$BULLET_WITH_TAB$Тулуза, принадлежащая королеве Эсклармонде"

 glossary_osirian_league: "[Glossary('Осирианская лига', 'glossary_osirian_league_tt')]"
 glossary_osirian_league_tt: "Осирианская лига - общество, посвятившее себя борьбе с [Glossary('Сетом','game_concept_antediluvian_desc')].\n\nВ него входят:\n$BULLET_WITH_TAB$[GetTrait('mokole').GetName(GetNullCharacter)] под властью Собека.\n$BULLET_WITH_TAB$#TOOLTIP:GAME_TRAIT,werewolf,[GetNullCharacter] #L Гару#! из племени Безмолвных странников.\n$BULLET_WITH_TAB$#TOOLTIP:GAME_TRAIT,bastet,[GetNullCharacter] #L Оборотни-коты#! Бубасти.\n$BULLET_WITH_TAB$#TOOLTIP:GAME_TRAIT,vampire,[GetNullCharacter] #L Вампирские#! Дети Осириса и последователи Анубиса.\n$BULLET_WITH_TAB$Смертные жрецы-чародеи из культа Исиды.\n$BULLET_WITH_TAB$Странствующие [GetTrait('eshu').GetName(GetNullCharacter)|l].\n$BULLET_WITH_TAB$Сами [GetTrait('shemsuheru').GetName(GetNullCharacter)|l]."


 glossary_khitta: "[Glossary('Хитта', 'glossary_khitta_tt')]"
 glossary_khittas: "[Glossary('Хитты', 'glossary_khitta_tt')]"
 glossary_khitta_tt: "В Каире проживает несколько фракций, объединённых в хитты - районы с нечётким определением, которые являются владениями определённого [Glossary('клана','game_concept_Clan_desc')] или рода. Эти районы обычно самоуправляемы, но в конечном итоге все они подчиняются султану или князю. Хотя в Каире преобладают мусульмане, лишь некоторые хитты связаны с [Glossary('Аширрой','game_concept_ashirra_desc')].\n\nХитты Аширры:\n$BULLET_WITH_TAB$Бану аль-Лам'а: Квартал Ласомбра.\n$BULLET_WITH_TAB$Бану Яшкур: Квартал Ассамитов.\n$BULLET_WITH_TAB$Бану аль-Хаджж: Квартал Носферату.\n$BULLET_WITH_TAB$Бану аль-Фен: Квартал Тореадоров. Эта хитта исторически известна как Бану Дюваль и была основана только после того, как тореадоры прибыли вместе с Наполеоном в Каир в 1798 году.\n\nДругие хитты:\n$BULLET_WITH_TAB$Бану аль ар-Райя: Квартал Истинных Бруха.\n$BULLET_WITH_TAB$Бану аль ас-Са'иди: Квартал Сетитов.\n$BULLET_WITH_TAB$Бану Замалек: Свободный квартал, где обосновались различные другие вампиры.\n$BULLET_WITH_TAB$Бану аль-Азрак: Квартал Вентру, возглавляемый Антонием и его потомками.\n$BULLET_WITH_TAB$Бану аль-Гиза: Квартал последователей Анубиса, расположенный недалеко от Каира."

 ###############
 #### Fera #####
 ###############
 glossary_fera: "[Glossary('Фера', 'glossary_fera_tt')]"
 glossary_fera_tt: "#bold Фера#! - одухотворённый народ, обладающий способностью превращаться в животных. Вервольфы - самые многочисленные и известные, но есть и много других видов.\n\nСогласно мифологии фера, они были созданы Геей, богиней-матерью всего живого, и каждому из них была отведена своя роль в защите её творений. Однако многие из них уклонились от выполнения своей задачи, будь то из-за апатии, цинизма или кровавых межплеменных конфликтов, и Гея становится всё более отдалённой.\n\nСледующие фера доступны для игры в [princes_of_darkness|E]:\n$BULLET_WITH_TAB$#TOOLTIP:GAME_TRAIT,werewolf,[GetNullCharacter] #L;bold Гару#!#! #weak (Вервольфы)#!\n$BULLET_WITH_TAB$#bold [GetTrait('bastet').GetName(GetNullCharacter)]#! #weak (Оборотни-коты)#!\n$BULLET_WITH_TAB$#bold [GetTrait('mokole').GetName(GetNullCharacter)]#! #weak (Оборотни-крокодилы и оборотни-драконы)#!"

 glossary_triat: "[Glossary('Триада', 'glossary_triat_tt')]"
 glossary_triat_tt: "Триада - это три величайшие сущности в духовной иерархии: [Glossary('Вильд', 'glossary_wyld_tt')], [Glossary('Ткачиха', 'glossary_weaver_tt')] и [Glossary('Вирм', 'glossary_wyrm_tt')].\n\nИзначально Триада находилась в равновесии. Вильд создал сырую материю, жизнь и дух, в то время как Ткачиха придала этим творениям форму и функции, а Вирм уничтожал их, чтобы освободить место для новых творений.\n\nОднако Триада больше не находится в равновесии. Ткачиха использует силу человечества - его городов, технологий, промышленности и науки - и стала сильнее, чем когда-либо прежде. Влияние Вильда ослабевает по мере того, как природные ресурсы разграбляются, дикие уголки мира уничтожаются, а природа вынуждена выполнять приказы человека. Однако самым опасным из всех является Вирм - он питается злом и разрушает без разбора."

 glossary_wyld: "[Glossary('Вильд', 'glossary_wyld_tt')]"
 glossary_wyld_tt: "#bold Вильд#! - один из трёх неисчислимо могущественных духов, составляющих [Glossary('Триаду', 'glossary_triat_tt')].\n\nВильд - это созидательная сила: он создаёт абсолютный хаос, которому [Glossary('Ткачиха', 'glossary_weaver_tt')] придаёт порядок, прежде чем он будет разрушен и возвращён в хаос [Glossary('Вирмом', 'glossary_wyrm_tt')]. В то время как двое других членов Триады сошли с ума, Вильд слабеет, его вытесняет Ткачиха и безрассудно уничтожает Вирм.\n\nВотчина Вильда - природа и её безудержный рост, который медленно уничтожается человечеством."

 glossary_weaver: "[Glossary('Ткачиха', 'glossary_weaver_tt')]"
 glossary_weaver_tt: "#bold Ткачиха#! - одна из трёх неисчислимо могущественных духов, составляющих [Glossary('Триаду', 'glossary_triat_tt')].\nФункция Ткачихи состояла в том, чтобы приводить в порядок творения [Glossary('Вильда', 'glossary_wyld_tt')], придавая им форму и функциональность на протяжении всего их существования, прежде чем они будут уничтожены [Glossary('Вирмом', 'glossary_wyrm_tt')], поддерживая баланс между созиданием и разрушением.\n\nСчитается, что Ткачиха в первую очередь виновата в нарушении равновесия среди Триады; Ткачиха устала от того, что её порядок разрушается Вирмом, и сплела свою паутину, чтобы заточить Вирма и положить конец его разрушениям. Это заточение свело Вирма с ума и заставило его начать уничтожать всё подряд, а не только тех, чьё время закончилось.\n\nАватары Ткачихи и её дети часто принимают облик пауков, а иногда и насекомых. Это покровительница закона, порядка, науки и техники. По мере того, как развивается человечество, развивается и Ткачиха."

 glossary_wyrm: "[Glossary('Вирм', 'glossary_wyrm_tt')]"
 glossary_wyrm_triatic: "[Glossary('Триадический Вирм', 'glossary_wyrm_tt')]"
 glossary_wyrm_hydra: "[Glossary('Гидра', 'glossary_wyrm_tt')]"
 glossary_wyrm_apep: "[Glossary('Апоп', 'glossary_wyrm_tt')]"
 glossary_wyrm_apophis: "[Glossary('Апофис', 'glossary_wyrm_tt')]"
 glossary_wyrm_tt: "#bold Вирм#! - один из трёх неисчислимо могущественных духов, составляющих [Glossary('Триаду', 'glossary_triat_tt')].\n\nЦелью Вирма было очистить и упорядочить всё Мироздание, способствуя его погружению в энтропию. Он достиг этого, уничтожив всё, что создаёт [Glossary('Вильд', 'glossary_wyld_tt')], и упорядочивает [Glossary('Ткачиха', 'glossary_weaver_tt')], завершив вечный цикл от рождения до смерти. Это был второй член [Glossary('Триады', 'glossary_triat_tt')], сошедший с ума. Когда [Glossary('Ткачиха', 'glossary_weaver_tt')] обезумела и начала окутывать всё вокруг паутиной, чтобы предотвратить разрушение своих творений, Вирма постепенно ограничивали, пока он больше не смог выполнять своё предназначение так, как хотел. Лишённый возможности делать то, для чего он был создан, он был доведён до состояния чистой ярости и безумия, одержимый идеей уничтожить всё, независимо от того, пришло ли назначенное время или нет.\n\nТеперь Вирм существует как Тёмный бог [Glossary('бедствий', 'glossary_wyrm_calamity_tt')], [Glossary('хвори', 'glossary_wyrm_consumption_tt')] и [Glossary('скверны', 'glossary_wyrm_corruption_tt')]."

 glossary_wyrm_calamity: "[Glossary('Зверь войны', 'glossary_wyrm_calamity_tt')]"
 glossary_wyrm_calamity_tt: "#bold Зверь войны#! или #bold Вирм Бедствия#! - первая из трёх голов [Glossary('Триадического Вирма', 'glossary_wyrm_tt')].\n\nЭто чудовище, исполненное бессмысленной ярости, готовое уничтожить всё на своём пути. Безграничная ярость питает его, и им руководят разрушительные инстинкты. Его приспешники варьируются от саморазрушающихся ударных отрядов, которые бросаются в бой, до огромных тварей, которые наслаждаются подавлением и уничтожением своих жертв.\n\nЭта голова напоминает любовь [Glossary('Вильда', 'glossary_wyld_tt')] к хаосу, но здесь это хаос, достигаемый с помощью разрушительного ужаса."

 glossary_wyrm_consumption: "[Glossary('Пожиратель душ', 'glossary_wyrm_consumption_tt')]"
 glossary_wyrm_consumption_tt: "#bold Пожиратель душ#!, или #bold Вирм хворей#!, является второй из трёх голов [Glossary('Триадического Вирма', 'glossary_wyrm_tt')].\n\nЭто воплощение снедающих его страстей - жадности, вожделения и обжорства. Некоторые из его приспешников утратили всякую силу воли; другие - целеустремлённые убийцы, которые преследуют то, что, как они по глупости думают, приведёт их к цели. Ненависть Пожирателя душ разрастается так же сильно, как болезнь, которая неумолимо разрушает заражённую плоть и подрывает рассудок.\n\nЭта голова аналогична стремлению [Glossary('Ткачихи', 'glossary_weaver_tt')] к объединению, но то, что делается здесь, - это не более чем объединение путём потребления и последующего переваривания."

 glossary_wyrm_corruption: "[Glossary('Вирм-Осквернитель', 'glossary_wyrm_corruption_tt')]"
 glossary_wyrm_corruption_tt: "#bold Вирм-Осквернитель#!, или #bold Вирм скверны#!, является третьей из трёх голов [Glossary('Триадического Змея', 'glossary_wyrm_tt')].\n\nЭто проявление всех существующих порочных побуждений и инстинктов. Коварный Вирм-Осквернитель тихо соблазняет своих жертв изнутри, нашёптывая искушения, которые охотно приводят его жертву в его пасть. Это змей в Эдемском саду, глупые амбиции падшего ангела, высокомерие #TOOLTIP:GAME_TRAIT,mage,[GetNullCharacter] #L мага#!#!, который призывает больше энергии, чем может контролировать, или самонадеянность [Glossary('фера', 'glossary_fera_tt')], который думает, что может управлять теми самыми духовными силами, которые неизбежно обрекут его на вечные муки.\n\nЭта голова аналогична изначальной функции Вирма как очистителя, но в мире смертных это существо способно лишь пожирать своих жертв неосязаемо, незаметно и изнутри, пока от них не останется лишь потемневшая оболочка, слишком осквернённая, чтобы жить."

 glossary_celestine: "[Glossary('Celestine', 'glossary_celestine_tt')]"
 glossary_celestine_tt: "The #bold Celestines#! are celestial spirits in the mythology of the [Glossary('Фера', 'glossary_fera_tt')]. Within the celestial hierarchy, they are just under Gaia and the [Glossary('Триада', 'glossary_triat_tt')]. Their power is equal to the ancient gods.\n\nA Celestine's true form is unimaginable. They are both sentient and highly intelligent. Communication and communion between Celestines and lesser beings are only possible through avatars. These avatars are aspects of themselves in guises lesser beings can understand. Each avatar contains a mere shard of the Celestine's true power, although it still makes them among the most powerful beings in the spirit world.\n\nThe Celestines dwell in the heavens. For every planet in our solar system, for every massive astronomical phenomenon, there is a spiritual presence that dwells in the spirit world, both as a manifestation in the [UmbraGlossary('aetherial_realm')] and in the cold, inimical, and uncaring madness of the [UmbraGlossary('deep_umbra')]."

 glossary_luna: "[Glossary('Luna', 'glossary_luna_tt')]"
 glossary_luna_seline: "[Glossary('Seline', 'glossary_luna_tt')]"
 glossary_luna_tt: "#bold Luna#!, also known as the Lambent Lady and Seline, is a [Glossary('Celestine', 'glossary_celestine_tt')], the spiritual embodiment of Earth's Moon.\n\nLuna is of deep importance to the #TOOLTIP:GAME_TRAIT,werewolf,[GetNullCharacter] #L Garou#!#!. She serves as their guide and patron. She is the source of their supernatural [Glossary('Rage', 'glossary_rage_tt')]. It is also her ever-shifting face that determines the Auspice of a werewolf when it is born.\n\nLuna acts as patron to most of the [Glossary('Фера', 'glossary_fera_tt')] as well, they however do not recieve her Lunar Auspices."

 glossary_helios: "[Glossary('Helios', 'glossary_helios_tt')]"
 glossary_helios_sun: "[Glossary('Sun', 'glossary_helios_tt')]"
 glossary_helios_lord_sun: "[Glossary('Lord Sun', 'glossary_helios_tt')]"
 glossary_helios_tt: "#bold Helios#! is a [Glossary('Celestine', 'glossary_celestine_tt')] and an embodiment of Earth's Sun. In contrast to his sister [Glossary('Luna', 'glossary_luna_tt')], he gives his blessing to only two of the [Glossary('Фера', 'glossary_fera_tt')].\n\nHelios was worshipped by the early [GetTrait('mokole').GetName(GetNullCharacter)] during the Age of Kings. He has not withdrawn his favor to them, and to this day, the weresaurians honor him. The [GetTrait('corax').GetName(GetNullCharacter)] are also his children and revere him through all their actions.\n\nThose patronized by Helios are vulnerable to gold, just as those patronized by Luna are vulnerable to silver. This makes the Mokolé vulnerable to both silver and gold. Corax on the other hand are only weak to gold, as their weakness to silver was stripped by Helios when he granted them his patronage."

 glossary_rage: "[Glossary('Rage', 'glossary_rage_tt')]"
 glossary_rage_tt: "#bold Rage#! is a mystical wellspring of primal anger granted to the [Glossary('Фера', 'glossary_fera_tt')] by [Glossary('Luna', 'glossary_luna_tt')]. It allows them to move at great speed, shrug off mighty wounds, and perform many other supernatural feats. This gift however also makes the Fera vulnerable to silver.\n\nSome of the Fera however do not possess Rage. The [GetTrait('ananasi').GetName(GetNullCharacter)] and [GetTrait('nuwisha').GetName(GetNullCharacter)] have no Rage and thus no weakness to silver. The [GetTrait('corax').GetName(GetNullCharacter)] do possess Rage, but their patron is $glossary_helios$ has shielded them from this vulnerability."

 glossary_werewolf_litany: "[Glossary('Litany', 'glossary_werewolf_litany_tt')]"
 glossary_werewolf_litany_tt: "The Litany is the code of laws kept by the #TOOLTIP:GAME_TRAIT,werewolf,[GetNullCharacter] #L Garou#!#!.\n\n#italic Combat the [Glossary('Вирм', 'glossary_wyrm_tt')] Wherever It Dwells and Whenever It Thrives\nRespect the Territory of Another\nSubmit to Those of Higher Station\nRespect Those of Lower Station, for All Are of Gaia\nThe First Share of the Kill for Greatest in Station\nEat Not the Flesh of Humans\nThe Veil Shall Not Be Lifted\nThe Leader May Be Challenged at Any Time During Peace\nThe Leader May Not Be Challenged During Wartime\nTake No Action That Causes a Caern to Be Violated#!"

 glossary_werewolf_dark_litany: "[Glossary('Dark Litany', 'glossary_werewolf_dark_litany_tt')]"
 glossary_werewolf_dark_litany_tt: "The Dark Litany is the code of laws kept by the [GetReligionByKey('blackspiraldancer_religion').GetName].\n\n#italic Serve the [Glossary('Вирм', 'glossary_wyrm_tt')] in All Its Forms\nBeware the Territory of Another\nSlay Those Who Will Not Join You\nRespect All Those Who Serve the Wyrm\nThe First Share of the Kill for the Greatest in Station\nAll that is not Forbidden is Permitted\nThe Veil Shall Not be Lifted\nThe Leader May Be Challenged at Any Time During Peace\nThe Leader May Not Be Challenged in Time of War\nTake No Action That Violates the Security of a Pit#!"

 glossary_bastet_karoush: "[Glossary('Karoush', 'glossary_bastet_karoush_tt')]"
 glossary_bastet_karoush_tt: "Karoush is the [GetTrait('bastet').GetName(GetNullCharacter)] code of laws.\n\n#italic Honor Yourself\nHonor Your Word\nHonor Your Kin and Kind\nHonor Your Earth\nHonor Your Silence#!"

 glossary_mokole_duties: "[Glossary('The Duties', 'glossary_mokole_duties_tt')]"
 glossary_mokole_duties_tt: "The Duties are the [GetTrait('mokole').GetName(GetNullCharacter)] code of laws.\n\n#italic Cull The Fallen\nLet No Shade Accuse You\nGuard the Wallow\nThe Veil Must Not Be Lifted\nTest the Clutch\nAll Are Of Gaia\nRemember#!"

