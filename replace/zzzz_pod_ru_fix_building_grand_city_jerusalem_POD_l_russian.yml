 building_jerusalem_christian_german_mary_04:0 "Крестовый бастион Святой Марии"
 building_jerusalem_christian_german_mary_04_desc:0 "Этот бастион предоставляет жилье огромному количеству тевтонских рыцарей, посвятивших себя продвижению миссии Креста посредством военной мощи и судебных усилий."
 building_jerusalem_christian_john_04:0 "Крестовый бастион Святого Иоанна"
 building_jerusalem_christian_john_04_desc:0 "Этот бастион предоставляет жилье огромному количеству рыцарей-госпитальеров, посвятивших себя выполнению миссии Креста посредством военной мощи и защиты всех паломников."
 building_jerusalem_christian_lazarus_04:0 "Крестовый бастион Святого Лазаря"
 building_jerusalem_christian_lazarus_04_desc:0 "Этот бастион предоставляет жилье огромному количеству прокаженных рыцарей, посвятивших себя продвижению миссии Креста посредством военной мощи и предоставления широкомасштабных медицинских услуг."
 building_jerusalem_christian_sepulchre_04:0 "Крестовый бастион Гроба Господня"
 building_jerusalem_christian_sepulchre_04_desc:0 "Этот бастион предоставляет жилье огромному количеству воинов Гроба Господня, посвятивших себя продвижению миссии Креста посредством военной мощи и вербовки простых людей для этого дела."
 building_jerusalem_christian_supreme_templar_04:0 "Крестовый бастион Верховного Ордена"
 building_jerusalem_christian_supreme_templar_04_desc:0 "Этот бастион предоставляет жилье огромному количеству рыцарей-тамплиеров, посвятивших себя выполнению миссии Креста посредством подавляющей военной мощи."
 building_jerusalem_jewish_castle_04:0 "Цитадель Давида"
 building_jerusalem_jewish_castle_04_desc:0 "Город Иерусалим слишком много раз за всю историю падал вражеским силам. После завершения строительства Цитадели Давида многие угрозы еврейскому Иерусалиму столкнутся с гораздо более серьезной проблемой, если они по глупости попытаются снова захватить город."
 building_jerusalem_jewish_demonology_01:0 "Синагога Тиферет Исраэль"
 building_jerusalem_jewish_demonology_01_desc:0 "Построенная на руинах времён Иудейского царства синагога Тиферет Исраэль стала местом, где преподают мистические искусства царя Соломона и раскрывают сокровенные тайны творения. В её тенях бродит странный человек, который живёт здесь столько, сколько кто-либо себя помнит."
 building_jerusalem_jewish_demonology_02:0 "Отреставрированная синагога Тиферет Исраэль"
 building_jerusalem_jewish_demonology_02_desc:0 "После недавней реконструкции синагога теперь стала местом, куда студенты приходят, чтобы познать более глубокие секреты магии. Некоторых даже отбирают для обучения у старого раввина, известного своими тонкими седыми волосами, что помогает ему в его исследованиях."
 building_jerusalem_jewish_demonology_03:0 "Украшенная синагога Тиферет Исраэль"
 building_jerusalem_jewish_demonology_03_desc:0 "Опираясь на искусство инфернализма, царь Соломон Мудрый нашел способ очистить свои ритуалы и заклинания, устранив опасность заражения. Такие знания составляют основу нашей нынешней магии и дают нам уникальные способности, которые другие могут счесть неестественными. Наши усилия только подкрепляются проницательностью местного раввина, раскрывающего истины, скрытые во многих текстах."
 building_jerusalem_jewish_demonology_04:0 "Освященная синагога Тиферет Исраэль"
 building_jerusalem_jewish_demonology_04_desc:0 "Говорят, что Священная Книга находится за пределами понимания смертных до прихода Мессии, когда он истолкует каждый отрывок, каждое слово, каждое пространство между буквами. Сама Тора является проектом творения, и только Второзаконие 32 содержит всю историю Израиля. На ее страницах заключены все тайны творения, тайны, которые мы изучаем под руководством раввина Авраама. Будь то гематрия, нотарикон, темура, числа, акростихи, кластеризация, макрокоды, равноотстоящие буквенные последовательности, анализ имен, стеганографический анализ, гептадический структурный анализ или что-то еще, каждый подход должен быть использован для обработки предоставленной нам скрытой информации."
 building_jerusalem_jewish_library_04:0 "Большая библиотека Иерусалима"
 building_jerusalem_jewish_library_04_desc:0 "Когда-то на полках Великой Александрийской библиотеки стояли греческие переводы Танаха. Теперь в Великой Иерусалимской библиотеке стоят переводы на иврит #italic «Государства»#! Платона и #italic «Энеиды»#! Вергилия, а рядом — полное собрание трудов о происхождении, природе и слабостях всех сотворённых существ, будь то живые, мёртвые или нежить."
 building_jerusalem_jewish_palace_04:0 "Королевский дворец"
 building_jerusalem_jewish_palace_04_desc:0 "Это сооружение, построенное на месте особняка в Еврейском квартале, который когда-то был резиденцией первосвященника Анны во времена царя Ирода, является мощным символом возвращения евреев в Иерусалим. Это поистине дворец и резиденция правительства, достойные царя, правящего из священного города Иерусалима."
 building_jerusalem_jewish_pools_04:0 "Бассейны Соломона"
 building_jerusalem_jewish_pools_04_desc:0 "На момент постройки эти три резервуара хранили почти 285 миллионов литров воды. Через 5 специальных акведуков они снабжали водой Вифлеем, Храмовую гору, дворец Ирода и многое другое. После завершения всех ремонтных работ вода снова течет в Иерусалим и удовлетворяет все наши потребности."
 building_jerusalem_muslim_al_khanqah_salahiyya_04:0 "Освященная мечеть Аль-Ханка ас-Салахия"
 building_jerusalem_muslim_al_khanqah_salahiyya_04_desc:0 "После недавнего повторного освящения и других улучшений эта мечеть поистине прославляет того, в честь кого названа: Салах ад-Дина Юсуфа ибн Айюба. В его время мечеть предоставляла жилье его офицерам и служила его личным духовным убежищем. Его наследие направляет будущих султанов и правителей при планировании будущего."
 building_jerusalem_muslim_al_yaqubi_04:0 "Освященная мечеть Аль-Якуби"
 building_jerusalem_muslim_al_yaqubi_04_desc:0 "После недавнего повторного освящения и других улучшений эта мечеть поистине прославляет того, в честь кого названа: Абу ль-Аббаса Ахмада бин Аби Якуба бин Джафара бин Вахба бин Вадиха аль-Якуби. Из её залов выходят многие исследователи и историки, которые помнят, как он записал множество басен эпохи Джахилии и подробную информацию о городах от Византийской империи до Китая."
 building_jerusalem_muslim_damascus_market_04:0 "Большой базар Дамаска"
 building_jerusalem_muslim_damascus_market_04_desc:0 "Большой базар Дамаска продает все, от импортных товаров до домашнего скота, и является финансовым сердцем Иерусалима. Иерусалим является центром, вокруг которого колеблется мировая торговля, а Большой базар Дамаска является центром этого центра."
 building_jerusalem_muslim_madrasa_04:0 "Освященное медресе Дхо 'л-Нун"
 building_jerusalem_muslim_madrasa_04_desc:0 "После недавнего повторного освящения и других улучшений это медресе поистине прославляет того, в честь кого названо: Дхо 'л-Нун аль-Мисри. Из его залов выходит множество студентов, готовых применить свои знания по светским, религиозным и мистическим темам."
 building_jerusalem_muslim_zawiya_04:0 "Посвященная Завия Ахмад"
 building_jerusalem_muslim_zawiya_04_desc:0 "После недавнего повторного освящения и других усовершенствований эта завия поистине прославляет того, в честь кого названа: Ахмада ибн Харба \"Сына войны\". Из её залов выходит организованная и преданная сила, готовая защищать и расширять эти земли."
 building_type_jerusalem_jewish_demonology_01:0 "$building_jerusalem_jewish_demonology_01$"
