l_russian:
 pod_setite_serpent_embrace.0001.a:0 "Сет награждает Своих терпеливых слуг."
 pod_setite_serpent_embrace.0001.desc:0 "Дело сделано.\n\nДолгое ухаживание наконец завершено. [target.GetFirstNameNoTooltip] пришел к вам сегодня вечером по собственному желанию, [target.GetHerHis], с пустыми глазами от тяжести каждой уверенности, которую вы терпеливо разрушали, каждого комфорта, который вы медленно отравляли, каждого удовольствия, которое вы держали вне досягаемости. [target.GetSheHe|U] преклонил колени, но не перед тобой, а перед истиной, которую ты нашептывал в их души ночь за ночью: что мир покинул их, что только мудрость Сета могла придать смысл их страданиям. \n\n[target.GetSheHe|U] произносит слова обращения с трепетным пылом переделанного. Змей не поражает свою добычу; он ждет, наблюдает и знает, что со временем добыча охотно заползет ему в рот. Вы чувствуете одобрение Сета, как прохладная чешуя на вашей спине, еще одна душа, затянутая в долгую извилистую тьму, еще одна лампа, потухшая в мире наверху. Слухи об этом обращении будут распространяться, и другие, кто считал [target.GetFirstNameNoTooltip] стойким, начнут задаваться вопросом, насколько стойкими они сами на самом деле являются. \n\nПуть Сета обрёл ещё одного последователя. Мир наверху становится немного темнее, а кольца великого змея становятся немного шире."
 pod_setite_serpent_embrace.0001.t:0 "Витки Змеи сжимаются"
 pod_setite_serpent_embrace.0002.a:0 "Истина Сета нашла меня. Я охотно пойду по темной дороге."
 pod_setite_serpent_embrace.0002.b:0 "Я не стану созданием Сета."
 pod_setite_serpent_embrace.0002.desc:0 "Прошли месяцы, а может и больше, с тех пор, как [scheme_owner.GetFirstNameNoTooltip] впервые пересек ваш путь. В то время вы ничего об этом не думали; случайная встреча, подарок вина, умный поворот разговора. Потом еще одна встреча. Потом письмо. Затем тихий вечер философии и смеха, который каким-то образом заставил вас усомниться в вещах, в которых вы никогда раньше не подвергали сомнению. \n\nСегодня вечером вы поймете. Сны, из-за которых ты просыпаешься с именем Сета на твоих губах. Аргументы вашей старой веры, которые внезапно кажутся пустыми, когда вы пытаетесь их изложить. Когда вы закрываете глаза, странная уверенность в том, что мир наверху — это светлая ложь, прикрывающая более глубокую и истинную тьму. \n\n[scheme_owner.GetFirstNameNoTooltip] снова здесь, и вы наконец понимаете, что делал [scheme_owner.GetSheHe]. Витки змеи уже вокруг вас. Вопрос не в том, обратишься ли ты, а в том, примешь ли ты это как просветление или будешь бороться за свободу от доктрины, которая уже наполовину забрала твою душу."
 pod_setite_serpent_embrace.0002.t:0 "Змеиный шепот"
