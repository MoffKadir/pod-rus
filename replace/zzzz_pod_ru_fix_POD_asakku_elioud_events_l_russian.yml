l_russian:
 POD_asakku.0205.a:0 "Найдите их."
 POD_asakku.0205.b:0 "Подстроить несчастный случай."
 POD_asakku.0205.desc:0 "Ваш начальник шпионской сети сообщил о незнакомце, задающем вопросы при дворах недалеко от Баку. Конкретные вопросы. Такой вопрос может задать только тот, кто знает, что искать. Незнакомец спрашивал о [GetTrait('vicissitude').GetName(GetNullCharacter)]."
 POD_asakku.0205.t:0 "Любопытное расследование"
 POD_asakku.0210.a:0 "Подготовьтесь к ним."
 POD_asakku.0210.desc:0 "Они приходят в большом количестве. Не убийца, а команда. Ваш начальник шпионской сети насчитывает как минимум три человека, и они двигаются вместе с такой дисциплиной, которая предполагает всю жизнь в такой работе. Они знают, где находится ваше убежище, и, что более важно, они знают, кто вы. Информаторы называют имя охотника- [GetTrait('POD_asakku_elioud').GetName(GetNullCharacter)], которого ваша сеть уже заметила. \n\nТерпеливый. Методичный. Опасный."
 POD_asakku.0210.t:0 "Фаланга: предупреждение"
 POD_asakku.0211.a:0 "Встречайте их со всем, что у вас есть. #weak (Доблесть)#!"
 POD_asakku.0211.a.grave:0 "Они почти схватили вас. Охотник-Элиуд уходит с чем-то, что можно продемонстрировать за свои усилия. Вы живы, но цена была тяжелой."
 POD_asakku.0211.a.grave.desc:0 "Они почти поймали вас"
 POD_asakku.0211.a.success:0 "Их лидер ломается первым. Остальные разбегаются. Вы стоите среди развалин своего собственного пристанища и, как ни странно, чувствуете что-то вроде удовлетворения, хотя уже и не уверены, принадлежит ли оно вам."
 POD_asakku.0211.a.success.desc:0 "Их лидер ломается. Остальные разбегаются"
 POD_asakku.0211.a.wounded:0 "Вы отбрасываете их, но охотник пускает кровь, прежде чем отступить. Они вернутся. Однако сегодня вы уцелели."
 POD_asakku.0211.a.wounded.desc:0 "Вы отбросили их назад"
 POD_asakku.0211.b:0 "Используйте сеть против них. #weak (Интрига)#!"
 POD_asakku.0211.b.failure:0 "Обман рушится. Охотник уже видел это раньше или что-то в этом роде. Вы сбегаете, но с трудом, и они точно знают, как вы мыслите."
 POD_asakku.0211.b.failure.desc:0 "Обман рушится"
 POD_asakku.0211.b.success:0 "Вы передаете зараженным ложную информацию, заманиваете камут не в то убежище и исчезаете прежде, чем они это осознают. К тому времени, когда они перегруппируются, вы уже находитесь в трех улицах от них и наблюдаете, как они объясняют друг другу, что пошло не так."
 POD_asakku.0211.b.success.desc:0 "Обман удался"
 POD_asakku.0211.c:0 "Исчезнуть. Пусть ничего не найдут. #weak (Бежать) #!"
 POD_asakku.0211.desc:0 "Они напали на убежище за час до рассвета. Охотник [GetTrait('POD_asakku_elioud').GetName(GetNullCharacter)] идёт впереди. Признак того, кто верит в правоту своего дела. Остальные удерживают выходы. \n\nУ вас есть секунды, чтобы выбрать, как вы это встретите."
 POD_asakku.0211.t:0 "Фаланга: Нападение"
 POD_asakku.0212.a:0 "Это все еще я. По большей части."
 POD_asakku.0212.b:0 "Мы выиграли. Я все еще решаю, подходящее ли это слово."
 POD_asakku.0212.c:0 "Теперь они знают, как я мыслю. И сущность тоже."
 POD_asakku.0212.d:0 "Я сделал правильный выбор."
 POD_asakku.0212.desc.fight_clean:0 "Фаланга пришла. Вы выжили. Вы сидите, пытаясь извлечь уроки из того, что произошло. Они знали, что ищут. У них были для этого названия, протоколы, годы практики по выявлению того, что живет в крови других. Они пришли специально за вами, и были компетентны, но всё равно проиграли. \n\nОдин из них, умирая, смотрел на вас без ненависти. Не без страха, а с чем-то вроде изнеможения. Для них это была работа. Необходимая работа. Вопрос, когда он прозвучал, не был обвинением. \n\n «Это всё ещё ты внутри?» \n\n Вы не ответили. Вы боитесь того, каким был бы ответ."
 POD_asakku.0212.desc.fight_grave:0 "Фаланга пришла. Вы едва выжили. Вы сидите, медленно отделяясь от бури, чтобы оценить, что произошло на самом деле. Они знали, что ищут. У них были для этого названия, протоколы, годы практики. Они почти схватили вас. \n\nЗа несколько мгновений до того, как ситуация изменилась, прошел отрезок времени, который вы не можете вспомнить. Разрыв, в котором что-то еще управляло телом, которое вы называете своим. Вы живы. Вы не совсем уверены, кого из вас благодарить за это. Возможно, вам следует беспокоиться об этом больше, чем вы в конечном итоге делаете."
 POD_asakku.0212.desc.fight_wounded:0 "Фаланга пришла. Вы отбросили их назад. Вы сидите наедине с тем, чего вам стоила эта ночь. Они знали, что ищут. У них были для этого названия, протоколы, годы практики. Они пролили кровь, прежде чем отступить, и вы провели часы до рассвета, оценивая ущерб, задаваясь вопросом, что было потеряно, что можно исцелить, а что нет. \n\n Ничто из этого не тревожило сущность внутри вас. Возможно, она была убеждена в вашей окончательной победе. Или, возможно, ей было всё равно."
 POD_asakku.0212.desc.fled:0 "Фаланга пришла. Вы выжили ценой, которая еще не подсчитана. Вы сидите с тем, что осталось, и воспоминаниями о событиях сегодняшнего вечера. Они знали, что ищут. У них были для этого названия, протоколы, годы практики по выявлению того, что живет в крови других. Сегодня вечером вы не дали им ничего найти. \n\nВы покинули убежище и двинулись быстро, без сантиментов, не оглядываясь назад. Голос в вашей крови все время молчал. Не одобряя решение. Не противодействуя этому. Просто присутствуя, как присутствует прилив. Терпеливость, не имеющая ничего общего с прощением. Для того, кто мог быть свидетелем начала всего сущего, ваше ничтожное «бессмертие» — капля в океане."
 POD_asakku.0212.desc.intrigue_failed:0 "Фаланга пришла. Вы выжили, но не так, как собирались. Вы сидите, и погоня наконец осталась позади, и у вас есть время (мысленно) вздохнуть. Они знали, что ищут. У них были для этого названия, протоколы, годы практики. Сегодня вечером к этому списку добавилось что-то новое: то, как вы думаете. \n\nОбман рухнул быстрее, чем следовало бы. Вы едва сбежали, и к тому времени, как вы выбрались из убежища, вы поняли, что изменилось. Они знают, как вы мыслите теперь. Они знают, как сущность движется сквозь вас, как использует ваши связи, как передает разведданные. Такие знания не устаревают. Они будут использовать это."
 POD_asakku.0212.desc.outmaneuvered:0 "Фаланга пришла. Вы выжили и более чем выжили. Вы сидите и гадаете, что рассказала ночь о них и, что более важно, о вас самих. Они знали, что ищут. Они пришли специально за вами, с именами, протоколами и годами практики. \n\nВы скормили им ложную информацию через зараженных. Они попали не в то убежище, ничего не нашли и потратили большую часть часа, пытаясь понять, что пошло не так. Вы почувствовали, как внимание сущности обострилось вместе с вашим, не направляя вас, а наблюдая. Заинтересовано.\n\nВы также думаете, что остались довольны результатами. А может, довольна была она? Вы задаетесь вопросом, где проходит линия в наши дни, существует ли она вообще."
 POD_asakku.0212.t:0 "Фаланга: Последствия"
 POD_asakku.0215.a:0 "Теперь я знаю их имена."
 POD_asakku.0215.desc.base:0 "Западные владения разрушены. Камуты, преследовавшие вас по всему христианскому миру, замолчали. Но сущность внутри вас не отдыхает и не дает вам уверенности в том, что работа завершена. Восток, где все началось, остается. Наследие писца-предателя Ямаданды, который однажды остановил вас, не умерло вместе с ним. Оно было унаследовано, усовершенствован и заточен руками, которые никогда не знали первоначального кузнеца, но понимали назначение клинка. \n\nДва имени возникают из сведений, которые несёт в себе ваша кровь. Фигуры, действующие в восточных пределах Истинной Руки, каждая из которых опасна в том смысле, в каком не были западные охотники. Западные Элиуды были солдатами. Это нечто другое. Они знают, что являются последней стеной перед чем-то ужасным, возможно, даже более ужасным, чем Геенна.\n\nПеред вами."
 POD_asakku.0215.desc.mokhadaji:0 "\n\nПервый — Мохададжи Ранпур. Князь Нагараджа из предгорий Бенгалии, потративший два столетия на составление досье на заражённых. Там, где западные Элиуды наносили удары железом и огнем, Мохададжи работает чернилами и терпением. Он каталогизирует. Он делает перекрестные ссылки. Он отображает форму вашей инфекции в разных дворах и родословных с точностью ученого, комментирующего Священные Писания. Он никогда не поднимал против вас оружие. Он сделал нечто худшее: он понимает вас. \nПервый предатель, Ямаданда, сам был писцом. Вы слишком хорошо знаете, что нельзя недооценивать этих людей слова."
 POD_asakku.0215.desc.nattadevi:0 "\n\nВторая — Наттадеви. В восточных доминионах ее называют Красным пальцем. Там, где Мохададжи чертит карту, она перерезает связи. Полевой оперативник, вмешательство которого в ваши операции было хирургическим, целенаправленным и невероятно эффективным. Она не составляет досье. Она действует, перемещаясь по вашей сети с уверенностью человека, который точно знает, где соединяется каждая нить."
 POD_asakku.0215.t:0 "Восточные тени"
 POD_asakku.0220.a:0 "Пусть они приходят."
 POD_asakku.0220.desc.base:0 "Вести приходят из Еноха. Дель'Ро издал директиву. Язык клинический: на Кавказе выявлена ​​«духовная зараза». Они не называют вас. \n\n Им это не нужно."
 POD_asakku.0220.desc.pietro_asakku:0 "Одного из назначенных ими камутов больше нет в наличии. Вы знаете, где он. Он при вашем дворе и смотрит на мир чужими глазами. Враг стал союзником, как и все в конце концов."
 POD_asakku.0220.t:0 "Окончательный учет"
 POD_asakku.0401.a:0 "Углубите корни."
 POD_asakku.0401.b:0 "Распространяйтесь шире."
 POD_asakku.0401.desc:0 "Семена посажены. Зараза распространяется по Изменчивости, как огонь распространяется по сухому дереву. При вашем дворе есть носители. В вашей сети есть носители. Как и в случае с болезнью, вы начали терять счет того, сколько людей может быть заражено, а может и нет. \n\nГолос внутри вас доволен, хотя слово «удовлетворен» подразумевает эмоцию, которой он не совсем обладает. Что у него есть, так это признание: этот этап работы завершен. Голос делал это раньше, возможно, при дворах, комнатах и ​​столетиях, которые прошли за пределами вашей памяти, но, как вы подозреваете, не за пределами его собственной. \n\nВы больше не одиноки в своей работе. По правде говоря, вы уже очень давно ни в чем не одиноки."
 POD_asakku.0401.t:0 "Фаза завершена: Заражение души"
 POD_asakku.0402.a:0 "Консолидируйте сеть."
 POD_asakku.0402.b:0 "Развить успех."
 POD_asakku.0402.desc:0 "Элиуды пришли за вами, и они потерпели неудачу. Какова бы ни была цена, измеряемая в сожжённых убежищах, в не переживших ночь вассалах, в планах, которые пришлось переделывать в темноте. Вы остаётесь. Камут, который Вазир выбрал для вашего конкретного уничтожения, мертв, рассеян или носит ваше лицо в их отчетах. \n\nЗарождение в крови дало вам новообращенных. Руки при дворах, где вы не бывали. Глаза в комнатах, которых вы никогда не видели. Рты, которые говорят вашим голосом, когда говорят о чем-то важном, и своими собственными голосами, когда говорят о чем-то несущественном. \n\n Сущность вознаграждает лояльность в единственной валюте, которую она понимает: больше себя. Вы, возможно, начали подозревать, что торг был проявлением вежливости."
 POD_asakku.0402.t:0 "Фаза завершена: Распространяющееся пятно"
 POD_asakku.0403.a:0 "На восток."
 POD_asakku.0403.desc:0 "Западное направление Теневого крестового похода завершено. Камуты, которые охотились за вами от Константинополя до Сарагосы и на Кавказе, убежища, которые они использовали, доминионы, которые информировали их, цепочки разведки, которые снабжали их целями, — все исчезло. Убиты там, где убийство было эффективным. Изменены там, где изменение было полезно. Опустошенные и продолжающие выполнять свои старые роли, где обман обещал больше, чем могло бы дать убийство. \n\nДель-Ро смирилась с потерей, если выбранный ею способ можно назвать смирением. Восточные доминионы действуют с новой настойчивостью. «Истинная рука» продолжается. Рука всегда продолжает существовать.\n\nВы также продолжаете, а голос ведет вас к триумфу, который придет в этой жизни или в следующей."
 POD_asakku.0403.t:0 "Чистка западных узурпаторов"
 POD_asakku.0404.a:0 "Пока нет. Но скоро."
 POD_asakku.0404.desc:0 "Вы больше не уверены, когда в последний раз у вас была мысль, которая была полностью вашей собственной. Неопределенность уже не так тревожна, как раньше. Это просто положение вещей. Что бы ни было в этом колодце, оно было с вами с тех пор, как Вздыхающий Лев повернул нос обратно к верхнему миру, и вы поняли, что «одержимость» — неподходящее слово для обозначения того, что произошло в последующие столетия.\n\nЦимисх, давший вам Становление, понимал это по-своему. Колдуны в своих башнях иногда видели это. Сущность всегда была участником дисциплины, которую они называют Изменчивостью, возможно, первоначальным участником, возможно, единственным, чье участие действительно имеет значение, и это участие не является настоящим хищничеством. Это соавторство. Автор просто терпеливо ждал, прежде чем заявить свои права. \n\nВы не потеряли себя. Вы стали чем-то, что содержит в себе и то, и другое. Шов, где вы двое встречаетесь, растворился, и это растворение не означает, как вы когда-то боялись, смерть одной из сторон. Это становление третьего. \n\nГде-то в глубине ваших мыслей ждёт имя. Вы провели тысячу лет, притворяясь, что не слышали этого. В данный момент не кажется, что это притворство можно продолжать долго. Но сегодня не тот вечер, когда вы произнесёте его. Еще нет."
 POD_asakku.0404.t:0 "Голос Наблюдателя"
 POD_asakku.0405.a:0 "Это закончено."
 POD_asakku.0405.desc.base:0 "Восток готов. Здесь традиция Ямаданды заканчивается не учеными, железными иглами и тщательно выбранными наследниками, а огнем или кровью и вашей победой. Восточные владения Вазира погрузились в молчание. Ячейки, которые они создавали, были расформированы по той простой причине, что им некому было отчитываться. В библиотеках Еноха все еще хранятся его сочинения, но читать их некому. \n\nЭлиудов больше нет. Истинная Рука продолжает существовать, Рука всегда продолжается, но теперь она ослаблена и пребывает в недоумении, невиданном со времён Долгой Ночи, не зная точно, что стало с её пропавшими членами. \n\nОстается только Наблюдатель. Остаётся работа. Работа находится на грани. Вы находитесь на краю. Это далеко от высоких пастбищ над храмом, где вы впервые научились правильно отделять плоть от костей, но вы шли по нему еще до того, как поняли, что идете."
 POD_asakku.0405.desc.both_converted:0 "Мохададжи и Наттадеви. Князь Нагараджа в предгорьях, который два столетия собирал на вас досье. Красный Палец, который вмешивался в ваши операции. Они оба сейчас сидят при вашем дворе и смотрят не совсем своими глазами. Они прислушиваются к голосу, который несет ваша кровь, к той части, которая получает инструкции в промежутках между вашими словами. \n\nОни были вашими самыми терпеливыми врагами. Теперь они, возможно, ваши самые полезные инструменты. Ямаданда, куда бы он ни пошел, нашел бы это либо великолепным, либо невыносимым. Он больше не в состоянии выбирать между ними."
 POD_asakku.0405.t:0 "Восточный счет"
 POD_asakku.0406.a:0 "Тогда Мы тоже подождем."
 POD_asakku.0406.desc:0 "Рано утром вы сидите и ловите себя на мысли о самом основателе. [yamadanda.GetName] нет уже как минимум тысячу лет. Официальные записи не упоминают ни уничтожения, ни достойного торпора старейшины, решившего на время отстраниться от мира. \n\nЭлиуды, с которых он содрал кожу и которых пересоздал, были лишь средством для достижения цели. Рука сломлена, но цель остаётся. В библиотеках Еноха до сих пор хранятся его чтения. Протоколы все еще циркулируют, даже несмотря на то, что не осталось ни одной ячейки, которая могла бы действовать в соответствии с ними. И где-то, в какой-то палате или в каком-то длинном тихом лабиринте Бури, сам маг. Ямасаттва, душа, заключенная в тело старше большинства империй, все еще слушает. \n\nВы не знаете, достигнет ли его уничтожение его Элиуда. Но голос в вашей крови насторожен, чего не было с тех пор, как пришла Фаланга. Он что-то заметил. Он еще не скажет вам, что именно. \n\nВы закрыли восточную рану. Возможно, вы не закрыли книгу."
 POD_asakku.0406.t:0 "Что осталось"
 POD_asakku_assassinate_elioud_tt:0 "Вы можете начать заговор против ближайшего Элиуда."
 POD_asakku_phalanx_vanish_tt:0 "Вы покидаете убежище и исчезаете. Вы выживете, но Элиуд узнает, что вы сбежали, и связь с Асакку ослабнет под тяжестью страха. Потеряйте 5 единиц глубины и получите модификатор «Охота»."
 POD_asakku_phase1_deepen_tt:0 "Связь с Асакку усиливается. Получите #bold 5 глубины #!."
 POD_asakku_phase1_spread_tt:0 "Инфекция ускоряется. Получите модификатор #bold Распространение шире#! на 10 лет, что повысит вероятность успеха заговора и снизит риск обнаружения."
 POD_asakku_phase2_consolidate_tt:0 "Укрепите свою позицию. Получите модификатор #bold Консолидированная сеть#!, который снижает успех вражеских планов и замедляет враждебные операции против вас."
 POD_asakku_phase2_press_tt:0 "Бейте, пока они не оправились. Получите модификатор #bold Развить успех#!, который увеличивает силу враждебных заговоров и снижает риск раскрытия."
 POD_asakku_reveal_elioud_tt:0 "Личность и местонахождение ближайшего Элиуда будут раскрыты."
 POD_asakku_war_forms_unlocked_tt:0 "Разблокируйте #bold Боевые формы Асакку#! в качестве рекрутируемого воинского полка. Гули, чья плоть преобразована волей сущности."
