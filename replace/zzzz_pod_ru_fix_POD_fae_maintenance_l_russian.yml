l_russian:
 POD_fae_maintenance.40.a:0 "Сказка о Вестнике"
 POD_fae_maintenance.40.a.tt:0 "Чтобы улучшить эту историю, вам придется выполнить множество контрактов [diplomacy|E], а также увеличить свой [prestige_level|E]. Взамен вы будете постепенно разблокировать [GetDomicileBuilding('fae_the_appearance_legendary_01').GetName] [domicile_building_upgrade|E] и его следующие уровни с каждым продвижением Сказки."
 POD_fae_maintenance.40.b:0 "Сказка о маршале"
 POD_fae_maintenance.40.b.tt:0 "Чтобы улучшить эту историю, вам придется выполнить множество контрактов [martial|E], а также выиграть множество сражений, играя за [commander|E]. Взамен вы будете постепенно разблокировать [GetDomicileBuilding('fae_the_interior_training_ground_of_marshal_01').GetName] [domicile_building_upgrade|E] и его следующие уровни с каждым продвижением Сказки."
 POD_fae_maintenance.40.c:0 "Сказка об управляющем"
 POD_fae_maintenance.40.c.tt:0 "Чтобы улучшить эту историю, вам придется выполнить множество контрактов [stewardship|E], а также накопить большое количество [gold|E]. Взамен вы будете постепенно разблокировать [GetDomicileBuilding('fae_the_appearance_perfect_01').GetName] [domicile_building_upgrade|E] и его следующие уровни с каждым продвижением Сказки."
 POD_fae_maintenance.40.d:0 "Сказка о Тени"
 POD_fae_maintenance.40.d.tt:0 "Чтобы улучшить эту историю, вам придется выполнить множество контрактов [intrigue|E], а также добиться успеха во многих [hostile_schemes|E]. Взамен вы будете постепенно разблокировать [GetDomicileBuilding('fae_the_atmosphere_oppressive_01').GetName] [domicile_building_upgrade|E] и его следующие уровни с каждым продвижением Сказки."
 POD_fae_maintenance.40.desc:0 "$POD_fable_decision_desc$"
 POD_fae_maintenance.40.e:0 "Сказка о мудреце"
 POD_fae_maintenance.40.e.tt:0 "Чтобы улучшить эту историю, вам придется выполнить множество контрактов [learning|E], а также передать множество очков [perk|E] другим [characters|E]. Взамен вы постепенно разблокируете [GetDomicileBuilding('fae_the_interior_library_of_the_sage_01').GetName] [domicile_building_upgrade|E] и его следующие уровни с каждым продвижением Сказки."
 POD_fae_maintenance.40.t:0 "Сказки"
