 POD_patronlore.100.desc.560002:0 "Киаран был ирландским путешественником, или, точнее, минсейри или одним из lucht siúil (буквально «ходячие люди»). Он был молодым человеком двадцати трех лет, который просто делал то, что ему было нужно, чтобы выжить и поддержать свою семью. Часто это означало ложь и мошенничество, потому что у него не было многих других навыков. Несмотря на его нечестный характер, семья всегда была для него самым важным, и он воспринимал всю жизнь как свою семью. Любого кочевника он уважал почти так же. Именно поэтому он предложил дом странному хиндустанскому путешественнику, называвшему себя Вишванатаном. \n\nНезаметно для него, Вишванатан был мафусаилом, вампиром в пятом поколении клана Равнос и человеком, который путешествовал по известному миру, чтобы найти себя в Ирландии. Повезло, потому что вскоре на их лагерь напали местные жители, и ирландец был смертельно ранен. Вишванатан предал свои принципы, чтобы обнять Кьярана, спасая ему жизнь. Он научил его Пути Парадокса и предупредил, чтобы он никогда не делал того, что он только что сделал. Потом он ушел.\n\nДаже теперь, Сородич, Киаран не мог оставить свою семью и свой народ позади. Особенно когда они столкнулись с такими предубеждениями и враждебностью со стороны сообществ, с которыми они контактировали. Эта враждебность в Ирландии достигла апогея, что вскоре привело к ее отъезду.  Сиаран решил найти им безопасный дом. \n\nИтак, они путешествовали десятилетиями, подбирая по пути других кочевников. К сожалению, Киаран не смог сдержать свое обещание, данное Вишванатану, и однажды спас жизнь молодой женщине из своего народа по имени Кайомхе. Она была единственным Сородичем в его сообществе, которого он породил лично, но многие другие присоединились к ним в путешествии. Кто-то Равнос, кто-то нет. Как сказал ему Вишванатан, Киаран объявит свой клан Гангрелами любому, кроме своего народа (хотя он изо всех сил старался поддерживать с ними маскарад). \n\nВ конце концов они достигли Венгрии. Во многом благодаря обману, манипуляциям и здоровой дозе Химерии, трем вещам, в которых Киаран был лучше всего, он убедил местных баронов позволить его людям поселиться здесь без каких-либо проблем."
 POD_patronlore.100.desc.560007:0 "Земная жизнь Хосе родилась у торговца рыбой и его жены где-то на севере Пиренейского полуострова, но большую часть своих ранних лет он провел на улице, создавая проблемы. Он был крупнее большинства мальчиков своего возраста и использовал этот размер, чтобы запугивать других детей. В раннем подростковом возрасте он узнал, что люди будут платить за информацию, поэтому начал собирать как можно больше информации для шантажа или торговли посредством подслушивания, незаметного слежения или простого запугивания. В конце концов, будучи молодым человеком, он руководил небольшой информационной сетью в городе Саррия, где его заметил приезжий вампир. Он заметил таланты Хосе и решил, что тот станет идеальным кандидатом на пост сэра. У Хосе и его сир были бурные отношения, которые закончились тем, что Хосе диаблеризировал старшего. \n\nВ 1300-х годах Хосе становится главой и единственным родственником небольшого дома де Каламар, захватывая герцогство Ла-Корунья и обещая себе, что он будет править Пиренейским полуостровом во имя Зверя."
 POD_patronlore.100.desc.560012:0 "Изалда родилась в довольно благополучной семье, чего было недостаточно, чтобы помешать ей вырасти в окружении проблем, большинство из которых она создала сама. В ранние годы она проявила природный талант ученого. \nОднако она выбрала другой путь, тайно погрузившись в оккультизм. Слухи о ее тайных поисках быстро распространились и вкупе с весьма необычной внешностью превратили Изалду в изгоя. В роковую ночь молодая девушка узнала, насколько плохими были слухи, поскольку ее оставили искалеченной и избитой до полусмерти на улице. Возможно, неудивительно, что тот, кто нашел и помог ей, был не кем иным, как членом ковена ведьм. \nПод руководством ковена Изалда быстро училась и выросла довольно находчивой ведьмой. Но на женщину снова напали посреди ночи. Хотя на этот раз искалеченными были ее собственные сестры из ковена, жертвы ее голода. \nПройдя стадию новорожденности, Изалда оставила свою [Glossary('сир','game_concept_Sire_desc')], Мелландис, и изгнала себя, все еще полная скорби о смерти сестры. За это время она глубоко погрузилась в свою собственную историю $pod_clan$, натыкаясь на тексты и информацию об Ордо Энигматис. \nТеперь, вдохновленная образом Ордо, она вернулась в Лечицу, свой родной город, легко занимая место графини. Однако это лишь первый шаг гораздо более тщательно продуманного плана по возвышению Малкавианов и Ордо Энигматик. А пока она будет стоять прямо посередине, готовая обрушить на мир истинные знания и пожинать их силу."
 POD_patronlore.100.desc.560013:0 "Гаврили был мелким дворянином. При жизни он служил воином, как до него отец и дед: его растили защитником своего народа.\n\nСтав вампиром, он находит извращённое удовольствие в охоте на смертных из своих прежних земель и питье их крови.\n\nНесмотря на преданность клану, Гаврили с трудом постигает высшую философию Цимисхи. Вместо этого он затворяется в своих владениях и сосредоточивается на выведении родов гулей."
 POD_patronlore.100.desc.560014:0 "Его вытащили из карьеров Египта, когда его ученость и проницательность привлекли внимание его сира. В течение многих лет он путешествовал по уже старым городам, его сир прививал жажду знаний, которые помогут бороться с застоем времени. Как последователь Тарика эль-Самы, Дескардион считает, что борьба между собой и зверем является высшим испытанием Аллаха. Дескардион поселился в устье Нила, где начинается жизнь для многих жителей Северной Африки, и усердно работает, чтобы принести знания и веру окружающим. Его эксперименты часто усваиваются, но в прошлом он принимал крайние меры, такие как упырь целой деревни или лично принуждал к месячному голоданию, чтобы очистить разум и тело (и слабых людей) от местных племен. Будучи одним из немногих грамотных людей в карьере, по этой причине Дескардион изначально был принят, он ведет множество журналов и ценит письменное слово, так что его двор ценит образование и тактику больше, чем любые другие качества. По мере того как рассказы рассказывают о войнах Тремеров и Вентру против Цимисхов, Дескардион все больше беспокоится о защите своей работы и становится активным в Северной Африке, стремясь помешать Королям и Пирамиде контролировать народ Египта."
 POD_patronlore.100.desc.560017:0 "Будучи болезненным незаконнорождённым сыном знатного человека, он научился придворным интригам ради выживания. В 26 лет, когда он пытался получить влияние на своего сюзерена, вампир ворвался в его замок и дал ему Становление."
 POD_patronlore.100.desc.560019:0 "Родившийся в семье безземельного рыцаря, присягнувшего графу Честеру, Ариан де Грей провел детство, обучаясь при дворе своего сюзерена. Он показал себя способным в бою, что принесло ему место самого молодого члена гвардии своего господина, за которым вскоре последовала должность командира в его армиях. Молодому человеку представится шанс проявить себя во время восстания в Нормандии. За пять лет ему удалось трижды попасть в плен. Дважды его выкупали, а один раз он сбежал. Несмотря на эти неудачные ситуации, его хвалили за храбрость и мастерство, заслужив доверие самого короля. Кульминация его карьеры положила конец войне: в битве при Бремуле 1119 года ему удалось разгромить вражескую кавалерию и возглавить атаку на ее правый фланг. Этот маневр не имел ничего общего с отданными ему приказами и был описан одновременно как «гениальный ход» и «акт чистого безумия». В любом случае это привело к решительной победе, которая, похоже, стоила Ариану жизни. А именно, после удара своей знаменитой атаки он начал преследовать отступающую армию, сопровождаемую в лучшем случае символическими силами. Он оказался окруженным в тылу врага, где его пронзили копьем и бросили умирать. Его собственные люди нашли его еще живым и привезли на лечение в лагерь, но надежды на выздоровление было мало. Друг сидел рядом с ним, когда в палатку вошел мужчина. Он узнал его, одного из советников короля. Его друг ушел по просьбе мужчины, и они остались одни. «Это выглядит совсем нехорошо. Я бы сказал, что у тебя есть час, может, два». Мужчина не стал ждать ответа: «Я могу гарантировать, что ты переживешь это, взамен ты будешь присягать мне на всю оставшуюся жизнь, какой бы продолжительной она ни была. Ты принимаешь?» В боли и бреду он сделал это и очнулся в незнакомом месте, служа совсем другому хозяину."
 POD_patronlore.100.desc.560020:0 "Сын богатой семьи Ткачиха, родившийся в Страсбурге, Вильгельм всегда был любопытен. В поисках новых тайн он начал с обучения под церковным крылом. Приняв обет, он стал монахом в аббатстве Хоэнбург, на вершине горы Святого Одиля. Изучая классику, он также стал все больше интересоваться «Языческой стеной» (Хайденмауэр), древней кельтской стеной, окружающей гору, которая, как считается, возникла еще до христианства. Он также узнал о рассказах о странных существах, обитающих в соседнем Шварцвальде. Великие гуманоиды семи футов ростом и с черными глазами.\n\n Его запретное стремление узнать происхождение стены и его растущий интерес к языческим делам привлекли к нему внимание одного странствующего изгоя клана Тремер, Йонаса Хелида. После того, как он был принят этим человеком, он оставил свою монашескую жизнь, чтобы путешествовать подальше от солнца. \n\nВо время своей не-жизни он и Йонас отправились в Болонью, где сыграли вспомогательную роль в основании университета в 1088 году. Заинтересовавшись знаниями древних времен, Вильгельм черпал вдохновение из персидских сказаний для своего нового имени — Кир. Новое имя для его не-жизни.\n\nВ 1180 году, после неудачной попытки воссоединиться со своим сиром клану Тремер, он вернулся в свой родной регион, недалеко от рейнского города Кольмар. Излишне говорить, что это все, что потребовалось, чтобы с ним связался Марконий Страсбургский, основатель родословной Каэсидов и бывший маг. Несмотря на то, что они принадлежали к разным кланам, их сблизили академические интересы. Во имя знаний они заключили союз."
 POD_patronlore.100.desc.560025:0 "Похищение смертных (особенно прекрасных физически, сильных, красивых и т.д.) привлекает внимание, особенно когда большинство похищенных находят... в виде останков. Похоже, над умершими проводились жестокие эксперименты, а некоторые их конечности и органы были деформированы почти до неузнаваемости. Увы, хорошую помощь найти сложно, и те «доверенные» лица (наёмники), которым Эдем поручил разобраться с останками жертв, решили просто выбросить тела где-нибудь в удобном месте, полагая, что их просто посчитают за новые убийства (обыденного характера) в этих землях. Однако у любого, кто хотя бы отдаленно знаком с эффектами Изменчивости, возникнут огромные подозрения."
 POD_patronlore.100.desc.560027:0 "Когда-то Лукиос был известным римским центурионом и тайным приверженцем культа Исиды. В годы перед падением Рима под натиском готов, видя безнадёжность войн, он дезертировал. Его увлечение египетскими мифами росло, и наконец он отправился в страну зыбучих песков, чтобы лучше понять свою богиню. Увы, вместо желанных знаний он нашёл лишь Последователей Змея. В древних храмах его встретил Сет. Они заинтересовались им — или, возможно, его знаниями о римском войске."
 POD_patronlore.100.desc.560028:0 "Лючия словно появилась из ниоткуда. По счастливому стечению обстоятельств многие её соперники на пути к власти попадали в «несчастные случаи» или внезапно меняли свои убеждения. Её сиром считался таинственный Джузеппе, которого в последний раз видели по пути на встречу с ней. Неизвестно, подвергся ли он диаблери, оказался ли с колом в сердце или просто встретил Окончательную смерть, убрав последний незакрытый вопрос. Пожалуй, её лучше не злить, если ваш тайный советник не слишком умел."
 POD_patronlore.100.desc.560030:0 "После Становления его бросили на произвол судьбы, и теперь он видит лишь один способ заслужить уважение: силу и власть. Не связанный никаким кланом, Патрик жаждет подчинить каинитов и смертных. Ради власти и мира, устроенного по его замыслу, он готов на всё."
 POD_patronlore.100.desc.560031:0 "Потомок некогда знатной семьи, Габриэль с рождения готовился к правлению. После Становления он предпочёл держаться в тени и править оттуда, как и подобает члену клана Ласомбра."
 POD_patronlore.100.desc.560032:0 "Её сир Стоффер Равенсбург, происходящий от Дракона, заранее готовил её к Становлению. Вскоре после него выяснилось, что Стоффер — инферналист. Вместе с другим его потомком, Мигелем Барбанеагрой, она выследила сира и предала его Окончательной смерти. Теперь она укрепляет своё положение при дворе воеводы Брынковяну, несмотря на взаимную неприязнь к избранным ими путям. Она до сих пор хранит некоторую верность воспитанию [Glossary('ревенанта','game_concept_revenant_desc')] и пытается защитить свою прежнюю семью и укрепить её положение в мире, но пока без особого успеха."
 POD_patronlore.100.desc.560041:0 "В детстве он всегда привлекал всеобщее внимание из-за своей бледной, как у трупа, кожи. Большую часть детства он провел в лесу, собирая пищу, а позже начал охотиться. Он был умен и хитер, а позже присоединился к банде воров, известных тем, что нападал на солдат и торговцев, путешествующих через Нордмарк. \n\nЕго роль в банде воров заключалась в сборе информации и использовании ее для планирования засад.\n\nОднажды ночью Гангрелы, связанные узами крови, подошли к укрытию воров с убийственным намерением, убив большинство людей внутри или доведя их до критического состояния, после этого Гангрелы скрылись с места происшествия, и все внутри оказались либо трупами на полу, либо истекающими кровью, Хакон был 'повезло?' достаточно, чтобы вызвать только умеренное кровотечение, и попытаться прижечь раны, чтобы остановить кровотечение.\n\nОн позже попытался выбраться из убежища, залатав раны, но не успел уйти далеко наружу, как увидел темную фигуру в лунном свете, которая приказала ему приблизиться, он это сделал, и вскоре почувствовал слабую боль, за которой последовало потустороннее удовольствие, тогда все пошло наперекосяк. black.\n\nЕго сир был изгнанником из моря теней, но никогда не упоминал почему. Его сир научил его многому: как эффективнее манипулировать людьми и как прекрасна бездна. Позже, поглотив душу Тореадора и пристрастившись к $pod_vitae$, он начал вести себя странно, и его настроение беспорядочно и без объяснения причин менялось."
 POD_patronlore.100.desc.560043:0 "Сын мелкого торговца, родился в селе Черновцы одного из молдавских княжеств. Он с детства умел мириться и приобретать необходимые связи. Однажды вечером он встретил молодую девушку, сопровождавшую посла Византийской империи. Девушка была потрясающе красива, но главное, кроме нее больше не было охранников. Это обстоятельство позволило Анатолию и его старшему брату познакомиться с девушкой в ​​местном трактире. По ее рассказу, они вернулись после переговоров с киевским князем и остановились здесь для смены лошадей и отдыха. Благодаря своему природному обаянию Анатолий смог убедить девушку остаться на ночь в их доме... по крайней мере, он так думал тогда. Это была последняя ночь для него как человека. Утром он нашел изуродованные и высушенные тела своей семьи. На холодном трупе старшего брата он нашел записку: «Следующая встреча будет у меня дома. Ваша Арианна. Через несколько дней с ним связались слуги Тореадора и дали указания о месте встречи с остальными родственниками.\n\n9 лет прошло с тех пор, как его приняли в новую семью. Анатолий смог зарекомендовать себя как лояльный, исполнительный и умный член клана. За столь короткий срок он смог сместить бывшего местного правителя и присягнуть правителю Воеводата. Ни Владимир Рустович, ни Матриарх не сомневаются в его лояльности. Но что, если верность и клятвы — не более чем притворство, а новая «семья» — главная цель мести за старую, настоящую семью? Время покажет."
 POD_patronlore.100.desc.560044:0 "Замкнутый, но непокорный второй сын столь же молчаливого перевозчика, Дамиан по большинству стандартов не был бунтовщиком.\n\nОн оставался тихим и наблюдательным — глубоким мыслителем; Он смотрел на воду с лодки своего отца, очарованный рябью, оставленной за ней, или смотрел на звезды вместе со своей матерью, когда она указывала на места, где они соединяются, образуя созвездия.\n\nНесмотря на то, что юноша был доволен воображением, самоанализом и общим безразличием к материальным делам, он не уклонялся от острого сардонизма и аналитической критики, чтобы выразить свое несогласие перед лицом излишне авторитарных старейшин, заслужив их неохотное уважение. В молодости попал на влиятельные должности, но остался без амбиций; Он быстро понимал мотивы и желания человека, но никогда не понимал свои собственные.\n\nДэмиан устал от своей жизни еще до того, как она началась.\n\nТеперь, до краев наполненный темной силой и жаждой чего-то большего, он ищет правду в своих объятиях.\n\nНаблюдая за неестественными поступками создавших его монстров, Дамиан стремится раскрыть свою роль в их махинациях и найти способ разрушить призрачные оковы, которые заставляют его тихо соблюдать утомительную и мелкую политику среди вероломных дураков.\n\nДаже сейчас, после смерти, он ищет разрешения пути, по которому шел с рождения. Но путь наименьшего сопротивления, как и река, закончится только тогда, когда она встретит море."
 POD_patronlore.100.desc.560048:0 "Чандра — бог Луны в Ригведе; он достаточно древний, чтобы, возможно, действительно иметь отношение к этому тексту. Антарикша — бог пространства. Он родился около 1500 года до нашей эры и, вероятно, примерно тогда же получил Становление."
 POD_patronlore.100.desc.560049:0 "Этот человек был жестоким воином. Его воля на поле боя и тщательное управление войсками и их расположением привели его к многочисленным успешным сражениям. Во время одного из них его заметила Брунгильда. Когда он умирал после убийства четырех нападавших, она обняла его и оставила одного в дебрях, чтобы он выжил. За это время он понял, насколько социальные способности и схемы служат только слабым, и использовал свою хитрость и силу для охоты с неумолимой эффективностью. Узнав, кем он стал, он начал активно опустошать тех, кто плевал на богов. Выступая в роли полководца и палача, он был послан истребить гнилые корни древа жизни. Любой Эйнхерий, сбившийся с пути, должен был ответить за свои преступления против богов, и лишь немногие из них дожили до того, чтобы присоединиться к христианам. Увы, в каждой битве, которую он выигрывал, другие были проиграны, и христиане, казалось, никогда не отступали. Хуже того, они отравили сердца его паствы, а многочисленные ссоры среди Эйнхерий привели Мидгард к краху. После того, как Один исчез, раздосадованный человеческой неспособностью признать истинную силу и поддержать пути асов, он уединился в своем родовом доме Хельгуме, не участвуя ни в одной новой битве. Но он никогда не терял веры. Если Одину суждено проснуться, он снова возьмет свои топоры и снова штурмует поле битвы."
 POD_patronlore.100.desc.560050:0 "Во время Второй Пунической войны римские родители пугали детей словами «Hannibal ante portas» — «Ганнибал у ворот». Ходят упорные слухи, что в Карфагене ему дал Становление мафусаил Бруха Троиль, но неизвестно, пережил ли он разрушение города или погиб вместе с ним. Некоторые сомневаются даже в том, существовал ли Ганнибал. Существовал. Пробудившись от торпора в руинах Хаттусы, он возвращается на землю предков, и у него лишь одна мысль. Уничтожить. Рим. Или что-то в этом роде."
 POD_patronlore.100.desc.560053:0 "Он был архиепископом христианства. Он верит, что вампиры являются частью воли Бога, но объятия сбили его с толку. Он считает, что вампиры - это пастыри людей, которые всего лишь скот, которого воли вампиров направляют к тому, что они думают и считают правильным. Хотя он считает, что люди не должны лгать или убивать (если только их лорды-вампиры не прикажут им об этом), он считает, что вампирам разрешено использовать инструменты «Ради высшего блага». Он верит, что люди либо хорошие, либо злые, либо и видит мир черно-белым. Горатрикс принял его как жреца с огромными познаниями в религии и оккультизме. Когда его обняли, Сазерленд наклонился. До такой степени, что даже Горатриксу пришлось отправить его на некоторое время на Мальту, чтобы он мог успокоиться и прийти в себя. Его механизм выживания заставил его все еще верить в то, что он агент Бога, но затем он начал видеть мир черно-белым, Добром и Злом. Как любой охотник за Злом, в конце концов он использовал инструменты Зла, чтобы победить Зло, и стал жаждать власти. По его мнению, все это для того, чтобы в конечном итоге достичь своей цели - превосходства Священной Римской империи и Тремеров, что приведет его на темный путь."
 POD_patronlore.100.desc.560066:0 "Она утверждает, что возглавляет оборону Британии от вторжения саксов, переодевшись мужчиной среди смертных."
 POD_patronlore.100.desc.560067:0 "Диего — бывший монах христианского священного ордена. Он был охотником, но после удачной охоты получил Становление от сира, решившего, что это будет забавно. Этот сир не слишком переживал из-за пары неонатов, которых убил Диего."
 POD_patronlore.100.desc.560070:0 "Онмёдзи, ведущий специалист по онмёдо в Японии в середине периода Хэйан. Онмёдо - это система естественных наук, астрономии, календарей, гаданий и магии, которая независимо развивалась в Японии на основе китайской философии инь-ян и усинь (пяти элементов). Помимо своей выдающейся роли в истории, он является легендарной фигурой японского фольклора и фигурировал во множестве историй. Сэймэй работал в качестве онмёдзи при императорах и правительстве Хэйан, консультируя по духовно правильным способам решения проблем. Он молился о благополучии императоров и правительства, а также давал советы по различным вопросам. Он также был астрологом и предсказывал астрологические события. Он прожил чрезвычайно долгую жизнь, не страдая никакими серьезными заболеваниями, что способствовало распространению веры в то, что он обладал мистическими способностями. Ближе к концу своей жизни он был объят одним из восточных Салюбри."
 POD_patronlore.100.desc.560072:0 "Один из тех, кто присутствовал, когда Тремер выпил настой, превративший его в вампира. Первоначально Моргано был слишком молод, чтобы его обнял сам основатель клана, но вскоре после церемонии Моргано был обнят Горатриксом. Он сыграл важную роль в поимке нескольких штирийских Цимисхов и после объятий намеревался узнать тайны их крови. Из-за его близости к Ритуалу Узурпации, клановой дисциплине Цимисхов, Изменчивость присутствовала в его крови. Эта редкая черта, которая время от времени проявлялась у Тремеров на протяжении веков, быстро стала центром внимания Моргано в исследованиях. Он считал, что манипулирование плотью и костями посредством Изменчивости потенциально может раскрыть многие алхимические тайны, и быстро изучил новые способы применения этой силы в своем Тауматургическом волшебстве крови.\n\nЭтот его уникальный дар и относительный успех его экспериментов принесли ему известность среди его клана. Жажда власти Моргано Мурчадхи отразилась в жестоком характере его экспериментов, и он приложил руку к тому, чтобы заставить Цимисхов объявить войну молодому дому Тремер. В результате Моргано был изгнан из дома Тремер, и он и его последователи были избавлены от кровных уз при строительстве пирамиды в 1037 году. Возмущенный своим исключением из политики Тремер и побуждаемый своей жаждой власти, он взял с собой тех немногих, кого он обнял, и создал Дом Мурчадха, кадетскую ветвь первоначальных Тремеров, которые основали свою базу в Эстергоме после убийства находившегося там первоначального воеводы. в акте мономансии.\n\nСо своего нового места власти Моргано из Дома Мурчадха начал вторжения в окружающий Вышеград, несмотря на огромное количество врагов вокруг него. Многие из его последователей, хотя и считали такие атаки самоубийственными, были удивлены, обнаружив, что одерживают неоднократные победы. Различные воеводы в Венгрии находились в таком же конфликте друг с другом и с основной ветвью Дома Тремер, как и с Мурчадхой. \n\nЭти первоначальные победы привели к захвату многих довольно могущественных родственников, которые удовлетворили желание Моргано экспериментировать и создавать новые силы, поэтому вместо этого он на время переключил свое внимание с завоеваний на путешествия. Моргано отважился посетить баронства Авалона и Дворы любви во Франции, где, как сообщается, у него родились двое своих детей. Его первым ребенком была юная благородная девушка по имени Шарлотта из кентского города Кентербери. Неясно, было ли это какое-то мимолетное представление о любви смертного, которое заставило его сделать это, или какой-то другой аспект ее характера, который пленил его интерес. Другим его ребенком был странствующий маг из ордена Гермеса, которого он случайно встретил по имени Никлаус. К моменту их встречи Моргано был грозным обладателем магии крови и использовал другие вампирические дисциплины, в частности Изменчивость, чтобы подобраться к людям достаточно близко, чтобы они не могли отреагировать на его атаку. Никлаус ненавидел Моргано за то, что тот обнял его, он считал это жестокой шуткой со стороны Моргано и потратил много лет, пытаясь выследить его до его часовни в Эстергоме. \n\nМоргано стал известен своим безумием в последние ночи, после того как, выйдя из своих уединенных исследований, Чернокнижник увидел, что многие из меньших сородичей, таких как Каитифф, поднялись на выдающиеся позиции. Тщательно изучив пророчества о геенне, он воспринял это как предзнаменование и начал свой собственный крестовый поход, чтобы очистить Европу от бесклановых, привлекая на свою сторону многих вампиров-традиционалистов. Раньше он экспериментировал на своих пленниках, но теперь Безумный Лорд Дома Мурчадха предпочитал сжигать своих врагов на кострах или в их домах, иногда целые деревни и города сжигались дотла, если ходили слухи, что они укрывают лиц, не имеющих клана. Однако из-за его изоляции и безразличия высших кланов никто не остановил безумное обыск Моргано по Венгрии."
 POD_patronlore.100.desc.560073:0 "До своего объятия Химено Фитцрой был мелким дворянином в Валенсии и находился в дальнем родстве с каким-то испанским королем (по крайней мере, он так утверждает). Он заработал плохую репутацию из-за того, что свободно общался с недобросовестными торговцами, ворами и негодяями. Его отклонения и готовность нарушить законы ради своей выгоды привлекли бы внимание могущественного Ласомбра, ищущего смертного, которого можно было бы обнять. \n\nПосле объятий Химено обнаружил, что его тянут к темным волнам - как это бывает с некоторыми Ласомбра. Он нанял преступников, которых знал в прошлой жизни, в команду своих кораблей и отправился в великое путешествие, полное приключений, сражений и множества награбленной добычи. Некоторым корсарам вполне достаточно совершать набеги и веселиться, но Химено в конце концов обнаружил, что жизнь в море... ограничивает его. Воспользовавшись хаосом в Леванте, вызванным крестовыми походами, он захватил контроль над несколькими ключевыми портами и решил «открыть магазин». Родился двор Ворон. С тех пор власть Химено немного расширилась и охватила большую часть Сирии и несколько разрозненных земель за морем. Химено мечтает создать пиратское королевство, достаточно могущественное, чтобы управлять собой, не опасаясь вмешательства других в его дела; где каждый вампир будет свободен жить и умереть так, как ему заблагорассудится."
 POD_patronlore.100.desc.560074:0 "Он был воинственным потестатом, известным как «Де Драк». Он отказался платить дань датчанам, разорявшим окрестности, и выступил против них. В последовавшем сражении голландцы победили: из восьмисот датчан погибли пятьсот, включая их вождя. Но голландцы тоже потеряли своего предводителя.\n\nПо крайней мере, так считалось. На самом деле во время битвы он получил Становление, стал одержимым и сменил имя. С тех пор он странствовал по Европе, ища своё место. Наконец он вернулся в Голландию, чтобы править из тени, пытаясь вернуть рассудок — или уступая безумию."
 POD_patronlore.100.desc.560076:0 "Аэдан получил Становление от старейшины Истинных Бруха, обеспокоенного исчезновением и осквернением Белых завывателей. Аэдан происходил от друидов, сотрудничавших с этим племенем, и его сир надеялся, что он поможет разгадать тайну."
 POD_patronlore.100.desc.560079:0 "Как человек, Луна всегда отличалась от своих сверстников. Созерцатель жизни и смерти, интересующийся странным и влюбленный в ночь. Что-то в этом ее успокоило. Медленный, но неумолимый ветерок, проносившийся сквозь камни дома ее родителей и пугающий других детей, заставлял ее чувствовать себя уютно и безопасно. Треск дерева под ногами и тишина темной комнаты вдохновляли ее воображение. Ее красота казалась вечной, но почти угасла, когда она отвергла ухаживания соседского мальчика и была провозглашена ведьмой. Пока инквизиторы готовили ее к сожжению, ее крики гнева и боли дошли до местного лорда вампиров, который увидел ее неумолимую ненависть к человеческой расе. Он спас ее и вскоре обнял. Он хотел увидеть, какой хаос и страдания может совершить такая красивая и безумная личность, прежде чем обречь себя, или сможет ли она подняться в ряды ночного двора и стать настоящей Хозяйкой ночи."
 POD_patronlore.100.desc.560080:0 "Как и многие Цимисхи, Йелбеген в первую очередь отказался от своего смертного прошлого. Когда-то это был Маттаиос Драгастес, еврейский мистик-романиот, который в прошлые века практиковал Каббалу Маасит с использованием клипотической магии. Обучение и мастерство Маттеоса в использовании такой магии сделали его человеком, представляющим интерес для вампиров, живших в Древнем Константинополе, и, в конечном итоге, сыном Цимисха Мафусаила Анделеона (вероятно, Урдо \"Мастер Адских псов\", но, возможно, Джедрик \"ученый\") обнял мистика под его сиром. инструкции.\n\nПод опекой Анделеона Драгастес изучал дисциплину Изменчивость во всех ее многочисленных формах, и его мастерство в этой дисциплине быстро выросло за пределы его лет, как и у всех потомков Анделеона. По мере того, как его мастерство Изменчивости укреплялось, Драгестес обнаружил, что, когда он обращался к Клипот, как он это делал при жизни, он мог чувствовать древний разум, обитавший внутри анти-жизни, давящий на его сознание. Под руководством Анделеона мистик обрел этот великий разум. Они раскрыли ему множество великих тайн Изменчивости и рассказали о древних, бесчисленных преступлениях существ, называемых Нефилимами. Привлеченный этими жуткими сущностями, Маттайос отправился в [UmbraGlossary('shadowlands')] и отправился в леса Д'хайну, руины Второго города и подножия горы Меру.\n\nВ этих путешествиях Наблюдатели, как называли себя эти Клипотические сущности, разрушили разум Маттеоса и перестроили его как продолжение своего собственного. Обезумевший от жутких откровений и одержимый этими злонамеренными существами, Маттайос придал направление и голос появляющемуся выводку Ассаку, который медленно разрастался, как опухоль, в обществе Сородичей. Маттайос стал для Ассаку своего рода пророком, напрямую общаясь с Наблюдателями и провозглашая сводящие с ума откровения от их имени. В качестве основной линии связи между растущим культом крови Ассаку в Константинополе и Клипотическими мастерами, которым они служили, остальная часть выводка Анделеона стала называть Драгастеса «Шепчущим во тьме», когда он стал Иерофантом Растущего культа крови.\n\nПредставившись странствующим мистиком, Драгастес использовал свою Изменчивость, чтобы исцелять больных и раненых как Королей, так и Сородичей. Однако с каждым исцелением его испорченная кровь распространялась на массы, разлагая их изнутри и превращая в простое продолжение воли Ассаку. Потенциально проклятие Драгастеса могло распространиться на большую часть Средиземноморья. Однако Ассаку, или, точнее, Страж, который доминировал над его волей, недооценил других Сородичей Города. Дракон, древний Цимисх, чьи знания об Изменчивости затмили даже знания Ассаку, искоренил многие культы Маттеоса и быстро заставил отступников Цимисхов бежать из города. Однако некоторые остатки безумия Драгастеса остались на окраинах древней Византии, хотя столетия подготовки и заговора были отменены за несколько коротких лет. Хотя победа Троицы над Ассаку была быстрой, Мафусаилы, правившие Константинополем, прикрыли побеждённый культ Крови, чтобы сохранить образ стабильной и непогрешимой Мечты.\n\nПосле изгнания Драгастеса из Константинополя странствующий Иерофант Ассаку, казалось бы, исчез с лица земли. Некоторые шептались бы, что культ Ассаку распространялся по всей Европе и на Ближнем Востоке Элиудами. Лишь недавно «Шепчущий во тьме» вновь появился под новым именем в самых дальних уголках Сибири, по-видимому, на время отбросив преследование Таль’махе’ра."
 POD_patronlore.100.desc.560081:0 "Родившаяся в 390 году нашей эры в городе Риме, Целия при жизни была третьим ребенком римского центуриона. О ее человеческой жизни известно немногое просто потому, что знать особо нечего, не говоря уже о том, что большинство записей ее времени были уничтожены; она жила в Риме без происшествий, пока галлы не разграбили его в 410 году нашей эры. Ее отец и старшие братья погибли в бою, а при попытке бегства она подверглась нападению сородичей. Она сопротивлялась изо всех сил, но с самого начала это была безнадежная битва, и она была побеждена с презрительной легкостью. \n\nКакой бы вампир ни обратил ее, он оставил ее на произвол судьбы - ее новая личность вампира была быстро раскрыта местным населением, и ей едва удалось уйти невредимой. Она бежала на северо-восток, потратив почти столетие только на то, чтобы твердо осознать свои новые силы и как избежать обнаружения - или навлечь на себя гнев других сородичей. Лишь спустя еще два столетия она наконец нашла себе место, пусть и маленькое. Но это только начало — пока неизвестно, будет ли что-то большое или нет."
 POD_patronlore.100.desc.560082:0 "Наркиссос родился в знатной семье в Древней Греции, в семье речного бога Кефисса и нимфы по имени Лириопа. С юных лет Наркиссос был известен своей потрясающей красотой и харизмой, привлекавшей поклонников со всей округи. Однако он также был известен своим высокомерием и пренебрежением к тем, кто не соответствовал его высоким стандартам красоты и совершенства.\n\nСтав старше, Наркиссос становился все более одержимым своей внешностью, часами любуясь отражающими поверхностями и заказывая свои скульптуры и картины. Он становился все более и более изолированным, отказываясь общаться с кем-либо, кого он считал недостойным его внимания.\n\nОднажды к нему подошла сестра-близнец Наркиссоса по имени Наркисса. Они были похожи внешне, и говорили, что их красота не имеет себе равных во всей стране. Наркисс увидел свое отражение в своей сестре, а она — в нем. Они стали неразлучны, проводя дни и ночи вместе в мире, который сами создали.\n\nОднако их любви не суждено было длиться долго. Однажды ночью к ним двоим подошли вампиры Тореадор, которых привлекла их уникальная красота, и предложили им бессмертие в обмен на свою службу. Наркиссос и его сестра согласились, видя в этом способ достичь вечной молодости и красоты.\n\nБудучи вампирами, Наркиссос и его сестра остались такими же тщеславными и эгоцентричными, как и прежде. Они продолжали зацикливаться на своей внешности и отказывались общаться с кем-либо, кого они считали неполноценным. Они также были очарованы концепцией диаблери, рассматривая ее как способ получить еще больше силы и красоты, пожирая души других вампиров.\n\nОднажды ночью Наркиссос и его сестра вместе охотились, когда наткнулись на могущественного старшего вампира, которого решили диаблеризировать. Однако во время процесса Наркиссос обратился против своей сестры и поглотил и ее душу, движимый собственной ненасытной жаждой власти и красоты.\n\nТеперь Наркиссос бродит по ночи один, охваченный чувством вины и раскаяния за то, что он сделал с той, кто был его идеальным отражением. Его преследуют ее воспоминания, и он никогда не сможет полностью избавиться от осознания того, что это он убил ее. Что еще хуже, каждый раз, когда он смотрит в зеркало, он видит ее лицо, смотрящее на него, постоянное напоминание об ужасном поступке, который он совершил. Тем не менее, он остается таким же тщеславным и эгоцентричным, как и прежде, продолжая зацикливаться на своей внешности и разыскивая других вампиров, которых можно было бы диаблеризировать в своем бесконечном стремлении к силе и красоте."
 POD_patronlore.100.desc.560084:0 "О нём мало что известно: обычно он держится особняком и изучает Бездну. Известно лишь, что он обнаружил её существование и начал изучать ещё до Становления. Именно это привлекло внимание клана Ласомбра и в итоге принесло ему нынешнее неживое существование."
 POD_patronlore.100.desc.560086:0 "До его объятий Алексарх был простым человеком, выросшим в маленькой деревне где-то в Греции, месте, которое давно забыто. Позже Алексарх стал неуловимым мистиком, к которому приходили многие люди, чтобы получить благословения и обряды. Он путешествовал по землям, когда ночи были еще менее кровавыми, чем сейчас. Где-то во время своего путешествия он чуть не погиб и был обнят одним из Баали. \n\nГоды мучительных тренировок в искусстве своего сира сделали его могущественным, хотя он и сошёл с ума. В настоящее время он живет затворником в башне, специально приспособленной для его нужд, манипулируя населением своего округа и руководя им почти как культом, находясь в центре поклонения. Они с трепетом смотрят на башню, в которой он обитает, но взгляд их хозяина уже давно устремлен в другое место. Голоса в его голове говорят о великих достижениях, и было бы мудро прислушаться к ним."
 POD_patronlore.100.desc.560093:0 "Амдуций родился во Франции в 787 году. Будучи дворянином при дворе Карла Великого в расцвет его правления, он стал одним из ближайших советников императора. Исключительно умный, хитрый и изворотливый, он всё же страдал от паранойи, столь обычной при этом дворе. Азанеаль дал ему Становление в ночь смерти Карла Великого. Он быстро принял новое существование и отбросил прежнюю жизнь; его старое имя затерялось в истории. Теперь Орден знает только Амдуция. Быстро освоив Демонизм, он прославился как Владыка, рождённый Адом, и заслужил большое уважение своей линии крови благодаря опытам и исследованиям."
 POD_patronlore.100.desc.560094:0 "Мелюзина д'Анжу дала ему Становление как своего рода живому произведению искусства и игрушке. Он приобрёл толику власти благодаря её благосклонности и умению очаровывать окружающих: настоящих способностей ему отчаянно недостаёт. И имя, и название младшей ветви — Доу — она подарила ему ради собственного развлечения и следуя определённому замыслу."
 POD_patronlore.100.desc.560095:0 "Мемнон был эфиопским царем-полубогом, сражавшимся с героем Ахиллом. Хотя Мемнон пал в битве, Зевс был впечатлен его мастерством и доблестью и даровал ему бессмертие. Вернувшись на родину, он некоторое время скитался в отчаянии от своего поражения, пока не впал в оцепенение. Проснувшись в 12 веке, он вернулся в Грецию, чтобы сразиться с Ахиллом и победить его. Ахиллес давно умер. Преследуемый чувством неуверенности в себе, он пытался удовлетворить свое чувство неполноценности, с которым он враждовал с Сородичами Греции, чтобы проверить свой характер перед возвращением в Эфиопию. Теперь он желает показать свою ценность, создав родственную империю на базе Эфиопии. Или, возможно, эта легенда — выдумка, созданная воином-гангрелом, который хотел раздуть свою выдумку, чтобы вызвать преданность своих последователей и страх своих врагов."
 POD_patronlore.100.desc.560096:0 "Многообещающий архитектор родом из Неаполя, Филипп отказался от многообещающих предложений о работе из городов по всей Италии, когда таинственный покровитель предложил ему отремонтировать экзотический город Александрию. \n\nКогда Филипп прибыл, он обнаружил, что город недостоин Александра, Птолемея и Цезаря. Он заявил, что потребуется целая жизнь, чтобы вернуть Александрии дни ее величия. Его покровитель, Марцелл Александрийский, предложил ему эти жизни; вечность вина, женщин и песен, наполненная вдохновением, с телом и разумом, незапятнанными временем. Архитектор проектирует свои произведения на века, не должен ли и его земной сосуд быть построен на непреклонном фундаменте? \n\nВ отрезвляющие ночи после его объятий Марцелл открыл, что дом Каина был построен на фундаменте непрекращающейся борьбы. Египет был очагом конфликта между Сетитами и Каинитами. Марцелла больше интересовали логова и тайные ходы в подбрюшье Александрии, чем восстановление смертного города. \n\nЭто было горькое путешествие обратно в Италию, и Филипп проклял себя за то, что доверился египтянину. Теперь он погружается в проекты, чтобы отвлечь зверя: рисует при свете свечей, производит съемку при лунном свете и даже обрабатывает камень и древесину с неестественной ловкостью в темноте. Смертные марионетки в его владениях продолжают жить и умирать в тени его произведений, как куклы в своих кукольных домиках."
 POD_patronlore.100.desc.560097:0 "Белый Страж — древняя и загадочная фигура среди магистров. Его потомки, Изгои, составляют боковую линию Ласомбра, которую часто называют «белой тенью». Они охраняют Безмолвие Крови — Маскарад. Ставя долг превыше всего, эти стражи берегут будущее своего дома и династии."
 POD_patronlore.100.desc.560098:0 "Имея прошлое мелкого боснийского дворянина, ревностного последователя богомильства и талантливого врача, Голуб привлек внимание и объятия Никиты Средецкого. Это, однако, не привело к появлению добровольной пешки, которая бы сочетала в себе светское влияние, религиозную преданность и образованность для Никиты. \n\nГолуб был сильно напуган Каинитской Ересью и ее развращением церкви. Стремясь уйти от досягаемости своего сира, он искал владения на грани влияния Никиты. Тем не менее, он не бежит дальше этого, поскольку чувствует себя ответственным за ответный удар по монстрам, которые держат веру в заложниках. С этой целью он нанес удар по нескольким старейшинам и служителям Ереси, с которыми столкнулся. Невольно, несмотря на то, что он считал себя спасителем, он стал относиться к религиозным институтам как к врагам. Он видит во всем влияние Ереси и своего сира."
 POD_patronlore.100.desc.560099:0 "Ниоба родилась примерно в 14 веке до нашей эры в микенском городе-государстве Фивы, расположенном в Беотии. До наших дней дошло мало информации, хотя мы можем предположить благородное происхождение и интерес к искусству или музыке. Свидетельства о его встрече с ее сиром Амфионом «Музыкантом» затерялись в глубинах времени, однако по ее внешнему виду мы можем оценить, что она получила объятия еще до своих первых тридцати весен. Здесь относительно скромное восхождение внутри клана не оставило никаких примечательных фактов для потомков, оставив таким образом пустоту до -519 г. до н. э., когда она покинула Грецию и перебралась в Рим в разгар конфликта между фиванцами и афинянами. Она осуществляла покровительство родственным художникам под защитой Тореадора и, похоже, не играла важной роли в интригах клана или Римской империи. В -509 г. до н.э. она встретила Танитбаала-Сахара, гостя Тита Вентура Камилла, который научил ее заветам своего философского трактата «О голоде и его утолении», наследником которого является Via Desideratio. С этого дня Ниоба приняла активное участие в делах молодой Римской республики, продвигая либертарианские ценности Виа Дезидератио, но столкнулась с противодействием со стороны культов Виа Регалис и Виа Целис. Маргинализированные из-за своих обычаев, считавшихся аморальными, последователи «Виа Дезидерацио» были заклеймены печатью позора и объявлены грешниками. Дошло до того, что ее хулители переименовали ее в «Путь грехов». Ниоба покинула Рим в конце I века до нашей эры и отправилась в Нарбонну, где возобновила свою прозелитическую деятельность. В 10 веке нашей эры она основала культ, посвященный Виа Противариус, в графстве Тулуза, чтобы распространять верования Пути Грехов на Юге. На заре катарской ереси Ниоба оказала на них влияние и организовала их с целью дестабилизировать Римскую церковь в Окситании. Во время альбигойского крестового похода она сначала присоединилась ко двору Эсклармонды ла Нуар, помогла ей отразить северное вторжение, а затем, при поддержке оппозиционных окситанских принцев, распустила Эсклармонду в свою пользу. Ниобе удалось укрепить свое влияние в Окситании и обратить этот регион на Путь Грехов, наконец осуществив свою мечту о стране убежища для ее угнетенных прислужников."
 POD_patronlore.100.desc.560104:0 "Хагбард родился в традиционной семье в Киевской Руси и в молодом возрасте привил ему должное почитание старых богов. Не дурак, когда его господин постановил, что королевство теперь стало христианским, он позволил ветрам перемен унести его далеко оттуда. После многочисленных приключений, прославившихся среди смертных того времени, бывалый путешественник, похоже, нашел дом, служащий византийскому императору в составе Варяжской гвардии. В Константинополе к упорному язычеству Хагбарда относились покровительственно или снисходительно, а не с открытой враждебностью, как в других местах, однако его вера в старых богов привлекала внимание совершенно иного рода. Он встретил человека, который показал ему, что боги его родины здесь не имеют власти... и в то же время познакомил его с теми, у кого она была. Его разум был разрушен объятиями, он цеплялся за несколько осколков того, кем он был, став стойким защитником древних богов своего приемного дома."
 POD_patronlore.100.desc.560105:0 "В свое время Виктор был внушающим страх российским генералом. Как правитель, хотя он и правил железной рукой, он всегда пользовался уважением своих подданных, к своему слову он не относился легкомысленно. За свою смертную жизнь он прошел путь от честного дворянина и полководца до повелителя обширных владений и значительного богатства. Другие видели в нем гордого человека, твердо верящего в традиции, но прежде всего Виктор всегда ценил власть и преданность своих людей. К тому времени, когда он состарился, он сформировал вокруг себя компанию элитных вассалов, достойных солдат, собранных со всех его земель как вассалов высочайшей преданности; но даже у них не было ответов на его величайший страх, его старость и неминуемую смерть. Но его деяния не остались незамеченными, и призрачная фигура пришла к Виктору, когда его смертная сила начала его покидать. Как существо ночи, его авторитет и жажда власти только росли по мере того, как открывался новый мир, полный возможностей.\n\nОднако вскоре Виктор понял, что теперь ему придется изменить свою стратегию и вместо того, чтобы править из центра внимания, ему придется делать это из тени. Он обнял своих ближайших слуг и отправился начинать все сначала и претендовать на владения в новом регионе. Человек непоколебимой убежденности, Виктор, в своей не-жизни подавал пример, как и раньше."
 POD_patronlore.100.desc.560106:0 "За шестьсот лет не-жизни Конрадо Адельчи накопил и раздал множество состояний, часто приобретенных законными способами в сфере торговли произведениями искусства, производства парфюмерии и т.п., но иногда приобретенных путем грабежа могил, контрабанды и других криминальных предприятий. \n\nОднажды, в первые дни своей не-жизни, Конрадо продал «дар Каина» бесплатно тем, кто действительно отчаялся, и тем, кто был готов платить. Его ошибки были «исправлены» Калидой до того, как Маскарад был нарушен. Кто-то должен финансировать щедрые вечера Тореадор, и для Калиды талант Конрадо к приобретению богатства поднялся до уровня искусства, по крайней мере, достаточного, чтобы выйти за рамки его юношеской неосмотрительности."
 POD_patronlore.100.desc.560107:0 "Будучи Фейри, Эшлинг страдала от проклятия Линхауна, из-за которого она быстро старела, если не могла украсть достаточно Гламура у смертных.  Пытаясь избежать этого проклятия, она создала свои собственные объятия, меняя одну зависимость на другую. \n\nНе желая подчиняться своему сиру, Эшлинг довольно быстро освободилась от его опеки.  Ее первые несколько лет жизни в Шотландском нагорье стали причиной появления первых легенд о ситхах Баобхане, или \"Banshee\".  Когда она научилась самостоятельно вливаться в общество каинитов, она с радостью восприняла это наследие, моделируя свой двор по образцу домов Фейри и устанавливая веру грешников, основанную на исполнении роли этого мифического существа."
 POD_patronlore.100.desc.560108:0 "После того как попытка авар захватить Константинополь в 626 г. провалилась, они повернули на запад и напали на территорию, заселенную альпийскими славянами. Племена объединились под своим новым лидером Валуком, который дал отпор аварам и основал Княжество Карантания.\n\nСо временем слава Валука росла, и слухи о его справедливом, но твердом правлении достигли ушей Вентру, которые приняли его в свой клан. После десятилетий правления Валук ушел со своего поста и вместо этого управлял судьбой своего народа из тени. Формируя их по своему образу и обеспечивая их выживание под властью различных иностранных держав.\n\nБудущая судьба:\n\nВалук продолжит вести свой народ в решающие годы двадцатого века. Когда его стремление обеспечить суверенное Карантанское государство завершилось в последние годы той эпохи, он снова передал его в руки своих смертных слуг. Некоторые говорят, что старый принц теперь полностью посвящает себя занятиям другой своей смертной страстью — искусству архитектуры."
 POD_patronlore.100.desc.560129:0 "При жизни Сулейман был членом экипажа пиратского корабля, грабившего Средиземное море.\n\nОн родился в Бейруте и в юном возрасте присоединился к кораблю \"Arua\" в качестве корабельного мальчика. На этом корабле Сулейман участвовал в грабежах, грабежах и морских сражениях и за несколько лет прошел путь от корабельного мальчика до важного члена команды.\n\nОн считает корабль своим единственным домом, а команду — единственной семьей. Прибытие халифа Османа в Сирию предлагает Сулейману новое видение: он вместе со своей командой принимает новую религию, грабит и убивает врагов своей новой веры.\n\nНо он привлекает внимание, а вампирическая сторона распространения ислама хочет контролировать моря и считает, что наличие Сулеймана на своей стороне может быть преимуществом против византийцев.\n\n«Аруа» атакован ночью, корабль разорен, команда убита, а Сулейман тяжело ранен. Когда он умирает, существо предлагает ему контракт - бессмертие в обмен на его таланты по защите истинной веры и общества вампиров. Он согласился и с того дня путешествовал по землям и морям, чтобы защитить свою веру."
 POD_patronlore.100.desc.560130:0 "Бывший раб в Древней Римской империи, родившийся в конце III века, раб с рождения, его зовут Аттик. Грек, принадлежавший патрицию, он с детства был хорошо образован в военном деле. Аттикус стал обладателем сильного тела, воли и очень острого ума.  Аттикус всегда проявлял большие способности к бою и был очень любопытен, постоянно тренировался и читал книги. Именно чтение запретного тома принесло ему шрамы на спине. Его продали ланисте в возрасте двенадцати лет. Пока он готовился к арене, он все еще стремился улучшить свои знания. Он стал одним из лучших порабощенных гладиаторов лудуса. Он выиграл все шестнадцать своих матчей на арене. Ему предложили шанс на «свободу», если он будет служить в легионах. На передовой он проделал невероятную работу и даже сыграл важную роль в победе в некоторых сражениях. Он провел на службе три года, но его ланиста потребовала последнего гладиаторского боя, из которого Аттик вышел победителем. Той ночью, когда он пошел поговорить со своим ланистой, чтобы наконец обрести свободу, он попал в засаду и получил ножевое ранение. Из тени вышла фигура и спросила, чего он хочет больше: свободы, мести или смерти. Он с готовностью принял предложение, и фигура заставила его выпить его кровь, чтобы залечить раны, и объяснила ему ситуацию, что его ланиста был тем, кто послал убийц убить Аттикуса. Он узнал своего спасителя как Каротоса. Его домитор какое-то время наблюдал за ним. Той ночью Аттикус посетил своего ланиста и убил его. После этого его в течение десяти лет обучали обществу каинитов. После этого Каротос, рассудив, чего стоит Аттик, обнял его. Большую часть своего времени с момента оттачивания своих навыков и знаний Аттикус проводил, постоянно странствуя."
 POD_patronlore.100.desc.560131:0 "Не-жизнь Ринивы, женщины накладывающейся лжи, началась, когда ее продали в рабство в Византийскую империю далеко от дома. Ее сир думал, что знания Ринивы об индийском колдовстве помогут их делу, и счел ее исключительной покупкой, даже слишком выгодной для кражи. Это было именно так; Ринива продала себя в рабство под псевдонимом, чтобы избежать обязательств перед своими первоначальными наставниками по магии. \n\nКак только юная выскочка получила бессмертие от своего нового благодетеля, она запустила серию событий, которые заставили ее тоже бежать из этой новой земли, но эти планы были прерваны набегом \"уходящей в отставку \" Варяжской гвардии, грабящей ее. Village.\n\nПритворившись девицей в беде, Ринива согласился с захватчиками и сыграл роль пленной девушки. Она отправилась с этой командой воинов обратно на родину своих предков, чтобы посмотреть, как она будет распоряжаться своей собственной силовой базой вдали от тех, кому она обязана бессмертием, и еще дальше от тех, кому она обязана магией. Ринива, наконец, получила свободу действовать так, как ей заблагорассудится, окруженная зачарованными воинами и отделенная от влияния каких-либо наставников или должников, но ее старые трюки могут вскоре настигнуть ее, когда она приблизится к северному краю света. Еще одно предательство, и бежать, возможно, уже некуда."
 POD_patronlore.100.desc.560136:0 "По жизни простой торговец, Амбеса подвергся нападению ночью и был брошен умирать. На следующий вечер она проснулась без сердцебиения и без воспоминаний о том, что с ней произошло. За десятилетия она узнала природу своего состояния и использовала силу, дарованную ей неизвестным сиром, чтобы бороться за контроль над своим горным домом. \n\nМногие смотрели бы свысока на претензии Каитифов на власть, но многие ослеплены долгом перед своей родословной. Сородичи, спорящие о своем происхождении от Каина, Сета и Сапатасуры, наводняют Восточную Африку. Они все забывают, что сила исходит не от рода, а от крови, и Амбеса намерена захватить ее как можно больше."
 POD_patronlore.100.desc.560138:0 "Аль Муалим, свое настоящее имя, которое она оставила в стороне, — воин/ученый и, что более важно, защитник Святой Земли. Ее отец родился в Мекке и был лидером каравана и зарабатывал на жизнь, путешествуя по султанату Айюбидов в Египте. Ее старший брат был опытным фехтовальщиком и ведущим стражником каравана. Именно он по ночам (после долгих приставаний) обучал Аль-Муалима технике владения мечом и бою. \n\nДо тех пор, пока в одну роковую ночь группа крестоносцев не наткнулась на деревню, где караван остановился на ночь, убила ее жителей и сожгла ее дотла. Аль Муалим спасена и обнята Сородичем вскоре после того, как она устроила засаду на нападавших, убив их, но оставив смертельно раненой. Оставив позади свою жизнь, она отказывается от своего имени и становится безымянным оружием, используемым против крестоносцев и их собратьев-нежити, специализируясь на асимметричной войне. Со временем, благодаря своим навыкам и способностям, она начинает обучать других Неонатов тому, как устраивать засады и вообще сражаться."
 POD_patronlore.100.desc.560144:0 "Когда сир Розали впервые увидел ее, она подумала, что дочка хорошенького аристократа, которая все дни спала с прислугой, будет послушным и послушным ребенком. Однако с годами она увидела, как ее новая игрушка привлекла внимание всех, кто ее окружал, и вскоре стала более высокомерной, чем принцесса королевской крови. Розали знала, что думает о ней ее сэр, но это не имело значения, все это не имело значения. Вскоре все слуги увидели в ней свою госпожу, поэтому было слишком легко свергнуть сира, который так плохо о ней думал. Ей это наскучило, и она никогда не казалась удовлетворенной, какое бы внимание ей ни оказывали. Вскоре она начала свои путешествия по известному миру в поисках чего-то недостижимого, существующего только в рассказах. \n\nИменно во Франции, среди множества великолепий Парижа, она наконец нашла то, что искала. Принцесса, которая так сильно напоминала ей саму себя. Призрачный призрак, которого так ненавидит ее семья и все вокруг. Она пожалела бедную девушку, спрятавшись среди многочисленных придворных, чтобы обеспечить ее безопасность. Но это длилось недолго, потому что в семнадцатую зиму девочки случилась трагедия. Болезнь, которая так долго мучила ее, обострилась без всякой надежды на излечение. Глубокой ночью остался только один спаситель, который вытащил умирающего ребенка из дворца на свободу. \n\nОднако, как только она почувствовала себя завершенной, была обнаружена новая недостающая часть. Что хорошего в принцессе, которой нельзя править королевством? Итак, Розали пережидает годы, набираясь сил, пока, возможно, когда-нибудь они оба не вернутся домой во Францию ​​с армией верных солдат."
 POD_patronlore.100.desc.560150:0 "При жизни этот датский почитатель Тора присоединился к войску короля Багсега во время завоевания Англии викингами. В 871 году он пал в битве при Эшдауне, но валькирии Одина избрали его одним из эйнхериев. Впрочем, путь йотунов пришёлся ему больше по душе."
 POD_patronlore.100.desc.560152:0 "Салюбри Барахиэль прибыл в Константинополь, чтобы оберегать город от растущего влияния Баали. Михаил и его идеалы произвели на него глубокое впечатление. Он тайно поддерживал Мечту, охотясь на Баали в городе и окрестностях. После диаблери Михаила Барахиэль был убит горем: он считал себя отчасти виновным в Окончательной смерти патриарха. Сомневаясь, что ещё способен охотиться на Баали, он уединился на Мальте."
 POD_patronlore.100.desc.560163:0 "Даниэль был многим в жизни: странником, игроком, пьяницей и т. д. И все же казалось, что у него всегда были странные интеллектуальные наклонности. Он научился читать, временами делал ставки на книги или отрывки из фольклора, даже, как известно, делал ставку на десятилетие службы лорду в обмен на возможность читать его библиотеку. Он победил, хотя после нескольких долгих дней учебы и бесед с лордом земли его пригласили остаться, чтобы помочь с каким-то проектом лорда. Проект, как оказалось, имел инфернальный характер, ибо владыкой оказался один из Баали. После одного не очень успешного демонического ритуала и самой быстрой мили, которую когда-либо пробегал Даниэль, Даниэль вскоре был найден Малкавианом, нанятым Митрой, который понял, что Даниэль знал слишком много. Понимая, что конец близок, Даниэль попросил еще одну последнюю игру и поставил на кон свою жизнь. Это позабавило сына Малкава, и когда Даниэль с трудом победил, ему предложили выбор: умереть истощенным, но в экстазе, быть связанным своей службой в качестве гуля (хотя в то время он не знал, что это значит) или стать сыном Малкава. С той ночи Даниэль ведет себя так же, как и раньше, но часто берет псевдонимы, связанные с местными духами или олицетворениями удачи, соблазняя смертных знаниями или сокровищами, которые он приобрел. Недавно он оказался в Германии, где игра, ставшая жестокой, привела к тому, что он потерял контроль и диаблеризировал другого Малкавиана, потенциал и последствия такого действия его сейчас беспокоят."
 POD_patronlore.100.desc.560169:0 "Неферхеперу только что вернулся из своего цикла впервые за более чем две тысячи лет, оставив его плохо приспособленным к современной эпохе, а его знаменитую тактику бесполезной в мире, столь изменившемся по сравнению с Бронзовым веком и Богами, в которых он жил. Он так же предан Золотому Гору, как и в юности, которая, как он утверждает, произошла во времена правления его матери – Хатшепсут. История, однако, утверждает, что Тутмос Неферхеперу Хатшепсут дожил до пятидесяти лет, что вносит некоторую путаницу в отношении правдивости истории Неферхеперу. Все, что Шемшу-Херу знает наверняка, это то, что золотокожий человек — набожный воин, который быстро стремится узнать все, что нужно знать о мире, в котором он сейчас населяет."
 POD_patronlore.100.desc.560174:0 "Будучи лидером англо-нормандских наемников, Стивен Гавейн присоединился к Варяжской гвардии и быстро поднялся по служебной лестнице, став одним из самых важных полководцев империи в последующих войнах. Его жестокая и беспринципная тактика заставила жителей Константинополя сравнивать его с Русселем де Байёлем. Хотя он пытался доказать, что не предаст их, высшие эшелоны империи, включая, возможно, самого императора Алексиоса I, сомневались в его лояльности. Несмотря на недоверие Византийской империи, Велизарий признал его преданность и страдания и обнял его в начале 1119 года.\n\nНа протяжении всей своей жизни Гауэн оставался верным и использовал свои хитрые и жестокие методы, чтобы закрепить свое положение принца Синопы/Попейополя, и тайно помогал имперской армии в отражении любых вторгающихся врагов, пока Горькие крестоносцы не уничтожили Византийскую империю и Мечту о Сородичах.\n\nЗа свою карьеру у него завязался подпольный роман с великой принцессой империи Анной Комниной. Однако благодаря своей лояльности он не стал участником заговора Великой Княгини против ее брата. После Объятий Великой Принцессы он стал ее стойким сторонником во сне. Однако он быстро обнаруживает, что Анна уже не та женщина, которую он когда-то любил, а лишь порочный, злобный остаток. Теперь Стивен Гоуэн живет в боли, движимый надеждой, что его возлюбленная снова станет тем человеком, которого он любил."
 POD_patronlore.100.desc.560176:0 "Однажды конный солдат на службе у местного лорда, который в порыве ярости организовал гибель целого рода после того, как его суженая предпочла ему молодого лорда. Он устроил вечеринку, на которой все гости погибли в пожаре. Вскоре его обняли, потому что один из гостей был каинитом, о котором он не подозревал.  План был блестящим, и он даже организовал тяжелые телеги, чтобы люди не могли сбежать.  Ценой была его жизнь на службе своему сиру.  Тень, одержимая нечистотой клана и возвышающая его сира. Диаблери была одной из вещей, которые ему нравились.  Это питает внутреннюю тьму, которую он держит даже в не-жизни.  Иногда он сокрушается, что приготовил свою единственную любовь на огне, предназначенном только для его цели. Переживает приступы меланхолического поведения.  С течением веков он стал холоднее относиться к смерти, но всегда питал слабость к любовникам и теневым демонам."
 POD_patronlore.100.desc.560183:0 "Родилась в семье мелкого польского дворянина. Ее отец и мать были холодными и расчетливыми существами, заботившимися только о повышении своего положения среди знати. Известная своей красотой и умом, Зофия в юном возрасте была выдана замуж за соседнего лорда, чтобы обеспечить союз своему отцу, но ее независимый характер противоречил его ожиданиям, и ее раздражало внимание мужа. В результате он оскорбил ее как физически, так и морально, и она быстро переняла худшие стороны личности как его, так и ее родителей. Устав от ситуации, она соблазнила молодого оруженосца, которому удалось убить лорда, а затем выдала его властям, чтобы замаскировать свой побег. Она даже не подозревала, что за ней наблюдает еще более опасный наблюдатель. \n\nЗахваченная и заключенная в плен садистским Гедеоном Ярославичем, Зофье посчастливилось пережить последствия. Пристальный интерес к искусству Изменчивости, возможно, спас ее от того, чтобы стать следующим экспериментом Гедеона, или же ее коварство и жестокость отвлекли его внимание на время, достаточное для того, чтобы избежать кровных уз. Решив, что дистанцироваться от своего сира и его планов было хорошей идеей, Зофия взялась за себя, намереваясь изучить как можно больше дисциплин, используя соблазнение, интриги и старые добрые убийства."
 POD_patronlore.100.desc.560184:0 "Умейя был прародителем клана Омейядов в Курайшите (Мекка), который был основан до ислама. Его приняли, когда ему было около 20 лет до ислама, но его вдохновили речи пророка, которые он услышал от замученных мусульман вокруг курайшитов, когда Пророк начал проповедовать свое послание. Он принял ислам за считанные недели. С тех пор он помогал мусульманам мигрировать из Мекки, установил власть над Мединой и помог им добиться победы в их первых битвах с противниками ислама. \n\nУмайя тайно поддерживал свою семью, позволяя им управлять мусульманским миром в течение 100 лет и еще 200 лет в Аль-Андалусе, прежде чем впасть в состояние оцепенения. Он непосредственно помогал Абд аль-Рахману, будущему первому правителю Аль-Андалуса, уклоняться от ярости Аббасидов. \n\nКогда династия Умайи отошла от власти в Кордове, он находился в ступоре. Причина его добровольного оцепенения остается загадкой; однако некоторые Сородичи предполагают, что это могло произойти из-за того, что Омейяды отказались от своего бедуинского наследия и в конечном итоге перешли к более гедонистическому образу жизни. \n\nНедавно в 1100-х годах он был разбужен королевой Бадр «Меч Аль-Андалуса». Она попросила его помощи в защите Аль-Андалуса, и он поклялся помочь ей после того, как приведет тех, кого он сочтет достойными, из остатков своей семьи обратно в Мекку. По прибытии он решил совершить хадж, узнав, что суровость расчленения уменьшилась. С тех пор он правил вместе с герцогом Тариком, оказавшись неоценимым помощником в управлении городом Аль-Таиф вместо него. На сегодняшний день он не вернулся в Аль-Андалус, чтобы помочь королеве Бадру, и пока он не вернулся, люди называли его клятвопреступником."
 POD_patronlore.100.desc.560186:0 "Родом из Центральной Азии, Себастьяну наскучила нежизнь на протяжении многих поколений, поскольку он не видел никакой реальной цели в такой долгой и бесконечной жизни. \n\nВо время бурных событий, которые привели к Войне покровителей в середине 1300-х годов, он встретил молодую еврейскую служанку по имени Тали Берлингер. Эти двое тайно влюбились друг в друга и поддерживали тайные отношения около двух лет, пока Себатион не нашел Тали мертвой в своих покоях с обескровленной кровью. Это привело Себатиона в слепое безумие, убивающее каждого гуля и вампира, которых он видел. Он обратился против своей семьи, убив каждого из них, независимо от того, были ли они в этом виноваты или нет. Спаслись только смертные слуги-люди, но они были явно и эмоционально травмированы тем, что видели, как гигант-вампир разрывал членов своей семьи на части. После того, как он закончил и безумие утихло, он вернулся в тело Тали и поклялся убить всю нежить, а затем, в конечном итоге, и себя. Он уехал из поместья своей семьи в Дантенкул, раскрыв себя и существование вампиров всему городу. Затем он объявил о начале предательского крестового похода и заручился поддержкой крестьян, купцов и дворян. После он встретился с Судьями, провозгласившими новую веру — Отвергшими Каина. Краген превратил их в охотников, поклявшихся в своем существовании истреблять нежить, прежде чем обратить клинки на себя. Они верят, что Себатион — полубог, посланный Яхве, чтобы вернуть себе царство смертных. Когда их задача будет выполнена, они покончат с собой и будут охвачены светом Яхве. Или они так считают."
 POD_patronlore.100.desc.560187:0 "Соня, родившаяся около 929 года в холодном Нордмарке, вскоре поняла, что ее будущее ждет где-то в другом месте. Всегда мечтая о приключениях, она никогда не обращала особого внимания на ведение домашнего хозяйства и цифры. Но меч… это было то, что она могла хорошо понять. Проявив себя против норвежцев и датских налетчиков, она служила воительницей у местного ярла. Но этого было недостаточно. Золота было мало, и, поскольку она была склонна тратить каждую монету на новую одежду, оружие или пантагрюэльские праздники со своими товарищами, это не помогло. Однажды прибыли гонцы из земель Греции. Император Константин призывал воинов, готовых сражаться за него, в так называемую «Варяжскую гвардию», предлагая большие награды в золоте и славе. Вместе с другими, жаждущими приключений, она отправилась в путь, оставив все позади. Византийский двор представлял собой совершенно новый мир, настолько отличавшийся от Нордмарка. На улицах Константинополя, города чудес, она открыла для себя новые языки, обычаи, удовольствия и способы потратить свое золото. В 949 году против Критского эмирата был организован большой поход, в бой были отправлены сотни варягов, в том числе и Соня. После того как их некомпетентный лидер Константин Гонгилес повел их в катастрофическую битву, лишь немногим из них удалось вернуться в Константинополь живыми. Разочарованная и скучающая, она впала в саморазрушительную спираль: слишком много алкоголя и слишком много борделей. Однажды ночью она встретила женщину, в ней было что-то другое, не то, к чему она привыкла. Она не предлагала свои услуги и не искала монеты, а вместо этого сделала ей предложение: новую жизнь, вечную молодость, но, что еще важнее, вечность, чтобы проявить себя. С тех пор, как ее обняли в ту ночь, Соня сражалась за множество разных лордов на самых разных полях сражений, от засушливых песков Иерусалима до Кавказа, всегда в поисках славы. И золото."
 POD_patronlore.100.desc.560188:0 "Безумный шаман. Ходят слухи, что с помощью колдовства он заставил одного из Тремер дать ему Становление. Никто не знает его настоящего имени, но он всегда носит с собой клушицу."
 POD_patronlore.100.desc.560189:0 "Когда гражданская война разорвала Средиземье и разделила династию Центральных Равнин на три части, а У Лунг и Братья Акаши боролись за конфронтацию, великодушный правитель сиял, как падающая звезда в северном Китае. Независимый маг Фу Цзянь, назвавшийся Тянь Ванем, открыл небесное царство на северной земле вдали от пламени войны. Однако хорошие времена длились недолго, и У Лунг в конечном итоге разорвала свое правление. \n\nПосле того, как Фу Цзянь была забыта временем, новый Небесный Царь вернулся в Средиземье в образе бессмертного, сопровождаемый предельной добротой и храбростью, соответствующей Тянь Вану, чтобы спасти китайский народ от страданий."
 POD_patronlore.100.desc.560190:0 "Он — сын безвестного кельтского воина, участвовавшего во множестве восстаний против римского вторжения. Избитый и израненный, он в конце концов получил Становление от тех, кого пытался изгнать с родной земли. Спустя столько веков жажда мести всё ещё живёт в нём. Человек многих имён, ныне Бенедикт, никогда не раскрывает своего прошлого: почти все, кто знал его при жизни, давно исчезли. Возможно, его сир всё ещё где-то там..."
 POD_patronlore.100.desc.560192:0 "Она происходит из Братства Книги. Родившись в 970 году у родителей-фей, она была удочерена учёным-вампиром и теперь стремится узнать всё возможное о других сверхъестественных существах. Её родители давно умерли, а унаследованные от них сверхъестественные черты проявились гораздо позже. Поэтому большинство в племени считало, что она от рождения слабее даже смертного."
 POD_patronlore.100.desc.560196:0 "На улицах Ванна молодой бретонский дворянин вел праздную жизнь. Он кутил, дрался и лгал, сколько душе угодно. \n\n Несмотря на все свои недостатки, он лелеял своего младшего брата, их связь укреплялась невзгодами в раннем возрасте. Однако он не смог остановить неизбежное. Темные ночи разворачивались жуткими знамениями: от теней до истощенных трупов. Наступил ужас, и пришла смерть. Смерть их владениям, их людям и их земле. \n\nОн потерял все. Его шаги были бесцельными, он нашел цель в Народном крестовом походе по возвращению Иерусалима. Ибо, конечно же, думал он, какое бы зло ни преследовало Ванна, оно также было врагом Бога. \n\nЭто была массовая резня, но он боролся до победного конца. Впечатленный его решимостью, капитан наёмников предложил ему возможность — быть принятым и возродиться в качестве члена клана Бруха.\n\nС этого момента Сильвен присоединился к делу Огненосца. Признав его скрытый талант, сир превратил его в опытного дуэлянта. В его обязанности входило наблюдение за ячейками Прометея и устранение угроз как снаружи, так и внутри. \n\nОставив за собой след кровавой бойни, так называемый «Палач» со временем разочаровался. С тех пор он ушел и теперь пытается сам вершить свою судьбу. \n\nОднако даже сейчас есть счеты, которые нужно свести. Убийство Ванна и его брата не может остаться без ответа. Потомков Цимисхов придется заплатить."
 POD_patronlore.100.desc.560197:0 "Нафиса родилась в бедуинском племени с кровью фей. Её наследие проявилось в необычайном долголетии и вороньих крыльях за спиной. Племя почитало её как дух Перемен, хотя взамен поклонения она дарила им немногое. Спустя сотни лет она выучила наизусть Коран, священную книгу молодой религии ислама, и стала известна как хафиза.\n\nФормально она получила Становление в одном из Великих кланов, но навсегда осталась чужой. Говорят, этот «Крылатый элементаль» решительно противостоит единобожию и догматической враждебности к другим сверхъестественным существам."
 POD_patronlore.100.desc.560200:0 "Под новой луной, среди огромных извивающихся змей цивилизации, родился мальчик. Чешуйчатый ребенок Адрахасис, потомок мелкой знати, держался в тайне. Выросший в тени, Адрахасис проявил сверхъестественную склонность к познанию секретов. Его очевидные весы, являвшиеся семейной тайной, привели его к жесткой изоляции. Когда он приблизился к подростковому возрасту, внутри него назревало что-то мерзкое. В возрасте 17 лет он сбежал из тюрьмы, взяв с собой большую часть богатства семьи. Затем в течение пяти лет он провел все это, исполняя каждое свое желание, ведя его на север, в дебри Европы. \n\nВозможно, из жалости, презрения или по каким-либо другим подобным причинам его обняли под кроваво-красной луной. В любом случае, следующее столетие он провел под присмотром своего сира, впитывая знания, как губка. В 490 г. до н.э., уставший от своего сира, Адрахасис обманул Сородичей и бежал на юг, в Марафон, только для того, чтобы быть вовлеченным в битву. После Марафонской битвы он провел годы, исследуя греческие города-государства. Он стал советником, нашептывая идеи влиятельным фигурам под прикрытием «Темнения». В конце концов он отправился на восток, Адрахасис стал участвовать в возвышении Империи Маурьев в Индии. Он проводил время, изучая множество религиозных и философских текстов, он даже ненадолго преследовал знания, которые преследовал Саулот. Он отказался от этого начинания, когда потерял ногу в результате травмы одного из [Glossary('Голодные мертвецы','game_concept_kuei_jin_desc')], которая никогда полностью не заживет. Рана ввергнет его в оцепенение, в котором он останется до 12 года нашей эры. За это время слуги-гули перевезли его на запад и похоронили в Леванте. В 19 году нашей эры он начал путешествовать в Тир, где получил бы больше «необычных» знаний. \n\nУстав от хаоса Рима, он вернулся на восток, в Индию, где он скитался до 312 года нашей эры. Однажды Адрахасис столкнулся с [Glossary('Ван-куэй','game_concept_kuei_jin_desc')], который его покалечил. Говорят, что битва длилась четырнадцать ночей. Результат остается неизвестным, известно лишь то, что Адрахасис бежал на юг, в Шри-Ланку. Там он подчинится кровной связи с Картарирьей в обмен на убежище. Он поселится в Ратнапуре, городе драгоценных камней. С тех пор он снова включился в политику общества Сородичей, узы крови ослабли или, возможно, исчезли. \n\nСейчас настало время для более великих планов, ведь самый большой приз ждет, Индия созрела для его получения."
 POD_patronlore.100.desc.560201:0 "Арен Дарквелл, доблестный воин, вступивший в клан Ласомбра в 648 году, быстро добился известности благодаря своему мастерству тени — навыку, которым он со смертоносным изяществом владел на полях сражений средневековой Европы. В 1066 году он руководил тенями Нормандского завоевания, склонив чашу весов власти и изменив политический ландшафт Англии. К XII веку влияние Арена распространилось на крестовые походы, где он ловко лавировал в хаосе, используя конфликты для укрепления позиций своего клана и устранения соперников под видом священной войны. Теперь, в 1250 году во Франции, он выступает в роли призрачного творца королей, его имя шепчут с почтением и страхом при дворах Европы, а его темное наследие продолжает формировать судьбы народов."
 POD_patronlore.100.desc.560202:0 "Аларвин родилась в семье датского капитана-рейдера и его наложницы и провела большую часть своей земной жизни в море. Будучи ребенком-затворником, она обладала талантом к странным оккультным ритуалам с участием мертвых, которые она держала при себе, тайно практикуя свое «искусство» с телами павших жертв набегов ее отца. Когда она была еще подростком, она встретила Раймонду Руссель Жафет, вампиршу из каппадокийского клана, которая увидела таланты молодой девушки и решила присмотреть за ней. Спустя годы, после смерти ее отца во время неудавшегося рейда, Раймонда решила, что пришло время обнять Аларвин. Аларвин быстро адаптировалась к своей новой жизни вампира, развивая свои навыки некроманта, и продолжила идти по стопам своего отца, возглавляя рейдерскую команду, состоящую из гулей, призраков и других вампиров."
 POD_patronlore.100.desc.560211:0 "Байчанси когда-то был чиновником, ответственным за запись истории династии Восточная Хань. Когда Дун Чжо сжег Лоян, его жестоко убили, чтобы защитить библиотеку. \n\nКогда его душа вернулась на Центральные равнины, он просто хотел что-то сделать для страны. Но война не прекратилась, страна ханьцев была разрушена, а десятки миллионов людей были вырезаны или даже съедены варварами. И он ничего не мог с этим поделать. \n\nПозже он тихо уединился в бамбуковом лесу, каждый день выпивая со своими смертными друзьями, как будто он многое забыл. На самом деле все вокруг знают, что после всего этого его личность изменилась и он сошел с ума."
 POD_patronlore.100.desc.560214:0 "Получив шрамы в бою, Гаррет, воин из Германии, оказался в центре конфликта в Германии, когда на него нацелился вампир-некромант из Греции. Став свидетелем бесстрашного броска Гаррета в разгар битвы с конкурирующими германскими племенами, принц-вампир был вынужден обнять его, признавая выдающееся боевое мастерство, которое выделяло Гаррета среди враждующих племен.\nБез ведома принца, способности Гаррета были усилены веществами, которые повысили его боевые навыки. Тем не менее, вампир видел в нем потенциал как верного телохранителя. После трансформации разум Гаррета склонился к безумию, углубляясь в царство смерти и Некромантии, черпая вдохновение из древнегреческой истории, знаний друидов и общения с умершими. Истории смертных о друидах и острове Гиперион утверждают, что они исчезли.\nПоскольку жажда знаний Гаррета соперничала с его боевым мастерством, между ним и его хозяином-вампиром развернулись сложные отношения. Выполняя свои обязанности телохранителя, ненасытное любопытство Гаррета побудило его исследовать тайны возрождения и мести, присоединившись к таким божествам, как Дионисий, Геката, Аид и Най, богам подземного мира.\nНе интересуясь политикой и дипломатией, Гарретт сосредоточился только на оттачивании своих навыков воина и призывателя мертвых, владея знаменитым копьем, полученным еще во времена немецких войн. Будучи преданным телохранителем повелителя вампиров, Гарретт продемонстрировал свою огромную силу, легко расправляясь с врагами легким движением руки, используя копье в качестве барьера между собой и своим хозяином.\nОднако по воле судьбы повелитель вампиров погиб при загадочных обстоятельствах, оставив Гарретта на распутье. Должен ли он искать нового хозяина или воспользоваться возможностью проложить свой путь в качестве мастера Некромантии, используя свои силы, чтобы установить грозное Присутствие в мире? Будущее Гаррета обещает историю власти, амбиций и вечной борьбы между рабством и автономией."
 POD_patronlore.100.desc.560216:0 "Григорий родился вторым сыном мелкого грузинского дворянина, получившего образование в области теологии, медицины и истории, а также изучив греческий и латынь, чтобы подготовиться к монашеству. Прилежный в учебе, Григорий всегда был довольно отстраненным и замкнутым, хотя сверстники по-прежнему любили его за его сдержанное поведение. В конце концов он привлек внимание каппадокийца Андреаса, который увидел в молодом ученом большой потенциал и вскоре принял его. Григори быстро адаптировался к своей новой вампирической природе и доказал, что оправдал ожидания своего сира, продемонстрировав непосредственный интерес к Некромантии. Однако Андреас не смог увидеть монстра, скрывающегося внутри его ребенка, ослепленный растущей любовью. Действительно, Григория по-настоящему интересовало только одно: боль других. Его принятие в клан смерти было просто возможностью более свободно выразить себя и насладиться агонией мертвых так же, как и живых. Тем не менее, он сохранял вид довольного и любящего ребенка, изучая тонкости вампирского общества, пока однажды не открыл для себя концепцию диаблери. Григори сразу же был одержим идеей навсегда запереть в себе измученную душу, и поэтому начал строить заговор. Поставить Андреаса в уязвимое положение было несложно: его сир уже полностью доверял ему, а Григорий хорошо знал о его страсти, так что интригану оставалось лишь притвориться, что он испытывает взаимные чувства. Через месяц дело было сделано, и Григорию удалось хорошо скрыть свою вину, смакуя в уме муки своего сира. Желая дистанцироваться от остального своего клана, Григори теперь поступил на службу к Бруха Херлева и приобрел некоторое влияние в Арбаноне, обеспечив себе хорошее население для пыток."
 POD_patronlore.100.desc.560225:0 "С юных лет Антону фон Ликаону приходилось видеть последствия репрессивного вассального подчинения феодальной системы, без надежды когда-либо подняться выше положения своей семьи и жить в крайней нищете. Он быстро понял, что проповедь социальных перемен должна быть встречена жестокими репрессиями и насмешками, в конце концов, лорды знали лучше. Прежде чем смириться с жизнью крепостного права, он привлек внимание проходящего мимо анарха-вампира, который услышал о его отсутствии страха перед властью и его стремлении всегда стремиться к улучшению условий жизни людей, мало чем отличаясь от его собственных. Именно такое же неуважение к законам, которые он не одобрял, сделало этого пиявку сэра Антона, прежде чем его быстро убил местный шериф за то, что он сделал это без разрешения. Теперь, проснувшись в мире тьмы, безродный, проклятый, Антон стал не менее тем человеком, которым он был раньше: проведя свое небольшое время в этом новом мире, изучая все виды сверхъестественных знаний, он нашел свое новое призвание: поднимать как смертных, так и сверхъестественных существ выше и выше и нести просвещение массам. Люди так же важны, как и сверхъестественные существа, и он хочет донести свое видение до всех, при необходимости силой, особенно по отношению к более \"традиционным\" вампирам, которых он может встретить на своем пути."
 POD_patronlore.100.desc.560226:0 "Астерион «Минотавр» из Алеппо родился в 765 году до нашей эры на острове Крит. Внебрачный сын Пасифаи (жены тогдашнего царя Миноса). Чтобы сохранить личность отца в секрете, она заключила сделку с демоном, чтобы изменить внешний вид ребенка, чтобы его нельзя было узнать с отцом. Чего она не ожидала, так это того, что ребенок, Астерион, родится с рогами, напоминающими бычьи, в соответствии с обещанием демона, что никто не узнает, кто был отцом. Астерион будет брошен в лабиринт под Кноссом на Крите, где его единственным веществом будут люди, посланные внизу, чтобы убить его. Лишь через 20 лет после его рождения Домитрикс Табита, «Хозяйка тайн» Ордена Молоха, услышала рассказы о Быке Миносе. Позже она сфабриковала события смерти Астериона греческому герою Тесею и обратила его в 745 году до нашей эры. Как его сир, Танит Молохим поможет ему сбежать из лабиринта и сослать в Алеппо, где он верно служит ей, своей спасительнице. Время, проведенное за пределами Крита, сделало Астериона мстительным и разгневанным по отношению к человечеству."
 POD_patronlore.100.desc.560228:0 "Всю свою земную жизнь Якуба высмеивали за его внешний вид. Жители его деревни считали, что его развратили демоны, ниспосланные на деревню как проклятие. Якуб оказался изгоем, вынужденным жить в избе на окраине села. Якуб находился на самом дне социальной иерархии, дети часто играли в игру, придя к нему домой, чтобы «убить зверя», поджигая его дом или бросая в него камни, когда он уходил собирать урожай. \nОднажды ночью, когда Якуб собирался спать, он услышал ручей в своем доме. В панике Якуб схватил злоумышленника и бил его по столу, пока он не перестал представлять угрозу. Когда Якуб поднес лица злоумышленников к свету свечей, он с ужасом увидел лицо одного из детей, которые часто совершали набеги на его дом. Он стал зверем, которым его считали, и в порыве печали и ярости сбежал из дома, зная, что за ним будут охотиться. Той ночью Якуб спал глубоко в пустыне, но его сон был нарушен впиванием зубов в тело. Якуб почувствовал слабость, но вскоре эта слабость превратилась в силу. Когда Якуб поднялся, он почувствовал вновь обретенную силу, он знал, что тогда он был избран Богами. Перед ним лежало другое существо, ослабленное и уставшее. Якуб съел это существо, прежде чем вернуться в свою деревню и уготовить ту же участь своим бывшим преследователям. Тогда он знал свою миссию: он должен был стать богом, его мутация была не проклятием, а даром, и он создаст расу господ, подобную ему. Зная свою миссию, Якуб странствовал по миру, создавая мерзости, чтобы удовлетворить свои иллюзии о божественности."
 POD_patronlore.100.desc.560229:0 "Лишённый благословения гибрид, плод чудовищного насилия, хаотичная оболочка.\n\nКсено Амесс всегда ищет собственный путь к выживанию.\n\nНе рождённый грехом крови и не принятый в долг Ши, он обрёл истинную веру, пожертвовав глазами и встав на праведный путь. Лишь она может стать настоящей опорой... Или это насмешка божества?\n\n#glow_color:{1,0,0,1} Только в праведной вере он может найти свой путь.\n\nОн использует каждую каплю крови, чтобы нести истину.\n\n#!"
 POD_patronlore.100.desc.560234:0 "Почему так трудно найти готовность к переменам, независимо от вида? Живой, мертвый – сверхъестественное. Невиновный. В отличие от многих эгоманиакальных тиранов, Илья осознает, что поистине абсолютная власть, консолидированная вокруг одной фигуры, держится на поддержке и обожании легиона талантливых подхалимов с желаниями и амбициями, столь же изменчивыми, как и ее собственные. Такую привязанность может сформировать только личный контакт, личная связь, осознание того, что Илья участвовал в твоей жизни и дал тебе силы, которых тебе не хватало, чтобы спасти себя, совершенствоваться и стать лучше. Ей действительно не все равно. И поэтому ты готов ради нее на все. \n\nАпатия — это смерть слабых, как она любит говорить."
 POD_patronlore.100.desc.560235:0 "Родившийся альбиносом, бледнокожий Йорав искал убежища от мира в университетских занятиях. Однажды ночью этот нелюдимый студент увидел, как один из профессоров пьёт кровь его сокурсника. Мёртвый учёный набросился на Йорава и убил его. По счастливой случайности тот восстал из мёртвых вампиром."
 POD_patronlore.100.desc.560237:0 "Румынский крестьянин, бежавший на юг в результате набегов половцев на территорию, контролируемую Византией. Он стал грамотным во время службы под началом византийского дворянина и был принят благодаря своей жажде познания древнего мира и безграничному желанию достичь большей эрудиции посредством изучения древнегреческой литературы и философии.\nЕго жажда знаний вызвана бессилием, которое он чувствовал, когда половцы сожгли его деревню, но он не питает к ним никакой ненависти, а просто видит в них симптом разрушенного мира, который должен быть исправлен королем-философом, желающим достичь высшей власти, чтобы достичь высшей власти. превратить мир во что-то разумное.\nЕго главным достоинством является жажда знаний и скорость, с которой он усваивает информацию, но он не великий тактик и не знает, как общаться с другими.\nОн тихий человек, который достаточно хорошо хранит секреты, поэтому он в некоторой степени опытен в интригах, но еще не участвовал ни в каких заговорах\nФизически он вполне слаб, поскольку сосредоточен только на получении знаний в ущерб всему остальному. \nОн не скор на гнев и не держит обид, но склонен переоценивать свою значимость, заботясь в первую очередь о своем благополучии прежде, чем о других, но он не бессердечен, не причиняет ненужного вреда и не предает близких, разве что в крайнем случае. По сути, он прагматичный, аморальный человек, который признает необходимость сотрудничества с другими, но в конечном итоге заботится в первую очередь о себе и своих целях. \nОн совсем новичок в мире каинитов, но очень сосредоточен на том, чтобы узнать как можно больше и увеличить свою силу, одновременно перемещаясь по сети, которой является Воеводат."
 POD_patronlore.100.desc.560238:0 "Зантана получила Становление, когда первые скандинавские налётчики прибыли на остров Мэн. Она считала их воинами конца времён — Рагнарёка. Проклятие Малкавиан лишь укрепляет эту веру."
 POD_patronlore.100.desc.560239:0 "При жизни Ингридр отправили в варяжскую гвардию, но она отказалась служить солдатом. Вместо этого она начала продвигаться по службе среди интендантов. Получив Становление в клане Цимисхи, теперь она стремится к совершенству."
 POD_patronlore.100.desc.560241:0 "Ораз был жестоким человеком, когда был еще человеком. В юности его отвергла семья. С тех пор он не переставал причинять вред другим людям разными способами: воровал, похищал, нападал и убивал.\nВ какой-то момент в Сибири его укусил вампир. Он пытался ограбить не того человека поздно ночью на улице, он столкнулся со своей целью, именно вампир позже пытал его целую ночь, прежде чем, наконец, превратил его в одного из нежити.\nОраз был физически и психически помечен. Первое, что он сделал как вампир, — это вырезал всю свою смертную семью. \nОраз — любитель диаблери, регулярно пытающийся украсть души каинитов. И он никогда не почувствует, что его голод полностью утолен."
 POD_patronlore.100.desc.560242:0 "Джордейн Дайл родилась 17 января 100 года в семье Корвинусов, родословной, связанной с оборотнями, но лишенной их преобразующего дара. Будучи смертной, Джордайн преуспела в дипломатии, войне и бою, руководствуясь непреклонными принципами веры Гет Фенриса. Благодаря преданности и настойчивости он завершил священные обряды династии, открыв полный набор привилегий династии «Получение Фенриса», даровав ему непревзойденную стойкость, боевое мастерство и неукротимую волю. \nВ 140 году, во время последних лет становления Римской империи, Джордейн оказался в конфликте, который чуть не унес его жизнь. Его силы были опустошены, и он умирал на поле боя, окруженный павшими. Именно здесь, на грани смерти, к нему подошел Джулиан ди Пьеро, старейшина Вентру в пятом поколении. Юлиан принимал активное участие в древних политических интригах Римской империи, наблюдая за царством смертных со смесью хитрости и силы. Он видел в Джордайне не только силу, но и потенциал могущества. \nВпечатленный непоколебимой волей и амбициями Джордейна, Джулиан решил обнять его, предложив Джордайну шанс преодолеть смертность. Когда смерть постучалась в его дверь, Джордейн согласился. Однако объятия пошли не так, как планировал Джулиан. Вместо того, чтобы стать частью родословной Вентру, Джордейн стал каитифом, не связанным ни с одним кланом, лишенным благородного наследия, которое Джулиан намеревался передать. \nПокинутый Джулианом, который считал неудачу пятном на своем наследии, Джордейн остался скитаться один в темных уголках мира. Несмотря на предательство, инстинкты выживания Джордейна, отточенные его наследием Фенрира и движимые его жестокими амбициями, позволили ему подняться над трудностями. Теперь, будучи вампиром в 6-м поколении, Джордейн рассматривает свою природу Каитифа одновременно и как проклятие, и как благословение – свободу от преданности клану, но постоянное напоминание о своем статусе аутсайдера. \n Вдохновленный своим дремлющим наследием Гару и желанием выковать свою собственную судьбу, Джордейн ищет власти через диаблери, решив оставить себе наследие, которое заставит его сира пожалеть о том, что он покинул его. В 1204 году Джордайну исполнилось 1064 года, и он остается силой природы, движимой его непреклонным желанием доказать свою ценность как обществу Сородичей, так и миру в целом."
 POD_patronlore.100.desc.560244:0 "Дитя Дон Кихота, Санчо когда-то была пустой девушкой, чью жизнь спас ее сир, который обнял ее по прихоти после того, как обнаружил, что она пытается покончить с собой, сжег свой дом. Объятия и ее включение в семью Дона, семью Манчиган, как ее иногда называли, придали ее жизни смысл. Дон, Санчо и другие сородичи, которых он породил, будут жить в большом замке, вдали от человеческого общества. Это будет продолжаться до прибытия человеческого рыцаря, который несколько дней сражался с Дон Кихотом. Дуэль закончилась без победителя, но человеческий рыцарь подружился с Сородичами и часто навещал их. Во время своих визитов люди рассказали Дон Кихоту историю героев и спасителей, которые, несмотря на все трудности, делают то, что считают правильным, и отправляются в великие приключения. В то время как Санчо был равнодушен к таким историям, Дон Кихот увлекся ими и в конце концов вдохновил свою мечту: Сосуществование среди Сородичей и Коров, мечту, даже более радикальную, чем мечта идеалистов Бруха. Видите ли, Дон Кихот был странно устойчив к Зверю, что привело к его ошибочным представлениям о его природе. Он запретил своим Сородичам пить кровь людей и утолять их жажду меньшими средствами. Отправившись в приключения, подобные тем, о которых ему рассказал рыцарь, Дон Кихот оставил Санчо и остальных позади. Санчо был управляющим владениями Дона и управлял ими вместо него. Она и другие страдали за мечту Дона, пока однажды... их верность не сломалась. \nВ заговоре, придуманном ее собратьями, Дон будет схвачен и заколот до тех пор, пока он не «придет в себя», а его Сородичи смело скажут ему, что они больше не будут страдать из-за иллюзий его мечты. Когда Санчо услышал об этом заговоре... она дала свое согласие, она тоже пострадала из-за этого и почувствовала, что пришло время ее сиру очнуться от своих заблуждений. \nИ вот... заговор состоялся, Сородичи Дона окружили его и пронзили, со слезами на глазах. Дон не стал сражаться, потрясенный Санчо и всем остальным, он и пальцем не пошевелил, чтобы истребить их всех... ибо он искренне любил их. \n Сюжет пойдет не так, и Дон погибнет от рук Санчо, который несет эту вину по сей день. Теперь Санчо, правительница и по имени, и по титулу, клянется никогда больше не позволять своей семье страдать и позволять им жить так, как они считают нужным, часто за счет Коров."
 POD_patronlore.100.desc.560248:0 "Когда-то она была могущественным вампиром, но несчастный случай обратил её в камень и лишил всякой подвижности. Теперь она ждёт того, кто её спасёт.	Прежде она пользовалась большим влиянием среди местных вампиров, но из-за несчастного случая впала в торпор. Пробудится ли она?"
 POD_patronlore.100.desc.560251:0 "Леандр родился в семье мелкого французского дворянства и жил в комфорте и ожидании. Богатая, но не влиятельная, его семья жила достаточно высоко по лестнице, чтобы сильно заботиться о внешности. \n Леандр, однако, больше заботился о своих собственных желаниях, чем о семейной репутации. Он был романтиком, читателем, денди и чудаком. Его объятия пришли в 21 год от руки приехавшего из Индии Нагараджи, который увидел потенциал в резкости и тонкой жестокости Леандра. Он остался один во Франции без руководства. Итак, он импровизировал. \nЛеандр не скрывает, кто он. Он Нагараджа, в лучшем случае странность для остальных Сородичей, а в худшем — опасность, о которой нужно позаботиться. Но его манера; элегантный, поэтичный и почти нежный, делает его более привлекательным для французских Тореадор, которые теперь терпят его как странного, но очаровательного кузена. Некоторые говорят, что у него сердце Тореадора, даже если он предпочитает есть сердца, а не носить их на рукаве. \nНедавно он открыл La Salle du Goût — частный салон в поместье своих предков, где собираются самые любопытные Сородичи, чтобы потворствовать своему аппетиту. Там Леандр устраивает ночи ритуального потребления, приглашая гостей полакомиться не только тщательно подготовленными смертными, но и захваченными Сородичами. Это частично ужин, частично представление. Настроение всегда изысканное, а атмосфера сделана со вкусом. Приглашения редки и распространяются только на тех, у кого правильный вкус и право усмотрения. \n\nБудущая судьба:\n\nЛеандр станет одержим определенными родственниками в будущем, рассматривая их как идеальную еду. К сожалению, они ускользнут из его рук прежде, чем Леандр сможет их попробовать. Эта потеря приведет к нисходящей спирали для Нагараджи, и вскоре он станет отшельником в особняке своих предков, едва сохраняя рассудок. Только его верные слуги-гули удержат его от Окончательной Смерти, пусть и в истощенном и сильно подавленном состоянии."
 POD_patronlore.100.desc.560252:0 "Рис родился на острове Инис-Мон у дочери земледельца и скандинавского торговца. Едва подросши, он вышел в море с командой отца и объездил большую часть Европы, научившись обращаться с деньгами и людьми. В девятнадцать лет он женился на французской крестьянке, которую видел редко.\n\nЕго приключения оборвались в двадцать четыре года. Когда он спал в порту после долгого плавания, на него напали, выпили всю его кровь и возродили чудовищем."
 POD_patronlore.100.desc.560253:0 "Она родилась в Карпатах, ее воспитывали мать и отец Дионас Инвунду и мать Трене. В молодые годы она увлекалась растениями и животными в свободное время, из-за своей страсти она изучала искусство травничества на фоне изучения истории земель и людей внутри.\n\nПо мере того, как она росла как личность и как травник, она совершенствовала свой талант, приобретая понимание того, как выжить в дикой природе, к презрению своего отца, который предпочел бы, чтобы она сосредоточилась на альтернативных путях работы. На протяжении всей своей жизни она неизбежно дорастала до 19 лет, на протяжении всей своей жизни, работая вместе со своими родителями, ее мать заболевала, а отец уходил вскоре после того, как оставлял ее одну, а вскоре после этого она открывала магазин травников, чтобы получить доход для себя.\n\nВладея этим магазином в течение года, она была названа ведьмой из-за своего пола и профессии в сочетании с тем, что один из ее пациентов не выздоровел и умер под ее присмотром, что привело к тому, что ее линчевали вскоре после начала обвинений, и с щелчком веревки, оставив ее изношенной, истекающей кровью и разбитой, она упала под эшафот и сбежала в ближайший лес.\n\nОна бежала так далеко, как могла, ее тело было изнурено, и она отталкивала себя как можно дальше на последних вздохах, в то время как ее рана пульсировала от боли. Она считала, что недалеко от толпы, которая, как она представляла, будет преследовать ее, хотя в этой панике ей не удалось обработать свою рану, которую она каким-то чудесным образом выжила, даже если она продлилась недолго, если ее нельзя было вылечить с самого начала. В своем паническом бегстве она рухнет, как только у нее закончится адреналин, и останется без дела на земле, она будет ждать смерти, чтобы забрать ее.\n\nШли минуты, минуты, которые казались часами. В конце концов она, наконец, обрела облегчение, поскольку над ней навис человек, который даровал ей облегчение от боли и перерождение, чтобы жить новой не-жизнью."
 POD_patronlore.100.desc.793052:0 "Этот персонаж был создан одним из наших разработчиков и не является официальной частью $pod_wod$. \nИнгрид не выбирала такую жизнь. Оно выбрало ее.\nИнгрид, родившаяся в маленькой деревне на севере Швеции, была воспитана в соответствии со своим телом, образ жизни, который в частном порядке она считала отвратительным, но она играла роль мужчины, которую ей дали. За свою жизнь она часто обнаруживала, что тысячи вещей постоянно идут не так, как будто сама жизнь испытывала ее все больше и больше, поскольку дела становились все более и более адскими. А потом настал день, когда ее деревня напала на нее и выгнала ее, ее личные мысли были нацарапаны на деревьях, каким-то образом обнаженными, когда ее бросили в пустыню. Но она отказалась умирать и вместо этого попыталась жить. К сожалению, это привлекло внимание архитектора ее страданий, который попытался воплотить в жизнь свой любимый проект, который они потратили последние 20 лет, превращая в ад. Но когда Ингрид почувствовала, что последние капли крови покинули ее, ее убийцу одолела красная вспышка, и вкус невероятно восхитительного железа коснулся ее губ, отрицая проклятие убийцы и вместо этого даруя ей дары Фрейи.\nЭто было давно. Ингрид даже сейчас верна цели своего сира, выслеживая по ночам других нуждающихся женщин. Если она должна быть пропитанной кровью освободительницей, пусть будет так. В конце концов, она дочь Адиса."
 POD_patronlore.100.t.560031:0 "Биография от покровителя: Габриэль Фелипе де ла Каста"
 POD_patronlore.100.t.793052:0 "Информация о персонаже от разработчиков: Ингрид"
