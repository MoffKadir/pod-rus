 POD_war_of_seasons_war_victory_objective_desc:0 "Война времён года в самом разгаре, постоянные войны между [Concept('religion','Дворы')] — это норма. А победным может быть только один Сезон, и это будет [GetPlayer.Custom('PODFaeCourt')]!"
