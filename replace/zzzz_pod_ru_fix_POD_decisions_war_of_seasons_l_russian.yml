l_russian:
 POD_form_united_seasons_decision:0 "Единые времена года"
 POD_form_united_seasons_decision_confirm:0 "Единые времена года"
 POD_form_united_seasons_decision_desc:0 "По вашему указу Война времён года завершилась, и каждый $POD_splat_fae$ считает вас своим очевидным лидером. И пришло время вам заявить права на свой [title|E]."
 POD_form_united_seasons_decision_tooltip:0 "Единые времена года"
 POD_war_of_seasons_peace_victory_objective:0 "Вечное перемирие"
 POD_war_of_seasons_peace_victory_objective_confirm:0 "Давай забудем о войне"
 POD_war_of_seasons_peace_victory_objective_custom1:0 "Вы должны быть [court_leader|E]"
 POD_war_of_seasons_peace_victory_objective_custom2:0 "Не должно быть китэйнов [independent|E], которые являются вашими [rival|E] или [nemesis|E] и имеют менее 50 [opinion|E]."
 POD_war_of_seasons_peace_victory_objective_custom2_ex:0 "$POD_war_of_seasons_peace_victory_objective_custom2$ #weak ([example.GetName])#!"
 POD_war_of_seasons_peace_victory_objective_desc:0 "Война времён года становится далеким кошмаром, китэйны постепенно забывают о войне. И это создает идеальную атмосферу для истинного вечного мира."
 POD_war_of_seasons_peace_victory_objective_effect0:0 "[GetSituation('PoD_war_of_seasons').GetName] будет завершен"
 POD_war_of_seasons_peace_victory_objective_effect1:0 "[Glossary('Раскол','game_concept_shattering_desc')] будет предотвращен!"
 POD_war_of_seasons_peace_victory_objective_effect2:0 "Как только вы станете правителем земель, вы разблокируете [decision|E], чтобы сформировать [GetTitleByKey('h_united_seasons').GetName]."
 POD_war_of_seasons_peace_victory_objective_tooltip:0 "Перемирие, которое длится вечно"
