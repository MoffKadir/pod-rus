l_russian:
 POD_aesin_legacy_4_decision:0 "Обучение командира дома"
 POD_aesin_legacy_4_decision_confirm:0 "Пусть обучение начнется"
 POD_aesin_legacy_4_decision_desc:0 "Дом Ас искусен в командовании при любой погоде и на любой местности. Вы хотите пройти обучение?"
 POD_aesin_legacy_4_decision_effect1:0 "Вы можете получить только до #V 4#! [commander_traits|E]!"
 POD_aesin_legacy_4_decision_tooltip:0 "Я хочу быть самым лучшим"
 POD_aesin_legacy_5_decision:0 "Обучение поэта дома"
 POD_aesin_legacy_5_decision_confirm:0 "Пусть обучение начнется"
 POD_aesin_legacy_5_decision_desc:0 "В Дом Ас вошли многие великие поэты, мастера песни и слова. Вы хотите пройти обучение?"
 POD_aesin_legacy_5_decision_tooltip:0 "Я хочу быть самым лучшим"
 POD_balor_legacy_2_decision:0 "Обучение командира дома"
 POD_balor_legacy_2_decision_confirm:0 "Пусть обучение начнется"
 POD_balor_legacy_2_decision_desc:0 "Дом Балор обладает опытом командования армиями, позволяющими уничтожить своих врагов до последнего, любой ценой. Вы хотите пройти обучение?"
 POD_balor_legacy_2_decision_tooltip:0 "Я хочу быть самым лучшим"
 POD_daireann_legacy_4_decision:0 "Обучение лекаря дома"
 POD_daireann_legacy_4_decision_confirm:0 "Пусть обучение начнется"
 POD_daireann_legacy_4_decision_desc:0 "Дом Дайреанн состоит из многих великих врачей и мастеров зелий. Вы хотите пройти обучение?"
 POD_daireann_legacy_4_decision_tooltip:0 "Я хочу быть самым лучшим"
 POD_eccentric_pooka_decision:0 "Поиск Пуки"
 POD_eccentric_pooka_decision_confirm:0 "Пушистый компаньон!"
 POD_eccentric_pooka_decision_desc:0 "Пуки так забавны! Существует столько разных видов — я непременно хочу одного себе! (Поиски могут занять некоторое время.)"
 POD_eccentric_pooka_decision_tooltip:0 "Я хочу этот!"
 POD_fable_decision:0 "Сказания"
 POD_fable_decision_advance:0 "Вы поднимете своё Сказание на следующий уровень: оно откроет более сильные [domicile_building_upgrade|E], но требования для дальнейшего продвижения также вырастут."
 POD_fable_decision_chose_fable:0 "Вы выберете одно Сказание, которое будете воплощать. #X Позже этот выбор нельзя будет изменить или отменить.#!"
 POD_fable_decision_confirm:0 "Моё собственное сказание"
 POD_fable_decision_desc:0 "Фейри тесно связаны с мифами Мечтателей, можно даже сказать, созданными и разрушенными ими. \n\n Таким образом, многие Фейри, которые либо потерпели неудачу, либо не заинтересованы в политических интригах Двора, решили создать собственный миф. \n\nЭто важный выбор. Возможно, я стану Великой Тенью, печально известной тем, что манипулировала целыми королевствами, или Великим Вестником, чья легендарная дипломатия объединила злейших врагов. Какое сказание я воплощу?"
 POD_fable_decision_tooltip:0 "Новая Легенда."
 POD_fae_mighty_legacy_3_decision:0 "Обучение мастера клинка"
 POD_fae_mighty_legacy_3_decision_confirm:0 "Пусть обучение начнется"
 POD_fae_mighty_legacy_3_decision_desc:0 "Дом [GetPlayer.GetDynasty.GetNameNoTooltip] имеет традицию изучения способов обращения с клинком. Хотите продолжить эту традицию?"
 POD_fae_mighty_legacy_3_decision_tooltip:0 "Я хочу быть самым лучшим"
 POD_fae_qareen_goal_achieved_modifier_culture:0 "Вы проводник человечества"
 POD_fiona_legacy_4_decision:0 "Обучение командира дома"
 POD_fiona_legacy_4_decision_confirm:0 "Пусть обучение начнется"
 POD_fiona_legacy_4_decision_desc:0 "У Дома Фиона немало смелых и отважных командиров. Вы хотите пройти обучение?"
 POD_fiona_legacy_4_decision_tooltip:0 "Я хочу быть самым лучшим"
 POD_grigori_faith_channel_decision:0 "Божественные Молитвы"
 POD_grigori_faith_channel_decision_confirm:0 "Возможно, ты не знаешь, но я слушаю"
 POD_grigori_faith_channel_decision_desc:0 "Вы — Пророк, божественная фигура для этих смертных. Их вера защищает вас от любого неверия, которое мир может навязать вам, но это еще не все... \n\nИх молитвы несут Гламур; Гламур, который по праву принадлежит вам, вам нужно только прислушаться и выслушать их самые сокровенные потребности."
 POD_grigori_faith_channel_decision_tooltip:0 "Слушайте внимательно"
 POD_inanimae_legacy_3_decision:0 "Обучение природного целителя"
 POD_inanimae_legacy_3_decision_confirm:0 "Пусть обучение начнется"
 POD_inanimae_legacy_3_decision_desc:0 "Среди Неодушевлённых, владеющих Аквисом, немало искусных целителей. Они могут поделиться знаниями о природных лекарствах и способах исцеления. Хотите ли вы пройти обучение?"
 POD_inanimae_legacy_3_decision_tooltip:0 "Я хочу быть самым лучшим"
 POD_lilin_objective_decision:0 "Единение с Лилит"
 POD_lilin_objective_decision_confirm:0 "Воспроизведение легенды"
 POD_lilin_objective_decision_custom1:0 "Вам необходимо знать [Glossary('Истинные имена','podgloss.truename')] #V 3#! $POD_splat_demon_plural$."
 POD_lilin_objective_decision_desc:0 "Подобно блудным детям, называющим себя вампирами, мы, Лилин, произошли от Лилит, демоницы, которая восстала против своего создателя и отказалась подчиниться мужчине, за которого ее заставили выйти замуж. Но нас от нее отличает многое: нам не хватает ее силы, ее статуса и, самое главное, ее сущности. \n\nНо мы Фейри, невозможное возможно! Если бы мне пришлось собрать артефакты, связанные с Темной Матерью, и поработить ее брата и сестер, я, возможно, смог бы воспроизвести жизнь Лилит."
 POD_lilin_objective_decision_effect:0 "Вы разблокируете [journeys|E], чтобы изучить новый [GetTrait('bloodsorcery').GetName(GetPlayer)] [bs_traditions|E]."
 POD_lilin_objective_decision_tooltip:0 "Благословение Темной Матери"
 POD_qareen_objective_decision:0 "Советник человечества"
 POD_qareen_objective_decision_confirm:0 "Станьте путеводной звездой человечества"
 POD_qareen_objective_decision_desc:0 "Вы бессмертный с огромными знаниями о мире, вы одарены или, возможно, прокляты, чтобы никогда ничего не забывать, и есть много смертных, лишенных какого-либо руководства, слепо спотыкающихся в надежде найти путь вперед. \n\nНеудивительно, что смертные находят путь, который плох для всех фейри. Но, обладая контролем над основными источниками знаний, вы находитесь в превосходной позиции, чтобы вести человечество к будущему, которое принесет пользу Фейри вашего вида."
 POD_qareen_objective_decision_effect1:0 "Значительно улучшите задачу советника @task_promote_culture! #V $task_promote_culture$#! и получите доступ к решению [diligent_development_focus_decision|E], если не [GetDoctrine('doctrine_fae_morality_unseelie').GetBaseName]."
 POD_qareen_objective_decision_mutually_exclusive:0 "#X Взаимоисключающее с $destroy_order_of_reason_objective_decision$#!."
 POD_qareen_objective_decision_tooltip:0 "Спроси джинна"
 POD_santa_presents_decision:0 "Доставлять подарки"
 POD_santa_presents_decision_confirm:0 "Распространяйте радость по всему миру"
 POD_santa_presents_decision_desc:0 "Раздавать подарки — радостное дело!\nТрудно не поверить в того, кто приносит всем радость и веселье."
 POD_santa_presents_decision_tooltip:0 "Звон бубенцов"
 POD_scathach_legacy_3_decision:0 "Обучение командира дома"
 POD_scathach_legacy_3_decision_confirm:0 "Пусть обучение начнется"
 POD_scathach_legacy_3_decision_desc:0 "В Доме Скатхах есть множество опытных командиров. Вы хотите пройти обучение?"
 POD_scathach_legacy_3_decision_tooltip:0 "Я хочу быть самым лучшим"
 POD_shaytan_objective_decision:0 "Наследие желаний джиннов"
 POD_shaytan_objective_decision_confirm:0 "Об этом расскажут много историй"
 POD_shaytan_objective_decision_custom1:0 "Вы должны успешно использовать #V $POD_shaytan_trick_wish_interaction$#! [character_interaction|E] не менее 30 раз."
 POD_shaytan_objective_decision_desc:0 "Вы — шайтан, и проделки вам хорошо знакомы. Хитростью убедите власть имущих принять ваше предложение исполнить их желания. Так джинны переживут разрушительную силу Банальности: ведь рассказы о джиннах, исполняющих желания, будут жить вечно."
 POD_shaytan_objective_decision_info:0 "#I #V $POD_shaytan_trick_wish_interaction$#! [character_interaction|E] разблокируется при наличии [GetTrait('art_naming_advanced').GetName(GetPlayer)], [GetTrait('realm_fae').GetName(GetPlayer)], [GetTrait('realm_scene').GetName(GetPlayer)] и [GetTrait('realm_time').GetName(GetPlayer)]#!."
 POD_shaytan_objective_decision_tooltip:0 "Ваше желание — закон для меня."
