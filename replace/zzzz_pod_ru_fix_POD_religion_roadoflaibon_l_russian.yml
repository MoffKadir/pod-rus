l_russian:
 laibon_appeasers_of_eebo:0 "Умиротворители Ээбо"
 laibon_appeasers_of_eebo_adherent:0 "Умиротворитель Ээбо"
 laibon_appeasers_of_eebo_adherent_plural:0 "Умиротворители Ээбо"
 laibon_appeasers_of_eebo_adj:0 "Ээбоистск"
 laibon_appeasers_of_eebo_desc:0 "Ээбо — бог неба, чей пылающий глаз — солнце. Глубоко созвучные Орун, Умиротворители стремятся полностью преодолеть свою чудовищную природу."
 laibon_asiman:0 "Асиман"
 laibon_asiman_adherent:0 "Асиман"
 laibon_asiman_adherent_plural:0 "Асиманы"
 laibon_asiman_adj:0 "Асиманск"
 laibon_asiman_desc:0 "Асиман — Достойные. Это лайбон, отвергающие власть и старейшин, и магаджи и полагающие, что ни один вампир не вправе властвовать над другим лишь в силу возраста или крови."
 laibon_birds_of_huur:0 "Птицы Хуура"
 laibon_birds_of_huur_adherent:0 "Киньони"
 laibon_birds_of_huur_adherent_plural:0 "Киньони"
 laibon_birds_of_huur_adj:0 "Хуурск"
 laibon_birds_of_huur_desc:0 "Хуур — вестник Смерти, и его люди-птицы следуют философии парадокса, преломлённой через африканскую космологию. Для киньони странствие — богослужение, а сам путь — единственная честная цель."
 laibon_children_of_sarapion:0 "Дети Сарапиона"
 laibon_children_of_sarapion_adherent:0 "Дитя Сарапиона"
 laibon_children_of_sarapion_adherent_plural:0 "Дети Сарапиона"
 laibon_children_of_sarapion_adj:0 "Сарапионск"
 laibon_children_of_sarapion_desc:0 "Сарапион неизмеримо древен. Дети не признают ложных богов и низвергают любое существо, обретающее слишком большую силу, ибо никто не смеет соперничать со славой Сарапиона."
 laibon_daughters_of_arawelo:0 "Дочери Аравело"
 laibon_daughters_of_arawelo_adherent:0 "Дочь Аравело"
 laibon_daughters_of_arawelo_adherent_plural:0 "Дочери Аравело"
 laibon_daughters_of_arawelo_adj:0 "Аравелоск"
 laibon_daughters_of_arawelo_desc:0 "Аравело была царицей, сокрушавшей каждого мужчину, который противостоял ей. Дочери почитают её как доказательство того, что личность выковывают, а не получают в дар: лишь сила, хитрость и безжалостное честолюбие дают подлинное право на наследие."
 laibon_flowers_of_indulgence:0 "Цветы наслаждения"
 laibon_flowers_of_indulgence_adherent:0 "Цветок наслаждения"
 laibon_flowers_of_indulgence_adherent_plural:0 "Цветы наслаждения"
 laibon_flowers_of_indulgence_adj:0 "Наслажденческ"
 laibon_flowers_of_indulgence_desc:0 "Гедонизм — лишь маска, а не лицо. Под наслаждениями скрывается паутина макиавеллистских интриг. Вино всегда сладко. Расплата всегда приходит позже."
 laibon_luo:0 "Луо"
 laibon_luo_adherent:0 "Луо"
 laibon_luo_adherent_plural:0 "Луо"
 laibon_luo_adj:0 "Луоск"
 laibon_luo_desc:0 "Там, где Ньяйо призывают к бдительности, Луо требуют войны. Каждый оплот каинитов в Африке — акт колонизации. Их вера требует возвращать утраченное силой."
 laibon_nidars_punishers:0 "Каратели Нидара"
 laibon_nidars_punishers_adherent:0 "Каратель Нидара"
 laibon_nidars_punishers_adherent_plural:0 "Каратели Нидара"
 laibon_nidars_punishers_adj:0 "Нидарск"
 laibon_nidars_punishers_desc:0 "Этот орден гробовщиков и убийц посвятил себя уничтожению магаджи, злоупотребляющих властью. Глубоко созвучные Айе, они верят, что справедливость принадлежит материальному миру."
 laibon_nyayo:0 "Ньяйо"
 laibon_nyayo_adherent:0 "Ньяйо"
 laibon_nyayo_adherent_plural:0 "Ньяйо"
 laibon_nyayo_adj:0 "Ньяйоск"
 laibon_nyayo_desc:0 "Ньяйо, идущие по стопам предков, — лайбон, убеждённые, что доменами Эбенового королевства следует управлять на своих условиях. Сотрудничество возможно. Подчинение — нет."
 laibon_path_of_terror:0 "Путь ужаса"
 laibon_path_of_terror_adherent:0 "Сеятель ужаса"
 laibon_path_of_terror_adherent_plural:0 "Сеятели ужаса"
 laibon_path_of_terror_adj:0 "Ужасорождённ"
 laibon_path_of_terror_desc:0 "Путь ужаса укоренён в первобытном страхе. Чтобы стать чем-то великим, сперва нужно стать чем-то ужасным."
 laibon_tariq_alsama_walard:0 "Тарик ас-Сама ва-ль-Ард"
 laibon_tariq_alsama_walard_adherent:0 "Последователь Тарика"
 laibon_tariq_alsama_walard_adherent_plural:0 "Последователи Тарика"
 laibon_tariq_alsama_walard_adj:0 "Тарикск"
 laibon_tariq_alsama_walard_desc:0 "Тарик ас-Сама ва-ль-Ард объединяет ислам Аширры и духовную традицию лайбон. Африканская самобытность и преданность исламу — не соперничающие привязанности, а единая, неразделимая истина."
