l_russian:
 children_of_cluid_maa_flavor:0 "#F Многие клуити считают себя истинными потомками Клуида, героя, который первым привел пиктов в Каледонию. Эти воины сражаются с нечестивым рвением, чтобы достичь своих целей.#!"
 mactire:0 "Отряд Мактайра"
 mactire_flavor:0 "#F Мактайры — одни из самых свирепых и яростных Белых завывателей, волчьи стражи отдалённых земель, давно покинутых людьми.#!"
 uktena_roadrunners_maa:0 "Гонцы Уктена"
 uktena_roadrunners_maa_flavor:0 "#F Родня Уктена ведёт совершенно разный образ жизни, часто они становятся беженцами, прежде чем узнают о своём наследии. Однако, попав в племя, они быстро становятся опытными охотниками, способными не отставать от своих родителей-вервольфов и помогать им.#!"
 wendigo_maa:0 "Стая Младших братьев"
 wendigo_maa_flavor:0 "#F Уктена были не единственными, кто вернулся с родины. Их менее многочисленные, но более воинственные Младшие братья последовали за ними и при необходимости оказывают поддержку.#!"
