l_russian:
 AIRT_PERCEPTION_PERK_EFFECT:0 "#clickable[character_interaction|E]: Привяжите [spirit_companion|E] к провинции с каэрном#!\n#flavor. Теург может приблизительно идентифицировать дух по его духовному следу, следу, оставленному после его прохождения. По сути, это работает так же, как отслеживание в материальном мире, и не более информативно. #!"
 APECRAFTS_BLESSING_PERK_EFFECT:0 "#flavor Хотя многие дети Гайи используют инструменты, никто не освоил их так тщательно, как человечество. Хомид фокусирует это мастерство на инструментах, которые она использует, заставляя их духи пробуждаться и оказывать ей помощь.#!"
 AURA_OF_THE_JUST_PERK_EFFECT:0 "#flavor Когда пользователь Дара совершает справедливый поступок, все вокруг узнают об этом, просто взглянув на него. Аура Справедливости провозглашает всем и каждому, что этот Гару прав. Там, где обстоятельства или представления могут омрачить суждения свидетелей, Дар рассеивает все сомнения.#!"
 AUSPICE_ENDPERK_REQUIREMENT:0 "@warning_icon#!#X Это достоинство можно получить, только завершив [story_cycle|E] своего покровительства."
 BALANCE_MAN_AND_BEAST_PERK_EFFECT:0 "Удалите все затраты на изменение формы в [GetModifier('POD_werewolf_form_hispo_modifier').GetNameWithTooltip]\n#flavor Филодоксу необходимо крепко держать свою звериную сторону под контролем, опасаясь потерять контроль и, что еще хуже, позволить своим страстям контролировать его суждения. Однако Гару не может отрицать свою животную природу; рациональность не может править в одиночку.#!"
 BODY_SHIFT_PERK_EFFECT:0 "[PODImprovesCombatMove('POD_combat_move_werewolf_fang_rush')]\n#flavor Гару, выросшие в меняющемся лабиринте человеческого общества, хорошо подготовлены к бесконечной адаптации, которую Гайя требует от своих защитников. #!"
 BONDS_THAT_TIE_US_PERK_EFFECT:0 "#clickable Обучение Стаи: #! Каждый участник получает [modifier|E] за каждое уникальное лунное покровительство в Стае. \n Члены Стаи больше не могут быть [rival|E] друг другу. \n#flavor Филодокс является посредником и судьей, но также и лидером. Этот Дар помогает Филодоксу в таких вопросах, раскрывая любые эмоции и мнения, существующие между другими.#!"
 BREAK_THE_BONDS_PERK_EFFECT:0 "[character_interaction|E]: Освободите персонажа [imprisoned|E].\nПолучите сильную ментальную защиту.\nНе может быть [blackmailed|E].\n#flavor Этот Дар разрушает все связи, физические или психические, от крепких железных цепей до рабства заколдованной крови вампира.#!"
 BUILDING_A_LEGEND_PERK_EFFECT:0 "#clickable Обучение стаи:#! Все $POD_splat_garou$ получают [trait_level_track_xp|E] в своих покровительствах.\n#flavor Филодоксы являются естественными лидерами Гару в мирное время, подкрепленные верой и доверием, оказываемыми им их подопечными.#!"
 CANINE_CALL_PERK_EFFECT:0 "[PODUnlocksCombatMove('POD_combat_move_werewolf_canine_call')]\n[character_interaction|E]: Получите [GetModifier('dog_story_modifier').GetNameWithTooltip]\n#flavor Со времен Импергия и Войны Ярости все остальные на планете жили в трепете и ужасе перед звуками воя волков. Именно таким голосом Галлиард издает призыв, который слышат только собаки.#!"
 CHIMERICAL_FORM_PERK_EFFECT:0 "Открывает превращение в различных животных. \n#flavor Все великие обманщики легенд — мастера изменения формы, и Рагабаш, овладевший этим Даром, не является исключением. Используя его, он может изменить свою форму в форму любого животного размером от крошечного зяблика до огромного моржа. #!"
 COMMAND_THE_GATHERING_PERK_EFFECT:0 "#flavor Филодокс приковывает к себе взгляды громким восклицанием, хлопком в ладоши, ударом клэйва по щиту или каким-либо другим подобным жестом. Пока она не скажет свое слово, никто не имеет права отходить или прерывать ее. #!"
 COUSINS_COAT_PERK_EFFECT:0 "[PODUnlocksCombatMove('POD_combat_move_werewolf_cousins_coat')]\n#flavor Гару с этим Даром могут легче сливаться с окружающей средой, чем другие представители их вида.#!"
 CURSE_THE_BETRAYER_PERK_EFFECT:0 "[PODUnlocksCombatMove('POD_combat_move_werewolf_curse_the_betrayer')]\n[character_interaction|E]: Наложите [GetModifier('curse_the_betrayer_modifier').GetNameWithTooltip] $glossary_fera$ другого [religious_family|E].\n[imprison|E] Шанс: #P +10%#!\n#flavor Любой, кто предаёт Филодокса, платит за свою нечестность. Суда не избежать.#!"
 CURSE_THE_BETRAYER_REASON:0 "$curse_the_betrayer_perk_name$: $VALUE|+=0$"
 DEVILS_CHILD_PERK_EFFECT:0 "#flavor Волков часто считают отпрысками самого Дьявола, и, хотя они не до конца понимают этот смысл, люпусы рады извлечь выгоду из страха, который они внушают. Гару издает яростный рык, который пугает противников и заставляет их подчиниться. #!"
 DIVIDE_PERK_EFFECT:0 "[character_interaction|E]: Дает отрицательный модификатор мнения вассала.\n#flavor Этот Дар вызывает ненависть и подозрения среди врагов Гару.#!"
 ELEMENTAL_GIFT_PERK_EFFECT:0 "Разблокируйте элементаля [men_at_arms|E].\n#flavor Оборотень призывает первобытную силу Самой Гайи, тем самым приказав духам стихий подняться, двигаться вперед и даже поглотить врагов.#!"
 EYES_OF_THE_LYNX_PERK_EFFECT:0 "$countermeasures_unlocks_t2_all_seeing_eye$\n#flavor Духи-рыси, воплощающие умбральный идеал мощного зрения своих земных собратьев, могут видеть даже за пределами физических препятствий. Теурги, изучающие этот Дар, могут заглянуть сквозь стены или под землю.#!"
 FALSE_COMFORT_PERK_EFFECT:0 "[PODUnlocksCombatMove('POD_combat_move_werewolf_false_comfort')]\nНа вражеских [rulers|E] накладывается [GetModifier('false_comfort_modifier').GetNameWithTooltip], когда вы начинаете [war|E] в качестве основного атакующего или защитника. \n#flavor Человечество многое сделало, чтобы окружить себя комфортом и безопасностью. Гару, использующий этот Дар, не кромсает броню и не пробивает двери, он просто полностью их игнорирует. Безопасность — это иллюзия.#!"
 FIREBRINGER_PERK_EFFECT:0 "#clickable Получите очки [perk|E], соответствующие [education|E] владельца, при получении знаков с 75 или более [artifact_power|E]#!\nЦели вашего взаимодействия «Обучить Дару» — #V#! [character_interaction|E] получают дополнительно [perk|E].\n#flavor Рагабаш совершает величайший трюк, крадя силу и превращая ее в свою собственную. Более того, этой силе можно научить других, как если бы Новолуние было духовным учителем.#!"
 FOOLS_GOLD_PERK_EFFECT:0 "#clickable Теперь могут появляться Знаки Луны.#!\n#flavor То, что бесполезно для одного, бесценно для другого. Благосклонность Луны предназначена для тех, кто ее ищет.#!"
 FULL_MOONS_LIGHT_PERK_EFFECT:0 "#flavor Полнолуние — это фаза воина $glossary_luna$, когда она принимает облик Дианы-Охотницы и ищет своих врагов. Арун может использовать решимость Луны в поиске врагов, освещая любого, кто противостоит ей.#!"
 GIFT_OF_THE_PORCUPINE_PERK_EFFECT:0 "[PODUnlocksCombatMove('POD_combat_move_werewolf_gift_of_the_porcupine')]\n#flavor Этот Дар позволяет меху Гару стать щетинистым и острым, как иглы дикобраза, и вы никогда не будете связываться с дикобразом.#!"
 HARES_LEAP_PERK_EFFECT:0 "#flavor С помощью этого Дара оборотень может прыгать на поистине невероятные расстояния. #!"
 HEALING_THE_SOUL_PERK_EFFECT:0 "#clickable Привязка духа: вылечите все [diseases|E] и уменьшите [stress|E] всех [courtiers|E]#!\n#clickable Привязка духа: привязка духа с максимальным рангом уберёт ваши отрицательные [stress|E] [traits|E]#!\n#flavor После недели поста, трансов и общения с духами Теург способен привести составляющие души в совершенное равновесие.#!"
 HONOUR_BOUND_PERK_EFFECT:0 "Доступный участник вашей группы [GetPlayer.Custom('PODCoterie')] присоединится к вам в [pod_combat_encounters_with_icon|E]\n#clickable Тренировка стаи:#! Все $glossary_fera$ получают [prestige|E] и [legitimacy|E] соразмерно своему рангу.\n#flavor Многие стаи Гару связаны крепкими узами. Этот дар укрепляет их чувство чести и взаимного уважения.#!"
 HOWL_OF_ASSEMBLY_INVITE:0 "[GetPerk('howl_of_assembly_perk').GetName(GetPlayer)]: $VALUE|=+0$"
 HOWL_OF_ASSEMBLY_PERK_EFFECT:0 "Приглашение в [court|E] Принятие $POD_splat_werewolf_plural$: #P +10#!\n#flavor Вой Гальярда слышен на большом расстоянии, призывая Гару на битву.#!"
 INVOKED_PRESENCE_PERK_EFFECT:0 "[character_interaction|E]: пожертвуйте [spirit_companion|E] на максимальном ранге, чтобы получить [GetTrait('truefaith').GetName(GetPlayer)]\n#flavor. Теург может напрямую призвать Инкарну или Селестину, сосредоточив их внимание на области вокруг себя. Это не вызывает Аватара; скорее, Присутствие — это мистическое проникновение принципа, который представляет призванный дух. Однако такая великая сила обходится дорого. #!"
 IRON_CLAWS_PERK_EFFECT:0 "[PODImprovesCombatMove('POD_combat_move_fera_beast_strike')]\n#flavor Когти Гару становятся острыми, как железо. Позволяя ему легко разрывать и плоть, и броню.#!"
 LORD_OF_THE_WILDS_PERK_EFFECT:0 "#flavor Гару могут не только общаться с животными, но и привлекать их и командовать ими. #!"
 LUNAS_ARMOR_PERK_EFFECT:0 "Получите иммунитет к [fire_damage_short_with_icon|E].\n#flavor Арун купается в чистом лунном свете Луны, защищая его от пламени врагов.#!"
 MADNESS_SEASON_FACTION_REASON:0 "[GetModifier('madness_season_modifier').GetNameWithTooltip]: $VALUE|0+=$"
 MADNESS_SEASON_PERK_EFFECT:0 "[PODImprovesCombatMove('POD_combat_move_werewolf_bloodhound')]\nОткрывает [GetTravelOption('werewolf_ragabash_option').GetName]\n#flavor Между безумным юмором и пропастью безумия часто проходит тонкая грань. Понимание Новолунием этой границы позволяет ей сводить врагов на грань безумия.#!"
 MARK_OF_SHAME_PERK_EFFECT:0 "Каждый раз, когда вы получаете [artifact|E], его предыдущий владелец получает [GetModifier('mark_of_shame_modifier').GetNameWithTooltip]\n#flavor. Рагабаш может наложить ужасное проклятие на тело противника, заставляя его ослабевать или увядать, часто в качестве возмездия за какое-то действие. Ужасное и разочаровывающее напоминание о смущении, причиненном жертве.#!"
 MOLD_THE_SPIRIT_PERK_EFFECT:0 "#flavor Гару может изменить форму или цель Духа. Как ни странно, Дух не против.#!"
 NAME_THE_SPIRIT_PERK_EFFECT:0 "Можно нанять [GetMaA('jagglings').GetName] как [men_at_arms|E].\n[PODUnlocksCombatMove('POD_combat_move_werewolf_name_the_spirit')]\n#flavor Гару способен определять тип и приблизительные уровни способностей Духа. С помощью которого он затем сможет призвать Духа к себе.#!"
 OPEN_SEAL_PERK_EFFECT:0 "#flavor С помощью этого Дара Гару может открыть практически любое закрытое или запертое устройство. #!"
 PERSUASION_PERK_EFFECT:0 "#flavor Этот Дар позволяет хомиду стать более убедительным в общении с другими; его заявления и аргументы наполнены смыслом и достоверностью.#!"
 PLACATION_PERK_EFFECT:0 "Все ваши [spirit_companions|E] получают [trait_level_track_xp|E] в конце #V Поиск духа#! [journeys|E].\nМожно выучить #V 2#! дополнительный [language|E] без каких-либо штрафов.\n#flavor Теург с этим Даром всегда точно знает, какую жертву необходимо принести, чтобы искупить оскорбление духовного мира или просто отдать дань уважения.#!"
 PRIMAL_ANGER_PERK_EFFECT:0 "[PODUnlocksCombatMove('POD_combat_move_werewolf_primal_anger')]\nУберите все затраты на изменение формы в [GetModifier('POD_werewolf_form_crinos_modifier').GetNameWithTooltip]\n#flavor Арун позволяет своей Ярости расходовать его собственную жизненную силу для дальнейшего разрушения.#!"
 PRIMAL_SONG_PERK_EFFECT:0 "[character_interaction|E]: Сплетите #clickable куплеты песен#! вместе для создания различных эффектов. \n#clickable куплеты песен: [GetModifier('galliard_song_development_decline_modifier').GetNameWithTooltip]#!\n#clickable куплеты песен: Призовите случайного духа#!\n#flavor Галлиард сплетает мощные песни со своим Гнозисом. Казалось бы, нормальная песня может иметь самые непредсказуемые последствия. #!"
 PROPHECY_PERK_EFFECT:0 "Открывает Гадание по звёздам [decision|E].\n[PODImprovesCombatMove('POD_combat_move_werewolf_face_the_apocalypse')]\n#flavor Этот Дар предлагает Теургу истинное представление о будущем. Такие видения спорадичны и иногда загадочны, но если не предпринимать особых усилий, чтобы изменить то, что впереди, они всегда точны.#!"
 RALLY_TO_THE_CAUSE_PERK_EFFECT:0 "#clickable Тренировка стаи:#! Все участники теряют [stress|E].\nОтдайте [GetModifier('rally_to_the_cause_modifier').GetNameWithTooltip] дружественному $glossary_fera$ [knights|E], когда действуете как [commander|E] во время [combat_phase|E], или себе во время [single_combat_duel_plural|E].\n#flavor Иногда Филодоксу необходимо сплотить Гару для достижения цели. Этот Дар помогает Филодоксу вдохновить других Гару следовать его делу, несмотря на племенные или личные разногласия.#!"
 REYNARDS_LIE_PERK_EFFECT:0 "#flavor Рагабаш с этим Даром может спокойно объяснять, что небо зеленое, или радостно потчевать других подвигами одинокого героического Рагабаша и не бояться, что его уличат во лжи. #!"
 RHYTHM_OF_WAR_PERK_EFFECT:0 "#clickable [character_interaction|E]: бросьте вызов другому персонажу в [pod_combat_encounter_with_icon|E].#!\n#flavor Пока Арун продолжает сражаться в ритме своего внутреннего боевого барабана, его невозможно остановить. Удары, которые могли бы сразить менее сильного бойца, подобны укусам осы для самых могущественных воинов Гару.#!"
 SENSE_CHIMINAGE_PERK_EFFECT:0 "#flavor Теурги с этим Даром могут с первого взгляда узнать, где находится баланс чиминажа у любого духовно сознающего существа. #!"
 SHAKE_THE_EARTH_PERK_EFFECT:0 "[PODUnlocksCombatMove('POD_combat_move_werewolf_shake_the_earth')]\n#flavor Сила Ярости Аруна раскалывает землю перед ним, нанося огромный ущерб его окружению.#!"
 SNARL_OF_CHALLENGE_PERK_EFFECT:0 "#flavor Устрашающим рыком Арун может заставить врага сражаться с ним, пока земля не станет красной от крови.#!"
 SONG_OF_MOCKERY_PERK_EFFECT:0 "#clickable Куплет песни: [GetModifier('galliard_song_vassal_opinion_modifier').GetNameWithTooltip]#!\n#clickable Куплет песни: Передача [prestige|E] Галлиарду #!\n[PODUnlocksCombatMove('POD_combat_move_werewolf_song_of_mockery')]\n#flavor Эти песни предназначены для того, чтобы высмеять врагоГаллиардуа. К сожалению, большинство из них слишком некультурны, чтобы осознать это.#!"
 SONG_OF_RAGE_PERK_EFFECT:0 "#clickable Куплет песни: [GetModifier('galliard_song_irrational_modifier').GetNameWithTooltip]#!\n#clickable Куплет песни: [GetModifier('galliard_song_countermeasure_modifier').GetNameWithTooltip]#!\n#flavor Крик оборотня выпускает животное в сердце цели, доводя его до безумия.#!"
 SONG_OF_SERENITY_PERK_EFFECT:0 "#clickable Куплет песни: Уменьшите [stress|E]#!\n#clickable Куплет песни: [GetModifier('galliard_song_no_war_modifier').GetNameWithTooltip] и остановите активные наступательные войны#!\n#flavor Самые успокаивающие звуки могут успокоить даже самые жестокие сердца.#!"
 SONG_OF_THE_SIREN_PERK_EFFECT:0 "#clickable Куплет песни: Увеличьте [opinion|E] о Галлиарде. #!\n#clickable Куплет песни: Получите [hook|E]#!\n#flavor Звук голоса Гару может очаровать любого, кто его слышит. Обычно Гару поет или воет, используя этот Дар, хотя некоторые стали читать стихи.#!"
 SONG_OF_THE_STORM_PERK_EFFECT:0 "#clickable Куплет песни: Наносит [lightning_damage_short_with_icon|E] урона#!\n#clickable Куплет песни: [GetModifier('galliard_song_speed_modifier').GetNameWithTooltip]#!\n#flavor Галлиард может коснуться самой ткани Штормовой Умбры своей песней, вызывая хаотический поток энергий Вильда, чтобы изменить окружающий мир или тех, кто оказался в нём.#!"
 SONG_OF_VALOR_PERK_EFFECT:0 "#clickable Куплет песни: Исцелить 2 [POD_aggravated_box|E]#!\n#clickable Куплет песни: [GetModifier('galliard_song_prowess_modifier').GetNameWithTooltip]#!\n[PODUnlocksCombatMove('POD_combat_move_werewolf_song_of_valor')]\n#flavor Войте о героических подвигах древних Гару, чтобы поддержать слушателей. Жажда героизма гонит их вперед.#!"
 SPIRIT_SKIN_PERK_EFFECT:0 "Может менять форму и поддерживать измененную форму, оставаясь в [umbra|E]\n#flavor. Теург маскируется под дух волка в Умбре. Физически она по-прежнему выглядит точно так же, как ее форма Люпуса, просто она производит впечатление духа, а не Гару.#!"
 SPIRIT_SKIN_REASON:0 "$spirit_skin_perk_name$: $VALUE|+=0$"
 SPIRIT_VESSEL_PERK_EFFECT:0 "#clickable Привязка духа: получите [GetModifier('theurge_spirit_vessel_modifier').GetNameWithTooltip] с силой, зависящей от ранга духа. #!\nРазблокируйте формы превращения в элементалей. \n[PODUnlocksCombatMove('POD_combat_move_werewolf_spirit_vessel')]\n#flavor Один из наиболее тщательно охраняемых секретов старейшин Теурга — способность направлять дух. На короткое время Гару и дух становятся одним существом, обладающим способностями обоих.#!"
 SPIRIT_VESSEL_SCALE:0 "Ранг Связанного Духа"
 STAREDOWN_PERK_EFFECT:0 "[PODUnlocksCombatMove('POD_combat_move_werewolf_staredown')]\n#flavor $glossary_rage$ горит в глазах оборотня, вселяя страх в сердца смертных и животных, заставляя их бежать, спасая свою жизнь.#!"
 STEADFAST_PERK_EFFECT:0 "#flavor Независимо от задачи, Арун не устает. Этот Дар позволяет Гару работать, бегать или сражаться далеко за пределами своих обычных возможностей.#!"
 STORYTELLER_PERK_EFFECT:0 "#clickable Стихи песен теперь срабатывают дважды или получают дополнительные эффекты. #!\n#flavor Вместо того, чтобы просто рассказывать и пересказывать старые истории или даже ждать, пока события дня станут новыми историями, Галлиард может изменить события продолжающейся драмы, разворачивающейся вокруг нее. Она может добавлять новых «персонажей», менять цепочки событий и даже менять мотивацию основных участников.#!"
 STRENGTH_OF_WILL_PERK_EFFECT:0 "[PODImprovesCombatMove('POD_combat_move_werewolf_face_the_apocalypse')]\n#flavor Гару с этим Даром — столп неукротимой воли. Он также может поделиться этой ужасающей целеустремленностью с другими, приводя их даже к верной гибели без малейшего страха.#!"
 TAKING_THE_FORGOTTEN_PERK_EFFECT:0 "[PODUnlocksCombatMove('POD_combat_move_werewolf_taking_the_forgotten')]\nУдаляет все [artifact_claims|E] из любого полученного [artifacts|E]\n#flavor Рагабаш не только опытный вор, но и те, у кого она крадет, часто даже не осознают, что их ограбили.#!"
 TERRAIN_SHIFT_PERK_EFFECT:0 "#flavor Природа принимает Рагабаша как союзника и рассматривает его преследователей как врагов. Земля и камни отодвигаются, образуя туннели или точки опоры, по которым можно подняться, за ним непроходимо скапливается листва, а реки создают сухие места, по которым он может перейти на другой берег.#!"
 TRUE_FEAR_PERK_EFFECT:0 "[PODUnlocksCombatMove('POD_combat_move_werewolf_true_fear')]\n#flavor Арун может сокрушить конкретного противника величиной своей силы, пугая противника и заставляя его бездействовать.#!"
 TRUTH_OF_GAIA_PERK_EFFECT:0 "$countermeasures_unlocks_t1_supernatural_high_alert$\n[espionage|E] Скорость прогресса: #P +25%#!\n#flavor Будучи судьями $glossary_werewolf_litany$, Филодоксы обладают способностью чувствовать, говорят ли другие правду или ложь.#!"
 TRUTH_OF_GAIA_REASON:0 "$truth_of_gaia_perk_name$: $VALUE|+=0$"
 TURN_THE_MOON_PERK_EFFECT:0 "#clickable Лунные знаки Луны теперь могут появиться.#!\n[schemes|E] при использовании [secrecy_grace|E] начинаются с дополнительных 12 месяцев. \nОткрывает [buy_artifact_claim_interaction|E]\n#flavor Сила Гару возрастает и убывает вместе с луной. Но Рагабаш снова переворачивает песочные часы.#!"
 UMBRAL_BODY_PERK_EFFECT:0 "Может менять форму и поддерживать измененную форму, оставаясь в [umbra|E].\n#flavor. С помощью этого Дара пользователь может частично проникнуть в Умбру, отправляя в нее определенные части тела, сохраняя при этом другие в физическом мире.#!"
 UMBRAL_DODGE_PERK_EFFECT:0 "[PODUnlocksCombatMove('POD_combat_move_werewolf_umbral_dodge')]\n#flavor Рагабаш считает, что лучший способ справиться с врагом — отправить его подальше, возможно, туда, где он поймет глупость своих действий. Она может прорвать дыру в Барьере, уклоняясь от атаки врага, отправляя его в страну духов.#!"
 UNSTOPPABLE_WARRIOR_PERK_EFFECT:0 "Ячейки [POD_health_track|E]: #P +1#!\nИсцеление #V 2#![POD_aggravated_box|E] после победы в [pod_combat_encounter|E]\n#flavor Оборотень стал главным представителем своего Покровительства. Никакие раны не смогут остановить его, только смерть.#!"
 WEAVE_OF_STEEL_PERK_EFFECT:0 "#flavor Хомид может мистическим образом укрепить любую искусственную конструкцию или материал, придавая доскам прочность стали, а стали — твердость алмаза. #!"
 WISDOM_OF_THE_ANCIENT_WAYS_PERK_EFFECT:0 "[PODUnlocksCombatMove('POD_combat_move_werewolf_wisdom_of_the_ancient_ways')]\n#clickable Обучение стаи: #! Все участники получают [GetModifier('philodox_ancient_ways_modifier').GetNameWithTooltip] и восстанавливают 2$POD_energy_gnosis$, если у вас есть [pack_totem|E].\n#flavor Все Гару обладают врожденной связью со своими тотемными духами, формой расового бессознательного, к которому можно получить доступ посредством интенсивной медитации. Гару могут глубоко проникнуть в эти глубокие воспоминания и вспомнить древние факты и знания, которые могут пригодиться сегодня.#!"
 WORDS_LIKE_WIND_PERK_EFFECT:0 "#clickable Песни игнорируют [diplomatic_range|E]#!\n#flavor Музыка, поэзия и крылатые фразы заразительны, они проносятся по культурам и сообществам, как ветерок сквозь деревья. Галлиарда знает, как воспользоваться этой привычкой социальных существ, отправляя свои сообщения по всему миру от одного слушателя к другому.#!"
