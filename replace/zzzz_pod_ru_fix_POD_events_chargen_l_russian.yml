 POD_chargen.3900.a:0 "Раткины и их прихвостни!"
 POD_chargen.3900.b:0 "Чтобы остановить крыс, нам нужны кошки!"
 POD_chargen.3900.c:0 "Виновата монгольская орда!"
 POD_chargen.3900.desc:0 "В первые годы тринадцатого века зимы стали долгими и холодными, а дожди лили подолгу, словно муссоны. Урожаи погибли от затопления. Дороги превратились в грязные болота. Голод и холод внесли свою лепту в заполнение кладбищ. Есть вещие сны о катастрофическом событии в будущем, которое убьет миллионы сновидцев. Детали неясны, но, похоже, речь идет об ордах крыс, идущих с востока, грудах горящих трупов, танцующих скелетах, почерневших пальцах рук и ног. Некоторые феи убеждены, что Раткины и их заражённые союзники, служащие Вирму должны быть уничтожены. \nВаш провидец предрёк тёмное будущее, страшнее Разъединения, — Пророчество Крысы. Вам следует сосредоточиться на исцелении в следующем столетии, чтобы этого не произошло."
 POD_chargen.3900.t:0 "Пророчество Крысы"
 POD_chargen.3901.a:0 "Я ошибаюсь?"
 POD_chargen.3901.a.t:0 "Вы вынуждены быть подменышем, после естественной смерти вы автоматически получите наследника-клона. Выполните свою цель и снова станьте фейри."
 POD_chargen.3901.desc:0 "Некогда слуги самых могущественных богов в Небесной иерархии, Сянь исполняли молитвы смертных по воле своих повелителей. Во время ужасных событий Войны на реке Дракон в начале [fourth_age|E] и падения $pod_wan_xian$ в [third_age|E] многие Шинма восстали против своего положения в Небесной Бюрократии, либо чтобы помочь смертным, либо выступить против них. В результате они были наказаны Августейшей Личностью. Те, кто осмелился поставить себя на место $pod_wan_xian$, были изгнаны и вынуждены жить среди смертных Поднебесной."
 POD_chargen.3901.t:0 "Четвёртая эпоха"
 POD_chargen.3910.a:0 "Этого достаточно."
 POD_chargen.3910.desc:0 "Каждый фей, даже самый юный, владеет Искусствами. Какие силы даны вам от рождения?"
 POD_chargen.3910.effect:0 "Это событие будет повторяться, пока у вас не будет #V 2#! Искусств"
 POD_chargen.3910.t:0 "Рождение Фейри"
