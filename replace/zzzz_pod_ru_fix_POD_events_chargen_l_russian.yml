 chargen_changeling_tt:0 "Обратите внимание, что новичкам, играющим за фей [splat|E] не рекомендуется играть в подменышей. Существование подменышем — следствие неудачи и последняя отчаянная попытка выжить, а не отправная точка!"
 chargen_fera_tt:0 "Для игры этим [splat|E] рекомендуется вторая стартовая дата — «Тёмные века: Оборотни»."
