l_russian:
 pod1230objectives_fae.1.a:0 "Больше суеверий!"
 pod1230objectives_fae.1.desc:0 "Создание Инквизиции стало кульминацией Разъединения, поскольку Церковь в своих доктринальных целях пыталась уничтожить все нежелательные сверхъестественные элементы, включая фейри, из мира. Но теперь все кончено."
 pod1230objectives_fae.1.t:0 "Конец инквизиции"
 pod1230objectives_fae.10.a:0 "$the_krofted_way_objective_decision_tooltip$"
 pod1230objectives_fae.10.desc:0 "$the_krofted_way_objective_decision_desc$"
 pod1230objectives_fae.10.t:0 "$the_krofted_way_objective_decision$"
 pod1230objectives_fae.11.a:0 "$the_middle_way_objective_decision_tooltip$"
 pod1230objectives_fae.11.desc:0 "$the_middle_way_objective_decision_desc$"
 pod1230objectives_fae.11.t:0 "$the_middle_way_objective_decision$"
 pod1230objectives_fae.15.a:0 "Я вернулся"
 pod1230objectives_fae.15.desc:0 "Изучив Нэй Тан и получив самое мощное драконье гнездо, вы стали Дао Дэ Сянем и теперь снова можете общаться с Небесами."
 pod1230objectives_fae.15.t:0 "Тао Дэ Сянь"
 pod1230objectives_fae.2.a:0 "Аминь."
 pod1230objectives_fae.2.desc:0 "Отче наш на небесах, \nДа святятся имена Твои.\nДа приидет Царствие Твоё.\nДухи Святые Твои сойдут на нас и очистят нас.\nДа будет воля Твоя, как на земле, так и на небесах.\nДай нам каждый день хлеб наш на завтра, \nИ прости нам грехи наши, ибо мы сами чтим наши обязательства.\nИ не введи нас в пору испытания — Раскол, и не искушай нас Банальностью.\nИбо царство и сила и слава принадлежат Тебе навеки."
 pod1230objectives_fae.2.t:0 "Константинианский катехизис"
 pod1230objectives_fae.3.a:0 "На небе и на земле есть больше вещей, чем мечтается в вашей философии."
 pod1230objectives_fae.3.desc:0 "Махинации Ордена Разума были сорваны. Их планы связать мир Разумом и Наукой потерпели крах. Их мастерские холодного железа замолчали. После уничтожения Тремер их война Массаса с Орденом Гермеса закончилась поражением нежити-чернокнижников-узурпаторов.  Объединенные герметические дома могли бы обратить все свое внимание и гнев за уничтожение Мистриджа на ремесленников и их тайный союз с учеными-единомышленниками, скупцами, ханжами и святошами, и другими пропагандистами Банальности. Без «рациональных» философов человечество уже возвращается к своим старым верованиям и своим старым договорам с Фейри, чтобы как осмыслить фантастический мир, так и выжить в нем."
 pod1230objectives_fae.3.t:0 "За гранью разумного"
 pod1230objectives_fae.30.a:0 "Как сладок вкус победы!"
 pod1230objectives_fae.30.desc:0 "Война сезонов закончилась. Вы — несомненный победитель, и всё общество $POD_splat_fae$ теперь в ваших руках."
 pod1230objectives_fae.30.t:0 "Война сезонов: Победа"
 pod1230objectives_fae.31.a:0 "Мир – лучшее."
 pod1230objectives_fae.31.desc:0 "Война сезонов закончилась. Все $POD_splat_fae$ наконец-то примирились друг с другом."
 pod1230objectives_fae.31.t:0 "Война сезонов: вечное перемирие"
 pod1230objectives_fae.4.a:0 "Неприятные крысы."
 pod1230objectives_fae.4.desc:0 "Мерзкие крысоборотни вынашивали мрачный план: они создали смертоноснейшую из известных болезней, Чёрную чуму. Вы рады, что остановили их прежде, чем они полностью выпустили это в мир."
 pod1230objectives_fae.4.t:0 "Замысел крысоборотней"
 pod1230objectives_fae.5.a:0 "О боже..."
 pod1230objectives_fae.5.desc:0 "Сейчас все в мире обожают кошек, Пророчество Крысы не исполнится, но, возможно, есть еще одна проблема, с которой нужно разобраться."
 pod1230objectives_fae.5.t:0 "КАТастрофа"
 pod1230objectives_fae.6.a:0 "Соедините Грезу с Землей."
 pod1230objectives_fae.6.a.tt:0 "После слияния [UmbraGlossary('arcadia')] с Землей ваша игра закончится, поскольку мир, который вы когда-то знали, навсегда изменится."
 pod1230objectives_fae.6.b:0 "Начать процесс, но не завершить его."
 pod1230objectives_fae.6.b.tt:0 "Хотя слияние Земли и [UmbraGlossary('dreaming')] и не завершено, оно все же приводит к тому, что «Осенний мир» становится похожим на сон, в результате чего любой [bunk|E] всегда добивается успеха, а Гламур полностью восстанавливается каждый месяц."
 pod1230objectives_fae.6.desc:0 "И когда занавес закрылся на великой сцене Мира Осени, вы откинулись назад и позволили себе улыбнуться. \n\nВы добились своего. Банальности, великого дракона, безмолвной смерти, ненасытного прилива, гасящего истинную жизнь, больше нет. Искра в глазах мечтателей никогда не угаснет, потому что [UmbraGlossary('arcadia')] пришла и останется здесь. Человечество вернуло себе чувство чуда.\n\nПрекрасную историю вы сотворили. Ей осталось лишь несколько завершающих слов. \n\nКак насчет \", и они жили долго и счастливо... \""
 pod1230objectives_fae.6.t:0 "Восстановление Аркадии"
 pod1230objectives_fae.7.a:0 "Хо-хо-хо!"
 pod1230objectives_fae.7.desc:0 "Это сделано! Бесчисленному количеству детей были вручены химерические подарки. Бесчисленное количество детей верят в вас! Их мечты наполняют вас неиссякающим источником Гламура! Мир могут терзать кровавые войны, ужасающие эпидемии, ужасные инквизиции и душераздирающая Банальность — но вы выдержите! \n\n #EMP 'В этот день земля зазвенит \n песней, которую дети поют \n Господу, Христу, Царю нашему, \nрожденному на земле, чтобы спасти нас; \nЕго дал нам Отец. \n\nЕго удел — смерть, наш — радость; \nкогда он сошел на землю, \nВифлеем увидел его рождение; \nвол и осёл рядом с ним \n от холода спрятали бы его. \n\n Божья яркая звезда, над его головой, \n Мудрецы трое к нему вели; \n Преклоняют колени у его постели, \n кладут перед ним свои дары, \n хвалят его и поклоняются ему. \n\nВ этот день ангелы поют; \n их песней зазвенит земля, \n восхваляющие Христа, Царя небесного, \n рожденного на земле, чтобы спасти нас; \nмир и любовь, которые он нам дал. \n\nIdeo, o, o, Ideo, o, o, \nideo gloria in excelsis Deo!'#!"
 pod1230objectives_fae.7.t:0 "Санта Вечный!"
