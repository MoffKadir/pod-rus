 corruptedway_desc:0 "Путь порчи — вера, которую не выбирают: её навязывают. Носители присутствия Асакку переживают это как просветление: более глубокую связь с Клипот, родство с Наблюдателями, возвышение через Изменчивость за пределы того, что когда-либо понимали учёные Тал'махе'Ра. Элиуды называют это болезнью. Асакку называют это становлением."
