 hellwalkers_desc:0 "Эти Ву Тянь, вышедшие из рядов Сянь Лун и Ву Фэн, тайно действуют в Подземном мире и его тысяче адов. Отказываясь от воскрешения и принимая опасность своего ремесла, они нередко остаются единственными светочами чести в самых мрачных царствах."
 legacy_of_hunting_desc:0 "Эта вера была основана тем, кто славился охотой на других сверхъестественных существ. Её последователи продолжают эту традицию."
