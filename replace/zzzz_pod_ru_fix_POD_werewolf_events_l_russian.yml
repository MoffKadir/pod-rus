l_russian:
 POD_werewolves.100.desc:0 "Сделав все необходимые приготовления, вы прибыли к [recipient.GetTitledFirstName]. Ваше сердцебиение ускоряется в ответ на предстоящую битву, бьётся в собственном громовом ритме. Вы двое готовы. \n\nТеперь наступает настоящее испытание... выстоять или погибнуть?"
 POD_werewolves.100.option.a:0 "Сразись со мной!"
 POD_werewolves.100.option.b:0 "Возможно, это не очень хорошая идея..."
 POD_werewolves.100.t:0 "Барабаны битвы"
 POD_werewolves.103.desc:0 "Неважно, что принесло вам победу — сила, мастерство или удача. [recipient.GetTitledFirstName] лежит у ваших ног в крови, без сил. Победа за вами. [recipient.GetHerHis] судьба не имеет значения: даже если [recipient.GetSheHe] выживет, прежней угрозы уже не будет."
 POD_werewolves.103.option.a:0 "Еще один падает передо мной."
 POD_werewolves.103.t:0 "Победа"
 POD_werewolves.104.desc:0 "Кажется, ваша сила оказалась меньше, чем вы думали. [recipient.GetTitledFirstName] победил вас, оставив на произвол судьбы. Выживете ли вы или умрете, теперь зависит от вашего собственного тела."
 POD_werewolves.104.option.a:0 "Я... потерпел неудачу..."
 POD_werewolves.104.t:0 "Побитый и сломанный"
 POD_werewolves.105.desc:0 "К большому разочарованию [recipient.GetTitledFirstName], кажется, что $glossary_luna$ благоволила вам в этом поединке. Победа за вами."
 POD_werewolves.105.option.a:0 "Хороший бой."
 POD_werewolves.105.t:0 "Победа"
 POD_werewolves.106.desc:0 "лол, как ты проиграл?"
 POD_werewolves.106.option.a:0 "я не знаю"
 POD_werewolves.106.t:0 "Проигранная тренировка"
 POD_werewolves.107.desc:0 "Ваш рык привлек внимание [ahroun_target.GetTitledFirstName]. [ahroun_target.GetSheHe] приближается к вам, готовый принять ваш вызов. \n\nСмерть приходит за всеми нами, но кого она достигнет первым?"
 POD_werewolves.107.option.a:0 "Слава будет моей!"
 POD_werewolves.107.option.b:0 "Это не битва, которую я выиграю."
 POD_werewolves.107.t:0 "Появление нового претендента"
 POD_werewolves.108.desc.a:0 "$POD_werewolves.103.desc$"
 POD_werewolves.108.desc.b:0 "$POD_werewolves.104.desc$"
 POD_werewolves.108.option.a:0 "$POD_werewolves.103.option.a$"
 POD_werewolves.108.option.b:0 "$POD_werewolves.104.option.a$"
 POD_werewolves.108.t:0 "Остался только один"
 POD_werewolves.109.desc:0 "Куда бы вы ни пошли, за вами остаётся полоса разрушений. Снова и снова ваши враги восстают против вас только для того, чтобы пасть от вашей руки. О вашей мощи говорят многие, будь то восхищение или страх. Многие говорят, что никто не может сравниться с вами, возможно, они правы. \n\nТеперь, благодаря последнему Дару $glossary_luna$, вас действительно невозможно остановить."
 POD_werewolves.109.option.a:0 "Смерть может завладеть мной, когда она меня заслужит."
 POD_werewolves.109.t:0 "Неудержимый воин"
 POD_werewolves.119.desc:0 "В каждой скорбной песне, боевом гимне и нежной колыбельной вы пронесли бремя своих предков, пересказывая их великие истории. Создавая истории и песни, которые могут тронуть даже самых бессердечных ваших родственников, ваш голос стал сердцем вашего народа. Делясь древними историями о героях, злодеях, победах и поражениях, вы гарантируете, что память о ваших предках никогда не угаснет. \n\nПосле получения последнего Дара $glossary_luna$ ваш голос наверняка будет формировать поколения."
 POD_werewolves.119.option.a:0 "Лучшие истории переживают века."
 POD_werewolves.119.t:0 "Рассказчик"
 POD_werewolves.129.desc:0 "Под ровным светом половины луны вы стали опорой своей стаи. Неутомимыми тренировками и твёрдым руководством вы создали узы крепче железа. Каждый улаженный спор, порождённый яростью и гордыней, каждая слабость, которую вы превратили в новую силу, утвердили ваше положение верховного хранителя закона.\n\nТеперь, когда вы создали идеальную стаю и получили последний Дар $glossary_luna$, ваше слово становится законом."
 POD_werewolves.129.option.a:0 "Лидерство на вершине."
 POD_werewolves.129.t:0 "Разорвать узы"
 POD_werewolves.139.desc:0 "Вас называют бродягой. Бесчестным вором. Спорщиком, презирающим проверенные пути. Пусть они придерживаются своих жестких традиций. Ваши подрывные действия осветят истинный путь вперед. Вы уже высмеяли самодовольных, снова и снова завоёвывая благосклонность $glossary_luna$ для себя. \n\nДоказав свою хитрость, вы стоите волком среди овец. С последним Даром $glossary_luna$ Новолуние ярко сияет над вами, величайшим обманщиком."
 POD_werewolves.139.option.a:0 "Не позволяйте ничему оставаться бесспорным и неоспоримым."
 POD_werewolves.139.t:0 "Огненосец"
 POD_werewolves.149.desc:0 "Завесу между материальным и духовным миром вы уже пересекали бесчисленное количество раз. Вы снова и снова переходили в мир духов, подчиняя обитателей этого мира своей воле, имея дело с озорными духами и исследуя самые глубокие части Умбры. Другие стекаются вокруг вас в каэрнах, с благоговением вслушиваясь в вашу с трудом заработанную мудрость. \n\nПосле того, как вам был дарован последний Дар $glossary_luna$, тайны обоих миров теперь раскрыты."
 POD_werewolves.149.option.a:0 "Знания – сила, и их у меня предостаточно."
 POD_werewolves.149.t:0 "Вызвано Присутствие"
