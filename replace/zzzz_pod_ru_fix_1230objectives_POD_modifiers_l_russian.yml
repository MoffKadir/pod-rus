l_russian:
 POD_maryb_starting_pacts.tt:0 "Каждые восемь лет наступает срок исполнения двух договоров с демоном Аностером: договора крови и договора боли."
 POD_nicnevin_modifier:0 "Наследие Никневин"
 POD_pressyne_modifier:0 "Наследие Прессины"
 angel_soul_modifier:0 "Душа Ангела"
 angel_soul_modifier_desc:0 "Душа Михаила грозит поглотить вас."
 beast_unleashed_modifier:0 "Зверь на свободе"
 beast_unleashed_modifier_desc:0 "Душа хорошего человека в обмен на власть. Стоило ли оно того?"
 chivalric_ideal_modifier:0 "Рыцарский идеал"
 chivalric_ideal_modifier_desc:0 "Истинную красоту можно найти в изящном и безупречном исполнении боя."
 custom_mummy_dynasty_secured_future_modifier:0 "Основана Пятая династия."
 dark_petal:0 "Темный лепесток"
 dark_petal_desc:0 "Ее сущность несет удушливый аромат мертвых цветов."
 dynasty_hunter_alliances_akritai_modifier:0 "Поддержка акритов"
 dynasty_hunter_alliances_akritai_modifier_desc:0 "#flavor Защитники восточного христианства являются наследниками сложной византийской правовой и бюрократической системы. Полезный навык для растущего охотничьего ордена. #!\nТеперь вы можете пригласить члена этой организации с помощью $contact_fellow_hunters_decision$ [decision|E]."
 dynasty_hunter_alliances_ikhwan_modifier:0 "Поддержка со стороны Ихвана Аль-Сафа"
 dynasty_hunter_alliances_ikhwan_modifier_desc:0 "#flavor Несмотря на отсутствие формальной организации, Ихваны не имеют себе равных в охоте на монстров на своей территории. Экспертиза, у которой можно учиться. #!\nТеперь вы можете пригласить члена этой организации с помощью $contact_fellow_hunters_decision$ [decision|E]. \nТеперь вы можете попросить специального наставничества в волшебстве с помощью $contact_fellow_hunters_decision$ [decision|E]."
 dynasty_hunter_alliances_inquisition_modifier:0 "Поддержка Теневой Инквизиции"
 dynasty_hunter_alliances_inquisition_modifier_desc:0 "#flavor Самым могущественным орденом охотников, без сомнения, является Теневая Инквизиция. Вы хотите, чтобы они были на вашей стороне... или, по крайней мере, не вмешивались. #!\nТеперь вы можете пригласить члена этой организации с помощью $contact_fellow_hunters_decision$ [decision|E].\n$countermeasures_unlocks_t1_all_seeing_eye$"
 dynasty_hunter_alliances_judges_modifier:0 "Поддержка судей"
 dynasty_hunter_alliances_judges_modifier_desc:0 "#flavor Знающие судьи привнесут в вашу битву богатый опыт и мистические знания, если станут вашими союзниками. #!\nТеперь вы можете пригласить члена этой организации с помощью $contact_fellow_hunters_decision$ [decision|E]. \nТеперь вы можете попросить специального наставничества в теургии с помощью $contact_fellow_hunters_decision$ [decision|E]."
 dynasty_hunter_alliances_qorjin_modifier:0 "Поддержка Багатура Корджина"
 dynasty_hunter_alliances_qorjin_modifier_desc:0 "#flavor У монгольских охотников странные союзники... но их грубая сила позволяет легко закрыть глаза. #!\nТеперь вы можете пригласить члена этой организации с помощью $contact_fellow_hunters_decision$ [decision|E]. \nМожет нанимать [GetMaA('battlescarred_fera').GetName] как [men_at_arms|E]."
 exquisite_poison_modifier:0 "Изысканный яд"
 exquisite_poison_modifier_desc:0 "Декадентская гниль в ядре империй может быть очень заманчивой."
 grand_patrons_modifier:0 "Великие покровители"
 grand_patrons_modifier_desc:0 "Наше бесконечное покровительство развивает цивилизации."
 hideous_truth_modifier:0 "Ужасная правда"
 hideous_truth_modifier_desc:0 "Голодный паразит очевиден для всех."
 king_of_outlaws_modifier:0 "Король преступников"
 king_of_outlaws_modifier_desc:0 "Поднимайтесь и поднимайтесь снова, пока ягнята не станут львами."
 mary_ash_and_gold_mary_modifier:0 "Пепел и золото: Мэри выходит на первый план"
 mary_ash_and_gold_mary_modifier_desc:0 "На этот раз она появилась вновь, еще раз доказав, почему все были правы, опасаясь ее. Хищная половина контролирует ситуацию. На данный момент."
 mary_ash_and_gold_michael_modifier:0 "Пепел и золото: Михаил выходит на первый план"
 mary_ash_and_gold_michael_modifier_desc:0 "#shinygold А сейчас, возлюбленные, моя рука направляет. Пусть они немного погреются в моем тепле. #! Сияющая половина все контролирует. На данный момент."
 mary_ash_and_gold_modifier:0 "Пепел и золото"
 mary_ash_and_gold_modifier_desc:0 "Ни Мэри, ни Михаил не господствуют безраздельно. Их страстные, смешанные чувства породили нечто странное. Власть постоянно переходит от одного к другому без видимой закономерности."
 mary_ash_gold_mary_surfaces.toast:0 "Мэри выходит на первый план. Тёмная половина Мечты теперь управляет происходящим."
 mary_ash_gold_michael_surfaces.toast:0 "#shinygold Михаил выходит на первый план. Светлая половина Мечты теперь управляет происходящим.#!"
 mary_black_dream_modifier:0 "Черная мечта"
 mary_black_dream_modifier_desc:0 "Мэри забрала Мечту себе. То, что когда-то должно было быть утопией, стало местом адских страданий."
 mary_fragmented_self_modifier:0 "Фрагментированное Я"
 mary_fragmented_self_modifier_desc:0 "Она не возродилась цельной. Её разум был рассеян вместе с табличками Эблы, и вернулся он лишь по частям."
 mary_fragmented_self_modifier_t1:0 "Фрагментированное «Я»: найдена одна табличка"
 mary_fragmented_self_modifier_t1_desc:0 "Единственная часть головоломки была восстановлена. Туманные воспоминания становятся яснее."
 mary_fragmented_self_modifier_t2:0 "Фрагментированное «Я»: найдены две таблички"
 mary_fragmented_self_modifier_t2_desc:0 "Две части ее самой наконец-то оказались там, где им место, но последний осколок, Призыв, остается вне ее досягаемости."
 mary_most_hated_modifier:0 "Один из самых ненавистных сородичей Европы"
 mary_most_hated_modifier_desc:0 "Ваше имя поносят от Акра до Лондона за ваше участие в разрушении Мечты. Это не останется неотомщенным."
 mary_second_dream_modifier:0 "Вторая Мечта"
 mary_second_dream_modifier_desc:0 "#shinygold Михаил вновь восстаёт, возрождённый из пепла. Мечта продолжает жить, хотя стала ещё более странной.#!"
 mary_tanith_commission_cyprus_brujah_modifier:0 "Поручение Танит: убежище дочери"
 mary_tanith_commission_cyprus_brujah_modifier_desc:0 "Шутатара, предавшая Танит её дитя, бежала ко двору Неемии из клана Бруха, князя Кипра. Герцогство [GetTitleByKey('d_cyprus').GetNameNoTier] должно сменить владельца, пока дочь не успела там освоиться."
 mary_tanith_commission_cyprus_modifier:0 "Поручение Танит: благочестивая угроза"
 mary_tanith_commission_cyprus_modifier_desc:0 "Танит настроила вас против рыцарей Акры на Кипре. Герцогство [GetTitleByKey('d_cyprus').GetNameNoTier] должно пасть, прежде чем охотники смогут набрать силу."
 mary_tanith_commission_diyarbakr_modifier:0 "Поручение Танит: соперник во тьме"
 mary_tanith_commission_diyarbakr_modifier_desc:0 "Танит дала вам приказ относительно Ордена Азаниэля. Нужно захватить графство в герцогстве [GetTitleByKey('d_diyarbakr').GetNameNoTier] или [GetTitleByKey('d_diyarrabia').GetNameNoTier]. Докажите ей, что вас стоит держать рядом."
 mary_tanith_commission_olives_modifier:0 "Поручение Танит: Оливковый собор"
 mary_tanith_commission_olives_modifier_desc:0 "Танит направила вас против Оливкового собора. Нужно захватить графство в герцогстве [GetTitleByKey('d_antioch').GetNameNoTier] или [GetTitleByKey('d_lebanon').GetNameNoTier], пока враги не стали слишком сильными."
 mary_tanith_legacy_modifier:0 "Наследие Танит"
 mary_tanith_legacy_modifier_desc:0 "Защита Танит теперь распространяется не только на ее двор. Дом Молоха узнает вас."
 mary_tanith_protection_lapsed_landless.toast:0 "Танит больше не может или не будет защищать вас. В конце концов, ее имя не принесет тебе никакой пользы в дороге. Охотники ждут."
 mary_tanith_protection_modifier:0 "Защита Танит"
 mary_tanith_protection_modifier_desc:0 "Танит признает ваши таланты. Обязательно не подведите ее."
 mary_well_offering_t2:0 "Подношение принесено"
 mary_well_offering_t2_desc:0 "Кровь города течет щедро. Поднимите следующий уровень."
 mary_well_offering_t3:0 "Подношение принесено"
 mary_well_offering_t3_desc:0 "Кровь города течет щедро. Поднимите следующий уровень."
 mary_well_offering_t4:0 "Подношение принесено"
 mary_well_offering_t4_desc:0 "Дается последнее подношение. Наконец-то Колодец можно открыть; поднять последний уровень."
 maryb_trinity_the_fall_modifier:0 "Падение"
 maryb_trinity_the_fall_modifier_desc:0 "#shinygold Отчаявшиеся приходят ко мне со столькими желаниями и просьбами. Я не позволю им уйти такими же, какими они пришли.#! В глубине что-то не так, но ни один из двоих не может понять, почему."
 muses_modifier:0 "Музы"
 muses_modifier_desc:0 "Само наше Присутствие вдохновляет искусство и поклонение."
 vatican_secrets_modifier:0 "Тайны Ватикана"
 vatican_secrets_modifier_desc:0 "Влияние Ласомбра на Святой Престол обеспечивает эзотерические знания и позволяет тайно перенаправлять их средства."
