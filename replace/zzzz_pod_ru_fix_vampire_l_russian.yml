l_russian:
 POD_hideout_clan.0002.a:0 "Зеркала не врут. Покажи мне все."
 POD_hideout_clan.0002.b:0 "Некоторые истины лучше оставить в неведении."
 POD_hideout_clan.0002.c:0 "Этой ночью шёпот умолк. Здесь не найти секретов."
 POD_hideout_clan.0002.desc:0 "Зеркала в вашей Палате Оракула начали запотевать сами по себе. Образы формируются и растворяются; лицо, которое вы узнали, разговор, в котором вы никогда не участвовали, истина, которая, по мнению кого-то, была благополучно похоронена. \n\nСеть Безумия преподносит свои дары непрошенно, и цена зрения Малкава состоит в том, что вы не можете закрыть глаза."
 POD_hideout_clan.0002.t:0 "Шепот говорит"
 POD_hideout_clan.0010.a:0 "Принять гостя. Предложить кров и пропитание."
 POD_hideout_clan.0010.b:0 "Отказать гостю. Здесь не постоялый двор."
 POD_hideout_clan.0010.desc:0 "Слухи о вашем прибежище Джати дошли до дворов странников. У вашего порога стоит товарищ-шарлатан, утомленный путешествием и несущий на себе признаки определенной касты. Древняя обязанность гостеприимства Равнос требует ответа. \n\nТрадиции джати ясны: бесплатно предоставленное убежище возмещается десятикратно. Отказ от приюта запомнится навсегда."
 POD_hideout_clan.0010.t:0 "Путешественник на пороге"
 POD_hideout_clan.0011.a:0 "Такая мудрость — честь для моего дома."
 POD_hideout_clan.0011.desc:0 "Старейшина держится со спокойным достоинством Пхури Дэ — мудрецов, чьи советы определяют жизнь дворов странствующих Равнос. Речь идёт о старых долгах и ещё более давней дружбе, а присутствие такого гостя укрепляет ваш авторитет как среди каинитов, так и среди смертных.\n\nВ течение пяти лет это благословение будет отмечать ваши владения как место мудрости и справедливого правления."
 POD_hideout_clan.0011.t:0 "Мудрость Пхури Дэ"
 POD_hideout_clan.0012.a:0 "Отдыхайте. Ваш клинок — честь для моего очага."
 POD_hideout_clan.0012.desc:0 "Кшатрий дороги. Покрытый шрамами, настороженный и двигающийся с напряжённой готовностью воина, пережившего больше засад, чем можно сосчитать. В обмен на безопасное место для отдыха гость делится усвоенными дорогой ценой уроками ведения войны и тактики. \n\nВ течение пяти лет ваши войска будут сражаться с хитростью, отточенной в странствиях."
 POD_hideout_clan.0012.t:0 "Клинок кшатрия"
 POD_hideout_clan.0013.a:0 "Торговля — это кровь дороги. Добро пожаловать."
 POD_hideout_clan.0013.desc:0 "Прибывает торговец-вайшья с товарами из дальних стран; пряностями, тканями и сведениями, которые дороже и того и другого. Гость предлагает выгодные условия и доступ к части своих связей в обмен на ночлег. \n\nВ течение пяти лет ваша казна будет получать выгоду от дорожной торговли."
 POD_hideout_clan.0013.t:0 "Караван вайшьев"
 POD_hideout_clan.0014.a:0 "Расскажи мне все. У меня хватит на это смелости."
 POD_hideout_clan.0014.desc:0 "Сибарит — проворный, красноречивый, излучающий легкое обаяние человека, сумевшего уговорить собеседников отпустить его из большего числа передряг, чем большинству каинитов довелось пережить. За крепким вином и доверительными разговорами гость делится уловками дезориентации и манипуляции. \n\nВ течение пяти лет ваши планы будут только выигрывать от мастерства Сибарита."
 POD_hideout_clan.0014.t:0 "Шепот сибарита"
 POD_hideout_clan.0015.a:0 "Иди по дороге с миром, святой."
 POD_hideout_clan.0015.desc:0 "Прибывает брамин дорожной веры, несущий на себе следы долгого паломничества. Гость говорит о Дороге Парадокса с убежденностью, граничащей с пророчеством, и в его благословениях чувствуется сила искренней веры. \n\nВ течение пяти лет верующие будут смотреть на вас с большим почтением."
 POD_hideout_clan.0015.t:0 "Благословение брамина"
 POD_hideout_clan_0001_no_target_tt:0 "Подходящих целей с неизвестными секретами обнаружено не было."
