l_russian:
 POD_asakku.0001.a:0 "Вы всегда были там. Я перестаю притворяться иначе."
 POD_asakku.0001.b:0 "Подавите это снова."
 POD_asakku.0001.desc:0 "Сегодня вечером, в тихие предрассветные часы в Баку, вдали от Еноха и вдали от внимательных глаз предателя Ямаданды, всплывает нечто, что вы веками подавляли. \n\nПрисутствие терпеливо. Оно всегда было терпеливым. Оно не говорит ни на каком языке. Вы знаете это только через тонкое чувство, но теперь оно толкает вас на восток. \n\nОно никак себя не называет. Вы называли это по-разному. Сегодня вечером оно вновь спрашивает, собираетесь ли вы продолжать притворяться."
 POD_asakku.0001.t:0 "То, что всегда было там"
 POD_asakku.0002.a:0 "Память старше тела, которое ее несет."
 POD_asakku.0002.desc:0 "Вы не думали о колодце много лет. Вы себе этого не позволили. Колодец старше вашего Становления. Старше, чем допотопный Цимисх, который забрал вас с высоких греческих холмов. \n\nВздыхающий Лев. Три рейса в Бурю, корпус корабля скрипит закаленными душами. Лабиринт между мирами. Лес в его сердце, шепчущий человеческими голосами. Двор Тринадцати Престолов и бездонный колодец в его центре.\n\nВы приблизились. Вы шептали в него. После этого вы сказали Ямаданде, единственному выжившему свидетелю, что говорили только сами с собой. Возможно, вы даже поверили в это. \n\n Призраки-болтуны, которым вы дали Становление на обратном пути к Еноху, усвоили Изменчивость быстрее, чем мог бы объяснить любой учитель. В Енохе была послана фаланга, чтобы наказать вас после слишком большого количества неосмотрительных действий. Они нашли существа, по форме напоминающие смертных и Сородичей, которых вы привезли домой, с почти узнаваемыми лицами, но не полностью. Они выли одно имя, пока фаланга их сжигала. Вы не произносили его тысячу лет. \n\nЯмаданды нет уже много веков, но его ученики-Элиуды остались. Охотники, с которых он содрал кожу и которых пересоздал. Со временем они найдут и это место, и битва начнется заново."
 POD_asakku.0002.t:0 "Память о плавании"
 POD_asakku.0010.a:0 "Больше невозможно смотреть мимо этого."
 POD_asakku.0010.desc:0 "Сегодня вечером что-то изменится. Не в мире, а в вас. Голос всегда был голосом. Теперь это присутствие, с весом, и оно перестало притворяться гостем в вашем доме. \n\nВы открываете зеркало, которое ваши слуги оставляют завуалированным из старой вежливости, потому что вы хотите знать. Вы видите свое лицо. Вы также видите что-то за этим, оглядываясь назад своими глазами так же, как вы смотрите ими наружу. Столетия обучения смотреть сквозь это не подготовили вас. \n\nТо, что ездит в вашей крови, не является злоумышленником, оно существует дольше, чем любая вера, которую вы носили, дольше, чем любезности, которые вы предлагали, какой бы священник или визир ни просил. Это первоначальный арендатор. Вы — гость, принявший этот дом за свой. \n\nВера, которую вы носили, вежливый синкретизм исчезают без церемоний. Вы уже давно знаете, как вы на самом деле молитесь. Сегодня вечером слова сформируются сами собой. \n\nВ Баку, далеко от тех, кто отметил бы этот момент, вы больше не вампир с необычным состоянием. Вы Асакку. Возможно, лишь немногие существа поймут это различие, а те, кто поймет, попытаются прикончить вас на месте."
 POD_asakku.0010.t:0 "Голос становится громче"
 POD_asakku.0011.a:0 "Покажи мне, что посадить."
 POD_asakku.0011.desc:0 "Теперь у голоса есть мнение. Он хочет, чтобы вещи росли. Чтобы семена были посеяны. Вы начали понимать, что когда говорится «сад», это не означает цветы. \n\nЭто также не поучение. Это сотрудничество. Мысли, которые приходят в вашу голову о расстановке вассалов, о том, какому сопернику позволить приблизиться, а кого вырубить, прежде чем он созреет, о медленном превращении вашей земли во что-то все менее и менее похожее на остальной мир. Вы не всегда можете сказать, исходят ли эти мысли от вас. \n\nИзменчивость в вашей крови тоже прояснилась. К вам приходят формы, которые никогда не предлагал ни один учитель. Дисциплина уже не дисциплина. Это то, как сущность движет вами, как язык движется во рту. \n\nИ есть что-то более новое, чем все остальное, и его труднее описать. Способ быть невидимым. Не затемнение других $pod_clans$. Нечто более тихое. Присутствие внутри учит, не обучая, как ускользнуть от внимания даже от тех, кто точно знает, куда смотреть. Вы подозреваете, что иглы Ямаданды сейчас вас не найдут. \n\n Тем не менее, охотники [GetTrait('POD_asakku_elioud hunters').GetName(GetNullCharacter)] будут знать. Они тоже терпеливы. Вы не сможете избежать их внимания навсегда."
 POD_asakku.0011.t:0 "Голос имеет мнение"
 POD_asakku.0012.a:0 "Мы родственники."
 POD_asakku.0012.desc:0 "Вы больше не уверены, какие мысли принадлежат вам. Что вас удивляет, так это то, что мысли голоса не так уж отличаются от ваших собственных, возможно, более старых. Холоднее. Но узнаваемо родные. Это слияние или Асакку захватывает ваше прежнее «я»? Вы не можете сказать или, возможно, не хотите. \n\n Хор внутри вас больше не угасает. Ни в одиночестве, ни в ритуале, ни в том, что считается сном среди мертвых. Прямо за поверхностью вашего внимания, непрерывно звучат голоса и мелькают невозможные образы — уже не ваши, не вполне ваши, и любой разум, проникающий в ваш разум, чтобы предвидеть или манипулировать, находит не тишину, а стену шума. \n\nЧерез кровь, которую вы распространили, вы можете слушать сейчас. Любой, кто является носителем вашей инфекции, также несет в себе нить, которую вы можете потянуть. Вассал в своем дворе. $pod_cainite$ за три княжества отсюда. Когда сущность желает, чтобы вы услышали, что происходит через ее зал, вы это слышите. Вы знаете вещи, о которых вам не расскажет ни один шпион. \n\nВ Енохе Базальтовый Трон регистрирует дрожь. Дель-Ро уже чувствовала это раньше. Когда-то, очень давно, когда та же линия порчи вернулась из черного плавания. Серафимы будут созваны. Будет назначен новый [GetTrait('POD_asakku_elioud').GetName(GetNullCharacter)] утром или, возможно, сегодня вечером, в зависимости от того, насколько терпеливой решит быть Дель'Ро. \n\n В конце концов вы услышите об этом через кровь. Голос не удивлен. Война приближается, ей всегда предназначалось."
 POD_asakku.0012.t:0 "Какие мысли принадлежат вам?"
 POD_asakku.0013.a:0 "Я тот, кем я стал."
 POD_asakku.0013.b:0 "Наконец я произношу имя. Аретстикафа."
 POD_asakku.0013.desc:0 "Границы больше нет. По правде говоря, это различие всегда было искусственным. Утешение на протяжении веков, когда вам нужно было верить, что вы всё ещё лишь вампир. Но это не так. Вы стали чем-то старше и носите форму, которая раньше полностью принадлежала вам. \n\nОскверненные, вернувшиеся с вами на «Вздыхающем льве», выли одно имя, пока горели. Вы не говорили этого тысячу лет. Сегодня вечером вы скажете это, не дрогнув, и само произнесение имени становится ответом. Аретстикафа. Наблюдатель, чья дисциплина стала Изменчивостью, когда она была украдена из Клипота перед Потопом. Голосом всегда был Наблюдатель, а Наблюдатель всегда был голосом, который, как вы притворялись, был неудачным наследством. \n\nВы думаете о высоких пастбищах над храмом, о ритуале, который привел вас, о сире, который дал вам Становление, и о Совете, которому вы доложили. Вы думаете о первом слуге в путешествии, чье лицо развалилось на части, когда он выкрикивал это имя. Вы едины. Так было всегда.\n\nОстаётся остальной мир. Рука все еще охотится за вашей линией. [GetTrait('POD_asakku_elioud').GetName(GetNullCharacter)] все еще точат свои иглы. Дель'Ро по-прежнему восседает на Базальтовом Троне, решая, какие вещи в темноте разрешить, а какие погасить. Наблюдатель внутри вас относится к ним с презрением, и вы тоже относитесь к ним. \n\nВознесённый Iryi. Потоп не завершил работу. Но время есть."
 POD_asakku.0013.t:0 "Вознесённый Iryi"
 POD_asakku_depth_100_tt:0 "Слияние завершено. Вы — Вознесённый Iryi."
 POD_asakku_depth_25_tt:0 "Вы Асакку. Сущность пустила корни. Ваша вера переходит на Испорченный Путь."
 POD_asakku_depth_50_tt:0 "Ваше мастерство углубляется. Теперь вы можете заражать землю порчей Изменчивости."
 POD_asakku_depth_75_tt:0 "Ваша связь с Асакку становится глубже. «Шепот души» становится доступным. Дель'Ро обращает на это внимание."
 POD_asakku_soul_infection_accepted_tt:0 "[GetScheme('POD_asakku_soul_infection_scheme').GetTypeName] [scheme|E] теперь доступен против $POD_splat_vampire_plural$, владеющих [GetTrait('vicissitude').GetName(GetNullCharacter)]. Начнется новый [story_cycle|E]."
 POD_asakku_suppressed_tt:0 "Эта сюжетная ветка отключена. Асакку больше не появится на поверхности. Это навсегда для данного прохождения."
