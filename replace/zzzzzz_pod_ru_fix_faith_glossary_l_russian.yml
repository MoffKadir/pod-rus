l_russian:
 ashirra_religion_desc:0 "#TOOLTIP:game_concept_ashirra_desc #L Аширра#!#! (с арабского «ашира» - «клан») - секта, в которой исламские вампиры провозглашают свою веру в Аллаха и которая правит в Аравии и Северной Африке, начиная с Тёмных веков. Члены #TOOLTIP:game_concept_ashirra_desc #L Аширры#!#! верят, что искупление для сородичей было одним из обещаний, данных Мухаммедом, если они решат следовать за Аллахом."
 viacain_desc:0 "Каинитская ересь - еретическое вероучение, исповедуемое в основном каинитами-христианами, в основном, но не только, вампирами Ласомбры. Она в значительной степени пропитана гностицизмом и использует паству человеческих священников и клириков. Исторически ересь возникла на основе различных культов крови, в которых вампирам поклонялись как богам. Вампиры, благодаря своим нетленным телам, независимости от материального мира и силе, которую дают их #TOOLTIP:game_concept_discipline_desc #L Дисциплины#!#!, рассматривались некоторыми гностиками как существа высшей духовности, и их искали для обучения в обмен на #TOOLTIP:game_concept_vitae_desc #L витэ#!#!."
 eschatologists_desc:0 "Фракция #TOOLTIP:game_concept_Clan_desc #L клана#!#! Расхитителей могил благочестиво верит в каинитскую ересь, хотя и с более христологическим акцентом, чем основная секта. Эсхатологи верят, что они - потомки как Каина, так и Христа, и что подносить свою #TOOLTIP:game_concept_vitae_desc #L витэ#!#! в жертву смертным - само по себе таинство. Эсхатологи путешествуют по задворкам Европы и устраивают массовые «возрождения», на которых происходят удивительные чудеса крови и #TOOLTIP:game_concept_discipline_desc #L дисциплины#!#!. Самое большое из этих собраний происходит 17 декабря, в день памяти святого Лазаря."
 calomenasforsaken_desc:0 "Проклятие #TOOLTIP:game_concept_cainite_desc #L каинитской#!#! расы, Отрёкшиеся - группа охотников, исповедующих богомильскую ересь. Они верят, что Каломена была сестрой Каина, и им предстоит уничтожить детей Каина - вампиров. Они верят в дуалистическую философию, а также соблюдают суровую бедность, которой придерживается большинство богомилов."
 codeoftremere_religion_desc:0 "Кодекс - моральная доктрина #TOOLTIP:game_concept_Clan_desc #L клана#!#! Тремеров. Строгий свод правил и практик, обеспечивающих выполнение воли старейшин #TOOLTIP:game_concept_Clan_desc #L клана#!#!."
 tremerecode_desc:0 "Кодекс Тремеров отличает #TOOLTIP:game_concept_Clan_desc #L клан#!#! как уникальное явление среди #TOOLTIP:game_concept_cainite_desc #L каинитов#!#!; ни одна другая группа не придерживается единого набора правил, определяющих приемлемое поведение. Никакая принудительная магия не связывает тремера клятвой, если только какой-нибудь суровый регент не решит активно ее исполнять; вместо этого кодекс представляет собой фактический перечень того, что является приемлемым поведением для члена августейшего дома Тремер. В кодексе подробно описывается, что ожидается от тремера и какие действия могут заслужить немилость."
 doctrine_vampireghouling_accepted_desc:0 "Удел скота - служить нам, и они становятся лучшими вассалами, когда связаны Узами крови.\n\nО тех, кто служит\n\nТе, кого вы решили благословить могуществом Каина, могут жить в вашем доме, чтобы защищать вас, пусть никто не дарует #TOOLTIP:game_concept_Embrace_desc #L объятия#!#! этим стражам, пусть им дают кровь в нужное время: пусть их сила будет вашей силой; силой, которая не ослабевает с солнцем. Пусть их глаза будут вашими глазами, глазами, которые видят днем. Пусть их уши будут вашими ушами, ушами, которые слышат, пока вы дремлете."
 doctrine_vampireghouling_mass_desc:0 "Кровь сородичей может создавать легионы.\n\nО тех, кто служит\n\nТе, кого вы решили благословить могуществом Каина, могут жить в вашем доме, чтобы защищать вас, пусть никто не дарует #TOOLTIP:game_concept_Embrace_desc #L объятия#!#! этим стражам, пусть им дают кровь в нужное время: пусть их сила будет вашей силой; силой, которая не ослабевает с солнцем. Пусть их глаза будут вашими глазами, глазами, которые видят днем. Пусть их уши будут вашими ушами, ушами, которые слышат, пока вы дремлете."
 doctrine_vampirediablerie_crime_desc:0 "Поглощение души другого сородича - самое страшное преступление среди нашего вида.\n\nПрощание, запрещающее #TOOLTIP:game_concept_diablerie_desc #L диаблери#!#!\n\nНе ищите крови своего старейшины, не ищите крови #TOOLTIP:game_concept_Sire_desc #L сира#!#! вашего #TOOLTIP:game_concept_Sire_desc #L сира#!#!, не ищите того, кто сделал вас сородичем, ибо вы почувствуете погребальный костер, когда заплатите за свой бессмертный грех."
 doctrine_vampirethinblood_justicar_desc:0 "[GetTrait('caitiff').GetName( GetPlayer )] может назначить #TOOLTIP:game_concept_justicar_desc #L юстициара#!#!."
 doctrine_ventrue_justicar_desc:0 "[GetTrait('ventrue').GetName( GetPlayer )] могут назначить #TOOLTIP:game_concept_justicar_desc #L юстициара#!#!."
 doctrine_toreador_justicar_desc:0 "[GetTrait('toreador').GetName( GetPlayer )] могут назначить #TOOLTIP:game_concept_justicar_desc #L юстициара#!#!."
 doctrine_tremere_justicar_desc:0 "[GetTrait('tremere').GetName( GetPlayer )] могут назначить #TOOLTIP:game_concept_justicar_desc #L юстициара#!#!."
 doctrine_brujah_justicar_desc:0 "[GetTrait('brujah').GetName( GetPlayer )] могут назначить #TOOLTIP:game_concept_justicar_desc #L юстициара#!#!."
