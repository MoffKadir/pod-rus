 doctrine_malkavian_justicar_desc:0 "[GetTrait('malkavian').GetName( GetPlayer )] могут назначить #TOOLTIP:game_concept_justicar_desc #L юстициара#!#!."
 doctrine_lasombra_justicar_desc:0 "[GetTrait('lasombra').GetName( GetPlayer )] могут назначить #TOOLTIP:game_concept_justicar_desc #L юстициара#!#!."
 doctrine_tzimisce_justicar_desc:0 "[GetTrait('tzimisce').GetName( GetPlayer )] могут назначить #TOOLTIP:game_concept_justicar_desc #L юстициара#!#!."
 doctrine_ravnos_justicar_desc:0 "[GetTrait('ravnos').GetName( GetPlayer )] могут назначить #TOOLTIP:game_concept_justicar_desc #L юстициара#!#!."
 doctrine_hecata_justicar_desc:0 "[GetTrait('cappadocian').GetName( GetPlayer )] могут назначить #TOOLTIP:game_concept_justicar_desc #L юстициара#!#!."
 doctrine_setite_justicar_desc:0 "[GetTrait('setite').GetName( GetPlayer )] могут назначить #TOOLTIP:game_concept_justicar_desc #L юстициара#!#!."
 doctrine_setite_evil_desc:0 "У Сета, создателя Проклятых мумий и главного противника #TOOLTIP:glossary_osirian_league_tt #L Осирианской лиги#!#!, много самоотверженных врагов."
 doctrine_assamite_justicar_desc:0 "[GetTrait('assamite').GetName( GetPlayer )] могут назначить #TOOLTIP:game_concept_justicar_desc #L юстициара#!#!."
 doctrine_salubri_justicar_desc:0 "[GetTrait('salubri').GetName( GetPlayer )] могут назначить #TOOLTIP:game_concept_justicar_desc #L юстициара#!#!."
 tenet_vampireprogeny_desc:0 "Вы можете стать #TOOLTIP:game_concept_Sire_desc #L сиром#!#! другого только с разрешения своего старейшины. Если вы создадите другого сородича без разрешения, то и вы, и ваше потомство будут убиты."
 tenet_vampireamaranth_desc:0 "Практика #TOOLTIP:game_concept_diablerie_desc #L диаблери#!#!"
 tenet_vampiremonomacy_desc:0 "Почетный поединок, который заканчивается #TOOLTIP:game_concept_diablerie_desc #L диаблери#!#!. Ритуал Мономахии используется для разрешения споров между всеми Шабашами."
 tenet_legacyoftrinity_desc:0 "Кодекс предписывает главенство трех основных кланов: Тореадоров, Цимисхи и Вентру. Члены других кланов должны обратиться к квезитору с просьбой стать чьим-либо #TOOLTIP:game_concept_Sire_desc #L сиром#!#!; членам трех основных кланов разрешено становиться #TOOLTIP:game_concept_Sire_desc #L сиром#!#! без позволения. Только члены трех основных кланов могут завещать домен другому вампиру, и каждый вампир в пределах этого домена обязан соблюдать Кодекс."
 special_doctrine_fivefold_path_kindred_desc:0 "Пять традиционных #TOOLTIP:podgloss.dharma #L дхарм#!#!, созданных первым #TOOLTIP:podgloss.arhat #L архатом#!#!, [GetScriptedCharacterByHistoryID('791111').GetFirstName]. Они составляют традиционное ядро общества #TOOLTIP:game_concept_kuei_jin_desc #L куэй-дзин#!#!.\nПоследователи Пятикратного пути считают еретические #TOOLTIP:podgloss.dharma #L дхармы#!#! болезненно заблуждающимися глупцами или опасными предателями, которых необходимо уничтожить навсегда."
 special_doctrine_is_anda_faith_desc:0 "[Concept('faiths', 'Конфессии')|E] #TOOLTIP:podgloss.anda #L Анда#!#!, союзники [Concept('akuma', 'акума')|E] при дворе Черной черепахи, являются врагами лоялистов #TOOLTIP:game_concept_kuei_jin_desc #L Ван-куэй#!#!."
 special_doctrine_allied_to_anda_hostility_desc:0 "[Concept('akuma', 'Акума')|E] рассматривают #TOOLTIP:podgloss.anda #L Анда#!#! как благодатную почву для проникновения и косвенно помогают им разрушить традиционные дворы."
 special_doctrine_against_to_anda_hostility_desc:0 "Когда монгольские племена объединились, #TOOLTIP:podgloss.anda #L Анда#!#! последовали за ними подобно вихрю, разрушив владения #TOOLTIP:game_concept_kuei_jin_desc #L Ван-куэй#!#! и начав вражду, которая закончится только с гибелью одной из сторон."
 special_doctrine_allied_to_yomi_wan_hostility_desc:0 "#TOOLTIP:podgloss.yamaking #L Повелители Яма#!#! - наши владыки. Те, кто не подчиняется им, будут уничтожены."
 special_doctrine_against_to_yomi_wan_hostility_desc:0 "Остерегайтесь союзников #TOOLTIP:podgloss.yamaking #L повелителей Яма#!#!. Они должны быть уничтожены с предельным усердием."
 special_doctrine_allied_to_apophis_hostility_desc:0 "#TOOLTIP:glossary_wyrm_tt #L Апофис#!#! - наш верховный повелитель. Те, кто не подчиняется ему, скоро поймут это или будут уничтожены."
 special_doctrine_against_to_apophis_hostility_desc:0 "Враги #TOOLTIP:glossary_wyrm_tt #L Апофиса#!#!. Змей и его многочисленные маски должны быть уничтожены."
 special_doctrine_osirian_league_desc:0 "Несмотря на поражение, дух непокорности #TOOLTIP:glossary_osirian_league_tt #L Осирианской лиги#!#! по отношению к Сету сохранился."
 cabiri_hostility_doctrine_desc:0 "Они практикуют те же обряды и хекау, что и их египетские собратья, сражаясь против приспешников #TOOLTIP:glossary_wyrm_tt #L Апофиса#!#!, но также и против деспотизма Шемсу-Геру."
 doctrine_banemummy_evil_desc:0 "С ликами #TOOLTIP:glossary_wyrm_tt #L Апофиса#!#! не может быть мира или переговоров. Мы уничтожим их всех или погибнем."
 tenet_willing_embrace_desc:0 "Ввергнуть другую душу в вечное проклятие - дело непростое. Потенциальный кандидат #TOOLTIP:game_concept_Embrace_desc #L объятий#!#! должен прекрасно понимать, на что он соглашается."
 tenet_ashen_faith_desc:0 "Большинство вампирских Путей - это в основном философия, привязанная только к себе. Но эта вера не такова, вы несете спасение всем #TOOLTIP:game_concept_cainite_desc #L каинитам#!#!, и слово должно быть распространено."
 wyrm_tainted_doctrine_desc:0 "Многие #TOOLTIP:glossary_fera_tt #L фера#!#!, почитающие Гею, обладают даром, позволяющим им чувствовать, как на других накладывает порчу #TOOLTIP:glossary_wyrm_tt #L Вирм#!#!. Дороги и пути просвещения многих вампиров считаются настолько порочными, что последователи этих верований по своей сути считаются запятнанными Вирмом."
 doctrine_fae_morality_seelie_desc:0 "Хотя чужаки и даже неопытные китэйн часто считают двор «хорошим», на самом деле Благой двор определяется добродетелями чести и любви. Хотя это, казалось бы, соответствует представлениям о «хорошем», рыцарское может противоречить морали современного мира, а представления фей о придворной любви порой значительно отличаются от реальности, с которой сталкиваются смертные. Во многом Благой кодекс уходит корнями в боевые традиции.\n\nДо #TOOLTIP:game_concept_shattering_desc #L Раскола#!#! Благие дворы правили от Белтайна до Самайна, в течение весны и лета. Благой кодекс гласит: смерть прежде бесчестья, любовь побеждает все, красота - это жизнь, никогда не забывайте о долге."
 doctrine_fae_morality_unseelie_desc:0 "Многие феи считают Неблагой двор злом, но это слишком простое описание. Неблагие принимают перемены и презирают традиции, не видя особой связи со своим прошлым или, более того, с [UmbraGlossaryLocalized('dreaming','Грёзами')], которые, кажется, становятся все более и более далекими. Путь Неблагих - страстный и прагматичный, удовлетворяющий и желания, и потребности; Неблагие ни в чем себе не отказывают.\n\nДо #TOOLTIP:game_concept_shattering_desc #L Раскола#!#! Неблагие дворы правили от Самайна до Белтайна, в течение осени и зимы. Неблагой кодекс гласит: Перемены - благо, гламур - свобода, честь - ложь, а страсть превыше долга."
 special_doctrine_wyrm_to_unseelie_hostility_desc:0 "Договоры #TOOLTIP:glossary_wyrm_tt #L Вирма#!#! и Неблагих"
 special_doctrine_unseelie_to_wyrm_hostility_desc:0 "Договоры Неблагих и #TOOLTIP:glossary_wyrm_tt #L Вирма#!#!"
 tenet_amakusa_rite_desc:0 "Благодаря смешиванию #TOOLTIP:game_concept_vitae_desc #L витэ#!#! в общей чаше и соблюдению надлежащих обрядов и уважения, отвары, разрушающие угнетение и уравнивающие всех под покровом ночи, могут освободить Кровавое племя, ибо их вечная революция может продолжаться, не опасаясь уз крови и не испытывая недостатка в средствах для этого."
 special_doctrine_unproven_dharma_desc:0 "Не все #TOOLTIP:podgloss.dharma #L дхармы#!#! ведут к #TOOLTIP:podgloss.hundredclouds #L Сотне облаков#!#!. Для тех, у кого никогда не было зафиксированного вознесения, страх оказаться в тупике всегда вызывает беспокойство."
 tenet_fera_innovative_desc:0 "Технологический прогресс - самое важное преимущество, которое может быть у каждого. В то время как большинство гару в лучшем случае скептически относятся к инновациям, некоторые последователи #TOOLTIP:glossary_weaver_tt #L Ткачихи#!#! открыто продвигают инновации не только для собственного внедрения, но и для человечества в целом."
 tenet_soldiers_of_the_wyrm_desc:0 "Мы воины #TOOLTIP:glossary_wyrm_tt #L Вирма#!#!, а не его ничтожные слуги. Наша слава будет замечена, наша вера вознаграждена."
 tenet_centipede_embrace_desc:0 "#TOOLTIP:glossary_wyrm_tt #L Многоножка#!#! будет расти бесконечно, питаясь самой землёй."
 tenet_wyrm_seekers_desc:0 "#TOOLTIP:glossary_wyrm_tt #L Вирм#!#! хранит много знаний и силы, нужно просто найти его."
 tenet_hypnotic_serpent_desc:0 "#TOOLTIP:glossary_wyrm_tt #L Кахлаш#!#! взывает к нам, и мы отвечаем. Скоро другие тоже научатся."
 tenet_gaia_memory_desc:0 "Нашим призванием всегда было хранить память о Гее. Наш долг - направлять другие Меняющиеся породы и знакомить их с долгой историей #TOOLTIP:glossary_fera_tt #L фера#!#! и задачами, которые поставила перед нами Гея."
 tenet_sun_blessed_desc:0 "Целестин Гелиос одарил своей благосклонностью только два вида #TOOLTIP:glossary_fera_tt #L фера#!#! - [GetTrait('mokole').GetName(GetNullCharacter)|l] и #TOOLTIP:GAME_TRAIT,corax,[GetNullCharacter] #L кораксов#!#!.\nСолнечное тепло бодрит тело и успокаивает душу. Солнце - это чудесное тело, подобное величественному отцу."
 doctrine_fera_triat_alignment_balanced_desc:0 "Хотя #TOOLTIP:glossary_triat_tt #L Триада#!#! больше не находится в равновесии, многие #TOOLTIP:glossary_fera_tt #L фера#!#! всё ещё верят в старый порядок."
 doctrine_fera_triat_alignment_wyld_desc:0 "Из-за угрозы, исходящей от #TOOLTIP:glossary_wyrm_tt #L Вирма#!#! и #TOOLTIP:glossary_weaver_tt #L Ткачихи#!#!, большинство #TOOLTIP:glossary_fera_tt #L фера#!#! почитают #TOOLTIP:glossary_wyld_tt #L Вильда#!#! выше других членов #TOOLTIP:glossary_triat_tt #L Триады#!#!, видя, что он и Гея нуждаются в защите."
 doctrine_fera_triat_alignment_weaver_desc:0 "Пока существует человечество, процветание #TOOLTIP:glossary_weaver_tt #L Ткачихи#!#! никогда не прекратится."
 doctrine_fera_triat_alignment_wyrm_desc:0 "Подобно своему павшему хозяину, слуги #TOOLTIP:glossary_wyrm_tt #L Вирма#!#! стремятся только к хаосу и разрушению."
 doctrine_fera_triat_alignment_triatic_wyrm_desc:0 "#TOOLTIP:glossary_wyrm_tt #L Триадический Вирм#!#! является насмешкой над оригинальной #TOOLTIP:glossary_triat_tt #L Триадой#!#!. Три головы Вирма наделяют своих ближайших слуг великой нечестивой силой."
 doctrine_fera_werewolf_dark_litany_desc:0 "Тёмная литания - это Литания #TOOLTIP:glossary_wyrm_tt #L Вирма#!#!, которой следуют Танцоры Чёрной спирали. Служите Воле Вирма. Уважайте силу могущественных. Всё, что не запрещено, разрешено. Потакайте своим желаниям. Несмотря на то, что Чёрная спираль воспринимается как племя беззаконного хаоса, их Литания зачастую соблюдается более строго, чем среди нации Гару."
 doctrine_fera_wyrm_pact_desc:0 "По какой-то причине приверженцы этой конфессии в некоторой степени терпимо относятся к последователям #TOOLTIP:glossary_wyrm_tt #L Вирма#!#!. Верно ли обратное, зависит от прихотей другой стороны. В конце концов, в спирали не так уж много места для танцев."
 doctrine_fera_beast_courts_desc:0 "Среди #TOOLTIP:glossary_fera_tt #L фера#!#! межвидовые союзы редки. Наиболее заметным исключением являются Звериные дворы, поклявшиеся защищать Изумрудную мать (Гею). При дворах существует общество, похожее на имперские культуры мифической Азии, в котором есть регенты, придворные и простолюдины. Любой хенгейокай (#TOOLTIP:glossary_fera_tt #L фера#!#!) может свободно присоединиться к Звериным дворам, при условии, что он поклянётся следовать общественной системе чести и известности, известной как Путь Изумрудной добродетели."
 mu_religion_desc:0 "Дворы Му - это группы сянь, которые покорились #TOOLTIP:podgloss.yamaking #L повелителям Яма#!#! в #TOOLTIP:game_concept_fourth_age_desc #L Четвёртой эпохе#!#!, поскольку не видели выхода из дилеммы, которую они сами на себя навлекли, нарушив Мандат небес. Эти два двора не являются союзниками друг друга, но оба враждуют с другими дворами сянь."
 daityas_desc:0 "Дайтья - это двор сянь, который заключил союз с #TOOLTIP:podgloss.yamaking #L повелителями Яма#!#! в #TOOLTIP:game_concept_fourth_age_desc #L Четвёртой эпохе#!#!, но с тех пор отвернулся от них. Вскоре после того, как они поклялись в верности #TOOLTIP:podgloss.yamaking #L повелителям Яма#!#!, общество дайтья поняло, что демоны будут лишь развращать их и питаться их жизненной энергией, и вышло из союза. Благодаря собственным темным чарам они тоже придумали, как сохранить свое тело и избежать падения в небытие, как это сделали другие сянь.\nДайтья работают над тем, чтобы способствовать наступлению #TOOLTIP:game_concept_sixth_age_desc #L Шестой эпохи#!#!; чтобы наступило время, когда #TOOLTIP:podgloss.augustpersonageofjade #L Нефритовый император#!#! будет изгнан из своего Небесного двора, а драконы и фениксы будут воевать друг с другом в кровавом зареве. Пропагандируя отсутствие веры, они стремятся ослабить стену, воздвигнутую Императором, и таким образом занять свое законное место в Небесном дворе.\nХотя в глазах других сянь они заблуждаются, их нельзя искупить. Если бы они захотели, то смогли бы вернуться на правильный путь и помочь сянь избежать Эпохи печали."
 kura_sau_desc:0 "Кюра-сау - общество развращенных сянь. Их также называют Гоу-чжан, это общество тех сянь, которые покорились #TOOLTIP:podgloss.yamaking #L повелителям Яма#!#! и считаются частью двора Му. Благодаря этому они могут путешествовать в [UmbraGlossary('yomi_wan')], не подвергаясь проклятию Нефритового императора. Кроме того, у них есть собственная ветвь У Тан, известная как Хак Тао, - мерзкое искусство, позволяющее им нести в мир запятнанную ци Тысячи преисподен.\nОни стремятся выполнить планы своих темных хозяев, приближая #TOOLTIP:game_concept_sixth_age_desc #L Шестую эпоху#!#! и развращая большую часть Поднебесной. Большинство из них являются темными отражениями изначальных сянь, а некоторые отвечают даже на молитвы, но при условии, что они связаны с кровопролитием и удовлетворением темных желаний. Некоторые утверждают, что кюра-сау даже ответственны за развращение некоторых драконов и фениксов, соблазняя их обещаниями власти, которую могут дать только повелители Яма."
 shu_shen_desc:0 "Шу-шэнь - представители распущенного общества Шинма. Нечестивые боги, не приемлющие концепцию равновесия и стремящиеся к крайностям плотских утех и насилия. Они грабят, разбойничают, убивают и вообще повсеместно портят репутацию доброжелательных сянь. Они являются наёмниками и телохранителями более могущественных шэнь, которые могут заплатить за них цену, включая [GetTrait('kueijin').GetName( GetNullCharacter )|l] или даже кин-дзин. У них могут быть союзники среди вампиров или даже слуг #TOOLTIP:podgloss.yamaking #L повелителей Яма#!#!."
 li_shen_desc:0 "Называемые также традиционалистами, Церемониальными богами или просто Фу, Ли-шэнь придерживаются конфуцианских ценностей. Они верят в #TOOLTIP:game_concept_tao_te_hsien_desc #L Дао-тэ сянь#!#!, но делают акцент на упорядоченности природы и ее поддержании, а не на просветлении себя. Защита природы для них превыше всего, и их численность почти полностью состоит из камуи. Некогда самые могущественные из дворов, Церемониальные боги утратили связь с другими шэнь и слишком часто смотрят на них сквозь пальцы. Из-за этих предрассудков, а также из-за междоусобных распрей между министерствами, Фу уже не справляются со своей работой так хорошо, как могли бы."
 xian_mo_desc:0 "Также называемые Тихими или Бессмертными магическими духами, Сянь-мо - мистики и сильные верующие в #TOOLTIP:game_concept_tao_te_hsien_desc #L Дао-тэ сянь#!#!. Они верят, что просветленные личности могут создать совершенный мир и обратить вспять поворот веков. Упор на индивидуальность заставляет их сопротивляться порядку; они даже отказываются считать себя придворными. Сянь-мо - это имя, которое дали им другие сянь.\nОднако Тихие дают шинма надежду, от которой большинство отказалось в конце #TOOLTIP:game_concept_fourth_age_desc #L Четвёртой эпохи#!#!, когда Барьер закрыл им доступ в [Concept('spirit_world', 'мир духов')|E]. Хануман принёс #TOOLTIP:game_concept_tao_te_hsien_desc #L Дао-тэ сянь#!#! мудрецу Комуко в Ди Фу. Комуко покинул свой пост и удалился в горы. В конце концов их учение привело к созданию писаний, которые теперь называются #TOOLTIP:game_concept_tao_te_hsien_desc #L Дао-тэ сянь#!#!, или «Путь неизмеримой силы сянь». Его ярые последователи теперь составляют сянь-мо, а их учение привело к тому, что некоторые из них перешли за Барьер."
 xian_mun_desc:0 "Сянь-мун, также называемые Обществом бессмертных или мирскими, - это шинма, которые либо отвергают свою истинную сущность, либо больше озабочены своей смертной жизнью. Некоторые из них могут даже использовать свои силы для продвижения других целей. Лучшие из мирских считают, что можно следовать #TOOLTIP:game_concept_tao_te_hsien_desc #L Дао-тэ сянь#!#! за пределами традиционного общества сянь, в то время как худшие мало заботятся об этом.\nОбщество бессмертных считает членов других дворов заблуждающимися глупцами. Отдельные люди оказывают знаки внимания (с небольшим количеством денег и нефрита) местным министерствам и сильным мира сего, лишь бы их оставили в покое. Они склонны организовывать себя по разным моделям, будь то семьи, корпорации или другие человеческие институты."
 gaia_religion_desc:0 "Гея - больше, чем целестин, и один из самых могущественных духов, известных на сегодняшний день, возможно, первый и самый могущественный. Ей приписывают создание гару и большинства #TOOLTIP:glossary_fera_tt #L фера#!#!, чтобы они служили ее воинами и агентами как в материальном, так и в [Concept('spirit_world', 'мире духов')|E]."
 blackfury_religion_desc:0 "Матриархи гару ближе всего к #TOOLTIP:glossary_wyld_tt #L Вильду#!#!, чем большинство других племён, и известны своей честью, мудростью, гордостью и яростным мастерством в бою.\nФурии почитают Вильда как силу женственности, инстинкта, а не интеллектуальных абстракций #TOOLTIP:glossary_weaver_tt #L Ткачихи#!#! (которую в племени считают мужественной). Вильд - это сила, которая поддерживает циклы Геи и Луны и дополняет их."
 blackfury_desc:0 "Матриархи гару ближе всего к #TOOLTIP:glossary_wyld_tt #L Вильду#!#!, чем большинство других племён, и известны своей честью, мудростью, гордостью и яростным мастерством в бою.\nФурии почитают Вильда как силу женственности, инстинкта, а не интеллектуальных абстракций #TOOLTIP:glossary_weaver_tt #L Ткачихи#!#! (которую в племени считают мужественной). Вильд - это сила, которая поддерживает циклы Геи и Луны и дополняет их."
 amazonsofdiana_desc:0 "Группа Чёрных фурий, которые больше стремятся быть дерзкими, неудержимыми женщинами-воинами, чем священными мстителями. Этот лагерь редко рассматривается как официальная группа, и является скорее общим местом для тех, кто больше стремится доказать, что они равны любому мужчине в бою с #TOOLTIP:glossary_wyrm_tt #L Вирмом#!#!. Некоторые в лагере считают необходимым вернуть фурий в будущее и отказаться от их бессмысленной и архаичной практики преследования преступников, но гару, которые просто ненавидят всех мужчин, тяготеют к амазонкам."
 bacchantes_desc:0 "Консервативная фракция, преследующая изначальную священную цель Черных фурий - мстить за зло, причиненное женщинам и детям, с фанатичным рвением и безжалостной жестокостью. Они верят, что таким образом борются с властью #TOOLTIP:glossary_wyrm_tt #L Вирма#!#! над человечеством и мстят за саму Гею."
 freebooters_desc:0 "Задача флибустьеров - найти новые места #TOOLTIP:glossary_wyld_tt #L Вильда#!#!, которые можно посвятить Гее и открыть как каэрны. Куклос сокращается, потому что в мире осталось так мало мест Вильда. Часть флибустьеров считает, что им нужно найти новое тело для Геи в других местах [Concept('umbra', 'Умбры')|E], там, где #TOOLTIP:glossary_wyrm_tt #L Вирм#!#! еще не нашел."
 moondaughter_desc:0 "Культ, стремящийся распространить поклонение Гее через язычество. Несмотря на приверженность традициям, они стремятся сохранить дух Геи через изменения, воплощая силу #TOOLTIP:glossary_wyld_tt #L Вильда#!#! как можно лучше. Их ритуальные методы в основном включают в себя старую магию, передаваемую и изменяемую из поколения в поколение."
 childrenoffamine_desc:0 "Голод вполне может быть образом жизни средневековых бедняков - но Дети Голода делают все возможное, чтобы облегчить эту проблему. Известно, что во время голода они промышляют браконьерством на королевских землях или воруют зерно из монастырских амбаров. Гея никогда не хотела, чтобы ее дети голодали, а если голод и случается, то по вине #TOOLTIP:glossary_wyrm_tt #L Вирма#!#!. Если на землю обрушивается засуха или моровая язва, Дети, как правило, ищут виноватого."
 childofgaia_religion_desc:0 "Миротворцы гару, Дети добиваются взаимопонимания между племенами и надеются в конце концов объединить все племена в единый фронт против #TOOLTIP:glossary_wyrm_tt #L Вирма#!#!."
 childofgaia_desc:0 "Миротворцы гару, Дети добиваются взаимопонимания между племенами и надеются в конце концов объединить все племена в единый фронт против #TOOLTIP:glossary_wyrm_tt #L Вирма#!#!."
 anointedones_desc:0 "Миротворцы Гару, Дети работают над взаимопониманием между племенами и надеются в конце концов объединить все племена в единый фронт против #TOOLTIP:glossary_wyrm_tt #L Вирма#!#!. Этот лагерь отказался от насилия во всех его формах. Они не поднимут руку, чтобы ударить другое существо, и постоянно находят новые способы освободиться от ярости, чтобы сохранить этот контроль. Помазанникам трудно существовать в эти времена, но они выживают."
 angelsofgaia_desc:0 "Этот лагерь Детей Геи охраняет, защищает и спасает человеческих детей от #TOOLTIP:glossary_wyrm_tt #L скверны Вирма#!#!. Особенно они заботятся о тех детях, чьи семьи погибли от войны или болезни, а также о тех, кого бросили родители."
 childrenofdire_desc:0 "Состоящий преимущественно из люпусов-гару, этот лагерь следит за эманациями сил #TOOLTIP:glossary_wyrm_tt #L Вирма#!#! по их влиянию на #TOOLTIP:glossary_wyld_tt #L Вильда#!#!. Отмечая изменения в потоке хищников и жертв, а также рост или упадок флоры в местах обитания Вильда, они могут обнаружить влияние Вирма до того, как оно станет сильным. Посторонние часто относятся к лагерю с подозрением, потому что они редко остаются привязанными к одной пещере надолго."
 mothersfundamentalists_desc:0 "Этот лагерь фианна хочет вернуть Владычество - уничтожение человеческой популяции, практиковавшееся гару в доисторические времена. Они винят бесконтрольное распространение человечества в безумии #TOOLTIP:glossary_weaver_tt #L Ткачихи#!#! и #TOOLTIP:glossary_wyrm_tt #L Вирма#!#! и медленной гибели Геи."
 handoftyr_desc:0 "Длань Тюра состоит из отпрысков, которые посвятили свое внимание борьбе с влиянием #TOOLTIP:glossary_wyrm_tt #L Вирма#!#! на человечество. Они борются с насильниками, растлителями детей, террористами и жестокими преступниками."
 mjlolnirsthunder_desc:0 "Этот древний лагерь состоит из тех, кто потерял (или оборвал) все связи с окружающим миром и посвятил себя исключительно уничтожению #TOOLTIP:glossary_wyrm_tt #L Вирма#!#!. Им нет дела ни до чего другого: ни до людей, ни до волков, ни до духов, ни до Вуали, ни даже до общества гару в целом. Они - чудовища, которыми другие племена иногда представляют себе всех фенриров, променявших все крупицы сострадания, сочувствия и здравого смысла на единодушную, социопатическую преданность делу уничтожения Вирма."
 gloriousfistofwotan_desc:0 "Славный кулак Вотана считает, что только уничтожение человечества может спасти Гею. Люди стали величайшим переносчиком, через который распространяется #TOOLTIP:glossary_wyrm_tt #L Вирм#!#!, поэтому, чтобы обуздать его, они должны быть перебиты."
 bringersoflight_desc:0 "Приносящие свет стремятся обрести внутреннюю силу, постоянно испытывая себя на прочность. Снова и снова они ищут искушения #TOOLTIP:glossary_wyrm_tt #L Вирма#!#!, взаимодействуя с вампирами, Танцорами Черной спирали, фоморами и другими созданиями Вирма. Хотя многие пали, пытаясь принять догматы этого лагеря, Несущие верят, что самые сильные (и действительно достойные) не поддаются тьме, они ее преодолевают. Конечно, многие падают; путь, который они выбирают, весьма опасен, и они рискуют погибнуть как от рук окружающих, так и от прикосновения Вирма."
 harbingers_desc:0 "Это были первые гару, которые всерьез восприняли Пророчество Феникса, или так говорят некоторые. Они разделились и отправились странствовать по миру в поисках знамений #TOOLTIP:glossary_wyrm_tt #L Вирма#!#! и принесли слово обратно. Они до сих пор не закончили рассказывать гару обо всех найденных ими знамениях Вирма. Самое главное - они несут надежду. Они - одни из самых мудрых среди гару, так что лучше прыгать, когда они скажут."
 sacredthread_desc:0 "Члены этого лагеря полагают, что нацеленность нации Гару на оборотней станет их гибелью и что только сражаясь с #TOOLTIP:glossary_wyrm_tt #L Вирмом#!#! там, где он живет - в сердцах и умах людей, - можно по-настоящему выиграть войну. Священная нить путешествует в самые темные сердца людей и выступает в роли учителей, советников и наставников для тех, кого они там находят, предлагая различные виды образования, чтобы помочь укрепить человеческий дух."
 bubasti_desc:0 "Известные также как Сумеречные коты, они являются оборотнями-котами из Египта. Мистики кошачьего рода, они - застенчивая и скрытная раса. Когда-то давно бубасти были прокляты древним вампирским божеством Сетом, и в результате их жизнь навсегда связана с почвами Кхема, их прародины. Говорят, что если все бубасти одного поколения покинут Египет, то это поколение станет последним. Никто не знает правдивости этого слуха, но и проверять его никто не желает.\nИз-за войны с Сетом они тесно связаны с #TOOLTIP:glossary_osirian_league_tt #L Осирианской лигой#!#! Гора, а шесть их вождей, кхеперы, обрели бессмертие."
 swara_desc:0 "Оборотней-гепардов из племён бастет также называют Серебряным народом. Как и их сородичи, они чрезвычайно быстры и много путешествуют. У них также есть уникальная связь с [Concept('umbra', 'Умброй')|E]. Из всех племён бастет свара наименее понятны. Это результат их очень изолированной культуры. Свара - единственное племя бастет, способное ходить боком, что позволяет им путешествовать по измерениям внутри [Concept('umbra', 'Умбры')|E], недоступным их собратьям. Некоторые предполагают, что это результат их тесной связи с Луной, которую большинство свара почитают. Некоторые легенды утверждают, что именно свара впервые посетили Луну во времена Владычества, и именно благодаря этому они узнали о смысле и важности войны с #TOOLTIP:glossary_wyrm_tt #L Вирмом#!#! и о том, насколько тяжела сложившаяся ситуация."
 saurian_religion_desc:0 "Моколе - это оборотни-ящеры, крокодилы, завры и драконы. Они являются потомками доисторических королей-ящеров, перворождённых #TOOLTIP:glossary_fera_tt #L фера#!#! и избранных детей Гелиоса. Их роль - хранить воспоминания о Гее, и эту задачу они выполняют с помощью своего Мнезиса. С помощью Мнезиса моколе может перенестись в прошлое на тысячи и миллионы лет и углубиться в воспоминания своих предков."
 warriors_entoban_desc:0 "Энтобан, африканский континент-ковчег, родина человечества, также является родиной самого древнего течения моколе. Называемые воинами Драконьего племени, они постоянно подвергались нападениям в Войнах Гнева; их крайняя ненависть к гару является простым отражением плохого обращения с ними самих гару. Теперь они взялись за защиту Энтобана и других оставшихся там представителей пород #TOOLTIP:glossary_fera_tt #L фера#!#!. Преступления гару будут отомщены, и моколе никогда этого не забудут."
 dragons_zhong_guo_desc:0 "Чжун-лун, драконы востока, и старейшие из хенгейокай - мудрецы, учёные и воины Звериных дворов. Наряду с Изумрудной матерью (Геей) и Солнцем они почитают Уани, своих предков-драконов.\n\nКак и Макара, они верят в равновесие, высший принцип, управляющий всей вселенной. Баланс инь и ян, света и тьмы, #TOOLTIP:glossary_wyld_tt #L Упорядочивателя#!#!, #TOOLTIP:glossary_weaver_tt #L Художницы#!#! и #TOOLTIP:glossary_wyrm_tt #L Расплетателя#!#! важнее, чем присущие #TOOLTIP:glossary_triat_tt #L Троице#!#! доброта или порочность."
 emerald_memory_desc:0 "При Звериных дворах обитает много моколе, отличных от чжун-лун. Драконы играют очень важную роль при дворах; Макара и Гумаган, напротив, служат предназначению своей породы, являясь памятью о Гее. Изумрудная память хранит и документирует историю Звериных дворов и #TOOLTIP:glossary_fera_tt #L фера#!#! по мере того, как Колесо веков продолжает вращаться. Они также служат советниками при дворах, чтобы ошибки прошлого не повторились, по крайней мере, они на это надеются."
 eternal_breath_desc:0 "Приверженцы Вечного дыхания верят, что только моколе выживут до тех пор, пока мир не перестанет существовать. Ни #TOOLTIP:GAME_TRAIT,vampire,[GetNullCharacter] #L;bold кровавые дьяволы#!#!, ни другие #TOOLTIP:glossary_fera_tt #L фера#!#!, и в особенности #TOOLTIP:GAME_TRAIT,mortal,[GetNullCharacter] #L;bold гордые обезьяны#!#!. Звериные дворы потерпят неудачу, другие Меняющиеся породы доказали, что они никогда не извлекут уроков из прошлого. Только благодаря мастерству владения собственным телом и духом моколе переживут всех. Они уже пережили один Апокалипсис, они переживут и другой."
 shadowinquisition_desc:0 "Теневая инквизиция - это тайный поход, организованный католической церковью в эпоху Темного Средневековья. В отличие от папской инквизиции, которая направлена против еретиков, Теневая инквизиция нацелена на вампиров, оборотней, магов и других «слуг Сатаны», которых нужно либо уничтожить, либо спасти. Ее существование будет недолгим, но ее успехи навсегда изменят #TOOLTIP:game_concept_cainite_desc #L каинитский#!#! мир."
 resplendentcranes_religion_desc:0 "Путь Блистательного Журавля - это в высшей степени легалистское собрание школ, призванных повернуть вспять #TOOLTIP:podgloss.wheelofages #L Колесо веков#!#! и восстановить добродетель."
 thrashingdragons_religion_desc:0 "Часто неправильно понимаемая #TOOLTIP:podgloss.dharma #L дхарма#!#! Бьющегося Дракона признает, что они мертвы, но стремится достичь просветления, подражая живым и взаимодействуя с ними. Несмотря на ошеломленное недоверие некоторых Блистательных журавлей, они являются полностью признанной #TOOLTIP:podgloss.dharma #L дхармой#!#!, даже если кажется, что они прогрызают и прокладывают себе путь через нежизнь."
 faceofthegods_desc:0 "Возможно, самая крайняя ересь, «Небесное племя» утверждает, что #TOOLTIP:game_concept_kuei_jin_desc #L Ван-куэй#!#! - изгнанные боги, потомки заблудшей Ситы из индийских мифов. Они создают свои собственные культы с поклонниками и извлекают ци из молитв..."
 faceofthegoddess_desc:0 "Разновидность Небесного племени, эта #TOOLTIP:podgloss.dharma #L дхарма#!#! утверждает, что когда-то они были людьми, а затем были избраны Шакти для реинкарнации в переходной стадии между их прошлой смертностью и будущей божественностью."
 flameoftherisingphoenix_desc:0 "#TOOLTIP:podgloss.dharma #L Дхарма#!#! Пламени восходящего феникса считает, что цель Второго дыхания - возмещение преступлений, совершенных в течение жизни. Они часто живут среди своих смертных родственников, защищая и помогая им процветать, насколько это возможно."
 thegreatclans_desc:0 "Великие кланы - исконный институт японских островов. По сути, они представляют собой расширенную семейную сеть, в которой Голодные мертвецы следят и защищают интересы своих потомков. В некоторых вассальных семьях Великих кланов смертные потомки даже осведомлены о планах своих предков.\nСтаршие из Великих кланов уходят корнями в эпоху Дзёмон, но их наиболее глубокая трансформация произошла после прибытия индийских и китайских #TOOLTIP:podgloss.dharma #L дхарм#!#! в VI веке н.э."
 spiritlivingearth_desc:0 "Опираясь на различные синтоистские и анимистические традиции, эта #TOOLTIP:podgloss.dharma #L дхарма#!#! интроспективна и ориентирована на взаимодействие в основном с духовным миром. Тот факт, что они считают демонов и злых духов подходящими наставниками, заклеймил их как еретиков в глазах основных дворов."
 fishhooks_desc:0 "Крюки изучают, допрашивают, обманывают и пытают [Concept('akuma', 'акума')|E]. Таким образом они пытаются понять #TOOLTIP:podgloss.yamaking #L повелителей Яма#!#! и проклятие, не рискуя собственной душой. Они сделают или скажут все, чтобы получить информацию от [Concept('akuma', 'акума')|E]."
 thousand_embers_righteousness_societies_desc:0 "Социальное ядро Тигров-дьяволов, общества - это небольшие группы, которые работают, тренируются и просвещаются вместе. Однако в конечном итоге цель каждого общества - отвлечь внимание #TOOLTIP:podgloss.demonemperor #L Императора демонов#!#!, создать партизанскую ячейку, который разожжет смертное общество, чтобы помешать процветанию #TOOLTIP:podgloss.yamaking #L повелителей Яма#!#!."
 searing_wind_desc:0 "Следуя своему Великому #TOOLTIP:podgloss.arhat #L архату#!#! Хон Ли, эти тигры-дьяволы отказываются от структуры Дворов. Вместо этого они готовятся к финальной битве с #TOOLTIP:podgloss.demonemperor #L Императором демонов#!#! и готовы сжечь весь мир, чтобы добиться победы, если потребуется."
 electric_money_desc:0 "«Инвестиционный банк» тигров-дьяволов - это общество, призванное бороться с #TOOLTIP:podgloss.yamaking #L повелителями Яма#!#! на поле экономической битвы. Они готовы обрушить целые экономики, если демоны Йоми потеряют при этом важные активы."
 shan_bo_heresy_desc:0 "Философ тигров-дьяволов, Шань-бо, выдвинул радикальную идею о том, что #TOOLTIP:podgloss.augustpersonageofjade #L Нефритовый император#!#!, возможно, совершил ошибку, изгнав #TOOLTIP:game_concept_kuei_jin_desc #L куэй-дзин#!#!, и позорно удалился из мира, осознав это. Шань-бо никогда не отступал от своего видения, несмотря на многочисленные порицания со стороны дворов, и его немногочисленные, но преданные последователи сохранились до сих пор."
 shining_ice_guardians_desc:0 "Являясь главной ветвью #TOOLTIP:podgloss.dharma #L дхармы#!#! Блистательных журавлей, стражи гордятся своим строгим следованием Пути Восьми лотосов."
 liberators_of_the_wheel_desc:0 "Незаконная секта, верящая, что #TOOLTIP:podgloss.wheelofages #L Колесо эпох#!#! вращается из-за государств за пределами Срединного царства, которые слишком погрязли в грехе, чтобы заслужить искупление. Исходя из этого они используют акты устрашения, чтобы дестабилизировать мир за пределами Поднебесной."
 laughing_rainbows_desc:0 "Умеренные Бьющиеся драконы, это ортодоксальный взгляд на эту #TOOLTIP:podgloss.dharma #L дхарму#!#!, который ищет компромисс между поиском нового опыта и созерцанием прошлого."
 return_to_power_desc:0 "Эта школа, основанная Бьющимся драконом Кан Чо-лу, считает, что Ван Куэй должны захватить трон смертных и править ими как благосклонные боги, как это было до их падения. Только тогда они получат прощение от #TOOLTIP:podgloss.augustpersonageofjade #L Нефритового императора#!#!."
 the_thousand_faced_thunders_desc:0 "Секта, посвященная #TOOLTIP:game_concept_yang_world_desc #L миру Ян#!#!, особенно искусная в обращении с обитающими там духами. Они склонны внимательно следить за нововведениями смертных, чтобы предвидеть рождение новых духов."
 thousandhells_religion_desc:0 "#TOOLTIP:podgloss.dharma #L Дхарма#!#!, противостоящая Пятикратному пути. Ее последователи проповедуют союз с #TOOLTIP:podgloss.yamaking #L повелителями Яма#!#! и рассматривают свое новое состояние как способ служить Императору в качестве разрушителей."
 wayofthetenthousandscreams_desc:0 "#TOOLTIP:podgloss.dharma #L Дхарма#!#!, противостоящая Пятикратному пути. Ее последователи проповедуют союз с #TOOLTIP:podgloss.yamaking #L повелителями Яма#!#! и рассматривают свое новое состояние как способ служить Императору в качестве разрушителей."
 thousandhells_emma_o_desc:0 "Эмма-О, тёмный властелин #TOOLTIP:podgloss.kakuri #L Какури#!#!, является фаворитом в великой войне #TOOLTIP:podgloss.yamaking #L повелителей Яма#!#! за трон #TOOLTIP:podgloss.demonemperor #L Императора демонов#!#!.\nВоплощение аспекта Инь, Эмма-О - проницательная, расчетливая личность, лишённая милосердия. Обычно появляется в виде чрезвычайно высокого мужчины, носящего длинную бороду и, как правило, заросшего волосами, с кожей цвета обсидиана, одетого в одежду айнов, на которой изображены битвы, болезни и смерть. Его часто сопровождают его прекрасные слуги-#TOOLTIP:podgloss.shikome #L шикоме#!#!.\n\nЭмма-О - единственный действующий на данный момент #TOOLTIP:podgloss.yamaking #L повелитель Яма#!#!, который может похвастаться победой над одним из своих собратьев и поглощением его царства и власти, поскольку он является бывшим судьей равновесия Йен-Ло."
 thousandhells_mikaboshi_desc:0 "Микабоши, правитель #TOOLTIP:podgloss.wickedcity #L Злого города#!#!, - это #TOOLTIP:podgloss.yamaking #L повелитель Яма#!#!, который когда-то был японским ученым и архитектором. Несмотря на то, что он очень молод по сравнению со своими собратьями, его стремление к неустанным инновациям и созданию «машинного государства», которое превратит человечество в бездушную шелуху, делает его восходящей звездой по мере того, как цивилизации человечества расширяются все больше и больше."
 thousandhells_ravana_desc:0 "Равана когда-то был самым высокомерным и эгоистичным из всех #TOOLTIP:podgloss.yamaking #L повелителей Яма#!#!. Он искренне верил, что ни одно существо не может превзойти его в силе, интеллекте или жестокости. Это высокомерие сделало его очень опасным, но в то же время очень предсказуемым и привело к его падению.\nТеперь, когда он дремлет в разрушенном городе Ланка, кажется, что Раджа демонов упустил шанс стать #TOOLTIP:podgloss.demonemperor #L Императором демонов#!#!."
 thousandhells_rangda_desc:0 "Рангда - наименее высокомерная из #TOOLTIP:podgloss.yamaking #L повелителей Яма#!#!. Не надменная и не жадная, Рангда считает, что болезни и медленная смерть должны быть доступны всем, богатым и бедным, городским и сельским жителям.\nВ этом отношении она является самой эгалитарной из повелителей Яма. Она хочет только, чтобы все живые существа подпали под ее власть и умерли, претерпев как можно больше мучений."
 thousandhells_tou_mu_desc:0 "У #TOOLTIP:game_concept_kuei_jin_desc #L куэй-дзин#!#! есть грозный враг в [UmbraGlossaryLocalized('yomi_wan','аду Йоми')], более ужасный, чем любой другой, и зовут её Тоу Му.\nТоу Му - одна из самых злобных #TOOLTIP:podgloss.yamaking #L повелительниц Яма#!#!, и именно эта ненависть приблизила её к трону #TOOLTIP:podgloss.demonemperor #L Императора демонов#!#!. Железная императрица, безусловно, самая известная повелительница Яма, известная своей страстной ненавистью к сородичам Востока.\nВ то время как другие #TOOLTIP:podgloss.yamaking #L повелители Яма#!#! будут пытаться развратить и заманить их в ловушку, работа на Железную императрицу - это в лучшем случае отсрочка исполнения приговора."
 thousandhells_dokhor_khan_desc:0 "Дохор-хан - это #TOOLTIP:podgloss.yamaking #L повелитель Яма#!#! из #TOOLTIP:podgloss.hellspikedchains #L Ада шипастых цепей#!#!.\nПо состоянию на 1230 год, он является одним из самых могущественных #TOOLTIP:podgloss.yamaking #L повелителей Яма#!#! в округе, и его власть в степях практически неоспорима. Он питается агонией и ненавистью и известен своими смелыми, иногда безрассудными планами добиться господства над своими соперниками."
 thousandhells_wu_hua_desc:0 "Ву Хуа, владыка бездны Соли и Железа, - #TOOLTIP:podgloss.yamaking #L повелитель Яма#!#!. Хотя его ад и общая мощь меньше, чем у некоторых его соперников, он не лишен злобы.\nДоводя своих узников до изнеможения, Ву Хуа предлагает Железные бордели только как потенциальный путь к отступлению, о выборе которого многие в конечном итоге жалеют.\nОрганизационная структура Ву Хуа была разработана в соответствии с бюрократическими структурами раннего Китая. Послушные слуги вознаграждаются дарами и продвижением по службе. Непослушных лакеев наказывают и, в конце концов, уничтожают. Любое существо, продвинувшееся по этим запутанным ступеням, несомненно, является существом очень злобным и хитрым, и к нему следует относиться с осторожностью."
 thousandhells_the_wandering_overlord_desc:0 "Среди загадок Йоми Странствующий повелитель - одна из величайших, даже для других #TOOLTIP:podgloss.yamaking #L повелителей Яма#!#!. У него нет владений, у него нет слуг, и он чувствует себя как дома и в Йоми, и в Поднебесной.\nЦели Странствующего повелителя неизвестны. Иногда он помогает тем, кто в этом нуждается, без видимой причины. В других случаях он манипулирует событиями таким образом, что страдают тысячи людей. Он не дает никаких объяснений своим действиям, а другие повелители Яма, возможно, опасаясь реакции, никогда не просили об этом."
 thousandhells_haha_no_fukami_desc:0 "Хаха-но Фуками не была среди изначальных #TOOLTIP:podgloss.yamaking #L повелителей Яма#!#!, и некоторые сказали бы, что она все еще недостаточно осквернена, чтобы стоять среди них. Только ее власть над одной из Тысяч преисподен ставит ее в такую компанию.\nХаха-но Фуками была праматерью океана в конце Первой эпохи, и только когда #TOOLTIP:podgloss.augustpersonageofjade #L Нефритовый император#!#! попросил её стать карательницей за преступления против океанов и преступления с использованием огня или воды, её небесное положение укрепилось."
 thousandhells_honoyeta_desc:0 "Это полинезийское змеиное божество также известно среди балийцев как Басуки, а в Индии - как Калия или Нага Пахода. Хонойета - дух, олицетворяющий порочную энергию Ян, несущую смерть и болезни. Хонойета знает, что он никогда не взойдет на трон #TOOLTIP:podgloss.demonemperor #L Императора демонов#!#!, но его дружеские — некоторые говорят, льстивые — отношения с маэлджином Алиарой дают ему другие возможности.\nОнойета предпочитает ядовитых змей в качестве проводников своей власти и слуг."
 thousandhells_hine_nui_te_po_desc:0 "Эта обладающая аспектом Инь #TOOLTIP:podgloss.yamaking #L повелительница Яма#!#! - одна из самых слабых владык, правящих в Йоми. Она проявляется как облако тьмы и питается чувством отвращения к себе.\nДуши, впадающие в отчаяние и совершающие самоубийства на островах Тихого океана, погружаются в ее владения в ледяных морях. Ее редкие и фанатичные [Concept('akuma', 'акума')|E] в основном скрываются на дальних окраинах двора Алого Феникса."
 thousandhells_malaveyovo_desc:0 "Первоначально назначенный Небесами присматривать за душами тех, кто умер от голода, этот дьявол быстро отказался от своих обязанностей ради соблазна власти.\nОчередной из #TOOLTIP:podgloss.yamaking #L повелителей Яма#!#!, соперничающий за контроль над двором Алого феникса, Малавейово управляет небольшим владением в Йоми. Поражая своих последователей неутолимым голодом, он доводит их до каннибализма, который затем вознаграждает ощущениями эйфории и экстаза."
 thousandhells_grandmother_witch_desc:0 "Бабушка–ведьма - претендентка на трон #TOOLTIP:podgloss.demonemperor #L Императора демонов#!#! - возможно, даже серьезная, хотя мало кто еще знает о ней. У Бабушки-ведьмы есть теория об Эпохе скорби: это будет самая могущественная эпоха магии, которую когда-либо видели, хотя нынешний мир и не переживет эту форму магии. С этой целью она рассылает своих агентов по всему миру собирать проклятые артефакты, вербовать талантливых инферналистов и чернокнижников и подкреплять свои притязания на трон таким количеством запрещенного колдовства, какое только сможет найти."
 thousandhells_tou_shen_desc:0 "Лихорадочный ад - это небольшое владение Йоми, населённое теми, кто вызвал распространение оспы или извлек выгоду из этого. Многие души из этого ада были похищены Рангдой, поскольку она укрепляет свою роль #TOOLTIP:podgloss.yamaking #L повелительницы Яма#!#! болезней в целом."
 thousandhells_hluh_desc:0 "Название «Ад кипящего масла» является неправильным, так как это место наполнено не кипящим маслом, а скорее топленым человеческим жиром. Куски обугленного и тлеющего жира плавают в окружающем океане густого, пузырящегося жира. Местами на поверхности всплывает темно-серая пена из переваренной пенки.\n\n#TOOLTIP:podgloss.yamaking #L Повелитель Яма#!#! этого царства, пожалуй, наименее человечен из всех королей Ямы. Его зовут Хла, и считается, что это студенистое существо, напоминающее панцирную медузу размером с остров, с острыми зубами-присосками на концах каждого из щупалец.\nУчитывая природу выбранного им жилища, маловероятно, что это существо существует каким-либо образом, который смертный разум может легко (или с комфортом) понять."
 thousandhells_ku_of_the_thousand_tears_desc:0 "Фэн-ту - это ад Йоми, имитирующий вход в ад в буддийских мифах. Хотя главным правителем был Нефритовый император Юй Хуан, #TOOLTIP:podgloss.yamaking #L повелитель Яма#!#! Ку из Тысячи слёз также обосновался здесь, правя теми, кто умирает от политического инакомыслия."
 rf_kueijin_desc:0 "Дхарма - это путь к просветлению, позволяющий #TOOLTIP:game_concept_kuei_jin_desc #L Ван-сянь#!#! преодолеть свою звериную сущность и дающий надежду на просветление и восстановление кармического цикла."
 modernanarch_religion_desc:0 "Анархи - вампиры, отвергающие статус-кво #TOOLTIP:game_concept_cainite_desc #L каинитского#!#! общества."
 freeanarch_desc:0 "Эти #TOOLTIP:game_concept_cainite_desc #L каиниты#!#! никогда не склонятся ни перед какой властью, кроме той, которую они выбрали для себя сами, несмотря ни на что. Бастионы анархов часто бывают дикими и непокорными, но для многих молодых вампиров они являются маяком надежды и свободы. А для старших - нечто, что можно быстро сокрушить."
 camarilla_religion_desc:0 "Помимо того, что Камарилья препятствует растущим массам смертных узнать о существовании вампиров, она также стремится сохранить статус-кво в обществе сородичей; поэтому большая часть ее структуры и традиций отражает структуру и традиции #TOOLTIP:game_concept_cainite_desc #L каинитского#!#! общества в феодальной Европе в Темные века."
 sabbat_religion_desc:0 "Шабаш - это свободная организация #TOOLTIP:game_concept_cainite_desc #L каинитов#!#!, которые отвергают традиции. В отличие от Камарильи, Шабаш верит в #TOOLTIP:game_concept_antediluvian_desc #L допотопных#!#! и Каина. Также известны как «Меч Каина», так как верят, что станут армией, которую он использует для уничтожения #TOOLTIP:game_concept_antediluvian_desc #L допотопных#!#!, когда наступит Геенна."
 pathofhonorableaccord_desc:0 "Путь Соглашения Чести - это Путь Просветления, который позволяет обуздать Зверя через строгую практику благородного и рыцарского поведения.\n#TOOLTIP:game_concept_cainite_desc #L каиниты#!#! на Пути Соглашения Чести придают большое значение ритуалам и церемониям. Поэтому рыцари Шабаша всегда участвуют в военных праздниках, ритуалах, церемониях и других торжественных мероприятиях. В целом последователи Пути стремятся объединить разрозненные фракции секты под общим знаменем верности делу."
 faces_of_apophis_desc:0 "#TOOLTIP:glossary_wyrm_tt #L Апофис#!#! - источник всех бед мира, высшее воплощение Исфрет. С начала времён Апофис существует, оскверняя и разрушая догматы Маат. Это высший обманщик, всепоглощающая тьма и непрекращающаяся порча, от которого страдает весь мир."
 ten_mandates_of_heaven_desc:0 "Десять мандатов Неба - это правила и наставления для Ву Т'янь, установленные восемью Бессмертными под руководством #TOOLTIP:podgloss.augustpersonageofjade #L Нефритового императора#!#!. Каждый мандат одинаково важен, и у каждого бессмертного есть свой список приоритетов для следования им, в зависимости от его характера и личных достоинств."
 ten_mandates_of_hell_desc:0 "Ходили слухи, что #TOOLTIP:podgloss.yamaking #L повелители Яма#!#! создали собственных Бессмертных рабов, чтобы противостоять Небесной Семье."
 ordos_religion_desc:0 "Ордена были тайными культами Темных веков, члены которых набирались исключительно из числа вампиров #TOOLTIP:game_concept_Clan_desc #L клана#!#! Малкавиан. Ордена посвятили себя расшифровке техник заклинаний древних малкавианцев и раскрытию потенциала их безумия для победы над Зверем. Они были разделены по всему Старому Свету на небольшие культы, каждый из которых был независим и идентифицировался только по их методам."
 jocastian_desc:0 "Небольшая и малоизвестная секта (и, возможно, малкавианская линия крови), возникшая в Шабаше как ноддистский культ, но с тех пор ставшая независимой. Большинство иокастианцев - малкавиане, но в их рядах также есть Бруха и другие ученые сородичи. Они посвятили себя разгадке истинной истории #TOOLTIP:game_concept_cainite_desc #L каинитов#!#! и являются соперниками Мнемозины. Хотя некоторые ученые считают их линией крови из-за практики, согласно которой мастер позволяет ученику диаблеризировать себя, чтобы сохранить накопленные знания, они ничем не отличаются от своего родительского #TOOLTIP:game_concept_Clan_desc #L клана#!#!."
 mnemosyne_desc:0 "Мнемозины, или Искатели памяти, - культ ноддистов, состоящий из малкавианских ученых; некоторые предполагают, что Мнемозины - это линия крови малкавианцев. Самый известный член культа - Аристотель де Лоран. Члены культа стремятся узнать историю сородичей, и большинство из них следуют Пути Каина. Культ находится в конфликте с Иокастианцами и, до недавнего времени, со старейшиной Вентру Биндусарой. Члены культа практикуют форму #TOOLTIP:game_concept_diablerie_desc #L диаблери#!#!; когда старейшина считает, что его время пришло, он позволяет молодым сородичам его диаблеризировать, чтобы его знания могли быть переданы. Именно поэтому культ иногда называют линией крови. Культ назван в честь греческой музы памяти."
 daughtersofthesun_desc:0 "Доисламский малкавианский тайный культ, поклоняющийся трём #TOOLTIP:game_concept_cainite_desc #L каинитским#!#! «богиням». Они были изгнаны из Мекки и в основном скрывались под натиском победоносных мусульман #TOOLTIP:game_concept_ashirra_desc #L Аширры#!#!."
 raktasadhus_religion_desc:0 "У вампиров Индии есть общий враг - #TOOLTIP:game_concept_kuei_jin_desc #L Ван-куэй#!#!, поэтому они могут на время объединиться."
 raktasadhus_desc:0 "Вампиры Индии практикуют форму кровавого чародейства, называемую садхана. Несмотря на то, что среди индийских #TOOLTIP:game_concept_cainite_desc #L каинитов#!#! есть те, кто не практикует садхану, множественный термин ракта-садху иногда используется для коллективного обозначения всех индийских #TOOLTIP:game_concept_cainite_desc #L каинитов#!#!, в основном потому, что они до сих пор не оформили свою паутину эфемерных преданий в настоящую секту или двор. Впрочем, эти союзы могли бы вовсе не появиться, если бы не противодействие вампиров-катаянцев из Двора Бесконечных Громов на юге Индии и Двора Алого Феникса на востоке Индии."
 viayasaq_desc:0 "Тропа вампиров Степи, в частности #TOOLTIP:podgloss.anda #L Анда#!#!. Она напоминает многие традиции ясы (братства воинов) у монголов. Последователей Тропы Ясы народы запада прозвали варварами."
 pathofnoiad_desc:0 "Происхождение ноиадов было забыто как #TOOLTIP:game_concept_cainite_desc #L каинитами#!#!, так и смертными. По мнению ноиадов, они всегда обитали на севере, направляя и защищая племена саамов на севере Скандинавии. Ноиады считали себя божественными существами, посланными богами, чтобы направлять и защищать избранный ими народ от сверхъестественных и мирских угроз, а также толковать предзнаменования богов в гуовссаа. Отношения между ноидами и их племенем были в некотором роде симбиотическими: ноиады защищали племя от врагов и выступали для них в роли проводников, шаманов и учителей, а племя добровольно отдавало свою кровь и укрывало их в течение долгих месяцев без темноты. Во время голода ноиады превращали в #TOOLTIP:game_concept_ghoul_desc #E гулей#!#! членов племени, чтобы обеспечить свое выживание. Ноиады открыто жили среди саамов и принимали в свои объятия исключительно представителей этого племени. Избранные для #TOOLTIP:game_concept_Embrace_desc #L объятий#!#!, как правило, обладали талантом к прорицанию, а также толкованию снов и звезд. Ноиады также наблюдали за детьми, происходящими из семей, в которых был хотя бы один вампир, выискивая в них те черты, которые они предпочитали."
 viatantabus_desc:0 "Вампиры, которые следуют за всемогущей Бабой Ягой, ведьмой из России. Единственная из Носферату, бросившая вызов своему чудовищному прародителю, Бабушка вызывает в своем #TOOLTIP:game_concept_Clan_desc #L клане#!#! как восхищение, так и отвращение."
 roadofblood_religion_desc:0 "После проклятия, наложенного на них Баали, #TOOLTIP:game_concept_Clan_desc #L клан#!#! Ассамитов в основном следует по этой тропе разрушения и очищения с помощью #TOOLTIP:game_concept_diablerie_desc #L диаблери#!#!. Каждое убийство - лишь временная передышка от бесконечного голода."
 tariqelhaqim_desc:0 "Те, кто следует по Via Sanguinus, являются одними из самых опасных для своих собратьев-#TOOLTIP:game_concept_cainite_desc #L каинитов#!#!, поскольку акт #TOOLTIP:game_concept_diablerie_desc #L диаблери#!#! является почти ритуалом очищения среди Стражей. Действительно, один из главных догматов этого пути заключается в том, чтобы его последователи избавлялись от всех, кто недостоин крови Каина, и очищали линии крови."
 roadofbones_religion_desc:0 "Сородичи, пытающиеся понять смерть. В основном по пути следует #TOOLTIP:game_concept_Clan_desc #L клан#!#! Каппадокийцев."
 followersoflazarus_desc:0 "Последователи Лазаря, также называемые Инфиниторе, были каппадокийцами, которые по тем или иным причинам не откликнулись на призыв, приведший к Пиру невежества, и таким образом избежали уничтожения #TOOLTIP:game_concept_Clan_desc #L клана#!#!. Не зная, пощадят ли их, и чувствуя себя преданными своим основателем, они фактически отделились от основной массы #TOOLTIP:game_concept_Clan_desc #L клана#!#! Каппадокийцев. Лазарь неофициально считался лидером Инфиниторе."
 pathofthewheel_desc:0 "Представители этой тропы верят, что вампиры застряли вне цикла и должны двигаться дальше. Они ищут любые научные средства, чтобы заставить всех #TOOLTIP:game_concept_cainite_desc #L каинитов#!#! вернуться в цикл жизни."
 viacaeli_desc:0 "Согласно Евангелию от Лаодикии, священному тексту #TOOLTIP:game_concept_cainite_desc #L каинитов#!#!, принципы некоторых дорог Via Caeli берут начало от самого Каина. Хотя он и был проклят Богом, он также был ближе к Богу, чем любой другой сородич, который когда-либо существовал. Последователи Дороги Небес пытаются контролировать своего Зверя с помощью религиозной преданности."
 viadivinitatis_desc:0 "Фанатики ноддистов и предшественники Шабаша, последователи этой Тропы считают себя скорее благосклонными к Богу, чем проклятыми Им. Последователи Божественности стремятся к контролю над смертными и призывают как можно больше #TOOLTIP:game_concept_cainite_desc #L каинитов#!#! присоединиться к Via Caeli. Многие считают эту Тропу самой девиантной из четырёх."
 viapenaculum_desc:0 "Верующие, идущие по Тропе Покаяния, считают себя недостойными Бога, низшими из низших созданий в его глазах. Ни один путь не относится к актам раскаяния так серьезно, ибо это единственный способ, который видят эти #TOOLTIP:game_concept_cainite_desc #L каиниты#!#!, чтобы обрести просветление и благосклонность в глазах Бога."
 viavindicta_desc:0 "Эти сородичи считают себя гневной десницей Бога, уничтожающей тех, кто посмел оскорбить его. Любой, кто считается злым или неверным Богу, должен быть уничтожен. Они охотятся на #TOOLTIP:game_concept_cainite_desc #L каинитов#!#!, которых считают порочными."
 viadolorosa_desc:0 "Мученики Пути Слез, эти ноддисты приносят себя в жертву нежити, чтобы другие не страдали. Они охотно жертвуют собой, чтобы остановить разложение, вызванное всем, что считается нечестивым, особенно демонами или другими #TOOLTIP:game_concept_cainite_desc #L каинитами#!#!."
 viachristi_desc:0 "Те #TOOLTIP:game_concept_cainite_desc #L каиниты#!#!, что в жизни были христианами, могут выбрать Путь Христа, полагая, что Божий замысел для мира включает вампиров, и повиновение Его воле поможет им контролировать Зверя."
 derechchaim_desc:0 "#TOOLTIP:game_concept_cainite_desc #L каиниты#!#!, которые при жизни были иудеями, могут выбрать Путь Жизни. Они верят, что Ха-Шем создал вампиров вместе с остальным миром, а значит, законы Торы по-прежнему применимы к ним и дают возможность контролировать Зверя."
 consumptionism_desc:0 "Бог мертв, диаблеризирован Каином. Затем Каин породил ещё одно поколение, и искра Бога в нем разделилась. Поэтому консьюмеристы считают, что ни один сородич не должен быть убит... если только искра Бога внутри него не будет восстановлена с помощью #TOOLTIP:game_concept_diablerie_desc #L диаблери#!#!."
 divisionism_desc:0 "Бог поделился своей сущностью со всеми сородичами, но только верные достаточно святы, чтобы заслужить этот дар. Поэтому раскольники стремятся обратить или #TOOLTIP:game_concept_diablerie_desc #L диаблеризировать#!#! других вампиров."
 eternalsenate_desc:0 "Вечный сенат - это совет #TOOLTIP:game_concept_cainite_desc #L каинитов#!#!, созданный по образцу римского Сената (хотя и гораздо меньшего размера), для управления, принятия законов и власти над сородичами. Вентру Рима организовали себя, как и смертные, как республику: Вечный сенат Вентру. В сенате каждый вентру имеет право слова и голоса, независимо от возраста и пола."
 inconnu_desc:0 "Инконню - крайне скрытная секта вампиров. О них практически ничего не известно наверняка, но некоторые из наиболее популярных теорий утверждают, что эта группа - коалиция мафусаилов, существующая для закулисного манипулирования Камарильей и Шабашом, состоящая исключительно из древних, оставивших Джихад ради достижения #TOOLTIP:game_concept_golconda_desc #E Голконды#!#!, или могущественный культ, связанный с #TOOLTIP:game_concept_antediluvian_desc #L допотопными#!#!. Даже возраст секты оспаривается, некоторые считают, что она возникла еще в Риме."
 amaranthans_desc:0 "Небольшая группа #TOOLTIP:game_concept_cainite_desc #L каинитов#!#!, посвятившая себя охоте на диаблеристов. Они используют имя первой жертвы #TOOLTIP:game_concept_diablerie_desc #L диаблери#!#! в качестве обязательства по выполнению своей задачи."
 roadofkings_religion_desc:0 "Сородич, придерживающиеся благородства. Излюбленная дорога #TOOLTIP:game_concept_Clan_desc #L клана#!#! Вентру."
 viaequitum_desc:0 "Те, кто следует Тропе Рыцаря, считают, что, будучи высшими существами они обязаны защищать тех, кто ниже их, как #TOOLTIP:game_concept_cainite_desc #L каинитов#!#!, так и людей. Эти отпрыски наиболее сильно верят в понятия долга и чести."
 codexoflegacies_desc:0 "Константинопольские #TOOLTIP:game_concept_cainite_desc #L каиниты#!#! не придерживались шести Традиций Каина. Вместо этого Трибоний Бруха создал Кодекс наследий - сборник предписаний, который должен был закрепить правление Троицы и трех правящих кланов: Тореадор, Цимисхи и Вентру. Совет из трех квезиторов - по одному от каждого из этих трех кланов - контролировал работу над кодексом и судил тех, кто нарушал его постулаты."
 cleopatrans_desc:0 "Этот культ представляет собой слияние сказки о Йиме, мифическом носферату, на которого, по-видимому, не распространялось проклятие #TOOLTIP:game_concept_Clan_desc #L клана#!#!, и Клеопатре, прекрасной египетской фараонше. Это очарование сделало #TOOLTIP:game_concept_Clan_desc #L клан#!#! могущественным, и многие принцы были клеопатритами вплоть до падения Римской империи. С тех пор культ считается мертвым."
 roadofmetamorphosis_religion_desc:0 "Эти сородичи стремятся к знаниям, овладевая плотью. Состоя практически полностью из #TOOLTIP:game_concept_Clan_desc #L клана#!#! Цимисхи, их эксперименты являются основой многих кошмаров."
 viaapotheosis_desc:0 "Эта неканоническая религия была создана по заказу покровителя.\nАдепты стремятся выйти за пределы своих биологических ограничений, совершенствуя умственные и физические способности до тех пор, пока они не станут неотличимы от божественных. Соревновательные ритуалы предполагают преклонение перед вышестоящими и обучение у них в обмен на кровавые жертвы. Наиболее распространенной #TOOLTIP:game_concept_discipline_desc #L дисциплиной#!#!, используемой в (не)жизненном стремлении к совершенству, является Изменчивость, хотя практикующих поощряют использовать почти все доступные способности для достижения своих идеалистических и эгоистических целей (даже демонические договоры и #TOOLTIP:game_concept_diablerie_desc #L диаблери#!#!)."
 roadofset_religion_desc:0 "Посвятившие себя поклонению своему #TOOLTIP:game_concept_antediluvian_desc #L допотопному#!#!, те, кто следует по Дороге Сета, стремятся восстановить его. К тем, кто не принадлежит к этой вере, относятся с подозрением и недоверием."
 viaset_desc:0 "Основная ветвь #TOOLTIP:game_concept_Clan_desc #L клана#!#! Сета - культовая организация, поклоняющаяся своему #TOOLTIP:game_concept_antediluvian_desc #L допотопному#!#! (или буквальному богу) как освободителю всего человечества."
 viaapep_desc:0 "Эти существа считают свою нежизнь не проклятием, а благословенным даром Змея хаоса. В результате они наслаждаются хаосом и самовозвышением. Они считают #TOOLTIP:glossary_wyrm_tt #L Апопа#!#!, Змея хаоса аватаром Сета."
 viaprometheus_desc:0 "Также называемые Приносящими Пламя, они представляют собой секту #TOOLTIP:game_concept_cainite_desc #L каинитов#!#!, мечтающих воссоздать Карфаген и связанную с ним гармонию сородичей и стада. Неудивительно, что многие члены секты - Бруха. Поскольку многие члены Высших кланов считают эти видения изменой, прометейцы вынуждены действовать тайно."
 viafurores_desc:0 "Члены этой секты имеют репутацию преступников среди #TOOLTIP:game_concept_cainite_desc #L каинитов#!#!. Осуждаемые большинством принцев как воры и нарушители спокойствия, они существуют на задворках вампирского общества, влача жалкое существование, как их смертные собратья. Фуроры считаются хаотичными, но они способны на такую страсть к своему делу, которая не встречается больше нигде в #TOOLTIP:game_concept_cainite_desc #L каинитском#!#! обществе."
 viahyron_desc:0 "Пути Улья следуют почти исключительно баали Ордена Молоха. Этот путь проповедует всеохватывающую верность линии крови в целом и своему #TOOLTIP:game_concept_Sire_desc #L сиру#!#! в частности. Главная причина этого в том, что Великие дела, которых хотят достичь баали, не могут быть совершены в одиночку или когда они мешают работе других. Вампир должен был впустить голоса Роя в свою душу, чтобы понять сны существ Внешней Тьмы и хранить их сон. Кроме того, большинство других вампиров активно уничтожали Баали, если они были достаточно глупы, чтобы выдать себя за приверженцев этого пути."
 servitorsofirad_desc:0 "Самопровозглашенные приспешники #TOOLTIP:game_concept_antediluvian_desc #L допотопных#!#!, Слуги Ирада не жаждут ничего, кроме бесконечной войны и кровопролития. Планета будет залита кровью, и все это время они будут во главе."
 cultofzilah_desc:0 "Группа #TOOLTIP:game_concept_cainite_desc #L каинитов#!#!, сосредоточенная вокруг Плачущего наставника и его ученика Аноша. После того как в затерянной долине был найден плачущий камень, культ стал поклоняться вампиру второго поколения по имени Зила. Сейчас они выступают как враги третьего поколения, восставшего против Каина и приказов его детей."
 talmahera_religion_desc:0 "Также известный как Истинная Черная Рука или Manus Nigrum, это древний культ смерти, посвященный поклонению кабалу существ, известных как Аралу, которых культ считает #TOOLTIP:game_concept_antediluvian_desc #L допотопными#!#!, что спят в городе-призраке Енох глубоко в землях мертвых."
 manusnigrum_desc:0 "Западная ветвь древнего культа смерти, посвященного поклонению кабалу существ, известных как Аралу, которых они считали #TOOLTIP:game_concept_antediluvian_desc #L допотопными#!#!, что спят в городе-призраке Енохе глубоко в землях мертвых. Культ в основном занимался вампирской политикой, планируя уничтожение Баали."
 roadofunexaminedhorizons_religion_desc:0 "Потомки Каина, находящиеся в подчинении у Сотни дьяволов, эти утраченные родословные прокладывают путь между дорогами и #TOOLTIP:podgloss.dharma #L дхармами#!#!."
 undead_aesir_doctrine_desc:0 "Воины Канарла жаждут славы и битв, их по праву боятся слабые #TOOLTIP:game_concept_cainite_desc #L каиниты#!#!."
 restored_republic_doctrine_desc:0 "Для #TOOLTIP:game_concept_cainite_desc #L каинитского#!#! учреждения Сенат удивительно непредвзят. Но не менее напряженный и кровавый, чем другие."
 secure_anda_doctrine_desc:0 "Из искусных разжигателей войны #TOOLTIP:podgloss.anda #L Анда#!#! превратились в искусных государственных деятелей, используя религиозную терпимость своей монгольской родни в качестве прочного фундамента."
 militarized_experiments_doctrine_desc:0 "Искаженные ужасы и мерзости ныне всё чаще используются #TOOLTIP:game_concept_Clan_desc #L кланом#!#! Цимисхи в качестве ударных войск."
 proctors_desc:0 "Как и у Привидений, Страшил и Кукловодов, вся цель Воплощения - посещать #TOOLTIP:game_concept_skinlands_desc #L земли Плоти#!#!. В отличие от других гильдий, Прокторы всегда были крайне самовлюбленными."
 yellow_springs_religion_desc:0 "Янтарные источники, также называемые #TOOLTIP:game_concept_dark_kingdom_desc #L Тёмным королевством#!#! Нефрита, - это часть [UmbraGlossaryLocalized('shadowlands','Загробного мира')], посвященная мёртвым Азии и контролируемая ими."
 yellow_springs_desc:0 "Янтарные источники, также называемые #TOOLTIP:game_concept_dark_kingdom_desc #L Тёмным королевством#!#! Нефрита, - это часть [UmbraGlossaryLocalized('shadowlands','Загробного мира')], посвященная мёртвым Азии и контролируемая ими."
 rf_wyrm_desc:0 "Являясь членом #TOOLTIP:glossary_triat_tt #L Триады#!#!, трёх величайших духовных сущностей, #TOOLTIP:glossary_wyrm_tt #L Вирм#!#! олицетворяет энтропию, распад и возрождение. Его погружение в безумие стало катализатором некоторых из величайших катастроф, с которыми столкнулось мироздание."
 wyrm_religion_desc:0 "Служить #TOOLTIP:glossary_wyrm_tt #L Вирму#!#! - значит служить самому безумию. Безумный бог наслаждается всеми формами разрушения и порчи, а его падшие приспешники стремятся снискать его нечестивую благосклонность."
 blackspiraldancer_religion_desc:0 "Известные также как Потерянное племя, ужасные Танцоры Черной Спирали - это гару, обратившиеся к Вирму. Когда-то они были известны как Белые завыватели, но после того, как племя попыталось в одиночку справиться с #TOOLTIP:glossary_wyrm_tt #L Вирмом#!#!, они исказились до неузнаваемости."
 blackspiraldancer_desc:0 "Известные также как Потерянное племя, ужасные Танцоры Черной Спирали - это гару, обратившиеся к #TOOLTIP:glossary_wyrm_tt #L Вирму#!#!. Когда-то они были известны как Белые завыватели, но после того, как племя попыталось в одиночку справиться с Вирмом, они исказились до неузнаваемости."
 princesofruin_desc:0 "Князья разрушения утверждают, что война за Апокалипсис закончена. Они проповедуют самообольщение, утверждая, что умирающий труп мира теперь принадлежит им, чтобы править им и обращаться с ним, как им заблагорассудится. Триумфальные поборники Разрушителя, они утверждают, что потакание своим низменным инстинктам - это категорическое поклонение #TOOLTIP:glossary_wyrm_tt #L Вирму#!#!."
 wyrmbound_desc:0 "У #TOOLTIP:glossary_wyrm_tt #L Вирма#!#! много слуг. Кто-то служит сознательно, кто-то неосознанно. Но все их действия служат высшей цели Вирма - вызвать Апокалипсис, конец Геи. Таким образом, все существа, которые причиняют страдания, предаются разврату и/или участвуют в разрушении, вольно или невольно, сознательно или неосознанно, являются слугами Вирма."
 ebon_centipede_desc:0 "Когда тени становятся слишком глубокими, и отчаяние или жестокость овладевают одним из Хаккен, он может отправиться в Чёрный лабиринт и посвятить себя #TOOLTIP:glossary_wyrm_tt #L Многоножке#!#!. Одинокие, несчастные и склонные к насилию существа, они являются проклятием для всего духовно хорошего, очень похожие на упадочных #ONCLICK:FAITH,blackspiraldancer #TOOLTIP:FAITH,blackspiraldancer оборотней-разрушителей#!#! с запада."
 eatersofthedead_desc:0 "Лагерь Безмолвных странников, загнанный под землю другими Странниками, где, по слухам, они проводят свои нечестивые обряды среди теней. Поглотить мозг своего врага и узнать все его секреты: мерзкий, но полезный ритуал. Однако все, кто поглощает чужую плоть, постепенно сходят с ума и источают зловоние #TOOLTIP:glossary_wyrm_tt #L Вирма#!#!. У некоторых даже развивается зависимость от свежих мозгов, и они будут убивать как невинных, так и виновных, чтобы полакомиться."
 metasticbirth_desc:0 "Эти Звездочёты верят, что #TOOLTIP:glossary_wyrm_tt #L Вирм#!#! не заточён в клетке, а находится в коконе, в котором он проходит метаморфозы, готовясь к новой реальности, рождаемой #TOOLTIP:glossary_weaver_tt #L Ткачихой#!#!. Как только метаморфоза завершится, он вырвется из своей хризалиды и откроет новый мир. Звездочеты, которые следуют за этим лагерем, считают, что это хорошо, и что племя должно помогать другим готовиться к этому, а не бороться с ним."
 ouroboroans_desc:0 "Они стремятся освободить #TOOLTIP:glossary_wyrm_tt #L Вирма#!#! Равновесия из Паутины. Вместо того чтобы бороться с #TOOLTIP:glossary_weaver_tt #L Ткачихой#!#!, они тратят свою энергию на поиски Вирма во всех его проявлениях в надежде открыть секрет его освобождения. Только следуя за Вирмом в его пещеру, а не сражаясь с его приспешниками, они считают, что могут по-настоящему повлиять на исход Последней войны. Поэтому некоторые из этих монахов считают, что пути Вирма нужно использовать, а не избегать."
 boli_zouhisze_desc:0 "Китайское ответвление Стражей людей, отделившееся примерно в 2000 году до н.э., хотя они сохранили некоторые аспекты культуры своего родительского племени, такие как уважение к человеческой культуре и почитание духа Таракана. Последнее стало причиной того, что местные #TOOLTIP:glossary_fera_tt #L фера#!#! в Китае стали сторониться Боли цзоухицзе и исключать их из Звериных дворов, поскольку у хенгейокай образы насекомых сильно ассоциируются с Вирмом."
 hellcats_desc:0 "Когда Танцоры Черной Спирали напали на ежегодный сход бастет из племени Цейликан в Шотландии, они заточили некоторых из них в [UmbraGlossary('black_spiral_labyrinth')], чтобы обратить их к #TOOLTIP:glossary_wyrm_tt #L Вирму#!#!. Те, кто выжил, стали Адскими котами, их обычное искреннее безумие превратилось в саморазрушение и бездумную агрессию. Ожидая Апокалипсиса, чтобы почтить своего Темного отца, эти запятнанные существа принесли с собой мощные связи с иллюзорными дарами фей и различными фетишами Вирма, которые они сконструировали с любопытством, подобным любопытству бастет."
 mnetics_desc:0 "Мнетики - пожиратели тайн. Им открылась истина о том, что воспоминания эфемерны и податливы. В то время как другие моколе годами переживают прошлое с помощью Мнезиса, мнетики знают, что всё это ложь. Если все моколе помнят прошлое, то почему у всех оно такое разное? Пожиратели тайн наслаждаются искажением памяти с помощью своей лжи и обмана. Многие моколе попались на удочку #TOOLTIP:glossary_wyrm_tt #L Расплетателя#!#!, поверив в его ложь, и в результате мнетики становятся всё сильнее."
