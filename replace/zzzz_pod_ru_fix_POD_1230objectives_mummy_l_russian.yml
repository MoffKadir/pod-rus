l_russian:
 pod1230objectives_mummy.17.a:0 "Добро пожаловать в ваши новые владения, мой Мастер!"
 pod1230objectives_mummy.17.a.tt:0 "Мастер выходит вперед и требует мир для себя. #X Игра окончена, мир, который вы знали, становится неузнаваемым.#!"
 pod1230objectives_mummy.17.desc:0 "Блистательный Мастер приближается к порталу не как аватар, а в своей истинной форме. Августейший Мастер выйдет вперед и завладеет миром, который вы приготовили для него. Величественнейший Мастер будет так же прекрасен и ужасен, как утро и ночь, так же ужасен, как буря и молния. Самый Неумолимый Мастер будет стоять сильнее основания земли и выше небес. Все будут любить Всепобеждающего Владыку и отчаиваться! \n\n У тех, кто на небесах, и у тех, кто на земле, и у тех, кто под землей, каждое колено преклонится, и ваши руки принудят их опуститься. Всякий язык исповедует свои грехи под кнутом Досточтимого Учителя, трещащим при каждом щелчке вашего запястья. Все уста будут воздавать хвалу Высочайшему Мастеру под угрозой вашего клинка у их горла."
 pod1230objectives_mummy.17.t:0 "Воскресший Господь"
 pod1230objectives_mummy.18.a:0 "Я устал, так устал..."
 pod1230objectives_mummy.18.a.tt:0 "Вы гасите свет своей души, навсегда выходя из цикла"
 pod1230objectives_mummy.18.b:0 "Ещё одна жизнь, чтобы искупить вину"
 pod1230objectives_mummy.18.b.tt:0 "Вы становитесь [GetTrait('mortal').GetName(GetNullCharacter)] #N и продолжаете игру за своего наследника #!, поскольку [THIS.Char.GetFirstName] оставляет $pod_wod$ позади и доживает оставшиеся дни [THIS.Char.GetHerHis], пытаясь загладить все отвратительные деяния [THIS.Char.GetHerHis]."
 pod1230objectives_mummy.18.c:0 "Вечное покаяние - это то, чего я заслуживаю"
 pod1230objectives_mummy.18.c.tt:0 "Вы становитесь [GetTrait('wutian').GetName(GetNullCharacter)] [GetTrait('mummy').GetName(GetNullCharacter)], проводя вечность, пытаясь загладить все свои отвратительные поступки."
 pod1230objectives_mummy.18.desc:0 "Часто говорят, что благими намерениями вымощена дорога в ад. Они забывают упомянуть, что существует тысяча адов, каждым из которых управляет повелитель мучений. Они забывают упомянуть, насколько длинна эта дорога и что не только добрые намерения приводят вас на нее. \n\n Так много времени прошло с той первой сделки, с того мига, когда вы продали себя душой и телом. Вы бесчисленное количество раз спрашивали себя, стоило ли оно того. Возможно, вначале вы так и думали... но теперь это не так. По правде говоря, оно никогда того не стоило. \n\nПора, давно пора положить этому конец. Пришло время вырваться из этого бесконечного цикла постоянных страданий от рук вашего хозяина, а затем распространить те же страдания на стольких... многих... других. Ужасы, свидетелями которых вы стали. Ужасы, которые вы совершили. И все же, каким бы злым ни было существо, какие бы отвратительные преступления оно ни совершало, всегда есть шанс на прощение. Его объятия открыты. Вам остается только сделать шаг."
 pod1230objectives_mummy.18.t:0 "Второй шанс"
 pod1230objectives_mummy.19.a:0 "ОНИ НАЗОВУТ МЕНЯ МАСТЕРОМ!"
 pod1230objectives_mummy.19.b:0 "Не станем спешить."
 pod1230objectives_mummy.19.desc:0 "Хотя мало кто говорит об этом жутком месте, Мир Йоми, состоящий из худших элементов Миров Инь и Ян, является вполне реальным местом, как вы хорошо знаете. Вы провели так... много... лет в Тысяче Адов мира Йоми. Так называемые [Glossary('повелители Яма','podgloss.yamaking')], повелители мучений и повелители Йоми, провели бесчисленные столетия, сражаясь друг с другом и с другими сверхъестественными существами, тщетно пытаясь получить остатки власти. \n\nДолгое время вы были их рабом, пойманным в ловушку их мелких игр. Однако не все [Glossary('повелители Яма','podgloss.yamaking')] пережили несколько эпох. Некоторые из них действительно очень молоды и уязвимы для такого опытного человека, как вы. Победа обещает силу, возможность стать равным своему старому Мастеру. Вы можете быть Мастером. ВЫ можете применить пытку. ВЫ МОЖЕТЕ СЛОМАТЬ ИХ ВСЕХ. ВЫ БОЛЬШЕ НЕ БУДЕТЕ ИХ РАБОМ! ВЫ БУДЕТЕ ПРАВИТЬ НА ИХ МЕСТЕ!"
 pod1230objectives_mummy.19.failure:0 "Нет. Пожалуйста! НЕЕЕЕТ!"
 pod1230objectives_mummy.19.success:0 "Я ЕСМЬ!"
 pod1230objectives_mummy.19.t:0 "Битва за проклятое будущее"
