l_russian:
 CONTACT_FELLOW_HUNTERS_DECISION_NEXT_STEP_BUTTON:0 "Выберите малую секту охотников"
 POD_asakku_blood_inception_decision:0 "Зарождение в крови"
 POD_asakku_blood_inception_decision_confirm:0 "Совершить зарождение в крови."
 POD_asakku_blood_inception_decision_desc:0 "Безумие, вызванное Изменчивостью, или куда более глубокое проклятие, наложенное сущностью древнее Творения? Для вас это неважно. Истина известна: её несёт кровь. И вместе с кровью вы распространяете её."
 POD_asakku_blood_inception_decision_tooltip:0 "Насильно заразить пленённого вампира Асакку через Зарождение в крови."
 POD_asakku_blood_inception_needs_prisoner_tt:0 "У вас должен быть заключенный вампир без Истинной Веры."
 POD_asakku_depth_trigger:0 "Порча Асакку должна достичь [SCOPE.GetValue('assaku_depth_requirement')|V0]."
 POD_asakku_phase1_infected_tt:0 "Как минимум #V 1#! [vassal|E] или [follower|E] должен иметь [GetTrait('POD_asakku_soul_infection').GetName(GetNullCharacter)]."
 POD_asakku_phase1_objective_decision:0 "Наблюдатель у колодца: Заражение души"
 POD_asakku_phase1_objective_decision_confirm:0 "Фундамент заложен."
 POD_asakku_phase1_objective_decision_desc:0 "Охотники-элиуды бдительны. Поэтому первый этап неизбежно будет скромным и тайным. Убедитесь, что кто-то ещё несёт порчу Асакку: так начнётся медленное, но, будем надеяться, неумолимое распространение."
 POD_asakku_phase1_objective_decision_tooltip:0 "Первый этап замысла Асакку. Распространите заражение. Заложите основу."
 POD_asakku_phase2_inception_tt:0 "[blood_inception|E] должно быть применено как минимум к #V 3#! персонажам."
 POD_asakku_phase2_objective_decision:0 "Наблюдатель у колодца: Распространяющееся пятно"
 POD_asakku_phase2_objective_decision_confirm:0 "Пятно распространяется."
 POD_asakku_phase2_objective_decision_desc:0 "Заражение больше не удаётся скрыть. Охотники-элиуды подняты по тревоге, и второй этап идёт полным ходом. Пришло время распространить порчу гораздо дальше и, что ещё важнее, пережить первые ответные удары."
 POD_asakku_phase2_objective_decision_tooltip:0 "Вторая фаза. Создавайте истинных новообращённых через Зарождение в крови. Переживите ответный удар элиудов."
 POD_asakku_phase2_phalanx_tt:0 "Вы должны пережить нападение фаланги элиудов."
 POD_asakku_phase3_baghdad_tt:0 "Вы должны удерживать графство Багдад."
 POD_asakku_phase3_enoch_tt:0 "Вы должны удержать Еноха (Эдессу)"
 POD_asakku_phase3_objective_decision:0 "Наблюдатель у колодца: Изгнание западных узурпаторов"
 POD_asakku_phase3_objective_decision_confirm:0 "Западный предел принадлежит нам."
 POD_asakku_phase3_objective_decision_desc:0 "Заражение уступает место господству. Пришло время окончательно уничтожить западных охотников-элиудов и завоевать плацдарм для продвижения на восток. Там лежат ваша судьба и самое сердце охотников."
 POD_asakku_phase3_objective_decision_tooltip:0 "Третий этап. Изгоните элиудов из западных владений. Займите древние престолы."
 POD_asakku_phase3_regional_elioud_tt:0 "Ни один неосквернённый элиуд не должен владеть земельными титулами на Ближнем Востоке или в Анатолии."
 POD_asakku_phase4_elioud_tt:0 "Ни один живой персонаж, владеющий землями, не должен иметь свойство «[GetTrait('POD_asakku_elioud').GetName(GetNullCharacter)]», не будучи при этом Асакку."
 POD_asakku_phase4_mokhadaji_tt:0 "Мохададжи Ранпур должен быть мёртв или стать Асакку."
 POD_asakku_phase4_nattadevi_tt:0 "Наттадеви должна быть мертва или Асакку."
 POD_asakku_phase4_objective_decision:0 "Наблюдатель у колодца: Восточная расплата"
 POD_asakku_phase4_objective_decision_confirm:0 "Расплата завершена."
 POD_asakku_phase4_objective_decision_desc:0 "Последний этап. Война достигает самого центра, где всё ещё стоит цитадель элиудов. Когда охотники исчезнут, а глубина порчи достигнет предела, сущность будет довольна... и готова."
 POD_asakku_phase4_objective_decision_tooltip:0 "Последний этап. Устраните восточных элиудов. Вознеситесь."
 POD_asakku_seeding_needs_county_tt:0 "Вы должны владеть графством без существующей порчи Изменчивости."
 POD_asakku_seeding_the_garden_decision:0 "Посев сада"
 POD_asakku_seeding_the_garden_decision_confirm:0 "Засейте сад."
 POD_asakku_seeding_the_garden_decision_desc:0 "Если эта сущность существовала до Творения, возможно, она способна осквернить всё возникшее после него. Напитать её порчей саму землю — достойная кара за то, что у неё отняли мир, по праву принадлежавший ей ещё до начала времён."
 POD_asakku_seeding_the_garden_decision_tooltip:0 "Наделить графство порчей «Изменчивость»."
 POD_asakku_soul_whispers_interaction:0 "Шепот души"
 POD_asakku_soul_whispers_interaction_desc1:0 "Некоторые называют сущность паразитом. Пусть это унизительное и примитивное описание, всё же приходится признать: скрытностью она похожа на этих существ. Теперь раскрывать секреты должно быть легко: вы сами носите в себе величайшую тайну."
 POD_asakku_soul_whispers_interaction_tooltip:0 "Использовать связь крови Асакку, чтобы раскрыть секрет при дворе этого вампира."
 POD_asakku_soul_whispers_needs_courtier_secrets_tt:0 "[recipient.GetShortUINamePossessive] двор не хранит никаких секретов"
 POD_assamite_vizier_enrich_province:0 "Оценка визиря"
 POD_assamite_vizier_enrich_province_confirm:0 "Провинция процветает под властью визиря."
 POD_assamite_vizier_enrich_province_desc:0 "Архив учёного хранит знания об управлении, о которых большинство князей могут лишь мечтать. Визирь воплощает эти знания в деле: налаживает налогообложение, улучшает инфраструктуру и ускоряет развитие провинции."
 POD_assamite_vizier_enrich_province_tooltip:0 "На 10 лет даёт вашему столичному графству модификатор провинции:\n#bold бонусы к налогам и приросту развития#!, величина которых зависит от уровня Архива."
 POD_gangrel_recruit_beast_den_animals:0 "Собрать стаю из логова зверей"
 POD_gangrel_recruit_beast_den_animals_confirm:0 "Стая отвечает. Они в вашем распоряжении."
 POD_gangrel_recruit_beast_den_animals_desc:0 "Ваше логово зверей привлекло животных из окрестных диких земель: волков, огромных летучих мышей и мелких существ, подчинённых вашей воле силой крови Анимализма. Соберите их в боевой отряд."
 POD_gangrel_recruit_beast_den_animals_tooltip:0 "Наберите полк управляемых животных. Размер полка зависит от уровня Логова Зверей.\n#bold Уровень 1-2:#! 100 зверей\n#bold Уровень 2-3:#! 200 зверей\n#bold Уровень 5:#! 300 зверей\n#bold Уровень 6:#! 400 зверей"
 POD_impundulu_recruit_bomkazi:0 "Посвятить новую бомкази"
 POD_impundulu_recruit_bomkazi_confirm:0 "Ковен растёт. Новая ведьма присоединяется к вашему дому."
 POD_impundulu_recruit_bomkazi_desc:0 "Связь между импундулу и бомкази древняя и священная: это не подчинение вампирского дитя сиру, а договор между птицей-молнией и ведьмой. Новая посвящённая готова присоединиться к вашему дому."
 POD_impundulu_recruit_bomkazi_tooltip:0 "Наймите [GetTrait('bomkazi_witch').GetName(GetNullCharacter)] в свой дом. Время восстановления уменьшается с уровнем комплекса Бомкази. \n#bold Уровень 1: #! Время восстановления 40 лет \n#bold Уровень 5: #! Время восстановления 20 лет"
 POD_maryb_decani_hunt_decision:0 "Нечестивое вознесение: Охота на Декани"
 POD_maryb_decani_hunt_decision_confirm:0 "Начать связывание"
 POD_maryb_decani_hunt_decision_custom:0 "Мэри знает [GetScriptedCharacterByHistoryID('9201500').GetFirstName] [Glossary('Истинное имя','podgloss.truename')]"
 POD_maryb_decani_hunt_decision_desc:0 "С тех пор как Анадук выторговал ваше перерождение, Аностер держит часть вашего имени в своей книге. Сегодня этому реестру придёт конец. Свяжите его в круге освящённой земли и разрушьте сделку, которая создала вас."
 POD_maryb_decani_hunt_decision_tooltip:0 "Разрушьте сделку, которая создала вас."
 POD_maryb_found_dream_house_children_tt:0 "Потомки Мэри, всё ещё принадлежащие к её дому, переходят в новый дом и вместе с ней приобщаются к Мечте."
 POD_maryb_found_dream_house_decision:0 "Основать Дом возвращающейся Мечты"
 POD_maryb_found_dream_house_decision_confirm:0 "Основать дом"
 POD_maryb_found_dream_house_decision_desc:0 "Мэри была заражена кровью диаблериста; Михаил так и не успел приобщить её к своей. Теперь ни то, ни другое не имеет значения. Существо, ходящее в её теле, хочет собственный дом, а дому нужны престол, имя и город. Этим престолом станет Константинополь. Отделите новую ветвь от древней крови, и пусть мир Сородичей научится бояться имени, которого ещё никогда не слышал.\n\n#shinygold Наш дом, любимый. Ни мой, ни твой. Дверь, которую мы открываем вместе.#!"
 POD_maryb_found_dream_house_decision_tooltip:0 "Основать новую ветвь древней крови."
 POD_maryb_found_well_decision:0 "Основать Колодец жертвоприношений"
 POD_maryb_found_well_decision_confirm:0 "Заложить первый камень"
 POD_maryb_found_well_decision_desc:0 "Под собором Святой Софии, в убежище, оставленной Михаилом, поднимаются первые камни и льется первая кровь. Колодец начат, шахта опущена на другую сторону, питаемая не золотом или молитвой, а самим городом. \n\nНаверху Константинополь останется маяком смертной веры, но внизу, обряд за обрядом, его подбрюшье станет отражением ада на Земле. Опусти первый камень.\n\n#shinygold Как вверху, так и внизу, возлюбленная. Начни, и я покажу тебе, насколько это глубоко.#!"
 POD_maryb_found_well_decision_tooltip:0 "Основать Колодец жертвоприношений под Константинополем."
 POD_maryb_recover_tablet_decision:0 "Вернуть табличку"
 POD_maryb_recover_tablet_decision_confirm:0 "Прочтите табличку"
 POD_maryb_recover_tablet_decision_custom:0 "Графство, владеющее одной из трех табличек, которые Мэри еще не вернула, должно полностью контролироваться ее королевством, или Мэри должна быть безземельным искателем приключений, чей лагерь базируется в графстве, владеющем одной из трех табличек, которые она еще не вернула."
 POD_maryb_recover_tablet_decision_desc:0 "Написанные кровью таблички покоятся под Дамаском, Мосулом и Багдадом. Заберите их. Прочитайте написанное."
 POD_maryb_recover_tablet_decision_tooltip:0 "Возьмите табличку. Прочитайте написанное."
 POD_maryb_resurrect_the_dream_decision:0 "Возродить Мечту"
 POD_maryb_resurrect_the_dream_decision_confirm:0 "Возродить Мечту"
 POD_maryb_resurrect_the_dream_decision_desc:0 "Из Константинополя возрождается Патриархат — таким, каким он всегда должен был стать. Мечта делает первый вдох под новым знаменем, а титул Патриарха возвращается к своему первому обладателю.\n\n#shinygold Я ждал этого. Я никогда не сомневался, что всё вернётся ко мне. Возлюбленная, давай позовём их домой.#!\n\n• Обращает не отличающегося фанатизмом вассала в веру Кодекса Наследия \n• Обращает последователей Via Archangeli в веру Кодекса Наследия \n• Даёт империю [GetTitleByKey('e_byzantium').GetName] \n• Даёт титул Патриарха Константинополя."
 POD_maryb_resurrect_the_dream_decision_tooltip:0 "Мечта делает первый вздох под новым знаменем."
 POD_maryb_well_no_pending_offering_tooltip:0 "В шахте не должно быть приношения. Сначала нужно израсходовать уже приготовленное приношение."
 POD_maryb_well_sacrifice_decision:0 "Пожертвовать город Колодцу"
 POD_maryb_well_sacrifice_decision_confirm:0 "Обескровить город"
 POD_maryb_well_sacrifice_decision_custom:0 "Мэри полностью контролирует [GetTitleByKey('c_byzantion').GetNameNoTier], и у города ещё есть [Concept('development','развитие')], которое можно отнять."
 POD_maryb_well_sacrifice_decision_desc:0 "Колодец вырыт под собором Святой Софии. Его питают не золотом и молитвами, а самим городом: его развитием, его ремёслами, всей тяжестью его живой плоти, низвергаемой в шахту, которая каждую ночь всё ближе к иному миру.\n\nНаверху Константинополь остаётся светочем веры смертных. Внизу же, обряд за обрядом, его чрево становится отражением ада на земле. Совершите ещё один обряд: обескровьте город, и полученное приношение позволит углубить Колодец.\n\n#shinygold Что наверху, то и внизу, любимый. Ещё немного их — во имя нас.#!"
 POD_maryb_well_sacrifice_decision_tooltip:0 "Скормите город Колодцу."
 POD_maryb_write_tablet_decision:0 "Написать последнюю табличку"
 POD_maryb_write_tablet_decision_confirm:0 "Взять писало"
 POD_maryb_write_tablet_decision_custom1:0 "[GetTitleByKey('k_angellisater').GetNameNoTier] больше не должен существовать."
 POD_maryb_write_tablet_decision_custom2:0 "[GetTitleByKey('k_olives').GetNameNoTier] больше не должен существовать."
 POD_maryb_write_tablet_decision_desc:0 "Три таблички возвращены и прочитаны. Влажная глина четвёртой лежит под вашим писалом. Теперь можно взглянуть на то, что вы на самом деле совершили, и написать конец: ваш, его — или того, чем вы стали вместе."
 POD_maryb_write_tablet_decision_tooltip:0 "Возьмите писало и напишите конец: ваш, его — или того, чем вы стали вместе."
 POD_region_cabiri_homeland:0 "Земли Кабири"
 POD_region_middle_kingdom:0 "Среднее царство"
 POD_salubri_healer_develop_county:0 "Содействовать развитию домена"
 POD_salubri_healer_develop_county_confirm:0 "Земля исцеляется и вновь процветает."
 POD_salubri_healer_develop_county_desc:0 "Через Валерен и тихие советы целитель Салюбри способствует развитию самой земли. Чума отступает, урожаи улучшаются, и люди процветают под бдительным взором третьего глаза."
 POD_salubri_healer_develop_county_tooltip:0 "Потратьте благочестие, чтобы повысить развитие вашего столичного графства. Величина прироста зависит от учёности и уровня целительской кельи."
 POD_salubri_warrior_recruit_mortals:0 "Обучить воина Кодекса"
 POD_salubri_warrior_recruit_mortals_confirm:0 "Новый солдат Кодекса готов."
 POD_salubri_warrior_recruit_mortals_desc:0 "Кодекс Самиэля требует воинов, достойных борьбы с тьмой. Реликварий готовит солдат методами Воинов Крови: смертных, способных стоять рядом с каинитами и не дрогнуть."
 POD_salubri_warrior_recruit_mortals_notification:0 "Воин завербован"
 POD_salubri_warrior_recruit_mortals_recruited_tt:0 "Смертный воин ответил на зов Реликвария и присоединился к вашему двору."
 POD_salubri_warrior_recruit_mortals_tooltip:0 "Наймите смертного придворного, имеющего военное образование. Качество образования зависит от уровня Реликвария. \n#bold Уровень 1-2: #! [GetTrait('education_martial_2').GetName(GetNullCharacter)]\n#bold Уровень 3-4: #! [GetTrait('education_martial_3').GetName(GetNullCharacter)] (может получить черту командира) \n#bold Уровень 5: #! [GetTrait('education_martial_4').GetName(GetNullCharacter)] (может получить черты командира или веры)"
 POD_spell_of_life_conversion:0 "Волна веры"
 POD_spell_of_life_conversion_confirm:0 "Проникая сквозь Завесу..."
 POD_spell_of_life_conversion_desc:0 "Ваше понимание Заклинания Жизни дало уникальное понимание барьера между жизнью и смертью. Если бы вы захотели, вы могли бы черпать силу из [UmbraGlossary('shadowlands')] и использовать ее, чтобы взорвать умы тех, кто находится в вашем царстве. Их разум может рухнуть. Их тела могут быть искривлены. В любом случае, они осознают ошибочность своего пути."
 POD_spell_of_life_conversion_effect1:0 "Графства вашей державы обратятся в вашу конфессию."
 POD_spell_of_life_conversion_effect2:0 "Ваши действия повредят [UmbraGlossary('shadowlands')] и призовут орду через созданный вами разрыв в Завесе."
 POD_spell_of_life_conversion_effect4:0 "Ваши вассалы примут вашу веру или более дружественную ей конфессию, хотя это может превратить их в [GetTrait('asekh_sen').GetName( GetNullCharacter )]."
 POD_spell_of_life_conversion_tooltip:0 "Используя свои знания Заклинания Жизни, вы можете обратить свое королевство в более приемлемые религии."
 POD_toreador_recruit_salon_artisans:0 "Пригласить подопечного салона"
 POD_toreador_recruit_salon_artisans_confirm:0 "К вашему двору присоединяется новый голос."
 POD_toreador_recruit_salon_artisans_desc:0 "Репутация вашего Салона привлекает талантливых смертных, художников, поэтов и ремесленников, ищущих покровителя, достойного их даров. Выберите одного, чтобы присоединиться к вашему двору."
 POD_toreador_recruit_salon_artisans_tooltip:0 "Пригласите придворного ремесленника со свойством «Поэт». Его способности зависят от уровня салона."
 POD_wu_kuei_new_yama_king_objective_decision:0 "Сам себе хозяин"
 POD_wu_kuei_new_yama_king_objective_decision_confirm:0 "Зачем служить... когда можно КОНТРОЛИРОВАТЬ! #bold ВСЕ!#!"
 POD_wu_kuei_new_yama_king_objective_decision_desc:0 "[Glossary('повелителей Яма','podgloss.yamaking')] — верховные стражи Ёми Вана и в основном падшие слуги [Glossary('Нефритового императора','podgloss.augustpersonageofjade')], которые, обнаружив, что ци можно извлекать из человеческих душ посредством пыток, применили такие методы для извлечения этой энергии. Иерархия этих существ меняется со временем, поскольку старые терпят поражение от новых, чье возвышение часто связано с какими-то крупными потрясениями в мире смертных. \n\nВаше полное знание эликсира вечной жизни дает возможность создавать [GetTrait('wutian').GetName( GetPlayer )] и [GetTrait('wukuei').GetName( GetPlayer )]. Такая сила, сила, невообразимая для дряхлого дурака, которого ты называешь #italic Master#!. Вы можете превзойти их, поработить их, как они поработили вас. Их душам придется всю вечность страдать от мук, которые превосходят их воображение. Ха... хе... ха... мух... МУХАХАХА #bold АХАХАХ! ВСЕ БУДУТ СТОЯТЬ НА КОЛЕНИ ПЕРЕД ВАМИ! НЕТ БОГА! НЕТ КОРОЛЕЙ! НЕТ МАСТЕРОВ!#!\n\n#N #bold НИКОГО, КРОМЕ ВАС!#!#!"
 POD_wu_kuei_new_yama_king_objective_decision_effect_battle:0 "Вам предстоит начать великую битву с [Glossary('повелителем Яма','podgloss.yamaking')] за его владения. Будьте внимательны, он не сдастся без серьёзного боя."
 POD_wu_kuei_new_yama_king_objective_decision_effect_mutually_exclusive:0 "#X Это взаимоисключающие цели «$coming_of_demon_emperor_decision$» и «$POD_wu_kuei_redemption_objective_decision$»#!."
