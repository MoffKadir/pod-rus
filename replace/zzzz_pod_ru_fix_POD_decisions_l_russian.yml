 ergenekon_objective_decision:0 "Вновь разжечь кузницы Эргенекона"
 ergenekon_objective_decision_confirm:0 "Огни Эргенекона вновь ревут."
 ergenekon_objective_decision_desc:0 "На протяжении веков гора была нашим единственным щитом от угроз с Востока. Загнанные нашими врагами в укрытие, мы выжили, овладев искусством кузнечного дела. С тех пор, как мы вернулись в Степи, наши кузницы остались холодными. Но ночь жестока, как всегда, и Эрки не должны забывать сталь, которая их защищала. Возродив великие кузницы, мы вернем утраченные таланты, а огни Эргенекона затмят небо."
 ergenekon_objective_decision_effect_tooltip:0 "Возобновив работу в Эргенеконе, вы получите новое специальное здание и полезные модификаторы."
