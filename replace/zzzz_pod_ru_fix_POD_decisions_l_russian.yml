 POD_wu_kuei_new_yama_king_objective_decision_requirement_wutian:0 "Вы можете сделать эликсир вечной жизни для [GetTrait('wutian').GetName( GetPlayer )]."
 POD_wu_kuei_new_yama_king_objective_decision_tooltip:0 "Вам следует свергнуть древнюю развалину, которую вы зовёте #italic Учителем#!."
 POD_wu_kuei_redemption_objective_decision:0 "Шанс на искупление"
 POD_wu_kuei_redemption_objective_decision_confirm:0 "Искупление всегда возможно"
 POD_wu_kuei_redemption_objective_decision_desc:0 "Будь то бессмертие, сила или что-то еще, вы продали свою душу. Вы скованы цепями, которые сами выковали. В рабстве у желаний и [Glossary('повелителя Яма','podgloss.yamaking')], ваше существование наполнено муками и преданностью. Это когда-нибудь закончится? Есть ли хоть малейший шанс, что все это закончится? Сможете ли вы освободиться от своего хозяина? Хотите ли вы этого?"
 POD_wu_kuei_redemption_objective_decision_effect:0 "На этом ваше путешествие завершится, и, хочется верить, искуплением."
 POD_wu_kuei_redemption_objective_decision_effect_mutually_exclusive:0 "#X Это взаимоисключающие цели «$coming_of_demon_emperor_decision$» и «$POD_wu_kuei_new_yama_king_objective_decision$»#!."
 POD_wu_kuei_redemption_objective_decision_requirement_devotion:0 "У вас есть #V 0#! [trait_level_track_xp|E] в [GetTrait('integrity').GetName( GetPlayer )]"
 POD_wu_kuei_redemption_objective_decision_requirement_piety:0 "Ваш [piety_level|E] — [GetPietyLevelName( '(int32)0' )] (#V 0#!)"
 POD_wu_kuei_redemption_objective_decision_tooltip:0 "Могу ли я обрести искупление? Хочу ли я этого?"
 POD_wutian_change_house_decision:0 "Уравновесить свой аспект"
 POD_wutian_change_house_decision_confirm:0 "Мне нужен новый путь"
 POD_wutian_change_house_decision_desc:0 "Вечность – это долго, а судьба – штука хитрая. То, что когда-то влекло вас по одному пути, может больше не существовать. Возможно, вам надоел стоицизм и сдержанность [GetDynastyByID( 'POD_mummy_dynasty_xianlung' ).GetBaseName], или вы считаете, что импульсивность и энтузиазм [GetDynastyByID( 'POD_mummy_dynasty_wufeng' ).GetBaseName] утомляют. Возможно, пришло время попробовать другой путь..."
