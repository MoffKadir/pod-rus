 coming_of_demon_emperor_decision:0 "Приход Императора Демонов"
 coming_of_demon_emperor_decision_confirm:0 "Когда Солнце умирает, наступает Новый век!"
 coming_of_demon_emperor_decision_desc:0 "Ваши идиотские кузены среди Бессмертных, Ву Тянь, стараются предотвратить [Glossary('Шестая эпоха','game_concept_sixth_age_desc')] или, по крайней мере, подготовиться к нему. Эти дураки даже не подумали присоединиться к победившей стороне. Зачем страдать, когда можно жить в комфорте и роскоши, вознагражденный за верность Щедрому Господину? Зачем работать на дряхлых дураков, скрывающихся в далеких небесах, когда вы можете служить Высочайшему Мастеру, чье господство над всеми неизбежно и скоро наступит? \n\nТеперь... теперь пришло время заслужить свою награду. Теперь пришло время провозгласить [Glossary('Шестая эпоха','game_concept_sixth_age_desc')] и доминирование Самого Великолепного Мастера вместе с ним."
