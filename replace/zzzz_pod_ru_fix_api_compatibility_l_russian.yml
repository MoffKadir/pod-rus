 POD_ulama_learning_tooltip:0 "Каждый год у этого персонажа есть возможность получить [Concept('perk', 'достоинство')|E] в [Concept('learning_lifestyle', 'пути учёности')|E] «[GetTrait('theologian').GetName(GetNullCharacter)]» и «[GetTrait('erudite').GetName(GetNullCharacter)]», пока у него не появятся оба свойства. Этот шанс повышается за счёт его [Concept('aptitude', 'пригодности')|E]."
