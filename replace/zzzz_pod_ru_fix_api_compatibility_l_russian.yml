 gaiachurch_objective_decision_custom_roma:0 "Владелец владения [GetTitleByKey('c_roma').GetNameNoTier] должен иметь доктрину «[GetDoctrineType('special_doctrine_ecumenical_hunters').GetBaseName]» или исповедовать вашу конфессию."
 game_concept_akuma_desc:0 "Акума, или пожиратели демонов, - это люди, которые отказались от добродетели и связали себя с [Glossary('повелителями Яма','podgloss.yamaking')]. Некоторые из них - простые наивные пешки, в то время как другие - ужасные существа, обладающие адской силой.\n\nДля целей в [princes_of_darkness|E] к акума относятся следующие персонажи: \n$BULLET_WITH_TAB$Персонажи со [Concept('trait', 'свойством')|E] «[GetTrait('witch').GetName(GetPlayer)]»\n$BULLET_WITH_TAB$Персонажи со [Concept('trait', 'свойством')|E] «[GetTrait('wukuei').GetName(GetPlayer)]»\n$BULLET_WITH_TAB$Персонажи, исповедующие [Concept('faith', 'конфессию')|E] с [Concept('doctrine', 'доктриной')|E] «[GetDoctrineType('special_doctrine_allied_to_yomi_wan_hostility').GetBaseName]»\n$BULLET_WITH_TAB$Персонажи с [Concept('modifier', 'модификатором')|E] «[GetModifier('yama_king_modifier').GetNameWithTooltip]»"
 game_concept_christian_derived_faiths_desc_ingame:0 "Очень немногие [Concept('characters', 'персонажи')|E] в [Glossary('мире Тьмы','game_concept_world_of_darkness_desc')] исповедуют узнаваемую форму христианства и вместо этого исповедуют [Concept('faiths', 'конфессии')|E], происходящие из более привычных версий. В моде «[princes_of_darkness|E]» к этим [Concept('faiths', 'конфессиям')|E] относятся:\n$BULLET_WITH_TAB$@vampire_icon! [GetFaithByKey('viachristi').GetAdjective]\n$BULLET_WITH_TAB$@vampire_icon! [GetFaithByKey('viavindicta').GetAdjective]\n$BULLET_WITH_TAB$@vampire_icon! [GetFaithByKey('viapenaculum').GetAdjective]\n$BULLET_WITH_TAB$@vampire_icon! [GetFaithByKey('viaredemptio').GetAdjective]\n$BULLET_WITH_TAB$@vampire_icon! [GetFaithByKey('pathoftheheavenlyabode').GetAdjective]\n$BULLET_WITH_TAB$@vampire_icon! [GetFaithByKey('vianoctis').GetAdjective]\n$BULLET_WITH_TAB$@vampire_icon! [GetFaithByKey('viadolorosa').GetAdjective]\n$BULLET_WITH_TAB$@vampire_icon! [GetFaithByKey('viacain').GetAdjective]\n$BULLET_WITH_TAB$@vampire_icon! [GetFaithByKey('viapura').GetAdjective]\n$BULLET_WITH_TAB$@vampire_icon! [GetFaithByKey('redtemptation').GetAdjective]\n$BULLET_WITH_TAB$@vampire_icon! [GetFaithByKey('apostlesthirdcaine').GetAdjective]\n$BULLET_WITH_TAB$@vampire_icon! [GetFaithByKey('blackmagdalene').GetAdjective]\n$BULLET_WITH_TAB$@vampire_icon! [GetFaithByKey('eschatologists').GetAdjective]\n$BULLET_WITH_TAB$@vampire_icon! [GetFaithByKey('sanctamater').GetAdjective]\n$BULLET_WITH_TAB$@supehunter_icon! [GetFaithByKey('shadowinquisition').GetAdjective]\n$BULLET_WITH_TAB$@supehunter_icon! [GetFaithByKey('akritai').GetAdjective]\n$BULLET_WITH_TAB$#L [GetReligionByKey('calomenasforsaken_religion').GetName]ие#! [Concept('faiths', 'конфессии')|E]\n$BULLET_WITH_TAB$@werewolf_icon! [GetFaithByKey('crestofthehorn').GetAdjective]\n$BULLET_WITH_TAB$@werewolf_icon! [GetFaithByKey('orderofourmercifulmother').GetAdjective]\n$BULLET_WITH_TAB$#L [GetReligionByKey('fishers_religion').GetName]ие#! [Concept('faiths', 'конфессии')|E]\n$BULLET_WITH_TAB$Все [Concept('faith', 'конфессии')|E] с доктриной @changeling_icon! [GetDoctrineType('doctrine_fae_agenda_constantinian').GetBaseName]"
 game_concept_jerusalem_unique_decisions_desc_ingame:0 "Существо, обладающее огромной силой, покоится в яме, чью пасть можно найти на Кетеф Хинном. Из Ямы доносится множество противоречивых голосов, возможно, дающих некоторое прозрение. Эти голоса затрагивают как смертных, так и сверхъестественных существ, доводя многих в окрестностях до религиозной мании и истерии. Вот краткое описание доступных решений:\n$BULLET_WITH_TAB$#V $supehunter_purify_jerusalem_pit_decision$#!: Доступно #TOOLTIP:GAME_TRAIT,supehunter,[GetNullCharacter] #L охотникам#!#! с #L [GetReligionByKey('hunters_religion').GetName|l]ими#! [Concept('religion', 'религиями')|E].\n$BULLET_WITH_TAB$#V $malkavian_search_for_sister_decision$#! Доступно #TOOLTIP:GAME_TRAIT,malkavian,[GetNullCharacter] #L малкавианам#!#! для поиска кого-либо важного...\n$BULLET_WITH_TAB$#V $malakaite_mistress_boon_decision$#!: Доступно #TOOLTIP:GAME_TRAIT,vampire,[GetNullCharacter] #L вампирам#!#!, #TOOLTIP:GAME_TRAIT,revenant,[GetNullCharacter] #L ревенантам#!#! или #TOOLTIP:GAME_TRAIT,ghoul,[GetNullCharacter] #L гулям#!#! с #L [GetFaithByKey('eyesofmalakai').GetName|l]ой#! [Concept('faith', 'конфессией')|E] чтобы попросить помощи у своей госпожи в завершении вашей миссии.\n$BULLET_WITH_TAB$#V $molochite_maintain_the_sleep_decision$#!: Доступно #TOOLTIP:GAME_TRAIT,vampire,[GetNullCharacter] #L вампирам#!#! из [Concept('house', 'дома')|E] [GetDynastyHouseByID('house_moloch').GetName] для сбора знаний по мере углубления сна Спящего.\n$BULLET_WITH_TAB$#V $nergalite_wake_the_sleeper_decision$#!: Доступно #TOOLTIP:GAME_TRAIT,vampire,[GetNullCharacter] #L вампирам#!#!-#TOOLTIP:GAME_TRAIT,witch,[GetNullCharacter] #L инферналистам#!#! или #TOOLTIP:GAME_TRAIT,vampire,[GetNullCharacter] #L вампирам#!#! из [Concept('house', 'дома')|E] [GetDynastyHouseByID('house_nergal').GetName] или [GetDynastyHouseByID('house_angellisater').GetName]. За помощь таким существам полагается награда.\n$BULLET_WITH_TAB$#V $vamp_lower_gen_jerusalem_decision$#!: Доступно #TOOLTIP:GAME_TRAIT,vampire,[GetNullCharacter] #L вампирам#!#! без уникальных решений, позволяет понизить ваше [Glossary('поколение','game_concept_vampgeneration_desc')], но будьте осторожны с ценой.\n$BULLET_WITH_TAB$#V $mummies_tap_web_faith_decision$#!: Доступно #TOOLTIP:GAME_TRAIT,mummy,[GetNullCharacter] #L мумиям#!#! #TOOLTIP:GAME_TRAIT,shemsuheru,[GetNullCharacter] #L шемсу-геру#!#!, #TOOLTIP:GAME_TRAIT,cabiri,[GetNullCharacter] #L кабиритам#!#! или #TOOLTIP:GAME_TRAIT,banemummy,[GetNullCharacter] #L проклятым мумиям#!#!, когда они черпают из Сети веры для получения дополнительного опыта хекау.\n$BULLET_WITH_TAB$#V $constantinian_channel_religious_fervor_decision$#!: Доступно персонажам, в жилах которых течёт кровь фей, с доктриной [GetDoctrineType('doctrine_fae_agenda_constantinian').GetBaseName] после завершения [Concept('decision', 'решения')|E] «Константинианский катехизис», поскольку они используют местную манию в своём стремлении к власти."
 game_concept_muslim_derived_faiths_desc_ingame:0 "Очень немногие [Concept('characters', 'персонажи')|E] в [Glossary('мире Тьмы','game_concept_world_of_darkness_desc')] исповедуют узнаваемую форму ислама и вместо этого исповедуют [Concept('faiths', 'конфессии')|E], происходящие из более привычных версий. В моде «[princes_of_darkness|E]» к этим [Concept('faiths', 'конфессиям')|E] относятся:\n$BULLET_WITH_TAB$@vampire_icon! [Glossary('Аширра','game_concept_ashirra_desc')]\n$BULLET_WITH_TAB$Все [Concept('faith', 'конфессии')|E] с доктриной @vampire_icon! [GetDoctrineType('special_doctrine_ashirra_pillars_kindred').GetBaseName]\n$BULLET_WITH_TAB$#L [GetReligionByKey('roadofblood_religion').GetName]ие#! [Concept('faiths', 'конфессии')|E]\n$BULLET_WITH_TAB$@supehunter_icon! [GetFaithByKey('ikhwan_al_safa').GetAdjective]"
 game_concept_setite_primogen_desc:0 "#TOOLTIP:game_concept_primogen_desc #E Примоген#!#!-[GetTrait('setite').GetName(GetNullCharacter)|l] нуждается в хороших навыках [Concept('intrigue', 'интриг')|E], [Concept('diplomacy', 'дипломатии')|E] и [Concept('learning', 'учёности')|E].\n\nСвойства «[GetTrait('deceitful').GetName(GetNullCharacter)]», «[GetTrait('gregarious').GetName(GetNullCharacter)]» и/или «[GetTrait('zealous').GetName(GetNullCharacter)]» полезны.\n\n#help Вы можете занять эту придворную должность, только если у вас имеется свойство «[GetTrait('setite').GetName(GetNullCharacter)]» или вы исповедуете [Concept('faith', 'конфессию')|E] с [Concept('doctrine', 'доктринами')|E] «[GetDoctrineType('special_doctrine_set_pillars_kindred').GetBaseName]» или «[GetDoctrineType('special_doctrine_set_corrupted_kindred').GetBaseName]».#!"
 land_of_faith_objective_decision_custom1:0 "В [Concept('region', 'регионе')|E] [GetGeographicalRegion('pod_lands_of_faith').GetName] не должно быть «злых» независимых персонажей-[Concept('landed', 'землевладельцев')|E], например, вампиров, демонов и т.д. #weak (если только их конфессия не имеет доктрину [GetDoctrineType('special_doctrine_against_to_apophis_hostility').GetBaseName])#!"
 land_of_faith_objective_decision_custom2:0 "В [Concept('region', 'регионе')|E] [GetGeographicalRegion('pod_lands_of_faith').GetName] не должно быть никаких персонажей-[Concept('landed', 'землевладельцев')|E], например, вампиров, демонов, охотников и т.д. #weak (если только их конфессия не имеет доктрину [GetDoctrineType('special_doctrine_against_to_apophis_hostility').GetBaseName])#!"
 last_meal_before_midnight_objective_decision_custom1:0 "Не должно быть [Concept('characters', 'персонажей')|E]-[Concept('landed', 'землевладельцев')|E] с доктриной [GetDoctrineType('special_doctrine_against_to_apophis_hostility').GetBaseName]"
