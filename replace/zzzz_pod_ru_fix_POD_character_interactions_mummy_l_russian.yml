 POD_spell_of_life_interest_tt:0 "Верно хотя бы одно из следующих условий: \n$EFFECT_LIST_BULLET$[GetTrait('eternal_rebirth_seeker').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$Имеет свойство [GetTrait('shemsuheru').GetName( GetNullCharacter )], [GetTrait('banemummy').GetName( GetNullCharacter )], [GetTrait('cabiri').GetName( GetNullCharacter )] или [GetTrait('custom_mummy_dynasty').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$Имеет свойство [GetTrait('setite').GetName( GetNullCharacter )], [GetTrait('asekh_sen').GetName( GetNullCharacter )] или [GetTrait('banemummy').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$ — это [neteru|E]\n$EFFECT_LIST_BULLET$Религия — #TOOLTIP:RELIGION,amenti_religion #L Западная Мумия#!#!#!\n$EFFECT_LIST_BULLET$[faith|E] имеет [GetDoctrineType('special_doctrine_against_to_apophis_hostility').GetBaseName], [GetDoctrineType('special_doctrine_osirian_league').GetBaseName], [GetDoctrineType('special_doctrine_set_pillars_kindred').GetBaseName], [GetDoctrineType('special_doctrine_set_corrupted_kindred').GetBaseName] или [GetDoctrineType('special_doctrine_allied_to_apophis_hostility').GetBaseName]\n$EFFECT_LIST_BULLET$#TOOLTIP:POD_is_scholarly_tt #L Учёность (см. подсказку) #!#!\n$EFFECT_LIST_BULLET$Имеет свойство [GetTrait('tremere').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$Религия #TOOLTIP:RELIGION,talmahera_religion #L Тал’Ма’Ра#!#!#!\n$EFFECT_LIST_BULLET$[faith|E] имеет [GetTenetType('tenet_knowledge_above_all').GetBaseName]\n$EFFECT_LIST_BULLET$Исповедует [GetFaithByKey('judge').GetName] и принято решение $judge_research_origins_mummies_objective_decision$\n$EFFECT_LIST_BULLET$Исповедует [GetFaithByKey('ikhwan_al_safa').GetName] и принято решение $ikhwan_al_safa_egypt_objective_decision$"
