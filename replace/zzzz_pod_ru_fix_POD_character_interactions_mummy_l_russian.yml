 POD_elixir_of_eternal_life_understanding_tt:0 "Верно хотя бы одно из следующих условий: \n$EFFECT_LIST_BULLET$[GetTrait('eternal_rebirth_seeker').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$[learning_i] [learning|E] #color_white 20#!+\n$EFFECT_LIST_BULLET$[GetTrait('education_learning_4').GetName( GetPlayer )] или [GetTrait('education_learning_5').GetName( GetPlayer )]\n$EFFECT_LIST_BULLET$Не менее #color_white 20 #![crafting_brewing|E] #weak ([GetTrait('pod_crafter').GetName( GetNullCharacter )])#! [trait_level_track_xp|E]\n$EFFECT_LIST_BULLET$[faith|E] имеет [GetTenetType('tenet_knowledge_above_all').GetBaseName]\n$EFFECT_LIST_BULLET$[GetTrait('sorcerer').GetName( GetPlayer )] или [GetTrait('bloodsorceryadvanced').GetName( GetPlayer )]\n$EFFECT_LIST_BULLET$[GetPerk( 'chi_arts_chi_mastery_perk' ).GetName( GetPlayer )] или [GetPerk( 'way_of_ten_thousand_cities_perk' ).GetName( GetPlayer )]\n$EFFECT_LIST_BULLET$#TOOLTIP:POD_is_scholarly_tt #L Учёность (см. подсказку)#!#!"
 POD_is_scholarly_tt:0 "Верны как минимум 5 из следующих утверждений: \n$EFFECT_LIST_BULLET$[learning_i] [learning|E] #color_white 25#!+\n$EFFECT_LIST_BULLET$[learning_i] [learning|E] #color_white 35#!+\n$EFFECT_LIST_BULLET$[learning_i] [learning|E] #color_white 50#!+\n$EFFECT_LIST_BULLET$[GetTrait('diligent').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$[GetTrait('education_learning_1').GetName( GetNullCharacter )] или лучше\n$EFFECT_LIST_BULLET$Имеет свойство [GetTrait('education_learning_4').GetName( GetNullCharacter )] или лучше\n$EFFECT_LIST_BULLET$Имеет свойство [GetTrait('education_learning_5').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$Имеет свойство [GetTrait('erudite').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$Имеет свойство [GetTrait('theologian').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$Имеет свойство [GetTrait('lifestyle_mystic').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$Имеет свойство [GetTrait('lifestyle_physician').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$Имеет свойство [GetTrait('intellect_good_3').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$Имеет свойство [GetTrait('journaller').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$Имеет свойство [GetTrait('shrewd').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$Обладает ученым двором\n$EFFECT_LIST_BULLET$[faith|E] ценит [GetTenetType('tenet_knowledge_above_all').GetBaseName]\n$EFFECT_LIST_BULLET$[faith|E] ценит [GetTenetType('tenet_pursuit_of_knowledge').GetBaseName]\n$EFFECT_LIST_BULLET$Культура - это #TOOLTIP:CULTURE_PILLAR,ethos_spiritual #L духовная#!#!\n$EFFECT_LIST_BULLET$В державе есть центр знаний #weak ([county|E] с минимум 50 [development|E])#!\n$EFFECT_LIST_BULLET$#color_white 2000#!+ лет жизни позволили достичь мастерства, превосходящего возможности смертного."
