 POD_elixir_of_eternal_life_interest_tt:0 "Верно хотя бы одно из следующих условий: \n$EFFECT_LIST_BULLET$[GetTrait('eternal_rebirth_seeker').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$Имеет свойство [GetTrait('wutian').GetName( GetNullCharacter )], [GetTrait('wukuei').GetName( GetNullCharacter )] или [GetTrait('kueijin').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$Является [GetTrait('sorcerer').GetName( GetNullCharacter )] или имеет как минимум #color_white 20 #![crafting_brewing|E] #weak ([GetTrait('pod_crafter').GetName( GetNullCharacter )])#! [trait_level_track_xp|E]\n$EFFECT_LIST_BULLET$[faith|E] имеет [GetDoctrineType('doctrine_fera_beast_courts').GetBaseName]\n$EFFECT_LIST_BULLET$[faith|E] имеет [GetDoctrineType('special_doctrine_against_to_yomi_wan_hostility').GetBaseName]\n$EFFECT_LIST_BULLET$[faith|E] имеет [GetDoctrineType('special_doctrine_allied_to_yomi_wan_hostility').GetBaseName]\n$EFFECT_LIST_BULLET$Принадлежит к [GetReligionFamily('rf_kueijin').GetName] [religion|E]\n$EFFECT_LIST_BULLET$Религия — это восточная религия, такая как #TOOLTIP:RELIGION,demon_hunters_religion #L Охотники на демонов#!#!#! или #TOOLTIP:RELIGION,roadofunexaminedhorizons_religion #L Дорога неизведанных горизонтов#!#!#!"
 POD_elixir_of_eternal_life_teach_interaction_cant_teach_requirement:0 "#color_white Вы#! должны быть готовы и способны обучить созданию эликсира вечной жизни."
