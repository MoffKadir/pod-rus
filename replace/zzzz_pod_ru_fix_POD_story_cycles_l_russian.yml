l_russian:
 POD_asakku_depth_accumulation:0 "Наблюдатель у колодца"
 POD_asakku_depth_accumulation_desc:0 "Сущность, более древняя, чем память, заметила вашу кровь. Вы не знаете, что это: лихорадка Зверя или демоны из забытых эпизодов Книги Бытия. Но вам страшно выяснить правду, пока нечто подбирается всё ближе к самой вашей душе."
 POD_asakku_story_custom_string:0 "Заражение Анделеона Асакку представлено следующим уникальным содержимым.\n\n#bold Порча Асакку#! отражает власть сущности над вами: это значение от 1 до 100, отображаемое в модификаторе персонажа. Оно медленно растёт со временем и быстрее — когда вы действуете в интересах сущности. Четыре порога — #bold 25, 50, 75,#! и #bold 100#! — отмечают необратимые перемены: новое свойство, новые способности и возрастающее внимание тех, кто охотится на носителей заразы.\n\n#bold Распространение Асакку#! — Изменчивость служит способом передачи сущности. Персонажи, владеющие этой дисциплиной, уязвимы для заражения. Происки [soul_infection|E] внедряют присутствие сущности в носителя, который может быть согласен на это или даже не подозревать о происходящем. Когда превращение в Асакку завершено, [blood_inception|E] действует быстрее, но требует пленённой цели.\n\n#bold Теневой крестовый поход#! — Тал'Махе'Ра знает, кто вы. По мере усиления порчи против вас выступят Элиуды — Сородичи, обученные выявлять и устранять заразу.\n\n#bold Наблюдатель у колодца#! — четыре цели кампании направляют распространение Асакку: разнести заразу, усилить порчу, захватить древние центры власти и подчинить восточных охотников. Каждый этап требует всё большего от мира и от вас."
 POD_asakku_story_depth_label:0 "Порча Асакку"
 POD_asakku_story_depth_max_label:0 "Господство Iryi"
 POD_asakku_story_depth_min_label:0 "Нетронутый"
 POD_maryb_story:0 "#glow_color:{0.75,0.5,0.21,0.5} Чёрная мечта#!"
 POD_maryb_story_ashgold_body:0 "Там, где были Мэри и Михаил, теперь стоит нечто иное, откликающееся на оба имени. Ни один из них не исчез; ни один не победил. Созданное ими существо смотрит на мир одной парой глаз, а власть над ним переходит от одного к другому, словно с приливом, которому не может повелевать ничья воля.\n\nТеперь мы можем восстановить Троицу. Нам понадобятся персонажи на должностях «[GetCourtPositionType('pillar_of_darkness_court_position').GetName()]» и «[GetCourtPositionType('pillar_of_light_court_position').GetName()]»."
 POD_maryb_story_balance_label:0 "Мэри и Михаил"
 POD_maryb_story_balance_max_label:0 "#P Господство Мэри#!"
 POD_maryb_story_balance_min_label:0 "#shinygold Господство Михаила#!"
 POD_maryb_story_custom_string:0 "[Story.GetOwner.Custom('POD_maryb_story_phase')]"
 POD_maryb_story_desc:0 "Три таблички и путь, ведущий к часовне под собором Святой Софии. Мэри Чёрная вновь проходит его."
 POD_maryb_story_phase_ashgold_mary:0 "$POD_maryb_story_ashgold_body$\n\nСейчас на мир смотрит Мэри: глаза потемнели, прежний голод таится под самой кожей."
 POD_maryb_story_phase_ashgold_michael:0 "$POD_maryb_story_ashgold_body$\n\n#shinygold Сейчас на мир смотрит Михаил: взгляд уверенный, прежнее сияние потускнело до блеска полированного золота.#!"
 POD_maryb_story_phase_ashgold_neutral:0 "$POD_maryb_story_ashgold_body$"
 POD_maryb_story_phase_blackdream:0 "Таблички прочитаны, четвёртая написана, и тишина часовни принадлежит только вам. История Михаила теперь обрела конец. Мечта теперь ваша; остался лишь один вопрос: насколько она может испортиться, прежде чем превратится в Кошмар?"
 POD_maryb_story_phase_seconddream:0 "#shinygold Мэри Чёрная мертва. Всегда существовала лишь Мечта и женщина, которая принесла её домой. Теперь я ношу плоть, которую она сберегла для меня. Твоя кровь Баали ещё может пригодиться. Я совершу [Concept('receive_into_the_dream', 'повторное Становление')|E] всего мира, приняв его в Мечту.#!"
 POD_maryb_story_phase_seeking:0 "Части вас рассеяны по городам Леванта и заключены в глине. Две таблички, написанные вашей собственной кровью, и одна, начертанная рукой мёртвого жреца, ждут в городах #bold [GetTitleByKey('c_damascus').GetNameNoTier]#!, #bold [GetTitleByKey('c_mosul').GetNameNoTier]#! и #bold [GetTitleByKey('c_baghdad').GetNameNoTier]#!. Захватите город, найдите табличку — и ещё одна частица той, кем она была, вернётся к вам.\n\n#shinygold Всё это ведёт обратно ко мне, возлюбленная. Ты увидишь.#!"
 POD_maryb_story_phase_stylus:0 "Три таблички найдены, три погребённые жизни вспомнились, а влажная глина четвёртой лежит под её рукой. В Леванте больше нечего искать. Осталось взять стилос, написать концовку и, занеся его над глиной, решить, чьей концовкой она станет.\n\n#shinygold Когда будешь готова, возлюбленная. Я ждал дольше, чем ты можешь представить.#!"
 POD_maryb_story_tablets_label:0 "Найдено табличек"
 POD_maryb_story_tablets_max_label:0 "Все три"
 POD_maryb_story_tablets_min_label:0 "Нет"
 POD_story_elixir_of_eternal_life_explanation:0 "Поиски [Concept('POD_elixir_of_eternal_life', 'эликсира вечной жизни')|E]"
 POD_story_elixir_of_eternal_life_explanation_complete:0 "Совершив подвиг, удававшийся лишь немногим, вы открываете для себя новые возможности. [Concept('character_interaction', 'Взаимодействия персонажей')|E] позволяют вам создавать новых существ категории «$POD_splat_mummy_plural$», просить других создать существ категории «$POD_splat_mummy_plural$» или обучать других эликсиру вечной жизни. Цели могут предлагать интересные пути или позволять вам передавать знания об эликсире вечной жизни, если это в настоящее время ограничено. Возможно, у вас даже будет возможность постичь другую форму эликсира.\n\nС такой силой мир лежит у ваших ног. Создадите ли вы расу мумий, чтобы осуществить свою ужасную месть или изменить мир по своему образу? Сохраните ли вы равновесие или нарушите его? Разорвёте ли завесу между жизнью и смертью? Попытаетесь ли вы найти способ изучить обе формы эликсира вечной жизни?"
 POD_story_elixir_of_eternal_life_explanation_custom_string:0 "[GuiScope.SetRoot(Story.GetOwner.MakeScope).AddScope('story',Story.MakeScope).Custom('PODEoELInProgressQuest')]"
 POD_story_elixir_of_eternal_life_explanation_desc:0 "Эликсир вечной жизни позволяет создавать существ категории «$POD_splat_mummy_plural$», даруя им бессмертие через цикл смерти и возрождения. Лишь немногие постигли эту тайну. Если вы хотите присоединиться к их числу, вам предстоит долгий путь."
 POD_story_elixir_of_eternal_life_explanation_inprogress:0 "Если вы хотите самостоятельно изучить эликсир вечной жизни, вам нужно будет пройти долгие поиски и накопить больше [trait_level_track_xp|E] на пути «Эликсир вечной жизни» свойства « [GetTrait('eternal_rebirth_seeker').GetName( GetPlayer )]».\n\n#T В поисках Дао#!\n[GuiScope.SetRoot(Story.GetOwner.MakeScope).AddScope('story',Story.MakeScope).Custom('PODEoELStage1Desc')]\n\n#T Собирание небесных тайн#!\n[GuiScope.SetRoot(Story.GetOwner.MakeScope).AddScope('story',Story.MakeScope).Custom('PODEoELStage2Desc')]\n\n#T Четверное искушение#!\nСразу после достижения 90 [trait_level_track_xp|E], 4 [Glossary('повелителей Яма','podgloss.yamaking')] сделают вам предложение, от которого вы не сможете отказаться.\n\n#T Восхождение за пределы смертности#!\n[GuiScope.SetRoot(Story.GetOwner.MakeScope).AddScope('story',Story.MakeScope).Custom('PODEoELStage4Desc')]\n\n#R Будьте готовы пожертвовать всем в поисках истинного бессмертия, ибо путь таит в себе опасность!#![GuiScope.SetRoot(Story.GetOwner.MakeScope).AddScope('story',Story.MakeScope).Custom('PODEoELStage3Task')][GuiScope.SetRoot(Story.GetOwner.MakeScope).AddScope('story',Story.MakeScope).Custom('PODEoELRecommendDesc')]"
 POD_story_elixir_of_eternal_life_explanation_stage1_brief:0 "Первый этап предлагает 3 пути, состоящих из нескольких решений. Завершение всего пути может принести награды на более поздних этапах."
 POD_story_elixir_of_eternal_life_explanation_stage1_full:0 "Первый этап предлагает 3 пути, каждый из которых состоит из 3 решений. Не все пути доступны каждому персонажу и на всех начальных датах. Завершение всего пути может принести награды на более поздних этапах. \n#bold Медитация и внутренняя алхимия#!\n$BULLET_WITH_TAB$Избавьтесь от отрицательных свойств здоровья и стресса и стремитесь получить свойство [GetTrait('whole_of_body').GetName(GetPlayer)]\n$BULLET_WITH_TAB$Избавьтесь от чрезмерных свойств личности, получите положительное свойство стресса и свойство [GetTrait('whole_of_body').GetName(GetPlayer)]\n$BULLET_WITH_TAB$Завершите образы жизни одного из навыков и отделитесь от мира\n#bold Ритуалы и внешняя алхимия#!\n$BULLET_WITH_TAB$Соберите владения с разными типами местности и получите свойство [GetTrait('lifestyle_gardener').GetName(GetPlayer)] или [GetTrait('lifestyle_herbalist').GetName(GetPlayer)]\n$BULLET_WITH_TAB$Собирайте артефакты с разными бонусами к навыкам, исследуйте [umbra|E] или связывайте призраков\n$BULLET_WITH_TAB$Собирайте артефакты с разными мощными бонусами к навыкам или обзаведитесь [Concept('spirit_companion', 'духами-компаньонами')|E]\n#bold Отношения и поддержание жизни#!\n$BULLET_WITH_TAB$Развивайте свою державу и добивайтесь благосклонности вассалов\n$BULLET_WITH_TAB$Установите близкие отношения с умелыми персонажами\n$BULLET_WITH_TAB$Обретите силу действовать — и воздержитесь от действия"
 POD_story_elixir_of_eternal_life_explanation_stage2_brief:0 "Достигнув 30 [trait_level_track_xp|E], завершите [journeys|E], чтобы получить подсказки, и медитируйте, чтобы приблизиться к совершенству."
 POD_story_elixir_of_eternal_life_explanation_stage2_full:0 "Достигнув 30 [trait_level_track_xp|E], вы больше не сможете принимать решения предыдущих путей. Вместо этого завершите [journeys|E], чтобы получить подсказки, и медитируйте с помощью [decision|E], чтобы приблизиться к совершенству. Особенно образованные или искусные в магии персонажи могут пассивно изучать Эликсир и расширять свои знания. Кроме того, благочестие и легендарная слава позволяют пассивно получать некоторые знания, тогда как высокий ужас и тирания затрудняют продвижение."
 POD_story_elixir_of_eternal_life_explanation_stage3_notask:0 ""
 POD_story_elixir_of_eternal_life_explanation_stage3_task:0 "\n\nЧтобы продвинуться дальше, #T #X ВЫЖИВИТЕ ИЛИ СДАЙТЕСЬ!#!#!"
 POD_story_elixir_of_eternal_life_explanation_stage4_brief:0 "Если вы выживете, вам придется либо убедить Восьмерых Бессмертных даровать вам недостающие части эликсира, либо отвоевать себе место в аду Йоми."
 POD_story_elixir_of_eternal_life_explanation_stage4_full:0 "Чтобы завершить эликсир вечной жизни, вам нужно будет связать его с царством в землях мертвых. Такое царство будет служить вашим [UmbraGlossary('shadow_realm')] и обеспечит духов, которые будут вселены в созданных вами существ категории «$POD_splat_mummy_plural$». Однако, хотя Заклинание может быть привязано к любому месту, только Врата Рая и Тысяча адов могут удерживать души Бессмертных Срединного царства. Вам нужно будет убедить владыку царства позволить вам связать с ним эликсир. Несколько безумцев пытались изучить обе версии Эликсира, но никому не удалось совершить этот подвиг. Говорят, что человек не может служить двум господам; возможно, вы докажете обратное."
 POD_story_lunar_auspice_ahroun:0 "Гнев полнолуния"
 POD_story_lunar_auspice_ahroun_desc:0 "Классный текст"
 POD_story_lunar_auspice_ahroun_extra_text:0 "$TAB$#FONT:PODSubtitles;size:24 Гнев полнолуния#!\n\nИз всех $glossary_fera$ $POD_splat_garou$ самые воинственные. Но даже среди них Аруны стоят особняком. Примите свое наследие, покажите миру свой [prowess|E|l]!\n\nАруны заслуживают благосклонность сущности «$glossary_luna$», побеждая в [pod_combat_encounters_with_icon|E] у противников с таким же мастерством. Победы над слабыми не приносят славы. Чем сильнее цель, тем больше вы получите [trait_level_track_xp|E].\n\nДругим персонажам можно бросить вызов через [character_interaction|E] #V «$POD_rhythm_of_war_interaction$»#!. Эти [pod_combat_encounters_with_icon|E] почти всегда смертельны, только другие $POD_splat_garou$ могут соглашаться на несмертельные поединки, и в этом случае награда будет уменьшена.\n\nВаш [GetModifier('POD_werewolf_form_crinos_modifier').GetNameWithTooltip][prowess_i|E]: [Story.GetOwner.MakeScope.ScriptValue('POD_ahroun_true_prowess')|V0]\nСамая слабая подходящая цель[prowess_i|E]: [Story.GetOwner.MakeScope.ScriptValue('POD_ahroun_target_prowess_min')|V0]"
 POD_story_lunar_auspice_ahroun_powerful_target_list:0 "Достойные враги в вашей местности"
 POD_story_lunar_auspice_ahroun_target_list:0 "Враги поблизости"
 POD_story_lunar_auspice_galliard:0 "Сказание Округлённой Луны"
 POD_story_lunar_auspice_galliard_desc:0 "Классный текст"
 POD_story_lunar_auspice_galliard_extra_text:0 "$TAB$#FONT:PODSubtitles;size:24 Сказание Округлённой Луны#!\n\nПесни повествуют о минувших днях, счастливых временах и мучительных событиях, о героях и злодеях. Прислушайтесь к песням Галлиардов: они поют о прошлом и о вашем будущем. Смотрите, как их песни оживляют слова и определяют вашу судьбу.\n\nГаллиарды заслуживают благосклонность сущности «$glossary_luna$», сплетая #clickable песни#! с помощью [Concept('character_interaction', 'взаимодействия персонажа')|E] #V «Первобытная песня»#!. Чем больше в песне #clickable куплетов#!, тем больше вы получаете [Concept('trait_level_track_xp', 'опыта')|E].\n\nПодготовка #clickable песни#! требует времени. Пока она не готова, действует штраф к восстановлению ресурса «$POD_energy_gnosis$». Её эффекты проявятся лишь после завершения подготовки."
 POD_story_lunar_auspice_galliard_song_targets:0 "Аудитория"
 POD_story_lunar_auspice_philodox:0 "Суд Полумесяца"
 POD_story_lunar_auspice_philodox_desc:0 "Классный текст"
 POD_story_lunar_auspice_philodox_extra_text:0 "$TAB$#FONT:PODSubtitles;size:24 Суд Полумесяца#!\n\nВолк опасен, но его легко обойти, обмануть или даже убить. Стая, однако, компенсирует эти недостатки численностью и слаженностью. Стаи $POD_splat_garou$ ничем не отличаются, и их эффективность зависит от Филодокса. Поведёте ли вы свою стаю к славе или в могилу?\n\nФилодоксы заслуживают благосклонность сущности «$glossary_luna$», завершая [Concept('journeys', 'путешествия')|E] #clickable «Тренировка стаи»#!. Количество полученного [Concept('trait_level_track_xp', 'опыта')|E] зависит от их [Concept('stewardship', 'управления')|E] и ранга оборотня. #clickable Тренировка стаи#! улучшается по мере продвижения в [Concept('lifestyle', 'образе жизни')|E] [lunar_auspicegifts_lifestyle|E]."
 POD_story_lunar_auspice_philodox_pack_members:0 "Члены стаи"
 POD_story_lunar_auspice_ragabash:0 "Свет новолуния"
 POD_story_lunar_auspice_ragabash_desc:0 "Классный текст"
 POD_story_lunar_auspice_ragabash_extra_text:0 "$TAB$#FONT:PODSubtitles;size:24 Свет новолуния#!\n\nКогда ночи темнеют и всевозможные чудовища выходят на охоту, находятся и те, кто выслеживает их самих. Хитрость и терпение позволят клыкам этих хищников добраться до горла добычи. Берегитесь #clickable лунного света#!: он помечает вас как их жертву.\n\nРагабаш заслуживает благосклонность сущности «$glossary_luna$», добывая [Concept('artifacts', 'артефакты')|E] #clickable «Знак Луны»#!, появляющиеся у других персонажей. Основной способ — [Concept('journey', 'путешествие')|E] #V «Кража артефакта»#!, но другие методы, например [schemes|E], тоже подходят.\n\nУ #clickable знаков#! есть [artifact_power|E], которая определяет величину награды. При наличии соответствующего достоинства также могут появляться #clickable озарённые луной знаки#!. Они уникальны и дают гораздо более ценные награды. С повышением вашего ранга среди $POD_splat_werewolf$ появляются более сильные #clickable знаки#!.\n\n#clickable Проявилось озарённых луной знаков:#! [Story.MakeScope.Var('total_moonlit_marks_spawned').GetValue|V0]/[EmptyScope.ScriptValue('POD_ragabash_moonlit_marks_max')|V0]"
 POD_story_lunar_auspice_ragabash_marks:0 "Знаки сущности «$glossary_luna$»"
 POD_story_lunar_auspice_theurge:0 "Общение Серповидной Луны"
 POD_story_lunar_auspice_theurge_desc:0 "Классный текст"
 POD_story_lunar_auspice_theurge_extra_text:0 "$TAB$#FONT:PODSubtitles;size:24 Общение Серповидной Луны#!\n\nНесмотря на тесную связь $POD_splat_garou$ с духами, многие из них не понимают всех тонкостей мира духов. Теург может провести большую часть жизни в [Concept('umbra', 'Умбре')|E], но постичь лишь малую долю её силы. Однако это не мешает им пытаться.\n\nТеурги заслуживают благосклонность сущности «$glossary_luna$», применяя [character_interaction|E] #clickable «Привязка духа»#! к своим [Concept('spirit_companions', 'духам-компаньонам')|E]. Это связывает дух с принадлежащим вам каэрном, давая провинции или графству дополнительные бонусы. Духов можно найти, исследуя любое царство в [UmbraGlossary('spirit_wilds')], призвав их или завершив [Concept('journeys', 'путешествия')|E] #V поисков духа#!."
 POD_story_lunar_auspice_theurge_spirit_companions:0 "Духи-компаньоны"
