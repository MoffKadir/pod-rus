 POD_story_spell_of_life_explanation:0 "Поиски [Concept('POD_spell_of_life', 'Заклинания Жизни')|E]"
 POD_story_spell_of_life_explanation_blocked_recommend:0 ""
 POD_story_spell_of_life_explanation_complete:0 "Совершив подвиг, удававшийся лишь немногим, вы открываете для себя новые возможности. [Concept('character_interaction', 'Взаимодействия персонажей')|E] позволяют вам создавать новых существ категории «$POD_splat_mummy_plural$», просить других создать существ категории «$POD_splat_mummy_plural$» или обучать других Заклинанию Жизни. Цели могут предложить интересные пути или позволить вам передавать знания о Заклинание Жизни, если это в настоящее время ограничено.\n\nС такой силой мир лежит у ваших ног. Создадите ли вы расу мумий, чтобы осуществить свою ужасную месть или изменить мир по своему образу? Сохраните ли вы равновесие или нарушите его? Разорвёте ли завесу между жизнью и смертью?"
 POD_story_spell_of_life_explanation_custom_string:0 "[GuiScope.SetRoot(Story.GetOwner.MakeScope).AddScope('story',Story.MakeScope).Custom('PODSoLInProgressQuest')]"
 POD_story_spell_of_life_explanation_desc:0 "Заклинание Жизни позволяет создавать существ категории «$POD_splat_mummy_plural$», даруя им бессмертие через цикл смерти и возрождения. Лишь немногие постигли эту тайну. Если вы хотите присоединиться к их числу, вам предстоит долгий путь."
 POD_story_spell_of_life_explanation_inprogress:0 "Если вы хотите изучить Заклинание Жизни самостоятельно, вам нужно будет пройти долгие поиски и накопить больше [trait_level_track_xp|E] на пути Заклинания Жизни свойства « [GetTrait('eternal_rebirth_seeker').GetName( GetPlayer )]». \n\n#T Обращение к Древним#!\n[GuiScope.SetRoot(Story.GetOwner.MakeScope).AddScope('story',Story.MakeScope).Custom('PODSoLStage1Desc')]\n\n#T Утраченные фрагменты#!\n[GuiScope.SetRoot(Story.GetOwner.MakeScope).AddScope('story',Story.MakeScope).Custom('PODSoLStage2Desc')]\n\n#T Привратники#!\nСразу после достижения 90 [trait_level_track_xp|E] на вас нападут несколько фракций, стремящихся украсть ваши исследования и наказать вас за высокомерие.\n\n#T Рождение вечности#!\n[GuiScope.SetRoot(Story.GetOwner.MakeScope).AddScope('story',Story.MakeScope).Custom('PODSoLStage4Desc')]\n\n#R Будьте готовы пожертвовать всем в поисках истинного бессмертия, ибо путь таит в себе опасность!#![GuiScope.SetRoot(Story.GetOwner.MakeScope).AddScope('story',Story.MakeScope).Custom('PODSoLStage3Task')][GuiScope.SetRoot(Story.GetOwner.MakeScope).AddScope('story',Story.MakeScope).Custom('PODSoLRecommendDesc')]"
 POD_story_spell_of_life_explanation_stage1_brief:0 "Первый этап предлагает 4 пути, состоящих из нескольких решений. Завершение всего пути может принести награды на более поздних этапах."
 POD_story_spell_of_life_explanation_stage1_full:0 "На первом этапе доступны 4 пути, каждый из которых состоит из 3 решений. Некоторые персонажи уже сделали первые шаги на одном из путей. Не все пути доступны каждому персонажу и на всех начальных датах. Завершение всего пути может принести награды на более поздних этапах.\n#bold Гор#!\n$BULLET_WITH_TAB$Предложите Гору Нижний Египет\n$BULLET_WITH_TAB$Убедите Гора помочь вам\n$BULLET_WITH_TAB$Устраните угрозу сетитов\n#bold Кеминтири#!\n$BULLET_WITH_TAB$Подружитесь с Кеминтири, получите фрагменты Исиды и захватите ключевые владения\n$BULLET_WITH_TAB$Найдите старых друзей Кеминтири\n$BULLET_WITH_TAB$Уничтожьте Дом Таварет\n#bold Кабир#!\n$BULLET_WITH_TAB$Получите Тайные письмена Кабира\n$BULLET_WITH_TAB$Изучите колдовство и наймите колдунов\n$BULLET_WITH_TAB$Ослабьте угрозу, которую Тремер представляют для Кабира\n#bold Эксперименты#!\n$BULLET_WITH_TAB$Пытайте пленённую мумию и некоторых потенциальных колдунов\n$BULLET_WITH_TAB$Убедите свою семью или единоверцев помочь вам\n$BULLET_WITH_TAB$Заключите в тюрьму большое количество людей, добудьте несколько артефактов и завоюйте густонаселенную землю"
 POD_story_spell_of_life_explanation_stage2_brief:0 "Достигнув 30 [Concept('trait_level_track_xp', 'очков опыта')|E], отправляйтесь в [Concept('journeys', 'путешествия')|E], чтобы найти подсказки, и учитесь под руководством тех немногих, кто знает хотя бы отрывок из Заклинания Жизни."
 POD_story_spell_of_life_explanation_stage2_full:0 "Накопив 30 [Concept('trait_level_track_xp', 'очков опыта')|E], вы больше не сможете принимать решения предыдущих путей. Вместо этого отправляйтесь в [Concept('journeys', 'путешествия')|E], чтобы получить подсказки и учиться у тех немногих, кто знает хотя бы отрывок из Заклинания Жизни. Особенно образованные или искусные в магии персонажи могут пассивно изучать Заклинание и расширять свои знания. Кроме того, те, кто близок к существам категории «$POD_splat_mummy_plural$», а также владельцы определённых [counties|E] #TOOLTIP:MUMMY_SOL_PASSIVE_county_explanation #L связанных со смертью Осириса#!#!, будут пассивно получать некоторые знания."
 POD_story_spell_of_life_explanation_stage3_notask:0 ""
 POD_story_spell_of_life_explanation_stage3_task:0 "\n\nЧтобы продвинуться дальше, #T #X ВЫЖИВИТЕ!#!#!"
 POD_story_spell_of_life_explanation_stage4_brief:0 "Если вы выживете, вам нужно будет обрести [UmbraGlossary('shadow_realm')], чтобы вы могли завершить Заклинание Жизни. Его природа определит судьбу и сущность созданных вашим заклинанием существ категории «$POD_splat_mummy_plural$»."
 POD_story_spell_of_life_explanation_stage4_full:0 "Вам потребуется обрести [UmbraGlossary('shadow_realm')], чтобы вы могли завершить Заклинание Жизни, привязав ритуал к этому царству. Его природа определит судьбу и сущность созданных вашим заклинанием существ категории «$POD_splat_mummy_plural$». Если вы не присоединитесь к древнему и устойчивому царству, такому как [UmbraGlossaryLocalized('dark_kingdom_of_sand','Аменти')], вам придется сражаться с ордами #TOOLTIP:GAME_TRAIT,spectre,[GetNullCharacter] #L Спектров#!#!, прежде чем вы сможете завершить свои поиски. Это опасно даже для сильнейшего правителя."
 POD_story_spell_of_life_explanation_using_recommend:0 "\n\n#help Если вы передадите свои знания другому, то сможете предложить ему применить их на вас.#!"
