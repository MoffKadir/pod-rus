 POD_embrace.450.desc.mokole:0 "$POD_embrace.450.desc.intro$Борьба с $glossary_fera$ — это всегда риск для вампира, но это нечто большее. Существо чистой безудержной резни теперь бросается на вас. В звере не остается ни мыслей, ни чувств, ни милосердия. \nТолько инстинкт гонит его вперед, и этот инстинкт направлен на то, чтобы уничтожить тебя."
