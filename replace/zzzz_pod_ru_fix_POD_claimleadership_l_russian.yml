l_russian:
 POD_claimleadership_events.1.a:0 "Давайте сделаем это!"
 POD_claimleadership_events.1.b:0 "Давайте не будем торопиться."
 POD_claimleadership_events.1.desc:0 "План прост: показать, кто действительно достоин звания $PODWarOfSeasonsLeader_autumn$. Это можно сделать разными способами, и каждый из них будет использован, кроме убийства. Ведь я не дикарь..."
 POD_claimleadership_events.1.t:0 "Притязание на титул $PODWarOfSeasonsLeader_autumn$"
 POD_claimleadership_events.2.a:0 "Завтра [target.GetSheHe] ждет приятный сюрприз!"
 POD_claimleadership_events.2.b:0 "Какая разница, что они знают? Я всё равно победил!"
 POD_claimleadership_events.2.desc:0 "Все пошло по плану, и вся репутация [target.GetNamePossessive] сгорела дотла. Теперь все знают, что я [GetPlayer.GetName] настоящий $PODWarOfSeasonsLeader_autumn$"
 POD_claimleadership_events.2.t:0 "Притязание на титул $PODWarOfSeasonsLeader_autumn$"
 POD_claimleadership_events.3.a:0 "О нет..."
 POD_claimleadership_events.3.desc:0 "НЕТ НЕТ НЕТ, эти идиоты! Они потерпели неудачу! Репутация [target.GetNamePossessive] остается незапятнанной моими различными попытками! И что хуже всего? Я выгляжу жалко!"
 POD_claimleadership_events.3.t:0 "Претензия на титул $PODWarOfSeasonsLeader_autumn$: неудача"
