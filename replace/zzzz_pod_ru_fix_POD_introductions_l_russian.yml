l_russian:
 moncada_influence:0 "Сделки Монкады"
 podintroductions.2305.t:0 "Dictum Mortuum"
 podintroductions.361.a:0 "Моя история еще не окончена."
 podintroductions.361.desc:0 "Гордая и прекрасная Мелюзина, роскошь Винчестера не сможет смягчить боль вашего изгнания. Вы, легендарная «Фея Лузиньяна», готовы рассказать великие истории о своем прошлом каждому, кто будет слушать. Те, кто достаточно глуп, чтобы подвергнуть сомнению ваше происхождение, вместо этого получат ваш холодный гнев и презрение. \n\nКогда-то вы были доминирующим Тореадором в Анжу, и вы безрассудно играли в политическую игру во Франции. К сожалению, распад империи смертных и вражда вашей сестры по крови Изуды заслужили для вас путешествие в один конец через Ла-Манш. Эта неудача не смирила вас. Вы завоевали Винчестер, свергнув Роджера Фиц-Уильяма, но ваша кокетливая и вспыльчивая личность не принесла вам много друзей. \n\nВы ненавидите Митру за то, что он оставил ваши владения, и утверждаете, что являетесь его величайшей соперницей. Сейчас он может смеяться над вами, но вашего таланта хватило, чтобы организовать Договор Розы. Вы не позволите этому человеку оттолкнуть вас. Вы не будете забыты историей."
 podintroductions.361.t:0 "Роза Винчестера"
 podintroductions.362.a:0 "Имейте мужество, потому что пути назад не будет. Только победа! Или смерть!"
 podintroductions.362.desc:0 "Могучий Арнгрим, кровь Ролло горячится в ваших венах. Как нормандский Бруха, вы — истинный потомок викингов, которые когда-то претендовали на эту землю. Уже некоторое время вы наблюдаете, как высокомерные Вентру, самодовольные Тореадоры и узурпаторы Тремер грызут ваше право первородства. \n\nВы храбро сражались в одиночку до 1204 года, когда вы разыскали местных Гангрелов под предводительством Руни. Стоя у корней древнего дерева Орм, в том самом месте, где Ролло выковал свое королевство, вы поклялись в кровном договоре, ознаменовав рождение Альянса де л'Орм. \n\nПлоды этих отношений уже проявляются. Воспользовавшись распрями между французами и англичанами Вентру, вы захватили Кан при помощи каких-то Носферату. Но это только начало. В Байе спрятано оцепеневшее тело вашего сира. Пришло время выступить, разбудить старую кровь и вернуть Нормандию!"
 podintroductions.362.t:0 "Кровь Ролло"
 podintroductions.363.a:0 "Они пожнут то, что посеяли."
 podintroductions.363.desc:0 "Аппий Клавдий Корвус, прошедшие столетия смыли все детали вашего смертного прошлого как римлянина, оставив только темную цель, к которой вы сейчас стремитесь. Вы — существо теней, отвернувшееся от ненавистных Патриархов. Как верный агент Дастура Аноша и Затерянного племени, ваши планы подпитываются ненавистью к третьему поколению, восставшему против истинных наследников Каина. Пока предатели дремлют и играют в свои мелкие игры по всему миру, вы кланяетесь только Плачущему камню. \n\n Однако вы не какой-то рьяный дурак. Обладая огромным терпением, вы работаете над плетением грандиозного заговора. Пусть Патриархи считают себя неприкасаемыми. Это только сделает их падение слаще. \n\nВы ждали и планировали больше тысячелетия. Вы можете подождать в тени еще немного."
 podintroductions.363.t:0 "Тень Дастура Аноша"
 podintroductions.364.a:0 "Господь требует волка среди Своего стада."
 podintroductions.364.desc:0 "Праведный Геза, вы слишком хорошо знаете, насколько сокрушительна тяжесть божественного замысла. Когда-то вы были смертным королем Венгрии, публично защищая крест и тайно практиковав языческие ритуалы. Когда Булску $pod_Embraced$ вас за усердную работу на благо королевства, его кровавый поцелуй ощущался так, будто Бог покинул вас. \n\nОднако Господь действует таинственными и жестокими способами. Если Он обрёк вас быть чудовищем, чудовищем вы и станете. Точно так же, как Он сверг Люцифера в рамках Своего великого замысла, Он также приговорил вас быть адским врагом в этом мире. Вы — Его агент, которому поручено проверить силу и веру Его паствы. \n\nТеперь для вас нет слишком гнусного поступка или осквернения. Ваш садизм не является жестокостью, даже если все остальные так думают. Это священный долг. Вы — тень на земле, которая заставит Его свет сиять еще ярче. Вы чудовищная рука Бога."
 podintroductions.364.t:0 "Агент Бога"
 podintroductions.365.a:0 "@warning_icon!#X Эту опцию съели #!"
 podintroductions.365.desc:0 "Вы не жаждете крови. Кровь для здравомыслящих. Вы жаждете большего.\n\nВы — то тихое отсутствие, которое ощущается, когда не можешь вспомнить нужное слово. Вы — острые зубы, грызущие бумажную оболочку имен. Вы давно поглотили свое Истинное Имя, посчитав его гораздо слаще любого Витэ. \n\nПозвольте остальным играть в свои великие политические игры. Они еще не понимают, что в пустых пространствах между словами вы ждёте, грызёте, жаждете большего."
 podintroductions.365.t:0 "Тишина в уме"
 podintroductions.366.a:0 "Телега катится все вперед."
 podintroductions.366.desc:0 "Великий Жнец, вы родились, когда обработка почвы считалась новым искусством. Когда вас принесли в жертву какой-то забытой богине земли, это только укрепило вашу связь с землей. \n\nПо крайней мере, некоторые так думают о вас. Несомненно то, что вы — Анку. Безжалостный, преследующий кошмар, который бродит по королевству с повозкой, запряженной волами, и косой. Мелкие игры других вас нисколько не касаются. Вы просто странствуете, даже в самых опасных землях Гару, появляетесь в местах за многие мили, готовые потребовать свою кровавую десятину. \n\nИногда, когда ваши сородичи бесследно исчезают в своих убежищах, бесчисленные голоса шепчут одно слово в сознании каждого Малкавиана. \n\n#italic Анку#!."
 podintroductions.366.t:0 "Покровитель убийц"
 podintroductions.367.a:0 "Свет Господень освещает всех нас."
 podintroductions.367.desc:0 "Блаженная Алакринис, ваш путь был долгим и трагическим. Когда-то вы были кормилицей могущественного Александра Великого, и ваше сердце было разбито, когда мальчик, о котором вы заботились, приказал казнить вашего брата Клита. После этого вы пытались покончить с собой, но Ангел остановил вас, залечив ваши смертельные раны и дав вам силы. \n\nГоды странствий привели вас к свету христианства. Вы шли рядом с первыми святыми, которые распространяли веру в Галлии, и в конечном итоге утвердились в качестве князя священной земли. \n\nТеперь вы являетесь маяком надежды для всех последователей Via Caeli, образцом и наставником. Язычники и злые души могут злиться на вас, но даже они не могут отрицать ослепляющую праведную ауру, окружающую вас. Вы только надеетесь, что однажды они увидят свет, как и вы."
 podintroductions.367.t:0 "Свет во тьме"
 podintroductions.368.a:0 "Рыцари Черной Розы подчиняются только мне."
 podintroductions.368.desc:0 "Могущественный Эндрю, каиниты-зелоты с благоговением шепчут ваше имя, называя вас «Архангелом». Как великий ересиарх Рыцарей Черной Розы, вы командовали воинством Каинитской ереси, распространяя свое влияние как Епископ Нод на Францию, Шотландию и Святую Землю. \n\nТем не менее, вы смотрите на все это с крайним цинизмом. Ересь – это не какой-то божественный призыв к вам. Это всего лишь инструмент, который вы можете использовать, чтобы спровоцировать новый крестовый поход в Левант для реализации своих непостижимых планов. Рыцари не являются для Каина святыми воинами и никогда ими не были. Они — ваша частная армия. \n\nВ наши дни Церковь, к сожалению, — тонущий корабль. У вас нет планов сражаться за спасение этой гнилой веры, и вы не утонете вместе с ней. Вы спасете свои ресурсы, соберете войска и отправитесь в Святую Землю. Ересь Каинитов может исчезнуть, но воля Архангела абсолютна."
 podintroductions.368.t:0 "Кровоточащая вера"
 podintroductions.369.a:0 "Я несу стигматы, кто может отказать мне?"
 podintroductions.369.desc:0 "Ревностный Жозеф, тьма, присущая вашей крови Ласомбра, не может затмить пылающий свет Бога внутри вас. Пока ваши собратья ссорятся друг с другом, вы нашли более высокое призвание. Много лет назад вы обнаружили древние письмена странной веры и с тех пор поставили перед собой задачу распространять эту информацию, несмотря ни на что. \n\nНебеса, кажется, согласны с вами. \n\nВы практически светитесь сиянием, которое пугает ваших сородичей. Чудеса проявляются в вашем присутствии, а на холодных руках кровоточат святые стигматы. Вы несете это бремя со спокойным принятием, зная, что вы были избраны для этого священного деяния. Вскоре вы планируете отправиться в Рим и принести абсолютную, славную и устрашающую славу своей веры к самым ступеням папского престола. Мир наконец услышит Голос Избранного."
 podintroductions.369.t:0 "Человек Божий"
 podintroductions.370.a:0 "Пусть музыка заглушит тишину."
 podintroductions.370.desc:0 "Радостный Баян, вы всегда умело обращались с числами. В свои смертные дни вы были хазарским сборщиком пошлин, который в равной степени заработал и друзей, и богатство. Ваше неистовое обаяние и интеллект привлекли к вам поэта-воина Ай-Толды, который даровал вам Становление и дружбу, которую вы так лелеяли. \n\nКогда буря вашего дедсира разорвала его в клочья, ваша радость обратилась в пепел. Тишина, оставшаяся на его месте, была сокрушительной. Итак, вы полны решимости не дать ей победить. Вы — Золотая Рука, самый богатый и самый громкий из своего рода. Вы окружаете себя постоянными застольями, бесконечной музыкой и лучшим обществом, какое только можно купить за витэ. Ваш острый ум скрывается за маской шумного дурака и беззаботного пьяницы. Вы точно знаете, куда уходит каждая монета, так же, как вы точно знаете, как рассмешить своих сверстников. Для них вы — душа двора.\n\nПродолжайте смеяться и пить, Баян. Налейте вино так, чтобы оно пролилось. Пока чаша полна, вам не придется плакать."
 podintroductions.370.t:0 "Золотая рука"
 podintroductions.371.a:0 "Мы заставим их всех заплатить."
 podintroductions.371.desc:0 "Свирепый Чиксин, вы клинок и наследник Черного Ворона. Рожденный быть наемником, сражения и азарт боя — это все, что вы когда-либо знали. Именно этот талант и ваша упорная преданность привлекли внимание Чёрного Ворона. Под его суровым, но эффективным руководством вы стали ужасом на поле боя, которого мог бы бояться любой враг. Под этой высокомерной улыбкой скрывается душа, преданная вашему сиру Йиду. Вы — его правая рука, инструмент, с помощью которого древняя ненависть Йиду наконец-то обрушится на катайцев. \n\nВ то время как другие представители вашей родословной довольствуются тем, что являются простыми слугами Анда, вы и Черный Ворон в ожидании смотрите на горизонт. У Востока огромный долг, и вы получите его от имени вашего сира."
 podintroductions.371.t:0 "Молодой ворон"
 podintroductions.372.a:0 "Изоляция – это застой. Воля Сета должна пересечь все границы."
 podintroductions.372.desc:0 "Мудрый Сетерпенре, как Владыка Тинниса, вы второй по силе после великого Нахторхеба. Внутри внутреннего совета вас считают носителем древней мудрости того, кто когда-то ходил среди смертного племени Сета как талантливый колдун. \n\nОднако ваша пылкая преданность Сету не закрывает вам глаза на реальность политического ландшафта. По праву известный как Голос Разума, вы гораздо более прогрессивны и терпимы, чем ваши собратья-старейшины. Ваш общительный характер позволяет вам заглянуть за пределы Египта, приветствуя иностранцев за тот потенциал, который они привносят в ваш грандиозный замысел. Вы даже зашли так далеко, что начали развивать отношения с Тремерами, несмотря на разногласия. \n\nВаши братья и сестры могут продолжать проповедовать в изоляции. Вы понимаете, что для распространения влияния Сета открытая рука так же важна, как и слова, сказанные шепотом."
 podintroductions.372.t:0 "Голос разума"
 podintroductions.373.a:0 "Она не уйдет от меня!"
 podintroductions.373.desc:0 "Могучая Та-урт, ваши последователи почитают вас как божественное воплощение плодородия, деторождения и могущественной черной магии. В своем Храме основания вы ревностно руководите наиболее радикальными интерпретациями поклонения Сету. Хотя для большинства вы являетесь загадкой, одно, что мир $pod_cainite$ знает наверняка, — это ваша мстительная ярость. Вы ненавидите предательницу Кеминтири всеми фибрами своего существа и поклялись вернуть каждую каплю Витэ из ее вен. Вы доказали свою способность во время легендарного сражения на Красном море, одолев ее убедительно и заслужив прозвище «Победительница». \n\nОднако ваша истинная победа очень недостижима. Тело Кеминтири так и не нашли, и это подпитывает вас больше всего на свете. Ваша единственная цель сейчас — раз и навсегда уничтожить предательницу, укрепив славу Сета."
 podintroductions.373.t:0 "Победоносная богиня"
 podintroductions.374.a:0 "Мудрость — это щит, который нужен храброму воину."
 podintroductions.374.desc:0 "Смиренный Наум, ваш вечный путь начался с жажды божественного понимания. Как смертный знаток Талмуда, вы сокрушались по поводу того, что могила заберет вас прежде, чем вы сможете полностью понять божественные законы. Саулот, услышав вашу мольбу, подарил вам бесконечные ночи для поиска мудрости. \n\nС той роковой ночи ваш разум сделал вас богословом, которому нет равных. Но с кончиной Саулота клан остался брошенным на произвол судьбы и без лидера. Вы знаете, что нужен лидер, и решили встать рядом с бесстрашной Кавийей в качестве советчика и якоря. Ее боевая ярость нуждается в спокойном совете, который умерит её, и вы рады его дать. В эти ночи вас зовет долгий сон, но вы сопротивляетесь ему изо всех сил. Вы должны. Без вашей заботы вы боитесь того, что может случиться с ней и вашим кланом."
 podintroductions.374.t:0 "Мудрый совет"
 podintroductions.375.a:0 "Даже в самые темные ночи остается нежная песня."
 podintroductions.375.desc:0 "Возлюбленная Райциэль, вы всегда были нежным светом во тьме. Получив Становление от мудрейшего и любовь храбрейшего, вы всегда были сердцем своего рода. Когда Самиэль пал во время Баалийских войн, вы и Малкав были единственными, кто мог утешить Саулота. \n\nВы уже давно довольствуетесь тем, что растворились в мифе, и совершенно незаметно вышли из общества $pod_cainite$. Но те, кто внимательно слушает, могут услышать ваше вечное сострадание."
 podintroductions.375.t:0 "Нежная песня"
 podintroductions.376.a:0 "Все это закончится."
 podintroductions.376.desc:0 "Лживая Мирабель — если это даже ваше настоящее имя — вы сплели столько паутины обмана, что ваша прежняя обыденная жизнь смертной, была забыта. Это не имеет никакого значения. Ваши глаза устремлены только на одну цель. Конец света.\n\nВо времена Священной Римской империи вы проникли в свиту Ашики бинт Джифри и тайно взяли под свой контроль ее темный культ. Она всего лишь подставное лицо, пока вы дергаете за ниточки. Однако вы не используете свое влияние для мелких дел, таких как политика или домены. Нет, вы замышляете только уничтожение. Вы нашептываете грандиозные заговоры, чтобы ускорить конец дней, чтобы с удовольствием наблюдать, как горит мир."
 podintroductions.376.t:0 "Темный Кукловод"
 podintroductions.377.a:0 "Пусть Тир горит — главное, чтобы я выжила."
 podintroductions.377.desc:0 "Скрытная Танит, вы хранительница тайн Баали и любимая потомица самого Молоха. Пока он по глупости шел навстречу своей гибели в Карфагене, вы остались, чтобы править Тиром. Когда соперничающие $pod_cainites$ стали вам мешать, вы просто направили смертную армию Александра Великого в правильном направлении, сметая город дочиста по своим прихотям.\n\nМолохим скрывают самые тёмные тайны вместо того, чтобы слепо им поклоняться, но злая кровь Молоха, несмотря ни на что, течет в ваших венах. Вас тянет к невинным и чистым, и вы желаете полностью их осквернить.\n\nНесмотря на свой древний возраст и знания, вы превыше всего цените самосохранение. Поскольку Азанеаль претендует на титул Шайтана, вы вежливо принимаете его послов у себя во дворе, киваете на их просьбы и все время готовитесь к скорому исходу из Тира. Пусть отважные дураки сгорят в грядущем аду. Вы ускользнёте в тень и доживёте до следующей ночи."
 podintroductions.377.t:0 "Кроткая госпожа"
 podintroductions.378.a:0 "Никогда не иди против моей семьи."
 podintroductions.378.desc:0 "Антонио Кардона, превращение из рыцаря Святого Иоанна в проклятое существо ночи было горькой пилюлей, которую пришлось проглотить, но вы умеете приспосабливаться как никто другой. Хотя среди $pod_cainites$, ссорящихся из-за Европы, вас считают довольно молодым, вы уже начали закладывать основу для прочного предприятия. \n\nВаша кровь Вентру требует особого, интимного сорта. Кровь вашего собственного смертного рода. Хотя для большинства это может нанести вред, вы осознаете возможность. Вполне естественно обеспечить их процветание, и вы полны решимости возвысить семью Кардона до господства на вашей родине. \n\nВыбирая путь торговца, вы действуете как молчаливый, бессмертный крестный отец, дергая за ниточки торговли и крови из-за кулис. Вы медленно, но верно создаете безжалостный синдикат, который однажды захватит всю Южную Италию. В конце концов, семья – это все в этой не-жизни."
 podintroductions.378.t:0 "Семейное дело"
 podintroductions.379.a:0 "Кровь Вентру, пролитая за мой отряд."
 podintroductions.379.desc:0 "Свирепая Вильгельмина, когда-то вы были свирепой охотницей Севера, пока в ту ночь ваш длинный дом не сгорел дотла. Вы не погибли вместе со своим отрядом и с тех пор посвятили себя мести за них. Сначала вы убили глупых смертных, которые несли факелы. Затем вы пошли по следу истинных организаторов резни, охотясь за ними по всей Европе. Ваше имя достаточно быстро стало в ужасе шептаться всеми, кто был связан с вашим прошлым. \n\nТеперь над Ливонией звенят барабаны войны. Карах озвучил призыв к языческому единству, сплотив диких вампиров, чтобы разрушить Черный Крест германских Вентру. Вы присоединились не из чувства долга или единства, а просто потому, что ряды Черного Креста все еще кишат вашей добычей.\n\nПусть рыцари войдут в этот лес. Они найдут волка, готового перегрызть им глотки."
 podintroductions.379.t:0 "Волк"
 podintroductions.380.a:0 "Я должна навсегда заставить Архангела замолчать."
 podintroductions.380.a.tt:0 "Вы сосредоточитесь внутри себя, на исправлении своей психики. \n#shinygold Как вы можете избавиться от божественности? #!"
 podintroductions.380.b:0 "Танит будет моей марионеткой."
 podintroductions.380.b.tt:0 "Ваша душа будет повреждена.\n#shinygold Вы строите интриги ради крох, пока огонь сжигает вас изнутри.#!"
 podintroductions.380.desc:0 "Мэри Чёрная, сила Архангела горячо течет в ваших венах даже сейчас. Поглощение печально известного Тореадора Мафусаила разрушило Мечту вместе с ним, но это также привело к тому, что на вас стали охотиться все остальные $pod_cainite$. Поскольку мир требовал вашей головы, вы смогли найти убежище только во владениях Танит. \n\nОна, похоже, полюбила ваше Присутствие. В обмен на ваши услуги вам предоставляется убежище и защита от тех, кто пронзит ваше сердце колом. Однако крепкие стены не могут защитить от угрозы внутри вашего разума. Душа Михаила всё ещё яростно борется с вами, его сияние сталкивается с тьмой внутри вас. Вы должны решить, на что направить свое внимание. Сосредоточитесь ли вы на себе и сразитесь с Архангелом, чтобы восстановить свое пошатнувшееся здравомыслие, или сосредоточитесь на политике и сделаете себя поистине бесценным для своего милостивой хозяйки?"
 podintroductions.380.t:0 "Крик Архангела"
 podintroductions.381.a:0 "И какой это будет праздник!"
 podintroductions.381.desc:0 "Ужасающий Агирре, вы и ваша котерия путешествуете по Европе не ради каких-то высоких целей или причин, а просто для того, чтобы выследить и пожрать древнюю, могущественную кровь. \n\nВсе это густое витэ, которое старейшины оставляют себе, текущее в их старых венах... вы и ваши союзники согласны, что это просто пустая трата. Дар Каина был призван укрепить тех, кто достаточно силён, чтобы его отнять! Древние лгут, говоря, что Амарант влечет за собой ужасные последствия, но вам виднее. \n\nЛожь. Они лгут, потому что боятся. Вместе со своим возлюбленным и гончей вы все примете участие в этом кровавом банкете, который готов для вас."
 podintroductions.381.t:0 "Дети Амаранта"
 podintroductions.4.b:0 "Забыв о могуществе Бруха, Магистры расслабились..."
 podintroductions.490.a:0 "«Выжить – это уже победа…»"
 podintroductions.490.b:0 "«По воле Божией! Очистим мир от наших врагов!»"
 podintroductions.490.c:0 "«Справедливость. Надежда. Вот что я даю тебе, Португалия»."
 podintroductions.490.d:0 "«Я бы спросил дальше. Чего хотела Изебель?»"
 podintroductions.490.desc.a:0 "Со времён Карфагена Иберия была домом Бруха.\nКогда-то Ласомбра и Бруха искали гармонии со смертными.\n\nНо их предательство обескровило нас. Затем пришли римские Вентру, победили и остались — и смертные поддались их законам. \nДолго мы держались. Но затем наша предводительница [Glossary('Изебель', 'iberia_glossary.yzebel')] умерла.\n\nОна умерла, и мы чуть не сломались.\n\nВ хаосе Ласомбра воспользовались своим шансом.\nТеперь они ссорятся, и наши планы реализуются.\nВоеначальники Бруха сражаются на обеих сторонах Войны теней.\nНекоторые смутьяны, такие как [GetScriptedCharacterByHistoryID('791405').GetFirstName], стали отступниками, в то время как благородный [GetScriptedCharacterByHistoryID('790172').GetFirstName] возглавляет наших братьев в Португалии. \n\nТолько время покажет. Возможно, нашей судьбой станет неудача. \nНо дети Изебель выполнят ее желание."
 podintroductions.490.desc.b:0 "Действительно! Споры растратили годы, которые могли принести прогресс. \n\nВы должны действовать сейчас. Каким бы ни было ваше знамя, никогда не сомневайтесь в себе. \n\nЗнайте, что если вы падете, это всегда будет служить высшему благу."
 podintroductions.490.t:0 "Праведное дело"
 podintroductions.491.a:0 "«Я был неправ, спрашивая. Давайте начнем»."
 podintroductions.491.b:0 "''Кем была [Glossary('Изебель', 'iberia_glossary.yzebel')]?''"
 podintroductions.491.c:0 "«Как древние Бруха попали в Иберию?»"
 podintroductions.491.d:0 "«Мало кто упоминает нашу историю. Как мы пали?»"
 podintroductions.491.desc:0 "#emp ''Так преданная Изебель встретила топор Вентру. \nОднако она приказала своим детям. Идти дальше и не оглядываться назад. \nКарфаген никогда не был местом. Ни временем. Ни одним каинитом.\nЭто было желание. Мечта. Общая для всех — и ради всех». #!\n\nПроще говоря, Изебель олицетворяла нашу надежду на создание утопии за пределами Карфагена. \n\nНаши попытки в Иберии провалились. Но мы не потеряли нашей воли. \nЕсли вы хотите знать больше, я могу просветить вас дальше."
 podintroductions.491.e:0 "''Будьте честны. Кто из Бруха остался?''"
 podintroductions.491.t:0 "Лор: Желание Изебель"
 podintroductions.492.a:0 "«Я знаю достаточно. Давайте начнем нашу игру»."
 podintroductions.492.b:0 "«Как древние Бруха попали в Иберию?»"
 podintroductions.492.c:0 "«Мало кто упоминает о том, что произошло. Как мы пали?»"
 podintroductions.492.d:0 "''Будьте честны. Кто из Бруха остался?''"
 podintroductions.492.desc:0 "Изебель была нашим величайшим иберийским военачальником. Карфагенская пророчица с острой проницательностью, способная заглянуть в будущее.\n\nСреди первых Бруха, поселившихся в Иберии, она несла новое видение: эта утопия, а не привязанная к одному месту, могла выходить за пределы пространства и времени.\nПоначалу ее видение процветало, и многие карфагенские ласомбра присоединились к ее делу. Деспотизм разорвал союз, когда Магистры стремились к дальнейшей тирании. Итак, Изебель объединилась с неонатами Ласомбра.\nЗа этим последовало нескончаемое столкновение, которое разрешилось только тогда, когда Изебель сама убила их военачальника Зинриди.\nНо у нее больше никогда не было прежней силы.\n\nКоварные Ласомбра задумали пригласить отряд налетчиков Вентру.\nИтак, на берегах Северной Португалии Изебель встала на защиту в окружении своих потомков. \nВеры было недостаточно – и её кровью завладели. \nНикто из ее убийц не выжил. Однако месть длилась недолго.\nПосле этого Иберии не хватало руководства. И мы чуть не потеряли нашу мечту."
 podintroductions.492.t:0 "Лор: Видение Изебель"
 podintroductions.493.a:0 "«Я знаю достаточно. Давайте начнем нашу игру»."
 podintroductions.493.b:0 "«Кем была Изебель?»"
 podintroductions.493.c:0 "«Мало кто упоминает о том, что произошло. Как мы пали?»"
 podintroductions.493.d:0 "''Будьте честны. Кто из Бруха остался?''"
 podintroductions.493.desc:0 "Без сомнения, Карфаген.\nОни пошли по стопам финикийцев и греков, сначала заявив права на старейшее финикийское промышленное поселение, Гадир.\nВскоре пунические торговые и горнодобывающие аванпосты распространились по южной Иберии.\n\nИ Карфаген установил свое господство благодаря основанию города. Большой порт, расположившийся среди морских скал, вскоре стал известен как «Новый Карфаген». \nОн превратился в массивную цитадель – крупнейший город древней Иберии – который контролировал сеть поселений и портов. Обладая серебряными рудниками, Карфаген использовал свое богатство для подкупа местных иберийских племен в союзы. \n Те, кто сопротивлялся, видели, как наследники их семей оказались заложниками в его стенах. \n\n Его влияние было настолько велико, что многие иберийские наемники поддержали вторжение Ганнибала в Рим. \nДействительно, клан Бруха участвовал в Пунических войнах. Когда Карфаген потерпел неудачу, многие Бруха мигрировали в Новый Карфаген и его клиентские поселения. \nВсе в поисках нового начала…"
 podintroductions.493.t:0 "Лор: Новый Карфаген"
 podintroductions.494.a:0 "«Я знаю достаточно. Давайте начнем нашу игру»."
 podintroductions.494.b:0 "«Кем была Изебель?"
 podintroductions.494.c:0 "«Как древние Бруха попали в Иберию?»"
 podintroductions.494.d:0 "''Будьте честны. Кто из Бруха остался?''"
 podintroductions.494.desc:0 "Те, кого научили предавать, всегда предают в свою очередь.\n\nНаш союз с кланом Ласомбра перерос в распри.\nПосле гибели их военачальника Зинриди его потомки предали собственных карфагенских собратьев, чтобы вступить в сговор с римскими Вентру.\nПобеды в битве было недостаточно.\n\nРиму невозможно противостоять в полевых условиях. Но распространения восстаний было недостаточно: иберийцы стали подражать своим римским захватчикам и поклоняться им посредством ассимиляции. \n\nСкрытое на протяжении веков христианство оказалось правильным инструментом, чтобы настроить Иберию против Рима. И все же этого было недостаточно. \n\n За занавеской ждал Ласомбра. Раскручивая свой заговор, магистры даровали Становление ключевым политическим деятелям: голая схема абсурдного господства над полуостровом. \n Хуже всего то, что это было реализовано. \nВизиготы и мусульманские захватчики танцевали на их ладонях... \n\nНас обвели вокруг пальца и погубили. Но чего можно ожидать от предателей?"
 podintroductions.494.t:0 "Лор: Предательство магистров"
 podintroductions.495.a:0 "«Я знаю достаточно. Давайте начнем нашу игру»."
 podintroductions.495.b:0 "«Кем была Изебель?»"
 podintroductions.495.c:0 "«Как древние Бруха попали в Иберию?»"
 podintroductions.495.d:0 "«Мало кто упоминает о том, что произошло. Как мы пали?»"
 podintroductions.495.desc:0 "В рамках Теневой Реконкисты восстают Львы Родриго. \n\nКровожадные неонаты и анциллы, они готовы убить любого предполагаемого врага Креста – как мусульман, так и христиан.\nИх капитан – [GetScriptedCharacterByHistoryID('791405').GetFirstName], со своим потомком [GetScriptedCharacterByHistoryID('790840').GetFirstName] и лейтенантом. [GetScriptedCharacterByHistoryID('791384').GetFirstName].\nНекоторые считают их бешеными собаками. Другие — инструмент, чтобы склонить чашу весов. \n\nПосреди Аширры осталось немного Бруха. Некоторые видели в Аль-Андалусе утопию. Но когда он разрушился, мусульманские Бруха бросились контролировать Тайфу.\nОстались только двое: [GetScriptedCharacterByHistoryID('791395').GetFirstName] из Малаги и [GetScriptedCharacterByHistoryID('791390').GetFirstName], бывший князь Бадахоса.\nОба находятся в тяжелом положении… вряд ли продержатся долго.\n\nНадежда ещё остаётся в Португалии.\n\nЛиссабон принадлежит Герусии, нерешительным старейшинам. [GetScriptedCharacterByHistoryID('790171').GetFirstName] — их князь, но только по имени. \nТем не менее, в Коимбре живет еще один: [GetScriptedCharacterByHistoryID('790172').GetFirstName] Достопочтенный. Князь, завоевавший свое правление в битве с Аширрой. \nДо сих пор Гильерме добился больших успехов. \nНекоторые полагают, что он строит Новый Карфаген. Однако он оказался лишь посредником между христианами и мусульманами. \n\n Боится ли он войны? Он предпочитает ждать? \nНемногие знают его намерения. Если не появится новый лидер, Гильерме может быть нашей лучшей надеждой. Сможет ли он преодолеть наши неудачи… \nЭто еще предстоит выяснить."
 podintroductions.495.t:0 "Лор: Последний Бруха Иберии"
 podintroductions.501.a:0 "#emp A mia terra. Услышав твой голос, я бы снова забился.#!"
 podintroductions.501.b:0 "Сталь для еретика! Мы — ярость Святого Иакова!"
 podintroductions.501.c.tt:0 "[GetTitleByKey('c_santiago').GetNameNoTier] стал де-юре столицей герцогства [GetTitleByKey('d_galicia').GetNameNoTier]."
 podintroductions.501.desc:0 "Князь [GetScriptedCharacterByHistoryID('790170').GetFirstName], вы #emp обезумели#!#!.\nСтарейшинам клана не хватает единства против Аширры, они предлагают вам сыграть в их игры. Пока бездействуют, Дороги Паломничества страдают. \nБудь то оборотень или Еретик, [GetTitleByKey('d_galicia').GetNameNoTier] страдает. \n\nВ дни смертных вы держались в самый тяжелый час [GetTitleByKey('c_santiago').GetNameNoTier]. \nАль-Мансур и его воинство опустошили ваш город, унизили его жителей. Если бы не Становление, дарованное вашим сиром, вы бы погибли.\n[GetScriptedCharacterByHistoryID('505126').GetFirstName], Повелитель Иберии колеблется.\nПока его щенок [GetScriptedCharacterByHistoryID('505154').GetFirstName] шепчет яд.\nВы отворачиваетесь, чтобы погрузиться в свои первые бешеные стихи...\n#weak Но разве не близок час гнева, Рейнальдо? #!\n#beast #weak Ваша священная задача остается: растерзать неверных#!#!.\n#emp #beast Никакой пощады, ибо у них не было никакой пощады к вашим соотечественникам.#!#!\n\n''О, успокойся, моя кровь. #emp Конечно, #! разве нельзя подождать ещё один стих? Сегодня вечером звезды манят меня к овдовевшему сердцу, бьющемуся там...»"
 podintroductions.501.moncada.influence.tt:0 "Архиепископ [GetScriptedCharacterByHistoryID('505154').GetFirstName] вознаградит вас. Только продолжайте противостоять Еретику..."
 podintroductions.501.poets.tt:0 "#emp Научи меня этому ремеслу! Придите ко мне, поэты! #!\n$EFFECT_LIST_BULLET$Постройте [GetDomicileBuilding('vampire_ambassador_01').GetName] и [GetDomicileBuilding('vampire_ambassador_poets').GetName]."
 podintroductions.501.santiago.tt:0 "Укрепите свои связи со смертным Орденом Сантьяго.\n$EFFECT_LIST_BULLET$#P #emp Пока вы контролируете графство Сантьяго, сохраняйте возможность вербовать [GetMaA('knights_santiago_maa').GetName].#!#!"
 podintroductions.501.t:0 "Тем не менее, любовь тоскует"
 podintroductions.501.unchecked.tt:0 "#weak Неподконтрольным пешкам нет места на доске... #!"
 reinaldo_crusades:0 "[GetScriptedCharacterByHistoryID('790170').GetFirstName] намерен выступить в крестовый поход!"
 reinaldo_crusades_tt:0 "Я терпеть не могу и не понимаю вам подобных. Вы желаете очиститься? Да будет так..."
 reinaldo_quiet:0 "[GetScriptedCharacterByHistoryID('790170').GetFirstName] выражает свои добрые пожелания."
 reinaldo_quiet_tt:0 "Первым ли Христос или Каин... Разве мы не христиане, добрый епископ?"
 reinaldo_unchecked_moncada:0 "[GetScriptedCharacterByHistoryID('790170').GetFirstName] тебя оскорбляет! Крестовые походы против [GetTitleByKey('d_porto').GetNameNoTier]!"
 reinaldo_unchecked_moncada_tt:0 "Щенок, не думай, что ты этого заслуживаешь. Бог первым избрал #emp меня#!!"
 reinaldo_unchecked_sylvester:0 "[GetScriptedCharacterByHistoryID('790170').GetFirstName] не подчиняется тебе! Крестовые походы против [GetTitleByKey('d_porto').GetNameNoTier]!"
 reinaldo_unchecked_sylvester_tt:0 "Я устал от твоей медленной походки, мой господин. Иди сейчас, или не ходи вообще... \n$EFFECT_LIST_BULLET$[GetScriptedCharacterByHistoryID('790170').GetFirstName] больше не твой [friend|E]."
