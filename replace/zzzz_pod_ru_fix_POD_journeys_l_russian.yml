 spell_of_life_stage2_targeted_journey_astrokhen_planning_decline:0 "$POD_journey_planning_decline_default$"
 spell_of_life_stage2_targeted_journey_astrokhen_planning_desc:0 "Я [Select_CString(GetPlayer.IsFemale, 'изучила', 'изучил' )] заклинание Жизни и [Select_CString(GetPlayer.IsFemale, 'подготовилась', 'подготовился' )] как [Select_CString(GetPlayer.IsFemale, 'могла', 'мог' )], но его тонкости до сих пор ускользают от меня.\n\nЕсли я хочу овладеть им в совершенстве, мне нужен наставник.\n\nК счастью, мои разведчики подсказали мне, где найти такого наставника."
 spell_of_life_stage2_targeted_journey_astrokhen_planning_title:0 "В поисках знаний"
 spell_of_life_stage2_targeted_journey_astrokhen_travel_confirm:0 "$POD_journey_travel_confirm_spell_of_life_stage2$"
 spell_of_life_stage2_targeted_journey_astrokhen_travel_desc:0 "Я очень [Select_CString(GetPlayer.IsFemale, 'рада', 'рад' )] возможности поучиться у #TOOLTIP:CHARACTER,[GetScriptedCharacterByHistoryID('792858').GetID] #L Астрохена#!#!. $spell_of_life_stage2_targeted_journey_astrokhen_desc$"
 spell_of_life_stage2_targeted_journey_astrokhen_travel_title:0 "$POD_journey_travel_title_spell_of_life_stage2$"
 spell_of_life_stage2_targeted_journey_astrokhen_tt:0 "[GetScriptedCharacterByHistoryID('792858').GetFirstName] многому меня научит."
 spell_of_life_stage2_targeted_journey_desc:0 "Выберите кого-нибудь, у кого будете учиться."
 spell_of_life_stage2_targeted_journey_inauhaten_desc:0 "[GetScriptedCharacterByHistoryID('792605').GetFirstName] и группа магов использовали искажённую форму заклинания Жизни, чтобы превратить членов секты в ямасаттв — существ, которые, предположительно, являются личами или вампирами и которые в конечном итоге стали [GetTrait('nagaraja').GetName(GetNullCharacter)] в результате ещё одного ошибочного ритуала. Тем не менее [GetScriptedCharacterByHistoryID('792605').GetSheHe] обладает некоторыми знаниями о заклинании Жизни."
 spell_of_life_stage2_targeted_journey_inauhaten_effects:0 "Вы отправитесь на встречу с #TOOLTIP:CHARACTER,[GetScriptedCharacterByHistoryID('792605').GetID] #L Инаухатеном#!#!. Добравшись туда, вы сможете попытаться убедить [GetScriptedCharacterByHistoryID('792605').GetHerHim] взять вас в ученики."
