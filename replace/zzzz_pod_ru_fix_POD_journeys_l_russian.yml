l_russian:
 POD_journey_travel_confirm_spell_of_life_stage2:0 "Я углублю своё понимание [Concept('POD_spell_of_life', 'заклинания Жизни')|E]."
 POD_journey_travel_title_spell_of_life_stage2:0 "В поисках знаний"
 elixir_of_eternal_life_stage2_meditation_desc:0 ""
 elixir_of_eternal_life_stage2_meditation_effects:0 ""
 elixir_of_eternal_life_stage2_meditation_isvalid:0 ""
 elixir_of_eternal_life_stage2_meditation_name:0 "Медитация над вечностью"
 elixir_of_eternal_life_stage2_meditation_planning_confirm:0 "$POD_journey_planning_confirm_default$"
 elixir_of_eternal_life_stage2_meditation_planning_decline:0 "$POD_journey_planning_decline_default$"
 elixir_of_eternal_life_stage2_meditation_planning_desc:0 "Вы завершили подготовку, и теперь всё готово к началу. Вы даже нашли место, богатое энергией и тесно связанное с окружающим миром, — это ценная возможность для продолжения ваших усилий. Возможно, кто-то воспользуется вашим отсутствием, но оно того стоит."
 elixir_of_eternal_life_stage2_meditation_planning_title:0 "Подготовка завершена"
 elixir_of_eternal_life_stage2_meditation_travel_confirm:0 "$POD_journey_planning_confirm_default$"
 elixir_of_eternal_life_stage2_meditation_travel_desc:0 "Ваши основы должны быть укреплены, а знания об [Concept('POD_elixir_of_eternal_life', 'эликсире Вечного возрождения')|E] — усовершенствованы. Всё готово для того, чтобы вы могли уединиться."
 elixir_of_eternal_life_stage2_meditation_travel_title:0 "Время пришло"
 elixir_of_eternal_life_stage2_meditation_tt:0 "Я буду медитировать над [Concept('POD_elixir_of_eternal_life', 'эликсиром Вечного возрождения')|E]."
 elixir_of_eternal_life_stage2_random_journey_desc:0 "Я [Select_CString(GetPlayer.IsFemale, 'уверена', 'уверен' )], что со временем смогу усовершенствовать свои знания об [Concept('POD_elixir_of_eternal_life', 'эликсире Вечного возрождения')|E], просто добывая редкие манускрипты и переводя их. Многие тайны сокрыты среди мёртвых и в их языках. Различные маги, колдуны, алхимики, гуру и мастера уже пытались создать [Concept('POD_elixir_of_eternal_life', 'эликсир Вечного возрождения')|E], но потерпели неудачу. Я [Select_CString(GetPlayer.IsFemale, 'могла', 'мог' )] бы рыскать по руинам древних храмов и гробниц в поисках утраченных секретов, рискуя жизнью. Кроме того, я [Select_CString(GetPlayer.IsFemale, 'могла', 'мог' )] бы ускорить процесс перевода с помощью алхимии и магии, рискуя уничтожить рукопись. Медитация и варка зелий тоже могут дать пищу для размышлений. Всё это отнимает время, которое можно было бы потратить на другие проекты, но оно того стоит."
 elixir_of_eternal_life_stage2_random_journey_effects:0 "Вы начнёте собирать информацию о возможных местонахождениях этих записей."
 elixir_of_eternal_life_stage2_random_journey_isvalid:0 ""
 elixir_of_eternal_life_stage2_random_journey_name:0 "Постижение эзотерических знаний"
 elixir_of_eternal_life_stage2_random_journey_planning_confirm:0 "$POD_journey_planning_confirm_default$"
 elixir_of_eternal_life_stage2_random_journey_planning_decline:0 "$POD_journey_planning_decline_default$"
 elixir_of_eternal_life_stage2_random_journey_planning_desc:0 "Мои разведчики наконец вернулись с хорошими новостями: они нашли подсказки в давно забытом месте.\n\nТеперь я знаю, куда идти, и смогу их добыть. Надеюсь, испытания окажутся не слишком сложными."
 elixir_of_eternal_life_stage2_random_journey_planning_title:0 "Обнаружена зацепка"
 elixir_of_eternal_life_stage2_random_journey_travel_confirm:0 "Пора начинать..."
 elixir_of_eternal_life_stage2_random_journey_travel_desc:0 "Эликсир Вечной жизни — это то, что нужно искать, а не то, что вам дают. Теперь, когда у вас есть подсказка, пора сделать следующий шаг на этом пути."
 elixir_of_eternal_life_stage2_random_journey_travel_title:0 "В поисках знаний"
 elixir_of_eternal_life_stage2_random_journey_tt:0 "Тысяча путей ведут к одной цели."
 glamour_quests_deed_desc:0 "Первый вид поисков — это поиски деяния, в ходе которого китэйн отправляется в дебри Дальних Грёз в поисках великой реликвии фей. Это может быть какой-нибудь артефакт, очень важное существо или даже фригольд, расположенный вдали от известных тродов. Какова бы ни была цель поисков, её нужно достичь и вернуться, а если это место, то трод должен быть расчищен и надёжно защищён."
 glamour_quests_deed_effects:0 "Вы потеряете [GetPlayer.MakeScope.ScriptValue('POD_glamour_quest_banality')|0P] [Concept('banality', 'банальности')|E] в конце [Concept('journey', 'странствия')|E].\nНа время этого [Concept('journey', 'странствия')|E] вы получите модификатор «[GetModifier('POD_quest_of_deed_modifier').GetNameWithTooltip]».[AddTextIf(GreaterThan_CFixedPoint(GetPlayer.MakeScope.ScriptValue('POD_effective_banality_deed'), '(CFixedPoint)0'), Localize('glamour_quests_ineffective'))]"
 glamour_quests_deed_isvalid:0 ""
 glamour_quests_deed_name:0 "Поиски деяния"
 glamour_quests_deed_planning_confirm:0 "$POD_journey_planning_confirm_default$"
 glamour_quests_deed_planning_decline:0 "$POD_journey_planning_decline_default$"
 glamour_quests_deed_planning_desc:0 "Ваши поиски близятся к концу. Пора их завершить."
 glamour_quests_deed_planning_title:0 "Банальность, преодолённая через битву"
 glamour_quests_deed_travel_confirm:0 "К сожалению, я сейчас вдали от дома."
 glamour_quests_deed_travel_desc:0 "Ваши поиски близятся к концу. Пора их завершить."
 glamour_quests_deed_travel_title:0 "$glamour_quests_deed_name$"
 glamour_quests_deed_tt:0 "Пусть сокровища Грёз вновь разожгут мою искру."
 glamour_quests_desc:0 "Выберите, какие поиски вы хотели бы пройти."
 glamour_quests_dreaming_desc:0 "Третий вид поисков — поиски Грёз, в ходе которого смертного, полностью поглощённого банальностью, вытаскивают из её ледяных глубин и снова показывают ему красоту и радость Грёз. Разумеется, это не в буквальном смысле, по крайней мере, не обязательно должно быть именно так. Личное вдохновение и радость, достаточные для того, чтобы вызвать значительные перемены в жизни человека, — вполне приемлемая конечная цель этих поисков. Однако следует быть осторожным, ведь банальность так глубоко проникла в сердце этой несчастной души, что ей не составит труда превратить надежды подменыша в непримиримую ненависть ко всему, что связано с феями."
 glamour_quests_dreaming_effects:0 "Вы потеряете [GetPlayer.MakeScope.ScriptValue('POD_glamour_quest_banality')|0P] [Concept('banality', 'банальности')|E] в конце [Concept('journey', 'странствия')|E].\nНа время этого [Concept('journey', 'странствия')|E] вы получите модификатор «[GetModifier('POD_quest_of_dreaming_modifier').GetNameWithTooltip]».[AddTextIf(GreaterThan_CFixedPoint(GetPlayer.MakeScope.ScriptValue('POD_effective_banality_dreaming'), '(CFixedPoint)0'), Localize('glamour_quests_ineffective'))]"
 glamour_quests_dreaming_isvalid:0 ""
 glamour_quests_dreaming_name:0 "Поиски Грёз"
 glamour_quests_dreaming_planning_confirm:0 "$POD_journey_planning_confirm_default$"
 glamour_quests_dreaming_planning_decline:0 "$POD_journey_planning_decline_default$"
 glamour_quests_dreaming_planning_desc:0 "Ваши поиски близятся к концу. Пора их завершить."
 glamour_quests_dreaming_planning_title:0 "Банальность, побеждённая благодаря Грёзам"
 glamour_quests_dreaming_travel_confirm:0 "К сожалению, я сейчас вдали от дома."
 glamour_quests_dreaming_travel_desc:0 "Ваши поиски близятся к концу. Пора их завершить."
 glamour_quests_dreaming_travel_title:0 "$glamour_quests_dreaming_name$"
 glamour_quests_dreaming_tt:0 "Пусть эта заблудшая душа докажет, что для меня ещё не всё потеряно."
 glamour_quests_generic_travel_desc:0 "$glamour_quests_tt$"
 glamour_quests_ineffective:0 "\n\n@warning_icon!#X Предполагается, что это [Concept('journey', 'странствие')|E] не поможет избавиться от [Concept('banality', 'банальности')|E], а лишь замедлит её рост!#!"
 glamour_quests_inspiration_desc:0 "Второй вид поисков — поиски вдохновения, в которых в качестве объекта выбирается один смертный. Подменыш должен любыми средствами довести этого смертного до вершин творческого потенциала, наполнив его таким гламуром, чтобы он засиял, как маяк в ночи. Но это не рапсодия, вовсе нет! Подменыш должен бережно опекать своего подопечного, следя за тем, чтобы безумный порыв, которым он наделил смертного, не разрушил его разум, иначе поиски будут провалены."
 glamour_quests_inspiration_effects:0 "Вы потеряете [GetPlayer.MakeScope.ScriptValue('POD_glamour_quest_banality')|0P] [Concept('banality', 'банальности')|E] в конце [Concept('journey', 'странствия')|E].\nНа время этого [Concept('journey', 'странствия')|E] вы получите модификатор «[GetModifier('POD_quest_of_inspiration_modifier').GetNameWithTooltip]».[AddTextIf(GreaterThan_CFixedPoint(GetPlayer.MakeScope.ScriptValue('POD_effective_banality_inspiration'), '(CFixedPoint)0'), Localize('glamour_quests_ineffective'))]"
 glamour_quests_inspiration_isvalid:0 ""
 glamour_quests_inspiration_name:0 "Поиски вдохновения"
 glamour_quests_inspiration_planning_confirm:0 "$POD_journey_planning_confirm_default$"
 glamour_quests_inspiration_planning_decline:0 "$POD_journey_planning_decline_default$"
 glamour_quests_inspiration_planning_desc:0 "Ваши поиски близятся к концу. Пора их завершить."
 glamour_quests_inspiration_planning_title:0 "Банальность, побеждённая словом"
 glamour_quests_inspiration_travel_confirm:0 "К сожалению, я сейчас вдали от дома."
 glamour_quests_inspiration_travel_desc:0 "Ваши поиски близятся к концу. Пора их завершить."
 glamour_quests_inspiration_travel_title:0 "$glamour_quests_inspiration_name$"
 glamour_quests_inspiration_tt:0 "Пусть страсть истинного творца придаст мне сил."
 glamour_quests_name:0 "Поиски гламура"
 glamour_quests_tt:0 "Очищение от банальности."
 hunt_in_capital_planning_confirm_gui_tt_court:0 "[GetPlayer.MakeScope.Var('hunt_in_capital_selected_mortal').Char.GetFirstName] после этого останется при вашем дворе."
 hunt_in_capital_planning_confirm_gui_tt_nextevent:0 "Вы можете решить, что делать с персонажем [GetPlayer.MakeScope.Var('hunt_in_capital_selected_mortal').Char.GetFirstName], когда [GetPlayer.MakeScope.Var('hunt_in_capital_selected_mortal').Char.GetSheHe] окажется в ваших лапах."
 hunt_in_capital_planning_confirm_gui_tt_others:0 "Вы больше не увидите других смертных."
 look_for_contracts_desc:0 "TODO"
 look_for_contracts_effects:0 "TODO"
 look_for_contracts_planning_desc:0 "TODO"
 look_for_contracts_planning_title:0 "TODO"
 look_for_contracts_tt:0 "TODO"
 seek_knowledge_autumn_desc:0 "#TOOLTIP:GAME_TRAIT,art_autumn,[GetNullCharacter] #L Осень#!#! — это искусство увядания и смерти, позволяющее практикующему накладывать такие [Concept('cantrips', 'чары')|E], как [GetPerk('noble_arts_autumn_eyes_perk').GetName(GetPlayer)], [GetPerk('noble_arts_the_poisoned_apple_perk').GetName(GetPlayer)] или [GetPerk('noble_arts_shivers_perk').GetName(GetPlayer)]."
 seek_knowledge_autumn_effects:0 "Вы узнаете местонахождение наставника, который знает [GetTrait('art_autumn').GetName(GetNullCharacter)]. Отправившись туда, вы сможете получить [Concept('trait', 'свойство')|E] «[GetTrait('art_autumn').GetName(GetPlayer)]», которое позволит вам открыть [Concept('perks', 'достоинства')|E] в [Concept('lifestyle', 'образе жизни')|E] #TOOLTIP:GAME_TRAIT,art_autumn,[GetNullCharacter] #L Осень#!#!."
 seek_knowledge_autumn_name:0 "Изучить благородное искусство (#TOOLTIP:GAME_TRAIT,art_autumn,[GetNullCharacter] #L Осень#!#!)"
 seek_knowledge_autumn_planning_confirm:0 "$POD_journey_planning_confirm_default$"
 seek_knowledge_autumn_planning_decline:0 "$POD_journey_planning_decline_default$"
 seek_knowledge_autumn_planning_desc:0 "Я [Select_CString(GetPlayer.IsFemale, 'пробудила', 'пробудил' )] свой гламур и [Select_CString(GetPlayer.IsFemale, 'подготовилась', 'подготовился' )] как следует, но тонкости #TOOLTIP:GAME_TRAIT,art_autumn,[GetNullCharacter] #L Осени#!#! всё ещё ускользают от меня.\n\nЕсли я хочу овладеть этим искусством до конца, мне нужен наставник.\n\nК счастью, мои разведчики подсказали мне, где можно найти такого наставника."
 seek_knowledge_autumn_planning_title:0 "В поисках Осени"
 seek_knowledge_autumn_travel_confirm:0 "$POD_journey_travel_confirm_seek_knowledge$"
 seek_knowledge_autumn_travel_desc:0 "Я с нетерпением жду возможности изучить [GetTrait('art_autumn').GetName(GetNullCharacter)]. Многие называют её самым тёмным и пагубным искусством - накапливать всю враждебность, которую вы испытываете к ненавистному врагу, пока он не увянет и не сгниёт у вас на глазах. Никто не посмеет выступить против меня."
 seek_knowledge_autumn_travel_title:0 "$POD_journey_travel_title_seek_knowledge$"
 seek_knowledge_autumn_tt:0 "Хорошо... позволь ненависти течь сквозь себя."
 seek_knowledge_contract_desc:0 "#TOOLTIP:GAME_TRAIT,art_contract,[GetNullCharacter] #L Сделка#!#! — это искусство заключения связующих соглашений, позволяющее практикующему накладывать такие [Concept('cantrips', 'чары')|E], как [GetPerk('noble_arts_done_deal_perk').GetName(GetPlayer)], [GetPerk('noble_arts_liars_bell_perk').GetName(GetPlayer)] или [GetPerk('noble_arts_sanctified_words_perk').GetName(GetPlayer)]."
 seek_knowledge_contract_effects:0 "Вы узнаете местонахождение наставника, который знает #TOOLTIP:GAME_TRAIT,art_contract,[GetNullCharacter] #L Сделку#!#!. Отправившись туда, вы сможете получить [Concept('trait', 'свойство')|E] «[GetTrait('art_contract').GetName(GetPlayer)]», которое позволит вам открыть [Concept('perks', 'достоинства')|E] в [Concept('lifestyle', 'образе жизни')|E] #TOOLTIP:GAME_TRAIT,art_contract,[GetNullCharacter] #L Сделка#!#!."
 seek_knowledge_contract_name:0 "Изучить благородное искусство (#TOOLTIP:GAME_TRAIT,art_contract,[GetNullCharacter] #L Сделка#!#!)"
 seek_knowledge_contract_planning_confirm:0 "$POD_journey_planning_confirm_default$"
 seek_knowledge_contract_planning_decline:0 "$POD_journey_planning_decline_default$"
 seek_knowledge_contract_planning_desc:0 "Я [Select_CString(GetPlayer.IsFemale, 'пробудила', 'пробудил' )] свой гламур и [Select_CString(GetPlayer.IsFemale, 'подготовилась', 'подготовился' )] как следует, но тонкости #TOOLTIP:GAME_TRAIT,art_contract,[GetNullCharacter] #L Сделки#!#! всё ещё ускользают от меня.\n\nЕсли я хочу овладеть этим искусством до конца, мне нужен наставник.\n\nК счастью, мои разведчики подсказали мне, где можно найти такого наставника."
 seek_knowledge_contract_planning_title:0 "В поисках Сделки"
 seek_knowledge_contract_travel_confirm:0 "$POD_journey_travel_confirm_seek_knowledge$"
 seek_knowledge_contract_travel_desc:0 "Я с нетерпением жду возможности изучить #TOOLTIP:GAME_TRAIT,art_contract,[GetNullCharacter] #L Сделку#!#!. Любой может принести простую клятву, но это искусство восходит к ушедшей эпохе, когда великие лорды [UmbraGlossaryLocalized('arcadia','Аркадии')] скрепляли свои клятвы гламуром. Эти обещания обладали реальной силой."
 seek_knowledge_contract_travel_title:0 "$POD_journey_travel_title_seek_knowledge$"
 seek_knowledge_contract_tt:0 "И распишитесь здесь."
 seek_knowledge_dragons_ire_desc:0 "#TOOLTIP:GAME_TRAIT,art_dragons_ire,[GetNullCharacter] #L Гнев дракона#!#! — это искусство доблестного боя, позволяющее практикующему накладывать такие [Concept('cantrips', 'чары')|E], как [GetPerk('noble_arts_burning_chew_perk').GetName(GetPlayer)], [GetPerk('noble_arts_confounding_coils_perk').GetName(GetPlayer)] или [GetPerk('noble_arts_holy_strike_perk').GetName(GetPlayer)]."
 seek_knowledge_dragons_ire_effects:0 "Вы узнаете местонахождение наставника, который знает #TOOLTIP:GAME_TRAIT,art_dragons_ire,[GetNullCharacter] #L Гнев дракона#!#!. Отправившись туда, вы сможете получить [Concept('trait', 'свойство')|E] «[GetTrait('art_dragons_ire').GetName(GetPlayer)]», которое позволит вам открыть [Concept('perks', 'достоинства')|E] в [Concept('lifestyle', 'образе жизни')|E] #TOOLTIP:GAME_TRAIT,art_dragons_ire,[GetNullCharacter] #L Гнев дракона#!#!."
 seek_knowledge_dragons_ire_name:0 "Изучить благородное искусство (#TOOLTIP:GAME_TRAIT,art_dragons_ire,[GetNullCharacter] #L Гнев дракона#!#!)"
 seek_knowledge_dragons_ire_planning_confirm:0 "$POD_journey_planning_confirm_default$"
 seek_knowledge_dragons_ire_planning_decline:0 "$POD_journey_planning_decline_default$"
 seek_knowledge_dragons_ire_planning_desc:0 "Я [Select_CString(GetPlayer.IsFemale, 'пробудила', 'пробудил' )] свой гламур и [Select_CString(GetPlayer.IsFemale, 'подготовилась', 'подготовился' )] как следует, но тонкости #TOOLTIP:GAME_TRAIT,art_dragons_ire,[GetNullCharacter] #L Гнева дракона#!#! всё ещё ускользают от меня.\n\nЕсли я хочу овладеть этим искусством до конца, мне нужен наставник.\n\nК счастью, мои разведчики подсказали мне, где можно найти такого наставника."
 seek_knowledge_dragons_ire_planning_title:0 "В поисках Гнева дракона"
 seek_knowledge_dragons_ire_travel_confirm:0 "$POD_journey_travel_confirm_seek_knowledge$"
 seek_knowledge_dragons_ire_travel_desc:0 "Я с нетерпением жду возможности изучить #TOOLTIP:GAME_TRAIT,art_dragons_ire,[GetNullCharacter] #L Гнев дракона#!#!. Согласно легендам, великий герой однажды победил дракона, чтобы украсть его свирепость и передать её в распоряжение фей, чтобы любой честный воин мог ею владеть. Я знаю, что [Select_CString(GetPlayer.IsFemale, 'достойна', 'достоин' )] этого."
 seek_knowledge_dragons_ire_travel_title:0 "$POD_journey_travel_title_seek_knowledge$"
 seek_knowledge_dragons_ire_tt:0 "Никто не превзойдёт меня в битве."
 seek_knowledge_oneiromancy_desc:0 "#TOOLTIP:GAME_TRAIT,art_oneiromancy,[GetNullCharacter] #L Онейромантия#!#! — это искусство манипулирования снами, позволяющее практикующему накладывать такие [Concept('cantrips', 'чары')|E], как [GetPerk('common_arts_dream_walk_perk').GetName(GetPlayer)], [GetPerk('common_arts_dream_craft_perk').GetName(GetPlayer)] или [GetPerk('common_arts_dream_puppet_perk').GetName(GetPlayer)]."
