 spell_of_life_stage2_targeted_journey_inauhaten_tt:0 "[GetScriptedCharacterByHistoryID('792605').GetFirstName] многому меня научит."
 spell_of_life_stage2_targeted_journey_mestha_desc:0 "[GetScriptedCharacterByHistoryID('792804').GetFirstName] был первой мумией, когда-либо созданной, и присутствовал при сотворении #TOOLTIP:CHARACTER,[GetScriptedCharacterByHistoryID('792593').GetID] #L Гора#!#!. Некоторые говорят, что [GetScriptedCharacterByHistoryID('792804').GetSheHe] даже был доверенным лицом Осириса, когда тот покидал [UmbraGlossaryLocalized('dark_kingdom_of_sand','Аменти')] или когда [GetScriptedCharacterByHistoryID('792804').GetFirstName] возвращался туда. [GetScriptedCharacterByHistoryID('792804').GetSheHe|U] не знает заклинания Жизни, но может кое-что подсказать."
 spell_of_life_stage2_targeted_journey_mestha_effects:0 "Вы отправитесь на встречу с #TOOLTIP:CHARACTER,[GetScriptedCharacterByHistoryID('792804').GetID] #L Местой#!#!. Добравшись туда, вы сможете попытаться убедить [GetScriptedCharacterByHistoryID('792804').GetHerHim] взять вас в ученики."
 spell_of_life_stage2_targeted_journey_mestha_isvalid:0 "$EFFECT_LIST_BULLET$[GetScriptedCharacterByHistoryID('792804').GetFirstName] должен быть живым, активным и не быть #color_white вами#!.\n$spell_of_life_stage2_targeted_mummy_generic_isvalid$"
