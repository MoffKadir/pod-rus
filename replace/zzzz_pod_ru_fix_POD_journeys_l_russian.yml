 spell_of_life_stage2_targeted_journey_milarepa_desc:0 "Когда-то на свете был вампир по имени [GetScriptedCharacterByHistoryID('791151').GetFirstName], который стремился освободиться от паразитической природы вампиризма и получил благословение Осириса. Он обучил других вампиров строгой религиозной дисциплине и глубоким философским учениям Осириса и в конце концов передал руководство так называемыми Детьми Осириса #TOOLTIP:CHARACTER,[GetScriptedCharacterByHistoryID('791152').GetID] #L Миларепе#!#!. Среди прочего [GetScriptedCharacterByHistoryID('791152').GetFirstName] получил некоторые знания о заклинании Жизни."
 spell_of_life_stage2_targeted_journey_milarepa_effects:0 "Вы отправитесь на встречу с #TOOLTIP:CHARACTER,[GetScriptedCharacterByHistoryID('791152').GetID] #L Миларепой#!#!. Добравшись туда, вы сможете попытаться убедить [GetScriptedCharacterByHistoryID('791152').GetHerHim] взять вас в ученики."
