 spell_of_life_stage2_targeted_journey_name:0 "Поиск наставника Заклинания Жизни"
 spell_of_life_stage2_targeted_journey_tt:0 "Чтобы лучше понять [Concept('POD_spell_of_life', 'заклинание Жизни')|E], я побеседую с теми, кто знает о нём некоторые подробности."
 spell_of_life_stage2_targeted_journey_wepauwet_desc:0 "Однажды [GetScriptedCharacterByHistoryID('792579').GetSheHe] повёл свой народ на войну против культа Сета, но они были прокляты и изгнаны из родных земель. Говорят, что [GetScriptedCharacterByHistoryID('792593').GetFirstName] даровал [GetScriptedCharacterByHistoryID('792579').GetHerHim] бессмертие, и это благословение позволило [GetScriptedCharacterByHistoryID('792579').GetHerHim] использовать некромантию, как если бы [GetScriptedCharacterByHistoryID('792579').GetSheHe] был #TOOLTIP:GAME_TRAIT,mummy,[GetNullCharacter] #L мумией#!#!. Благодаря этому благословению [GetScriptedCharacterByHistoryID('792579').GetFirstName] стал живой энциклопедией истории своего народа."
 spell_of_life_stage2_targeted_journey_wepauwet_effects:0 "Вы отправитесь на встречу с #TOOLTIP:CHARACTER,[GetScriptedCharacterByHistoryID('792579').GetID] #L Упуаутом#!#!. Добравшись туда, вы сможете попытаться убедить [GetScriptedCharacterByHistoryID('792579').GetHerHim] взять вас в ученики."
