 spell_of_life_stage2_targeted_journey_inauhaten_planning_desc:0 "Я [Select_CString(GetPlayer.IsFemale, 'изучила', 'изучил' )] заклинание Жизни и [Select_CString(GetPlayer.IsFemale, 'подготовилась', 'подготовился' )] как [Select_CString(GetPlayer.IsFemale, 'могла', 'мог' )], но его тонкости до сих пор ускользают от меня.\n\nЕсли я хочу овладеть им в совершенстве, мне нужен наставник.\n\nК счастью, мои разведчики подсказали мне, где найти такого наставника."
