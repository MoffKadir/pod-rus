 seek_knowledge_winter_travel_desc:0 "Я с нетерпением жду возможности изучить #TOOLTIP:GAME_TRAIT,art_winter,[GetNullCharacter] #L Зиму#!#!. В суровые зимние ночи они познают истинный страх. Благодаря их страху я обрету уважение. Благодаря уважению я укреплю свою легенду."
