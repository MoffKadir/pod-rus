 spell_of_life_stage2_random_journey_desc:0 "Тайны сокрыты среди мёртвых и на их языках. Я [Select_CString(GetPlayer.IsFemale, 'уверена', 'уверен' )], что со временем смогу усовершенствовать свои знания о [Concept('POD_spell_of_life', 'заклинании Жизни')|E], просто добывая редкие манускрипты и переводя их. Однако есть и более быстрые, хотя и менее надёжные способы. Многие кабалы и культы уже пытались раскрыть тайну [Concept('POD_spell_of_life', 'заклинания Жизни')|E], но потерпели неудачу. Я [Select_CString(GetPlayer.IsFemale, 'могла', 'мог' )] бы рыскать по руинам древних храмов и гробниц в поисках утраченных секретов, рискуя жизнью. Кроме того, я [Select_CString(GetPlayer.IsFemale, 'могла', 'мог' )] бы ускорить процесс перевода с помощью алхимии и магии, рискуя уничтожить рукопись. Всё это отнимает время, которое можно было бы потратить на другие проекты, но оно того стоит."
 spell_of_life_stage2_random_journey_effects:0 "Вы начнёте собирать информацию о возможных местонахождениях этих записей."
 spell_of_life_stage2_random_journey_isvalid:0 ""
 spell_of_life_stage2_random_journey_name:0 "Постижение эзотерических знаний"
 spell_of_life_stage2_random_journey_planning_confirm:0 "$POD_journey_planning_confirm_default$"
 spell_of_life_stage2_random_journey_planning_decline:0 "$POD_journey_planning_decline_default$"
 spell_of_life_stage2_random_journey_planning_desc:0 "Мои разведчики наконец вернулись с хорошими новостями: они нашли подсказки в давно забытом месте.\n\nТеперь я знаю, куда идти, и смогу их добыть. Надеюсь, испытания окажутся не слишком сложными."
 spell_of_life_stage2_random_journey_planning_title:0 "Обнаружена зацепка"
 spell_of_life_stage2_random_journey_travel_confirm:0 "Скоро этим овладеют двое"
 spell_of_life_stage2_random_journey_travel_desc:0 "Многие пытались разгадать заклинание Жизни, и все потерпели неудачу. Только одному человеку, помимо самой Исиды, это удалось, но даже он создал несовершенную версию. Однако среди останков неудачников и научных трудов можно найти подсказки, которые помогут мне лучше понять заклинание Жизни и усовершенствовать мои нынешние методы."
 spell_of_life_stage2_random_journey_travel_title:0 "В поисках знаний"
 spell_of_life_stage2_random_journey_tt:0 "Ничто не остаётся скрытым навсегда."
 spell_of_life_stage2_targeted_journey_astrokhen_desc:0 "[GetScriptedCharacterByHistoryID('792858').GetFirstName], некогда амбициозный древнеегипетский маг, стремился обрести бессмертие мумий. Хотя [GetScriptedCharacterByHistoryID('792593').GetFirstName] отказал ему, благодаря своей силе убеждения [GetScriptedCharacterByHistoryID('792858').GetFirstName] получил бессмертие от #TOOLTIP:CHARACTER,[GetScriptedCharacterByHistoryID('792600').GetID] #L Кабира#!#!. [GetScriptedCharacterByHistoryID('792593').GetFirstName] заставил #TOOLTIP:CHARACTER,[GetScriptedCharacterByHistoryID('792858').GetID] #L Астрохена#!#! охранять множество могущественных и древних артефактов. Это позволило [GetScriptedCharacterByHistoryID('792593').GetHerHim] продолжить собственные исследования заклинания Жизни."
 spell_of_life_stage2_targeted_journey_astrokhen_effects:0 "Вы отправитесь на встречу с #TOOLTIP:CHARACTER,[GetScriptedCharacterByHistoryID('792858').GetID] #L Астрохеном#!#!. Добравшись туда, вы сможете попытаться убедить [GetScriptedCharacterByHistoryID('792858').GetHerHim] взять вас в ученики."
 spell_of_life_stage2_targeted_journey_astrokhen_isvalid:0 "$EFFECT_LIST_BULLET$[GetScriptedCharacterByHistoryID('792858').GetFirstName] должен быть живым, активным и не быть #color_white вами#!.\n$spell_of_life_stage2_targeted_mummy_generic_isvalid$"
 spell_of_life_stage2_targeted_journey_astrokhen_name:0 "Наставник: [GetScriptedCharacterByHistoryID('792858').GetFirstName]"
