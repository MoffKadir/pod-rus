l_russian:
 podgrandcity.100.desc:0 "Благодаря вашим усилиям большая часть храма была восстановлена. Многие Сетиты теперь ходят по этим залам, шепча, строя интриги и прославляя Сета по-своему. \nОднако по причинам, которые вы не можете объяснить, многие из Сетитов, которые приходят сюда, забывают свою первоначальную цель и вместо этого пытаются искать приятные способы развлечься. Возможно, это тоже форма поклонения, которая начала вас интересовать."
 podgrandcity.100.option.a:0 "Удовольствия плоти освободят меня."
 podgrandcity.100.option.b:0 "Зачем они существуют, если не для личного удовлетворения?"
 podgrandcity.100.option.c:0 "Чем больше, тем лучше!"
 podgrandcity.100.t:0 "Учение Двора Мечты"
 podgrandcity.100.tooltip.a:0 "Ваша будущая вера получит [GetDoctrine('tenet_carnal_exaltation').GetBaseName]."
 podgrandcity.100.tooltip.b:0 "Ваша будущая вера получит [GetDoctrine('tenet_hedonistic').GetBaseName]."
 podgrandcity.100.tooltip.c:0 "Ваша будущая вера получит [GetDoctrine('tenet_ritual_celebrations').GetBaseName]."
 podgrandcity.101.desc:0 "Этот храм назван очень удачно, ведь что еще остается, кроме пыли и костей, после воздействия могущественной магии крови? Многие тома здесь рассказывают о Сете, его достижениях и силах. Перед вами лежит кладезь знаний, вам нужно только взять его."
 podgrandcity.101.option.a:0 "Сет – король."
 podgrandcity.101.option.b:0 "Сет — Тифон."
 podgrandcity.101.option.c:0 "Сет – Торжествующий."
 podgrandcity.101.t:0 "Учения двора Пыли и Костей"
 podgrandcity.101.tooltip.a:0 "Ваша будущая вера получит [GetDoctrine('tenet_ashen_faith').GetBaseName]."
 podgrandcity.101.tooltip.b:0 "Ваша будущая вера получит [GetDoctrine('tenet_sacred_shadows').GetBaseName]."
 podgrandcity.101.tooltip.c:0 "Ваша будущая вера получит [GetDoctrine('tenet_pursuit_of_power').GetBaseName]."
 podgrandcity.102.desc:0 "Здесь покоится Собек, благословенное дитя Сета. Говорят, что Сет превратил Моколе в Абоминацию с помощью мощных кровавых ритуалов. Будучи одновременно и мафусаилом, и Абоминацией, Собек — одно из самых могущественных существ на свете. Теперь он дремлет здесь, аспект самого Голода. В этом голоде есть сила, хаос и резня. Поклоняясь Богу-крокодилу, возможно, эту силу можно обрести."
 podgrandcity.102.option.a:0 "Голод – это вечная борьба."
 podgrandcity.102.option.b:0 "Ритуальное жертвоприношение утолит жажду крови."
 podgrandcity.102.option.c:0 "От ярости мои цепи разорваны."
 podgrandcity.102.t:0 "Учение Храма Крокодилов"
 podgrandcity.102.tooltip.a:0 "Ваша будущая вера получит [GetDoctrine('tenet_struggle_submission').GetBaseName]."
 podgrandcity.102.tooltip.b:0 "Ваша будущая вера получит [GetDoctrine('tenet_gruesome_festivals').GetBaseName]."
 podgrandcity.102.tooltip.c:0 "Ваша будущая вера получит [GetDoctrine('tenet_warmonger').GetBaseName]."
 podgrandcity.103.desc:0 "Все три храма восстановлены. Знания, которые вы получили от них, дадут вам новое представление о поклонении Сету. \nВозможно, пришло время миру узнать об этом? \nИли, возможно, следует отказаться от этих еретических мыслей?"
 podgrandcity.103.option.a:0 "Это путь."
 podgrandcity.103.option.b:0 "Интересно, но мой путь остается прежним."
 podgrandcity.103.t:0 "Открыт новый путь"
 podgrandcity.201.desc:0 "Ни один город не стоит вечно. Такая простая истина известна вашему виду, но вы все равно не были готовы к тому, что произошло. Разграбление Багдада произошло в течение целой недели грабежей и убийств, пока монгольские силы Хулагу проносились через то, что когда-то было жемчужиной ислама. Возможно, погибло около миллиона человек, а, вероятно, даже больше из-за эпидемий, вызванных множеством трупов.\nТак много книг из багдадских библиотек было брошено в Тигр, что цвет реки из-за их множества стал черным. 500-летний Аббасидский халифат рушится, а вместе с ним и центр обучения на Ближнем Востоке.\n\nХотя сверхъестественное, как известно, хорошо скрывается, резня и кровопролитие все же довели многих до мук безумия, и многие сверхъестественные существа пали от рук победоносных монголов.\n\nТеперь вы правите городом пепла, блох и смерти."
 podgrandcity.201.option.a:0 "Что мы можем сделать перед лицом такого разрушения?"
 podgrandcity.201.t:0 "Багдадский костер"
 podgrandcity.201.tooltip.a:0 "Багдад больше не тот великий город, которым он был когда-то, и никогда больше не достигнет того статуса, который он когда-то имел. Но, возможно, вы ещё сможете его восстановить."
 podgrandcity.202.t:0 "Багдад исцеляется"
 podgrandcity.203.desc:0 "Хотя Багдад всегда будет страдать от случившегося, он выстоял. Заметная роль города на Ближнем Востоке снизилась, но он по-прежнему остается местом, где люди живут, учатся и умирают. Ваш город, ваша драгоценность, уже не так отполирован, как раньше, но ему удалось выжить. Возможно, эта перековка огнем под вашим влиянием и будет тем, что необходимо для того, чтобы он вернул себе прежние высоты или даже превзошло их."
 podgrandcity.203.option.a:0 "Новое начало для почтенного города."
 podgrandcity.203.t:0 "Из пепла"
 podgrandcity.203.tooltip.a:0 "Новые истории, которые нужно рассказывать, новые люди, которыми нужно править, те же амбиции."
