l_russian:
 building_boderia_ritual_stones_01:0 "Маленькие ритуальные камни Бодерии"
 building_boderia_ritual_stones_01_desc:0 "Бодерии поручено чтить память умерших и следить за тем, чтобы они не причиняли вреда живым."
 building_boderia_ritual_stones_02:0 "Ритуальные камни Бодерии"
 building_boderia_ritual_stones_02_desc:0 "$building_boderia_ritual_stones_01_desc$$POD_fera_requirements_development_below_t2$"
 building_boderia_ritual_stones_03:0 "Большие ритуальные камни Бодерии"
 building_boderia_ritual_stones_03_desc:0 "$building_boderia_ritual_stones_01_desc$$POD_fera_requirements_development_below_t3$"
 building_lion_fury_01:0 "Растущий Каэрн Красного Оленя"
 building_lion_fury_01_desc:0 "Только что очищенный яростью Льва, каэрн свободен от порчи $glossary_wyrm$, хотя остаётся лишь руинами, далёкими от своего гордого наследия старейшего каэрна Белых завывателей."
 building_lion_fury_02:0 "Растущий Каэрн Красного Оленя"
 building_lion_fury_02_desc:0 "Под руководством Белых завывателей древние камни поднимаются заново, и священные обряды вновь эхом разносятся по Каэрну."
 building_lion_fury_03:0 "Внушительный Каэрн Красного Оленя"
 building_lion_fury_03_desc:0 "Наконец возродившись, Каэрн снова стал священным сердцем Белых завывателей и маяком для Нации Гару."
 building_travelers_lodging_03:0 "Просторное жильё для путешественников"
 building_type_boderia_ritual_stones_01:0 "Ритуальные камни Бодерии"
 building_type_boderia_ritual_stones_01_desc:0 "#F Бодерии поручено чтить мертвых и следить за тем, чтобы они не причиняли вреда живым. #!"
 building_type_lion_fury_01:0 "Каэрн Красного Оленя"
 building_type_lion_fury_01_desc:0 "#F То, что сейчас известно как Аббатство Ферн, было первым и самым священным Каэрном, захваченным Танцорами Черной Спирали после их возвращения из объятий $glossary_wyrm$. На протяжении веков это место избегалось всеми здравомыслящими людьми.\nХотя долгое время считалось, что спасение невозможно, ярость Льва и возвращение Белых завывателей наконец очистили порчу, которая когда-то поглотила эту проклятую землю.#!"
 building_type_uktena_hunter_lodge_01:0 "Охотничий домик"
 building_type_uktena_hunter_lodge_01_desc:0 "#F Многие не доверяют скрытности Уктены. Но даже их самый стойкий враг не станет оспаривать их беспрецедентный опыт охотников на Вирма и его слуг.#!"
 building_uktena_hunter_lodge_01:0 "Маленький Охотничий Домик"
 building_uktena_hunter_lodge_01_desc:0 "Многие не доверяют скрытности Уктены. Но даже их самый стойкий враг не станет оспаривать их беспрецедентный опыт охотников на Вирма и его слуг."
 building_uktena_hunter_lodge_02:0 "Охотничий домик"
 building_uktena_hunter_lodge_02_desc:0 "$building_uktena_hunter_lodge_01_desc$$POD_fera_requirements_development_below_t2$"
 building_uktena_hunter_lodge_03:0 "Большой охотничий домик"
 building_uktena_hunter_lodge_03_desc:0 "$building_uktena_hunter_lodge_01_desc$$POD_fera_requirements_development_below_t3$"
