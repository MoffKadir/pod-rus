 DEADEN_SPIRIT_PERK_EFFECT:0 "Как [character_interaction|E], позволяет получить влияние на существо со свойством «[GetTrait('barghest').GetName( GetPlayer )]».\n#F Земледелец может усмирить вышедшее из-под контроля существо со свойством «[GetTrait('barghest').GetName( GetPlayer )]».#!"
 DEATHS_SIGIL_PERK_EFFECT:0 "Каждые 5 лет с вероятностью 25% вы получаете [GetModifier('deaths_sigil_modifier').GetNameWithTooltip].\n#F Печать смерти — явный знак прикосновения [UmbraGlossary('oblivion')] к персонажу, который проявляется везде, куда бы тот ни отправился.#!"
 DEATHS_TOUCH_PERK_EFFECT:0 "#F Страшила может свободно перемещать предметы в [Glossary('земли Плоти','game_concept_skinlands_desc')] и телекинетически проецировать свои руки в [underworld|E].#!"
 DEFLECT_PERK_EFFECT:0 "#F С помощью этой способности Тваштрия может ещё глубже спрятаться внутри призрака, в которого вселился, чтобы избежать обнаружения.#!"
 DEFY_OBLIVION_PERK_EFFECT:0 "#F Спектр может передать заключённое в нём [UmbraGlossary('oblivion')] другому существу.#!"
 DELVE_PERK_EFFECT:0 "Скорость прогресса [espionage|E]: #P +[EmptyScope.ScriptValue('digging_for_dirt_perk_percentage')|0]%#!\n#F Мориман может войти в транс и пережить то, что недавно пережила цель.#!"
 DEVILS_DARE_PERK_EFFECT:0 "Число Тёмных страстей: #N +1#!\n#F Дьявольский вызов — эмоциональный аналог игры «кто струсит первым». Чтобы использовать этот Шип, Тень вкладывает некоторое количество Ангста и записывает, что она предлагает Психее совершить на спор.#!"
 DISCERN_THE_LIE_PERK_EFFECT:0 "[PODUnlocksCombatMove('POD_combat_move_wraith_jade_discern_lie')]\n#F Ученый может определить, лжет ли ему другой призрак.#!"
 DISCIPLINE_PERK_EFFECT:0 "#F Позволяет Спектру причинить сильную боль цели, в которую он вложил свою сущность.#!"
 DREAM_SEQUENCE_PERK_EFFECT:0 "#F Песочный человечек может затуманить разум смертного, увидевшего что-либо сквозь Туман, и убедить его, что это был сон. Могущественные Песочные человечки могут с помощью этой силы убедить даже сверхъестественное существо, что оно не видело того, что видело на самом деле.#!"
 DRIVING_URGE_PERK_EFFECT:0 "Как [character_interaction|E], позволяет получить [weak_hook|E] на цель на 1 год.\n#F Восставший может вызвать у цели лёгкую одержимость.#!"
