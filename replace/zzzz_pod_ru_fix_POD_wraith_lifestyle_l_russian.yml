 VIRTUALITY_PERK_EFFECT:0 "#F Теперь можно ясно видеть и слышать события, происходящие в [Glossary('Землях Плоти','game_concept_skinlands_desc')].#!"
 VOLLEY_PERK_EFFECT:0 "#F Масочник может создавать и запускать снаряды для защиты.#!"
 WALK_THE_WEB_PERK_EFFECT:0 "[character_interaction|E], позволяющее переместиться туда, где находятся [Concept('Fetter', 'оковы')|E].\n#F Надзиратель может быстро перемещаться к своим [Concept('Fetter', 'оковам')|E].#!"
