l_russian:
 ADRESTIAS_COMMUNION_PERK_EFFECT:0 "#F Адвокат может применять любое искусство Указания как к своей Тени, так и к чужим Теням, даже если они ещё не взяли верх.#!"
 AGON_PERK_EFFECT:0 "$POD_can_covert_to_wraith_trigger_loca$\n#F Песочный человечек может вырвать душу смертного из тела.#!"
 ALTER_DEMEANOR_PERK_EFFECT:0 "Как [character_interaction|E], позволяет вернуть свою личность Хунь во время Катарсиса.\n#F Доктор может изменить архетип своего свойства «[GetTrait('shadow').GetName( GetPlayer )]», выбрав как обычный архетип, так и архетип Тени.#!"
 ANGER_ENOUGH_FOR_TWO_WORLDS_PERK_EFFECT:0 "Разблокирует вариант «Разорвать Завесу» в действии «Манипулировать Завесой» в [umbra|E].\n#F Страшила может временно разорвать Завесу, что грозит разрушительными последствиями.#!"
 APPLE_OF_DISCORD_PERK_EFFECT:0 "Улучшает [character_interaction] «[GetPerk('the_gleaming_perk').GetName(GetPlayer)]», заменяя модификатор [GetModifier('intimation_the_gleaming_modifier').GetNameWithTooltip] на [GetModifier('intimation_apple_of_discord_modifier').GetNameWithTooltip].\n#F Адвокат может сделать предмет настолько желанным, что любой, кто его увидит, станет одержим им.#!"
 APPRAISAL_PERK_EFFECT:0 "#F Зрение Жизни и Зрение Смерти ростовщика постоянно усилены.#!"
 ARCANOI_BLACK_WHISPERS_PERK_EFFECT:0 "#F Спектр может напрямую общаться с разумом живого человека.#!"
 ARCANOI_COAX_PERK_EFFECT:0 "[PODUnlocksCombatMove('POD_combat_move_wraith_jade_coax_po')]\nСопротивление Катарсису больше не повышает [stress|E].\n#F Доктор может обратиться к своему свойству «[GetTrait('shadow').GetName( GetPlayer )]» с меньшим риском.#!"
 ARCANOI_COMPEL_PERK_EFFECT:0 "#F Могущественный Спектр может проецировать свою волю на окружающих Спектров.#!"
 ARCANOI_CONVERSION_PERK_EFFECT:0 "#F Спектр может передать зрителям ощущение [UmbraGlossary('oblivion')]. #!"
 ARCANOI_DISTANT_WHISPERS_PERK_EFFECT:0 "#F Позволяет двум Спектрам свободно общаться друг с другом телепатически.#!"
 ARCANOI_DISTRACTION_PERK_EFFECT:0 "[PODUnlocksCombatMove('POD_combat_move_wraith_risen_distraction')]\n#F Восставший может заставить цель вспомнить о другом деле, которое ей необходимо выполнить.#!"
 ARCANOI_KNOW_THYSELF_PERK_EFFECT:0 "Даёт невосприимчивость к враждебным ментальным [Concept('character_interaction', 'взаимодействиям персонажей')|E].\n#F Адвокат может противостоять попыткам другого существа применить Указание, а также в ограниченной мере сопротивляться Наказанию и Искажению.#!"
 ARCANOI_REMEMBRANCE_PERK_EFFECT:0 "#F Восставший может внедрить простую мысль или идею в разум цели.#!"
 ARCANOI_SCRY_PERK_EFFECT:0 "Каждый $bound_wraith$ добавляет: [GetModifier( 'arcanoi_scry_perk_modifier' ).GetNameWithTooltip|L]. Это суммируется.\n#F Мориман может воспринимать то, что в данный момент видит другой призрак.#!"
 ARCANOI_TAMING_THE_BEAST_PERK_EFFECT:0 "#F Спектр может проецировать свои мысли на небольшое расстояние.#!"
 ARCANOI_TRANSFER_ANGST_PERK_EFFECT:0 "Улучшает [character_interaction|E] «Искажение», позволяя наделять цель свойствами, связанными со стрессом.\n#F Спектр может передавать Ангст Тени призрака.#!"
 ARCANOI_TWITCH_PERK_EFFECT:0 "Каждый $bound_wraith$ добавляет: [GetModifier( 'arcanoi_twitch_perk_modifier' ).GetNameWithTooltip|L]. Это суммируется.\n#F Мориман может заставить призрака совершать небольшие движения.#!"
 ARMORY_PERK_EFFECT:0 "[PODUnlocksCombatMove('POD_combat_move_wraith_armory')]\nРазблокирует варианты [GetModifier('POD_shapeshift_form_limb_weapon_modifier').GetNameWithTooltip] и [GetModifier('POD_shapeshift_form_skin_armor_modifier').GetNameWithTooltip] при изменении облика.\n#F Масочник может временно превратить свои конечности в оружие ближнего боя, а кожу — в броню.#!"
 AURA_OF_CORRUPTION_PERK_EFFECT:0 "Каждые 5 лет с вероятностью 25% вы получаете [GetModifier('aura_of_corruption_modifier').GetNameWithTooltip].\n#F Благодаря этому Шипу Тень каким-то образом оскверняет облик призрака, делая его присутствие неприятным для других призраков.#!"
 AWAKEN_LATENT_THORNS_PERK_EFFECT:0 "Улучшает [character_interaction|E] «Искажение», позволяя наделять цель отрицательным ментальным свойством.\n#F Спектр может создавать новые Шипы у Тени.#!"
 A_SINGLE_THREAD_PERK_EFFECT:0 "Улучшает [character_interaction] «[GetPerk('ignite_perk').GetName(GetPlayer)]», устраняя штраф к отношению.\n#F Адвокат может незаметно направлять призрака к действиям, которые кажутся более естественными.#!"
 BAD_LUCK_PERK_EFFECT:0 "Каждые 5 лет с вероятностью 25% вы получаете [GetModifier('bad_luck_modifier').GetNameWithTooltip].\n#F Тень может потратить очко Ангста, чтобы заставить Психею повторить проверку.#!"
 BENEFICE_PERK_EFFECT:0 "#F Спектр может вложить часть себя в живого человека, чтобы наделить его спектральными силами.#!"
 BID_PERK_EFFECT:0 "#F Спектр может приручать звероподобных Спектров, таких как куэй.#!"
 BITE_ME_PERK_EFFECT:0 "#F Привидение может создать из своего [Concept('Corpus', 'Корпуса')|E] еду, которая выглядит настоящей, но отвратительна на вкус.#!"
 BLISSFUL_UNITY_PERK_EFFECT:0 "#F Спектр становится преобладающей сущностью в душе, не уничтожая её.#!"
 BODYSHAPE_PERK_EFFECT:0 "Как [character_interaction|E], позволяет менять собственные [physical_trait|E].\n#F Масочник может придать своему [Concept('Corpus', 'Корпусу')|E] любую форму.#!"
 BONTE_ABYSSALE_PERK_EFFECT:0 "Каждые #V 3#! года вы получаете доступ к случайному отголоску исторического артефакта.\n#F Служитель заключает пакт с Les Mysteres, позволяющий призвать реликвию или артефакт с Острова под морем.#!"
 BREATH_OF_THE_GRAVE_PERK_EFFECT:0 "#F Страшила создаёт небольшой ледяной ветерок, проникающий сквозь Завесу.#!"
 BRILLIANCE_PERK_EFFECT:0 "[PODUnlocksCombatMove('POD_combat_move_wraith_jade_brilliance')]\n#F Гвардеец может заставить свою кожу сиять жутким внутренним блеском.#!"
 BROADCAST_PERK_EFFECT:0 "#F Спектр теперь может черпать информацию из любого источника в коллективном разуме, включая знания об Арканои.#!"
 CALCIFY_PERK_EFFECT:0 "#F Масочник может придать плазме твёрдую, более долговечную форму.#!"
 CALL_THE_SHADOW_PERK_EFFECT:0 "Улучшает [character_interaction|E] «Искажение», позволяя менять свойство личности цели на противоположное.\n#F Спектр может помочь Тени призрака одолеть его Психею.#!"
 CARVE_THE_CHAOS_PERK_EFFECT:0 "#F Спектр может придать [UmbraGlossaryLocalized('tempest','Буре')] желаемую форму — например, создать «декорации» для Страданий.#!"
 CASH_MONEY_PERK_EFFECT:0 "Как [character_interaction|E], позволяет превращать золото в Пафос.\n#F Торговец может превращать подношения в Пафос.#!"
 CASTING_THE_SCENE_PERK_EFFECT:0 "#F Мнемос может дать находящимся поблизости увидеть фрагмент чужого воспоминания.#!"
 CHARGE_OF_DUTY_PERK_EFFECT:0 "#F Восставший может заставить цель сосредоточиться на одном простом понятии.#!"
 CIMMERIAN_SHADE_PERK_EFFECT:0 "Скорость прогресса [espionage|E]: #P +[EmptyScope.ScriptValue('digging_for_dirt_perk_percentage')|0]%#!\n#F Даёт доступ к тайнам из прошлого цели в виде призрачного голоса.#!"
 COLLECTIVE_ORACLE_PERK_EFFECT:0 "#F Спектр может отдать другому Спектру точный приказ, который тот обязан выполнить.#!"
 CONTROL_CREATURE_PERK_EFFECT:0 "Как [character_interaction|E], позволяет обзавестись питомцем.\nКак [character_interaction|E], позволяет призвать питомца на войну.\nПозволяет нанимать несколько видов животных в качестве [men_at_arms|E].\n#F Эта способность похожа на «Обуздание разума», но действует только на животных.#!"
 CORPUS_CONDUIT_PERK_EFFECT:0 "Как [character_interaction|E], позволяет продавать [Corpus|E] другим призракам.\n#F Ростовщик может передавать [Corpus|E] между собой и другим существом.#!"
 COWING_THE_BESTIAL_SPIRIT_PERK_EFFECT:0 "#F Земледелец может внушить существу со свойством «[GetTrait('barghest').GetName( GetPlayer )]» чистый ужас.#!"
 CREATE_WHITE_JADE_PERK_EFFECT:0 "#F Ремесленник может превращать души в Белый нефрит.#!"
 DANGEROUS_DISTRACTION_PERK_EFFECT:0 "#F Спектр создаёт сложную иллюзию, воздействующую на обоняние, зрение и осязание.#!"
