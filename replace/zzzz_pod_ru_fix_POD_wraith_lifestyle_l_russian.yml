 TABULA_RASA_PERK_EFFECT:0 "Улучшает [character_interaction|E] «$POD_erasure_interaction$»: теперь позволяет стирать и воспоминания пленников.\n#F Мнемос может навсегда стереть воспоминание из чужой памяти.#!"
 TAINTED_RELIC_PERK_EFFECT:0 "Увеличивает стоимость сохранения [Concept('Fetter', 'оков')|E] во время Катарсиса, выраженную в [Concept('static_stress', 'стрессе')|E].\n#F У Тени есть важная реликвия — оружие или иной полезный предмет, — которая проявляется, когда Тень берёт верх.#!"
 TAINTED_TOUCH_PERK_EFFECT:0 "Каждые 5 лет с вероятностью 25% вы получаете [GetModifier('tainted_touch_modifier').GetNameWithTooltip].\n#F Этот Шип превращает призрака в подобие Тифозной Мэри среди неупокоенных душ.#!"
 TARGET_LOCK_PERK_EFFECT:0 "Улучшает [character_interaction|E] «[GetPerk('driving_urge_perk').GetName(GetPlayer)]», заменяя [weak_hook|E] на [strong_hook|E].\n#F Восставший может заставить цель сосредоточиться на одной вещи или человеке до крайней степени одержимости.#!"
 TEMPEST_FURY_PERK_EFFECT:0 "#F Спектры могут призвать силу [UmbraGlossaryLocalized('tempest','Бури')], чтобы причинить разрушения в ограниченных масштабах.#!"
 TEMPUS_FUGIT_PERK_EFFECT:0 "Накладывает [modifier|E] [GetModifier('tempus_fugit_modifier').GetNameWithTooltip] на союзных [commanders|E], когда вы выступаете в роли [commander|E] во время [combat_phase|E].\n#F Привидение может в ограниченных пределах изменять расстояние и время.#!"
 TESSERACT_BOMB_PERK_EFFECT:0 "Накладывает [modifier|E] [GetModifier('tesseract_bomb_modifier').GetNameWithTooltip] на вражеских [commanders|E], когда вы выступаете в роли [commander|E] во время [combat_phase|E].\n#F Привидение может превратить здание в лабиринт с кошмарной геометрией, делая невозможным как вход в него, так и выход.#!"
 THE_COINCIDENTAL_GATHERING_PERK_EFFECT:0 "Согласие на приглашение ко [Concept('court', 'двору')|E]: #P +40#!\n#F Восставший может свести нескольких людей вместе на «случайной» встрече.#!"
 THE_EMPERORS_SERVANT_PERK_EFFECT:0 "#F Учёный может закрепить в сознании других призраков постоянные приказы.#!"
 THE_FACE_IN_THE_CROWD_PERK_EFFECT:0 "Улучшает [Concept('perk', 'достоинство')|E] «[GetPerk('fortuitous_wandering_perk').GetName(GetPlayer)]», повышая вероятность повторного срабатывания с 10% до 20%.\n#F Восставший может определить, связан ли человек с одной из его Страстей или [Concept('Fetters', 'оков')|E].#!"
 THE_GLEAMING_PERK_EFFECT:0 "[PODUnlocksCombatMove('POD_combat_move_wraith_the_gleaming')]\nКак [character_interaction|E], накладывает на артефакт выбранной цели модификатор [GetModifier('intimation_the_gleaming_modifier').GetNameWithTooltip].\n#F Адвокат может заставить предмет казаться более желанным, чем он есть на самом деле.#!"
 THORN_MANIFESTATION_PERK_EFFECT:0 "Каждые 5 лет с вероятностью 25% вы получаете [GetModifier('thorn_manifestation_modifier').GetNameWithTooltip].\n#F Потратив Ангст, Тень может материализоваться в виде отдельной от призрака сущности.#!"
 THORN_SHADOWPLAY_PERK_EFFECT:0 "#F Тень может предложить Психее дополнительное действие после того, как призрак израсходует все свои действия.#!"
 THORN_WHISPERS_PERK_EFFECT:0 "Увеличивает вероятность потери контроля над своей Тенью.\nСнижает вероятность успешного восстановления контроля над своей Тенью.\n#F Тень с этим Шипом может говорить с Тенями других призраков без ведома их Психей.#!"
 THRESHOLD_PERK_EFFECT:0 "#F Спектр может видеть смутные образы сквозь Завесу.#!"
 TRANCE_PERK_EFFECT:0 "#F С помощью принадлежащего цели предмета или посетив недавно покинутое ею место, Мориман может определить её нынешнее местонахождение.#!"
 TRANSFER_PERK_EFFECT:0 "[PODUnlocksCombatMove('POD_combat_move_wraith_jade_transfer_pathos')]\nКак [character_interaction|E], позволяет получить Пафос от пленника или продать Пафос другим призракам.\n#F Торговец может передать Пафос посредством физического контакта.#!"
 TRANSFUSE_PERK_EFFECT:0 "Как [character_interaction|E], позволяет получать Пафос от призрака, в которого вы вселились.\n#F Тваштрия может забирать Пафос у своего носителя или передавать его ему.#!"
 TRANSMOGRIFY_PERK_EFFECT:0 "Ковка душ даёт лучший результат.\n#F Тваштрия может превратить [Corpus|E], в который вселился, в аморфную субстанцию души, чтобы затем придать ей форму изнутри.#!"
 TRANSPARENT_MEMORIES_PERK_EFFECT:0 "#F Спектр может пользоваться всеми своими чувствами сквозь Завесу.#!"
 TRIBAL_COMMUNE_PERK_EFFECT:0 "#F Спектр может извлечь из коллективного разума сведения, которые он прежде знал.#!"
 TRICK_OF_THE_LIGHT_PERK_EFFECT:0 "Каждые 5 лет с вероятностью 25% вы получаете [GetModifier('trick_of_the_light_modifier').GetNameWithTooltip].\n#F С помощью этого Шипа Тень незаметно изменяет восприятие Психеи.#!"
 TWITCH_PERK_EFFECT:0 "Разблокирует [character_interaction|E] «Одержимость», позволяющее получить слабое влияние на цель.\n[PODUnlocksCombatMove('POD_combat_move_wraith_twitch')]\n#F Кукловод может на мгновение взять под контроль конечность своего носителя.#!"
 UNBIDDEN_HANDS_PERK_EFFECT:0 "#F Спектр может заставить тело совершить действие, пока цель отвлечена.#!"
