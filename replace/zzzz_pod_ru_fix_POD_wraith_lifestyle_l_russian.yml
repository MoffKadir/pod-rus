 UNITY_OF_BEING_PERK_EFFECT:0 "#F Спектр может временно отделиться от коллективного разума.#!"
 URGES_PERK_EFFECT:0 "#F Спектр может преодолеть Силу воли цели и заставить её совершить действие.#!"
 VAMPIRIC_NATURE_PERK_EFFECT:0 "Каждые 5 лет [Concept('perk', 'достоинства')|E], усиливающие вашу Тень, получают дополнительный шанс сработать.\n#F Этот Шип позволяет Тени вытягивать Ангст из других ради собственных целей.#!"
