 EARLY_WITHDRAWAL_PERK_EFFECT:0 "[PODUnlocksCombatMove('POD_combat_move_wraith_early_withdrawal')]\n#F Ростовщик может одним прикосновением украсть чужую жизнь.#!"
 ECHOES_PERK_EFFECT:0 "#F Позволяет Спектру видеть сквозь Завесу.#!"
 EMOTIONAL_INFECTION_PERK_EFFECT:0 "#F Спектр может внедрять Тёмные страсти в чужое сознание.#!"
 EMPOWER_JADE_PERK_EFFECT:0 "$unlock_enhancing_node$ Добавляет [modifier|E] в зависимости от типа [Concept('artifact', 'артефакта')|E].\n#F Ремесленник может пробудить душу, из которой состоит предмет, и наделить её Арканосом или Пафосом.#!"
 ENGAGEMENT_PERK_EFFECT:0 "#F Разумом бака можно манипулировать с помощью тонкого внушения.#!"
 ERASURE_PERK_EFFECT:0 "[PODUnlocksCombatMove('POD_combat_move_wraith_erasure')]\nКак [character_interaction|E], позволяет стереть воспоминание, чтобы уменьшить стресс.\n#F Мнемос может стереть воспоминание из собственной памяти.#!"
 ESCHERS_STAIR_PERK_EFFECT:0 "Как [character_interaction|E], позволяет переместить армию туда, где находится цель, с риском затеряться в [UmbraGlossary('pod_realm_labyrinth')].\n#F Привидение может связать два дверных проёма или других портала через [UmbraGlossary('pod_realm_labyrinth')].#!"
 EXCHANGE_RATE_PERK_EFFECT:0 "Как [character_interaction|E], позволяет превращать Пафос в [Corpus|E].\n#F Ростовщик может превращать Пафос в Корпус и наоборот.#!"
 FAVORED_FLOTSOM_PERK_EFFECT:0 "#F Эта способность похожа на «Ухватить проплывающее», но позволяет Спектру повлиять на выбор извлекаемого предмета так, чтобы тот оказался полезен.#!"
 FETTER_RAPE_PERK_EFFECT:0 "Позволяет заменить свойство «[GetTrait('wraith').GetName( GetNullCharacter )]» на «[GetTrait('risen').GetName( GetPlayer )]».\n#F Спектр может осквернить остатки души в умершем носителе [Concept('Fetter', 'оков')|E], чтобы ненадолго превратить его в существо со свойством «[GetTrait('risen').GetName( GetPlayer )]».#!"
 FILIAL_DUTY_PERK_EFFECT:0 "#F Учёный может склонить цель к добровольному сотрудничеству.#!"
 FINDING_THE_HIDDEN_GHOST_PERK_EFFECT:0 "[PODUnlocksCombatMove('POD_combat_move_wraith_jade_find_hidden_ghost')]\n#F Земледелец может определить местонахождение любого находящегося поблизости существа со свойством «[GetTrait('barghest').GetName( GetPlayer )]».#!"
 FLASHBACK_PERK_EFFECT:0 "#F Восставший может вызвать образ важного события, произошедшего с его [Concept('Fetters', 'оковами')|E] или рядом с ними.#!"
 FLEETING_GLIMPSES_PERK_EFFECT:0 "#F Спектр может ясно видеть область [Glossary('Земель Плоти','game_concept_skinlands_desc')].#!"
 FORM_OF_CHAOS_PERK_EFFECT:0 "Позволяет создать персонажа-[GetTrait('automaton').GetName( GetPlayer )].\n#F Привидение может создать грубое подобие человеческой фигуры из того, что выглядит как отвратительные вещества и существа: кровь, личинки, насекомые и тому подобное.#!"
 FORTUITOUS_MEETING_PERK_EFFECT:0 "Согласие на приглашение ко [Concept('court', 'двору')|E]: #P +20#!\n#F Восставший может изменить Судьбу так, чтобы встретиться с тем, с кем хочет поговорить или повидаться.#!"
 FORTUITOUS_WANDERING_PERK_EFFECT:0 "[PODUnlocksCombatMove('POD_combat_move_wraith_risen_lucky_break')]\nКаждое срабатывание Страсти с вероятностью 10% может повториться.\n#F Восставший может обнаружить подсказки, которые приведут его к одной из его Страстей.#!"
 FOUL_HUMOUR_PERK_EFFECT:0 "Накладывает [modifier|E] [GetModifier('foul_humour_modifier').GetNameWithTooltip] на союзных [knights|E], когда вы выступаете в роли [commander|E] во время [combat_phase|E], или на вас во время [single_combat_duel_plural|E] (если вы выступаете в роли [commander|E] во время [combat_phase|E]).\n#F Привидение может вызвать мощный материальный эффект сквозь Завесу.#!"
 FREUDIAN_SLIP_PERK_EFFECT:0 "Каждые 5 лет с вероятностью 25% вы получаете [GetModifier('freudian_slip_modifier').GetNameWithTooltip].\n#F Ценой одного очка Ангста Тень может заставить призрака совершить внезапное непроизвольное действие или выпалить что-нибудь, не обдумав свои слова.#!"
 FURTHER_REFLECTION_PERK_EFFECT:0 "Как [character_interaction|E], позволяет завязать новые отношения с другим персонажем.\n#F Мнемос может проецировать свои воспоминания в чужой разум.#!"
 GIVE_HIGHER_PASSIONS_PERK_EFFECT:0 "Как [character_interaction|E], позволяет удалить [decision|E] Тёмной страсти.\n#F Доктор может попытаться заменить Тёмную страсть своего свойства «[GetTrait('shadow').GetName( GetPlayer )]» одной из собственных Страстей.#!"
 GRASP_THE_PASSING_PERK_EFFECT:0 "#F Спектр может вытащить из [UmbraGlossaryLocalized('tempest','Бури')] случайный предмет или даже воспоминание.#!"
 GRAY_MAN_PERK_EFFECT:0 "Как [character_interaction|E], позволяет лишить цель отношений, супруга и престижа.\n#F Мнемос может стереть кого-либо из коллективной памяти всех, кто его знает.#!"
 HIVE_AWARENESS_PERK_EFFECT:0 "#F Спектр может напрямую общаться с другими членами своей стаи.#!"
 HOMECOMING_PERK_EFFECT:0 "#F Цель полностью погружается в иллюзию дорогого ей места в [Glossary('Землях Плоти','game_concept_skinlands_desc')].#!"
 HONEYED_TONGUE_PERK_EFFECT:0 "Увеличивает вероятность потери контроля над своей Тенью.\n#F Тень обладает почти сверхъестественным даром убеждения и при желании может пустить в ход всё своё обаяние.#!"
 IGNITE_PERK_EFFECT:0 "Как [character_interaction|E], позволяет заставить цель совершить выбранное действие с высоким риском неудачи.\n#F Адвокат может внушить призраку сильное желание, которое повлияет на его жизнь.#!"
