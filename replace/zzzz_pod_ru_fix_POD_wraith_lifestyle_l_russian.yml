 WORMHOLE_PERK_EFFECT:0 "#F Позволяет Спектру использовать провалы «[GetModifier('nihil_modifier').GetNameWithTooltip]», чтобы перемещаться между [UmbraGlossaryLocalized('tempest','Бурей')] и [UmbraGlossaryLocalized('shadowlands','Загробным миром')].#!"
