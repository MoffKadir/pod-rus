l_russian:
 action_can_ravage_mortal_alert:0 "Вы можете опустошить смертного!"
 action_can_ravage_mortal_alert_click:0 "#I Нажмите, чтобы опустошить случайного #TOOLTIP:GAME_TRAIT,mortal,[GetNullCharacter] #L смертного#!#!#!"
 action_can_ravage_mortal_alert_desc:0 "[GetDoctrine('doctrine_fae_morality_unseelie').GetBaseName] #TOOLTIP:GAME_TRAIT,fae,[GetNullCharacter] #L феи#!#! могут опустошать #TOOLTIP:GAME_TRAIT,mortal,[GetNullCharacter] #L смертных#!#! от их творческого потенциала без каких-либо последствий."
 action_can_ravage_mortal_alert_label:0 "Есть смертный, которого можно опустошить ради гламура!"
 action_high_banality_alert:0 "Вы близки к развоплощению!"
 action_high_banality_alert_click:0 ""
 action_high_banality_alert_desc:0 "Ваша [Concept('banality', 'банальность')|E] критически высока. Если она достигнет значения #N 100#!, вы #N умрёте#!. Воспользуйтесь одним из [Concept('journeys', 'странствий')|E] #V Поиски гламура#!, чтобы снизить банальность."
 action_high_banality_alert_label:0 "Вы близки к развоплощению!"
 action_reactive_advice_banality:0 "Совет: Банальность"
 action_reactive_advice_banality_click:0 "$click_to_open_lesson$"
 action_reactive_advice_banality_desc:0 "[Concept('banality', 'Банальность')|E] является основной механикой фей. Откройте эту вкладку, чтобы узнать больше о том, что это значит для вас."
 lesson_about_banality:0 "$reactive_advice_banality$"
 lesson_about_banality_desc:0 "Сила человеческого неверия, банальность, является главной угрозой для фей, поскольку она олицетворяет противоположность их существованию, самой магии.\n\nНо для фей существование в Осеннем мире означает постепенное усиление скептицизма окружающих их смертных. Что-то, что может привести к #R смерти#!."
 lesson_banality_ending_notes:0 "Банальность: Общее представление"
 lesson_banality_ending_notes_desc:0 "Вкратце:\n$BULLET_WITH_TAB$Сведите к минимуму свой ежегодный прирост [Concept('banality', 'банальности')|E] и не используйте [Concept('cantrips', 'чары')|E] с низкой вероятностью успеха\n$BULLET_WITH_TAB$Когда ваша [Concept('banality', 'банальность')|E] достигнет примерно #V 30#!, отправляйтесь в [Concept('journey', 'странствия')|E]. Выберите то, которое лучше всего соответствует вашим [Concept('skills', 'навыкам')|E], либо то, недостаток которого наименее ощутим для вас.\n$BULLET_WITH_TAB$Некоторые важные [Concept('decisions', 'решения')|E] могут отключить источники [Concept('banality', 'банальности')|E].\n$BULLET_WITH_TAB$И самое главное, #bold не позволяйте ей достичь 100!#!"
 lesson_banality_objectives:0 "Противостояние банальности"
 lesson_banality_objectives_desc:0 "Важным аспектом [Concept('banality', 'банальности')|E] являются связанные с ней цели.\n\nНекоторые способы получить [Concept('banality', 'банальность')|E] также имеют цель, которая их отключает. Или, по крайней мере, делает их менее болезненными для вас.\n\nНапример, «$game_concept_banality_reason$» отключается после выполнения цели #V $destroy_order_of_reason_objective_decision$#!."
 lesson_gaining_banality:0 "Прирост банальности: Путь к гибели"
 lesson_gaining_banality_desc:0 "Каждый год все феи получают некоторое количество [Concept('banality', 'банальности')|E], проявляющееся в [Concept('trait', 'свойстве')|E] #V Банальность#!. Если её значение когда-либо достигнет #V 100#!, персонаж #R умрёт#!.\n\nВсего существует 5 способов получить [Concept('banality', 'банальность')|E]: $game_concept_banality_realm_disbelief$, $game_concept_banality_local_disbelief$, $game_concept_banality_reason$, $game_concept_banality_fae_hunting$ и $game_concept_banality_despair$.\n\nКроме того, неудача в наложении [Concept('cantrip', 'чар')|E] приведёт к росту [Concept('banality', 'банальности')|E] на #N +1#!."
 lesson_losing_banality:0 "Снижение банальности: Поиски гламура"
 lesson_losing_banality_desc:0 "Снижение [Concept('banality', 'банальности')|E] требует #V активных#! усилий с вашей стороны.\n\nЕсть только один реальный способ снизить [Concept('banality', 'банальность')|E], и это завершение [Concept('journey', 'странствия')|E] #V Поиски гламура#!.\n\nВы можете начать поиски одного из трёх типов. Каждый из них приводит к одинаковым результатам, но требует разных [Concept('skills', 'навыков')|E] и имеет разные недостатки."
 reactive_advice_banality:0 "Банальность: Проклятие фей"
