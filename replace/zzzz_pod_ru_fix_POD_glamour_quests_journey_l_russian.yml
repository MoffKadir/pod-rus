l_russian:
 POD_glamour_quests_journey.1.a:0 "Моя клятва выполнена"
 POD_glamour_quests_journey.1.desc:0 "Фейри могут помешать Банальности закрепиться в их душах, как описано выше, но чтобы освободить душу, которая уже почувствовала ледяное прикосновение Банальности, необходимо принять более серьезные меры. Единственный способ согреть душу — это взяться за квест, который перекликается со Сновидением, связать свою душу с этим квестом клятвой и выполнить клятву. Такие клятвы могут быть приняты индивидуально или группой — Фейри из разношерстной группы, которые все клянутся в одной и той же цели, все получат выгоду, если они добьются успеха. \n\nИ я, после многих долгих лет, наконец, сделал то, чего требовала от меня моя клятва. И вместе с этим я чувствую, что власть Банальности над моей душой значительно ослабевает."
 POD_glamour_quests_journey.1.t:0 "Квест Гламура"
 glamour_quest_widget_desc:0 "Продолжать очищать себя от [banality|E]?"
 glamour_quest_widget_tt:0 "Вы сразу запустите еще один [journey|E] того же типа."
