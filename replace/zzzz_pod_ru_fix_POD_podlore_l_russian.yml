 POD_persistentpodlore.desc.560126:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nDữu Туи, долгое время находящийся в тени, наблюдает, как Дракон танцует в облаках, нанося ущерб всем, кто находится под ним, а другой поднимается из джунглей в ярости, которая грозит навлечь на них гнев земли. Когда суд вокруг нее падает, что вообще остается делать ученице? \n\nDữu Туи в жизни была секс-работницей на вьетнамском побережье, убитой в споре о платежах своим «хранителем». В Яме соли и железа ей пришлось провести еще больше времени в своей смертной жизни, доведенной до крайностей. \nНо она была терпелива и умела обращаться с кнутом как со своими клиентами, так и с самой собой. В аду она узнала, что даже после смерти она никогда не была более живой, когда ее терзала боль. \n\nИспользуя свой энтузиазм в качестве прикрытия, она смогла убедить дьявола позволить им провести сеанс в мире живых, откуда она быстро сбежала на свободу. \nНайденная, а затем цивилизованная Дьянангом как одна из ее учениц, Доу Туи была набожной, хотя и пугающей, последовательницей Бьющиеся Драконы.\n\nНо это было тогда. И вот она стоит на распутье. Ее наставник отстранился и практически оставил мир позади, а [akuma|E] теперь свирепствует. \n\nНо, тем не менее, ее коллега-ученик, Пияу, более радикален, чем даже она. Дуу Туи разрывается, поскольку ситуация требует действий. Поэтому она должна действовать, чтобы не стать жертвой окружающих ее Дьяволов. \n\nВопрос в том, на стороне какого Дракона ей следует встать?"
 POD_persistentpodlore.desc.790171:0 "Этот персонаж является частью $pod_wod$, но имеет очень ограниченную предысторию. По существу, разработчики PoD расширили его, чтобы добавить большей глубины сеттингу. \n\nЖизнь Мозараба, христианина среди мусульман в Аль-Андалусе, часто была лишена безопасности. Но смертный Макарио не обратил на это внимания. Благодаря его швейным иглам жестокий мир прекратил свое существование.\nЖизнь среди семьи ремесленников продолжалась... до тех пор.\n\n1147 год – Лиссабон стал свидетелем осад и грабежей. Под эгидой папского крестового похода король Португалии возглавил континент крестоносцев, чтобы провозгласить христианский мир. \n\nОднако одержав победу, крестоносцы не знали никаких ограничений. Будь то мусульманин или Мосараб, конца не было: убийства, грабежи, разврат, чума… \nЛиссабон изменился. \nПотерял все, даже Макарио видел: ему пришлось опустить иглу. \n Возглавляя бунтовщиков, чтобы отомстить за товарища-портного, Макарио в свой последний день носил белое белье. Но смерть не пришла.\nВместо этого старейшины Герусии клана Бруха обняли его.\nНе желая взять власть самостоятельно, пойти на компромисс...\nМакарио, принц Лиссабона.\n\nОднако ошеломленный Макарио отказался принять бремя.\nНе имея указаний других Бруха, он быстро стал неспособен принять других каинитов или свою собственную реальность.\n\nБудущая судьба\nВисенте де Кардона развращает самых выдающихся каинитов города в свою пользу. В результате жестокого переворота, устроенного Львами Родриго, Висенте берет на себя кратковременный контроль над городом около 1230 года.\nНигде его не найти, Макарио объявлен мертвым."
 POD_persistentpodlore.desc.790677:0 "Этот персонаж является частью $pod_wod$, но имеет очень ограниченную предысторию. Таким образом, разработчики PoD расширили его, чтобы добавить сеттингу большую глубину.\n\nВо времена, когда Рука не вела свою собственную историю, Мохададжи был старейшим жрецом Идрана, круга магов смерти, которые служили Колесу возрождения и жаждали нанести на карту то, что лежало за его пределами. Для их великого обряда требовалась душа, готовая навсегда выйти из цикла, оторванная от каждой будущей жизни, чтобы живое могло, наконец, допросить саму смерть. Мохададжи предложил себя. Круг связал украденную плоть и $pod_vitae$ пленника $pod_cainite$ в его тело, и он воскрес как первый из Нагараджи, бессмертный и проклятый питаться плотью как живых, так и мертвых. Те из идранцев, которые последовали за ним в проклятие, называют его источником своей родословной и удостаивают его титулом, полученным в результате обряда: Добровольное Жертвоприношение.\n\nКогда Идран были объединены в Тал'Махе'Ра, Мохададжи служил мертвым Еноху и собирал секреты восточной Руки, как скряги копят монеты. Именно туда ямасаттва Ямаданда, который шел по Лабиринту рядом с Анделеоном и вернулся несвязанным, пришел в поисках душ, которым он мог доверять, против того, что вернулось с ними. С разума Мохададжи содрали кожу на предмет тайн и проткнули железными иглами в поисках нечистот, но он оказался чистым. Он был связан среди первых Элиудов, скрытых стражей Руки против порчи. Старейшие тексты называют Асакку, некоторые даже шепчутся, что это его рука записала Леонатические свитки из собственного чтения Ямаданды.\n\nЯмаданда ушел тысячу лет назад. В его отсутствие «Желанная жертва» несет восточное дежурство: терпеливая паутина глаз, курьеров и информаторов, простирающаяся от Ганга до дворов Персии, куда сами мертвецы несут свои отчеты, высматривая плоть, которая движется неправильно, и ожидая, пока враг покажет свою руку.\n\nБудущая судьба в Канон\nОн перейдет к $pod_Embrace$ Родриго ад-Дахилу, ключевому члену Тал'махе'Ра в будущем."
 POD_persistentpodlore.desc.791120:0 "Этот персонаж является частью $pod_wod$, но имеет очень ограниченную биографию. Поэтому разработчики PoD расширили её для придания большей глубины сеттингу.\n\nТаруга имеет сомнительную честь быть лидером доминирующего в настоящее время [Glossary('ву','podgloss.wu')] в разрушающемся и упадочном дворе Черных Черепах. Великая честь и ответственность, хотя высокомерный кочевник в основном признает первое.\nТамуга и Бесплодный Ветер, успех в основном достигается благодаря их готовности принять перемены и различные кочевые народы, которые проносились по степям на протяжении веков. Эта готовность адаптироваться выдвинула их на передний план дворовой политики Черной Черепахи, поскольку другие [Glossary('ву','podgloss.wu')] теперь смотрят на них как на наиболее подходящих для выживания в эти тревожные и противоречивые времена. \nA, однако, мало кто беспокоится, что предоставление большей власти Таруге приведет только к еще большим проблемам. \n\nК сожалению, они правы. \n\nХотя компетентный Будучи судьей характера и способным политиком, Таруга - плохой стратег, и ему не хватает видения, выходящего за рамки его собственных политических махинаций. Полностью отвергнув [Glossary('Анда','podgloss.anda')] как потенциальную угрозу, он твердо нацелил свой [Glossary('ву','podgloss.wu')] на бесконечные и мелкие стычки с двором Желтого Императора на юге, где, по его мнению, можно было бы завоевать больше славы. Во внутренних делах Таруга также не обладает дальновидностью. Его продолжающийся конфликт с Всадниками Черных Копыт [Glossary('ву','podgloss.wu')] только вызвал еще большее недоверие и ослабление Черной Черепахи. Из-за этих повторяющихся ошибок не потребуется много времени, чтобы все, что он построил до сих пор, рухнуло. \n\nБудущая судьба\n\n Шпионы [Glossary('Анда','podgloss.anda')] классифицируют Таруга как низкую угрозу и даже как потенциально полезный дестабилизирующий фактор, если его оставить в живых. Они будут правы. \nТаруга откажется направить свой [Glossary('ву','podgloss.wu')] против них, пока не станет слишком поздно, в результате чего ему придется позорно бежать к двору Желтого Императора за помощью, когда Дайду пал. \n\nПоскольку двор Желтого Императора находился в процессе распада, его предупреждение будет проигнорировано, и он будет казнен за свои прошлые нарушения против китайских судов."
 POD_persistentpodlore.desc.791121:0 "Этот персонаж является частью $pod_wod$, но имеет очень ограниченную биографию. Поэтому разработчики PoD расширили её для придания большей глубины сеттингу.\n\nСуровый и строгий Тан Банши возглавляет Наездников Черных Копыт [Glossary('ву','podgloss.wu')], которые некоторые считают второй по силе фракцией во дворе Черных Черепах. Многие могли бы подумать, что лидер такого традиционалиста [Glossary('ву','podgloss.wu')] сам будет строгим сторонником жесткой линии, но, по правде говоря, Тан Банши дорос до этой роли из-за политических проблем. \n\nВ начале своей не-жизни, видя, что новаторским Бесплодным Ветрам не хватает организованного аналога, Банши ухватился за эту роль, чтобы быстро завоевать уважение более политически отстраненных, но традиционно консервативных, старших Предков. Эта уловка сработала хорошо, но, возможно, даже слишком хорошо. \n\nБанши оказался в окружении персонажей, даже в его собственном [Glossary('ву','podgloss.wu')], которые находились на грани между \"традициями\" и \"фанатизмом\". Это приводит к тому, что все больше и больше молодых [Glossary('ву','podgloss.wu')] отделяются от Черной Черепахи и ищут другие способы процветания за пределами удушающих ограничений и правил, пропагандируемых приспешниками Банши. \n\n Однако сам человек не дурак, и он знает, что этот путь может привести только к ослаблению двора, особенно по мере того, как конфликт с Бесплодными Ветрами становится все более и более накаленным. Сейчас он взвешивает возможность тонкого изменения своей политической позиции, чтобы, надеюсь, спасти двор Черной Черепахи. На данный момент он пришел к выводу, что это не стоит затрат его политического капитала. \n\nБудущая судьба\n\nБанши станет одной из жертв печально известного нападения [Glossary('Анда','podgloss.anda')] на собрание руководства двора Черной Черепахи в 1261 году. \n\nПо иронии судьбы, именно тогда он наконец собирался предложить свой план изменения курса."
 POD_persistentpodlore.desc.791122:0 "Этот персонаж является частью $pod_wod$, но имеет очень ограниченную биографию. Поэтому разработчики PoD расширили её для придания большей глубины сеттингу.\n\nСуровая Сян Ли — неофициальный лидер Огненной бури [Glossary('ву','podgloss.wu')], хотя ей самой не нравится, когда ее называют этим титулом. Эта почетная награда досталась ей потому, что она самый заметный член своей фракции во дворе. Пока остальные рыскают по пустыне Гоби в поисках реликвий и артефактов, она занимается торговлей между своим народом и двором Черной Черепахи. \n\nЭти знания о коварной местности и владение ценными артефактами принесли ей большой (нежелательный) политический авторитет, заставив некоторых думать, что Огненный Шторм может стать той стабилизирующей силой, которая необходима двору Черной Черепахи, чтобы пережить надвигающуюся бурю. Если это так, то эти голоса будут разочарованы. \nСян Ли хорошо представляет свой народ, и у ее народа нет времени на политические проблемы. \n\nОднако она не слепа к надвигающейся буре и потихоньку начала налаживать контакты с другими Дворами, чтобы потенциально переместить свой [Glossary('ву','podgloss.wu')], если Черная Черепаха будет захвачена или сломана сама по себе. К сожалению, пока эти контакты ни к чему не привели. Многие отдаленные дворы, по-видимому, уже подпали под влияние [Glossary('Дохор-хана','podgloss.dokhorkhan')] или слишком слабы, чтобы быть потенциальным убежищем. \nИ поэтому снаружи Сян Ли по-прежнему остается суровым торговцем, представляющим ее [Glossary('ву','podgloss.wu')] своим острым языком и зорким глазом. Однако внутри она близка к панике, поскольку видит, что время для подготовки становится все короче и короче.\n\nБудущая судьба\n\nСян Ли исчезнет, когда [Glossary('Анда','podgloss.anda')] начнут атаку, оставив ее [Glossary('ву','podgloss.wu')] легкой добычей.\n\nПравда не будет найден до тех пор, пока десятилетия спустя, когда победоносный Квинконкс очистит отдаленный двор, все еще находящийся в плену у [Glossary('Дохор-хана','podgloss.dokhorkhan')], и найдет сокровищницу артефактов и реликвий, залитых кровью."
 POD_persistentpodlore.desc.791174:0 "Этот персонаж является частью $pod_wod$, но имеет очень ограниченную биографию. Поэтому разработчики PoD расширили её для придания большей глубины сеттингу.\n\nПосле ошибки Раваны и растущего разочарования растущей наглостью его второго ребенка Джайендры, Чандрапутра почувствовал, что необходимо изменить то, как он выбирал своего ребенка. Кровь, которую он предложил, была мощной и мощной, а предыдущие методология и протокол отсутствовали. Итак, он попробовал новый метод. Того, кого он усыновит для всех будущих детей, когда его третий Индраджа превзойдет все его ожидания. \n\nИндраджа родился у легендарного Ашоки Великого и его последней супруги Тишьяракши, самого последнего сына в невероятно длинной линии преемственности. Даже его старшие братья по линии матери Тишьяракши были ее фаворитами, а он был всего лишь второстепенной мыслью, отнесенной к военной службе и политическому браку. \nНо то, чего ему не хватало в порядке рождения, он с лихвой компенсировал поведением. Суровый и лишенный юмора человек, решительный перед лицом опасности и никогда не дрогнувший даже перед самыми мрачными приказами, этот далекий принц привлек внимание Чандрапутры. Вместо того, чтобы сразу $pod_Embrace$ его, Чандрапутра принял его за гуля и начал проверять его ценности Майяпаришатьи и смотреть, как он преуспевает в качестве командира. И хотя Индраджа, по крайней мере, был способен командовать войной в открытом поле, его истинное мастерство заключалось в тех же искусствах, которыми была печально известна его мать, и он оказался провидцем, способным разглядеть и разрушить коварные планы асуратизайи до того, как они смогли осуществиться.\nИ после двух столетий опыта, тренировок и испытаний Чандрапутра счел нужным наконец наградить Индраджа Объятия.\n\nИ [Glossary('сир','game_concept_Sire_desc')] Индраджи не был разочарован. Индраджа был решающим противовесом и защитной мерой против интриг врагов и особенно умел ослаблять влияние Бану Хаким в Индии. Он станет главным стражем потайных палат и убежищ, в которых удерживаются важные члены кшатриев, и станет бесценной фигурой в вечной шахматной игре против их врагов. \n\nБудущая судьба\nРоль Индраджи как хранителя их убежищ и хозяина их шпионских сетей пришла, чтобы спасти его от немыслимого. Пока он занимался охраной гробницы Хазимеля, грянула Неделя Кошмаров, и только благодаря тому, что он оказался в ловушке внутри, ему удалось избежать бега на смерть от пробуждения своего гранда. \nКогда неделя закончилась, он будет охранять гробницу, пока путешественник не обнаружит себя с отсутствующим глазом, и он воссоединит силы, достаточно сильные, чтобы наконец выйти из бесконечной тупиковой ситуации."
 POD_persistentpodlore.desc.791534:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\n. В своей смертной жизни Рая была жрицей По Ину Нага, мифического основателя народа чам. О том времени у нее остались только приятные воспоминания, что резко контрастирует с ее смертью, о которой она не помнит. Поскольку она оказалась в Йоми, она боится, что сделала что-то настолько ужасное, что ее разум решил забыть в течение десятилетий, потерянных в аду. \n\nКакова бы ни была правда, Рая нашла в себе тихую силу и постоянную веру в свою богиню, которая поможет ей вынести Йоми. Недооцененная своими похитителями, она воспользовалась первой же представившейся ей возможностью сбежать. \n\nРайя достаточно легко влилась в общество $pod_kueijin$, сама став ученицей Даянанга и сыграв важную роль в некоторых успехах Алого Двора, таких как его теплая дипломатия с Дворами Зверей. Эти достижения и ее устойчивый рост в [Glossary('дхармы','podgloss.dharma')] сделали ее очевидной наследницей Дьянанга на пути к [Glossary('Сотня облаков','podgloss.hundredclouds')]. \n\n В последнее время ситуация изменилась. Рая, кажется, погрузилась в растущую меланхолию, некоторые шепчут, что это связано с ее сильной привязанностью к своей богине и осознанием того, что она последняя, ​​кто по-настоящему ее помнит. Сама Дьянанг пыталась разбудить свою ученицу, но, по-видимому, безуспешно, вынуждая Императрицу Алого Двора отложить собственное просветление из страха оставить двор неподготовленному Рае.\n\nЖрица только недавно пришла в себя, попросив отправиться в Чампу и стать здесь региональным предком, просьба, которая была удовлетворена в надежде возродить ее. пламя.\n\nБудущая судьба\nРайя не будет сопротивляться завоеванию Пияу, несмотря на пожелания многих во дворе. Покинув Ангкор, Дьянанг найдет ее, и они уйдут вместе. \nНекоторые говорят [Glossary('Сотня облаков','podgloss.hundredclouds')], некоторые говорят, что нужно в последний раз поприветствовать солнце."
 POD_persistentpodlore.desc.791542:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\n. По ее собственным воспоминаниям, Эйндра была довольна своей смертной жизнью. Заботливый муж, много здоровых детей и маленькая отдаленная деревня, в которой можно жить. Поэтому, оказавшись в [UmbraGlossaryLocalized('yomi_wan','ад Йоми')], она почувствовала сильное чувство несправедливости, думая, что вообще не заслуживает этого приговора. \nЭиндра не была готова к этому опыту, но она нашла в себе то, чего не ожидала, - упрямство. Она повторяла себе (и всем, кто слушал), что ее приговор был несправедливым, и поэтому никогда не опускалась до того, чтобы почувствовать что-либо от пыток ее похитителей. В конце концов, им надоела эта непреклонная женщина, и они просто отпустили ее. \n\nЧто ни для кого неудивительно, Эйндра не преуспела, когда ее заставили стать Бьющимся Драконом (которым, как ожидается, станут большинство придворных Алого Феникса). На ее вкус, слишком случайный и непостоянный [Glossary('дхармы','podgloss.dharma')]. Хотя она не нашла подходящего учителя в качестве альтернативы, вариант [Glossary('дхармы','podgloss.dharma')] «Блестящие угли», по крайней мере, позволил ей легче выразить свое разочарование. \n\nДаже после того, как вопрос с ее [Glossary('дхармы','podgloss.dharma')] был решен, Эйндра оказалась мрачной, угрюмой и убивающей настроение Присутствием в буйных и ярких Дворах Алого ордена. Поскольку она была политически изолирована, ее фактически сослали на самую западную границу Алого двора. \n Это более чем неблагодарная работа, поскольку ей приходится быть стражем от всех индийских ересей. \n\nКак ни странно, Эйндра вскоре научилась любить этого политического изгнанника. Ее непоколебимый характер проявляется в роли, где она должна препятствовать практически каждой попытке пересечь границу Алого ордена. \n\nБудущая судьба\nЭиндра едва заметит завоевание Пияу. Поскольку ее работа не изменилась, зачем ей это волновать? \n Со своей стороны, Золотые Королевы будут более чем счастливы позволить своему суровому привратнику продолжать охранять границу."
 POD_persistentpodlore.desc.791594:0 "Этот персонаж был создан разработчиками PoD, чтобы придать сеттингу большую глубину, и не является официальной частью $pod_wod$. \n\nНаттадеви родилась принцессой небольшого двора Декана, обученной храмовым танцам и протоколам трона, который она никогда не удержит. Когда предательство предало ее династию мечу, она одна избежала резни и провела последующие годы, уничтожая мужчин одного за другим, с терпением, которое привлекало внимание к более старым и холодным вещам. Слуги Мохададжи наблюдали, как она хоронила последнего из них. Когда не осталось мести, ради которой можно было бы жить, Желающая Жертва пришла к ней с другой войной, и она выбрала $pod_Embrace$ с открытыми глазами, как он сам когда-то выбрал проклятие. \n\nОна вынесла железные иглы, как и ее вербовщик до нее, и поклялась Элиуду, скрытым стражам Руки против скручивающей плоть порчи. Там, где паутина Мохададжи обнажает тела, выдолбленные и изношенные как одежда, Наттадеви приходится освободить владельца, и то, что требует обряд казни, Нагараджа потребляет. Те немногие, кто видел ее работу и выжил, говорят, что она сражается так же, как когда-то танцевала. \n\nВ восточном Тал'Ма'Ра ее причисляют к пяти Пальцам, скрытым инструментам, известным Руке только по цветам. О Черном, Белом, Желтом и Синем даже вазиры говорят осторожно, а Пальцы вообще не говорят друг о друге. Наттадеви — Красный Палец, и ее мандат — кровь."
 POD_persistentpodlore.desc.793153:0 "Этот персонаж является частью [Glossary('Мира Тьмы','game_concept_world_of_darkness_desc')], но имеет очень ограниченную биографию. Поэтому разработчики PoD расширили её для придания большей глубины сеттингу.\n\nТам, где есть великая сила, можно надеяться, что есть и великая мудрость. И хотя Сяо может утверждать, что обладает и тем, и другим, оба утверждения легче высказать, чем доказать.\n\nПервоначально Сяо был мелким магистратом, который в своей смертной жизни накопил богатство в таких масштабах, что случайно вызвал голод, и его первая жизнь закончилась, когда крестьяне ворвались в его поместье и насильно накормили его до смерти запасенным сырым зерном, отправив его в преисподнюю Кипящего масла. Как ему удалось спастись, неизвестно, однако он получил неплохое образование при дворе Жёлтого императора.\nУсердный ученик, помешанный на строгости и сдержанности, Сяо считался образцом благочестия. Итак, когда бывший предок дворов Лазурного дракона вознёсся к [Glossary('Сотне облаков','podgloss.hundredclouds')], двор Жёлтого императора активно ходатайствовал о том, чтобы Сяо принял бразды правления.\nНесмотря на протест местных [Glossary('куэй-дзин','game_concept_kuei_jin_desc')], угрозы конфликта в значительной степени заставили их подчиниться, и Сяо предстал перед двором.\n\nОднако травма, полученная Сяо в преисподней Кипящего масла, с самого начала предопределила его правление. Утратив свою власть и контроль над дворами Лазурного дракона, а также из-за отсутствия прямых действий по смягчению ущерба, который войны Генпей нанесли предкам двора, двор Лазурного дракона, к сожалению, вступил в предсказуемую нисходящую стадию.\n\nДальнейшая судьба\n\nСяо не изменился. Последняя отчаянная попытка привести непокорных предков Японии в порядок с треском провалилась, и в конечном итоге оставшиеся вассалы изгнали его из его владений, и он исчез в неизвестности, помня только его указы о децентрализации и его имя."
 POD_persistentpodlore.desc.793166:0 "Этот персонаж является частью $pod_wod$, но имеет очень ограниченную биографию. Поэтому разработчики PoD расширили её для придания большей глубины сеттингу.\n\nЕсли бы вы сказали Масао Ивасе, что он при жизни будет возглавлять прогрессивную фракцию, он бы посмеялся над вами. И все же, повелитель Гэндзи может только размышлять о том, как он попал в это место. \n\nСуровый и традиционалистский человек в дни своего дыхания, Ивасэ был достаточно опытным, чтобы вести людей в битву, но не для того, чтобы одержать победу, несмотря на худшие шансы. Умирая от меча с высоко поднятой головой до последнего момента, Ивасе вошел в ад, где с него сняли шкуру заживо с сильным чувством несправедливости. Разве он не сделал ничего, чего от него ожидали? Какое преступление его заставили искупить? Вскоре он понял, что эти опасения не имеют значения, поскольку [UmbraGlossaryLocalized('yomi_wan','Тысяча преисподних')] были сломаны и не подлежали ремонту и представляли собой пародию на небесное наказание. \nТаким образом, впервые в своей жизни Ивасэ восстал, используя свои боевые знания, чтобы возглавить группу единомышленников в дерзком побеге. \n\nВернувшись как $pod_kueijin$, он вполне ожидал, что возглавит свое благодарное новое последователи в политике ночной Японии. Ни один из существующих кланов ему не нравился. \nХотя Ивасе все еще был суровым военным, уважающим приличия, теперь он твердо верил, что система, какой бы она ни была, не работает. Старые традиции и образ мышления ведут только к разрушенному раю и аду, поэтому все придется восстанавливать с самого начала. Но как? Ивасе не претендует на знание этого, поэтому от его последователей Гэндзи ожидается, что они будут дальновидными мыслителями и проложат новые пути для $pod_kueijin$, чтобы идти и достигать просветления. \n\nЯ сам по-прежнему не обладает инновационным умом. Защищая свой клан, он действует как второй по значимости генерал Удзи (после Ташимото Ханко) и поддерживает хорошие отношения с Ясутами из Бисямона. Это заставило некоторых поверить, что Ивасе может быть деревом, скрывающим лес для Гэндзи, и если он уйдет в отставку или исчезнет, ​​вражда между Бисямоном и Гэндзи может разорвать японский $pod_kueijin$ на части."
 POD_persistentpodlore.desc.793174:0 "Этот персонаж является частью [Glossary('Мира Тьмы','game_concept_world_of_darkness_desc')], но имеет очень ограниченную биографию. Поэтому разработчики PoD расширили её для придания большей глубины сеттингу.\n\nПойманная в ловушку богиня, незаконнорожденная дочь мудрецов, дракон в облике смертной, Ан претендовала на всё это и даже больше, но правда о таких вещах ускользает даже от неё самой.\n\nАн не помнит о своей смертности. Всё, что она знает, это то, что её воспоминания простираются до Тысячи преисподних. Она помнит, как просыпалась в глубинах преисподней Кипящего масла, с цепью на шее, когда её душу снова и снова варили в человеческом жире. Каждый крик наполнял её лёгкие кипящим маслом, каждая слеза обжигала её плоть, и каждый спазм лишал её бессмертные мышцы кислорода, которого они жаждали.\nНо она билась, о, как она билась. В её судорогах и агонии вода прибила к ней несколько реликвий. И, наконец, в адской мгле она, наконец, разорвала свои цепи с помощью единственной чёрной чешуйки и изо всех сил поплыла к поверхности, пробив её с горящим пером в руке, которое вернуло её в мир живых и в мир [Glossary('куэй-дзин','game_concept_kuei_jin_desc')].\n\nПосле побега Ан глубоко и напряжённо размышляла над двумя своими реликвиями. Она не знает, где нашла эту чёрную чешуйку или горящее перо, но она убеждена, что это дары Чёрного дракона и Алого феникса. Почему они есть у неё и ни у кого другого, ускользает от неё, но она испытывает огромное чувство долга из-за этого дара.\nОна узнает правду о себе, потому что все её небылицы могут поблекнуть перед тем, кто она есть на самом деле.\n\nДальнейшая судьба в каноне\nОна станет чем-то вроде легенды среди корейских сверхъестественных существ, её стремление поделиться своими многочисленными приключениями (хотя большинство из них сомневаются в правдивости этих историй) и её строгий нейтралитет в политике сделают её самым популярным местом мирных встреч в регионе.\nНекоторые всё ещё будут убеждены, что у неё есть ключ к великой тайне, о которой, возможно, она предпочла забыть."
 POD_persistentpodlore.desc.793219:0 "Этот персонаж является частью $pod_wod$, но имеет очень ограниченную биографию. Поэтому разработчики PoD расширили её для придания большей глубины сеттингу.\n\nСреди наиболее устрашающих слуг [Glossary('повелителей Яма','podgloss.yamaking')] — те, кто принадлежит [Glossary('Эмма-О','podgloss.emmao')], ассасины [Glossary('шикоме','podgloss.shikome')]. Вызывает рабскую похоть у тех, кто восприимчив к женским чарам, и убийственную ярость у тех, кто не испытывает к ним влечения, страшным мастерством искусства костей и методов убийства. За исключением тех, кто сбежал, услышав слова странствующего монаха в [Glossary('Какури','podgloss.kakuri')], никто не вырвался на свободу из [Glossary('Эмма-О','podgloss.emmao')]. Все, кроме одного.\n\nВ своей земной жизни Юкио была традиционной актрисой предшественницы Но, известной в своей деревне своим голосом. Однако жизнь ее была коротка, и ночью ее похоронил покровитель, выпивший ее дыхание. А в [Glossary('Какури','podgloss.kakuri')] ее пение на земле привлекло внимание [Glossary('Эмма-О','podgloss.emmao')], который тут же послал своего [Glossary('шикоме','podgloss.shikome')], чтобы забрать ее и втиснуть в свой гарем.\n\nФормируя ее в соответствии со своими желаниями, заставляя ее петь на досуге и действовать как сирена для проклятых душ, и удовлетворяя его низменные желания для [Glossary('шикоме','podgloss.shikome')], на какое-то время она была просто еще одним монстром в воинственном гареме [Glossary('Эмма-О','podgloss.emmao')]. Но, однако, Юкио спрятала в голосе частички своей души, и когда ей было поручено охранять Пещеру Дев, она убила своих собратьев и сбежала.\nМало кто доверял бывшему [Glossary('шикоме','podgloss.shikome')], но Куро-сама, уважаемый наставник убийц $pod_kueijin$, решил рискнуть с Юкио.\nОн увидел в ее глазах ярость, скрытое желание отомстить за осквернение, которое на нее наложил [Glossary('Эмма-О','podgloss.emmao')]. Итак, она попала под его опеку и быстро зарекомендовала себя как одна из его лучших учениц.\n\nБудущая судьба\nЮкио со временем станет лучшим убийцей среди клана убийц. Ее стремление отомстить становится безошибочной стрелой решимости, образуя вокруг нее [Glossary('ву','podgloss.wu')] таких же опытных убийц, как и скрытая рука Коги.\nХотя неудачная миссия в Шанхае и запятнала бы ее имидж, она извлекла из этого урок и еще больше закалила свою волю. Она будет стремиться восстановить свою репутацию, забыв свой драйв. Поэтому она снова идет по пути мастера-убийцы, стремясь к финальному противостоянию и освободительной мести, которую принесет ей смерть [Glossary('Эмма-О','podgloss.emmao')]."
 POD_persistentpodlore.desc.793303:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью [Glossary('Мира Тьмы','game_concept_world_of_darkness_desc')].\n\nДавным-давно жили учёный-Дзёмон и ведьма-Дзёмон. Оба в душе были искателями мудрости, учёный учился в школах магии и стали, а ведьма отправилась вдаль в поисках слухов о ночных существах. Ведьма проделала долгий путь по указанию учёного и в конце концов добралась до ужасной фигуры из вздымающейся плоти и неподдельного ужаса.\nВедьма, однако, пришла не для того, чтобы вступить в конфликт, а для того, чтобы обменяться силой. Она заявила о своей преданности демону, придающему форму плоти, и попросила его обратить её. Ваятель плоти, желая увидеть, что произойдёт с магом, преображённым их проклятием, с готовностью это сделал. А затем, когда ведьма была убита и попробовала кровь чудовища, магия учёного перенесла её обратно в их общий дом. А когда она вернулась, то обнаружила, что учёный больше не простой маг, а король демонов.\nОна вернула себя своему истинному хозяину, и оба они смеялись под звёздами, гордясь своими амбициями. И так Кагасё стала первым [Concept('akuma', 'акума')|E] того, кто станет [Glossary('повелителем Яма','podgloss.yamaking')] [Glossary('Микабоши','podgloss.mikaboshi')].\n\nС тех пор Кагасё строила планы на тысячелетия вперёд. Тщательно выждав, она выбрала трёх смертных, чтобы даровать им свои объятия и заставить преклонить колени перед [Glossary('Микабоши','podgloss.mikaboshi')]. Её Великий клан был орудием в руках её повелителя, и с этой целью она создала свою родословную, чтобы действовать там, где не может действовать её повелитель. Она получила щедрые награды за свою неизменную преданность, в том числе запретное знание, позволившее ей приблизиться к Каину.\nИ теперь, когда [Glossary('куэй-дзин','game_concept_kuei_jin_desc')] из двора Лазурного дракона покидают Японию и близится следующая эпоха, она начинает укреплять свою родословную в приверженности своему господину. Она стремится переделать Японию по образу и подобию своего господина и стать той, кто коронует его [Glossary('Императором демонов','podgloss.demonemperor')]."
 POD_persistentpodlore.desc.793304:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью [Glossary('Мира Тьмы','game_concept_world_of_darkness_desc')].\n\nМияко видела конец своего мира.\n\nМияко происходила из одной из множества народностей, населявших Японию до прихода к власти династии Ямато. Но, будучи девочкой, она видела, как они начали вторгаться на её землю. Её собственный владыков утверждал, что он потомок Сусанно-о, и повёл свой народ против Ямато.\nОни потерпели ужасное поражение.\nМногие солдаты, подчинявшиеся её господину, были преданы мечу, и вражеские солдаты начали топтать их земли. Итак, Мияко, простая деревенская девушка, молилась и молилась об избавлении, о власти, о силе сопротивляться. Но ни один бог не ответил. И в ту ночь, когда была сожжена её деревня, несколько солдат обратили на неё внимание.\nОни смеялись, прижимая её лицо к горячим углям, но затем, как в тумане, замолчали. Всё, что она увидела, подняв глаза, - это грозу и молнии в его глазах.\nОна умирала, её лицо начало обугливаться. Она умоляла его помочь. Тогда он наклонился и открыл рот. А на следующую ночь Мияко проснулась с холодной кожей, замершим сердцем и яростью в груди.\n\nЕё спасителя нигде не было видно. Но в тот день она дала клятву. Ярость, которая сейчас бушевала и сотрясала её, должна была утихомириться и превратиться в яростный клинок. Она была бы благородным клинком во тьме, которого когда-то недоставало таким, как она. Первая из каинитов Буси, Порождение бури.\n\nС той ночи Мияко бродила по Японии в одиночестве, словно ночной призрак, сражаясь с жестокими властителями и убивая солдат, которые нападали на побеждённых. Со временем она узнала, что ночью правит византийская система дворов, и поклялась, что их терпимость к дневному злу будет наказана кровью.\nОна сосредоточила своё внимание на Амакусе, где другие изгои ночи примкнули к её делу.\nЕё отпрыски были выбраны для того, чтобы поддерживать её в своём рвении, быть стойкими, и в их сердцах горел огонь борьбы с тиранией. И теперь, когда её Кровавое племя остаётся сильным, а дворы слабеют, она свершит свою месть."
 POD_persistentpodlore.desc.793305:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью [Glossary('Мира Тьмы','game_concept_world_of_darkness_desc')].\n\nСедьмой сын императора Канму и придворной дамы Ки-но Вакако, Асука никогда не собирался наследовать трон. Тем не менее, он по-прежнему получал всестороннее образование в императорском дворце и вырос в способного и компетентного молодого человека, влиятельного человека при дворе, который мог рассказать множество историй и ещё сотню других.\nИменно здесь он привлёк внимание загадочной личности, которая называла себя Хируко. Когда Хируко встретил Асуку ночью, он попросил рассказать ему историю. Асука подчинился и рассказал ему историю, настолько безукоризненную и захватывающую, что Хируко просидел там всю ночь.\nОднако с наступлением утра Хируко попросил Асуку спрятать его в своей комнате, подальше от солнечного света. Будучи благородной натурой, Асука подчинился. И когда снова наступила ночь, он был настолько впечатлён честью Асуки, что Хируко «поделился» с ним своим даром перед уходом и объявил, что, хотя Асука никогда не будет править Японией днём, как его братья, он сможет править ею ночью. Всё, что ему нужно было сделать, - это вырвать её из рук чужеземных захватчиков.\n\nВскоре Асука обнаружил, что мир вокруг него наполнен другими существами, которые скрываются в ночи, но он обладал уникальной способностью превращать свои истории в реальность. Восприятие, иллюзии, даже сама душа - всё это могло быть сформировано кровью. И это была бы замечательная история, если бы Седьмой сын императора заявил о своих правах по рождению, которых у него никогда не было, и сам стал императором.\nИтак, он начал расширять свои владения и разыгрывать свои карты. Улыбающееся лицо в тени, мечтающее о троне и мире, который он стремился создать. Всё, что ему понадобится, - это союзники.\n\nПо крайней мере, так гласит история, которую рассказывает Асука. И это действительно замечательная история."
 POD_persistentpodlore.desc.793306:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью [Glossary('Мира Тьмы','game_concept_world_of_darkness_desc')].\n\nОснователи Ика и Кога связаны между собой как в жизни, так и после смерти. Ясу и Ю - идентичные братья-близнецы, изначально соперничавшие между собой наследники второстепенного клана, чьё название затерялось в истории. Там, где Ясу был хитёр, Ю был дерзок. Однако оба брата яростно сопротивлялись введению Кодекса Тайхо - инициативы принца Осакабэ, направленной на то, чтобы сделать Японию более конфуцианской.\n\nОба брата яростно сопротивлялись тому, что они считали чужеземным влиянием. Оба были схвачены и приговорены к смерти, но вмешательство странных зверей спасло их. Кагасё предложила им аналогичную сделку - насильно вырвать Японию из-под влияния чужестранцев и служить ей, а в награду получить от неё и её хозяина вечную жизнь. Оба брата согласились.\n\nВ начале своей нежизни Ю начал использовать вечность, чтобы отточить своё мастерство владения оружием. В отличие от своего более утончённого брата, он нашёл предназначение в качестве клинка [Glossary('Микабоши','podgloss.mikaboshi')]. Поставленный на более высокие позиции в амбициях Великого клана, Ю быстро стал вызывать страх у тех немногих [Glossary('куэй-дзин','game_concept_kuei_jin_desc')], которые знали о Великом клане [Concept('akuma', 'акума')|E].\nОднако его растущее недовольство своим братом и другим дитя Кагасё, Митико, привело к тому, что внутри Великого клана начали расти разногласия. Хотя он знает, что действовать против них, когда Кагасё рядом, равносильно самоубийству, он жаждет возможности отомстить Митико за её претенциозность и своему брату за его трусливую любовь к теням.\n\nИ, возможно, скоро этот момент, наконец, настанет..."
 POD_persistentpodlore.desc.793307:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью [Glossary('Мира Тьмы','game_concept_world_of_darkness_desc')].\n\nОснователи Ика и Кога связаны между собой как в жизни, так и после смерти. Ясу и Ю - идентичные братья-близнецы, изначально соперничавшие между собой наследники второстепенного клана, чьё название затерялось в истории. Там, где Ясу был хитёр, Ю был дерзок. Однако оба брата яростно сопротивлялись введению Кодекса Тайхо - инициативы принца Осакабэ, направленной на то, чтобы сделать Японию более конфуцианской.\n\nОба брата яростно сопротивлялись тому, что они считали чужеземным влиянием. Оба были схвачены и приговорены к смерти, но вмешательство странных зверей спасло их. Кагасё предложила им аналогичную сделку - насильно вырвать Японию из-под влияния чужестранцев и служить ей, а в награду получить от неё и её хозяина вечную жизнь. Оба брата согласились.\n\nВ начале своей нежизни Ясу преуспел в качестве наёмного убийцы [Glossary('Микабоши','podgloss.mikaboshi')]. Будучи призраком, он хватался за всё, что могло помешать ему осознать истинную природу Великого клана, и был, безусловно, самым компетентным практиком ваяния плоти среди отпрысков Кагасё. И за это его и его родословную боялись как ужаса, который бродит в ночи.\n\nОднако насмешки Митико и нахальство брата безмерно раздражают его. Но он не дурак и знает, что Кагасё наблюдает за ними. Поэтому он выжидает удобного момента. С нетерпением ждёт того момента, когда чудовище отвернётся, а убийца приступит к игре."
 POD_persistentpodlore.desc.793309:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью [Glossary('Мира Тьмы','game_concept_world_of_darkness_desc')].\n\nНгай всегда бродил по Южно-Китайскому морю.\nЕго смертная жизнь в значительной степени является тайной для его родословной. Он один из старейших [Concept('cainites', 'каинитов')|E] в Восточной Азии, и его собственный сир столь же загадочен. Он рассказывает о ней, как она поднялась с песка, когда он рыбачил ночью, и утащила его под воду. Когда Нгай вернулся на берег, он в безумной жажде крови набросился на своих товарищей-рыбаков и осушил их досуха.\nОн снова исчез в океане, бродя по морям, как бич в ночи. Однако иногда он прятался у берега. Он всегда чувствовал особую близость к рыбакам и наблюдал за некоторыми из них. Повинуясь внезапному наитию, он осушил одного из них под водой, прокусил себе запястье и позволил трупу выпить его. Когда тот зашевелился и стал похож на него, он всё понял.\nОн обратил ещё нескольких и начал направлять их через моря. Акулы в этих водах преследовали его любимых людей, и он этого не потерпел бы.\nЕго потомки бродили по берегам и возвращались в волны, чтобы сражаться с этими чудовищными акулолюдями. Так Нгай основал линию крови #TOOLTIP:GAME_TRAIT,gangrel,[GetNullCharacter] #L гангрелов#!#! [GetTrait('anh').GetName(GetNullCharacter)], родословную моряков, которые бороздят Южно-Китайское море и воюют с Саме-Бито."
 POD_persistentpodlore.desc.793310:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью [Glossary('Мира Тьмы','game_concept_world_of_darkness_desc')].\n\nНадже говорили, что она - правительница. Хотя при жизни она никогда не чувствовала себя в этой роли.\n\nНаджа была дочерью мелкого киданьского вождя, чьё имя теперь затеряно во времени, и родилась в западных краях, где живет её народ. Однажды ночью её клан подвергся нападению, их владения были разграблены. Она взяла свою лошадь и бросилась бежать, но, когда она проезжала через глушь, однажды ночью она, наконец, упала от изнеможения во время своего бегства.\nСтранная женщина с рыжими волосами и бледным лицом взяла её к себе и обратила. Она рассказала Надже о том, кем она была, об истории их рода. Затем эта исследовательница посвятила себя своей собственной судьбе, и Наджу охватила неистовая жажда странствий.\nЗатем Наджа скрывалась в тени влиятельных киданей, убеждая их возвыситься и стать царями. Но когда династия Ляо пришла в упадок, во время своих путешествий она решила, что построит что-нибудь для себя. Незаметно руководя строительством крепости в горах Хамгён, она выбирала там людей с таким же складом ума, как у нее, и окружала их.\nЗдесь, в уединении, её род будет процветать, и она станет творцом своего собственного пути. И здесь она возьмёт себе имя из языка местных жителей - Наджа.\n\nВ эти современные ночи Наджа очень беспокоится о предзнаменованиях, которые ветер несёт в отношении [Glossary('Анда','podgloss.anda')]. Она начала укреплять свои позиции, призывая свою родословную прочно обосноваться в горах. Она размышляет, не настало ли сейчас время покончить с их изоляцией, стать царями не путём завоеваний, а дипломатическим путём и отбросить [Glossary('Анда','podgloss.anda')] назад."
 POD_persistentpodlore.desc.793311:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью [Glossary('Мира Тьмы','game_concept_world_of_darkness_desc')].\n\nИнда - призрак, но всё, что обитает в ночи вокруг неё, знает своё дело.\n\nКогда-то Инда была просто хорошенькой дочерью индонезийского фермера, известной в своей деревне только тем, что была довольно красивой. Однако однажды вечером она обнаружила закутанную в саван женщину, убегавшую от чего-то в ночи. Когда существо спросило её, куда ушла женщина, Инда солгала, подозревая, что они могут причинить ей вред. Но когда она обернулась, скрытая фигура поблагодарила её, а затем извинилась за то, что была очень голодна.\nОна была ошеломлена и умерла на месте. Но за помощь ей таинственная женщина подарила свою кровь. И Инда восстала из мёртвых, когда её тело корчилось в агонии. Всё её тело стало полупрозрачным, как будто она была физическим призраком, а также ощущала жажду крови и отвращение к солнцу.\n\nИнда была проклята, чтобы преследовать Индонезию, но делала это как призрак. Всегда слабая, она полагалась не на силу, а на исчезновение и животных.\nМертвецы также были её друзьями, видевшими в ней родственную душу. И когда она слишком сильно напилась и запаниковала, она узнала, что может делать других похожими на себя, с теми же дарами и проклятиями. Они стали [GetTrait('kuntilanak').GetName(GetNullCharacter)], #TOOLTIP:GAME_TRAIT,vampire,[GetNullCharacter] #L вампирами#!#! Индонезии, белыми мужчинами и женщинами в горах, где они тайно общаются с мертвецами и животными."
 POD_persistentpodlore.desc.793312:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью [Glossary('Мира Тьмы','game_concept_world_of_darkness_desc')].\n\nПринимая во внимание её сира, Ёсино - это совсем не то, чего можно было ожидать. Распутная, импульсивная и своевольная, старшее дитя основателя Буси часто считается дерзкой коровой, но за этим скрывается гнев, слишком хорошо знакомый её сиру.\n\nЁсино родилась в семье эмиси в Мияги, городе ямато. Рождённая в небогатой семье, к которым относились как к чужакам, Ёсино с юных лет по необходимости стала проституткой, каждый день борясь за то, чтобы её накормили.\nОднако, когда ямато начали подавлять более широкое сопротивление эмиси, стражники обвинили Ёсино как потенциальную шпионку эмиси. Похищенная и утащенная ночью, она была неоднократно избита стражниками, которые требовали, чтобы она раскрыла все секреты, которые, как они полагали, у неё были.\nПоскольку ей нечего было им рассказать, они продолжали истязать её, пока смерть не стала почти неизбежной.\nНо когда она умирала, разразилась странная буря, и как только пошёл дождь, она заметила, что он странный, красный.\nОна потеряла сознание, а когда очнулась, её губы были в крови, а над ней склонилась её дама Мияко.\n\nПолучив второй шанс на жизнь, Ёсино воспользовалась им, чтобы позволить себе то, в чем ей всегда было отказано. Сражаясь и убивая с мечом в руке, занимаясь сексом на своих условиях, она могла не обращать внимания на ерунду.\nОна наслаждается своим даром и дорожит вторым шансом, который получила."
 POD_persistentpodlore.desc.793313:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью [Glossary('Мира Тьмы','game_concept_world_of_darkness_desc')].\n\nХидеаки с нежностью вспоминает свою смертную службу, даже если она была обречена. Он считается гораздо более представительным из первых детей Мияко, он благороден, тактичен и респектабелен. Но над ним нависла тень, тлеющий огонь, который отказывается гаснуть.\n\nХидеаки был одним из эмиси. Он был солдатом под командованием вождя эмиси Исавы, которого ямато считали варваром.\nНесмотря ни на что, Хидеаки преданно и гордо сражался вместе со своим господином. Однако, когда Атеруи сдался, Хидеаки пришёл в ужас и ярость. Он отправился к своему господину, чтобы умолять его передумать.\nНо в ту ночь, когда он сделал это, направляясь в лагерь своего господина, он попал в засаду, устроенную ужасающе искусным мастером оружия и воином. Мечник, известный ему только как «Меч Великого клана», основательно унизил и разгромил Хидеаки, нанеся ему сотню ранений, прежде чем схватить его и обескровить.\nНо пока Хидеаки умирал, молния ударила в Меч Великого клана, и он бежал от воина в маске. Воин предложил ему сделку: либо умереть и двигаться дальше, либо принять ночь и вечно сражаться с тиранами. Хидеаки согласился, и Мияко обратила своё второе дитя.\n\nСмерть изменила Хидеаки. Он понял, что прямота опасна, и приберёг её на случай необходимости. Он был харизматичным, гордым и доминировал в зале.\nНо всё это было сделано для достижения целей Кровавого племени. В нём горит тот же огонь мести за народ, растоптанный завоевателями, хотя и более скрытый.\nОн стремится победить любыми доступными ему средствами, помимо более прямых методов своего сира."
 POD_persistentpodlore.desc.793314:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью [Glossary('Мира Тьмы','game_concept_world_of_darkness_desc')].\n\nМасами была почти никем. Всего лишь молодая женщина, которая когда-то стояла на пути гораздо более могущественной женщины. Когда-то она была служительницей храма, первоначально входила в состав делегации, отправленной в недавно завоёванные земли эмиси после Тридцативосьмилетней войны.\nЗа это время она и остальные служители храма наняли довольно странного воина, который никогда не уходил днём, а вместо этого усердно присматривал за ними ночью. Некоторые из слуг, которые плохо обращались с эмиси, исчезли ночью, но собственная усталая доброта Масами к ним расположила её к воину.\n\nОднако однажды ночью, когда она готовила обряд, она услышала крик, когда ужасающая фигура, обладающая ужасающей магией стихий, ворвалась в святилище. Это святилище чем-то оскорбило её, поэтому женщина, называющая себя «Мудрецом Великого клана», предала всех служителей кровавой расправе.\nМасами была последней, она умоляла кого угодно спасти её. Мудрец лишь рассмеялась и просто выпила из Масами всю кровь, оставив её умирать на алтаре. Но пока она умоляла всех, кто был готов её выслушать, спасти её, воин подполз к ней, раненый, но всё ещё стоящий на ногах.\nВоин услышал её молитву, поднёс рану к губам Масами и принял её в ряды Буси.\n\nИсследования Масами оказались полезными. Среди вождей Кровавого племени она стала главным специалистом по тайнам. Отчасти из-за привычных для неё процедур и ритуалов, но также из-за желания победить своего предполагаемого убийцу.\nТот же огонь, который сжигал их всех, горел и в ней, только по-другому.\nИ она отомстит или умрёт, пытаясь это сделать."
 POD_persistentpodlore.desc.793335:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью [Glossary('Мира Тьмы','game_concept_world_of_darkness_desc')].\n\nНесмотря на то, что она родилась как средство достижения цели, просто как средство просветить свою мать, иногда всё, что требуется, - это правильные побуждения, чтобы поднять человека на более высокий уровень.\n\nРождённая в семье Уати и неназванного и не особо важного человека, Нидхи с того момента, как мать впервые взяла её на руки, была окружена бесконечной любовью и привязанностью. Несмотря на репутацию её матери как пропитанного кровью берсерка, которая роется во внутренностях любого [Concept('akuma', 'акума')|E], на которого укажет Пияу, она становилась совершенно другим человеком, когда держала на руках свою дочь, которую она поклялась подарить миру.\nНидхи выросла среди Обезьян-свежевателей и научилась их обычаям. Несмотря на то, что большинство из них сами не любили детей, Нидхи стала им всем как дочь. О ней заботились, она не знала боли, с которой сталкивались её мать и её верные спутники, и, несмотря на то, что в её жилах не текла благородная кровь, жила как принцесса.\nОбученная колдовству и получившая лучшее образование, какое только могла дать её мать, она была подготовлена к лучшей жизни, какую только могла дать ей Уати.\n\nИ именно по этой причине Нидхи наткнулась на проповедника, рассказывающего о падшей природе [Glossary('куэй-дзин','game_concept_kuei_jin_desc')] и о том, что дампиры являются жалкими отражениями высшей силы, и в конце концов узнала о ярости, которая пылала в сердце её матери.\nКем были эти наглые негодяи, осмелившиеся усомниться в своих родителях? Что за безумие они проповедовали, утверждая, что люди, подарившие ей идеальный мир, были осквернёнными дегенератами, обладающими некой более благородной властью? Какое оскорбление, что они посмели назвать дегенератами таких любимых детей? Что за богохульство - сказать, что её мать никогда не любила её?\nНет, как только Нидхи услышала это, она бросилась на проповедника с топором в руках, чтобы тут же раскроить ему голову. А когда он убежал, она поклялась найти его и задушить собственными устами за такое оскорбление.\nСо временем гнев Нидхи усилился, когда она увидела, что Золотые дети, которыми когда-то были дампиры, превратились в самодовольных глупцов, отголоски которых нужно было стереть, чтобы спасти их в настоящем.\n\nИ если ей понадобится преследовать их в недрах преисподней, чтобы покончить с их ложью, тогда она будет раскалывать, рвать, калечить, убивать, жечь и разделывать на куски, пока это не будет сделано."
 POD_persistentpodlore.desc.793336:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью [Glossary('Мира Тьмы','game_concept_world_of_darkness_desc')].\n\nМногие дампиры по всей Нусантаре приглушённым шепотом рассказывают об ужасе, который бродит по джунглям, охотясь именно на них. Инферналист [Glossary('куэй-дзин','game_concept_kuei_jin_desc')] из преисподней Роящихся личинок, у которого развился особенно острый вкус к детям [Glossary('куэй-дзин','game_concept_kuei_jin_desc')]. И Бахтияр лично не смог бы сохранить свою репутацию иначе.\n\nПри жизни Бахтияр был целителем своей деревни, главной опорой их здоровья и безопасности. Однако, пока его наставник учил его, Бахтияр вместо этого веселился с младшими девочками из своего дома, не обращая внимания на учебу.\nОднако, когда ему пришло время приступить к работе, он использовал свой ограниченный опыт не для исцеления, а для создания иллюзии облегчения. Используя масла, выжатые из змей, различные травы и хорошо известные обезболивающие, многие умирали под его присмотром, но только после того, как покидали его.\nОднако, его заслуга была в том, что позже он умер одинокой и ужасной смертью от оспы. И он был справедливо послан в преисподнюю Роющих норы личинок.\n\nБахтияр был слаб. Ему удалось сбежать, но в основном благодаря попрошайничеству и знахарским лекарствам. И когда Рангда в конце концов поймала его, он, вместо того чтобы попытаться вырваться или сбежать, умолял её пощадить его и предлагал ей что угодно взамен.\nОна воспользовалась возможностью, чтобы заполучить ещё одного [Concept('akuma', 'акума')|E], и отправила его обратно, где он сразу же снова начал предаваться удовольствиям. Он обнаружил, что его любимыми мишенями были дампиры, особенно младшие, которые утоляли его похоть и голод.\nУ его трона разбросаны кости бесчисленных съеденных дампиров, в то время как он поглощает их сущность после смерти, безумно довольный своей властью."
 POD_persistentpodlore.desc.793337:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью [Glossary('Мира Тьмы','game_concept_world_of_darkness_desc')].\n\nВ джунглях Индонезии живёт шаман, проповедующий радикально противоположную доктрину. Он говорит о загадочном боге, который укажет им путь к спасению, отдав себя в руки тех, кто добровольно пожертвует собой, чтобы просветить мир на земле.\nМногие из них совершают ритуальные самоубийства, подпитывая своего пророка. И именно на этой базе силы можно найти [Concept('akuma', 'акума')|E] по имени Кахайя.\n\nКахайя всегда был человеком веры, как в жизни, так и в смерти. Изначально он был последователем традиционной яванской религии, однако его необузданная духовность пылала неистовой яростью. Он считал, что присутствие сторонних религий представляет угрозу, поэтому с 14 лет он начал искать чужеземных святош и убивать их в пустыне, совершая акты насилия, направленные на духовное очищение, как он это себе представлял.\nОднако его рвение вызывало недоумение, поскольку многие считали этого человека совершенно безумным, даже в его семье. Поэтому ему пришлось убить и их, чтобы они не мешали ему в поисках откровений.\nОднако, в конце концов, проблема разрешилась сама собой, так как в ходе испытания своей веры он в течение недели медитировал в горах, где в конце концов встретил свой конец, будучи съеденным крокодилом.\n\nНо его смерть только придала ему смелости. В преисподней Перевёрнутых грешников Кахайя принял это, признав себя богом, который им управляет, не осознавая или просто не заботясь об этом. Приняв это, он случайно бежал из преисподней.\nОн, естественно, истолковал это как то, что он пророк повелителя преисподней, и снова начал проповедовать и убивать."
 POD_persistentpodlore.desc.793339:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью [Glossary('Мира Тьмы','game_concept_world_of_darkness_desc')].\n\nГоворят, что деньги - корень всех зол. Харта - один из многих, кто подтверждает это утверждение.\n\nПри жизни Харта был торговцем и нераскаявшимся скупцом. Каждый рабочий должен был вкалывать до изнеможения, каждая сделка должна была быть сорвана, у каждого бедного фермера приходилось вымогать деньги, а каждая взятка выдавалась властям, чтобы продолжать работать. Занимаясь в основном торговлей продуктами питания и используя наёмных работников для вымогательства у фермеров, Харта стал фантастически богатым.\n\nИ, несмотря на всё его богатство, это никак не помогло ему, когда в переулке его проткнули копьём и бросили в реку, где он умер, опорожняя свои миски лицом вниз в нечистотах.\n\nОднако Харта применил всё своё искусство, когда по спирали спускался в преисподнюю. Хотя это заняло некоторое время, в конце концов он смог украсть достаточно, чтобы подкупить людей, чтобы выбраться отсюда. Однако он понял, что у него ничего не будет, а такое положение вещей было хуже смерти. Поэтому вместо этого он отправился к Невыразимой повелительнице преисподней Кипящего масла, прося могущества в обмен на то, чтобы стать её агентом.\nКогда он вернулся с адскими дарами, он немедленно пустил в ход полученные по договору ресурсы. Он быстро захватил несколько местных рынков, а затем позаботился о том, чтобы человек, убивший его, был найден, вся его семья убита, сам он обрёкся на нищету, а затем с него заживо содрали кожу. Осуществив свою месть, Харта вернулся к тому, что всегда было для него высшей целью в жизни.\n\nЗарабатывать как можно больше денег, чего бы это ни стоило."
 POD_persistentpodlore.desc.793340:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью [Glossary('Мира Тьмы','game_concept_world_of_darkness_desc')].\n\nМногие скажут, что власть может проявляться не только в контроле. Интриги, влияние, деньги, религия - бесчисленное множество способов контролировать людей. Пурнама считает, что всё это фарс. Единственная власть - это сила, чистая и незамысловатая. И она хочет править, и у неё есть для этого сила, так что, если кто-то захочет остановить её, ему просто нужно будет убить её.\nНаверняка смертные, которых она покорила, были бы довольны этим, не так ли?\n\nСмертная жизнь Пурнамы превратилась в туман в процессе её смерти. Насколько ей известно, она всегда стремилась к власти, пока люди, которые не могли с ней справиться, несправедливо не убили её, отрубив голову. На Ланке она увидела чистое проявление силы Раваны и в этот момент поняла, как устроен мир. Она заключила ряд соглашений со многими [Glossary('повелителями Яма','podgloss.yamaking')], стремясь сохранить свою душу свободной до того дня, когда она сможет претендовать на свою собственную преисподнюю, а затем и на предназначенное ей место [Glossary('Императора демонов','podgloss.demonemperor')].\nС этой целью она использовала свою новую силу как [Glossary('куэй-дзин','game_concept_kuei_jin_desc')], чтобы похитить множество мужчин, и как только у неё родился сын, она расправилась со всеми ними и использовала только тех, кого создала, чтобы получить власть. И с этой целью она позаботилась о том, чтобы её дети подчинялись.\nТех, кто сопротивлялся, было достаточно легко превратить в демонов.\n\nМир станет прекрасной вещью, на которую можно будет претендовать."
 POD_persistentpodlore.desc.793341:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью [Glossary('Мира Тьмы','game_concept_world_of_darkness_desc')].\n\nХотя, как говорят, дампиры наводнили джунгли Нусантары по приказу двора Жёлтого императора, когда многие на материке думают о безумствах своих дампиров, на ум часто приходит Путра.\n\nПутра был сыном безымянного человека и Пурнамы, и с самого рождения его готовили к тому, чтобы он стал идеальным мужем, безупречным военачальником и послушным, но грозным воином. И поэтому Пурнама очень довольна своим сыном и его мужественностью. Однако сказать, что Путра из-за этого неуравновешен, было бы преуменьшением.\nОн полностью зависит от похвалы своей матери, готов совершать всё более и более ужасные поступки даже ради одной похвалы. Готов выполнить любой приказ, каким бы грубым он ни был, просто ради прикосновения.\n\nМальчик просто хочет, чтобы его мать гордилась им, вот и всё.\n\nДальнейшая судьба\nПутра был гораздо более серьёзным противником завоеваний Пияу, чем его мать.\nНесмотря на то, что его имя было забыто, он стал величайшим воплощением безрассудства мужской слабости среди дампиров и укрепил практику [Glossary('пенангаллан','podgloss.penangallan')] не вдыхать жизнь в своих сыновей и, в большей степени, их обычное нежелание иметь детей. В то время как мир забыл самого Путру, Золотые дворы не забыли о его Походах устрашения."
 POD_persistentpodlore.desc.793342:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью [Glossary('Мира Тьмы','game_concept_world_of_darkness_desc')].\n\nСын одного из первых мусульман, прибывших в Малайзию, Король пепла мало что помнит из своего прошлого. Он помнит, что умер молодым и насильственной смертью. Его воспоминания о Городе демонов также туманны, хотя он помнит, что был там хорошим бойцом.\nНастолько сильным, что Ракше на короткое время пришлось следить за его передвижениями и докладывать Раване. Юсуфа это мало волновало. Он просто хотел сражаться.\n\nВсё изменилось, когда Ракша перестал с ним общаться. Ему стало скучно, он разозлился, впал в отчаяние. Наконец, в безумной ярости он ворвался во дворец Раваны и был немедленно повержен.\nРавана предоставил ему единственный выбор: либо он мог лишить его конечностей и превратить в жевательную игрушку для Ракши, либо получить бесконечное количество врагов, с которыми он мог сражаться в качестве одного из своих [Concept('akuma', 'акума')|E].\n\nКогда Юсуф возглавляет полчища своих демонов, его выбор предельно ясен. Он хочет войны. И только войны."
 POD_persistentpodlore.desc.793343:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью [Glossary('Мира Тьмы','game_concept_world_of_darkness_desc')].\n\nИногда в овцу можно вселить демона, но это не мешает ей оставаться овцой. И Вира - идеальное воплощение этой мудрости.\n\nПри жизни Вира был простым сапожником, но, по большому счету, он всегда был пугливым и изоляционистом. Большую часть своих работ он продавал по поручению своей сестры, а сам скрывался, занимаясь изготовлением обуви. У него это хорошо получалось, и он с жаром отдавался своему делу, но всему этому пришёл конец, когда банда головорезов напала на его лавку.\nВира, в этот трудный час, вместо этого предложил продать им свою сестру, отдать им свою лавочку и сделать всё, о чём они его попросят, если они не причинят ему вреда. Ко всеобщему изумлению, его сестра, пришедшая в ужас от всего этого, схватила одно из копий разбойника и вонзила ему в глаз.\n\nДаже когда он оказался в преисподней, он был устрашён и боязлив и прятался от всего, охотно предавая многих других окончательной смерти ради того, чтобы никто не прикоснулся к его собственной шкуре.\nКогда его наконец поймали, он немедленно сдался, умоляя, чтобы его сделали [Concept('akuma', 'акума')|E] ради пощады. Видя в нём в основном безвредность и потенциальную дополнительную проблему для любого [Glossary('куэй-дзин','game_concept_kuei_jin_desc')], его отправили обратно в мир живых, где он прячется и посылает демонов, чтобы те попытались уничтожить любую угрозу для него."
 POD_persistentpodlore.desc.793344:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью [Glossary('Мира Тьмы','game_concept_world_of_darkness_desc')].\n\nВоплощённая прожорливость, несколько изолированных деревень, спрятанных вокруг храма, приносят жертвы перед ужасным существом из сонма демонов, требующим подношений в виде огромного количества еды и девушек, чтобы их не разграбили ночью. В храме, осквернённом кровью, порченой едой, смертными женщинами и захваченными в плен [Glossary('куэй-дзин','game_concept_kuei_jin_desc')], находится ненавистный [Concept('akuma', 'акума')|E] Сабри.\n\nВ своей смертной жизни Сабри был распутным чудовищем-дворянином, которого мало что заботило, кроме того, чего он мог достичь и как быстро он мог этого добиться. У него вошло в привычку объезжать свои владения и брать в наложницы любую женщину, которая ему приглянулась, с радостью убивая их мужей или отцов, если они протестовали, и их сестёр и матерей, если они сопротивлялись.\nНо, как и следовало ожидать, несчастная жизнь требовала несчастной смерти, поэтому он умер от сепсиса в одиночестве на своей кушетке, после того как его, слишком тучного, чтобы вставать, оставили гнить в собственных экскрементах.\n\nОднако на этом его пороки не закончились. Став демоном, он быстро начал снова проявлять свою волю с помощью демонической силы, и несколько других людей, которых он поставил себе на службу, были готовы пожертвовать собой ради его собственного спасения.\nИ даже тогда, при столь чуждом ему труде, он сразу же начал заключать сделки с [Glossary('повелителями Яма','podgloss.yamaking')], желая получить женщин и угощения в обмен на то, что они будут помогать ему в мире живых. Всё, что ему нужно было сделать, - это увеличить страдания окружающих, и, учитывая, какой он человек, он был более чем счастлив услужить."
 POD_persistentpodlore.desc.793345:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью [Glossary('Мира Тьмы','game_concept_world_of_darkness_desc')].\n\nСреди ночных жриц ходят слухи о тайном мастере, который берёт с них изрядную долю платы, чтобы защитить от ужасных клиентов. Некоторым из них дарованы более значительные дары, например, красота, оружие для самозащиты или ещё более странные блага. И в центре всего этого, тайным пауком в центре этой паутины, является Нурхаяти, распространяющая демонов через свои сети секс-работников и бордели.\n\nНурхаяти очень молчалива о своём жизненном пути, и, по её собственной версии, она была просто женой, которая умерла от инфекции, что было довольно распространенной смертью для крестьян. Однако её обширные знания об образе жизни секс-работников и управлении ими говорят о более мрачной смертной жизни, о судьбе, которая не совсем неизвестна многим [Glossary('куэй-дзин','game_concept_kuei_jin_desc')].\nТем не менее, её собственное бегство из ямы Соли и Железа и пребывание в Железных борделях превратили её в ту, кем она является сейчас, несмотря ни на что. После побега она немедленно отказалась от [Glossary('дхармы','podgloss.dharma')] и вместо этого цеплялась за смертную жизнь, и с этой целью связала свою судьбу с [Glossary('повелителями Яма','podgloss.yamaking')] ради телохранителей.\n\nВ своих собственных целях Нурхаяти использует своих секс-работников, чтобы вселять в их клиентов демонических духов, превращая их в преданных Бакемоно. Это происходит медленно, но опыт и терпение Нурхаяти доказали, что это прочная основа для успеха.\n\nИ если у неё будет время, она может стать [Concept('akuma', 'акума')|E], которая объединит Нусантару."
 POD_persistentpodlore.desc.793346:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью [Glossary('Мира Тьмы','game_concept_world_of_darkness_desc')].\n\nХотя при августейших дворах принято считать, что [Concept('akuma', 'акума')|E] - это безотказные люди, доведённые до безумия своими адскими хозяевами, немногие воплощают это в такой степени, как Касих.\nГде бы она ни появлялась из своих тайных убежищ, населённых безумцами и демонами, она всегда хихикает, взбешённая тем, что происходит в преисподних. Несмотря на боль и удовольствие, счастье и скорбь, фанатизм и фатализм, Касих встречает это так же, как и всё остальное - с дикими глазами, разинутым ртом, истекающим кровью и обезумевшим в экстазе убийства. Помимо этого, она остаётся загадкой.\n\nВ моменты просветления, когда она уединяется, она всегда шепчет, всегда говорит о грядущих временах. О плоти и крови, о женственности, увенчанной кровью. Возможно, она видит в этом себя.\nИли, возможно, она видит, как другая сила начинает подниматься из джунглей..."
 POD_persistentpodlore.desc.793347:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью [Glossary('Мира Тьмы','game_concept_world_of_darkness_desc')].\n\nГоворят, что у подножия глотки мира есть песня. Многие из Голодных мертвецов ищут её, но лишь немногие стремятся к земле, которая ведёт туда. Одним из немногих счастливчиков, которые добились своего, был почтенный Тенцинг, хранитель Шигацзе. Однако, когда с севера начинают завывать ветры, он вынужден действовать.\n\nТенцинг родился во времена упадка династии Ярлунг, в окружении хаоса, который естественным образом сопутствует упадку империи. В то время как большая часть его родины была охвачена паникой из-за убийства короля Дармы У Дум Цен, Тенцинг увидел в этом хаосе возможность извлечь выгоду. Превратив свою маленькую деревню в предполагаемое «убежище», он на самом деле платил головорезам, чтобы те нападали на людей и убивали их на пути к безопасным горным перевалам, используя хаос эпохи в качестве прикрытия.\nОн стал сказочно богат, но это мало что дало для его защиты, когда в эпоху Раздробленности один из выживших после набега сумел раскрыть его предательство, похитил его и оставил умирать от холода в Гималаях, а его душу отправил в преисподнюю Свежевания.\n\nЭтот опыт был чрезвычайно отрезвляющим, поскольку Тенцинг был лишён всего, что у него было, и чем он был. Хотя в конце концов ему удалось сбежать, он стал аскетом, возненавидел богатство и посвятил себя обучению. Он возвысился среди монахов Шигацзе, выдвинул множество критических теорий и возглавил их охоту на демонов.\nОднако, когда Фань отреклась от власти и Да возглавил двор Белого тигра, у этого глупца хватило наглости попытаться усилить надзор за монахами Шигацзе. Поэтому они отвергли просьбы Да о помощи, когда [Glossary('Анда','podgloss.anda')] начали подтачивать позиции двора, и Тенцинг, тогдашний лидер монахов, наблюдал, как он рушится. Но теперь Тенцинг снова погружается в хаос, стремясь перестроить двор Белого тигра во что-то большее, что представляли себе Шигацзе, когда присоединялись к нему.\nВсё, что он должен сделать, - это добиться успеха там, где он когда-то потерпел неудачу, и процветать в этом хаосе.\n\nДальнейшая судьба\nМонахи Шигацзе, несмотря на свою силу, были слишком изолированы, чтобы противостоять [Glossary('Анда','podgloss.anda')]. Но в то время как большинство других изгнанников бежали на Восток, он приказал им укрыться и укрепить Гималаи против [Glossary('Анда','podgloss.anda')].\nПосле этого последнего приказа Тенцинг просто вернулся к своим исследованиям, чтобы снова посвятить себя изучению Осквернённых и полудемонов."
 POD_persistentpodlore.desc.793348:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью [Glossary('Мира Тьмы','game_concept_world_of_darkness_desc')].\n\nДаже если Фань отреклась от своей империи, среди её соратников найдутся те, кто постарается сделать так, чтобы всё, что она построила, не рухнуло. И среди Ледяных рогов Фу Хао стоит там, где она всегда стояла, - в авангарде.\n\nПри жизни Фу Хао была одной из 64 жён У Дина из династии Шан, заключивших брак в рамках союза между династией Шан и одним из отдалённых племен их владений. Фу Хао выделялась среди жён своего мужа как способная и интеллигентная руководительница, обладавшая блестящим умом в военных вопросах. Она поднялась по карьерной лестнице и в конце концов стала второй женой У Дина, жрицей, военным офицером и генералом, владевшей землёй от своего имени.\nБлагодаря своим кампаниям она стала величайшим полководцем У Дина, командовавшим его самой многочисленной армией, и, хотя она умерла раньше своего мужа, её похоронили с почестями в его столице.\n\nЧто касается Фу Хао, то она пробудилась от смерти на Ланке, превратившись в демона за свои завоевания. Но, несмотря на муки, она выстояла, и молитвы её мужа, просившего её о наставлении, вернули её к жизни. И когда У Дин умер, его жена-воительница нанесла ему последний визит, заверив, что будет рядом, несмотря ни на что.\nИ когда он перешёл к тому, что было дальше, она с почтением присоединилась к обществу [Glossary('куэй-дзин','game_concept_kuei_jin_desc')].\n\nВоенный опыт Фу Хао, сдержанность, трудолюбие и непоколебимая решимость в бою привели её в сферу влияния Фань, где крупная и устрашающая женщина заняла место в их [Glossary('ву','podgloss.wu')] в качестве воительницы. Изучение секты Десяти времён года и холодная решимость обеспечили ей прочное положение при дворе Фань, и когда она отреклась от власти, Фу попыталась уважать её желания и преклонила колени перед Да. Но когда началось вторжение [Glossary('Анда','podgloss.anda')] и она попыталась собрать армию, Да отказалась прислать своих людей, что привело к разграблению нескольких дворов.\nНе в силах больше этого терпеть, она вышла из состава дворов и собрала собственную армию, что привело к роспуску двора. Теперь она собирает силы, чтобы восстановить двор Фань и выстоять в борьбе с [Glossary('Анда','podgloss.anda')] и увидеть, как они будут разгромлены.\n\nДальнейшая судьба\nТех сил, которые она смогла собрать, было недостаточно, чтобы остановить [Glossary('Анда','podgloss.anda')]. Поскольку двор Белого тигра был разделён, он стал лёгкой добычей захватчиков. Верная своей [Glossary('ву','podgloss.wu')] до самого конца, Фу Хао бесследно исчезла, и в последний раз её видели сражающейся с [Glossary('Анда','podgloss.anda')], в то время как остальные члены Ледяных рогов бежали в неизвестном направлении."
 POD_persistentpodlore.desc.793349:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью [Glossary('Мира Тьмы','game_concept_world_of_darkness_desc')].\n\nМногие дампиры живут во лжи. Они страдают, истекают кровью, плачут, умоляют, молятся, но всё безрезультатно. Хотя иногда гора соломы может надломить вьючное животное. И там, где одни сдаются, другие сопротивляются. А Рейхангуль хочет фунт мяса.\n\nРейхангуль была дочерью похищенной смертной женщины и плотоядного монстра. С самого рождения её называли «Хранительницей теней», и ей внушали, что вся её жизнь должна быть развлечением для её отца, а её мучения - силой их истинного бога. Она росла одна, с одним только отцом, и ей не нужны были истории о преисподней, чтобы молиться, потому что не было дня, когда бы она не пережила это.\nЕё сны были полны света и подчинения, смерти, тысячу раз прокручивавшейся в её голове. И когда она стала достаточно взрослой, отец взял её в жены, чтобы исполнить предназначение, для которого она была рождена.\nО большем она просила и молилась втайне, обращаясь к свету, который однажды сразил чудовищ из её снов. К сожалению, это не дало ответа. Другие демоны, пьющие кровь, нашли её отца и после битвы забрали их обоих в горы.\nТам её пытали день и ночь, а похитители говорили, что она чудовище. Грешная, порочная и заслуживающая боли, в то время как всё, с чем Рейхангуль могла справиться, - это смятение и ужас. Она начала находить утешение в пылающих демонах из своего сна, наслаждаясь моментами, когда они умирали в муках, и страстно желая этого.\nНаконец, однажды ночью её сон был прерван ударом хлыста, и в тумане боли и дремоты она взяла свои нестриженые ногти и страшные клыки и разорвала их на части. Она собрала ещё больше проклятых душ, забрала их и сбежала обратно в земли, которые помнила.\n\nПосле того, как они забрали книги, которые были у них в руках, всё стало немного понятнее. Рейхангуль знает, что она - одна из Золотых детей, которую предали, убили и возродили в низшем состоянии. Как и все остальные дампиры, с которыми она сбежала.\nНекоторые довольны своими родителями, но она знает правду. Она знает, что должна избавить их от родительской тирании. Нет, зловещее присутствие мёртвых должно быть уничтожено.\n[Glossary('Куэй-дзин','game_concept_kuei_jin_desc')] прокляты. Они все должны быть уничтожены, чтобы их некогда убитые дети могли всё исправить. Так и должно быть.\n\nДолжно быть.\n\nДолжно быть."
 POD_persistentpodlore.desc.793350:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью [Glossary('Мира Тьмы','game_concept_world_of_darkness_desc')].\n\nСреди многих членов дворов Голодных мертвецов распространён стереотип, что почти каждый [Glossary('куэй-дзин','game_concept_kuei_jin_desc')] из Индии - в той или иной степени еретик. Среди тех недоброжелателей из двора Белого тигра есть Вепрь, который... красноречиво указывает им на недостаток их мудрости.\n\nВ своей смертной жизни Нараян жил на берегу Бенгальского залива. Всю свою жизнь он был рыбаком и придерживался принципа, что если его жизнь прекрасна, то нет особых причин её менять. Скучный и уравновешенный, он вёл очень обыденную жизнь, пока однажды, отправившись на рыбалку, случайно не поймал плавающего тигра, после чего был немедленно утоплен и съеден разгневанным хан. И за то, что он ударил одного из воинов Изумрудной матери, его бросили в преисподнюю Кипящих морей.\nНесмотря на несправедливость всего этого, он смирился со своей преисподней и опустился на дно, провалившись в пещеру, а затем очнулся в мире смертных на берегу. Когда [Glossary('цивилизатор демонов-младенцев','podgloss.infantdevilcivilizer')] нашёл его, он просто снова ловил рыбу.\n\nНараяна должны были доставить ко двору, где он после единственной ссоры со своим [Glossary('цивилизатором демонов-младенцев','podgloss.infantdevilcivilizer')] был немедленно отправлен во двор Восьми Цветущих лотосов. Несмотря на свой вспыльчивый характер, Нараян чувствовал себя в этом как рыба в воде и временами даже спорил со своими наставниками из-за того, что они меняли своё мнение по темам или сюжетам.\nЕго решительность и гневная стойкость сделали его отличным представителем Блистательных журавлей, а его предсказуемость и преданность быстро подружили его с Фань, и он легко стал хранителем [Glossary('ву','podgloss.wu')] Ледяных рогов. И хотя он не стал бы избавлять её от увещеваний по поводу её отречения, в конце концов он все-таки смирился, убедив себя, что мало что изменится.\nНо срыв прибытия [Glossary('Анда','podgloss.anda')] так сильно разозлил его, что, когда Фу Хао начала собирать силы против них, он присоединился к ней, полный решимости упокоить этих смутьянов в могиле и снова навести порядок."
 POD_persistentpodlore.desc.793351:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью [Glossary('Мира Тьмы','game_concept_world_of_darkness_desc')].\n\nДаже при таком свободолюбивом дворе, каким был двор Фань, учитывая мятежную и отвратительную натуру их врагов, было бы глупо не иметь начальника шпионской службы. И всегда в тени двора Фань была Многоножка.\n\nЭрке-кара родился в степи давным-давно, но он мало говорит о том времени своей жизни. Один из бесчисленных, потерянных от лихорадки, он был найден [Glossary('цивилизатором демонов-младенцев','podgloss.infantdevilcivilizer')], всё еще покрытым адскими паразитами из преисподней Роящихся личинок, и всё ещё стряхивающим их с себя, как дикий зверь. Но когда его выводили вперёд, он всегда оставался вне поля зрения.\nБыстро добравшись до своих владык, он пошептался с ними по мелочам и просмотрел всю сеть шпионов, чтобы оставаться начеку и постоянно следить за любыми угрозами. Постепенно продвигаясь по службе и рекомендациям, он нашёл своё любимое место при дворе Фань, поскольку восхищался общим доверием, которое она ему оказывала.\nНе задавала слишком много вопросов, когда исчезали [Concept('akuma', 'акума')|E], не искала слишком глубоко, когда возникали потенциальные угрозы. И когда она отреклась от власти, ни у кого из тех, кто имел к ней какие-либо претензии, не осталось особых оснований для продолжения.\n\nОднако в последовавшем хаосе Эрке-кара обнаружил, что методы Тенцинга ему вполне по душе. Ещё более отстранённый, чем Фань, он с её благословения присоединился к его двору.\nДаже несмотря на то, что он противостоит своему товарищу по [Glossary('ву','podgloss.wu')] Фу Хао, он предпочитает более мягкую структуру, которую культивирует Тенцинг. Но, несмотря на свою холодную внешность, он искренне надеется, что ему никогда не прикажут обратить оружие против своих товарищей..."
 POD_persistentpodlore.desc.793352:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью [Glossary('Мира Тьмы','game_concept_world_of_darkness_desc')].\n\nСреди множества сил, которые когда-то были обычным делом при дворе Белого тигра, одной из самых неуместных, казалось, был красавчик при дворе воинов, мудрецов, философов и начальников шпионских служб. Но за сладким голосом, мастерством исполнения песен и соблазнительностью форм скрывались смертоносные объятия, которые гасили свет в сердцах врагов, которых невозможно было поколебать.\n\nЯхуи в своей смертной жизни был сиротой в эпоху Воюющих царств в истории Китая, в государстве Вэй. Вначале всё, что у него было, - это его обаяние, ум и красота, и почти ничего больше. Он использовал их всех так хорошо, как только мог, но в те времена судьба людей ночи часто была жестокой, и когда этот период подходил к концу, Яхуи был всего лишь одним из бесчисленных безымянных погибших во время завоеваний Цинь. И после смерти он обнаружил, что лишён идентичности в ужасах Железных борделей преисподней Соли и Железа.\nЛишённый средств к существованию, он превратил свои зубы в клыки гадюки и отгрыз себе руки и лодыжки, чтобы спастись, вытащив себя из Змеиной преисподней. Когда он был найден [Glossary('цивилизатором демонов-младенцев','podgloss.infantdevilcivilizer')], они были поражены, обнаружив лик Гадюки-демона, способной ошеломить их всех.\n\nЯхуи был цивилизован и тренировался как Железный коготь, используя своё невероятное обаяние и коварство, чтобы сразить [Concept('akuma', 'акума')|E], который был слишком ослеплён, чтобы разглядеть клыки, скрывающиеся под ними. Однако, как только у него появился выбор, он поспешил ко двору Фань и поклялся ей в верности.\nОн усердно служил ей, верный тому двору, который она сформировала. Даже если он не смог завоевать человека, который завладел его сердцем, он, по крайней мере, сохранил их работу. Когда Фань отреклась от власти, Яхуи был растерян.\nВместо того чтобы расстаться, как это произошло с большинством членов их [Glossary('ву','podgloss.wu')], Яхуи просто ушёл с Фань, когда она отреклась, и продолжает жить так, как жил всегда."
 POD_persistentpodlore.desc.793353:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью [Glossary('Мира Тьмы','game_concept_world_of_darkness_desc')].\n\nВ Таши среди духов ходят слухи о тайных встречах и сделках. Среди них есть слухи о воре, о трупе, обладающем красноречивым глазом искусства души.\n\nОтчасти они верны. Но было бы глупо со стороны Цзэцзуна исправлять эту историю.\n\nЦзэцзун в своей смертной жизни был простым городским стражником. Он был довольно хорош в этом, и, несмотря на то, что их городок был маленьким и находился в стороне, ему удалось поймать изрядное количество воров. Но однажды ночью по его городу пробежал вор, который поставил в тупик всех его коллег-стражников. Цзэцзун посвятил себя его поимке с поличным.\nТщательно подготовив приманку, он назначил награду, от которой вор не мог отказаться, и был уверен, что он у него в руках. И в тот момент, когда верёвка, на которой он висел, дёрнулась, он прыгнул на него, торжествующе смеясь.\n\nОн поймал мафусаила Салюбри Цзао-цзея, и тот поблагодарил его за беспокойство. И сразу же принял в лоно Ву-Цзао.\n\nС тех пор, как его обратили и обучили, Цзэцзун, хотя и был великолепен в поимке воров, сам по себе был ужасен в этом, поэтому его перевели на другую ответственную должность. Вместо этого Ву-Цзао требовался доступ в Китай через Таши, поэтому Цзэцзуна отправили следить за тем, чтобы эти дороги оставались открытыми.\nТам он ждал и терпеливо втирался в доверие к предку Цзян Шахуа, в конце концов добившись аудиенции, в которой нуждался. Там он и остаётся, держа эти ворота открытыми, играя в игру ожидания. Таким образом, когда-то он ловил воров, а теперь открывает им дверь."
 POD_persistentpodlore.desc.793354:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью [Glossary('Мира Тьмы','game_concept_world_of_darkness_desc')].\n\nДолг лекаря — лечить и защищать. Даже если это не всегда касается людей, Янва никогда не отступал от своего предназначения — ни будучи смертным, ни став вампиром.\n\nЯнва жил в городе, который впоследствии стал известен как Ташгар, и его профессия лекаря была невероятно важна на подступах к Китаю. Он был хорош в своём деле и, состарившись, спас сотни людей во время их странствий. Именно из-за его мастерства за ним долгое время наблюдали, а другой целитель пришёл к нему, когда он спал, и наделил его [Glossary('витэ','game_concept_vitae_desc')], чтобы усилить его способность исцелять.\n\nЯнве было непросто привыкнуть к мысли о смерти, но он был местным в этом городе, и Ву-Цзао нужно было сделать так, чтобы город оставался для них открытым. Благодаря своим целительским способностям он стал известен ночному правителю города Цзян Шахуа. Внешне он демонстрировал свои «душевные искусства» и помогал двору, а сам тем временем потихоньку открывал свою лавку для других Ву-Цзао, превратив её в убежище и перевалочный пункт на пути в Китай.\nОн не до конца понимает, что они делают, но его долг — защищать. Поэтому он остаётся непоколебимым и держит этот путь открытым.\n\nКонечно, ни к чему плохому это не приведёт."
 POD_persistentpodlore.desc.793355:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью [Glossary('Мира Тьмы','game_concept_world_of_darkness_desc')].\n\nСреди немногих доверенных гостей Цзян Шахуа есть одна, которая выделяется на фоне остальных. Женщина, всегда одетая в дорогие шелка, с налитыми кровью красными глазами, но не [Concept('akuma', 'акума')|E] и не тигр-дьявол. Она использует что-то иное, но тоже владеет искусством управления душами. Обычно её третий глаз скрыт, но когда он появляется, у всех по спине бегут мурашки. Это что-то старое и древнее, и её жуткий взгляд внушает страх всем, кто оказывается рядом.\n\nАкари родилась далеко на востоке, но она — культурный хамелеон, легко приспосабливающийся к любой среде. Её смертная жизнь была короткой, оборвалась, когда ей не было и двадцати, от руки силы, несущей ужас и тьму. Эта сила научила её ужасам своего хозяина и, что самое странное, показала, как важно, чтобы те, у кого три глаза и кто пьёт кровь, могли отправиться туда, где они нужны.\nЕсли она это сделает, её сир не станет вмешиваться в её дела.\n\nАкари сочла это идеальным и, услышав гул того, что дремало под землёй, улыбнулась и направилась к воротам. Очаровательная и хитрая, она прокладывала себе путь в самое сердце известного ей мира, укрепляла там свою власть, притворялась милой и выжидала. А когда пришли наблюдатели, она позаботилась о том, чтобы они беспрепятственно прошли, используя нужные слова и правильные дары для предка.\n\nРазумеется, всё согласно замыслу. Именно этого и хотели бы те, кто спит внизу."
 POD_persistentpodlore.desc.793356:0 "Этот персонаж был создан для фанатского дополнения «Relentless Age» и используется с разрешения авторов. Он не является официальной частью [Glossary('Мира Тьмы','game_concept_world_of_darkness_desc')].\n\nМа Хай-Лань была дочерью мелкого чиновника из Чжунду и вела ничем не примечательную жизнь, пока не пришли монголы и не разрушили город, убив при этом множество людей, в том числе её и её подругу детства Линь Сяо. Их обеих отправили в [Glossary('преисподнюю Шипастых цепей','podgloss.hellspikedchains')], и именно там Ма Хай-Лань раскрыла свою истинную сущность и возглавила группу заключённых, чтобы сбежать. Так появилась её [Glossary('ву','podgloss.wu')] — Демоны Чжунду.\n\nОна разочарована, но не удивлена тем, что пять Августейших дворов распались. Когда она присоединилась к Голодным мертвецам и встретилась с воинами-Журавлями, которые впоследствии основали города-государства двора Жёлтого императора, она наслушалась нытья и жалоб — и всё это исходило от самых недостойных бессмертных, бамбуковых князей, которые вели себя так, будто весь мир принадлежал им по праву. Для «генерала Ма», гордой и воинственной последовательницы Восьмикратного пути Лотоса, истина проста: ты берёшь то, что заслуживаешь, окровавленными, израненными руками, и только тогда можешь сказать, что заслужил это.\n\nПо мнению генерала Ма, ночной мир материкового Китая вернулся к бандитизму и беззаконию древних времён, что, по её мнению, возвращает её в туманную юность. Китай снова созрел для захвата, если найдутся Голодные мертвецы, готовые последовать за ней.\n\nНет места для горечи. Может, старые августейшие дворы и проиграли, ну и что с того? Они утратили благосклонность небес, разжирели и обленились в прекрасном мире, который, как они думали, будет существовать вечно. [Glossary('Анда','podgloss.anda')] и их союзники из еретических сект не наследники небес; они не построили государство на том хаосе, который сами же и посеяли.\nОни — всего лишь испытание, которое должны пройти и преодолеть следующие достойные заступники. Ма Хай-Лань полна решимости стать таким заступником и собрать армию, чтобы захватывать города один за другим.\n\nКогда-то существовала империя мёртвых, праведная и чистая... и теперь Китай готов к созданию новой.\n\nДальнейшая судьба\nНесмотря на смертный приговор, который часто выносили тем, кто открыто выступал против [Glossary('Анда','podgloss.anda')], благодаря лидерским качествам и упорству Ма Хай-Лань она и её [Glossary('ву','podgloss.wu')] выжили и пережили ад, которому когда-то принадлежали.\nОна станет обособленным предком раннего Квинконс и будет преданно служить своему двору, пока в начале XX века её разногласия с более консервативными предками не приведут к расколу."
 POD_persistentpodlore.desc.793357:0 "Этот персонаж был создан для фанатского дополнения «Relentless Age» и используется с разрешения авторов. Он не является официальной частью [Glossary('Мира Тьмы','game_concept_world_of_darkness_desc')].\n\nЛинь Сяо любит приукрашивать действительность и способна сочинить тысячу историй о своём прошлом, но за завесой обмана и зарождающихся мифов она скрывает правду. Всё это для того, чтобы подавить свой гнев.\n\nЛинь Сяо была дочерью преуспевающих купцов из Чжунду и с детства воспитывалась в их ремесле. Но больше всего на свете она любила истории. Она обожала легенды о великих героях и богах и часто погружалась в них с головой.\nПожалуй, самым ценным подарком, который сделали ей родители, было то, что они научили её читать и писать, ведь вскоре она уже сама сочиняла истории. Линь Сяо редко выходила из дома, разве что поиграть с подругой Ма Хай-Лань, и всегда завидовала основателям династий, которые, начав с самых низов, правили всем известным миром.\nОна была так поглощена всем этим, что даже не заметила, как пали стены Чжунду, пока монгольский меч не отрубил ей голову и не отправил её в глубины [Glossary('преисподней Шипастых цепей','podgloss.hellspikedchains')].\n\nЭто событие сломило Линь Сяо. Падая в преисподнюю, она видела, как полыхает её родной дом, а за ней следуют дымящиеся угли её собственных историй и тех, что она обожала.\nПо большей части она просто смирилась со своей участью. Даже когда подруга детства спасла её, она была молчалива и угрюма на протяжении всего пути, пока они бежали и скрывались.\nОна не проронила ни слова и просто плелась за ней, словно тень. По крайней мере, до тех пор, пока не увидела руины Чжунду. Что-то внутри неё вспыхнуло — пожар гнева и печали, который поглотил всё её существо.\nВой Тигров-дьяволов взывал к ней, и она позволила [Glossary('Анда','podgloss.anda')] услышать свой рык вместе с [Glossary('ву','podgloss.wu')]. В вихре лжи и уловок она направила все свои силы на поддержку своей [Glossary('ву','podgloss.wu')].\n\nДальнейшая судьба\nЛинь Сяо переживёт войну с Анда и станет свидетельницей того, как Квинконс захватит власть в ночном мире.\nОна тихо вернулась в свой дом и осталась там, пока его восстанавливали. Во время вторжения Кровавого двора и Восстания столетия в хаосе на рубеже тысячелетий, после столетий ожидания, ныне великий магистр Линь взяла под свой контроль ночь в городе, выросшем на месте её дома, — Пекине.\nОна снова объединится со своей подругой детства, но на этот раз она будет на равных с теми, кто рассказывает небылицы её ученикам. Она превзойдёт их всех."
 POD_persistentpodlore.desc.793358:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью [Glossary('Мира Тьмы','game_concept_world_of_darkness_desc')].\n\nПечально родиться военным в последние дни существования империи. И, возможно, если бы Яньсян жил в другое время, он мог бы стать по-настоящему заслуженным солдатом. Теперь ему придётся довольствоваться этим после смерти.\n\nЯньсян был одним из многих солдат в последние годы правления династии Цзинь, расквартированных в Чжунду в награду за свои прежние успехи в карьере и отражение первых набегов со стороны государства, которое впоследствии стало Монгольской империей.\nОднако это назначение позже погубило его, поскольку в результате осады и разрушения Чжунду он был убит на стенах Чжунду, погиб, защищая город, и оказался в [Glossary('преисподней Шипастых цепей','podgloss.hellspikedchains')]. Борясь с цепями, он просто лишился своей сущности ради гнусных целей своего повелителя.\nОднако, по чистой случайности, он был одним из немногих счастливчиков, оказавшихся рядом с другой беглянкой, которая во время своего бегства помогла им спастись, а Яньсян, в свою очередь, помогал сражаться бок о бок с ними, когда они пробивали себе путь обратно в мир живых.\n\nПосле того как [Glossary('цивилизатор демонов-младенцев','podgloss.infantdevilcivilizer')] обнаружил Яньсяна, он поместил его вместе с другими беглецами в качестве морального стержня своей [Glossary('ву','podgloss.wu')], поскольку, несмотря на то, что Яньсян был солдатом, в бою он был одним из самых сдержанных среди них.\nОднако его жизненный опыт сыграет решающую роль в войне против [Glossary('Анда','podgloss.anda')], и он будет преданно стоять рядом с ними.\n\nДальнейшая судьба\nБлагодаря мудрости Яньсяна все члены его [Glossary('ву','podgloss.wu')] доживут до образования Квинконс. Он станет предком города, который впоследствии станет Чжухаем, и, когда Квинконс придёт в упадок, воссоединится со своей прежней [Glossary('ву','podgloss.wu')], чтобы помочь Ма Хай-Лань восстановить Квинконс, используя своё положение предка Чжухая для помощи Демонам Чжунду."
 POD_persistentpodlore.desc.793359:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью [Glossary('Мира Тьмы','game_concept_world_of_darkness_desc')].\n\nПри виде [Glossary('ву','podgloss.wu')] Демонов Чжунду мало кто может прийти к какому-либо иному выводу, кроме того, что Тай — настоящий зверь в человеческом обличье, высокий и широкоплечий, с соответствующей силой и яростью. Учитывая его репутацию, его смертная жизнь кажется парадоксальной для тех, кто её знал.\n\nТай был сыном мясников и сам стал мясником. Он стал силён от того, что таскал мясо, и ловко управлялся с ножом, так что в целом был вполне доволен своей жизнью и даже женился на своей возлюбленной детства Шуфэнь.\nБольше всего на свете он хотел дожить до старости, занимаясь мясницким делом. Но этому не суждено было сбыться, потому что его дом был разрушен монголами во время их первых завоевательных походов. Тай стал одним из многих погибших при разграблении Чжунду, которые после смерти попали в [Glossary('преисподнюю Шипастых цепей','podgloss.hellspikedchains')].\n\nНесмотря на весь ужас происходящего, потеря любимой Шуфэнь привела Тая в неописуемую ярость. Его гнев стал чем-то вроде кошмара, и даже демоны старались держаться подальше от новоиспечённого демона, который метался в аду Шипастых цепей.\nИ когда его освободил другой беглец, он, словно обезумевший бык, бросился к своей возлюбленной и голыми руками разорвал её оковы. Они сбежали вместе со своим освободителем и ещё несколькими демонами в мир живых.\nПосле обучения их объединили в общей [Glossary('ву','podgloss.wu')]. Сам Тай был готов сражаться бок о бок с ними ради мести, ведь они были объединены в [Glossary('ву','podgloss.wu')] для борьбы с [Glossary('Анда','podgloss.anda')].\n\nДальнейшая судьба\nЯрость Тая помогла ему выстоять в войне против [Glossary('Анда','podgloss.anda')], и он стал одним из немногих предков Низвергателей династий.\nОднако в начале XX века, когда влияние Квинконс начало ослабевать, Тай по совету Ма Хай-Лань решил занять место предка-магистрата. Услышав слухи о возможном возвращении Добрула Храброго, он как никогда был согласен со своими товарищами.\nКвинконс необходимо восстановить, и Легион Небес и Преисподней лучше всего справится с этим."
 POD_persistentpodlore.desc.793360:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью [Glossary('Мира Тьмы','game_concept_world_of_darkness_desc')].\n\nКогда-то Шуфэнь была бы счастлива состариться в браке. Но теперь она мечтает о гораздо большем.\n\nШуфэнь родилась в семье дворцовых слуг в Чжунду, столице поздней династии Цзинь. Её родители были постоянными покупателями у местного мясника, и именно там она встретила мужчину, который стал её лучшим другом, любовью всей её жизни, а затем и мужем.\nОна была вне себя от радости, что ей посчастливилось выйти замуж за человека, которого она любила и желала, и с радостью вышла за Тая, а после смерти его родителей помогала ему в мясной лавке.\nНо, к несчастью, её счастливый финал был прерван монгольским нашествием на Чжунду, в результате которого город был разрушен до основания и сожжён дотла. Шуфэнь, как и многие другие, попала в [Glossary('преисподнюю Шипастых цепей','podgloss.hellspikedchains')]. Её забрали у Тая и использовали в качестве топлива для его хозяина. Она билась в конвульсиях, пытаясь вырваться на свободу, и без конца звала Тая на помощь.\nНесмотря ни на что, он откликнулся благодаря вырвавшемуся на свободу демону, и они вместе с несколькими другими беженцами вернулись в мир живых.\n\nИ со вторым вздохом она больше не будет беспомощной. То, что она была всего лишь девицей, перевернуло всё в душе Шуфэнь, и она больше не желала быть слабой. Нет, она заберёт всю силу, какую только сможет, и уничтожит всех злодеев, которые снова встанут у неё на пути. И теперь это явно [Glossary('Анда','podgloss.anda')].\nОстальные беглецы на её стороне, и Тай тоже не намерен мириться с поражением. Её красота стала оружием, а обаяние — кинжалом. Теперь она будет сражаться. Чтобы быть уверенной, что её больше никогда не постигнет та же участь.\n\nДальнейшая судьба\nШуфэнь переживёт войну с [Glossary('Анда','podgloss.anda')] вместе с остальными Демонами Чжунду.\nНи она, ни Тай не хотели уходить на покой, поэтому стали странствующими предками. Но когда Кровавый двор поставил под угрозу стабильность Квинконс, они получили известие от Ма Хай-Лань о том, что им снова предстоит сражаться.\nШуфэнь с готовностью присягнула на верность новому Легиону Небес и Преисподней и ради этого решила стать великим магистром Железных когтей Шэньчжэня. После этого она с готовностью и всем сердцем присоединилась к новой войне Ма Хай-Лань."
 POD_persistentpodlore.desc.793361:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью [Glossary('Мира Тьмы','game_concept_world_of_darkness_desc')].\n\nПо всей Азии ходят слухи о мужчинах и женщинах, которые могут превращаться в змей. В ночном мире они являются тайными агентами и исполнителями воли Звериных дворов, могущественными и устрашающими убийцами, подчиняющимися непостижимой воле своей богини-матери. Среди их родичей есть много тех, кто живёт и умирает в забвении и безвестности.\n\nАмфай не смирится с такой участью. Если Гея отвергнет его, он сломает её и повергнет к своим ногам.\n\nАмфай был роднёй нага, родившимся в дикой местности Индокитая. Не удостоившись благословения Первого изменения, Амфай был сразу же помолвлен с нага, которая была втрое старше его. Когда он запротестовал и попросил найти ему другое полезное применение, отец-нага сломал ему ноги и недвусмысленно заявил, что, если у него не будет детей, он его убьёт. К несчастью для Амфая, его бесплодие было равносильно смертному приговору, и его казнили за непростительное преступление — нежелание и неспособность зачать ребёнка. За это его душа была отправлена в преисподнюю Отвратительной магии.\nНо, в отличие от многих других, он просто смирился со своей участью, чем вызвал любопытство у Бабушки-Ведьмы, [Glossary('повелительницы Яма','podgloss.yamaking')] из Преисподней. Когда она спросила его, что он будет делать, когда сбежит, он ответил, что убьёт душу земли, и попросил её оставить его в покое, если ей больше нечего сказать. Впечатлённая его ответом, она взяла его к себе, обучила, а затем отпустила обратно в мир живых, наделив адской силой.\nПостепенно его стремление к обретению всё большей и большей власти, прикрытое притворной слабостью ради уничтожения Геи, принесло свои плоды: двор Алого феникса приходит в упадок, и перед ним открывается целый архипелаг, который так и просится под его власть. А рядом с ним наконец-то те, кого он выбрал сам, — возлюбленные, попавшие в его сети назло семье, которая его отвергла и погубила.\n\nДальнейшая судьба\nАмфай был одним из немногих Осквернённых в Индокитае, кто не погиб до начала кампании Пияу. Он затаился в глубине материка и ждал.\nК началу современных ночей он усовершенствовал ритуалы неуязвимости и шпионажа с помощью многочисленных порабощённых нага, которые предупреждали его о любых вторжениях в его владения во Вьентьяне.\nЗдесь он приближается к очередному финальному рубежу, чтобы обрести всю мощь [Glossary('повелителей Яма','podgloss.yamaking')] и использовать её для начала собственной кампании по завоеванию Геи."
 POD_persistentpodlore.desc.793362:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью [Glossary('Мира Тьмы','game_concept_world_of_darkness_desc')].\n\nВ обители Повелителя змей, рядом с хозяином, всегда находится один из демонов. Высокий, крепкий, как бык, и столь же искусный в обращении с оружием, он был самым почитаемым из множества людей, окружающих трон Повелителя.\nНо, несмотря на всё это, у Виксая было то, чего он всегда желал больше всего. Путеводная нить. Куда бы она его ни привела, даже в пучину проклятия.\n\nПри жизни Виксай был простым солдатом в одном из многочисленных городов-государств Индокитая. Он был хорошим воином, невероятно искусным в обращении с копьём и непревзойдённым в бою.\nОн был гордостью своего города. Однако его жизнь была такой же расходной, как и жизнь любого другого человека, и он погиб, никем не оплаканный, на забытом поле боя. А в Городе демонов бессмысленность всего этого сломила его. Он смирился со своим положением солдата в городе, став лишь бледной тенью того, кем был раньше.\nОднако со временем он обрёл своего рода свет. Человек с повадками змея явился к нему, словно луч света с небес, и предложил ему дело, за которое стоит бороться, дело вечное, где он найдёт того, кто его оценит. Того, кто будет его любить. Того, кто примет его и никогда не отпустит.\n\nИ Виксай с готовностью принял это проклятие, став верным копьём своего змеиного короля. И как бы ни нуждался в нём король, Виксай всегда будет рядом."
 POD_persistentpodlore.desc.793363:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью [Glossary('Мира Тьмы','game_concept_world_of_darkness_desc')].\n\nЧто толку от змеи без яда? Какой бы ни была её форма, какого бы ни было размера, это жалкая змея, у которой нет возможности мучить своих врагов. И всё же этот яд может исцелять, а в мире ночи существует бесчисленное множество способов облегчить боль.\nА рядом с Амфаем Сенгдэуан — мастер и того, и другого, и всё это в одном чудесном сосуде.\n\nИзначально Сенгдэуан был сельским лекарем, который в основном занимался противоядиями от укусов змей, но, тем не менее, был довольно хорошим врачом. Однако однажды к нему пришла женщина и попросила лекарство, которое могло бы исправить ужасную несправедливость, совершённую по отношению к ней.\nНесмотря на настойчивые требования своего наставника не делать этого, Сенгдэуан приготовил для неё лекарство. Однако, несмотря на этот добрый поступок, его поймали и убили по приказу «отца», который хотел заявить свои права на жертву. Его заперли в ящике и заживо похоронили, предварительно оглушив.\nИ Сенгдэуан был проклят и отправлен в [Glossary('Какури','podgloss.kakuri')]. И там он без конца проклинал мир за его жестокость, моля о том, чтобы найти способ разрушить его и стереть с лица земли, и выл на этой безжизненной равнине. И именно там, когда он пробирался через пещеры и мёрз на холоде, его появление в мире живых встретило полузмея, наделённого адской силой.\nОн сказал, что они могут сделать всё это и даже больше. Если только он согласится служить.\n\nЭто было самое простое решение за всю жизнь Сенгдэуана. И даже если бы он не был фаворитом, зная, что может произойти, зная, что ужасам и страданиям мира может наконец прийти конец, он бы с радостью согласился.\nДо того дня, когда он увидит, как возвысится [Glossary('Император демонов','podgloss.demonemperor')] и уничтожит всё это."
 POD_persistentpodlore.desc.793364:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью [Glossary('Мира Тьмы','game_concept_world_of_darkness_desc')].\n\nВ постоянно меняющемся мире даже самые ярые безумцы падут перед мощью логистики и снабжения. Отчасти успех «Змеев» был обусловлен не их личной силой, боевыми навыками или преданностью своему господину в преисподней Отвратительной магии, а тем, что у них был человек, способный грамотно управлять денежными потоками.\nИ это искусство давалось Удому без труда.\n\nВ своей смертной жизни Удом был простым торговцем, избравшим опасную профессию и перевозившим товары по диким землям, где было полно пиратов и разбойников, в отдалённые города и деревушки. Однако его родина была богата и предоставляла множество возможностей, поэтому он выбирал опасные маршруты.\nИ всё это ради своей родной деревни на берегу Меконга. К несчастью для них, Удом совершил ошибку, оскорбив не того человека. Желая унизить его за то, что он задел его гордость, этот человек натравил на Удома всех караванщиков и разбойников, чтобы тот мог наблюдать за его разорением и насмехаться над ним.\nИ вот, когда Удом в последний раз отправился в путь с товаром, он попал в засаду, был схвачен и забит до смерти свинцовыми монетами в качестве насмешки. Такая смерть отправила бы его в преисподнюю Безденежья.\n\nЭто событие сломило Удома, который просто лежал в грязи и смирился со своей участью — ему предстояло стать новым демоном-попрошайкой. И спустя невообразимо долгое для него время у него наконец-то появилось достаточно объедков, чтобы выползти на свободу. Но первым, кто его нашёл, был Змеиный владыка, который разглядел в нём ум и принял его к себе. Он предложил Удому место, где тот мог бы наконец использовать свой ум, управлять всеми финансами и торговлей в новом мире, обрести покровителя, который бы его защищал, и возлюбленную, которая бы его никогда не бросила.\nУдом, переживший позор нищеты, превратившей его жизнь в ад, не хотел больше страдать и с готовностью согласился."
 POD_persistentpodlore.desc.793365:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\n. Будучи мальчиком, все, что Кхамсай хотел сделать, — это выращивать животных и заводить друзей. И мир сломал бы его за это, и все за один-единственный грех. \n\nХамсай родился в маленькой деревне и был сыном семьи, которая часто пасла большую часть волов. С юности он был веселым и честным человеком, любил заботиться о животных и играть с ними. \nОн никогда не хотел быть в центре внимания и просто довольствовался тем, что имел. Однако его жизнь пошла по спирали, когда мужчина, которому нужны были быки его семьи, предложил выдать Хамсая замуж за его дочь. \nОднако Хамсая это просто не интересовало. Он не хотел потенциально беспокоиться о потере своих животных. \n\nК сожалению, мужчина воспринял отказ как оскорбление и ночью, когда Хамсай присматривал за загоном, поджег его, убив Хамсая вместе с большинством животных его семьи. И в смятении смерти он оказался в ужасах ада перевернутых грешников. \n В ужасе и просто желая, чтобы это прекратилось, он умолял и молился всем, кто слушал. Однако он медленно усваивал перевернутые правила ада и, вопреки всей логике смертных, доверился змее. \nОн последовал за ней обратно в мир живых, к хозяину. Бледная змея, нашедшая его, вернула его на ту степень осознанности, где предложила ему сделку — служить ему разумом и телом, и он получит награды своей души на том свете. Используйте для него его откровенность и дружелюбие и познайте величие. \nПрисоединяйтесь к его прибежищу и его супругам и никогда больше не знайте угрозы опасности. \n\nКхамсай принял предложение в тот момент, когда Амфай закончил предложение."
 POD_persistentpodlore.desc.793366:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nHer, родина захвачена, предки угасают, а новые богохульства свирепствуют. Этого достаточно, чтобы свести с ума мужчин и женщин. Но все они оставляют то, что могло бы возвысить их на большую высоту. И Тири не оставит тех, кто стоит рядом с ней, ни в жизни, ни в смерти. \n\nКогда-то Тири была ученицей Дьянанга, когда-то давным-давно она была Послушницей Бьющихся Драконов. Однако ее путь много раз был чреват заходом слишком далеко в мир живых. \nТири в глубине души все еще глубоко заботилась об отголосках своей смертной жизни, и более безудержные эксцессы других Бьющихся Драконов сильно беспокоили ее. Их стремлений превратить ее тихий дом в ужасный вихрь секса и насилия, упадка дворов и временами более глубокого самоанализа на путях, названных иностранными повелителями ересью, Тири наконец-то надоела. \n\nРазорвав контакт с двором Алого Феникса, она призвала всех учеников, которых могла. Их целью было привести свой дом в порядок, сбросить оковы внешнего господства и вернуть семью в центр. Таковы были ее амбиции. Таков будет ее путь. Так и будет.\n\nБудущая судьба\nНесмотря на некоторый первоначальный успех, упадок двора Алого Феникса и возвышение Золотых Дворов приведут к тому, что Тири будет вынуждена уйти в изгнание, спасаясь от сил Пияу, которые смешат ее с [akuma|E].\nНо Тири будет выжидать в изгнании, прежде чем, наконец, вернуться в попробуйте продолжить с того места, на котором она остановилась в «Последних ночах»."
 POD_persistentpodlore.desc.793367:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\n. Если бы они просто оставили все как есть, Нанда был бы рад оставить все как есть. Однако, поскольку его дом находится под угрозой, а Дьяволы и Тираны одинаково царапают дверь, как можно было не заставить его действовать? \n\nНанда был человеком, пришедшим из ниоткуда, когда его нашел Дьявол [Glossary('цивилизатор демонов-младенцев','podgloss.infantdevilcivilizer')] из двора Алого Феникса. Его прошлое было туманом, лишь направлявшим его мораль и травмы Ада Кипящего Масла. Он пытался принять Бьющихся Драконов, как от него и ожидалось, но часть его просто не понимала этого. Ничего из этого не имело смысла отказываться от дара, которым была человечность. \n\nЕсли Голодные Мертвецы были прокляты, почему они тогда должны отказываться от человечества? Все эти вопросы не давали ему покоя, и когда он задавал эти вопросы, они отвечали не разумом, а упреком. Неудивительно, что он сразу же присоединился к Тири в ее кампании по восстановлению надлежащего правления в объятиях семьи. \n\nЭти двое стали невероятно близки и решили подтвердить свою преданность семье, построив свою собственную. Там, где она охраняет и руководит домом, он берет в руки оружие и ведет их новую семью на войну против иностранных демагогов и злых дьяволов, нападающих на их дома. \nПока пятно не будет вытерто, он будет сражаться."
 POD_persistentpodlore.desc.793368:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nСреди Янтарного крапивника во дворе Желтого Императора одного из их членов редко можно увидеть. Их предполагаемый центр, узы, связывающие их всех. Ядро, которое никогда не ведет, направляющая сила, которая дает им свое сердце, и объединитель, который, кажется, избегает открытых пространств. \n И все же добрый Голодный Мертвец с лицом старой леди является основой, на которой стоят достижения Янтарного крапивника. \n\nЦзинъи всегда был стар душой. Тихая и добрая, но кроткая и отзывчивая, она друг, которого все хотят, но никогда не видят. Переутомляя себя в жизни прямо в [Glossary('Города чудищ','podgloss.wickedcity')], она двинулась дальше в мир нежити с той же степенью искренней поддержки своих новых товарищей, средоточия ее цели. \nОна была верной подругой со всеми ними, плечом, на котором они могли плакать, и ухом, которое никогда не могло их отвернуть. И даже если она часто помогала, она была для них всех важнейшим источником советов и связующим клеем, который скреплял их всех вместе. \nИ по мере того, как [Glossary('Анда','podgloss.anda')] приближаются, ее железная поддержка ее [Glossary('ву','podgloss.wu')] будет нужна сейчас больше, чем когда-либо. \n\nБудущая судьба\nПоследующий хаос возможного падения Желтого Императора двор ударил бы Янтарного Крапивника сильнее, чем большинство представителей старого правящего класса. \nИ когда Цзинъи отправилась в путь, чтобы попытаться сплотить своих товарищей, на нее обрушился Черный Ветер, и она была отправлена в последнюю пустоту, как пепел на ветру."
 POD_persistentpodlore.desc.793369:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\n. Во времена воинов неудивительно, что так много [Glossary('ву','podgloss.wu')] собирается для войны против [Glossary('Анда','podgloss.anda')]. И все же, если просто отправить Дьяволов на битву с бедой, их численность резко сократится. Поэтому они экипированы, вооружены и связаны через сложную сеть военной логистики, которая могла бы посрамить многих. \n Воспользовавшись учениями мудрецов до него, Сюэ овладел этими линиями. \n\nСвоя смертная жизнь, разорванная муками [Glossary('Какури','podgloss.kakuri')], Сюэ мало что помнит о смертности. Когда он сбежал из Ада, он сделал это в учении Сунь Ли.\nУсвоив ее учение, его собственное место в логистической сети Янтарного Крапивника стало очевидным. В то время как они занимались посыльными и информацией, именно Сюэ занимался военной стороной дела. \n\nПока двор Желтого Императора объединял силы против [Glossary('Анда','podgloss.anda')] и [akuma|E], они были вооружены и связаны друг с другом сетями Сюэ. Его пристальное внимание к деталям и его яростное поведение, направленное на уничтожение врагов вернувшихся демонов, помогли ему подняться далеко. \nИ в такие времена люди с рвением наказывать злодеев и менталитетом, чтобы их организовать, могут пойти далеко. \n\nБудущая судьба\nПадение двора Желтого Императора и последовавший за ним хаос в его северных силах стали причиной многих сведений Сюэ. сети и логистические цепочки должны быть доведены до предела. \nОднако он твердо придерживался их из упорного желания продолжать борьбу. И пока [Glossary('Анда','podgloss.anda')] найдет его убежище и увидит его уничтожение, его надежные системы и институты переживут войну и возродятся среди Квинкунксов."
 POD_persistentpodlore.desc.793370:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nСреди дампиров двора Желтого Императора многие говорят о Крестном отце, человеке огромного богатства, который подходил ко всем их матерям, предлагал им шанс стать чем-то большим, а затем вернулся, чтобы вдохнуть жизнь в их детей 9 месяцев спустя.\nЭто буря слухов, которыми Лиан очень гордится. Особенно, когда почти все эти дампиры на самом деле принадлежат ему.\n\nИ в жизни, и в смерти Лиан всегда прислушивался к низменным прихотям своего тела, настолько, что Ад Соли и Железа был для него почти неизбежным.\nИ когда он сбежал и был доставлен в [Glossary('цивилизатор демонов-младенцев','podgloss.infantdevilcivilizer')], даже будучи Дьяволом, они знали, что он будет Бьющимся Драконом.\nИ в течение года после своего возвращения он уже стал отцом многих дампиров. А со временем он действительно отдал своих детей на службу двору, но не в качестве слуг, телохранителей или прочей суеты, а в качестве курьеров.\nОснова информационной сети Эмбер Рен — плод чресл Лиан. И поскольку требуется все больше и больше курьеров, поскольку влияние и потребность в услугах двора Желтого Императора, Лиан находит дальнейшую цель в создании большего количества глаз и ушей для Янтарного Крапивника.\n\nБудущая судьба\nБлагодаря личной преданности, которую он культивировал, среди Янтарного Крапивника его контакты оставались довольно надежными, когда двор Желтого Императора рухнул.\nФактически, когда разрозненные элементы Суда объединились, они сделали это на основе его детей.\nА когда был сформирован Квинконкс, Лиан по большей части отошел от власти, став уважаемым предком и в конечном итоге вознесся до [Glossary('Сотня облаков','podgloss.hundredclouds')]."
 POD_persistentpodlore.desc.793371:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nУчитывая огромный объем как признанных, так и запрещенных произведений литературы, известных $pod_kueijin$, неудивительно, что в их ночном мире им посвящены целые рынки. Среди самых заслуженных продавцов — почтенный Цзяньхун из Янтарного крапивника.\n\nЦзяньхун был вторым из его [Glossary('ву','podgloss.wu')], сбежавшим из ада, где у него, казалось, было фанатичное желание цепляться за знания. Изучая каждую имевшуюся у него книгу и запоминая ее, было мало вещей, которые он не читал среди известных великих произведений $pod_kueijin$.\nА когда его [Glossary('ву','podgloss.wu')] начал заниматься коммуникациями, его собственная вопиющая откровенность принесла ему большое доверие среди потенциальных покупателей книг. И по мере того, как все больше и больше эзотерических работ попадало в его коллекции и обмены, он также заработал некую негласную репутацию человека, готового транспортировать любые материалы, включая инферналистские тексты, преподаваемые [akuma|E].\n\nКак последователю Песни Теней [Glossary('дхармы','podgloss.dharma')], ему была предоставлена большая свобода действий и доверие. И, несмотря на продолжающуюся войну, сейчас больше, чем когда-либо, многие $pod_kueijin$ ищут просвещения и мудрости среди своих предков. И Jianhong более чем готов их поставлять.\n\nБудущая судьба\nНесмотря на то, что [Glossary('Анда','podgloss.anda')] в значительной степени игнорировал его собственные архивы, разрушение двора Желтого Императора также подорвало и его защиту.\nВ конце концов, единственная ошибка при отправке заказа на копию Сломанного Крылатого Журавля в Золотые Дворы означала его кончину, поскольку он был съеден целиком Пожирателем Дьяволов, учеником Пияу, за «распространение инфернализма»."
 POD_persistentpodlore.desc.793372:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nХуай за это время проделал большую работу, особенно в своей области знаний. Пока двор Черной Черепахи горит, а $pod_kueijin$ разбросан пламенем, а [Glossary('Анда','podgloss.anda')] бьется о северную дверь двора Желтого Императора, Хуай просто детализирует и сообщает, записывает и доставляет. Без суждений, без размышлений, он идеальный репортер и писец, пока пылает Север. \n\nХуай... странный, даже среди наиболее сосредоточенных Прославленных Писцов. Его мало интересуют, кроме письма, каллиграфии и документации, и он, кажется, ни к чему не горит. \n И все же, когда дело доходит до его печатных блоков и документов, он подходит к этому с таким рвением и энергией, что может показаться, будто он страстный кровавый цветок в оргии. А затем, закончив, он возвращается к медитации.\nВ одном случае он даже не вздрогнул, когда стрела пронзила его ноги, чтобы привлечь его внимание, поскольку он просто продолжал писать, в блаженном неведении, сочиняя свои отчеты об уничтожении предка черной черепахи и репродукцию к «Комментариям к следам в крови».\n\nБудущее Fate\nHuai недолго просуществовал бы для мира без двора Желтого Императора. Когда организованное сопротивление [Glossary('Анда','podgloss.anda')] рухнуло, группа воинов [Glossary('Анда','podgloss.anda')] нашла Хуая в его трудах. \nВ отличие от насмешливых придворных, их стрела не промахнулась."
 POD_persistentpodlore.desc.793373:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nРаспространена гипотеза: если дерево упадет в лес, издаст ли оно звук? Что касается Чжичжоу, он часто спрашивает себя то же самое. Или, по крайней мере, если писец пишет что-то, что никогда не читается, написано ли это вообще.\n\nЧжичжоу — главный член Прославленного Писца, которому поручено расшифровывать, тиражировать и формировать печатные блоки для произведений, написанных во дворе Алого Феникса для чтения во дворе Желтого Императора.\nИ все же, несмотря на огромную тревогу, которую он испытывает по поводу пограничных инферналистских сочинений, откровенно эротической и жестокой художественной литературы и еретических местных традиций, пропитанных вещами, на каждую скопированную им книгу он написал пять запросов и просьб прислать силы, чтобы привести их в порядок.\nИ все же каждый раз, когда он пытается добраться до двора, это приводит к тому, что отчет забирают и кладут рядом с растущей кучей.\n\nОн все больше и больше чувствует, что ему, возможно, придется действовать, возможно, ему придется вмешаться напрямую. И поскольку двор Алого Феникса все больше и больше рассыпается в пепел, он чувствует, что время отчетов, возможно, уже прошло.\n\nБудущая судьба\nТакие идеи стали бы его гибелью. Когда Пияу начинает свой крестовый поход через Нусантару, Чжичжоу выбегает из двора Желтого Императора в хаосе смерти Хунбэня и напрямую бросает вызов местному предку, чтобы тот выступил против нее.\nК сожалению, в спешке он наткнулся прямо на пасть двора Короля Змей.\n\nЕго тело так и не было найдено."
 POD_persistentpodlore.desc.793374:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\n. Несмотря на предположения менее прилежных людей, Голодные Мертвецы сочиняют множество литературы во владениях двора Белого Тигра. А учитывая сложный процесс разбора ереси и ортодоксальности, это огромная задача, которая сломала многих писцов. \nНо нынешняя Фейшань побила рекорд на своей должности, прослужив на своей должности дольше всех, не покидая ее, не сходя с ума от переутомления или не поддаваясь еретическим работам, проплывающим в Вечной войне. \n\nПервоначально Фейшань была лишь одной из многих молодых писцы, работавшие под началом предыдущего Тигра-писца, до того, как у него случился психический срыв и он скрылся в каньоне. Выбранная остальными членами [Glossary('ву','podgloss.wu')] за ее умение создавать печатные блоки, она была переведена на его место для выполнения утомительной работы. \n\nСчастливая, что у нее есть место, она взялась за него со старанием и упорством. Кроме того, она добавила к ним многочисленные комментарии, которые сами по себе стали уважаемыми произведениями. Но по мере того, как ситуация с [Glossary('Анда','podgloss.anda')] становится все более сложной, работа постепенно становится все более и более непосильной даже для нее. \n И в этой надвигающейся буре сама ива может быть вырвана с корнем ветром. \n\nБудущая судьба\nНесмотря на огромный стресс, сложность грядущей эпохи и хаос [Glossary('Анда','podgloss.anda')], Фейшань выдержал бы вопреки всему. Фактически, ее собственная работа сыграла решающую роль в сохранении произведений Августейших дворов в Квинконксе."
 POD_persistentpodlore.desc.793375:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nВо дворе Лазурного Дракона существует угроза. Судя по переводу и копированию их текстов, это очевидно. Но вопреки убеждению главного двора, что это каким-то образом Удзи, Джунко знает лучше. \nЧто-то еще, на чем они настаивают, не имеет значения. Эти трехглазые демоны, монстры, формирующие плоть, обладатели кошмаров, застенчивые оборотни, все они. \nОни представляют собой угрозу, пытается им сказать Джунко. Если бы они только слушали. \n\nДжунко — странность во дворе Желтого Императора, поскольку на самом деле она не с материка. Скорее, она была одной из многих, погибших в войне Ямато против Эмиси, убитой какой-то ужасающей реликвией варваров, убивших ее ночью. Ей потребовалось много времени, чтобы сбежать от [Glossary('Какури','podgloss.kakuri')] Йоми, и когда она это сделала, она сразу же отошла от них как можно дальше. \n\nЕе решимость и рвение принесли ей место в Книжниках, где она, казалось, была опытной, особенно в копировании текстов об уничтожении Потомков Вора. Но в последнее время, по мере приближения [Glossary('Анда','podgloss.anda')], Джунко, кажется, становится все более и более взволнованной. \nОна несет чушь о том, что они связаны с теми же вещами, которые изначально убили ее, что они также могут быть связаны со странными мертвецами на Юге. \nХотя такие теории по большей части сразу же отвергаются, она может быть на что-то...\n\nБудущая Судьба\nОна была. И именно поэтому, когда двор Желтого Императора развалился и она больше не была защищена, к ней пришла некая женщина ночи из того же народа, которого она называла варварами, и научила ее, что даже драконов можно есть."
 POD_persistentpodlore.desc.793376:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\n. Хотя большинство взглядов обращено на лидера столь уважаемого отряда охотников на дьяволов, внутри самого Бронзового Вымпела, большинство его младших членов подчиняются не Вэй Аньзану. Скорее, они видят его заместителя, его голос и его ярость. \nНевысокий человек с выражением готовности просунуть голову сквозь кирпичную стену, если это означает победу, Да'ан является основным клеем, связывающим их вместе. \n\nЗемная жизнь Да'ана была простой. Охранник поместья несовершеннолетнего лорда и в Городе Демонов после его смерти. Он сбежал, вырвавшись наружу, где затем быстро приспособился к тому, чтобы стать первым и самым пылким учеником Вэя. \n\nБронзовый Вымпел, не будучи воином и скорее менеджером, организован, вооружен и снабжается Да'аном. Чтобы поговорить с Вэем, часто приходится обращаться через него.\nИ в такие времена всегда нужны такие люди, как Да'ан.\n\nБудущая судьба\nНесмотря на его положение среди ненавистного Бронзового Вымпела, умение Да'ана в организации [Glossary('ву','podgloss.wu')] и боевых отрядов сослужило бы ему хорошую службу и обеспечило бы ему место в Квинкунсе, и он бы тихо отойти в тень и подняться к невоспетой, но основополагающей работе [Glossary('Сотня облаков','podgloss.hundredclouds')]."
 POD_persistentpodlore.desc.793380:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nСеверный Китай остается спорным. Двор Черной Черепахи традиционно претендовал на него, [Glossary('Анда','podgloss.anda')] пробегал по нему с дикой яростью, а теперь двор Желтого Императора только сейчас собирает силы, чтобы вернуть его. \n Но всегда там была группа Дворов. И Маэдаэри не волнует, кто на это претендует. Именно она правит им по правде.\nНо теперь они угрожают ее дому. И этого она не потерпит. \n\nРожденная среди чжурчжэней, умершая и вернувшаяся из [Glossary('Какури','podgloss.kakuri')], Маэдаэри считалась странной среди дворов, поскольку она не присоединилась к двору Черной Черепахи, как многие ожидали, что это сделает женщина-кочевница. Скорее, она, казалось, жаждала более космополитичного Юга. \n\nНачав как воин против демонов, она стала предком равнин Хэбэй, развязки и ворот между двором Черной Черепахи и Желтого Императора. Но все же, несмотря на свою гражданскую натуру, она была, прежде всего, воином. \n\nСобрав своего [Glossary('ву','podgloss.wu')] среди других закаленных душ чжурчжэней, она превратила свой дом в порог. По правде говоря, она не верила в долгосрочное существование двора Черной Черепахи. Скорее, она ожидала, что в конечном итоге он перейдет к децентрализованному характеру. \n И, как ни странно, она, похоже, права. Пока «Повелитель Севера» Хунбена приказывает им сражаться, Маэдаэри ждет на флангах его импульсивных армий. \nОна ждет, когда придет время, используя свою добрую волю как предка, чтобы выиграть время. Она чего-то ждет. И врата вот-вот распахнутся.\n\nБудущая судьба\nСмерть Хунбена потрясает двор Желтого Императора до коллапса, но все, что он делает, это освобождает Маэдаэри.\nПока Ли бросает на смерть десятки [Glossary('ву','podgloss.wu')], Маэдаэри становится силой мудрости и силы в Северном У Желтого Императора двор и остатки двора Черной Черепахи. Когда приходит время, она возглавляет авангард против места упокоения Добрула, атакуя по принципу «все или ничего». \nХотя она погибает в начале битвы, ее движения успешно пробивают место упокоения Добрула, обеспечивая победу $pod_kueijin$ и возможное рождение Квинкункса."
 POD_persistentpodlore.desc.793381:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nКаждому провидцу нужна правая рука. И у ворот того, что многие $pod_kueijin$ считают армией [Glossary('Императора демонов','podgloss.demonemperor')], Вугунай удерживает эту линию для Маэдаэри. \n\nКогда-то Вугунай был всего лишь одним из многих бесчисленных чжурчжэньских наездников. Он жил и умер как один, жизнь без происшествий и без особого содержания. \nНо [Glossary('Ад шипастых цепей','podgloss.hellspikedchains')], казалось, затронул что-то в глубине его души. Его побег должен был привести его на юг, где он искал провидца из своего народа. Маэдаэри, воин, был тем, к кому он пришел, и стал ее первым учеником. И за это он стал ее доверенной рукой. \n\nВ их владениях Вугунай наблюдает за всеми, кто проходит через них. Эти двое, даже в пределах их [Glossary('ву','podgloss.wu')], являются заклятыми братьями и сестрами. \nМаэдаэри ясно дала понять, что за все, что с ним сделают, она отплатит вчетверо. И теперь, когда [Glossary('Анда','podgloss.anda')] приближаются, Ли становится все более импульсивным, а двор Черной Черепахи начинает погружаться в насилие, Вугунай подвергается испытанию. \nНо он не может потерпеть неудачу. Не тогда, когда он служит под началом своего лучшего друга. Он доведет ее дело до конца. \n\nБудущая судьба\nВугунай переживет крах двора Желтого Императора и позже нанесет удар по [Glossary('Анда','podgloss.anda')], но дорогой ценой. \nМаэдаэри, отдавшая свою жизнь ради победы, уничтожила его, и даже когда сформировался Квинкункс, он просто ждал у ее двора. В конце концов дыра в жизни стала слишком большой. Он попрощался со своим [Glossary('ву','podgloss.wu')], вышел на улицу и стал ждать, чтобы в последний раз увидеть утреннее солнце."
 POD_persistentpodlore.desc.793382:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nСреди двора Желтого Императора Север под Ли стал отключен даже от [Glossary('ву','podgloss.wu')] Янтарного крапивника. Но по этой причине могущественные предки Хэбэя имеют в своем распоряжении личного курьера. \n И в такое время, как нынешние ночи, быть курьером в таких разделенных и хаотичных землях часто является смертным приговором. Но у «Воинов Хэбэя» есть исключительный случай. И даже среди дампирских курьеров Янтарного крапивника Мутавута уважается превыше всего. \n\nA Чжурчжэньский курьер при жизни, Мутавута умер так же, как и многие курьеры: при доставке плохих новостей он был сварен заживо в гневе этим лордом. Но казнь дала ему собственное послание, которое он должен был передать, и что Ад не удержит его. \n И он передал его в крови лорду, который убил его. \n\n Позже, цивилизованный $pod_kueijin$, он стал учеником Маэдаэри, служа ее голосом даже без доступа к более широкому двору Желтого Императора. Мутавута стал совершенно превосходным посланником. \nИ теперь, по ее просьбе, он осторожно перемещается по Северному [Glossary('ву','podgloss.wu')], готовясь к объединению сил в надвигающемся шторме. По ее словам, конфронтация с [Glossary('Анда','podgloss.anda')] в Китае неизбежна. И они должны быть готовы. \n\nБудущая судьба\nМутавута позволит северным китайцам $pod_kueijin$ объединиться против [Glossary('Анда','podgloss.anda')], и его послания достигнут всех нужных ушей. \nОднако его навыки и репутация сделают его опасным, и со временем он будет убит среди Квинконксов, предположительно Дампиры, которые когда-то уважали его, их отец приказал устранить эту угрозу им."
 POD_persistentpodlore.desc.793383:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\n. Среди дворов Желтого Императора распространен стереотип, что все в степи - всадники. Хотя это действительно полезно, не все предпочитают сражаться верхом на лошади, а некоторые так же опасны, как пеший всадник. \n Среди воинов Хэбэя Мапо является доказательством этого утверждения. Зверь-человек с топором боится среди $pod_kueijin$ севера, его репутация и жажда разрушения предшествуют ему. \n\nНо в жизни его история была гораздо менее насыщенной событиями. Мапо, запасной сын наследника вождя чжурчжэней, был тихим, грузным и застенчивым ребенком. \nПоначалу он ненавидел драться и в основном боялся причинить вред другим. И даже будучи взрослым, он был довольно затворником и вместо этого управлял ресурсами. Но несчастный случай во время катания привел к смерти Мапо: он утонул в реке после удара по голове. А в Аду Кипящих Морей быть раздутым буем в течение, казалось, столетий было агонией, прежде чем $pod_kueijin$ спас его и привез на Маэдаэри для обучения. \n\nБоявшись снова стать слабым, Мапо начал сражаться, как рыба в воде. Его жажда битвы и средств к существованию росла, пока он не стал тем титаном, которым является сейчас. Часто он является силой во дворе Маэдаэри, тем, о ком люди думают, когда слышат о Воинах Хэбэя. \n\nБудущая Судьба\nМапо поедет с Маэдаэри, когда она начнет уничтожение [Glossary('Анда','podgloss.anda')]. Но, к его большому разочарованию, она потребовала, чтобы он остался и охранял их дома на случай, если она потерпит неудачу. \nКогда он услышал о ее смерти, он был опустошен, но боролся за сохранение ее наследия как одного из голосов-основателей Квинкункса."
 POD_persistentpodlore.desc.793384:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\n. Среди воинских дворов Хэбэя многие полагают, что они сталкиваются со всеми проблемами лицом к лицу. И правда, в их дворе все воины. Политическая ситуация, в которой они оказались, требует не меньшего. И это делает тех, кто умирает на небезопасных дорогах от одной удачно направленной стрелы, еще более трагичным. \n\nКонечно, свист издалека - это всего лишь ветер. \n\nСайн - загадка среди Воинов. Великолепно опытный лучник и сокольничий даже среди Воинов, он редко бывает на передовой. Скорее, он всегда находится в задней линии среди своих [Glossary('ву','podgloss.wu')], его хорошо расположенные специализированные стрелы уничтожают многочисленные угрозы, некоторые даже говорят, что они пропитаны ядом убийц Изумрудной Матери. \n\nНекоторые подозревают, что он, возможно, даже был их родственником при жизни. Но правда остается между ним и Маэдаэри. По правде говоря, он убийца, простой и незамысловатый. \nЛицо воина – удобное лицо. И в такие времена тонкая стрела является самой смертоносной. \n\nБудущая судьба\nНеизвестно, что случилось с Сэйном. Маэдаэри дал ему специальный приказ увести отряд смерти [Glossary('Анда','podgloss.anda')] из крепости своего хозяина. \nНо им так и не удалось найти его дух, поэтому предполагается, что он умер. Но, в конце концов, ему удалось отвлечь черных всадников [Glossary('Анда','podgloss.anda')] от вмешательства в гамбит Маэдаэри. Мапо уверен, что если он и умрет, то с улыбкой на лице и неповиновением на устах, зная, что им это удалось."
 POD_persistentpodlore.desc.793386:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nСреди $pod_kueijin$ Этидзэн немногие искусства пользуются таким же уважением, как создание гобелена сущности и жизни. Талисманы оставляют их владения в большом количестве. Смертные ремесленники находят великую работу и уважение среди своих членов, и в начале всего этого лежит ее основатель, Мудрец Жизни.\n\nКасуми родилась в период Аска, в семье кузнецов из провинции Ямато. Ее семья была относительно обеспеченной... по крайней мере, до принятия Кодекса Тайхо. Ее отец, несмотря на то, что он был уважаемой на местном уровне фигурой, не был благородного происхождения, и, таким образом, согласно новому указу, он был лишен своего влияния и признания, которые у него были.\nКакое-то время он сопротивлялся этому, но государство этого не желало. Когда столица была перенесена, он попытался перевезти свою семью в новую, чтобы продолжать настаивать на своем, но ссора с охранниками обострилась, и охранник ударил Касуми ножом в горло.\n\n[Glossary('Какури','podgloss.kakuri')] был ужасен для Касуми. Когда она сбежала, она обнаружила, что отчаянно ищет и цепляется за жизнь. Она не хотела ничего, кроме как жить, творить, формировать. Холод смерти пугал ее больше, чем кого-либо другого. В то время как большая часть ее клана будет благородными Журавлями или решительными Тенями, Касуми будет метаться из-за страха перед [Glossary('Какури','podgloss.kakuri')]. Она поддерживала связь с материком, формировала и создавала его, и вскоре вокруг нее собрались другие.\n\nВ своем искусственном танце она создала целый клан. А из-за ее интереса к посетителям холодокожий бунтарь покорил бы ее сердце. Неизвестно большинству, терпимость Этидзен к другим Кровопийцам в Японии была рождена не из практичности, а из любви.\n\nБудущая судьба\nКасуми будет развивать свой клан дальше, но ее время закончится. Во время подъема сёгуната Токугава, когда она танцевала со своим возлюбленным Ёсино, на нее устроили засаду убийцы [Glossary('Микабоши','podgloss.mikaboshi')].\n\nОна была поражена, но ее возлюбленный, зная страх Касуми перед окончательной смертью, помиловал ее. Касуми использовала свое мастерство формирования души и научила Ёшино совершить нечестивый поступок, когда Ёшино съела Касуми целиком, душу и все остальное, вырвав ей глаза и заменив их глазами Касуми, и, наконец, поглотив свои собственные глаза и забрав Касуми в себя.\n\nТаким образом, первый акт поедания Сородичем души $pod_kueijin$ был совершен не из жажды власти, а из любви. И новое существо придет, чтобы вести их род в новую ночь."
 POD_persistentpodlore.desc.793387:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью [Glossary('Мира Тьмы','game_concept_world_of_darkness_desc')].\n\nМитико из клана Сога, основательница [GetTrait('chibo').GetName(GetNullCharacter)], была дочерью Сога-но Эмиси. При жизни она стала свидетельницей падения своего клана во время инцидента Исси, и исчезла бы в неизвестности вместе со своей семьёй, если бы, спасаясь от инцидента с Исси, ночью не столкнулась с седовласой женщиной с налитыми кровью глазами. Женщиной была [GetScriptedCharacterByHistoryID('793303').GetFirstName].\n\nКагасё предложила ей выбор. Умереть в безвестности, на что она была обречена, или завершить дело своей семьи и работать, чтобы искоренить традиции Японии, оставаясь в тени. Митико, сердитая и злобствующая, согласилась. Кагасё обратила её и велела ей создать свою собственную линию потомства. Затем Митико основала Чибо из своей линии Великого клана.\n\nМитико очень серьёзно относится к своей роли старшей в Великом клане после Кагасё. Она является мастером Хоши-но-Рейки, второй после Кагасё, и её дети продолжают эту практику.\nМитико активно участвует в жизни клана и не приемлет ничего, кроме совершенства. И именно по этой причине она не может понять, почему Кагасё обратила [GetScriptedCharacterByHistoryID('793307').GetFirstName] и [GetScriptedCharacterByHistoryID('793306').GetFirstName]. Что касается Митико, то она - это всё, что было нужно Кагасё, а ненадёжность Ясу и упрямое рвение Ю опасны, когда им нужно прятаться и не сбиваться с пути.\nНо она знает, что её сир не послушает её, когда она будет молить об их смерти, поэтому вместо этого она ждёт и продолжает направлять своих мудрецов. Потому что она знает, что в своё время придёт время Ясу и Ю."
 POD_persistentpodlore.desc.793388:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nНесмотря на давние утверждения об обратном, двор Алого Феникса никогда не был единым. Нет, это было всего лишь заявление Даянанга. Речные земли всегда выступали против правления двора, и в авангарде различных дворов Шан, Карен и Мон стоял древний Предок Солина, почтенный мастер искусств огня.\n\nСолина – из далёкого прошлого пн. Солина родилась в городе Пегу вскоре после его основания и по большей части вела обычную жизнь, но случайный пожар на кухне оборвал ее, когда она погибла, когда ее дом рухнул в огне, и отправил ее в ад Пылающих морей.\nОднако, несмотря на это, Солина приняла свою смерть и вместо этого использовала смолу горящего моря как средство своего освобождения, выжигая пламя в своей душе и убегая обратно в мир как часть лесного пожара. Ее собрал [Glossary('цивилизатор демонов-младенцев','podgloss.infantdevilcivilizer')], но она всегда считала ее невероятно бесстрашной и упрямой душой для цивилизации. Гораздо менее озабоченная просвещением, вместо этого она заботилась о защите своего дома от внешнего влияния, возвращалась к месту своего рождения и играла важную роль в строительстве первых дворов Мон, которыми она правит по сей день.\n\nБудущая судьба\nУпрямое стремление Солины к независимости превратилось в ее великую войну. Хотя на короткое время она согласилась на умиротворение Пияу, она знала, что Пияу был близок к восхождению.\nКак только Пияу достиг [Glossary('Сотня облаков','podgloss.hundredclouds')], Солина немедленно возобновила войну против бирманцев, на этот раз в форме Предка Золотых Дворов Мандалая. Приход британцев предоставит ей возможность наконец воспользоваться преимуществом."
 POD_persistentpodlore.desc.793389:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\n. Обычно среди старейших предков $pod_kueijin$ предполагается, что, встав на двери спасения, они пересекают ее. Те, что остаются, являются редкими и чужеродными для сознания смертных и нежити. \n И все же, в офисе $pod_kueijin$ монастыря Шаолинь есть тот, кто долгое время стоял на этом перевале, но все же отказывается перейти его, служа светом в конце туннеля для претендентов. \n\nУцзи древний и не прославившийся ни при жизни, ни при смерти. Он даже не помнит, из какого ада он родом, и некоторые молодые претенденты шепчут, что он, возможно, даже был одним из первых Тысячи Бессмертных. Уцзи отговаривает их от этого, но, тем не менее, его пребывание на посту одного из высших авторитетов Пятикратного Пути с момента восхождения на Сюэ было центральной опорой власти двора Желтого Императора. Уцзи всегда пользовался вниманием ведущих предков каждого двора, и особенно внутри Китая, он всегда стоял рядом с двором Желтого Императора.\nИ даже сейчас, в эти смутные времена, он держит курс. Он делает это, потому что знает, что если он запаникует, то это запаникуют все. Поэтому он остается надежным маяком в этой буре хаоса. \n\nДальнейшая судьба\n Однако Уцзи может читать комнату. После убийства Ван Хунбэня и краха двора Желтого Императора возникший хаос стал настолько глубоким и ужасным, что Уцзи, видя все это, затем закрывается и поднимается в [Glossary('Сотня облаков','podgloss.hundredclouds')], навсегда оставив этот мир смертных позади."
 POD_persistentpodlore.desc.793390:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\n. В одном крыле монастырей Шаолинь, в самой высокой башне, он царапает достаточно высоко, что местные драконьи гнезда вызывают регулярный мягкий падающий снег. Обращенное на север, оно выглядит зловещим, поскольку Мудрец Любинг наблюдает за штормом, который, как он чувствует, может означать гибель Дворов. \n\nЛюбинг — второй по возрасту из Мудрецов Пятеричного Пути и самый загадочный из них. Современник Уцзи, он и Уцзи стояли бок о бок в молодости $pod_kueijin$, и Любинг даже свидетельствует, что Уцзи спас его от [Glossary('Какури','podgloss.kakuri')]. \n Однако, в отличие от многих, Любинг находил странное утешение на холоде и воспринимал холод зимы как знакомого друга и горнило мудрости. И, как и Уцзи, он остался, даже несмотря на то, что был полностью способен подняться дальше. \nС этой целью он проповедует и читает проповеди в основном о воздержании и благочестии, проявленных со стоической решимостью и тихим терпением. Он является образцом всего этого, и даже несмотря на то, что его проповеди едва громче шепота, многие ученики находят его методы чрезвычайно вдохновляющими. \nВ нем есть тьма, но она сделала его еще сильнее, а его учеников - гораздо более благородным. А в такие времена такой силы воли не хватает. \n\nБудущая судьба\nСнежный мудрец отреагирует на смерть Ван Хунбэня своей классической решительной волей. Когда Уцзи вознесся, Любинг просто привел их дела в порядок, подготовил других мудрецов, а затем удалился на свой балкон. А когда наступило утро, он ушел, отправившись со своим кровным братом в миры, лежащие за его пределами."
 POD_persistentpodlore.desc.793391:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\n. Для подавляющего большинства людей огонь — это ужасная вещь, которая обугливает и калечит, вещь, которая разрушает и забирает. Но среди Мудрецов Мудрец Хунцзянь непреклонен в том, что люди помнят, для чего также используется Огонь: для приготовления мяса, согревания на холоде, получения большего количества топлива и, в более скрытой степени, для обогащения земли, поскольку опаленные поля более плодородны, чем несгоревшие.\nВ этом его урок. Тот, который он узнал непосредственно в Тысяче Адов. \n\nЗемная жизнь Хунцзяня когда-то была жизнью пирата, но время, проведенное в Аду Пылающих Морей, преподало ему много тяжелых уроков. Оставив эту жизнь позади после своей смерти, он быстро был отмечен как гений Божественного Тела Пламени, а его собственная мудрость и проницательность обеспечили ему прочное место среди Пятикратных Мудрецов. \n\nОн разрушительен, но никогда не уничтожает. Скорее, он творит, чтобы позволить чему-то новому возникнуть, стать основой для других великих вещей. Его страсть легко заметна, так как в его проповедях он испытывает своих учеников, делая это в огне, стоя в огромной жаровне, чтобы показать им свою решимость. \nИ теперь, когда кажется, что весь мир горит, он быстро становится источником вдохновения и благочестия. \n\nБудущая судьба\nХунцзянь был потрясен смертью Ван Хунбэня, но после того, как он успел скорбеть и подготовиться к Уцзи и Любингу, он принял этот вызов лицом к лицу. \nМногие ожидали, что он преуспеет, но все резко обошлось, когда однажды, выполняя миссию по выродившейся низшей нежити Японии, один из них схватил его на костре и снес его ураганом кровавых молний."
 POD_persistentpodlore.desc.793392:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nТем, кто знает о Мудрецах Пятеричного Пути только по тому, как о них говорят другие, Ренюань кажется невозможным членом. Красивый молодой человек, которого часто можно увидеть бездельничающим в окружении своих дочерей, кормящих отборными кусками мяса и другими деликатесами и удовольствиями, он кажется олицетворением гедонизма, а не проницательности. И все же это тоже предположение.\nЧто касается Бьющихся Драконов, немногие воплощают это лучше, чем Ренюань.\n\nИзначально смертная жизнь Ренюаня была жизнью монаха, но эта жизнь ему никогда не помогала. Пребывание в аду, где с него содрали кожу заживо, сделало его странным образом... опьяненным ощущениями боли и переживаниями.\nНо после побега ему, казалось, больше хотелось быть просто телом, которое всегда разрывали на куски только для того, чтобы отшатнуться. Но учитель Кан Чо-лу рискнул и обнаружил, что его монашеское обучение не прошло даром. Ренюань записывал каждый опыт в мельчайших подробностях. Временами он был жадным, прожорливым и похотливым кретином, но он действительно искренне размышлял над жизненным опытом, прожитым в полной мере, с той же степенью критики и размышлений, что и Мудрец.\nТаким образом, он будет отправлен в качестве посланника к Пятикратным Мудрецам, которые фактически возвысятся до одного из них как Мудреца Бьющихся Драконов. А если быть более практичным, то его многочисленные дети-дампиры стали весьма опытными сотрудниками своего монастыря. Его сочинения станут ключевым предметом изучения для молодых драконов, если, конечно, они хотя бы смогут переносить запахи.\n\nБудущая судьба\nРенюань воспринял смерть Вана Хунбэня со странной степенью уверенности и прямых действий, не теряя времени, чтобы его род укрепил свои владения.\nОни пережили [Glossary('Анда','podgloss.anda')], и когда Квинконкс реформировался, Ренюань приложил все усилия, чтобы восстановить великие творения Мудрецов в их полном великолепии. Однако, когда «Долгая ночь» превратилась в «Современные ночи», он умер, как и жил, когда студент оказался убийцей и съел его в его репродуктивной постели до последнего куска плоти."
 POD_persistentpodlore.desc.793393:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\n. Среди четырех наиболее известных Мудрецов всегда есть упоминания о пятом, хотя его редко можно увидеть. Те, кто никогда не видел в них Дьявольского Тигра, выполняющего покровительство своего [Glossary('ву','podgloss.wu')], многие думают, что они - убийцы, которые редко учат своим путям других, если они того не достойны. \n\nНа самом деле, Пятый Мудрец чаще всего выполняет честную работу по цивилизации Младенца Дьявола. Поскольку они знают, что женщина Сяньбэй станет ходячим скандалом, Пусуван прячется из поля зрения, даже если она не менее равна остальным ее частям [Glossary('ву','podgloss.wu')].\n\nИщет диких демонов, чтобы цивилизоваться и пройти обучение, она редко произносит проповеди, потому что для нее медитация сама по себе является действием. Она не медитирует в комнате ради спасения, она делает это, спасая существа диких демонов от уничтожения или попадания в руки Королей Дьяволов. \nНевозможно достичь рая, сидя в комнате и ничего не делая, это достигается путем вырывания гнили в мире путем убийства [akuma|E]. Из своего офиса в монастыре Шаолинь Пусуван организует различные офисы Дьявольских Тигров для своей войны против Королей Дьяволов, будучи навсегда изменена [Glossary('Ад шипастых цепей','podgloss.hellspikedchains')] из ее смертной жизни в качестве жены забытого вождя Сяньбэя. \n\nЕе проповеди - это не проповедь, это миссии. Ее книги – это не пыльные тексты, это боевые руководства по борьбе с Оскверненными. Именно этому ее научил Ворон Без Теней. Именно этому она будет учить своих учеников. \n\nБудущая Судьба\nПусуван будет единственным из Мудрецов, дожившим до Нынешних Ночей. Защищая монастырь и организуя все больше и больше миссий, даже беспокойные Ночные Ночи не смогли ее сломить. Но теперь, когда [Glossary('Микабоши','podgloss.mikaboshi')] поднимается все выше и выше на этот трон, состояние мира ее сильно беспокоит. Поэтому она начала вкладывать средства в улучшение жизни смертных с помощью сетей социального обеспечения и поддержки, открывая новое поле битвы в своей вечной войне против Королей демонов."
 POD_persistentpodlore.desc.793394:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nСилиэ, родившаяся в качестве традиционного медицинского работника во времена Гаозу, смертная жизнь Сили была определена войной. Вынужденная пережить последствия смерти династии Синь и насилия периода Восемнадцати королевств, жизнь Силиэ была полна насилия. Все, что он хотел, это положить этому конец. \nОднако его жизнь была бы напрасной, поскольку в ходе войны он был лишь одним из многих, погибших в волне насилия. \n\nА на Ланке, осознав, что его судьба - это просто бесконечное насилие, это сломило его. Он бежал с готовностью и так быстро, как только могли его нести ноги, умоляя любого, кто послушает. И кто-то ответил спустя очень долгое время. Цян Ру, молодой, но хитрый дьявол, посчитал интеллект Сили полезным. \nИтак, он предложил ему сделку от имени... чего-то еще. Что бы это ни было, Ксили приняла это с готовностью и всем сердцем. Перенесенный в мир живых, тихий доктор трудится в тени над своим [Glossary('ву','podgloss.wu')], избегая внимания. \nТаково его желание. Такова была природа его сделки."
 POD_persistentpodlore.desc.793395:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\n Самый младший из Изумрудных Биров, Хемавати, выделяется больше всего. С самого края земель, где обитают $pod_kueijin$, в районе Кашмира родилась Хемавати, дочь далитов. Будучи ребенком, отправленная в изгнание в результате вторжения Газневидов, она была среди тех, кто был перемещен и отправлен в долгое изгнание в Европу. Но Хемавати умерла рано, погибнув прямо перед Стеной.\nИ за это преступление по какой-то извращенной шутке она оказалась на Ланке, где была проклята постоянно жить в качестве беженки среди насилия Города Демонов.\n\nХемавати всегда отчаянно пыталась сбежать. Готов сделать все возможное ради освобождения. И с этой целью она нашла человека, ищущего других, готовых сделать все возможное. Иностранец Цян Ру нашел отчаявшегося дьявола и предложил ей сделку. \n\nХемавати не обсуждает суть этой сделки. Но она взяла это. Ей нужна была свобода, она скучала по открытому небу. Она скучала по обществу, ей хотелось сбежать от постоянного насилия. И Цян Ру дал ей и это. \n\nС тех пор Хемавати была пророком Изумрудных Бирсов. Она гадает и трудится как рассказчица, вершительница судеб и предназначения ради Биров.\nКак она узнала об этом, неизвестно, но Мудрая Женщина не осмеливается сказать. Она не хочет подвергать опасности свою утраченную свободу."
 POD_persistentpodlore.desc.793396:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nQun, как и его сестра Юу, является устрашающей фигурой для тех, кто встречается с Цян Ру. Стоя рядом с ним, как перевернутая тень, Цюнь просто сердито смотрит на всех, кто молится во дворе. \nA ужас с скрытой злобой. \n\nВ жизни он был радикально другим. Цюнь и Юу были полуидентичными близнецами. И они оба просто хотели нормальной жизни. И все же для остальной части их деревни они были двумя причудливыми детьми, похожими на привидения, ненавидевшими солнце и были сверхъестественно близки, гораздо больше, чем должны быть брат и сестра. \nИ в конце концов, когда они стали взрослыми, когда они не проявили никакого стремления стать более нормальными, близнецов обвинили в колдовстве. Близнецы пытались это отрицать, но их собственная паническая боль и солнечные ожоги за альбинизм осудили их, поэтому оба были убиты.\n\nИ из-за мук своей смерти как ведьм они оказались в Аду Жалкой Магии. Поэтому оба близнеца прижались друг к другу, делая все возможное, чтобы пережить это. И когда Цян Ру обнаружил, что они предлагают сделку, они согласились. Легко и мгновенно.\n\nТеперь Кун доволен. Будучи телохранителем, он может вести со своей сестрой максимально приближенную к нормальной жизни. Даже будучи трупом, и какова бы ни была его сделка, теперь его, по крайней мере, можно уважать, ценить и беречь. \n И его преданность не пройдет ни с одним пятном на ней."
 POD_persistentpodlore.desc.793397:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nЮу, как и ее брат, представляет собой угрожающую фигуру для тех, кто встречается с Цян Ру. Стоя рядом с ним, как зеркальная тень, Юу просто смотрит на всех, кто приходит в его двор. \nA наказывает невысказанным наказанием тех, кто бросает ему вызов. \n\nВ жизни она была радикально другой. Юу и Цюнь были полуидентичными близнецами. И они оба просто хотели нормальной жизни. И все же для остальной части их деревни они были двумя причудливыми детьми, похожими на привидения, ненавидевшими солнце и были сверхъестественно близки, гораздо больше, чем должны быть брат и сестра. \nИ в конце концов, когда они стали взрослыми, когда они не проявили никакого стремления стать более нормальными, близнецов обвинили в колдовстве. Близнецы пытались это отрицать, но их собственная паническая боль и солнечные ожоги за альбинизм осудили их, поэтому оба были убиты.\n\nИ из-за мук своей смерти как ведьм они оказались в Аду Жалкой Магии. Поэтому оба близнеца прижались друг к другу, делая все возможное, чтобы пережить это. И когда Цян Ру обнаружил, что они предлагают сделку, они согласились. Легко и мгновенно.\n\nЮу с тех пор с готовностью и радостью стал Мастером Теневой Войны Цян Ру. Она наслаждается этим, имея власть и чувство сопричастности к войне и планированию. \nИ теперь со своим братом у нее есть все, что она когда-либо хотела в жизни. Пока Изумрудные Биры возвышают Нефритовый двор, она делает это, всегда скрывая из виду улыбку. И находясь внутри него, она с готовностью носит маску предполагаемой резни."
 POD_persistentpodlore.desc.793398:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nСреди Дворов Ночи существовал один [Glossary('ву','podgloss.wu')], занимавший совершенно уникальное положение, управляя руками силы смертных. Все эти [Glossary('ву','podgloss.wu')], Блаженные Ледяные Кинжалы, на самом деле происходят из двора Евнухов. И самым старшим среди них является тот, кто превзошел то, чем «он» когда-то был, и стал Богиней, поворачивающей руки государства. \n\nY'an когда-то был незначительным евнухом на службе империи Хань, но они совершили ошибку, родившись в худшее время для такого занятия. Хотя они поступили на службу молодыми, настолько, что у них никогда не отрастали бороды, они всегда были просто фигурой на заднем плане. \nНо когда другая группа евнухов начала захватывать власть, каскадная цепочка событий привела к тому, что подавляющее большинство из них были казнены, несмотря на то, что они даже не несли ответственности, включая Ианя, во время резни десяти слуг. \n\nИ когда они очнулись от смерти, они обнаружили сами превратились в сексуальных рабынь в Яме соли и железа. Но, несмотря на то, что многие сочли бы худшей судьбой, евнух почувствовал себя странно... освобожденным. \nПредставившись женщиной, они смогли убедить нескольких других порабощенных вступить в заговор и использовали это как трамплин для побега из ада. И когда [Glossary('цивилизатор демонов-младенцев','podgloss.infantdevilcivilizer')] попросили свое имя, Иан выбрала новое и приняла их предположения о ее женственности. \n\nИ'ан в течение своей не-жизни накапливала свою силу в структурах, которые она знала. Она никогда не удосужилась исцелить перенесенные изменения и приняла свою новую личность. \n\nБлаженные ледяные кинжалы станут главным мостом $pod_kueijin$ к политике смертных, выступая скрытыми спонсорами евнухов и используя их для своих экранов. Однако, поскольку Сун колеблется перед лицом ханского марша, Иань может потерять свои великие дела. \n\nБудущая судьба\nЙиан будет уничтожена монголами, но не ее влияние. Несмотря на упадок класса евнухов, Иань сменила свое положение среди секс-работников и стала мадам, прежде чем, после тысячелетий терпения и влияния, она поднялась до [Glossary('Сотня облаков','podgloss.hundredclouds')]."
 POD_persistentpodlore.desc.793399:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nЮаньхэн родился в семье этнических цян и в юности был мятежником. А затем, когда это не удалось, евнух в качестве наказания за его преступления. А затем, в зрелом возрасте, искусный слуга государства. А поскольку он умер от кишечной инфекции и вернулся из ада роющих личинок, Финансист Блаженных Ледяных Кинжалов.\n\nЖизнь Юаньхэна существовала в тени Северной Вэй. Его семья, рожденная в семье Цян, часто присоединялась к восставшим против них, а позже и он сам присоединился к ним.\n\nНо Юаньхэн был лишь одним из них, кого поймали и наказали кастрацией. Но в отличие от многих других повстанцев, Юаньхэн, похоже, отнесся к этому испытанию как к своего рода покаянию и изо всех сил старался служить государству, которое, по его мнению, по праву завоевало его.\nИ когда он умер, он бы смирился с этим, но последующую судьбу Ада он не мог вынести. Собрав столько особых личинок, сколько он мог вытерпеть, чтобы обменять на свою свободу, он в конце концов сбежал из Ада и затем стал цивилизованным среди $pod_kueijin$.\n\nВскоре после этого Юаньхэн попал на орбиту Ианя и Блаженного Ледяного Кинжала. Он умело обращался с монетами и довольно хорошо управлял их потоком, находя, что Торговые Дьявольские Тигры были для него огромным утешением.\nПрилежный и даже вспыльчивый, он неплохо справлялся с этим, несмотря на холодное пренебрежение к ближнему. И когда он начал пробираться в офисы евнухов Императрицы, он использовал эти вены власти, чтобы постоянно следить за политикой смертных, даже в такие хаотичные времена, как нынешние.\n\nБудущая судьба\nЮаньхэн воспринял разрушение Сун как послание и вместо этого направил накопленное богатство на коммерческие цели.\nНеутомимый капиталист, углубляющийся в [Glossary('дхармы','podgloss.dharma')], он продолжает перерабатывать свои деньги и по сей день, а его прошлое как Цян-евнуха Северной Вэй теперь почти забыто в его памяти."
 POD_persistentpodlore.desc.793400:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\n. Даже среди бывших евнухов Блаженных Ледяных Кинжалов, с точки зрения их смертных достижений, немногие из них могли превзойти то, что совершил Джиру. Евнух с мягким лицом, завоевавший внимание первого императора Хань, императора Гаозу.\nНесмотря на грубое поведение императора, элегантность и красота Дзиру покорили его и высоко возвысили. И когда Джиру умер, на короткое время он был доволен тем, что совершил. \n\nОднако для евнуха, который соблазнил и очаровал свой путь к власти, он был вознагражден Адом Кипящего Масла. Только предложив стать постельным рабом проходящего мимо ракшаса, он смог сбежать после столетий мучений, и этот опыт заставил его найти прикосновение женщины отвратительным.\nА когда он стал цивилизованным, он был просто в восторге от свободы и возможности разговаривать с другими. И благодаря своей харизме, заботе о других и готовности позволить прошлому остаться прошлым, он стал голосом [Glossary('ву','podgloss.wu')], который впоследствии стал Блаженными Ледяными Кинжалами.\nЭто будет место, в котором он преуспеет, как если бы его харизма могла завоевывать императоров, она наверняка могла бы победить и их смертных слуг.\n\nБудущее Fate\nДжиру с горечью будет смотреть на уничтожение Сун и их класса Евнухов, поскольку он искренне считал большинство смертных внутри себя друзьями. \nНо в конце концов он попытается двигаться дальше. Он будет двигаться в современные ночи, пытаясь все больше и больше улыбаться, прежде чем исчезнуть в безвестности как предок маленького городка в Сюйчжао, где он исчезнет из записей Квинкунса."
 POD_persistentpodlore.desc.793401:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nХотя Блаженные Ледяные Кинжалы известны своими талантами и связями в качестве контролеров Евнухов, некоторые смелые [akuma|E] полагают, что они беззащитны. К их большому разочарованию, один из них сломил огромное количество дьяволов. И все это без зрения.\n\nАньки, в отличие от многих евнухов, не был наказан как один и не занял позицию. Скорее всего, Аньки изначально был буддийским монахом, причем довольно набожным.\nОднако однажды, когда он выполнял свои обязанности, он почувствовал внезапную сильную боль в паху и проснулся от человека в форме змеи, брызгающего ядом ему в глаза. И все же, в этой внезапной панике, он сосредоточился и бросился на этого безоружного монстра и, несмотря ни на что, сразил его, прежде чем скончался от ран и оказался в Городе Демонов на Ланке.\n\nТам он все равно оказался изуродованным и слепым, но затем, восприняв это как испытание, вернулся к своим размышлениям. Несмотря на все усилия ракшасов, им не удалось заставить его прибегнуть к насилию. Так что, в конце концов, они просто дали ему свободу, выбросив этого упорного пацифиста из ада насилия.\nА затем, с некоторыми первоначальными предположениями [Glossary('цивилизатор демонов-младенцев','podgloss.infantdevilcivilizer')], они просто поместили его в число евнухов [Glossary('ву','podgloss.wu')], не заботясь о том, что он потерял свой «посох» из-за змееоборотня.\n\nРоль Анки в его [Glossary('ву','podgloss.wu')] — защитник. Когда-то он использовал боевые искусства как форму медитации, а теперь он чрезвычайно полезен для защиты своего [Glossary('ву','podgloss.wu')] от дьяволов.\nИ хотя он еще не убивает, только его Присутствие защищает их. И даже несмотря на свою слепоту, он представляет собой несравненный ужас, когда вынужден сражаться.\n\nБудущая судьба\nАнки в основном не беспокоила потеря основного средства власти его [Glossary('ву','podgloss.wu')]. Его размышления и обязанности перед ними имели приоритет.\nИ в конце концов, благодаря упорному сосредоточению внимания на своем [Glossary('дхармы','podgloss.dharma')], он поднялся до [Glossary('Сотня облаков','podgloss.hundredclouds')]."
 POD_persistentpodlore.desc.793402:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\n. Учитывая интенсивную и тесную связь Blissful Ice Daggers с культурой двора евнухов, можно было бы предположить, что они по большей части в значительной степени воздерживаются от всего, что касается «того, что они потеряли». Но для тех, кто общался с ним, Раннен ощущается как буря гнева и разочарования из-за того, чего у него больше нет. \n\nРаннен в жизни был дворцовым стражником, но очень редко выполнял свою работу. Серийный бабник и нераскаявшийся плейбой, Раннен регулярно развлекался и спал с наложницами. Однако он не был человеком изощренным, и в конце концов его разоблачили, приговорили к кастрации за свое преступление и отправили на службу евнухам. \n\n Для Рангненга эта судьба была настоящим адом, и в течение месяца он покончил с собой, чтобы избежать этого. Только для того, чтобы затем оказаться в аду соли и железа, где его новые мучители с удовольствием доводили его до еще большей ярости. И на протяжении веков он был там. \nПока, наконец, после слишком многих мучений, он не сломался и не вырвался наружу, крича о мире живых, и, наконец, не был пойман Блаженными Ледяными Кинжалами и приведен в свои ряды. \n\nРангненг - злой человек. Невероятно. Жестокий, похотливый, не имеющий выхода, человек, прославившийся своей злобой, он в основном наблюдает за более тонкими искусствами Блаженных Ледяных Кинжалов, давая ему возможность свести концы с концами и заглушить угрозы. \n И поскольку все больше и больше евнухов паникуют перед приближением монгольских войск, у него, по крайней мере, нет недостатка в гнев.\n\nДальнейшая судьба\nРангнена по большому счету не волновало, когда класс Сун Евнух был уничтожен. Скорее, как только он услышал, что $pod_kueijin$ в Юго-Восточной Азии открыл новые искусства плоти, он немедленно побежал за ними так быстро, как только мог, предстал перед их лидером и потребовал, чтобы они научили его, как восстановить свою мужественность. \nЕго история закончилась как очередной ужин для [Glossary('пенангаллан','podgloss.penangallan')] Вати."
 POD_persistentpodlore.desc.793403:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\n. На многих платных дорогах и контрольно-пропускных пунктах по всему Китаю есть странные фигуры, которые собирают различные «дворные налоги» и тому подобное. Платы за защиту и наказания для тех, кто ее не платит. Сбалансирован между ключевыми моментами, но недостаточно, чтобы привлечь внимание империи. \nРазбросаны повсюду и внутри, вымогая огромное количество монет. И по мере своего течения он попадает в руки мастера Серебряного Замка. \n\nXinfu всегда был одарён деньгами. И всегда столь же невероятно безжалостно. Будучи подростком, он организовал различные рэкеты, а затем стал домовладельцем. Когда его арендаторы могли платить больше, у него всегда были причины платить им это. Когда они терпели неудачу, его головорезы всегда были рядом, чтобы забрать деньги. \n\nЕго заботило только то, чтобы им заплатили за аренду. А когда они жаловались, что не могут позволить себе еду, он щедро предлагал им грязь. Излишне говорить, что, когда он умер от старости, он оказался в аду, где с него сняли шкуру заживо, лишённого всего и обнажённого. \nНо это его не поколебало. Он оторвал кусочки своей души, чтобы подкупить свой выход, где он вскоре вернулся в мир живых и сразу же вернулся к сбору ренты. \nИ на этой базе власти он основал Серебряный Замок [Glossary('ву','podgloss.wu')], главный финансовый [Glossary('ву','podgloss.wu')] двора Желтого Императора. Синьфу заплатил причитающееся и сделал это хорошо. И таким образом, без особых причин задавать ему вопросы, он предоставлен самому себе. \n\nБудущая судьба\nКончина Сун, несмотря на потрясения, не сильно нарушила Синьфу и его [Glossary('ву','podgloss.wu')]. Однако, хотя его [Glossary('ву','podgloss.wu')] был разбросан, он продолжал свою работу. \nОднако во время китайской коммунистической революции масса солдат пришла, чтобы убить его. И он умер, как и любой другой домовладелец, и с криком был отправлен на окончательную смерть."
 POD_persistentpodlore.desc.793404:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nУбежища Серебряного шлюза — одни из самых тяжелых и загруженных хранилищ в Китае. Столетия эксплуатации и сбора налогов сложно защитить, и тем не менее, Серебряный Замок по большей части устоял.\nИ в этом отношении они обязаны большей частью своего успеха Хуайчжэню.\n\nХуайчжэнь в своей земной жизни был простым деревенским стражником, но погиб во время набега чжурчжэней на Китай. В ужасе от [Glossary('Ад шипастых цепей','podgloss.hellspikedchains')], он тихо выжидал и в конце концов сбежал, выдав себя за охранника, прежде чем сбежать через врата в мир живых, где по велению Предков встретил своего будущего [Glossary('ву','podgloss.wu')].\n\nУчитывая его смертную жизнь, Хуайчжэнь был легким выбором для защиты своего богатства, и по мере того, как оно росло, ему приходилось поправляться. Организовывая их смертные экраны, координируя действия Дампира, а затем и более молодого $pod_kueijin$, он делал все это и даже больше, чтобы защитить их многочисленные тайные тайники и хранилища богатства и денег.\n\nБудущая судьба\nНесмотря на свой невероятный долгосрочный успех, Хуайчжэнь погиб из-за ошибки. Когда монгольский набег захватил один из тайников, Синьфу, к его большому шоку, пришел в ярость.\nВ замешательстве он попытался задать дополнительные вопросы, но Синьфу опрокинул жаровню и сжег Хуайчжэня заживо."
 POD_persistentpodlore.desc.793405:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nВажной частью «услуг» Silver Lock является защита. Вооруженная охрана караванов, дорожное патрулирование и другие средства контроля имеют основополагающее значение для их долгосрочного успеха.\nПо большей части это делается хорошо и с помощью невероятно структурированной системы с хорошо финансируемой защитой военного уровня, и все это финансируется Цзюйюанем.\n\nВ своей смертной жизни Цзюйюань был казначеем на сторожевом посту. Он всегда занимался управлением военными финансами, и делал это хорошо. Логистика была его сильной стороной, и даже при плохом финансировании он творил маленькие чудеса, умело используя цепочки поставок и добывая пищу.\nОднако такая роль сопряжена с опасностями, и в войне, о которой он давно забыл, он стал одним из многих жертв разграбления форта и одним из немногих, кто оказался на Ланке.\n\nОднако Цзюйюань почувствовал боль на ветру, и, пока их загоняли в загон, он воспользовался ошибками в их подсчетах и ускользнул обратно в мир живых. Собранный и цивилизованный, его подход к логистике позволил ему выбрать Серебряные Замки, и в этой роли он преуспел бы. И с этой целью его услуги сейчас важны как никогда, особенно по мере приближения [Glossary('Анда','podgloss.anda')] к Китаю.\n\nБудущая судьба\nПосле этого судьба Цзюйюаня продлилась недолго. Когда [Glossary('Анда','podgloss.anda')] стал более заметным, а китайская торговля содрогнулась от страха, Синьфу ответил на предупреждения Цзюйюаня о необходимости замедлиться, оторвав Цзуюаню челюсть и избив его, превратив его в мазок из мышц и мякоти."
 POD_persistentpodlore.desc.793406:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nДля мастера убийц быть незамеченным – благо. В тайниках и на базах Серебряного Замка есть люди, которые говорят о пятом члене, но мало кто их видит. По правде говоря, Фэнцзи просто не видит необходимости взаимодействовать с другими. В любом случае он ненавидит разговоры.\n\nФэнцзи злился всю свою жизнь. Рожденный невероятно низкого роста и высмеянный собственными родителями, он завидовал любви, которую получила его сестра. Он отчаянно этого хотел.\nИ все же, когда они выросли и она вышла замуж, его родители ужасно обращались с Фэнцзи, несмотря на то, что он был наследником. Никогда не женившись из-за неспособности найти жену, он стал очень ожесточенным и злым, регулярно набрасываясь на себя, закрываясь от себя.\n\nТакова была его жизнь: умереть старым, одиноким и нелюбимым, а затем проснуться в [Glossary('Какури','podgloss.kakuri')]. По крайней мере, ради него самого, его презрение к миру было настолько сильным, что даже неестественная красота [Glossary('шикоме','podgloss.shikome')] не могла разжечь его похоть. Поэтому вместо этого он поймал одну, заставил ее вывести его, а затем разрезал ее на куски и насильно скормил их другому несчастному дьяволу, прежде чем сбежать.\nИ за его гнев и хитрость Предки поместили его в Серебряный Замок [Glossary('ву','podgloss.wu')]. Теперь, по крайней мере, он имеет выход для своего гнева, организуя убийства и похищения врагов двора Желтого Императора и Серебряных Замков, впервые в жизни радуясь тому, что его хотя бы ценят и уважают.\n\nБудущая судьба\nВ отличие от своих современников, Фэнцзи преуспел во множестве целей, которые предоставило вторжение [Glossary('Анда','podgloss.anda')], и в своих услугах в качестве мастера шпионской сети в мире двора после Желтого Императора.\nИ со временем его трансцендентное понимание убийств позволит ему подняться в [Glossary('Сотня облаков','podgloss.hundredclouds')] путем Когтей."
 POD_persistentpodlore.desc.793407:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nГоворят, что война — это тигель для инноваций. Подобное наблюдалось в бесчисленных точках $pod_kueijin$, где столетия проходят, а ничего не происходит, и годы, где происходят столетия. И с этой целью во время войны они наняли бывшего инженера, чтобы тот помогал им управлять своими инвестициями.\n\nЧуджун с юных лет был довольно яркой, хотя и наивной душой. Искренне увлекаясь такими вещами, как математика и инженерное дело, он жаждал и дорожил инвестициями.\nОднако он умер молодым, став одним из многих, погибших на ранних этапах монгольских завоеваний. Но его пребывание в [Glossary('Ад шипастых цепей','podgloss.hellspikedchains')] было недолгим после массового побега заключенного.\n\nСбитый с толку и дезориентированный, его быстро нашли вместе с остальными, но еще быстрее завербовали в Серебряный Замок в поисках кого-нибудь, кто помог бы им решить, в какие проекты инвестировать. С этой целью он является молодым и серьезным мудрецом, надеющимся на то, что влечет за собой будущее.\n\nБудущая судьба\nЧуджун недолго будет $pod_kueijin$. Во время своего первого предприятия отсутствие понимания финансов заставило его вложить деньги в бесполезного кузнеца по пороху, что дорого обошлось Серебряному замку. Чуджун был наказан соответствующим образом: его заставили съесть столько пороха, сколько могло его наполнить, а затем подожгли."
 POD_persistentpodlore.desc.793408:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\n. В деревне, откуда родом Инмей, раздавались ужасающие слухи о Блуднице из разбитого стекла, серийной убийце, которая использовала битое стекло, чтобы сделать боль своих жертв настолько затяжной, насколько это возможно. В конце концов городская стража нашла единственную объединяющую нить: все жертвы отказались от внимания несовершеннолетней служанки. Когда они продолжили расследование, они обнаружили в ее доме бесчисленные хирургические инструменты и стеклянные панели. \nИнмей была вознаграждена, как она заслужила, и умерла от смеха. \n\nНо ад, когда с нее содрали кожу заживо, преподал Инмэй тяжелый урок. На протяжении столетий даже закоренелого серийного убийцу можно было заставить раскаяться. И когда совершенно случайно ее границы нарушились, когда она полностью смягчилась, она сбежала.\nИ нашла дорогу обратно в мир живых.\n\nЙингмей знает, что заслужила Ад. Она была монстром. Она была злодеем, ищущим внимания, который готов был убить ради того, чтобы ее игнорировали. Теперь, как основательница и лидер Вечного Льда [Glossary('ву','podgloss.wu')], она стала известным врачом, ищущим просветления посредством Исцеления. \nА в такие эпохи целителей всегда не хватает."
 POD_persistentpodlore.desc.793409:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nВ смутные времена миру не чужды бандиты. Хотя многие вынуждены это делать из-за отчаяния, немногие из них более гнусны, чем те, кто делает это ради удовольствия. Стремление к ограблению слабых. Удовольствие отбирать у слабых и быть сильным. И Ю'эр непреклонна в том, что она была одной из худших. \n\nЮ'эр, родившаяся в период Воюющих царств, жила в прекрасное время для бандитской деятельности. В детстве она ненавидела свою слабость и была хулиганкой. Когда ее взял к себе местный практикующий традиционные боевые искусства, чтобы попытаться закалить ее, Юэр затеяла длинную игру и вместо этого использовала ее как средство стать сильнее. \nКак только она смогла победить своих сокурсников, она убила их всех ночью, перерезала своему хозяину пятки и оставила его истекать кровью. Затем она встала на путь бандитизма и получила от этого огромное удовольствие. По крайней мере, пока она не была схвачена и казнена Цинь. И именно здесь началась ее новая история, когда она узнала, что сделала, когда стала жертвой на Ланке. \n\nЮ'эр смутна в памяти того времени, но она знала, что провела столетия на Ланке и в конечном итоге возненавидела смертную жизнь, которая забросила ее туда. Теперь она превратила свои боевые навыки в поиск просветления, нападая на бандитов в это время хаоса и сражаясь в Подземном мире, пытаясь освободить его от жестокости диктатора. \nОна знает, что может искупить свою вину только действием, поэтому она сражается сейчас. Ее путь к искуплению долог, но она обязательно пройдет его как можно лучше."
 POD_persistentpodlore.desc.793410:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\n Хотя считать действия завоевателя Пияу безумием - не редкость среди двора Желтого Императора, по большей части ученики Пияу мало обращают внимания на более консервативный центральный двор. Однако один критик смотрит глубже. Хватит жалить.\n\nХуитонг в своей смертной жизни имела бы все основания следовать их путем. Рожденная в нищете, с юных лет принуждаемая к секс-работе и с ужасным обращением, она во что бы то ни стало должна рассматривать путь Пияу как средство освобождения. \nИ все же Хуэйтун ясно понимает, что такая горечь превратила ее в ненавистную и пустую оболочку. Она травила без разбора, ненавидела всех, кого могла ударить, а временами хотела просто переломить ситуацию и создать новый вид ада. \n\nИ в Яме соли и железа она увидела правду. Мужчины вынуждены быть монстрами. Заставить мужчин отрицать свою человечность, превратить любовь в слабость, превратить нежность в фарс. Боль может быть разной, но утверждение [Glossary('пенангаллан','podgloss.penangallan')], что у мужчин нет ничего, кроме пользы, ошибочно и ложно. \n\nПоэтому она вместо этого выступает перед всеми. Голос Вечного Льда и самый жестокий критик, ее трактаты начинают вызывать волну, особенно среди Сородичей Звериных Дворов и людей, желающих быть мягкими и нежными. И по мере того, как влияние Вечного льда становится все сильнее, даже мороз потенциально может поглотить страстные цветы."
 POD_persistentpodlore.desc.793411:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\n. Среди $pod_kueijin$ довольно распространено то, что они совершают ужасные поступки или участвуют в делах великого зла, либо в качестве жертвы, либо в качестве актера. Конечно, они все попали в ад. Но, услышав о том, что сделал Фумихито, многие с трудом могли находиться рядом с ним. И только в Вечном льду он нашел тех, кто поверил, что он искренне желает искупления. \n\nВ своей смертной жизни Фумихито был ужасным ублюдком. Злой, враждебный и жестокий, вся деревня могла сказать, насколько мерзким он был, по звукам из его дома, доносившимся из его жены. Если что-то было несовершенным, он отвечал той же окровавленной тростью. \nА когда у нее родилась дочь, Фумихито был в такой ярости из-за того, что ему отказали в сыне, что утопил ребенка и запер жену в подвале, где она и погибла. По крайней мере, его смерть была столь же печальной, поскольку он умер один зимой, поскольку остальная часть его деревни отказалась приютить его из страха за то, что он может с ними сделать. \n\nИ он был вознагражден за свою жизнь [Glossary('Какури','podgloss.kakuri')]. И именно там он снова нашел свою жену, теперь уже как супруга [Glossary('шикоме','podgloss.shikome')] Повелителя [Glossary('Какури','podgloss.kakuri')], улыбаясь, держа в руках ту же окровавленную трость. \n\nКак долго Фумихито провел в [Glossary('Какури','podgloss.kakuri')], ему неизвестно, но когда двор Желтого Императора [Glossary('цивилизатор демонов-младенцев','podgloss.infantdevilcivilizer')] нашел его, он был бесчувственным развалиной, из которого выбита каждая унция жестокости. его.\nВо время допроса он был схвачен Вечным льдом, несмотря на протесты посетившего его [Glossary('пенангаллан','podgloss.penangallan')], который требовал, чтобы его убили. Но Вечный Лед не сдвинулся с места, требуя, чтобы дело, за которое они стояли, не требовало ничего меньшего. С тех пор \n\n Фумихито начал общаться с мертвыми, делая все возможное, чтобы разрешить их затянувшиеся сожаления и горе ради искупления. И каждый день его преследуют. И в эти трудные времена он знает, что будет испытан так, как заслуживает."
 POD_persistentpodlore.desc.793412:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nВо времена хаоса нередко происходит одна из самых худших сделок. Это продажа простого человека другим, использование хаоса войны для похищения наиболее уязвимых, чтобы забрать их из домов, заковать в железо и продать в неизвестные места, чтобы использовать их неизвестно для чего. \n И люди сделали сбор этого «товара» чрезвычайно богатым. И Бенли был одним из таких людей. \n\nБэнли сделал свою смертную карьеру в качестве спонсируемого государством сборщика рабов, регулярно возглавляя набеги на чужие земли и собирая «дикарей», которые были взяты в плен и пленников либо для работы в сфере движимого имущества, либо для другого сомнительного образа жизни, к которому могли быть принуждены рабы. \nБэнли, однако, понял, что захват взрослых может быть хлопотным, поэтому он специализировался на похищении детей и стал хорошим человеком. на этом. Некоторые клиенты хотели получить их за то, о чем он никогда не удосужился подвергнуть сомнению, и в конце концов начали похищать детей конкурентов, маркировать их и изуродовать, чтобы их невозможно было найти, и продавать. \n\nТакова была жизнь Бенли, пока одна разъяренная мать не нашла его, когда она узнала родинку на девушке с полным ожогом лица, когда она проходила мимо борделя, чтобы быть ее собственной дочерью. И Бенли был должным образом наказан за свои преступления в аду перевернутых грешников, колеблющегося между безумием и отчаянием. Его собственное «я» превратилось из холодного, жадного и тщеславного монстра в теплого, щедрого и переполненного смирением дьявола. \nНо он помнит, что сделал. Он не может этого забыть. Теперь он является тайным спонсором рабов, стремящихся вырваться на свободу, находя среди них союзников для своего [Glossary('ву','podgloss.wu')], чтобы у них были глаза и уши повсюду. \nБольшинство из них не знают, что тот мягкий и нежный человек, которым он сейчас является, в своей смертной жизни так жестоко их эксплуатировал. Но он хотел бы, чтобы это было именно так. Сейчас он любит себя гораздо больше, чем когда-либо, будучи ублюдком."
 POD_persistentpodlore.desc.793413:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\n \"I — Королева, собирательница сокровищ, самая вдумчивая, первая из тех, кто заслуживает поклонения. Так Боги утвердили меня во многих местах, во многих домах, куда я могу войти и обитать. \nЧерез Меня одного все едят пищу, которая их питает, – каждый человек, который видит, дышит, слышит произнесенное слово. Они этого не знают, но я живу в сути Вселенной. Слушайте, все до одного, истину, которую я провозглашаю. \"\n\nЭто то, чему учит Шодаши, что Нисшедшие будут отрицать, что отродья Сапатасуры будут мучить, и что возвышенные еретики Севера будут отрицать. \nСамоочевидный и сияющий свет богини, который они будут Deny.\n\nШодаши — старый для Голодных Мертвецов, современник Шивы-Ома. Но если Шива-Ом утверждает, что он сын лжецы Ситы, то Шодаши не отрицает, что она смертна. Она родилась в Бенгалии в семье смертных мужчины и женщины и прожила свою жизнь как обычный человек, едва набожный, слишком сосредоточенный на мире смертных. И для этого она была просветлена Адом.\nИ для ее мудрости ее вдохновила божественная сущность Махавидьи. Частица божественности. Шанс быть большим. Шанс стать больше. Шанс стать богами, ставшими праведными из-за ошибочного понимания морали. \n\nТаким образом, она взяла имя Трипура Сундари, то, что сделало ее целостной. И с тех пор, как она вернулась в мир живых, она проповедовала объединение Богини и объединение человечества. Ад разрушен. И ее руками это будет исправлено.\nНо лжи необходимо положить конец, грешники должны быть приведены к мудрости, а бесы, наводняющие центр мира, должны быть уничтожены. Отвергните двойственность и ограничения, поднимитесь над всем этим и будьте как боги, чтобы исправить мир. Такова ее причина. Такова будет ее воля."
 POD_persistentpodlore.desc.793414:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nС того момента, как семья Чэнь впервые вышла из Преисподней, она привлекла внимание и уши местных предков. Редко случалось, чтобы люди спасались из ада группами. Еще реже случается, когда люди одной семьи вообще избегают ада. Но семья, которая вместе сбежала из ада? Это совсем другое дело.\n\nСтаршая из братьев и сестер, Чэнь Мин была внешне холодна, но сохраняла свою огромную браваду и непоколебимую решимость. Обученные Сунь Ли, [Glossary('цивилизаторы демонов-младенцев','podgloss.infantdevilcivilizer')] изначально надеялись, что Минг станет генералом, как и ее наставник, но Мин была сварливым учеником.\nИспользуя любую возможность, чтобы бросить вызов ее учению, они поссорились. Тем не менее, Минг все еще была ученицей одного из лучших военных умов, и ее смелость вести свой [Glossary('ву','podgloss.wu')] не как Журавль, а как Сороконожку была небольшим скандалом, но умение Минг удерживать юго-западные регионы двора Желтого Императора от вторжения Равнос снискало ей большое уважение.\n\nНа данный момент она во многом является главой Суверенов Добродетели, но во многом силой воли. И в эти трудные времена эти семейные узы подвергнутся испытанию.\n\nБудущая судьба\nВ конце концов, после войны с [Glossary('Анда','podgloss.anda')], Мин осмелился на глупость. Видя успех в борьбе с [Glossary('Анда','podgloss.anda')], она попыталась возглавить аналогичную инициативу против кшатриев.\nИ даже будучи ученицей одного из лучших мастеров войны, она не была ее учителем и была сломлена мощью Чандрапутры."
 POD_persistentpodlore.desc.793415:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nС того момента, как семья Чэнь впервые вышла из Преисподней, она привлекла внимание и уши местных предков. Редко случалось, чтобы люди спасались из ада группами. Еще реже случается, когда люди одной семьи вообще избегают ада. Но семья, которая вместе сбежала из ада? Это совсем другое дело.\n\nВторой ребенок в семье, Цзян — представительная, но вдумчивая душа. Захотевший в своей земной жизни стать врачом, второе дыхание раскрыло в нем невероятный дар душевных искусств. Благодаря своему умению обращаться с монетами, он стал основой Суверенов Добродетели, финансируя их миссии и цели из их общего пристанища.\nНесмотря на то, что он не самый старший, его часто считают искренним. Поскольку он является эмоциональным ядром семьи, он направляет их и утешает своих братьев и сестер, когда они борются, напоминая им об их совместном бегстве из ада, чтобы подтолкнуть их дальше.\nИ ради этого он остается здесь, чтобы содержать свою семью.\n\nБудущая судьба\nУчитывая потенциальную угрозу, которую Суверены Добродетели представляли для каналов вторжения [Glossary('Анда','podgloss.anda')], они были особой целью. Когда он присматривал за новыми учениками, отряд убийц [Glossary('Анда','podgloss.anda')], известный как Черные Ветры, устроил на него засаду и на этом закончил его историю."
 POD_persistentpodlore.desc.793416:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nС того момента, как они впервые вышли из Ада, семья Чен привлекла внимание и уши местных предков. Редко случалось, чтобы люди спасались из ада группами. Еще реже случается, когда люди одной семьи вообще избегают ада. Но семья, которая вместе сбежала из ада? Это совсем другое дело. \n\nХуэй, средний ребенок, казалось, был этим очень доволен. Ученый, любивший науку и звезды, он также обладал острым умом в области химии и техники. Поскольку он был цивилизованным человеком, он, казалось, был поглощен подобными тайнами вселенной, прилежным до довольно сверхъестественной степени. \nДаже своим братьям и сестрам он редко покидает свою комнату в их убежище, оставляя своих братьев и сестер разбираться в его учебе и планах. Но когда они могут, они демонстрируют основополагающий блеск и проницательность, которые спасали их много раз. \nОднако, поскольку мир трясется вокруг них, Хуэй вскоре может быть вынужден принять меры в мире, который заставит его признать это. \n\nБудущая судьба\nСо смертью Цзяна Хуэй остался невероятно потерянным в этом мире. Он нашел ближайший [Glossary('ву','podgloss.wu')], о котором он видел в работах своих братьев и сестер, и отправился к Изумрудным Бирам. \nОднако эта близость позже проклянет его, поскольку, когда о них откроется ужасная правда, он умрет, как и многие другие в их дворе, став еще одним ужином для Пожирателя Дьяволов."
 POD_persistentpodlore.desc.793417:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nС того момента, как они впервые вышли из Ада, семья Чен привлекла внимание и уши местных предков. Редко случалось, чтобы люди спасались из ада группами. Еще реже случается, когда люди одной семьи вообще избегают ада. Но семья, которая вместе сбежала из ада? Это совсем другое дело. \n\nЧжихао среди своих братьев и сестер всегда был самым проблемным ребенком среди них. Второй по возрасту, он ответил на свой [Glossary('цивилизатор демонов-младенцев','podgloss.infantdevilcivilizer')] восстановлением здравомыслия, сломав им носы, ударив своего учителя в горло, а затем попытавшись выколоть глаза посещавшим его дампирам. \nС диким характером даже для Дьявольского Тигра, Чжихао бушует от одного предмета к другому со всей грацией лесного пожара, всей сдержанностью взрыва и всем смирением императора, которому есть что доказать. Его смелость, по крайней мере, делает его эффективным, но даже его свирепость может быть опасной. \nПо крайней мере, его братья и сестры могут указать ему на [Glossary('Анда','podgloss.anda')] на данный момент, но как только эта угроза исчезнет, ​​возникнут искренние опасения о том, смогут ли они руководить своим братом. \n\nБудущая судьба\nЧжихао умрет вскоре после того, как Цзян умрет. Когда ядро ​​их семьи исчезло, Чжихао бросился за своими убийцами, как одержимый зверь, в самое сердце территории [Glossary('Анда','podgloss.anda')], где он встретил свой предсказуемый конец."
 POD_persistentpodlore.desc.793418:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nС того момента, как они впервые вышли из Ада, семья Чен привлекла внимание и уши местных предков. Редко случалось, чтобы люди спасались из ада группами. Еще реже случается, когда люди одной семьи вообще избегают ада. Но семья, которая вместе сбежала из ада? Это совсем другое дело. \n\nYong, самая младшая из братьев и сестер, [Glossary('цивилизатор демонов-младенцев','podgloss.infantdevilcivilizer')] считала обувью для Бьющихся Драконов из-за ее красоты, но, к их удивлению, Юн не хотела иметь ничего общего со стремлениями к плоти или любви. \nКвинтэссенция ученицы Восьми Цветущих Лотосов, она, прежде всего, мудрец, духовный наставник и компас ее семьи.\n\nОна единственная, с кем все могут согласиться, кто может превратить вихрь эмоций, которыми они являются, в единое целое. И особенно сейчас, когда они доверяют ей свои тревоги и горести, когда [Glossary('Анда','podgloss.anda')] приближается и Китай горит, она подвергается испытаниям больше, чем когда-либо. Но она воспринимает это спокойно, насколько это возможно. \n\nДальнейшая судьба\nЙонг переживет всех своих братьев и сестер, но только ради чего-то гораздо более трагического. Йонг ненадолго отстаивала Квинконкс, но затем возвращалась к своим медитациям. \nНо в современные ночи она видела предзнаменования великой угрозы, марширующей армии демонов. Поэтому она пошла противостоять одноглазому дьяволу, который, как она видела, возглавлял его. Она просто приказала им отступить. Дьявол, ветеран Войны [Glossary('Анда','podgloss.anda')] и генерал Легиона Небес и Ада, не потерпел этого, и теперь Великая Предшеница Восьми Цветущих Лотосов попыталась сразить Генерала за ее наглость. Труп \n\nЁнг станет первым шагом на пути восхождения Ма Хай-Лана к власти."
 POD_persistentpodlore.desc.793419:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nСамый юный ученик Дьянанга стал чудесным лучом надежды для многих в нынешние времена упадка двора Алого Феникса. Несмотря на то, что Соккате был человеком матриархального двора, он принял Смеющуюся Радугу [Glossary('дхармы','podgloss.dharma')] с распростертыми объятиями и сделал ее своей собственной в рекордно короткие сроки.\nЕго сострадательное, любопытное и добродушное поведение делает его образцом учения Матери Тысячи Журавлей, основательницы этой философии. Это сделало его легким выбором для Даянанга для управления западными пределами Алого Феникса, поскольку он был уроженцем Бирмы.\n\nЕго пребывание на посту Предка было менее совершенным, чем его дхармическое образование, поскольку из-за его непринужденного характера более амбициозные региональные Предки ускользали из его рук. Тем не менее, для тех, кто больше заинтересован в изучении страстей Бьющихся Драконов, чем в политике, нет лучшего места, чем двор Соккате.\n\nБудущая судьба\nНе оказывая реального сопротивления завоеванию Пияу, Соккате будет предоставлен тот же выбор, который она давала каждому предку мужского пола. Он выберет отречение вместо предательства своего [Glossary('дхармы','podgloss.dharma')].\nУважая его репутацию (и его безоговорочную капитуляцию вместо кровавого сопротивления), Пияу позволит ему и его двору уйти невредимыми. Соккате больше никогда не увидят после того, как он в последний раз прошел через дверь своего дворца, хотя его последователи клянутся, что он вознесся на [Glossary('Сотня облаков','podgloss.hundredclouds')] в этот момент."
 POD_persistentpodlore.desc.793420:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nУзнав, что она станет ученицей восходящей звезды Алого двора, Соккате, Линлун была вне себя от радости. Она увидела прекрасную возможность быстро повысить свое положение, возможно, сама став Предком намного раньше своего времени. Она быстро отошла от этих представлений. Хотя Соккате, безусловно, прилежный и добрый учитель, он просто насмешка, когда дело доходит до политики. \nЛинлунь видела, как бирманский двор распадается на куски прямо у нее на глазах, и каждое ее предложение принять решительные меры игнорируется ее ленивым учителем. \n\n Разгневанная тем, что ее шансы на власть тратятся впустую, Линлунь стала единственным истинным голосом инакомыслия во дворе Соккате. Не то чтобы это много значит, поскольку упомянутый двор в основном состоит из ревностных учеников Дхармы, которые насмехаются над ее заботами \"baser\". \n\nБудущая судьба\nЛинлун не прольет слезы, когда ее учитель будет изгнан Пияу Пиюнгом. Фактически, она с радостью примет идеологию Страстных Кровавых Цветов, что побудит Пияу назначить ее Золотой Королевой Бирмы. \n Однако Линлун переоценила свои политические способности, и ей никогда не удастся полностью подчинить себе региональные суды. Хотя перенос ее центра власти в Мандалай в будущем будет разумным шагом, она будет ошеломлена приходом британцев и потеряет к этому моменту свой оставшийся политический капитал."
 POD_persistentpodlore.desc.793421:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nКогда Соккате впервые выбрал его в качестве ученика, Ванна не мог поверить своим ушам. Будучи застенчивым и скромным молодым $pod_kueijin$, все еще не оправившимся от времени, проведенного в Аду, он думал, что яркие и буйные Молящиеся Драконы [Glossary('дхармы','podgloss.dharma')] никогда ему не подойдут. \nОн был во многом прав... но не настолько, насколько он боялся. По правде говоря, он до сих пор не понимает, почему Соккате выбрал именно его, поскольку до сих пор очевидно, что этот [Glossary('дхармы','podgloss.dharma')] совсем не естественен для него. Однако прогресс достигнут, и он благодарен за то, что его вырвали из худших болей раннего опыта Дхармы. \n\n Помимо своего собственного просветления, Ванна стал неофициальным администратором двора своего учителя, поскольку сам Соккате не интересуется политикой. Хоть Ванна и рад, что ему есть чем заняться, он обеспокоен тем, что его усилия практически не приносят плодов, поскольку региональные суды становятся все более и более неуправляемыми. Однако, к его продолжающемуся удивлению, Соккате, похоже, совершенно не заботится о том, что Ванна фактически разрушает его владения до основания, несмотря на все его усилия. \n\nБудущая судьба\nПосле отречения Соккате Ванна подумает о том, чтобы остаться со своим товарищем-учеником (а теперь и королевой) Линлунь. Однако, посчитав, что она стала слишком экстремальной на его вкус, он вместо этого сосредоточится на своем [Glossary('дхармы','podgloss.dharma')] в течение следующих столетий. \nХотя он никогда не достигнет [Glossary('Сотня облаков','podgloss.hundredclouds')], он пойдет так далеко, что присоединится к уважаемому окружению Матери Тысячи Журавлей и будет учиться непосредственно у нее, чем, как надеюсь, Хочешь, Соккате мог бы гордиться."
 POD_persistentpodlore.desc.793422:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nНарасингха не был никем в своей земной жизни, даже он согласился бы на это. Он даже не уверен, почему оказался в [UmbraGlossaryLocalized('yomi_wan','ады Йоми')], ведь он совершал лишь мелкие кражи и никогда никого не убивал. Как бы то ни было, его незначительность была его силой. Стражи Йоми даже не зарегистрировали его, и, пока он не делал ничего глупого, они были рады оставить его в покое и сосредоточиться на более престижных заключенных.\nТаким образом, побег Нарасингхи прошел без происшествий, в отличие от героических рассказов некоторых других $pod_kueijin$. Однако его первые ночи возвращения были совсем не такими.\n\nНайденный слугами \"Богини\" Шодаши, Нарасингха внезапно узнал, что он сам был богом... и он не поверил ни единому слову этого. Однако он был слишком хитер, чтобы показать это, и играл роль нетерпеливого ученика. Он не уверен, поверил ли Шодаши в свой поступок, но его готовность слушать и подчиняться, по крайней мере, дала ему проходной балл.\nТеперь Нарасингха достаточно усвоил методы своего [Glossary('дхармы','podgloss.dharma')], чтобы управлять своим двором, полным подхалимов и слуг, стремящихся удовлетворить любую его прихоть.\n\nИтак, хотя его Дхармическое просветление в основном шунтируется, жизнь Нарасингхи никогда не была лучше. Хорошо быть богом."
 POD_persistentpodlore.desc.793423:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\n. Успех Faces of the Goddess [Glossary('дхармы','podgloss.dharma')] был шокирующим и неожиданным для многих предков. Несмотря на отделение от Небесного Племени и окружение врагами, многие удивятся, увидев, что философия Шодаши не сгорела и не превратилась в пламя. \nНо когда они смотрят глубже, они обнаруживают, что огонь, который горел в одной из ее учениц, был гораздо горячее, гораздо более диким. Тот, который, если его развязать, может стать лесным пожаром, который может поглотить как Дьявола, так и Богиню. \n\nОна вспоминает свою смертную жизнь в тумане гнева и разочарования. Ее время в Аду Соли и Железа было игрушкой, которая будет сражаться с пользователем ради развлечения пользователя, судьба унизительная и удручающая, но которая разжигала в ней огонь еще сильнее. \n Наконец, все вышло из-под контроля, и Бхайрави не могла больше этого терпеть. Ломая конечности, чтобы вырваться из цепей, сжимая челюсти в порошок, чтобы избежать криков, очищая себя, чтобы лишить их хватки, она бежала в вихре отчаяния и решимости. Она не будет сломлена. \nОна не может быть сломлена. И когда она бежала, видения и туманы самой красивой женщины проносились в ее измученном уме. \n\nИ когда она вернулась в мир живых, именно Шодаши нашел ее первым. И взял ее в качестве своей первой ученицы, поскольку Бхайрави явно дал ей искру божественности. \n Для рыжеволосого дьявола это имело смысл. Это сработало. И с этой целью она станет их яростью. Их гнев. Она будет Ликом Свирепой Богини Богини."
 POD_persistentpodlore.desc.793424:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\n. Несмотря на то, что Ли Цзюэ был человеком, который когда-то правил императором Китая, он стал простой исторической сноской, которую затмили гораздо более великие люди. Ожесточенный, амбициозный и жестокий военачальник, он не был очень удивлен, когда его позорная смерть отправила его в [Glossary('Ад шипастых цепей','podgloss.hellspikedchains')].\nКак второстепенная \"знаменитость\", Ли Цзюэ оказался частью \"Избранных\" и, по-видимому, был рад прислушаться к приказам [Glossary('повелителя Яма','podgloss.yamaking')] [Glossary('Дохор-хана','podgloss.dokhorkhan')]. По правде говоря, Ли Цзюэ по-прежнему воспринимал приказы так же плохо, как и в жизни, и поэтому использовал свое (относительное) престижное положение, чтобы сбежать. \n\nОтправленный во двор Черной Черепахи, чтобы научить его правильным обычаям $pod_kueijin$, Ли Цзюэ почти не слушал, рассматривая все это как еще одну форму политики, которая так давно стоила ему власти. В некотором смысле, эта политическая изоляция была его спасением. \n\nПоскольку влияние [Glossary('Дохор-хана','podgloss.dokhorkhan')] распространилось во дворе Черной Черепахи, Ли Цзюэ смог увидеть знаки и покинул двор после того, как на него было совершено покушение, поскольку [Glossary('повелителя Яма','podgloss.yamaking')] все еще затаил обиду на своего своенравного генерала. Отправляясь в самый отдаленный район, находящийся под (на бумаге) юрисдикцией двора, Ли Цзюэ был доволен тем, что игнорирует надвигающуюся бурю и живет самостоятельно. Все изменилось, когда пришел Сагечжи. \n\nУбегающая девчонка, нарисовавшая себе Ли Цзюэ как великую героическую фигуру, которая могла бы спасти двор, что-то возбудила в уставшем военачальнике. Не сострадание или долг как таковые, Ли Цзюэ давно забыл эти понятия, но, по крайней мере, чувство, что в нем может быть еще одна последняя война, которую стоит вести. \nЕсли это сможет заставить Сагечжи перестать приставать к нему и дать [Glossary('Дохор-хана','podgloss.dokhorkhan')] еще несколько причин злиться на него, то... почему бы и нет. \nПоскольку вокруг него собирается все больше и больше беженцев из Черных Черепах, Ли Цзюэ задается вопросом, сможет ли он на этот раз сделать это в На переднем плане книг по истории.\n\nБудущая судьба\nВ то время как именно Сагежи будет представлять двор Черной Черепахи при подписании договора Квинкункса, именно Ли Цзюэ нанесет самые решительные удары по силам и владениям [Glossary('Дохор-хана','podgloss.dokhorkhan')] в степях, ускорив падение [Glossary('повелителя Яма','podgloss.yamaking')] в 14 век.\nКогда Сагечжи вернется, чтобы сообщить хорошие новости, Ли Цзюэ нигде не будет. Хотя большинство полагает, что застрявший слуга [Glossary('Дохор-хана','podgloss.dokhorkhan')] наконец-то нашел свою цель, Сагежи будет цепляться за надежду, что старый ворчливый военачальник нашел свой собственный извилистый путь к [Glossary('Сотня облаков','podgloss.hundredclouds')]."
 POD_persistentpodlore.desc.793425:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nПоскольку влияние [Glossary('Дохор-хана','podgloss.dokhorkhan')] на двор Черной Черепахи росло, росла и его смелость. Больше не довольствуясь ожиданием, пока души мертвых прибудут в его царство, он начал посылать убийц, чтобы ускорить смерть особенно интересных личностей. Так было и с Сагежи.\n\nОпытный следопыт своего племени, она была убита во сне просто потому, что [Glossary('Дохор-хана','podgloss.dokhorkhan')] подумал, что одному из его адских племен нужно немного фаворитизма с таким дополнением. Чего [Glossary('повелителя Яма','podgloss.yamaking')] не учел, так это того, что трекер может быть сложно отследить даже в вашем собственном мире. Таким образом, Сагежи ждала, едва избегая обнаружения, пока не нашла выход и прыгнула в него. \n\nВозвращение на Землю не стало для Сагежи спасением. Будучи только что после [Glossary('Ад шипастых цепей','podgloss.hellspikedchains')], она легко могла видеть признаки того, что большая часть двора уже была в его плену. Именно тогда она услышала о Ли Цзюэ, по-видимому, известном диссиденте, который давным-давно покинул двор. \nИ хотя у него не было желания, чтобы его нашли, Сагежи все еще был очень хорошим следопытом. \n\nЕе первые встречи с военачальником были... антиклиматическими. Злой и ожесточенный старик, который угрожал наказать ее, \"дерзость\" был совсем не похож на то, что она слышала. Однако Сагежи упрям, и, по правде говоря, у него не было других вариантов, поскольку просто сдаться и позволить [Glossary('Дохор-хана','podgloss.dokhorkhan')] добиться своего никогда не думал. Так она упорствовала до тех пор, пока, в основном из-за явного раздражения, Ли Цзюэ не согласился подняться. \n\nСагэчжи теперь его заместитель, хотя, по правде говоря, она делает все, что не связано с прямыми военными делами. Ее общительный характер сделал ее фавориткой среди беженцев из Черных черепах, и она является связующим звеном между ними и своим невольным наставником. \n\nБудущая судьба\nХотя Ли Цзюэ будет военным умом, Сагечжи будет единственной причиной, по которой его маловероятная коалиция продержалась так долго. Таким образом, она была очевидным выбором для того, чтобы представлять их во время формирования Квинконкса, а после его исчезновения стать преемником военачальника. \nОна остается влиятельным степным предком и по сей день, хотя ее улыбка немного поблекла. \nОна должна признать, что скучает по старой козе."
 POD_persistentpodlore.desc.793426:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nСамый любимый ритуал Хана Дохора - \"Шипастые цепи\", где жертвы крепко связаны железными цепями Йоми и годами висят на сталактитах в огромной ветреной пещере. Борьба за побег только усугубляет агонию, и [Glossary('Дохор-хана','podgloss.dokhorkhan')] любит размещать небольшие файлы и отмычки вне досягаемости. Хотя он никогда этого не признавал, эта техника пыток на самом деле стоила [Glossary('Дохор-хана','podgloss.dokhorkhan')] одного заключенного. \nЯнгдай, явно неестественно гибкий молодой человек, обнаружил, что выдерживает воздействие шипастых цепей менее двух дней, прежде чем добрался до отмычки и сбежал. В ярости [Glossary('Дохор-хана','podgloss.dokhorkhan')] сделал убийство беглеца приоритетом своего [akuma|E] на несколько лет. \n\n Поскольку двор Черной Черепахи находился в сильном плену у [Glossary('повелителя Яма','podgloss.yamaking')], Яндай нашел очень мало убежища и возможностей для Дхармического просветления. Хотя он и подумывал о поездке на юг, он не подозревал, что его там может ожидать, поскольку, возможно, даже китайцы были в союзе с его мучителем. Таким образом, он отправился на север, уходя как можно дальше от цивилизации. \n\n Именно отсутствие Дхармической опеки вынудило Янгдая снова искать компании других $pod_kueijin$. К счастью для него, к этому моменту Всадники Серебряного Клинка Ли Цзюэ и Сагечжи начали обретать форму, и они были рады приветствовать еще одну жертву [Glossary('Дохор-хана','podgloss.dokhorkhan')]. \nВсе еще тихий и сдержанный, Яндай с нетерпением ждал более скрытных миссий, необходимых группе. На самом деле он один из немногих, кто подчиняется непосредственно Ли Цзюэ, а не Сагечжи, последний шутит, что весь разговор между ними чаще всего заканчивается не менее чем десятью словами. \n\nБудущая судьба\nЯнгдай выживет, чтобы увидеть падение [Glossary('Дохор-хана','podgloss.dokhorkhan')], оставив сломанную отмычку на одном из очищенных Драконьих Гнездов. Хотя после этого он по большей части исчезнет, ​​он все равно будет нечасто навещать Сагежи, иногда даже говоря более десяти слов."
 POD_persistentpodlore.desc.793427:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nБаохуоли не имел ничего общего с [Glossary('Дохор-хана','podgloss.dokhorkhan')] и теперь, возможно, стал его самым упорным врагом.\nБаохуоли родился и умер в сибирском племени охотников-собирателей. Он не был добрым человеком и поплатился за это, войдя в [UmbraGlossaryLocalized('yomi_wan','ад Йоми')] [Glossary('Тоу-Му','podgloss.toumu')] после своей смерти. К счастью для него, [Glossary('Тоу-Му','podgloss.toumu')] так близко к игровой площадке [Glossary('Дохор-хана','podgloss.dokhorkhan')] был очень слабым, и поэтому он смог убежать, прежде чем его официально поймали.\nЕго возвращение в качестве $pod_kueijin$ прошло без происшествий, как и небольшой сибирский двор, где он оказался, был маленьким и изоляционистским.\nПока [Glossary('Дохор-хана','podgloss.dokhorkhan')] не отправит свой первый \"Blessed\" [akuma|E] для полевых испытаний на этой слабой цели. Последовавшая резня оставила Баохуоли в живых.\n\nДо этого события Баохуоли был более холодным и бессердечным, но обнаружил, что жгучая ярость овладела им и решительно превратила его из Костяного Цветка в Дьявольского Тигра [Glossary('дхармы','podgloss.dharma')]. Затем он посетил большинство крупных судов Черных Черепах и обнаружил только пренебрежение, презрение или даже насилие, когда приводил доводы в пользу смелых нападок на [Glossary('Дохор-хана','podgloss.dokhorkhan')].\n\nИменно во время битвы с \"Blessed\" [akuma|E] Баохуоли был найден Всадниками Серебряного Клинка (и, даже если он этого не признает, был спасен в процессе). Хотя Сагечжи сопротивлялся, считая свой гнев саморазрушительным, Ли Цзюэ принял Баохуоли в свои ряды.\nОн стал грозным авангардом, всегда первым бросаясь в бой. Сагежи утверждает, что его саморазрушительное поведение и постоянные призывы к все более и более агрессивным действиям на самом деле являются скорее помехой для группы, чем благом. Однако это один из немногих случаев, когда Ли Цзюэ не слушает ее, очевидно, довольный тем, что разъяренный тигр указывает на трудные цели, к которым другие не посмеют приблизиться.\n\nБудущая судьба\nБаохуоли, к удивлению многих, действительно выжил и увидел падение [Glossary('Дохор-хана','podgloss.dokhorkhan')]. Однако он будет решительно выступать против присоединения к Квинконксу, поскольку считает, что южные суды мало чем помогли.\nПосле особенно сильного столкновения с Сагежи Баохуоли исчезнет. Новый неоспоримый лидер Всадников Серебряного Клинка безуспешно начнет расследование, хотя темный огонек в глазах Яндай заставит ее задуматься..."
 POD_persistentpodlore.desc.793428:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nМингган никогда не думала, что будет ездить вместе с группой закаленных всадников-ветеранов. Будучи начитанной дочерью мелкого чиновника Цзинь, ее больше всего беспокоил страх перед днем ​​свадьбы. Чего-то, чего так и не произошло, поскольку она была убита во время восстаний против Цзинь в 1127 году. \nМингган была совершенно не готова к Аду Шипованных Цепей и легко сломалась. Только сострадание других беглецов, забравших ее с собой, спасло ее. \n\nЕе знакомство с обществом $pod_kueijin$ стало для Мингган откровением, и она прочитала у Великих Мудрецов все, что смогла достать. Именно тогда она обнаружила, что двор, где она жила, по сути, выставлял напоказ большинство этих заповедей, и когда один из ее учителей сунул ей в руки книгу, которая, как она знала, была запрещена, она поняла. \n\nМингган взяла на себя инициативу, возможно, впервые в жизни, когда она услышала о намерении двора подавить находящееся неподалеку \"еретическое сопротивление\". Вскочив на первую попавшуюся лошадь, она выдвинулась вперед и предупредила Всадников Серебряного Клинка о предстоящем нападении. \nЭто предупреждение помогло Серебряному Клину устроить засаду и обеспечило ей место в группе. \n\nМингган быстро расцветает в своем новом окружении. В то время как их отсутствие приличия и презрение к дворовой политике огорчают ее, она учит их многим исторически значимым фактам и фактически служит наставником для многих дхармического просветления, поскольку она одна из немногих, кто обладает обширными знаниями о них. \nОна никогда не общалась с Ли Цзюэ, но Сагечжи сама становится верным другом и в некотором роде наставником для более практических знаний, которые дает Минган. отсутствует.\n\nБудущая судьба\nМингган будет вести хронику падения [Glossary('Дохор-хана','podgloss.dokhorkhan')] и станет одним из самых уважаемых учителей Степных дворов. Ее победа над многими представителями нового поколения будет способствовать сохранению Сагежи в качестве ведущей силы в эпоху после Черной черепахи в регионе."
 POD_persistentpodlore.desc.793429:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nМаойин никогда по-настоящему не чувствовала себя своей. Хотя это укрепило ее решимость и помогло ей избежать [UmbraGlossaryLocalized('yomi_wan','ады Йоми')], это означало, что ее Дхармическое просветление так и не укоренилось. Несмотря на то, что многие учителя пытались обучить эту явно опытную и преданную своему делу женщину, она никогда не чувствовала тяги к какому-то конкретному [Glossary('дхармы','podgloss.dharma')]. Она даже изучала некоторые неортодоксальные (хотя и проводила черту с инферналистскими), но безрезультатно. Затем пришел Шан Бо. \nПрилежный, хотя и строгий наставник Дьявольского Тигра, ему удалось сделать [Glossary('дхармы','podgloss.dharma')] действительно привлекательным для Маоина. Таким образом, она посвятила себя тому, чтобы стать лучшей ученицей. Благодаря своему более практичному характеру по сравнению с очень сосредоточенным на себе Шань Бо, она вскоре стала скорее помощницей, следя за тем, чтобы ее учитель мог обеспечить своих многочисленных учеников и не попадал в политические ловушки. Жизнь была хороша, пока Шань Бо не изменилась. \n\nОна не знала, что произошло на самом деле, но когда ее наставник начал критиковать самого [Glossary('Нефритового императора','podgloss.augustpersonageofjade')] и говорить о том, чтобы бросить ему вызов, она пришла в ужас. Однако никакие дебаты и мольбы не могли его поколебать, и вскоре она оказалась перед выбором. Боясь потерять единственное место, где она действительно чувствовала себя домом, она замолчала о своих опасениях и \" присоединилась к \" ереси своего учителя. \nМаоин теперь неохотно управляет растущим культом Шань Бо, надеясь найти выход, который сможет спасти ее собственную душу. \n\nБудущая судьба\nMaoying даже не попытается остановить Шань Бо, когда тот отправится в путь, чтобы бросить вызов Августейшей Личности. Когда он, как и ожидалось, никогда не вернется, она быстро распустит культ и вернется к своему собственному пути. \nОна станет чем-то вроде городской легенды для современных Предков, дрейфующим $pod_kueijin$, который так и не нашел [Glossary('дхармы','podgloss.dharma')] или двора, которому он мог бы принадлежать. Ее приезд куда-то будет воспринят как знак предстоящих неприятностей."
 POD_persistentpodlore.desc.793430:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nXingcheng при жизни был членом второстепенного культа. Ни в коем случае не являясь истинно верующим, он использовал эту относительную силу, чтобы добиться успеха любыми необходимыми средствами, пока его не обнаружил истинно верующий и с ним немедленно не расправились. Оказавшись в [Glossary('Города чудищ','podgloss.wickedcity')], Синчэн хорошо адаптировался, обманывая мусорщиков, чтобы улучшить собственную станцию. Однако [Glossary('Города чудищ','podgloss.wickedcity')] гораздо более устойчив, чем один мошенник может по-настоящему перехитрить, и Синчэн быстро понял, что он никогда не достигнет там власти и богатства, если ему не позволят. И поэтому вместо этого он использовал то, чего достиг, чтобы сбежать. \n\nВернувшись в мир смертных, Синчэн стал довольно ничем не примечательным $pod_kueijin$, вероятно, предназначенным для незначительной должности во дворе. Если он был достаточно опытен, чтобы обмануть некоторых жителей деревни и беженцев из [Glossary('Города чудищ','podgloss.wickedcity')], Синчэн был всего лишь ребенком по сравнению с укоренившимися Предками, и поэтому каждая его попытка заканчивалась только тем, что его унижали и наказывали. \nШань Бо вошел во двор в этот момент, сопровождаемый целой группой его учеников, готовых спорить о достоинствах его явно безумного учения. Синчэн распознал культ, когда увидел его, и тут же вступил в ряды. \n\nПоначалу для него это было обычным делом, и он быстро завоевал некоторое богатство и уважение со стороны более наивных учеников Шань Бо. Но потом что-то изменилось. Он начал по-настоящему слушать мастера, и его осенило. Вся его жизнь вела его к этому моменту, и Синчэну не терпится подняться на гору Меру, чтобы задать вопросы [Glossary('Нефритового императора','podgloss.augustpersonageofjade')] своему наставнику. \nКакое это будет зрелище! Он, скромный мошенник, наконец рассказал, что к чему самому могущественному существу Небес!\n\nБудущая судьба\nНа пути к горе Меру Синчэн будет казнен, когда его отправят обратить в свою веру предка Фу Хао и ее двор."
 POD_persistentpodlore.desc.793431:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nTooril мало что помнит о своей смертной жизни. Учитывая то, что произошло после, он думает, что это может быть к лучшему. \n Охваченный Гангрелом, который тщательно избил его, несмотря на то, что Турил был опытным бойцом, он никогда больше не видел своего [Glossary('сир','game_concept_Sire_desc')], будучи оставленным на произвол судьбы, как это было, как он узнал десятилетия спустя, обычаем среди Гангрелов. \nПо правде говоря, ему пришлось очень хорошо плохо.\n\nПотрясенный своим новым статусом вампира, Турил стал довольно близок к безмозглому зверю, прислушиваясь к своему внутреннему демону больше, чем следовало бы. Он стал местным монстром, убивавшим без разбора проходящие мимо племена и поселения, и, поскольку этот регион был настолько отдаленным, не было других ночных существ, которые могли бы его остановить. Турил опасается, что он мог бы уничтожить все население своего \"королевства\", если бы не прибытие [Glossary('Анда','podgloss.anda')]. \n\nХотя звероподобный Гангрел, безусловно, был сильным воином, он не мог сравниться с дисциплинированными и более контролирующими авангардом. Хотя его история могла бы закончиться на этом, уважаемый бывший шаман, а теперь наставник Виа Ясака, Кучугуден, остановил всадников, прежде чем они смогли убить Тоорила. \nПрошли месяцы (и множество битв за господство), прежде чем прогресс был достигнут, но он случился. Турил, обученный [Glossary('Анда','podgloss.anda')], постепенно восстановил контроль над собой и сумел сдержать своего Зверя. Хотя он, конечно, был очень благодарен за помощь, оставался еще один вопрос: цена. \n\nТоорила отправили обратно в его родную Гоби с поручением проверить слабые места в этом тылу двора Желтого Императора. \n Гангрел не дурак. Хотя они утверждают, что это почетная позиция, и она очевидна из-за его знания региона, Тоорил понимает, что он никогда по-настоящему не будет принадлежать Орде как не [Glossary('Анда','podgloss.anda')] и, следовательно, его можно использовать. \n Однако в конце концов для него это не имеет значения. Открытие Виа Ясак спасло его, и он намерен отплатить за этот дар честью, преданностью и рвением к Орде.\nДаже если он всегда будет чужаком, которому не доверяют."
 POD_persistentpodlore.desc.793432:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nХотя [Glossary('Анда','podgloss.anda')] привыкли к тому, что шаманы временами ведут себя странно, они все еще считают Кучугуден совершенно странным. Со своей стороны наставник отвечает, что он лишь следит за сменой настроений Тенгри, ласковый и очищающий дождь с утра может смениться разрушительной грозой ночью.\nОднако все согласны с тем, что он является одним из самых уважаемых наставников Виа Ясак и действует как странствующий учитель кочевника [Glossary('Анда','podgloss.anda')]. Хотя ему всегда будут рады, только истинно просвещенные (и терпеливые) сознательно обращаются к нему за советом. Чаще всего непослушные неонаты бросаются ему на пути в надежде, что его необычные методы обучения принесут результат, в то время как другие этого не сделали.\n\nУ Кучугудена нет кровного брата или собственного арбана (боевые силы [Glossary('Анда','podgloss.anda')]), и некоторые из его недоброжелателей восприняли это как означающее, что, хотя Кучугуден явно предан Ясаку, он, возможно, не так предан Орде [Glossary('Анда','podgloss.anda')] в целом.\nОни не так уж далеки от истины.\n\nКучугудену не нравится милитаристский путь Добрула и его преемников, выбранный [Glossary('Анда','podgloss.anda')]. Хотя он и не пацифист, он не видит никакой выгоды в противостоянии своим соседям. Не то чтобы они реально могли уничтожить всех Демонов Ся или $pod_cainites$. Таким образом, в лучшем случае [Glossary('Анда','podgloss.anda')] будут втянуты в очень длительные конфликты или в худшем случае будут истреблены своими многочисленными врагами.\nОтсутствие политического влияния делает его точку зрения спорной по большому счету, и он это знает. Таким образом, его усилия по обучению упрямых неонатов (или даже не [Glossary('Анда','podgloss.anda')]) обусловлены целью иметь как можно больше бывших учеников, которые, мы надеемся, послушают его, когда придет время.\nКучугуден не хочет предавать свой народ, поэтому он не уверен, что \"\" придет время, но он уверен, что Тенгри пошлет ему знак. Он просто надеется, что сможет увидеть это вовремя."
 POD_persistentpodlore.desc.793433:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nСарык был низшим представителем традиционной племенной аристократии Найман, когда они были сокрушены тогдашним Тэмуджином. Таким образом, он также был частью найманов, которые выбрали Джемугу, кровного брата Тэмуджина, в качестве \"универсального правителя\", чтобы противостоять ему. Джемуге было трудно создать прочную коалицию, чтобы противостоять своему бывшему брату, и многие из аристократов, из которых он вышел, в конечном итоге разочаровали его. Сарык был несколько лучше, поскольку имел, по крайней мере, хорошее представление о степной войне. К сожалению, это не имело большого значения, когда произошла Битва Тринадцати Сторон. \nПосле того, как Джемуга был разгромлен и, по-видимому, убит, Сарык, спасая свою жизнь, бежал к найманам Кара-Киданьского ханства. Несмотря на рост могущества своего племени в этом регионе, Сарык не добился большего, пока однажды ночью не попал в засаду. Сначала он опасался, что нападавший был человеком Тэмуджина, но был еще более шокирован, увидев Джемугу, по-видимому, все еще ходившего по Земле. Однако прежде чем он успел отреагировать, Сарык был мертв и переродился вампиром. \n\nДжемуге потребовалось время, чтобы проинструктировать своего первого ребенка в том немногом, что он знал о вампирах и причине [Glossary('Анда','podgloss.anda')], но для Сарыка это оказалось слишком много и слишком быстро. Все еще думая как смертный, найман увидел настоящую угрозу в Тэмуджине и не понял, когда увидел, что Джемугха не держит на него зла. Каждое его предложение помешать восхождению Чингисхана вызывало насмешки или презрение со стороны [Glossary('Анда','podgloss.anda')], и Сарык становился все более ожесточенным и изолированным. \n\nВ настоящее время Великий Хан наконец мертв, но стал легендой как для монголов, так и для [Glossary('Анда','podgloss.anda')]. Поскольку Сарык все еще не держит свои мысли по этому поводу при себе, его в конечном итоге отправили в Гоби, чтобы \" присматривал\" за Гангрелами Тоорилами. Хотя Сарык, очевидно, всего лишь изгнанник, не называющий своего имени, он, по крайней мере, удовлетворен тем, что больше не находится среди людей, поклоняющихся его одностороннему врагу. \nПо мере того, как его настроение улучшается, он может подумать о том, чтобы даже приложить усилия и помочь спланировать нападение на двор Желтого Императора с тыла."
 POD_persistentpodlore.desc.793434:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nИбаха был общительным и энергичным ребенком из племени, бродившего по Гоби. Хотя она всегда считала это место своим домом, ее мать скончалась, истории о ее собственной матери, которая, очевидно, происходила из совершенно другого племени, уничтоженного ужасным монстром. Ибаха внимательно слушал, но в конечном итоге не обратил на это внимания, как и большинство детей. Только когда она выросла в молодую женщину, она больше задавалась этой историей. \n\nУ Ибахи возникло тревожное ощущение, что за ней наблюдает невидимое Присутствие. Хотя это происходило не постоянно, но случалось достаточно, чтобы выбить ее из колеи. Разговоры с другими членами племени принесли ей лишь грубые опровержения, большинство из которых не хотели потенциально навлекать на себя гнев монстра. \n\nЗатем, однажды, ее племя проиграло стычку с другим, и она была схвачена вместе со многими мирными жителями. Не успела она подвергнуться избиению со стороны похитителей, как вихрь клыков и когтей разорвал их на части и освободил ее. \nЕе спасителем был мужчина грубого вида, который не отвечал на большинство ее вопросов. \n\nС тех пор прошло время, и Ибаха узнала (с трудом) кое-что о Тоориле. Он выходит только ночью, яростно защищает ее по неизвестной причине (хотя она начинает разгадывать загадку), а его кровь обладает магическими свойствами. Когда она заболела, это вылечило ее быстрее, чем любые шаманские отвары. \n\n Однако времена меняются, и Турил больше не может держать Ибаху вне досягаемости. Он объяснил, что другие, подобные ему, приезжают в Гоби и что он должен готовиться к войне. \nИбаха знает, что, если бы она подтолкнула еще немного, он, скорее всего, ответил бы на ее вопросы о том, кто он, что он такое и что происходит. \n\n Дело в том, что она не уверена, что ей понравятся его ответы."
 POD_persistentpodlore.desc.793435:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nПо сравнению с большей частью остального ночного мира Вьетнам — зона военных действий. Падение двора Алого Феникса позволило южным военачальникам Голодных мертвецов из Индонезии и Малайзии, а также северным приспешникам китайских дворов обратить жадные взоры на чужие земли. Фунг Тхи Тинь не намерена терпеть такое оскорбление.\n\nТинь родилась много веков назад, когда Вьетнам страдал от произвола местного наместника. Под предводительством сестёр Чынг многие воины, мужчины и женщины, поднялись на борьбу с имперскими надсмотрщиками. Тинь поддержала восстание и прославилась как необыкновенно одарённая, неудержимая воительница. Она даже родила прямо на поле боя и продолжила сражаться с новорождённым на руках.\nОднако, сколь бы праведным ни было их дело, полководец Ма Юань разгромил восстание. Несмотря на храбрость и силу воли, Тинь погибла вместе со многими другими пленниками.\n\nНо Тинь не позволила истории своего народа закончиться на этом. Смерть научила её опасности безрассудной дерзости. На Ланке она стала незримой тенью и такой же незаметной оставалась во время побега.\nВернувшись в мир живых, она недолго училась у того, кто мог её понять, а затем возвратилась во Вьетнам. Именно тогда многие предки, назначенные Дянангом, встретили бесславную смерть, чиновники Ван Хунбэня — кровавый конец, а скандальные дочери Пияу исполнили свой последний танец.\nНаконец, когда двор Алого Феникса начал рушиться, Тинь вышла из тени и объявила себя предком, выступающим за свой народ и страну, за которую она некогда сражалась.\n\nДальнейшая судьба\nНесмотря на столь дерзкое появление, Тинь держала свои политические планы при себе и внимательно следила за происходящим вокруг. Когда стало ясно, что завоевания Пияу невозможно остановить, она договорилась помогать в охоте на [akuma|E] в обмен на беспрецедентную местную автономию.\nВ современные ночи созданные ею Золотые дворы Вьетнама будут процветать там, где другие не выдержали испытания временем."
 POD_persistentpodlore.desc.793436:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nОнг привык жить между двумя мирами. Дочь китайского торговца и дочь корейского торговца, она с детства привыкла выделяться.\nНо она нашла призвание. В море она чувствовала себя как дома. Качание кораблей, шероховатость перил, ветер в лицо, запах соли — все это заставляло ее чувствовать себя как дома. Даже ее муж женился ради того, чтобы она не потеряла свой дом. И даже вступив в позднюю взрослую жизнь, ее, по крайней мере, можно было считать в некоторой степени счастливой. \n\nПо крайней мере, до того, как это было у нее отнято. \n\nОнг имел несчастье стать целью объятий Ласомбра. Вера неудач, ведущая к торговому каравану ее мужа, ведущему к пиратам, ее дома разграблены бандитами, а все, что она построила, уничтожено в огне, она изо всех сил старалась удержать свою предсмертную мечту. И когда ее последний корабль затонул, она решила пойти ко дну вместе с ним.\nИ именно тогда Хафиз подошел к ней и предложил восстановить все это, если она решит стать вампиром. Онг, просто желая снова плыть по морю, согласился. А потом она узнала, что Хафиз был архитектором всей ее боли и что теперь он хочет, чтобы она поклонялась чужому богу.\nОна замышляет свою свободу, свое возвращение к морю. Ее гордость не требует меньшего. \n\nБудущая судьба\nОнг и Хафиз часто и почти постоянно ссорились. Она отказалась присоединиться к Аширре и ускользнула со своим собственным торговым флотом, чтобы построить новый, даже присоединившись к Камарилье, когда она прибыла в Восточную Азию, чтобы назло ее сиру.\nНесмотря на доминирование $pod_kueijin$ в городе, она провозгласила себя «принцем» Сингапура, пренебрегая своим сиром, организовав построенную ею команду в небольшое владение в Сингапуре, чтобы лишить Аширра доступа к портам."
 POD_persistentpodlore.desc.793437:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nЮдао — последний в длинной череде Предков, отправленных из двора Желтого Императора, чтобы убедиться, что приграничный регион Вьетнама не попадет в руки двора Алого Феникса. В отличие от своих предшественников, он на самом деле весьма преуспел в этом начинании. \n\nЕго секрет прост: он не политически настроенный человек. Довольный проповедью вьетнам более традиционного пятикратного [Glossary('дхармы','podgloss.dharma')], он не предпринял никаких шагов, чтобы расширить свое влияние, несмотря на то, что вьетнамский двор, объединившийся с Алым Фениксом, рухнул сам по себе. Его единственная политика в отношении этого события заключалась в том, чтобы приветствовать беженцев из [akuma|E], вторгающихся на юг. Более воинственные фракции двора Желтого Императора недовольны этим и требуют от Юдао быть более агрессивным или столкнуться с его отзывом в Чанган. Юдао, со своей стороны, подозревает, что эта поза не будет иметь значения надолго. \n\nБудущая судьба\nКогда двор Желтого Императора рухнет, Юдао увидит надпись на стене. Просто собрав свои вещи и отправившись во все еще стабильный Костяной двор, он откажется от любых политических амбиций и посвятит свое время изучению своего [Glossary('дхармы','podgloss.dharma')].\n. Это сделает его на удивление любимой и уважаемой фигурой для вьетнамцев $pod_kueijin$, которые часто будут навещать его по научным вопросам. Несмотря на то, что многие предки подталкивали его стать дипломатом между китайским и вьетнамским дворами, Юдао всегда отказывался."
 POD_persistentpodlore.desc.793438:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nЛуонг Трак родился в последние годы династии Ли и был одной из жертв завоевания Вьетнама китайцами Суй. Брошенный на Ланку, Луонг Трак возродился в огне этого воинственного царства. Развивая свой скрытый талант к кровопролитию, она стала уважаемой среди Ракша как достойная пленница и потенциальная [akuma|E] для их господина Раваны. Однако, похоже, этого не произошло, поскольку Луонг пробилась из Йоми после нескольких изнурительных десятилетий войны. \n\nПоявившись как $pod_kueijin$, Луонг пришла в ярость, увидев Вьетнам под пятой дворового лакея Желтого Императора. Избегая своего Дхармического просветления, она возглавила отряд единомышленников $pod_kueijin$, чтобы завоевать свое родное царство при поддержке двора Алого Феникса. После нескольких десятилетий конфликта Луонг в основном добилась успеха, начав свое правление в качестве Алого Предка Вьетнама. \nПришло время ей сосредоточиться на своем Дхармическом просветлении, что оказалось более сложной задачей. Отказываясь брать учителей, поскольку она считала себя Предком выше этого, она попыталась подражать агрессивной философии Страстных Кровавых Цветов, которая начала штурмовать Юго-Восточную Азию. \nОднако это было тщетно, Луонг путала бессмысленное насилие и разрушение с освобождением. Клеймо очень низкого Предка [Glossary('дхармы','podgloss.dharma')] имело последствия для ее двора, поскольку многие оставили ее после окончания конфликта во Вьетнаме. \nПочувствовав слабость, двор Желтого Императора вернул себе большую часть своих утраченных земель, а другие региональные Предки провозгласили независимость. Поскольку ее Дхармический крах хорошо известен, Луонг потеряла свой политический капитал и не может собрать силы, которые когда-то могла. \n\nПоскольку вокруг нее все рушится, Луонг наконец нашла выход. Если война была единственным, в чем она была хороша, возможно, пришло время перенести в этот мир царство вечной войны, в котором она так процветала... \n\nБудущая судьба\nОбетование Луонга Раване какое-то время будет серьезной угрозой для региона. Недолговечный союз между Фонг Тхи Чином и Куен Вьеном свергнет ее, и силы Пияу будут охотиться за ее оставшимися сторонниками. \n Воспоминания о ее кровавом правлении будут фактором, позволяющим сохранить политику $pod_kueijin$ во Вьетнаме более сдержанной, чем у остальных Золотых Дворов."
 POD_persistentpodlore.desc.793439:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\n. Живя во время бурной Анархии эпохи 12 Warlords, Куен Вьен рассказала множество историй о легендарных личностях, таких как леди Триу и сестры Транг, в надежде, что она станет той самой эпохой. Этого не произошло, поскольку ее будущего военного начальника больше интересовала ее женская привлекательность, чем ее пылкий дух. Брошенная на Ланку, Куиен обнаружила, что у нее действительно есть талант к бою, но все же стремилась найти стоящую за ним достойную причину. Поэтому она сбежала, как только представилась такая возможность. \n\nКогда она встретила Луонг Трака, Куен был в восторге. Эта женщина с таким же прошлым, как и она, добилась очень многого, казалось бы, освободив Вьетнам от китайского $pod_kueijin$. Упрямо отстаивая свою позицию, ей удалось стать ее ученицей. \n\n Правда вскоре оказалась не столь совершенной, как надеялся Куен. Луонг была очень плохим учителем, поскольку ей самой не хватало дхармического просветления. Не имея реальных обязанностей во дворе, Куен просто решила уйти и поискать ответы сама. \nИменно тогда она встретила Пхунг Тхи Чиня, настоящего героя своих детских рассказов. Однако ее [Glossary('дхармы','podgloss.dharma')] показался Куиену чуждым, и поэтому их пути быстро, хотя и дружески, расстались. Лишь с появлением Кровавых Цветов Страсти Куиен по-настоящему нашел свой путь. Достигнув своих первых успехов, она с волнением вернулась к своему первому наставнику Луонгу, чтобы поделиться хорошими новостями. То, что она обнаружила, привело ее в ужас. \n\nКуиен, таким образом, была первой, кто обвинил Луонга в том, что она [akuma|E], и сплотил на свою сторону других заинтересованных придворных. С помощью Фонг Тхи Чин Куен готова дать бой своему павшему наставнику и стать главным героем своей собственной легенды. \n\nБудущая судьба\nХотя Куен и Фонг Тхи Чин одержат победу, их отношения испортятся, поскольку Куен будет тесно связан с Золотым Пияу Суды.\nВойны между ними не вспыхнет, но Вьетнам какое-то время останется разделенным между двумя конкурирующими дворами. \nПрибытие французов в 19 веке серьезно подорвет базу власти Куена в южном Вьетнаме, вплоть до ее уничтожения от рук $pod_cainite$ принца Манилы."
 POD_persistentpodlore.desc.793440:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nИсагани, сын дочери китайского торговца и филиппинского рыбака, провел свою юность во время бума торговли династии Сун на Филиппинах. А затем однажды ночью во время плавания, увидев отражение в воде, он был быстро убит одним из филиппинских каинитов и брошен в Ад Кипящих Морей. \nИ именно тогда его дедушка и бабушка проявили себя, корабль $pod_kueijin$, брошенный в ад и обнаруживший Исагани, сына дампира, культивируемого с рождения до lead.\n\nИсагани был глубоко сбит с толку и дезориентирован своей быстрой смертью, спуском в ад, а затем спасением, которое казалось неясным. Но его выбрали не просто так. Аккуратный, преданный, общительный, умный и красивый благодаря целенаправленному развитию своих родителей, можно сказать, что его единственным недостатком будет его постоянный страх перед глубинами и угрозами вокруг него. \nИтак, его учитель обучил его руководить недавно созданным двором Фиолетового Коралла, поставил его во главе как своего самого опытного ученика, а затем приступил к изучению дхармы. \n\nИсагани идет по канату. За границей более высокие требования двора Желтого Императора к своему двору и более широкая угроза того, что Пияу дышит ему в спину, мало что сделали для облегчения его паранойи. \n И еще больше усложняет ситуацию та часть из них, которая влюбилась в красивого, опасного и дикого зверя, который убил его, и теперь участвует либо в диких битвах, либо в страстных совокуплениях с прародителем рода, который является его врагом. \n\nWas прав ли его наставник, подготавливая его к этому? Или он потерпит неудачу, потому что, несмотря на все свои преимущества, ему не хватало воли к процветанию? \n\nБудущая судьба\nИсагани сумел бы удержаться, но не процветать. Крах двора Желтого Императора действительно дает ему время, а умные отвлечения Ань в Золотые Дворы Пияу дают ему отсрочку, но окопы Ань почти невозможно вырвать с корнем. \nНо когда новая линия угрожает им обоим, у Исагани и Нгаи теперь может наконец появиться политическая причина закопать свой топор и столкнуться с растущей угрозой со стороны Хари на земле, которую оба считают своим домом."
 POD_persistentpodlore.desc.793441:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nХотя в Августейших Дворах много места и им нужен Дампир, иногда кто-то может быть слишком безрассудным, создавая их, что завеса между Ночным и Дневным мирами размывается, и нежелательное внимание может быть опасным.\nПоэтому, как только торговые контакты с Филиппинами достигли ушей высших чиновников двора Желтого Императора, Великому Магистру Юаню была предоставлена «возможность века».\n\nЮань — непоследовательный и дикий человек. Перемещаясь между культовым гедонизмом Бьющихся Драконов и свирепостью, которая могла заставить [Glossary('пенангаллан','podgloss.penangallan')] покраснеть, или снисходительной жестокостью, которая могла заставить упрямого Предка-Дьявола-Тигра устоять, Юань был наиболее известен благодаря настоящей армии Дампиров, которую он создал, настолько большой, что немалое число вернулось как $pod_kueijin$. Именно из-за этого его выгнали на Филиппины.\nЮаня это вполне устраивает, поскольку он размышлял о том, что устал от китаянок, и как только несколько его детей умерли и вернулись как $pod_kueijin$, он возвысил их и удалился, чтобы сосредоточиться на своих «дхармических занятиях», которые на самом деле представляли собой флотилию связанных душами девиц, которые выполняли все его «прихоти».\nИ пока материковый Ночной мир горит от нападения [Glossary('Анда','podgloss.anda')], Юань небрежно наслаждается плотскими удовольствиями за океаном, не заботясь об ужасающем политическом беспорядке, в который он вверг своих детей.\n\nБудущая судьба\nЮань, верный своему [Glossary('дхармы','podgloss.dharma')] по форме, функциям и разуму, к большому шоку выживших предков, которые услышали о нем, позже вознесся до [Glossary('Сотня облаков','podgloss.hundredclouds')] до прибытия испанцев на Филиппины, к большому головному болю и юбилею своих выживших детей.\nОднако его дети настолько презирали его, что к 1600-м годам его имя было функционально забыто, и его влияние осталось только в его потомках, которым пришлось наводить порядок в его беспорядке."
 POD_persistentpodlore.desc.793442:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nХотя в материковых дворах искусств плоти, среди бесчисленных держав и фракций Юго-Восточной Азии ходят слухи, что мастерство Пияу и ее [Glossary('пенангаллан','podgloss.penangallan')] слишком реально и в некоторой степени пугает, их величайшие искусства полностью сами.\nПо крайней мере, они были. Пока Манананггалу не удалось их захватить. И своим собственным отклонением на Синтае Плоти они обязаны своему Первому Разделителю. \n\nКалинау, как и многие высшие предки двора Фиолетового Коралла, был дампиром, потомком Великого Мастера Юаня. Одна из многих, кто мог начать расширять свой двор на Филиппинах, Калинав была одной из немногих, кому не повезло погибнуть ночью во время шторма, изгнав ее в [Glossary('Какури','podgloss.kakuri')].\n. По крайней мере, к счастью для Калинау, «вкусы» [Glossary('Эмма-О','podgloss.emmao')] к жертвам к ней не относились, поэтому под покровом шторма она ускользнула обратно в живой мир. И, как и ее собратья-ученики при Юане, она быстро стала авторитетной фигурой во дворе Фиолетового Коралла, особенно в качестве посланника приходящего в упадок двора Алого Феникса. \nИ именно там она впервые встретила учеников Пияу. \n\nХотя они по большей части проповедовали свою матриархальную тираду, Калинав не обращала на это особого внимания. Что действительно интересовало ее, так это их Синтай Плоти. \nОна играла с ними скромно, притворяясь, что полностью согласна, ссылаясь на свои «разочарования» и «жестокое обращение» как с бывшей дампиркой. Одна из них купила его, и как только она усвоила его, она немедленно сбежала обратно в свой дом, где поделилась искусством со своим двором.\n\nБудущая судьба\nТрюк Калинау не принес бы Фиолетовому двору особой пользы, но собственное вознесение Пияу, по крайней мере, дало им передышку, поскольку формирование Квинконкса было гораздо большим Issue.\nКалино станет одним из ведущих экспертов по синтаю плоти за пределами Золотых дворов, а позже станет важной частью противодействия чудовищам, созданным из плоти, каинитам-магам крови, которые через день обосновались и доминировали на Филиппинах."
 POD_persistentpodlore.desc.793443:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nMakisig не очень подходит для теории. Он человек практики. Действия. Он не хочет сидеть сложа руки и нести чушь о праведных действиях, ничего не делая. И по этой причине многие издеваются над ним издалека. Но среди учеников двора Фиолетового Коралла немногие Предки были более любимыми. \n\nМакисиг был одним из многочисленных дампиров, потомков Юаня, но, в отличие от большинства из них, его считали неудачником, поскольку, в отличие от многих других, хотя он был наделен чрезвычайно сильным телом и мощной мужественностью, он медленнее учился и часто боролся с концепциями, которые его Предок считал важными, поэтому он был потрачен как тупоголовый.\n\nОтправлен на смерть в обреченной битве против коренных Сородичей Филиппин, а после того, как в море его превратили в приятеля, он был приговорен к аду Кипящих Морей. И все же, по иронии судьбы, его прямота, сила, а также уловки и загадки дьяволов, проносившиеся над его головой, привели к тому, что он просто проломил столько черепов, что дьяволы просто позволили ему уйти, опасаясь его силы. \nИ, хотя Юань все еще отвергал его, чего Макисиг ему не простил, Исагани и Калинав приветствовали бы его в своих рядах, за что он был бы вечно благодарен for.\n\nМакисиг занимает положение, которое любой счел бы незавидным, но он знает это и делает это с гордостью. Ему поручено следить за тем, чтобы Ань никогда не продвигались дальше Висайских островов, и он держит оборону посредством неослабевающего насилия и непоколебимой решимости, не дрогнув в своем бдении. \nОн один из немногих Голодных Мертвецов, когда-либо переживших бой с прародителем Ань, и он наказывает зло с искренней и гордой волей. И пока он сможет выстоять, он будет сражаться, защищая свой дом от грязных ужасов, которые его грабят. \n\nБудущая Судьба\nМакисиг будет способствовать выживанию двора Фиолетового Коралла, но ужасной ценой. \nС прибытием грабителей Хари он лично расследует это дело. Когда он обнаружит истинный ужас, лежащий в основе этого, он бросит ему прямой вызов, и пока он будет убивать его, Макисиг купит Ночному миру Восточной Азии драгоценные столетия мира у Кагасео, поскольку он станет первым существом, заставившим ее в $pod_torpor$, доказав Ночному Миру, что даже Руку Железного Тирана можно победить, и лишив ее последователей ее Присутствия на протяжении более двух столетий."
 POD_persistentpodlore.desc.793444:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nСамый младший из дампиров, потомков Юаня, Адхика уже стремился вести очень полноценную жизнь. Ее самые ранние воспоминания связаны с тем, как ее мать утащили в море и сожрали, о развратных взглядах младшего ученика, обращенных на нее в подростковом возрасте. Адхика, таким образом, с того момента, как смогла взять в руки оружие, начала бросать вызов этим ужасам, лицом к лицу, не беспокоясь об опасностях, и только по той причине, что, по ее мнению, это было правильным поступком.\n\nЮань, находя «фантазии» молодого Дампира сбивающими с толку, обучалась среди старых знакомых Ши, и Адхика не нашла более подходящего пути. Хотя мало кто воспринимал Дампирского Охотника на Демонов всерьез, Адхика стал в этом очень, очень хорош.\nДостаточно того, что другие, более уравновешенные Предки двора Фиолетового Коралла хотели знать, о чем, черт возьми, думает Юань. Но это не имело большого значения, поскольку, когда Адика вернулась, ее, по крайней мере, можно было нацелить на Ань и других нарушителей их двора.\nПолучив специальное разрешение, Адхика, несмотря на то, что он всего лишь дампир, имеет высокую степень свободы во дворе. И что касается ее, она будет использовать его как кулак, поражающий зло.\n\nБудущая судьба\nАдхика будет продолжать убивать и умирать, как и жила. Убийца Демонов.\nОднако, в отличие от многих других охотников на демонов, она передаст все, что знала, своим потомкам. У нее будут свои собственные дети, и она передаст им свою войну, создав род филиппинских Охотников, которые, хотя они в конечном итоге исчезнут из двора Фиолетового Коралла, продолжат охоту против Сородичей и Голодных Мертвецов, названных этой линией «Асвангами»."
 POD_persistentpodlore.desc.793445:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nПрошло много времени с тех пор, как Мунсук ходил по Земле. Ему действительно не хватало этого чувства. \n\nЛидер Избранных [Glossary('Дохор-хана','podgloss.dokhorkhan')], Мунсук давно отказался от своего прошлого гуннского налетчика. Его хозяин на тот момент был еще очень молодым [Glossary('повелителя Яма','podgloss.yamaking')], и Мунсук пожинал плоды того, что был одним из первых, достаточно жестоких, чтобы сделать то, что сказал ему [Glossary('Дохор-хана','podgloss.dokhorkhan')]. По мере расширения [Glossary('Ад шипастых цепей','podgloss.hellspikedchains')] его лояльность была вознаграждена тем, что он стал де-факто лейтенантом, лидером племени Избранных и, по сути, высшим авторитетом в [UmbraGlossaryLocalized('yomi_wan','ад Йоми')] за пределами самого Дохора. \nМунсук на протяжении веков пользовался этими привилегиями, возможно, даже слишком. Хотя давным-давно он был относительно проницательным военным, столетия, проведенные в простой охоте и издевательствах над беспомощными заключенными, не совсем сохранили его навыки. Это привело к многочисленным досадным нарушениям безопасности, и, хотя [Glossary('Ад шипастых цепей','podgloss.hellspikedchains')] явно становится более мощным гораздо быстрее, чем большинство других, из него удается сбежать большему, чем обычно, числу заключенных. Это дошло до того, что сам [Glossary('Дохор-хана','podgloss.dokhorkhan')] обратил на это внимание. \nПока [Glossary('повелителя Яма','podgloss.yamaking')] занят завершением утверждения своего контроля над степями и двором Черной Черепахи, он поручил Мунсуку возглавить некоторых из своих лучших [akuma|E], чтобы сокрушить оставшуюся оппозицию, наказать беглецов из его ада и подготовить путь для его прихода к смертным. world.\nВ конце концов, домен будущего [Glossary('Императора демонов','podgloss.demonemperor')] не может быть чем-то меньшим, чем железным. \n\nИтак, Мунсук вернулся в степи своей смертной жизни, и хотя с тех пор они сильно изменились, он - нет. Более чем уверенный во многих впечатляющих благословениях \"\", которые [Glossary('Дохор-хана','podgloss.dokhorkhan')] даровал ему за эти годы, Избранный не может дождаться возможности вновь познакомиться с некоторыми бывшими сокамерниками. \nВозможно, они даже вынесут больше борьбы, чем его обычная несчастная добыча."
 POD_persistentpodlore.desc.793446:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nБольшинство [akuma|E] впервые обращаются к инфернализму из-за жажды власти, славы или мести. Салих повернулся, потому что ему было смертельно скучно. \n\n Своенравный человек в своей земной жизни, Салих с умением и доблестью пробился из [UmbraGlossaryLocalized('yomi_wan','ады Йоми')]. Будучи $pod_kueijin$, он стал учеником Блистательных Журавлей и получил высокую оценку за свое дисциплинированное поведение, большую преданность учебе и стремление действовать правильно. И все это имело мало значения, когда Салих понял, что ему придется делать одно и то же снова и снова на протяжении веков, прежде чем он по-настоящему поднимется в общественном положении или просветлении. \nКак кочевник по жизни, жесткие рамки оседлых дворов в сочетании с таким впечатлением, что, хотя он все делал правильно, ничто по-настоящему не имело значения, наконец, до него дошло. \nОднажды ночью, без предупреждения, он поехал в степь, не совсем зная, что он ищет. для. Влияние [Glossary('Дохор-хана','podgloss.dokhorkhan')] на тот момент уже было всеобъемлющим, и Салих быстро понял, что произойдет, если он останется. Тем не менее он это сделал. \n\nВсе началось с малого, с некоторых (захватывающих!) запрещенных ритуалов, ведущих к (интересным!) новым способностям. Затем дело перешло к более темным делам, продаже собственной души, привлечению других дворов под влияние [Glossary('повелителя Яма','podgloss.yamaking')]... По правде говоря, Салих знает, что то, что он делает, является злом, и что он обрек себя быть пешкой на всю вечность. Но для него это действительно не имеет значения, поскольку жизнь [akuma|E] захватывающа, и он жаждет этого ощущения, как никто другой. \n\nС приближением окончательного захвата степей [Glossary('Дохор-хана','podgloss.dokhorkhan')] он не может дождаться, чтобы увидеть, какие новые ужасы появятся, когда этот мир сольется с Адом Шипованных Цепей..."
 POD_persistentpodlore.desc.793447:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nСонгул родилась в племени Шатуо и прожила в основном несущественную жизнь, пока не убила своего мужа при обстоятельствах, которых она сегодня не помнит. Казненная братом мужа постфактум, она оказалась в [Glossary('Какури','podgloss.kakuri')], [UmbraGlossaryLocalized('yomi_wan','ад Йоми')] [Glossary('Эмма-О','podgloss.emmao')]. Позже она узнает, что была одной из последних смертных из степей, оказавшихся там до того, как влияние [Glossary('Эмма-О','podgloss.emmao')] в этой области было вытеснено [Glossary('Дохор-хана','podgloss.dokhorkhan')]. \n. В любом случае Сонгул была в ужасе от этого царства сломленных женщин, созданных подчиняться каждому приказу и прихоти [Glossary('Эмма-О','podgloss.emmao')]. К счастью для нее, как для степной женщины, [Glossary('повелителя Яма','podgloss.yamaking')] не проявлял к ней никакого интереса, и поэтому ее игнорировали. \nЕе побег, к сожалению, совпал с расширением царства [Glossary('Дохор-хана','podgloss.dokhorkhan')], и вместо того, чтобы вернуться в мир смертных, она оказалась в его [Glossary('Ад шипастых цепей','podgloss.hellspikedchains')].\n\nНа этот раз Сонгул нашла это царство почти... нормальным. Правда, это была извращенная крайность суровой степной жизни, но ее закономерности все равно были узнаваемы. Она легко нашла свое место среди Избранных и использовала это положение, чтобы сбежать. \n\nВозвращение в качестве $pod_kueijin$ стало еще одним шокирующим опытом для Сонгул. Под поверхностью существовало целое общество сверхъестественных существ, которое, по сути, ничего не делало против [Glossary('повелителей Яма','podgloss.yamaking')], довольствуясь тем, что следовало за мифическими мудрецами и слабой надеждой на искупление от бога, в которого она не верила. \nЕе все усилия повысить осведомленность об угрозе [Glossary('повелителей Яма','podgloss.yamaking')] были встречены хихиканьем и опровержением ее юношеской наглости. Когда ее публичное и очень громкое опозорение Предка закончилось ее изгнанием, Сонгуль знала, что ей нужно делать. \n\nДля нее ясно как день, что [Glossary('повелителей Яма','podgloss.yamaking')] восторжествует. Так что единственное, в чем она еще может быть уверена, это в том, что победит тот, кто менее ужасен. Таким образом, Сонгул посвятила себя [Glossary('Дохор-хана','podgloss.dokhorkhan')], став, пожалуй, самым ревностным его [akuma|E], поскольку он не оставил ни единого пальца, чтобы это произошло."
 POD_persistentpodlore.desc.793448:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nКурджакуз когда-то был хорошо известным именем среди двора Черных Черепах. Преданный Дьявольский Тигр, которого уважают за его стремление защитить двор от множества окружающих его угроз. Наряду с Лэй Фаном, он был самым ярым сторонником перенаправления усилий против Акумаса [Glossary('Анда','podgloss.anda')] и [Glossary('Дохор-хана','podgloss.dokhorkhan')] вместо двора Желтого Императора. \n Прежде всего, человек действия, Курджакуз одержал несколько побед в борьбе с незначительными вторжениями [Glossary('повелителя Яма','podgloss.yamaking')], хотя настоящий триумф ускользнул от него. Возможность добиться этого появилась, когда он раскрыл долгосрочный план [Glossary('Дохор-хана','podgloss.dokhorkhan')] - порчу Драконьих Гнезд степей. \n\nЭто была великая ночь для двора Черной Черепахи, когда могущественные воины, сплоченные Курджакузом, готовились к решающему удару по [Glossary('Дохор-хана','podgloss.dokhorkhan')]. Даже измученные Предки благословили эту беспрецедентную возможность. Битва должна была стать мощным ударом по восхождению [Glossary('Императора демонов','podgloss.demonemperor')]. \n\n. В конце концов, все они были убиты, кроме самого Курджакуза. Некоторые говорят, что [Glossary('Дохор-хана','podgloss.dokhorkhan')] находился на месте испорченного Драконьего Гнезда, поскольку его истинный план требовал его Присутствия. [Glossary('повелителя Яма','podgloss.yamaking')] не хотел только развратить Гнезда Дракона, он намеревался передать их \"key\" своим собственным Акумам. Это позволяет ему единолично использовать испорченную Ци (что в конечном итоге ослабляет другие [Glossary('повелителей Яма','podgloss.yamaking')]) и передавать испорченную Ци от одного существа к другому по своему желанию. \nКурджакуз был первым пленником, насильно введенным \"ключом\" в испорченное Драконье Гнездо и полностью сошедшим с ума из-за постоянного потока злой Ци, через которую он постоянно течет. его.\n\nТак закончилась ночь величайшего триумфа [Glossary('Дохор-хана','podgloss.dokhorkhan')]. Революционное преимущество над соперниками обеспечено, враг превращен в слугу, а боевой дух двора Черной Черепахи сломан и не подлежит восстановлению, готовый к взятию."
 POD_persistentpodlore.desc.793449:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nДжахангир вырос на историях о героях, богах и монстрах и наслаждался каждой минутой этого процесса. Тот факт, что многие из них служили предупреждениями о вполне реальных опасностях, никогда не доходил до него. \nСтав прилежным членом своего племени благодаря желанию подражать этим героям, Джахангир показал достаточно многообещающих надежд, что стал $pod_Embraced$ от [Glossary('Анда','podgloss.anda')]. Воодушевленный тем, что стал частью такого сильного сообщества, как это, Джахангир все же знал, что ему нужно что-то сделать, чтобы по-настоящему отличиться, как это всегда делают героические личности. Поэтому он решил дать бессмертие своей детской любви, прежде чем она сможет состариться без него. \n[Glossary('Анда','podgloss.anda')], которые позволяют Объятия только после того, как вы достаточно поэкспериментировали, и более строги в отношении присоединения к ним женщин, не были удивлены. Настолько, что они изгнали Джахангира и его новое дитя Аслихана из своего лагеря. \nДжахангир, хотя и был опечален этим, воспринял это спокойно. Аслихан был благодарен за то, что стал бессмертным, и они оба, таким образом, продолжили свою жизнь в степи как маловероятный дуэт.\n\nХотя им не хватало базовых знаний о сверхъестественном, они оказались достаточно находчивыми, чтобы выжить, и их добродушие сделало их желанными гостями среди различных групп, включая некоторые племена [Glossary('Анда','podgloss.anda')], которые не знали об их изгнании.\n\nЭто было, когда они поехали дальше. восточнее, чем основная часть [Glossary('Анда','podgloss.anda')], их судьба изменилась к худшему. Попав в засаду Акума [Glossary('Дохор-хана','podgloss.dokhorkhan')], которые искали изолированного [Glossary('Анда','podgloss.anda')], они были доставлены в испорченное Гнездо Дракона и подвергнуты последним экспериментам [Glossary('Дохор-хана','podgloss.dokhorkhan')], создав \"[Glossary('Анда','podgloss.anda')] [akuma|E]\". К его удовольствию, испытание прошло успешно, исказив разум несчастной пары подавляющим количеством зла Чи. \nХотя фрагмент их прошлых личностей остается, погребенный под постоянной болью и ужасом экспериментов, Джахангир и Аслихан теперь являются марионетками [Glossary('повелителя Яма','podgloss.yamaking')], неспособными игнорировать его команды принести больше [Glossary('Анда','podgloss.anda')] в его.\n\n, если все пойдет по плану, эти двое будут лишь первыми из бесконечной армии [Glossary('Анда','podgloss.anda')] [akuma|E], которая обеспечит рост [Glossary('Дохор-хана','podgloss.dokhorkhan')] как [Glossary('Императора демонов','podgloss.demonemperor')]."
 POD_persistentpodlore.desc.793450:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nДжахангир вырос на историях о героях, богах и монстрах и наслаждался каждой минутой этого процесса. Тот факт, что многие из них служили предупреждениями о вполне реальных опасностях, никогда не доходил до него. \nСтав прилежным членом своего племени благодаря желанию подражать этим героям, Джахангир показал достаточно многообещающих надежд, что стал $pod_Embraced$ от [Glossary('Анда','podgloss.anda')]. Воодушевленный тем, что стал частью такого сильного сообщества, как это, Джахангир все же знал, что ему нужно что-то сделать, чтобы по-настоящему отличиться, как это всегда делают героические личности. Поэтому он решил дать бессмертие своей детской любви, прежде чем она сможет состариться без него. \n[Glossary('Анда','podgloss.anda')], которые позволяют Объятия только после того, как вы достаточно поэкспериментировали, и более строги в отношении присоединения к ним женщин, не были удивлены. Настолько, что они изгнали Джахангира и его новое дитя Аслихана из своего лагеря. \nДжахангир, хотя и был опечален этим, воспринял это спокойно. Аслихан был благодарен за то, что стал бессмертным, и они оба, таким образом, продолжили свою жизнь в степи как маловероятный дуэт.\n\nХотя им не хватало базовых знаний о сверхъестественном, они оказались достаточно находчивыми, чтобы выжить, и их добродушие сделало их желанными гостями среди различных групп, включая некоторые племена [Glossary('Анда','podgloss.anda')], которые не знали об их изгнании.\n\nЭто было, когда они поехали дальше. восточнее, чем основная часть [Glossary('Анда','podgloss.anda')], их судьба изменилась к худшему. Попав в засаду Акума [Glossary('Дохор-хана','podgloss.dokhorkhan')], которые искали изолированного [Glossary('Анда','podgloss.anda')], они были доставлены в испорченное Гнездо Дракона и подвергнуты последним экспериментам [Glossary('Дохор-хана','podgloss.dokhorkhan')], создав \"[Glossary('Анда','podgloss.anda')] [akuma|E]\". К его удовольствию, испытание прошло успешно, исказив разум несчастной пары подавляющим количеством зла Чи. \nХотя фрагмент их прошлых личностей остается, погребенный под постоянной болью и ужасом экспериментов, Джахангир и Аслихан теперь являются марионетками [Glossary('повелителя Яма','podgloss.yamaking')], неспособными игнорировать его команды принести больше [Glossary('Анда','podgloss.anda')] в его.\n\n, если все пойдет по плану, эти двое будут лишь первыми из бесконечной армии [Glossary('Анда','podgloss.anda')] [akuma|E], которая обеспечит рост [Glossary('Дохор-хана','podgloss.dokhorkhan')] как [Glossary('Императора демонов','podgloss.demonemperor')]."
 POD_persistentpodlore.desc.793451:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nКак региональный предок двора Черной Черепахи, Кханда имеет сомнительную честь занять место в первом ряду на том, что кажется концом света.\n\nБудучи когда-то способным и уважаемым предком, она будет первой, кто признает, что недооценила первые признаки. Исчезновения, праздность, распространяющаяся из центрального двора, небрежное игнорирование слухов о [akuma|E]... это звучало как обычная обреченность и уныние, преобладающие среди молодых поколений, которые не знали ничего лучшего. И только когда министр, которому она доверяла, попытался отравить ее Драконье Гнездо на ее глазах, она поняла. Он думал, что она уже была на доске \" с изменениями \" и поплатился за это своей жизнью, но было слишком поздно.\n\nХанда теперь это видит: влияние [Glossary('Дохор-хана','podgloss.dokhorkhan')] повсюду в степях. Насколько она знает, его чванство [akuma|E], как будто это место принадлежит им, и [Glossary('Анда','podgloss.anda')] $pod_cainites$ также могут быть у него в кармане. Но... что ей было делать? Ее демонстрация неповиновения коррумпированному министру поставила ее в список самых разыскиваемых [Glossary('повелителя Яма','podgloss.yamaking')], и это было лишь вопросом времени, когда ее будут клеветать, угрожать и шантажировать в ежедневных газетах. Когда произошло первое покушение, Кханда поняла, что у нее больше нет выбора.\n\nСовершив свою первую сделку с [Glossary('Дохор-хана','podgloss.dokhorkhan')], Ханда стала всего лишь одной из его пешек.\nИли он так думает. Правда в том, что осажденный предок более чем готов стать мучеником. Теперь, когда [Glossary('повелителя Яма','podgloss.yamaking')] не следит за ней внимательно, она начала тонко вмешиваться в его планы. Она не может быть слишком наглой, но вводит Акумаса в заблуждение, позволяя войскам сопротивления покинуть ее территорию, клевещет на \"rivals\"... это немного, но это складывается, или, по крайней мере, она надеется, что это так.\nНа данный момент Кханда рад, что в войсках [Glossary('Дохор-хана','podgloss.dokhorkhan')] его считают некомпетентным идиотом. Она боится той ночи, когда они поймут, что она на самом деле очень способна на то, что делает.\n\nБудущая судьба\nВклад Кханды в падение [Glossary('Дохор-хана','podgloss.dokhorkhan')] останется неизвестным. Когда [Glossary('повелителя Яма','podgloss.yamaking')] будет окончательно уничтожен и вместе с ним уничтожена ее проданная душа, она войдет в Забвение с улыбкой на лице."
 POD_persistentpodlore.desc.793452:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nТайисунг всегда был простым солдатом, и такая жизнь его удовлетворяла. Хотя до него доходили слухи о том, что двор Черной Черепахи испорчен [Glossary('Дохор-хана','podgloss.dokhorkhan')], он в основном оставлял эти проблемы тем, кто, по-видимому, более квалифицирован, чтобы справиться с ними. Сейчас он сожалеет об этом выборе. \n\nНикогда не интересовавшийся властью и имеющий безупречную репутацию, Тайисун прекрасно себя чувствовал, когда его отправили стать придворным в небольшой региональный двор. Он даже преуспел там, удостоившись чести стать Первым Они и смотрителем Драконьего Гнезда указанного двора, и эту задачу он принял близко к сердцу. \nК сожалению, даже эта далекая должность не могла навсегда сдержать влияние [Glossary('Дохор-хана','podgloss.dokhorkhan')]. Тайисун увидел знаки, но остался на месте, остановив нескольких подающих надежды [akuma|E], пытающихся получить доступ к Гнезду. Он сделал это только тогда, когда Тайсун получил приказ от Предка отступить. \nЕще один выбор, о котором он сожалеет сегодня. \n\nОн, к сожалению, не был удивлен, увидев, что его Драконье Гнездо полностью испорчено, когда он вернулся на свой пост. Однако на данный момент он мало что может сделать. Ему нужна энергия Ци, чтобы выжить, и поэтому он тоже будет развращен, и он это знает. \n Бунт никогда не входил в словарный запас Тайисуна, но последнее, что он хочет обещать себе, пока его разум все еще принадлежит ему, - это то, что он не хочет сожалеть о своем выборе в третий раз. \n\nБудущая судьба\nКогда Всадники Серебряного Клинка нападут на его Драконье Гнездо, чтобы очистив его, Тайсон поставит только символ сопротивления, а \" забудет \", чтобы предупредить свой двор перед тем, как его убьют. Это будет его первый и последний акт неповиновения."
 POD_persistentpodlore.desc.793453:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nБаатар стал жертвой одного из печально известных рейдов [Glossary('Дохор-хана','podgloss.dokhorkhan')] \"[akuma|E]\", где целые сообщества были убиты, чтобы потенциально оказаться в [Glossary('Ад шипастых цепей','podgloss.hellspikedchains')] в качестве пленников. Хотя в своей земной жизни Баатар был трудным ребенком и нерешительным взрослым, он оказался сильным в условиях принуждения и перенес пытки лучше, чем большинство других.\nВо всяком случае, лучше, чем его старший брат, который тоже оказался в плену в то же время, что и он. Хотя Баатар не был особенно близок ему как смертному, он старался изо всех сил помочь и успокоить его в этой ужасной тюрьме. Однако это не сработало, и, видя, как дух его брата сломлен, Баатар воспользовался представившейся ему возможностью сбежать без него.\n\nХотя на тот момент это, вероятно, был хороший выбор, этот решительный выбор препятствовал росту Баатара как $pod_kueijin$, поскольку он всегда пытался найти способ вернуться сюда и спасти его. Очевидно, его призывы атаковать [UmbraGlossaryLocalized('yomi_wan','ад Йоми')] [Glossary('Дохор-хана','podgloss.dokhorkhan')] были встречены насмешливым смехом, и поэтому Баатар впал в отчаяние. Ситуация изменилась, когда двор Черной Черепахи еще больше погрузился в коррупцию, а знания о том, как торговаться с [Glossary('повелителей Яма','podgloss.yamaking')], стали более распространенными.\nТаким образом, Баатар заключил сделку с [Glossary('Дохор-хана','podgloss.dokhorkhan')]. Его служба в качестве [akuma|E] для освобождения своего брата. И хотя контракт был запечатан и, следовательно, обязателен для обеих сторон, Баатар не уточнил \", где \" должен быть освобожден его брат, и поэтому больше его не видел. Его новые обязанности [akuma|E] запрещают ему пытаться его выследить, и Баатар снова впадает в отчаяние.\nПоскольку его душа продана, а его брат застрял, только [Glossary('Дохор-хана','podgloss.dokhorkhan')] знает где, будущее кажется действительно мрачным.\n\nБудущая судьба\nЗа годы, предшествовавшие падению [Glossary('Дохор-хана','podgloss.dokhorkhan')], Баатар услышит о жестоком воине китайского двора, соответствующем описанию его брата. Действительно, когда Квинконкс предпримет последнюю атаку, два брата встанут по разные стороны.\nБаатар попытается объясниться, но его голос будет заглушен мелочным [Glossary('повелителя Яма','podgloss.yamaking')], что гарантирует, что Баатар будет убит своим братом как еще один [akuma|E]."
 POD_persistentpodlore.desc.793454:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nИз Хаоса Вечной Войны есть обычные последствия. В последнее время дуют ветры перемен, поскольку новые вещи начинают появляться и продвигаться дальше. И когда эти ночные ужасы пытаются пройти через земли народа Тай, их ждет ужасный конец. Лаван не потерпит внешнего влияния или смертных ветров, которые испортят ее работы. \n\nЛаван при жизни была рабом народа чампа, похищенным и использованным для строительства их сооружений. И это была вся ее жизнь, рабыня. И за эту жизнь небеса сочли целесообразным отправить ее в ад без денег, где после трудовой жизни ей пришлось выискивать ничего и отбросы и работать дальше. \nНо Лаван, отчаянно искавшая спасения от жизни и уставшая от тирании смертных людей и [Glossary('повелителя Яма','podgloss.yamaking')], создала себе крепость из пыли и урагана дыхания, где она затем сдует своих тюремщиков. И позже ее найдет двор Алого Феникса после ее побега. \n\n Сказать, что у Лаван есть осколок на плече от ее смертной жизни, значит ничего не сказать. Она ненавидит и презирает общество смертных, видя в них развратных монстров, которые своей злобой сделали ад таким, какой он есть. Они - скот, который раздавит своих, чтобы избежать мясника.\nТак что нет, она не позволит им запятнать это более чистое общество, и она будет оплотом между Судами и смертной греховностью.\n\nБудущая судьба:\nЛаван будет одним из первых союзников Пияу, считая ее идеологию, невероятно отличающуюся от общества смертных, главной освобождение. Однако ее собственное недовольство обществом смертных в конечном итоге оставило ее оторванной от потенциальных союзников, и она была узурпирована и затеряна в безвестности более поздними, более интеграционистскими судами в «Современных ночах»."
 POD_persistentpodlore.desc.793455:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\n. Хотя многие Предки слишком сосредоточены на [Glossary('дхармы','podgloss.dharma')], а некоторые еретики одержимы своей смертной жизнью, Клахану все это кажется довольно глупым. Можно искать высшие силы и при этом заботиться об окружающих. На самом деле он считает это вершиной мудрости. И кроме того, его смертный опыт не требует меньшего. \n\nКлахан родился рабом, и даже в этом смертном аду он оставался оптимистом. Добрый к окружающим, представительный и харизматичный, всегда готовый ждать, пока другие придут, Клахан был очень любим всеми, кто его окружал.\nНо его жизнь была в сноске, и когда он умер, его отправили в ад, где с него содрали кожу заживо за грехи людей, которые владели им. Но Клахан привык не иметь ничего, кроме своего ума и харизмы, и хорошо использовал это, чтобы убедить путешественников помочь ему сбежать. \n\nКлахан - отрезвляющее Присутствие, и поэтому в более оживленном дворе Алого Феникса его считают немного депрессивным. Но он не возражает против своих назначений в сельской местности, поскольку он налаживает связи среди людей и создает мягкую силу среди смертных.\nУ него есть планы, цели и надежды. Искупление еще может прийти. Ему просто нужно дождаться возможности. \n\nДальнейшая судьба\n Хитрое терпение и готовность Клахана оставаться в тени хорошо ему платят. Полностью готовый быть покорным и почтительным по отношению к Пияу и ее войскам, его по большей части игнорируют и тихо поглощают. \nНо в современности умная политиканство и поддержка смертных приведут к тому, что он свергнет своих бывших хозяев, вознесется должным образом и выйдет на свет как истинные защитники своей родины. \nИ по мере того, как [Glossary('Императора демонов','podgloss.demonemperor')] приближается, его мудрость нужна сейчас больше, чем когда-либо."
 POD_persistentpodlore.desc.793456:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nОднажды Сакчай был назначен при его дворе, чтобы гарантировать, что никакие сверхъестественные существа не проникнут в морские пути Юго-Восточной Азии без одобрения или надзора со стороны Дьянанга. Теперь его волнует только его одобрение и надзор.\nЕго смертная жизнь представляет собой миазмы обрывков изоляции и цепей, он также мало что помнит о своем пребывании в аду перевернутых грешников. Но он, по крайней мере, знает, что свободный образ мышления освободил его. Изначально его непредвзятость принесла ему должность надзирателя над путешественниками, но двор Алого Феникса не видел амбиций и тщеславия в его сердце.\nОн всегда хотел оправдания. И он нашел его, когда встретил еще одно странное ночное существо, облаченное в тени, проповедующее слово чужеземного бога.\n\nСакчай, по крайней мере на первый взгляд, в какой-то степени принял бы такое мышление и позволил этому незнакомцу глубже проникнуть во двор Алого Феникса. По мере того, как прибывает еще больше, он заискивает и пытается еще больше укрепить свою власть среди этих «$pod_cainites$», ища дальнейшие связи и связи для наращивания своей власти.\nПо его мнению, отвергать этих иностранцев – это идиотизм. Чтобы добиться успеха, необходимо принять аутсайдеров, по крайней мере, так, чтобы их успокоить.\nПоэтому он сказал этим «[Glossary('Аширры','game_concept_ashirra_desc')]», что он полностью с ними согласен, используя их веру как оправдание для большего наращивания власти и авторитета.\n\nБудущая судьба\nСакчай благодаря своему напору и смелости откусил бы гораздо больше, чем мог проглотить. Когда Сдирающая Обезьяна Интан пришла к нему во двор, его требования ее подчинения и обращения сердца и ума к его новому «просветлению» привели к тому, что она обнаружила, что его положение больше не нужно, а его попытки казнить ее за неповиновение ему еще больше испортили ситуацию. Он даже попытается арестовать следующего ученика Пияу, посланного «убрать» его.\n\nОн окажется в той же глотке, что и бесчисленные Акумы, поскольку Вати сожрал его целиком."
 POD_persistentpodlore.desc.793457:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nВсе во дворе Ангкора кричат, что Тилака силен, опытен и просвещен. Будучи лидером знаменитого Золотого Плащаница [Glossary('ву','podgloss.wu')], она является очевидным преемником Дьянанга. Как могло быть иначе? \n Правда немного сложнее. \n\n Тилака действительно является лидером знаменитой группы, которая заключила прочный мир со свирепыми оборотнями джунглей. Однако то, что она была лидером, не означает, что она играла важную роль, и, по правде говоря, она была как бы наоборот. \nТилака чрезвычайно амбициозна, и когда ее товарищ [Glossary('ву','podgloss.wu')] Ведавати предложил начать переговоры с оборотнями, Тилака увидела только два результата. Успех принес бы ей славу, тогда как неудача, вероятно, стоила бы Ведавати жизни, и это была цена, которую она была готова заплатить. \nЕе оценка оказалась верной, и Тилака поспешила поставить свое имя в начале многообещающего договора о союзе. Настолько быстро, что это почти испортило ход событий, пока не подошел Ведавати. \n\nВ конце концов, это не имело особого значения, и с тех пор Тилака использовал эту великую победу в полной мере. К ее чести, она сделала это хорошо, и двор Ангкора в этот момент ест из ее рук, хотя, к сожалению, сама Дьянанг нехарактерно холодна и отстранена от нее. \n На самом деле неважно, Императрица Алого двора, скорее всего, достаточно скоро достигнет [Glossary('Сотня облаков','podgloss.hundredclouds')], оставив трон широко открытым для Тилаки. Затем она реорганизует двор по своему образу и по-настоящему начнет свое восхождение.\n\nБудущая судьба\nВозвышение Пияу будет касаться Тилаки. Беспокойство, которое перерастет в настоящую панику, когда Красный Дракон докажет впечатляющий успех. \nТилака попытается использовать всю свою политическую власть, чтобы заклеймить ее еретичкой и послать против нее силы, но ее будет останавливать на каждом шагу Дьянанг. \nКогда Алая Императрица наконец покинет Ангкор, будет слишком поздно. Сторонники Тилаки откажутся умирать за проигранное дело, не оставив ей иного выбора, кроме как бросить вызов на дуэль тому, кого она считала своим врагом. \n\nПияу быстро расправится с ней, лениво гадая, кто эта безумная женщина, которая, очевидно, так сильно ее ненавидела."
 POD_persistentpodlore.desc.793458:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nСритея хранит приятные воспоминания о своей смертной жизни в качестве родственника Хана. Она всегда была высокой, сильной и эффектной, что заставляло ханских мужчин относиться к ней с уважением и стараться завоевать ее расположение. Однако этого не произошло, поскольку она умерла, защищая свое племя от сил [Glossary('повелителя Яма','podgloss.yamaking')] Раваны. \n Оказавшись на Ланке, [UmbraGlossaryLocalized('yomi_wan','ад Йоми')] Раваны, Шрития просто увидела в этом продолжение своей предыдущей битвы. Она боролась с этим решительно и терпеливо и добилась побега и возвращения в качестве $pod_kueijin$. Это возвращение было для нее трудным опытом: беспощадная политическая атмосфера Двора сильно отличалась от гораздо более простой жизни ее смертного племени. \nОставленная на время в бреду, она в конечном итоге оказалась назначенной в Золотой Плащ [Glossary('ву','podgloss.wu')], когда они начали переговоры с оборотнями из-за ее прошлого. \n\nВозвращение Сритеи на родину было не таким теплым, как она ожидала этого с самого начала, так как ее люди теперь относились к ней в лучшем случае с подозрением из-за того, что она была $pod_kueijin$. Однако она не сдавалась и воссоединялась с ними, насколько могла, чему способствовали мирные переговоры, которые в то же время шли хорошо. \n\nКогда они были завершены, Шритья поняла, что, даже несмотря на эти потепления в отношениях, она никогда не сможет жить со своим народом и будет навсегда обречена оставаться аутсайдером. Это повергло ее в недомогание, перешедшее в отчаяние.\nКогда ее лидер Тилака привел ее во двор, чтобы ее удалили из Золотого Плащаницы, потому что теперь она была \"бесполезной\", Алая Императрица Дьянанг отказалась и вместо этого сделала Шритеджу Первым Они, таким образом, генералом сил двора Ангкора.\n\nОсновным мотивом этого неожиданного назначения вскоре стал очевидный. Шритедже пришлось тесно сотрудничать с теперь союзными оборотнями, чтобы сохранить мир и справиться с общими угрозами. Теперь она преуспевает в своей новой роли, становясь уважаемым координатором между двумя силами. \n\nБудущая судьба\nСритея и глазом не моргнет, когда ее лидер Тилака самоуничтожится против Пияу. Вместо этого она будет утверждена на свою роль. Даже раскол поста Суда Пияу мало что изменит для нее, многие Золотые Королевы по-прежнему доверяют ей сохранять мир со Свирепыми людьми джунглей, что она делает и по сей день."
 POD_persistentpodlore.desc.793459:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nВедавати, несмотря на то, что многие думают, был истинным вдохновителем договора, объединившего двор Алого Феникса со свирепыми оборотнями джунглей. Однако мало кто поверит, видя ее застенчивое и скромное Присутствие, которое плохо сочетается с таким дипломатическим подвигом. \n\nОна не рассказывает о своем пребывании в [UmbraGlossaryLocalized('yomi_wan','ад Йоми')], но можно с уверенностью предположить, что это оставило на ней глубокое клеймо. Это также дало ей непоколебимую уверенность в том, что [Glossary('повелителей Яма','podgloss.yamaking')] необходимо остановить. К сожалению, вскоре она узнала, что многие $pod_kueijin$ больше говорят о противостоянии им, чем на самом деле что-то с этим делают. \nНазначение к Золотой Плащанице [Glossary('ву','podgloss.wu')] не помогло делу. Ее лидер Тилака больше озабочен личной славой и амбициями, чем истинной угрозой. Дело дошло до переломного момента, и Ведавати подумывала покинуть двор, когда Императрица Алого ордена Дьянанг вызвала ее для частной беседы. Что там было сказано, неизвестно, но Ведавати ушла с новым огнем в глазах, который побудил ее возглавить дипломатические усилия с оборотнями. \n\nКогда, несмотря на множество препятствий, это оказалось успешным, она довольствовалась тем, что оставила похвалу Тилаке и вместо этого работала над своими собственными проектами. Что это такое, остается только догадываться. \n\nБудущая судьба\nВедавати незаметно поможет Пияу прийти к власти, играя роль дипломата в нескольких неопределившихся дворах. Столкнувшись с этой маловероятной помощью со стороны кого-то, кто не очень подходит для экстремального [Glossary('дхармы','podgloss.dharma')] Пияу, Ведавати просто скажет, что Красный Дракон сделал больше против инфернальных сил, чем большинство Дворов когда-либо считали возможным. \n Затем она исчезнет на заднем плане, став чем-то вроде городской легенды среди Золотых Дворов, поскольку ее судьба никогда не будет записана."
 POD_persistentpodlore.desc.793460:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nBhadra, по сути, был довольно ничем не примечательным $pod_kueijin$, который стал ничем не примечательным самым молодым членом Золотого Плащаница [Glossary('ву','podgloss.wu')]. Она занималась просвещением Дхармы и дворовой политикой, счастливая поддерживать своего лидера Тилаку в ее более амбициозных начинаниях. Ее ценили за преданность, но на самом деле это была скорее общая апатия, которая заставляла ее делать то, что от нее просили. Ситуация резко изменилась в 1177 году, когда она наткнулась, откровенно говоря, совершенно случайно, на заговор [akuma|E] с целью захватить гнездо власти Чжун Лунг (драконов-оборотней). \n\nС ее [Glossary('ву','podgloss.wu')] на ее стороне, она бросилась в битву и спасла меняющего драконов по имени Нонгкхай, внезапно заработав себе славу и похвалы, к которым она была совершенно не готова. for.\nЭта внезапная перемена обострила самоощущение и амбиции Бхадры, и теперь она (не очень тонко) оспаривает лидерство Тилаки над Золотой Плащаницей. Серьезный разрыв в возрасте и силе означает, что Бхадра в ближайшее время не будет делать смелых шагов, но она, наконец, начала играть в дворовую политическую игру и обнаружила, что ей это нравится. \n\nБудущая судьба\nКогда голова Тилаки покатится на пол после ее вызова Пияу, Бхадра мудро присягнет на верность Золотому Суды.\nСтав одной из первых Золотых Королев, она, однако, быстро откусит больше, чем сможет прожевать, угрожая территории другой Золотой Королевы, Мавара.\nЕе окончательная судьба - быть брошенной в яму для мяса, став первой заметной жертвой постоянной гражданской войны низкой интенсивности в Золотых Дворах."
 POD_persistentpodlore.desc.793461:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nКонти родилась инвалидом, и ее семья заботилась о ней до тех пор, пока ее бессердечный брат не стал главой семьи и оставил ее умирать.\nХотя погружение в [UmbraGlossaryLocalized('yomi_wan','ад Йоми')] было шоком, тот факт, что этот духовный мир впервые в ее существовании позволил ей быть независимой, заставил ее терпеть это, пока она не нашла выход.\n\nВозвращение в качестве $pod_kueijin$ во двор Алого Феникса стало для нее колоссальным опытом. Приняв оживленный образ жизни двора, ориентированного на Ян, Конти никогда не уставала испытывать в полной мере все, чего ей не хватало в течение жизни. Таким образом, несмотря на ее почтенный возраст и карьеру на нескольких министерских должностях, многие до сих пор считают ее перевозбужденной ученицей.\nПытаясь сфокусировать и центрировать ее, двор Ангкора назначил Конти на Золотую Плащаницу [Glossary('ву','podgloss.wu')]. Как и во всем остальном, Конти с головой окунулся в эту новую роль и оказал решающую помощь во многих дипломатических и военных достижениях, собранных Плащаницей. Тем не менее, ее просветление [Glossary('дхармический','podgloss.dharma')] осталось таким же замедленным, как и прежде, и двор Ангкора начинает менее снисходительно относиться к ее выходкам, некоторые утверждают, что она находится на прямом пути, чтобы поддаться искушению [Glossary('повелителя Яма','podgloss.yamaking')].\n\nБудущая судьба\nИх опасения не оправдаются, поскольку возвышение Пияу предоставит Конти новую возможность. Узнав о Кровавых Цветах Страсти [Glossary('дхармы','podgloss.dharma')], она присоединится к ним при первой же возможности.\nОбучаясь у ученика Пияу Мавара, Конти преуспеет в крайностях Кровавых Цветов Страсти, но благодаря этому ему также удастся продвинуться на пути к просветлению.\nСтав региональным министром Мавара, а затем самостоятельной Золотой Королевой, Конти станет главным примером, на который указывают китайские суды, когда (со страхом) описывают невероятные эксцессы, которыми будут известны Золотые дворы.\n\nОднако Конти это не волнует, и она будет неуклонно подниматься к [Glossary('Сотня облаков','podgloss.hundredclouds')]."
 POD_persistentpodlore.desc.793462:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nДаже в своей смертной жизни, глядя на Тихий океан на китайском побережье, Шэнью всегда задавался вопросом, что находится на другой стороне. И даже после Второго Дыхания он не может не задаваться вопросом. \n\nШэнью был моряком в смертной жизни, даже родился на корабле. Между первыми маршрутами на Филиппины, переходами в Японию и Вьетнам, а также на другие более мелкие острова в Южно-Китайском море открытое море всегда манило его, даже когда оно убивало его во время шторма. \nНо Ад Кипящих Морей не был для него самой плохой судьбой, поскольку он мог понять пути, по которым проходили корабли. Цепляясь за корпус корабля, проплывавшего мимо «Голодных мертвецов», он нашел выход и был принят в свои ряды.\nИ благодаря своим знаниям в мореплавании Хао сразу же схватил его за свои навыки и мудрость. Удерживая его рядом, мудрость Шэнью была немедленно использована для поддержания контакта с разрушающимся двором Алого Феникса, открытым для приема опытных беженцев, спасающихся от хаоса.\nБлагодаря этому Шэнью стал неоценимым, выбирая выбор из Юго-Восточной Азии и Нусантары, чтобы еще больше возвысить двор Хао.\n\nБудущая судьба\nШэнью с нетерпением сопровождайте Хао в его возможном руководстве «Большим скачком наружу». Он с нетерпением хотел пересечь Тихий океан и попытаться основать двор в Масатлане. Однако несколько глупых нападок на Шабаш привели к разрушению его двора, и он с позором вернулся в Квинконкс и предстал перед Оком Небес за свою неудачу."
 POD_persistentpodlore.desc.793463:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nХотя дворы Желтого Императора уже давно попали в руки подхалимов и подхалимов, не все страдают от недугов правила, долгое время отягощенного слишком скучными правилами. Цзинсинань — один из таких уцелевших. И тот, кто привел это в порядок, когда-то был кротким никем, убитым войной и обращенным в ничто, который поклялся никогда больше не быть слабым.\n\nЧуджун был одним из тысяч погибших во время наступления монголов через Китай. Это большая часть того, что помнит Чуджун, а также то, как в своей смертной жизни он был слаб.\nАд того, как сняли шкуру заживо, изменил его до глубины души. Шелушащийся песок просветил его, показав, как даже самые маленькие песчинки могут превратить демона в туман за считанные минуты, если им правильно управлять. И именно эти принципы помогли Чуджуну сбежать.\n\nСразу же войдя во двор Хао Вэй Ляна, Чуцзюнь посвятил себя изучению произведений Сунь Ли, желая сделать себя великим и лишить себя когда-либо слабости. Выбранный в качестве личного силовика Хао, он добился на этом пути ошеломительного успеха. И по мере приближения эпохи хаоса его путь остается неизменным.\n\nБудущая судьба\nЧуджун будет процветать и процветать при Хао, и благодаря их расширению в «Большом скачке наружу» Чуджун напишет свои собственные работы и трактаты о борьбе с $pod_cainites$.\nОднако его собственная смелость означала бы его гибель, когда он смело попытается возглавить экспедиционный корпус, чтобы захватить Лиму у местного Караи Пихаре. Утонувшие Наследия бросили ему вызов и уничтожили его армии, и когда он вернулся в Квинконкс, чтобы просить подкрепления, он столкнулся с разваливающимся институтом, а его собственный двор находился в хаосе под узурпацией Легиона Небес и Ада.\n\nИтак, человек, который однажды поклялся никогда больше не быть слабым, встретил свой конец, рыдая и умоляя, прежде чем Шуфен высосал его последний вздох из легких, а его быстро разлагающиеся останки были брошены в океан."
 POD_persistentpodlore.desc.793464:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\n. Для большинства старших предков двора Желтого Императора угроза [akuma|E] - это угроза издалека, борьба Дворов Черной Черепахи и Алого Феникса. Просто они слишком далеки, и добродетели Пятеричного Пути защищают их, поэтому они почивают на лаврах.\n\nЛинъюань не может на этом почивать.\n\nЗемная жизнь Линъюань - туман для нее, зная, что в жизни она была поваром в ресторане и погибла в каком-то пожаре.\nНо в Аду Верхней Стороны Внизу Грешников она видела вспышки зла, надвигающуюся тьму и армии дьяволов, марширующие под одноглазым государем. Ее побег был не результатом личной свободы, а желанием спасти мир от этой угрозы.\n\nЕе стремление и воля к этому принесли ей легкое место среди наиболее компетентных дворов Цзинсинаня, где она посвятила себя поиску этих скрытых дьяволов.\n\nБудущая судьба\nЛинъюань придет, чтобы увидеть этого. Глазастый дьявол под именем Зао-Лат, известная на Западе как Саулот, посвятила себя очищению $pod_cainites$ в рамках «Большого скачка наружу». Но после падения Хао из-под фавора ее собственное положение будет систематически уничтожаться Предками Легиона Неба и Ада, а после неудавшегося убийства на Линь Сяо она предстанет перед победителем Легиона Ма Хай-Ланом. \n\n И в свои последние минуты перед смертью она могла только смеяться, увидев одноглазый взгляд дьявола, когда она встретила суд."
 POD_persistentpodlore.desc.793465:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nСамый странный член двора Хао Вэй Ляна, тот факт, что среди него есть [Glossary('пенангаллан','podgloss.penangallan')], является шоком. Но заблудший ученик изгнанного предка Титква нашел важное место во дворе Хао.\n\nХаяти родилась в Малайзии, Ткачиха, не имевшая ни славы, ни внимания, по крайней мере, до самой смерти, где ее посредственная жизнь обрекла ее на ад без денег. Дезориентированная и напуганная тем, что это станет поводом для проклятия, Хаяти сделала все возможное, чтобы попытаться разобраться в вещах; единственное, что в конечном итоге могло иметь смысл, - это приобретение богатства.\nИтак, она накопила все, что могла, в пустынном пространстве и, наконец, смогла подкупить свой путь ко Второму Дыханию. И благодаря этому опыту она стала удивительно умелой в управлении деньгами, тратя каждую монету.\nИ хотя первоначально ее наставником был [Glossary('пенангаллан','podgloss.penangallan')] Титква, Хаяти была странной ученицей, гораздо больше сосредоточенной на деньгах и стабильности, а не на сексе и насилии, но с тем же диким рвением, которого можно было бы от них ожидать.\n\nПосланная разобраться с послами в Цзинсинань, Хаяти обнаружила, что Хао Вэй Лян была гораздо более способным предком, поэтому она просто никогда не уезжала. Она стала критически важной, помогая ему с переводами и ориентацией в политике Юго-Восточной Азии, и ее проницательность была неоценима, помогая избежать обычного высокомерия, от которого страдали их отношения.\n\nБудущая судьба\nВ конце концов, Хаяти станет основным связующим звеном Квинконкса с пониманием Золотых Дворов. И когда Хао осуществит «Большой скачок», Хаяти станет их главной нитью, ведущей в Австралию.\nОднако их растущий конфликт с более сосредоточенным на себе Легионом Небес и Ада означал бы ее возможную гибель, поскольку ее обвиняли бы в связях с Золотыми Дворами, а ее возможное осуждение положило бы начало цепочке домино, которая привела бы к провалу Большого скачка наружу и катастрофе Векового восстания."
 POD_persistentpodlore.desc.793466:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\n. Хотя дворы Цзинсинаня менее ориентированы на дворовую культуру, они по-прежнему ценят правильное дворовое строительство и политику. Но все же бывают случаи, когда им приходится посылать кого-то для сложных переговоров с другими судами. И Сяоэ мастерски проплетает эти нити. \n\nАктриса по жизни, Сяоэ всегда отличалась умением понимать людей. Открывать двери и расчищать пути к их успеху она всегда хорошо умела. \nЕе обаяние помогло ей избежать ада соли и железа, а ее настойчивость сделала ее легким членом-основателем Прыгающих Гиббонов, особенно в качестве первой ученицы Хао. И поскольку ходят слухи о грядущих масштабных переменах, ее услуги будут необходимы сейчас больше, чем когда-либо. \n\nБудущая судьба\nСяо'э увидит крах Августовских дворов и благодаря своему влиянию укрепит себя и Хао в качестве основных членов Квинкункса. \n\nПланируя то, что впоследствии станет Большим Скачком наружу, Сяоэ сыграл решающую роль в их успехе. Однако ее сосредоточенность на загранице сделала ее врагом для многих, и как только стало ясно, что именно она открывает двери, однажды ночью ее встретил ужасный конец, когда Демон Бык Легиона Небес и Ада приветствовал ее с молотом в руке."
 POD_persistentpodlore.desc.793467:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nХотя немногие голодные мертвецы покидают ад содранного заживо с любовью к лордам [UmbraGlossaryLocalized('yomi_wan','ады Йоми')], Сяовань выделяется среди них даже своей ненавистью. Ее убежище усеяно телами содранных грешников и дьяволов, усыпанными кровью и жилами нечестивцев, пока она ждет в центре, размышляя о зле, которое еще впереди. \n\nСяован - один из первых учеников Хон Ли, и, безусловно, его самый компетентный и верный ученик. Даже ее воспоминания о смертности были сожжены песками Тысячи Преисподних, и все, что горело в ней, - это непреклонная ненависть к дьяволам, желание увидеть, как они истекают кровью, и сила воли, чтобы противостоять даже [Glossary('Императора демонов','podgloss.demonemperor')] с обнаженными зубами и мечом в руке. \n\nОна не обращает внимания на слова предков или лордов, вместо этого собирая свои экраны и учеников в своих собственных войны, ее собственные кровавые чистки против гнили, пробирающейся в суды. \nУ нее ничего нет, поэтому она будет отказывать [Glossary('повелителей Яма','podgloss.yamaking')] во всем, как и они поступили с ней. Простой, жестокий и прямой путь, по которому ей следует идти. На самом деле, единственный, кто у нее остался.\n\nБудущая Судьба\nСяовань на какое-то время убьет многих [akuma|E], но с образованием Квинкункса ее наглые акты насилия в конечном итоге станут слишком смелыми и разрушительными, чтобы Квинкунсы могли их терпеть. \nВ то время как первая пара [Glossary('ву','podgloss.wu')] Отправленная встретила жестокий конец, ветеран войны Анда и бывший огр из воинов равнин Хэбэй Мапо положила конец своей ереси раз и навсегда."
 POD_persistentpodlore.desc.793468:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\n. Чтобы эксперимент с Деревней Трех Гор проходил правильно, за законами, установленными Ван Пином, должна стоять некоторая угроза. Слишком уж настоящее проклятие, которого им следует опасаться. Повод искать мирную, но скучную жизнь.\n\nЮцю более чем жаждет стать этим дьяволом.\n\nЮцю был уроженцем деревни, хотя и регулярно занимался бандитизмом и ужасными актами насилия. Даже в своем преклонном возрасте и размерах он очень хотел командовать своими сыновьями во время грабежа небольших мест, изобилующих, и прожил долгую и жестокую жизнь, по крайней мере, до тех пор, пока однажды ночью девушка не вернулась из мертвых и не раскрыла его. \n\nОсужденный [UmbraGlossaryLocalized('yomi_wan','ад Йоми')] Ланки, он оказался в своей стихии, возраст и его жестокость не уменьшились. Он поглотил множество ракшасов и взял нескольких в жены, пока однажды ночью одному Раване он наконец не надоел и он не изгнал его обратно в мир живых, где бывшая жертва, а теперь хозяин, его убийца, сломила его. \n Что именно она с ним сделала, неизвестно, но он определенно вышел хуже. Он стал ее железной перчаткой, двигателем террора и страха для тех, кто сопротивлялся их реформам. И с детьми и жизнями мужчин, которые сопротивляются, а также с телами и глазами женщин, которые бросают вызов, он не мог быть более счастливым и более довольным. \n\nБудущая судьба\nЮцю стал бы весьма эффективным в своей роли, возможно, даже слишком.\nВ конце концов деревня забыла своих монстров, поскольку они повиновались, и после отсутствия Ван Пина другие смотрители не видел больше причин терпеть монстра, так близкого к проклятию. Итак, он оказался в ловушке в бронзовом чайном тазике, и жители деревни отдыхали спокойно, пока его последние крики убаюкали их одной незабываемой ночью."
 POD_persistentpodlore.desc.793469:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nХотя врачи призваны исцелять, а не причинять вред, после его смерти Цзунмин непреклонен и продолжает следовать этому принципу. Скорее, теперь он понимает, что исцеление нечестивцев причинит больше вреда, чем исцеление, поэтому обязанность врача, когда он поставлен перед ним, - исцелить мир, отсекая заразу их зла прямо здесь и сейчас. \n\nЗонмин из своей смертной жизни был врачом, приговоренным к смерти в аду за то, что пощадил серийного убийцу и исцелил его. \nВ аду перевернутых грешников эта истина была вбита в него обоих, метафорически и буквально, когда его хлестали и содрали кожу кнутом, сделанным из зубов жертв серийного убийцы. Наконец, он принял истину и в этот момент был освобожден из ада, освобожден без каких-либо дел. \n\nZongmin, восприняв откровение внутренне, был довольно расстроен ранними ночами и был отправлен к Предку Хону Ли для обучения. \nZongmin, возмущенный бездействием суда, вполне поверил его слову и стал одним из его пылких и ревностных ученики. Он решил подчиниться Жгучим Ветрам, пожирая души убийц и используя их энергию для исцеления добродетельных больных. Так сказать, балансирует баланс. \n\nУ него много работы."
 POD_persistentpodlore.desc.793470:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nОдин из самых загадочных учеников Хон Ли, Юши не знает слов, следуя по пути своего наставника. В письме он сказал, что он из ада соли и железа и до этого мало что знает. Но судя по тому, что он там узнал, он не может терпеть Присутствие судов за то, что они сделали.\n\nХон Ли был не из тех, кто смотрит в глаза дареному коню. Немой Юши стал чем-то, вызывающим страх среди его учеников, как тихая угроза, которая всегда стремилась действовать от имени Хон Ли, будучи при этом радикально набожным приверженцем своего пути.\nЮши стал специализироваться на убийствах павших членов Судов, что не приносит конца ярости со стороны основных Судов, но от чего они были отвлечены растущей угрозой [Glossary('Анда','podgloss.anda')].\nНе из тех, кто может сидеть сложа руки, Юши с тех пор начал охоту на безумцев-гедонистов из-за растущей угрозы, исходящей из двора Алого Феникса. Сможет ли он добиться успеха, пока неизвестно..."
 POD_persistentpodlore.desc.793471:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nОдна из самых молодых, но самых фанатичных учениц Хон Ли, Айцинь была довольно уникальной среди Голодных Мертвецов, поскольку ее собственный Ад был более широким гобеленом самих Тысячи Адов, а не отдельным. Прикованный к Странствующему Повелителю, он превратил ее память в память оракула. И там бы она и осталась, если бы не предвидела разрыв своих цепей и не воспользовалась этим для побега.\nИ из всех наставников, которые могли ее найти, именно Хон Ли правильно привел ее в Ночной мир.\n\nОднако Айцинь сохранила свои пророческие способности: у нее постоянные вспышки теней с окровавленными ртами и поднятыми ножами, а за ними - обугленный трон, на котором стоял обугленный кровавый бог.\nАйцинь непреклонен в том, что кошмарной фигурой может быть [Glossary('Императора демонов','podgloss.demonemperor')], и настаивает на том, что они должны быть готовы противостоять им.\nС этой целью Хон Ли позволяет Айцину быть глазами своей секты, наблюдая за этими дьяволами. И по мере того, как она начинает находить все больше и больше информации о загадочных вампирах-убийцах, ее опасения становятся все более и более реализуемыми.\n\nБудущая судьба\nВ конечном итоге Айцин станет главной силой, которая приведет секту Хон Ли в современный Афганистан, и ее видениям еще больше придаст вес возвращение Ур-Шульги.\nПо мере приближения Шестой Эпохи Жгучие Ветры, возможно, нашли один из возможных [Glossary('Императоры демонов','podgloss.demonemperor')].\nНо будут ли они готовы? Айцин не знает, поскольку все ее видения заканчиваются перед битвой."
 POD_persistentpodlore.desc.793472:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nУмикана мало что помнит о своем прошлом. На самом деле, она толком не знает, кем стала. У нее есть смутные воспоминания о смерти, об ужасном месте, а затем о возвращении и превращении в едва разумного монстра. Она не знает, как долго она оставалась в этом состоянии, но опасается, что могли пройти десятилетия, если не больше, прежде чем ее разум (с трудом) пришел в себя. \n\nЕе первое осязаемое воспоминание после этого печального состояния - это храм Амамикью и молящиеся там жрицы норо. У нее есть подозрение, что это могло быть ее спасением, возможно, открытием глубинных воспоминаний о ее прошлом, которые позволили ей немного исцелить себя. \n\nКак бы то ни было, с тех пор Умикана медленно изучает свое новое состояние. Она также встречала других подобных ей, но большинство из них были потеряны и были такими же безмозглыми монстрами, как и она. Она до сих пор не знает, следует ли ей избавить их от страданий, прежде чем они причинят вред другим, или дать им шанс спастись, как это сделала она.\nДо сих пор она была слишком озабочена собственным состоянием ума, чтобы действовать, но по мере того, как ее понимание растет, растет и ответственность, которую она чувствует за защиту Рюкю.\n\nБудущая судьба\nС приходом китайцев, а затем и японцев, Умикана узнает, кто она. Напряженность в отношениях с высокомерными чужаками будет нарастать до тех пор, пока она не провозгласит себя предком Рюкю, чтобы отвергнуть их. \nХотя ее усердных усилий по сохранению независимости своего острова, играя Суды друг против друга, на какое-то время будет достаточно, наступит момент, когда японскому Бишамону просто надоест неуважение \"Окинавы\"..."
 POD_persistentpodlore.desc.793473:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nСурьявати считается старейшим $pod_kueijin$ на островах Малуку, хотя, по правде говоря, она знает, что эта история была написана победителями. Она едва выбралась из ада, когда двор Алого Феникса впервые вступил в контакт с островами, нашел правящего мужчину $pod_kueijin$ \"wanting\", предал их мечу, а затем начал \"цивилизовать\" выживших в [Glossary('дхармы','podgloss.dharma')], включая ее. \nСурьявати была откровенно посредственной (хотя и веселой) ученицей, но она была местная женщина, которая не сопротивлялась Алому Фениксу, которого было достаточно, чтобы назначить ее Предком островов, вернуться на свои корабли и быстро снова забыть о Малуку. \n\nСурьявати разместила свой центр власти в Нуса-Исе (\"Материнский остров\"), чтобы заработать хоть немного престижа, который она могла, и начала ее несколько жалко (и нежелательная) правит очень ограниченным числом $pod_kueijin$ ее \"domain\". Поэтому неудивительно, что она стала ленивой правительницей, которой большинство даже не доверяет. \n\nХотя некоторые представители молодого поколения говорят о столь необходимых переменах, особенно учитывая, что во дворе Алого Феникса слишком большой беспорядок, чтобы вмешиваться, реальная угроза заключается больше в растущем Присутствии [akuma|E], которое использует это слабое правило для процветать.\n\nБудущая судьба\nСурьявати выдержит надвигающийся шторм вокруг основания Золотых Дворов, оставаясь по сути неуместным. Потеряв ту небольшую светскую власть, которую она оставила новому поколению правителей, она станет чем-то вроде всеми любимой странности островов, добродушного и симпатичного старейшины, способной рассказать множество ярких историй."
 POD_persistentpodlore.desc.793474:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nЛюбящая жена рыбака Дара бросилась в море, когда знала, что ее любимый не вернется после ужасного шторма. Оказавшись в [UmbraGlossaryLocalized('yomi_wan','ад Йоми')] Хине-Нуи-Те-По для тех, кто покончил жизнь самоубийством в Тихом океане, она пришла в ярость, увидев, что ее акт любви обернулся против нее. Хотя Ад ожидал, что она погрязнет в ненависти к себе, вместо этого она сопротивлялась на каждом шагу, в конечном итоге прорвавшись и снова вернувшись в мир как $pod_kueijin$.\n\nДара находил организацию двора Малуку (или ее отсутствие) в лучшем случае раздражающей, а в худшем — тревожной. Ее призывы к реструктуризации и решительным действиям против растущей угрозы [akuma|E] остались без внимания, и ее терпение на исходе.\n\nБудущая судьба\nДара будет тем, кто укажет Пияу на Малуку в конце ее чистки. В восторге от таких явных побед, Дара примет Кровавые Цветы Страсти и станет Золотой Королевой Тернате после возвышения этой региональной державы.\nОднако ее отношения с другими дворами будут напряженными, поскольку Дара не будет навязывать матриархат так безжалостно, как другие королевы, некоторые говорят, что из-за ее воспоминаний о своей смертной жизни. Однако эта репутация позволит ей привлекать беженцев из других дворов и даже поддерживать относительно стабильные отношения с прибывшими [Glossary('Аширры','game_concept_ashirra_desc')], а позже и с $pod_cainites$ из Австралии.\n\nПоэтому неудивительно, что Дара выступил против нападения «Большого скачка» на Австралию. Она станет занозой на стороне Сок Кван Сука, лидера вторжения, и ситуация \"стабилизирует\" в холодную войну между двумя могущественными королевами."
 POD_persistentpodlore.desc.793475:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nНикогда не зная своей семьи, Суриани постояла за себя, пока не смогла, и умерла от голода в одиночестве и забвении. Погрузившись в [UmbraGlossaryLocalized('yomi_wan','ад Йоми')] Малавеева, то, что она там увидела, изменило ее до глубины души. Хотя она никогда не рассказывает о том, что именно произошло, ясно, что это является катализатором ее стремления выследить [akuma|E].\n\n. Будучи $pod_kueijin$, Суриани нашла внимательного друга в лице Дары, женщины, которая разделяет ее страсть к справедливости, хотя иногда уклоняется от некоторых из наиболее экстремальных решений, которые она предлагает. Однако Суриани не винит ее, в конце концов, Дара не знала, что она видела. \n Никто из них не знал. \n Без ведома даже своей подруги Суриани теперь планирует отстранить \"Ancestor\" Сурьявати от власти, при необходимости силой. Время компромиссов прошло, если они когда-либо существовали. \n\nБудущая судьба\nСурьяни не успеет реализовать свой план, поскольку чистка Пияу в основном достигнет того, чего она хотела. Однако образование Золотого двора Тернате под руководством Дары вызовет раскол между двумя женщинами. \nСурьяни станет более радикальным и будет ругать Дару за ее расхлябанность, пока не будет достигнута точка кипения, когда прибудут голландцы и их сторонники $pod_cainite$.\n\nОбвинив их в союзе с Малавейово и причиной его внезапного возрождения, Суриани уйдет. \nНападение «Большого скачка наружу» на Австралию приведет к тому, что она возглавит «Бритвенный цветок» [Glossary('ву','podgloss.wu')] во время первых сражений. \nПодписание Сиднейского перемирия и возникшего в результате этого состояния холодной войны приведет к тому, что Суриани снова станет мошенником, а ее [Glossary('ву','podgloss.wu')] станет очень опасным свободным каноном на напряженной политической арене Австралия."
 POD_persistentpodlore.desc.793476:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nКак [Glossary('повелителя Яма','podgloss.yamaking')] тех, кто участвовал в каннибализме или умер от голода, в Малавейово к его [UmbraGlossaryLocalized('yomi_wan','ад Йоми')] часто приходят особо несчастные души. Анангга был одним из них.\n\nСам этот человек не знает, откуда на самом деле взялся его вкус к человеческой плоти. Он просто знает, что ему это понравилось, и он получает от этого еще большее удовольствие с тех пор, как поступил на службу в Малавеово. Хотя он далеко не самый могущественный [akuma|E] на службе у своего господина (даже он не осмеливается приблизиться к испорченным акулам-оборотням, скрывающимся вокруг его хозяина), он мнит себя творческим умом. Хотя в жизни он не был особенно сексистским человеком (в любом случае, каждый может иметь приятный вкус, если правильно подготовиться), он рассматривал подъем матриархального двора Скарлет Феникс и его еще более экстремальные ответвления как возможность.\nВозможно, эти обиженные женщины хотели бы по-настоящему ощутить вкус своей победы над несчастными мужчинами.\nВозможно, им даже понравится этот опыт.\nЕсли да... что ж, он был бы рад пообщаться с ними и обсудить некоторые рецепты, а затем представить их своему господину.\n\nКакой это будет праздник!"
 POD_persistentpodlore.desc.793477:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nДаши не самый опытный, харизматичный или могущественный [Glossary('Анда','podgloss.anda')], что заставляет многих задаваться вопросом, почему именно его выбрали на престижную роль Восточного авангарда орды, а не более известных вампиров, таких как Черные Ветры. Со своей стороны, Даши прекрасно знает причину. Это потому, что он расходный материал.\n\nНесмотря на то, что [Glossary('Анда','podgloss.anda')] долгое время были соседями, они знают пугающе мало о $pod_kueijin$, а их немногочисленные встречи закончились дорогостоящими поражениями.\nС приходом к власти Чингисхана и его смертных монгольских собратьев, которые сейчас штурмуют Китай, времена меняются и открываются новые возможности.\n\nДаши знает, чего от него ждут: узнать как можно больше о нежити Китая, проверить их оборону и дать сигнал начать вторжение, когда придет время... если он к этому моменту еще жив. Ему была предоставлена ​​​​широкая свобода выбора членов авангарда среди других молодых, многообещающих (и расходных) членов [Glossary('Анда','podgloss.anda')]. Он в полной мере воспользовался этим и создал группу опытных специалистов, которая постепенно изучает $pod_kueijin$ больше.\nСлишком медленно для некоторых наиболее нетерпеливых старейшин, но Даши знает, что на кону стоит его голова, а не их. Поэтому он будет дотошным, терпеливым и будет настаивать на действиях только в том случае, если с этим явно непобедимым \"Желтым императорским двором \" китайской нежити произойдет какое-то катастрофическое событие..."
 POD_persistentpodlore.desc.793478:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nКогда Даши начал собирать свой Восточный Авангард, его кровный брат Кетую был очевидным выбором. Эти двое, хотя и очень разные по манере поведения, всегда хорошо работали вместе. Даши — более мрачный и замкнутый человек, поэтому для многих жизнерадостная Кетую является лицом Авангарда. Он даже является лицом [Glossary('Анда','podgloss.anda')] в целом для $pod_kueijin$.\n\nДействительно, дипломатические навыки Кетую использовались, чтобы успокоить Суды $pod_kueijin$ ложным чувством безопасности. Коварный [Glossary('Анда','podgloss.anda')] рад унижаться перед своими так называемыми лучшими, чтобы убаюкать их и заставить игнорировать растущую угрозу на их границах. Он даже настолько преуспел в этом начинании, что его дани стали знаком престижа среди многих дворов, слишком желающих увидеть варваров-иностранцев, преклоняющих колени перед их превосходством с модными и экзотическими безделушками в руках. \nИ хотя они хихикают и унижают его на каждом шагу, Кетую узнает все больше и больше о том, как они думают, действуют и, что более важно, об их слабостях. \n\nКак и его кровь брат, Кетую терпелива и каждое оскорбление принимает с улыбкой. Однако Даши знает, что его брат не забывает и не прощает. \nЕсли однажды ночью [Glossary('Анда','podgloss.anda')] поедет в Китай, $pod_kueijin$, пренебрегавшие им, возможно, наконец-то заметят жестокий и почти расстроенный оттенок, тщательно скрытый за приятной улыбкой Кетую..."
 POD_persistentpodlore.desc.793479:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\n $pod_Embraced$ за пределами линии Йесиры, Сейдж столкнулась с неодобрением традиционалиста [Glossary('Анда','podgloss.anda')] с самого начала своего существования нежити. Едва учтенная ее [Glossary('сир','game_concept_Sire_desc')], которая $pod_Embraced$ ее второстепенная мысль, Сэйдж сбежала на Юг, как только смогла, в поисках свободы и признания своих навыков. \n Вскоре она научилась ненавидеть китайцев $pod_kueijin$ гораздо больше, чем когда-либо своих собратьев [Glossary('Анда','podgloss.anda')]. \n\n Выставлялась напоказ как экзотика (и неуправляемое) животное в судах \"enlightened\" $pod_kueijin$, она проходила от унижения к унижению, пока снова не сбежала. Она вернулась в [Glossary('Анда','podgloss.anda')] как раз вовремя, чтобы Даши увидел в ней полезный актив для Восточного Авангарда, поскольку ее знания (и ненависть) к $pod_kueijin$ имели мало конкурентов среди молодых членов орды. Получив больше уважения и уважения, чем она когда-либо получала с тех пор, как она стала вампиром, Сейдж с радостью согласилась, а перспектива кровавой мести также стала приятным бонусом. \n\nХотя знания Сейдж уже оказались полезными для орды, она все еще обижается на них и предпочитает замаскироваться под мужчину, имея дело с [Glossary('Анда','podgloss.anda')] за пределами Восточного Авангарда. К счастью, она практически не общается с ними и рада позволить Даши и остальным справиться с ними вместо нее. \n\nПоскольку годы идут, а долгожданное вторжение все еще не началось, Сэйдж теряет терпение. Только перспектива быть признанной Черными Ветрами или самой Есирой удерживает ее в узде. \nЕсли ей придется подняться на вершину горы черепов $pod_kueijin$, чтобы добраться туда, тем лучше."
 POD_persistentpodlore.desc.793480:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nКогда перед ним стояла трудная задача возглавить Восточный авангард [Glossary('Анда','podgloss.anda')], Даши знал, что ему нужно делать, и благодаря свободе действий, предоставленной ему из-за стоящей перед ним задачи, он мог даже сойти с рук. Чтобы понять китайца $pod_kueijin$, ему нужен был китаец, которого можно было бы использовать в качестве шпиона.\nЕму потребовались месяцы, чтобы найти потенциального кандидата, довольно мелкого бандита, и обратиться к нему с предложением бессмертия. Даши нуждался в полной лояльности своего будущего шпиона и поэтому не скрывал никакой информации.\nДэйи согласился, и таким образом родился первый китайский [Glossary('Анда','podgloss.anda')].\n\nСпустя некоторое время, чтобы акклиматизироваться, бывшего бандита отправили в малый двор $pod_kueijin$, чтобы он сыграл роль невежественной души, недавно вернувшейся из ада. Хотя Дэй поначалу был не самым убедительным лжецом, полной невозможности китайского $pod_cainite$ было достаточно, чтобы придать его истории атмосферу правды. Так началось его формальное \"education\", изучение [Glossary('дхармами','podgloss.dharma')], Пяти Августейших Дворов, [Glossary('повелителей Яма','podgloss.yamakings')] и многого другого.\n\nДейи знал, что лучше не испытывать удачу, и когда пришло время назначить ему подходящего наставника, он сбежал и вернулся в [Glossary('Анда','podgloss.anda')]. С тех пор он проник в еще два двора и усовершенствовал свои актерские способности.\nОднако по мере того, как его мастерство растет, растут и его амбиции. Хотя Даши остается уклончивым, Дейи теперь понимает, что его никогда по-настоящему не примут ни в [Glossary('Анда','podgloss.anda')], ни в $pod_kueijin$, если уж на то пошло.\n\nТаким образом, он обдумывает свои варианты, прекрасно понимая, что в данный момент они весьма ограничены."
 POD_persistentpodlore.desc.793481:0 "Этот персонаж является частью $pod_wod$, но имеет очень ограниченную биографию. Поэтому разработчики PoD расширили её для придания большей глубины сеттингу.\n\nСок Кван Сук всегда была амбициозной женщиной, мечтавшей совершить впечатляющие подвиги в юности. К сожалению, нормы того времени и ее бедное прошлое означали, что только брак с борющимся торговцем мог помочь ей подняться. Еще печальнее то, что смерть при родах еще больше ограничила ее амбиции. \n\nОказавшись в [UmbraGlossaryLocalized('yomi_wan','ад Йоми')], который заставлял ее снова и снова облегчать травму своей смерти, Сок решила сражаться и сумела сбежать. Возвращение в качестве $pod_kueijin$ и ее первый опыт работы в Судах были волнующими моментами, поскольку ее пол больше не был проблемой, и казалось, что при должном обучении и усердии она, наконец, сможет добиться всего. \nТеперь, почти столетие спустя, фаза медового месяца Сок с ее новым состоянием давно прошла, и она понимает, что восхождение к вершине в бессмертном обществе может занять буквально вечность. Сейчас она наблюдает за ослаблением Двора Лазурного Дракона в поисках возможности найти какой-нибудь короткий путь.\n\nБудущая судьба\nСок какое-то время будет процветать в хаотическом повороте эпохи, но ему придется уйти в отставку во время формирования Зеленых Дворов.\nУзнав о формировании жестоких и раздробленных Золотых Дворов в Юго-Восточной Азии, она присоединится к битве и разделает \nОстальные [Glossary('пенангаллан','podgloss.penangallan')] будут уважать ее мастерство, но потребуют, чтобы она стала одной из них, прежде чем ее примут. \nОна сделает это и станет самостоятельной уважаемой королевой с прочными контактами с Кореей. \n\nЭта должность завершится тем, что ее выберут возглавить атаку Суда на Австралию. Она добьется сильных первых успехов, разделив и завоевав там $pod_cainites$, хотя ситуация еще долго будет оставаться неразрешенной."
 POD_persistentpodlore.desc.793482:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nГван Хва едва был молодым человеком, когда генерал Аджаге проезжал через его город, чтобы завербовать местных жителей. Вдохновленный харизмой этого человека, его плохим прошлым и очевидным желанием помочь людям, Кван Хва тут же присоединился к нему. \nПодобный трепет не принес ему никакой пользы, когда он получил стрелу в лицо во время своего первого сражения. \n\nВ хаотичном [UmbraGlossaryLocalized('yomi_wan','ад Йоми')] на Ланке Кван Хва становится свидетелем и участвует в большем количестве войн, чем он когда-либо хотел, в течение нескольких жизней и каждой отдельной жизни. одно из этих сражений было напрасным. В конце концов его выбросили, когда его дух был полностью исчерпан и, таким образом, стал бесполезен для враждующих демонов. \n\nКак $pod_kueijin$, Кван Хва восстановил себя и нашел утешение в строгих постановлениях, которые контролировали суды. Тот факт, что генерал Аджаге почти не стал исторической сноской, также положил конец его оставшейся юношеской энергии. Кван Хва стал хорошо воспитанным студентом, а затем уважаемым членом традиционалистов, которые смирились с вмешательством двора Желтого императора Китая в дела Кореи. \n\nГван Хва устал от конфликтов и раздоров, но он не дурак. Власть императора Сяо в лучшем случае шаткая, и нынешние смутные времена могут создать серьезные проблемы для Кореи. Таким образом, в последнее время он начал смещать свою позицию в сторону более центральной позиции, пытаясь выступать в качестве посредника между различными фракциями. \n\nБудущая судьба\nГван Хва окажется решающей в упорядоченном переходе от двора Лазурного Дракона к Зеленым дворам. Действуя как голос разума и не имея желания захватить власть для себя, он поможет в мирной реорганизации, прежде чем стать уважаемым региональным Предком. \nЕго отсутствие воли к прямым действиям и общее примирительное отношение, однако, сыграют важную роль в репутации Зеленых Дворов как безопасного убежища для многих сомнительных персонажей."
 POD_persistentpodlore.desc.793483:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nВыбранная в качестве одной из вонхва, женщин-воинов Кореи VI века, Джи Со с гордостью взялась за свою роль, научившись обращаться с луком и мечом. Распад группы от стыда еще до того, как она увидела поле битвы, стал для нее ударом, и она решила стать странствующим воином, чтобы помогать людям. \n Вскоре она поняла, что в рассказах это работает лучше, поскольку ее навыки не могли сравниться с превосходящим количеством бандитов, и она понесла ужасную смерть. \n\nАд, когда сдирают шкуру заживо, не был добр к Джи Со. Она обнаружила, что ей не хватает боевых навыков, чтобы победить множество демонов, и ей пришлось прибегнуть к коварной тактике, чтобы сбежать. В глубине души она хранит тревожную интуицию о том, что вместо этого ее могли бы отпустить. \n\nКак $pod_kueijin$, Джи Со, естественно, тяготела к Дьявольским тиграм и еще раз оттачивала свои навыки, хотя отсутствие угрозы [akuma|E] в Корее означало, что это снова оставалось в основном теоретическим. Шли столетия, ее репутация росла, и она удостоилась чести быть выбранной телохранителем Императора Лазурного Дракона. Несмотря на то, что Джи Со, безусловно, смирилась с этим предложением, она не могла избавиться от ощущения, что это означает, что она снова станет церемониальным воином. \nПоскольку двор Лазурного Дракона ослабевает, а напряженность в отношениях как с китайским, так и с японским дворами растет, Джи Со втайне надеется, что наконец-то придет время для нее доказать свои навыки на поле битвы. \n\nБудущая судьба\n мирный переход к Зеленым дворам снова помешает Джи Со. Хотя многие Предки будут просить ее об услугах, она откажется от каждого предложения и покинет политическую сцену. \nЛегенды будут говорить, что она вернулась в [UmbraGlossaryLocalized('yomi_wan','ад Йоми')], чтобы сражаться против [Glossary('Тоу-Му','podgloss.toumu')]. Другие, более окутанные слухами, говорят о том, что вместо этого видели ее вместе с силами Железной Императрицы..."
 POD_persistentpodlore.desc.793484:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nБо Хуэй родилась во времена «Генерального протектората по умиротворению Востока», который китайская империя Тан учредила в Корее. Китайское присутствие стало для неё наглядным уроком сложных взаимоотношений силы и слабости. Сама она не участвовала в политической борьбе, но внимательно слушала новости и делала собственные выводы. Когда власти узнали о её «вмешательстве», это стоило ей жизни и лишь укрепило её новые убеждения.\n\nБо Хуэй не рассказывает, что ей пришлось сделать, чтобы выбраться из Ямы соли и железа, но ясно, что гордиться ей нечем. Вместо этого она с головой погрузилась в политику $pod_kueijin$ — по мнению некоторых, в ущерб собственному просветлению — и вступила в игру при первой же возможности.\nТо, что при дворе Лазурного дракона преобладают китайские интересы, напоминает ей о смертной жизни. Хотя она не питает глубоких убеждений относительно независимости корейских дворов, Бо Хуэй сделала ставку на это движение и возглавила оппозицию.\nНа этом посту она редко добивалась успеха, но нынешняя политическая обстановка обещает новые возможности: дворы начинают проявлять первые признаки слабости.\n\nДальнейшая судьба\nБо Хуэй будут считать «победительницей» перехода к Зелёным дворам. Как лидер корейской фракции, она добьётся мирного обретения независимости от Китая и разрыва связей с Японией.\nНа деле она могла бы добиться гораздо большего, но перспектива править в качестве «Зелёной императрицы» мало её привлекала. Разобщённые Зелёные дворы, ставшие нейтральным перекрёстком путей под слабой «властью» совета предков, устраивали её гораздо больше.\n\nВедь играть уже неинтересно, если победа осталась позади."
 POD_persistentpodlore.desc.793485:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nЙонг Чанг, благодаря своему опыту решения денежных проблем уважаемого $pod_kueijin$, всегда знал, что ад очень реален. Однако даже его живого воображения было недостаточно, чтобы подготовить его к этому. \n\nСделанный примером соперника своего хозяина, Ён оказался в аду, когда с него сняли шкуру заживо, и ужасы, которые он там пережил, сломили его. Пообещав, что он сделает все, чтобы его освободить, демоны отпустили его, предупредив, что в тот или иной момент они придут забрать деньги. \n\nКак $pod_kueijin$, Ёнг движим страхом вернуться в [UmbraGlossaryLocalized('yomi_wan','Йоми')], и поэтому он начал использовать свое острое чутье в поисках финансовых возможностей, чтобы найти союзников, заслужить благосклонность и в целом сделать себя максимально полезным, чтобы не нажить врагов. В настоящее время он инвестирует в развивающийся рынок ритуального нефрита, что может открыть ему новых клиентов за пределами Кореи. \n\nБудущая судьба\nЙонг будет процветать в будущих Зеленых дворах, даже сыграв свою роль в названии их своим ритуальным рынком нефрита, который превзойдет его самые смелые мечты. \nК удивлению многих, Ён не станет по-настоящему богатым благодаря своему торговли, поскольку его цены всегда ниже ожидаемых. Со своей стороны, отец Джейда \"\" отшутится над этими опасениями и скажет, что он ищет только новых друзей, а не новых клиентов. \n\n Однако каждый раз, когда кто-то новый входит в его владения, можно увидеть, как Ён на мгновение вздрагивает, как будто в ужасе ждет необъявленного клиента..."
 POD_persistentpodlore.desc.793486:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nРухуи — человек, который знает себе цену. Хотя некоторые скажут, что его смертная жизнь как младшего сына дворянского клана дала ему преувеличенное представление об этом. \n\nКак $pod_kueijin$, Рухуэй хотел кратчайшего пути к значимости, и поэтому его раздраженный наставник указал ему на Общество свержения дьявола, группу молодых бессмертных, призванных держать под контролем рушащиеся суды (или в некоторых случаях торопящие их рушиться). \nСмакуя воспользовавшись этой возможностью, Рухуэй нацелился на Северную Корею, где власть Двора Лазурного Дракона была ослаблена из-за беспорядков в Пхеньяне, Рухуэй возглавил группу других недовольных и создал в этом районе свое собственное феодальное владение. \nХотя это можно было рассматривать как акт войны между двором китайского Желтого Императора и корейским двором Лазурного Дракона, тот факт, что Рухуэй действовал под знаменем Общества свержения дьявола, дал ему политическую неприкосновенность и его захват стал свершившимся фактом. \n\nРухуэй сейчас собирает свои силы для похода на сам Пхеньян, поскольку его новый Предок также считается выскочкой и вряд ли получит помощь от крупных дворов. \n\nПосле этого... что ж, если весь двор Лазурного Дракона нужно свергнуть, чтобы уступить место новой эпохе, Рухуэй готов стать этим человеком возвещая это. И заканчиваем сверху.\n\nБудущая судьба\nВо время создания Зеленых Дворов Рухуэй попытается превратить ситуацию в хаос. Однажды ночью он получит предупреждение не делать этого от существа, известного как Теневая Марионетка. \nПосле того, как он проигнорирует это предупреждение и в ночь, предшествующую его призыву к оружию, прах Рухуи будет найден разбросанным по письму с предупреждением."
 POD_persistentpodlore.desc.793487:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nA. Давным-давно Токико выпала сомнительная честь быть одной из первых душ, заключенных в тюрьму молодым и амбициозным [Glossary('повелителя Яма','podgloss.yamaking')], [Glossary('Микабоши','podgloss.mikaboshi')]. Демон, в каком-то смысле, был гораздо более откровенен в своих целях в эти годы становления, и Токико видел все это: бездушную рутину сводящего с ума общества, которое исказило бы человечество, превратив его в не более чем инструменты в его руках. Она поклялась бороться с этим всем своим существом и никогда не колебалась в этом обещании. \n\nКак $pod_kueijin$, Токико быстро прогрессировала, становясь уважаемым Предком Бишамонов и даже несколько раз представителем Японии во дворе Лазурного Дракона. Ее усердие в охоте на [akuma|E] было высоко оценено, и она сама много раз выходила на поле боя. Многие охотники на демонов Бишамона до сих пор используют ее тактику, хотя сегодня никто не признает этого открыто. \n\nНесмотря на эти победы, Токико повсюду видела признаки подъема [Glossary('Микабоши','podgloss.mikaboshi')]. Растущие города, новые изобретения и философии, изобретенные человечеством, были для нее коварными орудиями врага. Когда она обнаружила, что [Glossary('Микабоши','podgloss.mikaboshi')] поймал в ловушку могущественную группу странных существ по своим приказам, она предупредила весь двор и сплотила всех союзников, которых могла. \n\nЭто закончилось погоней за дикими гусями, эти существа были скользкими, и кроме имени \"Kagaseo\", Токико нечего было ей показать. работа.\nОднако она не остановилась и вскоре изолировала себя в том, что другие считали растущим параноидальным безумием. Именно когда она наконец подтвердила существование Великого Клана \"\", но не смогла противостоять им самостоятельно, она приняла самое важное решение в своей жизни. \n\n Следующей ночью Токико вошла в [Glossary('Какури','podgloss.kakuri')] и была принята [Glossary('Эмма-О','podgloss.emmao')] с уважением и почестями. \n\nЭтой ночью \"Даймё Темных \" обрел своего самого фанатичного и преданного [Glossary('шикоме','podgloss.shikome')], и ему даже пальцем не пришлось пошевелить."
 POD_persistentpodlore.desc.793488:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\n. Было время, когда Судья Баланса Йен-Ло руководил душами справедливых и сострадательных. Его благородное поведение было воспринято как оскорбление другими [Glossary('повелителей Яма','podgloss.yamaking')], которые жаждали многих душ, которые они могли развратить в царстве Йен-Ло. Таким образом, под предводительством [Glossary('Эмма-О','podgloss.emmao')] они вторглись на его территорию и поразили его. Но триумф, которого они ожидали, был недолгим, у Йен-Ло был рычаг мертвеца, и они были выброшены из его царства, которое запечатало себя навсегда. \n\nЕдва избежав испытания, [Glossary('Эмма-О','podgloss.emmao')] был разгневан тем, что ему нечего было показать в качестве своей победы, когда он заметил, что в мимолетный момент между смертью Йен-Ло и закрытием этого царства некоторые несчастные души ушли в сторону. друг от друга.\nВыслеживая их, он смог поймать только одну, и это была самая милая душа, которую он когда-либо видел. В конце концов, Йен-Ло приютил добрых и сострадательных людей, а истинная чистота была действительно редким зрелищем. \n\nИзолировав себя в глубинах Кюкен-но Какури, [Glossary('Эмма-О','podgloss.emmao')] появился только тогда, когда он закончил, в сопровождении той, которую он назвал Киёко, первой из его [Glossary('шикоме','podgloss.shikome')].\n\nС тех пор каждый сикомэ был создан по образцу Киёко: тихий, бесчувственный и ледяной хитрый. Однако ни один из них по-настоящему не превосходит тот, который Эмма-о считает своим шедевром, скорее всего, из-за того, что он называет исходным материалом \"\", то есть чистотой первоначальной души. \n\nОднажды ночью, когда он становится [Glossary('Императора демонов','podgloss.demonemperor')], Эмма-о знает, что он сможет снять печать Йен-Ло и, наконец, иметь возможность создать армию более могущественных и усовершенствовал [Glossary('шикоме','podgloss.shikome')], чтобы он служил ему вечной Шестой Эпохой..."
 POD_persistentpodlore.desc.793489:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nХотя [Glossary('Какури','podgloss.kakuri')] представляет собой адски пустынный ландшафт для большинства замученных там душ, это не относится к людям айнского происхождения. Даже по сей день [Glossary('Эмма-О','podgloss.emmao')] серьезно относится к своей роли бога мертвых айнов, и поэтому к ним относятся с уважением и заботой, прежде чем их ведут в подземный мир их предков, где справедливые и сострадательные из них могут рассчитывать на мирную загробную жизнь. Однако иногда душа сопротивляется этому предложению. Так было и с Пиркой.\n\nЭта женщина, чувствуя себя беспокойной даже после смерти, предпочла скитаться по королевству вместо того, чтобы принять свою награду. Ей не потребовалось много времени, чтобы увидеть, что [Glossary('Эмма-О','podgloss.emmao')], хотя и уважает свой народ, стала безумно развращенной и развращенной во всем остальном. Защищенная своим иммунитетом айнов, она вошла в его владения и обратилась к нему за ответами. \n\nУдивленный, [Glossary('Эмма-О','podgloss.emmao')] проявил терпение, почти отеческую заботу и выслушал. И тогда он рассказал ей все. Медленная смерть их народа, безумная реальность других [Glossary('повелителей Яма','podgloss.yamaking')], беспечных и равнодушных [Glossary('Нефритового императора','podgloss.augustpersonageofjade')]. Пирка поняла, но не согласилась полностью и отказалась позволить Эмма-о сопровождать ее в подземный мир айнов. Вместо этого она решила поступить к нему на службу. \n\nВернувшись как [akuma|E], отношения Пирки с Эмма-о с тех пор стали сложными. Она надеется стать его моральным компасом, когда он взойдет на трон [Glossary('Императора демонов','podgloss.demonemperor')]. [Glossary('повелителя Яма','podgloss.yamaking')], со своей стороны, не знает, как с ней действовать, и до сих пор позволял ей делать свое дело, хотя всегда с группой [Glossary('шикоме','podgloss.shikome')] рядом, чтобы обеспечить ее защиту."
 POD_persistentpodlore.desc.793490:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nИэко всю свою жизнь злилась. Злилась, что ее называли уродливой, когда она была маленькой. Злится, что его принуждают к браку без любви со старым скотом. Злится, что ее казнили за то, что она защищалась от него.\nДаже смерть не принесла ей покоя, поскольку ей суждено было [Glossary('Какури','podgloss.kakuri')].\n\nОбъединившись с другими душами, затерянными в этом темном царстве, она на мгновение подумала, что побег возможен, пока группа не встретила своего первого [Glossary('шикоме','podgloss.shikome')], и мужчины мгновенно набросились на нее из \"love\" для существа. Оставленная гнить на пустынном песке, она бы сдалась, если бы не вмешательство Дзидзо-Босацу. \n\nСтранный и добрый старик поднял ее обратно и научил ее укладам мира, [Glossary('повелителей Яма','podgloss.yamaking')], ее потенциалу вернуться в качестве $pod_kueijin$ и просветлению, которого можно достичь там. Иеко прислушался, но также заметил, что путешественник напугал [Glossary('шикоме','podgloss.shikome')] и даже самого [Glossary('Эмма-О','podgloss.emmao')]. Это была та часть, которая интересовала ее больше всего. \nДжизо хранил молчание по поводу истины, однако это сильно раздражало Иэко. Это было великое существо, очевидно способное все исправить, и какова была его цель вместо этого? Школа потеряла души, пройдя долгий и трудный путь, который \"может\" привести к чему-то хорошему в конце. \n\nИх отношения так и не восстановились после этой ссоры, Иэко никогда не видел смысла избегать прямых действий, которые могли бы помочь вещам сейчас, а не столетия в будущем. В конце концов их пути разошлись, но не раньше, чем Дзидзо показал ей способ сбежать. \n\nИэко оставалась там долгое время, глядя на дверь во внешний мир и, очевидно, на столетия изнурительного Дхармического просветления, которое ее ждало, скорее всего, с добавленным клеймом новичка. В конце концов, она развернулась и вместо этого вошла в замок Эмма-о, Кюден-но Какури.\n\nКогда она появилась, самая младшая [Glossary('шикоме','podgloss.shikome')] была готова предпринять решительные действия ради своего господина."
 POD_persistentpodlore.desc.793491:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nДля того, кто утверждает, что он бог, Голодные Мертвецы, которых теперь зовут Хари, на самом деле не выглядят подходящими. И среди изуродованного солнцем и физически слабого советника, обычно скрывающегося в тени Индры-гхи, нет более грозного разума, которым располагает Небесное Племя.\n\nХари родился в Чутском царстве, и с рождения его странное телосложение считалось зловещим. Бледный, анемичный и на протяжении всей своей жизни едва способный к большой работе, он, тем не менее, с юных лет был ошеломляюще умен и способен с ранних лет заниматься высшей математикой и религиоведением. Его родители, желая, чтобы он добился определенного прогресса в качестве мелкого землевладельца, отправили его учиться в Наланда Махавихару в надежде, что у него будет шанс совершить что-то великое.\nОн учился там и очень увлекся этим, имея большие способности к наукам, искусствам и религиям, но, к сожалению, когда он возвращался домой, однажды ночью он был убит, поскольку, пробудившись к силам, дремлющим во всех смертных, он был унесен молнией, созданной им самим, и был приговорен к аду злой магии. И в этом Аду ему стало горько. Яростный. Осужденный как Маг, когда он был им, всего на минуту зажег в нем другой огонь.\nОн прорывался из ада, как призрак, пока, наконец, не вернулся к жизни и не был найден Небесным Племенем. И, слушая, как они объясняют вещи, у него, по крайней мере, была причина. И кто-то виноват.\n\nХари — один из немногих людей в мире с высшим образованием, умный, целеустремленный и готовый к этому. Слишком физически слабый, чтобы напрямую противостоять большинству угроз, он превратил тонкую войну в искусство. Еще будучи молодым, он художник лжи, далекий от боли, которую причиняет, и достаточно мудрый, чтобы знать, когда нужно быть кротким, и он может поднять Небесное Племя на новые высоты.\n\nБудущая судьба\nХари будет быстро продвигаться вперед в [Glossary('дхармы','podgloss.dharma')] как Бог, который устраняет сопротивление Небесного Племени, но никогда не перегибает палку. В конце концов он превзошел своего наставника Индру-гху в Дхарме, но исчез вскоре после Недели Кошмаров.\nОн видит последнее большое препятствие на пути восхождения Небесного Племени, и его роль — устранить его. Поэтому он исчезает, готовясь к тому моменту, когда Небесное Племя столкнется с [Glossary('Императора демонов','podgloss.demonemperor')]."
 POD_persistentpodlore.desc.793492:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nГодлинги хорошо известны разнообразием цветов и слоев общества, которые есть у их членов. Хотя, правда, даже для них Праджапати немного... эксцентричен.\n\nКем он был до того, как отправился в [UmbraGlossaryLocalized('yomi_wan','Тысяча преисподних')], неясно. Но в итоге он оказался в аду перевернутых грешников. Там, приняв его манию и замешательство, ему удалось быть изгнанным, поскольку Ад, естественно, не приветствует тех, кто к нему привык.\nТаким образом, когда он прорывался через центральную Индию как дикий Голодный Мертвец, Боги нашли этого ребенка Ситы и привели его в свое стадо. Но даже благодаря его образованию никогда не было ясно, какой аспект Дэви он воплощает. Ситуация усложняется тем, что имя, которое он взял, Праджапати, могло относиться к Брахме... но также к Вишвакарме, Агни, Индре, Дакше и множеству других существ.\nА учитывая, что он, кажется, сильно отклоняется от того, к кому из них он ближе всего в любой момент времени, прямое сравнение становится, по меньшей мере, головной болью.\n\nПо крайней мере, его знакомство с адом перевернутых грешников, хотя оно и сделало его, несомненно, «другим», является истинным мудрецом в мирах за пределами Земли, и его учения, по крайней мере, просветительны.\n\nПо крайней мере, когда их можно будет понять."
 POD_persistentpodlore.desc.793493:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nКем бы были боги, если бы они не выглядели соответствующе? Быть во всем как Боги — основополагающий принцип Небесного Племени. И арсенал и мода ничем не отличаются. И чтобы помочь им в этом, Тваштр рад видеть кузницу. \n\nТваштр всегда был ремесленником. В своей земной жизни он даже боготворил своего тезку, когда читал о нем в Махабхарате. Во всех этих вещах он хотел быть именно этим. \nИтак, он всегда продвигался все дальше и дальше в этом искусстве. Между изготовлением оружия и изготовлением украшений он постоянно старался стать лучше и лучше. И однажды его работа оказалась фантастической, когда один из его бывших клиентов отделил ему голову от плеч и отправил в ад, где с него сняли шкуру заживо. \n\nОн не помнит своего побега, но Тваштр вечно благодарен богам, которые его спасли. Теперь он уверен в их [Glossary('дхармы','podgloss.dharma')], всем сердцем веря, что его прежнее поклонение Тваштру означало, что они были одним и тем же. Для него это имеет смысл.\nИ теперь среди божков мало кто так же верен своему пути, как Мастер Кузниц."
 POD_persistentpodlore.desc.793494:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nКогда Читрангада проснулась в [UmbraGlossaryLocalized('yomi_wan','Тысяча преисподних')], она была уверена в одном — ей здесь не место. Но как одна из многих супруг Раваны, она мало что могла сказать по этому поводу. \n\nЧитрангада вообще не помнит своей смертной жизни, и, насколько она помнит, ее жизнь начинается в замке Раваны, выбранной в качестве одной из его супруг. В то время как многие другие в этой ужасающей ситуации поддались отчаянию или жадности, превратившись в ракшасов. Но среди них Читрангада была той, кто отказался полностью поддаться, вместо этого правильно разыгрывая свои карты, сохраняя как можно большую часть своей души. \n И для этого однажды ночью, когда Голодные Мертвецы, которых звали Хануман, совершали одно из своих обычных неистовств по Городу Демонов, он нашел ее, супругу, которая не уступила Раване. Увидев в ней божественность, которую лелеяло Небесное Племя, он вырвал ее и привел в Небесное Племя для надлежащего образования. \n\nС тех пор Читрангада воплощает это, называя себя Богиней Силы Воли, Травмы и Смирения. И, прежде всего, она является одним из самых больших недоброжелателей Ликов Богини. \nИдея о том, что они были злыми, в корне ошибочна, поскольку она никогда не делала ничего плохого. Ее история началась в аду. Поэтому для них утверждать, что она заслужила эту судьбу, — это оскорбление. Поэтому она возглавляет их в этом отношении, главный противник их доктрины и главный интеллектуальный защитник Небесного Племени."
 POD_persistentpodlore.desc.793495:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nСурпанакха до своей смерти была гулем поистине древнего Равноса. Хотя она утверждала, что является сестрой Раваны, упыря, чтобы служить ему в бессмертии, ее утверждения не могут быть доказаны. По крайней мере, она была Ткачихой тайных искусств и ужасной магии, окровавленной рукой древнего монстра, пирующей его кровью в обмен на бессмертное служение. \n\nОна была бичом для ранних Голодных Мертвецов Индии, ужасной рукой возмездия, инферналистом высокой известности и ведьмой ужасающей силы. По крайней мере, пока ее наконец не убил Хануман. Хотя многие думали, что это станет концом всего, странным образом это оказалось просто новым началом, поскольку в смерти она познала истинную цену адского рабства на Ланке. \n\nЯростная против предательства ее брата, исчезновение древних заклинаний было превращено в средство ее освобождения, и Хануман нашел ее еще раз возрожденной в живом мире. Подчинив и цивилизовав ее, он поставил ей ультиматум. Будь Богом или будь Дьяволом. Она решила быть и тем, и другим. \n\nСреди Богов мало кто знает, о чем она говорит, и еще меньше верят в это. По крайней мере, она, кажется, совершенно убеждена, что это правда. И в этом смысле она их монстр. То, что они выпускают на волю, когда вся надежда потеряна, чтобы напомнить другим, чему противостоит добро.\nИ хотя она более сдержанна, она не менее жестока и снисходительна. По крайней мере, она слушает и действует против сил, которые, по ее убеждению, предали ее. \n\nБудущая судьба\nХотя ее точное происхождение никогда не будет конкретно доказано, когда Вечная война возобновится, когда Чандрапутра и Хазимель снова объединятся, Сурпанакха, какой бы древней она ни была, впадает в маниакальный приступ неистовой ярости и ужаса, прорываясь в мир. Домены Равнос, которые продолжают бороться после Недели Кошмаров, прежде чем исчезнуть на Ланке.\nЧто с ней станет, неизвестно."
 POD_persistentpodlore.desc.793496:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nГаятри предпочитает избегать чрезмерного величия, поскольку более масштабные игры Предков и Принцев существуют в масштабах, которые она изо всех сил пытается по-настоящему осознать. Она знает, кто она и кем хочет стать. И этого ей достаточно.\n\nГаятри родилась, выросла, жила и умерла в маленькой деревне, расположенной на южной половине реки Брахмапутры. От рождения до смерти жизнь продолжалась так, как всегда. Находясь относительно вдали от главных войн того времени, она была настроена на жизнь без происшествий. Она выросла, вышла замуж, обзавелась семьей, работала фермером, а затем скончалась старой. И всю свою жизнь она была довольна. Она была этому рада.\n\nВот почему пробуждение в Ночном Царстве было таким дезориентирующим. Но она, по крайней мере, помнила правила смертной жизни и следовала по рекам, и в конце концов, проходя через них и порой не замечая ничего, кроме шума воды, плещущейся о русло реки, она нашла дорогу обратно в мир живых, но теперь там существует целое общество монстров и меньших божеств, которые теперь говорят, что она Богиня.\nИ хотя она, по крайней мере, может понять, что теперь ее сила божественна, ее современники, заявляющие, что являются воплощенными аспектами таких высоких существ, как Индра или Шива, не совсем ее устраивают.\n\nГаятри, вместо того чтобы бросить вызов этому, предпочла вернуться в свой дом. Сосредоточив вокруг себя небольшой культ, она совершенно довольна и счастлива защищать их, направлять их и быть их богом-защитником. Ей этого достаточно.\n\nТолько время покажет, сможет ли она позволить себе роскошь оставаться маленькой."
 POD_persistentpodlore.desc.793497:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nВ то время как большинство Восходящих Фениксов преследуют свой [Glossary('дхармы','podgloss.dharma')], защищая свою биологическую семью, [Glossary('дхармы','podgloss.dharma')] в основном фокусируется на сообществе и родстве, где кровь не является необходимостью. Чиватеви был одним из первых Фениксов в Бесконечных Громовых Дворах, действительно воплотивших этот принцип.\n\nЧиватеви всегда жил на задворках общества. Никогда не чувствуя себя хорошо с собой, когда росла мальчиком, ее рано тянуло к различным араванам и хиджрам, которые приезжали в город, в котором она жила. Однако ее родителям не понравился этот «фаза», и они попытались надавить на них. Но они относились к ней гораздо более радушно, чем когда-либо была ее «семья».\nНо в целом это мало что значило, поскольку позже Чиватеви была убита во время спора о платежах, а из-за своей близости к секс-работнице после смерти она оказалась в аду соли и железа. Но в отличие от многих других, пытки Ада Соли и Железа, как ни странно, в конечном итоге позволили ей полностью реализовать себя.\nНа самом деле ее побег был неизбежен, поскольку она полностью посвятила себя своему совершенному «я», очаровала свой выход и обрела второе дыхание.\n\nС тех пор Чиватеви стала более тесно связана с индийскими общинами, которые существуют за пределами обычных границ мужественности и женственности, и защищает тех, кто пересекает эти пороги. Она чувствует, что они ее семья, и поэтому делает все возможное, чтобы поднять им настроение. И пока бушует Вечная война, каждому нужна защита."
 POD_persistentpodlore.desc.793498:0 "Этот персонаж является частью $pod_wod$, но имеет очень ограниченную биографию. Поэтому разработчики PoD расширили её для придания большей глубины сеттингу.\n\nТратри всегда был старейшим союзником Раваны. Давным-давно, когда протоиндоевропейские народы разошлись и те, кто пришел в Индию, начали свои завоевания, Тратри была там, единственная дочь полководца завоевателя. Рожденная в походе, выросшая среди солдат и выросшая на завоеваниях, Тратри знала только войну.\nИ когда лорд ее отца попадал под взгляд кровавого бога, она уходила с его армией в ночь, сначала как гуль, а затем как первое потомство кровного брата завоевателя. И тогда Тратри начал понимать. И она последовала за своим [Glossary('сир','game_concept_Sire_desc')], которого она увидела как отца за силу, которую он дал ей, в проклятие. \n\nКогда Равана предал остальных Равнос, не только его собственная сила позволила ему победить. Чандрапутра был почти непревзойденным полководцем и был старше Раваны. Хотя адские искусства Раваны были велики, армии Чандрапутры сокрушили бы его, если бы их силами не командовал Тратри. \n\nТратри родился и вырос в лагере Чандрапутры и обучался его военному делу. Начиная с ее $pod_Embrace$, Равана посоветовал ей формировать свою собственную боевую стратегию исключительно для противостояния Чандрапутре. Поэтому, когда Чандрапутра прибыл, чтобы свергнуть своего кровного брата-предателя, Тратри бросился в бой, возглавив против него свои инфернальные силы и демонические воинства, используя хитрости, специально разработанные для противодействия ему, совершенно непохожие на стратегии Проклятых или Кровавых Убийц. \nЕе контркампаний было достаточно, и Равана стал [Glossary('повелителя Яма','podgloss.yamaking')]. А награда Тратри? Жестокое и унизительное убийство, когда ее раздели догола, изрубили на части всеми известными им видами оружия, морили голодом, закалывали колами и поджигали, пока ее забивали до смерти дьяволы. Приговаривая ее к новорожденному Городу Демонов как к его первой грешнице и первой Ракше.\n\nТратри так и не простил Раване этого. Ей нравилось быть вампиром. Она ненавидела свое новое состояние монстра Асуратизайя. \nНо ее отец теперь был Королем демонов. Ей нужно было дождаться своего шанса. В конце концов, она построила его империю.\n\nИ она получит свое наследство.\n\nБудущая судьба\nТратри будет ждать тысячелетия, даже после упадка Города Демонов. В «Ночных ночах» она постепенно набирает силу, поскольку некоторые подозревают, что ее предательство неизбежно. И по мере приближения Шестой Эпохи Тратри наконец начинает действовать после Недели Кошмаров."
 POD_persistentpodlore.desc.793499:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nДжаямала при жизни был военным человеком. Родившийся во время крушения Палы Камарупы, он должен был быть таким, поскольку нестабильность в регионе не оставляла места людям мира. К сожалению, Джаямала был силен, но недостаточно силен, чтобы долго выживать в этой сфере деятельности, и наградой ему стал [UmbraGlossaryLocalized('yomi_wan','ад Йоми')] Ланки. \n\nЗапустение Ланки и отсутствие сильной центральной власти были знакомы солдату. Его быстро нашли многочисленные беженцы (или смелые искатели приключений), использовавшие это царство как (относительно) безопасную зону передышки. Джаямала не был достаточно храбрым, чтобы следовать за теми, кто пытался сбежать, но он был опытен и готов защищать более сломленные души, которые просто хотели продолжить свою \"жизнь\" здесь. \n\nХотя ракша Ланки в основном оставляли беженцев в покое (по неизвестным причинам), на них все еще иногда охотятся ради развлечения более садистские существа. Джаямала сделал себе имя во время этих охот, будучи в состоянии противостоять нескольким ракшам и противостоять им. \nК сожалению, это сделало его интересным, и он был сильно побежден, когда королева ракша Тратри сама столкнулась с ним. Не обращая внимания на беженцев, находящихся под его опекой, Тратри потащил его в Крепость Демонов. \n\nКогда он появился, Джаямала теперь сам был ракшей. \n\nС тех пор он был стойким и стойким воином, подчиняющимся непосредственно Тратри, хотя другие ракша сомневаются в его приверженности делу. Его считают мягкосердечным (хотя некоторые считают, что его ошибочность была показана на публичных выступлениях), и его лояльность, похоже, принадлежит Тратри, а не самому Раване. \n При этом, по другим слухам, он является козырной картой Раваны, которую нужно разыграть, когда Тратри неизбежно предаст его. \n\n Правда вряд ли будет известна, пока сама судьба Ланки не будет зависеть от баланс."
 POD_persistentpodlore.desc.793500:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nРенбен всегда был умным человеком. Если бы он не всегда стремился срезать углы, он мог бы даже стать кем-то важным. \n\nРодившись во время правления императора Тайцзуна, Ренбен быстро заметил огромное влияние школы Шанцин в государственных вопросах. Видя в этом быстрый путь к придворной власти с видимостью философской легитимности, он стал, по-видимому, прилежным и заядлым практиком. \n\nПо правде говоря, его понимание было в лучшем случае поверхностным, поскольку он пытался искать возможности занять престижные должности при дворе при каждой возможности. Его раскрытие было лишь вопросом времени. Ренбен пытался толкаться и угрожать, казалось бы, хрупкому учёному, который ругал его, но был встречен огненным шаром в лицо. \n\nОказавшись в [UmbraGlossaryLocalized('yomi_wan','ад Йоми')] Фэн-ту, Ренбен был приглашен странным человеком по имени Ку. Представившись [Glossary('повелителя Яма','podgloss.yamaking')], это существо предложило власть и признание в обмен на верность. Ренбен, восхищенный тем, что выглядело как интерес богоподобного существа, с радостью согласился. \n\nНесколько столетий спустя период медового месяца давно закончился. С тех пор Ренбен понял, что Ку — очень второстепенный [Glossary('повелителя Яма','podgloss.yamaking')], едва удерживающий свое царство под носом у гораздо более могущественных существ. Хотя он подумывал о том, чтобы сбежать, Ренбен не дурак и знает, что его хозяин все еще более чем способен сокрушить его без особых усилий. \nНедавно он понял, что его хозяин скрывал от него свой самый могущественный актив, магов Ву-Кенг, и задается вопросом, почему. Маги считаются расширяемыми? Или он? \n\nРенбен сейчас размышляет, как использовать эту информацию. Это могло послужить рычагом для перехода на другую сторону к другому мастеру или, возможно, даже позиционировать себя в качестве посредника между магами и Ку, используя одного против другого."
 POD_persistentpodlore.desc.793501:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\n Широко считающийся наименее человечным из [Glossary('повелителей Яма','podgloss.yamaking')], Хлу избегает использования [akuma|E], предпочитая компанию паразитических организмов, населяющих его [UmbraGlossaryLocalized('yomi_wan','ад Йоми')]. Однако есть исключения, такие как Намваран.\n\nНикто мало что знает о нем (ее? они?), поскольку сама его форма, по-видимому, представляет собой изменчивый кошмар, а не что-то разумное. По слухам, он был самым первым [akuma|E] Хлу (что объясняет его силу), другие - просто его нынешним фаворитом. Самые тревожные из них говорят, что Намваран - это не единое существо, а смесь бедных душ, сросшихся вместе невменяемым разумом Хлуха, или даже просто хозяин злонамеренной паразитической формы жизни, свидетельство того, что Хлух приготовил человечеству, если он вознесется как [Glossary('Императора демонов','podgloss.demonemperor')]. \n\nКак бы то ни было, Намваран редко говорит хотя иногда способен демонстрировать человеческие эмоции (хотя и деформированным, сверхъестественным способом, как будто имитировать их было для него тяжело). Однако он более известен как мясник, пожинающий души в аду кипящего масла и время от времени приходящий на саму Землю. \nХотя его цели во время этих набегов так и не были до конца понятны, результаты всегда кровавы и ужасны. Каждая смелая сила $pod_kueijin$, пытавшаяся остановить его, только укрепляла ужасную репутацию Кипящего Жнеца."
 POD_persistentpodlore.desc.793502:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\n Было время, когда [Glossary('повелителя Яма','podgloss.yamaking')] Тоу Шен была достойным соперником Рангде, повелительницы чумы. Это время давно прошло, поскольку [UmbraGlossaryLocalized('yomi_wan','ад Йоми')] Тоу Шена медленно сокращается, а Рангда усиливает свою мертвую хватку над душами, убитыми болезнями. Хотя Тоу Шен может похвастаться одной победой, и ее зовут Энсима. \n\nОдна из многих бедняжек, умирающих от бешеной чумы, Энсима оказалась во владениях Рангда и вскоре стала любимым подопытным для последних творений владычицы чумы. Спасителем Энсимы, застрявшей в бесконечной агонии, был не $pod_kueijin$ или заблудшая душа, а сам Тоу Шен. Возглавив в одиночку нападение на царство Рангда, Тоу Шен (справедливо) предположил, что владычица королевства не покажет себя, опасаясь дорогостоящего противостояния. У Тоу Шена, проигравшего войну, не было этой проблемы, а [akuma|E] Рангда не мог сравниться с его личной мощью. Перед отъездом он захватил несколько душ для собственного использования, включая душу Энсимы. \n\nЖенщина, пережившая невыразимые ужасы под \"care\" Рангды, уже обладала сверхъестественной стойкостью и ревностной благодарностью своему спасителю. Тоу Шен, не теряя времени, подарил ей свой собственный набор способностей, превратив ее в грозное существо, благословленное двумя [Glossary('повелителей Яма','podgloss.yamaking')] болезни. \n\n Как ни странно для главного [akuma|E] чумы, Энсима выглядит как здоровая на вид женщина, не тронутая какими-либо признаками болезни. Истина в этом вопросе проста: Тоу Шен заслужила еще большую лояльность, убедившись, что сама никогда не перенесет болезни, но при этом вполне способна причинить их другим. \nОна более чем стремится сделать именно это, жаждет угодить своему спасителю и в процессе отомстить Рангде."
 POD_persistentpodlore.desc.793503:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nHumamay, насколько она себя помнит, ненавидела свою жизнь. Равнодушная семья, тяжесть ожиданий принять ее роль и неспособность восстать злили ее, пока отец не избил ее настолько, что превратил этот гнев в отчаяние. Прошло совсем немного времени, и Хумамай прыгнула в океан, чтобы положить всему этому конец. \n\nМаленький [UmbraGlossaryLocalized('yomi_wan','ад Йоми')] Хайн-Нуи-Те-По, второстепенный [Glossary('повелительницы Яма','podgloss.yamaking')], стал концом ее путешествия. Хине-Нуи-Те-По питается отчаянием и гневом, и ее маленькое царство позволяет ей оказывать личную \"заботу\" каждой душе в ее королевстве, и Хумамай не был исключением.\nОна возродила юношеский гнев Хумамая и позаботилась о том, чтобы он охватывал все.\n\nХумамай теперь появляется как редкий, но внушающий страх Присутствие в Юго-Восточной Азии, питающееся отчаянием и ненавистью к себе, поощряя его на каждом шагу расширять возможности своей госпожи. \nОднако она сохраняет свое личное презрение к [Glossary('пенангаллан','podgloss.penangallan')]. Эти женщины, пытающиеся достичь просветления, яростно восставая против общественного порядка, отталкивают ее. \nВ глубине души она знает, что ее гнев на них проистекает из ее собственного опыта, приведшего ее к этой точке, но она зашла слишком далеко, чтобы ее это волновало. Хотя ей еще не удалось совершить этот подвиг, она очень надеется поймать одного из этих [Glossary('пенангаллан','podgloss.penangallan')], а затем полностью сломать ее, показав, что ничего не изменится, как бы сильно она ни ругалась. \n\nОтчаяние, которое она будет питать с этого дня, станет поистине легендой."
 POD_persistentpodlore.desc.793504:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nКогда-то Ни Лух был многообещающим учеником. До этого она помнит, как звонила куда-то домой. Но сейчас это всего лишь кошмар, отголоски и муки давно ушедших времен. Все, что у нее сейчас есть, это ее братья и сестры и мать. Ее королева и ее цель.\n\nНи Лу до своего служения Рангде была среди троих учеников, которым было поручено исследовать Разбитое Зеркало в Индии, пока они не столкнулись с шестируким, терзающим плоть ужасом. Все трое были ненадолго схвачены и, находясь в заточении, вкусили крови ужаса. И что-то... вошло в них.\nЧто-то чуждое, что-то запредельное, но все же что-то отчетливо человеческое, отчетливо ненавистное и отчетливо амбициозное. Первый из Голодных Мертвецов, ставший переносчиком этой сверхъестественной чумы, он бесконечно мучил их, играя с ними, как с игрушками, извергая их желудки только для того, чтобы увидеть, как они превращаются в насекомоподобных ужасов, намеревающихся убить друг друга.\n\nСтремясь сбежать от этой мерзости внутри них, они бежали через Умбру, найдя передышку только в [UmbraGlossaryLocalized('yomi_wan','Тысяча преисподних')]. Отчаянно нуждаясь в помощи, они повсюду искали облегчения от этого недуга. И из всех мест они нашли его в Рангде.\n\nБудучи старшим в группе, Рангда наиболее интенсивно изменил душу Ни Луха. Она была переделана под прикосновением Рангды, разорвана на части и преобразована. Рангда увидел, что податливость плоти является результатом завораживающей чумы, и позволил им вырастить из нее нечто похожее на Синтай.\n\nЭти ужасы были наиболее близко раскрыты Ни Лух, которая стала ведущим экспертом по ним и использовала это, чтобы превратить свое тело в целый зверинец новых ужасов и усилить боль. Рангда, пожалуйста, назвал ее Ни Лух и отправил работать в свой ад.\n\nНо теперь есть и другие Голодные Мертвецы, способные формировать плоть. Ни Лух может им подарить подарок. Чума ужаса в крови, от которой их может спасти только Рангда. Старейший Рак, распространяющийся через ее губы.\n\nСестры, придите к дочери Рангды и найдите цель."
 POD_persistentpodlore.desc.793505:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nКогда-то Мадек был многообещающим учеником. До этого он помнит, как звонил куда-то домой. Но сейчас это всего лишь кошмар, отголоски и муки давно ушедших времен. Все, что у него сейчас есть, это его братья и сестры и мать. Его королева и его цель.\n\nМадек, до своего служения Рангде, был среди троих учеников, которым было поручено исследовать Разбитое Зеркало в Индии, пока они не столкнулись с шестируким, терзающим плоть ужасом. Все трое были ненадолго схвачены и, находясь в заточении, вкусили крови ужаса. И что-то... вошло в них.\nЧто-то чуждое, что-то запредельное, но все же что-то отчетливо человеческое, отчетливо ненавистное и отчетливо амбициозное. Первый из Голодных Мертвецов, ставший переносчиком этой сверхъестественной чумы, он бесконечно мучил их, играя с ними, как с игрушками, извергая их желудки только для того, чтобы увидеть, как они превращаются в насекомоподобных ужасов, намеревающихся убить друг друга.\n\nСтремясь сбежать от этой мерзости внутри них, они бежали через Умбру, найдя передышку только в [UmbraGlossaryLocalized('yomi_wan','Тысяча преисподних')]. Отчаянно нуждаясь в помощи, они повсюду искали облегчения от этого недуга. И из всех мест они нашли его в Рангде.\n\nМадек, «исцеленная» Рангдой, стала идеальной для того, чтобы служить командиром ее зомби, одержимых личинками. Мадек имел склонность к войне, и его ум был проверен, командуя ее войсками, когда осадные черви разрушали стены, построенные из кричащих страждущих.\n\nКроме того, он обнаружил, что болезнь сама по себе может быть оружием на войне, и часто избегал прямых осадных машин, вместо этого вооружая их пораженными телами, наполненными грязной кровью болезни, которая разрушает его внутренности. Только когда другие умирают и заражаются, его боли утихают. Чума и война — это все, что облегчает его боль.\n\nИтак, он побеждает. Он распространяется. Ваша боль облегчает его. Итак, вы будете страдать."
 POD_persistentpodlore.desc.793506:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nКогда-то Ньоман был многообещающим учеником. До этого она помнит, как звонила куда-то домой. Но сейчас это всего лишь кошмар, отголоски и муки давно ушедших времен. Все, что у нее сейчас есть, это ее братья и сестры и мать. Ее королева и ее цель.\n\nНьоман до своего служения Рангде была среди троих учеников, которым было поручено исследовать Разбитое Зеркало в Индии, пока они не столкнулись с шестируким, терзающим плоть ужасом. Все трое были ненадолго схвачены и, находясь в заточении, вкусили крови ужаса. И что-то... вошло в них.\nЧто-то чуждое, что-то запредельное, но все же что-то отчетливо человеческое, отчетливо ненавистное и отчетливо амбициозное. Первый из Голодных Мертвецов, ставший переносчиком этой сверхъестественной чумы, он бесконечно мучил их, играя с ними, как с игрушками, извергая их желудки только для того, чтобы увидеть, как они превращаются в насекомоподобных ужасов, намеревающихся убить друг друга.\n\nСтремясь сбежать от этой мерзости внутри них, они бежали через Умбру, найдя передышку только в [UmbraGlossaryLocalized('yomi_wan','Тысяча преисподних')]. Отчаянно нуждаясь в помощи, они повсюду искали облегчения от этого недуга. И из всех мест они нашли его в Рангде.\n\nКак ни странно для царства, наполненного уродствами и личинками, когда Рангда подняла голодных мертвецов, которых она назвала Ньоман, из своих нерестилищ, Ньоман оставила его прекрасным, вне всякого сравнения, но это было сладкой приманкой для тех, кто хотел ее искать.\n\nВнутри нее текли все несчастья, которые могли течь через чресла человечества, и Рангда вселил в нее неутолимое желание распространить их повсюду, а также знание того, как обводить мужчин и женщин вокруг пальца и становиться новыми сосудами для «даров» Рангда. С этим натиском Ньоман покидал Нерестовые Ямы, улыбаясь и безумно мечтая о грядущих удовольствиях."
 POD_persistentpodlore.desc.793507:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nНа рубеже веков, когда Голодные Мертвецы лишились милости небес, именно недавно объединившиеся Дворы Зверей поразили их. Суды Зверей объединились после того, как Министры Небес обманом втянули Детей Изумрудной Матери в войну, в то время как Министры злоупотребили своей властью, чтобы убить ее.\nСвирепый народ увидел это и восстал как один, чтобы свергнуть их и спасти их мать. Но, к их шоку, она попыталась поразить их всех, поскольку противодействие министрам не входило в их обязанности. Нет, им следовало убить друг друга и позволить ей умереть. Но ее гнев сменился, когда Легенда Хаккена Чи Ю принял осуждение за их «грехи», где он и останется, неся бремя всех их грехов и предотвращая отправку любого другого Фера в [UmbraGlossaryLocalized('yomi_wan','Тысяча преисподних')].\n\nНо Хаккен-Мечник пришёл в отчаяние. Осуждение Изумрудной Матери было жестоким, несправедливым и несправедливым. Но никто не хотел его слушать.\nПоэтому его протесты превратились в негодование, отчаяние — в гнев, а печаль — в ярость. Он бросил вызов указам своей Богини-Матери и спустился в ад, чтобы спасти его. Но там он заблудился и скитался, пока не оказался в аду, когда с него сняли шкуру заживо.\n\nЕго благословенная шкура заживет, выдерживая свежевающие ветры, пока он продвигается вперед, воя по головам министров, которые инициировали всю эту трагедию. Повелительница этого ада, [Glossary('Железная королева','podgloss.toumu')], выглянула из своей крепости и улыбнулась, обнаружив кого-то, кто действительно равнялся ей в ненависти к падшим Министрам Небес. Она открыла этому волку путь в свой дворец и угостила его обедом.\nИх сблизила ненависть, и [Glossary('Тоу-Му','podgloss.toumu')] предложил освободить Чи Ю, когда она станет Императрицей Демонов, и гарантировать, что Волк получит его любовь. И все, что ему нужно было сделать, это помочь ей уничтожить то, что проклинало Чи Ю.\n\nИ Волк, который там умер, и Убийца-Мертвец родился в согласии. Переработанный в «Адское железо», грешники теперь шепчутся об охотничьей собаке Железной королевы, самом грозном убийце среди [akuma|E].\nЧего они не знают, так это того, что когда он воет, он воет о том, что потерял, и клянется, что те, кто проклял его, будут страдать до самой смерти за свои грехи."
 POD_persistentpodlore.desc.793508:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nВозможно, если бы Даойи умерла позже, ее бы отправили в [UmbraGlossaryLocalized('yomi_wan','Тысяча преисподних')] и, возможно, она сама вернулась бы в виде Голодных мертвецов. Но она родилась слишком рано. Родившаяся задолго до того, как Колесо Веков перешло в более мрачные времена, Даойи была забытой секс-работницей, которая жила незамеченной жизнью до своей кончины от рук кого-то, кто увидел ее и решил, что вместо того, чтобы платить за ее услуги, он возьмет это и вместо этого убьет ее.\n\nА затем, в Йеллоу-Спрингс в образе Призрака, ее постигла та же участь. Но по прошествии нескольких столетий один клиент в Йеллоу-Спрингс изменился, и они увидели в Даойи огонь, который все еще горел. Поэтому они нашептали ей запретную правду. Доайи воспользовалась шансом исправить свою судьбу, совершив богохульство и воскреснув из мертвых, ее тело восстало из праха как Восставшая, и этот клиент вернулся к ней, гордый тем, что она добилась успеха, и предложил ей работу в качестве своего первого [akuma|E].\n\nС тех пор Даойи верно служил [Glossary('Ву Хуа','podgloss.wuhua')], помогая ему во время вращения Колеса, управляя одним из самых развратных мест во всем аду. И в отличие от других своих слуг, она помнит о своей человечности, и это ее воспламеняет.\nОна наблюдает за Железным борделем, любимым сооружением У Хуа в их аду. Она командует его коллекцией демонов, разыскивая виновных в сексуальном насилии не только в других Адах, но и по всему Подземному миру, чтобы их похитили и оттащили обратно в Железный бордель.\n\nС помощью смеси Молиации и Нефритовых Арканов она с удовольствием кастрирует их, превращая их отнятые мужские качества в цепных нефритов, которые могут контролировать их эмоции, и превращает их в женщин, которые обслуживают Железный Бордель. Их агония и мучения являются одними из самых сильных, которые им доставляли слуги У Хуа, и поэтому Даойи имеет множество особых привилегий, особенно учитывая ее уникальный статус Воскресшей.\n\nОни сформировали ее душу так, как и следовало ожидать от любимой ученицы, и Даойи не видит причин разрушать их отношения. Пока у нее есть больше людей, которых можно мучить, она довольна. И если [Glossary('Ву Хуа','podgloss.wuhua')] станет [Glossary('Императора демонов','podgloss.demonemperor')], они, конечно, выберут Мадонну и Главного Супруга своей Императрицей."
 POD_persistentpodlore.desc.793509:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\n. Глубоко в Аду Пылающих Морей все грешники внутри него боятся огромного и грозного монстра, которого можно увидеть даже за много лиг, колоссальной тени, преследующей самые края Ада. Младшие слуги Хаха Но Фуками стерли с лица земли целые города после его ухода, и даже целые школы Рокеа погибли и остались гнить в морях вокруг этого Зверя. \nТолько сама Хаха Но Фуками встречала Дьявольскую-Рыбу, и у них, кажется, есть своего рода согласие. Их песни — это краткий момент передышки, когда они плывут вместе, прежде чем они уйдут, и она вернется к своим амбициям, а Рыба-Дьявол вернется к своей охоте. \n\nПо правде говоря, Рыба-Дьявол — одно из очень немногих существ из другого цикла Колеса Веков. В свое время Изумрудная Мать была верховным Богом, а ее дети правили миром. Рыба-Дьявол была одним из Воспоминаний Изумрудной Матери, но даже тогда она была еретиком. \n\nОна желала бессмертия Акул, поэтому наполнила океаны их кровью и поглотила их жизненную сущность, плавая вместе с головоногими ужасами в поисках бессмертия. Но когда Колеса повернулись, Рыба-Дьявол спала в самых глубоких океанских траншеях, пока Хаха Но Фуками не нашел ее и не разбудил еще раз. \nИ тогда Мать Жемчуга поняла, что она видит. Моколе родился Мозазавром, существом с невероятным гнозисом и украденной памятью. Но он будет потерян в этой новой эпохе, и [Glossary('повелительницы Яма','podgloss.yamaking')] не мог этого вынести. \nОна разбудила Моколе, носившего имя «Голод-Квирла», и повела их в Ад Пылающих Морей, где тот предложил ей возможность охотиться на всех Рокеа, души и Дьяволов, которых он пожелает, а взамен он плавал с ней и давал ей советы в Колесе Веков, Бога Последняя Эпоха, и что она может сделать, чтобы стать нынешней. \n\nГолод-из-Квирла терпит это, по крайней мере, на данный момент. Она простое существо. Она голодает. Она мечтает. Она упорствует. Такой, какой она всегда была."
 POD_persistentpodlore.desc.793510:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nВ отличие от большинства жителей Бесконечных Громовых Дворов, Талия находится далеко от тех мест, которые она когда-то называла своим домом. Даже в своей смертной жизни она однажды увидела бы в этом месте место, которое нужно завоевать и показать свет. Но теперь, увидев сам ад, она передумала.\n\nТалия была дочерью капитана Газневидов, и к тому же его любимой. Он позволял ей тренироваться с мечом, читать его книги, заниматься спортом и учиться непосредственно у ее отца. Естественно, такая свободолюбивая дочь вызвала бы скандал, поэтому она рано научилась быть тонкой, скрытной и застенчивой.\n\nБудучи взрослой, она всегда была рядом со своим отцом, а ее острый ум, отточенный в юности, когда она скрывала свой свободный дух, сделал ее довольно хитрым шепотом Ткачиха. Но этому не суждено было случиться, поскольку во время вторжения и в пути засада завершила ее историю для остального живого мира. А сама Талия очнулась от смерти в ужасе Ночного Царства.\n\nВ ужасе от преследующих женщин-демонов и вынужденная ужасаться сама, она сосредоточилась и использовала свою хитрость и долгое время отказывалась от возможности самоутвердиться и вырваться на свободу. И, освободив себя внутренне, она освободила себя от ада и оказалась далеко от того места, где умерла, глубоко в Индийском континенте, поскольку кажется, что ее тело уплыло на большое расстояние по Гангу. И Бесконечные Громовые Дворы нашли ее.\n\nТалия долго была безутешна, пытаясь смириться с тем, как Аллах мог такое допустить. Более того, теперь она была окружена людьми, которых раньше не моргнула бы уничтожить, но теперь позволила ей жить так, как ей хотелось, на открытом воздухе.\nИ она избежала ада, только реализовав себя, признав себя плетицей интриг и воином-убийцей. Теперь она могла любить так, как хотела, и ей не приходилось существовать в тени своего отца или мужа, которого она никогда бы не полюбила. Ей это казалось правильным. Это просто имело смысл. Итак, она приняла новое сообщество вокруг себя. Она не могла вернуться в свою смертную семью.\nТак что Бесконечные Громовые Дворы станут ее новой семьей. Она больше не была для них чужой. Она была свободна.\n\nОна могла бы все исправить."
 POD_persistentpodlore.desc.793511:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\n. Хотя Голодные мертвецы, думая о Вечной войне, в основном отдают предпочтение постоянной войне с Равнос, есть еще один часто забытый, но не менее ужасающий театр, который необходимо поддерживать. Пока Боги и Августейшие Дворы сражаются на севере против Вечного Генерала, Плеть и Многорукие ведут не менее постоянную и беспощадную войну. \n\nСанджая когда-то был простым парнем. Не завоеватель, не воин, не князь, не какой-то другой великий и высокий титул. Он был лесорубом. У него была жена, которую он очень любил, сын и две дочери, которые были его миром. И однажды на его дом напали якши Картарирьи, и Санджая стал одной из их многочисленных жертв. \n\nОтправленный в ад, отчаяние его семьи было настолько огромным, что его ревущее неистовство в забытом аду, из которого он пришел, было настолько сильным, что он вырвался из одержимого, истекая кровью дьяволов. В следующий раз, когда якши пришли в небольшую общину, люди только в ужасе увидели, как новый ужас вырвался из земли, проклятие преследовало его по пятам, взывая к своему создателю, чтобы тот предстал перед ним лицом к лицу и предстал перед судом. \nБесконечные Громовые Суды нашли его, и возвращение его к здравому смыслу было тяжелым испытанием. Но, даже вернувшись к здравомыслию, Санджая оставался человеком с ясным видением и целью. \nОн повел бы любого, кто последовал за ним, охотиться и уничтожать гете Многоруких и их якши, где бы они ни появлялись. Его целеустремленная ненависть переросла в тысячелетнюю войну, поскольку Бич Извергов стал величайшим врагом Многоруких. В то время как его последователи говорят, что он сражается с Претендентом на Трон Шестой Эпохи, текущим в венах Извергов, к Санджае его ненависть намного проще\n\nРади своей любви и своих детей он убьет ее. Он убьет его везде, где оно проявится. Война сделала его ум острым. Это прояснило его путь. Руки смерти не смогли победить его. Он отомстит."
 POD_persistentpodlore.desc.793512:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nНесмотря на предположения Августовских судов, два широко представленных «еретика» Индии [Glossary('дхармами','podgloss.dharma')] никоим образом не связаны между собой. Фактически, их собственные конфликты между Бесконечными Громовыми Дворами, двором Манидвипа и Небесным Племенем являются жестокими, жестокими и жестокими. Хотя гнев Богов известен, жестокость человечества не знает границ.\nА среди Небесного Племени, которому поручено защищать Дворы от Богов, он является особенно ярким примером безграничного потенциала человечества к насилию и унижению.\n\nНазия была одной из многих, состриженных в аду заживо содранных шкур, но ее побег и обнаружение Небесным Племенем оставили ее в некоторой растерянности. Она немного побродила, но божок, который с тех пор превратился в фекалии, однажды воспользовался ею, когда она еще была новичком в своем [Glossary('дхармы','podgloss.dharma')], поджигая ее и заставляя совершать множество ужасов.\n\nОбретя чувство ясности, пока он спал весь день, она заставила себя уйти, а затем пронзила его железным прутом и истерически засмеялась, лишая его жизни, а затем сожрала все, что осталось от его застоявшегося трупа. Она вернулась в Бесконечные Громовые Дворы и попросила ее стать их щитом от богов.\n\nНазия считает божков культистами, насильниками и идиотами, обманывающими себя божественностью. Таким образом, ее убийство их является своего рода справедливостью, поскольку люди, которыми они управляют, не могут им противостоять. Но она может. Поэтому она наслаждается их смертью, их агонией, изучая всевозможные новые способы продлить и вытянуть их боль. Тогда, и только тогда, она сожрет их перед их культом, показав им, что эти бредовые «боги» были не чем иным, как визжащими поросятами, которые умирают так же, как и любой другой мужчина, когда психотическая женщина-дьявол поедает их сердце.\n\nСправедливость, понятно."
 POD_persistentpodlore.desc.793513:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nЯньлин уже давно связала себя со двором Черной Черепахи. Возможно, самая близкая сторонница Пу Сёкэна, она была на его стороне с самого начала. Когда началась Четвертая Эпоха и Яркий Лес пришел в степь вслед за Сожалевшими Охотниками, Всадниками Пепельных Равнин и Сынами Тенгри, Яньлин была в основном тихой силой в Ярком Лесу, поддерживая тогда, когда они стали компромиссом в лидерстве между тремя фракциями.\n\nЖизнь Яньлин закончилась позором и унижением, так как в своей жизни она была прелюбодейкой и была убита за это своим первым мужем, где оказалась во владении Доу Тинчжана, калечащего неверных. Однако его обреченное желание захватить Небесные Библиотеки привело к тому, что она была освобождена не по воле или желанию, а по обстоятельствам.\nОднако ее спас Пу Сёкэн, за которым она затем следовала, куда бы он ни пошел. Будучи одной из первых «настоящих» Голодных Мертвецов, ее проницательность была для них ценна, и у нее действительно был хороший ум для хранения секретов и манипулирования ими. Она тихо погрузилась в тень Пу Сёкэна, довольная и обожающая своего спасителя, а позже с готовностью приняв свою роль жены для него, которая на первый взгляд предназначалась для Дампира, но они стали по-настоящему близкими людьми, которым он мог доверять.\nВместе со своими товарищами Линь, Ронг и Сяоли эти пятеро возглавят двор в те критические дни Четвертой Эпохи против [akuma|E].\n\nНо Яньлин устала. Очень устал. И что еще хуже, ей становится скучно в браке. Она любит Пу Сёкэна, но новые мужчины и женщины, которые знакомятся во дворе, не могут не привлечь ее внимание, поскольку она часто исключает себя, чтобы «перефокусироваться». Между этим и желанием преуменьшить угрозу [Glossary('Анда','podgloss.anda')], Яньлин танцует очень опасную линию, напрягая глаза, чтобы справиться со своим утомлением и похотью по мере приближения Пятой Эпохи..."
 POD_persistentpodlore.desc.793514:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nОдин из старейших членов двора Черной Черепахи, Сяоли всегда был в седле, так как именно там он чувствует себя как дома. Наездник Цян при жизни и Голодный Мертвец после смерти, он играл решающую роль в общении между тремя [Glossary('ву','podgloss.wu')], основавшими двор Черной Черепахи, в качестве их посланника. И именно он помог Пу Сёкэну возглавить их в качестве компромисса. \n\nОн также исследовал ад в поисках ценных грешников, и именно там он встретил своего ближайшего друга и доверенного лица Линя. Он ехал между ними, и по его слову и Дампиру они были собраны вместе. \n\nНо со временем дела портятся. Он возненавидел ссоры между Бадмаарагом, Тугмандахом и Ачитбаатаром. Его визиты превратились в частый обмен оскорблениями и колкостями между новостями. Его общественный брак с чача в Бесплодном Ветре стал для него новым видом ада. \n\nНесмотря на то, что Сяоли был их дипломатом, он закладывал семена интенсивного внутреннего конфликта во всем дворе Черной Черепахи, и их отзывчивость уменьшилась вместе с этим, поскольку каналы власти отказались течь к нему. И теперь, по мере приближения [Glossary('Анда','podgloss.anda')], все становится запутанным, сложным и полным мрачных предзнаменований. И все же, все, что Сяоли, кажется, может сделать, - это выплеснуться на Линя, цепляться за своих друзей и продолжить спуск Черной Черепахи в хаос."
 POD_persistentpodlore.desc.793515:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nСамый молодой член Яркого Леса, Лин, пожалуй, сыграл самую важную роль в длительном успехе Черной Черепахи. Жена генерала Ма Юаня, в своей смертной жизни она была свидетельницей походов своего мужа против сестер Чунг и племен Вулин и погибла вместе с ним в походе от болезни. \n Однако, в отличие от мужа, ее история продолжилась в аду роющих личинок. Проснувшись будучи съеденной, она когда-то жила комфортной жизнью, а теперь была ограничена ужасом. Паники, ее воплей и криков было достаточно, чтобы она привлекла внимание Яркого Леса Сяоли, который вытащил ее из Ада и вернул обратно к Черной Черепахе. И когда они разговорились, Сяоли была впечатлена ее пониманием войны, и она настояла на том, чтобы остальные Яркие Леса бросили вызов условностям и включили Линь в свою команду. \n\nЛин быстро подружилась с Сяоли, и она довольно хорошо ладила с остальными. Предвыборные заметки ее мужа были ей известны, и применение его уловок имело решающее значение для двора Черной Черепахи, закрепившего свою победу над [akuma|E] перед Дохор-ханом и угрозой [Glossary('Анда','podgloss.anda')]. Почивая на лаврах, Линь с гордостью ушла на пенсию, просто поддерживая Пу Сёкэна, играя в настольные игры с Сяоли и занимаясь собственным просветлением. \n\nОднако ее юный возраст спровоцировал множество проблем со двором Желтого Императора, особенно с Ли, северным эмиссаром Ван Хунбэня. Лин и Ли быстро начали презирать друг друга, ненависть и ярость, которые переросли в постоянные пограничные стычки, от которых страдают дворы. Даже сейчас она больше сосредоточена на Ли, чем на [Glossary('Анда','podgloss.anda')], поскольку она преследует каждую попытку унизить этого ублюдка, который постоянно унижает ее как не более чем «варварскую шлюху», непреклонную, чтобы доказать свою ценность против них."
 POD_persistentpodlore.desc.793516:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nВ первые дни существования двора Черной Черепахи они находились на новой конкурентной территории. Окруженный ранними [Glossary('Анда','podgloss.anda')] и Ферой, Ронг заработал репутацию непобедимой силы, способной сломить любого до него. Он был тем, кто вытеснит [Glossary('Анда','podgloss.anda')] из основных мест, которые строили Черные Черепахи, и силой силы, которая гарантировала, что Сиберахи останутся слишком изолированными, чтобы когда-либо присоединиться к другим оборотням. \nПу Сёкэн стал его близким другом, поскольку его возвышенный взгляд помогал Ронгу направлять. Он станет защитником Ярких Лесов и скалы, на которой они построят свою Империю. \n\nНо теперь [Glossary('Анда','podgloss.anda')] находятся на подъеме под властью Монгольской Империи, а [akuma|E] свирепствует. А Ронг уже давно не практиковался и не имеет союзников, кроме своего [Glossary('ву','podgloss.wu')]. Ронг возненавидел наглость крупных политических деятелей из двора Черной Черепахи, противодействуя Таругхе, Тань Баньши и Сян Ли за их политические амбиции, а его собственная незаинтересованность в каких-либо романтических путях заставила его закрыть доступ во двор Пу Шокэна. \n\nОн был просто слишком сосредоточен на служении, а сильно политическая и неформальная структура судов создавала для него проблемы в большом масштабе. И поскольку ему, возможно, понадобится помощь против [Glossary('Анда','podgloss.anda')], такая позиция вполне могла снова проклясть его."
 POD_persistentpodlore.desc.793517:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nДревний даже для многих старейших $pod_kueijin$, непосредственно пострадавших в аду, не-жизнь Бадмараага была не менее насыщенной событиями. Первый лидер одного из старейших [Glossary('ву','podgloss.wu')] Степи, с начала Четвертой Эпохи до наших дней. Но теперь она — оболочка страшного ужаса, о котором когда-то шептались Дворы степных зверей, и, наблюдая за приближением разрушения, она, кажется, все больше погружается в свою депрессию.\n\nБадмарааг была одной из самых красивых женщин своего племени при жизни, любимой супругой вождя. Но во многих отношениях ее по-прежнему считали «неполноценной» из-за ее слепоты.\nНо она по-прежнему хорошо выполняла свой долг супруги, родив ему много детей, и когда Колесо Веков повернулось и началось Время Прекрасной Печали, Бадмарааг умерла при родах, родив своего 13-го Ребенка, и отправилась в [Glossary('Ад шипастых цепей','podgloss.hellspikedchains')].\nНо она знала, как использовать политику, над которой он издевался, поэтому ей удалось быстро сбежать. И во время своего побега, под руководством более ранних ученых тех ранних эпох, она отправилась с единомышленниками на север, чтобы освободиться от ограничений двора в ядре китайского общества.\n\nИ, несмотря на свою слепоту, свою новую способность видеть души и духи наряду со своими гораздо более развитыми чувствами, она стала величайшей из Степных Голодных Мертвецов с точки зрения охотничьего мастерства, решив охотиться на всех соперничающих членов Звериного двора, которые им угрожали.\n\nНо тысячелетия насилия измотают любого. Борьба с Сяоли в политике и бесконечная борьба против женоненавистника Ачибаатара и жестокости Тугмандаха привели к тому, что она в значительной степени отстранилась и сосредоточилась на просвещении. Она нашла друга среди молодых [Glossary('ву','podgloss.wu')], и взять с собой первого и единственного ученика Хорхоя — это своего рода страховка.\nОна знает, что двор Черной Черепахи обречен, но есть места, которые нужно охранять. Поэтому, пока Охотники застаиваются, она верит в новую кровь.\n\nБудущая судьба\nОпыт Бадмараага, накопленный за столетия борьбы, наконец, достиг прорыва в принятии ученицы, и когда [Glossary('Анда','podgloss.anda')] постучали в ее убежище, они обнаружили, что оно пусто, поскольку несколько минут назад она поднялась на [Glossary('Сотня облаков','podgloss.hundredclouds')], наконец-то освободившись."
 POD_persistentpodlore.desc.793518:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nГатлмаа когда-то мечтал о славе. В детстве она была единственным ребенком вождя небольшой группы степных кочевников и давно желала следовать за ним во славе. И хотя обстоятельства судьбы предстояло увидеть ее смерть раньше него, она никогда не отказывалась от этой мечты, даже когда ее отправили в [Glossary('Ад шипастых цепей','podgloss.hellspikedchains')].\n\nНе обращая внимания на то, как ее жажда власти и престижа могла помешать судьбе ее души, Гатлмаа боролась с адом, и в своих протестах и ​​ярости на мир она вырвалась на свободу и сбежала обратно в живой мир. Обладая достаточной гордостью, чтобы задушить кита, и жаждой всего и вся, она рискнула в степи ради безопасности во дворе Желтого Императора. \n\nВозможно, наименее «сожалеющая» из Сожалеющих Охотников, она гонялась за каждой славой, которую только могла, и была самым сильным сторонником преследования и поглощения племен в свою сеть влияния, становясь скрытым лордом и генералом, используя различные племена и лагеря. в качестве фигур на доске для своих собственных имитационных стратегических игр.\n\nЕстественно, эта охотница за славой со всей сдержанностью голодной собаки, терпением колибри и смирением демона нашла мало друзей. Ее собственный [Glossary('ву','podgloss.wu')] едва терпел ее, откровенный антагонизм с другим основателем [Glossary('ву','podgloss.wu')], регулярное убийство ее Дампира и обычное решение борьбы с кем-то путем поджога целых полей, в основном в одиночестве, поскольку она продолжает гоняться за все большей и большей славой."
 POD_persistentpodlore.desc.793519:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nЧастые войны с Дворами Зверей среди Дворов Черных Черепах стали для Сожалевших Охотников большим позором. Обычные пограничные столкновения, поиски спрятавшихся сибирских драконов и борьба с искаженной и искалеченной сущностью, текущей через Великую стену, они по большей части признали, что их действиям было бы лучше найти применение в другом месте.\n\nВот почему Чинзориг бежит от своего прошлого.\n\nЧто странно для выходца из ада [Glossary('Какури','podgloss.kakuri')], Чинзориг, однако, был способным охотником, отточенным в поиске остатков. Его умение выслеживать было важно для успеха Сожалевших Охотников, поскольку он был высшим и неоспоримым мастером в поиске гнезд драконов и, как их называли Звериные дворы, «Каернов».\n\nИ силами раннего двора многие из их теперь уже старейших купелей были найдены и завоеваны им. Но он был слишком жадным в своих поисках, и теперь отношения со Звериным Двором остаются навечно разорванными. Чинзориг отреагировал на это сожаление, отказавшись жить прошлым, вместо этого теперь гоняясь за любым конфликтом, в котором он может спрятать голову.\n\nНо теперь Чинзориг тыкает медведя. В своем целенаправленном бегстве от чувства вины он тыкает в [Glossary('Анда','podgloss.Anda')], причем довольно откровенно. Столкнувшись с ними на раннем этапе, пока остальная часть двора развлекается драмой, Чинзориг уже потерял множество учеников из-за команды гонщиков [Glossary('Анда','podgloss.anda')].\n\nМладшие [Glossary('ву','podgloss.wu')] презирают его как вершину глупости, и по мере того, как [Glossary('Анда','podgloss.anda')] становятся ближе, он вполне может заставить домино обречь двор Черной Черепахи на гибель."
 POD_persistentpodlore.desc.793520:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\n. Несмотря на имя его [Glossary('ву','podgloss.wu')], сам Хонгор никогда не был охотником. Скотовод при жизни, его смерть, вызванная тяжелыми временами, травма ада без денег и его собственный побег заставили Хонгора стать чем-то новым и чем-то гораздо более смертоносным. Однако его душа остается неизменной. Каким он был при жизни, он будет и после смерти, только в новом контексте. \n\nХонгор — главный посланник групп смертных в Степи, от Сожалевших Охотников до различных кланов и племен кочевников. Он подготовил хороших людей, от которых можно было бы прокормиться, и средства для их собственной безопасности. \n\nПроведя много времени с Несулте, которая когда-то была союзником, ставшим матерью его детей-дампиров, он продолжал выполнять свои скудные задачи, несмотря на критику со стороны других членов древнего [Glossary('ву','podgloss.wu')]. Но он не обращает на них особого внимания, еще больше разжигая их недоверие к нему. \nОн даже взял нового ученика, Сансара, который стал для него близким другом и союзником. \n\nНо дела становятся гораздо более мрачными, чем к тому готов Хонгор. [Glossary('Анда','podgloss.anda')] приближается, и многие из его племен дезертируют и присоединяются к остальной части Великой Монгольской Нации или полностью уничтожаются, что дает ему все меньше и меньше союзников. И когда [Glossary('Анда','podgloss.anda')] дышит в шею двора Черной Черепахи, его мягкость может оказаться его погибелью."
 POD_persistentpodlore.desc.793521:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nОбычно, когда кто-то является эмоциональным ядром [Glossary('ву','podgloss.wu')], он обычно находится в этой позиции благодаря своим навыкам или желанию быть таким. Однако у Найдана есть гораздо более серьезная проблема. Связанный с сумасшедшим, бездельником, агитатором и невероятно депрессивным лидером, этот парень с молочными тостами в конечном итоге стал их сердцем. К большому разочарованию Найдана. \n\nНесмотря на свой возраст, Найдан не лучший в роли одного из Голодных мертвецов. Просветление ускользает от него, и [Glossary('повелителей Яма','podgloss.yamaking')] пугают его до смерти. Даже будучи одним из старейшин двора Черной Черепахи, он был тем, кого привела к своей должности в основном благодаря старшинству и Присутствию его [Glossary('ву','podgloss.wu')].\nВместо этого он в основном уравновешивает необходимость выслушивать бессмысленные или мрачные горести своей заклятой семьи, в то время как его все дальше и дальше отодвигает от мира, который он знает.\n\nОн просто хотел вернуться к человечеству, и каждый раз что-то подходит, он тоже рассказывает, его так же быстро разрывают. Хотя гуманистическая ересь в Индии очаровывает его, он настолько далек от нее, что для него, возможно, бесполезно пытаться искать в них ответы. И все это время агитаторы вокруг него продолжают пытаться навредить его детям или его власти, усугубляя ситуацию. \n\nНа самом деле у него есть только жена, и даже тогда он подозревает предательство их союза. Он, несмотря на то, что его окружают другие, совершенно одинок. Вынужденный слушать о своем [Glossary('ву','podgloss.wu')], о своем браке с Улекеном, о своей вражде с Зевсегом и Хюнбишем, а также о запрещенных свиданиях с Сансаром, вся его политическая позиция балансирует на грани краха."
 POD_persistentpodlore.desc.793522:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nСтранствующий повелитель является загадкой для многих, даже для немногих немногих слуг, которые у них есть. Они не принимают слуг и не терпят дураков, следующих за ними. Некоторые ученики существуют, но очень немногие когда-либо имели хоть какую-то степень общения с Царем, которому они якобы служат. Они — блуждающий катаклизм страданий, око урагана страданий. Но есть одна оскверненная душа, которая заслужила их благосклонность больше, чем большинство других. \n\nМиракала — странный персонаж, первоначально один из кровавых рабов рыцаря $pod_cainite$, посланного в Степи для исследования [Glossary('Анда','podgloss.anda')]. Очарованный своим невероятным мастерством врача, родственный рыцарь не подозревает о водовороте тьмы, ревущем в сердце его Вурдалака, и о причуде судьбы, которая позволяет ее разуму быть ясным во время службы ему и навсегда защищенной от Узы Крови. Многочисленные вампиры, которых он победил, были странным образом убиты, полностью обескровлены, не подозревая, что его Гуль лишает их силы. \n\nИ как только они полностью вошли в степь, случайная встреча с путешественником на дороге что-то пробудила в его хирурге. По прихоти незнакомец подарил ей дар колдовства и исчез. В поисках их больше хирург использовал бы это, чтобы войти в Царства [UmbraGlossaryLocalized('yomi_wan','Тысяча преисподних')], покинув Рыцаря со своими собственными искажёнными рабами с украденной силой и захваченными источниками крови. Она преследует следы Повелителя, получая благословения и кровь, как Вурдалак преследует своего избранного хозяина.\nИ все это время их возбужденная и развратная жажда страданий, рвения и плотских удовольствий во имя ее бога толкает ее все глубже в пучины безумия и осквернения.\n\nИ теперь она чувствует, что ее избранный бог приказывает ей вернуться на запад и разрушить стену, которая держит ее хозяин вернулся оттуда. Откуда она это знает, она не знает, но сделает это с гордостью и без сожаления. Она разберет детей Каина, украдет их силу и разрушит стену ради своего Императора. И, по крайней мере, кричащие жертвы на ее столе не приносят ей конца радости."
 POD_persistentpodlore.desc.793523:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nВ то время как для большей части остального ночного мира, когда дело доходит до ребенка Многорукого, Ратти-Бен и ее личная война делают ее самой знаменитой, к югу от плато Декан его второе дитя больше боятся и ненавидят, оно является источником многих новых ужасов и чудовища. И когда они увидят его, они никогда не заподозрят, что что-то не так. По крайней мере, до тех пор, пока его руки не соприкоснутся с жертвами. \n\nНо для того, кто сейчас имеет такое приятное поведение, мало кто поверит в его смертную жизнь. Разочарованный и подавленный второй сын местного лорда, который всегда стремился стать художником. Но после смерти отца и возвышения брата брат вместо этого поставил его на бессмысленные должности и унижал, такие как «налоговый надзор» и «двор сенешаль». \nАхед возмущался, что брат удерживал его от его мечты, презирая насмешки и насмешки, которые, несомненно, были скрыты за его спиной. Даже когда трон унаследовал его племянник, он просто возмущался, что этот маленький засранец спокойно воспринял свое право первородства и никогда не спрашивал Ахеда, что он хочет делать. Но кипящее негодование привлекло внимание монстра, и Ахед увидел, кем он был на самом деле. \n\nХудожник. \n\nОн благословил Ахеда смертью, и Ахед вернулся к своему племяннику и превратил его в произведение искусства, которое простиралось через весь лес, нервы пылали от симфонии боли. Свет в его глазах вернулся, когда вся семья, которая издевалась над ним и отказывала ему в искусстве, сама стала искусством.\nИтак, теперь он наверстывает упущенное, наслаждаясь нежизнью и элизиумом с новой силой, стремясь к совершенству самого искусства.\n\nБудущая судьба\nАхед создаст еще много шедевров, и с уничтожением Равноса на Неделе кошмаров он начнет все больше конфликтовать с Ратти-Бен в художественном видении. \n И по мере того, как они сталкивались все больше и больше, он начинает видеть в ней своего давно умершего брата. И в час триумфа Цимисхов в Индии она может стать жертвой новой катастрофической междоусобной вражды."
 POD_persistentpodlore.desc.793524:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nОчень немногие Цимисхи когда-либо выживали, не оправдав ожиданий своего [Glossary('сир','game_concept_Sire_desc')]. Эзлинн повезло, потому что она была идеальной ученицей своего дедушки. $pod_Embraced$ из числа Кровавых рабов, к которым Многорукий имел доступ, Ратти-Бен надеялась, что Эзлинн пойдет по ее собственным стопам, направив свои силы в сторону идеализма и целеустремленности, стремясь к освобождению, как и она. Однако Эзлинн была идеалисткой, но не такой, как она надеялась. \nЭзлинн была очарована Изменчивостью и силой, которую она имела, и не хотела иметь ничего общего со своим прежним смертным состоянием. Хотя Ратти-Бен хотел уничтожить ее из-за утраты возможности использовать $pod_vitae$, ее собственный [Glossary('сир','game_concept_Sire_desc')] запретил ей, поскольку Эзлинн пересекала территории, которые мало кто из Извергов может сделать. \n\nЭзлинн знает, что плоть слаба. Это вещь, которую легко разрезать, сжечь и расколоть. Это был металл прочный, долговечный и бессмертный. Как бессмертные существа, не должны ли они превратиться в сталь? Эзлинн использовала свое искусство формирования плоти, чтобы достичь совершенства не в духе или чистой плоти, а путем объединения своей плоти и металла. \n Регулярно экспериментировала с объектами и использовала собственное тело в качестве холста для этого пути. И к Темным векам от ее физического тела осталось мало: она была заменена сталью и свинцом, наложенными на мышцы, ее кости заменены железом, а органы заменены бронзой и медью.\nОстались только ее мышцы, придающие ей определенную гибкость, видимую только через швы, где металл соединяется и остается открытой для сочленения. \nОна представляет собой особый вид ужасов, который внушает особый вид страха среди тех, кто сражается с Извергами."
 POD_persistentpodlore.desc.793525:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nNethmi — странный персонаж, в этом нет никаких сомнений. Обычно быть гулем Цимисхов – это постоянный ужас и страх, зная, что в любой неподходящий момент ты можешь превратиться в какой-то новый ужас. Но тем не менее, на протяжении тысячелетий у Картарирьи был субъект, который не только желал этого, но и полностью горел телом, разумом и душой. И поэтому он сделал то, что многие Цимисхи сочли бы немыслимым. \n\nHe $pod_Embraced$ шляхта. \n\n Память Нетми до того, как она стала гулем в Картарирье, является для нее загадкой, поскольку он регулярно замазывал ее мозг, когда она была гулем. И даже теперь, будучи вампиром, она более чем готова снова подчиниться его работе. \nНо теперь у него на уме гораздо более практическая цель. Столетия времени, превращенные в инопланетные ужасы и бедствия, дали Нетми уникальный взгляд на существование в качестве якши, который, когда она их создает, приводит к особенно смертоносным творениям. \n\nИ поэтому, когда Картаририя не создает их, только Нетми разрешено даже взаимодействовать с их гулями. Она понимает их, успокаивает их и разъясняет им вещи, прежде чем переделать их такими, какими они были, и превратить их в новые прекрасные ужасы. Даже сейчас, когда бушует Вечная Война, потребность в телах и ужасах возрастает, поэтому она добавляет все больше и больше в их бесконечную войну с невероятной степенью должной осмотрительности и неустанной сосредоточенности, по сравнению с которой даже мул выглядел бы непостоянным. \nЭто все, что она знает, и ее собственный путь к совершенству. И она стремится быть не чем иным, как достойной своего хозяина и [Glossary('сир','game_concept_Sire_desc')], что бы это ни влекло за собой."
 POD_persistentpodlore.desc.793526:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nЧасто при ведении войны недооценивается всегда критический и всегда основополагающий ее аспект, а именно ее финансы и финансирование. И даже для нежити, пьющей кровь, это ничем не отличается. И для самой большой военной машины $pod_cainite$, когда-либо воевавшей ночью, Махи действительно пришлось потрудиться. Сын юэчжи-кушанского императора Канишки Великого, вырос в тени его завоеваний Северной Индии.\nНо в отличие от своего старшего брата Хувишки, Махи было разрешено изучать военное искусство не так, как прославился его отец, а, скорее, благодаря его поддержке. Воспитанный как сторонник своего брата, Махи, по крайней мере, преуспел в этом, поскольку его пристальное внимание к деталям, острое понимание и соблюдение закона показали такую ​​преданность делу, что наряду с завоеваниями своего отца он привлек внимание гораздо более древнего завоевателя, который хотел иметь еще одного «сына».\n\nМахи подвергся стандартной практике отцовства, которую перенял Чандрапутра: сначала его изгнали, а затем лично оценили в течение столетия обучения, тренировок, теологии $pod_cainite$ и испытаний. Махи был в первую очередь финансистом и администратором, и Чандрапутра видел огромный потенциал в том, чтобы сделать его бухгалтером, который мог бы процветать даже в таком воинственно хаотичном регионе, как северная Индия.\n\nКак только он был уверен, Махи стал $pod_Embraced$ и был доставлен в Кшатрии, где его немедленно заставили управлять финансами основного клана Равнос. И с новой обретенной и верной целью Майяпарисатьям, он отказался когда-либо позволить себе подвести Чандрапутру, который, наконец, утвердил его собственным княжеством в войне против Голодных мертвецов.\n\nБудущая судьба\nМахи, так как он никогда не был в первую очередь генералом, прошедший обучение у Чандрапутры и время от времени командовавший осадой убежищ, оказался в самом эпицентре пробуждения своего дедсира во время Недели Кошмаров.\nКак и большинство представителей его клана, он встретил свою Окончательную Смерть раньше прародителя Равнос."
 POD_persistentpodlore.desc.793527:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nШрипуруша вел поистине дикую смертную жизнь. Один из многочисленных сыновей Гаутамипутры Сатакарни, рос, не надеялся когда-либо править, особенно в качестве пятого сына. Поэтому в юности он часто выходил из дома, выискивая все новые и новые развлечения, вечеринки и светские дела, и его серебряный язык всегда выручал его из неприятностей. Он обожал Присутствие других и умел собирать и организовывать людей.\nНо в цепочке домино грянула катастрофа. С ростом растущих западных сатрапов Сатаваханы и упадком власти его семьи после смерти его отца, что привело к тому, что его старший брат стал королем, ему каким-то образом удалось довольно неплохо выжить.\nЧто, учитывая его молодость, привлекло внимание Чандрапутры.\n\nЧандрапутра поначалу не особо надеялся на Шрипурушу, но на самом деле был впечатлен его организаторскими способностями и способностью облегчать и смягчать конфликты. Он мог сохранять хладнокровие и со временем даже начал по-настоящему следовать Путем Парадокса.\nПосле полного периода обучения Чандрапутра понял. У него был свой канцлер.\n\nШрипуруша был $pod_Embraced$, и Чандрапутре, в некотором смысле, спасшему его от хаоса упадка Империи Сатавахана, он был вечно благодарен. Чандапутра во многом напоминал ему своего отца и никогда не умрет от старости.\n\nОн стал важной смазкой в винтиках Военной Машины Равнос, сохраняя ее беспрепятственной и одновременно демонстрируя доверенное и гордое лицо Бану Хаким и Данавам. Он даже стал бы очень гордиться тем, что однажды ему удалось очаровать одного из геев Многорукого.\nНо по мере того, как Длинная Ночь продолжается, необходимость сохранения мира остается актуальной.\n\nБудущая судьба\nШрипуруша, несмотря на все, что ему удалось сделать, наконец встретил монстра, которого не смог очаровать, когда на Неделе Кошмаров его дедсир все равно сожрал его."
 POD_persistentpodlore.desc.793528:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nВ Вечной войне большинство асуратизайя боятся бессмертного генерала Чандрапутры. Однако в других кампаниях говорят о другом генерале: там, где Чандрапутра наносит удары в джунглях, они наносят удары в открытых полях. Размытие, которое многие не могут различить между мужчиной и женщиной, иллюзионист, формирующий в ночи целые города, чтобы заманить проклятых на их окончательную гибель.\nА каиниты в Индии, которые рассказывают эту историю и, наконец, встречаются с принцем Равнос из Анахилапатаки, они не ожидают визуально молодого $pod_cainite$ с непревзойденным сиянием.\n\nАрдхагупта был сыном второй император империи Гуптов Самудрагупта, ее величайший завоеватель.  Но в отличие от своих братьев Ардхагупта, сын семьи, не мечтал о троне. Скорее, из-за своей любви к стратегическим играм и текстам о древних завоевателях он был любителем истории. Изучая войну в открытом поле, читая о завоеваниях своего отца и стремясь к такой же славе, он часто хватал оружие и бросался на тренировочные площадки, сражаясь с все более и более сильными врагами, поскольку он тоже хотел стать победителем, как те, о которых говорится в легендах.\nОдна ночь, тренируясь со своими наставниками, он попал в орбиту одного Завоевателя, который видел в нем потенциал.\n\nЧандрапутра забрал Ардхагупту как нового гуля во время хаоса, вызванного смертью Самудрагупты и враждой за престол между его братьями, и нашел в Ардхагупте военный ум, который впечатлил даже его. Хотя ему не хватало опыта, он был умен и преуспел в тех областях, в которых сам Чандрапутра боролся. \n А рвение Ардхагупты в войне против асуратизайи наконец дало Чандрапутре дитя, которого он так долго ждал. $pod_Embraced$ и получив предварительное командование, Ардхагупта боролся там, где преуспел Чандрапутра, но преуспел там, где он этого не сделал. \n Будучи еще своим вторым, Ардхагупта быстро поднялся и стал вторым величайшим полководцем под командованием кшатриев. И он любит каждую секунду этого.\n\nДальнейшая судьба\nАрдхагупта исчез во время Недели Кошмаров, но ряд обстоятельств привел к засаде Извергов, которые сбили его в $pod_torpor$, упав в дельту реки Ганг и исчезнув в ее водах. Ходят слухи, что он все еще дремлет в его глубинах, чтобы проснуться, когда его [Glossary('сир','game_concept_Sire_desc')] снова позовет его, чтобы они могли завершить свою войну."
 POD_persistentpodlore.desc.793529:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\n. Среди шудр кшатриев Равнос большую часть времени различные генералы и другие касты сосредоточены на других кампаниях и обязанностях. Когда-то они нанимались бы из Ревенантов Мариджава, чтобы восполнить пробелы в их службе там, где им нужно действовать в течение дня. \nНо вначале Чандрапутра заметил, что один из них часто делает все возможное в службе, с соответствующим умом и вниманием к деталям, что очень необходимо. И между запретом Пути Парадокса на $pod_Embrace$ женщин (по крайней мере, в теории, который часто игнорируется так же часто, как те, кто следует Путем Человечества, считают жадные мысли греховными) и потребностью в том, чтобы кто-то действовал в течение дня, Чандрапутра устала от тех, кто полагался на монеты. И Хара был легким выбором для преданного помощника. \n\nХара служил Чандрапутре в качестве координатора кшатрийских шудр на протяжении тысячелетий, когда-то ревенант Мариджава с тех пор стал его личным гулем. Даже без Узы Крови она придерживается самых высоких стандартов лояльности, постоянного внимания к деталям и никогда не поддается панике, несмотря ни на что. \n\nИ вместе с этим нет страха предательства со стороны человека, который днем ​​охраняет Равнос. Учитывая сравнительно ошеломляющую для вурдалака свободу действий, она, тем не менее, никогда не проваливала свои задачи, никогда не колебалась и никогда не ставила свою верность под сомнение. \nОна является главным хранителем Чандрапутры, пока он спит днем, и хотя в этот момент она настолько привязана к $pod_vitae$, что солнце стало ей досаждать, она держится за свою задачу чистой силой воли и преданностью своему общежитию, и принес вперед многочисленные Мариджавы, чтобы укрепить свою сеть шудр. \n\nОна знает, что ее место не вампира, а гуля. И в этом плане у нее все в порядке. Пока бьется ее сердце, она будет служить им верно. \n\nБудущая Судьба\nНевероятная степень служения Хары будет еще раз доказана во время Недели Кошмаров, когда ей каким-то образом удалось предотвратить пробуждение Чандрапутры и гарантированное уничтожение. Но что бы ни произошло, она была смертельно ранена. \nОна держалась до тех пор, пока кошмары не закончились, и Чандрапутра не смог попрощаться со своим верным помощником, поскольку она могла умереть мирно и счастливо в объятиях человека, в любви которого она никогда не признавалась."
 POD_persistentpodlore.desc.793530:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nМногие ожидают, что последователями философии «Возвращение к власти» будут амбициозные люди, движимые своей жадностью или высокомерием. Ханьчжан показывает, что обобщения редко бывают разумными. \n\nХаньчжан, будучи мелким чиновником в свои смертные дни, имел достаточно ресурсов, чтобы прокормить свою большую семью, и был доволен своей судьбой. Однако он не был слеп к страданиям других, но сетовал на то, что мало что может сделать, чтобы улучшить ситуацию. Он умер в окружении любящей семьи и местного сообщества, которое оплакивало его кончину, но эта земная забота все еще царапала его душу. [UmbraGlossaryLocalized('yomi_wan','Тысяча преисподних')] были его единственной наградой за эту доброжелательную, но полную сомнений жизнь. \n\nХаньчжан оказался более устойчивой душой, чем многие (включая его самого) ожидали. Хотя он умолял, умолял и делал вещи, которыми не гордился, он никогда по-настоящему не сломался и не нашел свой собственный выход обратно в мир. Общество $pod_kueijin$ не привлекало его, поскольку он считал, что это извращенное заблуждение, призванное удержать их от решения реальных проблем. Отходя от просветления с каждой проходящей ночью, Ханьчжан нашел новую цель только после того, как нашел Кан Чо-лу. \n\nВ отличие от своего наставника, Ханьчжан рассматривает философию «Возвращение к власти» не как способ загладить свою вину перед [Glossary('Нефритового императора','podgloss.augustpersonageofjade')] (в любом случае он по-настоящему не верит в основополагающие мифы своего рода), а как более прагматичное средство улучшения участи смертных. Хотя он знает, что $pod_kueijin$, конечно, не идеальны, их стремление к весьма осязаемому просветлению все же потенциально заставляет их соблюдать моральный кодекс, и это больше, что он может сказать большинству смертных. \n Таким образом, Ханьчжан надеется, что философия его наставника создаст новое общество $pod_kueijin$, посвященное руководству и защите смертных. Он надеется, что один из учеников Кан Чо-лу (или сам мастер) вскоре достигнет [Glossary('Сотня облаков','podgloss.hundredclouds')], потенциально создавая волновой эффект новообращенных, стремящихся привести человечество к процветающему будущему, даже если это делается в их собственных интересах."
 POD_persistentpodlore.desc.793531:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nДжилань едва успела испытать свою смертную жизнь, как ее унесла чума и бросила в [UmbraGlossaryLocalized('yomi_wan','Тысяча преисподних')]. Ей пришлось быстро и эффективно научиться выживать, как физически, так и морально, после того, как первоначальный ужас ее ситуации прошел. Насколько она могла судить, в конечном итоге она потратила десятилетия, чтобы смириться со своей ситуацией. По правде говоря, ее побег был скорее удачей, чем умением. Ее появление в обществе $pod_kueijin$ стало еще одним шоком.\n\nДо сих пор Джилань знала только о своих беззаботных днях юной смертной или о мучительном опыте Ада. Удушающая, чрезвычайно структурированная и требовательная природа Судов не была тем, к чему она была готова. Прыгая от мастера к мастеру, не добившись больших успехов, Джилан вскоре был объявлен безнадежным делом.\n\nЕе история, вероятно, закончилась бы здесь крахом [Glossary('дхармический','podgloss.dharma')], если бы ее не нашли Кан Чо-лу и его ученики. Они не требовали от нее многого, и их тесные связи с обществом смертных позволили ей испытать многое из того, чего ей не хватало, пока ее жизнь оборвалась.\nХотя ей еще предстоит добиться настоящего прогресса в своем Просветлении, она, по крайней мере, стабилизировалась. Кан Чо-лу и его последователи довольны тем, что она притворяется смертной в каждом новом городе, который они посещают, что оказалось очень полезным для сбора информации от наиболее угнетенных слоев общества.\n\nСамым большим воспоминанием Джилань на данный момент является то, как сам Кан похвалил ее за то, что она больше связана с человечеством, чем кто-либо другой в их группе. Тем не менее, она знает, что ее ночи относительно беззаботных экспериментов когда-нибудь должны закончиться. Каждый раз, когда она надевает маску новой смертной девушки, внутри нее растет чувство пустоты. Она знает, что просто имитирует то, что потеряла навсегда, и боится той ночи, когда она будет чувствовать больше печали, чем радости, общаясь со смертными."
 POD_persistentpodlore.desc.793532:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nАнарья – фигура, окутанная мифом. По словам ее учеников, других Всадников, последователей степных империй, она была скифской Энари, способной к пробуждённой магии, но изгнанной из-за своих отношений с дьяволами.\nОна бродила по Умбре, но что-то в [Glossary('Ад шипастых цепей','podgloss.hellspikedchains')] ее утешало. И пока она оставалась там, ее физическое тело истекало кровью, и она стала такой же частью тогдашнего детского ада, как если бы она умерла там грешницей. Когда она вернулась в Живой мир, она сделала это как $pod_kueijin$.\n\nТогдашний молодой [Glossary('Дохор-хана','podgloss.dokhorkhan')] противостоял ей, поскольку она была ребенком из степи, недостижимой для него, - концепция, которую он ненавидел. Но у нее был опыт борьбы с такими силами, поэтому она предложила быть его помощниками и обучать таких же охотников. Он нашел это приемлемым и отправил жрицу за границу.\nИ хотя [Glossary('Дохор-хана','podgloss.dokhorkhan')] никогда не доверял жрице, она собирала множество драгоценных игрушек и трофеев из различных степных империй, разъезжавших по миру. Но ее боятся не поэтому. Ее боятся из-за репутации непостижимой жестокости, холодного ликования и злобного удовлетворения, разрывающего своих жертв в собственном нише Пещеры Шипованных Цепей. Превратить крестьян, вождей и чемпионов в монстров, а их разум превратится в разум простых зверей.\n\nДругие Аутрайдеры пытались подражать ее практике, но немногие из них были столь же велики, как оригинал. И хотя [Glossary('Дохор-хана','podgloss.dokhorkhan')] ни в малейшей степени ей не доверяет, она, по крайней мере, эффективна, и поэтому ее терпят. И кроме того, одни только ее шаги могут запугать любого беглеца до ужасающего подчинения, и многие гордые $pod_kueijin$ во дворе Черной Черепахи боятся ее шепота.\n\nБудущая судьба\n\nНесмотря на то, что [Glossary('Дохор-хана','podgloss.dokhorkhan')] встретил свою кончину, Первому Аутрайдеру удалось сохранить свою собственную Пещеру Шипованных Цепей как независимое царство ада, в то время как соперники ее бывшего покровителя разорвали [Glossary('Ад шипастых цепей','podgloss.hellspikedchains')] на части. Она скрылась, но появилась снова, создав новых Акум, чтобы преследовать Предков Степи.\n\nИ наступают современные ночи, они шепчутся о ее амбициях стать [Glossary('повелителя Яма','podgloss.yamaking')], ищущим ядерное оружие в сибирской пустыне, чтобы возвестить эпоху ядерного огня, который опустошает все, кроме степи, и душит солнце ядерной зимой, чтобы она могла восстать как [Glossary('Императора демонов','podgloss.demonemperor')] Последней Степной Империи."
 POD_persistentpodlore.desc.793533:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nРоксолая — первый всадник после Энареев, заслуживший благосклонность Добрула, — это титул, прозвище, указывающее на ее происхождение среди сарматского племени Роксолани, единственная часть ее прошлого, которую [Glossary('повелителя Яма','podgloss.yamaking')] позволил ей сохранить.\nОдин из многих народов, находящихся вне досягаемости [Glossary('Дохор-хана','podgloss.dokhorkhan')], но в пределах желаемого влияния, он поручил своему Аутрайдеру собрать одного из них. Тогда она была третьей дочерью воина, ее жизнь изменилась, когда фигура с косыми глазами в ночи уничтожила ее семью, затащила ее в глубины ада и разорвала на части Железными цепями. Ее разум также был разделен на части, поскольку он был пересажен в разум другого коллекционера.\n\nПолучив новое прозвище, последнюю часть своей памяти, которую ей было позволено сохранить, она начала свою службу, перекованная в титана дьявольской мощи.\n\nБудучи самыми плодовитыми из Всадников [Glossary('Дохор-хана','podgloss.dokhorkhan')], многие из $pod_kueijin$ во дворе Черной Черепахи, родившиеся за Индом, были доведены до гибели и убиты Роксолайей. Просто, эффективно, безжалостно и жестоко: когда ее [Glossary('повелителя Яма','podgloss.yamaking')] делает запрос, он выполняет его.\nОднако у нее мало терпения, чтобы удерживать их, и поэтому из всех ее поимок наблюдается такая же вероятность побега, как и из остальных Адов, которые она их приносит. Но, к счастью для нее, она часто находится далеко от своих жертв, что делает репрессии маловероятными. Поэтому она охотится, разыскивая еще больше потерявшихся детей степи, чтобы вернуть их в «настоящий» дом.\n\nБудущая судьба\n\nКак и другие Всадники, Роксолая не присутствовала при уничтожении [Glossary('Дохор-хана','podgloss.dokhorkhan')]. Следуя приказу своего наставника, она скрылась в регионах, недоступных для Квинконкса.\nКогда он начал ослабевать с возрастом, ее пленение под руководством нового тюремщика стало новой повторяющейся угрозой Акумы новым Предкам Степи."
 POD_persistentpodlore.desc.793534:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\n. Хотя большинство Outriders родились за пределами [Glossary('Ад шипастых цепей','podgloss.hellspikedchains')], некоторые таланты составляют исключение. И будучи хунну, рожденным в штате, где умер Ювэнь, Всадник, взявший его имя, более чем доказал, что его свирепость может сравниться с пожарами, которые сожгли его дом. \n\nПока они отправились на Ланку как грешник, Ювэнь был схвачен демонами [Glossary('Дохор-хана','podgloss.dokhorkhan')] и доставлен в [Glossary('Ад шипастых цепей','podgloss.hellspikedchains')], и увидел в нем что-то, что, как он подозревал, могло бы принести пользу Outrider.\nГрешник был разорван на куски и преобразован [Glossary('повелителя Яма','podgloss.yamaking')], а затем помещен под Энари для обучения. Он стал идеальным всадником для путешествий по землям России, специалистом по уничтожению призванных ужасов местных Повелителей Нежити. \nЭто было удобное обучение, поскольку он также был столь же эффективен в разрывании Дьявольских Тигров и их Бакемоно. Последнее, что многие увидят, прежде чем он утащит их в ад, это Всадник, пропитанный кровью и одетый в шкуру демонов, вздымающийся и воющий сквозь кровь, когда он тянет их к гибели.\n\nБудущая судьба\n\nКак и другие Всадники, Ювэнь избежал разрушения [Glossary('Дохор-хана','podgloss.dokhorkhan')] благодаря тому, что находился вдали от регионов. active.\nОн, однако, продолжал свое молчаливое неистовство в России, пока силы Бабы Яги не вернули его в поле зрения Энари. А потом вернулся на прежнюю службу под новым руководителем, как ни в чем не бывало."
 POD_persistentpodlore.desc.793535:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\n. Подавляющее большинство малоподвижных грешников, попавших в [Glossary('Ад шипастых цепей','podgloss.hellspikedchains')], легче всего сломать, но всегда есть исключения. Еще реже встречаются те, кто принимает такой образ жизни и приходит служить хозяину Ада. И хотя грешник, отдавший свою душу ради Всадника, давно забыт, Лорд теперь, пожалуй, самый целеустремленный Всадник. \n\nВ отличие от большинства других Всадников, Чжу совершенно ясно помнит свою смертность. Он был сыном северного солдата и работницы, тяготевшей к военной службе, поскольку увлекался лошадьми. Он даже сблизился с ними поближе, когда его затоптали до смерти стрелой в горле, когда Жужанский каганат только начинал свои завоевания. \nНо в [Glossary('Ад шипастых цепей','podgloss.hellspikedchains')] его похитители были очевидны. Даже будучи разорванным на части, он, несмотря ни на что, казалось, сохранял свой железный взгляд, несвязанную жестокость, радуясь, видя потрошения других грешников. По рекомендации Первого Всадника он был освобожден и взят под ее опеку. \n\nОн оказался невероятно искусным в навигации по судам, нереализованный талант, который перерос в великий навык, что сделало его ошеломляюще эффективным в качестве приманки для проклятия других, поскольку он редко оставался один среди Всадников. Однако, в отличие от других, он иногда намеренно освобождал грешников из [Glossary('Ад шипастых цепей','podgloss.hellspikedchains')]. Только для многих он освободил их, чтобы однажды найти дорогу обратно, готовые снова быть сломанными и переделанными в Акума. \n\nДальнейшая судьба\n\nZhu был со своим наставником, когда [Glossary('Дохор-хана','podgloss.dokhorkhan')] была убита, и поэтому последовал за ней в краткое изгнание, в то время как [Glossary('Анда','podgloss.anda')] и другие Акума павших [Glossary('повелителя Яма','podgloss.yamaking')] были убиты. \n Однако, в отличие от других Всадников, он остался в небольшом Царстве Ада, сохраненном его наставником. Там он снова будет заниматься этим, с нетерпением ожидая того дня, когда сможет стать правой рукой и королем Последней Империи."
 POD_persistentpodlore.desc.793536:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nСтарый среди Предков Степи, с первых дней своего существования известный враждой с Бадмараагом и Ачибаатаром, нет более глубокого и ярого защитника чистоты двора Черной Черепахи, чем повелитель Всадников Пепла. Plain.\n\nЕго смертная жизнь давно стерлась из памяти, Тугмандах знал, что он всегда был сыном степи. Это вселило в него такую гордость, что Присутствие тех, кто умер и отправился в другие Ады за пределами [Glossary('Ад шипастых цепей','podgloss.hellspikedchains')], раздражало его, у него не было на них времени и терпения. \nЕсли они покинули степи и отправились на запад, в Тугмандах, они с тем же успехом могли быть отбросами со дна стоячего пруда.\n\nЕго первым великим достижением было разрушение зверь, подобный [Glossary('Анда','podgloss.anda')], пришедший на восток, с такой же силой крови и происходящий из народов, известных как тюрки. Он сломал их и снял с них шкуру, прежде чем они превратились в пепел, и часто одевается в волков, которых они почитают, и в шкуры, которые он считает фальшивыми и своенравными ублюдками своей родины. \n\nA Дьявольский Тигр Дьявольского Тигра, если он когда-либо существовал, его жестокость ко всем, кого он считает меньшими, печально известна. Таким образом, он ясно дал понять, что ответ двора на [Glossary('Анда','podgloss.anda')] должен заключаться в том, чтобы скакать и убить самого так называемого Судью в единоборстве. Он даже хвастается, что сделает это сам, призывая к войне сейчас и немедленно.\n\nБудущая Судьба\n\nК шоку многих Предков двора Черной Черепахи и никого другого, наглая атака Тугмандаха на Чинкай была встречена с безжалостной эффективностью и той же жестокостью, с которой он всегда поддержал.\nЕго избили до потери сознания, пронзили на вершине одинокого дерева, и на рассвете судья вынес свой приговор Тугмандаху."
 POD_persistentpodlore.desc.793537:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\n. К большому огорчению младших членов двора Черной Черепахи, величайший поборник старых обычаев по-прежнему пользуется глубоким культурным уважением. Пурист до мозга костей, который отказывается разговаривать с людьми, если они не воплощают его стандарты, общение с ним - самое известное испытание терпения Черной Черепахи. \n\nАчитбаатар, тем не менее, заслужил свое положение во дворе. Один из старейших членов, основатель и лидер почитаемых и древних Сынов Тенгри, Ачитбаатар был в авангарде всадников $pod_kueijin$ в их славных выступлениях против Судов Зверей, [Glossary('Дохор-хана','podgloss.dokhorkhan')] и многих других угроз. Он систематизировал большинство их законов и ни разу не допустил ошибок в их исполнении. \nОн абсолютно и совершенно искренен во всех из них, что делало его скатывание к абсолютной приверженности традициям и чистоте еще более приводящим в бешенство молодых членов двора. Традиционный до такой степени, даже двор Желтого Императора не соответствовал его стандартам. Все приличия соблюдены, каждый [Glossary('ву','podgloss.wu')] балансирует, чтобы говорить с ним, и даже тогда только мужчинам разрешено стоять рядом с ним, Мудрая Многоножка даже однажды выстрелила в Бадмараага, когда она показала ему небольшую насмешку. \nИ теперь, когда возникла новая угроза, совершенно непохожая на ту, с которой они когда-либо сталкивались, Ачитбаатар настаивает, что с [Glossary('Анда','podgloss.anda')] нужно сражаться, как со Звериными Дворами, уверенные, что они идут за Драконом. Гнезда, и непреклонны, что они пройдут через Умбру, чтобы напасть на них. \n\nТеперь он сплачивает своих подчиненных в подготовке к их войне, в которой он абсолютно уверен, что победит, и не обращает внимания и действует, не обращая внимания на другого Старейшину [Glossary('ву','podgloss.wu')], слушая только Сёкэна, поскольку он единственный, обладающий мудростью, равной его.\n\nБудущая Судьба\n\nАчитбаатар отказался поверить, что [Glossary('Анда','podgloss.anda')] (не зная о том, что большинство Каинитов не могут перемещаться через Умбру) пришли в физический мир. И поэтому он совершенно не осознавал, что попал в засаду, наблюдая за центром Драконьего Гнезда, когда пылающие стрелы Авангарда Черного Ветра снова убили его."
 POD_persistentpodlore.desc.793538:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nКумуд жил как рыбак и умер как рыбак, потерявшись в море. Его единственной наградой за простую жизнь был Ад Семи Пылающих Морей.\n\nЧеловеку потребовалось много времени, чтобы смириться с этим новым существованием, но ему удалось найти путь назад, главным образом потому, что хозяйка королевства не испытывала к нему никаких сомнений. Кумуд всегда уважала и справедливо боялась моря и знала это. Итак, он вернулся в мир как $pod_kueijin$... не то чтобы он ничего об этом не знал на данный момент, поскольку на острове Люцю не было ни Предка, ни двора, способного его научить. И таким образом он бродил, будучи немногим более чем зверем в течение многих лет. \n\nВполне вероятно, что Кумуд был бы подавлен охотником или группой смертных, если бы не приход Яо Вэя. Юная китаянка $pod_kueijin$ сама едва начинала свой духовный путь, но ее чувство долга было слишком сильным, чтобы позволить Кумуду продолжать свое неистовство. \n Это заняло у нее много времени и, честно говоря, немало удачи, но ей удалось научить его достаточно, чтобы спасти его. \n\nС тех пор Яо Вэй служит своего рода наставником Кумуду, пока она создает свою команду и ее обширное амбиции. Яо Вэй уважает море, но не боится его, а Кумуд одновременно напуган и благоговеет перед ее решимостью. \n\nВ свои самые мрачные дни Кумуд задается вопросом, стоит ли ему бежать на континент, чтобы получить надлежащее образование. В самых ярких своих проявлениях он задается вопросом, любит ли он ее. \n\nБудущая судьба\n\nУвлечение Кумуда своим наставником с возрастом притупится, но его уважение останется. Когда Яо Вэй отправится навстречу своей великой судьбе, он станет уважаемой, хотя и замкнутой частью ее команды. Он возьмет на себя обязанность напомнить своему капитану, что море никогда не следует воспринимать как нечто само собой разумеющееся, даже для \"Океанский бандит\"."
 POD_persistentpodlore.desc.793539:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\n. Несмотря на иронию их названий, Зевсег всегда был одним из самых близких людей к Великому Предку Тугмандаху в первые дни его существования, когда двор Черной Черепахи приобрел известность. Тихий, но всегда хитрый, он обладал терпением и хитростью настойчивого охотника. \nНемногие [akuma|E] могли когда-либо претендовать на то, что выжили на его охоте, и еще меньше тех, кто мог похвастаться таким хвастовством и не пасть в ближайшие годы. \n Преодолевая слабость его смертной конституции, очень много дьяволов пало от его стрел. И поэтому он стал еще более желанной наградой для убийства.\n\nНо по мере того, как двор старел, его навыки притуплялись. Почивая на лаврах своего положения, он дорожил излишествами и привилегиями своего положения, занимая удобные позиции, охотясь на молодых и глупых [akuma|E] и оставляя старших инферналистов [Glossary('повелителей Яма','podgloss.yamaking')] молодым [Glossary('ву','podgloss.wu')], не испытывая ни единого укола раскаяния, когда они встречали ужасную кончину за ужасной кончиной. \n\nДаже сейчас он слишком хочет предаться дворовым играм, связанным с угрозой [Glossary('Анда','podgloss.anda')], которую он не может всерьез считать законной угрозой. Скорее, он навязал его другому [Glossary('ву','podgloss.wu')], в то время как сам отступает к своим излишествам. \n\nБудущая судьба\n\nЗевсег переживет кончину своего кровного брата, но его окончательная судьба неизвестна. Он исчез до того, как упал [Glossary('Анда','podgloss.anda')], последнее, что было слышно из его убежища, это грохот железных цепей и шепот на давно мертвом языке. \n Больше его никто не видел."
 POD_persistentpodlore.desc.793540:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nХотя о «Черном дворе» всегда ходили слухи о его упадке, его часто дискредитируют. В конце концов, если бы это было правдой, разве не было бы так, что его заполонил бы Дампир? По крайней мере, таково официальное обоснование. А Тамир следит за тем, чтобы имидж не был запятнан.\n\nВсегда нежеланный ребенок в своей смертности, Тамир был старшим сыном вождя, но его наименее любимым. Позиция и нарциссизм Тамира всегда раздражали его отца, и он был отправлен в ад, когда его отец, его младший брат, его мать и три его сестры засыпали его стрелами, когда он ударил своего тогдашнего младшего брата из-за гнева за то, что ребенок пролил на него молоко, отправив его в ад с шипами.\n\nОднако его пребывание там было недолгим, так как племя, к которому он был назначен, так быстро устал от него, что выгнало его.\nНаконец-то он нашел родственную душу в Тугмандахе. И еще более высокое призвание — иметь дело с нежелательными Дампирами. Уже отталкиваемый отвратительными гоблинами, называемыми детьми, и всем, что связано с их созданием, он испытывал довольно смущающую гордость уничтожение несанкционированного Дампира, и, несмотря на его подвиги с его [Glossary('ву','podgloss.wu')], его возраст и службу во времена легенд, немногие могут бросить ему вызов, когда он превращает отродье дьявола в мясную жижу.\nПросвещение сложно, и защита мира требует трудного выбора. И по мере приближения [Glossary('Анда','podgloss.anda')] увеличение количества солдат не является причиной загрязнения мира большим количеством детей. Поэтому он будет убивать воинов, и все ради соблюдения закона двора Черной Черепахи.\n\nБудущая судьба\n\nСудьба Тамира стала неожиданностью только для него самого. Когда [Glossary('Анда','podgloss.anda')] начали полномасштабную атаку на двор Черной Черепахи и искали союзников, Тамир угрожал дочери малайского посла $pod_kueijin$, и женщина тут же разорвала его в клочья, как только он коснулся волоса на голове ее дочери."
 POD_persistentpodlore.desc.793541:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nОдин из немногих Предков двора Черной Черепахи встретил насмешками за спиной, ни один придворный Степных Дворов не может отрицать щепку на плече Мадавы. Мадава был скифом, рожденным одним из многих сыновей скифского царя Атея. Но ему посчастливилось стать князем, когда его отец проиграл многочисленные войны королю Македонии Филиппу II, отцу Александра Великого.\n\nПоражения его отца против Филиппа были достаточно ужасными, поскольку они разрушили его королевство, но Первый Всадник нацелился на Мадаву и понес его через просторы земли, завоеванные сыном соперника его отца, насмехаясь над ним и ломая насмешками над тем, что, возможно, возможно, это мог быть он. Его последним зрелищем перед приговором к аду шипастых цепей было наблюдение за маршем греков в долину Инда.\n\nКакое-то время Мадава была трофеем Дохкор-Хана, но первые войны против [Glossary('повелителя Яма','podgloss.yamaking')] освободили его. Его взяли в ряды Всадников Пепельной Равнины в качестве уступки, и он действительно нашел в ней место в качестве генерала.\nОн провел великие кампании против Дворов Зверей и [Glossary('Дохор-хана','podgloss.dokhorkhan')]. Но навязчивые переживания его затянувшейся смерти висят над ним. Он медленно оживляется, его преследуют, и временами ему трудно двигаться.\n\nЕго преследует чувство неполноценности перед невозможным сравнением. [Glossary('Анда','podgloss.anda')] едет, и у него может быть шанс проявить себя. По крайней мере, он так молится.\n\nБудущая судьба\n\nВ начале кампании [Glossary('Анда','podgloss.anda')] Мадава исчез без предупреждения. Что с ним стало, неизвестно. Но в ночь перед тем, как он должен был отправиться на битву с [Glossary('Анда','podgloss.anda')], его слуги могли поклясться, что слышали бой древнего барабана."
 POD_persistentpodlore.desc.793542:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nХотя мнение Судов о смертности всегда было неопределенным из-за семейных структур, которым они подражают, даже они обычно не хотят, чтобы их Предки были слишком вопиющими, позволяя смертным знать слишком много.\nСреди всех Предков двора Черной Черепахи Татахауи относится к этому наиболее распущенно, возмутительно водя смертных любовников через степь и позволяя своим собственным детям выходить и основывать племена, настолько, что ее типичные методы ухаживания теперь являются частой претензией на основание племени, независимо от ее фактического Присутствия.\n\nЕе смертная жизнь была практически забыта, но она знает, что была одной из дунху до того, как они были завоеваны сюнну. Она хотела стать матерью, но обстоятельства смертности привели к тому, что она постоянно была бесплодной и умирала нереализованной из-за особенно скудной зимы.\nНо когда она, будучи грешницей, узнала, что если сбежит, то сможет заполучить Дампира, у Дьявола, заключившего ее в тюрьму, не было шансов.\n\nОна была одной из первых членов двора Черной Черепахи и матерью их первого Дампира. И с тех пор она поступала так, как всегда. Радуйтесь формированию ребенка и наслаждайтесь его воспитанием, прежде чем отойти в сторону и наблюдать, как процветает их род, и делать все это снова и снова.\nОна делала это на протяжении веков, и даже несмотря на то, что [Glossary('Анда','podgloss.anda')] обрушивается на Суды, она отказывается меняться.\n\nБудущая судьба\n\nНесмотря на наличие слоев дампиров, их было недостаточно, чтобы остановить [Glossary('Анда','podgloss.anda')]. Во время бегства она оказалась в ловушке в реке [Glossary('Анда','podgloss.anda')], почти погрузившись в землю, и была беспомощна, пока гнила под солнцем, ее быстро разлагающееся тело смешивалось с тем, что когда-то было ее главным ритуалом ухаживания."
 POD_persistentpodlore.desc.793543:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nНесмотря на его многочисленных врагов, никому не удалось победить Чемпиона Неба. Однако с самого начала на его стороне находится Батболд, Второй Сын Тенгри, один из самых грозных воинов во дворе Черной Черепахи.\nОдин из многих грешников в аду шипастых цепей, Бэтболда боялись даже как мертвеца, поскольку он мог легко одолеть даже любимые племена [Glossary('Дохор-хана','podgloss.dokhorkhan')] и принимать удар за ударом, не произнося ни слова. Бэтболд прекрасно умел использовать свою немоту в своих интересах, будучи ужасной силой кровавой бойни. И когда он, в конце концов, выбрался из Преисподней, он быстро вернулся на родину и нашел верного друга в Ачитбаатаре.\n\nХотя Бэтболд никогда не переставал быть воином, он был удивительно проницательным человеком и стал глубоким последователем Пути Восьми Лотосов посредством спиритизма и медитации. Но когда он не медитирует, весь двор боится безмолвных мышц, к которым может обратиться Ачитбаатар. И вот размышления Бэтболда прерывает шумный [Glossary('Анда','podgloss.anda')], поэтому он занимает позицию согласно желанию друга.\n\nБудущая судьба\n\nДоверие Бэтболда к своему другу привело к его гибели, поскольку их глупые требования охранять Гнезда Дракона привели к тому, что [Glossary('Анда','podgloss.anda')] поймали Бэтболда изолированным и уязвимым, и он жестоко встретил свой конец перед наступлением [Glossary('Анда','podgloss.anda')]."
 POD_persistentpodlore.desc.793544:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nОдин из самых устрашающих Предков двора Черной Черепахи сил [Glossary('Дохор-хана','podgloss.dokhorkhan')], Эльбегсайхан — древний воин Сынов Тенгри, и, несмотря на свою более традиционную репутацию, неортодоксальный.\n\nВсегда красивый мужчина, Эльбегсайхан всегда использовал обаяние и внешний вид в своих интересах, очаровав своего тюремщика, чтобы избежать ада шипастых цепей, а затем заманив [akuma|E] из [Glossary('Дохор-хана','podgloss.dokhorkhan')] на свою гибель, Костяной Цветок быстро заработал репутацию по-настоящему устрашающей фигуры, которая быстро прогрессировала в [Glossary('дхармы','podgloss.dharma')].\n\nОднако в это смутное время Предок сейчас стоит на пороге просветления, и его обычная тактика не работает против [Glossary('Анда','podgloss.anda')] из-за отсутствия либидо Каинитов в привычных ему манерах. И с его растущей отстраненностью от мира он находит все меньше и меньше поводов для беспокойства. [Glossary('Сотня облаков','podgloss.hundredclouds')] так близко, а спасение уже близко, и судьба мира — такая мелочь.\n\nБудущая судьба\n\nВ то время как его [Glossary('ву','podgloss.wu')] выдвинулся вперед, Эльбегсайхан отступил в свое собственное Драконье Гнездо, на бумаге охраняя его, но на самом деле, чтобы сосредоточиться на своем [Glossary('дхармы','podgloss.dharma')].\nМногочисленные [akuma|E] исчезли, и когда [Glossary('Анда','podgloss.anda')] наконец нашел свое убежище, все, что они нашли, это изломанные трупы последователей [Glossary('Дохор-хана','podgloss.dokhorkhan')] и пустой комплект одежды."
 POD_persistentpodlore.desc.793545:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nОдобренные дампиры двора Черной Черепахи очень редко ведут свою собственную жизнь, отдельную от двора. Многие обучены, подготовлены и подготовлены к войне против вездесущего [Glossary('Дохор-хана','podgloss.dokhorkhan')]. И жестокий мастер из Сынов Тенгри является основным ответственным за надзор за такими армиями. \n\nЗемная жизнь Хюнбиша была похожа на жизнь многих людей в древней степи: он был пастухом, который до своей кончины и осуждения в аду вел скучную пастырскую жизнь. \nИменно тогда он узнал о жестокости своего отца-охотника, вот почему он был осужден, и он понял, что именно дети расплачиваются за грехи своих родителей. Когда он сбежал и увидел собратьев-дьяволов, он понял, что должен был сделать. \n\nКаждый дампир, которого он тренирует, расплачивается за грехи своих родителей, ведет войну и умирает во имя них. Он обучил великие армии, которыми руководили Сыны Тенгри, и создал мощную боевую силу в те времена легенд. Но теперь он придерживается старых шаблонов, больше злоупотреблений, чем тренировок, особенно когда дампиры протестуют из-за того, что находятся не на своей позиции, а война против [Glossary('Анда','podgloss.anda')] к ночи выглядит все более хитрой... \n\nБудущая судьба\n\n Несмотря на свои приготовления, Хюнбиш так и не увидел [Glossary('Анда','podgloss.anda')]. Особенно жестокий сценарий обучения привел к тому, что его солдатская собака свалила его в кучу, оторвала ему конечности, морила голодом, привязала петлей к лошади и шлепнула ее на рассвете. Его больше никогда не видели."
 POD_persistentpodlore.desc.793546:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\n Самый младший из Сынов Тенгри, Сансар, тем не менее, очень часто считается мозгом, стоящим за их орденом. Смертный, который при жизни пас коз, а затем грешник Ада Шипованных Цепей, побег Сансара на брюхе дьявольского животного во время первого великого нападения на Ад со двора Черной Черепахи и его очевидные навыки скотовода сделали его легким завершающим этапом для выполнения указаний Сынов Тенгри. \n\n Несмотря на свой темперамент, Сансар чувствовал себя неуместным среди своих [Glossary('ву','podgloss.wu')], искусный в уходе за стадами двора Черной Черепахи, а позже и их главный сельскохозяйственный старейшина. Очень быстро став центральной фигурой Секты Десяти Времен года, Сансар гораздо больше путешествовал и часто посещал двор Желтого Императора и двор Белого Тигра, чтобы обучать новых учеников, прежде чем вернуться на свои пастбища. Но такая специализация лишает его связи с текущим кризисом. \nПо мере того, как [Glossary('Анда','podgloss.anda')] мешают его проектам, он становится все более и более дезориентированным и нервным из-за ущерба, нанесенного его произведениям. Он видит угрозы за каждым углом, и хаос эпохи может сломить его. \n\nДальнейшая судьба\n\nСансар мысленно разобьется под хаосом [Glossary('Анда','podgloss.anda')], смертью его [Glossary('ву','podgloss.wu')] и покинутым другом, и в конце концов он исчезнет с воем в бездне. night.\nПозже Корты-преемники, присоединившиеся к Квинкунсу, будут шептаться о «Диком Предке», подозревая, что Сансар упал со своего [Glossary('дхармы','podgloss.dharma')] так сильно, что стал безмозглым Чи-Ме."
 POD_persistentpodlore.desc.793547:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nСреди младших [Glossary('ву','podgloss.wu')], завоевавших известность во дворе Черных Черепах, лидер Бумажных Драконов, безусловно, является самым загадочным из их числа. Пришедший не из какого-либо из главных адов, Хоркой был найден в Лесу гоблинов, адском ландшафте из паутины и деревьев. \nЕе духовная форма была настолько выпотрошена, пережевана и пережевана, что из нее получился скорее шрам, чем дьявол. Но Ястреб Кумо, как ее стали называть, является лидером в процессе становления. \n\nХоркой специализировался на очистке Линий Драконов от наводнивших их Кумо. Хотя большинство «Бумажных драконов» — учёные, их лидер уникален в том, как она применяет свои знания. Маршируя в ад, наделенная молитвами, реликвиями и сокровищами, она - вертящийся жалящий дервиш смерти, расчищающий пути перехода глубже, к некоему невидимому концу.\n\nРазочарованная Предком и Старейшиной [Glossary('ву','podgloss.wu')] двора, она вместе со Змеями Кровавой Реки и Превосходными Лесными Шепотами присоединилась к Серебряным Клинкам и древним военачальник. Она очищает Драконьи Линии Кумо до самого Ада Шипованных Цепей. С какой целью... только время покажет.\n\nБудущая судьба\n\nУченость Бумажных Драконов и гнев Хоркоя очистили многие Линии Дракона, которые стали критическими отправными точками для наконечников копий, которые позволили $pod_kueijin$ глубоко погрузиться в линии [Glossary('Анда','podgloss.anda')], а затем и в [Glossary('Дохор-хана','podgloss.dokhorkhan')]. Сама Realm.\nХоркой не присоединилась к штурму, а вместо этого прикрывала позиции, чтобы не было засад. Она присутствовала при основании Квинконкса и стала предком Хайлара, наблюдая за линиями Дракона между китайским и степным дворами."
 POD_persistentpodlore.desc.793548:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nХотя термин «Юноша» всегда раздражает его, лидер «Превосходных лесных шепотов» в данный момент мало что может сделать, чтобы остановить подобные оскорбления. Он делает то, чего больше никто не хочет. Он — главное связующее звено двора Черной Черепахи с некоторыми из их самых древних врагов.\n\nЧоно при жизни был сиберахским родственником, набожным и добрым. Единственный муж сиберахского вождя, он стал отцом многих детей, трое из которых были благословлены Первой Переменой. Его жена была доброй и нежной, благородной и героической. Он обожал ее и, оплакивая ее смерть в бою, заботился об их семье, пока не умер от старости на 78-й зиме.\n\nНо Ад мало любит народ Изумрудной Матери, поэтому его ждал Ад Горьких Истин. Но даже там его преданность Изумрудной Матери была путеводной звездой, и он нашел дорогу обратно к своей богине.\nОднако теперь он дьявол и ступает по тонкой земле. Он знает, что Великий Разрушитель украсил его, но это не определяет его. Он предпринял смелые действия, восстановив связь со своими детьми, внуками и другими оборотнями.\nОни видят, что когда-то он был родственником, понимают его тяжелое положение и готовы его выслушать. Он построил свой [Glossary('ву','podgloss.wu')] из духов-единомышленников, тех, кто хочет примирить Павших Чемпионов [Glossary('Нефритового императора','podgloss.augustpersonageofjade')] и Воинов Изумрудной Матери. Им всем придется работать вместе, чтобы победить великую угрозу [Glossary('Анда','podgloss.anda')], бедствие, которое представляет угрозу для них всех.\n\nБудущая судьба\n\n[Glossary('Анда','podgloss.anda')], столь натренированные в убийстве $pod_kueijin$, были бессильны победить Чоно, когда Линии Дракона открылись, и союзники Фера Лесного Шепота врезались в них, как молот. Семью Сиберахов Чоно отправили в Ад Шипованных Цепей, где они помогли уничтожить [Glossary('Дохор-хана','podgloss.dokhorkhan')], поскольку Чоно держал его открытым.\n\nКогда он позаботился о рождении новых Степных Дворов, он милостиво принял роль Предка в холодных уголках Сибири, связующего звена между Дворами Мертвых и Дворами Зверей."
 POD_persistentpodlore.desc.793549:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nA опасная игра ведется под носом у [Glossary('Анда','podgloss.anda')] и двора Черной Черепахи. Тот, где тонкая линия проходит по тонкой линии отважного нового дьявола, решившего проявить себя. \n\nХонгорцецег, как одной из $pod_kueijin$, еще меньше ста лет, но она уже начала производить впечатление своим [Glossary('ву','podgloss.wu')] из Змей Кровавой реки. Умерев в пустыне Гоби, а затем попав в ад, где с нее заживо сдирали шкуру из-за гордости своего отца, Хонгорцецег научилась делать многое с очень малыми средствами. Обнаруженная как грешница в остром песке, принявшая облик Червя Смерти, она произвела фурор в политике двора Черной Черепахи, установив Алые Экраны в охотничьих угодьях [Glossary('Анда','podgloss.anda')] и нанося удары по солдатам [Glossary('Анда','podgloss.anda')] в земле, используя свой собственный Дьявольский Синтай, чтобы зарыться в норы и найти их в наиболее уязвимых местах. Но когда ее неортодоксальная тактика была встречена насмешками, она передала свою информацию Серебряным Клинкам, решив не допустить, чтобы ее шпионская сеть пропала даром. \n\nЕсли ее обнаружат, это будет либо скандалом для двора Черной Черепахи, либо разрушением [Glossary('Анда','podgloss.anda')]. Но она знает, как спуститься на землю. И если [Glossary('Тоу-Му','podgloss.toumu')] не смог сломить ее, то и они не смогут. \n\nДальнейшая судьба\n\nГраница Хонгорцецега между ложью, храбростью и тщательным планированием окупилась. Когда двор Черной Черепахи пал и была запланирована контратака, она представила себя целью для многочисленных боевых групп [Glossary('Анда','podgloss.anda')] и внушающего страх Авангарда Черного Ветра, играя с ними в смертельную игру в кошки-мышки. \nОна добилась успеха и выследила их обратно в Сибирь. Когда был сформирован Квинконкс, она с гордостью стала Предком того места, где находились ее шпионы вдоль реки Орхон, а позже стала Предком Дархана в «Новых ночах»."
 POD_persistentpodlore.desc.793550:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nA и откровенно ненавистной фигурой во дворе Желтого Императора. Айсултан, пожалуй, самый мстительный член Бесплодных Ветров, даже более ревностный, чем его кровный брат Таругха.\nРожденный среди Кёк-тюрки и солдат их армий, когда они вторглись в Китай, Айсултан так и не простил «пренебрежения», которым стала его смерть от китайской стрелы во время первых вторжений. Он так и не смог смириться с невозможностью увидеть всю мощь силы Восточного Гектюрка, поэтому своей миссией в нежизни он поставил задачу быть уверенным, что общества мертвых никогда не забудут, насколько они велики. В каждой стычке между двором Черной Черепахи и двором Желтого Императора Айсултан всегда стоит во главе, прерывая просвещение мирных и декадентских Предков Китая.\n\nДаже сейчас, когда [Glossary('Анда','podgloss.anda')] приходят с севера, он смотрит на юг, наказывая тех, кто слишком самодовольен, даже когда горят дворы.\n\nБудущее Fate\n\nНастойчивость Айсултана в конфликте гарантирует, что он встретит свою вторую смерть так же, как и первую. В схватке на границах Дворов Айсултан встретила свою судьбу у клинка восходящей звезды Ма Хай-Лан, что стало первой по-настоящему великой победой в ее карьере."
 POD_persistentpodlore.desc.793551:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nУрождённый кыргызстанцем, Улугбек был ребенком эпохи великих перемен. Его отец, мелкий генерал Кыргызского каганата, Улугбек присоединился к их армиям как поистине устрашающий смертный наездник, используя свои колоссальные размеры, чтобы внушать страх. Но за такую ​​силу пришлось заплатить цену: он умер от сердечного приступа из-за своего размера в середине боя. \n\nВ аду шипастых цепей она снова пришла ему на помощь, когда одна из цепей, которые поднимали его, сломалась под тяжестью титана. И взятый в Бесплодные Ветры, он легко стал их кулаком. Будучи больше дьявола, только лошади Бакемоно могли выдержать его вес. И он стал поистине ужасной угрозой для любого несчастного [akuma|E], посланного против него, и в конфликте Пустошных Ветров с двором Желтого Императора, для любой несчастной души, посланной противостоять ему. \n\nНо теперь он обеспокоен. Последние остатки Кыргызского каганата были поглощены монголами, и теперь их коллеги [Glossary('Анда','podgloss.anda')] маршируют. И, несмотря на свою силу, он беспокоится, что может прийти следующим. \n\nБудущая Судьба\n\nУлугбек был единственным Бесплодным Ветром, пережившим [Glossary('Анда','podgloss.anda')], поскольку он быстро осознал угрозу, которую они представляли из-за того, что случилось с его смертными родственниками. Он незаметно перешел на сторону Воинов Хэбэйской равнины и Серебряных Клинков и сражался в их нападениях. \nОн был одним из старейших представителей Степных дворов при формировании Квинкункса и ушел в отставку, чтобы стать Предком в Степи."
 POD_persistentpodlore.desc.793552:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nA реликвии Империи хунну, и, по-видимому, его меньше всего боятся из Бесплодных Ветров, многочисленные убийства во дворе Желтого Императора сопровождаются порывами пустых ветров. \nA Дружелюбное лицо всегда ведет к мертвому предку. по крайней мере, так утверждают недоброжелатели Аньканга. \n\nАнканг, пожалуй, самый тонкий член Предка [Glossary('ву','podgloss.wu')], явный и наиболее реализованный раскручиватель интриг на орбите двора Черной Черепахи. Лежа так легко, как дышит, уделяя мало внимания вопросам [Glossary('дхармы','podgloss.dharma')], не считая убийства нечестивцев, и находя моногамию нелепой концепцией, грешница из унылых пустошей ада, где снимают шкуру заживо, похоже, наслаждается быть всем и ничем одновременно. \n\nМногих врагов двора Черной Черепахи заставили замолчать ее сети, и с появлением [Glossary('Анда','podgloss.anda')] По отношению к ним она, кажется, все больше сосредоточена на своих недоброжелателях во дворе Желтого Императора.\n\nБудущая судьба\n\nПосле кончины Ван Хунбэня значительное количество Предков двора Желтого Императора заподозрили, что Анькан был виновником убийства.\nВпервые в истории она отрицала, что убийство совершила она. своя, но так наврав, ей никто не поверил. Ее паническую кончину устроил великий судья Цян Ру, назначив ей окончательную смерть за преступление, даже если все еще было сомнительно, что это совершила она."
 POD_persistentpodlore.desc.793553:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\n Быть выгнанным из [Glossary('ву','podgloss.wu')] — это редкая и шокирующе унизительная вещь. Очень редко изгнанный участник когда-либо прощает пренебрежение, и, что еще хуже, некоторые могут затаить обиду. \n\nСаекаэ сделала больше, чем просто затаила обиду. \n\nСаекаэ когда-то была воином равнины Хэбэй в ее первые дни, пока вражда с Мапо из-за его приличия не привела к тому, что она убила одного из их дампиров, что привело к ее изгнанию из [Glossary('ву','podgloss.wu')] с столь же грязным разводом.\nЕе вражда с Мапо, а затем с Маэдаэри обострилась еще больше, поскольку затем она присоединилась к Бесплодным Ветрам [Glossary('ву','podgloss.wu')], как их преданному бичу против Воинов Равнины Хэбэй.\n\nПоскольку Воины были нейтральным буфером, двор Желтого Императора не стал бы беспокоить ее постоянными набегами, и Двор Черной Черепахи ее не остановил. Благодаря своему опыту работы в этих Дворах, она умеет их эксплуатировать, но ее вспыльчивость идет ей на пользу. \n\nДаже сейчас, несмотря на гораздо более серьезные проблемы, ее вражда против бывшего все еще горяча, поскольку они сражаются, пока приближается [Glossary('Анда','podgloss.anda')]. \n\nБудущее Fate\n\nИсчезновение Саекаэ было шокирующим, поскольку одна из уловок, чтобы преодолеть Мапо, заставила ее завести нового любовника без имени. Но затем она исчезла, и больше ее никто не видел. По крайней мере, так оно и есть. \nMapo может поклясться, что после гибели [Glossary('Дохор-хана','podgloss.dokhorkhan')] у одного из Всадников появился адский зверь с глазами, идентичными Саекаэ. Даже несмотря на вражду, он надеется, что это не она. Но часть его напугана тем, что худшее уже произошло."
 POD_persistentpodlore.desc.793554:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nИзвестная немногим, но любимая ею [Glossary('ву','podgloss.wu')], Целебное Пламя легко считается самым важным членом их внутреннего [Glossary('ву','podgloss.wu')]. По крайней мере, между собой.\n\nПока Огненный Шторм рыскает по пустыне Гоби в поисках реликвий и ресурсов, Присутствие [Glossary('Анда','podgloss.anda')] и естественные опасности пустыни делают такие экспедиции сложной задачей даже для Предка [Glossary('ву','podgloss.wu')]. Таким образом, алхимик, который занимается зельями чистой сущности, невероятно ценен. \n\nМирай всегда была мудрой женщиной, даже когда она была смертной в степи. Не рожденная ни в одной из империй, она была просто еще одним турком, который жил и умирал на открытых полях, и ее жизнь врача вызвала гнев Рангды и отправила ее в ад роющих личинок. Но зная, как исцелить себя, она могла вырваться на свободу и сбежать. \n\nЕе понимание медицины сделало ее легким выбором для Мудрых Многоножек, и поэтому она обратила свою алхимию на эти занятия и вместе с друзьями присоединилась к Огненной Буре [Glossary('ву','podgloss.wu')], потому что ее искусство было необходимо. Ее зелья были востребованы во дворе Черной Черепахи, и, поскольку Сян Ли выступал в роли торговца, Мирэй довольна своим одиночеством и лекарствами. \nНастолько, что она почти не обращала внимания на [Glossary('Анда','podgloss.anda')], штурмующего пустыню, которую они так часто исследуют. \n\nДальнейшая судьба\n\nМирай всегда была в центре внимания. ее [Glossary('ву','podgloss.wu')]. Убийцы [Glossary('Анда','podgloss.anda')] узнали об этом и первыми напали на нее, чтобы разлучить их. А с ее кончиной двор Черной Черепахи лишился своего величайшего врача."
 POD_persistentpodlore.desc.793555:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nЭксперт по Линиям Драконов в пустыне Гоби, обширные просторы пустыни таят в себе множество скрытых источников силы. И даже больше, чем Дворы Зверей, Чагур знает эти пески лучше, чем кто-либо другой. \n\nA Керайт, которая когда-то исследовала их до прихода к власти монголов, Чагур, возможно, и не была наездницей, но она хорошо знала такие места. Но пустыни всегда опасны даже для самых опытных путешественников, и это требовало ее. \n\nБолее структурированная природа Ада с заживо шкуры была удивительно более предсказуемой, и побег Чагура оказался намного проще, чем из пустыни Гоби. И в своем опыте $pod_kueijin$ в Огненной Буре она стала мастером Божественного Тела Огня и использовала Искусства Души Мертвых, чтобы лучше контролировать поток сущности через пустыню. Хотя она постоянно конфликтует с другими Предками из-за «своих» владений, никто не может отрицать, что она мастер своего дела. \nНо поскольку [Glossary('Анда','podgloss.anda')] все больше и больше Присутствия в пустыне Гоби, конфликт становится неизбежным.\n\nБудущая судьба\n\nС кончиной Мирай, Чагур Затем [Glossary('Анда','podgloss.anda')] стал мишенью для длительной охоты, изнурил ее и, в конечном итоге, преследовал ее до рассвета, оставив ее солнцу, а [Glossary('Анда','podgloss.anda')] снова погрузился под землю."
 POD_persistentpodlore.desc.793556:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nПоскольку пустыня Гоби попадает под влияние [Glossary('Анда','podgloss.anda')], [Glossary('ву','podgloss.wu')], посвятившие свою не-жизнь исследованию и сбору ее многочисленных сокровищ, должны быть всегда бдительны и бдительны. И поэтому услуги Песчаного Скорпиона сейчас актуальны как никогда.\n\nКогда-то охотник, перед смертью и осуждением на [Glossary('Какури','podgloss.kakuri')], Джагамбу вернулся домой в степь благодаря ощущению тепла от богатых драконьих линий пустыни Гоби. Его призыв к этому заставил его с готовностью попасть на орбиту Огненного Шторма, где он применил свои навыки охотника и своего нового Дьявольского Синтая в качестве хранителя границ их операций, преследуя его границы, в то время как остальная часть его [Glossary('ву','podgloss.wu')] выполняет свои собственные задачи на его песках.\n\nХоть он и не признавался в этом (и на самом деле изо всех сил старался это скрыть), [Glossary('Анда','podgloss.anda')] было слишком много, чтобы он мог с ними справиться. Его старые границы повреждены, а духовные вены меняются.\nОн преследует их более упорно, ища способ переделать работу своей драгоценной не-жизни.\n\nБудущая судьба\n\nПоследним из своего [Glossary('ву','podgloss.wu')], который упал, Джагамбу смог спрятаться лучше, чем остальные его [Glossary('ву','podgloss.wu')]. Но в конце концов, когда его союзники были мертвы или рассеяны, он остался один и, таким образом, стал легкой добычей для Сородичей-хозяев Степи."
 POD_persistentpodlore.desc.793557:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nСпециалист по поиску реликвий в пустыне, Тайбука, пожалуй, самый терпеливый $pod_kueijin$ во всем Августейшем дворе. Ему придется выполнять свою работу по поиску реликвий и артефактов в пустыне Гоби, активно прочесывать песок дюйм за дюймом глубокой ночью, отбиваясь от сверхъестественных угроз, которые его беспокоят, прежде чем он вернется к своему прочесыванию.\n\nХотя в своей жизни он был всего лишь еще одним скотоводом, пребывание в аду перевернутых грешников дало ему некоторую перспективу. Зачем торопить события? Теперь у него есть все время мира. И такой образ мышления сделал его идеальным союзником для Огненной Бури [Glossary('ву','podgloss.wu')], а затем и центральным членом.\nВозможно, он медленно реагирует на изменения, но он впечатляюще дотошен, и хотя у него есть слабость к деликатесам плоти, это не отвлекает его от работы.\n\nПодавляющее большинство реликвий Огненной Бури было найдено им, и даже сейчас он все еще находит что-то, снова и снова прочесывая пустыни, пока их штурмуют [Glossary('Анда','podgloss.anda')].\n\nБудущая судьба\n\nТайбука был очень напуган смертью Мирая и сбежал как можно глубже в пустыню Гоби, чтобы переждать [Glossary('Анда','podgloss.anda')]. Его считали мертвым, пока его снова не нашли через 200 лет после его исчезновения после поражения [Glossary('Дохор-хана','podgloss.dokhorkhan')].\nИ в современность он по-прежнему прочесывает пустыню Гоби в поисках сокровищ."
 POD_persistentpodlore.desc.793558:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nВождь среди печально известных жестоких наездников с черными копытами, которого многие [akuma|E] встречают, - это ужасный Исиха. Судья, присяжный и палач двора Черной Черепахи, Бунраку преданно служил в этой роли с момента своей смерти и освобождения от Ланки. \nВсегда солдат и тупой за пределами своей работы, его внимание к деталям и неустанное преследование, смелость и слепая убежденность делают его неразумным монстром для многих угроз, с которыми он сталкивается. Но примечательно, что с такой яростью его временами очень легко подстрекать, что делает его печально известным как легкий инструмент для устранения соперников. \n\nОн получил множество порицаний со стороны двора Желтого Императора, но его, честно говоря, не волнует, что о нем говорят мягкие предки центра. Он убийца. Он знает это. И его это устраивает. А если кто-то забыл, он напомнит им. \n\nИ, кажется, с [Glossary('Анда','podgloss.anda')] нужно хорошо поговорить.\n\nБудущая судьба\n\nВ начале, когда [Glossary('Анда','podgloss.anda')] топчет двор Черной Черепахи, два судьи должны были meet.\n\nЧинкай не помнил Исиху в течение месяца после его убийства."
 POD_persistentpodlore.desc.793559:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nХотя наездники с черными копытами имеют репутацию зверей, одна только сила может помочь вам только до определенного момента. Войска [Glossary('повелителей Яма','podgloss.yamaking')] хорошо умеют заглубляться, прятаться, активно скрывать свое Присутствие и закапываться. Для их искоренения требуется не только сильный, но и достаточно способный, чтобы перехитрить их и взломать их твердыни. А для смертоносного кулака двора Черной Черепахи Думу — их проводник, их стратег, генерал и военный наставник. \n\nТак же упрям ​​и гневен, как и его соотечественники, однако его ум остер на полях войны. Несмотря на отсутствие богословия, он является хорошим тактиком и даже читал тексты Сунь Ли об их продолжающихся стычках в «Сумеречной войне». \nA специалист по борьбе с [akuma|E], у него есть легендарная история военных успехов против них. И в отличие от почти всех остальных во дворе Черной Черепахи, он воодушевлен тем, что [Glossary('Анда','podgloss.anda')] стали серьезной угрозой. \n\n Он так долго желал нового испытания, и [Glossary('Анда','podgloss.anda')] наверняка его предоставит. \n\nДальнейшая судьба\n\nДуму действительно осуществил свое желание. стратегически равные и даже превосходящие его. Его обычная тактика против [akuma|E] не учитывала Превращение [Glossary('Анда','podgloss.anda')], и когда он возглавил силы против них, он уничтожил воинство Всадника Черного Копыта в засаде, в которой погиб он сам и большая часть его [Glossary('ву','podgloss.wu')]."
 POD_persistentpodlore.desc.793560:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\n. Несмотря на репутацию двора Черной Черепахи, немногие из них до сих пор активно практикуют конную стрельбу из лука в качестве основного средства боя. Проще говоря, их Дьявольские и Душевные Искусства, Синтай и Божественные Тела делают такие механизмы войны довольно сложными, поскольку лошади не успевают за ними. Таким образом, большинство сражений между $pod_kueijin$ больше похожи на дуэли, чем на настоящие рейды. \n\n В любом случае, большую часть времени. \n\nПовелитель Дьявольского Ветра, Гиахун применил искусство степи к существованию $pod_kueijin$. Поражаясь как пятно и исчезая, она — главный мастер такой тактики в своем дворе. Как и другие Всадники с Черными Копытами, она воин, чистый и простой. Она появляется, застреливает свою цель и убегает за горизонт, прежде чем они поймут, что произошло. \n\nПо приказу своего мужа Думу она является ужасом на поле боя, непоколебимой перед любой опасностью и подобным рвением, со всей гордостью, которую можно было бы себе представить у такого воина. И, как и Думу, она с нетерпением ждет возможности увидеть, что [Glossary('Анда','podgloss.anda')] может ей бросить. Она никогда не была более готовой. \n\nДальнейшая судьба\n\nГихун, как и Думу, попал бы в ловушку [Glossary('Анда','podgloss.anda')] из-за того, что Думу не смог предсказать Превращение. Она умерла вместе со своим мужем, опустошенная яростью [Glossary('Анда','podgloss.anda')]."
 POD_persistentpodlore.desc.793561:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\n. Поскольку [akuma|E] настолько неисчерпаемы, работа Судов никогда не заканчивается. В их собственных руках, при помощи экранов и других средств Сумеречной войны бесконечная битва всегда требует большего количества мечей и когтей. И в этом отношении дампиры являются одними из их величайших активов. И даже в [Glossary('ву','podgloss.wu')] Воинов, таких как Всадники Черного Копыта, пока они проводят большую часть своих боев, Присутствие Дампира никогда не повредит.\nЭто не значит, что беременность останавливала Согиэн раньше.\n\nСтепная женщина, которая встретила свою смерть во время родов, бегство Согиен из [UmbraGlossaryLocalized('yomi_wan','ад Йоми')] - это не то, что она помнит ясно, но большую часть ее прошлое не совсем ясно. Но теперь, по крайней мере, Согиен решила, что ей следует восполнить то, что она потеряла в жизни. \n\nВыпустив более сотни дампиров за время своей воинской службы, резая косы во время беременности и, по слухам, будучи любовницей каждого мужчины во дворе Черной Черепахи, она, тем не менее, была основой военных кампаний Черных Копыт. И теперь, когда [Glossary('Анда','podgloss.anda')] начинают вторгаться в свои владения, ее силы особенно необходимы. \nИтак, она приступила к работе, закладывая основу для новых Дампиров, которые выступят против нападения [Glossary('Анда','podgloss.anda')]. \n\nДальнейшая судьба\n\nКак Думу и Гиахун, Согиен встретит свой конец во время обреченного нападения Думу, погибнув на поле битвы после того, как ее застрелили. [Glossary('Анда','podgloss.anda')] знали, что она была источником большей части их дампиров, поэтому она была первой из Черных Копыт, которая пала."
 POD_persistentpodlore.desc.793562:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nПосле того, как Outriders сделали величайший подарок [Glossary('Дохор-хана','podgloss.dokhorkhan')], последней невесте степного лорда, который чуть не разрушил две империи, по всем правилам Ильдико никогда не должен был видеть [Glossary('Дохор-хана','podgloss.dokhorkhan')], которому суждено умереть далеко за пределами досягаемости [UmbraGlossaryLocalized('yomi_wan','ад Йоми')]. Однако марш гуннов был омрачен Всадниками [Glossary('повелителя Яма','podgloss.yamaking')], и со двора Атиллы Гунна его последняя жена была их призом. \n\nТакая красивая, что она убила своего мужа кровью из носа в первую брачную ночь, Всадники схватили ее в хаосе его смерти и принесли во владения своего [Glossary('повелителя Яма','podgloss.yamaking')], убили ее и предложили ей [Glossary('Дохор-хана','podgloss.dokhorkhan')] как избранный грешник. Ильдико сразу же стала призовой невестой того проклятого племени в его аду, которое предпочитал [Glossary('Дохор-хана','podgloss.dokhorkhan')]. \n\nНо времена меняются.\n\nПосле успеха потомков Добрула [Glossary('Дохор-хана','podgloss.dokhorkhan')] отвлекся. Ильдико, долгое время считавшаяся просто красивым лицом и пустыми глазами, вместе с другими невестами организовала их побег с помощью серии взяток, соблазнений и убийств, чтобы обеспечить их побег. А вернувшись в мир живых, архитектор их свободы Ильдико объединяет вновь сформированный [Glossary('ву','podgloss.wu')] невест-дьяволов. \n\nЖелая оставаться мобильной, чтобы избегать Всадников, Ильдико внешне возглавляет [Glossary('ву','podgloss.wu')] как дипломаты, но она хочет большего. На одну ночь она была Королевой. Она очень скучает по этому. И она и ее новые сестры страдали в Аду гораздо дольше, чем существовало большинство Предков двора Черной Черепахи. Она жаждет большего.\n\nA трофей в аду, она клянется быть большим.\n\nДальнейшая судьба\n\nИльдико сохраняла мир так долго, как могла, но когда стало ясно, что ее война неизбежна, она переместила своих сестер и себя на север, позволив [Glossary('Анда','podgloss.anda')] вонзил свой клинок в панцирь двора Черной Черепахи. \n\nКогда началась контратака, Ильдико возглавил Безмолвные Леса в качестве переговорщика и посредника. Координируя их войско, ей было присвоено звание Предка, что позволило ей немедленно начать наращивать свою власть. \nВ современные ночи она вместе с Джи Ён незаметно помогает Восстанию Века, глядя на Квинконкса с голодом отвергнутой Королевы."
 POD_persistentpodlore.desc.793563:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nХотя подавляющее большинство инфернальных угроз, с которыми знакомы Голодные мертвецы, являются продуктами [UmbraGlossaryLocalized('yomi_wan','ад Йоми')], безумных мечтаний человечества или проявлений энтропии, существуют и более редкие силы.\nОдним из таких ужасов является хтоническая сущность, известная как Садовник Ада, Сарисель. Призванный магами давным-давно, завоевания монголов разрушили дом Привязанного, и некоторые из его последователей привезли его на Корейский полуостров для сохранения. Там демон зачал ребенка от местной женщины. И с тех пор Джи Ён терпит неосмотрительность своего отца. \n\n Готовая стать инструментом своего адского отца даже после его ухода, она была обучена быть одним из его силовиков, несмотря на протест своего сердца. Но клинок Охотника на Демонов не заботился о том, как она желала свободы, и они специально гарантировали, что она отправится в самые глубокие ямы Земной Тюрьмы. \n\nНо Ад не признал в ней нечто, принадлежащее ему. И поскольку она всегда отвергала волю своего отца, более глубокая тюрьма, к которой он принадлежал, не звала ее. \n\nПосле побега ее вдвойне инфернальная природа сразу же поставила ее под подозрение, и поэтому Джи Ён понимает, что даже наставничество со стороны могущественных Предков не может спасти ее. Только действие может. Поэтому она собрала еще четырех учеников с таким же импульсом и привела их в [Glossary('Анда','podgloss.anda')].\n\nВсе дворы боятся их, так что где лучше, чем доказать свою ценность?\n\nБудущая судьба\n\nХотя подвиги Джи Ён не праздновались напрямую за пределами Степи, она была несомненно, решающая часть победы над [Glossary('Анда','podgloss.anda')]. В то время как большинство Предков видели только каинитских военачальников, Джи Ён знала, что у каждого вдохновителя есть свои сторонники. \n Бесчисленные союзники [Glossary('Анда','podgloss.anda')], а именно Эрк, оказались под постоянными преследованиями и кампаниями «нападай и беги», в то время как Джи Ён использовала скрытые тропы в Умбре, чтобы проникнуть глубже. Хотя они будут ненавидеть ее, она не позволит им спасти Добрула. Но ее отсутствие признания и продолжающееся осуждение наполняют ее яростью, поэтому она присоединяется к Ильдико в «Современных ночах» в поддержку восстания века, чтобы наказать дураков, которые все еще считают ее не более чем безмозглым злодеем."
 POD_persistentpodlore.desc.793564:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nПоскольку Сабина стала свидетелем империи, в которой она родилась, чтобы вступить в суровый период упадка кочевых сил, и будучи замужем за ней, она чувствует, что слишком хорошо знает судьбу двора Черной Черепахи. В конце концов, сколько раз она видела это раньше? \n\nРожденная дочерью мелкого византийского купца, завоеванного Аспарухом после битвы при Онгале, Сабина прожила большую часть своей жизни в тени таких завоеваний. Проданная родителями хану, ставшему императором, Сабина была одной из многих его жен, и хотя ее красота действительно заслужила особое внимание Аспаруха, отсутствие детей привело к тому, что после его смерти она осталась одна, без союзников, в чужом дворе. И именно здесь Всадники нанесли удар, похитив ее, уведя в степи и принеся в жертву [Glossary('Дохор-хана','podgloss.dokhorkhan')].\n\nДовольная подношением, Сабина стала одной из дьявольских невест, подаренных любимым грешникам [Glossary('Дохор-хана','podgloss.dokhorkhan')].\n\nНо после их недавнего побега под Теперь, когда внимание [Glossary('повелителя Яма','podgloss.yamaking')] рассеяно, Сабина видит в [Glossary('Анда','podgloss.anda')] просто еще одну итерацию бесчисленных угроз, которые она видела в аду, а в Августовских дворах - как еще одну смесь оседлых народов, слишком довольных своей судьбой, чтобы справиться с проблемой. И она закончила заново переживать эту трагедию. \n\nВнешне будучи дипломатом вместе со своими сестрами-невестами, Сабина уже незаметно передавала информацию о действиях Безмолвной Поляне и их союзникам-Предвестникам. Как и ее сестры, она хочет большего. И у нее будет больше.\n\nДальнейшая судьба\n\nПока ее [Glossary('ву','podgloss.wu')] продолжал заниматься своими делами, Сабина обеспечила себе рычаги влияния, от которых им пришлось бы отказаться. И когда пыль осела на [Glossary('Анда','podgloss.anda')], она осталась рядом со своими сестрами и построила свою собственную мощь. А в современности, когда Вековое восстание сотрясает Квинконкс, мятежные студенты и охотники за смертными всегда смогут найти спонсора в лице Сабины."
 POD_persistentpodlore.desc.793565:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nВ то время как для большинства остальных ее собратьев-Дьявольских Невест унижение быть женами Излюбленного Племени [Glossary('Ад шипастых цепей','podgloss.hellspikedchains')] было новым, для Пероздухт это была просто ее жизнь.\n\nA Сасанидская принцесса была захвачена эфталитами и взята в качестве трофея за их завоевания. Когда за ней пришли Всадники, в то время это было просто еще одной трагедией ее существования. Но после ее жертвы осознание того, что это состояние бытия может быть всем, что ей осталось, что-то пробудило в Пероздухте. \n\nКогда [Glossary('Дохор-хана','podgloss.dokhorkhan')] была в восторге от успеха [Glossary('Анда','podgloss.anda')], именно Пероздухт подтолкнул ее сестер к побегу. Именно она держала их вместе, поддерживала в испытаниях и невзгодах и утешала в бегстве. И когда они вернулись в мир смертных, именно она предложила им остаться вместе, когда всем не хватало слов, чтобы описать желание одного и того же. \n\n Хотя внешне она всего лишь еще одна красавица Безмолвных Лесов, внутри она — их сердце и душа, их утешение и проводник. Хотя она, как и все остальные, желает величия, она не потеряет ни одну из своих сестер. Они вместе прошли через ад, и она увидит, как они все снова станут королевами.\n\nБудущая судьба\n\n Благодаря своей заниженной роли в Безмолвных полянах Пероздухт не была вознаграждена никакими Предками после кончины [Glossary('Анда','podgloss.anda')], но ее сестры отказались расстаться с ней, и она стала их связующим звеном. ткань.\n\nВ грядущих «Современных ночах» она также разжигает пламя их голода. Когда Квинконкс потерпит неудачу, они станут новыми героями, которые возвысятся над ними. В конце концов, кто лучше сможет противостоять [Glossary('Императора демонов','podgloss.demonemperor')], чем те, кто переносил ад гораздо дольше, чем большинство других?"
 POD_persistentpodlore.desc.793566:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\n. Однако Чангле, первое отличие от стандартных методов сбора коллекции Outrider, представляла особый интерес для [Glossary('Дохор-хана','podgloss.dokhorkhan')], благородной дочери претендента на Китай, вышедшей замуж за степного владыку. Итак, когда Чанглэ впервые встретила Бумин Кагана из Гёктюркского каганата, она не подозревала о скрывающихся в тени дьяволах. \nВ конце концов, она была всего лишь фигурой на доске между Вэй и Гектюрками, и дворовая политика была гораздо более актуальна для благородной женщины, которая делала все возможное, чтобы избежать преждевременной кончины. Но когда ее муж умер от старости и глаза отвернулись от нее, Всадники напали, утащили ее в степи и отправили в [Glossary('Ад шипастых цепей','podgloss.hellspikedchains')], чтобы она стала Дьявольской женой любимого племени Дохкор-Хана. \n\nЧангле томилась в аду, будучи вынужденной быть трофейной женой, хотя на самом деле у нее было намерение править. Логистика и численность были ее сильной стороной, но все, что ее интересовало, это то, насколько хорошей невестой она была. \nПоэтому, когда [Glossary('Дохор-хана','podgloss.dokhorkhan')] праздновал [Glossary('Анда','podgloss.anda')], она с готовностью присоединилась к своим сестрам в побеге из ада. Но опять же, ее встретили многие, кто игнорировал ее и видел в ней только красивое лицо. Она сжимает зубы, зная, что может быть кем-то большим.\n\nПока она будет играть эту роль, но как только она сможет освободиться от нее, она перестанет быть идеальной конфеткой для рук.\n\nБудущая судьба\n\nНастоящая политика Безмолвной Поляны обеспечит Чангл предков в Квинконкс, но даже тогда Безмолвная Поляна по-прежнему считалась красавицей, у которой мало что было за глазами. \nИтак, она приняла этот пост и решила глубоко и основательно построить свои владения Драконьих Гнезд. И в современности, когда Молодые Мертвецы Века Восстания стремятся нанести удар по Предкам, у Чанглэ всегда есть наготове благоразумный человек."
 POD_persistentpodlore.desc.793567:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nКогда-то Сяого была драгоценным камнем Дьявольских невест Дохор-хана, а теперь главным дипломатом Безмолвной поляны между дворами. Сяого занимает незавидное положение, которое она занимает с шокирующим удовольствием.\n\nПри жизни Сяого, дочь императора Танского Сузуна и вышедшая замуж за Баянчур-хана Уйгурского каганата за год до его смерти, Сяого, возвращаясь к отцу после его смерти через год после их свадьбы, была поражена трагедией, и Всадники, ища приз в виде ребенка императора в одиночестве, поскакали и утащили ее в степи.\n\n[Glossary('Дохор-хана','podgloss.dokhorkhan')] была в восторге от этой жертвы, и, как последняя Невеста-Дьявол, Сяого была самой безутешной из ее сестер, а до их побега - самой меланхоличной.\n\nНо побег изменил ее. Этот первый вздох без ада, и она никогда не хотела, чтобы он закончился. Она поклялась что-то построить, испытать все это и по-настоящему жить. Она умерла почти женщиной, а теперь стала могущественной бессмертной.\nПроклятие, которое она уже почувствовала, и теперь она могла претендовать на мир. От самой депрессивной до самой энергичной, Сяого наслаждается своей ролью дипломата между дворами, поскольку теперь она может не только видеть мир, но и то, что она однажды может забрать.\n\nБудущая судьба\n\nКонтакты Сяого во Дворах позволили Тихой Поляне избежать нападений [Glossary('Анда','podgloss.anda')], а постоянное Присутствие Сяого гарантировало, что Квинкунс хорошо вознаградит их.\nНо этого было недостаточно, чтобы удовлетворить ее новую любовь к жизни. Она полностью разделяет амбиции своих сестер и играет роль милой и веселой посредника в трудные времена, следя за тем, чтобы ни один взгляд не упал на ее воинствующих сестер."
 POD_persistentpodlore.desc.795014:0 "Этот персонаж является частью [Glossary('Мира Тьмы','game_concept_world_of_darkness_desc')], но имеет очень ограниченную биографию. Поэтому разработчики PoD расширили её для придания большей глубины сеттингу.\n\nИндре, с того момента, как она сделала свой второй вдох, не было позволено ничего, кроме бури.\n\nВторой «ребёнок» Ситы и ученица Шивы-Ома, Индра-га с самого начала была одной из основателей Лика богов. Помня немногое из своей смертной жизни, и ещё меньше из своего пребывания в Тысяче преисподних, за пределами ужасного пронизывающего ветра и железных бурь, она стала глубоко ценить новую семью, в которую попала.\nНо там, где её собратья-ученики замкнулись в своём стремлении к просветлению, она предпочла стать центром их коллектива. Именно здесь многие бы дрогнули, либо из-за недостатка присутствия, либо из-за недостатка воли, либо из-за недостатка умения прокладывать путь, основанный прежде всего на самовосхвалении.\n\nНо Индра-га почувствовала себя как дома в эпицентре бури. Настолько, что это стало божественностью, которую она искала.\n\nВ конечном счёте она стала бы центром мирской власти в Небесном племени. Благодаря сочетанию амбиций, упорства и харизмы ей удалось бы удержать их вместе. Хотя она и не была генералом, её способность уравновешивать тех, кто был, и тех, кто хотел быть, а также выбирать сражения позволили Небесному племени противостоять нападениям со всех сторон в рамках Вечной войны.\nИ по мере того, как мир движется вперёд, к следующей эпохе, она продолжает этот дикий танец, пока титаны сталкиваются в буре вокруг неё, а она продолжает преследовать его сердце ради своей новой семьи и собственного величия.\n\nДальнейшая судьба в каноне\nВысокомерие Индры-га в сердце бури, которая есть Вечная война, было, по крайней мере, не лишено оснований.\nДаже во времена Долгой ночи, бедствия [Glossary('Анда','podgloss.anda')], образования Квинконс и даже Недели кошмаров Индра-га вела Небесное племя к современности, обладая достаточной политической властью и дипломатической смекалкой, чтобы отправить послов к их традиционным врагам ради объединения против угроз Последних ночей."
 POD_persistentpodlore.desc.795030:0 "Этот персонаж является частью [Glossary('Мира Тьмы','game_concept_world_of_darkness_desc')], но имеет очень ограниченную биографию. Поэтому разработчики PoD расширили её для придания большей глубины сеттингу.\n\nУ Цзэтянь - женщина, которая не нуждается в представлении. Она родилась в семье чиновника, ведавшего лесным промыслом, и знатной женщины. Её поощряли учиться чтению и письму. Благодаря хитрости, честолюбию, безжалостности и упорству она завладела всей империей. Не только через сына или мужа, но и от своего имени. А затем, в результате череды неудачных решений и политических перипетий, она была отстранена от власти на закате своей жизни и умерла после долгих лет борьбы с болезнью.\nНо на этом её путь не закончился. И за то, что она, бывшая наложница, перевернула установленный порядок и стала императрицей, её ждала преисподняя Перевёрнутых грешников.\n\nПосле всей её жизни, полной борьбы, безумие преисподней разрушило её и тысячу раз переделало в агонии этой преисподней. Тысячелетия за мгновения, мгновение за десятилетия, трон нищих, свалка корон, армии пацифистов, ничем не стеснённые мудрецы, ложь в истинах, падение всего на один шаг, и всего на один шаг - падение с небес.\nКаждое беспокойство наносило многовековую травму, каждое сомнение приводило к параличу ужаса. И к осознанию. И как только она осознала, то уже не могла остановиться. И через мгновение взмолилась, чтобы её отпустили домой.\n\nИ тогда повелитель преисподней отправил её обратно в мир живых, где она проснулась в своей гробнице с неподвижными лёгкими, обновлённым телом и всем, чему научилась. И яростью, которую её тело было не в силах сдержать.\n\nУ была найдена [Glossary('куэй-дзин','game_concept_kuei_jin_desc')], и из-за её гнева её отправили к Тиграм-дьяволам. Гнев в ней превратился в горнило. Видеть, как всё, чего она достигла, всё, что она сделала, превратилось в пустой памятник, а перенесённые ею страдания превратились в раскалённое добела горнило мести.\nОна достигнет нового величия, станет шедевром злобы и возьмёт власть на своих собственных условиях, не преклоняя колен. Она оседлает своего демона, словно колесницу, а за ней последуют ослепляющий свет и тьма — дважды рождённая императрица, которая, если не сможет править всем под солнцем, будет править всем под звёздами.\n\nНе важно, сколько времени это займёт. У Цзэтянь снова получит свою империю."
 POD_persistentpodlore.desc.795041:0 "Этот персонаж является частью $pod_wod$, но имеет очень ограниченную биографию. Поэтому разработчики PoD расширили её для придания большей глубины сеттингу.\n\nДаже среди адов ад сдирания шкуры заживо является особенно неприятным. Все, кому удалось выбраться из его пустошей, испытывают особую неприязнь со стороны своего бывшего тюремщика. И поэтому У Лишань, с тех пор как она бежала от этих ужасов, скрылась за паутиной связей в самом сердце Чанъаня, используя аппарат двора Желтого Императора в качестве главного щита. \n\nПри жизни У Лишань была женой мелкого дворянина, который особенно любил все преимущества, которые давала жена богатого человека. Экстравагантная и любящая красоту, она жадно выжимала из его земель все больше предметов роскоши, чтобы обогатиться.\nНо такие вещи, конечно, приносят врагов. Когда ее муж довел семью до бездомности, их повар, брат матери семейства, отравил их всех, а У Лишань была унижена и лишена всего ее ничтожного богатства с помощью пронизанного железом песка. \nНо смерть дала уроки и благодаря умелому использованию ядов смогла отравить своих тюремщиков при побеге. \n\nНо это было давно, и теперь У Лишань - один из предков среди Желтый Император двор. Она была движущей силой перехода Янтарного Крапивника к коммерческой деятельности, действуя в качестве главного финансового рычага двора. \nОна обещает все больше и больше по мере того, как различные предприятия обогащают их, но ее внимание рассеивается. Ей придется быть хитрой и способной, чтобы сбалансировать мелкие детали двора, избегая при этом вездесущего страха перед возвращением ада. \n\nБудущая судьба\nК ее ужасу, двор Желтого Императора находился всего в одном убийстве от взрыва. Последовавший за этим хаос разрушил ее цепочки поставок, и, поскольку она была не в состоянии оплатить счета, за ней пришли многочисленные должники. \n И поэтому, во всем своем страхе перед адом, когда с нее заживо сдирают шкуру, она была отправлена ​​в последнюю пустоту, снова лишенная всего своего богатства."
 POD_persistentpodlore.desc.795042:0 "Этот персонаж является частью $pod_wod$, но имеет очень ограниченную биографию. Поэтому разработчики PoD расширили её для придания большей глубины сеттингу.\n\nПоскольку драгоценные печатные листы литературного фонда двора Желтого Императора находятся под угрозой, защитник существует. Хрупкие и анемичные, они просто сидят на заднем стуле, погруженные в свои мысли. Но в тот момент, когда дьявол осмеливается причинить вред, бледный Костяной Цветок восстает и отправляет их обратно в ад, чтобы отомстить.\n\nТан Сюань — очень старый член Ван Сянь и в целом довольно прилежный ученик Пути Костяных Цветов. Тихий, созерцательный и невероятно собственнический по отношению к своим вещам, он, кажется, ушел из ада, когда с него сняли шкуру заживо, с фанатичной алчностью к тому, что он считает своим, и желанием увековечить свои произведения.\n\nЕго было легко выбрать на должность руководителя [Glossary('ву','podgloss.wu')], который курировал литературу и воспроизведение основополагающих работ $pod_kueijin$. Но по мере того, как их преследует все больше и больше нападений, Тан Сюань начинает отказываться разговаривать с подхалимами Хунбэня и не хочет иметь ничего общего с другими дворами, если они не сделают что-нибудь с людьми, обыскивающими их архивы.\n\nБудущая судьба\nПервоначально Тан Сюань праздновал убийство Хунбэня, рассматривая это как своего рода справедливость за бездействие. Однако хаос обрушения стал его погибелью, поскольку в конце концов он был найден мертвым, а каждый принадлежащий ему печатный блок с большим трудом был вставлен неизвестным нападавшим в каждое отверстие, которое у него было."
 POD_persistentpodlore.desc.795043:0 "Этот персонаж является частью $pod_wod$, но имеет очень ограниченную биографию. Поэтому разработчики PoD расширили её для придания большей глубины сеттингу.\n\nНесмотря на общую вялость двора Желтого Императора, [Glossary('Анда','podgloss.anda')] так и не преодолели его, даже несмотря на свой триумф во дворе Черной Черепахи. Можно было бы задаться вопросом, как они могли противостоять ярости [Glossary('Анда','podgloss.anda')].\n\nПервый Они вот почему. \n\nВэй Аньзанг стар даже среди $pod_kueijin$. Но он желал не власти или двора, а насилия. Он был убийцей, и жизнью, и убийцей, и смертью, и даже Ад Перевернутых Грешников не мог изменить его природу. \n\nЕго дьяволы охраняют внутренние помещения, заставляя преступников в ночи служить против того, что их бичает. Его рукой было прервано множество вторжений в ад, и он много раз отворачивал [Glossary('Анда','podgloss.anda')]. \nНо даже он испытывает удачу. Он держит во дворе Хунбена почти постоянное военное положение, и хотя его слабовольные болваны мало что делают, чтобы остановить его, нагло охранять артиллерию и конфискованных ордами Бакемонос временами является слишком большим шагом. \nНо Вэй остается решительным. \nЦентр выдержит. Он не должен упасть.\n\nБудущая судьба\nЦентр пал.\nВэй попытался сохранить власть во дворе, но его собственная отчаянная попытка получить власть имела бы ужасные последствия.\nИнтенсивная концентрация его [Glossary('ву','podgloss.wu')] и дьяволов привлекла бы внимание Охотников на Демонов, и Вэй был убит одним воином. вооруженный яростью божественного, с искусством убийства демонов на кулаках."
 POD_persistentpodlore.desc.795054:0 "Этот персонаж является частью $pod_wod$, но имеет очень ограниченную биографию. Поэтому разработчики PoD расширили её для придания большей глубины сеттингу.\n\nПрошлое Антоку является загадкой даже для самых образованных японцев $pod_kueijin$. Его заявление о происхождении из древних аристократических семей Японии и его безупречное знание дворцовой жизни периода Кофун сделали бы его одним из старейших активных людей в Японии, что, как смеются его критики, могло бы объяснить его образ мышления.\n\nПод его руководством Тайра становится самым консервативным удзи Японии, который считает бисямон опасными новаторами. На протяжении всего своего долгого существования Антоку стойко отстаивал имперское правление и держал своего Удзи в Киото на протяжении всех столетий, когда Император оставался лишь номинальным главой. Тайра сопротивляются любым переменам, выступают за прямое имперское правление и почти военное следование традициям. Эта бескомпромиссная позиция лишь отодвинула их на второй план в политическом отношении, поскольку они неспособны адаптироваться к меняющимся временам.\n\nОднако следует отдать ему должное: Антоку способствует развитию культуры открытости, когда дело доходит до принятия [Glossary('дхармы','podgloss.dharma')] и гендерного представительства. Его мало беспокоят традиции общества $pod_kueijin$, считая их второстепенными по отношению к институтам смертной Японии. Это превратило Тайра Уджи в странную смесь несгибаемых традиционалистов, общающихся плечом к плечу с $pod_kueijin$, которые хотят игнорировать политическое поле и сосредоточиться на своем Дхармическом просветлении, что они могут легко делать, пока на словах поддерживают линию Уджи.\n\nБудущая судьба в Канон\n\nАнтоку будет наслаждаться своим пребыванием в центре внимания во время реставрации Мэйдзи, когда его проимперская позиция и имперские контакты внезапно станут объектом внимания всех остальных Удзи, обеспокоенных ростом власти Императора.\nОднако это будет недолгий триумф. Безумное стремление Японии к современности превратит Тайру в своеобразный пережиток старых времен, не имеющий большого политического значения."
 POD_persistentpodlore.desc.795101:0 "Этот персонаж является частью [Glossary('Мира Тьмы','game_concept_world_of_darkness_desc')], но имеет очень ограниченную биографию. Поэтому разработчики PoD расширили её для придания большей глубины сеттингу.\n\nПо большей части, орден Горького Пепла осознаёт угрозу, которую представляют [Glossary('Анда','podgloss.anda')] и, в целом, Монгольская империя, и, по большей части, не имеет возможности (или, откровенно говоря, желания) действовать против них, пока они не начнут активно угрожать владениям Ордена. Однако один рыцарь взял на себя смелость раскрыть истинные масштабы и природу монгольской тени, распространившейся по всему миру.\n\nТанкред - рыцарь довольно скромной крови, который, несмотря на своё усердие и храбрость, не продвинулся далеко в большинстве каинитских военных орденов с тех пор, как вступил в них, из-за своего происхождения не среди знати, а из простого народа. Среди тореадоров из Дворов любви он чувствовал себя по-настоящему не в своей тарелке, и леденящая холодность Зверя сильно беспокоила его.\nЕго собственный сир, чудовищный ваятель плоти из числа художников, в конце концов отказался от упадка ночного мира своей родины. И среди рыцарей Грааля он проявил решительное упорство, которое произвело впечатление на многих, вплоть до того, что он вызвался лично исследовать Монгольскую империю и оценить, какой ответ потребуется [Glossary('Анда','podgloss.anda')]. Некоторые члены Ордена подозревают, что главной движущей силой Танкреда является его гордость, а не долг, но что станет с экспедицией Танкреда, покажет время.\n\nДальнейшая судьба\nНамерения Танкреда позже окажутся... далеко не благородными. Цели Танкреда будут сводиться не столько к разведке, сколько к «покорению и поражению [Glossary('Анда','podgloss.anda')] в одиночку ради собственной гордости».\nВ конце концов, он лишился благословений Грааля и в ответ на это обратился к инфернализму, исчезнув в России. Орден отрёкся от Танкреда и вычеркнул его из своей истории."
 POD_persistentpodlore.desc.795102:0 "Этот персонаж является частью [Glossary('Мира Тьмы','game_concept_world_of_darkness_desc')], но имеет очень ограниченную биографию. Поэтому разработчики PoD расширили её для придания большей глубины сеттингу.\n\nВ 1229 году при дворе Чёрной черепахи, институте [Glossary('куэй-дзин','game_concept_kuei_jin_desc')], которое контролировало северные районы мира, возникло некоторое замешательство, поскольку женщина, мало похожая на мужчину, который положил начало завоеванию мира, предстала перед предками Двора и произвела поистине грандиозное впечатление своим смелым заявлением. Что когда-то она была им, Повелителем океанов, Чингисханом, а когда-то Тэмуджином.\nОна утверждала, что на погребальном костре её тело было уничтожено, и, спасаясь из преисподней, она была вынуждена взять новое тело и новое имя. И вот он перешёл от одного вдоха к другому.\n\nНесмотря на абсурдность заявления, предок двора, к которому обратился сам Темербаатар, тоже не захотел по-настоящему проверять эти притязания и, таким образом, вместо этого заставил Темербаатара продолжать следовать стандартным ритуалам посвящения, которые считаются стандартными. Темербаатар возмущается этим, чувствуя себя ущемлённым и лишённым того, что должно было бы принадлежать ему по праву.\nНо его смелость всегда не знала границ, в той или иной форме. И он мечтает о такой же великой империи, какой правил при жизни, по крайней мере, он так считает.\n\nДальнейшая судьба в каноне\nК несчастью для истории Темербаатара, среди [Glossary('куэй-дзин','game_concept_kuei_jin_desc')] была Бортай Прекрасная, одна из супруг Чингисхана. Публично опозорив Темербаатар за фарс с выдачей себя за хана ханов и достоверно лишив Темербаатар титула, Темербаатар была незаметно переведена на фронт против [Glossary('Анда','podgloss.anda')], где она полностью исчезла из истории.\nНо это установило бы традицию среди многих недавно умерших, которые утверждали бы, что Тэмуджин вернулся. Хотя [Glossary('куэй-дзин','game_concept_kuei_jin_desc')] стали более придирчивы к будущим претендентам, было бы трудно забыть того, кто сделал это первым."
 POD_persistentpodlore.desc.795103:0 "Этот персонаж является частью [Glossary('Мира Тьмы','game_concept_world_of_darkness_desc')], но имеет очень ограниченную биографию. Поэтому разработчики PoD расширили её для придания большей глубины сеттингу.\n\nГоворят, что благими намерениями вымощена дорога в ад, и это истина, которую Жу понимает на глубоко личном уровне.\nЖу, служивший в начале правления династии Хань, вырос в роли слуги при императорском дворе, и большую часть своей жизни изо дня в день оставался неизменным. Но однажды прибыла чужеземная делегация из другой страны, называющей себя империей, с целым флотом подарков, солдат и собственной прислуги. Один из рабов этих чужестранцев, человек по имени Люсьен, привлёк внимание Жу, как и Жу привлёк его внимание.\nОднако скандала, связанного с рабом и дворцовой прислугой, не желала ни одна империя, поэтому Люсьен был распят, а Жу похоронен заживо. Жу, в ужасе от своей смерти, пробудился в Аду живодёрства.\nВ безумном бреду он мчался по его просторам в поисках прикосновения своего возлюбленного. Однако, когда он попал в преисподнюю Перевёрнутых грешников, он нашёл своего возлюбленного во дворце [Glossary('Тоу-Му','podgloss.toumu')].\nГоворят, что Жу, увидев интересную возможность, был вынужден сделать какой-то невозможный выбор.\n\nКогда Жу вернулся в мир смертных, он смог усилием воли вернуть себе рассудок. Он отправился основывать Нефритовый двор, где прославился своим неистовым рвением в истязании грешников и невероятным усердием в собирании текстов и литературы.\nНо, несмотря на всё это, Жу и его предсказания окружены странными слухами. Некоторые предки даже утверждали, что, возможно, он зашёл слишком далеко в своей встрече с [Glossary('Тоу-Му','podgloss.toumu')], но мало кто осмеливался высказать это вслух.\nДальнейшая судьба в каноне\nТо, что Цян был раскрыт как [Concept('akuma', 'акума')|E], многие считают поворотом к Пятой эпохе. К тому времени, когда Пияу Пиюнг прорвётся через южные дворы, чтобы сразиться с Цян Жу в Чанане, выяснится, что подавляющее большинство Нефритового двора уже погрязло в порче, что до глубины души ужаснет остальных [Glossary('куэй-дзин','game_concept_kuei_jin_desc')]."
 POD_persistentpodlore.desc.795107:0 "Этот персонаж является частью $pod_wod$, но имеет очень ограниченную биографию. Поэтому разработчики PoD расширили её для придания большей глубины сеттингу.\n\nКазающийся безмятежным внешний вид того, кто известен как Нонгкхай, выдает острый ум, который веками процветал в хаотичных джунглях Юго-Восточной Азии. Хотя Чжун Го сам по себе был хищником, которого боялись, недавно он понял ценность работы с другими. В 1190 году трудная встреча с бандой [akuma|E] была почти его концом, пока своевременное прибытие Золотого Плащаница [Glossary('ву','podgloss.wu')] не спасло его шкуру. \n\nНонгхай - человек чести, и с тех пор он отдает долг своей жизни странным королевам Алого Феникса... пока они проявляют должное уважение. Теперь, больше интересуясь миром в целом, Нонгкхай начинает беспокоиться. [akuma|E], похоже, свирепствуют повсюду, и его $pod_kueijin$ \"allies\" не проявляет никаких признаков того, что может (а иногда и желает) остановить их. \n\nНонгхай полон решимости не застать врасплох в следующий раз. Если ему придется самому сплотить других обеспокоенных сверхъестественных существ джунглей, чтобы остановить эту волну тьмы, то пусть будет так. В конце концов, когда-то давно Моколе были королями всего мира."
 POD_persistentpodlore.desc.795108:0 "Этот персонаж является частью $pod_wod$, но имеет очень ограниченную биографию. Поэтому разработчики PoD расширили её для придания большей глубины сеттингу.\n\nA Одинокий \"Дракон Севера\", Тонг Лун Хуа на протяжении веков был известным персонажем могущественного двора Желтого Императора. В первые дни его даже часто видели посещающим двор, предлагая бесценную информацию, унаследованную из впечатляющих воспоминаний Моколе. Некоторые даже утверждают, что он пригласил мудрого и уважительного $pod_kueijin$ в свое убежище, чтобы обсудить уход из жизни смертных династий. Однако такого уже давно не случалось. \n\nТун Лун Хуа в последние десятилетия стал более затворническим, что, по мнению двора Желтого Императора, связано с настигшей его старостью. Однако более мудрые умы видят в этом признак духовного упадка двора, поскольку великий мудрец-дракон неудовлетворен тем, что он испытал во время своих последних визитов. \n\nПравда известна только самому Тонг Лун Хуа, и он не делится ею. Еще неизвестно, намерен ли ученый-драконолог действовать или переждать очевидно неизбежный моральный крах китайских сверхъестественных существ."
 POD_persistentpodlore.desc.795109:0 "Этот персонаж является частью $pod_wod$, но имеет очень ограниченную биографию. Поэтому разработчики PoD расширили её для придания большей глубины сеттингу.\n\nМоколе, Красное-Небо-Ожидание, юная (по их стандартам) разрывается между своим естественным упрямством и реалиями мира, погружающимися в ее существо. \nОдаренная доступом к коллективной памяти своего вида, она рассматривала славное прошлое как знак грядущих событий и к которым нужно стремиться. Ее первый вкус реальности был горьким: сверхъестественные существа Индии не очень-то интересовались ее идеями, и даже ее родственники предпочитали жизнь созерцания. \n\nУмудренная опытом, Красное-Небо-Ожидающее провела последние десятилетия, занимаясь более научными занятиями. Тем не менее, огонь ее юности еще не угас, и ей понадобится лишь небольшая возможность снова осуществить свои амбициозные мечты."
 POD_persistentpodlore.desc.795110:0 "Этот персонаж является частью $pod_wod$, но имеет очень ограниченную биографию. Поэтому разработчики PoD расширили её для придания большей глубины сеттингу.\n\n\"Сияющий свет\", \"Королева многих цветов\", Волару известна под многими именами своему народу, Гумагану. Лидер оборотней Бандаяна, Страны Огня, Волару живет вдали от забот других сверхъестественных существ. Она защищает Мать, приветствует тех, кто делает то же самое (например, детей Опоссума с собачьей мордой или \"Bunyip\"), и убивает тех, кто этого не делает. Простое, но полноценное существование. \n\n Однако жизнь — это цикл, и все должно меняться. Волару знает это и предвидит впереди тревожные времена. Она беспокоится, что защиты Бандайяна может быть недостаточно, и следующая волна нападающих может оказаться слишком сильной, чтобы ее Клатч мог с ней справиться. \nОтправляясь на край земель своего народа в Папуа, Волару теперь наблюдает за внешним миром и размышляет. Проактивная позиция, столь чуждая ее мышлению, может быть единственным, что может спасти будущее ее народа. \n\nБудущая судьба в Канон\nВолару будет храбро сражаться, чтобы защитить Австралию от грядущих сверхъестественных сил. Геноцид Буньипа уничтожит ее единственных союзников, а бесконечное количество вампиров, однако, окажется слишком большим. После последнего акта неповиновения, который сожжет дотла множество вампиров и гулей, Волару погрузится в сон, так и не увидев изгнания своего народа из Страны Огня."
 POD_persistentpodlore.desc.795112:0 "Этот персонаж является частью $pod_wod$, но имеет очень ограниченную биографию. Поэтому разработчики PoD расширили её для придания большей глубины сеттингу.\n\n Будучи очень молодой Моколе, Башни-Над-Королями очень гордятся тем, кем (и особенно чем) она является. Хотя выбранное ею имя многие жители острова Комодо сочли слишком грандиозным, она чувствует, что ее происхождение от Средних Драконов означает, что ей суждено величие. Многие думают, что длительное воздействие коллективной памяти Моколе должно быстро рассеять Башни-Над-Королями ее иллюзии величия, и она соглашается... поэтому она обращается к ним как можно реже. \nЭта ситуация шаткая, поскольку ограничение себя в этом отношении, безусловно, задержит ее духовный рост, но страх потерять то, кем она является (и ее высокое мнение о себе), также является хорошим сдерживающим фактором. Это неожиданно побудило ее найти новые способы самосовершенствоваться и доказать свои утверждения более приземленным способом. Таким образом, Башни-Над-Королями на самом деле являются опытным администратором (для обычно ленивой Моколе из ее Клатча) и увлечены наблюдением за развитием политической ситуации на окружающих островах на предмет потенциальных угроз ее народу. \n\nЕсли она продолжит в том же духе, из нее в будущем может стать необычным, но надежным лидером острова Комодо."
 POD_persistentpodlore.desc.795113:0 "Этот персонаж является частью $pod_wod$, но имеет очень ограниченную биографию. Поэтому разработчики PoD расширили её для придания большей глубины сеттингу.\n\nКак показывает выбранное им имя, Плавание в Мбембе гордится своим наследием. Тем не менее, жить в тени мифического первого Моколе — не самый простой путь.\n\nПлавание в Мбембе-Уэйк - один из многих детей Моколе-Мбембе, образование ему дали многие родственники его отца. Сам он редко видел этого человека, поскольку Моколе-Мбембе не действует в том же временном отрезке, что и другие, часто спит веками. Плавающий по следам Мбембе вскоре понял, что он не самый умный и опытный воин из своих братьев и сестер, и отчаялся найти способ быть достойным своего имени. И только встреча с другими оборотнями изменила его судьбу.\n\nПонимая, что у него есть врожденное любопытство, которого не хватало другим Моколе, Плавающий-в-Мбембе-Поминки вскоре стремился узнать больше о тех, кого благословила Мать. Это постепенно сделало его посредником между когда-то изоляционистским Клатчем Моколе-Мбембе и внешним миром, и в этой задаче он преуспел. После десятилетий совершенствования этого таланта Плавающий в Мбембе-Следе теперь основал свой собственный Клатч и подал в нем большие надежды, что является свидетельством его уникальных навыков.\n\nБудущая судьба в Канон\nВ современную эпоху Плавающий в Мбембе станет самым известным и фактическим лидером африканского моколе. Его участие в качестве лидера альянса Ахади окажется решающим в спасении Африки от ужасной угрозы."
 POD_persistentpodlore.desc.795114:0 "Этот персонаж является частью $pod_wod$, но имеет очень ограниченную биографию. Поэтому разработчики PoD расширили её для придания большей глубины сеттингу.\n\nВ то время как большинство Моколе — мирные и созерцательные существа, Последний Король Сэнда — смелый воин до мозга костей. Честно говоря, у него не было другого выбора, кроме как быть. \n\nКак показывает выбранное им имя, Последний-Король Сэнда возглавляет свой Береговой Клатч Черной Реки в мрачном настоящем, где Дети Сета одержали победу над $glossary_osirian_league$. Хотя он слишком молод, чтобы участвовать, коллективные воспоминания Моколе показали ему многое, в том числе то, как Сет сам похитил и применил нечистую магию к прародителю Моколе Собеку.\nЭтот опыт и реальность того, что его родина была захвачена его врагами-сеттитами, сделали Последнего Короля Сэнда мрачным генералом, склонным к приступам гнева. К сожалению, это несколько отдалило его от других остатков Осирианской Лиги, что, в свою очередь, делает окончательную победу Сета еще более возможной. Еще неизвестно, хватит ли решительности и храбрости Последнего-Короля Сэнда, чтобы в одиночку выиграть эту вечную войну. \n\nБудущая судьба в Канон\nПоследний-Король Сэнда с возрастом смягчится, что приведет к тому, что он согласится присоединиться к альянсу Ахади, своего рода возрожденной для него Осирианской Лиге, в наше время. Его лидерские способности окажутся решающими для усилий альянса, но его слабое здоровье, к сожалению, прервет процветающее будущее, которое могло бы увидеть его Клатч."
 POD_persistentpodlore.desc.795115:0 "Этот персонаж является частью $pod_wod$, но имеет очень ограниченную биографию. Поэтому разработчики PoD расширили её для придания большей глубины сеттингу.\n\n Самый младший член Детей Собека - один из немногих, кого не мучают воспоминания о своем павшем предке. Хотя она испытала их, как и остальные члены ее Клатча, Свали рассматривает это как своего рода предупреждение, способ убедиться, что ошибки прошлого не повторяются. \n\n Осирийской Лиге в прошлом не хватало сплоченности, и хотя многие из ее членов были могущественны, этот недостаток в конечном итоге сделал их слабее, чем гораздо более единые в своих целях последователи Сета. Таким образом, Свали ждет, слушает и объясняет больше, чем многие ее сородичи. Однако ее храбрость не вызывает сомнений, поскольку она уже присоединилась к своим старейшинам на нескольких охотах. \n\nВо многих отношениях она кажется воплощением баланса между обычной спокойной и созерцательной Моколе и более напористыми, а иногда и гневными Детьми Собека. Некоторые задаются вопросом, станет ли этот баланс ключом к их будущему."
 POD_persistentpodlore.desc.795116:0 "Этот персонаж является частью $pod_wod$, но имеет очень ограниченную биографию. Поэтому разработчики PoD расширили её для придания большей глубины сеттингу.\n\nНаследник Sand's-Last-King, по крайней мере внешне, очень похож на своего отца. Преследуемый коллективными воспоминаниями о поражении Осирианской Лиги от рук последователей Сета, Невидимый-на-Мелководье — смелый и гневный военный, который не остановится ни перед чем, чтобы отомстить за павшую родословную Собека. Фактически, это ключевое различие между отцом и сыном. \n\nСанд-Последний-Король смотрит на ситуацию мрачно и более фаталистично, хотя сдаваться не в его характере, он признает, что поражение является вероятным исходом. Невидимый-на-мелкой воде - нет. Он мало что сделает, чтобы обеспечить победу Моколе, в том числе переступит некоторые черты, которые были бы непростительны для его отца и многих других.\n\nОднако в отчаянной ситуации он видит свой Клатч, возможно, есть место только для отчаянных мер.\n\nБудущая судьба в Канон\nВ наше время, когда слабое здоровье его отца наконец требует его ему, Невидимый-на-Мелководье, станет лидером Клатча. Его первый план действий будет самым неприятным для всех, кто живет в Египте..."
 POD_persistentpodlore.desc.795201:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nКогда-то существовала Клатч Яркого Пламени.\nОднажды родилась кладка из четырех человек.\nДетеныши научились говорить, петь и кричать. Один не ответил.\nОдин не разговаривал много лет, и Клатчу не удалось найти лекарство.\nОдин избегал остальных. Его так и не удалось найти. Одного нигде не было видно. Один всегда был рядом. \nОдин научился избегать жалких взглядов. Человек научился ходить бесшумно. Один изучил свой собственный путь.\nЗатем произошло Первое Изменение.\nБывший детеныш говорил, но его слова были медленными. Он пел, но мелодия была кислой. Он кричал, но ветры этого не услышали. Моколе заикался в своих словах. \nКлатч радовался, потому что он наконец заговорил. Они обучали моколе всему. Как сражаться, как думать, как мечтать.\nЕго Клатч ценил силу, но он не был сильным.\nЕго Клатч ценил мудрость, но он не был мудрым.\nЕго Клатч ценил честь, но он был тенью.\n\nОднажды Клатч был напали.\nСила их не спасла.\nМудрость им не помогла.\nЧесть их не пощадила.\nОдна тень осталась.\n\nОдна тень осталась."
 POD_persistentpodlore.desc.795202:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nЕще с тех пор, как Хабаш был еще детенышем, его всегда увлекали истории о древнем Хеме. Магия, мумии, оборотни и даже мерзкие вампиры. Его вопросов было много, но ответов он получил мало. Что случилось с нашей Родиной? Почему мы не можем вернуться? Куда делся крокодиловый бог Собек? Его учителя говорили ему, что он откроет все это, когда вырастет, и сможет испытать это через своего Мнезиса. Поэтому Хабаш с нетерпением ждал, боготворя героев этих историй. \n\nКогда Хабаш наконец понял, его мир рухнул. Его герои проиграли, погиб Хем. Теперь он мечтает вернуться в дом, которого никогда не знал. Чтобы отомстить людям, которых он не знает. Убить Собека, чтобы его память больше не была запятнана."
 POD_persistentpodlore.desc.795203:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nРодившись в семье богатого министра, Хао Чжи получил превосходное образование во всех сферах, ожидаемых от его статуса. Детство он провел, посещая занятия и помогая своей семье в их начинаниях. Жизнь была простой, и Хао Чжи был доволен, пока не испытал Первое Изменение. \n\nВозможно, из-за его спокойного характера, его опыт был довольно сдержанным и оставался совершенно незамеченным для окружающих. Однако Хао Чжи беспокоился, поскольку воспоминания о Моколе начинали течь в его голове. В течение многих лет он оттачивал свой разум и пытался контролировать своего Мнезиса. В конце концов он добился успеха и сумел путешествовать по рекам времени на своих условиях. Он провел много ночей, мечтая о прошлом, о легендарных личностях, о которых его учили. Одна фигура особенно интересовала его, Чжугэ Лян. \n\nХао Чжи всегда имел склонность к военной тактике, часто удивляя своих учителей своим интеллектом. Теперь, вооружившись давно утраченными древними стратегиями, его способности быстро росли. Будучи преисполнен решимости действовать самостоятельно, Хао Чжи решил сдать один из важнейших экзаменов, чтобы стать военным офицером. Именно там он приобрел известность и был быстро замечен другим Чжун Лунгом. В безопасности и общении с себе подобными его знания возросли еще больше. Большую часть своих дней он проводит в глубоком сне, продолжая исследовать времена Воюющих Королевств. Из-за постоянного сна его прозвали «Спящий Дракон», скорее всего, в шутку. Однако это имя только порадовало Хао Чжи, поскольку он стал тем, кого он боготворил больше всего."
 POD_persistentpodlore.desc.795204:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nЛонг Яньшао родился в фермерской семье на Желтой реке, спустя много времени после падения династии Тан. После того, как его пробуждение показало, что он один из Средних Драконов, его любопытство и шепот о Королях Драконов, которые когда-то правили великими реками, вынудили его путешествовать по Шелковому пути. Только после нескольких месяцев путешествий он, наконец, решил обосноваться. \n\nЯньшао — настоящий мудрец: терпеливый, взвешенный в каждом слове и нежный ко всем. Он стремится заставить других подвергать сомнению все вокруг, чтобы они могли сами найти истину. Его речь часто расплывчата и полна метафор, часто оставляя смертных и молодых Средних Драконов разочарованными, пока несколько дней спустя до них не доходит его смысл. \n\nЕго страсть к путешествиям все еще остается в нем. Даже оседлав, он часто ходит по караванным путям в поисках новых людей, новой мудрости и забытых сказок."
 POD_persistentpodlore.desc.795213:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nLittle, названная так из-за ее миниатюрного размера, как коротышка ее помета, была редким белым тигром. Но ее жизнь была почти очень короткой, поскольку [akuma|E] захватил ее родителей. Ее отца-тигра содрали шкуру и бросили в море, а мать-хана зарезали. В качестве игры люди-дьяволы освободили котят, и Литтл могла только отчаиваться, когда на ее братьев и сестер охотились и убивали дьяволы. Но Изумрудная Мать улыбнулась маленькому тигру, взяла могучего Чатро и убила Дьяволов. Видя, что случилось с ее сестрами, она поклялась, что ни один из ее детей не постигнет такая участь, независимо от того, принадлежат ли они к ее крови или нет. Она усыновила множество ханов, и у нее появилось много партнеров. Потеряв всю семью, она захотела иметь большую семью. И как бы далеко они ни заходили, она всегда приветствовала их дома. Хан, который изначально учил ее тому, как быть Ханом, Мягкий Ходок, часто передавал ее слова тем, кто по всему миру. И он порекомендовал ей женщину, которая стремилась защитить женщин от часто обрушивающихся на них бед. Литтл разыскал ее, и когда Хан-Старейшина встретил Пияу Кровавого Цветка, они стали верными друзьями, и вскоре после этого они разделили «особые причастия» в Ямах Пияу Ян и в Логово Литтла, когда им нужно было отдохнуть от своих товарищей-мужчин. \n\nОднако, когда Литтл обдумывает свою ситуацию, дела обстоят хуже. «Дьяволы» снова активизируются, и на этот раз ей есть что терять. Она сильная, но глубоко переживает за безопасность своих детей. Пияу находится на тропе войны, и вмешаться в нее было бы потенциально катастрофой. Но в то же время не оставит ли изоляция их неподготовленными к тому моменту, когда они прибудут? Что делать матери в такой ситуации? \n\nБудущая судьба: \n В конце концов, вспоминая своих мертвых братьев и сестер и опасаясь того, что произойдет, если она умрет, как и ее мать, Литтл присоединилась к маршу Пияу, ее собственные дочери сражались бок о бок со Сдирающими Обезьянами. Мало кто состарится и удостоится редкой чести умереть от старости, легенды для малазийских ханов. И в окружении своих дочерей, их детей и своей большой семьи она умерла, плача от радости."
 POD_persistentpodlore.desc.795214:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nКогда-то малайские и индокитайские тигры были доминирующими $glossary_fera$ в более широком регионе Юго-Восточной Азии. Но те славные дни прошли. И они умерли вместе с Благородным Клыком, и нет хана в регионе, который не оплакивал бы его потерю. \n\nСтарший представитель своей линии, Благородный Клык, происходил из длинной линии ханских лидеров, с безупречной осанкой и безупречным телосложением. Умный, способный, добрый, представительный и непоколебимый перед лицом опасности, он был идеальным королем для опасной эпохи. С уменьшением количества союзников во дворе Алого Феникса Благородный Клык оказался в невероятно опасном положении, но он столкнулся с этим напрямую. Взяв могущественного партнера Маленького Белого Меха, он стремился построить что-то долговечное, чтобы его дети могли унаследовать его, как и его предки до него. Он знал, что его младший брат продолжит его линию, и, зная, как сильно Литтл желает иметь семью, он утверждал, что его дети будут Белыми Мехами, и судя по их будущим пальто, это было несомненно. И поэтому, имея за собой наследие и судьбу впереди, он возглавил собравшееся войско Хана, чтобы уничтожить силы [akuma|E] в Малайзии. Достигнутый и почитаемый уже в юном возрасте, Бон Бхат намеревался добиться успеха под властью Изумрудной Матери. \n\n И он потерпел неудачу. \n\nРангда ожидала удара Ханов, поэтому она послала в бой своих Леяков. Ужасающая сверхъестественная болезнь поразила его лагерь, поразив его врагом, с которым они не могли бороться. Как только они вдыхали посланные миазмы, пустулы покрывали их тела, превращаясь в хищных личинок, которые готовы были сожрать их заживо, прежде чем разразиться аналогичными инфекционными миазмами. Зная, что, если бы Рангда распространился, он мог бы проклясть целые континенты, Благородный Клык призвал нескольких духов отправить последние сообщения его жене и брату, прежде чем они вместе со своими людьми изолировали себя, отправившись в Сумрачное Царство Эреба и бросившись в расплавленное серебро. Умирающие герои, но проклинающие свою мечту в своем поколении."
 POD_persistentpodlore.desc.795217:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nПри Звериных Дворах Мать Харимау почитается за ее место среди малазийских ханов. Возвращенные мертвецы, Создатели реальности, бесчисленные Дети Изумрудной Матери и другие странные существа – все они воздают ей должное. Когда они смотрят на ее дочерей, они ожидают увидеть таких же могущественных и гордых наследников, как она. И когда они смотрят на ее старшего ребенка-хомида, Ратна быстро разрушает этот образ.\n\nРатна родился болезненным и слабым. В течение 5 лет Ратну из соображений безопасности часто запирали в Логове своей матери, и даже сейчас она редко уходит далеко. В отличие от своей матери, Ратна была маленькой, не могла поднимать самые тяжелые предметы и быстро задыхалась. И когда Первое Изменение обошло ее стороной, Ратне было так стыдно за то, во что они превратились. Несмотря на постоянные заверения Литтла, что они все еще любят их, Ратна все еще чувствовал себя ужасно бесполезным. Она завидовала другим Ханам и Женщинам-Дьяволам, стоящим высоко и гордо своей женственностью и силой, тогда как в то время она была жалкой оболочкой того, чем была ее мать. Некоторые в «Сентябре Литтла» шепчут, что Литтл обучил Ратну колдовским способам, чтобы попытаться отвратить Ратну от каких-либо «радикальных действий». И хотя Ратна действительно находила огромную радость в алхимии (о чем свидетельствует то, что их прежнее мужское начало почти забыто из-за изменений, внесенных в ее тело лекарствами, до такой степени, что никто никогда не узнает, что у Литтла когда-то был сын), она все еще жаждет возможности почувствовать себя достойной своей матери. Излагая речи Литтла, Ратна жаждет присоединиться к крестовому походу Пияу. Может быть, там, со своей Алхимией, она сможет быть полезна.\n\nБудущая судьба:\nЖизнь Ратны, а затем и не-жизнь, претерпела несколько критических поворотов. Когда Литтл официально присоединился к Пияу, Ратна убежала, чтобы присоединиться к армии Пияу, но по пути попала в засаду [akuma|E]. Но Литтл отправилась в Ад ради своей дочери и нашла Ратну, зовущую ее в Аду Злой Магии. Ратну спасла мать и привезла в Пияу для обучения. Ратна стала ученицей Вати, и с ее новым дьявольским телом слабости жизни отпали, и она стала [Glossary('пенангаллан','podgloss.penangallan')], вечной связью между Белыми Мехами и Золотыми Дворами. В современности Ратна станет одной из королев Пенангаллана, среди которых будет прославленная и заслуженная геройская служба."
 POD_persistentpodlore.desc.795218:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nПодавляющее большинство людей, посещающих Литтл, часто находят слухи о том величии, которого достигли ее детеныши. И, учитывая Сомью, не возникает вопроса, кто станет ее преемником.\n\nВторой из ее человеческих детей, Сомья, с рождения всегда была большой девочкой. При рождении она весила 4 килограмма, была мускулистой, как тигрица, и довольно легко стояла над своими сестрами. Неудивительно, что во время охоты она приняла облик Чатро и сразила слона. Хотя она и не настоящий гигант, она подошла довольно близко. Унаследовав силу своей матери, она уже многого добилась, уничтожив логово [akuma|E] и возглавив логово самостоятельно до того дня, когда она сможет захватить власть в Сентябре.\n\nНо Сомья – это больше, чем ее сила. Сомья изучила труды Войны Позора и первых завоеваний, сформировавших Августейшие Дворы. Дома в джунглях и невероятно способный логист, она твердо убеждена, что будущее Ханов — в войне. Она знает, что ее семья не может долго просуществовать в одиночку, поэтому она изо всех сил старается объединить усилия с ныне живущим затворником [Glossary('пенангаллан','podgloss.penangallan')] и сформировать великое войско, чтобы избавить Малайзию и Нусантару от бедствий, которые ее поражают.\n\nБудущая судьба:\nНа мольбы Сомьи будет дан ответ. Хотя Сомья не присоединилась напрямую к войску Пияу, она поддерживала силы своей матери в войне, когда они маршировали по материку, захватывая свои владения на материке. После кончины Литтла Сомья возьмет на себя руководство Септой и напрямую поддержит чистку Золотого двора от Нефритового двора. Более того, она значительно расширит родословную Литтла, производя котят и младенцев с таким же рвением, как и ее мать."
 POD_persistentpodlore.desc.795219:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\n. Хотя известно, что у Литтла три человеческие дочери, они часто видят только сжимающуюся и кроткую Ратну или могучую и гордую Сомью. Но тогда они смогут почувствовать третье. В конце концов, Махендрадатта всегда скрывается неподалеку. \n\nМахендрадатта — странная особа, как и ее старшая сестра Ратна, которая является паршивой овцой в семье. Хотя она и претерпела Первое Изменение во время плавания и борьбы с приливом, это мало повлияло на отвращение Махендрадатты к тому, чтобы за ней наблюдали. Она оставалась уклончивой как на словах, так и на вид. И все же враги септа часто имели обыкновение быть найденными позже, ужасно разорванными на части и оставленными напоказ в качестве предупреждения. И даже любовники действительно не видят ее за пределами спальни. Только ее семья может по-настоящему сказать, что движет тигром. \n\nНо Махендрадатта — преданный убийца, не испытывающий никаких угрызений совести. Куда Литтл просит ее пойти, она идет, а кого Литтл просит ее убить, она убивает. Ее политическое влияние практически отсутствует, и, к большому ужасу ее матери, она подтвердила, что даже убила бы своих братьев и сестер, если бы ей дали слово. По крайней мере, она непоколебима в своей преданности своей матери и своему септу, как и должна, по ее мнению, хорошая дочь. \n\nБудущая судьба: \nМахендрадатта будет одной из дочерей, которых Литтл послал непосредственно на помощь Пияу. Будучи более тонким агентом, ее часто использовали в качестве убийцы, используя тупое оружие, чтобы бросить его в линию. И после своей впечатляющей службы Махендрадатта присоединится к битве против Цян Ру во Нефритовом дворе. Там она умрет со славой, сразив кровосмесительных дьявольских близнецов-альбиносов, и вернется к Изумрудной Матери с высочайшими почестями."
 POD_persistentpodlore.desc.795220:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nСтарший ребенок из кошачьих детей Литтла, Грим-Усы, представляет собой корявый, устрашающий фактор в сентябре своей матери. Будучи котенком, когда Литтл еще училась управлять сентябрью, [akuma|E] искала особенно духовно богатых на ужинах нашли молодого тигра и устроили игру, чтобы посмотреть, насколько сильно они смогут разрезать ему морду, прежде чем он истечет кровью, наслаждаясь сущностью. Но, к их ужасу, травма от обезображивания заставила тигра подняться, приспособиться, схватить Крино и разрезать их пополам так быстро, что Акума не осознавал, что они погружаются в окончательную смерть к тому времени, когда их тело плыло в Индийский океан. И когда Литтл пришел на крики, они обнаружили плачущую девочку, держащую свое все еще изуродованное магическими ранами лицо. \n\nМрачные Усы так и не отошли от этого инцидента. Над ней нависает тень, и она по возможности избегает двора матери. Разгневанная и разгневанная на Акуму за то, что они с ней сделали, она получает особую радость, убивая их. Ее еще больше мучает огонь внутри нее из-за любви сердца и плоти, она настолько испорчена, что борется с очень немногими женщинами, которые находят ее терпимой. Злая, ожесточенная, подавленная и разочарованная, она — яростный разрушительный воин, вымещающий все это на тех, кого убивает, когда отправляется на войну. Учитывая ее сосредоточенность на битве, все остальные занятия отошли на второй план. Если Сомия обошла ее в качестве преемника и застряла в той руке, с которой ей раздали, пусть это будет последнее, что увидят эти демоны. \n\nБудущая судьба: \nМрачные Усы присоединится к Махендрадатте, когда ее отправят присоединиться к Пияу, и найдут цель в ее армиях. Но что еще более поразительно, она действительно нашла кого-то, кто нашел не только ее боевые шрамы, но и всю ее безупречную внешность. Мрачные Усы и Дампир Нидхи стали неразлучны, и хотя Нидхи взяла несколько супругов в традиции [Glossary('пенангаллан','podgloss.penangallan')], сердца берсерков всегда возвращались друг к другу. А Мрачные Усы мирно умрут от старости, будучи старейшиной хана, улыбаясь на руках своего Дампира."
 POD_persistentpodlore.desc.795221:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\n. Второй из кошачьих котят Литтла, Благородный Грива, был одним из самых универсальных. Опытная и почти несравненная Сумеречная Благородная Грива из своего Первого Изменения стремилась овладеть всем, что могла. Законы Изумрудной Матери были ее любимым предметом изучения, и она стала главным экспертом септы в их интерпретации. Обучаясь у иностранных старейшин и изучая все, что могла, она вернулась и стала духовным лидером их септа, несмотря на свой юный возраст. И хотя эксцентричные структуры человека ускользают от нее, она понимает магию. Она бесконечно изучает оккультизм, ища все возможные преимущества против инферналистов, грабящих их дома. И когда она выносит приговор, она предпочитает выносить его сама, зубами и когтями. \n\nТеперь Благородная Грива наблюдает за предсказаниями и предзнаменованиями своих даров, делая все возможное, чтобы дать совет своей матери. Она видит ужасные предзнаменования, отлитые в крови змей и огне, а затем в стали и молниях. Что это значит, она еще не знает, но знает, что ханы должны действовать. Она призывает свою мать действовать, настаивая на том, что им нужно не допустить наступления времени металла и молнии, поскольку все предзнаменования после такого события заканчиваются. И теперь, пока Литтл обдумывает совет Благородной Гривы, Благородная Грива уже начала собирать свои силы. \n\nБудущая Судьба: \n Благородная Грива гордилась решением Литтла присоединиться к Пияу и курировала их сентябрь, пока Сомия вела войну, а Литтл встречался с Пияу. Хотя она и возмущалась придирками своей младшей сестры Гордых Глаз, она справилась с этим, ища собственные ответы на пророчества. В конечном итоге она так и не узнала, что произошло, и умерла верной Изумрудной Матери, умерев после уничтожения логова Кумо."
 POD_persistentpodlore.desc.795222:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\n. Самая младшая из детей Литтла и, несомненно, самая титулованная, Гордая Глаза временами ведет себя так, как будто она не уважает работу своей матери, а скорее получает от нее пользу. Детеныш в ее помете с самой безупречной шерстью, впервые принявший форму Хомида, излучал красоту, которая стыдила ее сестер, и она обожала это внимание. Социальная бабочка по своей сути, она также любила наряды и роскошь своего положения. Уже развлекаясь с самыми красивыми мужчинами двора и наслаждаясь богатством, она обожает наслаждаться всеми преимуществами того, чтобы быть чистокровным ребенком Изумрудной Матери. Рассматривая бой как второстепенную обязанность, поскольку она часто бездельничает на своем месте, одетая в золото и прекрасные одежды, в роскошном Логово, украшенном чудесными и экзотическими деликатесами. Когда она идет сражаться, она склонна выбирать богатых [akuma|E], чтобы она могла обыскать их убежища, забрать богатство себе и найти новые способы украсить себя. И несмотря на такое тщеславие, она все еще Хан, и у гигантского человека-тигра, одетого в золото, есть свое Присутствие. \n\nГордые Глаза, однако, расстроены этими разговорами о войне. Она предпочла бы наслаждаться прекрасными моментами жизни и чувствует, что ее игнорируют. Даже маленькое логово, данное ей в надежде, что оно научит ее ответственности, оказалось для нее еще одним способом финансировать свои удовольствия, и ее протесты становятся все громче. Возможно, ее мать сломается, ведь она искренне любит свою маленькую принцессу. Или Гордым Глазам, возможно, наконец придется выйти вперед и взять на себя ответственность. \n\nБудущая судьба: \nНебольшое формальное присоединение к Пияу вызвало у Гордых Глаз настоящую истерику, но, по крайней мере, заставило ее противостоять реальности. Будучи самой общительной из семьи Белых Мехов, ей было поручено общаться с делегатами Звериных и Золотых Дворов. И надо отдать должное, она справилась прилично. И хотя бесчисленные отцы ее детей мало что сделали для более «респектабельных» родословных, в конечном итоге она привела к себе еще много ханов, которые распространились по Малайзии и Нусантаре."
 POD_persistentpodlore.desc.795273:0 "Этот персонаж был создан разработчиками PoD, чтобы придать сеттингу большую глубину, и не является официальной частью $pod_wod$. \n\n. Война, которую дикие животные вели в доменах, на которых они охотятся, унесла много жизней и породила множество бед и трагедий. Но иногда некоторые из них имели неприятные последствия и возвращались к ним по совершенно «обстоятельствам». Но $glossary_wyrm$ знает, что случайностей не бывает. \n\nКровавый Вор когда-то был Багирой по имени Ранги, могущественным Дэй Тилау с богатой историей и достижениями воина против Равнос. И во время своего крестового похода и пожирания пиявки в своих челюстях он почувствовал вкус их крови и жадно искал ее. Когда у одной убитой им пиявки были документы о том, что Равнос направляются на запад, он бросился в погоню и врезался головой в диких животных и их бесчисленные орды Гангрелов. Ранги был вне себя от радости, готовый к резне и крови, но он был одинок и изгнан за свою жестокость, и пал под ошеломляющей мощью Поцелуя, когда на них обрушились Гангрелы. \n\nНо шепот на ухо от неизвестного покровителя велел ему держать кровь в пасти после укуса. И когда он остался истощенным и мертвым в грязи, последний глоток позволил осуществиться светским целям невидимого хозяина. Ранги извивалась и ревела, поднимаясь и пожирая новорожденного Ферала, посланного уничтожить его тело. Кровавый Вор, заново созданный и ставший еще ближе к своему хозяину, едва осознает, как низко он пал. Теперь все это вторично по сравнению с восхитительным вкусом крови, а он страстный охотник."
 POD_persistentpodlore.desc.795307:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nЭлиор — один из последних менахемитов, верных последователей Менахема бен Шломо бен Давида, убитого несколько поколений назад. Каим Шломо бен Руджи поклялся снять ярмо, навязанное его народу мусульманами, крестоносцами и порождениями Лилит, стоящими за ними. Он освободит сначала Амадию, затем Багдад и, наконец, сам священный город Иерусалим. Однако из-за предательства семьи он был наказан за 10 000 золотых монет, и его последователи полагают, что этот поступок был спровоцирован этими проклятыми созданиями теней, поскольку никто другой не мог финансировать такие усилия.\n\nХотя многие издеваются над теми, кто все еще верен тому, кого они считают падшим Мессией бен Давидом, они утверждают, что знают правду. Менахем учился у Рош Акехиллы, Чисдая, Главы плена, главной Рош Иешивы, Гаона Иакова и волхва, последователя пророка Даниила. Никто не был более сведущ во всех вопросах оккультизма и магии, как еврейских, так и арабских, чем его учителя. От этих мастеров он научился многим вещам, которые помогли ему в его великой битве: умению прятаться от взгляда врага, пересекать водоёмы без необходимости иметь лодку, призывать божественный свет, чтобы прогнать тьму... и, возможно, избежать притязаний смерти.\n\nГоворят, что если его видение осуществится, Менахем и его отец вернутся, чтобы по-настоящему освободить евреев и сжечь заражение потомства Лилит, преследующего их святую землю.\n\nНо помните: если Элиор хочет выдержать приближающуюся бурю и достичь этой цели, ему нужно будет опираться на учения, переданные Менахемом. На его пути стоит множество угроз, и мало что стоит между последним из менахемитов и смертью."
 POD_persistentpodlore.desc.795308:0 "Этот персонаж является частью $pod_wod$, но имеет очень ограниченную предысторию. Таким образом, разработчики PoD расширили его, чтобы придать сеттингу большую глубину. \n\nСумеречные ученые часто разговаривают с Возрожденными из пустынь. Они обмениваются дарами и знаниями, поскольку Ученые стремятся понять Гекау. Однако такой контакт, как известно, хрупкий и чрезвычайно формальный, устанавливается медленно и осторожно в течение многих жизней. Именно к Братству Алого Фонаря Восемь Бессмертных обращаются, когда необходимо сначала установить такой контакт, когда необходимо отправить посольства и когда необходимо сделать выговор недостаточно уважительному Аменти. Часто квесты Кун Ли сосредоточены на таких вопросах. \n\nБудущая судьба в каноне\nПо мере поворота Колеса и приближения конца все Династии Бессмертных будут стремиться расширить свою численность. Когда Аменти поприветствуют тех, кто находится на востоке, Кун Ли будет отправлен поговорить с новым Бессмертным. Несмотря ни на что, Ву Тянь по-прежнему остаются законными пастырями Поднебесной, и вмешательство Детей Нила нежелательно."
 POD_persistentpodlore.desc.795309:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$. \n\nA многовековая история повествует о двух бессмертных существах: человеке и Наге. Несмотря на запрет, их роман длился бесчисленное количество воплощений и перерождений, пока она не была заключена в тюрьму жестоким колдуном. Сюй Сянь бродила по земле в поисках способа освободить ее. За это время он стал известен как великий учёный, травник и врач. Некоторые говорят, что он спас жизнь Наги или оказал ей небольшую доброту, одолжив ей свой зонтик, и это событие положило начало их роману. Другие говорят, что она была бессмертной целительницей, воскресившей его после того, как он умер, увидев ее истинную форму или даже демона, соблазнившего его. Третьи говорят, что они вместе управляли аптекой. Возможно, все эти истории были правдой во всех своих воплощениях; возможно, нет. Правду трудно найти, и Сюй Сюань не хочет ее разъяснять."
 POD_persistentpodlore.desc.795310:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$. \n\nМногие слышали имя Ко Хунга как лингвиста, философа, алхимика, врача, политика и писателя. Он ценил традиции, но подвергал сомнению каждое учение. Он стремился объединить конфуцианство, даосское бессмертие и легализм. Даже спустя столетия на его трактаты по медицине и алхимии все еще ссылаются. Его учение о способах сохранения, усиления и совершенствования своей ци до сих пор направляет тех, кто ищет бессмертия. Он даже предупредил, что бессмертный слуга божества вознаградит добродетельных бессмертием и вычтет дни из жизни грешников. \n\n Имя, которое мало кто слышал, - это имя его хозяина, Чэн Иня. Согласно сказаниям, Ко Хун знал Чэн Инь с детства, поскольку Чэн Инь был другом и учеником дяди Ко Хуна. Когда Ко Хунг достиг совершеннолетия, он учился у Чэн Иня, который научил его секретам гадания, астрономии, алхимии и даосизма. Он многому научился из учений Чэн Иня и его огромной библиотеки, вдохновившей его на многие последующие работы и занятия. Предвидя надвигающийся хаос и понимая, что Ко Хун готов, Чэн Инь удалился в пустыню со своими книгами и эликсирами бессмертия, и Ко Хун больше никогда его не видел."
 POD_persistentpodlore.desc.795311:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\n. В своей первой жизни Нараямасвамин был брахманом, который часто совершал обряды для питри. Он чтил и умилостивлял этих ушедших предков. Он помог им достичь мира, освободив их от смертных пут и позволив им двигаться дальше. Так он продолжал, пока к нему не приблизился скрытый мастер, человек, который убеждал его достичь дехасиддхи, истинно совершенной формы. Следуя путем, который впоследствии стал расашастрой, он в конце концов достиг этого.\n\nСтоя перед Восьмёркой, он попросил продолжить начатое им в жизни служение. Они удовлетворили его просьбу. \n\nВ отличие от многих других Ву Тянь, Нарайамасвамина редко видели среди смертных, он появился в исторических записях только один раз, когда он путешествовал вместе с посланником Ван Сюань-цэ. Вместо этого он живет среди духов мертвых, среди наблюдателей живых, среди теней и воспоминаний о том, что когда-то было. Он продолжает помогать им двигаться дальше, хотя это принесло ему много врагов в [UmbraGlossary('swar')] и часто ставит под угрозу его квесты."
 POD_persistentpodlore.desc.795401:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nАлтын-Арыг, родившаяся у енисейских кыргызов, была любимой Алып-Кыз, девушкой-воином большого мастерства. Считалось, что сама Умай Ана благословила ее из-за ее золотых глаз, и считалась жемчужиной этого скромного племени. Но ее золотая молодость была прервана болезнью. Посевы внезапно засохли в почве, а степные звери сошли с ума, разрывая свои юрты в яростных атаках. \n\nОтказываясь сидеть сложа руки и смотреть, как гибнут ее люди, Алтын-Арыг в одиночестве поехала в запретные вершины в поисках Бенги Су, воды бессмертия. Около вершины, в богатой пещере, она нашла не источник, а изуродованного ранами одноглазого человека, плоть которого постоянно ломалась и переделывалась в гротескном потоке. Вокруг была лужа его густой, неестественной крови. Отчаявшись исцелить свое племя, воин собрала витэ в руки и сделала большой глоток, полагая, что это Бенги Су. Тьма быстро поглотила ее. Когда она проснулась, одноглазая незнакомка исчезла, и она изменилась. \n\nАлтын-Арыг использовала свою силу, чтобы создавать иллюзии здоровья у больных новорожденных, и свою силу, чтобы сломить диких зверей. Она защищала свое племя на протяжении десятилетий, но катайцы почувствовали заразу этого «Демона» и напали на нее. $pod_kueijin$ убила своих родственников, оставив в живых только Алтын-Арыг и одного смертного мальчика. \n\nПара отступила в горы, где она впервые была $pod_Embrace$d, и на протяжении многих лет она собирала сломленных выживших из разных племен и привела их в эту скрытую долину Эргенекон. Четыреста лет она несла бдение, скрывая гору своими иллюзиями.\n\nВ VI веке она посчитала, что пришло время явиться миру. Приняв форму золотого волка, она вела смертных сквозь гору. Когда ее люди выступили свободными мужчинами и женщинами, Алтын-Арыг почувствовала, что бремя многовековой бдительности рухнуло, и поддалась Торпору. \n\nБудущая судьба: Алтын-Арыг проснется и обнаружит, что ее родственники разделены на Восток и Запад. Она намеревается воссоединить своих детенышей, зная, что Эрки смогут выжить только в том случае, если они объединятся."
 POD_persistentpodlore.desc.795402:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nIshbara не был рожден для завоевания. Третий сын несовершеннолетнего бека, его родственники считали его суровым и скучным человеком, который предпочитал бухгалтерские книги оружию. Однако именно он помог своему племени выжить, когда наступила катастрофическая зима. Алтын-Арыг наблюдала, как этот человек усердно трудится, и, зная, что ей нужен кто-то для поддержания ее нового племени, она $pod_Embrace$ дала ему знать. \n\nПочти тысячелетие Ишбара работала неподвижной рукой Волчицы. Он лично систематизировал Тёре, который позволил Эрку процветать в Эргенеконе вместе со смертными. Вскоре после того, как Алтын-Ариг вывел их из горы, он взял себе ребенка. Ай-Толды. В этом молодом человеке было все, чем не был Ишбара; харизматичный, талантливый воин с нежной душой поэта. Эрк лелеял его, и Ишбара начал готовить его к тому, чтобы он стал их новым лидером, чтобы он сам мог однажды отдохнуть.\n\nЭтого так и не произошло. Когда Эрки поехали поддержать своих союзников [Glossary('Анда','podgloss.anda')] против восточной угрозы, битва превратилась в резню. Отчаявшись закончить битву и не дать умереть еще кому-нибудь из своих сородичей, он развязал апокалиптический шторм. Тысячи призрачных и физических клинков кромсали поле битвы. -Толды, мчавшийся сквозь хаос на помощь своему [Glossary('сир','game_concept_Sire_desc')], попал в водоворот. Измученный и ослепленный кровавой бойней, он не осознавал, что натворил, пока ураган не разорвал Ай-Толды на части. \n\nТеперь Ишбара работает неустанно, погруженный в администрацию. Сам он больше редко выходит на поле боя, но всякий раз, когда он это делает, он, кажется, сражается с безрассудной, самоубийственной апатией. Он терпит это существование только в надежде, что однажды Алтын-Ариг проснется и дарует ему смерть, которую он жаждет. Пока не придет ее приговор, он будет нести бремя руководства Эрком.\n\nБудущая судьба: Волчица не проснется, чтобы вынести ему приговор, но он все равно найдет свой покой в ​​безрассудной схватке против $pod_kueijin$."
 POD_persistentpodlore.desc.795403:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nModu родился в умирающей империи хунну в I веке нашей эры. Он с самого начала обладал огромным обаянием и амбициями, желая стать великим героем. Когда ему было девятнадцать, он использовал свое влияние и харизму, чтобы собрать воинов и пообещал им участие в битве, которая уничтожит восставших предателей на юге. Идя во главе семитысячной армии, он привел воинов к сокрушительной победе, которая, по его мнению, была сокрушительной. \n\nМоду ошибался. Вражеский командующий завел силы хунну в ловушку, окружив и уничтожив их. Лошадь Моду была убита стрелой, и он ничего не мог сделать, кроме как лежать в крови и грязи, наблюдая, как умирают его люди, и слушая их крики. Когда немногие оставшиеся в живых помогли ему подняться, он посмотрел на устрашающе тихое поле и мог думать только о том, почему он привел так много людей на смерть. Возвращаясь к своему племени на хромой лошади, между опустевшими юртами, он не мог смотреть никому в глаза. Взгляды, которые бросали на него жены, дети и матери, были достаточно сокрушительными. Однако один молчаливый иностранец увидел мимо, казалось бы, сломленного человека. Эту ошибку можно превратить во что-то хорошее, даже если на это потребуются столетия. Той ночью Ишбара обнял побежденного юношу. \n\nОтважный воин погиб на поле боя, но его место занял Бдительный Волк. Моду больше не будет безрассудно сражаться. Чтобы предотвратить повторение трагедии, подобной той битве, он научился использовать свои силы, используя их для маскировки. Теперь он является главным командиром своего [Glossary('сир','game_concept_Sire_desc')], Ишбара. Моду сильно изменился со времен своей смертной жизни. Он по-прежнему обладает неоспоримым обаянием, но оно сдержанное и скромное. Некоторые могут посчитать его осторожность слабостью, но бесспорно то, что он глубоко заботится о своем народе. \n\nБудущая судьба: Моду продолжит оставаться любимым наставником и лидером Эрков, особенно молодых."
 POD_persistentpodlore.desc.795404:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nYidu родился в одном из многих племен Шатуо, служивших второстепенными пограничниками династии Тан. В течение 52 лет он был идеальным слугой. Нецивилизованный варвар в глазах Тан, но, по крайней мере, раболепный. Он ненавидел каждую секунду этого. Он был свидетелем того, как китайские генералы использовали себя и своих людей в качестве мясного щита против своих врагов. На Шатуо постоянно смотрели свысока, наказывали за каждую малейшую ошибку и даже за те, которые они не совершали. Иду стал одним из генералов Шатуо в возрасте 50 лет. Циничный и травмированный человек, он понял, что мира с его угнетателями никогда не будет. Правильным ответом будет только удар по шее. \n\nВ 884 году нашей эры Иду воспользовался представившейся возможностью. Собрав верных ему людей, он убил своих китайских надзирателей, сжег их поместья с их семьями внутри. Услышав слухи об опытном и оппортунистическом тактике, Ишбара выследил его и $pod_Embrace$d Йиду, надеясь превратить его ненависть во что-то более продуктивное. Ему это удалось, но не так, как он надеялся. \n\nЙиду вырос еще более компетентным и старательным человеком. Его бессердечные и коварные планы также росли, но никто не мог отрицать результаты, которых он добился. Йиду ненавидит то, что его [Glossary('сир','game_concept_Sire_desc')] довольствуется ролью просто слуг [Glossary('Анда','podgloss.anda')], в то время как Восток созрел для завоеваний. Йиду контролирует самые восточные регионы, принадлежащие Эрку. В последнее время он начал активно набирать людей из остатков Шатуо, используя их в качестве своей личной армии. Черный Ворон намеревается спровоцировать войну, заставив катайцев ответить на один из его секретных набегов, заставив руку своего [Glossary('сир','game_concept_Sire_desc')] присоединиться и защитить его. \n\nБудущая судьба: Йиду отделится от остальной части Эрка столетия спустя и будет ужасно хорошо управлять своей землей на Востоке. Только клинок убийцы положит конец его амбициям."
 POD_persistentpodlore.desc.795405:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nЧиксин, единственный ребенок талантливого наемника, провел свое детство в путешествиях и спаррингах. У него был природный талант легко заводить друзей и союзников, очаровывать множество женщин и сражаться своими двойными клинками. В свою первую стычку он вступил в возрасте 15 лет и с ужасающей быстротой двигался по полю боя, бесстрашно бросаясь на передовую. С течением времени его слава росла, привлекая внимание Йиду, который хотел собрать больше верных ему людей. Вместо того, чтобы сразу же обнять его, Йиду убедил молодого вспыльчивого человека, что его ждут бесчисленные возможности, если он примет его предложение. Никогда не отказывавшийся от шанса на еще большую борьбу и славу, он принял его. \n\nЧиксин на удивление хорошо привык к своей новой не-жизни. Йиду привел многих мастеров меча для дальнейшего своего образования и научил его тому, как человек должен руководить своим народом; эффективно и без сомнений. Молодой Ворон пользуется большой популярностью среди Эрков из-за его природной харизмы и доблести. Хотя он не так бессердечен, как его [Glossary('сир','game_concept_Sire_desc')], многие опасаются, что грандиозные амбиции Чисиня могут означать его гибель. \n\nБудущая судьба: Будучи подготовленным стать великим наследником, Чиксин возьмет на себя то, что осталось от земель Иду после его убийства. Разъяренный и скорбящий, он в отместку начнет безрассудные атаки. Возможно, эту войну он наверняка проиграет, но Чиксин не успокоится, пока не отомстит за свой [Glossary('сир','game_concept_Sire_desc')]."
 POD_persistentpodlore.desc.795407:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\n. В свои смертные дни Баян был хазарским мастером взимания пошлин, находившимся недалеко от известного центра торговли. С самого начала он был человеком огромных аппетитов; за еду, питье, хорошую компанию и женщин. Несмотря на то, что можно предположить по его веселому и беззаботному характеру, он обладал острым умом в отношении чисел. Он мог одним взглядом взглянуть на караван персидского купца и подсчитать пошлину, которая удовлетворила бы всех. \n\nМолодой Ай-Толды $pod_Embrace$ добился его как благодаря своей постоянной способности рассмешить его, так и благодаря своим талантам казначея. Они почти сразу стали близкими друзьями. Когда Баян потерял свой [Glossary('сир','game_concept_Sire_desc')], он стал громче, шумнее. На каком-нибудь празднике или мероприятии он всегда окружен людьми, не желая оставаться наедине со своими мыслями. \n\nБудущая судьба: $pod_kueijin$ отомстит за атаки Йиду, нацелившись на Баяна и Чичека. Когда их защита будет прорвана, чтобы выиграть время для того, чтобы остальные сбежали, он будет использовать свои способности в полной мере и создаст иллюзию армии, сияющей серебром и золотом. Атакуя вражеские ряды, смеясь, сам образ Бога Богатства. Он выиграет достаточно времени, чтобы другие смогли сбежать, но сам Баян будет убит и умрет так же, как и жил: устроив громкое зрелище, чтобы никто не увидел скрытую за ним боль."
 POD_persistentpodlore.desc.795408:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\n. В свои смертные дни Чичек была любимой дочерью богатой семьи уйгурских торговцев. Выросшая в мире торговли, шелка и экономики, родители учили ее, что хорошо сказанный комплимент или обещание не могут открыть двери, в отличие от насилия и взяточничества. Ее семью всегда любили в общине, а Чичек был их драгоценным камнем. \n\nКогда Ай-Толды, любимец своей общины, посетил ее город по делам, он был очарован ее добротой и нежной душой. Они провели неделю, гуляя и разговаривая под ласковым ночным небом. Однако, когда ему пришло время уходить, он отказался взять ее с собой. Он любил ее слишком сильно, чтобы наложить проклятие, наложенное на его сородичей, на невинную молодую женщину. Чичек, возможно, была нежной и доброй, но это не означало, что она была слабой. Она выследила его прежде, чем он успел уйти, и умоляла Ай-Толды, утверждая, что жизнь под ярким солнцем ничего не значит, если они не смогут быть вместе. Тронутая ее преданностью, Ай-Толды подарила ей $pod_Embrace$. \n\nЧичек прожила всего несколько лет в ее нежизни, когда ее возлюбленный [Glossary('сир','game_concept_Sire_desc')] был случайно убит Ишбарой. Когда сломленный мужчина вернулся и признался ей в том, что сделал, он был готов к тому, что она набросится на него. Вместо этого Чичек обнял этого человека и простил его, зная, что он никогда бы не совершил такого ужасного поступка намеренно. Теперь Чичек служит дипломатом Эрка, делая все возможное, чтобы ее единственная оставшаяся семья не распалась. \n\nБудущая судьба: Чичек будет жить дальше, переехав в современную Турцию. Действуя за пределами Стамбула, она будет единственной причиной, по которой Эрк не разорвется на части."
 POD_persistentpodlore.desc.795411:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nВ свои смертные дни Крека была настоящей опорой Империи гуннов. Будучи искусным дипломатом и управляющим, она пользовалась лояльностью бесчисленных правителей и имела дело со многими посланниками. Когда до нее дошли новости о том, что Аттила умер от кровотечения из носа, увидев красоту своей новой невесты Ильдико, мир, который она знала, был разрушен. Поскольку империя была разорвана на части изнутри, Крека ничего не мог сделать, кроме как наблюдать, как разрушается тщательно созданное царство. Она стала возмущаться младшим Ильдико, считая девушку проклятием, которое обрекло их всех. \n\nКогда гунны потерпели поражение, изолированный Эрк услышал о талантах Креки. Ее тайно доставили в Эргенекон и $pod_Embrace$d. На протяжении сотен лет она служила матриархом монеты и государственного управления. \n\nКрека никогда особо не задумывался о том, что случилось с Ильдико потом. Но когда [Glossary('Анда','podgloss.anda')] нападает на двор Черной Черепахи, до ее ушей доходят интригующие слухи о [Glossary('ву','podgloss.wu')] невест-дьяволов. Слухи о женщине с трагически красивым и знакомым лицом. \n\n Презрение Креки к Ильдико сменилось глубоким уважением, как только слухи подтвердились. Она больше не была слабой маленькой девочкой, а превратилась в человека, которому удалось вырваться из лап ужасного [Glossary('Дохор-хана','podgloss.dokhorkhan')]. Она больше не была единственной, кто помнил вид и запах большого зала Аттилы. \n\nБудущая судьба: Понимая, что война между Эрками и $pod_kueijin$ никому не принесет пользы, две бессмертные королевы заключат тайный союз. Ильдико будет использовать свое постоянно растущее влияние, чтобы не допускать «Голодных мертвецов» на территорию Эрка. Крека сосредоточится на том, чтобы остановить продвижение Йиду на восток и убедить Эрк идти на запад, в сторону Анатолии. Крека основат свой двор на территории современной Турции, став красноречивым титаном коммерции."
 POD_persistentpodlore.desc.795417:0 "Этот персонаж был создан разработчиками PoD, чтобы придать сеттингу большую глубину, и не является официальной частью $pod_wod$. \n\nДжалаир с самых ранних дней был человеком, созданным для того, чтобы быть щитом. Воспитанный суровым и уважаемым воином, его прежде всего учили сражаться. Свое прозвище «Бессмертный» он заслужил после того, как ушел с дюжины полей сражений, где любой другой человек остался бы падалью. Признавая его преданность и доблесть, Крека сделала его своим щитом. \n\nДжалаир достаточно быстро стал самым известным воином Эрка. Он заслужил честь быть личным охранником Креки, питая огромное уважение к ее дальновидному мышлению. Несмотря на свой смертоносный характер и репутацию, он на удивление добросердечен, но отстранен. Однако его добродетель не всегда идет ему на пользу. Джалаир ни разу не жил для себя, определяя свое существование хозяевами, которых он защищает. Он — великолепное оружие, но, тем не менее, оружие, зависящее от командирской руки, которая даст ему цель. \n\nБудущая судьба: Когда Анда будут насильственно призваны на свою гибель в Каракоруме в 1388 году, Джалаир будет единственным Эрком, который встанет рядом с ними, поскольку остальные его родственники будут отрезаны отдельной восточной силой. Он будет сражаться с апокалиптической яростью, прежде чем наконец упадет в Торпор под горой трупов. Считаемый своим окружением мертвым, Бессмертный столетия спустя упрямо вырвется из земли только для того, чтобы обнаружить, что мир сильно изменился, а его родственники рассеяны по ветру современности. Впервые за время своего существования он будет совершенно одинок и лишен хозяина. Полагая, что его бросила семья, ради защиты которой он пролил кровь, Джалаиру придется столкнуться с внутренним кризисом. Чтобы выжить в современных ночах, Бессмертный должен либо научиться сражаться за себя, либо рискнуть исчезнуть."
 POD_persistentpodlore.desc.795418:0 "Этот персонаж был создан разработчиками PoD, чтобы придать сеттингу большую глубину, и не является официальной частью $pod_wod$.\n\nРожденный в нищете и грязи на оживленных торговых путях Болгара, Барадз прожил свою жизнь как призрак. Никто не узнал мальчишку, но он их заметил. Он заметил, что богатство — единственное, что привлекало внимание всех людей. Это был его единственный шанс стать настоящим, и он выбрался из грязных переулков с безжалостной хитростью, основав свой собственный небольшой синдикат для вымогательства у торговцев. Его финансовый гений и сообразительность привлекли внимание Креки, и молодой человек с радостью принял свою новую не-жизнь. Однако \n\nВечность оказалась жестокой ловушкой. Барадз, несмотря на свой относительно молодой возраст, преуспел в расширении своей сети, помогая себе и своему сэру. Он обладает всем влиянием, о котором только мог мечтать, но единственные, кто его окружает, — трусы, дураки и подхалимы. Его одиночество начинает тяжело сказываться на его разуме, хотя он изо всех сил старается оставаться стойким. \n\nБудущая судьба: Барадз безупречно адаптируется к современному капитализму, превратив свою торговую сеть в корпоративное королевство к 20 веку. Однако эта эпоха станет последней каплей. Летом 1997 года Барадз бесследно исчезнет, ​​а вскоре после этого разорится и его корпорация. Никто из Эрков не узнает, вышел ли он на солнце, забрел куда-то далеко или отправился в Торпор мечтать о настоящих друзьях."
 POD_persistentpodlore.desc.795419:0 "Этот персонаж был создан разработчиками PoD, чтобы придать сеттингу большую глубину, и не является официальной частью $pod_wod$. \n\nКадир вырос как младший сын в длинной линии карлукских судей, которым было поручено поддерживать порядок в своих регионах. Его учили, как с первого взгляда распознавать лжецов, убийц и других подобных диссидентов и как лучше всего эффективно заставить их замолчать, сохраняя порядок. Такое воспитание привило ему огромное стремление к порядку во всем, избегание любой анархии. Приняв роль кинжала и надзирателя, Кадир превратился в непревзойденного профессионала, беспрекословно выполняющего любые приказы. Ему нравится подшучивать и играть со своими жертвами, и он поддерживает хорошие отношения со сверстниками. Но за вежливым фасадом скрывается человек, который искренне получает удовольствие от порученной ему работы. Кадир наслаждается каждым убийством и не обращает внимания на невиновных, которые могут встать у него на пути. \n\nОн твердо верит, что все, что он делает, необходимо для построения стабильного будущего для его народа, и в раскаянии просто нет необходимости. Сородичи и Кины — расходный материал, а стабильность Эрка — нет. \n\nИ тем не менее, его абсолютная преданность вознаграждается едва скрываемым презрением со стороны его сородичей. Это лицемерие начало приводить его в ярость, заставляя его возмущаться своим кровным братом Джалаиром. В то время как Бессмертный почитается как щит Эрка, Кадир видит Джалаира и просто человека, который делает то же самое, что и он. Защищая свою семью. Но поскольку Джалаир проливает кровь на поле боя мечом, он герой. Поскольку Кадир проливает кровь в темноте кинжалом, он монстр. Его дисциплина пока сохраняет спокойствие Кадира, но изоляция от его неблагодарной работы все еще гложет края. \n\nБудущая судьба: Когда Джалаир падет, Кадир станет еще более ценным для Креки. Хорошо адаптируясь к современному миру, Кадир плавно превратится из древнего палача в безупречного современного наладчика в Турции. Однако однажды ночью Джалаир может вернуться, и старое соперничество может вспыхнуть снова."
 POD_persistentpodlore.desc.895501:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\n. Хотя среди ортодоксальных [Glossary('дхармами','podgloss.dharma')] осуждать их как глупую рационализацию смертной религии в истине, которая должна быть самоочевидной, является предметом насмешек и насмешек. Но те, кого послали «разобраться» с Ликами Богини, увидев своего чемпиона, наконец понимают, что на самом деле они могут что-то заподозрить. \n\nБожество, известное как Махакали, является загадкой даже для других высших Богов. Хотя многие сочли бы ее довольно смелой, если бы она претендовала на это имя, она олицетворяет Богиню, которая, по ее мнению, спасла ее настолько близко, насколько это возможно. Буря ярости и разрушения, непоколебимая перед лицом опасности, безоговорочно преданная своей новой семье и делу, наслаждающаяся смертью, она определенно выглядит достойной в бою. Но прежде всего она не может сказать этого, поскольку его больше не существует. \nНекоторые божки подозревают, что она, возможно, была Магом Времени при жизни до того, как каким-то образом уничтожила себя и свое прошлое, поэтому и сбежала из Ада Злой Магии. И ее смерть каким-то образом лишила ее всей силы, пока в ярости и божественном просветлении она не вырвалась наружу не с помощью магии, а с чистым гневом и силой. Потребовалось большинство боглингов, чтобы одолеть ее как дикого демона, но многие теперь рады, что им это удалось.\nМахакали — главный защитник Ликов Богини.\n\nБудущая Судьба\nСо временем воплощение Махакали идеалов Ликов Богини в конечном итоге заставило ее превзойти даже Шодаши с точки зрения силы. Дхармическая сила. Однако она исчезла вскоре после Недели кошмаров. Куда она пошла, неизвестно, но последнее сообщение, которое она оставила своим собратьям-богам, вселило в них чувство невероятного страха, даже если они не понимали почему. \n\n\"Монстр оскверняет имя того, что сделало меня Богиней. Я все исправлю.\""
 POD_persistentpodlore.desc.895502:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\n. Годлинги, как правило, являются искусственной и жестокой группой, и это так же верно как для Ликов Богини, так и для Небесного Племени. В конце концов, отказ от двойственности и ограничений может применяться к нормам и связям. Но направлять их будет самая компетентная ученица Шодаши. \n\nДо того, как она стала Голодными мертвецами, Тара была всего лишь одной из многих маленьких людей в многочисленных рыбацких общинах Бенгальского залива. Вышла замуж за доброго человека, благословлена ​​прекрасными детьми, у них достаточно денег, чтобы нормально жить, и они живут во времена относительного мира для своего сообщества. Она была счастлива. По крайней мере, она так думала. Но однажды, собирая ловушки, она приняла крокодила за бревно и за свою мирскую жизнь оказалась в аду перевернутых грешников, где ее некогда мирская жизнь превратилась в ад постоянного смятения и хаоса. \nОна прокляла себя за смертную слабость и взывала к бегству. Но только когда она приняла абсурдность всего этого, она начала просыпаться и упала обратно в Живой Мир в Бенгальский залив, где Лики Богини в конечном итоге нашли ее. \n\nПо их парадигме, по крайней мере, прозрение ее побега имело смысл для свежеиспеченной $pod_kueijin$, которая взяла имя Тара в честь Шакти, возвысившей ее до богини. Ей больше не нужна мирская жизнь, которая у нее была, она желает большего. Она хочет жить, она хочет получать опыт, она хочет иметь что-то, ради чего можно бороться и жить. \nИтак, она вступила на путь с невероятной точностью и направлением, являясь выдающимся авторитетом в Ликах Богини, уступающим только Шодаши. Она стала источником руководства и защитником их дела. И она никогда не была более актуальной."
 POD_persistentpodlore.desc.895503:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\n. Часто недооцениваемая обязанность Голодных Мертвецов — внимательно следить за Мирами Духов. Хотя ортодоксальные [Glossary('дхармами','podgloss.dharma')] утверждают, что еретики [Glossary('дхармами','podgloss.dharma')] одержимы чрезмерной сосредоточенностью на Живых мирах, и они в некоторой степени правы, отрицать предпринимаемые усилия является грубой ошибкой. А среди Ликов Богини Бхуванешвари посвятила себя тому, чтобы стать главным перекрестком между физическим и духовным мирами. \n\nДо своей смерти она была просто женщиной веры и преданности, но у нее всегда были сомнения. Независимо от того, насколько преданны были ее медитации или сосредоточены на них, ее всегда мучили неуверенность, страх и меланхолия. Поэтому она умерла молодой, от своей собственной руки. И в результате этих мучений она нашла свой путь в Ад Горькой Истины, одного портного, созданного для того, чтобы лишить верующих дела и преданности и обманом заставить их поклоняться своему хозяину. \n\nНо настолько сломленная преданностью, она вместо этого решила пойти своим путем. В предательстве она нашла свое предназначение. Что-то в ней проснулось, и ей удастся пробиться наружу. И когда ее нашли Лики Богини, ее достижение в путешествии через один из глубочайших адов обратно к живым без изобретений заставило ее принять титул Бхуванешвари.\n\nИ с этой целью теперь она управляет как их земными, так и духовными делами. Не боец, а штурман, она предпочитает уклоняться от боя, предпочитая вместо этого монеты и ресурсы. Она намечает территории, которые будут использовать божки, отправляет послов и организует для этих целей самых юных божков. \nОднако всегда остаются сомнения. Она нашла выход из ада, отвергнув божественное. \n Придется ли ей сделать то же самое? И будет ли это означать, что ей придется отрицать Божественность, которая, как верят другие, присутствует в ней сейчас?"
 POD_persistentpodlore.desc.895504:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\n. В своей смертной жизни до того, как она стала Чиннамастой, она стала одной из многих жертв Вечной войны. Первоначально будучи одной из многочисленных прислужниц Равнос, Чиннамаста боролась против Узы Крови, опасаясь опасности, которая может постичь ее семью и втянуть ее в конфликт. Она регулярно бросала вызов приказам, бросая вызов их воле и помогая своей семье избежать превращения в еду для Равнос. \n\nНаконец, когда ее общежитию было достаточно, он связал ее на столбе и потребовал, чтобы, если она хочет и дальше быть трудной, она могла либо сдаться и рассказать им, либо стать подчиненной. И с этой целью Чиннамаста, собрав всю свою волю, преодолела силу $pod_vitae$, чтобы вместо этого броситься с пьедестала, который был для нее приготовлен, и обезглавила себя пилой, вместо того, чтобы быть использованной для этой цели. \n\n И казалось, что на Ланке ее заставили вечно сожалеть о том, что она имела смелость бросить им вызов. Находясь перед бесчисленными жертвами, ей был предоставлен садистский выбор: страдать за них еще больше или добровольно принять их боль на тысячу смертей. \n\n Ни разу она не ошиблась. Ни разу она не отказалась. И каждый раз она брала орудие их боли в свои руки и принимала его. И в каждом ужасе она становилась сильнее. После каждого обезглавливания она вновь обретала ясность ума. При каждом снятии кожи она осознавала свою форму. Каждая пытка восстанавливала ее волю. \n\nЕе побег прошел тихо. На этом маленьком участке Ланки не осталось никого, кроме нее, как и все до нее, получившие отпущение грехов, и она просто открыла свои разбитые и кровоточащие глаза в мире живых. И когда ее нашли Лики Богини, для нее стало очевидно, какая часть Шакти благословила ее. И теперь, обладая сосудом божественного, настолько превосходящим ее прежние смертные чувства, она может сделать больше, чем просто отсрочить то, что убило ее с самого начала."
 POD_persistentpodlore.desc.895505:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\n. Хотя насилие между богами является обычным явлением, есть те, кто предпочел бы, чтобы они не дрались. По крайней мере, как они это понимают, Нисшедшие должны видеть в Ликах Богини заблудших членов Дэви, а для Ликов Богини Нисшедшие все еще содержат в себе частички Шакти. Дхумавати - одна из немногих представителей великого Небесного Племени, которые действительно стремятся преодолеть пропасть между ними. \n\n Дхумавати в своей смертной жизни изначально была медиумом, способным слышать шепот призраков. Но из-за этого и ее собственной внешности большую часть времени к ней относились не как к человеку, а скорее как к монстру. Но ее услуги в качестве медиума, по крайней мере, заставили ее терпеть, и она умерла мирно и на какое-то время отправилась в Ад Жалкой Магии из-за отсутствия у нее стремления упокоить мертвых. \nОднако она восприняла это спокойно и использовала изоляцию, наложенную на нее, и сделала ее средством своего побега. И когда Шодаши нашел ее, Шодаши сначала списал ее со счетов, но затем заметил, насколько невероятно мудра была старуха, и что они поняли в ней как частичку Шакти. Итак, старуху взяли к себе и дали имя, под которым она пойдет в Ночной Мир, Дхумавати. \n\n Дхумавати, по крайней мере номинально, поручено разобраться с мертвыми, но на самом деле она является основным источником разговоров между молодыми божками и Сошедшими с лика Богини. Стремясь убедить их в истинной природе Шакти внутри них, она невероятно предана этой задаче, при условии, что они не будут судить о ней по первому взгляду."
 POD_persistentpodlore.desc.895506:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nОдин из основополагающих принципов Ликов Богини заключается в том, что до того, как Голодные Мертвецы получили часть Шакти, чтобы сделать их достойными Второго Дыхания, все они были просто смертными, грешными и злыми. И, по крайней мере, Багала воплотила это в своей земной жизни.\n\nДаже в детстве она была злой. Наслаждаться ловлей рыбы и наблюдать, как она задыхается, топить кроликов, сбрасывать собак в воды, кишащие крокодилами, и убивать священных животных. Она перешла к людям еще до того, как ей исполнилось 14 лет, и к тому времени, когда она стала взрослой, ее серия убийств была настолько плодотворной, что даже избранные Хан-Вертигры, посланные разобраться с серийным убийцей, обнаружили, что ее дом перегружен ужасными ловушками и ямами для убийств, ожидающими их.\nОднако в конце концов она встретила свой конец, когда убила не того Дампира, а женщина, носящая имя бога бури, убила ее во время внезапного наводнения и приговорила к аду кипящих морей. Боль от утопления и чертовски повторяющиеся страдания, вынудившие постичь ту же участь, которую она причинила другим, по крайней мере, смирили ее, по крайней мере, до некоторой степени.\n\nИ когда она, наконец, сбежала из ада, позволив себе быть полотном боли, пока ее не выбросили обратно в жизнь, она, по крайней мере, почувствовала, что ей нужно умерить свои... «потворства». Имея внутри себя часть Шакти, она могла бы стать лучше.\n\nПо крайней мере, Багала пытается. Вкус к убийству все еще в ней. Но парализующие яды, ловушки, серебряные ножи, колы и многие другие орудия убийства теперь она просто... лучше выбирает свои цели. Равнос, [akuma|E], Нагараджа, Дьяволы и многие другие злодеи представлены вниманию Багалы, где она с особым ликованием разрубает их на куски и устраивает шоу из их смерти.\n\nХоть она и далека от Деви, которая является ее тезкой, она, по крайней мере, полезна Ликам Богини. И это главное, не так ли?"
 POD_persistentpodlore.desc.895507:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nПо большей части Лики Богини немного отличаются от традиционно подвергавшихся остракизму. Часто их упускают из виду из-за переносимых жизненных предрассудков, поэтому легко не обращать внимания на них. И именно по этой причине Голодные Мертвецы, ныне называемые Матанги, отказываются отказаться от своих смертных корней, даже будучи божком.\n\nДо того, как стать Матанги, она была изгоем и специально занималась неблагодарной работой по избавлению от трупов. Ее родители занимались аналогичной профессией, и ей мало на что еще можно было надеяться, кроме этого.\nИтак, с юных лет она взялась за одну и ту же профессию и делала это усердно. Но насмешка, которую она чувствовала как человек, избавившийся от мертвецов, никогда не покидала ее. И однажды ночью все стало намного хуже, когда, когда она хоронила одно тело, они начали дергаться, поднимаясь из земли. Она запаниковала, экзистенциальный страх смерти охватил ее, когда недавно воскресший труп избил ее до смерти, съел, оставив ее кости и сухожилия гнить на солнце.\nИ после того, как ее убили Восставшие, она поранилась в аду роющих личинок. Но, несмотря на все это, ее прежний источник изоляции стал источником освобождения. Знание того, как гниют тела и как разложение мертвых, позволило ей рассчитать время циклов личинок и использовать мух, цветущих из ее тела, чтобы перенести ее обратно в живой мир.\n\nСтав ученицей Шодаши и взяв себе имя Матанги, чтобы всегда напоминать ей о своем происхождении, Матанги не может не заметить даже сейчас, несмотря на то, что ее называют божком, она все еще находится на периферии своих новых Дворов.\nПо крайней мере, она приняла свою роль Богини Изгоев, защищая их от судьбы, подобной ее. Может быть, по крайней мере, если Шакти выбрала ее, она сможет помочь все исправить."
 POD_persistentpodlore.desc.895508:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\n. Для большинства божков, хотя жизнь многих из них отмечена предзнаменованиями, очень немногие из них пришли из положения или происхождения богатства или власти. Но из всех норм есть исключения. А среди Ликов Богини у них есть бывшая принцесса. Но какой именно, Камала не скажет. Ей совершенно ясно, что та, кем она была, мертва. И сейчас важно только то, кто здесь сейчас. \n\nВ своей смертной жизни Камала была принцессой Империи Пала. Выросшая в привилегированной среде и рядом с сердцем бенгальского народа, она имела все, что могла материально желать в жизни. По крайней мере, все, кроме мужчины, которого она действительно любила. \n\n Обрученная по политическим мотивам, она имела с ним связи, но они были мимолетными в великой шкале вещей. Что касается причины, то когда ее жених узнал об этом, он просто утопил ее, а затем взял сестру в качестве невесты. \n\nТаким образом, приговоренная в Ад Кипящих Морей за прелюбодеяние и утопление, ее единственным спутником, кроме удушья, были течения. Поэтому, вместо того, чтобы рисковать пылающей поверхностью, она последовала за течением в Аду. И, пройдя через него и доверившись потоку, она действительно оказалась экстрадированной обратно в мир Живых. \n\nИ когда ее нашли Лики Богини, ее компетентность и навыки управления сделали ее невероятно ценной, и она стала легким выбором для последней ученицы Шодаши. Таким образом, приняв имя Камала, она сможет оставить позади призраки своей смертной жизни и начать все заново. Она скорее надеется стать самостоятельным правителем."
 POD_persistentpodlore.desc.EA0001:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nСреди множества вампиров, оказавшихся на орбите Короля Злого Города, лишь немногие находятся в таком неведении, как Ацуши. Первоначально он был производителем кукол в Северной Японии, но его умение делать детские игрушки привлекло внимание довольно необычного покупателя: мертвого цвета лица, странных волос и ужасного акцента. В то время он мало об этом думал, просто был счастлив, что кто-то так увлечен его работой, вплоть до того момента, пока она не убила его и не вернула обратно с его кровью, и с радостью не объяснила ему, как он собирается делать для нее куклы.\n\nНавсегда.\n\nАцуши совершенно не был готов стать одним из Банпая, увидеть, как его мастерство кукольного мастера обернулось ужасающим концом, поскольку он использовал свои новые кровные силы, чтобы превращать кричащих субъектов в новых монстров. Бесконечная вина терзала его, и все это в миазмах растерянности, вызванной тем, что его [Glossary('сир','game_concept_Sire_desc')] гордился им. Все это начало давить на него, ломать его, пока, наконец, он не сломался. Он пробрался в убежище своего хозяина и просто жаждал ее одобрения. Он поддерживал ее, просто хотел сделать что-то хорошее, поэтому он уступил и сделал все, что она просила, став ее величайшим сторонником, ее самым гордым мастером и тем, что всегда следило за ней, как дрожащая собака. Все ради цели. Всё для ясности."
 POD_persistentpodlore.desc.EA0002:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\n. По большей части, хотя охотники называют Сородичей монстрами, большинство борется с монстром в себе, стремясь сохранить свою человечность. Но немногие избранные принимают внутреннего монстра, находят в себе темные стороны и используют подобные поблажки, чтобы сковывать своего зверя бременем развращенности. Аканэ была одним из таких Сородичей.\n\nРожденная из благородного сословия, Аканэ имела все, чего могла желать в жизни, и все же желала всего, чего не могла иметь. Она изменяла мужу с младшим персоналом замка, воровала у местных жителей ради мелких поблажек и прикрывала это, а кайф от нарушения норм становился все сильнее и сильнее, пока у нее не появилась специальная лачуга, где она истязала и убивала окрестных крестьян. Она хорошо заметала следы, но когда у нее случился приступ ярости, когда двое ее любовников поженились, она похитила их и сшила вместе. И почти ей это сошло с рук, но она пошатнулась только потому, что ее муж смог распознать ложь. Ее преступления были скрыты, чтобы не опозорить ее семью, и ее приговорили к казни. Но ее злоба и жестокость, а также хитрость произвели впечатление на древнего вампира Кагасео. Кагасео, не желая наделять ее силой больше, чем нужно, заставил Ханну принять ее в Банпайю. \n\nАканэ обнаружила, что, помимо своих обязанностей и сил вампира, она процветала. Ей нравилось создавать горгулий, она находила восхитительную силу взятия крови и обожала свою силу, связывающую людей кровью. После того, как она превратила своего бывшего мужа в вампира, превратила его в горгулью, а затем диаблеризировала, ее дикий танец новых ужасов и преступлений стал еще выше, поскольку она жаждала все большей и большей власти. Создание плоти и осквернение стали ее удовольствиями, ее целью. Теперь она собирает гарем из кровно связанных кукловодов и монстров, как настоящая королева осквернения, топя своего зверя в наслаждении и постоянно предаясь ему."
 POD_persistentpodlore.desc.EA0007:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\n. Первая из горгулий Бингмайонг, созданная в результате слияния Сородича и Ван Куэя и вдохновленная маленькими фигурками, которые Ханна видела в магазинах, горгулья, известная как «Глина», станет ужасающей тенью Ханны. Кем была Клэй до того, как стала горгульей, теперь не имеет значения. Сформирован из захваченных Буши и $pod_kueijin$ Дома Бишамон. Ханна, изначально не желая ничего терять, сделала Клея размером с двух мужчин, ошеломляюще высокого роста и более или менее с мускулами двух людей, накладывающими друг на друга. И когда «Клэй» проснулся и увидел, что Ханна позволила $pod_vitae$ течь себе в рот, Клэй признал в ней хозяйку. \n\nВ отличие от многих других горгулий, особенно на Западе, у Клея гораздо больше прав, чем у большинства горгулий. Клею разрешено возглавить силы Ханны, поговорить с Ханной и выйти без присмотра. Даже несмотря на первоначальные опасения лидеров родословных, настойчивость Ханны, а затем доказательство Клеем их лояльности в конечном итоге оказалось достаточным, чтобы Клею было разрешено действовать так, как она всегда поступала. И теперь, даже когда Ханна забывает об Узах Крови, собственная доброта Ханны к Клею сделала их яростно преданными телохранителями. Клэй знает, какие ужасы и рабство ждут ее, если ее хозяйка умрет. Так что Клей будет служить ей верой и правдой до самой ночи. \n\nБудущая судьба:\n\nКлэй будет защищать Ханну в современные ночи, но однажды ночью ее нашел странный вампир с кровью, которая напомнила Клею Ханну. Он похитил Клея с помощью своего кровавого колдовства, узнал, что сформировало ее, а затем убил Клея и отправился создавать свою собственную версию Клея в Лос-Анджелесе."
 POD_persistentpodlore.desc.EA0008:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nФарфор, первый представитель касты Кинцуги и вдохновленный керамикой, которую Ханна видела во время своих путешествий, несмотря на то, что это одна из ее самых ранних работ, является одной из ее самых гордых работ. Ханна, созданная из буси, сгоревших дотла в результате тренировок, и психически нездорового беспорядка, разрушенного Кошмарами, была счастлива «исправить» их, разорвав на части и превратив в новое существо, единое целое и здоровое. И когда они были готовы, разбиты на части и снова собраны, Ханна назвала их... Фарфор.\n\nФарфору, как и всем «Первым» горгульям, созданным Ханной, была предоставлена значительно более высокая степень свободы, чем другим, прошедшим Узы Крови. Новая Горгулья была быстрой, невероятно присутствующей, когда ей было нужно, или «чрезвычайно харизматичной», когда ей было нужно. Знать, что Ханна была единственным хозяином, который давал ей хоть какую-то степень свободы, было... в некотором смысле освобождающим. Поэтому она направила свои силы на обеспечение безопасности своего хозяина. Будучи Верным, Фарфор был безжалостно точен, скрывался во лжи и хитер. Она будет защищать своего хозяина от самой себя, даже если Ханна временами будет поражена красотой своего собственного творения.\n\nБудущая судьба:\n\nВо всем, кроме названия, Фарфор стал центром паутины интриг Банпая, уступая по влиянию только Аканэ, хотя и гораздо менее уважаемый извне. И все же невероятно свободный поводок, который Ханна оставила Фарфору, позволил ей координировать огромную сеть шпионов и агентов для защиты Банпая и, в большей степени, Культа Сородичей [Glossary('Микабоши','podgloss.mikaboshi')]."
 POD_persistentpodlore.desc.EA0009:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nКакие бы вампиры ни сформировали Iron, они оба явно принадлежали к суровому роду. В то время как Япония сравнительно кишит оборотнями, хаккен не смогли искоренить банпая в первые годы их существования, находившиеся под угрозой исчезновения. Потому что, когда волки выходят поиграть, статуи воинов в их убежищах открывают глаза, вытаскивают разрушительный клинок и собираются показать этим волкам, кто настоящий монстр. \n\nЖелезно было сделано из Буши и Мономи, сильных во всех воплощениях своего существования. В отличие от своего коллеги Клея, Айрон был тяжелым и громоподобным, менее изящным, но ужасающе смертоносным. Обернутая чугунными мускулами, Айрон была смертельна с того момента, как покинула Злую Цитадель. Поскольку Ханна не была к ней властной, Айрон обожал ее до такой степени, что, несмотря на то, что Ханна создала ее, Айрон души не чаял в ней почти как в дочери. И с этой целью, когда Ханна держит двор, в комнате всегда находится одна и та же статуя с брошенными глазами, которые всегда нависают над ними. \n\nБудущая судьба:\n\nЖелезное бдение определило ее не-жизнь. Редко когда-либо покидавшая убежище Ханны, Айрон просто нависала над ними, но ее обязанности расширялись. Организуя армии и выступая в роли металлического кулака Ханны, Айрон будет сокрушать инакомыслие в Банпая, абсолютную волю лидера, который часто был слишком кротким, чтобы действовать. А Железо всегда будет действовать."
 POD_persistentpodlore.desc.EA0010:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nПервый из Тотаев, Керамика, изначально был создан как нераскаянная снисходительность со стороны Ханны. Созданная из прекрасного предателя Чибо и красивого красноречивого Кизоку, который стал слишком смелым ради своего блага, горгулья Ханна по имени «Керамика» была создана как объект объективной красоты, и она была более чем довольна результатом. Будучи последней из Первых, несмотря на то, что многие могли предположить, что она станет наложницей, Керамика вместо этого получила все те же привилегии, что и другие Первые Горгульи Ханна. Скорее, Ханна хотела романтического романа из сборника рассказов, потому что этого было недостаточно, чтобы стать идеальным супругом, Ханна хотела, чтобы Керамик действительно любил ее.\n\nКерамика стала хранителем Хейвена, но в основном всегда вне поля зрения, прячась среди других горгулий. Бесчисленные звери-гули бродили по Гавани, а Керамика шпионила на расстоянии с помощью Прорицания. И когда дело дошло до дела, ее способность создавать иллюзии стала последней линией защиты ее эксцентричного, но в остальном слабого хозяина.  Более того, зная, что Ханна простит все, что бы она ни сделала, Керамика стала немного снисходительнее играть со своей добычей, была невероятно тщательной в этом и более чем стремилась превратить ложь в смертельные кинжалы. А поскольку Ханна редко задавала вопросы, Керамика сочла ситуацию идеальной. Керамика терпела «обеденные свидания» на совместной охоте, различные подарки в виде бесполезных безделушек и чрезмерно дизайнерскую одежду в обмен на то, что Ханна более или менее позволяла Керамику делать все, что она хотела. Обычно это радость и умственное возбуждение от охоты и убийства ши ради развлечения.\n\nБудущая судьба:\n\nКерамика в конечном итоге стала скрытым мастером Банпая. В конечном итоге она свяжет Ханну с собой кровными узами на Кровавой свадьбе, обеспечив ей долгосрочную безопасность, пока Ханна останется. И по мере того, как вокруг Японии накапливаются угрозы, а «Современные ночи» переходят в «Последние ночи», Хозяин Марионеток начинает лучше контролировать свои струны, чтобы убедиться, что все, кто может угрожать ее идеальному положению, будут задушены."
 POD_persistentpodlore.desc.EA0011:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nThe Blackest Night — это ковенант, который охраняет резиденцию сёгуна от сил, находящихся за пределами их понимания, поскольку из теней приходится играть по другим правилам, чем остальной мир. Такова природа выживания в ночном мире. И в это время самой хитрой змеей в этом саду является Холодный Страж. \n\nКакуэ — загадка для большинства остальных жителей его дома, ночная сила, которая редко покидает Камакуру. Всегда скрытый от глаз, говорящий мало правды и, безусловно, наиболее озлобленный по отношению к влиянию [Glossary('дхармами','podgloss.dharma')], побег Какуэ из ада - это в основном догадки остальных членов его [Glossary('ву','podgloss.wu')]. По его собственным показаниям, он отправился в [Glossary('Какури','podgloss.kakuri')] и стал настолько ненужным и незамеченным, что [Glossary('шикоме','podgloss.shikome')] и [Glossary('Эмма-О','podgloss.emmao')] забыли о его существовании. Хотя это немного абсурдно и исходит от человека, известного своей ложью, его [Glossary('ву','podgloss.wu')] подозревает, что это вполне может быть правдой. А учитывая его навыки запутывания и подстрекательства к мятежу, он великолепно умеет выискивать правду и выставлять ее на всеобщее обозрение. \n\nКакуэ, однако, работает для достижения более великих целей. У него довольно глубокие подозрения относительно слухов об орде Цучигумо за пределами степей материка, путешествующей в тени монголов и Юаней. Остальным бишамонам он скармливает правду и ложь, чтобы настроить их против материка, отказываясь при этом подтвердить подлинность чего-либо, что могло бы заставить их открыться для этой более глубокой угрозы. И по мере того, как петля обратной связи лжи и убеждений увеличивается, он обретает благословенное спокойствие от болтливых и бессмысленных предков на материке. \n\nБудущая судьба: \n\nКакуэ всегда будет в центре Темной Ночи. Однако его ярость против Цучигумо в какой-то момент означала его конец, когда однажды ночью, вскоре после прибытия португальцев в Японию, он был найден кучей гниющего мяса, единственным ключом к разгадке убийцы были дымящиеся черные пары..."
 POD_persistentpodlore.desc.EA0012:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nA. Провидец инженерного дела и труда, многие кузнецы, каменщики и плотники в Камакуре получают финансирование от этого скрытого покровителя. И все вокруг них, их работы направлены на более великую работу, все для защиты и защиты от внешних влияний. \n\n Норинака — этот покровитель и беглец из Ада Пылающих Морей. Убитый корейскими пиратами, когда он помогал своей деревне строить доки, но Норинака так и не смог пережить свою смерть. В то время как многие жители Бишамона являются изоляционистами, Норинака выводит его на совершенно новый уровень, питаясь исключительно иностранцами, если может, и получая особое удовольствие от архитектуры, полностью отделенной от любого иностранного влияния. В Камакуре он использует архитектурную магию, чтобы сбить с толку и дезориентировать мертвых, а также заставить головы тех, кто не знаком с этим местом, кружиться в замешательстве, когда они ступают по территории, которую он спроектировал. Кроме того, он действительно опытный архитектор, невероятно сосредоточенный и дотошный в своей работе. Он искренне верит в дело Бишамона и поэтому почти неподкупен. Он играет решающую роль в секретности и планировании более глубоких работ Темной Ночи, а также имеет решающее значение для их продолжения операций по защите сёгунов. \n\nБудущая судьба: \n\nНоринака сохранит свое положение в Бисямоне, разглагольствуя и ругаясь против упадка Бишамона с окончанием японского изоляционизма. Он станет бешеным ксенофобом и до некоторой степени расстроенным, и однажды ночью его желание приблизиться к иностранцам, чтобы убивать, приведет к его кончине, когда он уедет за границу, чтобы попытаться поохотиться, только для того, чтобы получить временное убежище, которое будет разрушено в результате бомбардировки во время Второй мировой войны."
 POD_persistentpodlore.desc.EA0013:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\n. Рожденный через 9 месяцев после пиратского рейда, профессиональный преступник и, в целом, социальный бич и позор для всего Бисямона с момента его вступления в должность, когда дело доходит до необходимости воина охранять властные институты смертных от сверхъестественного вмешательства, Уджиёри не имеет себе равных. Уджиёри родился в условиях насилия и прожил жизнь одного человека. Рано брошенный своей матерью, которая не хотела иметь с ним ничего общего из-за характера его рождения, и начавший жизнь как вор и хулиган, его преступления росли все больше и больше, став полноправным бандитом и убийцей, работающим за деньги. Однако, несмотря на прибыльные возможности Войн Гэмпэй, он встретил свой конец, когда преданный своему делу чиновник устроил на него засаду целой группой охранников и, наконец, смог организовать его казнь. И он был наказан далее, будучи приговоренным к Городу Демонов. Однако Уджиёри был хитрым и представительным человеком, и сладкие разговоры многих ракшасов позволили ему найти Бьющегося Дракона, чтобы сбежать. Когда он вернулся в мир смертных со вторым дыханием, он отпраздновал это марафонской авантюрой, оставившей после себя множество дампиров. \n\nUjiyori - странность среди Бишамонов, и особенно среди Темнейшей Ночи. Он Бьющийся Дракон, но по-прежнему глубоко предан Дому. Получив наставничество за пределами Японии, он вернулся в нее и называет ее своим основным домом. Несмотря на то, что он является членом Дома, который ведет себя с честью, он развратный извращенец, оставляющий за собой бесчисленное количество ублюдков. \n\nОднако он принципиально полезен. Харизматичный и свободный, он может адаптироваться к угрозам, а его отработанные навыки владения мечом и навыки охотника на людей и зверей делают его неоценимым. Более того, его ублюдки-дампиры полезны как сеть союзников. И вдобавок ко всему, своей магнетической харизмой он может вскружить головы как мужчинам, так и женщинам. Поэтому его [Glossary('ву','podgloss.wu')] терпит его, поскольку его сочетание полезности, несмотря на его распутные привычки, дает ему место в [Glossary('ву','podgloss.wu')].\n\nДальнейшая судьба:\n\nХотя пути и цели Ночи изменились, Уджиёри никогда не избегал своей природы. И из-за этого в своей дикой страсти к жизни и радости ощущений он увидел бы, как он поднялся на [Glossary('Сотня облаков','podgloss.hundredclouds')], оставив под собой растерянного любовника, недоумевающего относительно того, куда делся его возлюбленный."
 POD_persistentpodlore.desc.EA0014:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\n. Удзи по своей сути гордо отличаются от материкового Hungry Dead. Одним из таких моментов их разногласий является то, как обращаются с их дампирами. Дампиры среди бишамонов — это представители родословной, престижа и статуса. Однако большинство из них не часто находят путь обратно в системы власти и офисные здания, которые определяют Удзи. В любом случае, обычно\n\nХиинаши — тихая фигура, задумчивая и охотно почтительная по отношению к Темнейшей Ночи. Однако одна из игр Уджиёри в молодой семье, которая имела более глубокие связи с организацией, известной как «Дзидай», дала ей уникальное наследство от семьи ее матери. Мост между Дзидай и Бишамон, у нее есть доступ к Искусствам и средствам, которых часто боятся Голодные Мертвецы, но она настолько предана, что остальные члены [Glossary('ву','podgloss.wu')] серьезно сомневаются, что она когда-либо будет замышлять заговор против Бишамон. И даже тогда, что Бишамон может утверждать об этом скрытом порядке, так это то, что их взгляды аналогичны взглядам остального мира, ей разрешено провести эту линию. Итак, эта «Колдунья» стала основной частью [Glossary('ву','podgloss.wu')] благодаря своим способностям, активно компенсирующим то, чего не хватает остальным [Glossary('ву','podgloss.wu')]. ее обереги могут отгонять духов, ее творения могут гореть, как огонь, ее заклинания могут длиться и удерживаться. И кроме того, она невероятно предана Ясутами настолько, что многие шепчут, что их отношения могут быть более глубокими... но такие слухи никогда не подтверждались. И, по крайней мере, она является важнейшим краеугольным камнем в скрытом дворе Бисямон в Камакуре. \n\nБудущая судьба: \n\nХиинаши состарится, и ни разу она не состарилась в преданности Самой Черной Ночи. С 1227 года, когда она была взрослой женщиной, до 1678 года она продолжала стойко служить дому Бишамон. Хотя их связи с Джидаями умрут вместе с ними, ее непреходящее наследие в Бишамоне поднимет ее до золотого стандарта того, к чему должен стремиться дампир."
 POD_persistentpodlore.desc.EA0015:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\n Для остальных Удзи, в целом, люди Эмиси были незамеченными, поскольку из-за их собственного пренебрежения к ним и отсутствия структуры двора, чтобы противостоять диким членам, сбежавшим из ада, по большей части они не оставили никакого наследия среди Удзи. Однако некоторые избранные были найдены в Аду и доставлены в мир живых Августовскими Дворами материка. Они надеялись, что, возможно, смогут использовать их в качестве инструмента против Удзи, коренных жителей Японии, которые могли бы стать лицом Августейших дворов против гегемонии Удзи. И им удалось превзойти самые смелые кошмары. \n\nТоши была единственной душой, которая выжила, когда ее родная деревня была покорена предшественниками самураев, что даже не стоило даже сноски. Предки, которые привели ее сюда, обнаружили, что она нервничает, постоянно плачет и чешет запястья и лодыжки, куда ее тащили лошади. Она была склонна к приступам насилия при упоминании Города Демонов, и ее наставники даже подозревали, что изначально она могла отправиться в [Glossary('Какури','podgloss.kakuri')] только для того, чтобы ее продал [Glossary('Эмма-О','podgloss.emmao')]. Ее обучение в Ночном Мире было долгим и трудным, но в конце концов она освоила Дьявольского Тигра [Glossary('дхармы','podgloss.dharma')]. Фактически, как только она это поняла, она, казалось, увлеклась этим с диким рвением, которое пристыдило даже ее наставников. И именно по этой причине ей никогда не следовало позволять возвращаться домой. \n\nПосле своего возвращения она начала преследовать заселенные земли, которые Эмиси когда-то называли домом, став кровожадным монстром, который теперь ассоциировал всех людей Ямато с [Glossary('Эмма-О','podgloss.emmao')], и, как Железный Коготь, они все должны умереть. Смертный, Волк, Похититель молний, ​​Цучигумо и Гаки — все должны были умереть. Лишь упрямые эмиши и айны избежали ее гнева. И когда Удзи начнут консолидироваться, ее неистовство как ночного монстра будет проверено. \n\nБудущая судьба: \n\nТоши могла охотиться лишь очень долго. В конце концов, агентам Кишу удалось одолеть ее, и она была парализована железным прутом в груди. Повелительница Конклава Звезд наблюдала, как ее личный мастер превратил Тоши и одного из ее самых ненавистных врагов в нового, верного зверя из глины и $pod_vitae$."
 POD_persistentpodlore.desc.EA0016:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\n. В жизни Нариаки был сыном японского торговца и бывшей степной кочевницы, поселившейся в Корее, и его жизнь определялась постоянными путешествиями между Кореей и Японией. Всегда близок со своим отцом, он усвоил многие уроки своей матери и полюбил их с рождения. Однако такие проливы всегда капризны, и регулярные штормы между полуостровом и островами поражали его корабли, а Нариаки тонул и уносился в Ад Кипящих Морей. Несмотря на это, он применил уроки парусного спорта, которым научил его отец, и навыки выживания своей матери, чтобы выжить. И со временем он смог проскользнуть через подводную пещеру и очнуться на берегу Цусимы. \n\nКогда Удзи нашел его, формировавшийся тогда Дом Гэндзи был одним из очень немногих домов, которые приняли его. Приняв его, Нариаки глубоко защищает свой Дом. Стойкий и спокойный воин, он преуспел в качестве главного ученика Небесного Клинка, его преданная и неумолимая откровенность вполне заслужена. Более того, его постоянное знакомство с монетами и торговлей сделало его искусным в содействии торговле, и поэтому он стал восходящей звездой и доказательством того, что олицетворяют Гэндзи, поскольку они могут работать идеально. \n\nБудущая судьба:\n\nНариаки всегда был осторожным сторонником готовности Удзи взаимодействовать с другими сверхъестественными существами. Что касается «Современных ночей», он находится в тесном контакте со многими из них, которых только может найти. Оккультисты, Звериные дворы, Маленькие Боги и многие другие — он сосредотачивается в более широкой сети, чтобы узнать как можно больше."
 POD_persistentpodlore.desc.EA0017:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\n. Для многих бригадиров легко оторваться от своих рабочих. Однако после смерти Сукехиса был вынужден признать тяжесть того, что он делал. В своей жизни Сукехиса был прорабом, руководившим строительством замков и фортов, причем жестоким. Бесчисленное количество военных рабов погибло в ходе его процессов, и многие из тех, кто подвергался жестокому обращению с его стороны, возмущались тем фактом, что он умер от старости. Тем не менее, он получил по заслугам в Злом городе. И только когда он окончательно сломился и четыре жизни провел в черной рабской работе, он нашел выход. \n\nС момента своего возвращения он посвятил себя противоположному. Вернувшийся Сукехиса больше не был бессердечным ублюдком-скрягой. Человек, который вернулся, сиял теплом, имел новую любовь к нежизни за пределами Злого Города и соответствующую щедрость. Желая идти в ногу со временем, он тяготел к Хиёруми, ухватившись за возможность открыть дома и безопасные места для тех, кто был вынужден покинуть свои дома в результате конфликта и войны. Связавшись с местными жителями, он создал сеть информаторов, которые распространились по всей Японии и были лояльны к своему благодетелю. И теперь, по мере дальнейшего завоевания монголов и приближения [Glossary('Анда','podgloss.anda')], недостатка в беженцах нет. Все, что ему нужно сделать, чтобы быть счастливым, — это преодолеть упрямую ограниченность Бишамон и дать понять, что влечет за собой ненавистный скряга. \n\nБудущая судьба:\n\nКак филантроп, Сукэхиса делал все, что мог, несмотря на изоляцию Японии. Когда период изоляционизма в Японии закончился, он был вне себя от радости и попытался распространить свою благотворительную деятельность далеко. Однако, как стойкий сторонник надежды и щедрости, он был отмечен смертью [Glossary('Микабоши','podgloss.mikaboshi')], и его [akuma|E] довел дело до конца, раз и навсегда положив конец его истории."
 POD_persistentpodlore.desc.EA0018:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\n. Первоначально Когоко, Когоко-но-Нукекуби — один из немногих драгоценных учеников одного из немногих настоящих [Glossary('бодхисаттвы','podgloss.bodhisattva')], которые есть у Удзи. И при этом она уже преуспела в том, что удалось немногим другим ученикам. Первоначально она была просто служанкой в ​​ресторане, умершей от дизентерии и приговоренной к аду без денег, но сбежала благодаря щедрости своего наставника, который в то время искал учеников. И среди многих из них у Когоко было то, что искал Нукекуби. Ее цивилизация была довольно поспешной, поскольку у Нукекуби была для нее цель. \n\nКак только Когоко-но-Нукекуби понял, кем она была и свою роль в Удзи, ее отправили в составе торговой миссии в Индонезию в поисках мастера, который разработал новый Синтай. Когоко-но-Нукекуби предстала перед Красным Драконом с дарами от своего наставника и многочисленными могущественными духовными договорами в обмен на Плоть Синтай. Пияу согласился только под запретом обучать этому только женщин, и сама Когоко-но-Нукекуби согласилась. И она немедленно помчалась домой и поделилась искусством с Нукекуби. И хотя Когоко-но-Нукекуби была той, кто принёс Флеш-синтай в Японию, именно её наставник определил его. И теперь, когда Нукекуби планирует свое дальнейшее развитие в Доме, Когоко-но-Нукекуби терпеливо ждет в сторонке, зная, что в свое время ее наставник вознаградит ее. \n\nБудущая судьба: \n\nВ конце концов, Нукекуби уйдет из политики, изменив свою роль на роль дальнего проводника. Вторым лидером Палаты будет Когоко-но-Нукекуби, который с гордостью вступит в эту роль. Однако Когоко-но-Нукекуби возненавидела политику и позже передала роль лидера своему будущему ученику Данрин-но-Нукекуби, а затем вообще ушла из политики. В современные ночи ее редко можно увидеть, она растворилась в безвестности."
 POD_persistentpodlore.desc.EA0019:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nХотя многие из Родов Идзанами скрыты, из-за природы их [Glossary('дхармы','podgloss.dharma')], проходящего линию в опасной близости от Оскверненных Королей Демонов, кодификатор их пути всегда был исключением. Древний, ужасный, великолепный и жестокий, Юки — образец пути, которого в равной степени боятся и уважают. Очень немногие из ее современников Удзи знают, когда она была молодой. Некоторые говорят, что она даже цивилизована. На самом деле все сложнее. \n\nYūki — один из старейших гаки Японии. Жители Японии, родившиеся в первые дни периода Яёй, когда сердце Юки еще билось, только начинали строить характерные курганы в форме замочной скважины. Но для Юки это не имело большого значения. Она была всего лишь невестой одного из первых японских магов. Они были счастливы вместе, но со временем она имела несчастье умереть от особенно жестокой зимы, и муж изо всех сил старался спасти ее от смерти. Он разыскал ее, и, к его ужасу, она нашла ее в аду злой магии. Он пытался обменять ее, но когда ритуал приближался к завершению, из-за недосмотра он провалился, и Юки был проклят. В этой неудаче Юки наблюдала, как ее муж бросил ее и бросил в ад. И в этот момент она поняла. Он еще раз увидел свою умершую жену, которую ее притащили обратно в ад, покрытую шрамами, нанесенными им самим, и кровью их деревни, и получил откровения, которые определят Детей Идзанами. \n\nYūki считает себя образцом Детей. Достаточно развращенная, чтобы заставить даже закоренелых Дьявольских Тигров съежиться перед ней, когда Удзи ищут ее, они часто находят ее в пещере неописуемых мучений, где смертные, нежить и дьявол одинаково воют вместе, пока она ищет других, которые пали, как она. Ее тело было полотном агонии, немногие рискнули бы ее мудростью. К счастью для Удзи, она, по крайней мере, вероятно, на их стороне. \n\nБудущая судьба:\n\nЮки в значительной степени игнорирует бессмысленную политику своих современников и вместо этого строит свой культ. Как Пророк Идзанами, ей нет равных в мудрости среди Культа, и она это знает. И, работая Колесом в «Ночных Ночах», она мечтает о мире не Императора Демонов, а Королевы Трупов... \n\nИзанами так близко. Спиралевидно и вращаясь, подобно колоссальному дракону."
 POD_persistentpodlore.desc.EA0020:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\n. У подножия горы Дайсен находится скрытый храм, частично изолированный внутри Умбры. Приветствуются новые студенты из всех кланов, а его выпускников уважают во всех великих кланах... но стоимость обучения там высока. По своей сути хозяйка храма – суровая хозяйка. И ее Бог не хотел, чтобы было иначе. Яэко когда-то была жрицей, чья жизнь всегда возвращалась в огонь. Рожденная в тени горы, она всегда называла Дайсен своим домом. Как дева тамошних святилищ, она посвятила себя поддержке монахов-аскетов в святилище Бога Огня Кагуцути-но-микото. И она была настолько предана своему богу, что, когда из-за неудачного обряда ее святилище сгорело, она молилась, а не бежала, доверяя ему защитить ее. Она даже подумала, что это было испытание, когда оказалась в Аду Пылающих Морей, привязанная к вечно пылающим древесинам на море, облитая смолой, чтобы гореть вечно. И все же она держалась, молясь своему богу. Ее молитвы были настолько интенсивными, что Хаха Но Фуками больше не мог этого терпеть и отбросил ее обратно в мир живых. \n\nВернув сознание, она вернулась к своему уходу за святынями. Однако ее новый инстинктивный страх перед огнем огорчал ее, поэтому она еще раз проверила свою веру, прикрепив себя к железному столбу в храме и поджег яму. И в агонии обряда она была отмечена навечно, поскольку видела видения духа, называвшего себя вассальной душой Кагуцучи, мальчика, созданного из чистого огня с ярко-красными глазами и волосами, превращающегося в ужасного дракона с обжигающими рубинами вместо чешуи. И тогда она поняла. Когда пламя утихло, она осталась целой, сгоревшей, но ее цель ясна. Яэко построит храм вокруг ямы и создаст еще один для обучения учеников. \n\nБудущая судьба: \n\n Безумная вера Яэко и мастерство Пламенного Синтая сделали ее очаровательным наставником, но также и мастером внушающего страх Обряда Дайсен Бога Огня. Она остается в Дайсене и по сей день, одна из трех монахинь, которые наблюдают за обрядом и наблюдают за этим суровым испытанием тренировок."
 POD_persistentpodlore.desc.EA0022:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nA Военный военный, Нагамацу был одним из самых первых представителей класса Буси, участвовавших в войнах периода Хэйан, предшественников самураев. Будучи мелким дворянином, он заслужил большое признание в боях и на службе и добился больших личных успехов в цивилизации варваров на севере. Но жить от меча — значит умереть от меча, и он погиб в засаде. Жизнью, наполненной насилием, он, к своему большому разочарованию, заслужил свои мучения в Городе Демонов. Но Нагамацу был столь же упрям, сколь и предприимчив, и с железной решимостью и готовностью ждать и терпеть он разрушил стену Ада и сбежал, вернувшись обратно в мир живых. Внутри Удзи Нагамацу тяготел к Тайра Удзи, поскольку он находил новый мир дезориентирующим и сбивающим с толку. Ему нравилось, как все было, и он презирал точку опоры. Он стал образцом клана и с радостью и усердием посвятил себя служению и преданному обслуживанию своих новых лордов. Его старые связи стали доступом к самураям, позволив Удзи оставаться актуальными. И поэтому он не поступил на службу. \n\nБудущая судьба: \n\nНагамацу определит себя на службе и на войне. Его боялись и ненавидели за его жестокое отношение к войне и использование своих агентов для убийства соперников в тот же день. И, по иронии забавных обстоятельств, когда американцы обстреляли порт, в котором был изолирован его Убежище, его дремлющее тело было брошено в небо, и он превратился в пепел еще до того, как его труп упал в море."
 POD_persistentpodlore.desc.EA0023:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\n. Среди более консервативных Удзи в Ночном мире Японии многие члены Великого клана считают кораблестроителей и ремесленников, желающих узнать больше, опасными. Но тратить все эти знания впустую? Иэко этого терпеть не может. Она родилась недалеко от Энумы, в семье корабелов и моряков. Близость к Хоси Рёкану всегда означала бизнес, и благодаря этому ее семья чрезвычайно процветала. Но берега – штука непостоянная. Однажды во время испытаний корабля Иеко упала за борт, и волна унесла ее в море и тут же забрала ее. И такая гибель принесла ей место в Аду Пылающих Морей. \n\nОднако, среди коряг и обломков Иэко нашла способ спастись. Построив новый корабль, она смогла свободно плыть и со своего адского корабля очнулась в живом мире. Она вернулась домой и была найдена Удзи. Но все же она была бесцельной, так как мало кто хотел ее навыков. Итак, она тяготела к тем, кто это сделал, к Этидзэн. И с тех пор, как она попала в орбиту Касуми, она стала счастливой впервые за все время ее жизни. \n\nБудущая судьба: \n\nНавыки кораблестроения Эко были основой успеха Этидзэн, а ее близость к Касуми позволила ей выучить достаточно лидерских навыков, чтобы возглавить клан после смерти Касуми. В «Ночах современности» она по-прежнему возглавляет их и проявляет большой интерес к современному судостроению и к тому, как она может применять эти новые методы строительства."
 POD_persistentpodlore.desc.EA0024:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nТем, кем была Кореко до своей смерти, не имеет большого значения. Ее имя было даже не ее нынешним, а новым, данным ей [Glossary('Эмма-О','podgloss.emmao')], который ненавидел ее прежнее имя. Когда-то она, возможно, ненавидела бы такую ​​деградацию. Теперь она считает, что для нее это так же важно, как для смертного дышать. С начала своей службы в качестве [Glossary('шикоме','podgloss.shikome')] Кореко стала главным надзирателем тюрем в [Glossary('Какури','podgloss.kakuri')]. Именно ей поручено сковывать людей, которых они находят, и лишать их передышки, а также вытирать им в лицо их мучения. Она наслаждается этим и любит доставлять себе удовольствие их мучениями. И все же, как только к ней подходит один из ее начальников [Glossary('шикоме','podgloss.shikome')], она сразу же становится почтительной и покорной. \n\nОна полезная, жестокая и мелкая подхалимша, и [Glossary('Эмма-О','podgloss.emmao')] находит большое удовлетворение в существе, в которое он превратил Кореко. Естественно, ее способности и умение ломать людей сделали ее данностью для оперативной группы, посланной сломить силы Злого города. В частности, ее очень интересует искусство формирования плоти, которым, по слухам, обладают эти инферналисты. Что она могла бы с этим сделать, при этой мысли у нее течет слюна. Ей так хочется их всех сломать."
 POD_persistentpodlore.desc.EA0025:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nОдин из неотличимых [Glossary('шикоме','podgloss.shikome')], Ханеко на самом деле довольно уникален среди них. Потому что, в отличие от всех остальных [Glossary('шикоме','podgloss.shikome')], Ханеко — единственная, чья нежизнь действительно напоминает их смертную. Ее воспоминания об этом, конечно, фрагментированы и разбиты, но Ханеко всегда была убийцей, которая использовала ее тело как медовую ловушку. И с какой целью? Потому что она могла. Ей нравилось убивать. Она убила десятки людей, пока, убивая охранника, не убила кого-то, кого слишком сильно будут скучать, и встретила свой конец на казни. За свою жизнь без любви она была отправлена ​​в [Glossary('Какури','podgloss.kakuri')], и исходящая от нее непреодолимая злоба привлекла внимание [Glossary('шикоме','podgloss.shikome')]. \n\n[Glossary('Эмма-О','podgloss.emmao')] изначально хотел отказаться от нее, но любопытства было достаточно, чтобы он задался вопросом, можно ли создать [Glossary('шикоме','podgloss.shikome')] из души, которая уже напоминала ее, а не из невинной. Конечным результатом стал... своего рода успех. Она действительно выглядела соответствующе и была одинаково мертва внутри, но она была неустойчивой, расстроенной и склонной к приступам внезапных криков и ощущений. Она была невероятно эффективным охотником, но в то же время временами охотилась на несуществующие цели и пропускала очевидные цели. Она полностью и совершенно безумна, но все же достаточно эффективна, чтобы [Glossary('Эмма-О','podgloss.emmao')] оставил ее, по крайней мере, на урок. Фактически, возможно, именно по этой причине ее включили в оперативную группу, призванную уничтожить [Glossary('Микабоши','podgloss.mikaboshi')]. Ее собственное безумие является анафемой монотонности, которую воплощает [Glossary('Микабоши','podgloss.mikaboshi')], и ее собственных полетов и спазмов может быть достаточно, чтобы полностью и окончательно разрушить ее."
 POD_persistentpodlore.desc.EA0026:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nИзвестный своими шедеврами и мастерами, Дом Этизен не часто известен своими воинами. Однако есть исключение. Некоторое оружие, изготовленное ими, никогда не использовалось никем, кроме его создателя. И это оружие вызывает больше всего страха. И по этой причине Акира — самый опасный из Этизенов. \n\nОн никогда не был особенно общительным человеком. Даже в детстве он всегда вел себя сурово и избегал внимания общественности. Сын кузнеца, он, к счастью, находил огромное удовольствие в творчестве. В какой-то степени он любил это больше, чем людей. Действительно, единственное, что могло соперничать с его любовью к работе с металлом, — это любовь причинять людям боль. Ему всегда нравилось, когда прохожие пытались воровать, и он всегда под предлогом вышибал человеку мозги молотком. Что и стало его судьбой, когда он убил сына дворянина в городе, встретил за это свой конец и оказался в Городе Демонов. И там он был невероятно полезен как изготовитель оружия. И множество противников, на которых можно попрактиковаться. Он стал по-настоящему устрашающим в обращении с клинком, на который могли надеяться немногие другие Голодные Мертвецы с таким большим опытом, как он. И, сбежав, он начал искать тех, кто не беспокоил его, когда он что-то создавал. Естественно, он попал в орбиту Касуми и присоединился к Этизену. \n\nБудущая судьба: \n\nАкира не проявляет интереса к власти, ему очень помогло. Хотя он мало что сделал, чтобы остановить смерть Касуми, он был очень раздражен тем, что его работа теперь задерживается из-за конфликта, и поклялся уничтожить Цучигумо за то, что они помешали ему. Его неустанные поиски в конечном итоге привели к тому, что он стал для них постоянной занозой на глазу."
 POD_persistentpodlore.desc.EA0027:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nMost Uji, когда его спрашивают о том, что следует делать с Цучигумо, часто немного колеблются в ответе о том, что их искоренение будет дорогостоящим и плохо выполненным, и что есть более серьезные проблемы. Однако, когда она спрашивает одну из них, ее глаза горят яростным рвением, поскольку она подтверждает угрозы и скрытых монстров, преследующих Сацуму, Хоккайдо и Сикоку. Ненависть, которая может исходить только из глубины ее сердца. В конце концов, она была убита Цучигумо. А ее сестра была потеряна для них и проклята ими навеки. Когда она еще дышала, она была довольна тихой жизнью в северных частях материковой части Японии, но однажды ночью пришли бледные демоны с ужасами и исчезли вместе с некоторыми ночью. Они привели их в презренную крепость, где Микото разорвали на части и сделали из амальгамы существо, пока оно не погибло в каком-то бою. Но зверь выдержал, а ее труп увеличился в массе. \n\nОна отправилась в Злой город, осужденная грязной кровью отродья. Но будучи буквально частью биологической машины, ложная не могла ее удержать. Зверь, все еще волоча ноги, однажды вырвался наружу, когда ее тело восстановилось, и она убежала на юг, чтобы ее нашли Удзи. Микото, как таковая, является ведущим экспертом по другим коренным кровопийцам Японии среди Удзи. И она непреклонна, их всех необходимо уничтожить. Будь то затаившиеся подхалимы, инферналисты денег или охваченные бурей бандиты, все они представляют собой угрозу, и их кровь несет в себе проклятие настолько извращенное, что даже их собственное проклятие, как учил Сюэ, ничто по сравнению с ним. И она не перестанет бить в этот барабан, пока беда не будет искоренена. \n\nБудущая судьба:\n\nМикото будет среди Удзи главным препятствием для коренных Сородичей Японии, пока однажды ночью, когда она приводила доводы в пользу уничтожения наиболее дружелюбных из них, один особенный разговорчивый человек не потребовал переговоров. Она так и не избежала царства кошмаров, в которое он ее загнал."
 POD_persistentpodlore.desc.EA0028:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nTreachery — это трудный грех, который нужно искупить. Каруки знает это и не пытается скрыть свои прошлые проступки, а скорее постоянно и упорно трудится, чтобы исправить их. В своей смертной жизни Каруки была одной из Го Камисори Гама, ремесла магов-убийц. Однако она глубоко завидовала своему учителю и, вступив в сговор с двумя своими однокурсниками, придумала поистине жестокий и садистский способ убить его и приговорить к Тысяче Преисподних. Но вмешательство Странника Дзидзо привело к возвращению ее хозяина, и она была быстро наказана и заслужила справедливость. Но из трех предателей Каруки была единственной, кто действительно усвоил урок в Аду. Попадая в ад разрезания на куски, все, что она сделала со своим наставником, вернулось ей сторицей. И только когда на самом глубоком уровне она поняла, что сделала, и по-настоящему желала искупить свою вину, она проснулась в неглубокой могиле, в которой ее оставила ее жертва и убийца. И именно он нашел ее. \n\nКаруки унижалась перед ним, умоляя о прощении, даже позволяя ему убить ее снова, если он чувствовал, что она этого заслужила. Но вместо этого Куро-сама решил проверить ее и обучил ее самым жестоким методам. И когда пришло ее последнее испытание, и он сказал, что она должна умереть, она приняла это. А затем он сказал ей, чтобы она заработала свое искупление. \n\nС тех пор она служила главным убийцей Удзи в Четвертой эпохе и пришла, чтобы основать клан Удзи Ига. Однако она требовательна к своим целям и всегда уверена, что они этого заслуживают. Затем она наносит им быструю и безболезненную смерть. В личном поведении она сурова и замкнута, требовательна и профессиональна, по-прежнему считая себя зверем, стремящимся стать лучше. Но она, наконец, позволяет себе раскрыться. Ходят слухи о тайных свиданиях с Тайрой Кайто. Каруки потратила так много времени, чтобы искупить вину, что, возможно, она, наконец, пытается снова научиться жить. \n\nБудущая судьба: \n\nКлан Ига Каруки никогда не будет таким большим, как другие Удзи, и Юкио превзойдет ее по целям. Однако, когда дело дошло до уничтожения внутренних целей, Каруки оставался предком, которого было легко вызвать. Она по-прежнему занимает свой пост до новейших ночей. И, если верить слухам, свидания с Кайто вылились в многочисленные дампиры, которые помогают Иге."
 POD_persistentpodlore.desc.EA0029:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nНи одна организация не может быть по-настоящему однородной. Даже для самых замкнутых и вызывающе консервативных удзи Японии есть свои исключения. И оно исходит из самого странного места. Рожденный от настоящих линий Тайра, Кайто остается ошеломляющим контрастом с остальными Удзи, к которым его принуждали присоединиться.\n\nКайто родился у Тайра, особенно по линии, произошедшей от Кохехиры, но Кайто был достаточно далек от этой линии, чтобы не считаться достаточно важным для исторических текстов. Один из многих жертв в Войнах Генпея, Город Демонов призывал его к жизни, полной конфликтов. Но его свободолюбивая душа не могла быть ограничена, поэтому он быстро сбежал и был найден кланом Удзи, который взял его фамилию, и быстро прижал его к себе. Однако Кайто возмутился новым набором цепей. Он искренне не верил в ценности, которые они исповедовали. В какой-то степени они хотели использовать его только из-за его размера, профессиональных навыков обращения с клинком и всего лишь из-за того, что он был мясной палкой, которой можно было избивать своих врагов. Но он хотел жить свободным от традиций. Нежизнь была шансом испытать то, чего он никогда не мог в жизни, увидеть пьесы, в которых ему было отказано, полюбить свободно, без осуждения, увидеть места, которые он никогда не мог увидеть, и стать больше, чем просто убийцей.\n\nВ то время как его хозяева заставляли его стать предком, он был бы своим собственным предком. Хотя его умение обращаться с мечом наряду с его телосложением внушало трепет, он обожал искусство и вообще относился к жизни с новым рвением. Будь то частные встречи с убийцей Каруки, путешествие по Японии, приобщение к искусству и исследование городов, которые ему никогда не приходилось видеть в жизни, он ко всему относится с неоспоримой энергией и гордостью.\n\nБудущая судьба:\n\nПосле года черных коршунов Кайто разочаровал Тайру, не стремясь к многому и вместо этого растворившись в безвестности. Единственными подсказками о том, куда он пошел, были невероятно хорошо сложенные и красивые дампиры благородного происхождения, окружавшие Каруки, и рассказы о странствующем самурае в Умбре, ищущем все, что можно было увидеть."
 POD_persistentpodlore.desc.EA0030:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nНа протяжении большей части истории двора Лазурного Дракона Предок Цусимы, несмотря на сравнительно небольшой размер двора, всегда имел решающее значение. Традиционно тот, кто владел Цусимой, держал решающий перекресток пути между двумя половинами двора. Какое-то время эта позиция всегда была нейтральной. Однако в эти трудные времена, когда витают ужасающие предзнаменования того, что грядет, нынешний хранитель принял чью-то сторону. Мики — одна из самых уважаемых из Удзи, даже если она не выглядит соответствующе. Одна из первых учениц Миуры Ясутами, она была компромиссом между ним, Масао Ивасэ и предками Августейшего двора, выбранными из-за ее нейтралитета в политике того времени. Поскольку она была оторвана от смертных связей из-за того, что ее память была разорвана Адом Перевернутых Грешников, и в значительной степени замужем за своей работой воина-надзирателя, для нее это был легкий вызов. Однако, когда приближаются марши монголов, Мики видит, что ветер дует на восток. Более того, [Glossary('Анда','podgloss.anda')], кружащий вокруг двери недалеко от Кореи и Китая, вызвал огромную тревогу. Когда она обошла двор Черной Черепахи, чтобы проверить угрозу, она пришла в ужас. \n\nОна вернулась на свой пост и обдумывала свои следующие действия. И после года раздумий она вернулась в Ивасе и Ясутами и сообщила о своем намерении закрыть обычные Линии Дракона, ведущие в Японию, в интересах предотвращения угрозы и удержания как можно крепче, не принимая при этом путешественников. Она просто ждет сигнала. \n\nБудущая судьба:\n\nМики был важным участником заговора, который назывался Годом Черных Коршунов. Она издала приказ об изгнании в Цусиму всех $pod_kueijin$, верных двору Лазурного Дракона, и казнила тех, кто не смог уйти. И с этим разрывом она начала дрейф, который отделил Кланы Солнца от остального сверхъестественного мира."
 POD_persistentpodlore.desc.EA0031:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\n. Хотя большинство $pod_kueijin$ уделяют мало внимания местным Маленьким богам (известным как «Фейри» или «Подменыши» на западе), бывают случаи, когда между Предками и этими меньшими божествами необходима связь. Хотя удзи в целом возмущаются иметь с ними дело, у них есть специальный человек для таких дел. И Рина задается вопросом, не является ли она объектом какой-то шутки. \n\nРина верно служит Удзи вот уже несколько столетий, является компетентным миротворцем Гэндзи и часто посланником во дворе Лазурного Дракона. Но по мере того, как Кланы Солнца и фракции материкового двора расходятся, Рина находит в самой Японии довольно разные должности, часто занимаясь непостоянными, эксцентричными и сбивающими с толку Маленькими Богами. И, к несчастью для нее, она всегда была дипломатом, и альтернативой является дипломат Цучигумо (что почти наверняка закончится ее смертью) или Хаккен (которые, вероятно, убьют ее на месте), она спокойно принимает позицию головной боли, потому что это позволяет ей сохранять голову."
 POD_persistentpodlore.desc.EA0032:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\n. Учитывая его особое внимание к японцам, [Glossary('Эмма-О','podgloss.emmao')] вызывает особую степень страха среди Удзи, и поэтому Разбитые Зеркала, откуда пришли его войска, всегда вызывали особое беспокойство. А теперь, когда в действии целый батальон [Glossary('шикоме','podgloss.shikome')], Уджи будут чертовски уверены, что их не застанут врасплох. Несмотря на то, что большинство отказалось бы от такого поста, Кадзуко вызвалась на это. Казуко, сбежавшая из [Glossary('Какури','podgloss.kakuri')], старается жить полной жизнью и чувствует, что чего-то всегда... не хватает. Она всегда была немного отстранена от своих сверстниц, поскольку [Glossary('шикоме','podgloss.shikome')] часто приводили в ярость других женщин Удзи, а мужчины часто поддавались их уловкам, Кадзуко никогда не понимала, почему она никогда не реагировала на них жестоко. И хотя возможность падения на [Glossary('Эмма-О','podgloss.emmao')] ее действительно ужасает, на [Glossary('шикоме','podgloss.shikome')]... у нее более смешанные чувства по этому поводу. \n\nПо крайней мере, у нее есть чрезвычайно подробные отчеты для своего начальства, и ее навыки отслеживания превосходны. Итак, наблюдаем за борьбой [Glossary('шикоме','podgloss.shikome')] с культистами Злого города. Очень интенсивно.\n\nБудущая судьба:\n\n «Преданность» Казуко своей роли была сильной. Но такая близость к [akuma|E] без их убийства всегда опасна, а сверхъестественная красота [Glossary('шикоме','podgloss.shikome')] сделала ее легкой рабыней для них, когда они ее схватили. Что с ней стало, неизвестно, но некоторые из преемников на ее посту подозревают, что Присутствие новой [Glossary('шикоме','podgloss.shikome')], которая заискивала перед другими Женщинами-Дьяволами, может пролить свет на то, что с ней случилось."
 POD_persistentpodlore.desc.EA0033:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\n. Даже в детстве Харука всегда была маленькой девочкой, которая сует вещи, в которые ей не следует, и той, которая всегда имела тень над ней. Не имея энергии и энергии, однажды она поймала осу и муху в банку и наблюдала, как оса вцепилась в спину мухи и съела ее, пока единственное крыло не опустилось на дно. В тот день Харуке пришло откровение: она — муха, а жизнь — оса. Просто постоянная мучительная боль, которая продолжала съедать ее заживо. Ее мышление никогда не менялось, и в конце концов она проиграла битву с жестокостью жизни и нашла тихое место, чтобы позволить осе победить. \n\nНо при этом то, что, как она надеялась, в конечном итоге будет сном, вместо этого превратилось в ад быть съеденным заживо, ее метафора была буквальной. Харука, однако, ненавидела всю эту жестокую шутку и, наконец, осознав, что была неправа, съела осу на своей спине и сделала Второе Дыхание. А среди Удзи Харука является некоторой странностью, поскольку их увлечение смертью просто изменилось. Пожизненная борьба с депрессией сделала ее невероятно сочувствующей призракам, и они могут узнать ее борьбу в своей собственной войне с их тенями. Однако, к разочарованию более широких кланов, у нее мало терпения к политике, поэтому потенциальная возможность массового набора Призраков не используется Удзи. По крайней мере, она чертовски хороший экзорцист, который выполнит свою работу и сделает ее хорошо. \n\nБудущая судьба: \n\nТерпеливая прогулка Харуки по Костяным цветам со временем вознаградит ее. Однажды ночью, помогая Призраку, который умер, как и она, обрести покой, они пошли дальше вместе. Их в Трансцендентность, а Харуку в [Glossary('Сотня облаков','podgloss.hundredclouds')]."
 POD_persistentpodlore.desc.EA0034:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nКлючи к влиянию и власти смертных — штука непостоянная, особенно среди тщеславия и излишеств высшего класса. Оставаться в курсе сплетен, идти в ногу с модой, поддерживать сети и перезагружаться каждые несколько десятилетий может быть довольно утомительно. Но Хидака наверстывает упущенное время. \n\nРожденная в семье постоянно враждующих родителей, Хидака была дочерью мелкой знати и была не более чем инструментом для своих родителей. Но она старалась быть хорошей дочерью. Она улыбнулась, когда вышла замуж за простого человека, которого никогда раньше не встречала. Она проглотила свою гордость из-за пренебрежения. Она выдержала удар кинжалом в сердце своей любовницы. Она ничего не сказала об инфекциях, передающихся половым путем, которые сопровождали этот роман. \n\nХидака не может точно сказать, что довело ее до крайности. Либо правительство конфисковало побег, либо выкидыш, вызванный избиениями в нетрезвом виде. В любом случае, Хидака положил конец всему ножом. После того, как она его прикончила, конечно. Ее последними мыслями перед тем, как нож отправил ее в ад вечной кастрации, был глубокий смех со слезами, катящимися по ее щекам, от бессмысленности всего этого. Но в аду Хидака получил еще один шанс. Она была знатной. Она получит гламурную жизнь, в которой ей всегда отказывали. Стаи демонов брали жертвы и какое-то время бродили. Она дала себя схватить и сбежала. И по возвращении в мир смертных она собиралась жить. Она получала особое удовольствие, находя таких, как ее смертный муж, и выворачивая их наизнанку, двигаясь и купаясь в свете привилегий, богатства и высшего общества. На этот раз она будет хозяйкой, она будет греться в похвалах, она будет сияющим драгоценным камнем в ночи. И, черт возьми, она любит нежить. \n\nБудущая судьба: \n\nХидака всегда продолжала двигаться, всегда наслаждаясь благами богатства. Перемещаясь от мужчины к мужчине и уничтожая их за неверность, ее игра продолжается в современности, следуя за ней следом из трупов и сплетен."
 POD_persistentpodlore.desc.EA0035:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nПока они не достигнут более высоких стадий своего просветления, более молодые из мертвых, как правило, оставляют за собой след из трупов. Будь то слишком жесткое кормление, случайное слишком сильное дыхание или приступ гнева, из-за которого перепись в деревне снизилась до 0. Скрыть это от глаз, которые не должны их видеть, - непростое дело. Но опять же, Ёриэ всегда наводил порядок в чужих делах. Ёриэ родился в семье служанок и с юных лет знал, что это его цель. Выросший в дворянском доме не как дворянин, а как уборщик, Ёриэ провел семь десятилетий своей жизни в одном и том же замке, всегда убирая, готовя, ухаживая за животными и служа хозяевам. Он никогда не был женат, так как женщины его не интересовали. У него никогда не было любовницы, поскольку плоть его никогда не интересовала. Убирал, выслушивал, давал советы. Была сила в том, чтобы быть парнем, который застилал постель и готовил чай. \n\nКогда он был вознагражден мирской жизнью в аду, он отказался принять беспорядок, который оставил после себя, и [Glossary('Эмма-О','podgloss.emmao')] был сбит с толку тем, как кроткий дворецкий сбежал. Теперь Ёриэ непосредственно служит Кланам Солнца. Больше не привязанный к одному поместью, он наемник-терапевт, дворник, уборщик и «уборщик». Независимо от беспорядка, Ёриэ его уберет. Необычный журавль, но, тем не менее, высокопоставленный. Отсутствие у него политических амбиций, манера поведения «не задавать вопросов» и отсутствие желания спать с супругой делают его человеком, которому доверяют все в Удзи. Для Ёриэ? Он просто рад, что занят."
 POD_persistentpodlore.desc.EA0036:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nВ детстве Морой всегда мечтал о сцене. С того момента, как Морой впервые увидел кукольный спектакль, ему всегда хотелось играть. Он любил театр и больше всего на свете стремился получить шанс оказаться на этой сцене. И с этой целью он потратил все деньги, которые у него были, начиная с пребывания в купеческой семье, на учебу, боевые искусства, ораторское мастерство и выступления. Он был вне себя от радости, когда получил свой первый шанс пройти прослушивание. И все это исчезло в одно мгновение, так как по дороге на него напали бандиты. Раненный в глаз стрелой, оставленный истекать кровью и раздетый донага со всеми своими вещами, на этом закончилась живая история Мороя. \n\nA началась новая глава, поскольку из-за того, что лучший день в его жизни стал худшим днем ​​в его жизни, он был приговорен к аду перевернутых грешников. Но даже тогда, когда его страдания достигли апогея, он очнулся снова в мире живых. И Морой был свободен и найден Шепчущимся. Он все еще пытается сориентироваться, но нашел себе место. Однако, когда местные актерские сцены Японии начинают расцветать, он рвет себя, как дерево без корней, и, наконец, воплощает в жизнь свою мечту. Он заводит друзей по всему театральному миру, и более того, его любовь к действию сделала его весьма способным воином. Будь то выступление или избиение, Морои является важной частью связующего звена, которое расширяет возможности Удзи."
 POD_persistentpodlore.desc.EA0037:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nМидорикава, в системе, где многие из $pod_kueijin$ были средней злобы. Он заслужил Ад. И самое странное, что именно он получил второй шанс. Мидорикава был магом поистине ужасной ярости и разврата. Он так стремился съесть слабых, что проклял не только свое тело и разум, но и свою вечно перевоплощающуюся душу. Он купался в крови, чтобы сохранить молодость, он заманивал детей к людям, которые готовы были сделать из них мясо всеми худшими способами, он улыбался, когда подвергал отчаявшихся супругов жестоким партнерам. Если бы он мог заставить кого-то страдать, он был бы доволен. Но его время истекло, когда Акашаяна наконец нашла его и положила ему конец зачарованным клинком, который уничтожил его высшее «Я» и осудил его. \n\nНо все же он не умер полностью. Его аватар разбился, он пришел в себя в [Glossary('Какури','podgloss.kakuri')]. Место, где он был раньше. И, зная это, он думал, что он в безопасности. Но его разум покинул его вместе с бегством, и Дьявольские Тигры Удзи нашли его и заставили повиноваться. И он был... глубоко дезориентирован своим состоянием. На него больше не было влияния проклятия со стороны его аватара, и его разум прояснился. Он был настолько сосредоточен на боли и причинении вреда людям, что никогда не жил по-настоящему. Его пометили как дьявола, и теперь он действительно им стал. Путь Мидорикавы был извилистым и запутанным. Он упорно боролся за искупление, но, по крайней мере, стремится жить свободно. Не просто жестоко обращаться с другими, а по-настоящему делиться удовольствиями, делать людей счастливыми и наслаждаться существованием. Без своего проклятого аватара он мог бы этим наслаждаться. Он новичок в этом деле, но он собирается попытаться пойти по этому пути."
 POD_persistentpodlore.desc.EA0038:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\n. Хотя правление Сяо в значительной степени определялось как шедевральный трактат о безумстве кумовства и опасностях децентрализации во дворе Лазурного Дракона, сказать, что это было его единственное наследие, было бы медвежьей услугой. И для человека, который так боится чрезмерного баловства и накопления богатства, его исключительный ученик представляет собой разительный контраст. \n\nДжи-со родился во времена великого хаоса. Джи Со родился в Кёнджу, когда королевство Силла еще только начинало свое объединение, и был одним из многих среди его отбросов, беднейшим из бедных. Вся ее жизнь была связана с попрошайничеством, и она не знала дня, когда бы голод не глозал ее живот. И в конце концов, из-за недоедания, одиночества и одиночества, она поддалась жестокости мира и попала в ад отсутствия денег. Но, несмотря на эту несправедливость, это наконец дало Джи Со то, чего ей всегда не хватало. Сила своего рода. Она вырывала кости своих врагов и использовала их как своего рода валюту, поскольку в Аду больше ничего не существовало. Многие из его обитателей жаждали любых денег, и она откупилась. И когда ее нашли во дворе Лазурного Дракона, ей сначала в шутку предложили стать наставником Сяо. Он согласился, надеясь «просветить» ее. Но Джи-со мало обращала внимания на своего наставника и сразу же тяготела к орбите торгового картеля «Багровый Тигр». Она поклялась, что никогда больше ни в чем не будет нуждаться. Будь то кровь, нефрит, кость или сила, ей больше никогда не будет недостатка. И пока Сяо вызывала гнев двора, Цзи-со начала брать своих учеников и строить свою собственную сеть власти, распределяя контакты по тому, что она знала как Силла. И поскольку Удзи дрейфует все дальше и дальше, время ее величайшего приобретения еще может наступить. \n\nБудущая судьба: \n\n Хотя она всегда считала падение Сяо неизбежным, Год Черных Коршунов застал ее врасплох. Разграбление [Glossary('Анда','podgloss.anda')] в этом регионе нанесло огромный ущерб, и она многое потеряла. Но она вспомнила о своих агентах и ​​предрекла им время в реорганизованных Зеленых судах. После разделения Кореи после Второй мировой войны она побудила своих учеников к действию и сформировала «Новый зеленый двор» в Южной Корее. Она и по сей день возглавляет свое «Общество настоящих костей»."
 POD_persistentpodlore.desc.EA0039:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\n. Возможно, один из самых символичных представителей фракции True Bone в корейском ночном мире, Джи Ын слышит своих недоброжелателей и в основном игнорирует их. У него нет времени тратить время на сплетни. Не тогда, когда у него есть деньги, которые можно заработать. \n\nДжи-Ын своими глазами увидел, на какие злые дела могут заставить людей деньги. В конце концов, в своей смертной жизни он был наемным убийцей. И при этом хороший и надежный. Чиновники, Бродяги, Солдаты, Дети, кто угодно, Джи-Ын брал бы плату. И когда работа его убила, его устроила такая судьба. Живи мечом, умри мечом. И его реакция на пребывание в Городе Демонов тоже была довольно сдержанной. Он воочию видел, куда идут убийцы. Окружение людей, которые любили убивать, любили причинять боль, все это сильно беспокоило его. Он был профессионалом, а не психопатом. И его преданность делу позволила бы ему выбраться из Ада и обрести Второе Дыхание. На допросе он привлек внимание Джи-со, который взял его к себе. И Джи-ун испытал глубокое облегчение. Она была профессионалом, и он мог этому посочувствовать. Он расширил свой набор навыков и приступил к работе по управлению финансами растущего общества. И кроме того, если кто-то не выплатит кредит, а убийца вызывает беспокойство, то дьявол, пришедший забрать долг, гораздо хуже."
 POD_persistentpodlore.desc.EA0040:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nКогда кто-то думает о некромантах, обычно на ум приходит пожилая фигура в черной мантии, окруженная кружащимися призраками. Ёнджин не возражает против такой репутации, поскольку она идет ему на пользу. Способность дезориентировать мертвецов, когда они вместо этого находят их в комнате, поскольку он держит драгоценное напоминание об их прошлом с помощью простой атмосферы, творит чудеса с финансированием Обществ. \n\nКогда-то Ён Джин был хулиганом, которого встречали с ножом в живот, всегда знал, как вымогать у других, а теперь и то, чего не следует делать. Но он всегда стремился найти новые способы получения монет. С тех пор, как он стал учеником Джи-со, искусство призраков представляло для него большой интерес. В конце концов, когда люди умирают, они, как правило, оставляют после себя состояния. Просматривая архивы двора Лазурного Дракона и общаясь со многими старшими некромантами, он узнал очень многое о других видах мертвецов. Самое полезное то, насколько драгоценны для них «оковы». Если он вызывает только одного из мертвецов, угрожая путами, они, кажется, всегда извиваются и соглашаются со всем, что он говорит. Это легкие деньги, и лучше отдать дань уважения Джи-со. Он уже совершает убийство."
 POD_persistentpodlore.desc.EA0041:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\n Самый младший из учеников Джи-со, А-джи - единственный среди Истинных Костей в целом. В то время как большинство ее сверстников, их учеников и ее наставника являются безжалостными и целеустремленными, она довольно тихая душа, предпочитающая свою мастерскую. После того, как она умерла из-за спора о платежах в магазине своего отца, те, с кем им теперь приходится иметь дело, кажутся ей теми, кто когда-то разлил бы свои мозги по полу. Но теперь именно они размещают заказы. \n\n Несмотря на это, Джи-со постоянно подтверждает, насколько важен А-джи для их Общества. Работать с Джейд, Костью и Чи очень сложно, и она в этом достаточно искусна. Ее работа позволяет остальным продолжать свой конфликт как против [akuma|E] на севере, так и против торговли в целом. И учитывая, что она единственный у них ремесленник, ее, по крайней мере, устраивает тот факт, что она слишком драгоценна, чтобы когда-либо подвергать ее опасности. Ее мастерскую всегда охраняют многочисленные полудьяволы, а также Дампир, нанятая ею в качестве дополнительной охраны. А ее союзники, в свою очередь, получают безупречную работу для собственного использования в своих конфликтах. Однако, несмотря на все это, она беспокоится о путях, по которым они идут. Да, это картель, и, сражаясь с [akuma|E], она кое-что училась. В какой момент они заходят слишком далеко? В какой момент они станут хуже, чем записи молодого Короля демонов по имени [Glossary('Микабоши','podgloss.mikaboshi')], которые она видит?"
 POD_persistentpodlore.desc.EA0042:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nОднажды Бо Чжон подумал, что научная жизнь пойдет ему на пользу. По крайней мере, до того, как он оказался в аду. Несмотря на то, что он провел почти 7 десятилетий, пытаясь вести настолько хорошую жизнь, насколько мог, преодолевая подавляющее давление других, направленное на него, чтобы ослабить свою позицию, он боролся с этим, пытаясь оставаться моральным. И все же оспа все равно обрекла его на лихорадочный ад. Бо Чжон, разгневанный этой космической несправедливостью, содрал больную кожу со своей оспы, позволив аду отрастить ее заново, и сделал себе лестницу из ада, сделанную из больной плоти. \n\nКогда он перевел второй дух, сангун были обвинены в террористических актах, но выяснилось, что медведь-демон, терроризирующий территорию, был неистовством Бо Чжона, только что вышедшего из ада. С тех пор, как Бо Чжон попал в Ночной мир, он больше не заботится о чести и добродетели. Несмотря на то, что он столь же остроумен и мудр, как и был, он почти этим не пользуется. Какой в ​​этом смысл? Нет, вместо этого ему нравится быть мускулом Общества настоящих костей. Когда их должники не смогут выплатить свои долги, он срывает двери с петель и гонит их на край земли, чтобы увидеть, как их долги будут погашены. Когда кто-то критикует своих сверстников, он навещает их, чтобы «обсудить» с ними что-то. И ему наконец-то весело. И черт возьми, ему это сейчас нравится."
 POD_persistentpodlore.desc.EA0043:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nЗагадка внутри Общества Истинных Костей, Джа Хё никогда не говорила ни слова никому из них. И все же, он, пожалуй, самый опасный из их числа среди остального ночного мира Кореи. Придя из ада перевернутых грешников и, согласно его собственным сочинениям, не имеющий никаких воспоминаний о прошлом, Джи Ын, наставничество над Джа-Хё, по крайней мере, рад видеть, что он удивительно лоялен и послушен более широкому обществу. И все же, у Джа Хё есть свои... причуды. Помимо того, что он, по крайней мере, немой. \n\nИногда, если он не охраняет место, люди пропадают там, где он идет. Лжеврачи найдены с отсутствующими челюстями. У профессиональных воров руки вжаты в плечи так, что наружу торчат только ладони. Ноги крутились по телу 15 раз у тех, кто постоянно убегал от закона. Те, кто практикует сексуальное насилие, находили кастрированных и пронзенных на дереве через прямую кишку. А Джа-Хё снова в своем убежище, весь в крови и обдумывает свой путь. Именно по этой причине Джа Хё считается террористом-наемником. Если кого-то нужно запугать, чтобы он выполнил свою клятву, он, без сомнения, является тем Предком, которого следует призвать для этого. И часто он обязательно отправит сообщение. И все без единого слова протеста. Просто кивок, и тогда кого-то изуродуют. \n\n Живописный Дьявольский Тигр, если он когда-либо существовал."
 POD_persistentpodlore.desc.EA0044:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\n. В обществе, где каждый может превратиться из обычного человека в невероятно выносливого, бросающего деревья, молниеносного монстра-демона с дикими эмоциями, те, кто может уговорить других или предотвратить драки, критически ценны для любой долгосрочной цивилизации. С этой целью Уи-мин был критически важным членом Общества истинной кости. Третий сын при жизни мелкого дворянина, Уи-Мин был харизматичным, но с трудом сдавал экзамены. А поскольку он не был ни наследником, ни запасным, это был более или менее его единственный шанс на продвижение по службе. Стресс от всего этого начал ломать Уи-мина, и, в конце концов, между ругательствами родителей, собственной неудачей и стрессом на экзаменах, Уи-мин сломался и бросился в Злой город после ночи, когда его тело выпило слишком много алкоголя. И там он был вынужден повторно сдавать одни и те же экзамены, которые убивали его каждый день, пока он, наконец, не вырвался из своих оков и не пробежал через каждую стену, отделяющую его от мира живых. \n\nОн был найден во дворе Лазурного Дракона и получил образование в [Glossary('дхармы','podgloss.dharma')], и, по большому счету, он измотан. Он полностью согласен использовать деньги для ослабления [Glossary('повелителей Яма','podgloss.yamaking')], но, прежде всего, ему просто нужно место. Он хочет быть рядом с другими, чтобы его ценили и хотели. По крайней мере, он успокаивает других членов True Bone, поэтому из него получается отличный миротворец. И это, наконец, роль, которой он доволен."
 POD_persistentpodlore.desc.EA0045:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nОдна из менее известных областей ведения войны связана с измененными веществами, где [akuma|E] часто смешивает стимуляторы и депрессанты с испорченной сущностью, чтобы открыть своих пользователей для заражения и одержимости, чтобы привязать их души к служению, но они не мудрее. И поскольку люди терпят неудачу, Общество Истинной Кости решило не полагаться на институты смертных, чтобы смягчить их использование, а вместо этого использовать его, чтобы заработать больше средств для своей миссии, а также контролировать то, от чего они зависимы. А Чжагём довел это до уровня искусства. \n\nВ своей земной жизни он был пивоваром и опытным производителем алкоголя. Но когда он умер и его встретил ад, когда с него сняли шкуру заживо, он не понял, но ему это и не нужно было. Ему не нравилось, когда с него сдирали шкуру заживо, поэтому он закопал себя как можно лучше и выкопал себе путь наружу. \n\nС тех пор, как он вышел на орбиту Общества костей, он реализовал свои старые таланты и еще больше расширился. Блестящий пивовар, но также очень опытный в изготовлении других наркотиков, он заставляет своих субъектов и агентов перемещаться, предлагая «лучшие» продукты, которые также вызывают зависимость. Хотя это очень прибыльно, они пропитаны эссенцией, очищающей их от порчи [UmbraGlossaryLocalized('yomi_wan','Тысяча преисподних')]. Таким образом, несмотря на моральные затруднения, которые были бы у более старших предков, они не могут отрицать, что Чагём является эффективным воином в битвах, в которых он участвует."
 POD_persistentpodlore.desc.EA0046:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\n Самый молодой член Истинных Костей и единственный, кто отклоняется от приверженности методам Торгового картеля «Багровый Тигр», Ю-хва более чем компенсирует это своей работоспособностью и рвением. Первоначально это была всего лишь молодая женщина, которой нравилось быть в центре внимания в своей деревне из-за своей красоты, ее жизнь изменилась, когда дворянин пришел увидеть эту даму, о которой его слуги говорили как о видении красоты, и был сразу же очарован ею и предложил взять ее в качестве любовницы. Ю-хва не хотела терять свой статус местной знаменитости, но знала, что отказываться от лорда — нереальный вариант. Она согласилась, и, к большому огорчению жены, он проводил с ней столько времени, сколько мог. И именно по этой причине жена, отказавшись от замены, накачала Ю-хва наркотиками, связала ее лодыжки и запястья цепью и бросила в море. \n\nЮ-хва уже не помнит, как долго она провела в Аду Кипящих Морей, привязанная к скале на дне, но жадный дьявол, желавший откусить кусок, перерезал ей границы настолько, что она могла escape.\n\nПосле всего этого опыта и части своего образования, полученного у Сок Кван Сук, Ю-хва обратилась к довольно интересным способам просветления. Сверкающий Уголь обожает заманивать глупо похотливых на погибель, прежде чем принять форму Дьявола в середине коитуса и превратиться в коитус огромного демона-лисы. Будучи верной Джи-со и другим Истинным Костьям, она постоянно обходит черту слишком далеко и каждую ночь проверяет свои пределы, постоянно ища плотского блаженства и интуитивного финала. Любое утверждение о том, что «она просто наслаждается нежизнью», становится все более и более пустым по мере того, как на ее пути появляется все больше и больше убийств. \n\nБудущая судьба: \n\nХаос Года Черных Коршунов и его последствия заставили Истинных Костей перестать заботиться о пристрастиях Ю-хва и вместо этого использовать ее в качестве соблазнительницы-убийцы. Ее охота была настолько плодотворной, что младший $pod_kueijin$ решил, что она вдохновила на создание кумихо. Но к этому моменту ей уже все равно. У нее есть свои пути, она далеко ушла в своем просветлении, и ее нежизнь принадлежит ей, и она может ею наслаждаться. И у нее не было бы другого пути."
 POD_persistentpodlore.desc.EA0047:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nНет чужаком порогу, в жизни Сигэно не было ни дня ни в ее жизни, ни в нежизни, чтобы ее не выталкивали на дороги, по которым она не хотела идти. Но сейчас? Она осмеливается идти своим путем. Родилась на рубеже эпох Нара и Хэйан, седьмая дочь императора Канму и дворовой госпожи Фудзивара-но Камико. Но Сигэно была единственным ребенком среди 36 детей Канму, и она не имела большого значения в великих масштабах истории. И в глубине души Сигэно это возмущало. Но ее вынудили занять должность жены мелкого лорда, чтобы укрепить баланс сил. Пока она не умерла в возрасте 48 лет, не имея детей, она была ожесточенной, неудовлетворенной и умерла, чувствуя, что ее жизнь потрачена впустую. \n\nИ все стало неизмеримо хуже, когда она оказалась в Ночном Царстве. Сразу же ее начали преследовать Сикохимэ, поскольку Эмма-О более чем стремилась превратить и насиловать принцессу в одну из своих супруг-убийц. Они даже прогнали Сигэно обратно в мир живых, и только с вмешательством Предка Юки. Какое-то время Сигено была благодарна за защиту, пока не увидела, что пытался вызвать ее «спаситель». Сигэно была в ужасе от увиденного и стала первым членом Удзи, осудившим Род Идзанами, и формально порвала с ними. Из-за почитаемого статуса Юки это был шаг, который изолировал ее политически, но ее это не волновало. Она закончила свое образование под руководством Риана и отказалась отрицать свое увлечение живым миром и чуждыми Дхармами, которые, по ее мнению, были навязаны Уджи. Духовный мир был реальным. Суды Зверей доказали это явной правдой. Отрицать это было безумием. Она бросила вызов приказам и взяла себе учеников, полагаясь на важность своих обязанностей как духовного наставника, чтобы обеспечить свою защиту. Она все еще идет по опасной линии, осмеливаясь идти своим собственным путем теперь, когда она больше не связана со статусом, в котором она родилась. \n\nБудущая судьба: \nНесмотря на постоянные взад и вперед, Сотогава Но будет страдать, как Лазурные Покровы, Сигэно выдержал. После ухода Рияна из Материального мира и распада Завес, Сигэно стал номинальным лидером Анимсит $pod_kueijin$ в Японии. Даже несмотря на то, что она по-прежнему изгнана из Удзи, ее влияние неоспоримо. И ей это тоже понадобится. Кто-то должен остановить Юки. И в Сигэно не будет недостатка."
 POD_persistentpodlore.desc.EA0048:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nГэндзи, хотя и известен как ксенофильный Удзи, имеет более прогрессивное мышление не только в своей позиции по отношению к иностранному влиянию внутри кланов Удзи. Эти взгляды распространяются и на то, что считается приемлемым как в поведении, так и в средствах накопления власти. По этой причине Рури является одной из самых ярых сторонниц Гэндзи... и полезных агентов. \n\nРури, возможно, была одной из самых любимых куртизанок в ее смертной жизни в Саге. Будучи дочерью их рода, медленное накопление власти среди женщин до нее позволило Рури играть более комфортную роль в их «театре». Считавшаяся женщиной для утонченных мужчин, она многому научилась благодаря близости и стала невероятно искусной в чтении людей. Она надеялась, что сможет соблазнить богатого человека и добиться власти, но один клиент имел в виду нечто иное, и жизнь Рури закончилась задушенной, а ее тело было брошено в море с камнями, привязанными к ее лодыжкам, чтобы предотвратить скандал. И ее положение только ухудшилось, поскольку ее продали из Йеллоу-Спрингс в Железный бордель. Она провела там непостижимое количество времени, но это время дало ей некоторую перспективу, и она смогла манипулировать Дьяволом, чтобы купить ее в качестве жены, и с удачно расположенным кинжалом, сформированным из ее души, она сбежала обратно в мир живых. \n\nСо времени своей цивилизации Рури, однако, считала себя восходящей звездой среди Гэндзи. Одна из немногих Уджи, которая не сделала ее изгоем за то, что она не отказалась от своих навыков куртизанки. Она использует эти приобретенные навыки, чтобы манипулировать и контролировать тех, кто облечен властью в мире смертных, чтобы помочь Уджи. Но она стремится к большему. Перспектива Рури просто стала шире. И несмотря на скромные маски, которые она носит для своих клиентов и союзников, она стремится к гораздо большему. \n\nБудущая судьба:\nРури будет адаптироваться к клиентам и, ради новых возможностей власти, к новым средствам массовой информации. Превратившись из куртизанки во взрослую актрису, она нашла способ пожинать большие объемы эссенции у своих потребителей и укрепляет все это для себя, чтобы быть еще более готовой к поискам Ангела-Дракона Смерти..."
 POD_persistentpodlore.desc.EA0049:0 "Этот персонаж был создан разработчиками PoD для придания большей глубины сеттингу и не является официальной частью $pod_wod$.\n\nТрадиционные ценности Тайра Удзи, печально известные своим упрямством и несгибаемостью, могут проявляться не только в сопротивлении любому иностранному влиянию и любому социальному прогрессу. Это может произойти и по-другому. А Цугоко, родившая в мире одного из самых влиятельных смертных Тайра, является образцом социальных ценностей, которые влекут за собой такие вещи.\n\nНаложница смертного Тайра-но Такамоти, Цугуко была матерью его пятого сына Тайра-но Ёсифуми. Послушная и преданная, Цугоку сделала все, что ожидалось от женщины ее положения. Она прожила жизнь настолько добродетельную, насколько могла, и когда болезнь взяла верх, она была, по крайней мере, эмоционально довольна тем, чего достигла, поскольку ее сын намеревался править миром. Но она была приговорена к аду роющих личинок, и, к ее ужасу, болезнь мучила ее бесконечно, невзирая ни на какие причины. Только кончина военного отряда Удзи спасла ее и вернула к наставникам для надлежащего воспитания. И вместе с ее смертной жизнью Тайра Удзи немедленно забрал ее. Но, к их большому удивлению, она, как только смогла, покинула их центр силы и немедленно вернулась к своему спасителю Ташимото Ханко. Он спас ее, и она поклялась ему, что у него больше не будет преданного слуги. С тех пор она ни разу не нарушила эту клятву.\n\nБудущая судьба:\nКогда раскрылась истинная глубина того, что лежит в прошлом Ханко, Цугуко была ошеломлена больше всего. Она исчезла в поисках его, и по сей день ее никто не видел в поисках правды о человеке, который спас ее от проклятия."
