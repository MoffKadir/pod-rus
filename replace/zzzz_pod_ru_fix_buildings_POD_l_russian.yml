l_russian:
 POD_building_discount01_tour_desc:0 "#P Вы снизите затраты на 10 % в [GetActivityType('activity_tour').GetName()] [activity|E]#!."
 POD_building_discount02_tour_desc:0 "#P Вы снизите затраты на 20 % в [GetActivityType('activity_tour').GetName()] [activity|E]#!."
 POD_building_discount03_tour_desc:0 "#P Вы снизите затраты на 30 % в [GetActivityType('activity_tour').GetName()] [activity|E]#!."
 POD_building_toledo_artifact_discount_desc:0 "Толедские оружейники"
 POD_building_toledo_commission_artifact_discount_desc:0 "#P Вы снизите затраты на 30% на [GetDecision('commission_artifact_decision').GetName]#! [decision|E]."
 POD_is_tremere_oradjacent_trigger_tt:0 "Вы персонаж Тремера или Банпайи."
 POD_requirement_albaicin_deconquista:0 "Уничтожьте Теневую Реконкисту. Убедитесь, что [GetScriptedCharacterByHistoryID('505154').GetFirstName] встретит Окончательную Смерть."
 POD_requirement_albaicin_faithful:0 "Вы должны принадлежать к мусульманской вере.\n$EFFECT_LIST_BULLET$Если Полуночный Полумесяц был разрушен, вы должны принадлежать к андалузской культуре.\n"
 POD_requirement_albaicin_qabilat:0 "Будучи членом дома Кабилат аль'Хаяль, контролируйте Полуночный полумесяц. \n$EFFECT_LIST_BULLET$В противном случае контролируйте Полуночный полумесяц – и убедитесь, что [GetScriptedCharacterByHistoryID('505125').GetFirstName] впадёт в торпор или Окончательную смерть."
 POD_requirement_sanctum_james:0 "Вы должны принадлежать к вере Виа Виндикта или Теневой Инквизиции."
 POD_requirements_alcazaba_badajoz:0 "Вы должны исповедовать веру Тарик эль-Хаким ИЛИ владеть продвинутым Прорицанием.\n$EFFECT_LIST_BULLET$В противном случае получите сильный рычаг влияния на [GetScriptedCharacterByHistoryID('790175').GetFirstName] ИЛИ добейтесь её смерти."
 POD_requirements_hilel_04:0 "Играя за Хилеля, восстановите славу Мадинат аз-Захры. \n$EFFECT_LIST_BULLET$В противном случае получите сильный рычаг влияния на [GetScriptedCharacterByHistoryID('505123').GetFirstName] – или убедитесь, что он впадёт в торпор или Окончательную смерть."
 POD_requirements_madinat_04:0 "Подтвердите господство Ассамитов. Вы должны полностью контролировать Иберию как правитель Полуночного Полумесяца."
 POD_requirements_madinat_assamite:0 "Вы должны быть Бану Хаким мусульманской веры. \n$EFFECT_LIST_BULLET$В противном случае наймите [GetScriptedCharacterByHistoryID('505123').GetFirstName] ИЛИ [GetScriptedCharacterByHistoryID('791020').GetFirstName] в качестве своего примогена."
 POD_requirements_sao_vicente:0 "[holder|E] должен быть христианином или португальцем."
 POD_tomb_el_cid_nonmuslim:0 "Вы не принадлежите ни к одной из смежных мусульманских конфессий."
 POD_tomb_el_cid_reconquista:0 "Вы — ласомбра или представитель кастильской, астурлеонской или галисийской культуры."
 POD_zocodover_requirement_mozarabic:0 "Вы принадлежите к христианской вере или кастильской культуре."
 POD_zocodover_requirement_mudejar:0 "Вы принадлежите к мусульманской вере или андалузской культуре."
 POD_zocodover_requirement_nonzealot:0 "У вас НЕ должно быть свойства «Фанатизм».\n$EFFECT_LIST_BULLET$Либо, если вы охотник, вы должны быть циничны ИЛИ иметь отрицательный уровень благочестия.\n"
 POD_zocodover_requirement_sephardic:0 "Вы принадлежите к смежной еврейской вере или сефардской культуре."
 building_albaicin_quarter_01:0 "Королевская цистерна"
 building_albaicin_quarter_01_desc:0 "Существовал Гарната, странный холм, а на нем город Альбайсин. Из его вод струился султан в плаще и обещание: спасение."
 building_albaicin_quarter_02:0 "Крепость Гарната"
 building_albaicin_quarter_02_desc:0 "Разрушена Тайфа, стены Гарнаты собирают братию. Оружием повелено: неверных жителей доставить за пределы зрения – за мир чистых."
 building_albaicin_quarter_03:0 "Старая цитадель Зиридов"
 building_albaicin_quarter_03_desc:0 "Насриды возвысились, Зириды угасли. Но помимо смертных, Альбайцин выстоял. Из ушедшей цитадели Аширра пообещала продержаться до наступления рая."
 building_albaicin_quarter_04:0 "Скрытый рай Альбайсина"
 building_albaicin_quarter_04_desc:0 "Какое спасение ждет их, смертные даже не догадывались. Аль-Андалуса больше нет, рай по-прежнему скрыт за Альбайсином. Навсегда вечный – чистый, отраженный под полночью."
 building_alcazaba_badajoz_01:0 "Цистерна Бадахоса #weak (Подземная застава)#!"
 building_alcazaba_badajoz_01_desc:0 "Внутри цистерн с водой Алькасабы остается скрытый форпост. Со времен Альмохадов многие потенциальные воины Аширры практиковали здесь свое ремесло... \n\n#help Уцелевшие ассамиты скрывают проход, обманывая чувства потенциальных посетителей.\n\nТолько потомки Хакима или те, у кого острое зрение, могут надеяться проникнуть внутрь...#!"
 building_alcazaba_badajoz_02:0 "Склепы вестготов #weak (Подземная крепость)#!"
 building_alcazaba_badajoz_02_desc:0 "Мрачна тишина среди забытых могил вестготов. Лабиринты туннелей окружают забытую подземную часовню, превращенную в крепость..."
 building_alcazaba_badajoz_03:0 "Поле клинков #weak (Подземные туннели)#!"
 building_alcazaba_badajoz_03_desc:0 "Подобно волнам на скалах, ни один враг не осмелился приблизиться к полю клинков. Старые римские туннели теперь перепрофилированы, соединяют мелкие аванпосты по всей провинции, быстро пополняют запасы крепости и заводят врага в смертельную ловушку…"
