 building_caern_grey_rock_01_desc:0 "$building_type_caern_grey_rock_01_desc$"
 building_chimtarga_peak_caern_01:0 "Каэрн пика Чимтарга"
 building_chimtarga_peak_caern_01_desc:0 "$building_type_chimtarga_peak_caern_01_desc$"
 building_crystal_mind_caern_01:0 "Каэрн Кристального Разума"
 building_crystal_mind_caern_01_desc:0 "$building_type_crystal_mind_caern_01_desc$"
 building_damburrow_01:0 "Дамберроу"
 building_damburrow_01_desc:0 "$building_type_damburrow_01_desc$"
 building_ergenekon_01:0 "Эргенекон"
 building_ergenekon_01_desc:0 "Эргенекон больше не дремлет. Подземное сердце Эрка постоянно работает над закалкой золота и стали, доказывая, что они больше не будут прятаться и убегать."
 building_falling_water_01:0 "Каэрн Падающей Воды"
 building_falling_water_01_desc:0 "$building_type_falling_water_01_desc$"
 building_gish_abbai_caern_01:0 "Каэрн Гиш Аббай"
 building_gish_abbai_caern_01_desc:0 "$building_type_gish_abbai_caern_01_desc$"
 building_lake_moutniy_caern_01:0 "Каэрн озера Мутного"
 building_lake_moutniy_caern_01_desc:0 "$building_type_lake_moutniy_caern_01_desc$"
 building_madinat_al_zahra_01:0 "Руины эпохи #weak (Похороненное прошлое)#!"
 building_madinat_al_zahra_01_desc:0 "«Долго сражался султан Хилель аль-Масаари. Победа осуществилась, его призом стал город-дворец. Но никакого поля битвы оказалось недостаточно — его жажда битвы никогда не утихала. Пока его город не оказался погребён под обломками. И тогда все знали. Аль-Андалус погиб, навсегда наша неудача – предупреждение»."
 building_madinat_al_zahra_02:0 "Воспоминания о Свете #weak (В поисках прошлого) #!"
 building_madinat_al_zahra_02_desc:0 "''Как это было? Крепко схватить свет… и увидеть, как он ускользает от тебя? Ничего. Наш мир исчез, разбросан. Память о погибших – это все, что осталось»."
 building_madinat_al_zahra_03:0 "Зал изобилия #weak (Раскопанное прошлое)#!"
 building_madinat_al_zahra_03_desc:0 "«Под обломками мир затаил дыхание. А под этим кроется наша глупость. Мраморные колонны прочны, основы цивилизации сохраняются, но бьются и не желают увядать...»"
 building_madinat_al_zahra_04:0 "Золотое Хранилище #weak (Восстановленное прошлое) #!"
 building_madinat_al_zahra_04_desc:0 "''Мои глаза видели на необъятности золото. Мужчины вырастали в принцев, принцы вырастали в халифов. Но мое сердце было пусто. Мир, который мы завоевали, был слишком горьким на вкус — хранилище, в котором можно похоронить мой род, величайшего из воинов!»"
 building_maryb_well_of_sacrifice_01:0 "Малый колодец жертвоприношений"
 building_maryb_well_of_sacrifice_01_desc:0 "Под собором Святой Софии, в давно заброшенном убежище Михаила, поднимают первые камни и проливают первую кровь. Шахта пока никуда не ведёт. Пока."
 building_maryb_well_of_sacrifice_02:0 "Большой колодец жертвоприношений"
 building_maryb_well_of_sacrifice_02_desc:0 "Колодец спустился мимо старых цистерн во тьму, о которой забыл город. Каждое углубление обходится дороже предыдущего, и каждую ночь воздух внизу пахнет чуть больше серы и чуть меньше камня."
 building_maryb_well_of_sacrifice_03:0 "Адский колодец жертвоприношений"
 building_maryb_well_of_sacrifice_03_desc:0 "Это почти завершено. Нижняя часть шахты больше не земля; это тьма, которая смотрит в ответ. Еще несколько обрядов, и пропасть между Творением и ямой практически исчезнет."
 building_maryb_well_of_sacrifice_04:0 "Открытый колодец жертвоприношений"
 building_maryb_well_of_sacrifice_04_desc:0 "Врата открыты. Наверху Константинополь остаётся маяком веры смертных; внизу его подземелья стали точным отражением ада на Земле. Рост города исчерпан и не возобновится, но то, что выходит из тьмы, подчиняется тому, кто открыл путь.\n\n#EMP Пока вы владеете открытым Колодцем, вы можете нанять [GetMaA('demons').GetName].#!"
 building_masculine_dignity_01:0 "Мужское достоинство"
 building_masculine_dignity_01_desc:0 "$building_type_masculine_dignity_01_desc$"
 building_monastery_sao_vicente_01:0 "Часовня паломников"
 building_monastery_sao_vicente_01_desc:0 "Внутри находится часовня, завещанная святому Висенте после завоевания Лиссабона. Свидетелями этого стали паломники – по следам Афонсу, короля-основателя."
 building_monastery_sao_vicente_02:0 "Храм Памяти"
 building_monastery_sao_vicente_02_desc:0 "Но обещание пережило жизнь. Так несчастные обрели веру – в память о наследнике, короле Санчо I."
 building_monastery_sao_vicente_03:0 "Пантеон королей"
 building_monastery_sao_vicente_03_desc:0 "Смертные ослабевают. Тем не менее, вороны слетаются сюда в больших количествах, как и множество верующих, – во исполнение вечных обещаний королей."
 building_monastery_sao_vicente_04:0 "Третий спуск"
 building_monastery_sao_vicente_04_desc:0 "Восстань вновь, Господь. Будь то фермер, первым ступивший по проклятым землям. Будь то пастырь, вернувшийся рукою Божией. Теперь, Царь царей, возроди наше королевство в обещанную геенну!"
 building_mother_peach_trees_01:0 "Каэрн Матери Персиковых Деревьев"
 building_mother_peach_trees_01_desc:0 "$building_type_mother_peach_trees_01_desc$"
 building_open_rule_04:0 "Открытое правление Патриарха"
 building_open_rule_04_desc:0 "Ответ Патриарха на непростую проблему открытого правления, основанный на его опыте правления Константинополем под именем Михаила III. Почему бы не внушать одновременно любовь и страх?\n\nОткрывается только благодаря догмату «Наследие теней»."
 building_plaza_zocodover_01:0 "Ночной рынок зверей"
 building_plaza_zocodover_01_desc:0 "Тсс, мой хороший клиент. Не забудь потише — иначе получишь нос, как у меня, ха! Сейчас, сейчас. Давайте заключим сделку…"
 building_plaza_zocodover_02:0 "Центральный рынок диковин"
 building_plaza_zocodover_02_desc:0 "Хватит больше таращиться! Так что не стесняйтесь, ребята. Вино, сталь, скот, слуги — все это у нас есть!"
 building_plaza_zocodover_03:0 "Перекресток Иберии"
 building_plaza_zocodover_03_desc:0 "Собирайтесь все, приходите все! Будь то смертный или менее смертный, Бог ведет знаменитых здесь со всех уголков Иберии — на #emp мой#! скромный перекресток!"
 building_plaza_zocodover_04:0 "Предместье Антекеруэла #weak (Сделки с мосарабами)#!"
 building_plaza_zocodover_04_desc:0 "Эй, эспадеро! Меня чертовски не волнует мастерство меча или совершенство. Не медлите, иначе я сам займусь тобой. И научу тебя #emp моему#! ремеслу, ха! \n\n#help Плаза де Зокодовер расширяет свое влияние через Мосарабский квартал, старейших кузнецов Толедо.#!"
 building_plaza_zocodover_05:0 "Альхама ремесленников #weak (Сделки с мудехарами)#!"
 building_plaza_zocodover_05_desc:0 "Налоги тебя съедают, да? Это очень больно. Ты действительно заслуживаешь повышения, тебе не кажется? Шедевр за шедевром – и всё, что ты получаешь, — новые поборы!\n\n#help Площадь Сокодовер расширяет свое влияние через квартал Мудехар, величайших архитекторов Толедо.#!"
 building_plaza_zocodover_06:0 "Квартал Амазалзет #weak (Сделки с сефардами)#!"
 building_plaza_zocodover_06_desc:0 "Внутри лежал роскошный Хамальзет. Меня пригласили в качестве гостя, и я был поражен. Об успехе, науке, историях. И я знал. Сегодня вечером мы будем как одно целое — или навсегда порознь. \n\n#help Пласа-де-Сокодовер расширяет свое влияние через сефардский квартал, где живут учёные мыслители Толедо. #!"
 building_portus_hispalensis_01:0 "Пески Гвадалквивира #weak (Доки)#!"
 building_portus_hispalensis_01_desc:0 "На песке я написал три имени: жизнь, смерть, любовь. Морской ветер украл их – и какой в ​​этом был смысл, я не мог вспомнить."
 building_portus_hispalensis_02:0 "В тени золота #weak (Верфь)#!"
 building_portus_hispalensis_02_desc:0 "Затухающие солнца над золотой рекой сияют на золотой башне. Один горящий свет, чтобы положить конец всем ночам – сумеркам Севильи, вдовы и любовницы эпох."
 building_portus_hispalensis_03:0 "Шепот Атарасанаса #weak (Арсенал)#!"
 building_portus_hispalensis_03_desc:0 "Так летали на морском ветру огромные паруса, на которых родилась армада. Шум ветерка одинаково влияет на всех детей – зачем же сдерживать козни и желания? Так долго длится поток высокомерия... Разве мы не повеселимся?"
 building_portus_hispalensis_04:0 "Ворота Индии #weak (Торговый порт) #!"
 building_portus_hispalensis_04_desc:0 "Всего несколько сотен ярдов причала на берегах медленной реки в пятидесяти милях от моря. Безумная затея, говорите? Отбросьте эту мысль: это #emp неважно#!. Даже если мир утратит все краски, даже если Гвадалквивир замрёт и высохнет — это #emp неважно#!. Каждую землю, каждую жизнь, каждое воспоминание — мы #emp принесём в жертву#!. Ради позолоченной Севильи увенчаем век золотом!"
 building_protector_caern_01:0 "Каэрн Защитника"
 building_protector_caern_01_desc:0 "$building_type_protector_caern_01_desc$"
 building_red_cedar_01:0 "Каэрн Красного Кедра"
 building_red_cedar_01_desc:0 "$building_type_red_cedar_01$"
 building_red_thermae_01:0 "Теплые источники"
 building_red_thermae_01_desc:0 "В первых купальнях теплая вода смешивается с более теплой кровью жертвенных смертных. Воздух развивающегося святилища пропитан ароматами и молитвами преданности."
 building_red_thermae_02:0 "Кровавые бассейны"
 building_red_thermae_02_desc:0 "Расширенные бассейны теперь наполнены опьяняющим витэ. Честолюбивые интриганы отдыхают в покоях, задрапированных шелком. Все отдаются очарованию Богини."
 building_red_thermae_03:0 "Большие красные термы"
 building_red_thermae_03_desc:0 "Эта безупречная баня гарантирует, что жертвенная кровь никогда не остынет, а планы и веселье никогда не прекратятся. Кровь почти переливается, окруженная прекрасными статуями с божественным ликом Елены."
 building_rock_three_kingdoms_01:0 "Скала Трех Королевств"
 building_rock_three_kingdoms_01_desc:0 "$building_type_rock_three_kingdoms_01_desc$"
 building_sanctum_st_james_01:0 "Затерянный храм Святого Иакова"
 building_sanctum_st_james_01_desc:0 "Чудо на звездном поле. Так сказал отшельник Пелагий перед лицом найденных останков. Это святой Иаков, погребенный в тени Либредонского леса."
 building_sanctum_st_james_02:0 "Ограда Апостола"
 building_sanctum_st_james_02_desc:0 "Ни живые, ни мертвые не сидели сложа руки. И паломники пошли знакомиться с мучеником. В темноте растет святилище — и наблюдает за происходящим."
 building_sanctum_st_james_03:0 "Путешествие масс"
 building_sanctum_st_james_03_desc:0 "Оставив Иерусалим и выйдя на дороги Сантьяго, так началось путешествие масс. Души, которых пасли, чтобы искупить, пожинали и спасали – под сенью Святого Иакова."
 building_sanctum_st_james_04:0 "Культ Сантьяго, Убийцы мавров"
 building_sanctum_st_james_04_desc:0 "Пронзенные копьями и выпотрошенные воины Христа поклялись: никогда больше не позволить врагу грабить Сантьяго. Так сплотились смутьяны под клич самого Святого Иакова, несущийся на белом знамени всадника…"
 building_siberian_wilds_caern_01:0 "Каэрн Сибирских Дебрей"
 building_siberian_wilds_caern_01_desc:0 "$building_type_siberian_wilds_caern_01_desc$"
 building_silver_mines_baebelo_01:0 "Сьерра-форпост"
 building_silver_mines_baebelo_01_desc:0 "В скрытых глубинах Картахенской Сьерры торговый аванпост обеспечивает это предприятие. Тем не менее, найти серебряные жилы у земли оказывается непросто – не говоря уже о нескромности. \n\n#help Чтобы обнаружить жилы, понадобится острое зрение... #!"
 building_silver_mines_baebelo_02:0 "Римские остатки"
 building_silver_mines_baebelo_02_desc:0 "Под видом горнодобывающей гильдии наша затея нашла его. Блеск серебра — и рассказ о цепях. Кости римских рабов лежали неподвижно, принимая милость до смерти. Тяжесть, которую никто не может не заметить, отвратительное отчаяние, которое все еще сохраняется. Неужели это цена за наше собственное состояние? \n\n#help Смертные задают слишком много вопросов... Нам нужно заставить их повиноваться. #!"
 building_silver_mines_baebelo_03:0 "Рудники семьи Барка"
 building_silver_mines_baebelo_03_desc:0 "Вот и трудятся наши слуги, маются и маются до последнего. Разбросанные по глубинам старые серебряные монеты все еще напоминают нам: лик Гамилькара Барки и неповиновение ушедшего Карфагена. Глаза Спектров следят за каждым нашим шагом... Теперь на нас смотрит больше глаз. \n\n#help Там внизу есть серебро, оно должно быть! Должна помочь мощная сила и доблесть...#!"
 building_silver_mines_baebelo_04:0 "Призраки Финикии"
 building_silver_mines_baebelo_04_desc:0 "Смерть, мы посеяли смерть. Но, оставив позади тени потерянной Финикии, мы погрузились в пещеры внизу – и в ужас. Крики, некоторые слышат крики. Песни, другие слышат песни. Или это бесконечный грохот барабанов и оружия?... Все, что мы можем сделать, это следовать за тьмой и безумием внизу... \n\n#help Духовная порча сохраняется. Только самая сильная воля и ум могут обеспечить путь вперед... #!"
 building_silver_mines_baebelo_05:0 "Гибель Зинриди"
 building_silver_mines_baebelo_05_desc:0 "Глубоко, глубоко внизу. Свет сиял бесконечным светом в темном пространстве. И теперь это одинокое темное царство остается скрытым от глаз смертных... Навсегда и только наше.\n\n#help Какое бы порождение Бездны здесь ни скрывалось, одолеть его могут лишь мастера искусств крови... #!"
 building_spirit_stone_01:0 "Каэрн Камня Духа"
 building_spirit_stone_01_desc:0 "$building_type_spirit_stone_01_desc$"
 building_st_brigid_01:0 "Церковь Святой Бригитты"
 building_st_brigid_01_desc:0 "$building_type_st_brigid_01_desc$"
 building_suzhou_creek_caern_01:0 "Каэрн ручья Сучжоу"
 building_suzhou_creek_caern_01_desc:0 "$building_type_suzhou_creek_caern_01_desc$"
 building_three_gorges_caern_01:0 "Каэрн Трёх Ущелий"
 building_three_gorges_caern_01_desc:0 "$building_type_three_gorges_caern_01_desc$"
 building_thunderstrike_caern_01:0 "Каэрн Громового Удара"
 building_thunderstrike_caern_01_desc:0 "$building_type_thunderstrike_caern_01_desc$"
 building_tomb_el_cid_01:0 "Прощание Родриго"
 building_tomb_el_cid_01_desc:0 "Плача горестнее, чем когда-либо, они разошлись, как ногти отделяются от плоти. Итак, Родриго повернулся назад, обнял возлюбленную Химену — и они оба расстались, одинокие в своей любви."
 building_tomb_el_cid_02:0 "Воля Химены"
 building_tomb_el_cid_02_desc:0 "Среди несчастий она молилась Богу. Даже темные часы не лишили веры. Ибо один человек больше всех заслуживал спасения. И она, донья Химена, настояла на этом."
 building_tomb_el_cid_03:0 "Последнее бдение"
 building_tomb_el_cid_03_desc:0 "Запечатленный в песне, Эль Сид провел последнее бдение. В объятиях Химены. Тени желали его, жаждали его. Но в объятиях вдовы голод не смел ступить.  Так умер смертный, возродившись в легенде."
 building_tomb_el_cid_04:0 "Гробница Мио Сида"
 building_tomb_el_cid_04_desc:0 "Воскреснув в гробнице, он поднялся. И вошёл в сам Ад, ибо такова была его воля. И проехал сквозь врата, чтобы нанести удар. О, мой Сид! Восстань вновь, изгони нечистых — и даруй нам нашу Реконкисту!"
 building_tullu_demtu_01:0 "Каэрн Туллу Демту"
 building_tullu_demtu_01_desc:0 "$building_type_tullu_demtu_01_desc$"
 building_type_albaicin_quarter_01:0 "Квартал Альбайсин"
 building_type_albaicin_quarter_01_desc:0 "#F Не поздняя Альгамбра династии Насридов впервые дала название Гранаде. Это был город Альбайсин, построенный намного раньше, в начале гражданской войны Фитны среди Тайфы. Расположенный на холме Гарната, среди стен крепости, он начал развиваться во времена династии Зиридов. Их подъем, последовавший за изгнанием христиан и мусульман, был ознаменован внезапным появлением Султана Бадра – загадочного каинита Ласомбра, посвятившего себя спасению всего Аль-Андалуса и Аширры… #!"
 building_type_alcazaba_badajoz_01:0 "Алькасаба Бадахоса"
 building_type_alcazaba_badajoz_01_desc:0 "#F Над руинами старых вестготов ренегат Ибн Марван основал свой город Бадахос, который до сих пор процветает в объятиях Алькасабы. Сообщалось, что эту мусульманскую цитадель трудно атаковать, и она практически неуязвима на протяжении всей истории… #!"
 building_type_arkwasiye_caern_01:0 "Каэрн Арквасие"
 building_type_arkwasiye_caern_01_desc:0 "#F Этот каэрн расположен в расщелине скалы чуть ниже хребта перевала Арквасие. Здесь распространены духи войны и холода, но, пожалуй, наиболее примечательными являются странные энглинги, известные как Громовые Яйца Арквасие, населяющие этот район.#!"
 building_type_artic_axe_caern_01:0 "Каэрн Арктического Топора"
 building_type_artic_axe_caern_01_desc:0 "#F Этот каэрн выносливости, посвященный Кабану, находится под контролем Отпрысков Фенрира. Как это типично для их племени, они, как известно, достаточно быстро ищут бой, хотя их соседи признают, что самые мощные атаки они приберегают для Вирма и его агентов. #!"
 building_type_baba_yaga_stone_01:0 "Каменный Каэрн Бабы Яги"
 building_type_baba_yaga_stone_01_desc:0 "#F Это скальное образование напоминает огромную человеческую голову с крючковатым носом старухи. Путь к Эребу появляется в Полутени возле каэрна в первую ночь каждого новолуния. Повелители Теней и Красные Когти поддерживают непростое перемирие, по очереди охраняя и используя каэрн в течение месяца. Несмотря на мудрость этого каэрна, он привлекает множество духов-обманщиков и фей.#!"
 building_type_blood_sea_caern_01:0 "Каэрн Крови Моря"
 building_type_blood_sea_caern_01_desc:0 "#F Возможно, это первый каэрн Чёрных Фурий в степях, его расположение в незаселенном регионе яростно охраняется его обитателями. Другие племена допускаются сюда только при строгом надзоре.#!"
 building_type_brooding_sky_01:0 "Каэрн Мрачного Неба"
 building_type_brooding_sky_01_desc:0 "#F Этот каэрн Повелителя Теней, хотя и уважается за свою силу и мудрость, также известен тем, что подчеркивает худшие стороны этого племени. Они скрытны, неохотно идут на сотрудничество и всегда что-то скрывают ради собственной выгоды.#!"
 building_type_caern_amber_mount_01:0 "Каэрн Янтарной горы"
 building_type_caern_amber_mount_01_desc:0 "#F Названный в честь проходящих через него богатых медных жил, этот каэрн рассматривается его владельцами из племени Чёрных Фурий как священный для Афродиты, богини, часто связанной с этим минералом. #!"
 building_type_caern_azure_bassin_01:0 "Каэрн Лазурного бассейна"
 building_type_caern_azure_bassin_01_desc:0 "#F Этот изолированный каэрн, расположенный в небольшой пещере, труднодоступен даже с моря. Однако в равной степени красивый и мощный, он уже давно ценится Черными Фуриями, которые обнаружили его, когда давным-давно следовали за греческими колонистами.#!"
 building_type_caern_black_tumulus_01:0 "Каэрн Чёрного кургана"
 building_type_caern_black_tumulus_01_desc:0 "#F Последний оплот Отпрысков Фенрира во Франции все еще силен, но, тем не менее, это бледная тень их былой славы. \nТе, кто недооценивает их решимость вернуть их былой престиж, всё равно встретят быстрый и кровавый конец. #!"
 building_type_caern_enchanted_enclosure_01:0 "Каэрн Зачарованной ограды"
 building_type_caern_enchanted_enclosure_01_desc:0 "#F Считающийся самым могущественным Каэрном во Франции, это, казалось бы, скромное место изобилует силой, в основном проистекающей из его связи с фейри и легендами о короле Артуре. \n Когда-то он был более могущественным, когда все еще был связан со своим каэрном-близнецом, но это было потеряно, когда указанный каэрн был уничтожен линией крови вампирши Магды из клана Лианнан. #!"
 building_type_caern_grey_rock_01:0 "Каэрн Серой Скалы"
 building_type_caern_grey_rock_01_desc:0 "#F Расположенный глубоко в горах, этот каэрн Безмолвных странников сумел избежать сопутствующего ущерба от свирепой войны, которую маги ведут в этой области. \nПосле этой первой тревоги его защитники подготовлены лучше, чем когда-либо. #!"
 building_type_chimtarga_peak_caern_01:0 "Каэрн пика Чимтарга"
 building_type_chimtarga_peak_caern_01_desc:0 "#F Духи Войны и Предков охраняют этот каэрн и отговаривают любого — человека, Гару или кого-либо еще — от восхождения на его вершину. Эти духи награждают тех, кто впервые преодолевает трудности, восполняя всю их Силу Воли.#!"
 building_type_crystal_mind_caern_01:0 "Каэрн Кристального Разума"
 building_type_crystal_mind_caern_01_desc:0 "#F Один из самых мощных каэрнов Звездочётов, Кристальный Разум уникален в своем посвящении одновременно мудрости и загадкам. Открытый для посетителей из других племен, он известен повсюду, несмотря на свое удаленное расположение.#!"
 building_type_damburrow_01:0 "Дамберроу"
 building_type_damburrow_01_desc:0 "#F Никто по-настоящему не знает, что находится под, казалось бы, неприметным монастырем Святого Андрея. \nИнквизиторы опасаются, что это Дьявол, оборотни предполагают прямые врата в Малфеас, и даже демоны обходят это проклятое место стороной. \n\nВозможно, лучше, чтобы никто никогда не узнал. #!"
 building_type_ergenekon_01:0 "Эргенекон"
 building_type_falling_water_01:0 "Каэрн Падающей Воды"
 building_type_falling_water_01_desc:0 "#F Этот каэрн Красных Когтей, расположенный на поляне в глубине леса, менее престижен, чем его аналоги. Однако посвящение его в качестве каэрна видений дает ему почетное место в нынешнем пророческом настроении племени.#!"
 building_type_gish_abbai_caern_01:0 "Каэрн Гиш Аббай"
 building_type_gish_abbai_caern_01_desc:0 "#F Даже люди издавна ощущали невероятную силу этого места, и легенды утверждают, что источник отмечает место, где первые люди были изгнаны из Эдема в книге Бытия. Воды Гиш Абая обладают чудесными целебными свойствами, которые сделали этот каэрн незаменимым сокровищем для Гару. Каэрн наполнен духами исцеления и элементалями воды.#!"
 building_type_lake_moutniy_caern_01:0 "Каэрн озера Мутного"
 building_type_lake_moutniy_caern_01_desc:0 "#F Это небольшое горное озеро населено духами мира, спокойствия и элементалями воды. Кочевые духи предков часто проходят через каэрн на пути в другие места назначения.#!"
 building_type_madinat_al_zahra_01:0 "Мадинат аль-Захра"
 building_type_madinat_al_zahra_01_desc:0 "#F Мадинат аль-Захра, «Сияющий город». Когда-то город-дворец и столица Омейядского халифата Кордова в зените своего расцвета располагалась у подножия Сьерра-Морены. Говорят, что это место огромного богатства, и им руководил султан Хилель аль-Массари – некогда великий лидер ассамитов Полуночного Полумесяца. Это была его награда после многочисленных военных кампаний по Иберии. Однако сила его руки не распространялась на его правление: будучи неспособным или не желая реагировать, он не смог предотвратить разграбление Мадинат аз-Захры берберскими наемниками. Так начались гражданские войны в Фитне, и пока он запоздало пытался восстановить королевства тайф, Аль-Андалус раскололся на части… #!"
 building_type_maryb_well_of_sacrifice_01:0 "Колодец жертвоприношений"
 building_type_maryb_well_of_sacrifice_01_desc:0 "#F Шахта, прорытая в давно заброшенном убежище Михаила под собором Святой Софии, питаемая живым городом, пока основание Творения не истончится. Что вверху, то и внизу.#!"
 building_type_masculine_dignity_01:0 "Мужское достоинство"
 building_type_masculine_dignity_01_desc:0 "#F Это скальное образование выглядит как мужской орган, стоящий вертикально на скале. Местные жители издавна приезжали сюда для проведения всевозможных ритуалов плодородия. Хотя это и не каэрн, родичи, которые успешно размножаются в тени камня, с гораздо большей вероятностью рожают $glossary_fera$.#!"
 building_type_monastery_sao_vicente_01:0 "Монастырь Сан-Висенте-де-Фора"
 building_type_monastery_sao_vicente_01_desc:0 "#F В тени старых стен свидетели видели, как Святой Висенте вошел в Лиссабон. Реликвии сохранены, королевство началось с клятвы… #!"
 building_type_mother_peach_trees_01:0 "Каэрн Матери Персиковых Деревьев"
 building_type_mother_peach_trees_01_desc:0 "#F Один из самых уважаемых каэрнов материковой Азии, Мать Персиковых Деревьев, является домом для двора, известного своим проницательным поведением и своенравным нравом. Тем не менее их недоброжелатели часто называют их изоляционистские тенденции критическим недостатком. #!"
 building_type_plaza_zocodover_01:0 "Пласа де Сокодовер"
 building_type_plaza_zocodover_01_desc:0 "#F Хорошо это или плохо, но Зокодовер всегда был сердцем Толедо. Известен прежде всего как рынок крупного рогатого скота. Вскоре это переросло в точку воссоединения – сначала при Омейядах, затем при Кастилии. На этих землях, прибывающих и убывающих вместе с солнцем, происходили сделки, фестивали и трагедии.#!"
 building_type_portus_hispalensis_01:0 "Портус Хиспаленсис"
 building_type_portus_hispalensis_01_desc:0 "#F Севилья, столица халифата Альмохадов, знала множество имён и властителей. Испал, Хиспалис, Исбилия, Севилья... Но будь то римлянин, мусульманин или христианин, каждое биение жизни – и поток богатства – исходили из реки Гвадалквивир. Во все времена, будь то жизнь и смерть, стекались к его песчаным берегам. И, вдохновлённые, слагали стихи, из которых рождался этот великий город. Так появился известный порт на старой песчаной отмели Ареналь... #!"
 building_type_protector_caern_01:0 "Каэрн Защитника"
 building_type_protector_caern_01_desc:0 "#F Дом Сурового Воя завоевал этот каэрн двести лет назад у угасающей септы Фианна. Каэрн расположен в небольшой роще, вдали от человеческих поселений и в полудне ходьбы от Стоунхенджа.\nНесмотря на то, что его разделяют распри и политика, он остается самым сильным каэрном Серебряных Клыков на островах со времен падения каэрна Великой Реки в Лондоне.#!"
 building_type_red_cedar_01:0 "Каэрн Красного Кедра"
 building_type_red_cedar_01_desc:0 "#F Этот каэрн, построенный на месте решающей битвы с Джагглингом Дазбогом, сосредоточен вокруг ствола дерева, на котором было написано имя каждого павшего Гару. Это наследие делает его одним из немногих каэрнов, где живут несколько племен, поскольку здесь присутствуют все фракции, чтобы почтить память своих павших героев.#!"
 building_type_red_thermae_01:0 "Красные термы"
 building_type_red_thermae_01_desc:0 "#F Извращенное отражение классических бань, посвященных верным богине. Святилище тщеславия, соблазнения и удовольствия.#!"
 building_type_rock_three_kingdoms_01:0 "Скала Трех Королевств"
 building_type_rock_three_kingdoms_01_desc:0 "#F Этот каэрн представляет собой скалистое образование в Сьерра-дель-Марабоне. Издавна оно служило Гару местом, где они могли встречаться и преодолевать свои разногласия, а также помнить, что все мы в первую очередь служим Гайе. На этом месте племена ратифицировали множество договоров.#!"
 building_type_sanctum_st_james_01:0 "Святилище Святого Иакова"
 building_type_sanctum_st_james_01_desc:0 "#F В историях записано, что святой апостол Иаков, или Сантьяго, был казнен мечом Иродом Агриппой. Его останки были чудесным образом найдены в Галисии, на этом месте вырос растущий город Сантьяго-де-Компостела. Так возникло поклонение Апостолу по всей Европе, когда христиане путешествовали в Сантьяго по Дорогам Паломничества. Смертные, однако, оставались в неведении о растущем культе Ласомбра и Бруха, поклоняющихся Святому Иакову как святому покровителю крестоносцев-каинитов... #!"
 building_type_siberian_wilds_caern_01:0 "Каэрн Сибирских Дебрей"
 building_type_siberian_wilds_caern_01_desc:0 "#F Расположенное глубоко в арктическом северо-востоке, это место силы является домом для племени оборотней, пришедших издалека, места, еще не известного (или забытого) остальной частью Нации Гару.#!"
 building_type_silver_mines_baebelo_01:0 "Затерянные серебряные рудники Баэбело"
 building_type_silver_mines_baebelo_01_desc:0 "#F В древние времена карфагеняне эксплуатировали эти внутренние рудники по всей Сьерре, которые, как говорят, приносили Ганнибалу триста фунтов серебра в день. Расположенный среди пяти холмов, над побережьем, Карфаген-Нова стал их главным городом – и городом военачальника Бруха Изебели. Их время длилось недолго, и шахты перешли под управление римских Вентру. Но когда земля стала неровной, смертным стало трудно найти поверхностные жилы. Из-за затрат и нестабильности копать глубже было слишком дорого… Смогут ли каиниты вернуться и добиться успеха там, где смертные потерпели неудачу? #!"
 building_type_spirit_stone_01:0 "Каэрн Камня Духа"
 building_type_spirit_stone_01_desc:0 "#F Первый каэрн Уктена за пределами своих родных земель, расположенный в глухой деревне сибирской тайги. Несмотря на то, что его обитатели по-прежнему придерживаются изоляционистского подхода, они начали принимать гостей из племени Звездочётов. #!"
 building_type_st_brigid_01:0 "Церковь Святой Бригитты"
 building_type_st_brigid_01_desc:0 "#F Обитель сестёр Святого Иоанна в Ирландии — самая сильная база инквизиции на острове. Хотя Дублин по-прежнему остаётся предметом борьбы с приспешниками Дьявола, благие дела сестёр позволяют ему медленно, но неуклонно процветать.#!"
 building_type_suzhou_creek_caern_01:0 "Каэрн ручья Сучжоу"
 building_type_suzhou_creek_caern_01_desc:0 "#F Обитель Боли Зухизе сама по себе является мощным каэрном. Однако, изолированные и отвергнутые Дворами Зверей, они редко принимают гостей из других племён.#!"
 building_type_three_gorges_caern_01:0 "Каэрн Трёх Ущелий"
 building_type_three_gorges_caern_01_desc:0 "#F Этот каэрн Звездочетов известен своим гостеприимством по отношению к посторонним. Это сделало его де-факто местом решения проблем племени по всему Китаю, поскольку сюда часто можно обратиться за помощью извне.#!"
 building_type_thunderstrike_caern_01:0 "Каэрн Громового Удара"
 building_type_thunderstrike_caern_01_desc:0 "#F Этот каэрн Повелителей Теней известен своим боевым мастерством и, по крайней мере частично, посвящен Тифонскому аспекту Дедушки Грома. Он также известен своей враждебностью к Серебряным Клыкам.#!"
 building_type_tomb_el_cid_01:0 "Могила Эль Сида"
 building_type_tomb_el_cid_01_desc:0 "#F Родриго Диас де Вивар, также известный позже как Эль Сид, был великим капитаном Леона и Кастилии, которого надолго запомнили в памяти будущей Испании. Его уважали как враги, так и союзники, его военные подвиги, пренебрежение лояльностью и смена союзов привлекли к нему внимание даже клана Ласомбра. Его останки были захоронены в монастыре Сан-Педро-де-Карденья. Однако с течением времени его легенда стала больше, чем миф: он стал героем и иконой христианского единства, способным творить чудеса. Многие поклонники как среди смертных христиан, так и среди сторонников Теневой Реконкисты посещали могилу Эль Сида в надежде пойти по стопам героя… #!"
 building_type_tullu_demtu_01:0 "Каэрн Туллу Демту"
 building_type_tullu_demtu_01_desc:0 "#F Духи птиц и войны — обычное явление в этом каэрне. Охраняющие его Безмолвные Странники знают особый, уникальный для этого каэрна обряд, называемый Обрядом Глаза $glossary_luna$. С его помощью смотрящий со скалистых выступов этого горного каэрна может увидеть невероятные расстояния.#!"
 building_type_underground_forum_caern_01:0 "Каэрн Подземного форума"
 building_type_underground_forum_caern_01_desc:0 "#F Этот каэрн, спрятанный под древним (и забытым) Лугдунумом, находится в точке соединения нескольких силовых линий значительной силы. #!"
 building_underground_forum_caern_01:0 "Каэрн Подземного форума"
 building_underground_forum_caern_01_desc:0 "$building_type_underground_forum_caern_01_desc$"
 increased_fera_fertility_desc:0 "Дети [GetTrait('kinfolk').GetName(GetNullCharacter)] всегда станут $glossary_fera$, когда вырастут."
 tomb_of_el_cid_discount_desc:0 "Могила Эль Сида"
