 rioting_city_modifier:0 "Общегородские беспорядки"
 rioting_city_modifier_desc:0 "Ваши действия возмутили население"
 salubri_saulots_plans_decision:0 "Планы Саулота"
 salubri_saulots_plans_decision.second_step:0 "Его план состоял в том, чтобы..."
 salubri_saulots_plans_decision.tt.healer_route:0 "Успокойте то, что спит"
 salubri_saulots_plans_decision.tt.healer_route_desc:0 "Иерусалим охватила тьма и безумие, зло, пробужденное недавними событиями. Если бы их снова убаюкали, возможно, мир вернулся бы в это беспокойное место, и земля могла бы начать исцеляться."
 salubri_saulots_plans_decision.tt.warrior_route:0 "Уничтожить порчу"
 salubri_saulots_plans_decision.tt.warrior_route_desc:0 "Тёмные сущности скрываются под Иерусалимом. Хотя сами они вне нашей досягаемости, мы могли бы уничтожить пятерых вампиров, запятнанных их влиянием, которые теперь известны только по числу, которое они повторяют бесконечно. Без сомнения, порча со временем вернется, но на какое-то время она даст нам покой."
 salubri_saulots_plans_decision.tt.watcher_route:0 "Украсть из тьмы"
 salubri_saulots_plans_decision.tt.watcher_route_desc:0 "Что-то дремлет под Иерусалимом, оказывая свое влияние на смертных и даже на вампиров. Инферналисты Баали и безумные Малкавианы кажутся особенно затронутыми и заинтересованными, поэтому они могут иметь некоторые ключи к разгадке более глубоких тайн. Мы могли бы найти гораздо лучшее применение этим секретам и силам."
 salubri_saulots_plans_decision_confirm:0 "Его планы осуществятся"
 salubri_saulots_plans_decision_desc:0 "Несмотря на усилия узурпаторов, у нашего основателя Саулота было много планов и намерений. По причинам, которые никто из нас не понял, многие из них касались Иерусалима. Возможно, именно темное Присутствие, спящее неподалеку, привлекло его внимание. Возможно, это была религиозная мания, охватившая этот регион. Возможно, это был его вечный поиск центра мира, точки, вокруг которой, казалось, вращались все события и кружилась вся политика. Возможно, он нашел его в Иерусалиме, на землях, которым поклонялись многие, недалеко от многих других больших и важных городов. Несмотря на это, у нас есть потенциал достичь одной из его целей и получить вознаграждение, которое он искал."
 salubri_saulots_plans_decision_requirement_baali:0 "Вы захватили как минимум #V 3#! [GetTrait('baali').GetName( GetPlayer )]."
 salubri_saulots_plans_decision_requirement_baali_alt:0 "Вы захватили как минимум #V 1#! [GetTrait('baali').GetName( GetPlayer )]."
 salubri_saulots_plans_decision_requirement_freed:0 "[GetTitleByKey('c_jerusalem').GetName] #bold не#! имеет модификатора [GetModifier('freed_from_taint_modifier').GetNameWithTooltip]"
 salubri_saulots_plans_decision_requirement_malkavian:0 "Вы захватили как минимум #V 5#! [GetTrait('malkavian').GetName( GetPlayer )]."
 salubri_saulots_plans_decision_requirement_malkavian_alt:0 "Вы захватили как минимум #V 3#! [GetTrait('malkavian').GetName( GetPlayer )]."
 salubri_saulots_plans_decision_requirement_not_already_done:0 "Вы ещё #bold не#! выполнили $salubri_saulots_plans_decision.tt.watcher_route$"
 salubri_saulots_plans_decision_requirement_prowess:0 "Ваш [GetPlayer.Custom('PODCoterie')] должен иметь не менее 125 [prowess|E]."
 salubri_saulots_plans_decision_requirement_prowess_alt:0 "Ваша группа ([GetPlayer.Custom('PODCoterie')]) должна иметь не менее 75 [Concept('prowess', 'доблести')|E]"
 salubri_saulots_plans_decision_requirement_regiment:0 "[GetTitleByKey('b_jerusalem').GetName] имеет дислоцированный полк [men_at_arms|E]."
 salubri_saulots_plans_decision_requirement_soothed:0 "[GetTitleByKey('c_jerusalem').GetName] #bold не#! имеет модификатора [GetModifier('soothed_mania_modifier').GetNameWithTooltip]"
 salubri_saulots_plans_decision_tooltip:0 "У Саулота был план относительно Иерусалима. Мы должны завершить его, каким бы он ни был."
 setites_corrupt_hunters_decision:0 "Тихая спираль змеи"
 setites_corrupt_hunters_decision_confirm:0 "Добро пожаловать, мои братья"
 setites_corrupt_hunters_decision_desc:0 "Охотники уже давно беспокоят нас, укрепляя тюрьму, построенную Эонами Ра, и истребляя тех, кто пытался из нее сбежать. Они очень отчаянно нуждаются в так называемом \"одобрении Бога \". \n\nМы могли бы воспользоваться необычным безумием вокруг Иерусалима и использовать его значение как святого места, чтобы перенаправить пыл этих Охотников. Некоторые из них уже принимают магию и обещают своим членам множество глубоких тайн. Мы можем просто вставить еще несколько \"освобождающих\" идей, перенаправить их тайны на Сета и проникнуть в их причудливые \"ячейки\". Вскоре их фанатизм и оружие послужат Сету."
 setites_corrupt_hunters_decision_effect:0 "$POD_splat_hunter_plural$ перестанут воспринимать вампиров, особенно сетитов, как непримиримых врагов. Вместо этого вас будут воспринимать как ангелов, пророков, чудотворцев и святых."
 setites_corrupt_hunters_decision_holy_city_constantinople_requirement_tooltip:0 "Вы должны контролировать город и обратить его жителей [GetTitleByKey('c_byzantion').GetNameNoTier], поскольку это ключевое святое место авраамических верований, что увеличивает ваше влияние на охотников."
 setites_corrupt_hunters_decision_holy_city_jerusalem_requirement_tooltip:0 "Вы должны контролировать город и обратить его жителей [GetTitleByKey('c_jerusalem').GetNameNoTier], поскольку это ключевое святое место авраамических верований, что увеличивает ваше влияние на охотников."
 setites_corrupt_hunters_decision_holy_city_mecca_requirement_tooltip:0 "Вы должны контролировать город и обратить его жителей [GetTitleByKey('c_mecca').GetNameNoTier], поскольку это ключевое святое место авраамических верований, что увеличивает ваше влияние на охотников."
 setites_corrupt_hunters_decision_holy_city_rome_requirement_tooltip:0 "Вы должны контролировать город и обратить его жителей [GetTitleByKey('c_roma').GetNameNoTier], поскольку это ключевое святое место авраамических верований, что увеличивает ваше влияние на охотников."
 setites_corrupt_hunters_decision_tooltip:0 "Охотники тратят столько ресурсов на своего так называемого \"Бога\" — ресурсов, которые лучше послужили бы целям Сета."
