 within_lands_of_faith_modifier_desc:0 "Энергия Земель Веры теперь течет через это место, позволяя тем, кто обладает соответствующими знаниями, подключиться к ней. \n #help Этот модификатор не означает, что вам нужно контролировать это графство для целей, ссылающихся на [GetGeographicalRegion('pod_lands_of_faith').GetName]#!"
