 jerusalem_recover_ark_covenant_decision:0 "Возвращение Ковчега"
 jerusalem_recover_ark_covenant_decision_confirm:0 "Он снова будет покоиться во Святом Святых!"
 jerusalem_recover_ark_covenant_decision_desc:0 "\"Тогда священники перенесли ковчег завета Господня на его место во внутреннем святилище дома, во Святом Святых, под крыльями херувимов. Ибо херувимы распростерли крылья свои над местом ковчега, так что херувимы осенили ковчег и шесты его. И шесты были так длинны, что концы шестов были видны из святилища перед внутренним святилищем; но их нельзя было увидеть снаружи. И они там по сей день. В ковчеге не было ничего, кроме двух каменных скрижалей, которые Моисей положил туда на Хориве, где Господь заключил завет с народом Израилевым, когда они вышли из земли Египетской.\"\n\nГоре горестей, ибо Святое Святых должно быть восстановлено, и Ковчега уже нет. Эту трагедию необходимо исправить, если мы хотим восстановить Храм."
 jerusalem_recover_ark_covenant_decision_effect:0 "Начните квест по возвращению Ковчега Завета."
 jerusalem_recover_ark_covenant_decision_tooltip:0 "Потеря Ковчега является одной из величайших трагедий и препятствует полной реконструкции Храма. Эту трагедию необходимо исправить."
