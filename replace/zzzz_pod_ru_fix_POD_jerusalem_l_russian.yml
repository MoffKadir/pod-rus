 court_chaplain_task_expand_lands_of_faith_modifier_people_desc:0 "Умы людей в регионе страдают от магической реакции на интеграцию этого региона в Земли Веры."
 demons_temptation_revelry_decision:0 "Наслаждайтесь своей порочностью"
 demons_temptation_revelry_decision_confirm:0 "Все будут служить мне!"
 demons_temptation_revelry_decision_desc:0 "По мере того, как вы глубже осознаете свою греховную развращенность, психическое эхо распространяется среди населения, окружающего Иерусалим, соблазняя их отправиться в такие же глубины. Каждый грех становится поклонением вашему славному величию. Каждое падение усиливает вашу власть над этой так называемой Святой Землей. Со временем они узнают вашу истинную силу и назовут это место его подлинным именем, которое будет почитать вас должным образом: Адская Земля."
 demons_temptation_revelry_decision_effect:0 "Если у цели \"$POD_read_the_heart_interaction$\" [character_interaction|E] есть [trait|E], соответствующее #bold любому#! греху, этот персонаж примет вашу [faith|E]"
