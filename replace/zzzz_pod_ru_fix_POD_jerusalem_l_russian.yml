 POD_jerusalem.50.a:0 "Мы не можем жалеть денег!"
 POD_jerusalem.50.b:0 "Соберите ученых!"
 POD_jerusalem.50.c:0 "Он оставался скрытым на протяжении веков. Можно не торопиться."
 POD_jerusalem.50.desc:0 "Бесчисленные легенды окружают Ковчег Завета, и даже время его исчезновения точно не известно, последнее достоверное упоминание относится к во времена царя Йошийи. После смерти царя ни одна из наших записей не упоминает Ковчег в храме Соломона; не было его ни в храме Зоровавеля, ни в храме Ирода. Был ли он украден вавилонянами и увезён их войсками домой, выставлен напоказ в храмах ложным богам? Был ли он продан Египту одним из наших неверных царей и в конечном итоге попал на Оловянные острова? Правду ли говорит сомнительная Вторая книга Маккавеев, что пророк Йирмейя спрятал ковчег на горе Нево? А как насчет наших заблудших братьев среди самаритян, которые верят, что Ковчег спрятан на горе Гаризим? Правы ли христиане в том, что сын царицы Савской от Соломона взял ковчег с собой в Эфиопию? Возможно, правдива другая история. \n\nЕсли мы хотим найти Ковчег, сначала мы должны определить, какие легенды указывают путь."
 POD_jerusalem.50.t:0 "Поиск: исследование слухов"
 POD_jerusalem.51.a:0 "Другого выбора нет."
 POD_jerusalem.51.b:0 "Магия облегчит поиск."
 POD_jerusalem.51.desc:0 "Мы нашли истину через труды Моше бен Маймона, более известного как раввин Маймонид. В своей мудрости царь Соломон предвидел время, когда дети Авраама снова повернутся спиной к Б-гу и тем самым навлекут на себя Его гнев и разрушение Его дома среди них, Храма. Поэтому он приказал демонам, которых он связал, построить под Храмом своды, похожие на лабиринт, в которых можно было бы поместить Ковчег, чтобы он не потерялся, как это было раньше во времена судьи Илия. Как написано, царь Иосия велел левитам поставить Священный ковчег в палату, построенную Соломоном, защитив тем самым его от вавилонян. Во времена Зоровавеля тайник Ковчега был открыт, но место его было сокрыто Б-гом, ибо подходящее время еще не пришло. Ибо, как сказано, \"Однажды, когда священник во втором Храме увидел плиту мощёного пола, отличавшуюся от остальных, он понял, что в этом месте есть вход в подземный туннель, и поделился этим с другом. Прежде чем он успел закончить рассказ, он умер. Тогда они точно знали, что это было то место, где спрятан Ковчег. \"\n\nХотя Ковчег может покоиться под Храмовой горой, здесь находится бесчисленное множество пещер, многие из которых запечатаны или потеряны с тех пор. Без масштабных раскопок на всей территории будет практически невозможно обнаружить хранилища Соломона."
 POD_jerusalem.51.t:0 "Поиски: Великие раскопки"
 POD_jerusalem.52.a:0 "Атаковать с двух флангов и окружить противника"
 POD_jerusalem.52.b:0 "Выполните притворное отступление, чтобы выманить их."
 POD_jerusalem.52.c:0 "Сосредоточить войска для прорыва в центре"
 POD_jerusalem.52.d:0 "Поручить большинству молиться, а в бой отправить лишь малую часть"
 POD_jerusalem.52.desc:0 "Проломив множество каменных стен, вы столкнетесь с почти непреодолимым барьером, который не поддаётся ни инструментам, ни магии. Копая вокруг него, вы обнаруживаете небольшой и идеально круглый барьер, сделанный из камня, цвет которого немного отличается от цвета окружающей его скалы, цвета, который простирается в углах вашего зрения, цвета, который растекается в воздухе, цвета за гранью понимания, но в то же время совершенно естественного. Существует только одно несовершенство, одна дверь, ведущая внутрь. \n\nОткрывая дверь и проходя через нее, вы оборачиваетесь и видите, что никто больше не может пройти через нее, и каждый натыкается на невидимую стену. Понимая, что это вызов, с которым вам придется столкнуться в одиночку, вы поворачиваетесь лицом к обширным залам, раскинувшимся перед вами, намного превосходящим то, что должно поместиться в этом пространстве. Ребристые своды поддерживают бесчисленные тонны камня и людей, проходящих наверху. Воистину, это хранилища, о которых говорится в Талмуде и Мишне. \n\nПобродив некоторое время, вы достигаете большого стола. На нем расположены небольшие статуи солдат с оружием и знаменами: несколько сотен со Звездой Давида и несколько тысяч с простым копьем. Инструкции на боковой стороне стола гласят, что как только битва начнется, вы сможете командовать своими войсками, и ваша цель — привести их к победе. Поэкспериментировав, вы обнаружите, что в настоящее время вы можете удалять и перемещать тех, кто несет звезду, что позволяет подготовиться до начала битвы. Битва будет происходить на равнинах, когда вы атакуете силы противника. Какую стратегию следует использовать, чтобы обеспечить победу?"
 POD_jerusalem.52.effect.failure:0 "Ваши силы подавлены"
 POD_jerusalem.52.effect.success:0 "Божественный свет уничтожает врага"
 POD_jerusalem.52.t:0 "Поиски: Великая битва"
 POD_jerusalem.53.a:0 "Голос первый"
 POD_jerusalem.53.b:0 "Голос второй"
 POD_jerusalem.53.c:0 "Голос третий"
 POD_jerusalem.53.desc:0 "Когда фигуры на столе исчезают, вы поднимаете глаза и видите троих мужчин, стоящих вокруг него. У каждого длинная, но ухоженная борода, все одеты в белое. Они почти неотличимы друг от друга, но вы быстро переключаете внимание, когда все трое начинают говорить одновременно. Несмотря на перекрытие голосов, они совершенно различны. \"Один из нас является представителем Господа, ибо Господь один. Задайте три вопроса, и каждый из нас ответит по очереди. Проверьте каждый ответ на уже данные слова, ибо Он сказал, и слово Его пребудет вечно. \" После тщательного рассмотрения вы выбираете три вопроса, которые, по вашему мнению, откроют истину. \n\nВы: \"Какое величайшее качество Б-га? \"\nГолос первый: \"Его святость проявляется через суд, как сказано: Г-сподь, наш Б-г, — огонь поядающий. \"\nГолос второй: \"Господь — Б-г; нет другого, кроме Него. Он хорош. Он свят. Он бесконечен. Он есть.\"\nГолос третий: \"Благодарите Г-спода, ибо Его непоколебимая любовь пребывает вовек. Неважно, что выходит за рамки его любви.\"\n\nВы: \"Что больше угодно Б-гу: жертва или послушание?\"\nГолос первый: \"Нам даны Десять заповедей, и несоблюдение их требует жертвы для исправления проступка.\"\nГолос второй: \" Имеет ли Г-сподь такое же удовольствие во всесожжениях и жертвах, как и в повиновении голосу Г-спода? Повиноваться лучше, чем жертвовать. \"\nГолос третий: \" Разве не написано: «Ибо я желаю стойкой любви, а не жертвы»? Ни жертва, ни послушание не нравятся ему. \"\n\nВы: \"Почему Б-г наказывает Свой народ? \"\nГолос первый: \" Разве он не сказал пророку Исаии: «Я, Господь, люблю справедливость; Я ненавижу грабеж и зло»? Они просто терпят Его гнев и возмездие. \"\nГолос второй: \"Как написано: «Знай же в сердце своем, что, как человек наказывает своего сына, так Г-сподь, Б-г твой, наказывает тебя». Любое наказание справедливо, и цель состоит в том, чтобы исправить и восстановить. \"\nГолос третий: \"Как отец проявляет сострадание к своим детям, так и Господь проявляет сострадание. Любая трудность — это всего лишь видимость. \"\n\nЗадав три вопроса, кто является представителем Господа?"
 POD_jerusalem.53.effect.failure:0 "Всегда следите за контекстом"
 POD_jerusalem.53.effect.success:0 "Мудрый выбор"
 POD_jerusalem.53.t:0 "Поиск: Его слово"
 POD_jerusalem.54.a:0 "Надеюсь, моей мудрости хватит."
 POD_jerusalem.54.desc:0 "Их заключительные слова все еще эхом разносятся по комнате, а их формы растворяются в пятнах света, которые кружатся вокруг, а затем сливаются в одно пятнышко, ярко сияющую точку. Затем точка расширяется и растет, приобретая размеры и руки, приобретая более гуманоидную форму. В конце концов перед вами возникает мужчина. Старость читается не в его облике, а в глазах, осанке и весомости его присутствия. Карие глаза сверкают на густо бородатом лице, на котором очень мало седины. Его одежды, такие светло-голубые, что почти белые, просты и домотканы, чистые, но старые, потертые, но надежные. \n\"Я — Ахикам из цадиков. Близкий друг поручил мне защитить самую драгоценную реликвию, переданную ему под опеку, ту, которую, как я подозреваю, вы ищете. \"\n\nОн изучает вас молча, взглядом, который видит гораздо больше и гораздо глубже, чем следовало бы. \n\"Я стоял на этой страже много дней и видел, как многие пытались найти вверенную мне святыню. Завоеватели, воображавшие себя избранными. Жрецы, принявшие ритуал за мудрость. Ученые, верившие, что любую тайну можно свести к чернилам на пергаменте. Некоторые пришли с чистыми сердцами, другие с эгоистическими амбициями. Каждый считал себя достойным там, где его предки не были. Каждый из них ошибался. Даже строительство новых храмов не давало им права вернуть то, что было потеряно, поскольку то, что действительно было потеряно, не было восстановлено. Ваш последний тест прост. Призовите все свои диалектические способности, все свои подвиги веры, все свои великие свершения и убедите меня.\""
 POD_jerusalem.54.effect.failure:0 "Как и многие другие..."
 POD_jerusalem.54.effect.success:0 "В твоих словах есть мудрость"
 POD_jerusalem.54.t:0 "Поиски: Сторож"
 POD_jerusalem.55.a:0 "Ковчег!"
 POD_jerusalem.55.a.tt:0 "Вы получите $artifact_pod_ark_of_covenant_name$."
 POD_jerusalem.55.desc:0 "Лицо Ахикама остается нечитаемым. Он ищет обман, отрицание или самообман. По прошествии долгого времени уголки его рта приподнимаются в легкой улыбке. \n\n\"Моему сердцу приятно видеть, что времена наконец изменились, что появился народ, который снова примет завет полностью и в истине, который восстановит храм, которым будет руководить праведный лидер. В течение бесчисленных поколений я оставался там, потому что порученное мне дело оставалось незавершенным. Теперь... теперь я могу пойти домой. Но прежде чем я уйду, знайте прежде всего следующее: Ковчег был сохранен, потому что людям нужны напоминания. Завет сохранился, потому что Бог не требовал напоминаний. Теперь это напоминание вновь может покоиться среди верующих. \"\n\nПрежде чем вы успеваете ответить, Ахикам поднимает одну открытую руку, на его лице появляется нежная улыбка. Свет исходит из его руки, поглощая комнату, стены, пол. На мгновение есть только сияние. Потом... люди. Вы снова стоите среди участников раскопок. Каменная стена, которая прежде преграждала путь, и дверь в ней исчезли. На их месте, вдали от того места, где к нему можно было случайно прикоснуться, стоит шкатулка из акации, любовно украшенная золотом. В четырёх кольцах у его основания закреплены два деревянных шеста. На крышке изображены два крылатых херувима."
 POD_jerusalem.55.t:0 "Поиски: возвращение ковчега"
 POD_jerusalem.56.a:0 "Нет!"
 POD_jerusalem.56.desc:0 "Лицо Ахикама остается нечитаемым. Спустя много времени он закрывает глаза и вздыхает. В его глазах не видно ни гнева, ни разочарования. Это просто меланхолия человека, чей долг еще не выполнен, человека, который бесчисленное количество раз был свидетелем одной и той же неудачи. \n\n\"Вы ответили, как и все остальные, с большой убежденностью. Вы накопили знания, разгадали тайны и преодолели невозможные расстояния. Однако Ковчег — это всего лишь символ и напоминание о завете. Вы не единственный, кого мне поручено испытать, и Ковчег — это не приз, полученный за преодоление трудностей. К сожалению, моя стража ещё не окончена. \"\n\nПрежде чем вы успеваете ответить, Ахикам поднимает открытую руку. Свет исходит из него наружу, поглощая комнату, стены, пол. На мгновение есть только сияние. Потом... камень. Снова оказавшись среди участников раскопок, вы видите только сплошную каменную стену."
 POD_jerusalem.56.t:0 "Поиски: Завет другого времени"
