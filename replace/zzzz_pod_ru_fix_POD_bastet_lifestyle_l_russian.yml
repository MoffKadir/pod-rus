l_russian:
 BLINDING_MOONBEAM_GAZE_PERK_EFFECT:0 "[PODUnlocksCombatMove('POD_combat_move_bastet_killers_leap')]\n\n#flavor Призвав Мать $glossary_luna_seline$, кот-оборотень выпускает из глаз яркие лучи лунного света. Они не наносят реального урона, но могут ослепить или отвлечь противника, а также обеспечить освещение.#!"
 FIST_OF_CAHLASH_PERK_EFFECT:0 "\n#flavor Направляя грубую разрушительную силу, разгневанный бастет может рыком уничтожить любую материальную вещь.#!"
 MOONS_GATEWAY_PERK_EFFECT:0 "[character_interaction|E]: открывает #V Открыть лунный мост#! для телепортации между Каэрнами. \n\n#flavor Призывая лунного духа на помощь, Бастет открывает Лунный Мост между Каэрнами или Царствами Логов. Врата формируются в виде светящегося тумана, который медленно принимает форму предполагаемого пункта назначения кота-оборотня.#!"
 MOON_SENSE_PERK_EFFECT:0 "[PODUnlocksCombatMove('POD_combat_move_bastet_revolt_of_land')]\n\n#flavor Медитируя на луже с лунным светом, Бастет может увидеть все, что происходит под сиянием $glossary_luna_seline$.#!"
 REDEEM_THE_WASTE_PERK_EFFECT:0 "\n#flavor Хомид может призвать целительную силу Гайи, чтобы обновить оскверненные области. Обнюхивая землю и настраиваясь на нее, он может передать ей часть своей исцеляющей силы.#!"
 WRATH_OF_NALA_PERK_EFFECT:0 "Открывает магию погоды #V Буря#! на уровне [duchy|E].\n\n#flavor Этот Дар вызывает свирепую бурю, опустошающую окрестности оборотня-кошки. Буря возникает из ниоткуда, а затем постепенно утихает и рассеивается.#!"
 blinding_moonbeam_gaze_perk_name:0 "Ослепляющий взгляд лунного луча"
 fist_of_cahlash_perk_name:0 "Кулак [Glossary('Кахлаша', 'glossary_wyrm_tt')]"
 moon_sense_perk_name:0 "Лунное чувство"
 moons_gateway_perk_name:0 "Лунные врата"
 redeem_the_waste_perk_name:0 "Исцеление пустоши"
 wrath_of_nala_perk_name:0 "Гнев Налы"
