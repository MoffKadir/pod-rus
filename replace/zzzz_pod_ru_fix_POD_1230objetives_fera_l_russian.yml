l_russian:
 fera_objective_decision_caern_tooltip:0 "У вас должен быть полностью модернизированный каэрн [duchy_building|E] любого типа."
 pod1230objectives_fera.62.a:0 "Белые завыватели возвращаются к Делу Геи."
 pod1230objectives_fera.62.desc:0 "До сих пор Белые завыватели были не чем иным, как затерянным племенем, павшим перед Вирмом и ставшим печально известными Танцорами Черной Спирали много веков назад. Никто не ожидал, что ронины Гару пиктского происхождения появятся и вернут себе давно утраченное наследие. \nНесмотря ни на что, они отправились в Умбру, ища знания у духов своих предков о своих павших братьях, одновременно выслеживая и уничтожая многих из своих испорченных родственников по всему миру, возвращая при этом исконные земли Пиктленда. В поддержку их усилий Лев явился как Инкарна и благословил их, снова став их Племенным Тотемом.\nТо, что большинство Гару считало невозможным, теперь, кажется, сбылось: Белые завыватели вернулись, маяк надежды для всей Нации Гару."
 pod1230objectives_fera.62.t:0 "Снова вой"
 pod1230objectives_fera.63.b:0 "Каким-то образом Белые завыватели вернулись..."
 pod1230objectives_fera.64.a:0 "С возвращением, дети Льва!"
 pod1230objectives_fera.64.b:0 "Обновлённый Лев предлагает мне покровительство!"
 pod1230objectives_fera.64.desc:0 "Падение Белых завывателей, пожалуй, самое разрушительное событие в истории Нации Гару, долгое время считалось чем-то, что невозможно исцелить. Бесчисленные экспедиции в Умбру и запросы к духам не дали никаких подсказок, и, по иронии судьбы, именно Враг сделал шаг, который сделал сегодняшнюю победу возможной. \nКрасный Круг обнаружил тюрьму Ткача Снов и увидел в ней источник силы, в дополнение к потенциальным разрушениям, которые могут возникнуть, когда они высвободят существо. Они мало знали и мало заботились о пойманных в ловушку духах Белых завывателей, которые давным-давно пожертвовали собой, чтобы ограничить Ткача Снов. Когда их нашли местные Гару, новости разнеслись по лунным мостам во все уголки Нации. Это была прекрасная возможность для выполнения уникального Поиска: победить могущественного слугу Вирма и одновременно потенциально спасти потерянных Завывателей. \n\nМногие стаи пытались или, по крайней мере, говорили о попытках, но могущественные и хорошо укоренившиеся культисты Красного Круга оказались слишком сильным противником. Именно ваша стая, наконец, бросилась в славную битву и вышла победителем, воя о своем триумфе Матери Гее.\n\nПока Аруны праздновали свою победу, а Гальярды записывали это событие, Теурги уже усердно работали над освобождением и выведением плененных духов Белых завывателей в безопасное место. Они хорошо выполнили свою работу, и героические Завыватели были встречены с распростертыми объятиями гордым духом Льва, который слишком стремился восстановить свое некогда славное племя с их помощью. \n\nКровь безумцев Красного Круга питает почву, Ткач Снов больше не представляет угрозы, и Затерянное Племя больше не потеряно. Это действительно славный день для Геи."
 whitehowler_objective_decision:0 "Снова вой"
 whitehowler_objective_decision_confirm:0 "Мы снова поддерживаем нацию Гару!"
 whitehowler_objective_decision_desc:0 "Наше племя считалось потерянным для $glossary_wyrm$, но ценой огромных усилий и с помощью духов мы можем его восстановить."
 whitehowler_objective_decision_effect_tooltip:0 "Получите доступ к наследию Белых завывателей для своей династии и станьте на шаг ближе к объединению Гару."
 whitehowler_objective_decision_tooltip:0 "Мы искупили свою вину перед Гайей."
 whitehowler_revival_objective_decision:0 "Вой Ткача Снов"
 whitehowler_revival_objective_decision_confirm:0 "За Гею! За Завывателей!"
 whitehowler_revival_objective_decision_desc:0 "Деятельность Красного Круга на озере Павин расширяется с каждым днем. О том, чтобы позволить им выпустить на волю Ткача Снов, не может быть и речи, но они сильны и хорошо укреплены. Если вы хотите одержать победу и, возможно, спасти пойманных в ловушку духов Белых завывателей, ваша атака должна быть хорошо подготовлена."
 whitehowler_revival_objective_decision_effect_tooltip:0 "Возрожденное племя Белых завывателей пришлет некоторых из своих наиболее многообещающих новых членов. Вы также получите возможность самому стать [GetFaithByKey('whitehowler').GetName]."
 whitehowler_revival_objective_decision_tooltip:0 "Могущественный враг, которого нужно победить, и старые друзья, которых нужно спасти."
 whitehowler_revival_objective_decision_valid_1:0 "Красный Круг с течением времени становится сильнее, и со временем вам потребуется как более высокое качество, так и количество [knights|E]. Следующее увеличение происходит в #V 1260#!."
