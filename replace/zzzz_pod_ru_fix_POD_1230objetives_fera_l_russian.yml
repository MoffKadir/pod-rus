 whitehowler_revival_objective_decision_valid_3:0 "Красный Круг с течением времени становится сильнее, и со временем вам потребуется как более высокое качество, так и количество [knights|E]. Следующее увеличение происходит в #V 1300#!."
 whitehowler_revival_objective_decision_valid_4:0 "Красный Круг с течением времени становится сильнее, и со временем вам потребуется как более высокое качество, так и количество [knights|E]. Следующее увеличение происходит в #V 1259#!."
 whitehowler_revival_objective_decision_valid_5:0 "Красный Круг с течением времени становится сильнее, и со временем вам потребуется как более высокое качество, так и количество [knights|E]. #N Это ваш последний шанс. #!"
