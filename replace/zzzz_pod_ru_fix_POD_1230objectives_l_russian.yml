l_russian:
 anda_final_decision:0 "Pax Anda"
 helenacult_custom_decision:0 "Ваша котерия должна быть полной и состоять из персонажей старше 1000 лет. Если указанными персонажами являются [GetScriptedCharacterByHistoryID('505071').GetFirstName], [GetScriptedCharacterByHistoryID('790353').GetFirstName], [GetScriptedCharacterByHistoryID('790284').GetFirstName], [GetScriptedCharacterByHistoryID('790592').GetFirstName] или [GetScriptedCharacterByHistoryID('790101').GetFirstName], они получат специальные награды."
 helenacult_custom_decision2:0 "Члены вашей котерии получат 5 очков дипломатии и интриг, когда они станут частью вашего нового пантеона. Если указанными персонажами являются [GetScriptedCharacterByHistoryID('505071').GetFirstName], [GetScriptedCharacterByHistoryID('790353').GetFirstName], [GetScriptedCharacterByHistoryID('790284').GetFirstName], [GetScriptedCharacterByHistoryID('790592').GetFirstName] или [GetScriptedCharacterByHistoryID('790101').GetFirstName], они получат дополнительные очки навыков в зависимости от их опыта."
 helenacult_custom_decision3:0 "#R Это решение является взаимоисключающим с решением «Разрушить ложных идолов». #!"
 helenacult_victory_objective_decision:0 "Пантеон Елены"
 helenacult_victory_objective_decision_confirm:0 "Новый Олимп."
 helenacult_victory_objective_decision_desc:0 "Вражда троянки и спартанца показывает, что никто не может быть по-настоящему в безопасности сам по себе, независимо от того, насколько он близок к божественности. В Греции было много богов, и пришло время сформировать новый пантеон, достойный повести бессмертных Детей Каина к их судьбе."
 helenacult_victory_objective_decision_tooltip:0 "Может ли Богиня действительно править в одиночку? Опыт показал, что это сложно."
 helenacult_victoryalt_objective:0 "Разбейте ложных идолов"
 helenacult_victoryalt_objective_confirm:0 "Осталась лишь одна."
 helenacult_victoryalt_objective_decision:0 "Апофеоз"
 helenacult_victoryalt_objective_decision_desc:0 "Божественность Елены всегда будет под угрозой, пока другие ложные боги и богини продолжают жить. Только положив им конец, можно обеспечить место истинного божества."
 helenacult_victoryalt_objective_decision_tooltip:0 "Только одна Богиня может править."
 helenacultalt_custom_decision1:0 "Ложные идолы [GetScriptedCharacterByHistoryID('505071').GetFirstName], [GetScriptedCharacterByHistoryID('790353').GetFirstName], [GetScriptedCharacterByHistoryID('790284').GetFirstName], [GetScriptedCharacterByHistoryID('790592').GetFirstName] и [GetScriptedCharacterByHistoryID('790101').GetFirstName] должны быть мертвы."
 helenacultalt_custom_decision2_tt:0 "Вы разблокируете заключительный этап истории Елены, соответствующий выбранному решению."
 helenacultalt_custom_decision3_tt:0 "#R Это решение является взаимоисключающим с «Пантеоном Елены». #!"
 own_four_illustrious_artifacts_tt:0 "Вы должны владеть как минимум четырьмя артефактами выдающейся редкости."
 pod1230objectives.1591.a.tt:0 "Для волшебства #V уровня 6#! [perks|E] не требуется никакого [journey|E]."
 pod1230objectives.176.g:0 "А вообще, давайте попробуем где-нибудь еще."
 pod1230objectives.230.a:0 "Теперь они все будут ясно видеть."
 pod1230objectives.230.desc:0 "До бессмысленной вражды Менелая против меня у меня было уважение, поклонение, власть и, что самое странное, даже союзники. Благодаря моей решающей роли в разгроме Карфагена многие враги этого проклятого города стали если не моими друзьями, то, по крайней мере, на какое-то время моими товарищами. Некоторые из них защитили меня от Менелая, но время, их собственные заботы и моя сосредоточенность на выживании заставили нас отдалиться друг от друга. \n Однако сегодня вечером все изменится. \n\n Безумный спартанец больше не преследует каждый мой шаг, и я могу смотреть на мир более внимательно, чем когда-либо в прошлые столетия. Существа, которые когда-то были старыми и могущественными, теперь стали мифами или пеплом на ветру. Именно мое поколение, наследники Греции, Рима и Средиземноморья, являются истинными силами этих ночей.\nПо мере того, как молодые вампиры боятся смертных и их мелкой церкви, трусливая концепция «Маскарада» берет верх. Но смертных не следует бояться, смертным нужно показать, что их вера в бессердечного и равнодушного бога неуместна. По Земле ходят истинные Боги и Богини, те, которые были молоды, когда Египет был стар, и теперь стары, когда христианский Бог еще молод. \n\nКолесо вращается, и я возвещу о рождении этого нового пантеона. Славный закат для Детей Каина, чтобы они вернули себе свое законное место, и славный рассвет для Детей Человеческих, чтобы они снова могли поклоняться прекрасным и ужасным Богам."
 pod1230objectives.230.desc.nothelena:0 "Елена когда-то была правительницей Аргоса и Помпеи. Хотя в те времена грань между правителем и богом была очень сильно размыта, особенно когда речь шла о таком совершенном существе. Но, поскольку в самой Греции было много богов, были и другие правители, достойные внимания или даже дружбы Елены. Особенно римские вампиры были благодарны ей за участие в очистке адской дыры, которой был Карфаген, и эта победа могла быть достигнута только благодаря сотрудничеству. \n\nЭто пример, которому мы следуем. Поскольку Церковь все больше и больше усложняет ситуацию для нашего рода, ночи, когда мы могли просто надеяться помочь каждому принять Елену как своего благодетеля, прошли. Нам нужен более широкий подход, собирающий бессмертных единомышленников, обладающих опытом и престижем, достаточными для создания нового пантеона. Когда указанный пантеон будет полностью установлен и власть Детей Каина снова укрепится над смертными, наш культ сможет процветать. \n\nПоскольку совершенная Верховная Богиня этого нового пантеона обязательно благословит нашу священную миссию, победа гарантирована."
 pod1230objectives.231.a:0 "Вознесение уже близко."
 pod1230objectives.231.desc:0 "Великая Елена, вы наконец сделали это. На протяжении веков кровь мира была разбавлена ​​высокомерными паразитами и ложными идолами. Они шествовали вокруг, уверенные в себе, крадя поклонение и обожание, которые по праву принадлежали вам. \n\nМитра, с полым солнцем, которое сжигало его. Аполлон, захлебнулся своим тщеславием. Анат, преследуемая как добыча. Артемида, павшая в бою. И, наконец, Камилла, цепляющийся за свою отчаянную манию величия. Все они низвергнуты, их прах доказывает их неполноценность.\n\nСыновья и дочери Елены с радостью прославляют ваше имя, и неверующие начинают видеть истину. Что есть только одна Богиня, прекрасная и ужасная в равной степени. \n\nНо, греясь среди своей бессмертной паствы, вы знаете, что ваша миссия еще не окончена. Есть еще один, последний, древний претендент. Последний идол, которого нужно сломать, как и остальных."
 pod1230objectives.231.desc.nothelena:0 "Ваша кровавая служба окончена. На протяжении веков мир был осквернен высокомерными древними, которые осмелились требовать поклонения, предназначенного только для Елены. Но теперь их издевательствам пришел конец. Вы доказали, что являетесь самым смертоносным и изысканным оружием истинной Богини. Благодаря вашей бессмертной преданности Елена оказалась выше мелких ссор остальных представителей вашего вида. Сыновья и дочери Елены восхваляют ее имя и шепчут ваше имя с почтением как того, кто помог ее вознесению. \n\nНочь принадлежит ей, и, соответственно, вам. Однако есть одна проблема, которая омрачает совершенство ее грандиозного замысла. Очистка еще не завершена. Где-то во тьме скрывается последний претендент. Ещё одно мнимое божество на пути вашей Богини, ожидающий вашего клинка."
 pod1230objectives.232.a:0 "Ее душа – единственный путь к вознесению."
 pod1230objectives.232.desc:0 "Елена, все самозванцы — прах, и их украденное поклонение принадлежит вам, как и должно быть. Но всякий раз, когда вы закрываете глаза, вы чувствуете сводящее с ума темное пятно, исходящее от другой, которой так давно поклонялись как Богине.\n\nАрикель. Иштар. Афродита. Прародительница клана Тореадор.\n\nПока она где-то дремлет, ваша божественность всегда будет привязано к другому существу. Арикель — постоянное напоминание о том, что вы достигли потолка своего проклятого существования. Чтобы быть настоящей Богиней, у вас не должно быть создателя. \n\nВы будете искать, где она прячется. Вы вытащите её из гробницы, вонзите зубы в её древние вены и заберёте из них красоту, силу и божественность. Только когда Арикель станет пылью, Елена станет абсолютной."
 pod1230objectives.232.desc.nothelena:0 "Когда ложные идолы исчезли, ночь принадлежит Елене Троянской. Но в самых темных тенях мира все еще сохраняется древнее присутствие. Арикель, существо, которое предшествовало даже вашей Богине. Мать Клана Розы.\n\nПока существует Арикель, притязания Елены на божественность будут постоянно подвергаться сомнению со стороны самой крови, текущей в ее венах. Высший акт преданности Ей ясен. Вы должны выследить древнюю до ее укрытия и совершить великий грех. \n\nСовершив Амарант к Иштар, вы вырвете эту древнюю силу из ее вен. Столь огромная и сокрушительная сила будет в ваших венах, угрожая разорвать вас на части, чтобы превратить вас в величайший инструмент воли Елены. Вы должны завладеть кровью Богини Шумера, чтобы ваша собственная могла свободно править вечно."
 pod1230objectives.233.a:0 "Мы вступаем в ее объятия."
 pod1230objectives.233.desc:0 "Поиск любого другого Прародителя обычно является смертным приговором. Арикель, однако, не похожа ни на кого другого. Ходят слухи, что она может приветствовать решительных гостей не с клыками, а с распростертыми объятиями, если вы подойдете с почтением, а не с насилием. \n\nХорошо, что вы обращаетесь только к ней за советом. \n\nПутешествие оказывается на удивление легким. Вместо того, чтобы сталкиваться с ловушками, препятствиями и смертоносными стражами, вы и ваш Пантеон чувствуете тонкое притяжение, ведущее вас к Средиземноморью и в долину, скрытую глубоко в греческой глуши. Когда вы и ваши союзники приближаетесь к удивительно ухоженному храму, воздух начинает меняться. Вы готовитесь к сокрушительной тяжести допотопной. \n\nВместо этого ощущение, охватывающее вас, странно теплое. Нежная, опьяняющая аура, мгновенно усыпляющая Зверя внутри вас. Это не ловушка, а любящие объятия."
 pod1230objectives.233.t:0 "В поисках богини"
 pod1230objectives.234.a:0 "Мы ищем вашего руководства..."
 pod1230objectives.234.desc:0 "Вы и ваш Пантеон входите в древний храм, и она уже там, ожидая вас. \n\nВы не можете по-настоящему описать ее. Смотреть на Иштар — все равно, что смотреть на солнце; физическая боль, вызванная ослепляющим эстетическим совершенством, которое подавляет ваши чувства, кровавые слезы наворачиваются на глаза от чистой красоты. Униженные величием ее существования, остальная часть вашего Пантеона падает на колени рядом с вами. Вы тоже не сможете этому сопротивляться. \n\nПриветствие Арикель просто существует. Она не приоткрывает губ, чтобы что-то сказать, но вы отчетливо чувствуете ее намерения с теплотой, расцветающей в вашем разуме и душе, когда ее безусловная привязанность достигает всех вас. Глубоко вздохнув, вы рефлекторно боретесь с желанием просто склонить голову и греться в её присутствии до скончания времён. Вы не путешествовали так далеко, чтобы поклоняться ей. Собрав все силы, вы поднимаете голову и готовитесь попросить Танцовщицу с быками о том самом, что привело вас сюда: поделиться своей мудростью."
 pod1230objectives.234.t:0 "Внутреннее святилище"
 pod1230objectives.235.a:0 "Мы воплощаем рыцарскую доблесть и грацию."
 pod1230objectives.235.b:0 "Мы — изысканный яд, мастера декаданса."
 pod1230objectives.235.c:0 "Мы — божественные идолы, созданные для того, чтобы управлять массами."
 pod1230objectives.235.d:0 "Мы — величайшие покровители искусств."
 pod1230objectives.235.desc:0 "В тот момент, когда вы заканчиваете говорить, ее молчаливое присутствие направляет ваши мысли внутрь себя, в историю, покоящуюся в вашей крови. Вы чувствуете, как вас накрывает волна воспоминаний, и задаетесь одним вопросом. \n\nВ чем суть Розы? На заре цивилизации Иштар правила Шумером как Богиня, как и вы пытались это сделать. Когда Рим возвысился и поддался приятному упадку, Розы были в центре этого процесса, бесстыдно потворствуя своим желаниям. Теперь, в этот век стали, они выступают как образцы, блестящий пример рыцарской добродетели и рыцарства. \n\nВы просто вечные хамелеоны, без особых усилий имитирующие человеческие парадигмы? Есть ли что-то настоящее и прекрасное под этой тщеславной внешней оболочкой? \n\nАура Арикель снимает все слои гордости и тщеславия, и вы, наконец, понимаете, что в этом есть глубокая правда. Затем впервые произнесенные слова сорвались с губ Арикель. \n\n#color:{0.75,0,0};glow_color:{0.75,0,0} \"Что такое Клан Тореадор?\" #!"
 pod1230objectives.235.t:0 "Зеркало веков"
 pod1230objectives.236.a:0 "Мир – это наше полотно."
 pod1230objectives.236.desc:0 "Арикель слышит вашу правду, и вы чувствуете, как наступает тишина, пока ее древний разум взвешивает ваш ответ. Затем тишина нарушается, и эйфорическое тепло возвращается. Она не улыбается, но вы чувствуете, как вас охватывает ощущение ее глубокого одобрения. Кажется, что витэ в ваших венах становится горячим, но это успокаивающее ощущение. Такое ощущение, будто шедевр наконец-то реализован. Арикель передает свою мудрость не словами, а самой кровью. Вы и ваша бессмертная котерия ощутите внезапную ясность, когда выбранный вами путь прояснится. \n\nТеплая аура, окутывающая вас, начинает тускнеть, совершенство Афродиты тускнеет, когда ее связь с вами мягко исчезает. \n\n#color:{0.75,0,0};glow_color:{0.75,0,0} \"Сделайте ночь своим шедевром»."
 pod1230objectives.236.t:0 "Шедевр, реализованный"
 pod1230objectives.237.a:0 "Заново выкован в огне."
 pod1230objectives.237.desc:0 "Сама земля дрожит под вашими ногами, когда великие кузницы с ревом снова оживают после столетий молчания. Холодный, спертый воздух гор исчез, его сменил знакомый ад. Для любого другого $pod_cainite$ это пламя вызвало бы бессмысленный ужас. И все же старейшины нашей родословной непоколебимо стоят перед печами. \n\nВаш вид всегда был един с этой горой, само существование закалялось в таком огне. Горячий воздух кажется вам знакомым, а не враждебным. \n\nМладшие Эрки вздрагивают и отступают в страхе, их Звери скулят от дискомфорта. Пока они держатся в тени, но вскоре научатся принимать его. Они должны.\n\nВскоре раздается оглушительный хор молотов, ударяющих по наковальням, создавая мелодию искусных доспехов и оружия. Эрки больше не являются напуганными изгнанниками, скрывающимися во тьме. Пусть Степи услышат звук нашей промышленности!"
 pod1230objectives.237.t:0 "Эргенекон просыпается"
 secrethunt_objective:0 "Увядающая роза"
 secrethunt_objective_confirm:0 "Пришло время положить этому конец."
 secrethunt_objective_decision:0 "Экзальтация"
 secrethunt_objective_decision_desc:0 "Последняя фигура стоит на пути к божественности. Осмелитесь ли вы бросить им вызов?"
 secrethunt_objective_decision_tooltip:0 "Последнее препятствие."
 secrethunt_objective_tt:0 "Вы попытаетесь избавиться от последнего препятствия на вашем пути к божественности. Будьте готовы. \n\n#color:{0.75,0,0};glow_color:{0.75,0,0} У розы есть шипы, и второго шанса у вас не будет#!."
 secrettalk_objective:0 "Найдите розу"
 secrettalk_objective_confirm:0 "Вы нас слышите?"
 secrettalk_objective_decision2:0 "Распространяйте свой культ, собирайте редкие артефакты, помогайте своей пастве развиваться, и вы сможете доказать, что достойны аудиенции у Розы."
 secrettalk_objective_decision_desc:0 "В нашей истории была одна выдающаяся личность, которая сделала то, чего мы пытаемся достичь. Поистине древняя каинитка, когда-то правившая Шумером как богиня. Если бы мы могли найти ее, получить аудиенцию, кто знает, какую информацию мы могли бы получить?"
 secrettalk_objective_decision_tooltip:0 "Я должен ее найти."
 toreador_house_court_positions_tt:0 "Представитель каждого крупного [house|E] клана Тореадор должен занимать хотя бы одну [court_position|E] в вашей державе. Требуемые дома: [GetDynastyHouseByID('house_nephilim').GetName], [GetDynastyHouseByID('house_salianna').GetName], [GetDynastyHouseByID('house_callisti').GetName], [GetDynastyHouseByID('house_andrew').GetName], [GetDynastyHouseByID('house_helena').GetName] и [GetDynastyHouseByID('house_apollo').GetName]."
