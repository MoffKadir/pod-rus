 the_krofted_way_objective_decision_desc:0 "Старые способы умирают. Природа будет постепенно оставлена ​​человечеством в погоне за властью и влиянием. Чтобы выжить и процветать, мы должны интегрироваться в человечество и стать новым элементом человечества! \n\nЭто единственный путь к спасению!"
