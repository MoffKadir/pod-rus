 elemental_ascension_objective_decision_desc:0 "[GetTrait('fae').GetName(GetPlayer)] — это почти духи природы, но не совсем. Среди фейри они наиболее близки к чистым стихиям, но некоторые [GetTrait('fae').GetName(GetPlayer)] считают это «несовершенство» в слиянии со стихией недостатком, который нужно исправить. \n\n По-настоящему думая и действуя как стихия, [GetTrait('fae').GetName(GetPlayer)] может стать совершенным!"
