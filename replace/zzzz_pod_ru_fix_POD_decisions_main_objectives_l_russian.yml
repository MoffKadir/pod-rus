 the_peace_of_making_objective_decision_desc:0 "Рукотворные ошибаются. Чтобы отсрочить Долгую Зиму, мы должны не отказываться от природы ради человечества, а оттеснить человечество и заставить его вернуться к природе! Первый шаг — очистить [GetTrait('fae').GetName(GetPlayer)] от рукотворных и наконец объединиться под единым знаменем стихий!"
