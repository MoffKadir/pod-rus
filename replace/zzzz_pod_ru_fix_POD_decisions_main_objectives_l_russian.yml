 the_middle_way_objective_decision_desc:0 "По своей сути мы все являемся Неодушевлёнными. Мы все выбираем связь с природой или человечеством, и все мы по какой-то причине ведем себя так, как будто мы превосходим других. Чтобы выжить и процветать, мы не можем просто слепо следовать за будущим или полностью отказаться от традиций. Человечество здесь, чтобы остаться, а природа — для того, чтобы они могли питаться. Одно не может выжить без другого, так почему мы притворяемся иначе? Мы должны объединиться как Неодушевлённые, хранить традиции в своих сердцах и идти вперед. Мы будем процветать с обеих сторон!"
