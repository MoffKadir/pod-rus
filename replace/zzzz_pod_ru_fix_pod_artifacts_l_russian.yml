l_russian:
 artifact_braddock_9mm_name:0 "Braddock 9 mm"
 artifact_brokk_17c_name:0 "Brokk 17c"
 artifact_defaced_seal_description:0 "Тяжёлая нефритовая печать, некогда принадлежавшая танскому чиновнику, который обращался с народом Иду как с ничего не стоящими рабами. На печати вырезано изображение вороны, а некогда яркий нефрит покрыт засохшей кровью."
 artifact_defaced_seal_name:0 "Испорченная императорская печать"
 artifact_hollow_guard_description:0 "Искусно изготовленный красно-золотой ламеллярный доспех. Пластины и ремни намеренно ослаблены или смещены так, чтобы броня ничем не могла защитить владельца: словно он сам зовёт смерть."
 artifact_hollow_guard_name:0 "Мнимая защита"
 artifact_jaegerspas_xv_name:0 "Jaegerspas XV"
 artifact_lassiter_killmatic_name:0 "Lassiter Killmatic"
 artifact_leabhar_gabhala_description:0 "Смертным известна совсем другая версия этой книги под названием «Книга захватов Ирландии». Здесь же изложена подлинная, по мнению оборотней, история острова — от фоморов и Туата до Фианна."
 artifact_leabhar_gabhala_name:0 "Книга захватов Ирландии"
 artifact_monthly_piety_10_modifier:0 "Дополнительное ежемесячное [piety|E]"
 artifact_pod_ark_of_covenant_description:0 "#bold Вы можете использовать $POD_ha_wrath_of_god_interaction$ [interaction|E], даже не открыв соответствующее достоинство.#!\n#bold Если достоинство уже открыто, это [interaction|E] больше не требует благочестия.#!\n$artifact_sculpture_ark_of_covenant_description$ Он раздвигал воды Иордана, обрушивал стены Иерихона, поражал непочтительных и карал воров.\n\nВозвещает ли его возвращение начало новой эпохи — или лишь очередной виток древнего круга?"
 artifact_pod_ark_of_covenant_name:0 "$artifact_sculpture_ark_of_covenant_name$"
 artifact_stained_ledger_description:0 "Подробная счётная книга в кричащей золотой обложке. Баян может прикидываться весёлым дураком, но эти записи доказывают, что он умеет учитывать каждую монету. На некоторых страницах виднеются пятна вина и засохшие капли витэ, похожие на слёзы."
 artifact_stained_ledger_name:0 "Заляпанная счётная книга"
 artifact_steyr_aug_name:0 "Steyr AUG"
 artifact_twin_talons_description:0 "Два безупречно сбалансированных, мастерски выкованных клинка. Иду заказал их специально для стремительного и безжалостного боевого стиля Чисиня."
 artifact_twin_talons_name:0 "Парные когти"
 artifact_utica_m37_name:0 "Utica M37"
 slepnirs_shoes_description:0 "Железные подковы, выкованные в честь восьминогого скакуна Всеотца и чёрные, как шерсть самого Слейпнира. Они даруют коню неутомимость и скорость, а его шкуру делают стойкой к стрелам."
 slepnirs_shoes_name:0 "Подковы Слейпнира"
 sword_of_recompense_description:0 "Творение Ада, которое появляется воткнутым в землю перед тем, кто только что потерял близкого по чужому злому умыслу. Клинок принимает форму, наиболее удобную владельцу, и украшен изображениями крылатых змей. Пока месть не свершится, меч пожирает души тех, кому отомстили, питая себя и своего хозяина."
 sword_of_recompense_name:0 "Меч возмездия"
 valkyries_barding_description:0 "Доспех из толстых пластин варёной кожи, скреплённых стальными кольцами с рунами войны, силы и защиты. Он достаточно лёгок, чтобы не стеснять коня и всадника, и достаточно прочен, чтобы отразить клинок и стрелу. Благословение переходит лишь к наследнику тех, кто славно пал в бою: имена предков связаны с ремнями сбруи."
 valkyries_barding_name:0 "Конский доспех валькирии"
