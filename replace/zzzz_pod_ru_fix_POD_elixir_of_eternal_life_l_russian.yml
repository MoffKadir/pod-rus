l_russian:
 POD_CHANGE_CHARACTER_EOEL_DIY_FORCE_ADD:0 "Вы #P получаете #! $VALUE|0V$ экспериментальные знания"
 POD_CHANGE_CHARACTER_EOEL_DIY_FORCE_SUBTRACT:0 "Вы #N теряете#! $VALUE|0V$ Экспериментальные знания"
 POD_CHANGE_CHARACTER_EOEL_WK_FORCE_ADD:0 "Вы #P получаете#! $VALUE|0V$ ед. военной мощи"
 POD_CHANGE_CHARACTER_EOEL_WK_FORCE_SUBTRACT:0 "Вы #N теряете#! $VALUE|0V$ ед. военной мощи"
 POD_CHANGE_OPPOSITION_EOEL_DIY_FORCE_ADD:0 "Вы #N получаете#! $VALUE|0V$ Необходимые экспериментальные знания"
 POD_CHANGE_OPPOSITION_EOEL_DIY_FORCE_SUBTRACT:0 "Вы #P теряете#! $VALUE|0V$ Требуемые экспериментальные знания"
 POD_CHANGE_RIVALS_EOEL_WK_FORCE_ADD:0 "Ваши соперники #N приобретают #! $VALUE|0V$ военную мощь"
 POD_CHANGE_RIVALS_EOEL_WK_FORCE_SUBTRACT:0 "Ваши соперники #P теряют #! $VALUE|0V$ Военную мощь"
 POD_eoel_bao_zhong_boon_modifier:0 "Дар Бао Чжуна"
 POD_eoel_bao_zhong_boon_modifier_desc:0 "Владыка Ада Неугасимой Скорби помнит многое: он один из четырёх Ван Сянь, избежавших проклятия Августейшего Нефритового Императора."
 POD_eoel_danoru_ka_boon_modifier:0 "Дар Данору Ка"
 POD_eoel_danoru_ka_boon_modifier_desc:0 "Владыка Вечно Тёмной Пещеры поработил множество существ и создал немало надсмотрщиков, чтобы завершить свой туннель. О том, куда он ведёт, ходят самые разные догадки..."
 POD_eoel_dokhor_khan_boon_modifier:0 "Дар [Glossary('Дохор-хана','podgloss.dokhorkhan')]"
 POD_eoel_dokhor_khan_boon_modifier_desc:0 "Повелитель [Glossary('Ада шипастых цепей','podgloss.hellspikedchains')] достиг своей власти, сокрушая все, что стояло перед ним, часто совершенно безрассудно."
 POD_eoel_emmao_boon_modifier:0 "Дар [Glossary('Эмма-О','podgloss.emmao')]"
 POD_eoel_emmao_boon_modifier_desc:0 "Владыка [Glossary('Какури','podgloss.kakuri')] в совершенстве владеет искусством обмана."
 POD_eoel_grandmother_witch_boon_modifier:0 "Дар бабушки-ведьмы"
 POD_eoel_grandmother_witch_boon_modifier_desc:0 "Повелительница Ада Жалкой Магии научилась использовать свое положение, чтобы собирать еще больше знаний и магии."
 POD_eoel_hen_tian_boon_modifier:0 "Дар Хен Тяня"
 POD_eoel_hen_tian_boon_modifier_desc:0 "Владыка [UmbraGlossaryLocalized('hell_of_bitter_truth','Царства искупления и истины')] мастерски подчиняет людей своим целям, обманом заставляя их исполнять его замыслы."
 POD_eoel_mikaboshi_boon_modifier:0 "Дар [Glossary('Микабоши','podgloss.mikaboshi')]"
 POD_eoel_mikaboshi_boon_modifier_desc:0 "Владыка [Glossary('Города чудищ','podgloss.wickedcity')] знает, как выжать из региона как можно больше прибыли."
 POD_eoel_rangda_boon_modifier:0 "Дар Рангды"
 POD_eoel_rangda_boon_modifier_desc:0 "Повелительница [UmbraGlossary('hell_of_burrowing_maggots')] затопит мир личинками. Ваши солдаты — всего лишь первый шаг."
 POD_eoel_tou_mu_boon_modifier:0 "Дар [Glossary('Тоу-Му','podgloss.toumu')]"
 POD_eoel_tou_mu_boon_modifier_desc:0 "Повелительница [UmbraGlossary('hell_of_being_skinned_alive')] овладела искусством железной власти над своими владениями."
 POD_eoel_tou_shen_boon_modifier:0 "Дар Тоу Шэня"
 POD_eoel_tou_shen_boon_modifier_desc:0 "Повелитель Лихорадочного Ада знает, как превратить страх в прибыль."
 POD_eoel_wu_hua_boon_modifier:0 "Дар [Glossary('Ву Хуа','podgloss.wuhua')]"
 POD_eoel_wu_hua_boon_modifier_desc:0 "Владыка Ямы Соли и Железа хорошо знает, что послушные рабы — выгодные рабы."
 POD_eoel_yargra_boon_modifier:0 "Дар Яргры"
 POD_eoel_yargra_boon_modifier_desc:0 "Повелительница Пуэлеко подкрадывается к добыче, прежде чем пожрать её."
 POD_eoel_yargra_vampiric_boon_modifier:0 "Дар Яргры"
 POD_eoel_yargra_vampiric_boon_modifier_desc:0 "Повелительница Пуэлеко подкрадывается к добыче, прежде чем пожрать её."
 POD_mummy_elixir_of_eternal_life.001.a:0 "Благодарю вас за наставления."
 POD_mummy_elixir_of_eternal_life.001.a.tt:0 "Каждый раз, когда вы завершаете [journey|E], прозрения Восьми Бессмертных дают #color_white 5.00#! дополнительных [trait_level_track_xp|E] в изучении эликсира вечной жизни #weak ([GetTrait('eternal_rebirth_seeker').GetName( GetPlayer )])#!"
 POD_mummy_elixir_of_eternal_life.001.desc:0 "\"Путь необъясним, Путь за пределами учения, Дорога за пределами слов. Попытка поведать о нём — или, что ещё хуже, успешная попытка — стала бы проклятием для вашего будущего. Даже могучее дерево не может вырасти в полную высоту с украденным светом. Только обучаясь, вы доказываете, что достойны учить. Только своими собственными усилиями вы сможете продвинуться вперед и по-настоящему приблизиться к Третьему Воплощению. Тем не менее, мы будем точильным камнем для вашего клинка. С каждым вашим шагом мы будем направлять вас, чтобы вы могли сделать следующий, поскольку эти шаги — ваши собственные.\""
 POD_mummy_elixir_of_eternal_life.001.t:0 "Просьба о помощи"
 POD_mummy_elixir_of_eternal_life.002.a:0 "Алкоголь не затуманит мой разум."
 POD_mummy_elixir_of_eternal_life.002.a.tt:0 "Вы попытаетесь избавиться от [GetTrait('drunkard').GetName(GetNullCharacter)]."
 POD_mummy_elixir_of_eternal_life.002.b:0 "Я не буду наказывать себя."
 POD_mummy_elixir_of_eternal_life.002.b.tt:0 "Вы попытаетесь избавиться от [GetTrait('flagellant').GetName(GetNullCharacter)]."
 POD_mummy_elixir_of_eternal_life.002.c:0 "Возможно, я ем слишком много."
 POD_mummy_elixir_of_eternal_life.002.c.tt:0 "Вы попытаетесь избавиться от [GetTrait('comfort_eater').GetName(GetNullCharacter)]."
 POD_mummy_elixir_of_eternal_life.002.d:0 "Я не позволю гневу контролировать меня."
 POD_mummy_elixir_of_eternal_life.002.d.tt:0 "Вы попытаетесь избавиться от [GetTrait('irritable').GetName(GetNullCharacter)]."
 POD_mummy_elixir_of_eternal_life.002.desc:0 "Пришло время изменить себя, избавиться от тех черт, которые меня сдерживают. Путь, конечно, трудный, но необходимый."
 POD_mummy_elixir_of_eternal_life.002.e:0 "Я не позволю похоти руководить мной."
 POD_mummy_elixir_of_eternal_life.002.e.tt:0 "Вы попытаетесь избавиться от [GetTrait('rakish').GetName(GetNullCharacter)]."
 POD_mummy_elixir_of_eternal_life.002.f:0 "Я не могу спрятаться от своих проблем."
 POD_mummy_elixir_of_eternal_life.002.f.tt:0 "Вы попытаетесь избавиться от [GetTrait('hashishiyah').GetName(GetNullCharacter)]."
 POD_mummy_elixir_of_eternal_life.002.failure:0 "Вы провалили испытание"
 POD_mummy_elixir_of_eternal_life.002.g:0 "Жадность – это нехорошо."
 POD_mummy_elixir_of_eternal_life.002.g.tt:0 "Вы попытаетесь избавиться от [GetTrait('profligate').GetName(GetNullCharacter)]."
 POD_mummy_elixir_of_eternal_life.002.h:0 "Бегу ли я от того, что нужно сделать?"
 POD_mummy_elixir_of_eternal_life.002.h.tt:0 "Вы попытаетесь избавиться от [GetTrait('craven').GetName(GetNullCharacter)]."
 POD_mummy_elixir_of_eternal_life.002.i:0 "Позволяю ли я гневу подпитывать меня?"
 POD_mummy_elixir_of_eternal_life.002.i.tt:0 "Вы попытаетесь избавиться от [GetTrait('wrathful').GetName(GetNullCharacter)]."
 POD_mummy_elixir_of_eternal_life.002.j:0 "Позволяю ли я похоти одолеть меня?"
 POD_mummy_elixir_of_eternal_life.002.j.tt:0 "Вы попытаетесь избавиться от [GetTrait('lustful').GetName(GetNullCharacter)]."
 POD_mummy_elixir_of_eternal_life.002.k:0 "Не слишком ли я гонюсь за своей силой?"
 POD_mummy_elixir_of_eternal_life.002.k.tt:0 "Вы попытаетесь избавиться от [GetTrait('ambitious').GetName(GetNullCharacter)]."
 POD_mummy_elixir_of_eternal_life.002.l:0 "Избегаю ли я того, что должен сделать?"
 POD_mummy_elixir_of_eternal_life.002.l.tt:0 "Вы попытаетесь избавиться от [GetTrait('lazy').GetName(GetNullCharacter)]."
 POD_mummy_elixir_of_eternal_life.002.m:0 "Люблю ли я деньги больше, чем людей?"
 POD_mummy_elixir_of_eternal_life.002.m.tt:0 "Вы попытаетесь избавиться от [GetTrait('greedy').GetName(GetNullCharacter)]."
 POD_mummy_elixir_of_eternal_life.002.n:0 "Позволяю ли я еде поглотить меня?"
 POD_mummy_elixir_of_eternal_life.002.n.tt:0 "Вы попытаетесь избавиться от [GetTrait('gluttonous').GetName(GetNullCharacter)]."
 POD_mummy_elixir_of_eternal_life.002.o:0 "Наслаждаюсь ли я жестокостью?"
 POD_mummy_elixir_of_eternal_life.002.o.tt:0 "Вы попытаетесь избавиться от [GetTrait('sadistic').GetName(GetNullCharacter)]."
 POD_mummy_elixir_of_eternal_life.002.option.desc:0 "Испытание себя"
 POD_mummy_elixir_of_eternal_life.002.p:0 "Неважно."
 POD_mummy_elixir_of_eternal_life.002.success:0 "Вы успешно прошли испытание"
 POD_mummy_elixir_of_eternal_life.002.t:0 "Внутреннее мастерство"
 POD_mummy_elixir_of_eternal_life.003.a:0 "Мои поиски еще не окончены..."
 POD_mummy_elixir_of_eternal_life.003.desc:0 "Теперь, когда вы достигли базового понимания эликсира вечной жизни, прежнего пути уже недостаточно для дальнейшего роста. Чтобы создать Эликсир, человек должен понять себя и вселенную, в которой он живет. Для этого вам нужно будет путешествовать по всему миру, чтобы собирать древние записи, учиться на ошибках других и размышлять над уроками, которые вы собрали. Кроме того, вам нужно будет потратить время на проведение исследований, медленный перевод записей, варку зелий и укрепление своей базы совершенствования. \n\n#help Чтобы достичь 90 [trait_level_track_xp|E] в эликсире вечной жизни и прогрессировать дальше, вам нужно будет пассивно накапливать его и выполнять [journeys|E]. Чтобы узнать больше, см. [Concept('POD_elixir_of_eternal_life', 'эту подсказку')|E] и описание черты Искатель Вечного Возрождения под вашим персонажем. #!"
 POD_mummy_elixir_of_eternal_life.003.t:0 "Одно завершено, другое начато"
 POD_mummy_elixir_of_eternal_life.100.a:0 "Сделка, которую стоит заключить."
 POD_mummy_elixir_of_eternal_life.100.b:0 "Ты никогда не получишь мою душу!"
 POD_mummy_elixir_of_eternal_life.100.c:0 "Моя душа уже потеряна."
 POD_mummy_elixir_of_eternal_life.100.d:0 "Моё владение магией делает твои силы здесь бесполезными."
 POD_mummy_elixir_of_eternal_life.100.d.tt:0 "Приготовив множество зелий и пообщавшись с [umbra|E], вы сможете противостоять их инфернальной силе."
 POD_mummy_elixir_of_eternal_life.100.desc:0 "Мужчина в идеально сшитом костюме входит в ваш тронный зал, минуя охрану. Его волосы зачесаны назад и настолько гладки и идеально сформированы, что напоминают шлем, надетый на его голову. Части металлических механизмов, торчащие из его плоти, лишь усиливают созданный образ. \n\nОн представляется агентом [Glossary('повелителя Яма','podgloss.yamaking')] [Glossary('Микабоши','podgloss.mikaboshi')]. Он слышал о ваших поисках эликсира вечной жизни и хочет сделать вам предложение. Вы свяжете свой ритуал с [Glossary('Городом чудищ','podgloss.wickedcity')] и используете свои знания для создания войска Ву Куэй — мумий, работающих над созданием машинного государства. В обмен он поможет вам превратить ваше царство в царство обыденной и роботизированной работы, максимизируя прибыльность, минимизируя потери и постоянно внедряя инновации. \n\n[Glossary('Шестая эпоха','game_concept_sixth_age_desc')] придет, так почему бы вам не присоединиться к победившей стороне? Вам не нужно доживать свое бессмертное существование в страданиях или даже раздавленным пятой лордов Йоми, как простые массы, когда вы можете жить в комфорте и роскоши. Вы действительно хотите выбрать бесчисленные столетия жизни в аду только для того, чтобы сохранить знания и мудрость, которые могут по-настоящему оценить лишь немногие? Неужели ваш долг перед отсутствующим Небом действительно так важен для вас? Неужели вы откажетесь от такого щедрого предложения?"
 POD_mummy_elixir_of_eternal_life.100.effect.failure:0 "Нападение подавляет ваш разум"
 POD_mummy_elixir_of_eternal_life.100.effect.pactadvantage:0 "Ваш договор с [Glossary('повелителем Яма','podgloss.yamaking')] облегчит защиту от нападений его соперников."
 POD_mummy_elixir_of_eternal_life.100.effect.success:0 "Вы сопротивляетесь нападению агента"
 POD_mummy_elixir_of_eternal_life.100.t:0 "Навсегда связывающий купорос"
 POD_mummy_elixir_of_eternal_life.101.desc:0 "В ваш тронный зал, минуя охрану, входит рябая женщина, вся в вечно сочащихся гнойничках. Ее волосы скользкие от гноя, а кожа покрыта слоем пота. Кислый запах наполняет воздух, обжигая волосы в носу. \n\nОна представляется агентом [Glossary('повелителя Яма','podgloss.yamaking')] [GetFaithByKey('thousandhells_tou_shen').GetName]. Он слышал о ваших поисках эликсира вечной жизни и хочет сделать вам предложение. Вы свяжете свой ритуал с Лихорадочным Адом и используете свои знания, чтобы создать войско Ву Куэй, мумий, способствующих распространению оспы. Взамен он поможет вам превратить ваше царство в царство болезней, где мор и страх приносят прибыль. Он готов предложить немало за шанс одолеть Рангду. \n\n[Glossary('Шестая эпоха','game_concept_sixth_age_desc')] придет, так почему бы вам не присоединиться к победившей стороне? Вам не нужно доживать свое бессмертное существование в страданиях или даже раздавленным пятой лордов Йоми, как простые массы, когда вы можете жить в комфорте и роскоши. Вы действительно хотите выбрать бесчисленные столетия жизни в аду только для того, чтобы сохранить знания и мудрость, которые могут по-настоящему оценить лишь немногие? Неужели ваш долг перед отсутствующим Небом действительно так важен для вас? Неужели вы откажетесь от такого щедрого предложения?"
 POD_mummy_elixir_of_eternal_life.102.desc:0 "Мужчина в доспехах в стиле буси входит в ваш тронный зал, минуя охрану. В его руке лежит планшет, а на поясе свисают связка веревок и кнут, усыпанный осколками стекла. \n\nОн представляется агентом [Glossary('повелителя Яма','podgloss.yamaking')] [Glossary('Ву Хуа','podgloss.wuhua')]. Он слышал о ваших поисках эликсира вечной жизни и хочет сделать вам предложение. Вы свяжете свой ритуал с Ямой соли и железа и используете свои знания, чтобы создать войско Ву Куэй, мумий, работающих над достижением идеальной эффективности. В обмен он поможет вам превратить ваше королевство в царство хорошего порядка, максимальной производительности и бесконечной бюрократии. \n\n[Glossary('Шестая эпоха','game_concept_sixth_age_desc')] придет, так почему бы вам не присоединиться к победившей стороне? Вам не нужно доживать свое бессмертное существование в страданиях или даже раздавленным пятой лордов Йоми, как простые массы, когда вы можете жить в комфорте и роскоши. Вы действительно хотите выбрать бесчисленные столетия жизни в аду только для того, чтобы сохранить знания и мудрость, которые могут по-настоящему оценить лишь немногие? Неужели ваш долг перед отсутствующим Небом действительно так важен для вас? Неужели вы откажетесь от такого щедрого предложения? Ведь [Glossary('Ву Хуа','podgloss.wuhua')] всегда награждает верных и уничтожает непослушных."
 POD_mummy_elixir_of_eternal_life.110.a:0 "Мы можем прийти к соглашению."
 POD_mummy_elixir_of_eternal_life.110.b:0 "Ты никогда не получишь мою душу!"
 POD_mummy_elixir_of_eternal_life.110.c:0 "Моя душа уже потеряна."
 POD_mummy_elixir_of_eternal_life.110.d:0 "Я питал свое царство. У тебя здесь нет власти."
 POD_mummy_elixir_of_eternal_life.110.d.tt:0 "Овладев своим царством и семьей, вы сможете противостоять их инфернальным силам."
 POD_mummy_elixir_of_eternal_life.110.desc:0 "Сгорбленный мужчина, словно сделанный из почерневшего железа, входит в ваш тронный зал, минуя стражу. Его три многогранных глаза светятся красным цветом пустыни в сумерках. Песок вытекает из суставов, оставляя за существом след. \n\nОн представляется агентом [Glossary('повелительницы Яма','podgloss.yamaking')] [Glossary('Тоу-Му','podgloss.toumu')]. Она слышала о ваших поисках эликсира вечной жизни и хочет сделать вам предложение. Вы свяжете свой ритуал с [UmbraGlossary('hell_of_being_skinned_alive')] и используете свои знания, чтобы создать войско Ву Куэй, мумий, работающих над ее восхождением на трон [Glossary('Императора демонов','podgloss.demonemperor')]. Взамен она поможет вам отомстить всем, кто обидел вас, превзойдя их в славе и мучая их вечно. \n\n[Glossary('Шестая эпоха','game_concept_sixth_age_desc')] придет, так почему бы вам не присоединиться к победившей стороне? Вам не нужно доживать свое бессмертное существование в страданиях или даже раздавленным пятой лордов Йоми, как простые массы, когда вы можете жить в комфорте и роскоши. Вы действительно хотите выбрать бесчисленные столетия жизни в аду только для того, чтобы сохранить знания и мудрость, которые могут по-настоящему оценить лишь немногие? Неужели ваш долг перед отсутствующим Небом действительно так важен для вас? Она предлагает грандиозные возможности, прежде чем даровать вам быструю смерть — милость в сравнении с миром, который она создаст."
 POD_mummy_elixir_of_eternal_life.110.effect.failure:0 "Нападение подавляет ваш разум"
 POD_mummy_elixir_of_eternal_life.110.effect.success:0 "Вы сопротивляетесь нападению агента"
 POD_mummy_elixir_of_eternal_life.110.t:0 "Вечно меняющаяся грязь"
 POD_mummy_elixir_of_eternal_life.111.desc:0 "Человек, окутанный тенями, которые, казалось бы, светятся, но поглощают свет, материализуется в вашем тронном зале, минуя стражу. У него лицо невинного ребенка, затемненное глазами, которые видели слишком много. Как ни странно, в его манерах есть что-то птичье. \n\nОн представляется агентом [Glossary('повелителя Яма','podgloss.yamaking')] Бао Чжуна. Он слышал о ваших поисках эликсира вечной жизни и хочет сделать вам предложение. Вы свяжете свой ритуал с Адом Неугасимой Скорби и используете свои знания, чтобы создать войско Ву Куэй, мумий, работающих над истреблением всех остальных [Glossary('повелителей Яма','podgloss.yamaking')]. В обмен он поможет вам создать новый мир, свободный от тирании Августейшего Нефритового Императора, мир, в котором вы станете славным защитником Бао Чжуна. \n\n[Glossary('Шестая эпоха','game_concept_sixth_age_desc')] придет, так почему бы вам не присоединиться к победившей стороне? Вам не нужно доживать свое бессмертное существование в страданиях или даже раздавленным пятой лордов Йоми, как простые массы, когда вы можете жить в комфорте и роскоши. Вы действительно хотите выбрать бесчисленные столетия жизни в аду только для того, чтобы сохранить знания и мудрость, которые могут по-настоящему оценить лишь немногие? Неужели ваш долг перед отсутствующим Небом действительно так важен для вас? Он предлагает такие грандиозные возможности."
 POD_mummy_elixir_of_eternal_life.112.desc:0 "Человек, источающий инфернальное влияние, входит в ваш тронный зал, минуя вашу охрану. Странные драгоценные камни и безделушки свисают с каждого предмета одежды, звеня при каждом шаге. От этих предметов исходит необычная сила, которая давит на вас, как тяжесть океана, убийственное намерение вселяет в вас страх. \n\nОн представляется агентом [Glossary('повелительницы Яма','podgloss.yamaking')] Бабушки-ведьмы. Она слышала о ваших поисках эликсира вечной жизни и хочет сделать вам предложение. Вы свяжете свой ритуал с Адом Жалкой Магии и используете свои знания, чтобы создать войско Ву Куэй, мумий, работающих над сбором всей магии, включая ту, которую лучше оставить неизвестной. В обмен она подарит вам великие знания и адскую силу. \n\n[Glossary('Шестая эпоха','game_concept_sixth_age_desc')] придет, так почему бы вам не присоединиться к победившей стороне? Вам не нужно доживать свое бессмертное существование в страданиях или даже раздавленным пятой лордов Йоми, как простые массы, когда вы можете жить в комфорте и роскоши. Вы действительно хотите выбрать бесчисленные столетия жизни в аду только для того, чтобы сохранить знания и мудрость, которые могут по-настоящему оценить лишь немногие? Неужели ваш долг перед отсутствующим Небом действительно так важен для вас? Она предлагает такие грандиозные возможности."
 POD_mummy_elixir_of_eternal_life.120.a:0 "Сюрприз, но долгожданный."
 POD_mummy_elixir_of_eternal_life.120.b:0 "Ты никогда не получишь мою душу!"
 POD_mummy_elixir_of_eternal_life.120.c:0 "Моя душа уже потеряна."
 POD_mummy_elixir_of_eternal_life.120.d:0 "Я овладел собой. У тебя здесь нет власти."
 POD_mummy_elixir_of_eternal_life.120.d.tt:0 "Овладев своим телом и разумом, вы сможете противостоять их инфернальным силам."
 POD_mummy_elixir_of_eternal_life.120.desc:0 "Мимо ваших стражников проходит женщина неземной красоты, они не замечают ничего, кроме неё. Подобно статуе, вырезанной мастером изо льда, она безупречна. В каждом шаге проявляется смертоносная грация, кошка готовится наброситься. \n\nОна представляется агентом [Glossary('повелителя Яма','podgloss.yamaking')] [Glossary('Эмма-О','podgloss.emmao')]. Он слышал о ваших поисках эликсира вечной жизни и хочет сделать вам предложение. Вы свяжете свой ритуал с [Glossary('Какури','podgloss.kakuri')] и используете свои знания, чтобы создать войско Ву Куэй, мумий, работающих над бесконечной пустотой льда и снега. Взамен он подарит вам великую силу, превратив вас в свой нож в темноте. С его помощью мало кто сможет вам противостоять. \n\n[Glossary('Шестая эпоха','game_concept_sixth_age_desc')] придет, так почему бы вам не присоединиться к победившей стороне? Вам не нужно доживать свое бессмертное существование в страданиях или даже раздавленным пятой лордов Йоми, как простые массы, когда вы можете жить в комфорте и роскоши. Вы действительно хотите выбрать бесчисленные столетия жизни в аду только для того, чтобы сохранить знания и мудрость, которые могут по-настоящему оценить лишь немногие? Неужели ваш долг перед отсутствующим Небом действительно так важен для вас? Просто откажитесь от обязанностей, навязанных вам вашим равнодушным хозяином, Августейшим Нефритовым Императором, и примите нового хозяина, который будет деятельно вам помогать."
 POD_mummy_elixir_of_eternal_life.120.effect.failure:0 "Нападение подавляет ваш разум"
 POD_mummy_elixir_of_eternal_life.120.effect.success:0 "Вы сопротивляетесь нападению агента"
 POD_mummy_elixir_of_eternal_life.120.t:0 "Всеслышащий Смог"
 POD_mummy_elixir_of_eternal_life.121.desc:0 "Мужчина с символикой одной из основных религий входит в ваш тронный зал, минуя вашу охрану. Вера и фанатизм сияют в его глазах, едва затемненных красными складками, покрывающими каждый дюйм видимой плоти. \n\nОн представляется представителем божества, голосом того, известного как Хен Тянь. Божество услышало о ваших поисках эликсира вечной жизни и желает сделать вам предложение. Вы свяжете свой ритуал с [UmbraGlossaryLocalized('hell_of_bitter_truth','Царством искупления и истины')] и используете свои знания, чтобы создать войско Ву Куэй, мумий, работающих над спасением всех и раскрытием абсолютной истины. Взамен он поможет вам тайно распространить это искупление, чтобы враги истины не смогли вас остановить. \n\n[Glossary('Шестая эпоха','game_concept_sixth_age_desc')] придет, так почему бы вам не присоединиться к победившей стороне? Вам не нужно доживать свое бессмертное существование в страданиях или даже раздавленным пятой лордов Йоми, как простые массы, когда вы можете жить в комфорте и роскоши. Вы действительно хотите выбрать бесчисленные столетия жизни в аду только для того, чтобы сохранить знания и мудрость, которые могут по-настоящему оценить лишь немногие? Неужели ваш долг перед отсутствующим Небом действительно так важен для вас? Просто откажитесь от обязанностей, навязанных вам вашим равнодушным хозяином, Августейшим Нефритовым Императором, и примите нового хозяина, который будет деятельно вам помогать."
 POD_mummy_elixir_of_eternal_life.122.desc:0 "Человек, чья кожа заметно и навсегда запачкана кровью, входит в ваш тронный зал, минуя вашу охрану. Он напоминает свою повелительницу, от его туловища и спины простирается множество рук, каждая из которых заканчивается ртом со скрежетающими зубами. \n\nОн представляется агентом [Glossary('повелительницы Яма','podgloss.yamaking')] Яргры Многоустой. Она слышала о ваших поисках эликсира вечной жизни и хочет сделать вам предложение. Вы свяжете свой ритуал с Пуелеко и используете свои знания, чтобы создать войско Ву Куэй, мумий, работающих над созданием бесконечных адов и поглощением всего сущего. Взамен она поможет вам сожрать все, что встанет на вашем пути. \n\n[Glossary('Шестая эпоха','game_concept_sixth_age_desc')] придет, так почему бы вам не присоединиться к победившей стороне? Вам не нужно доживать свое бессмертное существование в страданиях или даже раздавленным пятой лордов Йоми, как простые массы, когда вы можете жить в комфорте и роскоши. Вы действительно хотите выбрать бесчисленные столетия жизни в аду только для того, чтобы сохранить знания и мудрость, которые могут по-настоящему оценить лишь немногие? Неужели ваш долг перед отсутствующим Небом действительно так важен для вас? Просто откажитесь от обязанностей, навязанных вам вашим равнодушным хозяином, Августейшим Нефритовым Императором, и примите нового хозяина, который будет деятельно вам помогать."
 POD_mummy_elixir_of_eternal_life.130.a:0 "Безграничная сила!"
 POD_mummy_elixir_of_eternal_life.130.b:0 "Ты никогда не получишь мою душу!"
 POD_mummy_elixir_of_eternal_life.130.c:0 "Моя душа уже потеряна."
 POD_mummy_elixir_of_eternal_life.130.desc:0 "Мужчина в монгольском дээле входит в ваш тронный зал, минуя охрану. Его тело кажется раздутым от испорченной энергии, в глазах горит ненаправленная ненависть. Вместо шагов его туфли издают звуки звенящих цепей и душераздирающие крики. \n\nОн представляется агентом [Glossary('повелителя Яма','podgloss.yamaking')] [Glossary('Дохор-хана','podgloss.dokhorkhan')]. Он слышал о ваших поисках эликсира вечной жизни и хочет сделать вам предложение. Вы свяжете свой ритуал с [Glossary('Адом шипастых цепей','podgloss.hellspikedchains')] и используете свои знания, чтобы создать войско Ву Куэй — мумий, которые сокрушат последних противников, мешающих ему стать [Glossary('Императора демонов','podgloss.demonemperor')]. Взамен он наделит вас силой сокрушать ваших врагов и заставлять их страдать. \n\n[Glossary('Шестая эпоха','game_concept_sixth_age_desc')] придет, так почему бы вам не присоединиться к победившей стороне? Вам не нужно доживать свое бессмертное существование в страданиях или даже раздавленным пятой лордов Йоми, как простые массы, когда вы можете жить в комфорте и роскоши. Вы действительно хотите выбрать бесчисленные столетия жизни в аду только для того, чтобы сохранить знания и мудрость, которые могут по-настоящему оценить лишь немногие? Неужели ваш долг перед отсутствующим Небом действительно так важен для вас? Великая сила, превосходящая воображение дряхлых дураков на Небесах, может стать вашей. Ваша преданность настолько устойчива, что вы откажетесь от нее?"
 POD_mummy_elixir_of_eternal_life.130.effect.failure:0 "Нападение подавляет ваш разум"
 POD_mummy_elixir_of_eternal_life.130.effect.success:0 "Вы сопротивляетесь нападению агента"
 POD_mummy_elixir_of_eternal_life.130.t:0 "Всепоглощающий гибельный огонь"
 POD_mummy_elixir_of_eternal_life.131.desc:0 "Женщина, почти не одетая, с гниющими ранами, покрывающими ее тело, входит в ваш тронный зал, минуя вашу охрану. Запах гниения, звук хлюпанья, вид плавящейся плоти и личинок, извивающихся под ее кожей, вызывают инстинктивное желание блевать. \n\nОна представляется агентом [Glossary('повелительницы Яма','podgloss.yamaking')] Рангды. Она слышала о ваших поисках эликсира вечной жизни и хочет сделать вам предложение. Вы свяжете свой ритуал с [UmbraGlossary('hell_of_burrowing_maggots')] и используете свои знания, чтобы создать войско Ву Куэй, мумий, работающих над вечной агонией всех живых существ. Взамен она превратит ваших людей в монстров, неспособных испытывать боль и разложение, которые они распространяют с каждым шагом. \n\n[Glossary('Шестая эпоха','game_concept_sixth_age_desc')] придет, так почему бы вам не присоединиться к победившей стороне? Вам не нужно доживать свое бессмертное существование в страданиях или даже раздавленным пятой лордов Йоми, как простые массы, когда вы можете жить в комфорте и роскоши. Вы действительно хотите выбрать бесчисленные столетия жизни в аду только для того, чтобы сохранить знания и мудрость, которые могут по-настоящему оценить лишь немногие? Неужели ваш долг перед отсутствующим Небом действительно так важен для вас? Великая сила, превосходящая воображение дряхлых дураков на Небесах, может стать вашей. Ваша преданность настолько устойчива, что вы откажетесь от нее?"
 POD_mummy_elixir_of_eternal_life.132.desc:0 "Мужчина со шрамами от ударов плетьми и ожогами входит в ваш тронный зал, минуя охрану. С девятихвостой плети, усеянной осколками стекла и подвешенной к его поясу, капает кровь. На его шлеме покоится свеча, горящая зеленым пламенем, яростно горящая и заставляющая капать на него воск. Тем не менее, свеча никогда не убывает. \n\nОн представляется агентом [Glossary('повелителя Яма','podgloss.yamaking')] Данору Ка. Он слышал о ваших поисках эликсира вечной жизни и хочет сделать вам предложение. Вы свяжете свой ритуал с Вечно Тёмной Пещерой и используете свои знания, чтобы создать войско Ву Куэй — мумий, добывающих духов, чтобы завершить его туннель в [UmbraGlossary('shadowlands')]. В обмен он превратит ваших рыцарей в надзирателей, способных справиться с огромными ордами рабов. \n\n[Glossary('Шестая эпоха','game_concept_sixth_age_desc')] придет, так почему бы вам не присоединиться к победившей стороне? Вам не нужно доживать свое бессмертное существование в страданиях или даже раздавленным пятой лордов Йоми, как простые массы, когда вы можете жить в комфорте и роскоши. Вы действительно хотите выбрать бесчисленные столетия жизни в аду только для того, чтобы сохранить знания и мудрость, которые могут по-настоящему оценить лишь немногие? Неужели ваш долг перед отсутствующим Небом действительно так важен для вас? Великая сила, превосходящая воображение дряхлых дураков на Небесах, может стать вашей. Ваша преданность настолько устойчива, что вы откажетесь от нее?"
 POD_mummy_elixir_of_eternal_life.140.a:0 "Пришло время изложить свою позицию и занять свое место."
 POD_mummy_elixir_of_eternal_life.140.desc:0 "На протяжении всей истории эликсир вечной жизни обнаруживался бесчисленное количество раз, но эти знания терялись. Некоторые предполагают, что Восемь Бессмертных намеренно усиливают цикл повторных открытий, используя эти поиски как испытание для выявления тех, кто достоин вечного возрождения. Они позволяют добродетельным пить эликсир и даруют его рецепт самым достойным. Это будет не первый раз, когда они делают это; ведь если Третье Воплощение существует, то достигшим его просветлённым Ву Тянь запрещено рассказывать о своих достижениях. В конце концов, люди не могут прокладывать свой собственный путь, когда стремятся идти по дорогам, проложенным другими. \n\nКак бы то ни было, разобравшись с [Glossary('повелителями Яма','podgloss.yamaking')], вы стоите на пороге успеха. Собрать несколько последних вещей и принять последнее решение — это все, что стоит между вами и последним испытанием ваших поисков."
 POD_mummy_elixir_of_eternal_life.140.t:0 "Последний шаг"
 POD_mummy_elixir_of_eternal_life.201.a:0 "Я ищу эликсир вечной жизни!"
 POD_mummy_elixir_of_eternal_life.201.b:0 "Если подумать..."
 POD_mummy_elixir_of_eternal_life.201.desc:0 "В тот час, когда вы когда-то родились, вы занимаете удобное положение. Вы приводите к покою тело, разум и душу. Каждый удар вашего сердца становится всё медленнее, каждый стук всё тише. Мысли отскакивают от вашего разума, не в силах вторгнуться в спокойствие. Заботы, страхи, беды этого мира утекают из вашей души, постепенно иссякая до едва заметного ручейка. Каждое мгновение тянется в вечность, поскольку вы теряете всякое ощущение течения времени, пока ваши глаза не закрываются. \n\nНесмотря на отсутствие тела, вы чувствуете мучительную боль, когда ваше тело, разум и душа отрываются друг от друга. Своим духовным оком вы видите три сферы, вращающиеся вокруг друг друга. По мере того, как орбиты ускоряются, сущность начинает течь между ними, поскольку сферы теряют чёткие очертания, а их сущность разлетается кружащимся облаком. Лишь ускоряясь с каждым мгновением, красные пучки энергии начинают кружиться внутрь к сформировавшемуся единому белому ядру, становясь все ярче по мере приближения к центру. Когда все это слилось в одну, бесконечно малую точку, ваша форма снова появляется, и вы снова можете видеть своими глазами, и перед вами предстают закрытые Врата Небес. Ворота имеют сложную кованую конструкцию, но выкованы из красного золота, замок изготовлен из драгоценного нефрита. По обе стороны от него расположены стены, сделанные из бесчисленных жемчужин, соединенных как единое целое. Перед воротами стоят восемь существ, похожих на людей, но несравненно больше, чем просто людей. \n\"Скажи нам, юный, чего ты ищешь? \"$POD_debate_debate_explanation_footer_description$ #R Бессмертные посоветуются с шестью старейшими доступными для игры Ву Тянь, которые продолжают действовать среди сверхъестественных существ. Их мнение о вас и ваши прошлые поступки, например число совершённых вами убийств, определят силу противника в дебатах.#!$POD_debate_debate_explanation_footer_initial_score$"
 POD_mummy_elixir_of_eternal_life.201.t:0 "Умиротворение"
 POD_mummy_elixir_of_eternal_life.202.a:0 "Я ищу эликсир вечной жизни!"
 POD_mummy_elixir_of_eternal_life.202.b:0 "Если подумать..."
 POD_mummy_elixir_of_eternal_life.202.desc:0 "Пришло время сварить последний необходимый эликсир. Вы поднимаетесь на самую высокую вершину в благоприятный день вооружившись талисманом. Вы говорите с духом горы, чтобы получить Дыхание Девяти Небес. Девять раз через равные промежутки киноварь подвергают воздействию огня, попеременно обращая её в твёрдое вещество и в пар, — таков способ её приготовления. Вы позволяете солнечному свету течь через сосуд, добавляя в него золотые цветы, нефритовую росу, серу, ртуть, сосновую смолу, персиковые косточки, чертополох, свинец, растворенный жемчуг, осадок воды и огня, остатки ушедших зверей, несколько смертельных токсинов и вашу собственную кровь. Многие составляющие становятся единым целым, сияя всеми цветами божественного света. Вы моете его, чтобы он стал чистым, как выпавший снег. Вы измельчаете его, чтобы он стал совершенным, как киноварь. Вы растворяете его в ароматной воде и вине из ярко-красной травы. Наконец, вы пьете жидкость, сияющую цветом небес, чтобы она могла сублимировать земное и очистить плоть, оставив только незапятнанное. \n\n Огромная тяжесть тянет ваши веки, закрывая их, когда вы чувствуете себя отделенным от мира смертных. Когда тяжесть исчезнет и вы сможете открыть их еще раз, вы увидите закрытые Врата Небес. Ворота имеют сложную кованую конструкцию, но выкованы из красного золота, замок изготовлен из драгоценного нефрита. По обе стороны от него расположены стены, сделанные из бесчисленных жемчужин, соединенных как единое целое. Перед воротами стоят восемь существ, похожих на людей, но несравненно больше, чем просто людей. \n\"Скажи нам, юный, чего ты ищешь? \"$POD_debate_debate_explanation_footer_description$#R Бессмертные посоветуются с шестью старейшими доступными для игры Ву Тянь, которые продолжают действовать среди сверхъестественных существ. Их мнение о вас и ваши прошлые поступки, например число совершённых вами убийств, определят силу противника в дебатах.#!$POD_debate_debate_explanation_footer_initial_score$"
 POD_mummy_elixir_of_eternal_life.202.t:0 "Последнее зелье"
 POD_mummy_elixir_of_eternal_life.203.a:0 "Я ищу эликсир вечной жизни!"
 POD_mummy_elixir_of_eternal_life.203.b:0 "Если подумать..."
 POD_mummy_elixir_of_eternal_life.203.desc:0 "С помощью друзей вы провели сокровенный ритуал, кульминацией которого стало самоубийство с помощью тщательно разработанного оружия. Когда средоточие вашей жизни смещается, внутренний взор опускается к пупку. Светящаяся галактика вращается, ожидая, пока вы приложите силу и сожмёте её в новую жизнь. Когда вы сосредотачиваетесь на ней, вы начинаете культивировать и направлять в неё сущность. Когда сущность возвращается в пустоту, внутри вас пробуждается зародыш бессмертного. С каждым криком младенец растёт, пока не становится вами. Один элемент толкает, другой тянет. Итак, колесо вращается. Так рождается новый бессмертный. Итак, вы рождаетесь, стоя перед закрытыми Вратами Небес. Ворота имеют сложную кованую конструкцию, но выкованы из красного золота, замок изготовлен из драгоценного нефрита. По обе стороны от него расположены стены, сделанные из бесчисленных жемчужин, соединенных как единое целое. Перед воротами стоят восемь существ, похожих на людей, но несравненно больше, чем просто людей. \n\"Скажи нам, юный, чего ты ищешь? \"$POD_debate_debate_explanation_footer_description$#R Бессмертные посоветуются с шестью старейшими доступными для игры Ву Тянь, которые продолжают действовать среди сверхъестественных существ. Их мнение о вас и ваши прошлые поступки, например число совершённых вами убийств, определят силу противника в дебатах.#!$POD_debate_debate_explanation_footer_initial_score$"
 POD_mummy_elixir_of_eternal_life.203.t:0 "Второе рождение"
 POD_mummy_elixir_of_eternal_life.21.a:0 "Мы уже несем бремя бессмертия."
 POD_mummy_elixir_of_eternal_life.21.b:0 "Предоставленное вами предназначение не даёт жизни лишиться смысла."
 POD_mummy_elixir_of_eternal_life.21.c:0 "Вы приспособились; сможем и мы."
 POD_mummy_elixir_of_eternal_life.21.desc:0 "$POD_debate_debate_strength_header$\"Вы не первый и не последний, кто отправляется в такие поиски. Однако взбираться на гору — значит нести ее тяжесть на своей спине. Бессмертие, даже если оно связано циклами перерождений, как наше собственное, — это бремя, которое меняет душу. С каждым шагом вашего восхождения вы будете накапливать потери, а ваши воспоминания будут разрушаться. Вы откажетесь от всего, что придает смысл смертному. Если у горы нет вершины, есть ли смысл в ее восхождении? Есть ли смысл в бесконечной борьбе? Не для всех. Подобные вещи подобны реке, прорезающей каньон. Хотя разделение начинается с малого, наступает момент, когда ничто не может преодолеть разрыв между вами и смертным опытом. Вы отстранитесь от него и не сможете полностью участвовать в нем. Такая боль только усиливается, когда у вас есть сила даровать бессмертие, но вы знаете, что не должны ее использовать. \n\n\"Это проклятие и бремя. Будете ли вы по-прежнему видеть в метели каждую отдельную снежинку, такую ​​же, как многие до нее, но при этом совершенно уникальную? Будете ли вы по-прежнему любить их, заботиться о них, защищать их? Сможете ли вы вынести это или станете чудовищем? Будете ли вы по-прежнему мудро использовать свои знания, даруя вечное возрождение только тем, кто сможет вынести его сам? \""
 POD_mummy_elixir_of_eternal_life.21.t:0 "Аудиенция: бремя бессмертия"
 POD_mummy_elixir_of_eternal_life.22.a:0 "Равновесие меняется; оно не застывает."
 POD_mummy_elixir_of_eternal_life.22.b:0 "Вы продолжите регулировать нашу численность."
 POD_mummy_elixir_of_eternal_life.22.c:0 "Мы наносим меньший ущерб, чем другие, и устраняем ущерб от них."
 POD_mummy_elixir_of_eternal_life.22.desc:0 "$POD_debate_debate_strength_header$\"Подобно тому, как бессмертие и способность даровать его изменяют отношения между вами и другими, так оно изменяет и ваши отношения с миром. Жизнь и смерть, порядок и хаос, рождение и распад. Все существует в идеальном равновесии, и мы его хранители. Создавая каждого Бессмертного, мы уже приближаемся к грани дисбаланса, сотрясая дерево. Несколько потрясений не будут угрожать миру. Однако если вы получите знания о приготовлении эликсира, вы рискуете слишком часто трясти дерево, оставляя дерево без листьев. Расширение нашего круга не было бы нейтральным действием, служащим лишь напряжением духовных экосистем. Если напряжение станет слишком большим, слова о ряби уже не смогут передать масштаба невидимых долгов и кармических переплетений. \n\n\"Будете ли вы поддерживать баланс между мирами? Будете ли вы злоупотреблять этими знаниями, чтобы создать армию Бессмертных, прорывающую дыру в самой смерти?\""
 POD_mummy_elixir_of_eternal_life.22.t:0 "Аудиенция: поддержание равновесия"
 POD_mummy_elixir_of_eternal_life.23.a:0 "Мы сохраняем, а не уничтожаем человечность."
 POD_mummy_elixir_of_eternal_life.23.b:0 "Бессмертие — это не конец, а лишь начало нового путешествия."
 POD_mummy_elixir_of_eternal_life.23.c:0 "Смертность приводит к страданиям, невежеству и растрате потенциала."
 POD_mummy_elixir_of_eternal_life.23.desc:0 "$POD_debate_debate_strength_header$\"Вред не ограничивается нарушением равновесия или тяжестью бремени бессмертия. Как мы уже говорили ранее, бессмертие отделяет нас от смертных, оставляя нас оторванными от их мира и без сочувствия. Без песка, стекающего из песочных часов, нам не хватает срочности или потребности в росте. Удалить давление смерти и остановить песочные часы — значит потерять стремление стать чем-то новым или большим, измениться. Если мы дадим вам рецепт эликсира вечной жизни, вы будете использовать его, чтобы создать еще больше Бессмертных, тем самым лишив их возможности испытать полноценное человеческое существование. Вместо этого вы обрекаете их на жизнь, состоящую из бесконечных дней, нескончаемую монотонность и утомление работой, от которой им никогда не уйти. Даже если они захотят этого или будут искать вас для этого, никто не сможет по-настоящему понять потерю, которую несёт бессмертие, прежде чем обретёт его. Вы крадете у них все это, и они даже не осознают своей потери. Были даже те, кто использовал бессмертие, чтобы наказывать и пытать своих соперников, лишая их нормальной жизни. \n\n\"Готовы ли вы украсть такой потенциал? Станете ли вы злоупотреблять силой, не размышляя и не учитывая причиняемую боль? Будете ли вы причинять вред и страдания? \""
 POD_mummy_elixir_of_eternal_life.23.t:0 "Аудиенция: ценность смертности"
 POD_mummy_elixir_of_eternal_life.24.a:0 "Мы уже зарекомендовали себя, достигнув этой точки."
 POD_mummy_elixir_of_eternal_life.24.b:0 "Совершенство невозможно, а рост вечен."
 POD_mummy_elixir_of_eternal_life.24.c:0 "Рост требует ответственности."
 POD_mummy_elixir_of_eternal_life.24.desc:0 "$POD_debate_debate_strength_header$\"Знание – сила. Эликсир вечной жизни обладает силой управлять Колесом, контролировать цикл перерождений, позволяя человеку существовать далеко за пределами его естественного конца. Для смертных сила служит лишь раскрытию внутренней истины, но она гораздо более опасна для бессмертных. Вы будете окружены волшебством, силой. Знать, что вы можете что-то изменить, что вы можете что-то исправить, не многие хорошие люди могут вынести это бремя. Не поддаться искушению построить идеальный мир, этой песне сирен — это истощающее усилие, которое с каждым проходящим столетием подрывает волю. Власть способствует развращению даже самых чистых сердцем и даже тех, кто имеет самые благие намерения. Только лучшие могут справиться с этим, хотя однажды гора разрушится, но это займет гораздо больше времени, чем куча пыли. \n\nПредоставить вам такую ​​силу до того, как вы будете готовы, — это жестокость по отношению к вам и верх глупости, мало чем отличающаяся от дарования всемогущества ребенку. Чтобы нести знания, лежащие в основе создания Эликсира, требуется тот, кто усвоил определенные уроки, касающиеся отстраненности, смирения и гармонии. \n\n\"Вы не обязательно недостойны. Скорее, вы еще молоды и несовершенны. Предоставить вам то, что вы ищете, было бы безответственно. Почему мы должны это делать? Какие доказательства своей зрелости и способности противостоять порче вы можете предложить? \""
 POD_mummy_elixir_of_eternal_life.24.t:0 "Аудиенция: ваша незавершённость"
 POD_mummy_elixir_of_eternal_life.25.a:0 "Стагнация сама по себе опасна."
 POD_mummy_elixir_of_eternal_life.25.b:0 "Любая традиция рискует подвергнуться порче, но это не повод от неё отказываться."
 POD_mummy_elixir_of_eternal_life.25.c:0 "Хотя это и сложно, но меры безопасности могут быть установлены."
 POD_mummy_elixir_of_eternal_life.25.desc:0 "$POD_debate_debate_strength_header$\"Допустим, мы признаем ваше достоинство и вашу способность правильно обращаться с силой, присущей эликсиру вечной жизни. Сила этого знания — наследие, такое же вечное, как и созданные им существа. Каждое изменение вызывает рябь в людском пруду, распространяясь все дальше. Предоставляя вам знания по приготовлению эликсира, мы увековечиваем это наследие, наследие, которое вы передадите всем, кого вы трансформируете или кого вы ему обучаете. Доверие к вам теперь требует от нас доверять всем, кто придет после вас, доверять наследию, которое вы создаете. Даже небольшая рябь может однажды превратиться в приливную волну, которую даже нам не под силу сдержать. В великой поэме истории такие рифмованные строки часто повторяются, а доверие редко вознаграждается. \n\n\"Почему мы должны проявлять такое доверие в этот момент? Почему мы должны доверять тем, кто придет позже? Даже если ваши намерения благородны, разделят ли будущие поколения ваши добродетели и ценности? Почему мы должны идти на такой риск?\""
 POD_mummy_elixir_of_eternal_life.25.t:0 "Аудиенция: наследие власти"
 POD_mummy_elixir_of_eternal_life.26.a:0 "Чтобы защитить мир."
 POD_mummy_elixir_of_eternal_life.26.b:0 "Чтобы преодолеть ограничения."
 POD_mummy_elixir_of_eternal_life.26.c:0 "Возвыситься в просветлении."
 POD_mummy_elixir_of_eternal_life.26.d:0 "Нести бремя, которое другие не могут."
 POD_mummy_elixir_of_eternal_life.26.desc:0 "$POD_debate_debate_strength_header$\"Перед нами стоит последний вопрос: вы. Что привело вас к тому, что вы делаете сейчас? В конце концов, ваши поиски были долгими, непростыми и полными трудностей. Что придавало вам силы, когда вы подвергали сомнению свою цель? Каковы были ваши намерения, в глубине, под всеми практическими соображениями и философскими доводами? Вы стремитесь к контролю или к тому, чтобы вас помнили? Вы ищете из страха или из неповиновения? Если да, то удовлетворение ваших желаний только усилит эти недостатки. Есть ли у вас причина, превосходящая такие базовые импульсы? \""
 POD_mummy_elixir_of_eternal_life.26.e:0 "Чтобы сохранить знания и цель."
 POD_mummy_elixir_of_eternal_life.26.t:0 "Аудиенция: зачем..."
 POD_mummy_elixir_of_eternal_life.270.a:0 "Благодарю вас за наставления."
 POD_mummy_elixir_of_eternal_life.270.b:0 "Благодарю вас за эту возможность."
 POD_mummy_elixir_of_eternal_life.270.desc.external:0 "\"После долгих размышлений мы приняли ваше предложение и восполним пробелы в ваших знаниях. Вы также можете выпить его, если хотите. Будем надеяться, что наше доверие к вам оправдано.\n\n\"Чтобы начать приготовление эликсира вечной жизни, измельчите нефрит в мелкий порошок и всыпьте в небольшое количество расплавленного золота...\""
 POD_mummy_elixir_of_eternal_life.270.desc.internal:0 "\"После долгих размышлений мы приняли ваше предложение и восполним пробелы в ваших знаниях. Вы также можете выпить его, если хотите. Если вы откажетесь сейчас и измените свое решение позже, вам придется выпить его без нашей помощи. Будем надеяться, что наше доверие к вам оправдано. \n\n\"Чтобы начать готовить эликсир вечной жизни, соберите свои слезы с 23:00 до 3:00, пот с 11:00 до 15:00, слюну с 7:00 до 11:00, слизь с 3:00 до 7:00 и мочу с 15:00 до 19:00. Затем перемешивайте их на огне в течение 15 минут... \""
 POD_mummy_elixir_of_eternal_life.270.desc.nourishing:0 "\"После долгих размышлений мы приняли ваше предложение и восполним пробелы в ваших знаниях. Вы также можете выпить его, если хотите. Будем надеяться, что наше доверие к вам оправдано. \n\n\"Чтобы начать приготовление эликсира вечной жизни, выполните технику «Игры пяти животных» с несколькими надежными союзниками, каждый из вас посылает свою сущность, дыхание и дух в котел с кипящей водой. Тогда... \""
 POD_mummy_elixir_of_eternal_life.270.t:0 "Аудиенция: успех"
 POD_mummy_elixir_of_eternal_life.271.a:0 "Благодарю вас за щедрое предложение."
 POD_mummy_elixir_of_eternal_life.271.b:0 "Мне придётся отклонить ваше щедрое предложение."
 POD_mummy_elixir_of_eternal_life.271.desc:0 "\"Как и многим до вас, мы не предоставим вам знания, необходимые для совершенствования эликсира вечной жизни. Однако вы проявили мудрость, необходимую для того, чтобы испить его. Итак, мы предлагаем вам возможность оставить свою нынешнюю форму позади и обрести новую жизнь и новую цель – вечное возрождение в служении Августейшему Нефритовому Императору. Если вы откажетесь сейчас и измените свое решение позже, вам придется выпить его без нашей помощи. Вы принимаете?\""
 POD_mummy_elixir_of_eternal_life.271.t:0 "Аудиенция: частичный успех"
 POD_mummy_elixir_of_eternal_life.272.a:0 "Я вернусь позже."
 POD_mummy_elixir_of_eternal_life.272.b:0 "Дряхлые дураки! Я найду тех, кто оценит мое мастерство!"
 POD_mummy_elixir_of_eternal_life.272.desc:0 "\"После долгих размышлений мы сочли вас слишком молодыми. Вы — персиковая косточка, которая только начинает прорастать. Если мы предоставим вам знания, необходимые для приготовления эликсира вечной жизни, мы будем нести ответственность за то, что оно развратит вас. Вы можете научить этому недостойных. Вы можете подвергнуть пыткам своих соперников или украсть преимущества смертности у тех, кто не готов к такой потере. \""
 POD_mummy_elixir_of_eternal_life.272.t:0 "Аудиенция: неудача"
 POD_mummy_elixir_of_eternal_life.30.a:0 "Я докажу, что достоин."
 POD_mummy_elixir_of_eternal_life.30.b:0 "Я соберу свои силы и вернусь."
 POD_mummy_elixir_of_eternal_life.30.desc:0 "У Мудрейшего Хозяина на вас грандиозные планы. Вы спустились во владения Могущественнейшего Хозяина и стоите перед ним, выслушивая новое задание. Самый Благоразумный Мастер заявляет о необходимости большего числа таких, как вы. Таким слугам потребуется обучение и подготовка под присмотром Самого Ужасного Хозяина. К сожалению, в царстве Самого Непостижимого Мастера нет места, предназначенного для такой цели. Таким образом, Всемогущий Мастер поручает вам заявить права на фрагмент его Ада, чтобы вырастить больше слуг. Вы не хотите разочаровывать Самого Ужасного Хозяина, но вам придется бороться со своими соперниками среди других слуг Самого Доминирующего Мастера и жителей земли. \n\n #R В этом начинании используется показатель, называемый Военной Силой. Начальное значение определяется доблестью вашей и ваших воителей. Во время самого начинания этот показатель будет увеличиваться или уменьшаться.\nВаша стартовая военная мощь — [GetPlayer.MakeScope.GetVariable('character_eoel_wk_force').GetValue|0]#!."
 POD_mummy_elixir_of_eternal_life.30.t:0 "Место среди мучений"
 POD_mummy_elixir_of_eternal_life.30.tt.east:0 "Благо от восточного [Glossary('повелителя Яма','podgloss.yamaking')] поможет вашим усилиям."
 POD_mummy_elixir_of_eternal_life.30.tt.north:0 "Благо от ориентированного на север [Glossary('повелителя Яма','podgloss.yamaking')] поможет вашим усилиям."
 POD_mummy_elixir_of_eternal_life.30.tt.south:0 "Благо от южного [Glossary('повелителя Яма','podgloss.yamaking')] поможет вашим усилиям."
 POD_mummy_elixir_of_eternal_life.30.tt.west:0 "Благо от западного [Glossary('повелителя Яма','podgloss.yamaking')] поможет вашим усилиям."
 POD_mummy_elixir_of_eternal_life.31.a:0 "Страдание – высшая цель жизни."
 POD_mummy_elixir_of_eternal_life.31.b:0 "Используйте страдания как валюту."
 POD_mummy_elixir_of_eternal_life.31.c:0 "Страх – это самая чистая прибыль."
 POD_mummy_elixir_of_eternal_life.31.d:0 "Сломленные духи приносят прибыль."
 POD_mummy_elixir_of_eternal_life.31.desc:0 "$POD_mummy_elixir_of_eternal_life_military_strength$Вы приняли повеление Владычествующего Хозяина, и теперь пришло время получить урок Мудрейшего Хозяина. Он станет основой ваших владений и определит, какими будут новые Ву Куэй. Насколько хорошо вы усвоите и примените эти мудрые слова?"
 POD_mummy_elixir_of_eternal_life.31.e:0 "Контроль должен быть абсолютным."
 POD_mummy_elixir_of_eternal_life.31.effect.failure.desc:0 "Урок скользит по вашему разуму, не оставляя следа"
 POD_mummy_elixir_of_eternal_life.31.effect.success.desc:0 "Урок запечатлевается в вашей памяти"
 POD_mummy_elixir_of_eternal_life.31.f:0 "Память – это сила."
 POD_mummy_elixir_of_eternal_life.31.g:0 "Знания превыше всего."
 POD_mummy_elixir_of_eternal_life.31.h:0 "Хитрость выигрывает войны."
 POD_mummy_elixir_of_eternal_life.31.i:0 "Пользуйтесь чужой слепотой."
 POD_mummy_elixir_of_eternal_life.31.j:0 "Бей незримо; пожирай всё."
 POD_mummy_elixir_of_eternal_life.31.k:0 "Сокрушите все, что стоит перед вами."
 POD_mummy_elixir_of_eternal_life.31.l:0 "Неси порчу и муки."
 POD_mummy_elixir_of_eternal_life.31.m:0 "Расширяйтесь через рабство."
 POD_mummy_elixir_of_eternal_life.31.t:0 "Уроки проклятия"
 POD_mummy_elixir_of_eternal_life.32.a:0 "Прогнать их обратно в дикие земли."
 POD_mummy_elixir_of_eternal_life.32.b:0 "Поработите их и заставьте работать."
 POD_mummy_elixir_of_eternal_life.32.c:0 "Свяжите их магией."
 POD_mummy_elixir_of_eternal_life.32.desc:0 "$POD_mummy_elixir_of_eternal_life_military_strength$Услышав урок Августейшего Хозяина и усвоив его, вы отправляетесь на землю, отведенную вам Великодушным Хозяином. Марш долгий и утомительный. В то время как размер ваших сил отпугивает мелких тварей от нападений, завистливые дураки среди последователей Милосердного Повелителя стремятся узурпировать ваше привилегированное положение. Отражение их бессмысленных нападений — нетрудная задача для человека, столь благословленного Всемогущим Мастером, как вы. Однако такие перерывы утомляют более слабые части ваших сил. Таких слабаков оставляют в адской глуши. Сильнейшие из них выживут и завершат путешествие самостоятельно, так что мало что будет потеряно. \n\nХотя ни один из других главных слуг Выдающегося Мастера в настоящее время не претендует на эту землю, яма, раскинувшаяся сейчас перед вами, все еще населена некоторыми из меньших существ, которые бродят по царству Высочайшего Мастера. Изгнать их не составит большого труда, но для целей вашей текущей задачи от этого будет мало пользы. В качестве альтернативы вы можете рискнуть некоторыми из своих ресурсов и отложить свои усилия, чтобы получить возможность поработить их и направить на поддержку своих усилий."
 POD_mummy_elixir_of_eternal_life.32.effect.failure.desc:0 "С угрозой удалось справиться, но часть ресурсов была потрачена впустую"
 POD_mummy_elixir_of_eternal_life.32.effect.success.desc:0 "С угрозой покончено. Навсегда."
 POD_mummy_elixir_of_eternal_life.32.t:0 "Бесхозная яма"
 POD_mummy_elixir_of_eternal_life.33.a:0 "Используйте их ненависть, чтобы подпитывать свою славу."
 POD_mummy_elixir_of_eternal_life.33.b:0 "Превзойти их в строительстве и стойкости. Я переживу бурю."
 POD_mummy_elixir_of_eternal_life.33.c:0 "Разоблачите их планы. Такая невнимательность будет наказываться."
 POD_mummy_elixir_of_eternal_life.33.desc:0 "$POD_mummy_elixir_of_eternal_life_military_strength$После того, как ваша яма захвачена, а ее с бывшими обитателями покончено, ваши соперники при дворе Самовластного Хозяина предпринимают более активные действия, чтобы вмешаться в вашу задачу. За то, что осмелились помешать выполнению задания Неумолимого Учителя, вы должны позаботиться, чтобы они были должным образом наказаны и унижены в глазах Самого Проницательного Учителя. Хотя их устранение было бы более удовлетворительным, Самый Благоразумный Мастер не одобряет растрату ресурсов. Возможно, Щедрый Хозяин отдал бы вам их души для наказания и обучения. Однако прежде чем рассматривать подобные соображения, вы должны определить лучший способ противодействовать их интригам. Возможно, вы воспользуетесь этим для продвижения своей легенды или накажете их за неосторожность, позволившую вам узнать об их усилиях. Либо можно просто игнорировать их назло им."
 POD_mummy_elixir_of_eternal_life.33.effect.failure.desc:0 "Как хлопотно..."
 POD_mummy_elixir_of_eternal_life.33.effect.success.desc:0 "Их величайшие планы — всего лишь мелочи"
 POD_mummy_elixir_of_eternal_life.33.t:0 "Соперники при дворе Ада"
 POD_mummy_elixir_of_eternal_life.34.a:0 "Совершите набег на близлежащие ады."
 POD_mummy_elixir_of_eternal_life.34.b:0 "Усовершенствуйте существующие души."
 POD_mummy_elixir_of_eternal_life.34.c:0 "Жертвуйте смертными, чтобы получить больше душ."
 POD_mummy_elixir_of_eternal_life.34.desc:0 "$POD_mummy_elixir_of_eternal_life_military_strength$Чтобы заправить машины пыток в вашей яме, вам потребуется огромное количество эссенции. Эту сущность можно извлечь, только причинив огромную боль и страдания собранным душам, выжав всю жизненную силу до последней капли. Вы должны переработать эти сырьевые ресурсы в нечто более полезное для планов Могущественного Мастера, заполнив этим огромные чаны. Каждая капля должна быть тщательно очищена и обработана, чтобы ее можно было бросить в печи для создания извращённого подобия пара, который будет питать двигатели разрушения. Однако мирская агония недостаточна для ваших целей. Если вы не хотите сжигать огромное количество душ ради одной капли, вам понадобится мощная магия, чтобы усилить страдания и дистиллировать необходимую вам сущность. Вы с нетерпением ждете симфонии разрушения!"
 POD_mummy_elixir_of_eternal_life.34.effect.failure.desc:0 "Такая трата ресурсов"
 POD_mummy_elixir_of_eternal_life.34.effect.success.desc:0 "Теперь у нас будет много топлива"
 POD_mummy_elixir_of_eternal_life.34.t:0 "Топливо для костров проклятия"
 POD_mummy_elixir_of_eternal_life.35.a:0 "Я прибегну к жестокой дрессировке."
 POD_mummy_elixir_of_eternal_life.35.b:0 "Я оптимизирую их обучение."
 POD_mummy_elixir_of_eternal_life.35.c:0 "Я наберу только лучших."
 POD_mummy_elixir_of_eternal_life.35.d:0 "Я снаряжу их лучшим оружием и доспехами."
 POD_mummy_elixir_of_eternal_life.35.desc:0 "$POD_mummy_elixir_of_eternal_life_military_strength$Во всем мире существует бесчисленное множество трущоб, ветхих регионов и обедневших земель. В каждой стране и в каждом месте бездомные, голодные и отчаявшиеся знают правду! О них никто не заботится! Никто даже не подозревает об их существовании! У них ничего нет! У них никогда не будет ничего... кроме своей злости! Их ненависть! Какая восхитительная ненависть! Вы возьмете эту искру и превратите её в пламя, который сожжет сами небеса! \n\nОднако для разжигания пламени потребуется внушительная кочерга, и прежде чем они смогут служить Императорскому Хозяину, их необходимо перековать в полезные инструменты. Как вы превратите эти жалкие обрывки в то, что вам нужно? Вы просто предоставите им снаряжение, чтобы компенсировать слабость их плоти? Будете ли вы брать только величайших и оттачивать их? Сможете ли вы превратить даже самых жалких во что-то стоящее?"
 POD_mummy_elixir_of_eternal_life.35.effect.failure.desc:0 "Многие умирают до того, как программа будет усовершенствована."
 POD_mummy_elixir_of_eternal_life.35.effect.success.desc:0 "Выкованный до темного совершенства"
 POD_mummy_elixir_of_eternal_life.35.t:0 "Создание проклятых"
 POD_mummy_elixir_of_eternal_life.36.a:0 "Восстановите контроль силой!"
 POD_mummy_elixir_of_eternal_life.36.b:0 "Используйте хаос, чтобы усовершенствовать их."
 POD_mummy_elixir_of_eternal_life.36.c:0 "Возможно, необходима помощь Всемогущего Повелителя."
 POD_mummy_elixir_of_eternal_life.36.desc:0 "$POD_mummy_elixir_of_eternal_life_military_strength$Как и положено, Владычествующий Хозяин обладает абсолютной властью в своих владениях. Однако управление захваченной ямой — ваша ответственность. К сожалению, вас отвлекало множество дел, в том числе владения среди смертных. Это создало возможность, которой воспользовались ваши приспешники. \n\nНекоторые из младших рабов дико бегают, устраивая беспорядочные пожары и выпуская на волю пойманных вами зверей. Прислужники просто замышляют вашу гибель, в то время как более дальновидные стремятся вытеснить вас в глазах Августейшего Мастера. \n\nДураки не представляют большого риска в долгосрочной перспективе. Во всяком случае, вы слишком важны для планов Проницательного Мастера. Однако они могут оказаться неудобствами и задержать ваши инициативы. Как вы справитесь с их глупым восстанием?"
 POD_mummy_elixir_of_eternal_life.36.effect.failure.desc:0 "Столько потерь!"
 POD_mummy_elixir_of_eternal_life.36.effect.success.desc:0 "Все по плану"
 POD_mummy_elixir_of_eternal_life.36.t:0 "Необузданные мучения"
 POD_mummy_elixir_of_eternal_life.37.a:0 "Покажите свою мощь, мои прислужники!"
 POD_mummy_elixir_of_eternal_life.37.b:0 "Я набрал не только крестьян, но и своих лучших воинов!"
 POD_mummy_elixir_of_eternal_life.37.c:0 "Я устроил настоящую рекрутинговую кампанию!"
 POD_mummy_elixir_of_eternal_life.37.d:0 "Устройте представление, мои прислужники!"
 POD_mummy_elixir_of_eternal_life.37.desc:0 "$POD_mummy_elixir_of_eternal_life_military_strength$После долгого труда яма, которую вы высекли из Ада Самого Неумолимого Мастера, стонет от мук. Цепи гремят по железным мосткам, подвешенным над морями кричащих душ. Печи, питаемые очищенной агонией, ревут, как голодные львы, пока первых сломленных духов тащат к чанам порчи, их сущность готова быть помещена в смертные сосуды. \n\nПрежде чем вы сможете найти дураков, чтобы вселить в них духов, вас вызывают к Проницательнейшему Мастеру. Когда на вас останавливается взгляд Августейшего Мастера, двор замолкает. Ваши соперники с нетерпением ждут вашего унижения, в то время как бесчисленное множество меньших слуг рушатся в трепете от ужаса. Пришло время оценить качество страданий и мучений, которые вы порождаете. Вы просто построили еще одну кричащую яму среди тысячи, или вы построили землю отчаяния, действительно достойную царства Всевышнего Мастера? Будут ли ваши усилия способствовать грандиозным амбициям Самого Неумолимого Повелителя или будут тратить ресурсы, лучше подходящие для других начинаний? Только испытание боем определит судьбу вас и ваших усилий."
 POD_mummy_elixir_of_eternal_life.37.effect.failure.desc:0 "Их выступление лишь подтверждает слова ваших соперников"
 POD_mummy_elixir_of_eternal_life.37.effect.success.desc:0 "Даже Самый Неумолимый Мастер, кажется, слегка впечатлен."
 POD_mummy_elixir_of_eternal_life.37.final_check:0 "Сравнит вашу военную мощь с силой ваших соперников и врагов, чтобы определить окончательные результаты."
 POD_mummy_elixir_of_eternal_life.37.t:0 "Решение Мастера"
 POD_mummy_elixir_of_eternal_life.38.a:0 "Так много душ ждут, чтобы стать Ву Куэй."
 POD_mummy_elixir_of_eternal_life.38.b:0 "Я буду первым среди них."
 POD_mummy_elixir_of_eternal_life.38.desc:0 "Мудрейший Хозяин оценил вас по достоинству. Единственный кивок подтверждает ваш успех. \n\nВернувшись к своей яме, которая теперь поистине ваша, вы смотрите на нее. Горят печи, работают заводы. Дымятся трубы, растекаются тени. Цепи гремят, проклятия ползут. Души кричат, спектры струятся. Несчастные плачут, призраки корчатся. Улыбка мелькает на вашем лице, когда в вашем сознании кристаллизуются грандиозные амбиции. Щедрый Мастер предоставил вам эту возможность, и было бы грубо не воспользоваться ею в полной мере."
 POD_mummy_elixir_of_eternal_life.38.t:0 "Ад Суверенного Мастера"
 POD_mummy_elixir_of_eternal_life.39.a:0 "Нет. НЕТ. НЕТ! НЕЕЕТ!! ААААААААААА!!!"
 POD_mummy_elixir_of_eternal_life.39.desc:0 "Высочайший Мастер не терпит слабости, и ваших усилий оказалось недостаточно. Ваши соперники теперь наслаждаются вашей неудачей, разрывая на куски каркас вашей ямы. Для вас это не имеет большого значения, поскольку разочарование Самого Ужасного Мастера длится гораздо дольше, чем ваше существование."
 POD_mummy_elixir_of_eternal_life.39.t:0 "Окончательная цена"
 POD_mummy_elixir_of_eternal_life.40.a:0 "Ничто не встанет на моем пути!"
 POD_mummy_elixir_of_eternal_life.40.b:0 "У меня есть столетия, чтобы добиться этого."
 POD_mummy_elixir_of_eternal_life.40.desc:0 "Крики проклятых окружают вас, сливаясь в единую стену. Там, где другие могут чувствовать, что оно сжимает их ощутимым давлением, оно омолаживает вас. Из их страданий вы образовали горы. Из их сожалений вы вырезали реки. Из их вины вы построили свое царство. От их ненависти вы питаетесь. Их муки — ваши. Их тела принадлежат вам. Их души принадлежат вам. \n\nОднако их души остаются в ловушке в вашем царстве и бесполезны для ваших великих амбиций. Даже если они вернутся в мир смертных как [Glossary('Ван-куэй','game_concept_kuei_jin_desc')], это будет грубая копия жизни. Ву Куэй предлагают потенциал для создания бессмертных существ, способных к истинной жизни, существ, которые будут перерождаться вечно. Ву Куэй заполняют свою нишу, но имеют определенные... ограничения, особенно по сравнению со своими так называемыми \"праведными \" кузенами. Если вы завершите эликсир вечной жизни, можно будет создать подходящий противовес Ву Тянь. \n\n #R В этом начинании используется оценка под названием «Экспериментальное знание». Начальное значение определяется вашими знаниями и силой. Оно будет увеличиваться или уменьшаться во время самого процесса. \nВаши стартовые экспериментальные знания — [GetPlayer.MakeScope.GetVariable('character_eoel_diy_knowledge').GetValue|0]#!."
 POD_mummy_elixir_of_eternal_life.40.t:0 "Подобие жизни"
 POD_mummy_elixir_of_eternal_life.41.a:0 "Экспериментируйте над проклятыми."
 POD_mummy_elixir_of_eternal_life.41.b:0 "Честолюбивые сами с радостью вызовутся."
 POD_mummy_elixir_of_eternal_life.41.c:0 "Живых подопытных можно раздобыть."
 POD_mummy_elixir_of_eternal_life.41.desc:0 "$POD_mummy_elixir_of_eternal_life_experimental_knowledge$Ваши прошлые усилия дали много знаний, достаточных, чтобы даже создать Ву Куэй. Однако одних знаний недостаточно. Необходим активный опыт и практическая реализация. Печи должны быть зажжены. Рабы будут работать. Души будут преобразованы в память и сущность. Жизнь и смерть будут препарироваться до тех пор, пока в них не останется никаких тайн для вас. \n\nМожет потребоваться множество неудач. Много ресурсов может быть потрачено. Это затраты, которые вы готовы нести."
 POD_mummy_elixir_of_eternal_life.41.effect.failure.desc:0 "Жертвы были неизбежны"
 POD_mummy_elixir_of_eternal_life.41.effect.success.desc:0 "Как... увлекательно"
 POD_mummy_elixir_of_eternal_life.41.t:0 "Лаборатория тысячи агоний"
 POD_mummy_elixir_of_eternal_life.42.a:0 "Ещё усовершенствовать процесс."
 POD_mummy_elixir_of_eternal_life.42.b:0 "Отобрать удачные образцы для дальнейшего изучения."
 POD_mummy_elixir_of_eternal_life.42.c:0 "Самому поглотить остаток."
 POD_mummy_elixir_of_eternal_life.42.desc:0 "$POD_mummy_elixir_of_eternal_life_experimental_knowledge$Эксперименты начались. Был установлен последовательный процесс с контролем каждой переменной. Каждый подопытный классифицирован и каждая неудача каталогизирована. Ничто не упущено и не забыто, ибо истина может лежать где угодно. \n\nСотня погибнет. Потом тысяча. Потом десять тысяч. Потом сто тысяч. Большинство душ превращается в пепел, если от них вообще хоть что-то остаётся. Лишь немногие выживают в этом процессе в течение нескольких мгновений, прежде чем распасться. \n\nС каждой неудачей чему-то учатся, поскольку осадок остается позади. Пятно. Вы не можете определить, что это. Пока не можете."
 POD_mummy_elixir_of_eternal_life.42.effect.failure.desc:0 "Столько потраченных ресурсов"
 POD_mummy_elixir_of_eternal_life.42.effect.success.desc:0 "Вот что он делает!"
 POD_mummy_elixir_of_eternal_life.42.t:0 "Первая дистилляция"
 POD_mummy_elixir_of_eternal_life.43.a:0 "Расширить фабрики пыток."
 POD_mummy_elixir_of_eternal_life.43.b:0 "Создавайте новые формы страданий."
 POD_mummy_elixir_of_eternal_life.43.c:0 "Вырывайте души из скупой хватки Юй Хуана."
 POD_mummy_elixir_of_eternal_life.43.d:0 "Откройте хранилища!"
 POD_mummy_elixir_of_eternal_life.43.desc:0 "$POD_mummy_elixir_of_eternal_life_experimental_knowledge$После бесчисленных экспериментов недостающий ингредиент наконец-то обнаружен. Более того, вы нашли надежный способ его создания. В отличие от золота, его нельзя просто добыть. В отличие от шелка, его нельзя просто собрать. В отличие от товара, его нельзя просто купить. Только моменты истинных, глубоких, изменяющих жизнь страданий могут сформировать его. Страдания рождения, старости, болезни, смерти, встречи с неприятным, потери приятного, неполучения желаемого. Страдания формы, чувства, восприятия, формирования и сознания. Сожаление. Предательство. Одержимость. Отчаяние. Каждый момент создает каплю, которую можно превратить в сущность, сущность, которую вы можете использовать. \n\nК счастью, у вас есть множество трагедий. Души акума и их слуг заключены в нефритовые украшения и запечатаны в вашей сокровищнице дверями из черного дерева. Каждый из них представляет собой жизнь, добровольно отдавшуюся развращению, часто после великих страданий, при жизни или после смерти. Хотя они могут содержать недостающую сущность, это будет стоить очень дорого, поэтому альтернатива может быть лучше."
 POD_mummy_elixir_of_eternal_life.43.effect.failure.desc:0 "На это ушло слишком много душ"
 POD_mummy_elixir_of_eternal_life.43.effect.success.desc:0 "Наконец! Сущности более чем достаточно!"
 POD_mummy_elixir_of_eternal_life.43.t:0 "Сокровищница скорбей"
 POD_mummy_elixir_of_eternal_life.44.a:0 "Пусть они приходят!"
 POD_mummy_elixir_of_eternal_life.44.b:0 "Скормите им ложные выводы."
 POD_mummy_elixir_of_eternal_life.44.c:0 "Пожертвовать несколькими пешками, которых не жалко."
 POD_mummy_elixir_of_eternal_life.44.desc:0 "$POD_mummy_elixir_of_eternal_life_experimental_knowledge$Уже по Землям Теней распространились слухи, что ваше внимание сосредоточено в другом месте. Соперничающие Короли Демонов посылают шпионов и проводят разведывательные рейды. Жёлтые источники и его хозяин задают вопросы. Он так и не простил повелителям Яма кражу части Земель Теней и давно пытался вернуть ее. \n\nВаши истинные цели не останутся скрытыми навсегда, отчасти из-за ресурсов, которые вы потратили и тратите. Однако те же затраченные ресурсы ослабляют ваши позиции. Хуже того, возможность приобретения такой власти может побудить противников вмешаться до того, как вы ее достигнете."
 POD_mummy_elixir_of_eternal_life.44.effect.failure.desc:0 "Столько ресурсов ушло на борьбу с ними"
 POD_mummy_elixir_of_eternal_life.44.effect.success.desc:0 "Их внимание отвлекается"
 POD_mummy_elixir_of_eternal_life.44.t:0 "Глаза за завесой"
 POD_mummy_elixir_of_eternal_life.45.a:0 "Укрепить подопытных дисциплиной."
 POD_mummy_elixir_of_eternal_life.45.b:0 "Изучите их желания и амбиции."
 POD_mummy_elixir_of_eternal_life.45.c:0 "Препарируйте их до вырождения."
 POD_mummy_elixir_of_eternal_life.45.desc:0 "$POD_mummy_elixir_of_eternal_life_experimental_knowledge$Благодаря последним усовершенствованиям и добавлению этого специального ингредиента испытуемые больше не распадаются на бесчисленные нити плоти и костей. Хотя эти нити были полезны для создания вечно визжащей одежды, они никогда не представляли собой улучшенных Ву Куэй, которых вы желаете. \n\nВместо того чтобы погибнуть, им осталось нечто меньшее, чем жизнь. Их раны закрываются. Их плоть выдерживает. Тем не менее, они остаются вопиющими мерзкими существами, поддерживаемыми исключительно вашей волей. Если они когда-нибудь покинут ваше царство, их тела распадутся на новые нити. Даже несмотря на то, что их физическая форма сохраняется, их разум деградирует до безумия, голода и отчаяния. \n\nВ процессе по-прежнему скрыт какой-то изъян."
 POD_mummy_elixir_of_eternal_life.45.effect.failure.desc:0 "Опять приходится избавляться от неудачных образцов"
 POD_mummy_elixir_of_eternal_life.45.effect.success.desc:0 "Вот что он делает!"
 POD_mummy_elixir_of_eternal_life.45.t:0 "Неизбежные недостатки"
 POD_mummy_elixir_of_eternal_life.46.a:0 "Пытки сломят его волю."
 POD_mummy_elixir_of_eternal_life.46.b:0 "Уничтожьте его и сохраните останки."
 POD_mummy_elixir_of_eternal_life.46.c:0 "Предложите выгодную сделку."
 POD_mummy_elixir_of_eternal_life.46.d:0 "ОНО ПОВИНУЕТСЯ МНЕ!"
 POD_mummy_elixir_of_eternal_life.46.desc:0 "$POD_mummy_elixir_of_eternal_life_experimental_knowledge$Наконец, НАКОНЕЦ один из подопытных сохраняет прежний облик, не превращаясь в чудовище, на которое даже вы едва можете смотреть. Он говорит. Он помнит. Он мыслит!\n\nСперва он позволяет вам продолжать опыты. Вы делаете несколько открытий, но затем он СМЕЕТ не выполнить приказ! СМЕЕТ действовать против вашей воли! УТВЕРЖДАЕТ, что обладает #italic \"свободой воли\"#!! #italic Якобы#! существуют истины, скрытые от ВАШЕГО ВЗОРА! По его словам, страданий #italic \"недостаточно\"#! и необходима именно #italic \"свобода\"#!! Как будто вашей славы и могущества может быть #bold недостаточно#! для чего бы то ни было! Сама эта мысль — полный абсурд!\n\nКак бы то ни было, прототип нужен вам для продолжения экспериментов."
 POD_mummy_elixir_of_eternal_life.46.effect.failure.desc:0 "Мне придётся создать ещё один."
 POD_mummy_elixir_of_eternal_life.46.effect.success.desc:0 "ТЫ ПОСМЕЛ МЕНЯ ОСЛУШАТЬСЯ!"
 POD_mummy_elixir_of_eternal_life.46.t:0 "Мятежный прототип"
 POD_mummy_elixir_of_eternal_life.47.a:0 "Испытайте это на осужденной душе."
 POD_mummy_elixir_of_eternal_life.47.b:0 "Проверьте это на сильном пленнике."
 POD_mummy_elixir_of_eternal_life.47.c:0 "Проверьте это на верном рабе."
 POD_mummy_elixir_of_eternal_life.47.d:0 "Проверьте это на моем самом способном слуге."
 POD_mummy_elixir_of_eternal_life.47.desc:0 "$POD_mummy_elixir_of_eternal_life_experimental_knowledge$Каждый год труда, каждый эксперимент, каждая неудача, каждая жертва ресурсами — все это привело вас к этому моменту. Вы верите, что успешно создали эликсир вечной жизни, формулу, способную даровать вечное возрождение. Однако вы не сможете быть в этом уверены, если не протестируете окончательную версию должным образом. Изготовление было трудным и чрезвычайно дорогим. Если у вас ничего не получится, может пройти некоторое время, прежде чем вы сможете собрать необходимые материалы и попытаться еще раз."
 POD_mummy_elixir_of_eternal_life.47.effect.failure.desc:0 "Их смерть... прискорбна."
 POD_mummy_elixir_of_eternal_life.47.effect.success.desc:0 "Мой успех был неизбежен"
 POD_mummy_elixir_of_eternal_life.47.final_check:0 "Сравнит ваши экспериментальные знания с необходимым количеством, чтобы определить окончательный результат"
 POD_mummy_elixir_of_eternal_life.47.t:0 "Последнее испытание"
 POD_mummy_elixir_of_eternal_life.48.a:0 "Пусть Небеса содрогнутся!"
 POD_mummy_elixir_of_eternal_life.48.desc:0 "Все живут и умирают. Некоторые возвращаются в мир смертных в состоянии между ними. Лишь немногие живут, умирают и возвращаются к жизни самими собой. Ваша прошлая работа над эликсиром вечной жизни позволила вам создать грубую версию этих Бессмертных существ, которых вы называете Ву Куэй. Однако у них всегда были свои ограничения, и их души не обладали целостностью, свойственной тем, кого создали высокомерные Восемь Бессмертных. \n\nТеперь вы наблюдаете, как подопытный умирает под вашими инструментами, прежде чем снова воскреснуть. Каждое испытание подтверждает, что его тело живо, а преданность абсолютна. Он ваш, и скоро их станет легион."
 POD_mummy_elixir_of_eternal_life.48.t:0 "Вечное возрождение"
 POD_mummy_elixir_of_eternal_life.480.a:0 "Но у меня есть вечность, чтобы завершить это..."
 POD_mummy_elixir_of_eternal_life.480.desc:0 "Ваша лаборатория замолкает. Формула, расчеты, приготовления. Все было безупречно! Ваша работа была безупречна! Однако это не удалось! Хуже того, с каждой секундой плоть вашего испытуемого отслаивается от костей, которые активно разжижаются. Лужа бронзовой плоти, алой крови и белых, как слоновая кость, костей собирается у ваших ног, а затем яростно разлетается по стенам, когда душа разрывается. Целые секции лаборатории превращаются в кричащую пустошь. Части вашего царства и его барьера раскалываются, когда на них обрушивается духовная ударная волна взрыва. \n\nПотребуется время, чтобы исправить ущерб и еще раз укрепить свои позиции среди повелителей Яма. На данный момент работу придётся прекратить..."
 POD_mummy_elixir_of_eternal_life.480.t:0 "Великое заражение"
 POD_mummy_elixir_of_eternal_life_diy_start_hunt_tt:0 "Требуемые экспериментальные знания оцениваются в #V 2500#!."
 POD_mummy_elixir_of_eternal_life_experimental_knowledge:0 "#clickable Ваши текущие экспериментальные знания: [GetPlayer.MakeScope.GetVariable('character_eoel_diy_knowledge').GetValue|V0]\nВаши необходимые экспериментальные знания оцениваются в [GetPlayer.MakeScope.GetVariable('opposition_eoel_diy_knowledge').GetValue|V0]#!\n\n"
 POD_mummy_elixir_of_eternal_life_military_strength:0 "#clickable Ваша текущая военная мощь равна [GetPlayer.MakeScope.GetVariable('character_eoel_wk_force').GetValue|V0]\nВоенная мощь ваших соперников оценивается в [GetPlayer.MakeScope.GetVariable('rivals_eoel_wk_force').GetValue|V0]#!\n\n"
 POD_mummy_elixir_of_eternal_life_rivals_start_hunt_tt:0 "Военная мощь ваших соперников оценивается в #V 2000#!."
 POD_mummy_elixir_of_eternal_life_wukuei:0 "Вы получаете возможность создавать мумий Ву Куэй."
 POD_mummy_elixir_of_eternal_life_wutian:0 "Получите возможность создавать мумии Ву Тянь."
 elixir_of_eternal_life_ninth_immortal_bonus_xp:0 "Каждый раз, когда вы завершаете [journey|E], прозрения Восьми Бессмертных дают #color_white 5.00#! дополнительных [trait_level_track_xp|E] в эликсир вечной жизни #weak ([GetTrait('eternal_rebirth_seeker').GetName( GetPlayer )])#!"
 elixir_of_eternal_life_remove_bad_traits_decision:0 "Внутреннее совершенство"
 elixir_of_eternal_life_remove_bad_traits_decision_confirm:0 "Я хозяин самого себя."
 elixir_of_eternal_life_remove_bad_traits_decision_desc:0 "Бремя, которое я несу, не должно определять меня. Там, где раньше я терпел неудачу из-за напряжения, теперь я вижу возможности. \n\nЯ больше не буду потакать разрушительным привычкам. Вместо этого я овладею собой."
 elixir_of_eternal_life_remove_bad_traits_decision_effect:0 "Черты будут заменены новыми."
 elixir_of_eternal_life_remove_bad_traits_decision_tooltip:0 "Дисциплина, выкованная в трудностях, ясность, рожденная в суматохе."
 elixir_of_eternal_life_request_aid_decision:0 "Запросить помощь"
 elixir_of_eternal_life_request_aid_decision_confirm:0 "Я буду искать их руководства"
 elixir_of_eternal_life_request_aid_decision_desc:0 "Вы уже достигли того, что немногие даже считали возможным: защитили Поднебесную от возвышения [Glossary('Императора демонов','podgloss.demonemperor')]. При этом вы были возведены в ряды Восьми Бессмертных, управляющих Ву Тянь. Теперь, когда вы ищете эликсир вечной жизни, Восьмерка, возможно, пожелает вам помочь."
 elixir_of_eternal_life_request_aid_decision_tooltip:0 "Я — Девятый Бессмертный. Возможно, остальные захотят помочь мне в новых поисках."
 elixir_of_eternal_life_stage1_decision_completion_message_desc:0 "Вы открыли следующую цель на этом пути."
 elixir_of_eternal_life_stage1_decision_completion_message_title:0 "Ваше понимание углубляется"
 elixir_of_eternal_life_stage1_do_multiple_stages:0 "#help \n\nХотя это и сложнее, вы можете обнаружить, что завершение пути предлагает дополнительные награды на более позднем этапе.#!"
 elixir_of_eternal_life_stage1_external_phase1_decision:0 "Сбор золотых цветов и нефритовой росы"
 elixir_of_eternal_life_stage1_external_phase1_decision_confirm:0 "Пересадите их в мои сады"
 elixir_of_eternal_life_stage1_external_phase1_decision_desc:0 "Ваши эксперименты и ритуалы по созданию [Concept('POD_elixir_of_eternal_life', 'Эликсир вечного возрождения')|E] потребуют огромного количества ингредиентов, не все из которых растут на вашей родине. Вам понадобится свободный доступ к этим ингредиентам и их родным биомам, если вы надеетесь завершить свой квест. $elixir_of_eternal_life_stage1_do_multiple_stages$ $elixir_of_eternal_life_stage1_warning$"
 elixir_of_eternal_life_stage1_external_phase1_decision_requirement_cold:0 "На вашей территории есть провинция Горы или Тайга [terrain|E]"
 elixir_of_eternal_life_stage1_external_phase1_decision_requirement_cultivated:0 "На вашей территории есть провинция Сельскохозяйственные угодья или Террасные холмы [terrain|E]."
 elixir_of_eternal_life_stage1_external_phase1_decision_requirement_desert:0 "На вашей территории есть провинции Засушливые земли, Пустыни или Пустынные горы [terrain|E]."
 elixir_of_eternal_life_stage1_external_phase1_decision_requirement_forest:0 "На вашей территории есть провинция Леса или Холмов [terrain|E]."
 elixir_of_eternal_life_stage1_external_phase1_decision_requirement_plains:0 "На вашей территории есть провинция Равнины или Степи [terrain|E]."
 elixir_of_eternal_life_stage1_external_phase1_decision_requirement_water:0 "На вашей территории есть провинция Поймы или Оазис [terrain|E]."
 elixir_of_eternal_life_stage1_external_phase1_decision_requirement_wet_forest:0 "На вашей территории есть провинция Джунгли или Болота [terrain|E]."
 elixir_of_eternal_life_stage1_external_phase1_decision_tooltip:0 "Ингредиенты необходимо собирать из многих мест."
 elixir_of_eternal_life_stage1_external_phase2_decision:0 "Приготовить настой тлеющих углей"
 elixir_of_eternal_life_stage1_external_phase2_decision_confirm:0 "Сначала измельчите коготь виверны и гриб с девятью стебельками..."
 elixir_of_eternal_life_stage1_external_phase2_decision_desc:0 "Собрав все растительные ингредиенты, пришло время приготовить настой тлеющих углей. Чтобы его приготовить, вам нужно будет собирать разнообразные предметы, улучшающие разные части вашего физического тела. Если вы захотите его изучить, из [umbra|E] можно будет получить альтернативные ингредиенты."
 elixir_of_eternal_life_stage1_external_phase2_decision_requirement_bound_wraith_skills:0 "Общая сумма навыков привязанных к вам $POD_splat_wraith_plural$ должна превышать #V 100#!"
 elixir_of_eternal_life_stage1_external_phase2_decision_requirement_bygones:0 "У вас есть хотя бы 1 Великий или Могущественный [POD_bygones_maa|E]."
 elixir_of_eternal_life_stage1_external_phase2_decision_requirement_can_use:0 "#color_white Вы#! можете использовать этот артефакт"
