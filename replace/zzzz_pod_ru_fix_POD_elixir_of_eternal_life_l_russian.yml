 elixir_of_eternal_life_stage1_external_phase2_decision_requirement_intrigue:0 "Имеет модификатор артефакта, который увеличивает [intrigue|E] или отменяет штрафы [intrigue|E]."
 elixir_of_eternal_life_stage1_external_phase2_decision_requirement_learning:0 "Имеет модификатор артефакта, который увеличивает [learning|E] или отменяет штрафы [learning|E]."
 elixir_of_eternal_life_stage1_external_phase2_decision_requirement_martial:0 "Имеет модификатор артефакта, который увеличивает [martial|E] или отменяет штрафы [martial|E]."
 elixir_of_eternal_life_stage1_external_phase2_decision_requirement_stewardship:0 "Имеет модификатор артефакта, который увеличивает [stewardship|E] или отменяет штрафы [stewardship|E]."
 elixir_of_eternal_life_stage1_external_phase2_decision_requirement_umbra_aptitude:0 "У вас есть #V 150%#! [umbra_aptitude|E]"
 elixir_of_eternal_life_stage1_external_phase2_decision_tooltip:0 "Чтобы продолжить, вам необходимо собрать разнообразные ингредиенты."
 elixir_of_eternal_life_stage1_external_phase3_decision:0 "Приготовить фиолетово-золотой эликсир"
 elixir_of_eternal_life_stage1_external_phase3_decision_confirm:0 "Оставьте лепестки в ванне с травяным вином..."
 elixir_of_eternal_life_stage1_external_phase3_decision_desc:0 "После завершения вливания следующим шагом станет приготовление фиолетово-золотого эликсира в самом сердце драконьего гнезда. Небесная аметистовая орхидея души необходима, и ее можно получить только у [UmbraGlossary('heavenly_flower_garden')]. Что касается других ингредиентов, вы можете смешать содержимое других зелий и извлечь свойства сильнодействующих предметов. Альтернативно, договоры с определенными духами могут предоставить необходимые компоненты и магию."
 elixir_of_eternal_life_stage1_external_phase3_decision_requirement_diplomacy:0 "Имеет модификатор артефакта, который существенно увеличивает [diplomacy|E] или существенно сводит на нет штрафы [diplomacy|E], не считая суммируемых бонусов от нескольких экземпляров одного и того же модификатора."
 elixir_of_eternal_life_stage1_external_phase3_decision_requirement_health:0 "Имеет модификатор артефакта, который существенно усиливает [health|E] или существенно сводит на нет штрафы [health|E], не считая суммируемых бонусов от нескольких экземпляров одного и того же модификатора."
 elixir_of_eternal_life_stage1_external_phase3_decision_requirement_intrigue:0 "Имеет модификатор артефакта, который существенно увеличивает [intrigue|E] или существенно сводит на нет штрафы [intrigue|E], не считая суммируемых бонусов от нескольких экземпляров одного и того же модификатора."
 elixir_of_eternal_life_stage1_external_phase3_decision_requirement_learning:0 "Имеет модификатор артефакта, который существенно увеличивает [learning|E] или существенно сводит на нет штрафы [learning|E], не считая суммируемых бонусов от нескольких экземпляров одного и того же модификатора."
 elixir_of_eternal_life_stage1_external_phase3_decision_requirement_martial:0 "Имеет модификатор артефакта, который существенно увеличивает [martial|E] или существенно сводит на нет штрафы [martial|E], не считая суммируемых бонусов от нескольких экземпляров одного и того же модификатора."
 elixir_of_eternal_life_stage1_external_phase3_decision_requirement_stewardship:0 "Имеет модификатор артефакта, который существенно увеличивает [stewardship|E] или существенно сводит на нет штрафы [stewardship|E], не считая суммируемых бонусов от нескольких экземпляров одного и того же модификатора."
 elixir_of_eternal_life_stage1_external_phase3_decision_tooltip:0 "У этого эликсира довольно необычные требования к ингредиентам."
 elixir_of_eternal_life_stage1_internal_phase1_decision:0 "Преобразовать сущность в дыхание"
 elixir_of_eternal_life_stage1_internal_phase1_decision_confirm:0 "Итак, это начинается"
 elixir_of_eternal_life_stage1_internal_phase1_decision_desc:0 "В ходе следования [Concept('POD_elixir_of_eternal_life', 'Эликсир вечного возрождения')|E] каждый из трех основных компонентов космоса и человека – дух, дыхание и сущность – реинтегрируется в предыдущий. Это делается для того, чтобы инвертировать последовательность, в которой они исходят из Дао, и тем самым вернуться к началу процесса. Благодаря такому возвращению дыхание сохраняется и узлы смерти могут быть развязаны. \n\nДля начала внутренняя сущность ума должна быть очищена, сконцентрирована и свернута, чтобы зародить внутренний эмбрион, состоящий из дыхания. $elixir_of_eternal_life_stage1_do_multiple_stages$ $elixir_of_eternal_life_stage1_warning$"
 elixir_of_eternal_life_stage1_internal_phase1_decision_requirement_illness:0 "У вас #bold нет#! никаких болезней"
 elixir_of_eternal_life_stage1_internal_phase1_decision_requirement_stress:0 "У вас есть #color_white 0#! [stress|E]"
 elixir_of_eternal_life_stage1_internal_phase1_decision_tooltip:0 "Преобразуйте сущность в дыхание, чтобы вернуться к истоку."
 elixir_of_eternal_life_stage1_internal_phase2_decision:0 "Преобразовать дыхание в дух"
 elixir_of_eternal_life_stage1_internal_phase2_decision_confirm:0 "Второй становится первым"
 elixir_of_eternal_life_stage1_internal_phase2_decision_desc:0 "Когда зародыш возрождения зародился, пришло время продолжить совершенствование и объединение тройственных внутренних сил. Все болезни и недомогания вашей формы исходят из узлов, которые блокируют циркуляцию дыхания и сдавливают 5 внутренних органов. Правильная внутренняя циркуляция скрытого дыхания, не сдерживаемая телом, излечит такие проблемы. Как и все остальное, ваше дыхание должно течь циклично, образуя бесконечный узор. Этот процесс объединяет различные физические движения, включая сгибание, расширение, сжатие и растяжение, а также технику дыхания."
 elixir_of_eternal_life_stage1_internal_phase2_decision_tooltip:0 "Преобразуйте дыхание в дух, чтобы вернуться к истоку."
 elixir_of_eternal_life_stage1_internal_phase3_decision:0 "Очищение духа для возвращения к пустоте"
 elixir_of_eternal_life_stage1_internal_phase3_decision_confirm:0 "Первый возвращается к Дао"
 elixir_of_eternal_life_stage1_internal_phase3_decision_desc:0 "По мере очищения вашего духа ваши органы будут один за другим превращаться в золото и нефрит. Дыхание твое станет как сера, а кровь твоя — как киноварь. Со временем, изоляцией и самоанализом ваш дух очищается до небытия, пока ваше тело не останется пустым. Там, где невежественные люди видят конец в пустоте, вы видите потенциал бесконечной связи. \n\nЕсли все вещи не имеют пустоты в центре, если они не имеют формы как субстанции, если Инь не имеет Ян, как они могут возникнуть? Познай свет и держись тьмы. Это тайна существования, тайна, известная немногим и теперь... известная вам."
 elixir_of_eternal_life_stage1_internal_phase3_decision_requirement_schemes:0 "Количество ваших действующих [schemes|E] должно быть равно #color_white 0#!"
 elixir_of_eternal_life_stage1_internal_phase3_decision_tooltip:0 "Вернитесь к началу процесса."
 elixir_of_eternal_life_stage1_nourishing_phase1_decision:0 "Одно видение, одна цель"
 elixir_of_eternal_life_stage1_nourishing_phase1_decision_confirm:0 "Вместе мы стоим; в одиночестве мы падаем."
 elixir_of_eternal_life_stage1_nourishing_phase1_decision_desc:0 "Прежде чем человек сможет питать свои [Concept('POD_elixir_of_eternal_life', 'внутренняя жизнь')|E], он должен питать жизни окружающих. В отличие от дышащих мехами, истинный последователь Дао ищет бессмертия вместе с тем, чтобы принести пользу своей семье и сообществу. Одна рука борется там, где строят многие руки, и бесконечная жизнь возникает из плодотворной связи со всем творением. $elixir_of_eternal_life_stage1_do_multiple_stages$ $elixir_of_eternal_life_stage1_warning$"
 elixir_of_eternal_life_stage1_nourishing_phase1_decision_requirement_development:0 "В ваших владениях есть как минимум 100 [development|E]."
 elixir_of_eternal_life_stage1_nourishing_phase1_decision_requirement_dread:0 "У вас меньше #color_white 10#! [dread|E]"
 elixir_of_eternal_life_stage1_nourishing_phase1_decision_requirement_prisoners:0 "У вас #bold нет#! [prisoners|E]"
 elixir_of_eternal_life_stage1_nourishing_phase1_decision_requirement_vassals:0 "Все ваши могущественные вассалы имеют о вас мнение как минимум #color_green 20#!."
 elixir_of_eternal_life_stage1_nourishing_phase1_decision_tooltip:0 "Давайте встанем как один"
 elixir_of_eternal_life_stage1_nourishing_phase2_decision:0 "Слияние дыханий"
 elixir_of_eternal_life_stage1_nourishing_phase2_decision_confirm:0 "Два дыхания должны стать одним"
 elixir_of_eternal_life_stage1_nourishing_phase2_decision_desc:0 "Когда жизнь других людей улучшилась, пришло время обратить свой взгляд внутрь себя, на развитие своей внутренней жизни. Вы должны создать внутренний эмбрион, который не будет затронут смертью и который станет семенем вашего будущего перерождения. Там, где другие стремятся улучшить свое внутреннее дыхание, вы знаете альтернативный путь. Чтобы родить эмбрион, вы должны стимулировать и обмениваться своей ци с другой. Инь должен встретиться с Ян."
 elixir_of_eternal_life_stage1_nourishing_phase2_decision_requirement_concubines_opinions:0 "Все ваши [concubines|E] имеют о вас мнение как минимум #color_green 25#!."
 elixir_of_eternal_life_stage1_nourishing_phase2_decision_requirement_concubines_skills:0 "Все ваши [concubines|E] имеют средний уровень всех навыков не ниже #color_white 15#!."
 elixir_of_eternal_life_stage1_nourishing_phase2_decision_requirement_high_skill:0 "По крайней мере #color_white 1#! [spouse|E], [concubine|E] или [lover|E] имеет среднее значение всех навыков не ниже #color_white 25#!."
 elixir_of_eternal_life_stage1_nourishing_phase2_decision_requirement_lovers_opinions:0 "Все ваши [lovers|E] имеют о вас мнение как минимум #color_green 25#!."
 elixir_of_eternal_life_stage1_nourishing_phase2_decision_requirement_lovers_skills:0 "Все ваши [lovers|E] имеют средний уровень всех навыков не ниже #color_white 15#!."
 elixir_of_eternal_life_stage1_nourishing_phase2_decision_requirement_relations:0 "У вас есть как минимум #color_white 1#! [spouse|E], [concubine|E] или [lover|E]."
 elixir_of_eternal_life_stage1_nourishing_phase2_decision_requirement_spouses_opinions:0 "Все ваши [spouses|E] имеют о вас мнение как минимум #color_green 25#!."
 elixir_of_eternal_life_stage1_nourishing_phase2_decision_requirement_spouses_skills:0 "Все ваши [spouses|E] имеют средний уровень всех навыков не ниже #color_white 15#!."
 elixir_of_eternal_life_stage1_nourishing_phase2_decision_tooltip:0 "Инь должен встретиться с Ян."
 elixir_of_eternal_life_stage1_nourishing_phase3_decision:0 "Достичь цели без странствия"
 elixir_of_eternal_life_stage1_nourishing_phase3_decision_confirm:0 "Я мог бы действовать, но решил не делать этого"
 elixir_of_eternal_life_stage1_nourishing_phase3_decision_desc:0 "Преследуемая цель никогда не достигается. Мудрец не действует, но ничего не остается незавершенным. Мириады вещей, укорененные в тишине, процветают. Богатство и жизнь текут, а не накапливаются. Подобно воде, мудрец приносит пользу всему живому, оставаясь незамеченным. Они текут даже в самые низкие места, где никто не хочет находиться, неизменные и постоянные, но способные изменить ландшафт."
 elixir_of_eternal_life_stage1_nourishing_phase3_decision_requirement_child_count:0 "У вас есть как минимум #color_white 5#! детей."
 elixir_of_eternal_life_stage1_nourishing_phase3_decision_requirement_friends_lowborn:0 "По крайней мере #color_white 1#! [friend|E] является [lowborn|E] или имеет [prestige_level|E] @prestige_level_1_icon! [GetModifier( 'prestige_level_1' ).GetNameWithTooltip|L] или ниже."
 elixir_of_eternal_life_stage1_nourishing_phase3_decision_requirement_friends_skills:0 "Все ваши [friends|E] имеют средний уровень всех навыков не ниже #color_white 15#!."
 elixir_of_eternal_life_stage1_nourishing_phase3_decision_requirement_gold_hoard:0 "У вас есть максимум [gold_i] #color_white 250#! [gold|E]."
 elixir_of_eternal_life_stage1_nourishing_phase3_decision_requirement_income:0 "У вас есть [gold_i] [gold|E] [income|E] не ниже #color_white 10#!."
 elixir_of_eternal_life_stage1_nourishing_phase3_decision_requirement_lifestyle_perks:0 "Сумма неизрасходованных очков достоинств для [diplomacy_lifestyle|E], [martial_lifestyle|E], [stewardship_lifestyle|E], [intrigue_lifestyle|E], [learning_lifestyle|E] составляет не менее #color_white 10#!"
 elixir_of_eternal_life_stage1_nourishing_phase3_decision_tooltip:0 "Без действий ничего не останется незавершенным"
 elixir_of_eternal_life_stage1_unlock_next_phase:0 "Открывает следующий шаг на текущем пути."
 elixir_of_eternal_life_stage1_unlock_next_phase_caveat:0 "$spell_of_life_stage1_unlock_next_phase$, если у тебя получится"
 elixir_of_eternal_life_stage1_warning:0 "\n\n#R Будьте готовы пожертвовать всем в поисках истинного бессмертия, ибо путь таит в себе опасность!#!"
 elixir_of_eternal_life_stage2_meditation_decision:0 "Размышления о вечности"
 elixir_of_eternal_life_stage2_meditation_decision_confirm:0 "Пришло время совершенствоваться."
 elixir_of_eternal_life_stage2_meditation_decision_desc:0 "Хотя исследования и учеба важны, ничто не может превзойти уединенную медитацию на уроках, которые вы усвоили. Предстоящий путь может быть медленным и трудным, поскольку рассматривать такие глубокие вопросы непросто. Однако учения будут укрепляться, а концепции уточняться."
 elixir_of_eternal_life_stage2_meditation_decision_effect:0 "Вы выберете место для медитации и [journey|E] туда."
 elixir_of_eternal_life_stage2_meditation_decision_tooltip:0 "Размышление над тем, что вы узнали, может углубить ваше понимание."
 elixir_of_eternal_life_stage4_external_decision:0 "Приготовление эликсира девяти циклов"
 elixir_of_eternal_life_stage4_external_decision_bygones:0 "У вас есть как минимум 3 разных Великих или Могущественных [POD_bygones_maa|E] #weak ([GetPlayer.MakeScope.ScriptValue('number_maa_regiments_greater_and_potent_bygones')])#!."
 elixir_of_eternal_life_stage4_external_decision_confirm:0 "Начнем восхождение."
 elixir_of_eternal_life_stage4_external_decision_desc:0 "Пришло время сварить последний необходимый эликсир. Вам нужно будет подняться на самую высокую вершину в благоприятный день и отлично сварить эликсир, приготовленный из множества экзотических ингредиентов, включая компоненты существ ушедших эпох. Никаких ошибок быть не может. Пробные запуски невозможны. Те, кого Восемь Бессмертных сочтут праведными, вернутся в новое тело.\n\n#N Если вы потерпите неудачу, Восемь Бессмертных не предоставят вам новую аудиенцию в течение ста лет, обеспечивая ваш рост.#!"
 elixir_of_eternal_life_stage4_external_decision_dragon_nest:0 "Вы напрямую управляете одним из уникальных Драконьих Гнезд."
 elixir_of_eternal_life_stage4_external_decision_tooltip:0 "Я приготовлю идеальный эликсир, чтобы поговорить с Восьмью Бессмертными."
 elixir_of_eternal_life_stage4_infernalist_decision:0 "Место сбора войск"
 elixir_of_eternal_life_stage4_infernalist_decision_confirm:0 "Меня ждет Возвышеннейший Учитель."
 elixir_of_eternal_life_stage4_infernalist_decision_desc:0 "У Мудрого Мастера есть планы. В отличие от рабов акума, вы действительно живы, а не просто призраки, оживляющие мертвую плоть, что открывает множество возможностей. Самый Благоразумный Мастер заявляет, что вас нужно больше. Многие смертные стремятся к вечной жизни. Через Щедрого Господина они получают его всего лишь ценой услуги, такой же вечной, как и их новая жизнь. Однако таким, как они, потребуется место, чтобы подготовиться во владениях Всемогущего Мастера, получить силу жизненной ци Самого Могущественного Мастера, чтобы они могли вернуться к жизни, и получить инструкции, если дураки подведут Самого Милосердного Мастера. Щедрый Мастер подарил вам алхимическую формулу, чтобы вы могли спуститься во владения самого Могущественного Мастера и выкроить такое пространство."
 elixir_of_eternal_life_stage4_infernalist_decision_effect:0 "Вы войдёте во владения Всевластного Владыки."
 elixir_of_eternal_life_stage4_infernalist_decision_failure:0 "Разочарование Грознейшего Владыки сохранится очень надолго."
 elixir_of_eternal_life_stage4_infernalist_decision_success:0 "Великодушнейший Владыка дарует великую силу"
 elixir_of_eternal_life_stage4_infernalist_decision_tooltip:0 "С помощью Великодушнейшего Владыки вы сможете войти в его владения."
 elixir_of_eternal_life_stage4_internal_decision:0 "Идеальный баланс"
 elixir_of_eternal_life_stage4_internal_decision_confirm:0 "Я изолирую себя."
 elixir_of_eternal_life_stage4_internal_decision_desc:0 "Когда придёт время, вы завершите начатое так давно. В годовщину своего зачатия вы начнёте развязывать узлы смерти. Постепенно сердце, селезёнка, лёгкие, печень и почки станут подобны нефриту. В час своего рождения вы остановите сердце одной лишь мыслью. Так разорвутся телесные узы: скованное земным не может стать небесным. Так вознесётся дух: смертное нельзя очистить до совершенства. Если Восемь Бессмертных сочтут вас достойными Эликсира, вы вернётесь в новом облике, подобающем слуге Нефритового императора.\n\n#N В случае неудачи Восемь Бессмертных не дадут вам новой аудиенции целое столетие, чтобы вы успели достичь большего.#!"
 elixir_of_eternal_life_stage4_internal_decision_skills:0 "Ваш Ян ([diplomacy_i][diplomacy|E] + [martial_i][martial|E]) отличается от среднего значения вашего Инь ([intrigue_i][intrigue|E] + [stewardship_i][stewardship|E]) #bold не#! более чем на #color_white 15%#! в любую сторону"
 elixir_of_eternal_life_stage4_internal_decision_tooltip:0 "Я обрету равновесие, прежде чем окончательно остановить своё сердце."
 elixir_of_eternal_life_stage4_nourishing_decision:0 "Рождение эмбриона бессмертного"
 elixir_of_eternal_life_stage4_nourishing_decision_confirm:0 "Подготовьте ритуал."
 elixir_of_eternal_life_stage4_nourishing_decision_coterie_size:0 "Количество участников вашей группы «[GetPlayer.Custom('PODCoterie')]» — [EmptyScope.ScriptValue('coterie_max_size')]"
 elixir_of_eternal_life_stage4_nourishing_decision_coterie_skills:0 "У вашего [GetPlayer.Custom('PODCoterie')] должно быть не менее 25 во всех [skills|E]."
 elixir_of_eternal_life_stage4_nourishing_decision_demon_jade:0 "Владеть и экипировать [GetPODArtifactName('demon_jade_talisman_link')] [artifact|E]"
 elixir_of_eternal_life_stage4_nourishing_decision_desc:0 "Вы не выходите за пределы в одиночку; другие являются акушерками вашего возрождения. Когда придет время, ваша доверенная группа начнет довольно интимный ритуал трансцендентности. После того, как вы убьете себя лично изготовленным церемониальным оружием, которое сместит ваше место жизни, они продолжат ритуал. Они нарисуют на вашем трупе символы, оденут вас в специальную одежду и поместят ваш труп в локус ци. Пока солнце не сядет или не взойдет, они будут медитировать, молиться и петь, чтобы подготовить путь для вашего возвращения. Без сомнения, вы вернетесь с триумфом, поколебав Восьми Бессмертных. \n\n#N Если вы потерпите неудачу, Восемь Бессмертных не предоставят вам новую аудиторию в течение ста лет, обеспечивая ваш рост. #!"
 elixir_of_eternal_life_stage4_nourishing_decision_tooltip:0 "Вместе мы начнем ритуал трансцендентности."
 elixir_of_eternal_life_stage4_nourishing_decision_wu_shi:0 "Владеть и экипировать [GetPODArtifactName('wu_shi_link')] [artifact|E]"
 elixir_of_eternal_life_stage4_success_eoel_caveat:0 "Если добьетесь успеха, вы получите полный эликсир вечной жизни."
 elixir_of_eternal_life_starter_decision:0 "Поиск [Concept('POD_elixir_of_eternal_life', 'эликсира вечной жизни')|E]"
 elixir_of_eternal_life_starter_decision_confirm:0 "Приступим."
 elixir_of_eternal_life_starter_decision_desc:0 "Многим эликсир вечной жизни был подарен 8 Бессмертными или их слугами Ву Тянь. Однако легенды рассказывают о тех, кто достиг такого состояния просветления и сопутствующего бессмертия без их помощи. Многие считают такой подвиг невозможным. Как говорил сам Мастер, хотя глухие не могут услышать гром и оценить музыку, а солнце и великолепие одеяний Императора невидимы для слепых, это не значит, что этих вещей не существует. Некоторые говорят, что самостоятельное получение Эликсира — это испытание, которое покажет, что вы его достойны. Другие говорят, что это Небеса дают вам выбор, проклинать ли себя. \n\n#R Ваши шансы на успех в этом квесте абсурдно низки. Не пытайтесь сделать это, если вы заботитесь о благополучии вашего персонажа. \nДаже сохранение и перезагрузка игры на случай, если шансы не спасут вас позже. Вас предупредили.#!"
 elixir_of_eternal_life_starter_decision_requirement_courtiers:0 "Они имеют как минимум @skill_learning_icon!#color_white 15#! [learning|E], имеют как минимум #color_white 20#! [trait_level_track_xp|E] в создании отваров #weak ([GetTrait('pod_crafter').GetName(GetNullCharacter)])#!, являются [GetTrait('erudite').GetName(GetNullCharacter)], являются [GetTrait('sorcerer').GetName(GetNullCharacter)] или являются [GetTrait('theurgist').GetName(GetNullCharacter)]"
 elixir_of_eternal_life_starter_decision_requirement_dutchman:0 "Владеть и экипировать #TOOLTIP:artifact_flying_dutchman_description #L $artifact_flying_dutchman_name$#!#! [artifact|E] (можно найти в Умбре)"
 elixir_of_eternal_life_starter_decision_requirement_heave_the_host_of_hell:0 "У вас есть [GetPerk('heave_the_host_of_hell_perk').GetName(GetPlayer)] [perk|E] #weak ($blood_magic_kraina_of_the_well_visible$)#!"
 elixir_of_eternal_life_starter_decision_requirement_hunger_of_the_void:0 "У вас есть [GetPerk('hunger_of_the_void_perk').GetName(GetPlayer)] [perk|E] #weak ($blood_magic_kraina_of_enoch_visible$)#!"
 elixir_of_eternal_life_starter_decision_requirement_master_of_samsara:0 "У вас есть [GetPerk('master_of_samsara_perk').GetName(GetPlayer)] [perk|E] #weak ($blood_magic_path_of_karma_visible$)#!"
 elixir_of_eternal_life_starter_decision_requirement_minions_of_deep_marmora:0 "У вас есть [GetPerk('minions_of_deep_marmora_perk').GetName(GetPlayer)] [perk|E] #weak ($blood_magic_black_sea_kraina_visible$)#!"
 elixir_of_eternal_life_starter_decision_requirement_mooncrystal:0 "Владеть и экипировать #TOOLTIP:artifact_mooncrystal_description #L $artifact_mooncrystal_name$#!#! [artifact|E] (можно найти в Умбре)"
 elixir_of_eternal_life_starter_decision_requirement_quarters:0 "Владеть и экипировать #TOOLTIP:artifact_ship_of_the_four_quarters_description #L $artifact_ship_of_the_four_quarters_name$#!#! [artifact|E] (можно найти в Умбре)"
 elixir_of_eternal_life_starter_decision_requirement_redeyes:0 "Владеть и экипировать #TOOLTIP:artifact_redeyes_description #L $artifact_redeyes_name$#!#! [artifact|E] (можно найти в Умбре)"
 elixir_of_eternal_life_starter_decision_requirement_you:0 "У вас есть как минимум @skill_learning_icon!#color_white 25#! [learning|E], как минимум #color_white 50#! [trait_level_track_xp|E] в создании отваров #weak ([GetTrait('pod_crafter').GetName(GetNullCharacter)])#!, являетесь [GetTrait('erudite').GetName(GetNullCharacter)], являетесь [GetTrait('sorcerer').GetName(GetNullCharacter)] или являетесь [GetTrait('theurgist').GetName(GetNullCharacter)]"
 elixir_of_eternal_life_starter_decision_requirement_zadkiel:0 "Владеть и экипировать #TOOLTIP:artifact_lens_of_zadkiel_description #L $artifact_lens_of_zadkiel_name$#!#! [artifact|E] (можно найти в Умбре)"
 elixir_of_eternal_life_starter_decision_tooltip:0 "Эликсир вечной жизни мог бы даровать нам бессмертие без каких-либо недостатков."
 eoel_become_mummy_wutian_tt:0 "Вы станете мумией, что радикально изменит ваш игровой процесс, отключит ваши здания и уничтожит высшие титулы державы.\nЕсли вы не готовы к этому, то, скорее всего, ваша игровая партия окажется под угрозой срыва."
