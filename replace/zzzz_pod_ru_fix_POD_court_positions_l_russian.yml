 skutilsveinr_court_position:0 "Скутильсвейн"
 skutilsveinr_court_position_desc:0 "Скутильсвейн выступает в качестве каинитского командира в войсках смертных своего повелителя, превосходя по рангу большинство других воинов."
 triumvir_court_position:0 "Триумвир"
 triumvir_court_position_desc:0 "Один из двух соправителей, которые делят трон с правителем. Триумвир осуществляет полномочия основателей в совете, при дворе и на поле боя. Должность, которая имеет вес, только если её занимает тот, чьи навыки соответствуют ей.\n\n#help Требования к [Concept('aptitude', 'пригодности')|E] см. в «[triumvir|E]».#!"
