 pillar_of_darkness_apt_warrior_clan:0 "Из клана воинов"
 pillar_of_darkness_court_position:0 "Столп тьмы"
 pillar_of_darkness_court_position_desc:0 "У мрака Троицы появился лик: древнее, откровенно проклятое существо, восседающее при дворе.\n\n#help Требования к [Concept('aptitude', 'пригодности')|E] см. в «[pillar_of_darkness|E]».#!"
