 game_concept_pillar_of_darkness:0 "$pillar_of_darkness_court_position$"
 game_concept_pillar_of_darkness_desc:0 "$pillar_of_darkness_court_position$ вознаграждает кандидата - чем он старше, проклятее и разрушительнее, тем лучше.\n\nОн сильнее всего проявляется у явно проклятых: тех, кто почитает дорогу Дьявола, [GetTrait('baali').GetName(GetNullCharacter)|l] и тех, кто уже связан инфернальными договорами.\n\nДревняя жестокость помогает: древняя кровь четвёртого–шестого поколений, мастера Демонизма и #TOOLTIP:GAME_TRAIT,sadistic,[GetNullCharacter] #L садисты#!#!. Деструктивный темперамент даёт немного больше: высокое значение навыка [Concept('martial', 'военного дела')|E], #TOOLTIP:GAME_TRAIT,callous,[GetNullCharacter] #L бесчувственные#!#! и представители воинственных кланов, такие как #TOOLTIP:GAME_TRAIT,assamite,[GetNullCharacter] #L Ассамиты#!#! и [GetTrait('brujah').GetName(GetNullCharacter)]."
 game_concept_pillar_of_light:0 "$pillar_of_light_court_position$"
 game_concept_pillar_of_light_desc:0 "$pillar_of_light_court_position$ вознаграждает обольщённого новообращённого, сияющего, верующего или скорбящего.\n\nОн наиболее пригоден для набожных — тех, кто следует Кодексу наследия, дороге Небес или дороге Божественности, а также для #TOOLTIP:GAME_TRAIT,zealous,[GetNullCharacter] #L ревностных#!#! и тех, кто связан с вами любовью.\n\nПригодность выше у #TOOLTIP:GAME_TRAIT,toreador,[GetNullCharacter] #L тореадоров#!#! и тех, кто наделён Присутствием. Её также повышают высокие значения навыков [Concept('diplomacy', 'дипломатии')|E] или [Concept('learning', 'учёности')|E], #TOOLTIP:GAME_TRAIT,gregarious,[GetNullCharacter] #L общительность#!#!, красота и затаённая обида."
 game_concept_triumvir:0 "$triumvir_court_position$"
 game_concept_triumvir_desc:0 "[Concept('court_position', 'Придворная должность')|E] триумвира опирается на все аспекты правления, выставляя требования к хорошему показателю навыков [Concept('diplomacy', 'дипломатии')|E], [Concept('martial', 'военного дела')|E], [Concept('stewardship', 'управления')|E], [Concept('intrigue', 'искусства интриг')|E] и [Concept('learning', 'учёности')|E] — настоящий эрудит подойдёт на эту должность лучше всего.\n\nСвойства «[GetTrait('administrator').GetName(GetNullCharacter)]», «[GetTrait('erudite').GetName(GetNullCharacter)]», «[GetTrait('schemer').GetName(GetNullCharacter)]», «[GetTrait('diligent').GetName(GetNullCharacter)]», «[GetTrait('patient').GetName(GetNullCharacter)]» и/или «[GetTrait('ambitious').GetName(GetNullCharacter)]» повышают пригодность.\n\nСвойства «[GetTrait('lazy').GetName(GetNullCharacter)]», «[GetTrait('content').GetName(GetNullCharacter)]», «[GetTrait('arrogant').GetName(GetNullCharacter)]», «[GetTrait('craven').GetName(GetNullCharacter)]» и/или «[GetTrait('trusting').GetName(GetNullCharacter)]» ухудшают пригодность."
 jerusalem_ashen_muhtasib_court_position:0 "Пепельный мухтасиб"
 jerusalem_ashen_muhtasib_court_position_desc:0 "Сборщик податей с другой публики, распорядитель теневой логистики, надзиратель за тайными базарами, расследователь всевозможных подделок, инспектор мест, открытых для публики другого типа. Пепельный мухтасиб отвечает за множество задач, от проверки весов до обслуживания общественных бань. Как правитель Иерусалима, вы имеете право назначать одного из них, получив очередной рычаг воздействия на городскую торговлю."
 jerusalem_crown_speaker_court_position:0 "Глашатай короны"
 jerusalem_crown_speaker_court_position_desc:0 "В таких неспокойных землях, как Иерусалим, каждому князю нужен кто-то, кто представлял бы и продвигал его интересы, независимо от того, присутствует ли он здесь."
 jerusalem_puppeteer_grand_masters_court_position:0 "Кукловод великих магистров"
 jerusalem_puppeteer_grand_masters_court_position_desc:0 "Христианские рыцарские ордена, существовавшие ещё до крестовых походов, обладали огромной властью. В результате они были перегружены конкурирующими сверхъестественными влияниями. Чтобы создать пространство для себя, вам понадобится специальный представитель, ответственный за контроль над ними и манипулирование ими."
 jerusalem_socher_court_position:0 "Сочер"
 jerusalem_socher_court_position_desc:0 "Соединяя Восток и Запад, христиан и мусульман, еврейские купцы и их торговые пути охватывают большую часть известного мира, соединяя общины от Испании до Китая. Независимо от того, являются ли они мурашу, раданитами или авкалийцами, они служат гонцами, шпионами, посланниками, торговцами и ростовщиками. Их караваны перевозят специи, стеклянную посуду, векселя, личную корреспонденцию, религиозные документы и многое другое. Благодаря влиянию вашего ставленника, по этим торговым маршрутам могут перевозиться ваши приказы и товары."
 kertilsveinr_court_position:0 "Кертильсвейн"
 kertilsveinr_court_position_desc:0 "Кертильсвейн, избранный из смертных воинов, которые не отведали каинитской крови, отвечает за выполнение церемониальных и религиозных обязанностей."
