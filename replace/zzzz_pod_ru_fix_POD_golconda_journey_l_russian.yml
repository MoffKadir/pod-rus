l_russian:
 POD_golconda_journey.107.option.d.tt:0 "Вы становитесь западным [GetTrait('mummy').GetName(GetNullCharacter)] и продолжаете играть как [unlanded|E] [adventurer|E]. Вы можете потерять свой [THIS.Char.Custom('PODCoterie')] или своего супруга, если они теперь посчитают ваш [splat|E] враждебным."
 POD_golconda_journey.107.option.e.tt:0 "Вы становитесь восточным [GetTrait('mummy').GetName(GetNullCharacter)] и продолжаете играть как [unlanded|E] [adventurer|E]. Вы можете потерять свой [THIS.Char.Custom('PODCoterie')] или своего супруга, если они теперь посчитают ваш [splat|E] враждебным."
