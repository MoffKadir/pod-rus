l_russian:
 POD_asakku.0030.a:0 "Боритесь с этим."
 POD_asakku.0030.b:0 "Впусти это."
 POD_asakku.0030.desc:0 "Вы чувствуете это раньше, чем понимаете: неправильность в движении вашей крови, как будто что-то проверяет ток. С кем-то что-то глубоко, глубоко не так. Изменчивость в твоих венах сегодня ощущается по-другому. Тяжелее.\n\nПо правде говоря, это началось не сегодня вечером. Такие мелочи, как привкус в задней части горла, не связанный с каким-либо кормлением, или момент дезориентации, когда вы потянулись к знакомой дисциплине и на кратчайшее мгновение почувствовали, что что-то ещё потянулось вместе с вами. Руки, которыми ты не владеешь, двигаются в тандеме с твоими. \n\nВы не знаете, что с вами это делает. Знаешь только, что оно терпеливо и что сегодня оно ближе, чем накануне."
 POD_asakku.0030.t:0 "Что-то в крови"
 POD_asakku.0031.a:0 "Преодолейте сопротивление."
 POD_asakku.0031.a.failure.desc:0 "[defender.GetFirstName|U] сопротивляется. Кровь отвергает семя."
 POD_asakku.0031.a.success.desc:0 "Инфекция захватывает. Сопротивление [defender.GetFirstNamePossessive|U] рушится."
 POD_asakku.0031.b:0 "Откажитесь от попытки."
 POD_asakku.0031.desc:0 "Кровь [defender.GetFirstNamePossessive|U] сопротивляется. Не с пониманием [defender.GetSheHe] еще не знает, что движется через [defender.GetHerHim], а с упрямством старого $pod_vitae$, распознавшего чужую волю. Вы чувствуете отторжение, как давление на сжатый кулак. Вы можете пройти через это. Вопрос в том, стоит ли платить сегодня вечером эту цену."
 POD_asakku.0031.t:0 "Борьба"
 POD_asakku.0032.a:0 "Больше рук в мире."
 POD_asakku.0032.desc:0 "Это сделано. Инфекция взяла верх. Это можно почувствовать, как чувствуешь биение собственного сердца в чужой крови. [defender.GetSheHe|U] пока не знает, что случилось с [defender.GetHerHim]. Но [defender.GetSheHe|U] узнает.\n\nГолос в ваших мыслях отмечает завершение так, как мастер отмечает завершенную работу. В этом есть своего рода удовлетворение, но это удовлетворение не полностью ваше. Вы тот, кто сделал всю работу. Сущность – это тот, для кого была выполнена работа. В такие ночи становится трудно сказать, кто держит вожжи."
 POD_asakku.0032.t:0 "Семя пускает корни"
 POD_asakku.0033.a:0 "[defender.GetSheHe|U] оказался сильнее, чем ожидалось."
 POD_asakku.0033.desc:0 "Попытка не удалась. Что-то в крови [defender.GetFirstNamePossessive] сопротивляется, не понимание, не вера, а простое упрямство библейского проклятия, чувствующее, когда что-то глубоко неправильно и не должно быть здесь."
 POD_asakku.0033.t:0 "Сопротивление"
 POD_asakku.0034.a:0 "Кем я стал?"
 POD_asakku.0034.desc:0 "Ты просыпаешься с голосом, который не твой. Оно не говорит словами. Оно говорит с голодом, и с терпением, и с уверенностью, не имеющей ничего общего с верой. Вы изменились.\n\nИзменчивость, которая была с вами на протяжении веков, теперь ощущается по-другому, как будто она вспомнила что-то, что забыла. Когда вы потянетесь к этому сегодня вечером, что-то вернется обратно. Дисциплину у вас не отобрали, это лишь показало, что вы никогда не были ее единственным владельцем. \n\nВы все еще вы. По большей части. Та часть вас, которая все еще является вами, уже пытается определить, что представляет собой другая часть, и уже обнаруживает, что это более сложный вопрос, чем должен быть."
 POD_asakku.0034.t:0 "Что-то изменилось"
 POD_asakku.0035.a:0 "Я буду осторожнее."
 POD_asakku.0035.desc:0 "Кто-то пытался что-то подбросить тебе в кровь. На этот раз ты справился с этим. Память о вторжении сохраняется, как вкус, который вы не можете определить. \n\nЧто бы это ни было, оно интересовалось не вами конкретно, а Изменчивостью, а вы были просто комнатой, в которой Изменчивость жила. Эта мысль не утешает. Это подразумевает, среди прочего, что следующая попытка не потребует новых усилий. Комната все еще там. Кто-то уже нанес на карту дверь."
 POD_asakku.0035.t:0 "Вы сопротивлялись"
 POD_asakku.0250.a:0 "Отказаться. Это не мой бой."
 POD_asakku.0250.b:0 "Примите. Покажи мне, что нас преследует."
 POD_asakku.0250.desc:0 "[attacker.GetSheHe|U] приходит к вам так же, как люди, несущие ужасные знания, приходят к другим: осторожно, с особым терпением того, кто усвоил, что большинство людей не хотят слышать то, что они говорят. \n\nСвидетельства не являются драматичными. Модель поведенческих изменений у $pod_cainites$, несущих Изменчивость. Серия исчезновений при дворах, которые, если их разложить, сводятся к одной расходящейся точке на Кавказе. Имена, которые всплывают в отчетах разведки, а затем перестают всплывать, не потому, что люди умерли, а потому, что они перестали быть самими собой в каком-либо значимом смысле. \n\nЭлиуд, который приносит вам это, не похож на охотника. [attacker.GetSheHe|U] выглядит усталым, как будто кто-то, кто носил эти знания в одиночку дольше, чем это необходимо для здоровья. \n\n[attacker.GetSheHe|U] просит вас нести часть этих знаний."
 POD_asakku.0250.t:0 "Предложение"
 POD_asakku.0251.a:0 "Добро пожаловать в камут."
 POD_asakku.0251.desc:0 "[defender.GetFirstName|U] принимает. Не с энтузиазмом, который вызвал бы беспокойство, и не с нежеланием, которое было бы бесполезно. [defender.GetSheHe|U] принимает это с мрачной ясностью человека, который взглянул на доказательства и понял, что они означают. Это тот вид принятия, который длится долго. \n\nВы показываете [defender.GetHerHim] протоколы. Железные иглы, которые Ямаданда разработал для обозначения развращенных. Признаки, которые следует искать в $pod_cainite$, чья Изменчивость начала отвечать чему-то другому, а не своему владельцу. Особая тишина, окутывающая двор, где пустила корни инфекция. \n\n[defender.GetSheHe|U] принимает ее. К чести [defender.GetHerHis], [defender.GetSheHe] не вздрагивает. Когда вы закончите, [defender.GetSheHe] задает вопрос, который задает каждый новый охотник, который отделяет тех, кто выдержит, от тех, кто не выдержит: \"Как мы узнаем, что победили? \"\n\nВы даете [defender.GetHerHim] ответ, который дает каждый опытный охотник: \"Никак. Мы знаем лишь, что ещё не проиграли.\""
 POD_asakku.0251.t:0 "Новый Охотник"
 POD_asakku.0252.a:0 "Будут и другие."
 POD_asakku.0252.desc:0 "[defender.GetFirstName|U] слушает. [defender.GetSheHe|U] считает. И тогда [defender.GetSheHe] отказывается, как разумные люди отказываются от необоснованных просьб, с осторожной вежливостью того, кто решил, что говорящий с ними либо ошибается, либо нездоров. \n\nВы не можете винить [defender.GetHerHim]. Доказательства, изложенные для человека, который не потратил годы на то, чтобы научиться их читать, выглядят как паранойя. Закономерности исчезновений во дворе. Поведенческие изменения, которые можно объяснить десятком обыденных причин. Теория заговора о древней сущности, которая живет в крови носителей Изменчивости. Для непосвященных это звучит точно так же, как говорят себе $pod_cainite$, когда Долгая Ночь затянулась и тени начали выглядеть так, будто у них есть намерения. \n\nВы складываете улики. Вы благодарите [defender.GetHerHim] за время, потраченное на [defender.GetHerHis]. Вы выходите в ночь, зная, что в следующий раз, когда увидите [defender.GetHerHim], вы будете следить за знаками. Потому что сущности не нужны верующие. Ей нужны только носители."
 POD_asakku.0252.t:0 "В наборе отказано"
 POD_asakku.0301.a:0 "Больше рук в мире."
 POD_asakku.0301.desc:0 "Сущность, поднимающаяся из колодца, не дает, она заменяет. Вы открываете вену и даете заключенному пить до тех пор, пока [target.GetSheHe] не перестанет быть пустым. \n\n[target.GetSheHe|U] сначала сопротивляется. Затем вкус достигает [target.GetHerHim], и сопротивление заканчивается. [target.GetSheHe|U] пьет, пройдя тот момент, когда обычная кровь перестает быть интересной. [target.GetSheHe|U] пьет до тех пор, пока что-то в лице [target.GetHerHis] не изменится, появится небольшое расслабление в уголках рта, неподвижность в глазах, которой раньше не было. \n\n Утром [target.GetSheHe] проснется, и глазами [target.GetHerHis] будет смотреть что-то, чего не было раньше. [target.GetSheHe|U] не запомнит это изменение как насилие. [target.GetSheHe|U] запомнит это, если [target.GetSheHe] вообще запомнит, как возвращение домой."
 POD_asakku.0301.t:0 "Зарождение в крови"
 POD_asakku.0302.a:0 "Хорошо."
 POD_asakku.0302.desc:0 "[target.GetFirstName|U] просыпается дезориентированным, как вы и ожидали. Чего вы не ожидали, так это того, что [target.GetSheHe] смотрит на вас так, как выглядит зеркало, без выражения лица, полностью принадлежащего [target.GetHerHis]. \n\n[target.GetSheHe|U] говорит голосом, который может отличаться от [target.GetHerHis]. \n\nВы заметили. И голос в вашей крови замечает, что вы это заметили, и между вами наступает момент чего-то вроде общего веселья, в котором вы не можете точно уловить нить. Когда вы перестанете смеяться, вы не уверены, кто из вас начал."
 POD_asakku.0302.t:0 "На следующее утро"
 POD_asakku.0310.a:0 "Пусть оно растет."
 POD_asakku.0310.desc:0 "Кровь впитывается быстрее, чем должна. К утру трава на границе вашего владения приобрела красноватый оттенок. Голос в ваших мыслях удовлетворен, как это редко бывает с людьми."
 POD_asakku.0310.t:0 "Посев сада"
 POD_asakku.0320.a:0 "Знание – это сила."
 POD_asakku.0320.desc:0 "Вы достигаете через соединение. С каждым разом требуется меньше усилий. Через кровь, которую вы вложили в них, вы чувствуете то же, что они, и учитесь тому, чему научились они."
 POD_asakku.0320.t:0 "Шепот души"
 POD_asakku_KAMUT_SUCCESS_DESC:0 "Цель была завербована в сеть Элиуда."
 POD_asakku_SOUL_INFECTION_SUCCESS_DESC:0 "Цель заражена Присутствием Асакку."
 POD_asakku_blood_inception_interaction:0 "Зарождение в крови"
 POD_asakku_blood_inception_interaction_desc:0 "Вскройте вену и дайте заключенному выпить. Замените то, что есть, на то, что вы носите с собой."
 POD_asakku_cancel_scheme_tt:0 "Отмените схему заражения души."
 POD_asakku_deep_corruption_tt:0 "Ваша глубокая порча усиливает инфекцию"
 POD_asakku_kamut_recruitment_interaction:0 "Вербовка в камут"
 POD_asakku_kamut_recruitment_interaction_desc:0 "Вербуйте этого персонажа в сеть охотников Элиуда для борьбы с угрозой Асакку."
