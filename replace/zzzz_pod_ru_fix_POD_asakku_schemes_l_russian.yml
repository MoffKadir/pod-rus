 POD_asakku_soul_infection_scheme_desc:0 "Я заражу [SCHEME.GetTargetCharacter.GetShortUINameNoTooltip] присутствием Асакку."
 POD_asakku_soul_infection_scheme_desc_general:0 "Распространите влияние Асакку через вектор Изменчивости."
