 pod_mod_compatibility_domicile:0 "Один из ваших модов перезаписывает файл:\n\n#bold /gui/window_domicile.gui#!\n\nЭтот файл необходим для сохранения построек убежища при смене формы правления или переходе между безземельным и оседлым состоянием.\n\nНастоятельно рекомендуем отключать другие моды, пока это предупреждение не исчезнет."
