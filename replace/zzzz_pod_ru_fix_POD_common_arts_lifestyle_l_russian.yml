l_russian:
 COMMON_ARTS_AUGURY_PERK_EFFECT:0 "$cantrip_standard_bunk$ Призовите $POD_splat_mortal$ с помощью [skills|E] по вашему выбору на свой [court|E].\n$countermeasures_unlocks_t4_all_seeing_eye$\n#flavor Провидец глубоко проникает в переплетение и уток Дана, уговаривая силы судьбы и Мечты открыть путь к желанию своего сердца. Предсказание — общеизвестно коварное и неопределенное Искусство, поскольку путь, который оно открывает, всегда фрагментарен и туманен — но если следовать ему усердно, он приведет к будущему, которое ищут Фейри. Вместо того, чтобы предоставлять список инструкций для достижения поставленной цели, Пророчество вместо этого предлагает дразнящие намеки, подсказки, предзнаменования и интерпретирующие видения. Но Авгурий всего лишь обещает предопределенный путь — не короткий, легкий или дешевый. Чем ценнее будущее, к которому стремятся с помощью этого трюка, тем более требовательной оказывается дорога, которую он прокладывает.#!"
 COMMON_ARTS_BEASTSKIN_PERK_EFFECT:0 "$cantrip_easy_bunk$ Дайте цели [modifier|E], увеличивая один [skill|E] на #P 5#!.\n[PODUnlocksCombatMove('POD_combat_move_fae_metamorphosis_beastskin_talons')].\n#flavor Это удобное благословение или проклятие улучшает Метаморфозу, позволяя осуществлять частичные трансформации. Невежливому смертному могла быть дарована морда свиньи, благородному коню — крылья лебедя, а загнанной в угол простолюдинке — свирепые когти или отравленные клыки, чтобы сражаться. #!"
 COMMON_ARTS_CHIMERIC_EXULTATION_PERK_EFFECT:0 "[shapeshift|EU] Вариант: Стать мифическим зверем. \n#flavor Это фантастическое заклятие позволяет Фейри превратить свою цель в легендарное существо или даже в фантастического зверя по ее собственному воображению, смешивая черты и природу разных существ. Драконы, мантикоры, грифоны, легендарные кракены — любого можно вызвать с помощью Химерического Ликования.#!"
 COMMON_ARTS_DANCE_OF_THE_FIVE_KINGS_PERK_EFFECT:0 "$unlock_forging_node$ Добавьте [modifier|E], основанный на типе [artifact|E], с силой, основанной на вашем $fae_prop_realm$.\n[PODUnlocksCombatMove('POD_combat_move_fae_primal_dance_five_kings')].\n#flavor Этот мощный заговор делает Фейри повелителем пяти элементов. Она приказывает, и пламя, земля и вода прыгают, подчиняясь ей. Она может направлять любые проявления стихий, которые уже присутствуют, атаковать, сдерживать, ловить, расчищать путь или просто изменять себя по своему вкусу.#!"
 COMMON_ARTS_DREAM_CRAFT_PERK_EFFECT:0 "$cantrip_standard_bunk$ Уменьшите [stress|E] цели с помощью #V 30#!.\nУлучшает [GetPerk('common_arts_dream_walk_perk').GetName(GetPlayer)] [cantrip|E], давая вместо этого #V 40#! [static_stress|E]. \n#flavor Некоторые мечты остаются с мечтателями даже после просыпаясь, окрашивая настроение и тон своего дня. Онейромант больше не ограничивается входом в сон цели и минимальным взаимодействием, он может контролировать мир сновидений, создавая мирные картины в сознании спящего или вызывая ужасные ужасы, которые будут преследовать его на следующий день. #!"
 COMMON_ARTS_DREAM_LOGIC_PERK_EFFECT:0 "$cantrip_easy_bunk$ Дайте цели [GetModifier('cantrip_dream_logic_modifier').GetNameWithTooltip].\n#flavor Разрозненные и нелогичные связи процветают в хаосе Грезы, а подменыши, владеющие мошенничеством, извлекают выгоду из странностей логики сновидений, чтобы запутывать их и манипулировать ими. Когда разум цели окутывается Гламуром и последующими Туманами, она дезориентируется и не подвергает сомнению утверждения или команды, которые обычно не имеют для нее большого смысла. Тайно эшу передает сообщения и посылки сбитым с толку смертным курьерам. Смотритель зоопарка-тролля приручает новых животных, к которым никто другой не может безопасно приблизиться.#!"
 COMMON_ARTS_DREAM_LOGIC_PERK_REASON:0 "[GetPerk('common_arts_dream_logic_perk').GetName(GetPlayer)]: $VALUE|0+=$"
 COMMON_ARTS_DREAM_PORTAL_PERK_EFFECT:0 "$cantrip_easy_bunk$ Телепортируйтесь к следующему пункту назначения [travel|E]. \n#flavor Используя тонкую грань между сновидящим разумом и самими Грёзами, онейромант может перекрыть их, чтобы создать портал. Сон субъекта становится промежуточной станцией в Грёзах, которая соединяет местоположение заклинателя с местоположением спящего.#!"
 COMMON_ARTS_DREAM_PUPPET_PERK_EFFECT:0 "$cantrip_exceptional_bunk$ [imprison|E] цель.\n#flavor Некоторые ученики Онейромантии отказываются от пути, когда становится ясна кульминация их обучения. Мастер-онейромант больше не ограничивается манипулированием снами или их пересечением с Грёзами: он может вторгнуться в разум цели и взять на себя контроль над ее формой, пока она спит.#!"
 COMMON_ARTS_DREAM_WALK_PERK_EFFECT:0 "$cantrip_easy_bunk$ Дать цели #V 20#! [static_stress|E].\n#flavor После изучения первого заговора Онейромантии Фейри может построить мост между Сновидением и разумом своей цели, позволяя ей полностью погрузиться в сон. Она должна нацелиться на кого-то или что-то спящее, которого она либо хорошо знает, либо может видеть. Затем персонаж полностью погружается в сны цели и исчезает из обыденного мира. Субъект может осознавать, а может и не осознавать, что Фейри — это нечто большее, чем просто часть ее сна, но он вспомнит сон после пробуждения.#!"
 COMMON_ARTS_EFFIGY_PERK_EFFECT:0 "Разблокируйте различные $POD_construct_maa$ [men_at_arms|E].\n$cantrip_standard_bunk$. Скопируйте [artifact|E], который у вас есть. \n#flavor Манипуляции с Гламуром, достаточно сложные для копирования чего-либо, требуют времени и терпения, чтобы довести их до совершенства, но после освоения можно создавать копии, достаточно хорошие, чтобы обмануть наблюдателя, по крайней мере, на некоторое время. Воровка-пука может сделать хорошую копию картины, которую она согласилась украсть и продать, но теперь хочет сохранить для своей коллекции. Коммивояжер из красной шапки может вылепить копию мопса, которого он только что съел, чтобы семья не заметила пропажу собаки, пока он не уйдет. #!"
 COMMON_ARTS_ELDER_FORM_PERK_EFFECT:0 "[shapeshift|EU] Вариант: стать элементалем.\n#flavor Этот мощный заклятие позволяет Фейри наполнить кого-то или что-то самой сущностью одного из элементов, превращая их в живое проявление силы стихий.#!"
 COMMON_ARTS_ELDRITCH_PRIME_PERK_EFFECT:0 "$cantrip_standard_bunk$ Управляйте погодой на определенной территории с помощью $fae_scene_realm$ и $fae_nature_realm$.\nРазблокируйте различные элементали [men_at_arms|E].\n#flavor Этот заговор позволяет Фейри вызывать в воображении проявления элементов земли, воды, дерева, огня или воздуха. Это проявляется в самой естественной форме — вода льется с неба в виде дождя или пузырится из земли небольшим родником, например. Камни с грохотом вырвались из земли. Растения растут из земли с неестественной скоростью. Однако эти проявления могут возникать в совершенно неестественных местах, например, дождь внутри здания или цветущие ветви, растущие из головы разгневанного учителя математики, как красивые рога. #!"
 COMMON_ARTS_ELECTRIC_GREMLINS_PERK_EFFECT:0 "$cantrip_hard_bunk$ Дайте цель [artifact|E] [GetModifier('cantrip_electric_gremlins_modifier').GetNameWithTooltip].\n#flavor Это заклятие вызывает множество гремлинов — мелких химер, которые сеют хаос со сложными предметами. Гремлины — крошечные зеленовато-желтые существа, наделенные способностью прятаться за чем угодно, даже маленьким, при прямом наблюдении, чье присутствие нарушает работу сложные предметы.#!"
 COMMON_ARTS_ENGULF_PERK_EFFECT:0 "$passive_cantrip_fae$ Нанесите [EmptyScope.ScriptValue('common_arts_engulf_perk_damage')] [POD_aggravated_damage_with_box|E] врагу [knights|E], действуя в роли [commander|E] во время [combat_phase|E], или своему противнику во время [single_combat_duel_plural|E].\n[PODUnlocksCombatMove('POD_combat_move_fae_pyretics_engulf')].\n#flavor Иногда Фейри просто нужно что-то поджечь. Простое и мощное заклинание «Поглощение» поджигает цель. Фейри могут выбирать, сгорит ли фокус магии от пламени или останется защищенным от венца магического огня.#!"
 COMMON_ARTS_ENSNARE_PERK_EFFECT:0 "$passive_cantrip_fae$ Дайте [GetModifier('cantrip_ensnare_modifier').GetNameWithTooltip] врагу [knights|E] в начале войны. \n[PODUnlocksCombatMove('POD_combat_move_fae_legerdemain_ensnare')].\n#flavor Полезно для того, чтобы убежать от отметки или догнать кого-то, кто должен персонажу деньги, ловушка заставляет цель замедляться или обездвиживаться. Кажется, что мебель прыгает на пути цели, выбоины сбивают шины и трескают оси, или земля поднимается, чтобы отвести стремящуюся воду. Даже при отсутствии поблизости разумной причины для помех щупальца Гламура, созданные этим заклинанием, все равно спотыкаются, замедляют и отягощают цель.#!"
 COMMON_ARTS_FACE_FATE_PERK_EFFECT:0 "$cantrip_standard_bunk$ Дайте цель [GetModifier('cantrip_face_fate_positive_modifier').GetNameWithTooltip].\n$cantrip_standard_bunk$ Дайте цели [GetModifier('cantrip_face_fate_negative_modifier').GetNameWithTooltip].\n[PODUnlocksCombatMove('POD_combat_move_fae_soothsay_face_fate')].\n#flavor В этом величайшем подвиге гадания провидица кладет руки прямо на нити, составляющие великий гобелен Дана, и сгибает их по своей воле, благословляя субъект, которому повезло, или проклинающий его ужасными предзнаменованиями. Точное выражение этой манипуляции судьбой всегда трудно предсказать, но знаки не могут быть ошибочными.#!"
 COMMON_ARTS_FLICKER_FLASH_PERK_EFFECT:0 "[PODUnlocksCombatMove('POD_combat_move_fae_wayfare_flicker_flash')].\n#flavor Это грозное заклятие позволяет своему хозяину идти куда угодно, и никто не может преградить ей путь. Это чудесный трюк с исчезновением колдунов и злорадных воров, позволяющий субъекту исчезнуть и появиться снова, где бы он ни пожелал.#!"
 COMMON_ARTS_GIMMIX_PERK_EFFECT:0 "[PODUnlocksCombatMove('POD_combat_move_fae_legerdemain_gimmix')].\n#flavor Смертные маги проводят бесчисленные часы, разыгрывая сложные трюки, чтобы убедить других, что они могут перемещать и управлять объектами силой своего разума. Применяя Притягивание, Фейри нужно всего лишь потратить Гламур, чтобы перемещать и манипулировать всем, что она видит, со значительной точностью и силой. Рыцарь Ши останавливает стрелу в нескольких дюймах от груди своего повелителя. Служащий парковки слуа отправляет фургон, управляемый вампиром, вылететь с обочины парковки. Красный хирург удерживает своего «пациента» достаточно долго, чтобы наложить ограничения. Нокер взламывает замок двери своей камеры без каких-либо инструментов.#!"
 COMMON_ARTS_HOPSCOTCH_PERK_EFFECT:0 "#flavor Это искусство невероятных прыжков, потенциально позволяющее субъекту преодолевать высокие здания одним прыжком. Классики перемещают объект вперед или вверх по желанию заклинателя, а Гламур, внедренный в прыжок, гарантирует, что приземление всегда будет безвредным, независимо от того, как далеко цель упадет перед ударом. Некоторые пука утверждают, что Классики когда-то был их собственной особой магией, украденной обманщиком эшу во времена легенд и распространенной среди остальных Фейри — но кто верит пука? #!"
 COMMON_ARTS_HOWLING_GALE_PERK_EFFECT:0 "$cantrip_standard_bunk$ Дайте цели [GetModifier('cantrip_howling_gale_modifier').GetNameWithTooltip].\n[PODUnlocksCombatMove('POD_combat_move_fae_skycraft_howling_gale')].\n#flavor Фея может вызвать мощный ветер, используя его, чтобы ускорить движение себя или своих союзников, сбить с толку своих врагов или просто дуть по своему желанию.#!"
 COMMON_ARTS_HURRICANE_SPEED_PERK_EFFECT:0 "Улучшает [GetPerk('common_arts_howling_gale_perk').GetName(GetPlayer)] [cantrip|E], давая вместо него [GetModifier('cantrip_hurricane_speed_modifier').GetNameWithTooltip]. \n#flavor Фейри вызывает саму суть ветра и вселяет ее в человека или вещь. Те, кто наделен ураганной скоростью, не только обретают стремительность ветра, но и его обширную перспективу, ускоряющую их рефлексы и реакции. Объекты становятся едиными с ветром, переносясь на огромные расстояния, когда их побуждают двигаться.#!"
 COMMON_ARTS_ILLUMINATE_PERK_EFFECT:0 "$passive_cantrip_fae$ Отдайте [GetModifier('cantrip_illuminate_modifier').GetNameWithTooltip] врагу [knights|E], действуя в роли [commander|E] во время [combat_phase|E], или своему врагу во время [single_combat_duel_plural|E].\n[PODUnlocksCombatMove('POD_combat_move_fae_pyretics_illuminate')].\n#flavor Бесчисленные мифы о творении смертных начинаются с божественного света, пронзающего тьму. Подменыши, владеющие жаропонижающими средствами, обладают силой, лежащей в основе таких историй. Направляя Гламур в это заклинание, китэйн может создать свет, который рассеивает тьму, иллюзии и мелкие уловки.#!"
 COMMON_ARTS_KINDLE_PERK_EFFECT:0 "$passive_cantrip_fae$ Дайте [GetModifier('cantrip_kindle_modifier').GetNameWithTooltip] врагу [knights|E], действуя в роли [commander|E] во время [combat_phase|E], или своему противнику во время [single_combat_duel_plural|E]. \n#flavor Простое, но чрезвычайно полезное заклятие «Разжигание» нагревает фокус Гламура настолько, чтобы вызвать дискомфорт, но не ранить. Оно может приготовить еду, помочь разжечь огонь или вызвать у кого-то пот и лихорадку.#!"
 COMMON_ARTS_LORD_OF_LEVIN_PERK_EFFECT:0 "$cantrip_hard_bunk$ Нанесите [EmptyScope.ScriptValue('common_arts_lord_of_levin_perk_interaction_damage')] [POD_aggravated_damage_with_box|E] на цель.\nУлучшает [GetPerk('common_arts_howling_gale_perk').GetName(GetPlayer)] [passive_cantrip|E], нанося вместо этого [EmptyScope.ScriptValue('common_arts_lord_of_levin_perk_damage')] [POD_superficial_damage_with_box|E].\n[PODUnlocksCombatMove('POD_combat_move_fae_skycraft_lord_of_levin')].\n#flavor Мастер небесного ремесла повелевает небесным огнем и может посылать молния, чтобы поразить ее врагов. Этот заговор обычно работает только под открытым небом, но Фейри, зачаровавшая себя Грозовым Покровом, может использовать Лорда Левина, чтобы бросать молнии из кончиков пальцев, пока Грозовой Покров сохраняется.#!"
 COMMON_ARTS_LOST_IN_THE_MISTS_PERK_EFFECT:0 "$cantrip_hard_bunk$ Измените [personality_traits|E] цели.\n[PODUnlocksCombatMove('POD_combat_move_fae_chicanery_lost_in_mists')].\n#flavor Что может быть хуже, чем неспособность доверять своим чувствам, быть невидимым или даже быть забытым? Мастера мошенничества используют самые совершенные манипуляции Туманами, чтобы выведать личность своей цели. В центре внимания этого колдовства не только забывается, кто он такой, но и Фейри может использовать свои знания о других Царствах, чтобы заставить его поверить, что он нечто совершенно иное. Соперник нокера начинает вести себя как собака, представляя новое изобретение. Вампир, терроризирующий местных жителей, просыпается, не помня о своем состоянии нежити, и паникует, когда выходит наружу и солнечный свет обжигает ее кожу. Клюрикаун заставляет смертного поверить, что он дождевая туча, чтобы мгновенно создать перформанс.#!"
 COMMON_ARTS_MANIFEST_PERK_EFFECT:0 "Разблокируйте различные $POD_chimera_maa$ [men_at_arms|E], если вы $POD_splat_changeling$.\n#flavor. Под командованием Онейроманта элементы сна могут ожить в бодрствующем мире в виде химер. Она сохраняет ограниченный контроль над разумной химерой в течение некоторого времени после того, как сновидец просыпается, но без Гламура заклинателя химера исчезнет, ​​когда сон забудется. Вложив свою волю в проявление, Онейромант может даже вытащить химеру в обыденный мир, хотя она исчезнет еще быстрее.#!"
 COMMON_ARTS_MOOCH_PERK_EFFECT:0 "$cantrip_exceptional_bunk$ Украсть [artifact|E].\n#flavor Похищение предоставляет подменышам быстрый и простой способ оплаты еды. В случае успеха Похищение мгновенно передает один неодушевленный предмет из владения цели Фейри. Предмет может появиться в руке, кармане или носке персонажа — в любом месте на его теле, по его желанию.#!"
 COMMON_ARTS_OAKENSHIELD_PERK_EFFECT:0 "$cantrip_standard_bunk$ Дайте цели [GetModifier('cantrip_oakenshield_modifier').GetNameWithTooltip].\n[PODUnlocksCombatMove('POD_combat_move_fae_primal_oakenshield')].\n#flavor Этот полезный трюк укрепляет цель защитной элементальной оболочкой. Несмотря на название, это не обязательно должен быть слой коры, напоминающей броню; он также может сделать кожу человека твердой, как мрамор, позволить кажущейся твердой поверхности двери расплескаться и измениться, как вода, при ударе. #!"
 COMMON_ARTS_OMEN_PERK_EFFECT:0 "$cantrip_easy_bunk$ Откройте случайный [secret|E] цели.\n$countermeasures_unlocks_t2_all_seeing_eye$\n[PODUnlocksCombatMove('POD_combat_move_fae_soothsay_omen')].\n#flavor Этот элементарный заговор дает кратчайший путь к проблеску нити судьбы человека, места или вещи. Раскрытое предзнаменование всегда расплывчато и редко связано с непосредственными событиями — на этом уровне провидец в лучшем случае может увидеть общую природу судьбы вещи.#!"
 COMMON_ARTS_PHOENIX_SONG_PERK_EFFECT:0 "$cantrip_hard_bunk$ Отдать цель [GetModifier('extra_life_1_modifier').GetNameWithTooltip].\n#flavor Феникс сгорает дотла, и от разрушенного пламени возрождается вновь как новый. Владение искусством Пламя дает Фейри силу новой жизни перед лицом разрушения. Если после того, как Фейри призовет Песнь Феникса, получатель этого благословения умрет или будет уничтожен иным образом, он сгорит дотла и вскоре возродится как новый.#!"
 COMMON_ARTS_PORTAL_PASSAGE_PERK_EFFECT:0 "$cantrip_standard_bunk$ Телепортируйте свою армию. \n#flavor Это Искусство входа и выхода, когда и где угодно Фейри пожелает. Портальный проход создает дверь, достаточно большую, чтобы через нее могли пройти Фейри, которая пробивает любой барьер толщиной до 10 футов — будь то кирпичная стена, живая изгородь или борт движущегося фургона, не имеет значения для колдовства. Двери, созданные с помощью Проход через портал, уникальны для Фейри, создавшей их, и могут быть распознаны и идентифицированы теми, кто с ней знаком.#!"
 COMMON_ARTS_PURITY_PERK_EFFECT:0 "$cantrip_standard_bunk$ Исцелить любую болезнь.\n$cantrip_standard_bunk$ Исцелить [EmptyScope.ScriptValue('POD_pyretics_interaction_superficial_heal_value')] [POD_superficial_damage_with_box|E].\n$cantrip_standard_bunk$ Исцелить [EmptyScope.ScriptValue('POD_pyretics_interaction_aggravated_heal_value')] [POD_aggravated_damage_with_box|E].\n#flavor Ни одна примесь не выдержит достаточного нагрева, но изучающий жаропонижающие вещества может сжечь примеси с помощью химерический огонь, который не повреждает и не поглощает цель. Purify делает воду и пищу безопасными для употребления, может уничтожить инфекцию или яд и даже временно вылечить болезнь. Соединив заклинание с Царством Фейри, заклинатель может даже сжечь проклятия и эффекты других заклинаний.#!"
 COMMON_ARTS_QUICKSILVER_PERK_EFFECT:0 "[PODUnlocksCombatMove('POD_combat_move_fae_wayfare_quicksilver')].\n#flavor Быстрая ухмылка, объект этого колдовства движется буквально размытым пятном, оставляя за собой следы израсходованного Гламура в виде скоростных линий, потрескивающих молний или какого-либо другого визуального разряда. Пестрая толпа писки бежит к мчащейся повозке с украденным сокровищем, сжигая за собой дорогу. Рыцарь Ши взрывается вспышкой сверкающей стали и шипящей магии.#!"
 COMMON_ARTS_SEERS_WISP_PERK_EFFECT:0 "$cantrip_standard_bunk$ Откройте (вызовите) [artifact|E] с помощью [rarity|E] на основе вашего $fae_prop_realm$ [fae_realm|E].\n$cantrip_easy_bunk$ Получите количество [gold|E] на основе вашего $fae_prop_realm$ [fae_realm|E].\n#flavor Провидец получает способность вызовите яркий фрагмент из сердца Грёз, чтобы привести ее туда, куда ей нужно отправиться. Она может прошептать Огоньку имя или описание предмета, человека или места, которое она ищет, и это безошибочно приведет ее туда путями Дана.#!"
 COMMON_ARTS_SMOKE_AND_MIRRORS_PERK_EFFECT:0 "Улучшает [GetPerk('common_arts_ensnare_perk').GetName(GetPlayer)] [passive_cantrip|E], добавляя вместо него [GetModifier('cantrip_smoke_and_mirrors_modifier').GetNameWithTooltip]. \n#flavor Мастера Лежедемана выходят за рамки ничтожных копий или временных манипуляций и могут создавать длительные, убедительные иллюзии с помощью своего Гламура. Полуразрушенный, сломанный мост может показаться достаточно прочным, чтобы по нему могла проехать повозка, или тролль-силовик может отступить, увидев сатира с целой толпой разгневанных (и иллюзорных) друзей позади него. Персонаж может даже создать целую вечеринку с едой, гостями и музыкой.#!"
 COMMON_ARTS_SPARROWS_AND_NIGHTINGALES_PERK_EFFECT:0 "[shapeshift|EU] Вариант: Измените свой визуальный возраст и черты лица. \n#flavor Этот заклятие позволяет Фейри изменить одну из основных черт цели, изменяя одну фундаментальную особенность на некоторую правдоподобную альтернативу. Она могла превратить мужчину в женщину, рыжего человека в темноволосого, сделать невысокую женщину высокой или чернокожего мужчину белым. #!"
 COMMON_ARTS_STORM_SHROUD_PERK_EFFECT:0 "$passive_cantrip_fae$ Нанесите [EmptyScope.ScriptValue('common_arts_storm_shroud_perk_damage')] [POD_superficial_damage_with_box|E] врагу [knights|E], действуя в роли [commander|E] во время [combat_phase|E], или своему противнику во время [single_combat_duel_plural|E]. \n#flavor Фейри призывает сущность молнии в цель этого заклинания, окружая ее мерцающим ореолом разрушительной электрической энергии.#!"
 COMMON_ARTS_TATTLETALE_PERK_EFFECT:0 "Улучшает [GetPerk('common_arts_omen_perk').GetName(GetPlayer)] и [GetPerk('common_arts_seers_wisp_perk').GetName(GetPlayer)] [cantrips|E] с помощью $cantrip_difficulty_reduce$.\n$countermeasures_unlocks_t3_all_seeing_eye$\n#flavor. Этот полезный заговор позволяет провидцу предвидеть отдаленные сцены через объект или человека, которого он заколдовал для этой цели. Традиционно все, что находится в непосредственной близости от фокуса Сплетницы, отображается на ближайшей отражающей поверхности или на поверхности по выбору Фейри. Фейри могут использовать любое заклинание, основанное на восприятии, через фокус, как только соединение будет установлено.#!"
 COMMON_ARTS_THOUSANDSKINS_PERK_EFFECT:0 "[shapeshift|EU] Вариант: стать животным. \n#flavor Этот могущественный заговор позволяет Фейри превращать человека или предмет в животное. Люди, преобразованные таким образом, сохраняют свой разум и инстинкты, но приобретают физические черты, сенсорные способности и ограничения, а также особые способности любого животного, в которое они были превращены. Объекты, превращенные в животных, на время трансформации обретают разум «типичного» представителя того вида, которым они стали, так что кролик будет пугливым, лев будет охотиться и так далее. Трансформированные люди и фейри сохраняют способность говорить, но только для тех, кто способен воспринимать химерическую реальность.#!"
 COMMON_ARTS_TRICK_OF_THE_LIGHT_PERK_EFFECT:0 "$passive_cantrip_fae$ Отдайте [GetModifier('cantrip_trick_of_the_light_modifier').GetNameWithTooltip] врагу [knights|E], действуя в роли [commander|E] во время [combat_phase|E], или своему противнику во время [single_combat_duel_plural|E].\n#flavor Тонкая манипуляция Гламуром с целью запутать восприятие, Уловка Света создает недопонимание и ошибки. Пука, устраивающий аферу с похищением людей, звучит так же, как мать Марка по телефону. Эшу, преследуемый невменяемым охотником, заходит на рынок и сливается с толпой. Не повезло, Ши отдает одну золотую монету 100, чтобы она могла поесть сегодня вечером.#!"
 COMMON_ARTS_VEILED_EYES_PERK_EFFECT:0 "$cantrip_hard_bunk$ Уничтожьте [artifact|E] с лимитом [rarity|E], основанным на вашем $fae_prop_realm$ [fae_realm|E].\n[PODUnlocksCombatMove('POD_combat_move_fae_chicanery_veiled_eyes')].\n#flavor Там, где Уловка Света заставляет зрителя принимать одно за другое, Скрытые Глаза используют Туманы, чтобы мгновенно забыть цель колдовства. Китэйн, одетая в изысканные одежды, может пройти сквозь толпу смертных незамеченной, богато украшенный палаш тролля свободно висит у нее на бедре, но его игнорируют, когда она входит в банк, а враги Фейри не обращают внимания на грозовые тучи, катящиеся по небу к их дому. Цель не становится физически невидимой, просто ее не стоит замечать. Подменыши могут создавать вредоносные приложения «Завуалированных глаз», заставляя мчащиеся повозки или приближающихся врагов оставаться незамеченными, пока не станет слишком поздно.#!"
 COMMON_ARTS_VEILED_MIND_PERK_EFFECT:0 "$cantrip_standard_bunk$ Уничтожьте случайный [relation|E] цели. \n Улучшает [GetPerk('common_arts_trick_of_the_light_perk').GetName(GetPlayer)] [passive_cantrip|E], давая вместо него [GetModifier('cantrip_veiled_mind_modifier').GetNameWithTooltip]. \n#flavor Легенды и мифология рисуют фантастические и вполне заслуженные сцены, в которых феи крадут воспоминания смертных. Выходя за рамки простого зрения или звука, Фейри окутывают фокус колдовства Гламуром и сопровождающими его Туманами, чтобы временно стереть фокус колдовства из памяти каждого. Любовница, которая презирала китэйн, может обнаружить, что ее семья смотрит на нее с пустыми лицами, когда она возвращается домой на каникулы, или противник Фейри забывает обнажить свой меч во время дуэли.#!"
 COMMON_ARTS_WILLOW_WHISPERS_PERK_EFFECT:0 "#flavor Эта полезная часть магии позволяет Фейри говорить с миром и слышать его ответы. Она может использовать «Шепот ивы», чтобы поговорить с любым растением, животным, объектом или природным объектом — с любым камнем, любым кольцом с драгоценными камнями, любым сияющим клинком, любым зверем, обычно неспособным говорить.#!"
 COMMON_ARTS_WIND_RUNNER_PERK_EFFECT:0 "#flavor Бегущий-по-ветру — это великолепное искусство полета. Большинство полагает, что эта особая магия была выменена или украдена у Неодушевлённых или какого-то подобного духа ветров, хотя нуннехи бормочут, что изначально она принадлежала им, а получена большой ценой у ужасного зверя, известного как вендиго.#!"
 COMMON_ARTS_WORMS_AND_GIANTS_PERK_EFFECT:0 "Вариант [shapeshift|EU]: принять размер, соответствующий свойству [GetTrait('dwarf').GetName(GetPlayer)] или [GetTrait('giant').GetName(GetPlayer)].\nПозволяет использовать мелких животных, например домашних кошек, как верховых.\n[PODUnlocksCombatMove('POD_combat_move_fae_metamorphosis_giants_stature')].\n#flavor Это легендарное заклятие позволяет уменьшать и увеличивать свою цель: превращать мышей в скакунов для странствующих рыцарей-пука, уменьшать богганов для тончайшей работы над обувью, превращать столовые ножи в импровизированные мечи или наказывать невоспитанных смертных, заставляя их увидеть Осенний мир с высоты червя.#!"
