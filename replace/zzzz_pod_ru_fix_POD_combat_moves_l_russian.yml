 POD_combat_move_kueijin_voice_of_emperor_desc:0 "[PODCombatMoveDesc('POD_combat_move_kueijin_voice_of_emperor')]"
 POD_combat_move_kueijin_voice_of_emperor_tooltip:0 "#weak;italic Вы выдержали сам Ад, чтобы вернуться и достичь Сотни Облаков. Кто они такие, чтобы осмелиться встать у тебя на пути?#!"
 POD_combat_move_kueijin_wild_eyed_bulwark:0 "@kueijin_icon!Оплот с безумными глазами"
 POD_combat_move_kueijin_wild_eyed_bulwark_desc:0 "[PODCombatMoveDesc('POD_combat_move_kueijin_wild_eyed_bulwark')]"
 POD_combat_move_kueijin_wild_eyed_bulwark_tooltip:0 "#weak;italic Мёртвая плоть распадается, чтобы возродиться в гротескном хаосе болезни.#!"
 POD_combat_move_kueijin_wilding_mantle:0 "@kueijin_icon!Дикая мантия"
 POD_combat_move_kueijin_wilding_mantle_desc:0 "[PODCombatMoveDesc('POD_combat_move_kueijin_wilding_mantle')]"
 POD_combat_move_kueijin_wilding_mantle_tooltip:0 "#weak;italic Как учило древних героев первобытное существо, прячьтесь и наносите удары целенаправленно.#!"
 POD_combat_move_kueijin_yin_nihilus:0 "@kueijin_icon!Облако Инь"
 POD_combat_move_kueijin_yin_nihilus_desc:0 "[PODCombatMoveDesc('POD_combat_move_kueijin_yin_nihilus')]"
 POD_combat_move_kueijin_yin_nihilus_tooltip:0 "#weak;italic Энергия смерти замедляет врага до предела, делая его уязвимым для вашего праведного натиска.#!"
 POD_combat_move_kupalas_exhalation:0 "@bloodsorcery_icon!Вздох Купалы"
 POD_combat_move_kupalas_exhalation_desc:0 "[PODCombatMoveDesc('POD_combat_move_kupalas_exhalation')]"
 POD_combat_move_kupalas_exhalation_tooltip:0 "#weak;italic Обратитесь к демону в глубинах и раздуйте его пламя в адский пожар, поглощающий врагов целиком.#!"
 POD_combat_move_lament_of_dhainu:0 "@necromancy_icon!Плач Д'хайну"
 POD_combat_move_lament_of_dhainu_desc:0 "[PODCombatMoveDesc('POD_combat_move_lament_of_dhainu')]"
 POD_combat_move_lament_of_dhainu_tooltip:0 "#weak;italic Спойте мучительную песню о горе Тёмной Матери, чтобы вражеский строй ощутил частицу её боли.#!"
 POD_combat_move_madrigal:0 "@melpominee_icon!Мадригал"
 POD_combat_move_madrigal_desc:0 "[PODCombatMoveDesc('POD_combat_move_madrigal')]"
 POD_combat_move_madrigal_tooltip:0 "#weak;italic Спойте колыбельную, которая успокоит паникующие умы ваших союзников.#!"
 POD_combat_move_majesty:0 "@presence_icon!Величие"
 POD_combat_move_majesty_desc:0 "[PODCombatMoveDesc('POD_combat_move_majesty')]"
 POD_combat_move_majesty_tooltip:0 "#weak;italic Вы излучаете ауру неприкосновенного величия. Ударить вас — всё равно что совершить святотатство.#!"
 POD_combat_move_masterful_riposte:0 "@skill_prowess_icon!Мейстерхау"
 POD_combat_move_masterful_riposte_desc:0 "[PODCombatMoveDesc('POD_combat_move_masterful_riposte')]"
 POD_combat_move_masterful_riposte_tooltip:0 "#weak;italic Защищайтесь и атакуйте одновременно, как и подобает искусному фехтовальщику.#!"
 POD_combat_move_mokole_archid_req:0 " Ваша форма Архид должна иметь "
 POD_combat_move_mokole_bark_mudpuppy:0 "@mokole_icon!Лай грязевого щенка"
 POD_combat_move_mokole_bark_mudpuppy_desc:0 "[PODCombatMoveDesc('POD_combat_move_mokole_bark_mudpuppy')]"
 POD_combat_move_mokole_bark_mudpuppy_tooltip:0 "#weak;italic Простой крик, и твой враг будет разорван на части.#!"
 POD_combat_move_mokole_call_water_spirit:0 "@mokole_icon!Призыв духа воды"
 POD_combat_move_mokole_call_water_spirit_desc:0 "[PODCombatMoveDesc('POD_combat_move_mokole_call_water_spirit')]"
 POD_combat_move_mokole_call_water_spirit_tooltip:0 "#weak;italic Узри силу чистых вод!#!"
 POD_combat_move_mokole_clap_of_thunder:0 "@mokole_icon!Раскат грома"
 POD_combat_move_mokole_clap_of_thunder_desc:0 "[PODCombatMoveDesc('POD_combat_move_mokole_clap_of_thunder')]"
 POD_combat_move_mokole_clap_of_thunder_tooltip:0 "#weak;italic Звонкие звуки грома возвещают о приходе дракона.#!"
 POD_combat_move_mokole_clenched_jaw:0 "@mokole_icon!Стиснутая челюсть"
 POD_combat_move_mokole_clenched_jaw_desc:0 "[PODCombatMoveDesc('POD_combat_move_mokole_clenched_jaw')]"
 POD_combat_move_mokole_clenched_jaw_tooltip:0 "#weak;italic Как ни старайся, от челюстей Моколе не уйти.#!"
 POD_combat_move_mokole_dragon_slash:0 "@mokole_icon!Удар Дракона"
 POD_combat_move_mokole_dragon_slash_desc:0 "[PODCombatMoveDesc('POD_combat_move_mokole_dragon_slash')]"
 POD_combat_move_mokole_dragon_slash_tooltip:0 "#weak;italic Узри мощь Королей-ящеров!#!"
 POD_combat_move_mokole_dragonfear:0 "@mokole_icon!Драконий страх"
 POD_combat_move_mokole_dragonfear_desc:0 "[PODCombatMoveDesc('POD_combat_move_mokole_dragonfear')]"
 POD_combat_move_mokole_dragonfear_tooltip:0 "#weak;italic Многие мечтают стать героем, убивающим дракона, но это не мечта.#!"
 POD_combat_move_mokole_dragons_breath:0 "@mokole_icon!Дыхание дракона"
 POD_combat_move_mokole_dragons_breath_desc:0 "[PODCombatMoveDesc('POD_combat_move_mokole_dragons_breath')]"
 POD_combat_move_mokole_dragons_breath_tooltip:0 "#weak;italic В вашем дыхании разгорается огонь. Что вы сожжёте? Что пощадите?#!"
 POD_combat_move_mokole_dragons_tongue:0 "@mokole_icon!Язык дракона"
 POD_combat_move_mokole_dragons_tongue_desc:0 "[PODCombatMoveDesc('POD_combat_move_mokole_dragons_tongue')]"
 POD_combat_move_mokole_dragons_tongue_tooltip:0 "#weak;italic Детям Вани достаточно воззвать — и Небеса ответят.#!"
 POD_combat_move_mokole_halo_of_the_sun:0 "@mokole_icon!Солнечный ореол"
 POD_combat_move_mokole_halo_of_the_sun_desc:0 "[PODCombatMoveDesc('POD_combat_move_mokole_halo_of_the_sun')]"
 POD_combat_move_mokole_halo_of_the_sun_tooltip:0 "#weak;italic $glossary_helios_lord_sun$ выжжет тьму своим светом.#!"
 POD_combat_move_mokole_heat_wave:0 "@mokole_icon!Волна жара"
 POD_combat_move_mokole_heat_wave_desc:0 "[PODCombatMoveDesc('POD_combat_move_mokole_heat_wave')]"
 POD_combat_move_mokole_heat_wave_tooltip:0 "#weak;italic Вызвать гнев Солнца — значит сгореть его огнем.#!"
 POD_combat_move_mokole_horn_rush:0 "@mokole_icon!Удар рогом"
 POD_combat_move_mokole_horn_rush_desc:0 "[PODCombatMoveDesc('POD_combat_move_mokole_horn_rush')]"
 POD_combat_move_mokole_horn_rush_tooltip:0 "#weak;italic Рог — простое, но эффективное оружие. Прямо к делу.#!"
 POD_combat_move_mokole_invisibility:0 "@mokole_icon!Невидимость"
 POD_combat_move_mokole_invisibility_desc:0 "[PODCombatMoveDesc('POD_combat_move_mokole_invisibility')]"
 POD_combat_move_mokole_invisibility_tooltip:0 "#weak;italic Моколе предпочитают сражаться лицом к лицу. Но иногда требуется небольшая хитрость.#!"
 POD_combat_move_mokole_lambent_flame:0 "@mokole_icon!Сверкающее пламя"
 POD_combat_move_mokole_lambent_flame_desc:0 "[PODCombatMoveDesc('POD_combat_move_mokole_lambent_flame')]"
 POD_combat_move_mokole_lambent_flame_tooltip:0 "#weak;italic $glossary_helios$ осветит любое укрытие: нет такой глубокой норы, где они могли бы спрятаться от его света.#!"
 POD_combat_move_mokole_might_of_kings:0 "@mokole_icon!Могущество королей"
 POD_combat_move_mokole_might_of_kings_desc:0 "[PODCombatMoveDesc('POD_combat_move_mokole_might_of_kings')]"
 POD_combat_move_mokole_might_of_kings_tooltip:0 "#weak;italic Моколе правили еще до того, как появились эти щенки. Сила – наше право.#!"
 POD_combat_move_mokole_nightmare_mnesis:0 "@mokole_icon!Кошмарный Мнезис"
 POD_combat_move_mokole_nightmare_mnesis_desc:0 "[PODCombatMoveDesc('POD_combat_move_mokole_nightmare_mnesis')]"
 POD_combat_move_mokole_nightmare_mnesis_tooltip:0 "#weak;italic Моколе помнят все, даже забытые кошмары. Теперь и их враги тоже.#!"
 POD_combat_move_mokole_pack_tactics:0 "@mokole_icon!Тактика стаи"
 POD_combat_move_mokole_pack_tactics_desc:0 "[PODCombatMoveDesc('POD_combat_move_mokole_pack_tactics')]"
 POD_combat_move_mokole_pack_tactics_tooltip:0 "#weak;italic Каждый Моколе — разрушительный зверь. Если им удастся работать вместе, что ж, удачи.#!"
 POD_combat_move_mokole_raptors_gaze:0 "@mokole_icon!Взгляд раптора"
 POD_combat_move_mokole_raptors_gaze_desc:0 "[PODCombatMoveDesc('POD_combat_move_mokole_raptors_gaze')]"
 POD_combat_move_mokole_raptors_gaze_tooltip:0 "#weak;italic Если на вас положил глаз хищник, было бы разумно бежать.#!"
 POD_combat_move_mokole_silver_claws:0 "@mokole_icon!Серебряные когти"
 POD_combat_move_mokole_silver_claws_desc:0 "[PODCombatMoveDesc('POD_combat_move_mokole_silver_claws')]"
 POD_combat_move_mokole_silver_claws_tooltip:0 "#weak;italic Гару почувствуют боль своих жертв — $glossary_fera$. Но даже у мести есть цена.#!"
 POD_combat_move_mokole_spiked_carapace:0 "@mokole_icon!Шипастый панцирь"
 POD_combat_move_mokole_spiked_carapace_desc:0 "[PODCombatMoveDesc('POD_combat_move_mokole_spiked_carapace')]"
 POD_combat_move_mokole_spiked_carapace_tooltip:0 "#weak;italic Как будто пробраться сквозь толстую шкуру моколе было недостаточно сложно, теперь она покрыта гигантскими шипами!#!"
 POD_combat_move_mokole_sun_enfleshed:0 "@mokole_icon!Солнечная плоть"
 POD_combat_move_mokole_sun_enfleshed_desc:0 "[PODCombatMoveDesc('POD_combat_move_mokole_sun_enfleshed')]"
 POD_combat_move_mokole_sun_enfleshed_tooltip:0 "#weak;italic Пусть Его святое пламя охватит вас, пусть очистит ваше тело, пусть сожжёт ваших врагов. Вам оно не причинит вреда, ведь $glossary_helios_lord_sun$ — ваш отец.#!"
 POD_combat_move_mokole_tail_smash:0 "@mokole_icon!Удар хвостом"
 POD_combat_move_mokole_tail_smash_desc:0 "[PODCombatMoveDesc('POD_combat_move_mokole_tail_smash')]"
 POD_combat_move_mokole_tail_smash_tooltip:0 "#weak;italic Больше похоже на булаву, чем на хвост, вот только эта булава размером с человека.#!"
 POD_combat_move_mokole_tame_sunbeam:0 "@mokole_icon!Укрощение солнечных лучей"
 POD_combat_move_mokole_tame_sunbeam_desc:0 "[PODCombatMoveDesc('POD_combat_move_mokole_tame_sunbeam')]"
 POD_combat_move_mokole_tame_sunbeam_tooltip:0 "#weak;italic Ты чувствуешь это? Благословенное тепло Солнца?#!"
 POD_combat_move_mokole_threatening_display:0 "@mokole_icon!Угрожающий вид"
 POD_combat_move_mokole_threatening_display_desc:0 "[PODCombatMoveDesc('POD_combat_move_mokole_threatening_display')]"
 POD_combat_move_mokole_threatening_display_tooltip:0 "#weak;italic Сам облик моколе уже ужасает, а когда он начинает угрожать — тем более.#!"
 POD_combat_move_mokole_wall_of_granite:0 "@mokole_icon!Гранитная стена"
 POD_combat_move_mokole_wall_of_granite_desc:0 "[PODCombatMoveDesc('POD_combat_move_mokole_wall_of_granite')]"
 POD_combat_move_mokole_wall_of_granite_tooltip:0 "#weak;italic Мы создали земли, по которым вы ходите. Позвольте нам показать вам, как это сделать.#!"
 POD_combat_move_mokole_waxwork_monster:0 "@mokole_icon!Восковое чудовище"
 POD_combat_move_mokole_waxwork_monster_desc:0 "[PODCombatMoveDesc('POD_combat_move_mokole_waxwork_monster')]"
 POD_combat_move_mokole_waxwork_monster_tooltip:0 "#weak;italic Динозавров не существует. Так на кого ты нападаешь?#!"
 POD_combat_move_mouth_of_djabalek:0 "@bloodsorcery_icon!Пасть Джабалека"
 POD_combat_move_mouth_of_djabalek_desc:0 "[PODCombatMoveDesc('POD_combat_move_mouth_of_djabalek')]"
 POD_combat_move_mouth_of_djabalek_tooltip:0 "#weak;italic Раздвиньте камень и грязь под ногами вашего врага и удержите нарушителя на месте.#!"
 POD_combat_move_mummy_alchemy_cloud_of_smoke:0 "@mummy_icon!Облако дыма"
 POD_combat_move_mummy_alchemy_cloud_of_smoke_desc:0 "[PODCombatMoveDesc('POD_combat_move_mummy_alchemy_cloud_of_smoke')]"
 POD_combat_move_mummy_alchemy_cloud_of_smoke_tooltip:0 "#weak;italic Простой трюк для мастера-алхимика, но слепой враг намного слабее.#!"
 POD_combat_move_mummy_alchemy_dangerous_poison:0 "@mummy_icon!Опасный яд"
 POD_combat_move_mummy_alchemy_dangerous_poison_desc:0 "[PODCombatMoveDesc('POD_combat_move_mummy_alchemy_dangerous_poison')]"
 POD_combat_move_mummy_alchemy_dangerous_poison_tooltip:0 "#weak;italic Жало скорпиона в простой смеси.#!"
 POD_combat_move_mummy_alchemy_potent_tonic:0 "@mummy_icon!Мощный тоник"
 POD_combat_move_mummy_alchemy_potent_tonic_desc:0 "[PODCombatMoveDesc('POD_combat_move_mummy_alchemy_potent_tonic')]"
 POD_combat_move_mummy_alchemy_potent_tonic_tooltip:0 "#weak;italic Бальзам алхимического исцеления, унаследованный от величайших умов, сделавших возможным воскрешение.#!"
 POD_combat_move_mummy_alchemy_potion_of_valor:0 "@mummy_icon!Зелье доблести"
 POD_combat_move_mummy_alchemy_potion_of_valor_desc:0 "[PODCombatMoveDesc('POD_combat_move_mummy_alchemy_potion_of_valor')]"
 POD_combat_move_mummy_alchemy_potion_of_valor_tooltip:0 "#weak;italic Настоящим героям не нужны добавки. Но их также трудно найти в наши дни.#!"
 POD_combat_move_mummy_alchemy_vile_body:0 "@mummy_icon!Зелье жалкого тела"
 POD_combat_move_mummy_alchemy_vile_body_desc:0 "[PODCombatMoveDesc('POD_combat_move_mummy_alchemy_vile_body')]"
 POD_combat_move_mummy_alchemy_vile_body_tooltip:0 "#weak;italic Это зелье обнажает истинную природу мумии. Мерзость существа, глумящегося над естественным порядком вещей, поражает тех, кто осмеливается приблизиться.#!"
 POD_combat_move_mummy_amulets_buckle_of_isis:0 "@mummy_icon!Пряжка Исиды"
 POD_combat_move_mummy_amulets_buckle_of_isis_desc:0 "[PODCombatMoveDesc('POD_combat_move_mummy_amulets_buckle_of_isis')]"
 POD_combat_move_mummy_amulets_buckle_of_isis_tooltip:0 "#weak;italic Мать волшебства не имела себе равных. Простое упоминание ее имени приведет к подчинению жалких сверхъестественных существ современности.#!"
 POD_combat_move_mummy_amulets_eye_of_sekhmet:0 "@mummy_icon!Око Сахмет"
 POD_combat_move_mummy_amulets_eye_of_sekhmet_desc:0 "[PODCombatMoveDesc('POD_combat_move_mummy_amulets_eye_of_sekhmet')]"
 POD_combat_move_mummy_amulets_eye_of_sekhmet_tooltip:0 "#weak;italic Богиня-воительница смотрит на них и находит их недостойными. Они боятся своей слабости.#!"
 POD_combat_move_mummy_amulets_simple_ward:0 "@mummy_icon!Простой оберег"
 POD_combat_move_mummy_amulets_simple_ward_desc:0 "[PODCombatMoveDesc('POD_combat_move_mummy_amulets_simple_ward')]"
 POD_combat_move_mummy_amulets_simple_ward_tooltip:0 "#weak;italic Простое слово силы, которого достаточно, чтобы защитить вас от вреда, который они замышляют.#!"
 POD_combat_move_mummy_amulets_veil_of_amaunet:0 "@mummy_icon!Вуаль Амунет"
 POD_combat_move_mummy_amulets_veil_of_amaunet_desc:0 "[PODCombatMoveDesc('POD_combat_move_mummy_amulets_veil_of_amaunet')]"
 POD_combat_move_mummy_amulets_veil_of_amaunet_tooltip:0 "#weak;italic Глаз изначальной Богини защищает вас от взглядов неверующих.#!"
 POD_combat_move_mummy_amulets_wrappings_imhotep:0 "@mummy_icon!Пелены Имхотепа"
 POD_combat_move_mummy_amulets_wrappings_imhotep_desc:0 "[PODCombatMoveDesc('POD_combat_move_mummy_amulets_wrappings_imhotep')]"
 POD_combat_move_mummy_amulets_wrappings_imhotep_tooltip:0 "#weak;italic Мудрейшим людям в истории пришлось немало потрудиться над мумификацией. Даже малая доля их силы велика сама по себе.#!"
 POD_combat_move_mummy_celestial_book_of_thoth:0 "@mummy_icon!Книга Тота"
 POD_combat_move_mummy_celestial_book_of_thoth_desc:0 "[PODCombatMoveDesc('POD_combat_move_mummy_celestial_book_of_thoth')]"
 POD_combat_move_mummy_celestial_book_of_thoth_tooltip:0 "#weak;italic Тот, самый мудрый, знал всё. Даже понимание части его знаний — огромное преимущество в бою.#!"
 POD_combat_move_mummy_celestial_call_the_stars:0 "@mummy_icon!Зов звезд"
 POD_combat_move_mummy_celestial_call_the_stars_desc:0 "[PODCombatMoveDesc('POD_combat_move_mummy_celestial_call_the_stars')]"
 POD_combat_move_mummy_celestial_call_the_stars_tooltip:0 "#weak;italic В былые века наши мудрецы взирали на звёзды с восхищением. Напомним нынешним неверующим, почему.#!"
 POD_combat_move_mummy_celestial_ras_awakening:0 "@mummy_icon!Пробуждение Ра"
 POD_combat_move_mummy_celestial_ras_awakening_desc:0 "[PODCombatMoveDesc('POD_combat_move_mummy_celestial_ras_awakening')]"
 POD_combat_move_mummy_celestial_ras_awakening_tooltip:0 "#weak;italic Бог богов благосклонно смотрит на своих воинов, даже спустя тысячелетия после того, как неблагодарные смертные забыли его.#!"
 POD_combat_move_mummy_celestial_sahu_ra:0 "@mummy_icon!Саху-Ра"
 POD_combat_move_mummy_celestial_sahu_ra_desc:0 "[PODCombatMoveDesc('POD_combat_move_mummy_celestial_sahu_ra')]"
 POD_combat_move_mummy_celestial_sahu_ra_tooltip:0 "#weak;italic Всемогущему Ра даже не нужно смотреть на них сверху вниз. Одно его сияние сжигает тех, кто прячется в тени.#!"
 POD_combat_move_mummy_celestial_sandstorm:0 "@mummy_icon!Песчаная буря"
 POD_combat_move_mummy_celestial_sandstorm_desc:0 "[PODCombatMoveDesc('POD_combat_move_mummy_celestial_sandstorm')]"
 POD_combat_move_mummy_celestial_sandstorm_tooltip:0 "#weak;italic Что они могут сделать, когда на них нападает золотая кровь самой пустыни? Ничего, кроме жалоб, что оно проникает повсюду.#!"
 POD_combat_move_mummy_effigy_command_complex_implement:0 "@mummy_icon!Выполнение командного приказа"
 POD_combat_move_mummy_effigy_command_complex_implement_desc:0 "[PODCombatMoveDesc('POD_combat_move_mummy_effigy_command_complex_implement')]"
 POD_combat_move_mummy_effigy_command_complex_implement_tooltip:0 "#weak;italic Стражи гробниц вашего народа были гораздо более сложными, чем сегодняшние мелкие устройства. Вам не нужен учебник.#!"
 POD_combat_move_mummy_effigy_false_door:0 "@mummy_icon!Ложная дверь"
 POD_combat_move_mummy_effigy_false_door_desc:0 "[PODCombatMoveDesc('POD_combat_move_mummy_effigy_false_door')]"
 POD_combat_move_mummy_effigy_false_door_tooltip:0 "#weak;italic Нынешние маги перемещаются по полю боя через порталы. Жалкое подобие великолепия сияющей золотой двери, внезапно возникающей и ждущей вашего приказа открыться.#!"
 POD_combat_move_mummy_effigy_living_bond:0 "@mummy_icon!Живые узы судьбы"
 POD_combat_move_mummy_effigy_living_bond_desc:0 "[PODCombatMoveDesc('POD_combat_move_mummy_effigy_living_bond')]"
 POD_combat_move_mummy_effigy_living_bond_tooltip:0 "#weak;italic Судьба человека записана в миг его рождения. До того, как вы сковали его собственной судьбой, свободы у него было не больше.#!"
 POD_combat_move_mummy_effigy_reflected_strike:0 "@mummy_icon!Отраженный удар"
 POD_combat_move_mummy_effigy_reflected_strike_desc:0 "[PODCombatMoveDesc('POD_combat_move_mummy_effigy_reflected_strike')]"
 POD_combat_move_mummy_effigy_reflected_strike_tooltip:0 "#weak;italic Мумия связана с двумя мирами, не принадлежа ни мёртвым, ни живым. Истинно мудрый знает, как при необходимости ударить по обоим сразу.#!"
 POD_combat_move_mummy_necromancy_banish_dead:0 "@mummy_icon!Изгнание мертвых"
 POD_combat_move_mummy_necromancy_banish_dead_desc:0 "[PODCombatMoveDesc('POD_combat_move_mummy_necromancy_banish_dead')]"
 POD_combat_move_mummy_necromancy_banish_dead_tooltip:0 "#weak;italic Мертвые здесь не имеют власти. Кроме тебя, конечно.#!"
 POD_combat_move_mummy_necromancy_deaths_hand:0 "@mummy_icon!Рука смерти"
 POD_combat_move_mummy_necromancy_deaths_hand_desc:0 "[PODCombatMoveDesc('POD_combat_move_mummy_necromancy_deaths_hand')]"
 POD_combat_move_mummy_necromancy_deaths_hand_tooltip:0 "#weak;italic На миг мумия отбрасывает подобие жизни, дарованное Заклинанием Жизни. Холодные костлявые руки касаются врага, обнажая гротескный ужас её существования.#!"
 POD_combat_move_mummy_necromancy_deaths_shroud:0 "@mummy_icon!Завеса смерти"
 POD_combat_move_mummy_necromancy_deaths_shroud_desc:0 "[PODCombatMoveDesc('POD_combat_move_mummy_necromancy_deaths_shroud')]"
 POD_combat_move_mummy_necromancy_deaths_shroud_tooltip:0 "#weak;italic Такова сила смерти. Медленная, мучительная неподвижность — лишь прелюдия к тихому финалу.#!"
 POD_combat_move_mummy_necromancy_khaibits_embrace:0 "@mummy_icon!Объятия хайбита"
 POD_combat_move_mummy_necromancy_khaibits_embrace_desc:0 "[PODCombatMoveDesc('POD_combat_move_mummy_necromancy_khaibits_embrace')]"
 POD_combat_move_mummy_necromancy_khaibits_embrace_tooltip:0 "#weak;italic Само присутствие души Мумии замедляет ход битвы, как будто сама реальность была озадачена этим анахроничным существом.#!"
 POD_combat_move_mummy_necromancy_scouring_oblivion:0 "@mummy_icon!Очищающее Забвение"
 POD_combat_move_mummy_necromancy_scouring_oblivion_desc:0 "[PODCombatMoveDesc('POD_combat_move_mummy_necromancy_scouring_oblivion')]"
 POD_combat_move_mummy_necromancy_scouring_oblivion_tooltip:0 "#weak;italic Это существо несёт смерть. Оно никогда не ест, никогда не спит и никогда не остановится.#!"
 POD_combat_move_mummy_nomenclature_asking_trees:0 "@mummy_icon!Проречение древа"
 POD_combat_move_mummy_nomenclature_asking_trees_desc:0 "[PODCombatMoveDesc('POD_combat_move_mummy_nomenclature_asking_trees')]"
 POD_combat_move_mummy_nomenclature_asking_trees_tooltip:0 "#weak;italic У дикой природы простые Истинные Имена. Подчинить её можно лишь отчасти, но даже это способно удивить на поле боя.#!"
 POD_combat_move_mummy_nomenclature_bodys_destruction:0 "@mummy_icon!Имя разрушения тела"
 POD_combat_move_mummy_nomenclature_bodys_destruction_desc:0 "[PODCombatMoveDesc('POD_combat_move_mummy_nomenclature_bodys_destruction')]"
 POD_combat_move_mummy_nomenclature_bodys_destruction_tooltip:0 "#weak;italic Одно из самых устрашающих умений мумии: произнеся имя части тела, она возвращает её к первозданной форме. Ведь прах должен стать прахом.#!"
 POD_combat_move_mummy_nomenclature_command_thought:0 "@mummy_icon!Приказная мысль"
 POD_combat_move_mummy_nomenclature_command_thought_desc:0 "[PODCombatMoveDesc('POD_combat_move_mummy_nomenclature_command_thought')]"
 POD_combat_move_mummy_nomenclature_command_thought_tooltip:0 "#weak;italic Для этого эффекта некоторые ученики любят размахивать руками перед жертвой. Настоящему мастеру достаточно произнести приказ.#!"
 POD_combat_move_mummy_nomenclature_mend_flesh:0 "@mummy_icon!Ваяние плоти"
 POD_combat_move_mummy_nomenclature_mend_flesh_desc:0 "[PODCombatMoveDesc('POD_combat_move_mummy_nomenclature_mend_flesh')]"
 POD_combat_move_mummy_nomenclature_mend_flesh_tooltip:0 "#weak;italic Раны — лишь повреждённый первозданный узор. Истинный мастер Имён одной волей возвращает ему первоначальную форму.#!"
 POD_combat_move_mummy_nomenclature_whispers_body:0 "@mummy_icon!Шепоты тела"
 POD_combat_move_mummy_nomenclature_whispers_body_desc:0 "[PODCombatMoveDesc('POD_combat_move_mummy_nomenclature_whispers_body')]"
 POD_combat_move_mummy_nomenclature_whispers_body_tooltip:0 "#weak;italic Плоть податлива. Напевая Истинные Имена на множестве непонятных невеждам языков, мумия обращает собственное тело в живое оружие и доспехи.#!"
 POD_combat_move_nergals_wrath:0 "@bloodsorcery_icon!Гнев Нергала"
 POD_combat_move_nergals_wrath_desc:0 "[PODCombatMoveDesc('POD_combat_move_nergals_wrath')]"
 POD_combat_move_nergals_wrath_tooltip:0 "#weak;italic Ты заражаешь их жалкую плоть злобным проклятием, с ликованием наблюдая за их агонией.#!"
 POD_combat_move_night_cry:0 "@necromancy_icon!Вопль ночи"
 POD_combat_move_night_cry_desc:0 "[PODCombatMoveDesc('POD_combat_move_night_cry')]"
 POD_combat_move_night_cry_tooltip:0 "#weak;italic Вырвите крик из Завесы устами каждого, кто стоит перед вами.#!"
 POD_combat_move_nightmare_curse:0 "@auspex_icon!Кошмарное проклятие"
 POD_combat_move_nightmare_curse_desc:0 "[PODCombatMoveDesc('POD_combat_move_nightmare_curse')]"
 POD_combat_move_nightmare_curse_tooltip:0 "#weak;italic Доберитесь до темных уголков разума вашего врага и вытащите ужасающее воспоминание, заставив его переживать его бесконечно.#!"
 POD_combat_move_nocturne:0 "@obtenebration_icon!Ноктюрн"
 POD_combat_move_nocturne_desc:0 "[PODCombatMoveDesc('POD_combat_move_nocturne')]"
 POD_combat_move_nocturne_tooltip:0 "#weak;italic Заполните поле тенями и позвольте тьме сломать их хрупкие маленькие разумы.#!"
 POD_combat_move_noxious_compound:0 "@skill_prowess_icon!Ядовитое соединение"
 POD_combat_move_noxious_compound_desc:0 "[PODCombatMoveDesc('POD_combat_move_noxious_compound')]"
 POD_combat_move_noxious_compound_tooltip:0 "#weak;italic Против вампиров это соединение малоэффективно, но живую плоть легко отравить.#!"
 POD_combat_move_omniscience:0 "@auspex_icon!Всеведение"
 POD_combat_move_omniscience_desc:0 "[PODCombatMoveDesc('POD_combat_move_omniscience')]"
 POD_combat_move_omniscience_tooltip:0 "#weak;italic Забавно, что они думают, будто могут от вас спрятаться.#!"
 POD_combat_move_passing_the_inner_realm:0 "@rift_icon!Переход через Внутреннее царство"
 POD_combat_move_passing_the_inner_realm_desc:0 "[PODCombatMoveDesc('POD_combat_move_passing_the_inner_realm')]"
 POD_combat_move_passing_the_inner_realm_tooltip:0 "#weak;italic Сделайте незримый шаг, чтобы найти краткое утешение во Внутреннем царстве.#!"
 POD_combat_move_past_lives:0 "@bloodsorcery_icon!Прошлые жизни"
 POD_combat_move_past_lives_desc:0 "[PODCombatMoveDesc('POD_combat_move_past_lives')]"
