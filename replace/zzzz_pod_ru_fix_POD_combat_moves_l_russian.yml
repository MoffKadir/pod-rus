 POD_combat_move_wraith_lifeline_tooltip:0 "#weak;italic По иронии судьбы, призраки — идеальные ангелы-хранители. Они ведь знают, что ждёт по ту сторону.#!"
 POD_combat_move_wraith_lightnings_bite:0 "@wraith_icon!Укус молнии"
 POD_combat_move_wraith_lightnings_bite_desc:0 "[PODCombatMoveDesc('POD_combat_move_wraith_lightnings_bite')]"
 POD_combat_move_wraith_lightnings_bite_tooltip:0 "#weak;italic Внезапная и неожиданная вспышка жизни в спокойной обстановке. Явный признак махинаций призрака.#!"
 POD_combat_move_wraith_morphean_embrace:0 "@wraith_icon!Объятия Морфея"
 POD_combat_move_wraith_morphean_embrace_desc:0 "[PODCombatMoveDesc('POD_combat_move_wraith_morphean_embrace')]"
 POD_combat_move_wraith_morphean_embrace_tooltip:0 "#weak;italic У смертных есть свои мифы о духах, усыпляющих их. Правда гораздо страшнее.#!"
 POD_combat_move_wraith_risen_distraction:0 "@wraith_icon!Отвлечение"
 POD_combat_move_wraith_risen_distraction_desc:0 "[PODCombatMoveDesc('POD_combat_move_wraith_risen_distraction')]"
 POD_combat_move_wraith_risen_distraction_tooltip:0 "#weak;italic Они явно забывают что-то важное. Достаточно важно, чтобы отвлечь их в этой битве.#!"
 POD_combat_move_wraith_risen_lucky_break:0 "@wraith_icon!Счастливый случай"
 POD_combat_move_wraith_risen_lucky_break_desc:0 "[PODCombatMoveDesc('POD_combat_move_wraith_risen_lucky_break')]"
 POD_combat_move_wraith_risen_lucky_break_tooltip:0 "#weak;italic Удача — причуда судьбы. По-настоящему одарённые умеют ловить нужный момент.#!"
 POD_combat_move_wraith_rot:0 "@wraith_icon!Гниение"
 POD_combat_move_wraith_rot_desc:0 "[PODCombatMoveDesc('POD_combat_move_wraith_rot')]"
 POD_combat_move_wraith_rot_tooltip:0 "#weak;italic Смерть никого не ждет, даже самое магическое оружие. Вы просто ускоряете процесс.#!"
 POD_combat_move_wraith_sidestep:0 "@wraith_icon!Избегание"
 POD_combat_move_wraith_sidestep_desc:0 "[PODCombatMoveDesc('POD_combat_move_wraith_sidestep')]"
 POD_combat_move_wraith_sidestep_tooltip:0 "#weak;italic Вам не суждено встретить Забвение здесь. Нужно лишь идти путём своей судьбы.#!"
 POD_combat_move_wraith_statue:0 "@wraith_icon!Статуя"
 POD_combat_move_wraith_statue_desc:0 "[PODCombatMoveDesc('POD_combat_move_wraith_statue')]"
 POD_combat_move_wraith_statue_tooltip:0 "#weak;italic Смерть неподвижна. Как и вы.#!"
 POD_combat_move_wraith_stonehand_punch:0 "@arcanos_outrage_icon!Каменный удар"
 POD_combat_move_wraith_stonehand_punch_desc:0 "[PODCombatMoveDesc('POD_combat_move_wraith_stonehand_punch')]"
 POD_combat_move_wraith_stonehand_punch_tooltip:0 "#weak;italic Злой призрак всегда находит способ заявить о своем присутствии. Швырять предметы издалека - один из верных знаков.#!"
 POD_combat_move_wraith_the_gleaming:0 "@wraith_icon!Сияние"
 POD_combat_move_wraith_the_gleaming_desc:0 "[PODCombatMoveDesc('POD_combat_move_wraith_the_gleaming')]"
 POD_combat_move_wraith_the_gleaming_tooltip:0 "#weak;italic Призраки познают навязчивые идеи через свои оковы. Они могут на мгновение передать этот недуг своим врагам.#!"
 POD_combat_move_wraith_twitch:0 "@wraith_icon!Подёргивания"
 POD_combat_move_wraith_twitch_desc:0 "[PODCombatMoveDesc('POD_combat_move_wraith_twitch')]"
 POD_combat_move_wraith_twitch_tooltip:0 "#weak;italic На миг они подчиняются вам. Заставьте их плясать в насмешку над жизнью, которую вы и ненавидите, и которой завидуете.#!"
 POD_combat_move_wraith_weirdness:0 "@arcanos_pandemonium_icon!Странности"
 POD_combat_move_wraith_weirdness_desc:0 "[PODCombatMoveDesc('POD_combat_move_wraith_weirdness')]"
 POD_combat_move_wraith_weirdness_tooltip:0 "#weak;italic Малая проба потустороннего мира. Ужас и безумие затмевают чувства, заставляя приверженцев разума отшатнуться в страхе.#!"
