 POD_combat_move_fae_legerdemain_ensnare:0 "@fae_icon!Ловушка"
 POD_combat_move_fae_legerdemain_ensnare_desc:0 "[PODCombatMoveDesc('POD_combat_move_fae_legerdemain_ensnare')]"
 POD_combat_move_fae_legerdemain_ensnare_tooltip:0 "#weak;italic Как удачно, что препятствия возникают везде, где бы ни ступил ваш противник.#!"
 POD_combat_move_fae_legerdemain_gimmix:0 "@fae_icon!Фокусы"
 POD_combat_move_fae_legerdemain_gimmix_desc:0 "[PODCombatMoveDesc('POD_combat_move_fae_legerdemain_gimmix')]"
 POD_combat_move_fae_legerdemain_gimmix_tooltip:0 "#weak;italic А теперь мой следующий фокус: этот камень полетит в одно очень чувствительное место.#!"
 POD_combat_move_fae_metamorphosis_beastskin_talons:0 "@fae_icon!Когти звериной шкуры"
 POD_combat_move_fae_metamorphosis_beastskin_talons_desc:0 "[PODCombatMoveDesc('POD_combat_move_fae_metamorphosis_beastskin_talons')]"
 POD_combat_move_fae_metamorphosis_beastskin_talons_tooltip:0 "#weak;italic Мне нужны только когти большого злого волка, чтобы лишить тебя счастливого конца.#!"
 POD_combat_move_fae_metamorphosis_giants_stature:0 "@fae_icon!Рост гиганта"
 POD_combat_move_fae_metamorphosis_giants_stature_desc:0 "[PODCombatMoveDesc('POD_combat_move_fae_metamorphosis_giants_stature')]"
 POD_combat_move_fae_metamorphosis_giants_stature_tooltip:0 "#weak;italic Станьте исполином, словно полубог из легенды.#!"
 POD_combat_move_fae_naming_runic_imprint:0 "@fae_icon!Рунический отпечаток"
 POD_combat_move_fae_naming_runic_imprint_desc:0 "[PODCombatMoveDesc('POD_combat_move_fae_naming_runic_imprint')]"
 POD_combat_move_fae_naming_runic_imprint_tooltip:0 "#weak;italic Этот рунический жест раскрывает скрытую силу союзника. Возможно, ему требовалась ваша помощь, а возможно, эта сила всегда была с ним.#!"
 POD_combat_move_fae_petros_ironarm:0 "@fae_icon!Железная рука"
 POD_combat_move_fae_petros_ironarm_desc:0 "[PODCombatMoveDesc('POD_combat_move_fae_petros_ironarm')]"
 POD_combat_move_fae_petros_ironarm_tooltip:0 "#weak;italic Черпайте мистическую силу земли, чтобы совершить великие подвиги силы.#!"
 POD_combat_move_fae_petros_quake:0 "@fae_icon!Землетрясение"
 POD_combat_move_fae_petros_quake_desc:0 "[PODCombatMoveDesc('POD_combat_move_fae_petros_quake')]"
 POD_combat_move_fae_petros_quake_tooltip:0 "#weak;italic И когда Повелитель Горы топнул ногой, земля разверзлась глубокими провалами. Берегитесь гнева того, кого нелегко разгневать.#!"
 POD_combat_move_fae_petros_stoneskin:0 "@fae_icon!Каменная кожа"
 POD_combat_move_fae_petros_stoneskin_desc:0 "[PODCombatMoveDesc('POD_combat_move_fae_petros_stoneskin')]"
 POD_combat_move_fae_petros_stoneskin_tooltip:0 "#weak;italic Ваша кожа приобретает прочность и облик ближайшей горной породы.#!"
 POD_combat_move_fae_primal_dance_five_kings:0 "@fae_icon!Танец Пяти Королей"
 POD_combat_move_fae_primal_dance_five_kings_desc:0 "[PODCombatMoveDesc('POD_combat_move_fae_primal_dance_five_kings')]"
 POD_combat_move_fae_primal_dance_five_kings_tooltip:0 "#weak;italic Буря, земля и огонь, прислушайтесь к моему зову!#!"
 POD_combat_move_fae_primal_oakenshield:0 "@fae_icon!Дубовый щит"
 POD_combat_move_fae_primal_oakenshield_desc:0 "[PODCombatMoveDesc('POD_combat_move_fae_primal_oakenshield')]"
 POD_combat_move_fae_primal_oakenshield_tooltip:0 "#weak;italic Видишь это? Это моя сюжетная броня.#!"
 POD_combat_move_fae_pyretics_engulf:0 "@fae_icon!Поглощение"
 POD_combat_move_fae_pyretics_engulf_desc:0 "[PODCombatMoveDesc('POD_combat_move_fae_pyretics_engulf')]"
 POD_combat_move_fae_pyretics_engulf_tooltip:0 "#weak;italic Злодей сгорел дотла, и все жили долго и счастливо.#!"
 POD_combat_move_fae_pyretics_illuminate:0 "@fae_icon!Осветить"
 POD_combat_move_fae_pyretics_illuminate_desc:0 "[PODCombatMoveDesc('POD_combat_move_fae_pyretics_illuminate')]"
 POD_combat_move_fae_pyretics_illuminate_tooltip:0 "#weak;italic Герой воссиял своим пронзительным светом, и злодеи выбежали из своих укрытий.#!"
 POD_combat_move_fae_pyros_flame:0 "@fae_icon!Пламя"
 POD_combat_move_fae_pyros_flame_desc:0 "[PODCombatMoveDesc('POD_combat_move_fae_pyros_flame')]"
 POD_combat_move_fae_pyros_flame_tooltip:0 "#weak;italic Страстью нужно делиться. Не волнуйся, у меня достаточно для нас обоих. Осторожно, не обожгись.#!"
 POD_combat_move_fae_pyros_inferno:0 "@fae_icon!Инферно"
 POD_combat_move_fae_pyros_inferno_desc:0 "[PODCombatMoveDesc('POD_combat_move_fae_pyros_inferno')]"
 POD_combat_move_fae_pyros_inferno_tooltip:0 "#weak;italic Гори, детка, гори.#!"
 POD_combat_move_fae_pyros_tortured_heart:0 "@fae_icon!Измученное сердце"
 POD_combat_move_fae_pyros_tortured_heart_desc:0 "[PODCombatMoveDesc('POD_combat_move_fae_pyros_tortured_heart')]"
 POD_combat_move_fae_pyros_tortured_heart_tooltip:0 "#weak;italic Ты уже пылаешь? Выдержишь этот жар? Знаешь, держать чувства в себе вредно.#!"
 POD_combat_move_fae_skycraft_howling_gale:0 "@fae_icon!Воющая буря"
 POD_combat_move_fae_skycraft_howling_gale_desc:0 "[PODCombatMoveDesc('POD_combat_move_fae_skycraft_howling_gale')]"
 POD_combat_move_fae_skycraft_howling_gale_tooltip:0 "#weak;italic Пусть ветры смешают их ряды. Пусть они бросят свои щиты и встретятся с Повелителем Штормов в честном бою.#!"
 POD_combat_move_fae_skycraft_lord_of_levin:0 "@fae_icon!Повелитель молний"
 POD_combat_move_fae_skycraft_lord_of_levin_desc:0 "[PODCombatMoveDesc('POD_combat_move_fae_skycraft_lord_of_levin')]"
 POD_combat_move_fae_skycraft_lord_of_levin_tooltip:0 "#weak;italic Подчеркните кульминацию истории молнией, ударившей в самый драматичный момент.#!"
 POD_combat_move_fae_soothsay_face_fate:0 "@fae_icon!Огонь Судьбы"
 POD_combat_move_fae_soothsay_face_fate_desc:0 "[PODCombatMoveDesc('POD_combat_move_fae_soothsay_face_fate')]"
 POD_combat_move_fae_soothsay_face_fate_tooltip:0 "#weak;italic Прокляните своего врага, схватив гобелен судьбы и хорошенько дернув его.#!"
 POD_combat_move_fae_soothsay_omen:0 "@fae_icon!Предзнаменование"
 POD_combat_move_fae_soothsay_omen_desc:0 "[PODCombatMoveDesc('POD_combat_move_fae_soothsay_omen')]"
 POD_combat_move_fae_soothsay_omen_tooltip:0 "#weak;italic Мне открылась твоя судьба. В конце мой кулак встречается с твоим лицом.#!"
 POD_combat_move_fae_sovereign_dictum:0 "@fae_icon!Веление"
 POD_combat_move_fae_sovereign_dictum_desc:0 "[PODCombatMoveDesc('POD_combat_move_fae_sovereign_dictum')]"
 POD_combat_move_fae_sovereign_dictum_tooltip:0 "#weak;italic Одним словом я могу приказать дождю прекратиться. Если даже времена года не осмеливаются бросить мне вызов, как ты смеешь противиться моим приказам?#!"
 POD_combat_move_fae_sovereign_grandeur:0 "@fae_icon!Величавость"
 POD_combat_move_fae_sovereign_grandeur_desc:0 "[PODCombatMoveDesc('POD_combat_move_fae_sovereign_grandeur')]"
 POD_combat_move_fae_sovereign_grandeur_tooltip:0 "#weak;italic Узрите истинное величие и отчаивайтесь.#!"
 POD_combat_move_fae_spring_faerie_ring:0 "@fae_icon!Круг фей"
 POD_combat_move_fae_spring_faerie_ring_desc:0 "[PODCombatMoveDesc('POD_combat_move_fae_spring_faerie_ring')]"
 POD_combat_move_fae_spring_faerie_ring_tooltip:0 "#weak;italic Грибной круг отмечает владения фей. Приглашённые получат его защиту. А остальным... лучше держаться подальше.#!"
 POD_combat_move_fae_spring_well_of_life:0 "@fae_icon!Колодец жизни"
 POD_combat_move_fae_spring_well_of_life_desc:0 "[PODCombatMoveDesc('POD_combat_move_fae_spring_well_of_life')]"
 POD_combat_move_fae_spring_well_of_life_tooltip:0 "#weak;italic Немало доблестных рыцарей искали источник жизни. Вот вам глоток из него.#!"
 POD_combat_move_fae_stratus_conceal_confuse:0 "@fae_icon!Скрыть/запутать"
 POD_combat_move_fae_stratus_conceal_confuse_desc:0 "[PODCombatMoveDesc('POD_combat_move_fae_stratus_conceal_confuse')]"
 POD_combat_move_fae_stratus_conceal_confuse_tooltip:0 "#weak;italic Ох, что это там?#!"
 POD_combat_move_fae_stratus_flight:0 "@fae_icon!Полёт"
 POD_combat_move_fae_stratus_flight_desc:0 "[PODCombatMoveDesc('POD_combat_move_fae_stratus_flight')]"
 POD_combat_move_fae_stratus_flight_tooltip:0 "#weak;italic Ответь на загадку: как сражаться с пустотой? Нет, это не вопрос с подвохом — мне и правда интересно. Скажи, когда поймёшь. Я слишком много болтаю?#!"
 POD_combat_move_fae_summer_beltane_blade:0 "@fae_icon!Клинок Белтайна"
 POD_combat_move_fae_summer_beltane_blade_desc:0 "[PODCombatMoveDesc('POD_combat_move_fae_summer_beltane_blade')]"
 POD_combat_move_fae_summer_beltane_blade_tooltip:0 "#weak;italic Жестом вы приказываете налету Банальности внутри вашего врага взорваться.#!"
 POD_combat_move_fae_summer_enkindle:0 "@fae_icon!Разжигание"
 POD_combat_move_fae_summer_enkindle_desc:0 "[PODCombatMoveDesc('POD_combat_move_fae_summer_enkindle')]"
 POD_combat_move_fae_summer_enkindle_tooltip:0 "#weak;italic Страх тоже является разновидностью страсти. Разжигайте страх своих врагов, пока он не станет невыносимым.#!"
 POD_combat_move_fae_verdage_coalesce:0 "@fae_icon!Объединение"
 POD_combat_move_fae_verdage_coalesce_desc:0 "[PODCombatMoveDesc('POD_combat_move_fae_verdage_coalesce')]"
 POD_combat_move_fae_verdage_coalesce_tooltip:0 "#weak;italic При правильном шепоте дерево превратится в броню, и дерево станет твердым, как сталь.#!"
 POD_combat_move_fae_verdage_solarium:0 "@fae_icon!Солярий"
 POD_combat_move_fae_verdage_solarium_desc:0 "[PODCombatMoveDesc('POD_combat_move_fae_verdage_solarium')]"
 POD_combat_move_fae_verdage_solarium_tooltip:0 "#weak;italic Вы грезите о жизни, и местная растительность бурно разрастается, мешая вашему противнику.#!"
 POD_combat_move_fae_wayfare_flicker_flash:0 "@fae_icon!Мерцающая вспышка"
 POD_combat_move_fae_wayfare_flicker_flash_desc:0 "[PODCombatMoveDesc('POD_combat_move_fae_wayfare_flicker_flash')]"
 POD_combat_move_fae_wayfare_flicker_flash_tooltip:0 "#weak;italic Перенеситесь подальше от опасности. Получить взбучку — плохой поворот для вашей истории.#!"
 POD_combat_move_fae_wayfare_quicksilver:0 "@fae_icon!Ртуть"
 POD_combat_move_fae_wayfare_quicksilver_desc:0 "[PODCombatMoveDesc('POD_combat_move_fae_wayfare_quicksilver')]"
 POD_combat_move_fae_wayfare_quicksilver_tooltip:0 "#weak;italic Слышали ли вы когда-нибудь о герое в сапогах-скороходах?#!"
 POD_combat_move_fae_winter_chill:0 "@fae_icon!Холод"
 POD_combat_move_fae_winter_chill_desc:0 "[PODCombatMoveDesc('POD_combat_move_fae_winter_chill')]"
 POD_combat_move_fae_winter_chill_tooltip:0 "#weak;italic Время прихотей прошло. Зима близко.#!"
 POD_combat_move_fae_winter_ice_shackles:0 "@fae_icon!Ледяные кандалы"
 POD_combat_move_fae_winter_ice_shackles_desc:0 "[PODCombatMoveDesc('POD_combat_move_fae_winter_ice_shackles')]"
 POD_combat_move_fae_winter_ice_shackles_tooltip:0 "#weak;italic Никому неведомо, куда ведёт дорога. Дождь ли льёт? Снег ли кружит? Ураган ли грозно воет?#!"
 POD_combat_move_fae_winter_terror_long_night:0 "@fae_icon!Ужас долгой ночи"
 POD_combat_move_fae_winter_terror_long_night_desc:0 "[PODCombatMoveDesc('POD_combat_move_fae_winter_terror_long_night')]"
 POD_combat_move_fae_winter_terror_long_night_tooltip:0 "#weak;italic Никто тебя не спасёт. Я чудовище во тьме, и никакой рыцарь в сияющих доспехах не придёт меня убить. Помощи не будет, и твоя история заканчивается здесь.#!"
 POD_combat_move_fear_of_the_void:0 "@daimonion_icon!Страх пустоты"
 POD_combat_move_fear_of_the_void_desc:0 "[PODCombatMoveDesc('POD_combat_move_fear_of_the_void')]"
 POD_combat_move_fear_of_the_void_tooltip:0 "#weak;italic Каждая душа таит грязные секреты. Покажите им истинную глубину этого пятна.#!"
 POD_combat_move_feint:0 "@skill_prowess_icon!Финт"
 POD_combat_move_feint_desc:0 "[PODCombatMoveDesc('POD_combat_move_feint')]"
 POD_combat_move_feint_tooltip:0 "#weak;italic Изобразите слабость, чтобы заставить противника раскрыться.#!"
 POD_combat_move_fera_beast_strike:0 "@fera_icon!Удар зверя"
 POD_combat_move_fera_beast_strike_desc:0 "[PODCombatMoveDesc('POD_combat_move_fera_beast_strike')]"
 POD_combat_move_fera_beast_strike_tooltip:0 "#weak;italic Звериный коготь, клык или птичий коготь — разницы нет. Боль одна и та же.#!"
 POD_combat_move_fera_channel_rage:0 "@fera_icon!Направить ярость"
 POD_combat_move_fera_channel_rage_desc:0 "[PODCombatMoveDesc('POD_combat_move_werewolf_rage_surge')]"
 POD_combat_move_fera_channel_rage_tooltip:0 "#weak;italic Это дар, который $glossary_luna$ даровала вам... или проклятие?#!"
 POD_combat_move_fera_regeneration:0 "@fera_icon!Регенерация"
 POD_combat_move_fera_regeneration_desc:0 "[PODCombatMoveDesc('POD_combat_move_fera_regeneration')]"
 POD_combat_move_fera_regeneration_tooltip:0 "#weak;italic $glossary_fera$ наделены огромными регенеративными способностями, даром, который они используют с большим эффектом.#!"
 POD_combat_move_feral_weapons:0 "@protean_icon!Звериное оружие"
 POD_combat_move_feral_weapons_desc:0 "[PODCombatMoveDesc('POD_combat_move_feral_weapons')]"
 POD_combat_move_feral_weapons_tooltip:0 "#weak;italic Пусть цивилизованные люди сражаются сталью. Твои когти прорежут всё это.#!"
 POD_combat_move_field_dressing:0 "@skill_prowess_icon!Полевая перевязка"
 POD_combat_move_field_dressing_desc:0 "[PODCombatMoveDesc('POD_combat_move_field_dressing')]"
 POD_combat_move_field_dressing_tooltip:0 "#weak;italic Похоже, уроки анатомии пригодились.#!"
 POD_combat_move_fingers_of_bialowieza:0 "@bloodsorcery_icon!Пальцы Беловежи"
 POD_combat_move_fingers_of_bialowieza_desc:0 "[PODCombatMoveDesc('POD_combat_move_fingers_of_bialowieza')]"
 POD_combat_move_fingers_of_bialowieza_tooltip:0 "#weak;italic Леса жаждут удержать ваших врагов. Как можно им отказать?#!"
 POD_combat_move_fire_control:0 "@bloodsorcery_icon!Управление огнём"
 POD_combat_move_fire_control_desc:0 "[PODCombatMoveDesc('POD_combat_move_fire_control')]"
 POD_combat_move_fire_control_tooltip:0 "#weak;italic Призовите свою кровь, и огонь подчинится вашим приказам.#!"
 POD_combat_move_fire_voice:0 "@dementation_icon!Огненный голос"
 POD_combat_move_fire_voice_desc:0 "[PODCombatMoveDesc('POD_combat_move_fire_voice')]"
 POD_combat_move_fire_voice_tooltip:0 "#weak;italic Говорите потрескивающим голосом приближающегося пламени и наблюдайте, как Зверь в них паникует.#!"
 POD_combat_move_flow_with_the_mountain:0 "@visceratika_icon!Движение в горе"
 POD_combat_move_flow_with_the_mountain_desc:0 "[PODCombatMoveDesc('POD_combat_move_flow_with_the_mountain')]"
 POD_combat_move_flow_with_the_mountain_tooltip:0 "#weak;italic Станьте непоколебимы, как гора, и не позволяйте ничему пробить вашу броню.#!"
 POD_combat_move_focused_strike:0 "@kai_icon!Направленный удар"
 POD_combat_move_focused_strike_desc:0 "[PODCombatMoveDesc('POD_combat_move_focused_strike')]"
 POD_combat_move_focused_strike_tooltip:0 "#weak;italic Прервите вашу тихую концентрацию вспышкой стали.#!"
 POD_combat_move_force_bolt:0 "@bloodsorcery_icon!Силовой снаряд"
 POD_combat_move_force_bolt_desc:0 "[PODCombatMoveDesc('POD_combat_move_force_bolt')]"
 POD_combat_move_force_bolt_tooltip:0 "#weak;italic Выпустите в противника стрелу чистой силы.#!"
 POD_combat_move_fortified_position:0 "@skill_prowess_icon!Укреплённая позиция"
 POD_combat_move_fortified_position_desc:0 "[PODCombatMoveDesc('POD_combat_move_fortified_position')]"
 POD_combat_move_fortified_position_tooltip:0 "#weak;italic Используйте укрытия и местность, чтобы лучше защитить себя.#!"
 POD_combat_move_grondrskas_impasse:0 "@bloodsorcery_icon!Безвыходность Грондорски"
 POD_combat_move_grondrskas_impasse_desc:0 "[PODCombatMoveDesc('POD_combat_move_grondrskas_impasse')]"
 POD_combat_move_grondrskas_impasse_tooltip:0 "#weak;italic Долг воеводы — направлять. Искажайте пути, пока враг не будет вынужден встретиться с вами лицом к лицу.#!"
 POD_combat_move_guard:0 "@skill_prowess_icon!Защита"
 POD_combat_move_guard_desc:0 "[PODCombatMoveDesc('POD_combat_move_guard')]"
 POD_combat_move_guard_tooltip:0 "#weak;italic Попытайтесь парировать удар противника.#!"
 POD_combat_move_hand_of_anubis:0 "@bloodsorcery_icon!Длань Анубиса"
 POD_combat_move_hand_of_anubis_desc:0 "[PODCombatMoveDesc('POD_combat_move_hand_of_anubis')]"
 POD_combat_move_hand_of_anubis_tooltip:0 "#weak;italic Взвесьте сердце врага на весах с пером, затем раздавите его священное подобие в ладони, чтобы сокрушить врага издалека.#!"
 POD_combat_move_healers_touch:0 "@valeren_icon!Касание лекаря"
 POD_combat_move_healers_touch_desc:0 "[PODCombatMoveDesc('POD_combat_move_healers_touch')]"
 POD_combat_move_healers_touch_tooltip:0 "#weak;italic Исцелите своих союзников, показав им немного милости Саулота.#!"
 POD_combat_move_heavy_blow:0 "@skill_prowess_icon!Сильный удар"
 POD_combat_move_heavy_blow_desc:0 "[PODCombatMoveDesc('POD_combat_move_heavy_blow')]"
 POD_combat_move_heavy_blow_tooltip:0 "#weak;italic Удар, который ваш враг не скоро забудет.#!"
 POD_combat_move_hold_fast:0 "@skill_prowess_icon!Держать оборону"
 POD_combat_move_hold_fast_desc:0 "[PODCombatMoveDesc('POD_combat_move_hold_fast')]"
 POD_combat_move_hold_fast_tooltip:0 "#weak;italic Станьте стеной щитов в одиночку.#!"
 POD_combat_move_horrid_reality:0 "@chimerstry_icon!Ужасная реальность"
 POD_combat_move_horrid_reality_desc:0 "[PODCombatMoveDesc('POD_combat_move_horrid_reality')]"
 POD_combat_move_horrid_reality_tooltip:0 "#weak;italic Разум ненадёжен. Накормите его иллюзией боли — и смотрите, как он ломается.#!"
 POD_combat_move_humiliation:0 "@bloodsorcery_icon!Унижение"
 POD_combat_move_humiliation_desc:0 "[PODCombatMoveDesc('POD_combat_move_humiliation')]"
 POD_combat_move_humiliation_tooltip:0 "#weak;italic Наложите тонкое проклятие на эго противника, гарантируя, что его следующий уверенный шаг будет грубой ошибкой.#!"
 POD_combat_move_hunter_acre_auto_da_fe:0 "@supehunter_icon!Аутодафе"
 POD_combat_move_hunter_acre_auto_da_fe_desc:0 "[PODCombatMoveDesc('POD_combat_move_hunter_acre_auto_da_fe')]"
 POD_combat_move_hunter_acre_auto_da_fe_tooltip:0 "#weak;italic За то и Я начну поражать тебя опустошением за грехи твои.#!"
 POD_combat_move_hunter_acre_flight_of_angels:0 "@supehunter_icon!Полет ангелов"
 POD_combat_move_hunter_acre_flight_of_angels_desc:0 "[PODCombatMoveDesc('POD_combat_move_hunter_acre_flight_of_angels')]"
 POD_combat_move_hunter_acre_flight_of_angels_tooltip:0 "#weak;italic А надеющиеся на Господа обновятся в силе: поднимут крылья, как орлы, потекут — и не устанут.#!"
 POD_combat_move_hunter_acre_transfiguration:0 "@supehunter_icon!Преображение плоти"
 POD_combat_move_hunter_acre_transfiguration_desc:0 "[PODCombatMoveDesc('POD_combat_move_hunter_acre_transfiguration')]"
 POD_combat_move_hunter_acre_transfiguration_tooltip:0 "#weak;italic Очи у Него как пламень огненный, и ноги Его подобны халколивану, как раскалённые в печи.#!"
 POD_combat_move_hunter_murnau_arcana:0 "@supehunter_icon!Аркана"
 POD_combat_move_hunter_murnau_arcana_desc:0 "[PODCombatMoveDesc('POD_combat_move_hunter_murnau_arcana')]"
 POD_combat_move_hunter_murnau_arcana_tooltip:0 "#weak;italic Ибо наша брань не против крови и плоти, но против начальств, против властей, против мироправителей тьмы века сего.#!"
 POD_combat_move_hunter_murnau_mirror_of_evil:0 "@supehunter_icon!Зеркало зла"
 POD_combat_move_hunter_murnau_mirror_of_evil_desc:0 "[PODCombatMoveDesc('POD_combat_move_hunter_murnau_mirror_of_evil')]"
 POD_combat_move_hunter_murnau_mirror_of_evil_tooltip:0 "#weak;italic Но если вы кусаете и пожираете друг друга, то берегитесь, чтобы вы не были истреблены друг другом.#!"
 POD_combat_move_hunter_oculi_heavenly_shepherd:0 "@supehunter_icon!Небесный пастырь"
 POD_combat_move_hunter_oculi_heavenly_shepherd_desc:0 "[PODCombatMoveDesc('POD_combat_move_hunter_oculi_heavenly_shepherd')]"
 POD_combat_move_hunter_oculi_heavenly_shepherd_tooltip:0 "#weak;italic Тогда Иисус сказал ему: \"Потому что ты увидел Меня, ты поверил; блаженны те, кто не видел, но уверовал.\"#!"
 POD_combat_move_hunter_oculi_second_sight:0 "@supehunter_icon!Второе зрение"
 POD_combat_move_hunter_oculi_second_sight_desc:0 "[PODCombatMoveDesc('POD_combat_move_hunter_oculi_second_sight')]"
 POD_combat_move_hunter_oculi_second_sight_tooltip:0 "#weak;italic Возлюбленные, не всякому духу верьте, но испытывайте духов, от Бога ли они: потому что много лжепророков вышло в мир.#!"
 POD_combat_move_hunter_oculi_water_to_wine:0 "@supehunter_icon!Воду в вино"
 POD_combat_move_hunter_oculi_water_to_wine_desc:0 "[PODCombatMoveDesc('POD_combat_move_hunter_oculi_water_to_wine')]"
 POD_combat_move_hunter_oculi_water_to_wine_tooltip:0 "#weak;italic Вот, Я Господь, Бог всякой плоти: есть ли что-нибудь трудное для Меня?#!"
 POD_combat_move_hunter_red_sunstone:0 "@supehunter_icon!Солнечный камень"
 POD_combat_move_hunter_red_sunstone_desc:0 "[PODCombatMoveDesc('POD_combat_move_hunter_red_sunstone')]"
 POD_combat_move_hunter_red_sunstone_tooltip:0 "#weak;italic Опять говорил Иисус к народу и сказал им: Я свет миру; кто последует за Мною, тот не будет ходить во тьме, но будет иметь свет жизни.#!"
 POD_combat_move_hunter_silvered_bolt:0 "@supehunter_icon!Посеребрённый болт"
 POD_combat_move_hunter_silvered_bolt_desc:0 "[PODCombatMoveDesc('POD_combat_move_hunter_silvered_bolt')]"
 POD_combat_move_hunter_silvered_bolt_tooltip:0 "#weak;italic Дайте оборотню что-нибудь на память, прежде чем он разорвет вас на куски.#!"
 POD_combat_move_hunter_sisters_chorale:0 "@supehunter_icon!Хор"
 POD_combat_move_hunter_sisters_chorale_desc:0 "[PODCombatMoveDesc('POD_combat_move_hunter_sisters_chorale')]"
 POD_combat_move_hunter_sisters_chorale_tooltip:0 "#weak;italic Приидите, воспоём Господу, воскликнем твердыне спасения нашего.#!"
 POD_combat_move_hunter_sisters_fiat_lux:0 "@supehunter_icon!Фиат Люкс"
 POD_combat_move_hunter_sisters_fiat_lux_desc:0 "[PODCombatMoveDesc('POD_combat_move_hunter_sisters_fiat_lux')]"
 POD_combat_move_hunter_sisters_fiat_lux_tooltip:0 "#weak;italic И сказал Бог: да будет свет. И стал свет.#!"
 POD_combat_move_hunter_sisters_oratorio:0 "@supehunter_icon!Оратория"
 POD_combat_move_hunter_sisters_oratorio_desc:0 "[PODCombatMoveDesc('POD_combat_move_hunter_sisters_oratorio')]"
 POD_combat_move_hunter_sisters_oratorio_tooltip:0 "#weak;italic А я буду воспевать силу Твою и с раннего утра провозглашать милость Твою, ибо Ты был мне защитою и убежищем в день бедствия моего.#!"
 POD_combat_move_hunter_stake_attack:0 "@supehunter_icon!Удар колом"
 POD_combat_move_hunter_stake_attack_desc:0 "[PODCombatMoveDesc('POD_combat_move_hunter_stake_attack')]"
 POD_combat_move_hunter_stake_attack_tooltip:0 "#weak;italic Я знаю твою слабость, демон.#!"
 POD_combat_move_identify_vulnerability:0 "@skill_prowess_icon!Определить уязвимость"
 POD_combat_move_identify_vulnerability_desc:0 "[PODCombatMoveDesc('POD_combat_move_identify_vulnerability')]"
 POD_combat_move_identify_vulnerability_tooltip:0 "#weak;italic Вы точно знаете, какие нервы поразить, чтобы боль не отпускала.#!"
 POD_combat_move_incubus_humor:0 "@dementation_icon!Настроение инкуба"
 POD_combat_move_incubus_humor_desc:0 "[PODCombatMoveDesc('POD_combat_move_incubus_humor')]"
 POD_combat_move_incubus_humor_tooltip:0 "#weak;italic Найдите в них эту маленькую искру гнева, зависти или гордости и превратите ее в психоз.#!"
 POD_combat_move_inferno:0 "@bloodsorcery_icon!Инферно"
 POD_combat_move_inferno_desc:0 "[PODCombatMoveDesc('POD_combat_move_inferno')]"
 POD_combat_move_inferno_tooltip:0 "#weak;italic Зажгите свое витэ и высвободите его в величественной демонстрации нечестивой силы.#!"
 POD_combat_move_inner_focus:0 "@kai_icon!Внутренний фокус"
 POD_combat_move_inner_focus_desc:0 "[PODCombatMoveDesc('POD_combat_move_inner_focus')]"
 POD_combat_move_inner_focus_tooltip:0 "#weak;italic Настоящий воин дисциплинированно управляет Зверем. Сосредоточьтесь, и ваш следующий удар будет разрушительным.#!"
 POD_combat_move_intimidate:0 "@skill_prowess_icon!Запугать"
 POD_combat_move_intimidate_desc:0 "[PODCombatMoveDesc('POD_combat_move_intimidate')]"
 POD_combat_move_intimidate_tooltip:0 "#weak;italic Сдавайся, пока не стало хуже.#!"
 POD_combat_move_kiss_of_lachesis:0 "@temporis_icon!Поцелуй Лахесис"
 POD_combat_move_kiss_of_lachesis_desc:0 "[PODCombatMoveDesc('POD_combat_move_kiss_of_lachesis')]"
 POD_combat_move_kiss_of_lachesis_tooltip:0 "#weak;italic Прикажите пескам времени разъесть их плоть, приняв на себя обратный удар.#!"
 POD_combat_move_knights_bane:0 "@fortitude_icon!Проклятие рыцаря"
 POD_combat_move_knights_bane_desc:0 "[PODCombatMoveDesc('POD_combat_move_knights_bane')]"
 POD_combat_move_knights_bane_tooltip:0 "#weak;italic Пусть они сломают кулаки о твою железную плоть.#!"
 POD_combat_move_kueijin_accentuate_chi:0 "@kueijin_icon!Усиление ци"
 POD_combat_move_kueijin_accentuate_chi_desc:0 "[PODCombatMoveDesc('POD_combat_move_kueijin_accentuate_chi')]"
 POD_combat_move_kueijin_accentuate_chi_tooltip:0 "#weak;italic Баланс их тела восстанавливается благодаря вашему вмешательству, заживляя при этом синяки и раны.#!"
 POD_combat_move_kueijin_battle_cry:0 "@kueijin_icon!Боевой клич"
 POD_combat_move_kueijin_battle_cry_desc:0 "[PODCombatMoveDesc('POD_combat_move_kueijin_battle_cry')]"
 POD_combat_move_kueijin_battle_cry_tooltip:0 "#weak;italic Как банши из самого Ада, твой голос поражает их тело и душу.#!"
 POD_combat_move_kueijin_bite:0 "@kueijin_icon!Укус голодного мертвеца"
 POD_combat_move_kueijin_bite_desc:0 "[PODCombatMoveDesc('POD_combat_move_kueijin_bite')]"
 POD_combat_move_kueijin_bite_tooltip:0 "#weak;italic Не самый просветлённый способ сражаться, но порой действенность важнее изящества.#!"
 POD_combat_move_kueijin_black_wind:0 "@kueijin_icon!Чёрный ветер"
 POD_combat_move_kueijin_black_wind_desc:0 "[PODCombatMoveDesc('POD_combat_move_kueijin_black_wind')]"
 POD_combat_move_kueijin_black_wind_tooltip:0 "#weak;italic Все, что вам нужно, — это один удар.#!"
 POD_combat_move_kueijin_bloodlash:0 "@kueijin_icon!Кровавый удар"
 POD_combat_move_kueijin_bloodlash_desc:0 "[PODCombatMoveDesc('POD_combat_move_kueijin_bloodlash')]"
 POD_combat_move_kueijin_bloodlash_tooltip:0 "#weak;italic Мастер Кровавого Синтая никогда не бывает без оружия. Собственная жизненная сущность — его самое смертоносное орудие.#!"
 POD_combat_move_kueijin_celestial_curse:0 "@kueijin_icon!Проклятие небес"
 POD_combat_move_kueijin_celestial_curse_desc:0 "[PODCombatMoveDesc('POD_combat_move_kueijin_celestial_curse')]"
 POD_combat_move_kueijin_celestial_curse_tooltip:0 "#weak;italic Их тщетной борьбе суждено закончиться здесь. Вы это решили.#!"
 POD_combat_move_kueijin_chi_mending:0 "@kueijin_icon!Исцеление Ци"
 POD_combat_move_kueijin_chi_mending_desc:0 "[PODCombatMoveDesc('POD_combat_move_kueijin_chi_mending')]"
 POD_combat_move_kueijin_chi_mending_tooltip:0 "#weak;italic Сами энергии жизни исцеляют твое мертвое тело.#!"
 POD_combat_move_kueijin_chi_shaping:0 "@kueijin_icon!Формирование ци"
 POD_combat_move_kueijin_chi_shaping_desc:0 "[PODCombatMoveDesc('POD_combat_move_kueijin_chi_shaping')]"
 POD_combat_move_kueijin_chi_shaping_tooltip:0 "#weak;italic По вашей команде вырывается сама энергия земли, разрывая все на своем пути.#!"
 POD_combat_move_kueijin_chi_sight:0 "@kueijin_icon!Зрение Ци"
 POD_combat_move_kueijin_chi_sight_desc:0 "[PODCombatMoveDesc('POD_combat_move_kueijin_chi_sight')]"
 POD_combat_move_kueijin_chi_sight_tooltip:0 "#weak;italic Каждый связан с драконьими линиями. Перед мастером Слёз Дракона бессмысленно пытаться спрятаться.#!"
 POD_combat_move_kueijin_chi_surge:0 "@kueijin_icon!Прилив Ци"
 POD_combat_move_kueijin_chi_surge_desc:0 "[PODCombatMoveDesc('POD_combat_move_kueijin_chi_surge')]"
 POD_combat_move_kueijin_chi_surge_tooltip:0 "#weak;italic Внезапный всплеск Ци для получения преимущества в критический момент, долг, который нужно выплатить позже.#!"
 POD_combat_move_kueijin_crack_tortoise_shell:0 "@kueijin_icon!Раскол панциря черепахи"
 POD_combat_move_kueijin_crack_tortoise_shell_desc:0 "[PODCombatMoveDesc('POD_combat_move_kueijin_crack_tortoise_shell')]"
 POD_combat_move_kueijin_crack_tortoise_shell_tooltip:0 "#weak;italic Нет доспеха без слабого места. Нет крепости без возможной бреши. Дьявол знает, как раскрыть их все.#!"
 POD_combat_move_kueijin_dark_cultivation:0 "@kueijin_icon!Тёмное взращивание"
 POD_combat_move_kueijin_dark_cultivation_desc:0 "[PODCombatMoveDesc('POD_combat_move_kueijin_dark_cultivation')]"
 POD_combat_move_kueijin_dark_cultivation_tooltip:0 "#weak;italic Вы так и не покинули Ады Йоми по-настоящему. Вы лишь присвоили их силу.#!"
 POD_combat_move_kueijin_death_lines:0 "@kueijin_icon!Линии смерти"
 POD_combat_move_kueijin_death_lines_desc:0 "[PODCombatMoveDesc('POD_combat_move_kueijin_death_lines')]"
 POD_combat_move_kueijin_death_lines_tooltip:0 "#weak;italic В их душе так много трещин. Вы покажете им каждую.#!"
 POD_combat_move_kueijin_death_punch:0 "@kueijin_icon!Смертельный удар"
 POD_combat_move_kueijin_death_punch_desc:0 "[PODCombatMoveDesc('POD_combat_move_kueijin_death_punch')]"
 POD_combat_move_kueijin_death_punch_tooltip:0 "#weak;italic Удар по телу - это так банально. Вместо этого настоящий мастер стремится к душе.#!"
 POD_combat_move_kueijin_devil_fist:0 "@kueijin_icon!Кулак дьявола"
 POD_combat_move_kueijin_devil_fist_desc:0 "[PODCombatMoveDesc('POD_combat_move_kueijin_devil_fist')]"
 POD_combat_move_kueijin_devil_fist_tooltip:0 "#weak;italic Демон - это ты без ограничений, морали и раскаяния. Это то, кем ты должен быть во время битвы.#!"
 POD_combat_move_kueijin_distant_death_kata:0 "@kueijin_icon!Ката Далекой Смерти"
 POD_combat_move_kueijin_distant_death_kata_desc:0 "[PODCombatMoveDesc('POD_combat_move_kueijin_distant_death_kata')]"
 POD_combat_move_kueijin_distant_death_kata_tooltip:0 "#weak;italic Завораживающий боевой танец, сбивающий противника с толку, пока он не получит от него всю силу.#!"
 POD_combat_move_kueijin_dragon_medicine:0 "@kueijin_icon!Драконье врачевание"
 POD_combat_move_kueijin_dragon_medicine_desc:0 "[PODCombatMoveDesc('POD_combat_move_kueijin_dragon_medicine')]"
 POD_combat_move_kueijin_dragon_medicine_tooltip:0 "#weak;italic Истинный мастер найдёт Ци повсюду. Неудивительно, что его союзники всегда полны жизни.#!"
 POD_combat_move_kueijin_duke_of_wind:0 "@kueijin_icon!Вызов герцога Ветра"
 POD_combat_move_kueijin_duke_of_wind_desc:0 "[PODCombatMoveDesc('POD_combat_move_kueijin_duke_of_wind')]"
 POD_combat_move_kueijin_duke_of_wind_tooltip:0 "#weak;italic Ветры прислушиваются к вашему зову, поднимая свое первобытное величие, чтобы беспокоить ваших врагов.#!"
 POD_combat_move_kueijin_fire_in_the_eye:0 "@kueijin_icon!Огонь в глазах"
 POD_combat_move_kueijin_fire_in_the_eye_desc:0 "[PODCombatMoveDesc('POD_combat_move_kueijin_fire_in_the_eye')]"
 POD_combat_move_kueijin_fire_in_the_eye_tooltip:0 "#weak;italic Сам вид нечестивого пламени невыносим для слабых.#!"
 POD_combat_move_kueijin_flow_like_blood:0 "@kueijin_icon!Поток крови"
 POD_combat_move_kueijin_flow_like_blood_desc:0 "[PODCombatMoveDesc('POD_combat_move_kueijin_flow_like_blood')]"
 POD_combat_move_kueijin_flow_like_blood_tooltip:0 "#weak;italic Более острая версия приёма \"Поток воды\".#!"
 POD_combat_move_kueijin_flow_of_worship:0 "@kueijin_icon!Поток почитания"
 POD_combat_move_kueijin_flow_of_worship_desc:0 "[PODCombatMoveDesc('POD_combat_move_kueijin_flow_of_worship')]"
 POD_combat_move_kueijin_flow_of_worship_tooltip:0 "#weak;italic Как некогда Ван Сянь, потерянный небесный защитник черпает силу в поклонении людей.#!"
 POD_combat_move_kueijin_grand_dukes_theorem:0 "@kueijin_icon!Теорема Великого Герцога"
 POD_combat_move_kueijin_grand_dukes_theorem_desc:0 "[PODCombatMoveDesc('POD_combat_move_kueijin_grand_dukes_theorem')]"
 POD_combat_move_kueijin_grand_dukes_theorem_tooltip:0 "#weak;italic Судьба - это всего лишь книга, которую нужно расшифровать. Ты знаешь, что твоя судьба на этом не заканчивается.#!"
 POD_combat_move_kueijin_greater_ngilai:0 "@kueijin_icon!Большой Нгилай"
 POD_combat_move_kueijin_greater_ngilai_desc:0 "[PODCombatMoveDesc('POD_combat_move_kueijin_greater_ngilai')]"
 POD_combat_move_kueijin_greater_ngilai_tooltip:0 "#weak;italic Мужество и отвагу легко разрушить, столкнувшись с таким потусторонним криком, как этот.#!"
 POD_combat_move_kueijin_hampering_smoke:0 "@kueijin_icon!Сдерживающий дым Чжоу Чжэна"
 POD_combat_move_kueijin_hampering_smoke_desc:0 "[PODCombatMoveDesc('POD_combat_move_kueijin_hampering_smoke')]"
 POD_combat_move_kueijin_hampering_smoke_tooltip:0 "#weak;italic Когда под рукой нет песка, волшебный дым обязательно поможет.#!"
 POD_combat_move_kueijin_hand_of_darkness:0 "@kueijin_icon!Рука Тьмы"
 POD_combat_move_kueijin_hand_of_darkness_desc:0 "[PODCombatMoveDesc('POD_combat_move_kueijin_hand_of_darkness')]"
 POD_combat_move_kueijin_hand_of_darkness_tooltip:0 "#weak;italic Удача не на их стороне. Винить им стоит лишь себя за неудачное решение сразиться с вами.#!"
 POD_combat_move_kueijin_harmonious_wards:0 "@kueijin_icon!Гармоничная стена"
 POD_combat_move_kueijin_harmonious_wards_desc:0 "[PODCombatMoveDesc('POD_combat_move_kueijin_harmonious_wards')]"
 POD_combat_move_kueijin_harmonious_wards_tooltip:0 "#weak;italic Выбор поля боя – половина дела. Если это невозможно, вы всегда можете изменить его по своему вкусу.#!"
 POD_combat_move_kueijin_healing_sleep:0 "@kueijin_icon!Целебный сон"
 POD_combat_move_kueijin_healing_sleep_desc:0 "[PODCombatMoveDesc('POD_combat_move_kueijin_healing_sleep')]"
 POD_combat_move_kueijin_healing_sleep_tooltip:0 "#weak;italic Разум не может вечно жаждать насилия. Навязанная передышка, ещё не заслуженная, может дать немалое преимущество.#!"
 POD_combat_move_kueijin_hemorrhagic_strike:0 "@kueijin_icon!Геморрагический удар"
 POD_combat_move_kueijin_hemorrhagic_strike_desc:0 "[PODCombatMoveDesc('POD_combat_move_kueijin_hemorrhagic_strike')]"
 POD_combat_move_kueijin_hemorrhagic_strike_tooltip:0 "#weak;italic Чума на их головы! Ваш заражённый удар медленно вытягивает из них жизнь.#!"
 POD_combat_move_kueijin_infernal_fortitude:0 "@kueijin_icon!Инфернальная стойкость"
 POD_combat_move_kueijin_infernal_fortitude_desc:0 "[PODCombatMoveDesc('POD_combat_move_kueijin_infernal_fortitude')]"
 POD_combat_move_kueijin_infernal_fortitude_tooltip:0 "#weak;italic Демон пережил Ад. Он поможет вам пережить и эту схватку.#!"
 POD_combat_move_kueijin_infernal_glory:0 "@kueijin_icon!Инфернальная слава"
 POD_combat_move_kueijin_infernal_glory_desc:0 "[PODCombatMoveDesc('POD_combat_move_kueijin_infernal_glory')]"
 POD_combat_move_kueijin_infernal_glory_tooltip:0 "#weak;italic Твоя истинная форма — одновременно демон и вечный чемпион. Слабый ум не может постичь такой дисбаланс.#!"
 POD_combat_move_kueijin_infernal_might:0 "@kueijin_icon!Инфернальная мощь"
 POD_combat_move_kueijin_infernal_might_desc:0 "[PODCombatMoveDesc('POD_combat_move_kueijin_infernal_might')]"
 POD_combat_move_kueijin_infernal_might_tooltip:0 "#weak;italic Демон — ваш враг, но он тоже хочет выжить. Без угрызений совести позаимствуйте его силу для боя.#!"
 POD_combat_move_kueijin_infernal_speed:0 "@kueijin_icon!Инфернальная скорость"
 POD_combat_move_kueijin_infernal_speed_desc:0 "[PODCombatMoveDesc('POD_combat_move_kueijin_infernal_speed')]"
 POD_combat_move_kueijin_infernal_speed_tooltip:0 "#weak;italic Вы сумели вырваться из самого Ада. Обогнать этого врага — детская забава.#!"
 POD_combat_move_kueijin_jade_mantle:0 "@kueijin_icon!Нефритовая мантия"
 POD_combat_move_kueijin_jade_mantle_desc:0 "[PODCombatMoveDesc('POD_combat_move_kueijin_jade_mantle')]"
 POD_combat_move_kueijin_jade_mantle_tooltip:0 "#weak;italic Нефрит — священный материал самого Августейшего Нефритового Императора. Разрушить его — оскорбить сами Небеса.#!"
 POD_combat_move_kueijin_killing_shriek:0 "@kueijin_icon!Убийственный вопль"
 POD_combat_move_kueijin_killing_shriek_desc:0 "[PODCombatMoveDesc('POD_combat_move_kueijin_killing_shriek')]"
 POD_combat_move_kueijin_killing_shriek_tooltip:0 "#weak;italic Ады Йоми научили вас кричать от ужаса. Теперь эти крики стали вашим оружием.#!"
 POD_combat_move_kueijin_long_neck:0 "@kueijin_icon!Длинная шея"
 POD_combat_move_kueijin_long_neck_desc:0 "[PODCombatMoveDesc('POD_combat_move_kueijin_long_neck')]"
 POD_combat_move_kueijin_long_neck_tooltip:0 "#weak;italic Благодаря вашему полному контролю над своими конечностями ни один враг не останется вне досягаемости. Мастерство йоги не требуется.#!"
 POD_combat_move_kueijin_mantle_flame_emperor:0 "@kueijin_icon!Мантия Огненного Императора"
 POD_combat_move_kueijin_mantle_flame_emperor_desc:0 "[PODCombatMoveDesc('POD_combat_move_kueijin_mantle_flame_emperor')]"
 POD_combat_move_kueijin_mantle_flame_emperor_tooltip:0 "#weak;italic Огненный Император — одновременно мудрость и глупость. Его огонь — это проклятие, замаскированное под благословение.#!"
 POD_combat_move_kueijin_no_mind:0 "@kueijin_icon!Безмыслие"
 POD_combat_move_kueijin_no_mind_desc:0 "[PODCombatMoveDesc('POD_combat_move_kueijin_no_mind')]"
 POD_combat_move_kueijin_no_mind_tooltip:0 "#weak;italic Демону не место на поле боя. Верните его в клетку — туда, где ему и положено быть.#!"
 POD_combat_move_kueijin_non_self:0 "@kueijin_icon!Отсутствие самосознания"
 POD_combat_move_kueijin_non_self_desc:0 "[PODCombatMoveDesc('POD_combat_move_kueijin_non_self')]"
 POD_combat_move_kueijin_non_self_tooltip:0 "#weak;italic Они не могут поразить то, что их разум отказывается признать.#!"
 POD_combat_move_kueijin_rakshasa_blade:0 "@kueijin_icon!Клинок ракшасы"
 POD_combat_move_kueijin_rakshasa_blade_desc:0 "[PODCombatMoveDesc('POD_combat_move_kueijin_rakshasa_blade')]"
 POD_combat_move_kueijin_rakshasa_blade_tooltip:0 "#weak;italic Истинный мастер Синтая Иллюзий знает, что величайшая иллюзия – это та, которая перестает быть таковой.#!"
 POD_combat_move_kueijin_razor_winds:0 "@kueijin_icon!Бритвенные ветры"
 POD_combat_move_kueijin_razor_winds_desc:0 "[PODCombatMoveDesc('POD_combat_move_kueijin_razor_winds')]"
 POD_combat_move_kueijin_razor_winds_tooltip:0 "#weak;italic Единственная, маленькая брешь в ткани реальности, ведущая в миры Йоми. Ужасающая демонстрация того, что будет дальше.#!"
 POD_combat_move_kueijin_relentless_bone:0 "@kueijin_icon!Безжалостная кость"
 POD_combat_move_kueijin_relentless_bone_desc:0 "[PODCombatMoveDesc('POD_combat_move_kueijin_relentless_bone')]"
 POD_combat_move_kueijin_relentless_bone_tooltip:0 "#weak;italic Кости ломаются. По крайней мере, у ваших врагов: для себя вы давно решили эту проблему.#!"
 POD_combat_move_kueijin_ride_the_dragon:0 "@kueijin_icon!Оседлать дракона"
 POD_combat_move_kueijin_ride_the_dragon_desc:0 "[PODCombatMoveDesc('POD_combat_move_kueijin_ride_the_dragon')]"
 POD_combat_move_kueijin_ride_the_dragon_tooltip:0 "#weak;italic Ты всегда на шаг впереди. Они не смогут конкурировать с мастером линий Ци.#!"
