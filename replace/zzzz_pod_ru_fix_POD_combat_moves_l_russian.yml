 POD_combat_move_sorcery_shadows_commanding_shadows_tooltip:0 "#weak;italic Как они смогут наносить удары, когда неестественная тьма окутывает поле битвы?#!"
 POD_combat_move_sorcery_shadows_grip_of_shades:0 "@sorcerer_icon!Захват теней"
 POD_combat_move_sorcery_shadows_grip_of_shades_desc:0 "[PODCombatMoveDesc('POD_combat_move_sorcery_shadows_grip_of_shades')]"
 POD_combat_move_sorcery_shadows_grip_of_shades_tooltip:0 "#weak;italic Борьба с тенями трудна, и это доказывает ваш сбитый с толку противник.#!"
 POD_combat_move_sorcery_shadows_ruling_darkness:0 "@sorcerer_icon!Владычество тьмы"
 POD_combat_move_sorcery_shadows_ruling_darkness_desc:0 "[PODCombatMoveDesc('POD_combat_move_sorcery_shadows_ruling_darkness')]"
 POD_combat_move_sorcery_shadows_ruling_darkness_tooltip:0 "#weak;italic И в конце... остается только тьма.#!"
 POD_combat_move_sorcery_shadows_shadow_veil:0 "@sorcerer_icon!Теневая завеса"
 POD_combat_move_sorcery_shadows_shadow_veil_desc:0 "[PODCombatMoveDesc('POD_combat_move_sorcery_shadows_shadow_veil')]"
 POD_combat_move_sorcery_shadows_shadow_veil_tooltip:0 "#weak;italic Привет, тьма, мой старый друг.#!"
 POD_combat_move_sorcery_shapeshifting_bestial_talons:0 "@sorcerer_icon!Звериные когти"
 POD_combat_move_sorcery_shapeshifting_bestial_talons_desc:0 "[PODCombatMoveDesc('POD_combat_move_sorcery_shapeshifting_bestial_talons')]"
 POD_combat_move_sorcery_shapeshifting_bestial_talons_tooltip:0 "#weak;italic Когти всегда пригодятся в бою. Только не забудьте после убрать их.#!"
 POD_combat_move_sorcery_shapeshifting_borrowed_scales:0 "@sorcerer_icon!Заимствованная чешуя"
 POD_combat_move_sorcery_shapeshifting_borrowed_scales_desc:0 "[PODCombatMoveDesc('POD_combat_move_sorcery_shapeshifting_borrowed_scales')]"
 POD_combat_move_sorcery_shapeshifting_borrowed_scales_tooltip:0 "#weak;italic Если у рептилий были такие хорошие доспехи, неудивительно, что они правили миром в древние времена.#!"
 POD_combat_move_sorcery_shapeshifting_predators_eyes:0 "@sorcerer_icon!Глаза Хищника"
 POD_combat_move_sorcery_shapeshifting_predators_eyes_desc:0 "[PODCombatMoveDesc('POD_combat_move_sorcery_shapeshifting_predators_eyes')]"
 POD_combat_move_sorcery_shapeshifting_predators_eyes_tooltip:0 "#weak;italic Ни один человек не сможет приручить хищника, действуя как добыча.#!"
 POD_combat_move_sorcery_weather_call_lightning:0 "@sorcerer_icon!Вызов Молнии"
 POD_combat_move_sorcery_weather_call_lightning_desc:0 "[PODCombatMoveDesc('POD_combat_move_sorcery_weather_call_lightning')]"
 POD_combat_move_sorcery_weather_call_lightning_tooltip:0 "#weak;italic Гром, прислушайся к моему зову!#!"
 POD_combat_move_sorcery_weather_crosswind:0 "@sorcerer_icon!Боковой ветер"
 POD_combat_move_sorcery_weather_crosswind_desc:0 "[PODCombatMoveDesc('POD_combat_move_sorcery_weather_crosswind')]"
 POD_combat_move_sorcery_weather_crosswind_tooltip:0 "#weak;italic Невидимый, но могущественный союзник.#!"
 POD_combat_move_sorcery_weather_obscuring_fog:0 "@sorcerer_icon!Скрывающий туман"
 POD_combat_move_sorcery_weather_obscuring_fog_desc:0 "[PODCombatMoveDesc('POD_combat_move_sorcery_weather_obscuring_fog')]"
 POD_combat_move_sorcery_weather_obscuring_fog_tooltip:0 "#weak;italic Они больше никогда не увидят ясного неба.#!"
 POD_combat_move_sorcery_weather_tempest_unleashed:0 "@sorcerer_icon!Необузданная буря"
 POD_combat_move_sorcery_weather_tempest_unleashed_desc:0 "[PODCombatMoveDesc('POD_combat_move_sorcery_weather_tempest_unleashed')]"
 POD_combat_move_sorcery_weather_tempest_unleashed_tooltip:0 "#weak;italic Конец наступил в яростных громах и молниях.#!"
 POD_combat_move_steal_the_mind:0 "@mytherceria_icon!Кража разума"
 POD_combat_move_steal_the_mind_desc:0 "[PODCombatMoveDesc('POD_combat_move_steal_the_mind')]"
 POD_combat_move_steal_the_mind_tooltip:0 "#weak;italic Они были так уверены в себе — пока вы не обратили эту уверенность против них.#!"
 POD_combat_move_stooping_assault:0 "@vampire_icon!Пикирующий натиск"
 POD_combat_move_stooping_assault_desc:0 "[PODCombatMoveDesc('POD_combat_move_stooping_assault')]"
 POD_combat_move_stooping_assault_tooltip:0 "#weak;italic Обрушьтесь с неба, сокрушая врагов без вреда для себя.#!"
 POD_combat_move_strike:0 "@skill_prowess_icon!Удар"
 POD_combat_move_strike_desc:0 "[PODCombatMoveDesc('POD_combat_move_strike')]"
 POD_combat_move_strike_tooltip:0 "#weak;italic Простая атака, как положено.#!"
 POD_combat_move_subsume_the_darkness:0 "@bloodsorcery_icon!Покорить тьму"
 POD_combat_move_subsume_the_darkness_desc:0 "[PODCombatMoveDesc('POD_combat_move_subsume_the_darkness')]"
 POD_combat_move_subsume_the_darkness_tooltip:0 "#weak;italic Сама тьма придет на помощь твоей истерзанной плоти.#!"
 POD_combat_move_swallow_the_tail:0 "@bloodsorcery_icon!Поглощение хвоста"
 POD_combat_move_swallow_the_tail_desc:0 "[PODCombatMoveDesc('POD_combat_move_swallow_the_tail')]"
 POD_combat_move_swallow_the_tail_tooltip:0 "#weak;italic Мировой Змей проглатывает свой хвост, и твоя кровь имитирует этот цикл, возвращая пролитое витэ обратно в твои вены.#!"
 POD_combat_move_taste_of_death:0 "@quietus_icon!Вкус погибели"
 POD_combat_move_taste_of_death_desc:0 "[PODCombatMoveDesc('POD_combat_move_taste_of_death')]"
 POD_combat_move_taste_of_death_tooltip:0 "#weak;italic Вынесите приговор Хакима обжигающими брызгами витэ, очищающими врага до костей.#!"
 POD_combat_move_the_eye_that_wounds:0 "@bloodsorcery_icon!Калечащий глаз"
 POD_combat_move_the_eye_that_wounds_desc:0 "[PODCombatMoveDesc('POD_combat_move_the_eye_that_wounds')]"
 POD_combat_move_the_eye_that_wounds_tooltip:0 "#weak;italic Они виновны и прольют за это кровь. Одним лишь взглядом вы наносите ужасную рану на их плоть.#!"
 POD_combat_move_the_narrow_house:0 "@bloodsorcery_icon!Тесный дом"
 POD_combat_move_the_narrow_house_desc:0 "[PODCombatMoveDesc('POD_combat_move_the_narrow_house')]"
 POD_combat_move_the_narrow_house_tooltip:0 "#weak;italic Подготовьте свою жертву к загробной жизни, запечатав ее в саркофаге и обездвижив.#!"
 POD_combat_move_theurgy_drive_back_pain:0 "@theurgist_icon!Отогнать боль"
 POD_combat_move_theurgy_drive_back_pain_desc:0 "[PODCombatMoveDesc('POD_combat_move_theurgy_drive_back_pain')]"
 POD_combat_move_theurgy_drive_back_pain_tooltip:0 "#weak;italic Теург знает, как сильно разум влияет на материю. Это не настоящее долговременное исцеление, но облегчить боль — первый шаг к выздоровлению.#!"
 POD_combat_move_theurgy_expel_restless_dead:0 "@theurgist_icon!Изгнать неупокоенных мёртвых"
 POD_combat_move_theurgy_expel_restless_dead_desc:0 "[PODCombatMoveDesc('POD_combat_move_theurgy_expel_restless_dead')]"
 POD_combat_move_theurgy_expel_restless_dead_tooltip:0 "#weak;italic Цель демона — не одержимый, а мы, наблюдатели. Он хочет заставить нас отчаяться, отвергнуть человечность, увидеть в себе лишь звериную мерзость и гниль — лишённую достоинства, уродливую, недостойную.#!"
 POD_combat_move_theurgy_foreseen_assault:0 "@theurgist_icon!Предвиденное нападение"
 POD_combat_move_theurgy_foreseen_assault_desc:0 "[PODCombatMoveDesc('POD_combat_move_theurgy_foreseen_assault')]"
 POD_combat_move_theurgy_foreseen_assault_tooltip:0 "#weak;italic Древние оракулы были шарлатанами, язычниками худшего толка. Ваш пророческий дар явно исходит из высшего источника.#!"
 POD_combat_move_theurgy_holy_conflagration:0 "@theurgist_icon!Пожар священного огня"
 POD_combat_move_theurgy_holy_conflagration_desc:0 "[PODCombatMoveDesc('POD_combat_move_theurgy_holy_conflagration')]"
 POD_combat_move_theurgy_holy_conflagration_tooltip:0 "#weak;italic Есть время тонкостей и полумер. Сейчас не такой момент.#!"
 POD_combat_move_theurgy_holy_fire:0 "@theurgist_icon!Святой огонь"
 POD_combat_move_theurgy_holy_fire_desc:0 "[PODCombatMoveDesc('POD_combat_move_theurgy_holy_fire')]"
 POD_combat_move_theurgy_holy_fire_tooltip:0 "#weak;italic Святой ли это огонь или его источник менее благороден? Пусть учёные мужи спорят, пока вы побеждаете на поле боя.#!"
 POD_combat_move_theurgy_mend_deadly_wounds:0 "@theurgist_icon!Лечить смертельные раны"
 POD_combat_move_theurgy_mend_deadly_wounds_desc:0 "[PODCombatMoveDesc('POD_combat_move_theurgy_mend_deadly_wounds')]"
 POD_combat_move_theurgy_mend_deadly_wounds_tooltip:0 "#weak;italic Некоторые называют это чудом. Мудрый теург не делает подобных заявлений, прекрасно зная возможные последствия.#!"
 POD_combat_move_theurgy_protective_sigil:0 "@theurgist_icon!Защитный знак"
 POD_combat_move_theurgy_protective_sigil_desc:0 "[PODCombatMoveDesc('POD_combat_move_theurgy_protective_sigil')]"
 POD_combat_move_theurgy_protective_sigil_tooltip:0 "#weak;italic Древние слова силы, заимствованные из традиций старше самого заклинателя, всё ещё достаточно весомы, чтобы остановить даже сверхъестественного противника.#!"
 POD_combat_move_third_eye_of_rickard:0 "@bloodsorcery_icon!Третье око Рикарда Аргентия"
 POD_combat_move_third_eye_of_rickard_desc:0 "[PODCombatMoveDesc('POD_combat_move_third_eye_of_rickard')]"
 POD_combat_move_third_eye_of_rickard_tooltip:0 "#weak;italic Пусть тени следят за вами; прикажите им напасть на первого замеченного врага.#!"
 POD_combat_move_time_out_of_time:0 "@celerity_icon!Время вне времени"
 POD_combat_move_time_out_of_time_desc:0 "[PODCombatMoveDesc('POD_combat_move_time_out_of_time')]"
 POD_combat_move_time_out_of_time_tooltip:0 "#weak;italic Пока они в ярости бросаются на ваше остаточное изображение, вы будете лишь наблюдать.#!"
 POD_combat_move_tongue_of_beasts:0 "@animalism_icon!Язык зверей"
 POD_combat_move_tongue_of_beasts_desc:0 "[PODCombatMoveDesc('POD_combat_move_tongue_of_beasts')]"
 POD_combat_move_tongue_of_beasts_tooltip:0 "#weak;italic Отбросьте беспорядочные мысли и страхи зверей, заменив их безжалостной точностью.#!"
 POD_combat_move_tormented_essence:0 "@daimonion_icon!Измученная сущность"
 POD_combat_move_tormented_essence_desc:0 "[PODCombatMoveDesc('POD_combat_move_tormented_essence')]"
 POD_combat_move_tormented_essence_tooltip:0 "#weak;italic Смерть слишком милосердна. Ваша злоба заставит их гнить изнутри.#!"
 POD_combat_move_transmogrify_mortal_clay:0 "@vicissitude_icon!Живая глина"
 POD_combat_move_transmogrify_mortal_clay_desc:0 "[PODCombatMoveDesc('POD_combat_move_transmogrify_mortal_clay')]"
 POD_combat_move_transmogrify_mortal_clay_tooltip:0 "#weak;italic Агония — цена физического и духовного совершенства.#!"
 POD_combat_move_truefaith_filius_rod_and_staff:0 "@truefaith_icon!Жезл и посох"
 POD_combat_move_truefaith_filius_rod_and_staff_desc:0 "[PODCombatMoveDesc('POD_combat_move_truefaith_filius_rod_and_staff')]"
 POD_combat_move_truefaith_filius_rod_and_staff_tooltip:0 "#weak;italic Да, хотя я пойду и долиною смертной тени, не убоюсь зла: ибо Ты со мной.#!"
 POD_combat_move_truefaith_filius_sunder:0 "@truefaith_icon!Раскол"
 POD_combat_move_truefaith_filius_sunder_desc:0 "[PODCombatMoveDesc('POD_combat_move_truefaith_filius_sunder')]"
 POD_combat_move_truefaith_filius_sunder_tooltip:0 "#weak;italic Сегодня Господь предаст тебя в руки мои; и я поражу тебя.#!"
 POD_combat_move_truefaith_filius_wrath_of_god:0 "@truefaith_icon!Гнев Божий"
 POD_combat_move_truefaith_filius_wrath_of_god_desc:0 "[PODCombatMoveDesc('POD_combat_move_truefaith_filius_wrath_of_god')]"
 POD_combat_move_truefaith_filius_wrath_of_god_tooltip:0 "#weak;italic И совершу над ними великое мщение наказаниями яростными; и узнают, что Я Господь, когда совершу над ними Моё мщение.#!"
 POD_combat_move_truefaith_lay_on_hands:0 "@truefaith_icon!Возложение рук"
 POD_combat_move_truefaith_lay_on_hands_desc:0 "[PODCombatMoveDesc('POD_combat_move_truefaith_lay_on_hands')]"
 POD_combat_move_truefaith_lay_on_hands_tooltip:0 "#weak;italic И молитва веры исцелит болящего, и восставит его Господь.#!"
 POD_combat_move_truefaith_miracle_of_protection:0 "@truefaith_icon!Чудо заступничества"
 POD_combat_move_truefaith_miracle_of_protection_desc:0 "[PODCombatMoveDesc('POD_combat_move_truefaith_miracle_of_protection')]"
 POD_combat_move_truefaith_miracle_of_protection_tooltip:0 "#weak;italic Бог мой — скала моя; на Него я уповаю; Он щит мой, рог спасения моего, ограждение моё, прибежище моё, Спаситель мой.#!"
 POD_combat_move_truefaith_patris_revelation:0 "@truefaith_icon!Откровение"
 POD_combat_move_truefaith_patris_revelation_desc:0 "[PODCombatMoveDesc('POD_combat_move_truefaith_patris_revelation')]"
 POD_combat_move_truefaith_patris_revelation_tooltip:0 "#weak;italic Открой очи мои, и увижу чудеса закона Твоего.#!"
 POD_combat_move_truefaith_penance:0 "@truefaith_icon!Покаяние"
 POD_combat_move_truefaith_penance_desc:0 "[PODCombatMoveDesc('POD_combat_move_truefaith_penance')]"
 POD_combat_move_truefaith_penance_tooltip:0 "#weak;italic Нет, говорю вам: но, если не покаетесь, все так же погибнете.#!"
 POD_combat_move_truefaith_spiritus_aura_of_sanctity:0 "@truefaith_icon!Аура святости"
 POD_combat_move_truefaith_spiritus_aura_of_sanctity_desc:0 "[PODCombatMoveDesc('POD_combat_move_truefaith_spiritus_aura_of_sanctity')]"
 POD_combat_move_truefaith_spiritus_aura_of_sanctity_tooltip:0 "#weak;italic Я освятил сей храм, который ты построил, чтобы пребывать имени Моему там вовек; и будут очи Мои и сердце Моё там во все дни.#!"
 POD_combat_move_truefaith_spiritus_judgement_of_heaven:0 "@truefaith_icon!Суд небес"
 POD_combat_move_truefaith_spiritus_judgement_of_heaven_desc:0 "[PODCombatMoveDesc('POD_combat_move_truefaith_spiritus_judgement_of_heaven')]"
 POD_combat_move_truefaith_spiritus_judgement_of_heaven_tooltip:0 "#weak;italic Ни одно орудие, сделанное против тебя, не будет успешно; и всякий язык, который будет состязаться с тобою на суде, ты обвинишь.#!"
 POD_combat_move_typhonic_maw:0 "@serpentis_icon!Тифоническая пасть"
 POD_combat_move_typhonic_maw_desc:0 "[PODCombatMoveDesc('POD_combat_move_typhonic_maw')]"
 POD_combat_move_typhonic_maw_tooltip:0 "#weak;italic Почтите Сета: сбросьте человеческую личину и напейтесь крови змеиной пастью.#!"
 POD_combat_move_unseen_ambush:0 "@obfuscate_icon!Невидимая засада"
 POD_combat_move_unseen_ambush_desc:0 "[PODCombatMoveDesc('POD_combat_move_unseen_ambush')]"
 POD_combat_move_unseen_ambush_tooltip:0 "#weak;italic Они заметят ваш удар только тогда, когда для них будет слишком поздно.#!"
 POD_combat_move_vampire_bite:0 "@vampire_icon!Укус вампира"
 POD_combat_move_vampire_bite_desc:0 "[PODCombatMoveDesc('POD_combat_move_vampire_bite')]"
 POD_combat_move_vampire_bite_tooltip:0 "#weak;italic Вонзите зубы в чужую плоть и похитьте живительную кровь, чтобы продержаться ещё немного.#!"
 POD_combat_move_vanish_from_minds_eye:0 "@obfuscate_icon!Исчезновение из мысленного взора"
 POD_combat_move_vanish_from_minds_eye_desc:0 "[PODCombatMoveDesc('POD_combat_move_vanish_from_minds_eye')]"
 POD_combat_move_vanish_from_minds_eye_tooltip:0 "#weak;italic Пусть они забудут о вашем существовании, чтобы вы могли подготовиться и нанести ответный удар.#!"
 POD_combat_move_weather_control:0 "@bloodsorcery_icon!Управление погодой"
 POD_combat_move_weather_control_desc:0 "[PODCombatMoveDesc('POD_combat_move_weather_control')]"
 POD_combat_move_weather_control_tooltip:0 "#weak;italic Используйте нечестивую силу витэ, чтобы формировать поле битвы.#!"
 POD_combat_move_well_kept_kit:0 "@skill_prowess_icon!Ухоженное снаряжение"
 POD_combat_move_well_kept_kit_desc:0 "[PODCombatMoveDesc('POD_combat_move_well_kept_kit')]"
 POD_combat_move_well_kept_kit_tooltip:0 "#weak;italic Содержать снаряжение в порядке так же легко, как и бухгалтерские книги.#!"
 POD_combat_move_werewolf_artisans_command:0 "@werewolf_icon!Веление мастера"
 POD_combat_move_werewolf_artisans_command_desc:0 "[PODCombatMoveDesc('POD_combat_move_werewolf_artisans_command')]"
 POD_combat_move_werewolf_artisans_command_tooltip:0 "#weak;italic Представьте, что вас ударил собственный меч. А теперь смотрите, как это происходит.#!"
 POD_combat_move_werewolf_balefire:0 "@werewolf_icon!Жертвенное пламя"
