 POD_combat_move_kueijin_skeletal_sculpting_desc:0 "[PODCombatMoveDesc('POD_combat_move_kueijin_skeletal_sculpting')]"
 POD_combat_move_kueijin_skeletal_sculpting_tooltip:0 "#weak;italic Чужие плоть и кровь — лишь украшение. Вы скульптор, и сегодня ночью вам хочется устроить беспорядок.#!"
 POD_combat_move_kueijin_smoke_without_fire:0 "@kueijin_icon!Дым без огня"
 POD_combat_move_kueijin_smoke_without_fire_desc:0 "[PODCombatMoveDesc('POD_combat_move_kueijin_smoke_without_fire')]"
 POD_combat_move_kueijin_smoke_without_fire_tooltip:0 "#weak;italic Исчезнуть в клубе дыма. Кто-то назвал бы это салонным фокусом. Таких потом редко видят снова.#!"
 POD_combat_move_kueijin_soul_bridge:0 "@kueijin_icon!Связь душ"
 POD_combat_move_kueijin_soul_bridge_desc:0 "[PODCombatMoveDesc('POD_combat_move_kueijin_soul_bridge')]"
 POD_combat_move_kueijin_soul_bridge_tooltip:0 "#weak;italic Хорошо, пусть страх и гнев поглотят тебя...#!"
 POD_combat_move_kueijin_spiked_regalia:0 "@kueijin_icon!Регалии с шипами"
 POD_combat_move_kueijin_spiked_regalia_desc:0 "[PODCombatMoveDesc('POD_combat_move_kueijin_spiked_regalia')]"
 POD_combat_move_kueijin_spiked_regalia_tooltip:0 "#weak;italic У демона есть собственная воля, и он яростно бросается на тех, кто пытается навредить его невольному носителю.#!"
 POD_combat_move_kueijin_stand_dragons_back:0 "@kueijin_icon!Стоять на спине дракона"
 POD_combat_move_kueijin_stand_dragons_back_desc:0 "[PODCombatMoveDesc('POD_combat_move_kueijin_stand_dragons_back')]"
 POD_combat_move_kueijin_stand_dragons_back_tooltip:0 "#weak;italic Нефрит не так хрупок, как думают люди. Глубокая связь с землёй делает его прочнейшим из магических материалов.#!"
 POD_combat_move_kueijin_striking_the_fire:0 "@kueijin_icon!Разжигание огня"
 POD_combat_move_kueijin_striking_the_fire_desc:0 "[PODCombatMoveDesc('POD_combat_move_kueijin_striking_the_fire')]"
 POD_combat_move_kueijin_striking_the_fire_tooltip:0 "#weak;italic Само ваше существование доказывает вашу необычайную стойкость. Обратиться к ней — лишь естественное продолжение вашей сущности.#!"
 POD_combat_move_kueijin_thunderbolts_caress:0 "@kueijin_icon!Ласка Громовержца"
 POD_combat_move_kueijin_thunderbolts_caress_desc:0 "[PODCombatMoveDesc('POD_combat_move_kueijin_thunderbolts_caress')]"
 POD_combat_move_kueijin_thunderbolts_caress_tooltip:0 "#weak;italic Молния у вас под рукой, маленький образец неограниченной силы.#!"
 POD_combat_move_kueijin_touch_of_asura:0 "@kueijin_icon!Касание Асуры"
 POD_combat_move_kueijin_touch_of_asura_desc:0 "[PODCombatMoveDesc('POD_combat_move_kueijin_touch_of_asura')]"
 POD_combat_move_kueijin_touch_of_asura_tooltip:0 "#weak;italic Герои редко сражаются в одиночку. Только в идеальной командной работе можно победить самого сильного врага.#!"
 POD_combat_move_kueijin_vital_command:0 "@kueijin_icon!Жизненный приказ"
 POD_combat_move_kueijin_vital_command_desc:0 "[PODCombatMoveDesc('POD_combat_move_kueijin_vital_command')]"
 POD_combat_move_kueijin_vital_command_tooltip:0 "#weak;italic Синтай плоти требует дани. Помогая своим союзникам, вы восполняете дефицит собственным телом.#!"
