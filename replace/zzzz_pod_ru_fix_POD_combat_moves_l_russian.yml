 POD_combat_move_sorcery_quintessence_disrupt_the_flow_tooltip:0 "#weak;italic Твоя очередь? Нет, еще моя очередь.#!"
 POD_combat_move_sorcery_quintessence_infused_motion:0 "@sorcerer_icon!Наполненное энергией движение"
 POD_combat_move_sorcery_quintessence_infused_motion_desc:0 "[PODCombatMoveDesc('POD_combat_move_sorcery_quintessence_infused_motion')]"
 POD_combat_move_sorcery_quintessence_infused_motion_tooltip:0 "#weak;italic Похоже, твой ход всё ещё продолжается.#!"
 POD_combat_move_sorcery_quintessence_rule_the_flow:0 "@sorcerer_icon!Управляй потоком"
 POD_combat_move_sorcery_quintessence_rule_the_flow_desc:0 "[PODCombatMoveDesc('POD_combat_move_sorcery_quintessence_rule_the_flow')]"
 POD_combat_move_sorcery_quintessence_rule_the_flow_tooltip:0 "#weak;italic Сам воздух словно на вашей стороне, помогая вам и вашим союзникам удерживать преимущество в бою.#!"
 POD_combat_move_sorcery_shadows_commanding_shadows:0 "@sorcerer_icon!Повелевание тенями"
