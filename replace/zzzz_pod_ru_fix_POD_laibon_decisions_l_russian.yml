l_russian:
 pod_laibon_call_to_ancestors_decision:0 "Обращение к предкам"
 pod_laibon_call_to_ancestors_decision_confirm:0 "Обращение к предкам."
 pod_laibon_call_to_ancestors_decision_desc:0 "Отправьтесь в тихое место, к могиле, к перекрестку, к корням старого дерева и впервые за десятилетия взывайте к предкам. Тишина тянется. Затем, слабый ответ. Не слова, давление, Присутствие, напоминание о том, что духовный мир не покинул вас, даже если вы его покинули. Воссоединение болезненно, как кровь возвращается в онемевшую конечность. Но вы можете услышать их снова."
 pod_laibon_call_to_ancestors_decision_tooltip:0 "Получите опыт Орун ценой благочестия и стресса. Доступно только тогда, когда ваша связь с миром духов исчезла."
 pod_laibon_commune_ancestors_decision:0 "Общение с предками"
 pod_laibon_commune_ancestors_decision_confirm:0 "Откройте врата Оруна."
 pod_laibon_commune_ancestors_decision_desc:0 "Вы открываете врата Оруна, и предки отвечают, показывая вам, что скрыто в ваших владениях, и одолжая вам свою силу."
 pod_laibon_commune_ancestors_decision_tooltip:0 "Раскрывает секрет персонажа в ваших владениях. На 5 лет даёт +5 к доблести и +25% к сопротивлению враждебным проискам."
 pod_laibon_commune_reveal_secret_tt:0 "Предки могут раскрыть скрытую правду о ком-то в вашем королевстве."
 pod_laibon_explain_aye_orun_decision:0 "Размышлять о двух мирах"
 pod_laibon_explain_aye_orun_decision_confirm:0 "Направьте свои мысли внутрь себя."
 pod_laibon_explain_aye_orun_decision_desc:0 "Обратите свои мысли внутрь себя и поразмышляйте о двух столпах существования Лайбона: Айе, мире живых, и Оруне, мире духов. Где вы стоите между ними?"
 pod_laibon_explain_aye_orun_decision_tooltip:0 "Подумайте о своей связи с двумя мирами и узнайте, как система Айе/Орун формирует вашу силу."
 pod_laibon_invoke_authority_decision:0 "Призвать власть живых"
 pod_laibon_invoke_authority_decision_confirm:0 "Призовите авторитет Айе."
 pod_laibon_invoke_authority_decision_desc:0 "Вы говорите голосом живого мира — смертные подчиняются, потому что им повелевает сама земля, а другие Лайбон признают ваш Айе-авторитет."
 pod_laibon_invoke_authority_decision_tooltip:0 "На 5 лет даёт +10 к народному мнению и +10% к приросту контроля. На тот же срок мнение всех вассалов-лайбон о вас повышается на +5."
 pod_laibon_remember_the_living_decision:0 "Помните о живых"
 pod_laibon_remember_the_living_decision_confirm:0 "Прогуляйтесь среди живых."
 pod_laibon_remember_the_living_decision_desc:0 "Пройдите среди смертных, чтобы вспомнить тепло жизни. Не охотьтесь и не правьте: посидите у очага, послушайте семейный спор о пустяках. Посмотрите, как дети играют в игру, правила которой вы когда-то знали. Возвращаться к Айе после долгого пренебрежения всегда больно. Но хотя бы этой ночью мир живых вновь станет реальным."
 pod_laibon_remember_the_living_decision_tooltip:0 "Получите опыт Айе ценой благочестия и стресса. Доступно только тогда, когда ваша связь с живым миром исчезла."
 pod_laibon_walker_between_worlds_tt:0 "Вы достигли идеала лайбонов — равновесия между Айе и Оруном. Вы — Странник между мирами."
