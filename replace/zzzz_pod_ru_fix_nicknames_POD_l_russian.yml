l_russian:
 nick_abandoned_ansar_desc:0 "Вера и ярость Юсри ярко горят, как одинокий маяк среди тьмы."
 nick_agent_of_alexandria_desc:0 "Атилия — это невидимая рука, касающаяся священных текстов, вычеркивающая жизни тех, кто смотрит слишком внимательно."
 nick_agent_provocateur_desc:0 "Величайшая магия Лиланда – не его заклинания, а его слова."
 nick_aks_bupati_desc:0 "Фэн Кайин обращает полное духовное просветление в оружие, возглавляя во имя своей цели грозный мятеж убийц."
 nick_almohad_puppeteer_desc:0 "Шепот ветра пустыни, с легкостью свергающий королей и перемещающий армии."
 nick_ambassador_heir_desc:0 "Воспитанник дворов, выкованный в идеального дипломата."
 nick_amicable_legionnary_desc:0 "Лёгкий нрав Юлия резко контрастирует с его холодной, почти механической точностью."
 nick_amir_of_chains_desc:0 "Царство страданий, выстроенное на отнятой у людей свободе."
 nick_apostle_third_caine_desc:0 "Балескида звонит в колокол геенны, ведя свое стадо прямо в пасть бездны."
 nick_apprentice_mastermind_desc:0 "Будущего мастера теней, Хасани ждет темное будущее."
 nick_archegos_katakhthon_desc:0 "Гнойная тьма под всеми городами по праву принадлежит Наркиссу, и только ему одному."
 nick_ashirra_oddity_desc:0 "Странная фигура в странной стране, крепко цепляющаяся за веру."
 nick_beast_of_cordoba_desc:0 "Раздираемой войной земле нужен зверь, чтобы защитить ее."
 nick_bitter_viking_desc:0 "Пламенный-Асгейрр держится только по одной причине: назло всем."
 nick_black_priest:0 "Черный Священник"
 nick_black_priest_desc:0 "Тень Ласомбра может развратить даже самых стойких и благочестивых людей."
 nick_black_sheep_desc:0 "Филипп доказывает, что даже самые благородные могут по ошибке даровать Становление недостойным."
 nick_blood_brother_desc:0 "Джемугха принес священную клятву, принесенную кровью, с величайшим завоевателем в истории. Ради него Анда покорит мир."
 nick_bloodthief:0 "Похититель крови"
 nick_bloodthief_desc:0 "У него нет хозяина — лишь покровитель, шепчущий на ухо и созданный его собственными когтями."
 nick_bonsanguinius:0 "Бонсангвиний"
 nick_bonsanguinius_desc:0 "Какая польза от магии смертных, когда витэ может предложить гораздо больше?"
 nick_brash_monitor_desc:0 "Бдительность, разожжённая безрассудным пылом, — опасное сочетание."
 nick_brencis:0 "Бренсис"
 nick_brencis_desc:0 "Преклоните колени перед своим князем!"
 nick_bridging_prince_desc:0 "Альфонс удерживает свои владения единой лишь ужасающей силой убеждения."
 nick_brood_father_desc:0 "Большой семье нужен заботливый отец, и Ученна отвечает всем требованиям."
 nick_burning_prophet_desc:0 "Алам ходит по полуночным дорогам, распространяя святое слово с непревзойденной страстью."
 nick_butcher_akka_desc:0 "Благодаря им сухие пустыни наполнились свежей кровью."
 nick_calculating_desc:0 "Всегда планируйте на шаг вперед. Или два, желательно."
 nick_cardinal_maledictus_sanguine:0 "Кардинал проклятой крови"
 nick_chantress_of_set_desc:0 "Пойте все громче и громче, чтобы все могли услышать его славу!"
 nick_charming_devil:0 "Очаровательный дьявол"
 nick_charming_devil_desc:0 "Я лучший меч в Долине Сангора!"
 nick_child_of_saturn_desc:0 "Дедра — тихий, неизбежный конец всего сущего, несущий удушающее тление каждому, кто приблизится."
 nick_chosen_voice_desc:0 "Никто не знает, кто выбрал Иосифа и почему. Никто не горит желанием это выяснить."
 nick_cold_furore_desc:0 "Ярость, тлеющая внутри, бывает куда опаснее бушующего пламени."
 nick_conflicted_heir:0 "Терзаемый сомнениями наследник"
 nick_conflicted_heir_desc:0 "Жизнь Аневрина была легкой, пока на его пути не появился смелый и красивый Фенрир. Стоит ли любовь стольких трудностей?"
 nick_conflicted_khan_desc:0 "Дремлющий тиран в разрушающемся дворце, мечущийся между мелкой яростью и внезапными капризами, в то время как волки воют у двери."
 nick_contrary_volva_desc:0 "Ее пророчества не предлагают никакой славы или обещания Валгаллы, но неизбежную истину о том, что вся кровь в конечном итоге будет пролита и заморожена на холодном льду."
 nick_cornered_prince_desc:0 "Нет врага опаснее того, кто загнан в угол."
 nick_corvus_dominus_desc:0 "Бранос — мастер падальщиков, извлекающий самые темные тайны из гниющих уст мертвецов для Бога Солнца."
 nick_courtly_entertainer_desc:0 "Мастер развлечений способен сделать бесконечные ночи почти сносными."
 nick_crescent_knight_desc:0 "Неукротимая ярость анатолийских равнин, навлекшая праведную ярость на латинских лордов на их пороге."
 nick_curious_wanderer:0 "Любопытный странник"
 nick_curious_wanderer_desc:0 "Когда-то этот бывший студент-географ, посвятивший себя составлению карты физического мира, теперь стремится составить карту веры и реальности."
 nick_dazbog_bane:0 "Проклятие Даждьбога"
 nick_dazbog_bane_desc:0 "Древний Бог Солнца не смог разрушить маловероятный союз Ондреаны и Бакра. Молодое поколение может только надеяться на успех."
 nick_defiant_scholar:0 "Непокорный ученый"
 nick_defiant_scholar_desc:0 "Никогда не принимайте уединенный покой за слабость."
 nick_demon_prince_desc:0 "Эзе — тень на краю мира, затягивающая слабых и проклятых в пучину разрушения и отчаяния."
 nick_dervish_tunisia_desc:0 "Загадочный человек, Мирсус — дервиш кружащегося песка и звездного света."
 nick_desperate_vanguard_desc:0 "За некоторые дела стоит сражаться даже в заведомо проигранной битве."
 nick_devil_brahmin_desc:0 "Сундервере подобен темному лотосу, цветущему в реке крови."
 nick_devilmaycare_leader_desc:0 "У Джона есть все достоинства, которых ждут от вождя. Увы, недостатков у него тоже хватает."
 nick_druid_desc:0 "Вымирающая порода, ведущая безуспешную битву с непреодолимыми силами. Но некоторые сражения необходимо вести в любом случае."
 nick_el_halcon:0 "Сокол"
 nick_el_halcon_desc:0 "Мария летает на украденных крыльях над Иберией в поисках короны, которую можно было бы потребовать своими когтями."
 nick_excitable_conspirator_desc:0 "Дёргаясь и ёрзая в тени, она радостно ждёт следующую жертву."
 nick_exemplar_justicar_desc:0 "Нерушимый закон, проявленный во плоти и костях."
 nick_exiled_lovers:0 "Изгнанный любовник"
 nick_exiled_lovers_desc:0 "Что такое княжество по сравнению с любовью? Что такое долг против улыбки любимой? Человек или каинит, Бог создал обоих для любви."
 nick_eyes_of_lazarus_desc:0 "Великий предатель протягивает множество рук. Марго — лишь одна из них."
 nick_faceless_knight:0 "Безликий рыцарь"
 nick_faceless_knight_desc:0 "Хотя его тело деформировано, душа Яузепа остается удивительно чистой, доказывая, что истинное рыцарство требует благородного сердца, а не прекрасного лица."
 nick_fallen_heretic_desc:0 "Оказывается, даже проклятые еретики могут продолжать падать."
 nick_false_father:0 "Лжеотец"
 nick_false_father_desc:0 "Бернат не отличит священное таинство от кабацкой песни, но его красноречия вполне хватает, чтобы высосать досуха нескольких простаков."
 nick_false_minerva:0 "Ложная Минерва"
 nick_false_minerva_desc:0 "Римляне в Британии думали, что она сама Сулис Минерва. Они думали неправильно, но она была рада позволить им обмануть себя."
 nick_false_prophet:0 "Лжепророк"
 nick_false_prophet_desc:0 "За мистическим фасадом скрывается наглый мошенник, который просто выдумывает все на ходу."
 nick_far_from_home_desc:0 "Так далеко от дома — и без пути назад."
 nick_faraway_baron_desc:0 "Далеко от дома, но правит старательно, как будто он был там."
 nick_father_intelligence_desc:0 "Безмолвная, грозная фигура, следящая за игровой доской тысячью незримых глаз."
 nick_first_in_line_desc:0 "Смелая тактика или глупый маневр? Только время покажет."
 nick_first_seeker_desc:0 "Чжуан Цзы был первым, кто сосредоточился на себе, возвещая новый взгляд на своих родственников."
 nick_foolish_regent_desc:0 "Роберто — живой урок того, почему следует выбирать союзников с умом."
 nick_forgotten_prince_desc:0 "Кто?"
 nick_founder_elioud:0 "Основатель Элиуд"
 nick_founder_elioud_desc:0 "Первый Теневой Крестоносец. Возможно, и последний."
 nick_god_eater:0 "Пожиратель богов"
 nick_god_eater_desc:0 "Небесный свет, возможно, парализовал будущую Богиню Момы, но праведная ярость Зверя внутри поглотила ее."
 nick_goldsmith_of_saints_desc:0 "Пьер изготавливает изысканные реликварии для костей мучеников, находя удовлетворение в этом святом служении миру."
 nick_great_grandmother:0 "Прабабушка"
 nick_great_grandmother_desc:0 "Великая дама из семьи Эспозито уже не так бодра, как раньше, но ее трость может быстро вылететь и ударить по голове любого, кто сделал (или даже подумал) что-то глупое в пределах ее досягаемости."
 nick_harlot_priestess:0 "Жрица-блудница"
 nick_harlot_priestess_desc:0 "Приняв своё служение священной блудницы, Евлалия предлагает земное наслаждение и тёмное причастие всем, кто готов её выслушать."
 nick_he_remembers_desc:0 "Разум, который ничего не забывает, опасен."
 nick_healer_mind_desc:0 "Самый безмятежный друг и опекун, о котором только мог мечтать Сородич. Душьянта — это свет, который стоит беречь."
 nick_heir_apparent_desc:0 "Бланш — это искусно выкованный меч, терпеливо покоящийся в ножнах и ожидающий ночи, когда его наконец вытащат."
 nick_heretic_surgeon:0 "Еретик-хирург"
 nick_heretic_surgeon_desc:0 "Джудит, мастер медицинского искусства Монпелье, исследует мёртвых, постигая истину плоти."
 nick_hidden_heretic_desc:0 "За идеально вежливой маской скрывается душа, почерневшая от ереси."
 nick_hidden_viper_desc:0 "Вы не увидите Эймери, пока он не свернется вокруг вас, готовый нанести удар."
 nick_hiding_ancestor_desc:0 "Как долго они смогут по-настоящему прятаться?"
 nick_his_brother_keeper_desc:0 "Хаджар — страж во тьме, прикрывающий спину любимого брата."
 nick_hollow:0 "Опустошённый"
 nick_hollow_desc:0 "Сколько бы проклятых душ он ни поглотил, Агирре никогда не будет удовлетворен."
 nick_humbled_abbot:0 "Смиренный настоятель"
 nick_humbled_abbot_desc:0 "Альберт полагал, что усердие, святые искусства и учёность способны решить любую проблему. С приездом в Британию он убедился в обратном."
 nick_icy_rage_desc:0 "13-летняя Лена бросила вызов старейшинам своего каэрна, когда они отказались прислушаться к ее видениям. Они не совершали одну и ту же ошибку дважды."
 nick_illegitimate_daughter_desc:0 "Огромный интеллект, растраченный в мире людей, Элоиза теперь находит ему хорошее применение в долгой игре Каинитов."
 nick_immortal:0 "Бессмертный"
 nick_immortal_desc:0 "Человек больших убеждений, Джалаир никогда не откажется от своего долга."
 nick_immortal_udul_desc:0 "Нахд, ревностный в миссии и вере, никогда не откажется от долга бессмертного судьи."
 nick_inhumane_scholar_desc:0 "Для Мла Вату этика — лишь необязательный совет."
 nick_iron_glove_desc:0 "Тирания, закутанная в шелковую перчатку, предпочтительнее железного кулака."
 nick_jade_horse_desc:0 "Неутомимый, бесчувственный курьер ночи, несущий с собой слово Сета."
 nick_judge_of_holy_desc:0 "Взвешивание душ святых на весах крови и железа."
 nick_knife_vizir_desc:0 "В то время как другие визири предпочитают слова и золото, чтобы влиять на других, Басам предпочитает более прямой подход."
 nick_knight_north_desc:0 "Принести рыцарство в холодные земли непросто, но это дело достойно усилий."
 nick_knight_prince_desc:0 "Меч и скипетр, работающие в тандеме для надлежащего управления."
 nick_la_blanche_desc:0 "За этой бесчувственной маской скрывается полное отсутствие человечности."
 nick_la_pourpre_desc:0 "Суанхильда облачается в императорские цвета, надеясь скрыть Зверя под ними."
 nick_ladys_knife:0 "Нож его дамы"
 nick_ladys_knife_desc:0 "Он делает все для своей семьи, даже если они его за это презирают."
 nick_late_avenger:0 "Поздний мститель"
 nick_late_avenger_desc:0 "Бертрамус думал, что сможет избежать проклятия своей семьи. Потеря любимой жены заставила его осознать обратное."
 nick_le_confesseur_desc:0 "Исповедь не даёт отпущения грехов. Бог остаётся глух. Чудовище хранит ваши тайны."
 nick_le_noir_desc:0 "Весь свет и радость поглощаются темным ядром Фулка."
 nick_le_saxon_desc:0 "Эорменрик — это ревущий последний отголосок глухих лесов, которые когда-то принадлежали теперь завоеванному народу."
 nick_le_talion_desc:0 "Бертран — жестокое и неумолимое воплощение мести. За каждое оскорбление он требует десятикратной расплаты."
 nick_legacy_preserver_desc:0 "Древние традиции и знания требуют сильных хранителей. Феофил готов быть одним из них."
 nick_lesser_child_desc:0 "У сиров бывают любимчики. Увы, это дитя к ним не относится."
 nick_lioness_of_rome:0 "Львица Рима"
 nick_lioness_of_rome_desc:0 "Искусство соблазнения и наслаждения однажды возвело её на вершину мира. Хитрость поможет ей вернуться туда."
 nick_lone_merchant:0 "Одинокий торговец"
 nick_lone_merchant_desc:0 "Единственное, чего он действительно хочет, — это единственное, что нельзя купить за золото."
 nick_lord_in_waiting_desc:0 "Сколько еще можно ждать?"
 nick_lord_of_ruins_desc:0 "Лучше быть королем пепла, чем никем."
 nick_louve_grise_desc:0 "Руни рыщет по окраинам Франции, считая так называемые цивилизованные дворы всего лишь искусно устроенными загонами для своего скота."
 nick_lurker_crypt_desc:0 "Что может быть лучше для изучения смерти, чем находиться в центре всего этого?"
 nick_mad_khan:0 "Безумный Хан"
 nick_mad_khan_desc:0 "Некоторые мужчины просто хотят увидеть, как мир горит. Бакир – один из них."
 nick_marble_serpent:0 "Мраморный змей"
 nick_marble_serpent_desc:0 "Медуза давно сбросила кожу, покинув Тифона."
 nick_master_ladre_desc:0 "Устойчивый якорь, сохраняющий память о Мечте, пока он ждет своего лидера."
 nick_master_of_fates_desc:0 "Бесчисленные нити судьбы, сплетенные рукой Фасиха, ведут к одному предопределённому завершению."
 nick_master_of_law_desc:0 "Замечательная попытка сохранить Сородичей цивилизованными, но насколько она эффективна?"
 nick_messianic_templar:0 "Мессианский тамплиер"
 nick_messianic_templar_desc:0 "Дюран нашёл призвание во владении оружием, охотно оставив богословские вопросы тем, кто разбирается в них лучше."
 nick_michel_darmand_desc:0 "Никто не сможет проникнуть за маску этой загадочной Розы. Возможно, будет лучше, если они этого не сделают."
 nick_middle_sister_desc:0 "Терпеливая, гордая и непоколебимая в своей вере, Хрисогона — улыбающееся лицо кровавого суда."
 nick_military_heir_desc:0 "Меч полезнее слов, по крайней мере, в их логике."
 nick_mistress_of_vis_desc:0 "Ничто так не говорит о «многообещающем молодом ученике», как добровольное участие в смертельном крестовом походе в суровой земле."
 nick_model_childe_desc:0 "Рядом с навозной кучей Лиссабона расцветает роза. Какой сир остался бы равнодушен к такому расцвету?"
 nick_model_of_virtue_desc:0 "Достигнув абсолютного нравственного совершенства, этот персонаж стал невыносимо скучным собеседником."
 nick_most_wanted_desc:0 "Всегда на шаг впереди клинка палача."
 nick_mouthpiece_desc:0 "Пустой сосуд, повторяющий чужие слова. Всего лишь рот, которым управляют незримые кукловоды."
 nick_najs_khu_still_waters_desc:0 "Гумава – зеркало безмятежных темных вод, отражающее ночное небо."
 nick_night_jarl_desc:0 "Его слово — закон в этой холодной стране. Или он так говорит."
 nick_northern_crusader_desc:0 "непреодолимый холодный порядок королевской власти, призванный навести порядок в более холодных землях."
 nick_older_sister_desc:0 "Первой запустив руки в пепельные останки своего сира, Адриана с тех пор стала надменной исследовательницей кровавых тайн плоти."
 nick_orphaned_heiress_desc:0 "Украшенная золотом расколотого рода, Сакан — хрупкий цветок на свежей могиле своего прародителя."
 nick_otto_dragon:0 "Дракон Отто"
 nick_otto_dragon_desc:0 "Риму нужен был демон, который мог бы сгореть в самый темный час. Райнеро согласился, пожертвовав своим телом."
 nick_pagan_goddess:0 "Языческая богиня"
 nick_pagan_goddess_desc:0 "В Ирландии Версартель некогда почитали как загадочную богиню. Её собственное дитя позаботилось о том, чтобы положить конец этой ереси."
 nick_palace_knight_desc:0 "Некоторые клинки созданы для боя. Некоторые созданы в целях тщеславия."
 nick_paranoid_annoyance_desc:0 "Одно присутствие Ожье способно вывести из себя даже самого подозрительного старейшину."
 nick_pater_patriae:0 "Отец отечества"
 nick_peace_advocate_desc:0 "Голос спокойствия, заглушенный звуками звона стали."
 nick_phantomas:0 "Фантомас"
 nick_phantomas_desc:0 "Наша жизнь — один бал-маскарад."
 nick_pillar_latin_desc:0 "Томмазо поддерживает гордость своих сородичей, даже когда те пируют на костях Константинополя."
 nick_pious_prior_desc:0 "Проклятая Богом, Марго, несмотря ни на что, повторяет святые молитвы с непоколебимой верой."
 nick_poet_cordoba_desc:0 "Раздираемая войной земля нуждается в поэте, чтобы исцелить ее."
 nick_praetor_peregrinus_desc:0 "Железный молоток, разбивающий шеи забытых и презираемых."
 nick_praetor_urbanus:0 "Городской претор"
 nick_princess_in_arms:0 "Вооружённая принцесса"
 nick_princess_in_arms_desc:0 "Земная жизнь Мичиалы, родом из гордой окситанской традиции женщин-рыцарей, трагически оборвалась, когда ее собственная захватывающая дух красота сделала ее объектом роковой одержимости. Став бессмертным мастером клинка, она по-прежнему следует своим рыцарским кодексам в поисках достойного мастера."
 nick_priscus_scholari_desc:0 "Безмолвный хранитель, превращающий в оружие пыльные фолианты древних."
 nick_profesional_gobetween_desc:0 "Надим устроился на перекрёстке, плетя свои сети с благословения окружающих."
 nick_prophet_auch_desc:0 "Фатидикус представляет бредовые, пропитанные кровью видения конца времен. В его проповедях нет спасения."
 nick_proud_graybeard:0 "Гордый Седобородый"
 nick_proud_graybeard_desc:0 "Саймон вправе гордиться своими достижениями. Но гордыня может помешать самому трудному его делу: подготовить преемника."
 nick_purveyor_flesh_desc:0 "Шридхар — монстр в красивых одеждах, торгующий плачущей, дышащей валютой разбитых жизней."
 nick_queen_pedauque_desc:0 "Аустрис скрывает чудовищное лицо за тяжёлыми царственными шелками и милосердно правит своим двором."
 nick_quiet_physician_desc:0 "У настоящего мастера за него говорит его искусство."
 nick_red_serpent:0 "Красный Змей"
 nick_red_serpent_desc:0 "Чешуя Виэллы отмечена витэ её жертв."
 nick_red_sky_desc:0 "Багровые ветры опережают Сарууро, возвещая её приближение."
 nick_redeemed_warrior_desc:0 "Сир Фарика «спас» его от поклонения мстительному Богу, заставив служить Ваалу. По правде говоря, для Фарика мало что изменилось."
 nick_reluctant_adventurer_desc:0 "Она хотела лишь спокойно изучать трупы. Положение любимого дитя сира порой приносит немало неприятностей."
 nick_reluctant_soldier:0 "Воин поневоле"
 nick_reluctant_soldier_desc:0 "Гвилим преданно сражается за своего хозяина, зная, что существуют гораздо худшие монстры."
 nick_resentful_senator_desc:0 "Даже идеалиста может развратить медленное разложение бюрократии, коррупции и предательства."
 nick_returned_crusader_desc:0 "Юон пережил абсолютные ужасы святой земли только для того, чтобы вернуться домой и осознать, что французская политика в каком-то смысле более утомительна."
 nick_revenant_judas:0 "Ревенант Иуда"
 nick_revenant_judas_desc:0 "Верная своим хозяевам-нежити, она будет лгать и убивать без ограничений."
 nick_roar_fenris:0 "Рев Фенриса"
 nick_roar_fenris_desc:0 "Уте слышит зов Фенриса. И, к ее удивлению, это означает единство, а не бессмысленное кровопролитие."
 nick_roguish_wolf:0 "Плутоватый волк"
 nick_roguish_wolf_desc:0 "Эдоардо красив, богат и умеет очаровывать. Как женщине устоять перед таким завидным женихом?"
 nick_saracen_ambassador_desc:0 "Очаровательная улыбка сына купца скрывает один из лучших клинков Аламута."
 nick_scarlet_blade_desc:0 "Каждый взмах оружия Ансегизеля — это еще один удар по контролирующим старейшинам мира."
 nick_scarred_knight:0 "Рыцарь со шрамами"
 nick_scarred_knight_desc:0 "Джереми повидал слишком много за свою службу Инквизиции. Кому он теперь может доверять?"
 nick_scheming_knight_desc:0 "Рыцарские кодексы порой не дают вздохнуть."
 nick_scholar_hills_desc:0 "Уединение — редкая роскошь, но Кристине посчастливилось её себе позволить."
 nick_scholarch_desc:0 "Быть вампиром — не оправдание необразованности."
 nick_scion_stfrancis_desc:0 "Лишенный всякого тщеславия, теперь проповедующий смирение из самых темных уголков земли."
 nick_sees_night_clearly:0 "Ясно видит ночь"
 nick_sees_night_clearly_desc:0 "Абдул хотел жизнь, полную исследований и чудес. Вместо этого ему, возможно, придется стать спасителем."
 nick_serpent_voruta_desc:0 "Свернувшийся глубоко в холодных лесах, готовый нанести удар во имя Сета."
 nick_seven_shadows:0 "Семь теней"
 nick_seven_shadows_desc:0 "Умеренный посредник из «Руки бея» скрывает за своей застенчивой манерой спокойную решимость."
 nick_shadow_lions_desc:0 "Тёмное щупальце тени обвивает самых грозных хищников."
 nick_sharp_overseer_desc:0 "Острый ум и еще более острые глаза."
 nick_shifting_shadow_desc:0 "Всегда в движении, прорываясь сквозь хватку своих врагов."
 nick_sicilian_hound:0 "Сицилийская гончая"
 nick_sicilian_hound_desc:0 "Свирепая гончая, странствующая с не менее свирепой котерией."
 nick_silk_princess_desc:0 "Изучение загадок жизни и смерти требует большого финансирования."
 nick_soft_whispers_desc:0 "Нежный шепот здесь, мягкое прикосновение там, и уже слишком поздно."
 nick_son_bane_slayer_desc:0 "Наследие доблести и чести, проклятое превратиться в наследие вечного безумия."
 nick_southern_ally_desc:0 "Кажется, друзья могут прийти из самых неожиданных мест."
 nick_sower_dark_mother_desc:0 "Всё ради Лилит: больше всех она заслуживает отмщения. Ей проложат путь собственными руками."
 nick_spear_of_the_godly_desc:0 "Фелипе убежден, что он делает дело Божие. К счастью для него, похоже, это связано с большой жестокостью."
 nick_spider_eater_desc:0 "К такому вкусу нужно привыкнуть."
 nick_sponsor_of_arts_desc:0 "Даже проклятое создание ночи может принести в мир немного красоты."
 nick_spotter_breaker:0 "Выслеживающий и сокрушающий"
 nick_spotter_breaker_desc:0 "Dents-qui-Brisent нет равных в выслеживании важных целей для других оборотней. Впрочем, он не прочь разобраться с ними и сам."
 nick_stellar_rose_desc:0 "Прекрасный, нежный цветок в саду Божьем, не испорченный окружающим его злом."
 nick_stjames_convert_desc:0 "Святой путник, вынужденный всегда идти по дороге один."
 nick_strengh_of_set_desc:0 "Змею нужен достойный защитник, и Насир достоин быть им."
 nick_survivor_from_holy_land:0 "Выживший со Святой Земли"
 nick_survivor_from_holy_land_desc:0 "Непреклонный выживший, Раймон носит вечные шрамы Акры как доказательство своего упорства. Теперь он твердо намерен претендовать на Княжество."
 nick_tale_weaver_desc:0 "Хорошая история может стоить больше, чем золото."
 nick_temple_warrior_desc:0 "Божественная ярость усиливает каждый удар Гликона. В нём сила Сета неразрывно сплетается с верой."
 nick_tested_god_desc:0 "Как долго можно выдерживать испытания Всевышнего?"
 nick_teutonic_order_desc:0 "Черный крест на белой ткани. Щит веры или плащ для монстра под ним?"
 nick_the_abbot:0 "Настоятель"
 nick_the_abbot_desc:0 "Даже нежизнь не изменила его призвания. С чего бы ей это делать?"
 nick_the_aedile_desc:0 "Грандиозные фестивали идеально подходят для того, чтобы держать стадо смертных в узде, готовое к убою в любой момент."
 nick_the_axe_desc:0 "В отличие от своих скрытных коллег, Анастасий предпочитает более грубые инструменты и подходы."
 nick_the_black_dragon_desc:0 "Тёмное сердце — и ещё более тёмные крылья."
 nick_the_calligrapher_desc:0 "Переписывая красоту и трагедию на пергаменте, надеясь оставить во тьме наследие благодати."
 nick_the_celt_desc:0 "Синтгунт — яркое напоминание о том, что темные леса и болота были залиты кровью задолго до того, как Рим построил дорогу."
 nick_the_changer:0 "Преобразователь"
 nick_the_changer_desc:0 "Посланник своих балканских старейшин, Кирилл странствует как благочестивый ваятель плоти, верный Каинитской ереси."
 nick_the_clueless_wrath_desc:0 "Бесцельный гнев скорее навредит союзникам, чем врагам."
 nick_the_consigliere_desc:0 "Империи держатся на надежном и тихом совете."
 nick_the_corrupter_desc:0 "Для Эда нет большей радости, чем наблюдать, как чистая душа падает в самые черные ямы. Ему идеально подходят рыцарские розы Франции."
 nick_the_court_historian_desc:0 "Каждое решение двора, хорошее или плохое, записывается в книги Васундхары."
 nick_the_crestias_desc:0 "Офир Аби предлагает теплую духовную чистоту любому, кто прислушается к его мудрости."
 nick_the_devorer_desc:0 "Ужасная судьба для их врагов."
 nick_the_diviner_desc:0 "Странный дар или убийственное проклятие, до сих пор не ясно."
 nick_the_english_turncoat_desc:0 "За вежливой аристократической улыбкой скрывается предатель."
 nick_the_enigma_euphemia:0 "Загадка"
 nick_the_enigma_euphemia_desc:0 "Её имя вычеркнуто из исторических хроник. Потеря любимого Сахара толкнула её на путь, слишком тёмный даже для других Грешников."
 nick_the_estranged_ambassador_desc:0 "Вестник далекого государя, стоящий совершенно один."
 nick_the_fairtroll_desc:0 "Чудовищный повелитель скал, требующий кровавую десятину с островитян в обмен на сдерживание самых жестоких ужасов моря."
 nick_the_fearless_cub_desc:0 "Рев, возможно, пока невелик, но никто не может отрицать его мужество."
 nick_the_feral_desc:0 "Все следы человечности исчезли, и Зверь обрёл полную свободу."
 nick_the_flawless:0 "Безупречный"
 nick_the_flawless_desc:0 "Есть только одна Богиня, и она великолепна."
 nick_the_forgiving_desc:0 "Сострадание и прощение Ротриэля — молчаливое благословение для любого, кто его заслужил."
 nick_the_forsaken_desc:0 "Покинутый всеми без надежды на спасение."
 nick_the_fraud_desc:0 "Будучи ревностным верующим, человек не становится хорошим верующим."
 nick_the_ghost_desc:0 "Вы это видели? Нет, не видели."
 nick_the_green_god:0 "Зеленый Бог"
 nick_the_green_god_desc:0 "Ургахальт находил развлечение в том, что обманом заставил древних кельтских соплеменников поверить в то, что он лесной бог."
 nick_the_guide_desc:0 "Билаал всегда готов привести новообращенных к истине Сета."
 nick_the_hagiographer_desc:0 "Перо может быть источником злой правды или великолепной лжи. Решать может только тот, кто владеет им."
 nick_the_haughty_desc:0 "Высокомерие может быть хорошим качеством, если его подкрепить силой."
 nick_the_honorable_guilherme:0 "Достопочтенный"
 nick_the_honorable_guilherme_desc:0 "Чтобы направлять и защищать, человек ходит с честью. Пусть этот Идеал осветит всех Бруха в самый темный час."
 nick_the_horde_coffers_desc:0 "В конце концов, голодная армия далеко не уйдёт."
 nick_the_idealist:0 "Идеалист"
 nick_the_idealist_desc:0 "По всей Европе поля сражений написали свою историю, ведь реализация Идеала была самым праведным из дел..."
 nick_the_kinslayer_desc:0 "Тяжелый грех в мире смертных. Ожидаемый результат для Каинитов."
 nick_the_luminous_desc:0 "Потрясающий, ослепляющий свет скрывает бездну, ожидающую внизу."
 nick_the_mamluk_desc:0 "Смертоносный клинок, купленный во тьме и заточенный испытаниями."
 nick_the_matador:0 "Матадор"
 nick_the_matador_desc:0 "Освободившись от удушающего поводка, Сезар теперь бродит, опьяненный своей свободой, проверяя границы своей собственной натуры, чтобы выработать личный кодекс поведения."
 nick_the_misruler:0 "Нерадивый правитель"
 nick_the_misruler_desc:0 "Заглушая сожаления блаженством, слабый князь всё же знал: оставшиеся ночи сочтены..."
 nick_the_muwallad_desc:0 "Коман ведет кровавую войну, чтобы сохранить Аль-Андалус. Сможет ли его вера продержаться еще долго?"
 nick_the_necessary_evil_desc:0 "Сокрушительный железный кулак защитит королевство."
 nick_the_new_blood_desc:0 "Уничтожить старое было не просто желанием: это было все, к чему вел ее путь."
 nick_the_nomadic_prince_desc:0 "Царство правителя — это то место, куда он решит пойти дальше."
 nick_the_observer_desc:0 "Ни один праведный поступок или гнусный поступок не ускользнет от их взгляда."
 nick_the_obstinate_prince_desc:0 "Флавий управляет своими владениями мучительной железной хваткой, совершенно отказываясь приспосабливаться, даже когда все вокруг него рушится."
 nick_the_official_poisonoer_desc:0 "Вот уж сомнительная строчка в послужном списке."
 nick_the_paladin:0 "Паладин"
 nick_the_paladin_desc:0 "Ян — образец добродетели в мире тьмы, полный решимости подавать праведный пример безупречного, незапятнанного рыцаря."
 nick_the_penitent_dog_desc:0 "Бессмертная гордость, обмененная на натянутый поводок."
 nick_the_phoenix_desc:0 "Вновь возрождается из пепла."
 nick_the_physician_desc:0 "Исхак усердно работает на операционном столе, спасая другие души, чтобы однажды спасти свою собственную."
 nick_the_pompous_crusader_desc:0 "Его крестовый поход — это просто тщетное и кровавое зрелище."
 nick_the_rash_gallant_desc:0 "Храбрый, но упрямый, которому суждено гореть ярко, но жить недолго."
 nick_the_regent_desc:0 "Верный советник и регент — редкость. Ирмгард принадлежит к этим немногим."
 nick_the_rock_gibraltar_desc:0 "Одинокий титан, защищающий проливы. Мир может сдвинуться и измениться, но Гарун отказывается это делать."
 nick_the_setting_sun_desc:0 "Иоахим — это нежный свет, медленно опускающийся за горизонт, возвещающий беспощадную эпоху."
 nick_the_sewer_goddess_desc:0 "Королева подземной тьмы, лежащей под цивилизацией, ткущая магию из грязи и отбросов."
 nick_the_sharp_tongued_desc:0 "В некотором смысле острее лезвия. Зачастую и более эффективно."
 nick_the_slaughterer_desc:0 "Черепа для Трона Черепов!"
 nick_the_snake_of_eden_desc:0 "Божественное освобождение, предлагаемое через сладкий яд разложения."
 nick_the_solitary_desc:0 "В этом мире уединение дорогого стоит. Факир старается сполна насладиться каждой его минутой."
 nick_the_southerner_desc:0 "Жюдикаэль — это теплый, коварный ветерок, дующий в чертоги севера."
 nick_the_stern_desc:0 "На его холодном лице не появляется ни улыбки, ни эмоций."
 nick_the_strict_desc:0 "Джафари, возможно, не самый добрый человек, но он эффективный наставник."
 nick_the_target_desc:0 "Сиагрий считает, что он всегда находится под прицелом какой-то силы. Это глупость или справедливая осторожность?"
 nick_the_templar_desc:0 "Рыцарь в белой мантии, чью чистоту омрачило Становление. Несмотря на это, Матье верен своему кодексу и стремится стать лучшим, каким только может."
 nick_the_trobairitz:0 "Тробайриц"
 nick_the_trobairitz_desc:0 "Когда-то На Мария была знаменитым благородным бардом окситанских дворов, а теперь рассматривает политику каинитов как прибыльный рынок для продажи своих талантов наемника."
 nick_the_truth_in_the_walls_desc:0 "У этих стен есть глаза и уши."
 nick_the_turncoat_desc:0 "Поступок трусости или высокомерия, никто не сможет угадать мысли предателя. На самом деле это не имеет значения, поскольку на них все равно охотятся."
 nick_the_vanguard_desc:0 "Всегда первым вступает в бой и последним отступает."
 nick_the_warmage_desc:0 "Ходячее оружие Дома Тремер, готовое обратить врагов в пепел."
 nick_the_wonder_maker_desc:0 "Чудеса можно сделать даже из самого маленького материала."
 nick_thee_great:0 "Великий"
 nick_thee_great_desc:0 "Считая современный мир безнадежно скучным, этот ученый обращается к мыслителям античности за истинным вдохновением."
 nick_tireless_protector_desc:0 "Как бы они ни устали, они никогда не согнутся и не сломаются."
 nick_treacherous_daughter_desc:0 "Как долго она сможет продолжать бежать?"
 nick_triumvirat_desc:0 "Одна из голов гидры, правящей Низинными землями с безупречной слаженностью и эффективностью."
 nick_true_survivor_desc:0 "Алексия усовершенствовала самый важный навык, необходимый Сородичу, но сможет ли она продолжать?"
 nick_twice_bound:0 "Дважды связанный"
 nick_twice_bound_desc:0 "Когда первый мастер упал, Колпта просто подполз к ногам другого."
 nick_unlikely_archangel_desc:0 "Никогда не знаешь, когда прибудет спаситель и кем он будет."
 nick_unproven_son_desc:0 "Стремясь проявить себя, такое опрометчивое поведение может его погубить."
 nick_unseen_apprentice:0 "Невидимый ученик"
 nick_unseen_apprentice_desc:0 "Невидимый шпион Тремеров во Франции, Гильем — тихий учёный, о котором никто никогда не удосуживается задуматься."
 nick_unseen_vengeance_desc:0 "Он придет за тобой, когда ты меньше всего этого ожидаешь."
 nick_unwelcome_surprise_desc:0 "То, что это сюрприз, не означает, что это приятно."
 nick_unwilling_servant_desc:0 "Покорно выполняя приказы, ожидая того дня, когда поводок наконец порвется."
 nick_upright_man_desc:0 "Его мир состоит из двух типов людей: хозяев и дураков. Висенте действительно один из них."
 nick_vengeful_apprentice:0 "[Select_CString(CHARACTER.IsFemale, 'Мстительная ученица', 'Мстительный ученик' )]"
 nick_vengeful_apprentice_desc:0 "Иногда ученику приходится бросить перо и взять в руки меч."
 nick_vengeful_warlord_desc:0 "Радован не успокоится, пока кровь его соперников не покроет его оружие."
 nick_vizier_of_verses:0 "Визирь стихов"
 nick_vizier_of_verses_desc:0 "Махдия гарантирует, что искра красоты и знаний никогда не угаснет."
 nick_voice_magaji_desc:0 "Услышать их голос – значит получить абсолютный, неотвратимый приказ от старейшин, которые считают тебя не более чем скотом."
 nick_voz_de_ferro:0 "Железный голос"
 nick_voz_de_ferro_desc:0 "За этими берегами, за пределами тьмы таились возможности... и открытия. Так говорил несгибаемый принц-объединитель будущей Португалии..."
 nick_warrior_heir_desc:0 "Обученный на поле боя, выкованный в идеальный клинок."
 nick_warrior_magus_desc:0 "Миклос — железный кулак крестового похода, сочетающий сталь и колдовство для чистого разрушения."
 nick_warrior_prince_desc:0 "Там, где политика терпит неудачу, зазвенят мечи."
 nick_warrior_queen_desc:0 "Корона, залитая кровью ее врагов, безусловно, является эффективным способом держать вассалов в узде."
 nick_weaver_of_intrigues_desc:0 "Плетение одной-двух схем сохраняет остроту ума."
 nick_whisper_death_desc:0 "Последнее, что вы когда-либо услышите, прежде чем тьма поглотит все."
 nick_wild_claw:0 "Дикого Когтя"
 nick_wild_claw_desc:0 "Бесстрашный в битве с монстрами Вирма, Брон может проиграть битву ближе к дому."
 nick_wild_woman_desc:0 "Для этой одичавшей охотницы человечность — лишь далёкое воспоминание."
 nick_wolf_walker:0 "Идущий среди волков"
 nick_wolf_walker_desc:0 "Ради мести Эрик отважился пройти через леса, полные люпинов. Его воля оказалась крепче плоти."
 nick_wretch_of_venice_desc:0 "Лицо, которое не могла бы полюбить даже мать."
 nick_younger_sister_desc:0 "Евпраксия исполняет волю сестер там, где дипломатия терпит неудачу, вынося приговор сыновьям Хакима."
 nick_zocodover_desc:0 "Шумный город наверху остается в блаженном неведении относительно монстра под его ногами."
