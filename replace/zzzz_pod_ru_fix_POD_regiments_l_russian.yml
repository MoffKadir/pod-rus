l_russian:
 POD_asakku_war_forms:0 "Боевые формы Асакку"
 POD_asakku_war_forms_flavor:0 "#F Гули, созданные не только с помощью ремесла Цимисхи, но и под руководством таинственной сущности. Их формы функциональны в отличие от форм шляхты и созданы для охоты на охотников. Ваяние плоти, с помощью которого они были созданы, восходит к чему-то более древнему, чем Изменчивость.#!"
 altin_cavalry_maa:0 "Алтынские всадники"
 altin_cavalry_maa_flavor:0 "#F Эти всадники и их скакуны, созданные в тесных глубинах Эргенекона, облачены в искусно украшенные доспехи с золотыми прожилками. Пластины доспехов подобны непробиваемой второй коже, они защищают от катайских стрел и клинков.#!"
 animal_simulacra:0 "Звериные симулякры"
 animal_simulacra_flavor:0 "#flavor Стая животных, почти... Созданные с помощью кровавого чародейства, эти симулякры почти неотличимы от настоящих.#!"
 blessed_shomer:0 "Благословенный шомер"
 blessed_shomer_flavor:0 "#F Еврейские шомеры, призванные защищать своих соплеменников, умело прикрывают их в бою.#!"
 blood_thralls_maa:0 "Кровавые трэллы"
 blood_thralls_maa_flavor:0 "#F Ревностные смертные хирдманы, которым их бессмертные повелители даровали силу крови. Эти фанатичные воины бесстрашно сражаются во имя Всеотца.#!"
 geese:0 "Гуси"
 geese_flavor:0 "#F В воздухе или на воде лебедь - воплощение красоты и грации.#!"
 heartbreakers_maa:0 "Сердцееды"
 heartbreakers_maa_flavor:0 "#F Фанатичные лучники, преданные Елене, выпускают стрелы в идеальной синхронности. В их рядах считается честью пригвоздить сердце врага к земле ради забавы Елены.#!"
 knights_santiago_maa:0 "Рыцари Сантьяго"
 knights_santiago_maa_flavor:0 "#F Во имя Сантьяго эти рыцари поклялись изгнать мусульман из Иберии. Этот орден, пользовавшийся большим влиянием как среди знати, так и среди королей, разрешал своим членам вступать в брак, и вскоре на них обратили внимание даже те, кто пребывал в тени...#!"
 maryb_dream_host_maa:0 "Воинство Мечты"
 maryb_dream_host_maa_flavor:0 "#F Каиниты из возрождённой Мечты, окутанные Присутствием и Химерией, кажутся самим воинством небесным; они сияющие, крылатые, устрашающие. Враг видит, как спускаются ангелы с трубами в руках, и строй ломается ещё до того, как копья достигают земли.#!"
 ruck_maa:0 "Толпа"
 ruck_maa_flavor:0 "#F Самые дерзкие из молодых Бруха, эти смутьяны устали выступать против старейшин. Они никогда не уклоняются от драки и редко ищут для этого повод. Пока человек обладает мастерством и ненавистью к знати, любой смертный достоин объятий.#!"
 vigiles_francia_maa:0 "Vigiles Francia"
