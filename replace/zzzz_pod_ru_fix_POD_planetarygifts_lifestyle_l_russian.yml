 BATTLESENSE_PERK_EFFECT:0 "#F Гару может определить наилучшее направление для атаки, принимая во внимание местность поля боя, численность и расположение противника, а также доступные силы под командованием Гару или в союзе с ним. #!"
 DELIBERATE_MISINFORMATION_PERK_EFFECT:0 "#F Гару может вставить в разговор своей цели сбивающую с толку и противоречивую информацию, разрушив ее планы или иным образом заставив ее страдать от серьезного нарушения связи. #!"
 STICKY_FINGERS_PERK_EFFECT:0 "#F Этот трюк покрывает пальцы Гару серебристым веществом, которое прилипает ко всему, что позволяет легко подниматься по вертикальным поверхностям. #!"
 UNDISPUTED_RULER_PERK_EFFECT:0 "#F Этот Дар позволяет Гару взять на себя руководство небольшим собранием людей или группой духов.#!"
