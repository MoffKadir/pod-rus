l_russian:
 GAINED_A_NOBLE_ARTS_LIFESTYLE_PERKPOINT:0 "Получено $VALUE|V0$ очков для открытия [noble_arts_lifestyle|E] пути [perk|E]"
 GAINED_NOBLE_ARTS_LIFESTYLE_XP:0 "Получен опыт $VALUE|V0$ [noble_arts_lifestyle|E]."
 GAINS_A_NOBLE_ARTS_LIFESTYLE_PERKPOINT:0 "Получает $VALUE|V0$ очков для открытия [noble_arts_lifestyle|E] пути [perk|E]"
 GAINS_NOBLE_ARTS_LIFESTYLE_XP:0 "Получает опыт $VALUE|V0$ [noble_arts_lifestyle|E]."
 I_GAINED_A_NOBLE_ARTS_LIFESTYLE_PERKPOINT:0 "Вы получили $VALUE|V0$ очков для открытия [noble_arts_lifestyle|E] пути [perk|E]"
 I_GAINED_NOBLE_ARTS_LIFESTYLE_XP:0 "Вы получили опыт $VALUE|V0$ [noble_arts_lifestyle|E]."
 I_GAIN_A_NOBLE_ARTS_LIFESTYLE_PERKPOINT:0 "Вы получаете $VALUE|V0$ очков для открытия [noble_arts_lifestyle|E] пути [perk|E]"
 I_GAIN_NOBLE_ARTS_LIFESTYLE_XP:0 "Вы получаете опыт $VALUE|V0$ [noble_arts_lifestyle|E]."
 NOBLE_ARTS_APHRODISIA_PERK_EFFECT:0 "$cantrip_standard_bunk$ Цель получает [GetModifier('cantrip_aphrodisia_modifier').GetNameWithTooltip].\nУлучшает [cantrip|E] [GetPerk('noble_arts_flicker_files_perk').GetName(GetPlayer)], снижая затраты Гламура на 1.\n#flavor Это заклятие, особенно любимое мерфолками, сатирами, клуриконами и некоторыми другими фейри, пробуждает всепоглощающий трепет, восхищение и даже желание. Его цель обретает магнетическую притягательность. Если заклятие наложено на человека, каждое его слово и действие завораживает окружающих. Если же Афродизия наложена на предмет, любой, кто его увидит, немедленно захочет им завладеть.#!"
 NOBLE_ARTS_AUTUMN_EYES_PERK_EFFECT:0 "$cantrip_standard_bunk$ Откройте случайный [scheme|E] против целевого персонажа. \n#flavor Наполняя свои глаза Гламуром Осени, Фейри настраивает свои чувства на разложение и гибель. Она может видеть болезни и немощи у окружающих, распознавать слабости и точки стресса объектов или даже распознавать те, которые отмечены какой-то великой или надвигающейся гибелью. #!"
 NOBLE_ARTS_AWAKEN_PERK_EFFECT:0 "$cantrip_standard_bunk$ Отдайте все [counties|E] в [title|E] [GetModifier('cantrip_awaken_title_modifier').GetNameWithTooltip].\n$cantrip_standard_bunk$ Отдайте цели [GetModifier('cantrip_awaken_modifier').GetNameWithTooltip].\n#flavor Новая жизнь, прорастающее семя — в основе весны лежит обещание начала и пробуждения от спячки или сна. Фейри начинает свое путешествие в Искусство Весны, научившись прекращать спячку и стимулировать рост. Фейри сажает семя Гламура, а затем наблюдает, как оно пускает корни и пробуждает фокус колдовства.#!"
 NOBLE_ARTS_BACKWARDS_GLANCE_PERK_EFFECT:0 "Если кто-либо из ваших родственников или друзей будет убит при загадочных обстоятельствах, вы узнаете их убийц. \n#flavor Для начала изучающий магию времени учится смотреть назад во времени. Несмотря на то, что колдовство считается элементарным использованием Хроноса, его полезность делает даже новичков востребованными во фригольдах и пёстрых компаниях. Ши, расследующая исчезновение своего вассала, просматривает прошлое того места, где ее видели в последний раз. Подозрительно относящийся к своей возлюбленной, тролль заглядывает в ее день и видит свидание с ее возлюбленным.#!"
 NOBLE_ARTS_BETWEEN_THE_LINES_PERK_EFFECT:0 "#flavor Проницательность — первый урок магии Именования. Пока Фейри не сможет понять истинное послание во всем сказанном или написанном, она не сможет понять сокровенное знание, скрытое в Истинных Именах. Обманчиво мощный, «Между строк» позволяет китэйну понимать любой язык или узнавать предполагаемый смысл всего, что он видит или слышит.#!"
 NOBLE_ARTS_BURNING_CHEW_PERK_EFFECT:0 "$unlock_forging_node$ Добавить [GetModifier('artifact_prowess_2_modifier').GetNameWithTooltip].\n$cantrip_standard_bunk$ Дать цели [GetModifier('cantrip_burning_chew_modifier').GetNameWithTooltip].\n$passive_cantrip_actor$ Дать [GetModifier('cantrip_burning_chew_modifier').GetNameWithTooltip] союзным [knights|E], если вы выступаете как [commander|E] в [combat_phase|E], или себе в [single_combat_duel_plural|E].\n$countermeasures_unlocks_t1_supernatural_high_alert$\n#flavor Это заклятие наполняет цель пламенной мощью легенд, даруя ей огромную силу и способность к разрушению. Для глаз фей цель слабо окутана золотой аурой, которая поднимается и мерцает, словно пламя.#!"
 NOBLE_ARTS_CASTIGATE_PERK_EFFECT:0 "Улучшает заклятие [cantrip|E] [GetPerk('noble_arts_done_deal_perk').GetName(GetPlayer)]: цель получает [weak_hook|E] на вас вместо [strong_hook|E].\n#flavor Фея не только узнаёт о нарушении освящённой ею клятвы, но и может сама покарать клятвопреступника в дополнение к обычному наказанию за нарушение Договора.#!"
 NOBLE_ARTS_CASUAL_CONTRACT_PERK_EFFECT:0 "Улучшает [GetPerk('noble_arts_done_deal_perk').GetName(GetPlayer)] [cantrip|E], позволяя использовать его против любой цели в одном и том же месте. \n#flavor Это устрашающее заклинание дает Фейри власть над даже самыми случайными соглашениями, позволяя ей освятить неосторожные обязательства («конечно, я буду там»), праздное хвастовство («если эта красная шапка ступит в этот бар, я сразу выпорю его и всю его пеструю толпу») и даже саркастические возражения («о, конечно, я поддержу герцога Дрея, ведь я люблю дворян так же сильно, как и я»). #!"
 NOBLE_ARTS_CHILL_PERK_EFFECT:0 "$passive_cantrip_fae$ Вражеские [knights|E] получают [GetModifier('cantrip_chill_modifier').GetNameWithTooltip], если вы выступаете как [commander|E] во время [Concept('combat_phase', 'фазы сражения')|E]; в [Concept('single_combat_duel_plural', 'поединках')|E] этот эффект получает ваш противник.\n[PODUnlocksCombatMove('POD_combat_move_fae_winter_chill')].\n#flavor Первое и самое безобидное применение магии Зимы позволяет фейри за короткое время значительно понизить температуру цели. Живому существу холод не причиняет ран или повреждений, но растения могут увянуть, а предметы — разрушиться. Достаточно китэйну видеть цель заклятия, чтобы окутать её глубоким, неприятным холодом.#!"
 NOBLE_ARTS_CONFOUNDING_COILS_PERK_EFFECT:0 "$unlock_forging_node$ Добавить [GetModifier('artifact_soak_2_modifier').GetNameWithTooltip].\n$cantrip_standard_bunk$ Дать цели [GetModifier('cantrip_confounding_coils_modifier').GetNameWithTooltip].\n$passive_cantrip_actor$ Дать [GetModifier('cantrip_confounding_coils_modifier').GetNameWithTooltip] союзным [knights|E], если вы выступаете как [commander|E] в [combat_phase|E], или себе в [single_combat_duel_plural|E].\n$countermeasures_unlocks_t2_supernatural_high_alert$\n#flavor Ши танцует на поле боя, повергая врагов и оставаясь нетронутой даже пролитой ею кровью. Цель заклятия обретает грацию извивающейся змеи. Её движения становятся плавными, почти гипнотическими, позволяя легко избегать вреда. Даже неживой предмет под действием этого заклятия будто извивается и смещается, сбивая попытки ударить по нему.#!"
 NOBLE_ARTS_CREEPING_SHADOWS_PERK_EFFECT:0 "$countermeasures_unlocks_t1_obfuscated_court$.\n#flavor Фейри приказывает близлежащим теням подчиниться ее прихоти. Сатир вызывает тень сопротивляющегося партнера, чтобы тот танцевал с ней. Слуа превращает ночные тени спальни хулигана в театр угрозы. Это Искусство можно использовать тонко, скручивая или слегка манипулируя тенями, чтобы придать сцене зловещий вид, или его можно использовать для того, чтобы превратить тени в огромные злобные существа, совершенно не связанные с действиями тех, кто их отбрасывает, или даже для того, чтобы проглотить Фейри (или другого человека) и скрыть объект из поля зрения. #!"
 NOBLE_ARTS_DEJA_VU_PERK_EFFECT:0 "$cantrip_standard_bunk$ Дайте цели [GetModifier('cantrip_deja_vu_modifier').GetNameWithTooltip].\n#flavor Помимо манипулирования временным восприятием и остановки потока времени вокруг цели, Фейри затем учится заново переживать недавний момент и заново переживать настоящее, вооружившись знаниями о будущем. По мере того, как время движется вперед, возможности ветвления делают любое долгосрочное применение колдовства бесполезным, но на несколько минут адепт Хроноса становится путешественником во времени. Обладая такой неоспоримой силой, Фейри также принимают на себя риск оказаться в замешательстве перед возможным будущим. Повторное использование дежавю в одной и той же сцене становится все труднее, поскольку нити судьбы запутываются.#!"
 NOBLE_ARTS_DICTUM_PERK_EFFECT:0 "Улучшает [GetPerk('noble_arts_protocol_perk').GetName(GetPlayer)] [cantrip|E], присваивая [perpetual_hook|E] вместо [weak_hook|E].\n[PODUnlocksCombatMove('POD_combat_move_fae_sovereign_dictum')].\n#flavor Звания и статуса часто достаточно, чтобы заставить окружающих Фейри выполнять ее приказы. Когда атрибутов благородства недостаточно, Диктум служит безошибочным напоминанием о том, кто главный. Фейри произносит заговор, а затем дает цели простую команду, которую она должна выполнить. Цель Диктума может противостоять приказу, но у большинства из них нет воли, и они становятся, по крайней мере, временными слугами Фейри.#!"
 NOBLE_ARTS_DONE_DEAL_PERK_EFFECT:0 "$cantrip_standard_bunk$ Даёт цели [strong_hook|E] на вас в обмен на выполнение конкретного задания: объявить войну, дать золото, начать происки убийства или явиться ко двору. Мнение цели о вас должно быть не ниже #V 50#!.\n#flavor Это могущественное заклятие позволяет фее заключать обязывающие клятвы с другими или освящать клятвы, свидетелем которых она выступает. Нарушителей соглашений и договоров, скреплённых Гламуром, наказывают сами силы Грёзы.#!"
 NOBLE_ARTS_DRAGONSCALES_PERK_EFFECT:0 "$cantrip_standard_bunk$ #underline;TOOLTIP:NOBLE_ARTS_DRAGONSCALES_PERK_EFFECT_TT @warning_icon!#! Отдайте цель [GetModifier('cantrip_dragonscales_modifier').GetNameWithTooltip].\n$passive_cantrip_actor$ #underline;TOOLTIP:NOBLE_ARTS_DRAGONSCALES_PERK_EFFECT_TT2 @warning_icon!#! Отдайте [GetModifier('cantrip_dragonscales_modifier').GetNameWithTooltip] союзнику [knights|E], действуя в роли [commander|E] во время [combat_phase|E], или себе во время [single_combat_duel_plural|E].\n$countermeasures_unlocks_t3_supernatural_high_alert$\n[PODUnlocksCombatMove('POD_combat_move_fae_dragons_ire_dragonscales')].\n#flavor Фейри наделяет своего объекта мистической прочностью драконьей шкуры. Тем, кто способен видеть сквозь Туман, кажется, что объект мерцает в теплой дымке, а его кожа или поверхность блестят под прямыми лучами света. #!"
 NOBLE_ARTS_DRAGONSCALES_PERK_EFFECT_TT:0 "Это заменяет [cantrip|E] [GetPerk('noble_arts_burning_chew_perk').GetName(GetPlayer)] и [GetPerk('noble_arts_confounding_coils_perk').GetName(GetPlayer)]."
 NOBLE_ARTS_DRAGONSCALES_PERK_EFFECT_TT2:0 "Это заменяет [passive_cantrip|E] [GetPerk('noble_arts_burning_chew_perk').GetName(GetPlayer)] и [GetPerk('noble_arts_confounding_coils_perk').GetName(GetPlayer)]."
 NOBLE_ARTS_EFFECT_AND_CAUSE_PERK_EFFECT:0 "$passive_cantrip_fae$ Дайте [GetModifier('cantrip_effect_and_cause_modifier').GetNameWithTooltip] врагу [knights|E], когда вы действуете в роли [commander|E] во время [combat_phase|E], или своему противнику во время [single_combat_duel_plural|E].\n[PODUnlocksCombatMove('POD_combat_move_fae_chronos_effect_and_cause')].\n#flavor Первый трюк, связанный с искажением времени, Следствием и Причиной, рассеивает нормальное течение времени для цели колдовство. Звук разбивающегося стекла мог предшествовать падению стакана на землю, или рана могла появиться до того, как приземлился меч.#!"
 NOBLE_ARTS_ENKINDLE_PERK_EFFECT:0 "$passive_cantrip_fae$ Отдайте [GetModifier('cantrip_enkindle_modifier').GetNameWithTooltip] врагу [knights|E], действуя в роли [commander|E] во время [combat_phase|E].\n[PODUnlocksCombatMove('POD_combat_move_fae_summer_enkindle')].\n#flavor Хулиган дрожит в темноте, а слуа превращает это напряжение в вопящий ужас. Шутка Пуки не вызывает ничего, кроме смеха – пока она не вкладывает в реакцию аудитории немного волшебства, наполняя комнату беспомощным смехом. Выпуская дыхание Гламура, Фейри раздувают пламя страсти до ревущей и маниакальной высоты. Любые эмоции, которые человек испытывает при зачаровании Возгорание, резко усиливаются: раздражение становится кипящим негодованием, гнев становится полномасштабной яростью, печаль углубляется в душераздирающую печаль, счастье превращается в скачущую радость, а любовь становится всепоглощающей страстью. Если он направлен на объект, то любые эмоции, которые этот объект вызывает у тех, кто с ним взаимодействует, также обостряются. #!"
 NOBLE_ARTS_FAERIE_RING_PERK_EFFECT:0 "[PODUnlocksCombatMove('POD_combat_move_fae_spring_faerie_ring')].\n#flavor Человеческие легенды рассказывают о кругах из грибов, полевых цветов или камней, известных как кольца фейри — опасных местах для смертных, потому что фейри, живущие и танцующие в кольцах, могут похитить или проклясть любого нарушителя. В фольклоре есть зерно истины. Кольцо Фейри — это весенний заговор, который позволяет Фейри создать круг, обеспечивающий защиту и укрытие от любых посторонних, что влечет за собой серьезные последствия для любого, кто вторгнется.#!"
 NOBLE_ARTS_FLICKER_FILES_PERK_EFFECT:0 "$cantrip_standard_bunk$ Призовите цель на свой [court|E].\n#flavor Этот заговор вызывает яркие, танцующие точки цветного света из субстанции Грёз. Мерцающие мухи не только освещают пространство вокруг себя, но и их мягко пульсирующие цвета вызывают тонкий резонанс эмоций по выбору Фейри у тех, кто их видит. И мерцающие мухи, и излучаемый ими свет невидимы для обычных существ, однако смертные, затронутые их светом, все равно реагируют на их эмоциональный резонанс.#!"
 NOBLE_ARTS_GEAS_PERK_EFFECT:0 "Улучшает [GetPerk('noble_arts_dictum_perk').GetName(GetPlayer)] [cantrip|E], давая [strong_hook|E] вместо [perpetual_hook|E]. \n#flavor Сказки о заданиях, данных героям и злодеям, изгнанным в изгнание, населяют фольклор, и бывшие обитатели Грезы воплощают эти истории в реальность благодаря мастерству Властелина. Геас превращает Гламур в директиву, похожую на клятву или контракт, но без обычно требуемой взаимности. Фейри привязывает цель к директиве или запрету вместе с сопутствующим проклятием, если она не сможет выполнить указ.#!"
 NOBLE_ARTS_GRANDEUR_PERK_EFFECT:0 "$passive_cantrip_fae$ Увеличение приема [peace|E] #P +10#!.\n$passive_cantrip_fae$ Увеличение приема приглашений [court|E] с помощью #P +20#!.\n[PODUnlocksCombatMove('POD_combat_move_fae_sovereign_grandeur')].\n#flavor С помощью простого волшебство, Фейри воплощает Величие, присущее всем детям Аркадии, заставляя окружающих требовать внимания и избегать конфликтов. Каждый, кто находится под влиянием колдовства, смотрит на Фейри как на лидера, спасителя или королевскую особу. Возможно, на самом деле она не обладает уравновешенностью и грацией, приписываемыми королям и королевам прошлого, но Величие представляет собой удобную замену настоящей вещи.#!"
 NOBLE_ARTS_GUEST_LIST_PERK_EFFECT:0 "#flavor Использование этого заклинания не позволяет кому-либо или чему-либо войти, использовать или взаимодействовать с целью заклинания без разрешения заклинателя. Фейри может установить пароль, состоящий из фразы или действия, который добавляет субъекта в «список» и дает ему доступ к фокусу колдовства.#!"
 NOBLE_ARTS_HARDENED_HEART_PERK_EFFECT:0 "Стать невосприимчивым к враждебному ментальному [character_interaction|E].\n$countermeasures_unlocks_t3_mental_fortress$\n#flavor Зима не тоскует по заблудившемуся путнику, замерзающему в снегу. Зима не защищает добычу, выслеженную волками или попавшую в ловушку охотника. Подключаясь к самому сердцу холода, адепты Зимы заглушают эмоции и изолируют фокус своего колдовства от манипуляций и влияния. Цель становится неспособной проявить свою страсть и волю, а это значительная цена за сопротивление даже самым сильным манипуляциям.#!"
 NOBLE_ARTS_HOLY_STRIKE_PERK_EFFECT:0 "$cantrip_hard_bunk$ Нанести цели [EmptyScope.ScriptValue('noble_arts_holy_strike_interaction_damage')] [POD_aggravated_damage_with_box|E].\n$passive_cantrip_fae$ Нанести [EmptyScope.ScriptValue('noble_arts_holy_strike_perk_damage')] [POD_superficial_damage_with_box|E] вражеским [knights|E], если вы выступаете как [commander|E] в [combat_phase|E], или противнику в [single_combat_duel_plural|E].\n[PODUnlocksCombatMove('POD_combat_move_fae_dragons_ire_holy_strike')].\n#flavor Названное в честь растения легендарных воинов, это заклятие чистого разрушения принимает облик, соответствующий природе применяющей его феи. Это всегда выброс таинственной силы: холодная волна губительной тьмы, изумрудная вспышка, раскалывающая цель на куски, или ревущий поток драконьего пламени.#!"
 NOBLE_ARTS_LIARS_BELL_PERK_EFFECT:0 "$passive_cantrip_actor$ [characters|E], на котором у вас есть [hook|E], не может присоединиться к [schemes|E] или [factions|E] против вас. \n$passive_cantrip_actor$ Ваш [councillors|E] не может присоединиться к [schemes|E] или [factions|E] против вас. \n#flavor По мере того, как мастерство Фейри над Контрактами растет, она становится очень чувствительным к нарушениям установленного ею связывающего Гламура. Она мгновенно осознает, когда кто-то нарушил договор, который она освятила — она не обязательно знает, где и почему, но она знает, кто и когда. Более того, ей становится легко использовать Искусство Гламура в поисках клятвопреступника.#!"
 NOBLE_ARTS_LIFESTYLE_PERK_POINTS_TRIGGER:0 "Очки достоинств пути благородных искусств: $NUM|V0$"
 NOBLE_ARTS_LIFESTYLE_XP_TRIGGER:0 "Опыт пути благородных искусств: $NUM|V0$"
 NOBLE_ARTS_MANNIKIN_INABILITY:0 "@warning_icon!#X [GetTrait('mannikin').GetName(GetPlayer)] не могут изучать Искусства выше 3-го уровня! #!"
 NOBLE_ARTS_NICKNAMES_PERK_EFFECT:0 "$cantrip_easy_bunk$ Заставьте цель потерять 500 [prestige|E] и получить 25 [stress|E].\n#flavor Прежде чем Фейри разовьет талант и проницательность, необходимые для раскрытия Истинных Имен, она учится навешивать более поверхностные ярлыки на что-то или кого-то. Эффект со временем тускнеет, но личность цели искажается и подчиняется прозвищу, данному Фейри. Пока колдовство остается на месте, все вокруг цели заклятия видят её через призму Прозвища.#!"
 NOBLE_ARTS_PROTOCOL_PERK_EFFECT:0 "$cantrip_standard_bunk$ Получите [weak_hook|E] на цель. \n#flavor Правила китэйн придворных отношений часто загадочны, а иногда и непостижимы. Первое заклятие, которому научили китэйна, изучающего Правление, применяет этот этикет практически к любой ситуации. Любой, кто попадает под действие Протокола, становится связанным правилами приличия китейн и страдает от последствий нарушения этих правил, даже непреднамеренного.#!"
 NOBLE_ARTS_RENEWAL_PERK_EFFECT:0 "$cantrip_hard_bunk$ Воскресить $POD_splat_wraith$ как $POD_splat_mortal$.\n$cantrip_hard_bunk$ Отдать все [counties|E] в [title|E] [GetModifier('cantrip_renewal_modifier').GetNameWithTooltip].\n$cantrip_hard_bunk$ Полностью восстановить [artifact|E] [durability|E].\n#flavor Каждый год весна совершает настоящее чудо, оттаивая почву и возрождая жизнь в ландшафте, временно ставшим бесплодным из-за зимы. Мастера весенней магии подключаются к циклу смерти и возрождения, чтобы временно даровать жизнь всему инертному или мертвому. Однако вскоре после этого круг замыкается, поскольку Гламур поддерживает воскрешение лишь несколько драгоценных мгновений.#!"
 NOBLE_ARTS_REWEAVING_PERK_EFFECT:0 "$cantrip_hard_bunk$ Свободно меняйте личность, здоровье, стресс и физическое состояние [traits|E] цели, которую вы знаете [Glossary('Истинное имя','podgloss.truename')].\n#flavor После изучения Истинного имени субъекта мастер Именования может переписать это имя, фундаментально изменив цель. Благой может стать Неблагим, Наследие может быть изменено и т. д. Даже места могут быть изменены, а их цель или структура переопределена. #!"
 NOBLE_ARTS_RUNIC_IMPRINT_PERK_EFFECT:0 "$unlock_forging_node$ Добавьте 2 [modifiers|E] в зависимости от типа [artifact|E]. \n$cantrip_standard_bunk$ Укажите цель [GetModifier('cantrip_runic_imprint_survival_modifier').GetNameWithTooltip].\n$cantrip_standard_bunk$ Укажите цель [GetModifier('cantrip_runic_imprint_scholar_modifier').GetNameWithTooltip].\n$cantrip_standard_bunk$ Укажите цель [GetModifier('cantrip_runic_imprint_ruler_modifier').GetNameWithTooltip]).\n[PODUnlocksCombatMove('POD_combat_move_fae_naming_runic_imprint')].\n#flavor Научившись видеть истинную природу всего вокруг себя, Фейри теперь становится сведущей в древнем языке рун и в том, как применять их для усиления своих союзников или ослабления врагов. Заговор «Рунический отпечаток» всегда включает в себя письмо или физическое движение для формирования руны на цели или рядом с ней. После этого Фейри может формировать основные атрибуты фокуса колдовства по своему усмотрению.#!"
 NOBLE_ARTS_SAINING_PERK_EFFECT:0 "Может использовать «Изучение Истинного Имени» [journey|E].\nМожет выучить [Glossary('Истинные имена','podgloss.truename')] из [traits|E].\n#flavor Способность различать Истинные Имена — это сердце магии Именования. Как только Фейри сможет обозначить внутреннюю природу субъекта, она получит глубокое понимание того, кем или чем он является, а также способность применять против него любую магию с небольшим сопротивлением. Власть, которую мистик Именования получает над кем-то, на первый взгляд может показаться полезной, но лояльность меняется, друзья становятся врагами, и ничто не остается секретом навсегда. #!"
 NOBLE_ARTS_SANCTIFIED_WORDS_PERK_EFFECT:0 "$passive_cantrip_actor$ Дайте [GetModifier('cantrip_sanctified_words_modifier').GetNameWithTooltip] союзнику [knights|E], когда вы действуете в роли [commander|E] во время [combat_phase|E], или себе во время [single_combat_duel_plural|E].\n[PODUnlocksCombatMove('POD_combat_move_fae_contract_sanctified_words')].\n#flavor Этот удивительный заговор позволяет Фейри вплетать дополнительный Гламур в контракт, предоставляя мощные благословения тем, кто связан им. это. Силу Освященных слов можно использовать только для помощи в выполнении контракта, но некоторые клятвы действительно могут быть очень широкими («Клянусь защищать герцога ценой своей жизни»). #!"
 NOBLE_ARTS_SCULPT_PERK_EFFECT:0 "$passive_cantrip_fae$ Вражеские [knights|E] получают [EmptyScope.ScriptValue('noble_arts_sculpt_perk_damage')] [POD_superficial_damage_with_box|E], если вы выступаете как [commander|E] во время [Concept('combat_phase', 'фазы сражения')|E]; в [Concept('single_combat_duel_plural', 'поединках')|E] этот урон получает ваш противник.\n[PODUnlocksCombatMove('POD_combat_move_fae_winter_ice_shackles')].\n#flavor Освоив простейшее призывание холода, фейри создаёт лёд при помощи Гламура и придаёт ему нужную форму. Это творение невозможно принять за что-либо иное: на ощупь оно обжигающе холодное. Однако ледяная скульптура не тает, пока на неё не воздействует магическое тепло или пламя.#!"
 NOBLE_ARTS_SET_IN_STONE_PERK_EFFECT:0 "$cantrip_standard_bunk$ Сделайте [artifact|E] нерушимым и добавьте [GetModifier('cantrip_set_in_stone_modifier').GetNameWithTooltip].\nВаши питомцы больше не могут умереть от старости. \n#flavor Незначительные манипуляции с течением времени предшествуют тому, как китэйн учится перекрывать реку и временно останавливать само время. Применение Высечено в камне к цели предотвращает обычные эффекты старения и воздействия внешнего мира, но не предотвращает обычные взаимодействия или преднамеренное разрушение цели. Время больше не оказывает на цель прежнего эффекта, препятствуя росту, старению, ухудшению, а иногда и прогрессу. Погодные условия могут оставаться неизменными в течение нескольких недель, а еда будет оставаться спелой и съедобной бесконечно. Заговор не предотвращает умышленный вред или повреждение, а это означает, что меч китэйна, возможно, никогда не потребует обслуживания, но все равно будет получать повреждения при ударе молотком.#!"
 NOBLE_ARTS_SHIVERS_PERK_EFFECT:0 "$cantrip_standard_bunk$ Дайте цели #V 100#! [stress|E] (50, если [GetTrait('brave').GetName(GetPlayer)] и 150, если [GetTrait('craven').GetName(GetPlayer)]).\n$cantrip_standard_bunk$ Дайте артефакту [modifier|E], уменьшающий выбранный [skill|E] на 1. Каждый [skill|E] [modifier|E] может применяется только один раз на каждый артефакт.\n#flavor Фейри вытягивает свои собственные мечты о смерти и тьме и передает их цели. Проклятый таким образом человек или предмет становится маяком для призраков и некоторое время после этого терпит внимание беспокойных мертвецов.#!"
 NOBLE_ARTS_STASIS_PERK_EFFECT:0 "$passive_cantrip_fae$ Заставляет двух вражеских [Concept('knights', 'рыцарей')|E] с наивысшей [Concept('prowess', 'доблестью')|E] покинуть бой, если вы выступаете как [commander|E] во время [Concept('combat_phase', 'фазы сражения')|E] и они не защищены от ментальных способностей.\n$cantrip_exceptional_bunk$ Погружает цель в [GetTrait('torpor').GetName(GetPlayer)].\n#flavor Последнее заклятие, доступное мастерам Зимы, позволяет фейри надолго заточить цель в магический лёд. Цель сохраняется в неизменном виде, но остаётся неподвижной и, если это возможно, без сознания. Предметы и существа в стазисе не стареют, не разлагаются, не ломаются и не меняются: на время действия заклятия они застывают во времени. Разрушить ледяные оковы может лишь могущественная магия — например, искусство мастера Пламени или Весны.#!"
 NOBLE_ARTS_TERROR_OF_THE_LONG_NIGHT_PERK_EFFECT:0 "$passive_cantrip_fae$ Заставляет всех вражеских [knights|E] со свойством [GetTrait('craven').GetName(GetNullCharacter)] покинуть бой, если вы выступаете как [commander|E] во время [Concept('combat_phase', 'фазы сражения')|E].\n[PODUnlocksCombatMove('POD_combat_move_fae_winter_terror_long_night')].\n#flavor Настоящая зима гасит свет и поглощает тепло. Даже самые храбрые, оставшись в одиночестве на холоде перед бесконечной ледяной тьмой, испытывают глубокий страх за само своё существование. Рыцарь-слуа заставляет врага отступить на глазах у всего двора. Заклятие пуки обращает в бегство её смертных сообщников, оставляя ей всю украденную добычу. Нокер, крадущийся через задние дворы, чтобы скрыться от даунтэйна, заставляет местных немецких овчарок в страхе забиться в будки.#!"
 NOBLE_ARTS_THE_BELTANE_BLADE_PERK_EFFECT:0 "#V $glamour_quests_name$#! Скорость [journey|E]: #P +100%#!\n[PODUnlocksCombatMove('POD_combat_move_fae_summer_beltane_blade')].\n#flavor Фейри делает жест, и скверна Банальности внутри цели вспыхивает ослепительным, разрушительным красно-золотым пламенем. Некогда это заклятие было великим сияющим мечом Лета, изгонявшим смертных и скверну обыденности из тайных фригольдов и сокрытых стран фейри. Теперь, когда Банальность захлестнула Осенний мир, заклятие всё ещё остаётся грозным оружием, но даже его яростного жара кажется отчаянно недостаточно, чтобы сдержать надвигающуюся Зиму.#!"
 NOBLE_ARTS_THE_POISONED_APPLE_PERK_EFFECT:0 "$cantrip_standard_bunk$ Дать цели случайную болезнь [trait|E].\n$cantrip_standard_bunk$ Уменьшить [durability|E] артефакта на #V 20#!.\n$passive_cantrip_fae$ Передать [GetModifier('cantrip_the_poisoned_apple_modifier').GetNameWithTooltip] врагу [knights|E], действуя как [commander|E] во время [combat_phase|E] или вашему врагу во время [single_combat_duel_plural|E].\n[PODUnlocksCombatMove('POD_combat_move_fae_autumn_poisoned_apple')].\n#flavor Этот ужасный трюк дал поколениям смертных достаточно оснований опасаться как даров, так и гнева прекрасного народа. Конденсируя свой гнев в смертоносный поток Гламура, направленный на что-то на расстоянии вытянутой руки, Фейри отравляет своего объекта.#!"
 NOBLE_ARTS_THE_WITHERING_PERK_EFFECT:0 "Улучшает [GetPerk('noble_arts_the_poisoned_apple_perk').GetName(GetPlayer)] [character|E] [cantrip|E], также давая [GetModifier('cantrip_the_withering_modifier').GetNameWithTooltip].\nУлучшает [GetPerk('noble_arts_the_poisoned_apple_perk').GetName(GetPlayer)] [artifact|E] [cantrip|E], уменьшая [durability|E] на #V 40#! вместо этого.\nImprove [GetPerk('noble_arts_the_poisoned_apple_perk').GetName(GetPlayer)] [passive_cantrip|E], отдав вместо этого [GetModifier('cantrip_the_withering_knight_modifier').GetNameWithTooltip].\n[PODUnlocksCombatMove('POD_combat_move_fae_autumn_withering')].\n#flavor Злобным жестом Фейри крадет жизненные силы цели, оставляя лишь видимость старения и разложения.#!"
 NOBLE_ARTS_TIME_DILATION_PERK_EFFECT:0 "$cantrip_hard_bunk$ Состарить цель на #V 25#! лет.\n$passive_cantrip_fae$ Дать [GetModifier('cantrip_time_dilation_modifier').GetNameWithTooltip] вражеским [knights|E], если вы выступаете как [commander|E] в [combat_phase|E], или противнику в [single_combat_duel_plural|E].\n[PODUnlocksCombatMove('POD_combat_move_fae_chronos_time_dilation')].\n#flavor Именно это заклятие породило легенды о Рипе ван Винкле. Оно переносит цель вперёд во времени и нарушает её связь с остальным миром. Цель стареет и испытывает обычные последствия течения времени, тогда как окружающий мир едва меняется.#!"
 NOBLE_ARTS_TRIPPING_THE_IRE_PERK_EFFECT:0 "$cantrip_standard_bunk$ Дайте цели [GetModifier('cantrip_tripping_the_ire_modifier').GetNameWithTooltip].\n$passive_cantrip_actor$ Дайте [GetModifier('cantrip_tripping_the_ire_modifier').GetNameWithTooltip] союзнику [knights|E], если вы действуете как [commander|E] во время [combat_phase|E], или себе во время [single_combat_duel_plural|E].\n$countermeasures_unlocks_t4_supernatural_high_alert$\n#flavor Фейри призывает боевую мудрость бесчисленных воинов из аркадских легенд обитать в своем подданном, позволяя устрашающему боевому танцу, над которым не может надеяться ни один враг.#!"
 NOBLE_ARTS_VERDANT_RECLAMATION_PERK_EFFECT:0 "Улучшает [GetPerk('noble_arts_awaken_perk').GetName(GetPlayer)] [title|E] [cantrip|E], давая вместо него [GetModifier('cantrip_verdant_reclamation_title_modifier').GetNameWithTooltip]. \n Улучшает [GetPerk('noble_arts_awaken_perk').GetName(GetPlayer)] [character|E] [cantrip|E], давая вместо него [GetModifier('cantrip_verdant_reclamation_modifier').GetNameWithTooltip]. \n#flavor Все вещи из земли, и в землю все вернется. Если дать достаточно времени, природа все исправит, и, приложив немного Гламура, Фейри, применяя заклинание «Зеленое восстановление», может ускорить этот процесс. Растения и листва, покрывающие цель, служат для демонстрации силы и для отвлечения внимания, продолжают расти и подавлять на протяжении всей сцены. #!"
 NOBLE_ARTS_VESTAS_BLESSING_PERK_EFFECT:0 "$passive_cantrip_actor$ Союзные [knights|E] получают [GetModifier('cantrip_vestas_blessing_modifier').GetNameWithTooltip], если вы выступаете как [commander|E] во время [Concept('combat_phase', 'фазы сражения')|E]; в [Concept('single_combat_duel_plural', 'поединках')|E] этот эффект получаете вы.\n#flavor Домашний очаг символизирует безопасность и гостеприимство. Благословение Весты позволяет фейри создать домашний уют везде, где можно устроить укрытие или развести огонь. Гламур становится стражем и инстинктивно предупреждает о любом вторжении — это особенно полезно путешественникам и тем, кого преследуют. Кроме того, любой приглашённый в освящённое пространство чувствует прилив сил и молодости.#!"
 NOBLE_ARTS_WELL_OF_LIFE_PERK_EFFECT:0 "$passive_cantrip_actor$ Исцелите [EmptyScope.ScriptValue('POD_base_heal_value')] [POD_superficial_damage_with_box|E] союзного [knights|E], действуя в роли [commander|E] во время [combat_phase|E], или себя во время [single_combat_duel_plural|E].\n$cantrip_standard_bunk$ Исцелите [EmptyScope.ScriptValue('POD_spring_interaction_superficial_heal_value')] [POD_superficial_damage_with_box|E] из target.\n[PODUnlocksCombatMove('POD_combat_move_fae_spring_well_of_life')].\n#flavor Легенды о живой воде, мистическом колодце или эликсире, исцеляющем раны или дарующем вечную жизнь, появляются в большинстве культур на протяжении веков. Этот заговор Весны не обращает вспять старение и не дарует бессмертие, но наделяет цель Гламуром, который исцеляет любого, кто находится рядом или находится в контакте с заговором. Клюрикон, наблюдающий за дуэлью двух друзей, встает между ними и лечит оба раны. Отчаявшись за потерянные жизни с обеих сторон, рыцарь-тролль заставляет дождь возвращать жизнь раненым на поле боя. Надеясь утешить утомленного врача, пука делает из него сосуд для исцеления, когда тот начинает свой обход. Попав в засаду, красная шапка предлагает плоть и кровь своего побеждённого врага, чтобы исцелить его разношерстное существо.#!"
