l_russian:
 BANISH_TOTEM_PERK_EFFECT:0 "Наложите [GetModifier('banish_totem_modifier').GetNameWithTooltip] на каждого правителя противостоящей стороны, начиная [war|E] в качестве основного атакующего или защитника.\n[PODUnlocksCombatMove('POD_combat_move_werewolf_banish_totem')]\n#flavor Произнося древние и могущественные слова, Уктена может запретить тотему помогать своим детям, разрушая их чувство принадлежности к стае.#!"
 BLESSING_OF_THE_FIRST_PACK_PERK_EFFECT:0 "[PODUnlocksCombatMove('POD_combat_move_werewolf_gaias_vengeance')]"
 BREW_PERK_EFFECT:0 "[PODUnlocksCombatMove('POD_combat_move_werewolf_warriors_draught')]"
 CONTROL_SIMPLE_MACHINE_PERK_EFFECT:0 "[PODUnlocksCombatMove('POD_combat_move_werewolf_artisans_command')]"
 EYE_OF_THE_FALCON_PERK_EFFECT:0 "[PODUnlocksCombatMove('POD_combat_move_werewolf_eye_of_falcon')]"
 FETISH_DOLL_PERK_EFFECT:0 "После успешного ограбления артефакта или золота [infiltration_mission|E] правитель ограбленного двора получает три урона [POD_aggravated_damage_with_box|E]. \n#flavor Оборотень может наносить вред своим жертвам издалека, используя специально созданное чучело. У нее должен быть небольшой кусочек жертвы или принадлежащий ему предмет, который она должна включить в куклу.#!"
 LIONS_BITE_PERK_EFFECT:0 "Нанесите #V [EmptyScope.ScriptValue('POD_base_wound_damage')|V0] [POD_aggravated_damage|E]#! врагу [knights|E] и [commanders|E], когда вы действуете как [commander|E] во время [combat_phase|E], или вашему противнику во время [single_combat_duel_plural|E], если у него меньше [prowess|E], чем у вас. \n#flavor Lion's дети многому научились у своего покровителя, в том числе некоторым тактикам охоты, более знакомым большим кошкам, чем волкам. Гару с этим Даром получает безошибочную способность кусать горло своей добычи, удушая ее до потери сознания или до смерти, или даже раздавливая ее горло, как это делают львы.#!"
 MIGHT_OF_THOR_PERK_EFFECT:0 "[PODUnlocksCombatMove('POD_combat_move_werewolf_might_of_thor')]"
 PRIMAL_HOWL_PERK_EFFECT:0 "[PODUnlocksCombatMove('POD_combat_move_werewolf_beastmind')]"
 SENSE_OF_THE_DEEP_PERK_EFFECT:0 "#flavor Вплоть до Падения племя Льва было убеждено, что их долг перед Гайей — выслеживать Ее врагов даже под поверхностью земли. Этот Дар помог им в борьбе с существами $glossary_wyrm$ в их собственных норах.#!"
 SHINING_SIGILS_PERK_EFFECT:0 "#flavor На их коже или шкуре появляются светящиеся символы, представляющие истории Славы Гару. Метки сияют люминесцентным синим цветом, хотя каждая Слава имеет свой собственный тонкий оттенок цвета.#!"
 SPECTRAL_AUTHORITY_PERK_EFFECT:0 "$POD_can_bind_wraith_trigger_loca$\n#flavor Гару может командовать любым призраком или духом, которого знает по полному имени.#!"
 SPEED_BEYOND_THOUGHT_PERK_EFFECT:0 "[PODUnlocksCombatMove('POD_combat_move_werewolf_fleet_footed')]"
 SPELLBINDING_ORATION_PERK_EFFECT:0 "[PODUnlocksCombatMove('POD_combat_move_werewolf_dazzle')]"
 SPIRIT_BIRD_PERK_EFFECT:0 "#flavor Почти никто не ожидает, что оборотень будет парить, как птица, и это отличная причина для Уктена поступить именно так. Этот Дар позволяет Гару летать или парить на месте.#!"
 SPIRIT_FISH_PERK_EFFECT:0 "#flavor Оборотень может дышать под водой и плавать так быстро, как только может бежать в форме Хиспо#!"
 TRUE_SHOT_PERK_EFFECT:0 "[PODUnlocksCombatMove('POD_combat_move_werewolf_bow_of_pegasus')]"
 UKTENA_CALL_ELEMENTAL_PERK_EFFECT:0 "Разблокировать элементаля [men_at_arms|E].\n#flavor Гару может призвать на помощь одного из классических элементалей.#!"
 UKTENA_INVISIBILITY_PERK_EFFECT:0 "Разблокируйте [character_interaction|E], чтобы остановить все происки, нацеленные на вас. \n#flavor Сосредоточившись, Гару может исчезнуть из поля зрения. Она должна идти медленно и не должна привлекать к себе внимание.#!"
 VISAGE_OF_FENRIS_PERK_EFFECT:0 "[PODUnlocksCombatMove('POD_combat_move_werewolf_visage_of_fenris')]"
 banish_totem_modifier:0 "Изгнание тотема"
 banish_totem_modifier_desc:0 "Под действием могущественного Дара этот персонаж больше не может пользоваться слаженными действиями и тактикой стаи."
