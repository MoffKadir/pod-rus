l_russian:
 pod_combat_tune_ai_band_width_label:0 "Ширина лучших вариантов ИИ"
 pod_combat_tune_ai_band_width_tt:0 "Насколько оценка приёма может уступать ЛУЧШЕЙ и всё ещё рассматриваться. Меньше = точнее и предсказуемее; 0 означает, что ИИ всегда выбирает лучший приём (или один из равных ему). При значении выше ~100 ограничение теряет смысл. Внутри диапазона ИИ по-прежнему выбирает пропорционально оценке."
 pod_combat_tune_ai_hp_finish_label:0 "Порог добивания ИИ"
 pod_combat_tune_ai_hp_finish_tt:0 "Число пустых ячеек ранений, при котором или ниже которого ИИ считает врага пригодным для добивания; влияет на отказ от срочного исцеления. Действует сразу. По умолчанию 1."
 pod_combat_tune_ai_kill_priority_label:0 "Приоритет добивания ИИ: ячейки"
 pod_combat_tune_ai_kill_priority_tt:0 "Число пустых ячеек ранений, при котором или ниже которого выбор цели ИИ утраивает вес цели (сосредоточение на почти погибшем). Действует сразу. По умолчанию 2."
 pod_combat_tune_ai_mor_finish_label:0 "Порог добивания духа ИИ"
 pod_combat_tune_ai_mor_finish_tt:0 "Боевой дух врага, при котором или ниже которого ИИ считает его пригодным для добивания уроном духу. Задаёт признак возможности добивания и через него — бонусы убийства при выборе намерения и отказ умирающего бойца от лечения вместо добивания. ВЫБОР цели задаёт следующая строка приоритета добивания духа, а не эта. Действует сразу. По умолчанию 2."
 pod_combat_tune_ai_mor_kill_label:0 "Приоритет добивания духа ИИ"
 pod_combat_tune_ai_mor_kill_tt:0 "Боевой дух врага, при котором или ниже которого выбор цели ИИ утраивает её вес для бойца, способного наносить урон духу. Аналог приоритета добивания по ячейкам ранений. Значение должно быть не ниже порога добивания духа, иначе ИИ сосредоточится на врагах, которых не сможет добить. Действует сразу. По умолчанию 3."
 pod_combat_tune_ai_trace_cb_tt:0 "Записывать решения ИИ в debug.log (снижает производительность, пока включено)"
 pod_combat_tune_ai_trace_label:0 "Трассировка решения ИИ"
 pod_combat_tune_ai_trace_tt:0 "Записывает в debug.log по одной строке для каждого выбора приёма ИИ и каждого хода ИИ (ищите «pod_combat_trace»). Запись содержит выбранный приём, состояние на момент выбора и причину завершения каждого хода. Только для отладки: во включённом состоянии примерно удваивает объём вычислений при выборе действий."
 pod_combat_tune_ap_cap_increment_clear_tt:0 "Сброс: без растущего предела"
 pod_combat_tune_ap_cap_increment_label:0 "Прирост предела ОД / раунд"
 pod_combat_tune_ap_cap_increment_tt:0 "Растущий предел: запас ОД увеличивается на это значение каждый раунд (начало + N за раунд), пока не достигнет максимума. Сброс = выключено."
 pod_combat_tune_ap_cap_start_label:0 "Начальный предел ОД (раунд 1)"
 pod_combat_tune_ap_cap_start_tt:0 "Растущий предел: запас ОД в первом раунде. Имеет значение только при заданном приросте предела ОД за раунд."
 pod_combat_tune_ap_regen_clear_tt:0 "Сброс: полное восстановление шкалы каждый ход"
 pod_combat_tune_ap_regen_label:0 "Восстановление ОД / раунд"
 pod_combat_tune_ap_regen_tt:0 "ОД, восстанавливаемые каждый ход; неизрасходованные ОД сохраняются у бойца до предела запаса. Не задано = полное восстановление шкалы. Первый ход бойца всегда начинается с полного запаса."
 pod_combat_tune_base_ap_label:0 "Максимальный запас ОД"
 pod_combat_tune_base_ap_tt:0 "Максимум ОД за ход (полная шкала). Действует со следующего хода. Полоса отметок показывает не более 6."
 pod_combat_tune_footer:0 "#weak * = изменённое значение (сохраняется в файле сохранения). Настройки ОД / инициативы / попадания / уровней вступают в силу со следующего хода или проверки; начальный боевой дух — со следующей схватки; ограничения набора — в редакторе.#!"
 pod_combat_tune_hit_base_label:0 "Основа вероятности попадания"
 pod_combat_tune_hit_base_tt:0 "Базовая вероятность попадания до учёта разницы в доблести. Действует со следующего пересчёта вероятности."
 pod_combat_tune_hit_max_label:0 "Максимум вероятности попадания"
 pod_combat_tune_hit_max_tt:0 "Верхний предел текущей вероятности попадания (также ограничивает условный бонус к попаданию)."
 pod_combat_tune_hit_min_label:0 "Минимум вероятности попадания"
 pod_combat_tune_hit_min_tt:0 "Нижний предел текущей вероятности попадания."
 pod_combat_tune_init_base_label:0 "Основа инициативы"
 pod_combat_tune_init_base_tt:0 "Постоянная основа инициативы, используемая ВМЕСТО доблести при включённой отвязке от доблести (иначе игнорируется). Начальная инициатива определяется один раз для бойца, поэтому изменение действует со следующей схватки (или при вступлении нового бойца), если не включён пересчёт каждый раунд."
 pod_combat_tune_init_celerity_bonus_label:0 "Инициатива / достоинство скорости"
 pod_combat_tune_init_celerity_bonus_tt:0 "Инициатива за каждое имеющееся достоинство в ветке скорости Стремительности (вампиры) или Чёрного Ветра (куэй-дзин); 0 = выключено. Включается в основу, определяемую один раз для бойца, поэтому изменение действует со следующей схватки (или при вступлении нового бойца), если не включён пересчёт каждый раунд."
 pod_combat_tune_init_decouple_prowess_cb_tt:0 "Использовать постоянную основу инициативы вместо доблести"
 pod_combat_tune_init_decouple_prowess_label:0 "Инициатива: отвязать от доблести"
 pod_combat_tune_init_decouple_prowess_tt:0 "Использовать постоянную основу инициативы вместо доблести. Основа задаётся настройкой ниже (по умолчанию 20). Начальная инициатива определяется один раз для бойца, поэтому изменение действует со следующей схватки (или при вступлении нового бойца), если не включён пересчёт каждый раунд."
 pod_combat_tune_init_reroll_cb_tt:0 "Перебрасывать инициативу каждый раунд вместо того, чтобы сохранять бросок, с которым вступил каждый боец."
 pod_combat_tune_init_reroll_label:0 "Инициатива: перебрасывать каждый раунд"
 pod_combat_tune_init_reroll_tt:0 "Повторно определять инициативу каждого бойца в начале каждого раунда вместо сохранения исходного результата. По умолчанию выключено. В обоих случаях ослабления инициативы действуют лишь один раунд."
 pod_combat_tune_init_roll_max_label:0 "Максимальный бросок инициативы"
 pod_combat_tune_init_roll_max_tt:0 "Случайная часть инициативы: значение от 1 до N прибавляется к основе (доблести или постоянному значению при отвязке). 1 = почти предопределённый результат (решает основа). Начальная инициатива определяется один раз для бойца, поэтому изменение действует со следующей схватки (или при вступлении нового бойца), если не включён пересчёт каждый раунд."
 pod_combat_tune_max_equipped_label:0 "Общий размер набора"
 pod_combat_tune_max_equipped_tt:0 "Общий предел выбранных приёмов всех категорий. Проверяется в редакторе набора."
 pod_combat_tune_max_morale_label:0 "Предел духа (6 ячеек)"
 pod_combat_tune_max_morale_tt:0 "Предел боевого духа для бойца с 6 ячейками ранений (вампир, куэй-дзин, восставший). Каждая ячейка сверх или ниже 6 сдвигает его собственный предел на 5, поэтому настройка меняет всю шкалу, а не задаёт единый максимум. Влияет на исцеление и дефицит духа при расчёте напряжения в конце боя. Действует сразу."
 pod_combat_tune_max_per_category_label:0 "Набор / категория"
 pod_combat_tune_max_per_category_tt:0 "Предел выбранных приёмов в каждой категории (АТК / ЗАЩ / КОН / СИЛ). Проверяется в редакторе набора; полосы отметок всё ещё показывают 4. Окно боя расширяется, чтобы вместить 5+ приёмов в строке; при значении выше 5 оно может выйти за границы экрана шириной 1920."
 pod_combat_tune_morale_stress_mult_label:0 "Дух → стресс: множитель"
 pod_combat_tune_morale_stress_mult_tt:0 "Стресс за каждое недостающее очко боевого духа в конце боя (психическое напряжение, применяется один раз по завершении)."
 pod_combat_tune_reset_all:0 "Сбросить всё"
 pod_combat_tune_reset_all_tt:0 "Сбросить все изменённые значения к исходным настройкам"
 pod_combat_tune_starting_morale_label:0 "Начальный боевой дух"
 pod_combat_tune_starting_morale_tt:0 "Боевой дух, с которым каждый боец вступает в схватку (индивидуальные эффекты прибавляются сверху; минимум 1). Действует со следующего боя."
 pod_combat_tune_stealth_bonus_label:0 "Бонус попадания от скрытности"
 pod_combat_tune_stealth_bonus_tt:0 "Бонус к вероятности попадания в скрытности (расходуется при следующей атаке). В справке остаётся +30, пока значение не будет перенесено в основной код."
 pod_combat_tune_tier_large_label:0 "Сила большого уровня"
 pod_combat_tune_tier_large_tt:0 "Величина усилений и ослаблений 3-го уровня."
 pod_combat_tune_tier_medium_label:0 "Сила среднего уровня"
 pod_combat_tune_tier_medium_tt:0 "Величина усилений и ослаблений 2-го уровня."
 pod_combat_tune_tier_small_label:0 "Сила малого уровня"
 pod_combat_tune_tier_small_tt:0 "Величина усилений и ослаблений 1-го уровня для поглощения урона и попадания. Действует при текущих пересчётах."
 pod_combat_tune_window_title:0 "#high;bold Настройка боя (отладка)#!"
