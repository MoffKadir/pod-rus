l_russian:
 POD_fae_house_event.1.a:0 "Последователи [GetScriptedCharacterByHistoryID('POD_fae_character_53').GetFirstName] победили и будут обеспечивать соблюдение Эшета!"
 POD_fae_house_event.1.b:0 "Предвестники Исхода поведут нас по Железной дороге."
 POD_fae_house_event.1.desc:0 "Спор о последнем, роковом пророчестве герцога [GetScriptedCharacterByHistoryID('POD_fae_character_52').GetFirstName] разрешился уничтожением противной стороны. Единство дома восстановлено кровью, и ваше главенство в доме Бомейн больше никто не оспаривает."
 POD_fae_house_event.1.t:0 "Железный раскол"
 POD_fae_house_event.10.a:0 "Воин-целитель"
 POD_fae_house_event.10.desc:0 "Как лидер Дома Дайреанн, вы стремились продемонстрировать двойственную природу целителя и воина. Ваша рука может исцелить, а ваша рука может навредить. Вы подобны чаше, в которой можно хранить и яд, и противоядие, как лезвие, которое можно использовать, чтобы исцелить или перерезать нить жизни."
 POD_fae_house_event.10.t:0 "Воин-целитель"
 POD_fae_house_event.11.a:0 "Это духи доброй земли."
 POD_fae_house_event.11.desc:0 "Как лидер Дома Варич, вы установили прочные отношения с духами природы земли Руси. Эти духи были для фейри частью всего: земли, рек, их владений и бесконечной тайги, окружающей их. Вы понимаете, как доставить удовольствие этим духам, а также как их использовать. Духи очага и дома столь же сильны и полезны, как размер и великолепие их Якорей, а также степень уважения, которое вы им оказываете. Знать и слуги связаны взаимными обязательствами, и инаима готовы действовать по вашей воле."
 POD_fae_house_event.11.t:0 "Духи Руси"
 POD_fae_house_event.12.a:0 "Как всегда, мы чтим Морфеевых оракулов."
 POD_fae_house_event.12.desc.changeling:0 "Хотя Указы Морфеевых Оракулов не всегда имеют смысл для членов дома Скатах, этот Дом единодушно следует им. Как подменыш-лидер Дома, вы строго следовали завету Скатаха, чтобы оставаться в Мире Осени, даже несмотря на растущую Банальность. Будет ли этого достаточно?"
 POD_fae_house_event.12.desc.fae:0 "Хотя Указы Морфеевых Оракулов не всегда имеют смысл для членов дома, весь дом единодушно следует им. Как первородный фей, возглавляющий дом Скатах, вы отправились в [UmbraGlossary('deep_dreaming')] и [UmbraGlossary('sea_of_silver')], чтобы найти то, что было предсказано. Будет ли этого достаточно?"
 POD_fae_house_event.12.t:0 "Эдикты морфейских оракулов"
 POD_fae_house_event.13.a:0 "На защиту тродов Аркадии!"
 POD_fae_house_event.13.desc:0 "Как лидер Дома Данаан, вы прошли множество путей по [UmbraGlossary('dreaming')]. Теперь вы охраняете его троды и прокладываете новые тропы. Вы послужили проводником для многих мечтателей. Своей Клятвой Дракону вы завоевали благосклонность многих Химер. Вы вырастили впечатляющую орду химер, которые ждут ваших приказов и готовы даже вторгнуться в мир Осени по вашему зову."
 POD_fae_house_event.13.t:0 "На страже Грёз"
 POD_fae_house_event.14.a:0 "Проклятие Лианнан"
 POD_fae_house_event.14.desc:0 "Как глава дома Лианнан, вы нашли способ смягчить проклятие всей вашей династии. Вместо того чтобы в крайней нужде истощать смертных по одному, доводя их до рапсодии, вы содержите целое стадо смертных для сбора урожая, включая нескольких особенно ценных людей, переполненных Гламуром. Регулярно питаясь из столь обширного источника Гламура, вы смогли ослабить проклятие."
 POD_fae_house_event.14.t:0 "Проклятие Лианнан"
 POD_fae_house_event.15.a:0 "Реальность – это то, что я говорю!"
 POD_fae_house_event.15.desc:0 "«Натурфилософы» ошибаются, утверждая, что Вселенная подчиняется жестким, поддающимся обнаружению законам. Ценой огромных усилий, времени, затрат и чистой силы воли вы продемонстрировали то, о чем подозревали все алхимики, искавшие Философский камень. Проведя тысячи экспериментов, вы проявили настойчивость и в конечном итоге достигли желаемых результатов. Реальность подчиняется тем, у кого есть разум и уверенность в реализации своих желаний. Если возможно даже столь приземлённое достижение, как легендарная мечта алхимиков превратить свинец в золото, то почему бы с помощью трансмутации не лишить холодное железо способности уничтожать бессмертные души фей? Эврика! Вы сделали это!"
 POD_fae_house_event.15.t:0 "Инертное холодное железо"
 POD_fae_house_event.16.a:0 "Когда-то простолюдин, теперь дворянин."
 POD_fae_house_event.16.desc:0 "Мы, нет. Я сделал это.\n\nЯ сделал что-то настолько великое, что сама Греза признала мои усилия и даровала мне дворянский титул."
 POD_fae_house_event.16.t:0 "Под пристальным взглядом Мечты"
 POD_fae_house_event.2.a:0 "К оружию! К оружию!"
 POD_fae_house_event.2.desc:0 "Хоть это и стоило больших затрат, под вашим руководством мастера дома Дугал создали арсенал поистине легендарной мощи и масштаба. С таким оружием Фейри смогут завоевать весь мир. Тысячи вооружённых бойцов нетерпеливо ждут сигнала к наступлению!"
 POD_fae_house_event.2.t:0 "Золото в сталь"
 POD_fae_house_event.3.a:0 "Пусть придут мои враги — они разобьются о камни!"
 POD_fae_house_event.3.desc:0 "Быть предупрежденным — значит быть вооруженным. Благодаря вашему сверхъестественному пониманию будущих возможностей архитекторы Дома Эйлунд построили сложные оборонительные укрепления, способные выдержать любую осаду. Ваша защита наполнена секретными ходами, лабиринтами, тайными убежищами, бойницами для обстрела нападающих и ловушками, зачарованными кантрипами. Наконец-то вы чувствуете себя в безопасности."
 POD_fae_house_event.3.t:0 "Укреплённые фригольды"
 POD_fae_house_event.4.a:0 "Люби меня, люби меня, скажи, что любишь меня."
 POD_fae_house_event.4.desc:0 "Барды с большим желанием в сердцах навсегда будут воспевать ваши романтические подвиги. Искусству занятий любовью вы научились у мифологического олицетворения похоти — Сатиров. Вы олицетворяете красоту прекраснейшей из Ши. Вы укротили свирепое сердце разъяренного оборотня и подчинили его своим желаниям. Великие люди оставили бы свои самые великие замыслы ради вечера в вашей постели. Все будут любить вас и отчаиваться!"
 POD_fae_house_event.4.t:0 "Величайший из любовников"
 POD_fae_house_event.5.a:0 "Теперь все могут выразить почтение"
 POD_fae_house_event.5.desc.king:0 "Героическими усилиями Дом Гвидион под вашим руководством зарекомендовал себя как самый благородный из всех Ши. Кто ещё мог отправиться на поиски и овладеть молнией — Мечом Света — клинком миротворца — [GetPODArtifact('caliburn_link').GetName], как не вы, Истинный Король! Все феи должны склониться перед вашим величеством и признать ваш безраздельную власть."
 POD_fae_house_event.5.desc.queen:0 "Героическими усилиями Дом Гвидион под вашим руководством зарекомендовал себя как самый благородный из всех Ши. Кто ещё мог отправиться на поиски и овладеть молнией — Мечом Света — клинком миротворца — [GetPODArtifact('caliburn_link').GetName], как не вы, Истинная Королева! Все феи должны склониться перед вашим величеством и признать ваш безраздельную власть."
 POD_fae_house_event.5.t.king:0 "Истинный король коронован"
 POD_fae_house_event.5.t.queen:0 "Истинная королева коронована"
 POD_fae_house_event.6.a:0 "Аллилуйя!"
 POD_fae_house_event.6.desc:0 "Это сделано. Паства приняла фейри как своих пастырей и проводников. Церковь больше не будет угрозой для Фейри, как когда-то, и всему дивному народу есть за что поблагодарить [ROOT.Char.GetFullName]. Во всю вечность будут восхвалять Дом [ROOT.Char.GetHouse.GetName]. \n\nКаждому фейри на земле и на небесах придется задуматься о своих отношениях со Святой Церковью и ее Священными заступниками — [ROOT.Char.GetHouse.GetName]. Молитесь, чтобы они выбрали праведный путь к спасению, иначе их ждет зияющая пасть ада во веки веков. Искупление близко!\n\nСмертные будут помогать всем, чем смогут, создавая великие соборы, великолепное искусство и торжествующую музыку – и все это во славу божественного и его святых посланников. Давайте построим на холме сияющий город, который станет маяком надежды и спасения для всех, у кого есть уши, чтобы услышать нашу блаженную песню!"
 POD_fae_house_event.6.t:0 "Песня смертных"
 POD_fae_house_event.7.a:0 "Мои вороны, летайте каждый день по всему миру."
 POD_fae_house_event.7.desc:0 "Все сверхъестественные существа Мидгарда оказались под вашей властью, и христианизация Скандинавии начала поворачивать вспять. Скандинавы будут чтить старые обычаи и поклоняться Аэсин как богам на земле.\n\n«Внемлите моим словам, все роды людские, великие и малые дети Хеймдалля. Вы призвали нас, Аэсин, поведать о древнейших деяниях богов и людей, которые сохранила наша память»."
 POD_fae_house_event.7.t:0 "Захват Мидгарда"
 POD_fae_house_event.8.a:0 "Время войны и время мира."
 POD_fae_house_event.8.desc:0 "Благодаря вашим навыкам интриг и дипломатии вам удалось положить конец ужасному конфликту, который так долго разделял Фейри. Под вашим руководством Дом Эйлиль поднялся над всеми мелкими ссорами других Домов Ши. Теперь, когда ваш дом обладает превосходством, усилия Фейри могут быть сосредоточены на возобновлении древних договоров с человечеством. Они поверят снова и навсегда."
 POD_fae_house_event.8.t:0 "Айлиль на все времена года"
 POD_fae_house_event.9.a:0 "Мы Фомарх!"
 POD_fae_house_event.9.desc.blood_dross:0 "Раздавив крошечный пузырек кристаллизованного сахара, вы пьете вампирическую кровь, содержащуюся в Кровавом Дроссе, и наполняетесь темным Гламуром."
 POD_fae_house_event.9.desc.cauldron_of_fear:0 "Приготовив отвратительную мистическую смесь — вы пьете до дна из [GetPODArtifact('cauldron_of_fear_link').GetName]."
 POD_fae_house_event.9.desc.end:0 "Вы открываете трод в [umbra|E], чтобы призвать Нексусного ползуна.\nВ воздухе появляется чёрное мерцание, сопровождаемое дрожащим, переливчатым стоном. По коже пробегает ощущение, какое вызывает скрежет ногтей по грифельной доске. Воздух наполняется зловонными миазмами, напоминающими запах раковой опухоли. Дух $glossary_wyrm$ принимает отвратительное, ужасающее воплощение. Когти и клыки разрывают вашу плоть, и он с силой врывается в вашу грудь. Вас пронзает мучительная боль. А потом...\nМы едины. Навсегда."
 POD_fae_house_event.9.desc.start:0 "Дом Балор проследил вашу родословную до линии Ши, смешавшей свою кровь с кровью фоморов. Бесконечная зима уже близко, и вам нужно провести фейри через нее, независимо от того, согласны они с вашим правлением или нет. Вы подготовили ритуал слияния своей сущности фея с могущественным бэйном, чтобы создать гибрид Фейри и Фомори — Фомарха. Хрустальный глаз Балора светится тускло-красным светом и излучает сильное тепло."
 POD_fae_house_event.9.desc.steaming_spear_of_vengeance:0 "Подняв [GetPODArtifact('steaming_spear_of_vengeance_link').GetName], вы слизываете горячую кровь с его лезвия, чувствуя, что вас переполняет ярость."
 POD_fae_house_event.9.t:0 "Фоморианец навсегда"
