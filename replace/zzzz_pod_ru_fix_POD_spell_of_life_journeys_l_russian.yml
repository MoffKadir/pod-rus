 POD_mummy_spell_of_life_journeys.45.desc:0 "В поисках эзотерических записей в Заклинании Жизни вы обнаружили доказательства того, что некоторые подсказки можно найти в некоторых руинах, хотя никто не помнит предназначения этого места. Мощеные дорожки изрезаны прожилками травы. Когда-то величественные колонны лежали разбитыми на земле. Мало что осталось от того места, где когда-то гордо развевались знамена. Стены обветшали, обрушились по всей конструкции и еще больше скрыли то, чем она была когда-то. Внушительный зал, кажется, предназначен для того, чтобы направлять людей к определенной точке. На каждом шагу вы проходите мимо замысловатых фресок и детальной резьбы, лежащих среди грязи на земле. На нескольких отдельных плитках есть символы, а на некоторых камнях — полные предложения. \"§ Я — источник, Вселенная, неразделимое целое §\" — говорит первый камень, с которым вы столкнетесь. Второй читается \"Ð Я властелин, хозяин жизни и смерти Ð.\" Так продолжается \"ß Я всё, что есть, было и будет ß\" и \"Ǿ Я главное направление на планете, символ ложной свободы Ǿ.\" Далее вы видите ещё один камень. \"Ѭ Я — хватка существования, удерживаемая в кулаке Ѭ.\" Любопытно, как некоторые символы узнаваемы, в то время как другие сбивают вас с толку.\n\nСо временем вы достигаете врат, запечатанных магией и силой смертных. На дверях грубо вырезаны слова \"И так дворец мира становится тюрьмой для дураков\", за которым следует сетка с некоторыми пропущенными символами. Чтобы продолжить, вам нужно будет разместить упавшие плитки в нужных местах.\n\n Ð (a) ß (b) Ѭ \n(c) Ð  Ѭ  ß (d)\n Ѭ (e) Ǿ (f) Ð \n §  Ǿ  Ð  Ѭ (g)\n ß  Ѭ (h) Ð (i)"
 POD_mummy_spell_of_life_journeys.45.e:0 "a=ß, b=ß, c=§, d=Ð, e=Ð, f=ß, g=Ð, h=ß, i=§"
