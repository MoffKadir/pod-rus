 POD_mummy_spell_of_life_journeys.43.desc:0 "В поисках эзотерических записей Заклинания Жизни вы обнаружили доказательства того, что некоторые подсказки можно найти на месте ритуала искателя, который исчез после выполнения своей версии Заклинания Жизни. В большей степени, чем в любом другом месте, которое вы посетили, здесь мало что осталось от того, чем оно когда-то было. Даже ваши острые чувства не смогут сказать, что когда-то находилось на этом месте. Туман кружится в воздухе, образуя росу на ваших руках. Воздух пропитан озоном, забивающим ноздри. Растения скрипят, а звуки животных мягко доносятся до ваших ушей, словно с большого расстояния. Когда вы проходите мимо, папоротники наклоняются под вашими ногами, а затем медленно поднимаются позади вас, удаляя все следы вашего пути. История пошла дальше, оставив это место заброшенным. Магия струится в воздухе, пульсируя, как сердцебиение. Тем не менее, это кажется вялым. В центре поля полупрозрачный мужчина неразличимого возраста, кажется, сидит на невидимом стуле. \n\n\"Ах, немногие дураки добираются до этого места. Давно прошло с тех пор, как его видели. Ответь на мою загадку, и я дам тебе то, что искал в своей глупости. Что летает и не может стоять на месте? Что пожирает все, к чему прикасается, но ничего не ест? Что никогда нельзя одолжить, но всегда тратится впустую? Что всегда тратится, но никогда не зарабатывается? \""
