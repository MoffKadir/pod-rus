 POD_mummy_spell_of_life_journeys.42.desc:0 "В поисках эзотерических записей в Заклинании Жизни вы обнаружили свидетельства того, что некоторые подсказки можно найти среди руин древнего храма. Вы приходите и обнаруживаете, что храм похоронен, а остатки его крыши хрустят под вашими ногами. Все, что осталось видимым, — это одинокий обелиск, каким-то образом оставшийся нетронутым с течением времени. Золотой пик словно улавливает солнечный свет, прежде чем перенаправить его вам в глаза, еще больше подчеркивая блеск камня: маленькие точки кристалла отражают свет во всех направлениях. На основании обелиска находится мемориальная доска.\n\n\"Говори, искатель, и тщательно выбирай слово\nИбо истина — это свет, который отвечает только достойным.\nПроизнеси правильное слово и осветись его сиянием\nНо говори ложь, и тьма навсегда отберет твой шанс.\n∫ ο љ ₫ …  ҈\""
