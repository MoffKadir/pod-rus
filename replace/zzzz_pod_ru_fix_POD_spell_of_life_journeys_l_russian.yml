 POD_mummy_spell_of_life_journeys.46.a:0 "я ударю дурака"
 POD_mummy_spell_of_life_journeys.46.desc:0 "После выбора ответа из стен и места за дверями доносится скрежет, лязг и разрушение. Двери, возможно, и распахиваются, но у вас возникает ощущение, что эти древние механизмы не сработали должным образом с вашим неверным ответом. \n\nВойдя в комнату, вы видите два красных шара, слабо светящиеся среди теней. Под ними два клыка свисают с губ, искривленных в хищной улыбке. \"Освобождение всегда было вопросом времени. Эти смертные дураки никогда не могли принять мою новую, славную форму и не могли понять, что у меня есть целая вечность, чтобы они вымерли. Они никогда не понимали, какой силой я сейчас обладаю, что я действительно являюсь хозяином жизни и смерти, каким МНЕ ВСЕГДА БЫЛО ПРЕДНАЗНАЧЕНО БЫТЬ! СЕЙЧАС, сейчас... \" говорит искаженное, истощенное тело, карабкаясь к вам. \"Ты наделишь меня силой, чтобы я мог занять свое законное место ХОЗЯИНА этого мира! Все, что мне нужно от тебя, это такая дешевая вещь: твоя жизнь. Но не волнуйтесь, я позабочусь о том, чтобы мои прихожане почитали вас как мученика. \" Эти блестящие клыки бросаются на вас..."
 POD_mummy_spell_of_life_journeys.46.effect.failure:0 "Вы выиграете, но какой ценой"
 POD_mummy_spell_of_life_journeys.46.effect.success:0 "Его голова опрокидывается"
 POD_mummy_spell_of_life_journeys.46.t:0 "Забытые неудачи"
