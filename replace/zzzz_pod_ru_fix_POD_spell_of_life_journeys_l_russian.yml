 POD_mummy_spell_of_life_journeys.41.effect.success:0 "\"Секрет, который вы ищете, это... \""
 POD_mummy_spell_of_life_journeys.41.t:0 "Рассыпающиеся камни"
 POD_mummy_spell_of_life_journeys.42.a:0 "ХОР"
 POD_mummy_spell_of_life_journeys.42.b:0 "КЕМЕТ"
