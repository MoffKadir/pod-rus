 POD_mummy_spell_of_life_journeys.34.b:0 "Держи труп"
 POD_mummy_spell_of_life_journeys.34.c:0 "Держи меч"
 POD_mummy_spell_of_life_journeys.34.d:0 "Держи колокольчик"
 POD_mummy_spell_of_life_journeys.34.desc:0 "В поисках эзотерических записей в Заклинании Жизни вы обнаружили ингредиент, необходимый для финального ритуала. Этим ингредиентом является желчь давно вымершей рептилии, которая, как говорят, способна открывать рот достаточно широко, чтобы человек мог пройти через него, не пригибаясь. К сожалению, бывший искатель Заклинания Жизни истребил всех этих рептилий после собственных неудачных попыток. К счастью, вы нашли место, которое считается хранилищем этого искателя. \n\nВы маршируете по лесу, прокладывая себе путь сквозь растительность и зверей. Сучки в дереве словно следуют за вашими движениями, упрекая каждый ваш шаг. Тяжелые ветки свисают вниз, царапая вашу броню и кожу, словно когти. Наконец, вы достигаете этого. Пожелтевшие кости торчат из грязи, из ландшафта вырисовывается зияющая пасть. Ветер свистит между зубами, точит их, как невидимые точильные камни. Осторожно спустившись по лестнице, вы позволяете тьме поглотить вас. У основания сначала находится открытая пара челюстей, а затем закрытая пара челюстей. На зубах обоих были вырезаны резкие угловатые буквы. Если читать слева направо от верхнего угла, открытая пара читается: \"Докажите, что вы достойны быть здесь, и получите доступ. \" Закрытая пара читает что-то более запутанное. \"BTELDIIEBTELDIOETBRBRYHBAELVDYHBAEHPDOEEON\"."
 POD_mummy_spell_of_life_journeys.34.effect.success:0 "Желчь твоя"
 POD_mummy_spell_of_life_journeys.34.t:0 "Логово Искателя"
 POD_mummy_spell_of_life_journeys.35.a:0 "Нет ничего, что меч не мог бы исправить"
 POD_mummy_spell_of_life_journeys.35.desc:0 "Челюсти раскрываются со скрежетом, похожим на звук меча, извлекаемого из ножен. Там, где вы ожидали лестницу вниз или, возможно, полупустую бутылку с желчью, оказались звери, рептилии, каких вы никогда раньше не видели. Они напоминают крокодилов, хотя их 6 ног сочленены больше, как у аллигатора, а за их похожим на ствол телом следует хвост с шипами. Направляя вверх и вниз, изо рта заметно выступают десятки зубов. Судя по всему, этот искатель прошлого решил, что разводить этих зверей ради их желчи гораздо проще, чем охотиться на них в дикой природе. Полезные, хотя за прошедшие века они, кажется, одичали."
 POD_mummy_spell_of_life_journeys.35.effect.failure:0 "Они отгоняют тебя"
