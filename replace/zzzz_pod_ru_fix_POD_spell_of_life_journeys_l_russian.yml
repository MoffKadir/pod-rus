 POD_mummy_spell_of_life_journeys.44.desc:0 "В поисках эзотерических записей в Заклинании Жизни вы обнаружили доказательства того, что некоторые подсказки можно найти в древней крепости. По мере вашего приближения перед вами встают могучие вершины, словно стремящиеся постичь бессмертие богов. Вы идете по тому, что когда-то было дорогой, а теперь представляет собой поле, где вдалеке свалены несколько оставшихся каменных кирпичей как часть забора. В ваших книгах утверждается, что раньше это был оживленный торговый путь, ведущий к шахтерскому городу, охраняемому цитаделью среди гор. Трудно представить себе большие караваны, когда видишь только траву. В самом городе осталось немного больше, чем гнилая древесина, остальное забрали те, кто остался в этом районе. Некогда величественная лестница, высеченная внутри горы, ведущая в крепость, теперь неотличима от заброшенной шахты. Даже сама лестница была разрушена, оставив то, что можно смело назвать пандусом. Каждый шаг эхом отражается от изогнутых стен, подпрыгивая в тишине. Наверху находятся ворота, уже не украшенные, как когда-то, но все еще стоящие. Узоры, когда-то кропотливо вырезанные на нем, стерлись, краска потускнела, золотые украшения были украдены. Тем не менее, дверь и ее вывеска остались. \n\n\"Меня никогда не было, но я всегда наступлю; никто не видел меня и никогда не увидит; никому не принадлежу, но тебе подвластно моё течение. И всё же я — уверенность всех, кто живёт и дышит в этом священном зале.\""
