 POD_mummy_spell_of_life_journeys.41.desc:0 "В поисках эзотерических записей Заклинания Жизни вы обнаружили доказательства того, что некоторые подсказки можно найти на месте ритуала искателя, который исчез после выполнения своей версии Заклинания Жизни. От этой гробницы осталось меньше, чем почти от любого другого места, которое вы посетили. Туман кружится в воздухе, образуя росу на ваших руках. Воздух пропитан озоном, забивающим ноздри. Растения скрипят, а звуки животных мягко доносятся до ваших ушей, словно с большого расстояния. Когда вы проходите мимо, папоротники наклоняются под вашими ногами, а затем медленно поднимаются позади вас, удаляя все следы вашего пути. Природа настигла некогда величественный храм. Замковые камни колонн лежали среди корней деревьев, возможно, существовавших еще до вас. Резные каменные кирпичи рушатся с каждым шагом. В конце концов, вы достигаете того, что когда-то было фундаментом гробницы, но теперь представляет собой круг потрескавшихся камней. В центре — полупрозрачный мужчина неразличимого возраста, который, кажется, сидит на невидимом стуле. \n\n\"Ах, немногие дураки добираются до этого места. Давно прошло с тех пор, как его видели. Ответь на мою загадку, и я дам тебе то, что искал в своей глупости. Магу столько же лет, сколько будет колдуну, когда магу будет вдвое больше, чем было колдуну, когда возраст мага составлял половину суммы их нынешних возрастов. Сколько лет каждому? \""
