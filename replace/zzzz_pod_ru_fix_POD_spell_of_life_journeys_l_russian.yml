 POD_mummy_spell_of_life_journeys.36.desc:0 "В поисках эзотерических записей в Заклинании Жизни вы нашли свидетельства того, что некоторые подсказки кроются в древней гробнице, хотя есть ли в ней тело — предмет серьезных споров. Легенды рассказывают о мудром учителе, который довел нескольких учеников до безумия и даже хуже. Он был печально известен своими тестами и наказаниями за несоответствие стандартам. По его мнению, те, кто недостоин его знаний, должны доказать, что они достойны жить. Если нет, он был более чем рад исправить проблему. \n\nОткрыв гробницу и спустившись вниз, вы входите и видите статую высотой 30 футов, держащую резной свиток, покоящийся на постаменте с мемориальной доской и четырьмя кнопками. На каждой кнопке указан номер. Табличка под статуей гласит: \"Расшифруй мои учения, чтобы доказать свою склонность к магии и получить мои знания. Если вы окажетесь не в состоянии прочитать такое простое сообщение или выполнить такие простые математические действия, все мои знания будут уничтожены. Не пытайтесь прорваться вперед, как невежественное животное. \" На свитке, который держит статуя, написано следующее: \n\nОранжевый + Синий = 5 ; Синий + Красный = 3; Оранжевый + Красный = 4; Фиолетовый = ?."
 POD_mummy_spell_of_life_journeys.36.e:0 "Я позволяю своей интуиции вести меня"
 POD_mummy_spell_of_life_journeys.36.effect.failure:0 "Статуя загорается"
 POD_mummy_spell_of_life_journeys.36.effect.success:0 "Свиток рассыпается, обнажая бумагу."
 POD_mummy_spell_of_life_journeys.36.t:0 "Эзотерические Фигуры"
 POD_mummy_spell_of_life_journeys.37.a:0 "Ты отрубишь мне голову."
 POD_mummy_spell_of_life_journeys.37.b:0 "Ты разрежешь мне живот."
 POD_mummy_spell_of_life_journeys.37.c:0 "ты убьешь меня"
 POD_mummy_spell_of_life_journeys.37.d:0 "Я убью тебя первым!"
 POD_mummy_spell_of_life_journeys.37.desc:0 "В поисках эзотерических записей в Заклинании Жизни вы обнаружили доказательства того, что некоторые подсказки лежат внутри пирамиды. Подробности о его содержимом скудны, хотя вы слышали о его могучем хранителе. Насколько правдивы эти сказки, еще неизвестно. \n\nВ воздухе пропитан неестественный туман, более густой, чем любой суп, который вы съели, и странно похожий по запаху. Когда вы проходите через него, кажется, что он внезапно останавливается, словно его удерживает невидимый барьер. Перед вами простираются бесконечные волны багрового от крови песка, подсвеченного солнцем. Серебряная вершина пирамиды возвышается вдалеке, медленно опускаясь в черный мрамор по мере того, как вы поднимаетесь на дюны и приближаетесь все ближе. Запечатанная дверь окружена двумя обелисками, которые, кажется, почти поглощают солнечный свет и посылают его пульсацию по жилкам мрамора. Перед дверью стоит то, что на первый взгляд кажется гигантским мужчиной с топором, хотя песок быстро расступается, обнажая ноги скорпиона и жало ниже его талии. Когда вы приближаетесь, серкетавр преграждает вам путь и говорит. \n\n\"Вы можете сделать одно заявление. Если это правда, я отрублю тебе голову. Если это ложь, я разрежу тебе живот.\""
 POD_mummy_spell_of_life_journeys.37.effect.failure:0 "Топор падает туда, где ты когда-то был"
 POD_mummy_spell_of_life_journeys.37.effect.success:0 "Топор отходит в сторону, позволяя вам пройти"
 POD_mummy_spell_of_life_journeys.37.t:0 "Страж-серкетавр"
 POD_mummy_spell_of_life_journeys.38.a:0 "Умы"
 POD_mummy_spell_of_life_journeys.38.b:0 "Быки"
 POD_mummy_spell_of_life_journeys.38.c:0 "Барабаны"
 POD_mummy_spell_of_life_journeys.38.d:0 "Колеса"
 POD_mummy_spell_of_life_journeys.38.desc:0 "В поисках эзотерических записей в Заклинании Жизни вы нашли доказательства того, что некоторые подсказки находятся в гробнице. В то время как большинство искателей Заклинания Жизни работали самостоятельно, эта клика магов работала вместе для достижения своих целей. В то время как другие преследовали только магию Заклинания Жизни, они искали более целостный подход, позволяющий улучшить тело, разум и душу. Некоторые говорят, что на них повлияли традиции, пришедшие из земель к востоку от Кемета, расположенных по торговым путям. От их работы сохранилось мало подробностей, хотя слово «акаша» появляется несколько раз, и их неудача очевидна.\n\nПоначалу кажется, что это не что иное, как яма в земле, засыпанная землей давно прошедших веков. Вы ожидали лестницу или стремянку, но вместо этого перед вами опускается пандус, изгибающийся вправо. С каждым шагом и каждым поворотом вы движетесь вниз. Шаг за шагом, поворот за поворотом вы проходите мимо резных изображений, изображающих множество сцен учебы, пения, медитации, рукоделия, роста, танцев и многого другого. Так продолжается, пока вы проходите через ворота за воротами, пока за вами не окажутся 4 ворот. Наконец, вы стоите перед закрытыми воротами. Над ним написано несколько слов. \"Говорите правду, чтобы продолжить. Когда меня двое, мы лучше, чем один. Когда меня двести, мы — громкие дураки. Когда мы движемся как единое целое, ничто не сможет противостоять нам. Когда мы движемся в противоположных направлениях, мы никуда не движемся. Что я? \""
 POD_mummy_spell_of_life_journeys.38.e:0 "Я позволяю своей интуиции вести меня"
