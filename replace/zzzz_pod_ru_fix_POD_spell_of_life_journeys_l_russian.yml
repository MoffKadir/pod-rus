 POD_mummy_spell_of_life_journeys.32.t:0 "Плотина мечты"
 POD_mummy_spell_of_life_journeys.33.a:0 "Нажмите красную кнопку"
 POD_mummy_spell_of_life_journeys.33.b:0 "Нажмите оранжевую кнопку"
 POD_mummy_spell_of_life_journeys.33.c:0 "Нажмите желтую кнопку"
 POD_mummy_spell_of_life_journeys.33.d:0 "Нажмите зеленую кнопку"
 POD_mummy_spell_of_life_journeys.33.desc:0 "В поисках эзотерических записей о Заклинании Жизни вы нашли свидетельства того, что некоторые подсказки кроются в древней гробнице, хотя есть ли в ней тело — предмет серьезных споров. Легенды рассказывают о мудром учителе, который довел нескольких учеников до безумия и даже хуже. Он был печально известен своими тестами и наказаниями за несоответствие стандартам. По его мнению, те, кто недостоин его знаний, должны доказать, что они достойны жить. Если нет, он был более чем счастлив исправить проблему.\n\nОткрыв гробницу и спустившись вниз, вы входите и видите статую высотой 30 футов, держащую резной свиток, лежащий на постаменте с мемориальной доской и пятью кнопками. По порядку кнопки имеют красный, оранжевый, желтый, зеленый и синий цвета. Табличка под статуей гласит: \"Расшифруй мои учения, чтобы доказать свою склонность к магии и получить мои знания. Возможно, вы сможете описать автоморфизм аффинного пространства. Если вы окажетесь не в состоянии прочитать такое простое сообщение или выполнить такие простые математические действия, все мои знания будут уничтожены. Не пытайтесь прорваться вперед, как невежественная скотина. \" На свитке, который держит статуя, написано следующее:\nG2w mooi sg ix26nojyo 2t s4y8e m2 7h21o g2whmont 74hr64g e2s7oroxr. G2w m32wnj 7homm r3o 2h4xyo 9wrr2x."
