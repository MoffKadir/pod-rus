 POD_mummy_spell_of_life_journeys.39.a:0 "Нажмите все, кроме пластин 3,6,9,12,15,18."
 POD_mummy_spell_of_life_journeys.39.b:0 "Нажмите все, кроме пластин 3,5,7,11,13,17."
 POD_mummy_spell_of_life_journeys.39.c:0 "Нажмите все, кроме пластин 4,6,9,12,15,19."
 POD_mummy_spell_of_life_journeys.39.d:0 "Нажмите все, кроме пластин 6,9,12,15,18,19."
 POD_mummy_spell_of_life_journeys.39.desc:0 "В поисках эзотерических записей в Заклинании Жизни вы нашли доказательства того, что некоторые подсказки находятся в гробнице. Согласно легендам, гробница теперь является домом искателя, который соткал свою магию через поэзию. Он искал бессмертия. С помощью своей магии он продлил свою жизнь только для того, чтобы обнаружить присущее ей проклятие. С каждым годом уходил еще один родственник. С каждой великой войной терялось все больше друзей. И все же он остался. Когда времена года шли, а листья опадали только для того, чтобы снова вырасти новыми, он отказался от поисков вечного возрождения. Он позволил времени настичь его. И теперь... теперь его могила готова для поиска в поисках бессмертия. \n\nНа вершине гробницы находится простая фраза \"Бойтесь того, что осталось вне времени\". Интерьер гробницы выполнен из простого камня, хорошо сделанного, но не богато украшенного. В конце концов вы доберетесь до длинного коридора с нажимными пластинами, каждая из которых имеет номер от 1 до 19. На дальней стороне находится гроб с 13 тусклыми драгоценными камнями. Перед нажимными пластинами стоит постамент со стихотворением.\n\n\"Время скажет лишь: «Я предупреждало»,\nВремя знает только цену, которую нам придется заплатить;\nЕсли бы я мог сказать вам, я бы дал вам знать.\n\nЕсли бы мы плакали, когда клоуны дают представление,\nЕсли мы споткнемся, когда играют музыканты,\nВремя скажет лишь: «Я предупреждало».\n\nОднако судьбы не предсказать,\nПотому что я люблю тебя больше, чем могу сказать,\nЕсли бы я мог сказать тебе, я бы дал тебе знать.\n\nВетер должен откуда-то дуть,\nДолжны быть причины, почему листья гниют;\nВремя скажет лишь: «Я предупреждало».\n\nВозможно, розы действительно хотят расти,\nВидение серьезно намерено остаться;\nЕсли бы я мог сказать тебе, я бы дал тебе знать. \n\nПредположим, все львы встанут и уйдут, \n И все ручьи и солдаты убегут; \n Скажет ли Время лишь: «Я предупреждало»? \n Если бы я мог сказать тебе, я бы дал тебе знать. \""
