l_russian:
 POD_mummy_elixir_of_eternal_life_journeys.10.a:0 "Я уединюсь в своем [ROOT.Char.Custom('ResidenceBuilding')]"
 POD_mummy_elixir_of_eternal_life_journeys.10.a.tt:0 "Вместо того, чтобы начинать [journey|E], вам следует медитировать здесь, в безопасном и легком #P месте#!."
 POD_mummy_elixir_of_eternal_life_journeys.10.b:0 "Я найду место среди дикой природы"
 POD_mummy_elixir_of_eternal_life_journeys.10.b.tt:0 "Вы начнёте [journey|E] к #bold $elixir_of_eternal_life_stage2_meditation_name$#!, отправившись в #Z умеренно сложное место #! для медитации."
 POD_mummy_elixir_of_eternal_life_journeys.10.c:0 "Я уйду в изолированное место"
 POD_mummy_elixir_of_eternal_life_journeys.10.c.tt:0 "Вы начнёте [journey|E] к #bold $elixir_of_eternal_life_stage2_meditation_name$#!, путешествуя в #N трудное и опасное #! место для медитации."
 POD_mummy_elixir_of_eternal_life_journeys.10.desc:0 "Только посредством медитации мы можем по-настоящему понять цикл перерождений. \n\nХотя это означает пренебрежение другими моими обязанностями, уединившись для медитации, я могу больше узнать о себе и о том, как достичь вечного перерождения."
 POD_mummy_elixir_of_eternal_life_journeys.10.failure:0 "Ваша медитация не дает никаких прозрений"
 POD_mummy_elixir_of_eternal_life_journeys.10.success:0 "Ваше совершенствование дает некоторое понимание"
 POD_mummy_elixir_of_eternal_life_journeys.10.t:0 "Размышления о вечности"
 POD_mummy_elixir_of_eternal_life_journeys.11.a:0 "Перебои создавали некоторые трудности..."
 POD_mummy_elixir_of_eternal_life_journeys.11.a.failure:0 "И мешал мне обрести внутренний покой"
 POD_mummy_elixir_of_eternal_life_journeys.11.a.failure.critical:0 "И бесконечная какофония загнала меня в тупик."
 POD_mummy_elixir_of_eternal_life_journeys.11.a.success:0 "Но я преодолел их"
 POD_mummy_elixir_of_eternal_life_journeys.11.a.success.critical:0 "Но это ускользнуло из моего сознания, как вода по стеклу."
 POD_mummy_elixir_of_eternal_life_journeys.11.b:0 "Само путешествие и изоляция представляли собой некоторые трудности..."
 POD_mummy_elixir_of_eternal_life_journeys.11.b.failure:0 "И заставил меня отступить в убежище"
 POD_mummy_elixir_of_eternal_life_journeys.11.b.failure.critical:0 "И мои губы быстро треснули от жажды"
 POD_mummy_elixir_of_eternal_life_journeys.11.b.success:0 "Но я преодолел их"
 POD_mummy_elixir_of_eternal_life_journeys.11.b.success.critical:0 "Но лишение дало мне прозрение"
 POD_mummy_elixir_of_eternal_life_journeys.11.desc:0 "Путешествуя среди дикой природы, я обнаружил, что мой разум свободен и свободен блуждать. Благодаря посту и медитации мои мысли обратились внутрь себя. Я обдумал все, что узнал. Я работал над укреплением своей базы совершенствования и углублением своего понимания вечного возрождения."
 POD_mummy_elixir_of_eternal_life_journeys.11.internal:0 "Ваш опыт медитации и владения своим телом увеличивает ваши шансы на критический успех и снижает вероятность критических неудач."
 POD_mummy_elixir_of_eternal_life_journeys.11.t:0 "Размышления о вечности"
 POD_mummy_elixir_of_eternal_life_journeys.21.b:0 "Я сдаюсь!"
 POD_mummy_elixir_of_eternal_life_journeys.21.desc:0 "Ваши усилия привели к неким эзотерическим записям неизвестного возраста. Несмотря на ваше знание нескольких языков и лингвистические способности ваших придворных, ваших совместных усилий оказалось недостаточно, чтобы расшифровать их. Невидимые чернила скрывают важные детали. Зашифрованные слова испещряют текст. Части, написанные на знакомом языке, с трудом поддаются интерпретации и требуют технического и магического мастерства, которого вы только начинаете достигать. Авторские сокращения только еще больше усложняет ваши усилия по переводу. \n\nОдно конкретное слово из пяти букв, похоже, является ключом к переводу остальной части. К сожалению, у вас будет только 6 возможностей, поскольку ваши усилия весьма разрушительны."
 POD_mummy_elixir_of_eternal_life_journeys.21.effect.failure:0 "Ваш перевод не удался"
 POD_mummy_elixir_of_eternal_life_journeys.21.effect.failure.details:0 "Ваши неудачные попытки уничтожили записи"
 POD_mummy_elixir_of_eternal_life_journeys.21.effect.success:0 "Ваш перевод успешен"
 POD_mummy_elixir_of_eternal_life_journeys.21.t:0 "[Concept('translation_minigame', 'Перевод')|E] эзотерических записей"
 POD_mummy_elixir_of_eternal_life_journeys.22.a:0 "Укажите на себя"
 POD_mummy_elixir_of_eternal_life_journeys.22.b:0 "Попробуйте найти несовершенную копию"
 POD_mummy_elixir_of_eternal_life_journeys.22.c:0 "Закрой глаза и пробежись по копиям"
 POD_mummy_elixir_of_eternal_life_journeys.22.d:0 "Ищите узоры и формы"
 POD_mummy_elixir_of_eternal_life_journeys.22.desc:0 "Благодаря своим исследованиям и исследованиям вы открыли древнюю технику, помогающую в совершенствовании: Залы Бесконечного Отражения. Если вы расположитесь в центре ритуальной формации из зеркал, сила внутри вас будет много раз отражаться сама по себе, прежде чем снова войти в ваше тело. Эта сила будет еще больше усиливаться по мере того, как она проходит через геометрические формы, используемые для построения формации. \n\nКогда вы помещаетесь в ядро ​​формации, вы видите два зеркала, установленных почти друг напротив друга, так что вы можете видеть себя через плечо, бесконечно изгибающегося во вселенную внутри зеркала. Когда вы обращаете взгляд внутрь себя, вы можете почувствовать, как вы вливаетесь в себя, умножаясь посредством бесконечных отражений. С точки зрения постороннего было бы практически невозможно определить, где заканчиваются зеркала и начинается вы. \n\nПоначалу все идет хорошо. Ваше совершенствование продвигается семимильными шагами. Затем вы чувствуете, что трескаетесь и разбиваетесь на бесконечные осколки, каждый из которых является фрактальным отражением вашей формы, а затем растекается по посеребренной поверхности зеркала перед вами. Когда вы просыпаетесь, перед вами расстилается многослойный серебристый мир, идеально гладкий, совершенно бесконечный. На каждом шагу есть ваше отражение, идеальное, но иллюзорное, отражающее вас, но у каждого свое выражение, уникальное даже среди всех остальных. Нет двух одинаковых улыбок и нет двух одинаковых хмурых взглядов. Они не двигаются, когда вы проходите среди них и сквозь них, а лишь поворачиваются, чтобы их глаза могли следовать за вами. Сквозь удивление и панику на ум приходит старая история Зеркального Царства. \"Только найдя настоящее, можно выбраться из тюрьмы собственного отражения.\""
 POD_mummy_elixir_of_eternal_life_journeys.22.e:0 "Помню ли я еще что-нибудь из этой истории?"
 POD_mummy_elixir_of_eternal_life_journeys.22.effect.failure:0 "Вы проходите через множество отражений, прежде чем сбежать."
 POD_mummy_elixir_of_eternal_life_journeys.22.effect.success:0 "Отражения разбиваются, растворяясь в тебе."
 POD_mummy_elixir_of_eternal_life_journeys.22.t:0 "Залы бесконечного отражения"
 POD_mummy_elixir_of_eternal_life_journeys.23.a:0 "Принимайте 3 таблетки в первый день и 1 во второй день."
 POD_mummy_elixir_of_eternal_life_journeys.23.b:0 "Принимайте по 1 случайной таблетке каждый день, чтобы избежать штрафа."
 POD_mummy_elixir_of_eternal_life_journeys.23.c:0 "Съедайте по 1 половине каждой таблетки каждый день."
 POD_mummy_elixir_of_eternal_life_journeys.23.d:0 "Растолките 2 таблетки, смешайте их и принимайте каждый день."
 POD_mummy_elixir_of_eternal_life_journeys.23.desc:0 "Ваша последняя экспедиция привела вас к тайнику с четырьмя лекарственными таблетками, оставленным кем-то, кто ранее искал эликсир вечной жизни. Среди остатков заметок вы узнаете, что вы бы получили большую пользу, если бы принимали ровно по одной таблетке каждого из двух типов каждый день. Однако прием слишком большого количества какого-либо одного типа сведет на нет преимущества. К сожалению, таблетки смешаны в одном флаконе, не имеют маркировки и выглядят одинаково. Как убедиться, что вы принимаете правильные таблетки?"
 POD_mummy_elixir_of_eternal_life_journeys.23.e:0 "Принимайте по 2 случайные таблетки каждый день."
 POD_mummy_elixir_of_eternal_life_journeys.23.effect.failure:0 "После сильной рвоты вы не увидите никакой пользы."
 POD_mummy_elixir_of_eternal_life_journeys.23.effect.success:0 "Таблетки улучшают ваше совершенствование"
 POD_mummy_elixir_of_eternal_life_journeys.23.t:0 "Тайник с таблетками"
 POD_mummy_elixir_of_eternal_life_journeys.24.a:0 "a=8, b=6, c=4, d=2"
 POD_mummy_elixir_of_eternal_life_journeys.24.b:0 "a=6, b=8, c=2, d=4"
 POD_mummy_elixir_of_eternal_life_journeys.24.c:0 "a=5, b=9, c=5, d=1"
 POD_mummy_elixir_of_eternal_life_journeys.24.d:0 "a=-1, b=3, c=7, d=11"
 POD_mummy_elixir_of_eternal_life_journeys.24.desc:0 "В поисках эзотерических записей об эликсире вечной жизни вы нашли доказательства того, что некоторые подсказки скрыты в древнем храме. Эта секта была известна своими эзотерическими учениями о математике и божественной симметрии. Согласно сохранившимся записям, они верили, что только с помощью математики можно понять, отследить или повлиять на Колесо веков. Однако их внутренние тайны и природа этих уравнений были утеряны, когда популярность секты упала. \n\nПосле прибытия вы поняли, что храм был не более чем небольшим местом для встреч с сиденьями, расставленными вокруг ямы с песком. Напротив входа была дверь, запертая какой-то магией. Хотя большая часть песочницы была унесена ветром, перед дверью можно было увидеть несколько каменных плит, воткнутых в песок. Очистив их от песка, вы поняли, что на каждой табличке указан номер. Вы подозреваете, что вам нужно нарисовать недостающие цифры на песке между табличками. \na 1 b\n3 5 7\nc 9 d"
 POD_mummy_elixir_of_eternal_life_journeys.24.e:0 "Я пробиваюсь силой"
 POD_mummy_elixir_of_eternal_life_journeys.24.effect.failure:0 "Магия взрывается, уничтожая все, что было внутри."
 POD_mummy_elixir_of_eternal_life_journeys.24.effect.success:0 "Магия исчезает, и перед вами открывается путь"
 POD_mummy_elixir_of_eternal_life_journeys.24.t:0 "Числа на песке"
 POD_mummy_elixir_of_eternal_life_journeys.25.a:0 "a=4, b=1, c=3, d=6"
 POD_mummy_elixir_of_eternal_life_journeys.25.b:0 "a=7, b=9, c=1, d=3"
 POD_mummy_elixir_of_eternal_life_journeys.25.c:0 "a=7, b=5, c=5, d=3"
 POD_mummy_elixir_of_eternal_life_journeys.25.d:0 "a=1, b=3, c=7, d=9"
 POD_mummy_elixir_of_eternal_life_journeys.25.desc:0 "В поисках эзотерических записей об эликсире вечной жизни вы нашли доказательства того, что некоторые подсказки скрыты в древнем храме. Эта секта была известна своими эзотерическими учениями о математике и божественной симметрии. Согласно сохранившимся записям, они верили, что только с помощью математики можно понять, отследить или повлиять на Колесо веков. Однако их внутренние тайны и природа этих уравнений были утеряны, когда популярность секты упала. \n\nПосле прибытия вы поняли, что храм был не более чем небольшим местом для встреч с сиденьями, расставленными вокруг ямы с песком. Напротив входа была дверь, запертая какой-то магией. Хотя большая часть песочницы была унесена ветром, перед дверью можно было увидеть несколько каменных плит, воткнутых в песок. Очистив их от песка, вы поняли, что на каждой табличке указан номер. Вы подозреваете, что вам нужно нарисовать недостающие цифры на песке между табличками. \n2 a 6\nb 5 c\n4 d 8"
 POD_mummy_elixir_of_eternal_life_journeys.25.e:0 "Я пробиваюсь силой"
 POD_mummy_elixir_of_eternal_life_journeys.26.a:0 "a=4, b=2, c=6, d=8"
 POD_mummy_elixir_of_eternal_life_journeys.26.b:0 "a=1, b=5, c=7, d=7"
 POD_mummy_elixir_of_eternal_life_journeys.26.c:0 "a=2, b=4, c=6, d=8"
 POD_mummy_elixir_of_eternal_life_journeys.26.d:0 "a=2, b=4, c=5, d=9"
 POD_mummy_elixir_of_eternal_life_journeys.26.desc:0 "В поисках эзотерических записей об эликсире вечной жизни вы нашли доказательства того, что некоторые подсказки скрыты в древнем храме. Эта секта была известна своими эзотерическими учениями о математике и божественной симметрии. Согласно сохранившимся записям, они верили, что только с помощью математики можно понять, отследить или повлиять на Колесо веков. Однако их внутренние тайны и природа этих уравнений были утеряны, когда популярность секты упала. \n\nПосле прибытия вы поняли, что храм был не более чем небольшим местом для встреч с сиденьями, расставленными вокруг ямы с песком. Напротив входа была дверь, запертая какой-то магией. Хотя большая часть песочницы была унесена ветром, перед дверью можно было увидеть несколько каменных плит, воткнутых в песок. Очистив их от песка, вы поняли, что на каждой табличке указан номер. Вы подозреваете, что вам нужно нарисовать недостающие цифры на песке между табличками. \na 9 b\n7 5 3\nc 1 d"
 POD_mummy_elixir_of_eternal_life_journeys.26.e:0 "Я пробиваюсь силой"
 POD_mummy_elixir_of_eternal_life_journeys.27.a:0 "a=3, b=9, c=2, d=7"
 POD_mummy_elixir_of_eternal_life_journeys.27.b:0 "a=2, b=9, c=1, d=7"
 POD_mummy_elixir_of_eternal_life_journeys.27.c:0 "a=3, b=1, c=9, d=7"
 POD_mummy_elixir_of_eternal_life_journeys.27.d:0 "a=3, b=9, c=1, d=7"
 POD_mummy_elixir_of_eternal_life_journeys.27.desc:0 "В поисках эзотерических записей об эликсире вечной жизни вы нашли доказательства того, что некоторые подсказки скрыты в древнем храме. Эта секта была известна своими эзотерическими учениями о математике и божественной симметрии. Согласно сохранившимся записям, они верили, что только с помощью математики можно понять, отследить или повлиять на Колесо веков. Однако их внутренние тайны и природа этих уравнений были утеряны, когда популярность секты упала. \n\nПосле прибытия вы поняли, что храм был не более чем небольшим местом для встреч с сиденьями, расставленными вокруг ямы с песком. Напротив входа была дверь, запертая какой-то магией. Хотя большая часть песочницы была унесена ветром, перед дверью можно было увидеть несколько каменных плит, воткнутых в песок. Очистив их от песка, вы поняли, что на каждой табличке указан номер. Вы подозреваете, что вам нужно нарисовать недостающие цифры на песке между табличками. \n4 a 8\nb 5 c\n2 d 6"
 POD_mummy_elixir_of_eternal_life_journeys.27.e:0 "Я пробиваюсь силой"
 POD_mummy_elixir_of_eternal_life_journeys.28.a:0 "Зелёную к жёлтой. жёлтой к синей. синей к красной. красной к серой. серой к зелёную."
 POD_mummy_elixir_of_eternal_life_journeys.28.b:0 "Зелёную к красной. красной к жёлтой. жёлтой к серой. серой к синей. синей к зелёную."
 POD_mummy_elixir_of_eternal_life_journeys.28.c:0 "Зелёную к серой. серой к красной. красной к синей. синей к жёлтой. жёлтой к зелёную."
 POD_mummy_elixir_of_eternal_life_journeys.28.d:0 "Зелёную к синей. синей к серой. серой к жёлтой. жёлтой к красной. красной к зелёную."
 POD_mummy_elixir_of_eternal_life_journeys.28.desc:0 "В поисках эзотерических записей об эликсире вечной жизни вы нашли доказательства того, что некоторые подсказки скрыты в зале секты. Их древний зал, спрятанный в изолированном месте и защищенный древней магией, теперь заброшен. Вокруг него выросли деревья и растения, образующие вторую крышу над удивительно нетронутым сооружением. Лозы и трава почти служат барьером вокруг зала, останавливаясь прямо перед его стенами. Перед запечатанными воротами по кругу расположены 5 статуй. Их терракотовые тела имеют замысловатую форму и поразительно похожи на живые. Их доспехи изготовлены с любовью и окрашены в зеленый, серый, синий, красный и желтый цвета. Их топоры... ну, их топоры вообще не отлиты. Топоры настоящие, сделаны из рукоятки из персикового дерева и с головками из холодного железа. Вокруг оснований статуй вы видите странные потертости, а некоторые краткие эксперименты показывают, что каждая статуя легко вращается. Над воротами висит мемориальная доска: \n\"Лес превратился в бушующий ад, сменивший ночь на день. Горячие источники и магма превратились в камень, когда земля тряслась и вздымалась, как живое существо. Огромные камни врезались в землю. Мрамор и гранит превратились в железо и олово, убивая землю и отравляя воду. Огромные шахты взорвались, когда руда превратилась в воду в десять раз больше своего объема. Озера и реки были заглушены бесконечным пространством зелени, которую предстояло снова сжечь. И так было, когда мир был переделан. Так и случилось, когда колесо снова повернулось. \"\n\nКак вращать каждую статую? К какой статуе обращен каждый из них?"
 POD_mummy_elixir_of_eternal_life_journeys.28.e:0 "Узнаю ли я этот цикл?"
 POD_mummy_elixir_of_eternal_life_journeys.28.effect.failure:0 "Статуи смотрят на вас и поворачивают свои топоры вниз, изгоняя вас."
 POD_mummy_elixir_of_eternal_life_journeys.28.effect.success:0 "Статуи смотрят на ворота и опускают топоры вниз, открывая двери."
 POD_mummy_elixir_of_eternal_life_journeys.28.t:0 "Великий цикл порождения"
 POD_mummy_elixir_of_eternal_life_journeys.29.a:0 "Красный, синий, белый, зеленый, желтый"
 POD_mummy_elixir_of_eternal_life_journeys.29.b:0 "Красный, синий, зеленый, белый, желтый"
 POD_mummy_elixir_of_eternal_life_journeys.29.c:0 "Красный, синий, зеленый, желтый, белый"
 POD_mummy_elixir_of_eternal_life_journeys.29.d:0 "Синий, красный, белый, зеленый, желтый"
 POD_mummy_elixir_of_eternal_life_journeys.29.desc:0 "После обширных исследований и отправки своих агентов повсюду, вы получили 5 бутылок отвара от алхимика, который несколько столетий назад стал Ву Тянь. Красная бутылка горит внутренним пламенем, радостно танцуя внутри стеклянных стенок. Зеленая бутылка гудит с едва уловимой жизненной силой, усики раскрываются и снова скручиваются, словно медленное сердцебиение. Синяя бутылка плещется с врожденной текучестью, течет, словно часть прилива. Желтая бутылка тяжело сидит в вашей руке, и каждую минуту вы чувствуете, как будто гора оседает. Наконец, белая бутылка звенит звоном колоколов, сверкая зеркальным блеском. Если вы объедините их в правильном порядке, это принесет существенные преимущества для вашего развития. К сожалению, из его записей сохранился лишь один отрывок: \n\"Белое зелье не первое. Красное зелье находится перед желтым зельем. Зелёное зелье находится не перед белым, а перед жёлтым. Синее зелье должно идти вторым.\""
 POD_mummy_elixir_of_eternal_life_journeys.29.e:0 "Хм, возможно, тот, а потом тот..."
 POD_mummy_elixir_of_eternal_life_journeys.29.effect.failure:0 "При вспышке из него вырывается шлейф дыма."
 POD_mummy_elixir_of_eternal_life_journeys.29.effect.success:0 "Со вспышкой становится идеально прозрачным"
 POD_mummy_elixir_of_eternal_life_journeys.29.t:0 "Правильный порядок"
 POD_mummy_elixir_of_eternal_life_journeys.30.a:0 "Полынь, спорыш, жемчужная пыль, лунная роса, порошок рыбы фугу."
 POD_mummy_elixir_of_eternal_life_journeys.30.b:0 "Жемчужная пыль, лунная роса, листья теневого цветка, змеиная желчь, порошок рыбы фугу."
 POD_mummy_elixir_of_eternal_life_journeys.30.c:0 "Листья теневого цветка, порошок рыбы фугу, медовая вода, жемчужная пыль, лунная роса."
 POD_mummy_elixir_of_eternal_life_journeys.30.d:0 "Лунная роса, листья теневого цветка, порошок рыбы фугу, медовая вода, жемчужная пыль."
 POD_mummy_elixir_of_eternal_life_journeys.30.desc:0 "После обширных исследований и отправки своих агентов повсюду вы получили древнюю книгу алхимических рецептов, хотя большинство ее устаревших страниц не подлежат восстановлению. На первой странице перечислены полынь, спорыш, жемчужная пыль, паучий ихор, лунная роса, листья теневого цветка, порошок рыбы фугу, змеиная желчь, медовая вода и лягушачьи глаза. Лунная роса — особенно странный ингредиент, поскольку сама по себе представляет собой жидкую смесь нескольких других ингредиентов, и ее было трудно достать. Единственный сохранившийся рецепт, похоже, был написан поэтически. Однако расшифровка может принести значительную пользу и позволить сварить очень мощный эликсир.\n\n\"Пять следует отбросить.\nЧтобы начать варку, вы не должны выбирать ни один из концов\nВторой с краю — лишь один из двух поможет \nВам не понадобятся никакие существа земли\nИ только одно растение протянет руку помощи\nТри нужны тебе, и все стоят подряд\nПоследний — это порошок, выращенный в водном рассоле\nЧтобы приготовить эликсир, добавьте соседей и хорошо перемешайте по часовой стрелке\nДалее добавьте жидкость, и должны появиться пузырьки\nПоследний ингредиент посыпь сверху и перемешай\nТеперь пора выпить до дна.\""
 POD_mummy_elixir_of_eternal_life_journeys.30.e:0 "Щепотка того и щепотка того..."
 POD_mummy_elixir_of_eternal_life_journeys.30.effect.failure:0 "При вспышке он сгорает"
 POD_mummy_elixir_of_eternal_life_journeys.30.effect.success:0 "Со вспышкой становится идеально прозрачным"
 POD_mummy_elixir_of_eternal_life_journeys.30.t:0 "Странные ингредиенты"
 POD_mummy_elixir_of_eternal_life_journeys.31.a:0 "Золотой шлемник"
 POD_mummy_elixir_of_eternal_life_journeys.31.b:0 "Петрушка"
 POD_mummy_elixir_of_eternal_life_journeys.31.c:0 "Псионная соль"
 POD_mummy_elixir_of_eternal_life_journeys.31.d:0 "Скелетная фиалка"
 POD_mummy_elixir_of_eternal_life_journeys.31.desc:0 "После обширных исследований и отправки своих агентов повсюду вы получили единственный флакон. Когда его откупоривают, из загадочной жидкости внутри поднимается коктейль ароматов, очевидно, это зелье, которое готовится. Судя по вашему опыту пивоварения и слухам, собранным вашими агентами, во флаконе не хватает только одного ингредиента. Рядом с флаконом в тайнике находился набор из 7 ингредиентов: гарнизонный корень, масло радужного платана, псионная соль, петрушка, скелетная фиалка, золотой шлемник, львиный зев. Каждый ингредиент будет придавать флакону разный эффект, а добавление нескольких ингредиентов может привести к взрыву всей смеси. К сожалению, для завершения текущего эксперимента вам понадобится именно приворотное зелье. Однако все сохранившиеся записи написаны стенографически, и чернила выцвели за долгие годы, пока они оставались без присмотра. Либо так, либо автор не был обучен правильной каллиграфии.\n\nGldn ht drns fyr and prmots yin. Rnbw yl trgrs cmbstn in jain from sn. Erb tsts gud fr sup, lv it. Rd Npdrg prvd brth of fyr. Grsnrt prvnt gngrne in wuwnds. Cyon s curus rsidu frm ndrgnd lks; prmots obsshon wt tgt. Prpls eet meet dislvd bye its hcid."
 POD_mummy_elixir_of_eternal_life_journeys.31.e:0 "Попробуйте добавить их все"
 POD_mummy_elixir_of_eternal_life_journeys.31.effect.failure:0 "Он поднимает облако обжигающего дыма"
 POD_mummy_elixir_of_eternal_life_journeys.31.effect.success:0 "С хлопком появляется пузырь в форме сердца."
 POD_mummy_elixir_of_eternal_life_journeys.31.t:0 "Странные напитки"
 POD_mummy_elixir_of_eternal_life_journeys.32.a:0 "Если бы он был мудрее, он мог бы помочь им и сохранить свои силы."
 POD_mummy_elixir_of_eternal_life_journeys.32.b:0 "Отказавшись от бессмертия, он превзошел самость, которая его искала."
 POD_mummy_elixir_of_eternal_life_journeys.32.c:0 "Видимая жертва – единственный путь к трансцендентности"
 POD_mummy_elixir_of_eternal_life_journeys.32.d:0 "Мир наказывает добродетель и щедрость."
 POD_mummy_elixir_of_eternal_life_journeys.32.desc:0 "В своем последнем путешествии вы отыскали древнюю устную легенду, которая, как предполагается, содержит один из секретов вознесения. Найти рассказчика, который знал бы это, было чрезвычайно сложно и в конечном итоге привело вас к старухе. Пока ее тело терпело неудачу, ей не составило труда пересказать эту историю. \n\n\"Много лет и династий назад жил практик самосовершенствования по имени Цзянь. Как и многие другие, он искал Небесные Врата, чтобы подняться за пределы смертных границ. Сто лет он медитировал на самой высокой вершине, ни разу не разговаривая ни с одной душой. Он усовершенствовал свое ядро ​​до такой степени, что даже ветер не осмелился коснуться его. Однажды зимой духовная метель, питаемая отчаянием земли, поглотила гору. Среди безумия, но совершенно нетронутого, Цзянь достиг всего, чего искал, и наконец предстал перед Вратами. Однако ветры донесли крики голодающей деревни у подножия горы, застывшей в свирепой метели. Одним лишь шагом он мог бы подняться. Оставь их, и вознесение досталось ему. Останься, и буря поглотит большую часть его с трудом заработанного развития. Помогите им, и это будет стоить еще дороже.\nНе раздумывая, Цзянь спустился с горы. Он дал им огненные камни, чтобы согреть их, талисманы, чтобы защитить их, и, в конце концов, свое собственное дыхание, согревающее их тела, в то время как его собственное остывает. Метель, разгневанная кражей своих жертв, обрушила на него всю свою силу, и его культивирование раскололось, как тонкий лед. На рассвете буря мгновенно утихла, ее голод был утолен не отчаянием, а подавлен щедростью. Тем не менее Врата стояли на вершине и ждали, но Цзянь больше не мог их видеть. Когда солнечный свет осветил его, его тело превратилось в пыль, и каждый из его долгих лет настигал его в мгновение ока. Последним, что исчезло, была его улыбка. \"\n\nКакой урок вы извлекли из этой истории?"
 POD_mummy_elixir_of_eternal_life_journeys.32.e:0 "Действительно сложный вопрос"
 POD_mummy_elixir_of_eternal_life_journeys.32.effect.failure:0 "Кажется, этот урок не поможет вашим усилиям"
 POD_mummy_elixir_of_eternal_life_journeys.32.effect.success:0 "Применение этого урока улучшит ваше собственное совершенствование."
 POD_mummy_elixir_of_eternal_life_journeys.32.t:0 "Спуск с вершины"
 POD_mummy_elixir_of_eternal_life_journeys.33.a:0 "Только дурак поклоняется слепо, и даже мудрые делают сомнительный выбор."
 POD_mummy_elixir_of_eternal_life_journeys.33.b:0 "Если бы бессмертная осталась, болезнь не вернулась бы"
 POD_mummy_elixir_of_eternal_life_journeys.33.c:0 "Страдания — необходимая цена за прогресс"
 POD_mummy_elixir_of_eternal_life_journeys.33.d:0 "Стремление к знаниям порождает жестокость"
 POD_mummy_elixir_of_eternal_life_journeys.33.desc:0 "В своем последнем путешествии вы отыскали древнюю устную легенду, которая, как предполагается, содержит один из секретов вознесения. Найти рассказчика, который знал бы об этом, было чрезвычайно сложно и в конечном итоге привело вас к травнику в маленьком городке. Измельчая травы и продавая сельским жителям таблетки, он декламировал историю, переданную ему от его хозяина. \n\n\"Много лет и династий назад одна из Восьми Бессмертных странствовала по землям и наткнулась на город, охваченный смертельной болезнью. Больные заполонили улицы, и среди них был алхимик, испытывавший на умирающих недоказанные эликсиры. Некоторых удалось спасти, в то время как конец других был ускорен или стал гораздо более мучительным. Когда Бессмертная увидела это, она заявила: «Играть жизнью — значит игнорировать повеление Небес». Стремиться к яркому свету желаемого будущего, не заботясь о рисках, — значит поджечь лес». Одним вздохом она полностью вылечила город, но обрушила на алхимика всю причиненную им агонию. Он бродил по земле как сумасшедший, его чувства поглощала боль. Город радовался, восхваляя ее милосердие.\nОднако со временем пришла еще одна болезнь, и ни один из целителей не осмелился рискнуть ошибиться. Они цеплялись за то, что было известно, парализованные страхом. Многие из тех, кто мог бы быть спасен, вместо этого были похоронены с молитвами. \"\n\nКакой урок вы извлекли из этой истории?"
 POD_mummy_elixir_of_eternal_life_journeys.33.e:0 "Действительно сложный вопрос"
 POD_mummy_elixir_of_eternal_life_journeys.33.effect.failure:0 "Кажется, этот урок не поможет вашим усилиям"
 POD_mummy_elixir_of_eternal_life_journeys.33.effect.success:0 "Применение этого урока улучшит ваше собственное совершенствование."
 POD_mummy_elixir_of_eternal_life_journeys.33.t:0 "Бессмертный и Целитель"
 POD_mummy_elixir_of_eternal_life_journeys.34.a:0 "Всегда разрушайте то, что существует, чтобы можно было построить что-то лучшее."
 POD_mummy_elixir_of_eternal_life_journeys.34.b:0 "Преобразуйте себя, чтобы успех стал неизбежным"
 POD_mummy_elixir_of_eternal_life_journeys.34.c:0 "Не обращайте внимания на предупреждения других, потому что они дураки."
 POD_mummy_elixir_of_eternal_life_journeys.34.d:0 "Прежде чем искать власти, очистите то, что вам мешает"
 POD_mummy_elixir_of_eternal_life_journeys.34.desc:0 "В своем последнем путешествии вы отыскали древнюю устную легенду, которая, как предполагается, содержит один из секретов вознесения. Найти рассказчика, который знал бы об этом, было чрезвычайно сложно и в конечном итоге привело вас к старому фермеру. Его спина сгорбилась, а кожа потемнела от многих лет ухода за посевами. С каждым ударом мотыги он передавал историю, которую узнал от своего деда. \n\n\"После многих долгих лет боев солдат ушел из армии и скитался по земле. Он наткнулся на бесплодную долину, заросшую древней растительностью. Река в долине бушевала, разрывая все на своем пути. Почва была усыпана валунами, способными сломать плуг, а металл отравил землю. Вместо того чтобы проклинать судьбу, он срубил деревья одно за другим, хотя его топор трижды сломался. Он отводил воду через терпеливо вырезанные каналы, хотя наводнения каждый сезон сводили на нет его работу. Он разбивал камни огнем и молотом, хотя его руки кровоточили. Он выщелачивал токсины, сажая грибы и разбрасывая древесный уголь, хотя каждый сезон видел только увядание того, что было посажено.\nПрошли годы, прежде чем он посеял хоть одно семя. Многие смеялись, потому что видели только труд и никаких плодов, но он никогда не колебался. Когда наконец долина смягчилась, он посадил. Когда шли дожди, они питали, а не разрушали. С приближением осени он собрал урожай, достаточно большой, чтобы прокормить десять деревень. \"\n\nКакой урок вы извлекли из этой истории?"
 POD_mummy_elixir_of_eternal_life_journeys.34.e:0 "Действительно сложный вопрос"
 POD_mummy_elixir_of_eternal_life_journeys.34.effect.failure:0 "Кажется, этот урок не поможет вашим усилиям"
 POD_mummy_elixir_of_eternal_life_journeys.34.effect.success:0 "Применение этого урока улучшит ваше собственное совершенствование."
 POD_mummy_elixir_of_eternal_life_journeys.34.t:0 "Сейте и пожинайте"
 POD_mummy_elixir_of_eternal_life_journeys.35.a:0 "Уверенность"
 POD_mummy_elixir_of_eternal_life_journeys.35.b:0 "Здравомыслие"
 POD_mummy_elixir_of_eternal_life_journeys.35.c:0 "Мудрость"
 POD_mummy_elixir_of_eternal_life_journeys.35.d:0 "Смирение"
 POD_mummy_elixir_of_eternal_life_journeys.35.desc:0 "В поисках эзотерических записей об эликсире вечной жизни вы нашли доказательства того, что некоторые подсказки скрыты в древнем храме. Бог или боги, которым поклонялись внутри, давно забыты. Даже его предназначение как храма является лишь предположением. Около полудня вы, наконец, доберетесь до храма, погребенного под бесчисленными веками зарослей леса. \n\nДвери открываются в страну вечной ночи, но не тьмы. Мерцающий свет бесчисленных звезд разгоняет тени, оставленные деревьями, во много раз превышающими ваш собственный рост. Сквозь ветви высоко над вашей головой струится нежный свет, играя на цветущих полевых цветах. Там, где обычно ожидаются призрачные звери и где обычно прячутся скрытые хищники, есть только радостные силуэты, отбрасываемые звездами, прыгающие среди калейдоскопа цветов. Птицы, лягушки, сверчки и многие другие, которых вы не можете назвать, объединяются в гармонии, потерянной для человечества, ни одна из которых не подавляет другую, а скорее один великий оркестр, вспоминающий песню давно минувших дней. \n\nНа дальней стороне находится запертая дверь. На перемычке написано: \nЧто такое, если вы утверждаете, что имеете это, но вам этого не хватает? \nЕсли вам кажется, что вам этого недостаёт, вы можете это иметь."
 POD_mummy_elixir_of_eternal_life_journeys.35.e:0 "Несет ли окружающая среда подсказку?"
 POD_mummy_elixir_of_eternal_life_journeys.35.effect.failure:0 "Двери исчезают в деревьях"
 POD_mummy_elixir_of_eternal_life_journeys.35.effect.success:0 "Двери распахиваются"
 POD_mummy_elixir_of_eternal_life_journeys.35.t:0 "Забытые чудеса"
 POD_mummy_spell_of_life_journeys.10.a:0 "Как коллега-ученый, пожалуйста, научите меня"
 POD_mummy_spell_of_life_journeys.10.b:0 "Что, если я помогу твоему народу?"
 POD_mummy_spell_of_life_journeys.10.c:0 "Гор дал мне разрешение"
 POD_mummy_spell_of_life_journeys.10.critical.failure.effect.desc:0 "мне не удается его переубедить"
 POD_mummy_spell_of_life_journeys.10.desc:0 "Упуаут не владеет Заклинанием Жизни. Однако он знает об этом достаточно, чтобы дать некоторые идеи, которые помогут вашим собственным усилиям. Мало что может помочь лучше, чем услышать тот же материал от другого человека. \n\n Таким образом, вы разыскали Упуаута и нашли его среди кружащихся песков Африки. Когда-то он был одним из величайших воинов Безмолвных Странников, кровным братом Шу Гора и дипломатом Шемсу-Геру. Он помогал своему народу вести великие битвы против культа Сутеха на землях Кхема. Теперь он живет среди руин своего народа в чужой стране, отрезанный от духов своих предков проклятием Сета. Он пытался обмануть проклятие, служа Гору, но дух Сова наказал его за нарушение плана Геи. Ему остается попытаться сохранить историю и знания своего народа в той, хотя и вечной, жизни, которая у него осталась. Как единственный, кто способен слышать предков племени, он существует между жизнью и смертью, направляя свой народ, общаясь с духами на их племенной родине и пытаясь воскресить воспоминания об их былой славе со времен Кхема. \n\nСреди знаний Упуаута есть несколько фрагментов, касающихся Заклинания Жизни. Однако он безмерно лоялен к Гору, который запрещает делиться такими подробностями. Кроме того, его история заставила его недоверчиво относиться к незнакомцам. Вам нужно будет убедить его научить вас."
 POD_mummy_spell_of_life_journeys.10.effect.success.desc:0 "Мне удаётся его убедить"
 POD_mummy_spell_of_life_journeys.10.t:0 "Уроки Упуаута"
 POD_mummy_spell_of_life_journeys.11.a:0 "Позвольте мне медитировать рядом с вами"
 POD_mummy_spell_of_life_journeys.11.b:0 "Ничто не сравнится с настоящей философской дискуссией."
 POD_mummy_spell_of_life_journeys.11.desc:0 "Миларепа не является держателем Заклинания Жизни. Однако он знает об этом достаточно, чтобы дать некоторые идеи, которые помогут вашим собственным усилиям. Мало что помогает лучше, чем услышать тот же материал от другого человека.\n\nТаким образом, вы разыскали Миларепу и нашли его среди высоких вершин Гималаев. Когда-то Хетамон был философом и магом при дворе Осириса, получившим Становление ради сохранения своих умений. Один из немногих потомков Осириса, переживших битву у Месты, Хетамон повел Детей Осириса в духовное путешествие на восток, следуя по стопам собственного путешествия Осириса. Когда Осирис вернулся, он пришел с учением Бардо, и поэтому Хетамон искал тот же источник просветления. Своего учителя сопровождал поэт-колдун Миларепа, ученик Хетамона. Отдыхая в Гималаях, Миларепа помог Звездочётам, друзьям Безмолвных Странников и племени друга Миларепы Юстиниана, убить зверя по имени Нексусный ползун и в конце концов достиг собственного просветления, состояния под названием Голконда.\n\nБлагодаря работе вместе с мистиками Шемсу-Геру и культом Исиды, он узнал некоторые фрагменты, касающиеся Заклинания Жизни. Однако он предан силам Осириса, и он считает, что многие сверхъестественные существа в лучшем случае заблуждаются. Вам нужно будет доказать, что вы соответствуете его этическим, интеллектуальным и метафизическим стандартам."
 POD_mummy_spell_of_life_journeys.11.t:0 "Уроки Миларепы"
 POD_mummy_spell_of_life_journeys.12.a:0 "У меня есть своя коллекция"
 POD_mummy_spell_of_life_journeys.12.b:0 "Я могу профинансировать твои усилия"
 POD_mummy_spell_of_life_journeys.12.c:0 "Я отказываюсь помогать такому человеку"
 POD_mummy_spell_of_life_journeys.12.critical.failure.effect.desc:0 "Он отражает ваше нападение"
 POD_mummy_spell_of_life_journeys.12.desc:0 "Астрохен не владеет Заклинанием Жизни. Однако он знает об этом достаточно, чтобы дать некоторые идеи, которые помогут вашим собственным усилиям. Мало что поможет лучше, чем услышать тот же материал от другого человека. \n\n Таким образом, вы разыскали Астрохена и нашли его прячущимся среди зыбучих песков Африки. Когда-то Астрохен был магом в землях Кхема, искавшим бессмертия. В своем высокомерии он приказал Гору использовать на нем Заклинание Жизни, что закончилось плохо. После многих лет поисков он наткнулся на записи другого мага, называющего себя Гермесом. Используя все свои ресурсы, чтобы следовать по давно мертвому следу, Астрохен в конце концов нашел \"Гермеса\", которым оказался Кабир, маг, который, по-видимому, собрал (или украл) Заклинание Жизни. Когда Гор обнаружил, что Астрохен обрёл бессмертие, он проклял его, обязав вечно защищать мощные артефакты Гора и приобретать дополнительные артефакты, нуждающиеся в защите. Собственная любовь Астрохена к тайнам и скрытым знаниям усилила проклятие, гарантируя, что он провел бесчисленные столетия в поисках древних фолиантов и скрытых сил. Мораль никогда не имела для него большого значения. \n\nСреди этих тайн есть несколько фрагментов, касающихся Заклинания Жизни. Кроме проклятия, его ничто не связывает с Гором. Если вы удовлетворите нужды проклятия и временно облегчите его бремя, он, возможно, согласится расстаться с некоторыми лакомыми кусочками информации."
 POD_mummy_spell_of_life_journeys.12.effect.success.desc:0 "Вы побеждаете Астрохена и совершаете набег на его хранилища."
 POD_mummy_spell_of_life_journeys.12.t:0 "Уроки Астрохена"
 POD_mummy_spell_of_life_journeys.13.a:0 "Я уже связан сделкой с Идраном"
 POD_mummy_spell_of_life_journeys.13.b:0 "Я клянусь служить этому делу"
 POD_mummy_spell_of_life_journeys.13.c:0 "Нужны ли им какие-то ресурсы?"
 POD_mummy_spell_of_life_journeys.13.desc:0 "Инаухатен не владеет Заклинанием Жизни. Однако он знает об этом достаточно, чтобы дать некоторые идеи, которые помогут вашим собственным усилиям. Мало что может помочь лучше, чем услышать тот же материал от другого человека. \n\n Таким образом, вы разыскали Инаухатена и нашли его среди множества скрытых пещер Гималайских гор. Когда-то смертный архитектор, но Культ Исиды превратил его в Мумию, и он решил потратить свое обретенное бессмертие на изучение смерти и загробной жизни. Со временем он решил, что крестовый поход Гора против Сета был отвлечением от более важных дел: наблюдения за величественным, лишённым солнца городом среди мёртвых, дерзко парящим над концом всего сущего. Впечатленный их знаниями о Некромантии, Инаухатен предложил сделку культу магов. В обмен на их помощь в уходе за забытым городом он использовал фрагментированную версию Заклинания Жизни, чтобы превратить Идранов в ямасаттв. Через них он связался с древней сектой вампиров, поклонявшейся Патриархам. Он рассказал им о Загробном мире и его правительстве. Он привел их к городу и помог им захватить его. Он подарил им серию томов, в которых отражен его тысячелетний опыт некромантской практики. Он помог им собрать один из самых полных архивов ранней истории каинитов в мире, размер которого превосходил даже легендарную Библиотеку забытых. Он осветил путь Тал'махе'Ра и направил их на курс, от которого они не могли отклониться.\n\nХотя он знает только испорченную форму Заклинания Жизни, он мог бы многому вас научить. Однако вам, возможно, придется заключить с ним сделку, как давным-давно это сделали Идран."
 POD_mummy_spell_of_life_journeys.13.t:0 "Уроки Инаухатена"
 POD_mummy_spell_of_life_journeys.14.a:0 "Он дружелюбный человек. Давай попробуем поговорить"
 POD_mummy_spell_of_life_journeys.14.b:0 "Он может быть верным, но он все равно чувствует боль..."
 POD_mummy_spell_of_life_journeys.14.desc:0 "Места не владеет Заклинанием Жизни. Однако он знает об этом достаточно, чтобы дать некоторые идеи, которые помогут вашим собственным усилиям. Мало что поможет лучше, чем услышать тот же материал от другого человека. \n\n Таким образом, вы разыскали Месту и нашли его живущим на тихой ферме недалеко от реки Нил. Когда-то он был простым фермером в Нижнем Ниле, обрабатывая ту же землю, что и его отец, отец своего отца, на протяжении многих поколений. Его сыновья служили в смертных армиях Осириса и Гора, храбрые, ревностные и в конечном итоге мертвые. Его второй сын привёл Исиду и Гора на ферму Месты, и тот дал им приют. Места принес в жертву быка, кровь которого способствовала выздоровлению Осириса. Он наблюдал за созданием и подготовкой «Заклинания Жизни». Когда Исида не захотела испытать заклинание на своем раненом сыне, Места предложил пройти его, принял яд, чтобы остановить своё сердце, почувствовал, как его Ба перешел в мир духов, и впервые возродился. Он был свидетелем ритуала, даровавшего Гору вечную жизнь. Пока его бессмертие продолжалось, он служил доверенным лицом Осириса в тех редких случаях, когда его хозяин покидал Аменти.\n\nЗа свои тысячелетия он повидал многое, дав ему несколько фрагментов знаний о Заклинании Жизни. Однако его преданность Осирису и Гору абсолютна."
 POD_mummy_spell_of_life_journeys.14.t:0 "Уроки Месты"
 POD_mummy_spell_of_life_journeys.20.a:0 "Давайте попробуем это"
 POD_mummy_spell_of_life_journeys.20.b:0 "Я сдаюсь!"
 POD_mummy_spell_of_life_journeys.20.desc:0 "Ваши усилия привели к неким эзотерическим записям неизвестного возраста. Несмотря на ваше знание нескольких языков и лингвистические способности ваших придворных, ваших совместных усилий оказалось недостаточно, чтобы расшифровать их. Невидимые чернила скрывают важные детали. Зашифрованные слова испещряют текст. Части, написанные на знакомом языке, с трудом поддаются интерпретации и требуют технического и магического мастерства, которого вы только начинаете достигать. Авторские сокращения только еще больше усложняет ваши усилия по переводу. \n\nОдно конкретное слово из пяти букв, похоже, является ключом к переводу остальной части. К сожалению, у вас будет только 6 возможностей, поскольку ваши усилия весьма разрушительны."
 POD_mummy_spell_of_life_journeys.20.effect.failure:0 "Ваш перевод не удался"
 POD_mummy_spell_of_life_journeys.20.effect.failure.details:0 "Ваши неудачные попытки уничтожили записи"
 POD_mummy_spell_of_life_journeys.20.effect.success:0 "Ваш перевод успешен"
 POD_mummy_spell_of_life_journeys.20.t:0 "[Concept('translation_minigame', 'Перевод')|E] эзотерических записей"
 POD_mummy_spell_of_life_journeys.21.a:0 "Я выбираю красные врата"
 POD_mummy_spell_of_life_journeys.21.b:0 "Я выбираю зелёные врата"
 POD_mummy_spell_of_life_journeys.21.c:0 "Я выбираю синие врата"
 POD_mummy_spell_of_life_journeys.21.desc:0 "В поисках эзотерических записей о Заклинании Жизни вы узнали, что некоторые подсказки скрыты в древнем храме. Но внутри ждёт смертельное испытание: жрецы строго судили о том, кто достоин их священных тайн. За алтарём вы находите потайной люк, ведущий во тьму. Пройдя лабиринт узких туннелей, вы выходите в большую круглую камеру. Перед вами трое врат, словно вырезанных из чистой тьмы пустоты и обрамлённых золотой гравировкой. Над каждыми — голова: красная, зелёная и синяя. Вы запускаете невидимый механизм, и все три головы начинают говорить в унисон.\n\n\"Внемлите нам, искатели запретного знания.\nПеред вами пути суда.\nИз голосов, что ныне обращаются к вам, хотя бы один говорит только правду,\nи хотя бы один говорит только ложь.\nЗнайте также: лишь одна дверь ведёт дальше,\nа две другие сулят только смерть — быструю, верную и окончательную.\nПеред вами вечность или гибель.\nВыбирайте путь осторожно.\"\n\nКрасная голова говорит: \"Над безопасным путём находится лживая голова.\"\nЗелёная голова говорит: \"Красная голова говорит только правду.\"\nСиняя голова говорит: \"Над безопасным путём находится красная голова.\""
 POD_mummy_spell_of_life_journeys.21.effect.success:0 "Путь ведет к знаниям"
 POD_mummy_spell_of_life_journeys.21.t:0 "Разветвленные пути"
 POD_mummy_spell_of_life_journeys.22.desc:0 "В поисках эзотерических записей о Заклинании Жизни вы узнали, что некоторые подсказки скрыты в древнем храме. Но внутри ждёт смертельное испытание: жрецы строго судили о том, кто достоин их священных тайн. За алтарём вы находите потайной люк, ведущий во тьму. Пройдя лабиринт узких туннелей, вы выходите в большую круглую камеру. Перед вами трое врат, словно вырезанных из чистой тьмы пустоты и обрамлённых золотой гравировкой. Над каждыми — голова: красная, зелёная и синяя. Вы запускаете невидимый механизм, и все три головы начинают говорить в унисон.\n\n\"Внемлите нам, искатели запретного знания.\nПеред вами пути суда.\nИз голосов, что ныне обращаются к вам, хотя бы один говорит только правду,\nи хотя бы один говорит только ложь.\nЗнайте также: лишь одна дверь ведёт дальше,\nа две другие сулят только смерть — быструю, верную и окончательную.\nПеред вами вечность или гибель.\nВыбирайте путь осторожно.\"\n\nКрасная голова говорит: \"Над безопасным путём находится зелёная голова.\"\nСиняя голова говорит: \"Зелёная голова говорит только ложь.\"\nЗелёная голова молчит."
 POD_mummy_spell_of_life_journeys.23.desc:0 "В поисках эзотерических записей о Заклинании Жизни вы узнали, что некоторые подсказки скрыты в древнем храме. Но внутри ждёт смертельное испытание: жрецы строго судили о том, кто достоин их священных тайн. За алтарём вы находите потайной люк, ведущий во тьму. Пройдя лабиринт узких туннелей, вы выходите в большую круглую камеру. Перед вами трое врат, словно вырезанных из чистой тьмы пустоты и обрамлённых золотой гравировкой. Над каждыми — голова: красная, зелёная и синяя. Вы запускаете невидимый механизм, и все три головы начинают говорить в унисон.\n\n\"Внемлите нам, искатели запретного знания.\nПеред вами пути суда.\nИз голосов, что ныне обращаются к вам, хотя бы один говорит только правду,\nи хотя бы один говорит только ложь.\nЗнайте также: лишь одна дверь ведёт дальше,\nа две другие сулят только смерть — быструю, верную и окончательную.\nПеред вами вечность или гибель.\nВыбирайте путь осторожно.\"\n\nКрасная голова говорит: \"Только одна голова лжёт.\"\nЗелёная голова говорит: \"Только одна голова говорит правду.\"\nСиняя голова говорит: \"Над безопасным путём находится лживая голова.\""
 POD_mummy_spell_of_life_journeys.24.desc:0 "В поисках эзотерических записей о Заклинании Жизни вы узнали, что некоторые подсказки скрыты в древнем храме. Но внутри ждёт смертельное испытание: жрецы строго судили о том, кто достоин их священных тайн. За алтарём вы находите потайной люк, ведущий во тьму. Пройдя лабиринт узких туннелей, вы выходите в большую круглую камеру. Перед вами трое врат, словно вырезанных из чистой тьмы пустоты и обрамлённых золотой гравировкой. Над каждыми — голова: красная, зелёная и синяя. Вы запускаете невидимый механизм, и все три головы начинают говорить в унисон.\n\n\"Внемлите нам, искатели запретного знания.\nПеред вами пути суда.\nИз голосов, что ныне обращаются к вам, хотя бы один говорит только правду,\nи хотя бы один говорит только ложь.\nЗнайте также: лишь одна дверь ведёт дальше,\nа две другие сулят только смерть — быструю, верную и окончательную.\nПеред вами вечность или гибель.\nВыбирайте путь осторожно.\"\n\nКрасная голова говорит: \"Синяя голова говорит только ложь.\"\nЗелёная голова говорит: \"Синяя голова говорит только правду.\"\nСиняя голова говорит: \"Над безопасным путём находится лживая голова.\""
 POD_mummy_spell_of_life_journeys.25.desc:0 "В поисках эзотерических записей о Заклинании Жизни вы узнали, что некоторые подсказки скрыты в древнем храме. Но внутри ждёт смертельное испытание: жрецы строго судили о том, кто достоин их священных тайн. За алтарём вы находите потайной люк, ведущий во тьму. Пройдя лабиринт узких туннелей, вы выходите в большую круглую камеру. Перед вами трое врат, словно вырезанных из чистой тьмы пустоты и обрамлённых золотой гравировкой. Над каждыми — голова: красная, зелёная и синяя. Вы запускаете невидимый механизм, и все три головы начинают говорить в унисон.\n\n\"Внемлите нам, искатели запретного знания.\nПеред вами пути суда.\nИз голосов, что ныне обращаются к вам, хотя бы один говорит только правду,\nи хотя бы один говорит только ложь.\nЗнайте также: лишь одна дверь ведёт дальше,\nа две другие сулят только смерть — быструю, верную и окончательную.\nПеред вами вечность или гибель.\nВыбирайте путь осторожно.\"\n\nКрасная голова говорит: \"Над безопасным путём находится другая голова.\"\nЗелёная голова говорит: \"Другая голова говорит только правду.\"\nСиняя голова говорит: \"Другая голова сказала «другая голова».\""
 POD_mummy_spell_of_life_journeys.26.desc:0 "В поисках эзотерических записей о Заклинании Жизни вы узнали, что некоторые подсказки скрыты в древнем храме. Но внутри ждёт смертельное испытание: жрецы строго судили о том, кто достоин их священных тайн. За алтарём вы находите потайной люк, ведущий во тьму. Пройдя лабиринт узких туннелей, вы выходите в большую круглую камеру. Перед вами трое врат, словно вырезанных из чистой тьмы пустоты и обрамлённых золотой гравировкой. Над каждыми — голова: красная, зелёная и синяя. Вы запускаете невидимый механизм, и все три головы начинают говорить в унисон.\n\n\"Внемлите нам, искатели запретного знания.\nПеред вами пути суда.\nИз голосов, что ныне обращаются к вам, хотя бы один говорит только правду,\nи хотя бы один говорит только ложь.\nЗнайте также: лишь одна дверь ведёт дальше,\nа две другие сулят только смерть — быструю, верную и окончательную.\nПеред вами вечность или гибель.\nВыбирайте путь осторожно.\"\n\nКрасная голова говорит: \"Безопасный путь лежит под единственной головой, говорящей правду.\"\nЗелёная голова говорит: \"Только одна голова говорит правду.\"\nСиняя голова говорит: \"Над безопасным путём находится красная голова.\""
 POD_mummy_spell_of_life_journeys.27.a:0 "Я собираю свою волю..."
 POD_mummy_spell_of_life_journeys.27.desc:0 "Вы проходите между золотыми гравюрами и входите в пустоту, позволяя ей поглотить вас. Тьма тянет вас за собой, распутывая ваше тело, как свободно связанный клубок пряжи. На руке, которую вы держите перед лицом, ваши пальцы вытягиваются, как будто натянута нить. Несмотря на то, что в этой бесконечной пустоте вам не с чем сравнивать себя, вы знаете, что ваше тело становится длиннее и тоньше, растягивается и скручивается, скручивается и поворачивается. На ткацком станке пространства ваша нить вытягивается и вплетается в новое место, когда ваше тело покидает храм. \n\nВы знаете, что ваш единственный шанс — это восстановить свое тело вокруг вашего разума и воли, чтобы вы могли продвигаться дальше в храм."
 POD_mummy_spell_of_life_journeys.27.effect.failure:0 "Храм тебя выплевывает"
 POD_mummy_spell_of_life_journeys.27.effect.success:0 "Вы получаете свой приз"
 POD_mummy_spell_of_life_journeys.27.t:0 "Путь Тьмы"
 POD_mummy_spell_of_life_journeys.28.a:0 "Нажмите кнопки восьмиугольника, квадрата и вертикальной линии."
 POD_mummy_spell_of_life_journeys.28.b:0 "Нажмите квадратную кнопку"
 POD_mummy_spell_of_life_journeys.28.c:0 "Нажмите кнопку параллельной линии"
 POD_mummy_spell_of_life_journeys.28.d:0 "Нажмите кнопки квадрата, параллельной и вертикальной линии."
 POD_mummy_spell_of_life_journeys.28.desc:0 "В поисках эзотерических записей в Заклинании Жизни вы нашли доказательства того, что некоторые подсказки скрыты в древней гробнице. Исторические записи различаются относительно его жителей. Некоторые говорят, что там похоронен маг или колдун. Возможно, остатки лича поместили туда его последователи. Другие говорят, что мумия, возможно, сам Гор, когда-то хранила своё тело в этой гробнице между перерождениями. Независимо от правды, среди трупов лежат улики. \n\nПосле того, как вы разбили камни, от которых отпадало больше лет, чем вы видели, как падают листья, вы попадаете в странную пещеру. В центре стоит странный постамент, а четыре саркофага стоят вертикально, выровненные по сторонам света. На вершине постамента находится свиток в запечатанном контейнере, а по бокам постамента торчат четыре кнопки. На их гранях изображены восьмиугольник, квадрат, две параллельные линии, идущие от верхнего левого угла к правому нижнему, и вертикальная линия. По комнате разбросаны странные фразы, начертанные на саркофагах, вырезанные на полу, напечатанные на стенах. \"Грохот костей\" появляется 4 раза. \"Проклятые кости\" появляется 4 раза. \"Запертая гибель\" появляется 3 раза."
 POD_mummy_spell_of_life_journeys.28.e:0 "Нажмите кнопки восьмиугольника, параллельной и вертикальной линии."
 POD_mummy_spell_of_life_journeys.28.effect.success:0 "Контейнер отодвигается"
 POD_mummy_spell_of_life_journeys.28.f:0 "Нажмите кнопки параллельной и вертикальной линии."
 POD_mummy_spell_of_life_journeys.28.t:0 "Грохот костей"
 POD_mummy_spell_of_life_journeys.29.a:0 "Никакая антикварная статуэтка не сможет меня победить!"
 POD_mummy_spell_of_life_journeys.29.desc:0 "Когда вы начинаете вводить выбранную последовательность, пьедестал заливает оранжевое свечение. При последнем нажатии мягкое оранжевое свечение сменяется красной вспышкой и визгом со всех сторон. Резные крышки саркофагов, стоящих по сторонам света соскальзывают с болезненными стонами человека, такого же старого, как сама гробница. Из некогда скрытых глубин выходят четыре оживленные статуи в высеченных доспехах и с каменными мечами. В камень встроены человеческие кости, покрытые древними рунами, оживляющими эти гуманоидные изображения. Работая слаженно, они начинают атаковать вас, с легкостью размахивая клинками, которые весят столько же, сколько и вы."
 POD_mummy_spell_of_life_journeys.29.effect.failure:0 "Они отгоняют тебя"
 POD_mummy_spell_of_life_journeys.29.effect.success:0 "Они рушатся перед тобой"
 POD_mummy_spell_of_life_journeys.29.t:0 "Статуи поднимаются"
 POD_mummy_spell_of_life_journeys.30.a:0 "Я делаю порез и капаю кровью на печать"
 POD_mummy_spell_of_life_journeys.30.b:0 "Я заворачиваю это в папирус, чтобы прочесть."
 POD_mummy_spell_of_life_journeys.30.c:0 "Я сплю, положив голову рядом с ним"
 POD_mummy_spell_of_life_journeys.30.d:0 "Я перемещаю его под зеркала"
 POD_mummy_spell_of_life_journeys.30.desc:0 "В поисках эзотерических записей в Заклинании Жизни вы нашли доказательства того, что некоторые подсказки скрыты в древнем храме. Когда-то здесь располагался таинственный культ. Некоторые предполагают, что здешние жрецы поклонялись Осирису и Исиде, хотя их истинные боги затерялись в песках времени. Предположительно, культ подчеркивал продолжение жизни после смерти. Сегодня все, что осталось, это каменное здание их места поклонения. \n\n Под храмом похоронено сооружение, находящееся в гораздо лучшем состоянии и некогда являющееся свидетелем внутренних тайн культа. Это идеальное отражение того, что когда-то находилось над поверхностью, перевернутое вверх дном, так что, спускаясь по лестнице, вы приближаетесь к тому, что могло быть башней, устремленной к небу. На самой глубокой глубине находится идеально круглая комната. Луч света падает из ряда зеркал, спрятанных под потолком комнаты, освещая пустую часть комнаты. На удивительно лёгком постаменте в центре комнаты находится свиток папируса, древний, но нетронутый. На лицевой стороне свитка находится печать с Пером Правосудия. Ниже на пьедестале написаны слова: \"Нет ли хорошего писца и ученого человека, который мог бы прочитать это письмо, которое я принес в Египет, перед фараоном, не испортив его печати? Кто прочитает написанное внутри, не сломав воск?\""
 POD_mummy_spell_of_life_journeys.30.e:0 "Я творю заклинание, чтобы прочесть содержимое свитка"
 POD_mummy_spell_of_life_journeys.30.effect.failure:0 "Свиток рассыпается от вашего прикосновения"
 POD_mummy_spell_of_life_journeys.30.effect.success:0 "Вы запоминаете слова, которые видите"
 POD_mummy_spell_of_life_journeys.30.t:0 "Как вверху, так и внизу"
 POD_mummy_spell_of_life_journeys.31.a:0 "Раковый Мелькарт пировал"
 POD_mummy_spell_of_life_journeys.31.b:0 "Мертвый, но мечтающий"
 POD_mummy_spell_of_life_journeys.31.c:0 "Трупный циклоп утонул"
 POD_mummy_spell_of_life_journeys.31.d:0 "За жировиком выпуклое стало вогнутым, смещалось и извивалось."
 POD_mummy_spell_of_life_journeys.31.desc:0 "В поисках эзотерических записей в Заклинании Жизни вы нашли свидетельства того, что некоторые подсказки лежат погребенными среди руин города, трупные и похороненные, но не мертвые. За Столпами Мелькарта и Вратами Гадеса нечестивые существа захватили город и пировали. Их отвратительность просачивалась в поверхности, напоминающие сферы, углы, торчащие в невидимые пространства. Плоская поверхность стала наклоненной, выпуклая стала вогнутой, а углы превратились в рты. Начались кошмары, пришел Циклоп, семеро ушли, а великий жировик утонул. Ну... так говорят истории. \n\nКогда вы плывете вниз, вы видите больную каменную кладку, так похожую на знакомую архитектуру, но в то же время раковую, такую ​​твердую и все же сочащуюся, как будто слизь, вдоль береговой линии. Массы плоти и щупалец бесшумно скользят по ухмылкам лиц, покоящихся во тьме, в то время как над ними прошли столетия. Возможно, они ждут лопнувших зерен. Вы направляетесь к увенчанной монолитом цитадели, украшенной изображениями, не поддающимися описанию, и иероглифами, не поддающимися определению. На вершине находится мемориальная доска, символы которой колеблются и извиваются под вашим взглядом. \n\" Держите свой разум. Произнесите фразу.\n2-1-16 1-2-5 1-2-17\""
 POD_mummy_spell_of_life_journeys.31.e:0 "Я позволяю своей интуиции вести меня"
 POD_mummy_spell_of_life_journeys.31.effect.failure:0 "Оно ускользает от тебя"
 POD_mummy_spell_of_life_journeys.31.effect.success:0 "Тайны раскрываются в извивающихся"
 POD_mummy_spell_of_life_journeys.31.t:0 "Что осталось"
 POD_mummy_spell_of_life_journeys.32.a:0 "Заключение"
 POD_mummy_spell_of_life_journeys.32.b:0 "Конфликт"
 POD_mummy_spell_of_life_journeys.32.c:0 "Непрерывный"
 POD_mummy_spell_of_life_journeys.32.d:0 "Космический"
 POD_mummy_spell_of_life_journeys.32.desc:0 "В поисках эзотерических записей в Заклинании Жизни вы нашли доказательства того, что некоторые подсказки кроются в остатках дворянского дома. Руины погребены под землей, оставленной бесчисленными разливами близлежащей реки. В доме должна быть книга, запертая в железном ящике. В железном ящике лежит медный ящик. В медном ящике лежит ящик из можжевельника. В шкатулке из можжевельника находится шкатулка из слоновой кости и черного дерева. В шкатулке из слоновой кости и черного дерева лежит шкатулка из серебра. В ящике с серебром находится ящик с золотом, а в нем книга. \n\nВы соскребаете слои грязи и проходите через то, что когда-то было дверным проемом. Вы проходите через древние залы и спускаетесь в то, что когда-то было подвалом, а теперь представляет собой не более чем дыру, освещенную неестественным зеленым светом. И он такой зеленый, исходящий со всех сторон, но явно берущий свое начало в неровных разрывах реальности. Истории рассказывали вам о так называемой Плотине Снов. Пройдя через него, вы окажетесь на краю обрыва. Воздух гудит зеленью, которую вы видели раньше, пульсируя в такт вашему сердцебиению. Перед вами и под вами простираются шесть миль гигантских змей, крокодилов, пауков, скорпионов и всех форм рептилий и паукообразных, которые когда-либо видели или себе представляли. Они скручиваются и разворачиваются, образуя огромные живые узоры. Круги внутри кругов, хвосты касаются зубов, бесконечно пожирая себя. За Змеиным морем покоится уроборос, клыки которого впились в собственный хвост и вечно окружают ящик, который вы ищете. \n\nВ старых историях говорится, что эти существа ждут единственной команды. Одно слово, чтобы остановить их движения, изменить их образ действий, образовать мост."
 POD_mummy_spell_of_life_journeys.32.e:0 "Я сформирую восковую команду и пробью себе путь"
 POD_mummy_spell_of_life_journeys.32.effect.failure:0 "Море змей бесконечно"
