 POD_mummy_spell_of_life_journeys.40.desc:0 "В поисках эзотерических записей в Заклинании Жизни вы обнаружили доказательства того, что в затерянной пирамиде можно найти несколько подсказок. Некоторые говорят, что древние пирамиды собирали солнечный свет на своей вершине, используя его для создания реки света, по которой душа могла следовать в загробную жизнь. Однако не все считали солнечный свет лучшим путем в Земли Теней. Некоторые пытались направить темные энергии из глубоких подземелий, используя их в своих неудачных попытках создать Заклинание Жизни. Они построили перевернутую пятиугольную пирамиду, которая нырнула очень глубоко в скалу. Слухи также говорят об их одержимости ролью нумерологии в магических ритуалах, включая конкретную серию, которая служила их опознавательным знаком. \n\nВы проходите мимо входа и смотрите в пустую пустоту с пятью лестницами, ведущими вниз. Огромное пространство наполнено пустым эхом, отражающимся бесконечно. Темная пустота скрывает странные каналы, высеченные в почерневшем камне, образующем стены пирамиды. Стигийские цепи с серебряными прожилками толще ствола дерева тянутся от потолка до пола и ключевых точек стен. На каждом из 5 этажей нанесен ряд цифр. \n13\n1113\n3113\n132113\n1113122113\n\n. В самой нижней точке пирамиды находится треугольный алтарь, соединенный с каналами вдоль стен. По бокам алтаря расположены три кнопки, каждая с номером от 1 до 3."
