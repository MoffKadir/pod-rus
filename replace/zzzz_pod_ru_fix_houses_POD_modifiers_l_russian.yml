l_russian:
 dynn_fae_modifier:0 "Кит"
 dynn_fae_modifier_desc:0 "Однако вы благородная фея и не принадлежите ни к одному из благородных домов фейри. Это не помешает вам оставить свой след в мире."
 dynn_inanimae_modifier:0 "Неодушевлённые"
 dynn_inanimae_modifier_desc:0 "#italic Открывает доступ к уникальному наследию ([dynasty_perk|E]).#!\n\nНеодушевлённые — родичи истинных фей. Вы не дух стихий, хотя и состоите с ними в родстве."
 dynn_oculidei_modifier:0 "Окули Деи"
 house_brotherhood_of_the_scarlet_lantern_modifier:0 "Братство Алого Фонаря"
 house_brotherhood_of_the_scarlet_lantern_modifier_desc:0 "Жизнь слишком драгоценна, чтобы тратить ее на бессмысленные распри и ссоры. Через диалог приходит мир. И в мире ад побеждён."
 house_celestial_arrows_modifier:0 "Небесные стрелы"
 house_celestial_arrows_modifier_desc:0 "В их сердцах живет праведный огонь, опаляющий плоть демонов. Бессмертие позволяет им идти на риск, с которым смертные, обремененные инстинктами выживания, просто не могут справиться."
 house_erk_improved_modifier_tooltip:0 "Все члены Дома Эрк получат доступ к специальному отряду [men_at_arms|E]."
 house_jade_sentinels_modifier:0 "Нефритовые стражи"
 house_jade_sentinels_modifier_desc:0 "Несмотря на приближающуюся опасность, все еще есть те, кому предстоит осуществить великую судьбу. Таких людей необходимо защищать от ада и воспитывать в принятии своей судьбы, в то время как Нефритовый Страж остается полностью скрытым или стоит на страже под прикрытием дружбы."
 house_maryb_dream_modifier:0 "Возвращение мечты"
 house_maryb_dream_modifier_desc:0 "#shinygold Дом, который мы основали, с городом, который он завоевал, в качестве своей резиденции. #! Баали и Нефилимы слились, образовав нечто большее, чем любой из них мог бы достичь по отдельности. Он несет в себе силу основателя, демонстрирует репутацию диаблериста людям за пределами своих стен, вызывая в равной степени страх и преданность."
 house_othonian_modifier:0 "Дом Отонов"
 house_othonian_modifier_desc:0 "Императоры горят, империи рушатся, но гордость Александры вечна."
 house_righteous_peach_blossoms_modifier:0 "Праведные цветы персика"
 house_righteous_peach_blossoms_modifier_desc:0 "Только исцелив духовные и физические недуги мира, можно спасти Поднебесную."
 house_twilight_scholars_modifier:0 "Сумеречные ученые"
 house_twilight_scholars_modifier_desc:0 "В лучшем случае, когда они одни, они стремятся создать живые библиотеки и скрытые сокровищницы знаний, способные пережить Шестую Эпоху."
 house_white_lotus_society_modifier:0 "Общество Белого Лотоса"
 house_white_lotus_society_modifier_desc:0 "Часто отказываясь от воскрешения и на длительные периоды отрываясь от миров смертных, они странствуют по царству мёртвых как странствующие монахи и мудрецы."
