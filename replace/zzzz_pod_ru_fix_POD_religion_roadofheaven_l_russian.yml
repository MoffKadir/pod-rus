 helenacult_desc:0 "Истинное божество ходит по земле, излучая мучительное совершенство. Этот мистериальный культ, основанный, как утверждают, самой бессмертной богиней Трои, существует лишь для того, чтобы угождать ей и осуществлять её замыслы. Служить Елене — высшая честь, а умереть за неё — великая привилегия."
