l_russian:
 bookmark_inquisitor_bezariel_desc:0 "Когда-то Безариэль был ангелом Смерти. Ему быстро опротивела задача пожинать души смертных, и он пытался выглядеть как можно привлекательнее для своих незадачливых подопечных, но какой бы невинный лик он не принимал, он не мог облегчить их страх и боль после смерти.\nИ все же, несмотря на всю его ужасающую доблесть в бою, он, как и остальные, был низвергнут в Бездну. Тысячелетия спустя его призвал неосторожный инферналист, но эта пешка служила гораздо более великой госпоже.\nБезариэль оказался на службе у существа, обладающего таким непревзойденным злом, что демон едва ли не бледнел в сравнении с ним. Эта ведьма, которую в человеческих легендах называли Бабой Ягой, нашёптывала ему свои замыслы. При этом он оказался связан, полагаясь на неё, чтобы не вернуться с воплем в Бездну.\n\n#bold Вы играете роль верного генерала. Как ангел Смерти, вы знаете, что однажды судьба настигнет Железную каргу. И вы намерены быть готовым к этой ночи.#!"
 podintroductions.244.desc:0 "Совершенный Безариэль, ваше возвращение в мир смертных до сих пор было трудным делом.\nВы были призваны и скованы могущественной вампиршей, известной как Баба-Яга, которая намерена использовать вас в качестве генерала в своих войсках. Хотя вы благодарны ей за помощь в побеге из тюрьмы Бездны и за то, что она помогла вам обрести власть, вы знаете, что судьба никого не ждёт, и даже такому могущественному существу, как Карга, однажды ночью придётся встретиться лицом к лицу со своей судьбой. Вы должны быть готовы к такому повороту событий и тем временем создать условия для захвата власти.\nВы всегда были предназначены для великих свершений, и даже Люцифер остановился бы, если бы увидел истинный масштаб вашего потенциала. Как бывший ангел судьбы, пришло время создать свою собственную и заставить трепетать Небеса и Ад!"
 game_concept_grand_city_desc:0 "Великий город — это крупный населенный пункт, имеющий огромное значение как для мира смертных, так и для мира сверхъестественного.\n\nКаждый великий город обладает набором уникальных механик, связанных с ним. Вам может потребоваться выполнить особые требования, прежде чем вы сможете улучшить его [Concept('buildings', 'постройки')|E].\n\nСуществует пять великих городов:\n$BULLET_WITH_TAB$#TOOLTIP:game_concept_eternal_rome_desc #E Вечный Рим#!#!\n$BULLET_WITH_TAB$#TOOLTIP:game_concept_grand_city_of_constantinople_desc #E Константинополь, Угасающая мечта#!#!\n$BULLET_WITH_TAB$#TOOLTIP:game_concept_grand_paris_desc #E Великий Париж#!#!\n$BULLET_WITH_TAB$#TOOLTIP:game_concept_holy_cairo_desc #E Победоносный Каир#!#!\n$BULLET_WITH_TAB$#TOOLTIP:game_concept_holy_jerusalem_desc #E Священный Иерусалим#!#!\n\n#X У вас может быть только #V;bold 1#! владение великого города, если только вы не изменили это ограничение с помощью игровых правил.#!"
 game_concept_blood_hunt_desc:0 "Если [GetTrait('vampire').GetName(GetNullCharacter)|l] совершил серьёзное преступление против безопасности [Concept('the_masquerade', 'Маскарада')|E], Камарилья может объявить, что он отныне [GetTrait('anathema').GetName(GetNullCharacter)|l] и объявить на него Кровавую охоту.\n\nВ моде [princes_of_darkness|E], статус анафемы представлен в виде [Concept('trait', 'свойства')|E]. Члены Камарильи могут выбрать Анафему целью [casus_belli|El] «Кровавая охота», при победе в которой все [Concept('rulers', 'правители')|E] в державе цели будут заключены в тюрьму."
 fera_tribe_government_adjective:0 "Племенн"
 POD_april_fools.113.desc:0 "Нечто приветствует вас раскатистым звуком, доносящимся прямо из ада.\n\nОно произносит что-то отдалённо напоминающее «Бонжур».\n\nКроме того, оно кажется вполне расположенным для вежливой беседы. Оно приносит извинения за все причинённые неудобства и приводит пространные обоснования, полные научного жаргона, о «сферах», «инструментах» и «зонах реальности мародеров». Вы догадываетесь, что он скрывается от «этого морщинистого #italic филс де путе#!» и что его визит в эти края был «слишком преждевременным», но однажды, «когда придёт время», вы сможете встретить других таких же, как он. Затем он открывает портал и собирается уходить.\n\nВы взываете к существу, всё ещё пребывая в замешательстве. «Кто ты?»\n\nОно произносит: «Можешь называть меня Жан»."
 POD_april_fools.113.a:0 "И я думаю, что на этом всё."
 podgloss.laksamana:0 "Адмирал в малайских султанатах."
 POD_coteriename_sun_glory:0 "#TOOLTIP:POD_coteriename_sun_glory_tt #L Ярость [Glossary('Гелиоса', 'glossary_helios_tt')]#!#!"
 court_position_possessed_lunatic_trait:0 "[GetTrait('possessed_1').GetName( ROOT.Char )] и [GetTrait('lunatic_1').GetName( ROOT.Char )]"
 seline_oracle_court_position_desc:0 "Сострадательная сестра Геи, [Glossary('Луна', 'glossary_luna_tt')], явно благоволит к оборотням-котам и считает их своими лучшими творениями. Она породила перевёртышей как дар Земле, и её тело считается последним прибежищем для всех бастет."
 majordomo_court_position_desc:0 "Мажордом — это особая роль, предназначенная для #TOOLTIP:GAME_TRAIT,ghoul,[GetNullCharacter] #L гуля#!#!, который обычно служит своему [Glossary('домитору','game_concept_domitor_desc')] в качестве главного управляющего его имуществом и делами. Мажордом будет выполнять приказы своего хозяина, раздавая задания и распоряжения, начиная от найма внешних слуг и заканчивая контролем за другими гулями."
 spiritus_name:0 "spiritus_visible"
 POD_fera_remove_planetary_gifts_effect_tooltip:0 "#warning Планетарная инкарна отзывает все свои [Concept('planetarygifts_lifestyle', 'дары')|E].#!"
 action_can_add_herd_alert:0 "Вы должны добавить смертного в своё [Concept('POD_herd', 'стадо')|E]"
 action_can_add_herd_alert_label:0 "Вы должны добавить смертного в своё [Concept('POD_herd', 'стадо')|E]"
 action_can_add_herd_alert_desc:0 "Вы можете пить кровь членов [Concept('POD_herd', 'стада')|E], когда захотите. Члены стада также обеспечивают вас пассивным опытом [Concept('resonance', 'резонанса')|E] для ваших образов жизни.\n\nВы можете добавить придворных в своё стадо с помощью [Concept('scheme', 'происков')|E] или использовать взаимодействие с [Concept('prisoner', 'пленником')|E], чтобы мгновенно добавить его в своё стадо."
 action_can_add_herd_alert_click:0 "#I Нажмите, чтобы выбрать смертного придворного целью происков «[POD_herd|E]»#!"
 action_ghoul_can_drink_safety_from_vampire_alert_desc:0 "Узы крови с одним из ваших [Concept('prisoners', 'узников')|E]-вампиров ослабли, теперь вы можете безопасно испить от него. Помните, что вы всё ещё в опасности, если этот узник владеет ментальными [Glossary('дисциплинами','game_concept_discipline_desc')]!"
 action_ghoul_can_drink_safety_from_vampire_alert_click:0 "#I Нажмите, чтобы безопасно испить от вампира!#!"
 POD_journey_progress_instinct_conviction:0 "Ваше [Concept('rite', 'течение')|E] ценит #TOOLTIP:GAME_FAITH_DOCTRINE,doctrine_enlightenment_virtues_conviction_and_instinct #L Инстинкт#!#!"
 POD_journey_progress_instinct_conscience:0 "Ваше [Concept('rite', 'течение')|E] ценит #TOOLTIP:GAME_FAITH_DOCTRINE,doctrine_enlightenment_virtues_conscience_and_instinct #L Инстинкт#!#!"
 archid_bladed_tail_modifier_desc:0 "[PODImprovesCombatMove('POD_combat_move_mokole_tail_smash')]\nМожно нанести 1 ед. @health_track_damage_icon! [Concept('POD_superficial_damage', 'поверхностного урона')|E] вражеским [Concept('knights', 'рыцарям')|E] и [Concept('commanders', 'командирам')|E] при участии в [Concept('combat_phase', 'бою')|E] в качестве [Concept('commander', 'командира')|E], или вашим противникам в [Concept('single_combat_duel_plural', 'поединках')|E] в зависимости от [Concept('prowess', 'доблести')|E]."
 archid_constricting_coils_modifier_desc:0 "[PODImprovesCombatMove('POD_combat_move_mokole_spiked_carapace')]\nПосле успешной [Concept('siege', 'осады')|E] или [Concept('raid', 'набега')|E] [Concept('characters', 'персонажи')|E] чаще [Concept('imprison', 'попадают в темницу')|E]."
 archid_predators_roar_modifier_desc:0 "[PODImprovesCombatMove('POD_combat_move_mokole_threatening_display')]\nВражеские [Concept('commanders', 'командиры')|E] при участии в [Concept('combat_phase', 'бою')|E] в качестве [Concept('commander', 'командира')|E] получат модификатор «[GetModifier('POD_mokole_predators_roar_modifier').GetNameWithTooltip]»."
 helios_blaze_diplomacy_modifier:0 "Вспышка [Glossary('Гелиоса', 'glossary_helios_tt')]: Дипломатия"
 helios_blaze_martial_modifier:0 "Вспышка [Glossary('Гелиоса', 'glossary_helios_tt')]: Военное дело"
 helios_blaze_stewardship_modifier:0 "Вспышка [Glossary('Гелиоса', 'glossary_helios_tt')]: Управление"
 helios_blaze_intrigue_modifier:0 "Вспышка [Glossary('Гелиоса', 'glossary_helios_tt')]: Интриги"
 helios_blaze_learning_modifier:0 "Вспышка [Glossary('Гелиоса', 'glossary_helios_tt')]: Учёность"
 artifact_dracomus_description:0 "Наносит 1 ед. @pod_combat_fire_icon!#L;color:{1.00,0.55,0.20} [Concept('fire_damage', 'огненного')|E]#! урона вражеским [Concept('knights', 'рыцарям')|E] и [Concept('commanders', 'командирам')|E] при участии в [Concept('combat_phase', 'бою')|E] в качестве [Concept('commander', 'командира')|E], или вашим противникам в [Concept('single_combat_duel_plural', 'поединках')|E].\n\nБольшой драконообразный динозавр, покрывающий себя легковоспламеняющейся слизью, которую он поджигает, ударяя когтями друг о друга. Пылающее чудовище, которое никогда не должно было покинуть сны моколе."
 dracomus_modifier_desc:0 "Наносит 1 ед. @pod_combat_fire_icon!#L;color:{1.00,0.55,0.20} [Concept('fire_damage', 'огненного')|E]#! урона вражеским [Concept('knights', 'рыцарям')|E] и [Concept('commanders', 'командирам')|E] при участии в [Concept('combat_phase', 'бою')|E] в качестве [Concept('commander', 'командира')|E], или вашим противникам в [Concept('single_combat_duel_plural', 'поединках')|E]."
 durga_chosen_flavor:0 "#F [Glossary('Селин', 'glossary_luna_tt')] в аспекте Дурги улыбается своей избранной элите, благородным величайшим воинам хан.#!"
 seline_pride_flavor:0 "#F Самопровозглашенные избранники [Glossary('Селин', 'glossary_luna_tt')], симба - гордые и безжалостные бойцы. Их история также подарила им сомнительную честь - они умеют сражаться с другими перевёртышами.#!"
 raksha_of_ravana_flavor:0 "#F Ракша с достаточной регулярностью посещают Поднебесную, чтобы прокормиться и вести дела, а также скрытно бродят по [UmbraGlossaryLocalized('yomi_wan','аду Йоми')] в поисках подношений для Ланки.#!"
 valkyries_maa_flavor:0 "#F Группа женщин-воительниц, которых часто называют «избирающими павших». Валькирии играли роль боевых судеб: они могли появиться во время важного сражения, чтобы переломить ход событий в пользу одной из сторон. В наши дни они по-прежнему являются главной элитной силой вампиров-эйнхерий, противостоящей христианскому вторжению.#!"
 knights_jordi_alfama_maa_flavor:0 "#F Основанный в Арагоне в 1201 году, этот орден помогает управлять Майоркой после её захвата Арагоном. Клан Ласомбра имеет внушительную опору в ордене, оказывая значительное влияние на высокопоставленных гулей.#!"
 rival_diabolist_corresponding:0 "[CHARACTER.GetShortUIName|U] [Select_CString(CHARACTER.IsLocalPlayer, 'унизили', Select_CString(CHARACTER.IsFemale, 'унизила', 'унизил'))] [Select_CString(TARGET_CHARACTER.IsLocalPlayer, 'вас', 'персонажа ' )][Select_CString(TARGET_CHARACTER.IsLocalPlayer, '', TARGET_CHARACTER.GetShortUIName)], заключив [Select_CString(TARGET_CHARACTER.IsLocalPlayer, 'вас', Select_CString(TARGET_CHARACTER.IsFemale, 'её', 'его'))] в артефакт."
 summoned_army:0 "Призванное войско"
 POD_unlocked_empire_ghw:0 "Вы разблокируете [Concept('casus_belli', 'казус белли')|E] «[GetPlayer.GetFaith.GHWName]» за [Concept('empire', 'империи')|E]."
 POD_weather_magic_from_enemy.tt:0 "[actor.GetFirstName] [Select_CString(actor.IsFemale, 'вызвала', 'вызвал' )] стихийное бедствие в вашей державе"
 learn_language_outcome_failure.spirits.desc:0 "После кучи кропотливой работы... ничего! Этот духовный язык #EMP невозможно#! выучить. Как бы я ни [Select_CString(ROOT.Char.IsFemale, 'старалась', 'старался' )], я говорю как младенец, которого только отняли от груди, и болтаю как [Select_CString(ROOT.Char.IsFemale, 'дура', 'дурак' )]!\n\nБа! Это была пустая трата времени..."
 POD_spirit_wyrm_possession_effect_tooltip:0 "Получит #TOOLTIP:POD_spirit_wyrm_possession_effect_tooltip2 #V;L [GuiScope.SetRoot(spirit.MakeScope).AddScope('target',target.MakeScope).ScriptValue('POD_spirit_wyrm_possession_power')]#!#! оч. [Concept('perk', 'достоинств')|E] [Concept('possessedpower_lifestyle', 'пути способностей одержимости')|E]"
 spirit_human_pact_modifier:0 "Духовный договор"
 POD_story_pact_custom_string:0 "#font:TitleFont;size:19;glow_color:{0.5,0,0,1} Договор, заключённый с персонажем [Story.MakeScope.Var('demon').Char.GetFirstName]#!\n#glow_color:{0.25,0,0,75} [demonic_pact_obligation|E]: [Localize(Concatenate('POD_obligation_', Story.MakeScope.GetVariable('obligation').GetFlagKey))|U]\n[GuiScope.SetRoot(Story.GetOwner.MakeScope).AddScope('story',Story.MakeScope).Custom('PODPactFrequencyAndStatus')]\n[GuiScope.SetRoot(Story.GetOwner.MakeScope).AddScope('story',Story.MakeScope).Custom('PODPactDeadline')]\nЕсли вы #X нарушите#! договор:\n[GetScriptedGui('POD_sidebar_show_demonic_pacts').BuildTooltip(GuiScope.SetRoot(Story.GetOwner.MakeScope).AddScope('obligation', MakeScopeFlag(Story.MakeScope.GetVariable('obligation').GetFlagKey)).AddScope('consequence', MakeScopeFlag(Story.MakeScope.GetVariable('consequence').GetFlagKey)).End)]\nЭтот [Concept('demonic_pact', 'договор')|E] стоит [Story.MakeScope.GetVariable('perk_points_gained').GetValue|0V] оч. [Concept('perk', 'достоинств')|E] [Concept('investiture_lifestyle', 'пути инвеституры')|E]#!"
 POD_story_pact_frequency_notcompleted:0 "[demonic_pact_frequency|E]: каждые [story.MakeScope.GetVariable('frequency').GetValue|0V] г.\nСтатус: #N В стадии выполнения#!"
 hunt_in_capital_planning_confirm_gui:0 "Выследить выбранного персонажа и испить его крови."
 fera_training_effects:0 "Вы просмотрите свою стаю и решите, на какой форме обучения сосредоточиться.\nЕсли ваша [GetPlayer.Custom('PODCoterieNoTooltip')|l] состоит из пяти членов, можно выбрать [Concept('pack_totem', 'тотем стаи')|E]."
 seek_knowledge_temporis_isvalid:0 "$POD_seek_knowledge_intro$\n$BULLET_WITH_TAB$$POD_seek_knowledge_learning_25$\n$BULLET_WITH_TAB$У вас есть свойства «[GetTrait('erudite').GetName(GetPlayer)]» и «[GetTrait('celerityadvanced').GetName(GetPlayer)]»\n$BULLET_WITH_TAB$$POD_seek_knowledge_relation$\n$BULLET_WITH_TAB$$POD_seek_knowledge_game_rule$"
 seek_knowledge_chicanery_desc:0 "#TOOLTIP:GAME_TRAIT,art_chicanery,[GetNullCharacter] #L Обман#!#! — это искусство иллюзий, позволяющее практикующему накладывать такие #TOOLTIP:game_concept_cantrip_desc #E чары#!#!, как [GetPerk('common_arts_veiled_eyes_perk').GetName(GetPlayer)], [GetPerk('common_arts_dream_logic_perk').GetName(GetPlayer)] или [GetPerk('common_arts_veiled_mind_perk').GetName(GetPlayer)]."
 seek_knowledge_legerdemain_desc:0 "#TOOLTIP:GAME_TRAIT,art_legerdemain,[GetNullCharacter] #L Фокусы#!#! — это искусство перемещения и копирования предметов, позволяющее практикующему накладывать такие #TOOLTIP:game_concept_cantrip_desc #E чары#!#!, как [GetPerk('common_arts_mooch_perk').GetName(GetPlayer)] или [GetPerk('common_arts_effigy_perk').GetName(GetPlayer)]."
 seek_knowledge_primal_desc:0 "#TOOLTIP:GAME_TRAIT,art_primal,[GetNullCharacter] #L Изначальность#!#! — это искусство манипулирования силами природы, позволяющее практикующему накладывать такие #TOOLTIP:game_concept_cantrip_desc #E чары#!#!, как [GetPerk('common_arts_eldritch_prime_perk').GetName(GetPlayer)], [GetPerk('common_arts_oakenshield_perk').GetName(GetPlayer)] или [GetPerk('common_arts_dance_of_the_five_kings_perk').GetName(GetPlayer)]."
 seek_knowledge_soothsay_desc:0 "#TOOLTIP:GAME_TRAIT,art_soothsay,[GetNullCharacter] #L Предсказание#!#! — это искусство заглядывать в будущее, позволяющее практикующему накладывать такие #TOOLTIP:game_concept_cantrip_desc #E чары#!#!, как [GetPerk('common_arts_omen_perk').GetName(GetPlayer)], [GetPerk('common_arts_seers_wisp_perk').GetName(GetPlayer)] или [GetPerk('common_arts_face_fate_perk').GetName(GetPlayer)]."
 seek_knowledge_wayfare_desc:0 "#TOOLTIP:GAME_TRAIT,art_wayfare,[GetNullCharacter] #L Странствие#!#! - искусство перемещения на огромные расстояния, дающее практикующему пассивные бонусы, такие как [GetPerk('common_arts_hopscotch_perk').GetName(GetPlayer)] и [GetPerk('common_arts_flicker_flash_perk').GetName(GetPlayer)], и позволяющее накладывать #TOOLTIP:game_concept_cantrip_desc #E заклятие#!#! [GetPerk('common_arts_portal_passage_perk').GetName(GetPlayer)]."
 seek_knowledge_metamorphosis_name:0 "Изучить простое искусство (#TOOLTIP:GAME_TRAIT,art_metamorphosis,[GetNullCharacter] #L Метаморфозис#!#!)"
 seek_knowledge_metamorphosis_desc:0 "#TOOLTIP:GAME_TRAIT,art_metamorphosis,[GetNullCharacter] #L Метаморфозис#!#! — это искусство превращения живых существ, позволяющее практикующему накладывать такие [Concept('cantrips', 'чары')|E], как [GetPerk('common_arts_sparrows_and_nightingales_perk').GetName(GetPlayer)], [GetPerk('common_arts_worms_and_giants_perk').GetName(GetPlayer)] или [GetPerk('common_arts_beastskin_perk').GetName(GetPlayer)]."
 seek_knowledge_pyretics_name:0 "Изучить простое искусство (#TOOLTIP:GAME_TRAIT,art_pyretics,[GetNullCharacter] #L Пламя#!#!)"
