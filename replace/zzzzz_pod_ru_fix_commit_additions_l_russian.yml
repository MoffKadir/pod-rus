 seek_knowledge_aquis_desc:0 "[GetTrait('art_aquis').GetName(GetNullCharacter)] — это осколок Воды, практикуемый #TOOLTIP:GAME_TRAIT,ondine,[GetNullCharacter] #L ундинами#!#!."
