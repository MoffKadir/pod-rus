 game_concept_soak_damage:0 "Поглощение урона"
 game_concept_soak_damage_desc:0 "Некоторые способности, [Concept('perks', 'достоинства')|E] и доспехи-[Concept('artifacts', 'артефакты')|E] дают шанс #bold поглотить#! входящий [Concept('POD_superficial_damage', 'поверхностный урон')|E].\n\nИсточники поглощения сочетаются с #bold убывающей эффективностью#!: каждый из них умножает оставшуюся вероятность получить урон, а не прибавляет свой процент к общему шансу поглощения. Например, два источника по #V 20%#! дают #V 36%#! поглощения (0,8 × 0,8 — вероятность получить урон), а не #V 40%#!. Никакое число таких источников не даёт полной неуязвимости.\n\nПоглощение проверяется #bold отдельно#! для каждой единицы входящего урона. Поэтому сильный удар может быть поглощён лишь частично: поглощение уменьшает урон примерно на соответствующую долю, а не определяет исход всего удара одной проверкой."
 kueijin_religion_desc:0 "Многие вампиры не следуют ни одной из пяти #TOOLTIP:podgloss.dharma #L дхарм#!#!, приписываемых Сюэ. Они избирают другие пути, которые предки Пяти августейших дворов клеймят как ересь."
 doctrine_fae_agenda_constantinian_desc:0 "$tenet_constantinian_desc$"
 message_filter_pod_damage_taken_desc:0 "Сообщения, связанные с вашим #TOOLTIP:game_concept_POD_health_track_desc #E здоровьем#!#! (полученный #TOOLTIP:game_concept_POD_superficial_damage_desc #E поверхностный#!#! или #TOOLTIP:game_concept_POD_aggravated_damage_desc #E тяжёлый урон#!#!, #TOOLTIP:game_concept_soak_damage_desc #E поглощение урона#!#!, повреждения или использование иммунитета к урону)"
 POD_terrain_health_min_combat_roll:0 "Вероятность #TOOLTIP:game_concept_soak_damage_desc #E поглощения урона#!#!"
