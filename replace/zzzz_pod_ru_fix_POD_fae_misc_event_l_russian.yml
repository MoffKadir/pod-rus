l_russian:
 POD_fae_misc.1.a:0 "Какие у тебя большие зубы."
 POD_fae_misc.1.aa:0 "Этот выглядит опасным!"
 POD_fae_misc.1.ab:0 "Такие нежные и красочные крылышки."
 POD_fae_misc.1.ac:0 "Кролики — самые устрашающие и славные животные, и вполне уместно, что у меня во дворе есть один, представляющий их."
 POD_fae_misc.1.ad:0 "Думаю, назову его Мягышом."
 POD_fae_misc.1.ae:0 "Я искал пуку, не так ли? Я думаю, что нет."
 POD_fae_misc.1.b:0 "Вот это шутник!"
 POD_fae_misc.1.c:0 "Котик, котик, я люблю тебя."
 POD_fae_misc.1.d:0 "Этот может постучать в дверь моей комнаты."
 POD_fae_misc.1.desc:0 "Вы нашли пуку, которую искали"
 POD_fae_misc.1.e:0 "Я считаю, что он хорош в соколиной охоте."
 POD_fae_misc.1.f:0 "С этим медведем можно и ужиться."
 POD_fae_misc.1.g:0 "В этом есть что-то фантастическое."
 POD_fae_misc.1.h:0 "До скорого, крокодил!"
 POD_fae_misc.1.i:0 "Такие гипнотические глаза."
 POD_fae_misc.1.j:0 "Повой со мной."
 POD_fae_misc.1.k:0 "Мне срочно нужны лабиринт и немного сыра."
 POD_fae_misc.1.l:0 "Идеально подходит для саней."
 POD_fae_misc.1.m:0 "Отличная улыбка!"
 POD_fae_misc.1.n:0 "Иди сюда, му-у-у!"
 POD_fae_misc.1.o:0 "Почему такая вытянутая морда? А, просто конское настроение, теперь понимаю."
 POD_fae_misc.1.p:0 "Если они меня укусят, я стану вампиром?"
 POD_fae_misc.1.q:0 "Я заскучал. До кабаньего визга."
 POD_fae_misc.1.r:0 "Столько глаз!"
 POD_fae_misc.1.s:0 "Вот этот жучок меня достаёт."
 POD_fae_misc.1.t:0 "Нам всем следует идти боком!"
 POD_fae_misc.1.title:0 "Пука найден"
 POD_fae_misc.1.u:0 "Обезьяна думает, обезьяна делает."
 POD_fae_misc.1.v:0 "Бззззз."
 POD_fae_misc.1.w:0 "Этот трудолюбивый маленький работник."
 POD_fae_misc.1.x:0 "Терпеливый охотник получает добычу."
 POD_fae_misc.1.y:0 "Столько ног!"
 POD_fae_misc.1.z:0 "Можно мне панцирь?"
 POD_fae_misc.2.a:0 "Темный апофеоз"
 POD_fae_misc.2.desc:0 "Актеры на месте, и у меня есть все необходимые знания, чтобы воспроизвести легенду о Лилит со мной в ее роли. Грандиозное зрелище вот-вот начнется, и скоро родится еще одна Лилит. \n\nИтак, пьеса началась, воссоздание Легенды в Дальнем Сновидении. Актеры играют свои роли, а я в центре. Создание Первых Мужчины и Женщины, Разрыв Лилит со своим Создателем, Восстание, Бегство. Все основные действия разыгрываются последовательно, мы забываем о себе ради пьесы. Все прекрасно воссоздано, все в порядке. \n\n И акт закончился, актеры возвращаются к своей обычной жизни. А сама Грёза приняла нашу версию как еще одно лицо того же события. И я возрождаюсь заново. Может, я и не Лилит, но я не просто Лилин."
 POD_fae_misc.2.t:0 "$POD_lilin_objective_decision$"
 POD_fae_misc.3.a:0 "Нас ждет прекрасное будущее."
 POD_fae_misc.3.desc:0 "Человечество слепо к чудесному миру Сновидений и может уловить лишь его фрагмент, когда спит. Таким образом, неудивительно, что люди сбились с верного пути и погрузились в неверие. \n\nНо, к счастью, вы были там, прежде чем человечество могло совершить серьезную ошибку. Вы направили заблудших на верный путь, и, контролируя основные источники знаний, вы можете гарантировать, что это не повторится."
 POD_fae_misc.3.t:0 "Наставник человечества"
 POD_fae_misc.3_custom1:0 "Значительно усиливает распространение культуры и даёт доступ к решению о развитии графства, если вы не принадлежите к Неблагим."
 POD_fae_misc.4.a:0 "Я желаю лишь служить вам."
 POD_fae_misc.4.desc_appearance_wish:0 "Итак... вы хотите привлекать к себе внимание, куда бы вы ни пошли? \n\n И они обязательно повернутся, просто, возможно, не так, как вы этого хотите."
 POD_fae_misc.4.desc_brains_wish:0 "Итак... вы хотите стать мозгом семьи? \n\nВаши мозги будут ближе к семье, чем вам хотелось бы."
 POD_fae_misc.4.desc_conscience_wish:0 "Итак... вы хотите избавиться от своих тревог и вины? \n\nИзбавитесь от них, когда все ваши тайны будут раскрыты и прозвучат для всеобщего слуха."
 POD_fae_misc.4.desc_dwarf_wish:0 "Итак... вы хотите возвышаться над врагами, словно они карлики?\n\nНо карликом станете вы сами."
 POD_fae_misc.4.desc_enemies_wish:0 "Итак... вы хотите увидеть своих врагов, прежде чем они нанесут удар? \n\nИ они нанесут удар... в вашем воображении."
 POD_fae_misc.4.desc_feared_wish:0 "Итак... вы хотите, чтобы вас боялись? \n\nИ поэтому они будут бояться вас и каждого вашего аспекта."
 POD_fae_misc.4.desc_knowledge_wish:0 "Итак... вы желаете знаний за пределами вашего понимания?\n\nЗнания у вас будут. Но понять их вы не сможете."
 POD_fae_misc.4.desc_marriage_wish:0 "Итак... вы хотите оживить свою семейную жизнь? \n\nОстрота будет, но, возможно, не в лучшую сторону."
 POD_fae_misc.4.desc_speaking_wish:0 "Итак... вы хотите, чтобы все ловили каждое ваше слово? \n\n И эти слова будут висеть... если вы сможете их выговорить."
 POD_fae_misc.4.desc_spouse_wish:0 "Итак... вы хотите, чтобы ваш супруг смотрел только на вас? \n\nИ видеть будут только вас."
 POD_fae_misc.4.desc_wealth_wish:0 "Итак... вы желаете несравненного богатства? \n\nС чем вам его сравнить?"
 POD_fae_misc.4.t:0 "Желание исполнено"
 POD_fae_misc.400.a:0 "Мне это казалось естественным."
 POD_fae_misc.400.desc:0 "Ваша дурная слава исполнителя желаний, сбывающихся совсем не так, как ожидают просители, коснулась уже многих могущественных сверхъестественных существ.\nДаже смертные рассказывают о печально известных джиннах и их коварных уловках. Несомненно, это значительно укрепит способность джиннов противостоять разрушительному воздействию Банальности."
 POD_fae_misc.400.t:0 "Желания исполнены"
