l_russian:
 POD_clear_path_modifier:0 "Ясный путь"
 POD_clear_path_modifier_desc:0 "Вы благополучно прошли по полю битвы, усеянному ловушками."
 POD_coterie_escort_modifier:0 "В сопровождении котерии"
 POD_coterie_escort_modifier_desc:0 "Заплатив пошлину, вы получили помощь от этой местной группы."
 POD_delay_path_modifier:0 "Мучительный путь"
 POD_delay_path_modifier_desc:0 "Вам не удалось пройти через поле с ловушками, в результате чего многие скакуны были ранены."
 POD_failed_convo_modifier:0 "Неудавшийся собеседник"
 POD_failed_convo_modifier_desc:0 "Ходят слухи, что вы крайне неотесанный, бесцеремонный и нецивилизованный человек."
 POD_harass_coterie_modifier:0 "Преследование котерии"
 POD_harass_coterie_modifier_desc:0 "На каждом шагу вас преследует группа вампиров, которых вы разозлили!"
 POD_travel_danger_events.28.failure:0 "Вы отброшены!"
 POD_travel_danger_events.28.success:0 "Контратака эффективна!"
 POD_travel_danger_events.29.failure:0 "Группа дает отпор!"
 POD_travel_danger_events.29.success:0 "Они убегают!"
 POD_travel_danger_events.30.failure:0 "Ловушки покалечат вас и ваших животных!"
 POD_travel_danger_events.30.success:0 "Вы безопасно перемещаетесь по полю!"
 POD_travel_danger_events.31.failure:0 "Из тебя получится ужасный архитектор"
 POD_travel_danger_events.31.success:0 "Из тебя получится хороший архитектор"
 POD_travel_events.28.a:0 "Возьмите монету и подавитесь ею."
 POD_travel_events.28.b:0 "Вы отойдете в сторону. Сейчас."
 POD_travel_events.28.c:0 "Вы выбрали не тех, кого хотите ограбить!"
 POD_travel_events.28.d:0 "Есть и другие способы..."
 POD_travel_events.28.desc:0 "Пока вы и ваша свита путешествуете, ваша группа внезапно останавливается перед старым каменным мостом, а путь впереди блокирует группа тяжеловооруженных смертных. \n\nИх лидер, крепкий мужчина со множеством шрамов, выходит вперед. «Приветствую вас, путешественники! Этот мост принадлежит нам, хозяевам этой переправы. Его товарищи-бандиты смеются и кивают, сжимая рукоятки оружия. — Чтобы пройти здесь, нужна плата. Подчинитесь, и вы сможете пройти. Откажитесь, и вы все будете истекать кровью.'\n\nХотя это простые смертные, они довольно хорошо вооружены и окружили вашу свиту. Бой будет трудным, но не невозможным."
 POD_travel_events.28.t:0 "Мостовые бандиты"
 POD_travel_events.29.a:0 "Порадует ли этот золотой подарок твоего хозяина?"
 POD_travel_events.29.b:0 "Ты смеешь угрожать мне?!"
 POD_travel_events.29.c:0 "Нам пора исчезнуть!"
 POD_travel_events.29.desc:0 "По мере вашего путешествия становится все более очевидным, что ваша свита неосознанно ступила на земли очень территориального и скрытного существа. Все достигает кульминации, когда небольшая котерия опытных Сородичей преграждает вам путь, а за ними следует несколько десятков оборванных смертных. Они явно готовы попытаться прогнать вас. \n\n — Вы вторгаетесь во владения нашего хозяина! Их лидер шипит. — Либо ты дурак, либо очень храбрый человек, раз носишься по этим землям и не представляешься ему. Объяснитесь, иначе мы пронзим вас колом и оставим встречать солнце.'\n\nУ этой группы есть преимущество в плане местности и численности, но, похоже, они готовы вас выслушать."
 POD_travel_events.29.t:0 "Скрытый мастер"
 POD_travel_events.30.a:0 "Мы должны расчистить путь, прежде чем все наши лошади останутся покалеченными."
 POD_travel_events.30.b:0 "Продвигайтесь, мы не можем откладывать наши путешествия!"
 POD_travel_events.30.c:0 "У этих ловушек должна быть закономерность."
 POD_travel_events.30.desc:0 "Ваш путь приведет вас и вашу свиту к полю, полному гниющих трупов, сломанного оружия и доспехов, а также земли, пропитанной старой кровью. Последствия недавней стычки между отрядами смертных.\n\nМертвые, возможно, больше не причинят вреда своим потрепанным оружием, но земля все еще таит в себе некоторые опасности. Отступающая армия, очевидно, раскидала сотни острых шипов и спрятала глубокие ямы, чтобы сдержать любое преследование. \n\nОдна лошадь, принадлежащая вашей группе, уже ранена шипом в копыта. Если вы хотите пройти через это коварное место, вам придется действовать очень медленно и осторожно или подумать о другом пути."
 POD_travel_events.30.t:0 "Поле битвы с ловушками"
 POD_travel_events.31.a:0 "Нет другого выбора, кроме как бегать, собирая дерево и камень..."
 POD_travel_events.31.b:0 "Из того, что у меня есть под рукой, я могу построить что-то, что прослужит всю ночь."
 POD_travel_events.31.c:0 "Просто найдите самый темный угол и молитесь, чтобы это сработало!"
 POD_travel_events.31.desc:0 "Быстро приближающийся рассвет заставляет вас укрыться в ближайшем месте, которое только можно найти. К сожалению, единственным вариантом являются руины старого здания. \n\nКрыша почти полностью разрушена, пол громко скрипит при каждом шаге, а нижние уровни полностью затоплены. Кажется, в этой пустой оболочке здания нет места, которое могло бы обеспечить вам и вашей свите защиту от солнца. Небо уже начинает отливать золотым сиянием..."
 POD_travel_events.31.t:0 "Небесный Свет"
 POD_travel_events.32.a:0 "Если я могу прервать..."
 POD_travel_events.32.b:0 "Я закончил с этим!"
 POD_travel_events.32.desc:0 "Хотя ночные дороги часто тихие и спокойные, сегодня вечером ваш путь прервала странная фигура. К вам случайно наткнулся роскошно одетый Тореадор и его мучительно медлительная свита, состоящая из смертных придворных. Обрадованный этой неожиданной встречей на тихих дорогах, этот человек настоял на том, чтобы вы остановили свое путешествие и обменялись сплетнями. \n\nВ течение нескольких часов вы слушали его рассказы о самых разных историях, от простых сплетен о том, в кого влюблен один из его последователей, до того, что, по слухам, некоторые смертные короли делают втайне. \n\nВсе это совершенно очевидно. утомительно.\n\nУходят драгоценные часы, часы, которые можно было провести в дороге, и все для того, чтобы развлечь этого тщеславного господина, держи двор на обочине грунтовой дороги."
 POD_travel_events.32.failure:0 "Ты оказываешься довольно неуклюжим"
 POD_travel_events.32.success:0 "Ты оказываешься красноречивым"
 POD_travel_events.32.t:0 "Плененная аудитория"
 POD_travel_events.33.a:0 "Мы просто проскочим..."
 POD_travel_events.33.b:0 "Нужен альтернативный путь."
 POD_travel_events.33.desc:0 "Ваши брови нахмурены от раздражения, когда вы достигаете жизненно важного места на своем пути, только чтобы увидеть, что ворота поселения заперты, а это место кишит вооруженными солдатами. Кажется, смертные неожиданно ввели комендантский час. Очень неожиданное и неудачное развитие событий для вашей группы.\n\nХотя вы можете подождать, пока ворота снова откроются, или пройти утомительный процесс поиска другого маршрута, это займет время. Вы можете попытаться проскользнуть мимо, но это таит в себе свои опасности."
 POD_travel_events.33.failure:0 "Вас заметили"
 POD_travel_events.33.success:0 "Ты проходишь мимо незаметно"
 POD_travel_events.33.t:0 "Неожиданная изоляция"
 travel_danger_events.1011.d:0 "Я могу залечить эти раны..."
 travel_danger_events.1011.d_tt:0 "Вы исцеляете [frostbite_victim.GetFirstName] с помощью Обиа."
 travel_danger_events.4010.f:0 "Я могу излечить эту болезнь..."
 travel_danger_events.4010.f_tt:0 "Вы вылечиваете [ill_character.GetFirstName] с помощью Обиа."
 travel_danger_events.7000.h:0 "Я могу это исправить..."
 travel_danger_events.7000.h_tt:0 "Вы исцеляете [snake_victim.GetFirstName] с помощью Обиа."
 werewolf_moon_bridge_option:0 "Лунный мост"
 werewolf_moon_bridge_option_desc:0 "Оборотни могут путешествовать по легендарным Лунным мостам, пересекающим [umbra|E]. Во многих случаях это намного быстрее и безопаснее, чем идти по обычной дороге."
 werewolf_ragabash_option:0 "Сезон безумия"
 werewolf_ragabash_option_desc:0 "#clickable Владелец каждого [duchy|E], через который вы путешествуете, которого нет в вашем [realm|E], получит [GetModifier('madness_season_modifier').GetNameWithTooltip]. Это будет стоить 1$POD_energy_gnosis$ за правителя.#!\nБезумие, наш старый друг!"
