 sliver_2_name:0 "Нестабильный"
 sliver_3_name:0 "Полустабильный"
 sliver_4_name:0 "Стабильный"
 sliver_5_name:0 "Совершенный"
 sliver_aquis_flavor:0 "Вода — это жизнь. Она необходима для поддержания жизни смертных, животных и растений. Она разделяет и объединяет, а её форма постоянно меняется в зависимости от сосуда, если он есть. С помощью Аквиса Неодушевлённые могут вселить надежду, смывая сомнения, или вызвать горе от потери близкого в море. Они могут исцелять слезами, созданными этим заклинанием, и ранить жертв, топя их. Аквис позволяет разрушать иллюзии и миражи, открывая истину всем. В отражениях на воде практикующие видят прошлое и далёкие события, происходящие в этот момент. Аквис управляет водами: поднимает, разделяет, замораживает, растапливает и даже испаряет их. Вода встаёт на защиту, отталкивая врагов и прижимая их к земле, а туман скрывает движение. В Глубоких Грёзах Аквис исцеляет серьёзные раны и успокаивает эмоции, усиленные Пиросом."
 sliver_petros_flavor:0 "Петрос приносит выносливость, стойкость, долговечность и силу, которые присущи камням и самой земле. Используя только руки, заклинатель может за несколько часов вылепить из камня статуи в натуральную величину, изменить саму суть того, что представляет собой тип почвы или камня, и даже трансмутировать минералы (но никогда в железо). Он создает броню из минералов и изменяет массу и форму земли, заставляя ее подниматься из земли в виде стен. Петрос связывает своего пользователя с древними временами, позволяя получить доступ к давно утерянным знаниям и информации, которая поможет в текущих затруднениях. Гломы часто используют Осколок для обеспечения исполнения клятв и контрактов, связывая их прочностью самого камня и заставляя Грёзы обеспечивать их соблюдение. Хотя Петрос не может вызывать другие эмоции, он способен вселить в других преданность, что делает его отличным волшебством для лидеров всех мастей."
 sliver_pyros_flavor:0 "Огонь горит. Такова его природа, и когда он действует бесконтрольно, он обеспечивает чрезвычайную интенсивность, свет и тепло. Пирос раскрывает ложь, поскольку она является неверным направлением и уловкой, проливая свет на тени жизни. Он создает огонь, контролируя и перенаправляя его, но никогда не удушая пламя, потому что огонь должен гореть. Он охватывает кулаки, позволяя голым кулакам наносить летальный урон, и усиливает Гламур внутри Сокровищ, меняя их урон на серьёзный. Пламя поднимается, чтобы защитить своего владельца и ослепить противников, затрудняя им попадание в цель или облегчая побег после обнаружения. Яркость огня пылает в сердцах всех живых существ (и даже некоторых блудных детей-нежити), а Пирос усиливает ненависть и любовь до таких высот, что в конечном итоге поглощает цель, вселяя паранойю или страх быть отвергнутым. Он никогда не имеет дело с умеренными эмоциями и всегда доводит последствия до крайности или вызывает полное эмоциональное оцепенение, как будто пламя внутри души замерцало и погасло."
 sliver_stratus_flavor:0 "Стратус – это сущность воздуха. Спокойный бриз или бушующая буря, темные облака или чистое небо, тихий дождь или гроза — все попадает в сферу действия этой магии. В то же время ветер также несет сообщения для доставки или подслушивания. Шепоты, предназначенные для отдельного человека, набирают силу, как если бы они передавались через динамики, а крики быстро заглушаются, когда воздух отказывается передавать их звуковые волны. Движение может быть медленным или чрезвычайно быстрым, в зависимости от того, как представитель филы Высвобождает силу этого Осколка, пока его союзники атакуют своих врагов. Он также создает временные иллюзии, уговаривая тени скрыть движение и отвлекающие уловки, чтобы успешно оставаться скрытыми, когда это необходимо. Хотя Стратус может создавать дикие порталы, если что-то пойдет не так, он также позволяет телепортироваться на короткие расстояния (например, в пределах города или небоскреба)."
 sliver_verdage_flavor:0 "Зелень предполагает контроль над живой природой, начиная от растений и заканчивая животными и даже предметами, изготовленными из натуральных материалов (без химической обработки и т. д.). С помощью этой Осколка пользователи создают и нейтрализуют природные яды, находят следы движения своей цели, расчищают заросшую местность и гадают, глядя на нити судьбы как на корни самой жизни. Зелень вызывает диких животных и химер, рожденных по их образу, и позволяет общаться с ними, вселяя чувство близости между практикующим и целью. Более того, она создаёт растения, делает почву плодородной или бесплодной, перемещает молодые побеги и заставляет растения цвести. Тем не менее, несмотря на свою способность оживлять растения, она не может создать разум. Осколок также позволяет заклинателям создавать объекты из природных ресурсов, представляя их в уме, а также преобразовывать органические вещества из одного в другое."
