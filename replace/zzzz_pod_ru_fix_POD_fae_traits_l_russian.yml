 trait_art_autumn:0 "Искусство Осени"
 trait_art_autumn_advanced:0 "Мастерство: $trait_art_autumn$"
 trait_art_autumn_advanced_desc:0 "$trait_art_autumn_desc$"
 trait_art_autumn_desc:0 "Искусство Осени относится к древнейшей магии, которой до сих пор пользуются китэйны. Некоторые считают его самым страшным из четырёх сезонных искусств: это магия осеннего увядания, Самайна и перехода от света к тьме. В ней нет ни созидательной энергии и страсти Весны и Лета, ни торжественного достоинства Зимы. Это искусство теней и разложения, угасания, ещё не принятой смерти и рока, который лишь обрушивается на своих жертв."
 trait_art_contract:0 "Искусство Договора"
 trait_art_contract_advanced:0 "Мастерство: $trait_art_contract$"
 trait_art_contract_advanced_desc:0 "$trait_art_contract_desc$"
 trait_art_contract_desc:0 "Искусство Договора позволяет влиятельным представителям мира фей скреплять могущественные клятвы, карать клятвопреступников и связывать осведомлённых или ничего не подозревающих участников соглашениями, исполнение которых обеспечивает сама сила Грёзы."
 trait_art_dragons_ire:0 "Искусство Гнева дракона"
 trait_art_dragons_ire_advanced:0 "Мастерство: $trait_art_dragons_ire$"
 trait_art_dragons_ire_advanced_desc:0 "$trait_art_dragons_ire_desc$"
 trait_art_dragons_ire_desc:0 "Гнев дракона — могущественное искусство битвы и противоборства. Многие ши считают его своим исключительным достоянием, которое способен по-настоящему освоить лишь беззаветно преданный делу благородный воин. Однако в действительности им пользуются и некоторые представители простонародных китов."
 trait_art_oneiromancy:0 "Искусство Онейромантии"
 trait_art_oneiromancy_advanced:0 "Мастерство: $trait_art_oneiromancy$"
 trait_art_oneiromancy_advanced_desc:0 "$trait_art_oneiromancy_desc$"
 trait_art_oneiromancy_desc:0 "Онейромантия — искусство стирать границы между вымыслом и действительностью, сном и явью, Грёзой и обычным миром. Владеющие им способны издалека нанести огромный ущерб обществу подменышей, поэтому другие подменыши считают их проклятыми. Среди китэйнов онейромантия полностью запрещена."
 trait_art_skycraft:0 "Искусство Власти над небом"
 trait_art_skycraft_advanced:0 "Мастерство: $trait_art_skycraft$"
 trait_art_skycraft_advanced_desc:0 "$trait_art_skycraft_desc$"
 trait_art_skycraft_desc:0 "Власть над небом — искусство ветра и погоды, которого боятся и которое уважают моряки: они прекрасно знают, насколько опасен для их промысла внезапный шторм. Некоторые области защищены от воздействия этого искусства, прежде всего подводные пространства. Ни один кит не известен особой связью с Властью над небом, а разрозненные сообщества, владеющие ею, например морской народ, обычно не желают делиться секретами её применения."
 trait_art_spring:0 "Искусство Весны"
 trait_art_spring_advanced:0 "Мастерство: $trait_art_spring$"
 trait_art_spring_advanced_desc:0 "$trait_art_spring_desc$"
 trait_art_spring_desc:0 "Весна воплощает живой оптимизм фей, их способность удивляться и близость к природе. Весенние колдовства направляют Гламур на рост, новую жизнь и защиту. Хотя современные подменыши предпочитают Изначальность, Весна сохраняет круг преданных последователей, главным образом при Благом дворе."
 trait_art_summer:0 "Искусство Лета"
 trait_art_summer_advanced:0 "Мастерство: $trait_art_summer$"
 trait_art_summer_advanced_desc:0 "$trait_art_summer_desc$"
 trait_art_summer_desc:0 "Искусство Лета — одна из самых прославленных разновидностей магии китэйнов, особенно тесно связанная с Благим двором. Это могущественное сезонное искусство подчиняет магию огня, страсти, жарких дней томления и ночей грёз. Многие подменыши считают его бесценным средством извлечения Гламура из циничного сердца Осеннего мира."
 trait_art_winter:0 "Искусство Зимы"
 trait_art_winter_advanced:0 "Мастерство: $trait_art_winter$"
 trait_art_winter_advanced_desc:0 "$trait_art_winter_desc$"
 trait_art_winter_desc:0 "Несмотря на долгое отсутствие в Грёзе, подменыши сохраняют связь с временами года. Каждый из четырёх циклов дарует китэйнам могущественную магию, но ни одна не столь неумолима и страшна, как зимняя. Зима использует связь фей с замёрзшими озёрами, бесконечными ночами и пронизывающими ветрами. Зимние колдовства управляют холодом, льдом, страхом и утратой желаний. Многие считают Зиму искусством Неблагого двора, однако изучать зимнюю магию может любой подменыш."
 trait_autumn:0 "Осень"
 trait_banality:0 "Банальность"
