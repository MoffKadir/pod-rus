l_russian:
 LOADING_TIP_109:0 "#high \"На протяжении тысячелетий возникали культы смерти, диктующие конец света и отдающиеся своим избавителям. Мир уже закончился? Нет. Были ли эти избавители когда-нибудь кем-то иным, чем голодными ублюдками? Нет. Возьми Тремера\"#! - Тэлли"
 LOADING_TIP_186:0 "#high \"Вампиры? Найдите его, задержите его крестом, подожгите, фу, никакого вампира. \nОборотень? Найди одного, протяни свой крест, потеряй левую руку, достань свой крест, потеряй правую руку, кого-нибудь еще? \"#! - Черные фурии об инквизиции"
 LOADING_TIP_187:0 "#high \"Потомки Фенрира создают впечатление, что они выйдут из ярости и съедят ваше лицо в любую секунду. Теневые Лорды создают впечатление, что они собираются ускользнуть и убить вас во сне в любой вечер. \"#! - Кара"
 LOADING_TIP_71:0 "#high \"Я думаю, они думают, что мы тратим много времени на то, чтобы шпионить за ними и пытаться подорвать их деятельность. Как будто их так сложно разгадать.\"#! - Носферату о Вентру"
