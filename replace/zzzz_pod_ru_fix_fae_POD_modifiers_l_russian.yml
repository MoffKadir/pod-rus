 PODElementalAscensionBuff_glome:0 "Ячейки [POD_health_track|E]: #P +1#!\nУлучшает базовые узлы ([crafting_nodes|E]) ковки ([crafting_forging|E])."
 PODElementalAscensionBuff_kubera:0 "Стоимость [crafting|E] в золоте: #P -25%#!\n$passive_cantrip_actor$ Исцеляет [EmptyScope.ScriptValue('POD_ascended_kubera_heal')] ед. [POD_superficial_damage_with_box|E] у союзных рыцарей ([knights|E]), когда вы командуете ([commander|E]) во время [combat_phase|E], или у вас во время [single_combat_duel_plural|E]."
 PODElementalAscensionBuff_mannikin:0 "Получите возможность использовать [noble_arts_lifestyle|E] с ограничением: никогда не сможете выбрать [perks|E] #N уровня 4#! и выше."
 PODElementalAscensionBuff_ondine:0 "$cantrip_standard_bunk$ Призвать цель в свой двор. \n$cantrip_hard_bunk$ Призвать цель в свой [prison|E]"
 PODElementalAscensionBuff_paroseme:0 "Улучшите [GetTrait('art_stratus').GetName(GetPlayer)] [cantrip|E], удалив ограничение размера [army|E]."
 PODElementalAscensionBuff_solimond:0 "$passive_cantrip_nature$ В зависимости от уровня $fae_nature_realm$ #underline;TOOLTIP:PODElementalAscensionBuff_solimond_tt наносит#! [POD_superficial_damage_with_box|E] или [POD_aggravated_damage_with_box|E] вражеским рыцарям ([knights|E]), когда вы командуете ([commander|E]) во время [combat_phase|E], или вашему противнику во время [single_combat_duel_plural|E]."
 PODElementalAscensionBuff_solimond_tt:0 "[GetPerk('realm_nature_1_perk').GetName(GetPlayer)]: 0 [POD_superficial_damage_with_box|E]\n[GetPerk('realm_nature_2_perk').GetName(GetPlayer)]: 1 [POD_superficial_damage_with_box|E]\n[GetPerk('realm_nature_3_perk').GetName(GetPlayer)]: 2 [POD_superficial_damage_with_box|E]\n[GetPerk('realm_nature_4_perk').GetName(GetPlayer)]: 1 [POD_aggravated_damage_with_box|E]\n[GetPerk('realm_nature_5_perk').GetName(GetPlayer)]: 1 [POD_aggravated_damage_with_box|E] и 2 [POD_superficial_damage_with_box|E]"
