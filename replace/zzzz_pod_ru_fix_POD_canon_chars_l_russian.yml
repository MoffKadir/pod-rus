 mary_commission_scales_tt:0 "Весы Силы склоняются к вам."
 montano_introone_tt:0 "Вы получите 20-летнее перемирие с Камиллой и положительный модификатор. Невеста Ночи переедет к его двору."
 montano_introtwo_tt:0 "Вы отказываетесь связаться с Камиллой."
 name_michael:0 "Михаил"
 robin_leeland_sherwood_objective:0 "Князь славных товарищей"
 robin_leeland_sherwood_objective_confirm:0 "Больше, чем миф."
 robin_leeland_sherwood_objective_desc:0 "Смертные шепчут истории о преступнике в капюшоне, который крадет у богатых, чтобы раздать бедным. Пришло время легенде взять под свой контроль свой лес."
 robin_leeland_sherwood_objective_effect_tt:0 "Это решение доступно, если вы контролируете Ноттингемшир после 1245 года."
 robin_leeland_sherwood_objective_tooltip:0 "Пронзая сердце Бога."
