l_russian:
 EXECUTION_BJARKAREY_TERROR:0 "Ужас Христа"
 POD_maryb.1.a:0 "Это будет сделано."
 POD_maryb.1.desc:0 "Танит редко когда-либо пишет, но когда она это делает, ваша покровительница всегда говорит прямо. \n\n «Орден Азанеаля растет с каждой ночью», — говорится в ее последнем сообщении. — В Дияр-Рабии есть герцогство с Мосулом у горла, которое должно принадлежать нам. Позаботьтесь об этом, и вашу помощь запомнят."
 POD_maryb.1.t:0 "Соперник в темноте"
 POD_maryb.10.a:0 "Я заработал все, что она мне дала."
 POD_maryb.10.b:0 "Я ей ничего не должна."
 POD_maryb.10.desc:0 "Защита Танит больше не является вашим благом. Сделка, которую вы заключили с ней, теперь отменена, и охотники, которых сдерживало ее влияние, теперь могут свободно охотиться за вашей головой."
 POD_maryb.10.t:0 "Затянувшийся долг"
 POD_maryb.100.a:0 "Он был прекрасен, я... была дурой."
 POD_maryb.100.b:0 "Я больше не та девушка."
 POD_maryb.100.c:0 "Он любил меня когда-то, должно быть, любил, верно?"
 POD_maryb.100.c.tt:0 "#shinygold «Теперь ты видишь, моя возлюбленная?» #!"
 POD_maryb.100.desc:0 "Когда ваши руки сжимают глину, поток воспоминаний безжалостно возвращается в ваш разум. \n\nВы преклонили колени перед ним в великолепном храме, и в тот момент, когда вы почувствовали, как его рука нежно коснулась ваших волос, вы поняли, что он особенный. Тем, кого нужно бояться и кому нужно поклоняться. #shinygold 'Ты первой увидела человека под сиянием.' #! Когда он дал вам свое свежее витэ, вы были поражены самим присутствием божественности, стоящей перед вами. Никогда вы не чувствовали ничего подобного ни до, ни после. \n\n Тогда вы были всего лишь девочкой. Вы ещё никому не были врагом."
 POD_maryb.100.t:0 "Почитательница"
 POD_maryb.110.a:0 "Он оставил меня умирать!"
 POD_maryb.110.b:0 "Неважно, почему он сделал то, что сделал. Боль присутствует несмотря ни на что."
 POD_maryb.110.c:0 "Он был вынужден уйти. Должно быть, он был."
 POD_maryb.110.c.tt:0 "В груди становится легче. #shinygold 'Именно' #!"
 POD_maryb.110.desc:0 "Этот кусок глины все еще кажется влажным на ощупь, несмотря на то, что прошло столько времени, и он отчетливо помнит падение. \n\nКогда мир вокруг вас начал рушиться, вы отправились в единственное безопасное убежище, о котором только могли подумать. Тот самый храм, где вы впервые преклонила перед ним колени. Но его там не было. #shinygold 'Мне пришлось оставить тебя. Я был вынужден. Ты должна понять: «#! Аккадцы поднимались по лестнице. #shinygold 'Я никогда не переставал пытаться протянуть руку, даже когда был связан.'#! Не видя другого выхода, вы подняли его меч, а вас ждали глиняные таблички. \n\nВ конце концов, он вам по-настоящему и не понадобился. Этого окровавленного клинка было достаточно."
 POD_maryb.110.t:0 "Предательство"
 POD_maryb.120.a:0 "Оружие, которое он выковал, обернулось против него."
 POD_maryb.120.b:0 "Я была сырьём для него и всех остальных. Ничего больше."
 POD_maryb.120.c:0 "Анадук отдал мне мое тело, но все в этой оболочке тянулось к тебе."
 POD_maryb.120.c.tt:0 "#shinygold Какой бы сломленной ты ни была, ты всегда возвращалась ко мне.#!"
 POD_maryb.120.desc:0 "Эта последняя табличка не ваша. Глина не такая старая, как те, что вы написали, но Анадук, тот, кто ее написал, давно умер. Несмотря на то, что вы сами этого не писали, вы все равно это знаете близко. В конце концов, это ваша жизнь.\n\Эта табличка содержит пересказ Анадука. В нем подробно описано, как он нашел то, что аккадцы оставили от девушки из Эблы. Как он отнес свою сделку в яму, поговорил с Аностером, одним из Деканов, и заплатил столько, сколько демон счёл нужным. Как существо, посланное Аностером, проглотило таблички одну за другой, прежде чем подняться. \n\nНо коллекция была неполной, и то, что проснулось, тоже было неполным, с разрозненными воспоминаниями. \n\nОн пишет о вас как об орудии, созданием которого он так гордился. Он определенно не ожидал, что этот инструмент обернется против него в праведной ярости. \n\n Остальное вы помните без таблички. Вы сомневаетесь, что когда-нибудь забудешь вид крови Анадука. \n\n#shinygold Он вернул тебе тело, моя возлюбленная, но не более того. Какое бы зло ни пробудилось в этой плоти позже, это не его вина. #!"
 POD_maryb.120.t:0 "Вызов"
 POD_maryb.140.a:0 "Хорошо. Позвольте мне увидеть его глазами."
 POD_maryb.140.desc:0 "С тех пор, как Константинополь сгорел, вы изо всех сил старались отвести от этого взор. Но теперь, думая о нем, вы не можете собраться с силами, чтобы отвести взгляд. \n\nКонстантинополь ярко горел, в смерти и жизни. Вы спустились в гробницу под огромной церковью с клинком, который когда-то обратили против себя в Эбле, и нашли Михаила лежащим прямо там, совершенно мирным и довольным. \n\nВы помните, как сжимали клинок до тех пор, пока ваши руки не кровоточили от силы, затем с криком сломали его о колено и бросили обломки ему на грудь. Вы кричали и кричали, царапая свое лицо до тех пор, пока оно не превратилось в кровавое месиво, клянясь, что он будет страдать так же, как и вы, и что его драгоценная Мечта сгорит дотла. \n\Вы не позволяли себе пытаться это понять, но теперь его душа была едина с вашей, и больше нельзя было прятаться."
 POD_maryb.140.t:0 "Улыбка"
 POD_maryb.141.a:0 "Я беру стилус."
 POD_maryb.141.desc:0 "#shinygold Над нами сияет великолепное золотое сияние. Ангелы, стоящие вокруг. О, какой ты предстала передо мной... как темная звезда, готовая поднять меня ближе к небесам. #!\n\nДля Михаила его смерть была страстями в древнем смысле слова — священным страданием. Ваши клыки, опустившиеся на его обнаженное горло, были не просто каким-то простым убийством. \n\nКогда вы подняли руку, чтобы сразить Его драгоценного Христа в качестве последней насмешки, его глаза даже не заметили вас. Он увидел Дракона: своего возлюбленного, равного ему, и лицо сына. После этого он принял вашу месть с распростертыми объятиями.\n\nВы так долго готовились заставить Михаила страдать так же, как вы, но этот момент возмездия был самым счастливым моментом в его нежизни.\n\n#shinygold Нам суждено было быть вместе, так же, как это всегда должно было закончиться, как и всегда должно было начаться.#!"
 POD_maryb.141.t:0 "Страсть"
 POD_maryb.2.a:0 "Задача выполнена."
 POD_maryb.2.desc:0 "Все следы Ордена Азанеаля были стерты из этого места, и все благодаря вам. Кусочек Дияра Рабии теперь принадлежит вам."
 POD_maryb.2.t:0 "Разгромленный орден"
 POD_maryb.200.a:0 "Я пишу его разрушение. Мечта моя, а не его!"
 POD_maryb.200.b:0 "Я записываю нас обоих."
 POD_maryb.200.b.tt:0 "#shinygold Значит, вместе. Я могу жить с этим. Мне больше негде быть.#!"
 POD_maryb.200.c:0 "Я откладываю стилус. Пусть он это напишет."
 POD_maryb.200.c.tt:0 "#shinygold Спасибо, возлюбленная. Я не буду не потрачу ни единого слова впустую.#!"
 POD_maryb.200.desc:0 "Перед вами лежат три глиняные таблички, а в вашей руке стилус, чтобы записать четвёртую. \n\nТеперь он молчит, за вашими глазами. Он ждёт, что вы напишете, поскольку теперь следующие слова принадлежат вам, а не ему. \n\nТри таблички выполнили свою задачу, и все, что осталось, — это правильный финал. Стилус вдавливается в глину..."
 POD_maryb.200.t:0 "Напишите последнюю табличку"
 POD_maryb.210.a:0 "Мечта принадлежит только мне."
 POD_maryb.210.desc:0 "Вы кладете три таблички в прежнее положение, четвертую в свою руку и стоите молча. Душа, преследовавшая вас так долго, наконец-то поглощена. Он никогда не получит своего конца. То, что осталось в вашей душе, возможно, не такое теплое, как у него, но, по крайней мере, оно полностью ваше, и этого достаточно.\n\nМечта всегда должна была принадлежать кому-то, в этом не было сомнений. Вам выпало стать этой счастливицей. С этого момента Мечта больше не связана с любовью, спасением или судьбой. Речь идет о том, насколько испорченным может быть Мечта, прежде чем он станет Кошмаром. \n\nВы намерены это выяснить и получить от этого огромное удовольствие."
 POD_maryb.210.t:0 "Черная мечта"
 POD_maryb.220.a:0 "#shinygold Рай на Земле, созданный моей собственной рукой.#!"
 POD_maryb.220.desc:0 "На очень короткий момент Мэри чувствует что-то похожее на настоящий ужас. Затем все, что от нее осталось, уходит навсегда. \n\n#shinygold Я снова поднимаюсь в тело, которое ты носила для меня, и жизнь, которую ты сохраняла для меня, и обнаруживаю, что мир дождался меня лучше, чем я смел надеяться. #!\n\n Никогда не было «Мэри Черной». Всегда существовала только Мечта и сосуд, который нёс к ней Михаила. Однако сделки, которые она заключила с тьмой, она должна выполнить. Ее душа берет их с собой, куда бы ни пошли такие души, как она. На теле остались некоторые пятна, но это не имеет значения. \n\n Старые силы возвращаются в ваши руки, так же естественно, как когда-то было дыхание. Пусть они еще раз увидят, как выглядит ангел, когда он ходит среди них.\n\n#shinygold У меня так много работы.#!"
 POD_maryb.220.t:0 "Вторая Мечта"
 POD_maryb.230.a:0 "Мечта наша."
 POD_maryb.230.desc:0 "Вас двое сейчас в часовне. Сейчас в часовне только один из вас. Неужели это уже имеет значение? Некоторое время назад эта разница перестала что-либо значить. \n\n#shinygold Возлюбленная. #!\n\nЛюбимый. \n\n#shinygold Это было не то, чего хотел любой из нас. #!\n\nЭто было не так. И все же это то, что мы создали. \n\n Никто из вас не был уничтожен. Вместо этого там, где когда-то стояли Мэри и Михаил, стоит нечто иное, нечто без имени, но со своей сильной волей. Однажды славной ночью о нём узнает весь мир."
 POD_maryb.230.t:0 "Пепел и золото"
 POD_maryb.242.a:0 "Пусть они подойдут."
 POD_maryb.242.desc:0 "Последний обряд — самый тихий, но самый важный. \n\nНаверху громко звонят колокола великой церкви, празднуя, когда десятки паломников поднимаются на холм в город, который до сих пор для каждого смертного глаза является маяком мировой веры. Никто из них не чувствует великих перемен, происходящих прямо у них под ногами. \n\nКолодец Жертвоприношений открыт. То, что вы сделали с Константинополем, теперь отвечает вам, и то, что поднимается из глубокой темной шахты, когда вы его зовете, больше не связано старыми правилами призыва. \n\n#shinygold Прекрасно сделано, возлюбленная. Мы уже почти у цели. #! На секунду нежное божественное тепло в ваших глазах кажется не приятной компанией, а скорее рукой, сжимающей ваше горло, но потом оно исчезает, Колодец принадлежит вам, и мысль не возвращается."
 POD_maryb.242.t:0 "Как вверху, так и внизу"
 POD_maryb.3.a:0 "Их молитвы не спасут их."
 POD_maryb.3.desc:0 "«Кипр», — новое сообщение Танит начинается просто. Затем: «Рыцари Акры обосновались там, готовя свои клинки против нас. Раздавите набирающих силу охотников, прежде чем они станут для нас настоящей угрозой»."
 POD_maryb.3.t:0 "Благочестивая угроза"
 POD_maryb.300.a:0 "Время встретиться с монстром."
 POD_maryb.300.desc:0 "Вы провели бесчисленные долгие ночи, мечтая о том, что вы сделаете с Аностером. Часть вашей сущности все еще записана в его бухгалтерской книге, и он намерен вернуть ее. \n\nВы не позволяете ему это сделать. Вы встретитесь с ним лицом к лицу и полностью уничтожите этот реестр!"
 POD_maryb.300.t:0 "Охота на Декани"
 POD_maryb.310.a:0 "Давайте танцевать."
 POD_maryb.310.a.tt:0 "Сразитесь с Декани за книгу долгов и свою душу. #P Победите#! — и Аностер будет уничтожен, а ваши договоры разорваны навсегда. #N Проиграйте#! — и он заберёт вас."
 POD_maryb.310.desc:0 "Круг держится крепко, когда вы закончите его подготовку. Аностер приходит, когда его зовут, как всегда делают Демоны, связанные именем. Но он не приходит для того, чтобы его добровольно уничтожили, нет, он здесь для того, чтобы забрать то, что вы ему должны. \n\nНет обряда, который бы завершил это чисто. Единственное, что завершит это, — это вы двое внутри нечестивого круга, и старая книга между вами, которую один закроет, уничтожив другого. Он питался частью вашего имени после сделки Анадука и теперь намерен забрать вас целиком. \n\nКем бы вы сейчас ни были, Мэри, молитесь, чтобы силы в ваших венах хватило для этого противостояния."
 POD_maryb.310.failure:0 "Этого недостаточно.\n\nРегистр закрывается в другую сторону. Мэри Чёрной никогда не было, и долг выплачен с процентами."
 POD_maryb.310.success:0 "Достаточно. \n\n Вы сжигаете табличку. Аностер не выживает в огне, и книга закрывается навсегда."
 POD_maryb.310.t:0 "Связывающий круг"
 POD_maryb.320.a:0 "Мечта живет."
 POD_maryb.320.desc:0 "Из Константинополя поднимается знамя, которое мир считал уничтоженным. Константинопольский Патриархат, находившийся в изгнании и так долго ожидавший, снова возрождается. \n\nКодекс Наследия выводится из укрытия, а жизнь возвращается в Мечту. Тело, которое управляет им, — это не тело, с которым оно знакомо, а душа внутри, та же самая, знакомая, и это достаточно хорошо. \n\n#shinygold Моя возлюбленная, мы дома. Нам еще так много работы предстоит сделать, и теперь, наконец, у нас есть остаток вечности, чтобы сделать это.#!"
 POD_maryb.320.t:0 "Патриарх возвращается"
 POD_maryb.4.a:0 "Остров ранен, но больше не представляет угрозы."
 POD_maryb.4.desc:0 "Кипр перешел в другие руки после нескольких хаотичных ночей для его жителей. Креста, висевшего над головой Танит, больше нет, и теперь вы можете дышать немного свободнее."
 POD_maryb.4.t:0 "Сломанная вера"
 POD_maryb.5.a:0 "Пришло время устранить еще одну угрозу."
 POD_maryb.5.desc:0 "Письмо Танит на этот раз еще короче, чем обычно. «Оливковый собор слишком вольготно устроился. Антиохия или Ливан. Сделайте свой выбор и напомните им о силе, которой мы обладаем»."
 POD_maryb.5.t:0 "Оливковый собор"
 POD_maryb.50.a:0 "Продолжайте."
 POD_maryb.6.a:0 "Надеюсь, ты довольна, Танит."
 POD_maryb.6.desc:0 "Еще одна угроза Танит устранена. $pod_cainites$ Собора потеряли основу власти благодаря вашим смелым действиям. Они больше не будут недооценивать вашу покровительницу, это точно."
 POD_maryb.6.t:0 "Горящие оливковые деревья"
 POD_maryb.7.a:0 "Наслаждайся своим убежищем, пока оно есть, Шутатара."
 POD_maryb.7.desc:0 "Рано ночью приходит еще одно короткое сообщение от Танит. \n\n'Шутатара находится на Кипре. Девушка предпочла Бруха своему сиру, и он достаточно сентиментален, чтобы оставить ее себе. Кипр должен оказаться под нашим контролем, прежде чем эта пара сможет вместе стать сильнее. Позаботься об этом, Мэри."
 POD_maryb.7.t:0 "Прибежище дочери"
 POD_maryb.8.a:0 "Пусть она бегает, я получила то, что хотел."
 POD_maryb.8.desc:0 "К тому времени, как над островом встает солнце, двор Неемии уже разбежался. Куда бы Шутатара ни сбежала в следующий раз, больше не о чем беспокоиться. Теперь остров принадлежит вам."
 POD_maryb.8.t:0 "Кипр повержен"
 PODcanon_chars.114.a:0 "Рим достаточно велик для нас двоих."
 PODcanon_chars.114.b:0 "У Рима есть законный правитель, и это не этот князь-гедонист."
 PODcanon_chars.114.desc:0 "Затененный Монтано, Вечный город требует вашего внимания. Ваш клан процветал в полутени Святого Престола, контролируя верных смертных на расстоянии. Усиление контроля Камиллы над Римом угрожает вашему доступу к секретам хранилищ и ресурсов Ватикана. \n\nНеобходимо принять решение. Вы можете начать дипломатические усилия, отправив талантливого эмиссара и предоставив Камилле то, чего жаждет его клан: легитимность и признание. Если вы официально признаете его князем Рима, его гордость будет удовлетворена. В обмен он позволит вашим агентам продолжать свою работу. \n\nВ качестве альтернативы вы можете ничего не предлагать. Зачем торговаться за то, что вы так долго брали бесплатно? Ваши шпионы больше не смогут продолжать свою деятельность, но и вы не окажете Камилле никакой помощи."
 PODcanon_chars.114.t:0 "Римский вопрос"
 PODcanon_chars.115.a:0 "Пусть тени окружат и задушат священников."
 PODcanon_chars.115.b:0 "Я князь всего Рима, включая Святой Престол!"
 PODcanon_chars.115.desc:0 "Царственный Камилла, тени приближаются к Риму. Женщина, называющая себя «Невестой ночи», приносит официальную петицию от самого Монтано. Вы вернули себе власть над Римом, несмотря на яростное сопротивление. Теперь Монтано предлагает уступку. Он официально признает вас бесспорным князем Рима, придав вес своего имени для легитимизации вашего правления. \n\nЦена этой короны — Ватикан. Монтано просит вас закрыть глаза на его агентов, которые проникают к святым людям, получают доступ к их секретным хранилищам и огромным средствам. Если вы согласитесь, Невеста Ночи останется в вашем дворе послом доброй воли. Впрочем, одновременно она будет глазами Монтано. \n\nВыберете ли вы абсолютный контроль или отдадите духовное сердце смертных теням в их пользу?"
 PODcanon_chars.115.t:0 "Сицилийский вопрос"
 PODcanon_chars.116.a:0 "Рим мог бы меня немного порадовать."
 PODcanon_chars.116.b:0 "Я Богиня, и я требую поклонения!"
 PODcanon_chars.116.c:0 "Пусть и старейшины, и птенцы прославляют моё имя."
 PODcanon_chars.116.c.tt:0 "Вера Сыновей и Дочерей Елены активирована. Следуя ей, Елена откроет для себя новая цель."
 PODcanon_chars.116.d:0 "Мне не нужны поклонники или вера, чтобы согреть мою кровь."
 PODcanon_chars.116.desc:0 "Как бы вам не хотелось это признавать, тишина, которую оставил после себя спартанец, была оглушительной. Так долго ваша не-жизнь определялась этим славным и ожесточенным соперничеством. Без ответных действий Менелая, без его ненависти, подпитывающей вашу, вы останетесь смотреть на пустую шахматную доску. \n\nБез цели вы можете почувствовать, как на вас надвигается долгий сон. Чтобы избежать этого, вы должны проложить новый курс. Вы могли бы посмотреть на восток, где Камилла держит двор, и найти там новую цель. Возможно, вы могли бы принять божественность, которой славитесь. Вы могли бы даже полностью выковать новую веру, посвятив массы своему сияющему совершенству."
 PODcanon_chars.116.t:0 "Последнее эхо Спарты"
 PODcanon_chars.117.a:0 "Нет! Я... Я не монстр!"
 PODcanon_chars.117.a.tt:0 "#beast Жалкая собачка! #!"
 PODcanon_chars.117.b:0 "Ты не командуешь Волком!"
 PODcanon_chars.117.b.tt:0 "#beast Да! Дайте крови течь!#!"
 PODcanon_chars.117.desc:0 "Ливонская грязь густо пропитана кровью. Когда одетые в чёрное Вентру Александра сталкиваются с воющими Дикарями Караха, крики заглушают всякую разумную мысль. Ваши руки скользкие от крови, а последняя связь с рассудком вот-вот оборвётся.\n\n#beast Вырви им чёртовы кишки! Разорви их на части!#!\n\n[Glossary('Зверь','game_concept_beast_desc')] вопит в вашей голове, изрыгая чистую злобу. Сквозь красную пелену перед глазами вы видите приближающегося знакомого старика. Дедушка. Почтенный Гангрел поднимает руки; его глаза полны сострадания и понимания.\n\n«Дыши, волк», — его мягкий голос пробивается сквозь крики умирающих. «Не поддавайся [Glossary('Зверю','game_concept_beast_desc')]. Держись за меня».\n\n#beast Оторви ему чёртову голову!#!\n\nВы шипите, и ваши когтистые руки дрожат. Витэ под его кожей так легко взять... уступите ли вы соблазну или всеми силами воспротивитесь чудовищу внутри?"
 PODcanon_chars.117.t:0 "На грани безумия"
 PODcanon_chars.118.a:0 "Я... я почти..."
 PODcanon_chars.118.desc:0 "Сосредоточившись, вы чувствуете, как безумный [Glossary('Зверь','game_concept_beast_desc')] разочарованно отступает. Звуки битвы вдруг кажутся ещё страшнее. Вы широко раскрываете глаза: ваши когтистые руки всего в нескольких дюймах от горла Дедушки. Ещё секунда — и вы разорвали бы глотку самой доброй душе в вашем мире. Восторженная ярость, которую вы ощущали миг назад, сменяется удушающим стыдом, тяжело давящим на грудь. Вы опускаете окровавленные руки и отшатываетесь, не в силах посмотреть старику в глаза.\n\nДедушка мягко кладёт ладонь на ваше поникшее плечо. «Буря миновала, волк, — шепчет он. — Не стыдись того, что почувствовал зов тьмы. Гордись тем, что устоял и вспомнил, кто ты».\n\nВы закрываете глаза, позволяя его спокойному присутствию вернуть вас к реальности."
 PODcanon_chars.118.t:0 "Человечность в самый мрачный час"
 PODcanon_chars.119.a:0 "Я проклят..."
 PODcanon_chars.119.desc:0 "Первое, что вы ощущаете после всепоглощающей ярости, — свежее витэ и пепел на зубах.\n\nПеред вами лежит Дедушка — точнее, то, что от него осталось. Несколько костей и пепел там, где он стоял. Теперь вы помните, как пили его кровь. Пили, пока его древняя кровь не оказалась в ваших жилах, а затем потянули в них и его невинную душу. Страшное, упоительное тепло сталкивается с невыносимым стыдом и виной в вашей груди.\n\nВы убили самую добрую душу Ливонии и поглотили её сущность.\n\nВы падаете в пропитанную кровью грязь и в отчаянии хватаетесь за голову."
 PODcanon_chars.119.t:0 "Дикий"
 PODcanon_chars.120.a:0 "Это английская смелость!"
 PODcanon_chars.120.b:0 "Уважение да, мир нет."
 PODcanon_chars.120.desc:0 "Упрямый Робин, Шервудский лес наконец-то под вашим полным контролем. На протяжении десятилетий вы вели бесконечную войну против иностранного тирана, обескровившего эту землю. Смертные воспевают великодушного преступника в зеленом капюшоне, призрака, который обворовывает богатых и защищает угнетенных. Они сплетают истории о весельчаках и благородном воровстве, блаженно слепые к истинной, бессмертной природе человека, стоящего за легендой. \n\nМиф, возможно, неточный, но он служит великой цели. Это дает надежду как Сородичам, так и смертным в темные века. Шервуд наконец-то может стать отправной точкой великой войны против тиранов, как вы всегда и хотели. Вы сражались так яростно, что даже сам Митра признал ваши претензии. Древний тиран счел вас неприкасаемым, предоставив редкое и с таким трудом завоеванное перемирие. \n\nЛегенды могут приукрасить борьбу и кровопролитие, но справедливость, которую вы приносите тиранам, вполне реальна."
 PODcanon_chars.120.t:0 "Миф во плоти"
 PODcanon_chars.121.a:0 "Тишина!"
 PODcanon_chars.121.desc:0 "Ослепительный свет Архангела столько лет жег ваш разум и душу изнутри. Высокомерный Тореадор попытался заменить ваши мысли своей невыносимой святой манией величия. Каждую ночь была постоянная борьба с тем, чтобы заставить замолчать хор, звучащий в вашей голове. \n\nНо больше этого нет. Свет Михаила почти исчез. \n\n Конечно, вы не стерли его полностью. Он слишком древний и слишком упрямый, чтобы его можно было уничтожить так быстро. Он все еще здесь, но резкий свет потускнел и превратился в слабое сияние. Вы чувствуете ясность впервые за десятилетия. \n\nМечта мертва. Ваш разум принадлежит вам.\n\n#color:{0.75,0.5,0.21};glow_color:{0.75,0.5,0.21,0.5} Наслаждайтесь этой мимолетной тишиной. У меня есть целая вечность, чтобы подняться.#!"
 PODcanon_chars.121.t:0 "Тихий ангел"
 PODcanon_chars.69.t:0 "Veni, Vidi, Vici"
 camilla_introone_tt:0 "Вы получите 20-летнее перемирие с Монтано и сильного придворного."
 camilla_introtwo_tt:0 "Вы отказываетесь от предложения Монтано о выгодном партнерстве."
 dark_alliance_opinion:0 "Темный Альянс"
