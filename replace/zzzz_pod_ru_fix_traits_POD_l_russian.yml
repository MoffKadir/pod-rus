 trait_spell_of_life_and_elixir_of_eternal_life_player_desc:0 "$trait_spell_of_life_player_desc$\n\n#medium;italic #V Вы#! получаете [trait_level_track_xp|E] Эликсира вечной жизни из следующих источников:#!\n\n\n#medium;italic #V Вы#! получаете #V пассивный#! [trait_level_track_xp|E] Эликсира вечной жизни каждые #V 5#! лет:#!\nПассивный опыт: #TOOLTIP:trait_track_elixir_of_eternal_life_desc_in_game_tt #L;P +[GetPlayer.MakeScope.ScriptValue('POD_mummy_elixir_of_eternal_life_xp_passive')|2]#! #L (см. подсказку)#!#!\n#TOOLTIP:trait_track_elixir_of_eternal_life_desc_insight_passive #L Все возможные источники пассивного опыта (см. подсказку)#!#!"
 trait_spell_of_life_holder:0 "Хранитель Заклинания Жизни"
 trait_spell_of_life_holder_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] владеет тайнами Заклинания Жизни."
 trait_spell_of_life_player_desc:0 "$trait_eternal_rebirth_seeker_desc$\n\n#medium;italic #V Вы#! получаете [trait_level_track_xp|E] Заклинания Жизни из следующих источников:#!\nУспешное завершение [journey|E] \"$spell_of_life_stage2_targeted_journey_name$\": #P +10.00 #!\nУспешное завершение [journey|E] \"$spell_of_life_stage2_random_journey_name$\": #P +5.00 #!\n\n#medium;italic #V Вы#! получаете #V пассивный#! [trait_level_track_xp|E] Заклинания Жизни каждые #V 5#! лет:#!\nПассивный опыт: #TOOLTIP:trait_track_spell_of_life_desc_in_game_tt #L;P +[GetPlayer.MakeScope.ScriptValue('POD_mummy_spell_of_life_xp_passive')|2]#! #L (см. подсказку)#!#!\n#TOOLTIP:trait_track_spell_of_life_desc_insight_passive #L Все возможные источники пассивного опыта (см. подсказку)#!#!"
 trait_swift_movement_1:0 "Быстрое передвижение"
 trait_swift_movement_2:0 "Молниеносный марш"
 trait_swift_movement_3:0 "Бич Рима"
 trait_teachings_1:0 "Учения Чандрапутры"
 trait_teachings_2:0 "Вечный тактик"
 trait_teachings_3:0 "Вечный стратег"
 trait_temporisadvanced_desc_moves:0 "#medium [PODUnlocksCombatMove('POD_combat_move_patience_of_the_norns')]#!\n\n$trait_temporisadvanced_desc_plain$"
 trait_temporisadvanced_desc_plain:0 "Темпорис — $pod_discipline$, присущая лишь Истинным Бруха. Считающаяся усовершенствованием Стремительности, Темпорис позволяет $pod_cainite$ управлять самим течением времени.\n\nНесмотря на своё могущество, эта $pod_discipline$ может требовать больших усилий при использовании."
 trait_the_hollow:0 "Опустошённый"
 trait_the_hollow_character_desc:0 "[ROOT.Char.GetFirstNameNoTooltip] — ничто. Ни живые, ни мёртвые не принимают [ROOT.Char.GetHerHim]. [Glossary('Зверь','game_concept_beast_desc')] шевелится в тишине там, где прежде была [ROOT.Char.GetHerHis] душа."
 trait_the_hollow_desc:0 "Этот персонаж — ничто. Ни живые, ни мёртвые не принимают его. [Glossary('Зверь','game_concept_beast_desc')] шевелится в тишине там, где прежде была его душа."
 trait_track_aye:0 "#color:{0.75,0.65,0.45} Айе#!"
 trait_track_aye_desc:0 "Связь с миром живых. Высокий уровень Айе дарует влияние на смертных, улучшает мнение окружающих и укрепляет управление."
 trait_track_caitiff_warrior:0 "Закалённый выживший"
 trait_track_caitiff_warrior_desc:0 "#help Вы получаете опыт в этом направлении, обороняясь в качестве командующего во время войн.#!"
 trait_track_elixir_of_eternal_life:0 "Эликсир вечной жизни"
 trait_track_elixir_of_eternal_life_desc:0 "\nВаш [trait_level_track_xp|E] отражает ваши знания об Эликсире вечной жизни и близость к его завершению."
