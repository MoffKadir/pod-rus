 trait_POD_asakku_elioud_desc:0 "Участник сети охотников на асакку Тал’Ма’Ра. Обучен распознавать и уничтожать духовную заразу."
 trait_POD_asakku_iryi_ascendant:0 "Возвысившийся ирьи"
 trait_POD_asakku_iryi_ascendant_desc:0 "Границы больше нет. Вы стали чем-то более древним, носящим облик, который когда-то принадлежал лишь вам."
 trait_POD_asakku_lich:0 "Лич"
 trait_POD_asakku_lich_desc:0 "Ямасаттва — бессмертный маг, чья душа была привязана к его собственному сохранённому трупу обрядом, более древним, чем большая часть памяти каинитов."
 trait_POD_asakku_soul_infection:0 "Заражение души"
 trait_POD_asakku_soul_infection_desc:0 "Нечто пустило корни в крови. Это не болезнь: болезни можно вылечить. Это нечто более древнее — и терпеливое."
 trait_auspexadvanced_desc_moves:0 "#medium [PODUnlocksCombatMove('POD_combat_move_anticipate_victory')]#!\n\n$trait_auspexadvanced_desc_plain$"
 trait_auspexadvanced_desc_plain:0 "Прорицание — $pod_discipline$, наделяющая вампиров сверхъестественными чувствами.\nЭто одна из самых распространённых и излюбленных [Glossary('дисциплин','game_concept_discipline_desc')] среди $pod_cainites$ благодаря своей универсальности и полезности практически во всех аспектах вампирского существования. Кроме того, известно, что она дарует некоторую способность к предвидению, особенно когда предупреждает $pod_cainite$ об опасности, даже если тот находится в $pod_torpor$."
 trait_caitiff_warrior_1:0 "Воин-каитифф"
 trait_caitiff_warrior_2:0 "Каитифф-драчун"
 trait_caitiff_warrior_3:0 "Каитифф-выживший"
 trait_celerity_desc_moves:0 "#medium [PODUnlocksCombatMove('POD_combat_move_celerity_burst')]#!\n\n$trait_celerity_desc_plain$"
 trait_celerity_desc_plain:0 "Стремительность — $pod_discipline$, дарующая вампирам сверхъестественную скорость и быстроту реакции.\n\nДля некоторых $pod_cainites$ мир смертных движется словно в замедленном темпе. В напряжённые мгновения вампиры со Стремительностью могут двигаться с поразительной скоростью, превращаясь в размытые силуэты для любого смертного или бессмертного, не владеющего этой $pod_discipline$."
 trait_celerityadvanced_desc_moves:0 "#medium [PODUnlocksCombatMove('POD_combat_move_celerity_burst')]#!\n\n$trait_celerityadvanced_desc_plain$"
 trait_celerityadvanced_desc_plain:0 "Стремительность — $pod_discipline$, дарующая вампирам сверхъестественную скорость и быстроту реакции.\n\nДля некоторых $pod_cainites$ мир смертных движется словно в замедленном темпе. В напряжённые мгновения вампиры со Стремительностью могут двигаться с поразительной скоростью, превращаясь в размытые силуэты для любого смертного или бессмертного, не владеющего этой $pod_discipline$."
 trait_chimerstry_desc_moves:0 "#medium [PODUnlocksCombatMove('POD_combat_move_phantasmal_feint')]#!\n\n$trait_chimerstry_desc_plain$"
 trait_chimerstry_desc_plain:0 "Химерия — фирменная $pod_discipline$ Равнос, воплощающая иллюзии в действительность. Эти призрачные образы настолько реальны, насколько позволяет мастерство $pod_cainite$."
 trait_chimerstryadvanced_desc_moves:0 "#medium [PODUnlocksCombatMove('POD_combat_move_phantasmal_feint')]#!\n\n$trait_chimerstryadvanced_desc_plain$"
 trait_chimerstryadvanced_desc_plain:0 "Химерия — фирменная $pod_discipline$ Равнос, воплощающая иллюзии в действительность. Эти призрачные образы настолько реальны, насколько позволяет мастерство $pod_cainite$."
 trait_custom_mummy_dynasty:0 "Молодая династия"
 trait_custom_mummy_dynasty_customname:0 "[GetPlayer.Custom('PODGetCustomMummyDynastyName')]"
 trait_custom_mummy_dynasty_customname_desc:0 "Это молодая династия бессмертных, чьи представители после смерти отправляются в [GetPlayer.Custom('PODGetCustomMummyDynastyShadowRealm')], прежде чем возродиться. Они прокладывают свой собственный путь в мире, раздираемом конфликтами."
 trait_custom_mummy_dynasty_desc:0 "Это молодая династия бессмертных, прокладывающая новый путь в мире, раздираемом конфликтами."
 trait_daimonionadvanced_desc_moves:0 "#medium [PODUnlocksCombatMove('POD_combat_move_tormented_essence')]#!\n\n$trait_daimonionadvanced_desc_plain$"
 trait_daimonionadvanced_desc_plain:0 "Демонизм — дьявольская $pod_discipline$, которой пользуются лишь Баали и самые порочные вампиры-инферналисты. Его сила — сила самого Дьявола; используя Демонизм, Баали призывают силы Ада и его демонов, чтобы деморализовать и искалечить врагов."
 trait_dominate_desc_moves:0 "#medium [PODUnlocksCombatMove('POD_combat_move_command')]#!\n\n$trait_dominate_desc_plain$"
 trait_dominate_desc_plain:0 "Доминирование — $pod_discipline$, подчиняющая чужой разум воле вампира и заставляющая жертв думать или действовать по его приказу."
 trait_dominateadvanced_desc_moves:0 "#medium [PODUnlocksCombatMove('POD_combat_move_command')]#!\n#medium [PODUnlocksCombatMove('POD_combat_move_possession')]#!\n\n$trait_dominateadvanced_desc_plain$"
 trait_dominateadvanced_desc_plain:0 "Доминирование — $pod_discipline$, подчиняющая чужой разум воле вампира и заставляющая жертв думать или действовать по его приказу.\n\nДоминирование воплощает ту сторону вампирского проклятия, которая обесценивает основы истинной дружбы и близости. Оно также притупляет способность владеющего им к сопереживанию; необходимо следить за тем, чтобы не привыкнуть к постоянному окружению льстецов."
 trait_elixir_of_eternal_life_holder:0 "Хранитель Эликсира вечной жизни"
 trait_elixir_of_eternal_life_holder_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] владеет тайнами Эликсира вечной жизни."
 trait_elixir_of_eternal_life_player_desc:0 "$trait_eternal_rebirth_seeker_desc$\n\n#medium;italic #V Вы#! получаете [trait_level_track_xp|E] Эликсира вечной жизни из следующих источников:#!\nУспешное завершение [journey|E] \"$elixir_of_eternal_life_stage2_random_journey_name$\": #P +5.00 #!\nУспешное выполнение [decision|E] \"$elixir_of_eternal_life_stage2_meditation_decision$\": от #P +5.00#! до #P +15.00#!\n\n#medium;italic #V Вы#! получаете #V пассивный#! [trait_level_track_xp|E] Эликсира вечной жизни каждые #V 5#! лет:#!\nПассивный опыт: #TOOLTIP:trait_track_elixir_of_eternal_life_desc_in_game_tt #L;P +[GetPlayer.MakeScope.ScriptValue('POD_mummy_elixir_of_eternal_life_xp_passive')|2]#! #L (см. подсказку)#!#!\n#TOOLTIP:trait_track_elixir_of_eternal_life_desc_insight_passive #L Все возможные источники пассивного опыта (см. подсказку)#!#!"
 trait_eternal_rebirth_seeker:0 "Искатель вечного перерождения"
 trait_eternal_rebirth_seeker_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] вступает на долгий путь к обретению способа вечного перерождения."
 trait_eternal_rebirth_seeker_desc:0 "Этот персонаж вступил на долгий путь к обретению способа вечного перерождения."
 trait_faithful_warrior_1:0 "Верный воин"
 trait_faithful_warrior_2:0 "Воинствующий полководец"
 trait_faithful_warrior_3:0 "Меч веры"
 trait_flightadvanced_desc_moves:0 "#medium [PODUnlocksCombatMove('POD_combat_move_stooping_assault')]#!\n\n$trait_flightadvanced_desc_plain$"
 trait_flightadvanced_desc_plain:0 "Полёт — сверхъестественная $pod_discipline$, присущая лишь линии крови Горгулий и позволяющая этим вампирам летать.\n\nКаменные Горгульи слишком тяжелы, чтобы летать естественным образом, и потому вынуждены пользоваться этой $pod_discipline$. Другие $pod_cainites$, способные летать, например превращаясь в летучую мышь или туман с помощью Превращения, в ней не нуждаются и не могут её изучить."
 trait_ghoul_banality_desc:0 "#medium $POD_terrain_fae_max_combat_roll$: #N +100%#!\n\n"
 trait_hun_tactics_0:0 "Свирепый предводитель"
 trait_hun_tactics_1:0 "Свирепый тактик"
 trait_hun_tactics_2:0 "Неистовый военачальник"
 trait_hun_tactics_3:0 "Наследник Гунна"
 trait_integrity_desc_evil:0 "Преданность — обобщённая мера того, насколько мумия следует желаниям своего хозяина. Мумий с низкой преданностью может ожидать суровый суд или нечто худшее, когда они вступят в [UmbraGlossary('shadowlands')], чтобы подготовиться к следующей жизни.\n\n#medium #bold #color_white Вы#! получаете Целостность за:#!\n$BULLET_WITH_TAB$Совершение кражи: #P +1#!\n$BULLET_WITH_TAB$Совершение жестокого поступка (например, пытки): #P +2#!\n$BULLET_WITH_TAB$Убийство без веской причины: #P +3#!\n\n#bold #color_white Вы#! теряете Целостность за:#!\n$BULLET_WITH_TAB$Исцеление других: #N -3#!\n$BULLET_WITH_TAB$Вручение подарков: #N -2#!\n$BULLET_WITH_TAB$Дарование помилования: #N -1#!#!"
 trait_integrity_evil:0 "Преданность"
 trait_laibon_spirit:0 "Дух лайбона"
 trait_laibon_spirit_aye_rate_player_tt:0 "[GetPlayer.MakeScope.GetScriptValueDesc('pod_laibon_aye_net_value')]"
 trait_laibon_spirit_character_desc:0 "Для [ROOT.Char.GetFirstNameNoTooltip] существование в качестве лайбона определяется равновесием Айе и Орун — мира живых и мира духов."
 trait_laibon_spirit_desc:0 "Равновесие Айе и Орун — мира живых и мира духов — определяет существование этого персонажа как лайбона."
 trait_laibon_spirit_orun_rate_player_tt:0 "[GetPlayer.MakeScope.GetScriptValueDesc('pod_laibon_orun_net_value')]"
 trait_laibon_spirit_rate_desc:0 "#medium #italic Пассивный прирост [trait_level_track_xp|E] каждые #V 5#! лет:#!\n#medium $trait_track_aye$: [Character.MakeScope.ScriptValue('pod_laibon_aye_net_value')|+=0]\n$trait_track_orun$: [Character.MakeScope.ScriptValue('pod_laibon_orun_net_value')||+=0]#!\n\n"
 trait_laibon_spirit_rate_player_desc:0 "#medium #italic Пассивный прирост [trait_level_track_xp|E] каждые #V 5#! лет:#!\n$trait_track_aye$: #TOOLTIP:trait_laibon_spirit_aye_rate_player_tt #L [Character.MakeScope.ScriptValue('pod_laibon_aye_net_value')|+=0]#! #L;low (см. подсказку)#!#!\n$trait_track_orun$: #TOOLTIP:trait_laibon_spirit_orun_rate_player_tt #L [Character.MakeScope.ScriptValue('pod_laibon_orun_net_value')||+=0]#! #L;low (см. подсказку)#!#!#!\n\n"
 trait_leading_front_0:0 "Впереди войска"
 trait_leading_front_1:0 "Ученик Девы битвы"
 trait_leading_front_2:0 "Авангард Артемиды"
 trait_leading_front_3:0 "Копьё Орфии"
 trait_obfuscateadvanced_desc_moves:0 "#medium [PODUnlocksCombatMove('POD_combat_move_unseen_ambush')]#!\n\n$trait_obfuscateadvanced_desc_plain$"
 trait_obfuscateadvanced_desc_plain:0 "Затемнение — $pod_discipline$, позволяющая вампирам скрываться, обманывать чужой разум или заставлять окружающих не замечать то, что её обладатель желает скрыть.\n\nЗатемнение — часть проклятия, которым Каин обрёк [Glossary('Патриархов','game_concept_antediluvian_desc')] на исчезновение из мироздания. Те, кто часто пользуется этой $pod_discipline$, отдаляются от общества, перестают участвовать в общении и лишь наблюдают за ним."
 trait_potence_desc_moves:0 "#medium [PODUnlocksCombatMove('POD_combat_move_potent_strike')]#!\n\n$trait_potence_desc_plain$"
 trait_potence_desc_plain:0 "Могущество — $pod_discipline$, наделяющая вампиров физической мощью и сверхъестественной силой. Вампиры, владеющие $pod_discipline$ Могущества, обладают физическими возможностями, недоступными смертным."
 trait_potenceadvanced_desc_moves:0 "#medium [PODUnlocksCombatMove('POD_combat_move_potent_strike')]#!\n\n$trait_potenceadvanced_desc_plain$"
 trait_potenceadvanced_desc_plain:0 "Могущество — $pod_discipline$, наделяющая вампиров физической мощью и сверхъестественной силой. Вампиры, владеющие $pod_discipline$ Могущества, обладают физическими возможностями, недоступными смертным."
 trait_rune_wise_desc:0 "Этот персонаж постиг тайны древней скандинавской магии. Тщательно вырезая древние руны и принося кровавую жертву, он способен в некоторой степени пользоваться колдовством.\n\nОднако некоторые запретные искусства остаются недоступны: Алхимия, Призывание, Перемещение и Адское пламя."
