 trait_track_leading_front:0 "Полководец передовой"
 trait_track_leading_front_desc:0 "#help Вы получаете опыт в этом направлении, лично командуя войсками и сражаясь с вражескими армиями во время войн.#!"
 trait_track_orun:0 "#color:{0.45,0.65,0.75} Орун#!"
 trait_track_orun_desc:0 "Связь с миром духов и предками. Высокий уровень Орун усиливает ужас, доблесть и влияние на происки."
