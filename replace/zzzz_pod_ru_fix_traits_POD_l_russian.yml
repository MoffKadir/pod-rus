 MUMMY_SOL_PASSIVE_county_explanation:0 "Убив Осириса, Сет разрубил его тело на 14 частей и разбросал их по следующим местам: Амент в Коптосе, Аа-аб на Элефантине, Ат-рут-ф в Великом Гераклеополе, Кусы, Гелиополь, Ан-Амент в Сма-бехутете/Диополе, Летополь, Па-Тухен в Саисе, Мех-та-ф в Гермополе, Атрибис, Ак/Схедия, Аб в Ливийском номе, Хет-сера в городе Нетерет и Апис. Помимо магических следов, оставленных Осирисом, каждое из этих мест стало важным храмом и оплотом его последователей.\n\nВладение некоторыми связанными с ними [counties|E] даст вам новые сведения для исследований."
