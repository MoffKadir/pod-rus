 trait_track_shadow_reconquista_warrior:0 "Теневой тактик"
 trait_track_shadow_reconquista_warrior_desc:0 "#help Вы получаете опыт в этом направлении, командуя войсками и сражаясь с армиями во время войн.#!"
 trait_track_shadow_warrior:0 "Грозный авангард"
 trait_track_shadow_warrior_desc:0 "#help Вы получаете опыт в этом направлении, атакуя превосходящие силы противника. Полное уничтожение вражеской армии даёт дополнительный опыт.#!"
 trait_track_spell_of_life:0 "Заклинание Жизни"
 trait_track_spell_of_life_desc:0 "\nВаш [trait_level_track_xp|E] отражает ваши знания о Заклятии жизни и близость к его завершению."
 trait_track_spell_of_life_desc_in_game_tt:0 "[GetPlayer.MakeScope.GetScriptValueDesc('POD_mummy_spell_of_life_xp_passive')]"
 trait_track_spell_of_life_desc_insight_passive:0 "#help Изменяющиеся значения приведены для максимально возможного уровня.#!\n\n[GetPlayer.MakeScope.GetScriptValueDesc('POD_mummy_spell_of_life_xp_passive_loca')]"
 trait_track_swift_movement:0 "Стремительный авангард"
 trait_track_swift_movement_desc:0 "#help Вы получаете опыт в этом направлении, передвигая армии под своим командованием во время войн. При перемещении по прибрежным или приречным провинциям вы получаете дополнительный опыт.#!"
 trait_track_teachings:0 "Вечный полководец"
 trait_track_teachings_desc:0 "#help Вы получаете опыт в этом направлении, перемещая свои армии между провинциями во время войн.#!"
 trait_walker_between_worlds:0 "Странник между мирами"
 trait_walker_between_worlds_character_desc:0 "[ROOT.Char.GetFirstNameNoTooltip] одной ногой стоит в каждом из двух миров. И живые, и мёртвые считают [ROOT.Char.GetHerHim] своим. Таков идеал лайбонов — равновесие, которого, как говорят, достиг сам Кагн."
 trait_walker_between_worlds_desc:0 "Этот персонаж одной ногой стоит в каждом из двух миров. И живые, и мёртвые признают его своим. Таков идеал лайбонов — равновесие, которого, как говорят, достиг сам Кагн."
 trait_wukuei_enslaved_desc:0 "#medium [ROOT.Char.GetFirstNameNoTooltip] находится в рабстве у #V [GetScriptedGui('POD_show_yama_king_master').BuildTooltip(GuiScope.AddScope('slave',ROOT.Char.MakeScope).End)]#!.#!\n\n"
 trait_wukuei_independent_desc:0 "#medium [ROOT.Char.GetFirstNameNoTooltip] — бывший Ву Куэй, ныне распоряжающийся собственной судьбой.#!\n\n"
 trait_wukuei_masterless_desc:0 "#medium [ROOT.Char.GetFirstNameNoTooltip] — Ву Куэй без определённого хозяина.#!\n\n"
