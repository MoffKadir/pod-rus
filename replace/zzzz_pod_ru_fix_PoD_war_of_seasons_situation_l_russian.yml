 PoD_war_of_seasons_desc:0 "Война времён года — давний конфликт четырёх сезонных дворов, борющихся за господство в Осеннем мире. Клятвенный мир был заключён, но его срок уже истёк, и боевые действия могут возобновиться. Но возобновятся ли?"
