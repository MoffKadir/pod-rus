 PoD_war_of_seasons_pay_random_court_desc:0 "Заплатить выкуп за освобождение $POD_splat_fae$ из другого [Concept('religion', 'двора')|E]"
 PoD_war_of_seasons_return_to_base_desc:0 "Медленное возвращение к #bold 0#! очкам"
 PoD_war_of_seasons_seduce_court:0 "Соблазнение"
 PoD_war_of_seasons_seduce_court_desc:0 "Соблазнить $POD_splat_fae$ из другого [Concept('religion', 'двора')|E]"
 PoD_war_of_seasons_sign_truce_outside_war__court:0 "Перемирие вне [war|E]"
 PoD_war_of_seasons_sign_truce_outside_war_court_desc:0 "Заключить [truce|E] вне [war|E] с $POD_splat_fae$ из другого [Concept('religion', 'двора')|E]"
 PoD_war_of_seasons_situation_peace:0 "Гармония"
 PoD_war_of_seasons_situation_peace_desc:0 "Клятвенный мир оказался великим успехом: ненависть между [Concept('religion','дворами')|E] постепенно угасла. То, что прежде считалось невозможным, стало явью: между представителями разных [Concept('religion','дворов')|E] зародилась дружба. Неужели мы наконец сможем объединиться? Как в старые времена, друзья?\n\n...Но ненависть не угасла до конца. Ещё тлеют искры раздора. Что случится, если они разгорятся? Вернётся ли война?"
 PoD_war_of_seasons_situation_peace_desc_short:0 "Статус-кво"
 PoD_war_of_seasons_situation_peace_icon:0 "@fae_icon! $PoD_war_of_seasons_situation_peace$"
 PoD_war_of_seasons_situation_status_quo:0 "Статус-кво"
 PoD_war_of_seasons_situation_status_quo_desc:0 "Клятвенный мир должен был закончиться в 1230 году. Но мы ещё не готовы ни вернуться к войне, ни полностью отказаться от своей праведной ненависти.\n\n...Такое положение не может длиться вечно. Рано или поздно ненависть разгорится войной — или, быть может, окончательно угаснет?"
 PoD_war_of_seasons_situation_status_quo_desc_short:0 "Статус-кво"
 PoD_war_of_seasons_situation_status_quo_icon:0 "@fae_icon! $PoD_war_of_seasons_situation_status_quo$"
 PoD_war_of_seasons_situation_war:0 "Война времён года"
 PoD_war_of_seasons_situation_war_desc:0 "Клятвенный мир закончился. Война настигла нас: сражения между [Concept('religion','дворами')|E] пылают славным огнём. Победитель может быть лишь один! Беритесь за мечи, творите [cantrips|E] и перебейте их всех!\n\n...Но, быть может, мы ещё сумеем примириться? Вновь заключить Клятвенный мир?"
 PoD_war_of_seasons_situation_war_desc_short:0 "Война"
 PoD_war_of_seasons_situation_war_icon:0 "@fae_icon! $PoD_war_of_seasons_situation_war$"
 PoD_war_of_seasons_start_war_court:0 "Начало [war|E]"
 PoD_war_of_seasons_start_war_court_desc:0 "Начать [war|E] против $POD_splat_fae$ из другого [Concept('religion', 'двора')|E]"
 PoD_war_of_seasons_sub_region_core:0 "$PoD_war_of_seasons$"
 PoD_war_of_seasons_sub_region_core_desc:0 "$PoD_war_of_seasons_desc$"
 PoD_war_of_seasons_usurp_title_court:0 "Узурпация [title]|E"
 PoD_war_of_seasons_usurp_title_court_desc:0 "Узурпировать [title|E] или получить на него претензию у $POD_splat_fae$ из другого [Concept('religion', 'двора')|E]"
 PoD_war_of_seasons_win_war_court:0 "Победа [war|E]"
 PoD_war_of_seasons_win_war_court_desc:0 "Победить в [war|E] против $POD_splat_fae$ из другого [Concept('religion', 'двора')|E]"
 WINDOW_POD_WAR_OF_SEASONS_FUTURE_EFFECTS:0 "Эффекты будущей фазы"
 WINDOW_POD_WAR_OF_SEASONS_LEADERS:0 "Лидер [Concept('religion', 'двора')|E]"
 WINDOW_POD_WAR_OF_SEASONS_LEADERS_AUTUMN:0 "В дворе «[GetReligionByKey('autumn_court_religion').GetName]» лидеров не избирают, а сменяют. Каждый осенний $POD_splat_fae$ может начать [scheme|E] против действующего лидера, чтобы занять его место.[AddTextIf(Not(ObjectsEqual(GetPlayer.Self,Situation.MakeScope.GetVariable('autumn_leader').Char)), Localize('WINDOW_POD_WAR_OF_SEASONS_LEADERS_AUTUMN_BUTTON_TEXT'))]"
 WINDOW_POD_WAR_OF_SEASONS_LEADERS_AUTUMN_BUTTON:0 "Время для [scheming|E]"
 WINDOW_POD_WAR_OF_SEASONS_LEADERS_AUTUMN_BUTTON_TEXT:0 "\n\nНажатие кнопки откроет [character_interaction|E], чтобы запустить [scheme|E]."
 WINDOW_POD_WAR_OF_SEASONS_LEADERS_SOLSTICE:0 "У двора «[GetReligionByKey('solstice_court_religion').GetName]» нет лидера. Его представители слишком малочисленны и оттеснены на обочину, чтобы другие [Concept('religion', 'дворы')|E] считали их равными.\n\nНо вы можете это изменить. При достаточном размере [realm|E] и числе [vassals|E] вы сумеете добиться власти."
 WINDOW_POD_WAR_OF_SEASONS_LEADERS_SOLSTICE_BUTTON:0 "Нам нужно быть услышанными!"
 WINDOW_POD_WAR_OF_SEASONS_LEADERS_SOLSTICE_LEADER:0 "Власть лидеров двора «[GetReligionByKey('solstice_court_religion').GetName]» передаётся по наследству от первого лидера Солнцестояния его потомкам.\n\nЕсли основная линия пресечётся, случайный правитель Солнцестояния займёт место лидера."
 WINDOW_POD_WAR_OF_SEASONS_LEADERS_SPRING:0 "Лидеры двора «[GetReligionByKey('spring_court_religion').GetName]» избираются голосованием всех [independent_rulers|E].\n\nВыборы проводятся каждые #V 10 лет#!, но их можно объявить досрочно, потратив [prestige|E]."
 WINDOW_POD_WAR_OF_SEASONS_LEADERS_SPRING_BUTTON:0 "Начать выборы!"
 WINDOW_POD_WAR_OF_SEASONS_LEADERS_SUMMER:0 "Лидеры двора «[GetReligionByKey('summer_court_religion').GetName]» определяются по числу [vassals|E]. Избирается $POD_splat_fae$ с наибольшим числом [vassals|E].\n\n\n"
 WINDOW_POD_WAR_OF_SEASONS_LEADERS_WINTER:0 "Лидеры двора «[GetReligionByKey('winter_court_religion').GetName]» определяются по [dread|E]. $POD_splat_fae$ с самым высоким [dread|E] среди [independent_rulers|E] получает титул $PODWarOfSeasonsLeader_winter$.\n\nПроверка проводится каждый #V год#!"
 WINDOW_POD_WAR_OF_SEASONS_PROGRESSBAR_GENERAL:0 "\n\nКогда одна из шкал полностью заполнится, [GetSituationType('PoD_war_of_seasons').GetName] перейдёт в соответствующую [situation_phase|E]. Значение других шкал не имеет значения: важна лишь та, что заполнится первой."
 WINDOW_POD_WAR_OF_SEASONS_PROGRESSBAR_PEACE:0 "Эта шкала показывает продвижение к фазе [GetSituationType('PoD_war_of_seasons').GetPhaseType('PoD_war_of_seasons_situation_peace').GetName]. Текущее значение: [GetSituation('PoD_war_of_seasons').GetTopCurrentPhase.GetFuturePhaseByType(GetSituationType('PoD_war_of_seasons').GetPhaseType('PoD_war_of_seasons_situation_peace')).GetProgress]/[GetSituation('PoD_war_of_seasons').GetTopCurrentPhase.GetFuturePhaseByType(GetSituationType('PoD_war_of_seasons').GetPhaseType('PoD_war_of_seasons_situation_peace')).GetTakeoverPoints]$WINDOW_POD_WAR_OF_SEASONS_PROGRESSBAR_GENERAL$."
 WINDOW_POD_WAR_OF_SEASONS_PROGRESSBAR_STATUS_QUO:0 "Эта шкала показывает продвижение к фазе [GetSituationType('PoD_war_of_seasons').GetPhaseType('PoD_war_of_seasons_situation_status_quo').GetName]. Текущее значение: [GetSituation('PoD_war_of_seasons').GetTopCurrentPhase.GetFuturePhaseByType(GetSituationType('PoD_war_of_seasons').GetPhaseType('PoD_war_of_seasons_situation_status_quo')).GetProgress]/[GetSituation('PoD_war_of_seasons').GetTopCurrentPhase.GetFuturePhaseByType(GetSituationType('PoD_war_of_seasons').GetPhaseType('PoD_war_of_seasons_situation_status_quo')).GetTakeoverPoints]."
 WINDOW_POD_WAR_OF_SEASONS_PROGRESSBAR_WAR:0 "Эта шкала показывает продвижение к фазе [GetSituationType('PoD_war_of_seasons').GetPhaseType('PoD_war_of_seasons_situation_war').GetName]. Текущее значение: [GetSituation('PoD_war_of_seasons').GetTopCurrentPhase.GetFuturePhaseByType(GetSituationType('PoD_war_of_seasons').GetPhaseType('PoD_war_of_seasons_situation_war')).GetProgress]/[GetSituation('PoD_war_of_seasons').GetTopCurrentPhase.GetFuturePhaseByType(GetSituationType('PoD_war_of_seasons').GetPhaseType('PoD_war_of_seasons_situation_war')).GetTakeoverPoints]$WINDOW_POD_WAR_OF_SEASONS_PROGRESSBAR_GENERAL$."
 autumn_button_script:0 "Это откроет [character_interaction|E] #V $PODClaimLeadership_scheme_interaction$#! против [GetSituation('PoD_war_of_seasons').MakeScope.GetVariable('autumn_leader').Char.GetName]."
 situation_PoD_war_of_seasons:0 "$PoD_war_of_seasons$"
 situation_PoD_war_of_seasons_desc:0 "$PoD_war_of_seasons_desc$"
 situation_parameter_war_of_seasons_convert_to_militant_fraction:0 "Разблокируйте [character_interaction|E] для [court_leader|E], чтобы преобразовать $POD_splat_fae$ из того же [Concept('religion','Двор')|E] в [GetDoctrineType('doctrine_fae_agenda_militant').GetBaseName]."
 situation_parameter_war_of_seasons_convert_to_truce_bearer_fraction:0 "Разблокируйте [character_interaction|E] для [court_leader|E], чтобы преобразовать $POD_splat_fae$ из того же [Concept('religion','Двор')|E] в [GetDoctrineType('doctrine_fae_agenda_trucebearer').GetBaseName]."
 situation_parameter_war_of_seasons_situation_peace_active_active:0 "Все китэйны [faiths|E] получат [GetDoctrine('special_doctrine_war_of_seasons_hostility_peace').GetBaseName] на время действия [GetSituationType('PoD_war_of_seasons').GetPhaseType('PoD_war_of_seasons_situation_peace').GetName]."
 situation_parameter_war_of_seasons_situation_war_active:0 "Все китэйны [faiths|E] получат [GetDoctrine('special_doctrine_war_of_seasons_hostility_war').GetBaseName] на время действия [GetSituationType('PoD_war_of_seasons').GetPhaseType('PoD_war_of_seasons_situation_war').GetName]."
 situation_parameter_war_of_seasons_unlock_peace_objective:0 "Разблокируйте цель [court_leader|E], чтобы положить конец [GetSituationType('PoD_war_of_seasons').GetName] раз и навсегда."
 situation_parameter_war_of_seasons_unlock_war_objective:0 "Разблокируйте цель для [court_leader|E], чтобы объявить свой сезон победным в [GetSituationType('PoD_war_of_seasons').GetName]."
