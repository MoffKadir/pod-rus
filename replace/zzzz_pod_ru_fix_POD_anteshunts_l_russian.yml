l_russian:
 POD_anteshuntarikel.1.a:0 "Может быть только одна истинная Богиня."
 POD_anteshuntarikel.1.b:0 "Нет, это безумие!"
 POD_anteshuntarikel.1.desc:0 "Во имя Божественной Богини ложные Боги $pod_cainite$ лежали мертвыми. Тем не менее, идеальная реальность Елены все еще оспаривается одной фигурой: \n\nАрикель. Иштар. Афродита.\n\nЗадолго до того, как красота Елены привела Трою к разрушению, она правила Шумером как богиня. Пока она здесь, притязания вашей королевы на божественность будут подвергаться сомнению. Чтобы возвысить Елену до статуса бесспорной Богини, вы должны сокрушить последнюю ложную Богиню. \n\nОднако... Арикель - это [Glossary('допотопная','game_concept_antediluvian_desc')]. Прародительница Клана Розы, обладающая непостижимой силой. Неудача будет иметь только один результат. Истинная Смерть."
 POD_anteshuntarikel.1.deschelena:0 "Совершенная Елена, вы сокрушили ложных богов, осмелившихся объявить себя равными вам. И все же на вашей божественности остался единственный древний изъян. \n\nАрикель. Тореадорская [Glossary('допотопная','game_concept_antediluvian_desc')].\n\nЗадолго до того, как ваша красота разрушила Трою, она правила Шумером как богиня, и пока она остается, ваша божественность всегда будет подвергаться сомнению. Настоящая Богиня не делит пьедестал с другим. Вы должны стать бесспорным божеством $pod_cainite$.\n\nОднако... Арикель — это [Glossary('допотопная','game_concept_antediluvian_desc')], обладающая непостижимой силой. Неудача будет иметь только один результат. Истинная Смерть."
 POD_anteshuntarikel.1.t:0 "Ложная богиня"
 POD_anteshuntarikel.10.a:0 "Роза увядает."
 POD_anteshuntarikel.10.desc:0 "Перед вами, на простом помосте из неукрашенного камня, покоится Арикель. Вы не можете смотреть на нее. Смотреть на нее — значит смотреть на ослепляющую, мучительную красоту. Уму больно пытаться понять. Но под этим совершенством скрывается нежное тепло. Это милосердие. То же самое милосердие, которое оплакивало свое чудовищное дитя и проклинало другие души, чтобы они служили ему спасательным кругом. \n\nВы размышляете, является ли она единственным дремлющим древним из вашего рода, достойным называться «доброй». А может быть, это милосердие лишь скрывает злобу, поглощающую бесчисленное количество $pod_cainites$. В любом случае, ваша цель определена. \n\nВы приближаетесь к помосту, плача кровью и дрожа под тяжестью ее сияния. Затем вы опускаетесь на колени перед спящей богиней Шумера и вонзаете клыки в плоть совершенства."
 POD_anteshuntarikel.10.t:0 "Трон Афродиты"
 POD_anteshuntarikel.11.a:0 "Совершенство мертво. Я ее могила."
 POD_anteshuntarikel.11.desc:0 "Густое витэ просачивается в вас, как река чистой печали и силы. Вы пьете и пьете, пока сияющий свет не мерцает, не тускнеет и, наконец, не гаснет. Когда вы втягиваете древнюю душу в свои вены, Лабиринт затихает. Свет, освещавший пещеры, гаснет навсегда, и появляется новое, зарождающееся божество. \n\nАмарант завершён. Ее сущность перетекает в вашу, и то, что, возможно, было единственным маяком благодати в этом проклятом мире, утонуло в ваших бездонных амбициях. \n\nВ своем эгоистичном стремлении к превосходству вы уничтожили, возможно, единственную прекрасную душу, оставшуюся среди вашего рода. Или, может быть, вы убили монстра с изысканной маскировкой. В любом случае, ночь становится все темнее и холоднее."
 POD_anteshuntarikel.11.t:0 "Сердце Розы"
 POD_anteshuntarikel.2.a:0 "Каждая тайна имеет цену в золоте."
 POD_anteshuntarikel.2.b:0 "Пришло время использовать нашу легенду."
 POD_anteshuntarikel.2.c:0 "Зачем изнурять себя, если можно украсть секреты?"
 POD_anteshuntarikel.2.desc:0 "Найти [Glossary('допотопного','game_concept_antediluvian_desc')] — непростая задача. Арикель всегда была особенно неуловима: её не видели с тех пор, как распался Шумер. Чтобы найти Розу, вам понадобится нечто большее, чем просто карты смертных и слухи от новичков, распространяющих слухи. Вам нужны эксперты. \n\nКак и ожидалось, раскопки места упокоения спящей богини потребуют ресурсов, которые, скорее всего, обанкротят смертные королевства. Цена будет высокой, и вам придется опустошить свою казну или исчерпать великую легенду, которую вы создали до сих пор. \n\nНо божественность никогда не доставалась дёшево, не так ли?"
 POD_anteshuntarikel.2.t:0 "В поисках идола"
 POD_anteshuntarikel.3.a:0 "Приведите рабочих. Немедленно."
 POD_anteshuntarikel.3.b:0 "Мне не нужны инструменты."
 POD_anteshuntarikel.3.critical.failure.effect.desc:0 "Неужели нет возможности войти?"
 POD_anteshuntarikel.3.desc:0 "Залитые солнцем руины Кносса служат поверхностным развлечением для смертных. Сборище древней керамики и произведений искусства, на которые приходят поглазеть. Под пыльной скалой Крита находится настоящий Лабиринт, древнее место, запечатанное временем и колдовством. \n\nПосле некоторых исследований вы нашли порог под миллионами тонн твердой породы. Чтобы проникнуть в подземное хранилище, вам понадобится нечто большее, чем просто сила. Один неверный шаг может полностью разрушить древнее место или привлечь нежелательное внимание жителей. \n\nДоступ потребует таланта и осмотрительности. Вам нужна армия высококвалифицированных горняков, мастеров-каменщиков и инженеров, купленная верность которых обеспечит сохранение тайны. Им придется работать глубокой ночью, продвигаясь вперед дюйм за дюймом, прокладывая путь к Иштар так, чтобы никто об этом не знал. Цена за такой совершенный и опасный труд будет астрономической."
 POD_anteshuntarikel.3.effect.success.desc:0 "Мы внутри!"
 POD_anteshuntarikel.3.t:0 "Раскопки лабиринта"
 POD_anteshuntarikel.4.a:0 "Пусть малиновая нить ведет меня."
 POD_anteshuntarikel.4.critical.failure.effect.desc:0 "Оно ушло..."
 POD_anteshuntarikel.4.desc:0 "Вы ожидали увидеть сырую, удушающую могилу из грубого камня. Вместо этого проход в Лабиринт открывает подземный шедевр, который посрамил бы любой великий собор. \n\nЛабиринт не должен обладать такой красотой, но всё же обладает ею. Вы продвигаетесь вперед через залы из девственно белого мрамора, отражающие пламя вашего факела, обрамленные алебастровыми арками и великолепными фресками, которые, казалось бы, не состарились ни дня. Воздух неподвижен, несет в себе слабый приятный аромат. Это, без сомнения, владения Арикель. \n\nНо эта красота скрывает ловушку. Изящные переходы вновь и вновь извиваются, образуя невозможные петли. Грандиозные лестницы спускаются только для того, чтобы вернуть вас туда, где вы были. Будь то древнее колдовство или просто уровень архитектурного гения, утраченный в бронзовом веке, результат один и тот же. Вы заперты в позолоченной клетке. Как только страх начинает овладевать вами, ваши чувства обнаруживают нить кристаллизованного древнего витэ. \n\nВы задаетесь вопросом, почему она оставила это. Приманка? Путеводный свет для любимого потомка? Для чего бы она ни предназначалась, это единственный путь вперед, хотя и слабый."
 POD_anteshuntarikel.4.effect.success.desc:0 "Я вижу это!"
 POD_anteshuntarikel.4.t:0 "Нить Арикель"
 POD_anteshuntarikel.40.a:0 "Это было слишком много хлопот..."
 POD_anteshuntarikel.40.desc:0 "Несмотря на все ваши усилия, Лабиринт остается неприступной крепостью. Рабочие сомневаются в выполнении задания, структурная целостность почти не подлежит восстановлению, а местные смертные пронюхали о том, что вы пытаетесь сделать, прямо у них под носом. \n\nУ вас нет другого выбора, кроме как отступить и полностью отказаться от этих поисков. Вы привлекли к себе слишком много внимания. Когда вы в спешке покидаете остров, часть вас не может не почувствовать легкого облегчения. \n\n Ведь вы хотя бы уцелели."
 POD_anteshuntarikel.40.t:0 "Непроходимый лабиринт"
 POD_anteshuntarikel.5.a:0 "Может быть, удастся лишить этот механизм пищи..."
 POD_anteshuntarikel.5.b:0 "Пришло время перекрыть поток в источнике."
 POD_anteshuntarikel.5.c:0 "Я тоже знаю некоторые свои хитрости."
 POD_anteshuntarikel.5.critical.failure.effect.desc:0 "Ловушка!"
 POD_anteshuntarikel.5.desc:0 "Красная нить приведет вас в комнату, которая разрушает красоту Лабиринта. Вонь застойного, испорченного витэ сильно бьет по вам. К потолку на жестоких бронзовых крючках и серебряных кольях подвешены четырнадцать фигур. Древние $pod_cainites$, запертые в вечном, мучительном $pod_torpor$. Сложный бронзовый механизм вставлен прямо в их сморщенные вены, перекачивая украденную кровь в самое темное место за стенами. \n\nУдушающий страх сковывает ваше холодное сердце. Какому древнему чудовищу нужен такой поток древнего витэ только для того, чтобы оставаться сытым или взаперти? Что бы это ни было, оно ждет сразу за массивными каменными воротами, закрывающими эту комнату. \n\nСкрежещущие шестерни механизма, кажется, действуют как замок для ворот. Чтобы открыть путь вперед, поток должен быть полностью разорван. Вы можете либо найти способ демонтировать ловушки и механизм, либо умертвить источники витэ так, чтобы не сработал возможный защитный механизм. В любом случае, эти четырнадцать несчастных встретят Окончательную Смерть, и врата откроются."
 POD_anteshuntarikel.5.effect.success.desc:0 "Он отключен."
 POD_anteshuntarikel.5.t:0 "Четырнадцать жертв"
 POD_anteshuntarikel.6.a:0 "Ну, нападай!"
 POD_anteshuntarikel.6.critical.failure.effect.desc:0 "Где Тесей, когда он тебе нужен?"
 POD_anteshuntarikel.6.desc:0 "Ворота распахиваются, обнажая чистое безумие. В центре недавно открытой пещеры вас ждет огромная, устрашающая пародия на эстетику Тореадор. Звериный рев Минотавра сотрясает стены, и у его скованных ног лежит конец красной нити витэ. \n\nВы понимаете, для чего все это было. Четырнадцать жертвоприношений были его кормушкой. Нить была для него спасательным кругом, подаренной Арикель. Она не могла или просто отказалась уничтожить это существо, каким бы отвратительным оно ни стало за столетия. Минотавр был заперт во тьме, его нежизнь поддерживалась жертвоприношениями. Нить представляла собой след, оставленный Арикель, ведущий к месту ее упокоения в надежде, что однажды ночью он сможет победить Зверя и найти дорогу домой. \n\n Действительно ли Арикель способна на такое милосердие к своему потомству? Готова ли она обречь других на вечные пытки, чтобы поддержать эту надежду или заблуждение? Вы не можете быть уверены. \n\nВсе, что вы знаете, это то, что разум Минотавра давно исчез. Невозможно умиротворить этот древний ужас. Чтобы добраться до Арикель, вам нужно навсегда уничтожить этого монстра."
 POD_anteshuntarikel.6.effect.success.desc:0 "Кости ломаются о лоб Минотавра."
 POD_anteshuntarikel.6.t:0 "Минотавр"
 POD_anteshuntarikel.7.a:0 "Быстрее! Быстрее!"
 POD_anteshuntarikel.7.b:0 "Едва успели!"
 POD_anteshuntarikel.7.c:0 "Так близко!"
 POD_anteshuntarikel.7.desc:0 "Каким-то образом вам это удалось. Минотавр — не что иное, как пепел. Вам потребовалась вся ваша сила, чтобы победить чудовище, которое тысячелетиями пребывало в безумии. Затем вы чувствуете еще один удар. Не последствие битвы, а внезапная волна горя, которая эхом отдается в вашем разуме и захлестывает вас. Иштар знает, что ее любимый монстр мертв. \n\nЛабиринт реагирует мгновенно. Безупречные мраморные стены начинают трескаться, а потолки стонут, когда явная метафизическая тяжесть отчаяния дремлющей Розы заставляет это место разрываться на части. Части крыши рушатся, пол вздымается, угрожая похоронить вас и все остальное рядом с ним. \n\nСеребряные двери во внутреннее святилище мучительно близки, прямо через осыпающуюся пропасть арены. У вас нет времени отдыхать и лечиться. Вы должны заставить свое тело двигаться, иначе вас похоронят вместе с прахом Минотавра."
 POD_anteshuntarikel.7.t:0 "Горе"
 POD_anteshuntarikel.8.a:0 "Ты не сломаешь меня!"
 POD_anteshuntarikel.8.desc:0 "Двери захлопываются за вами, заглушая грохот обрушивающихся крыш. Наконец вы оказываетесь во внутреннем святилище, рядом с Арикель. Но когда вы пытаетесь сделать шаг вперед, вы отшатываетесь назад. Её аура захлёстывает вас, удушающая, всепоглощающая волна печали и болезненного совершенства. В присутствии идеала всякая мания величия, которая у вас есть, разбивается вдребезги. \n\nВы прекрасно осознаете, кем вы являетесь сейчас. Мясник. Паразитическая пиявка, вся в крови и пепле её потомка. Стыд этого, отчаяние от того, насколько вы ничтожны в сравнении с ней, грозят лишить вас рассудка. Все ваше высокомерие и тщеславие исчезло в одно мгновение. \n\nВпереди вы видите створки дверей и уверены, что за ними скрывается Арикель, но давление парализует. Вы должны заставить свое эго противостоять этой сокрушительной волне меланхолии. Если вы сломаетесь сейчас, травма этой полного ничтожества оставит у вас шрам навсегда."
 POD_anteshuntarikel.8.effect.success.desc:0 "Больше никаких трюков."
 POD_anteshuntarikel.8.failure.effect.desc:0 "Что я сделал..."
 POD_anteshuntarikel.8.t:0 "Мучительное совершенство"
 POD_anteshuntarikel.9.a:0 "Я монстр."
 POD_anteshuntarikel.9.desc:0 "Тяжесть ауры Арикель не отступает полностью, но вы, наконец, можете продолжать двигаться вперед, достигая последних дверей во внутреннее святилище. Они отлиты из невероятно гладкого полированного серебра, образуя безупречное огромное зеркало. Когда вы подходите ближе, изображение искажается. Вы не видите ничего близкого к божественной фигуре. Вы видите Зверя во всей его гниющей, паразитической и отвратительной красе. Каждое мелкое тщеславие и жестокий поступок, которые вы когда-либо совершали, преувеличиваются и представляются вам лицом к лицу. \n\nЭто зрелище - пытка. Зеркало требует, чтобы вы сначала взглянули на свою истинную форму, прежде чем нацелиться на Иштар. Чтобы открыть их, вы должны положить на зеркало руки и принять отражение. Терпите агонию своего полного, абсолютного несовершенства. Ошибка в любой момент навсегда сломает ваш бессмертный разум этой истиной."
 POD_anteshuntarikel.9.effect.success.desc:0 "...И я принимаю это."
 POD_anteshuntarikel.9.failure.effect.desc:0 "...И я не могу этого вынести."
 POD_anteshuntarikel.9.t:0 "Зеркало Иштар"
 POD_anteshuntset.100.a:0 "Этот «бог» будет истекать кровью, чего бы это ни стоило"
 POD_anteshuntset.100.b:0 "Я простил его"
 POD_anteshuntset.100.desc:0 "Восстание Анархов — это беспрецедентное время кризиса... и возможностей. Поскольку большинство кланов находятся в замешательстве, а Инквизиция не позволяет старейшинам общаться на дальних дистанциях, древние $pod_cainites$ уязвимы, как никогда раньше. \n\nНекоторые из самых мстительных Анархов планируют дерзкие нападения на [Glossary('допотопных','game_concept_antediluvian_desc')], прародителей кланов, в надежде повторить $pod_diablerie$, совершённое Тремером над Саулотом.\n\nДавным-давно вы сильно пострадали от рук Сета, так называемого «Бога» $pod_clan$ Сетитов. Монстр лежит где-то в Египте, хорошо охраняемый своими фанатичными отпрысками. Хаос может дать вам возможность отомстить за причиненные вам ужасы. Однако Египет огромен, и о столь щекотливом вопросе у местных не спросишь. Чтобы получить информацию о текущем местоположении [Glossary('допотопного','game_concept_antediluvian_desc')], вам придется разослать своих агентов повсюду с изрядным количеством золота, чтобы побудить некоторых полезных информаторов выдать сведения. \n\nПришло ли время Сету взглянуть на ваши страдания?"
 POD_anteshuntset.100.t:0 "Охота на богов"
 POD_anteshuntset.170.desc:0 "Перед вами лежит тело человека с головой неописуемого зверя, нагого, если не считать простой набедренной повязки. Но даже этот облик едва отражает невообразимое зло в его душе. Вас охватывает страх, перед которым меркнет даже Красный Страх.\nВы не можете пошевелиться и уверены, что сейчас встретите Окончательную Смерть: перед вами Сет, и этот [Glossary('допотопного','game_concept_antediluvian_desc')] утолит жажду вашей кровью.\nСобрав все силы, вы бросаетесь вперёд с факелом в руке и колом наготове, намереваясь поджечь тело своего мучителя.\nОт этого последнего усилия ваш разум взрывается..."
 POD_anteshuntset.180.a:0 "Давно пора."
 POD_anteshuntset.180.desc:0 "Ваш удар был методичным, ваш выпад точным. Вокруг тела монстра вспыхивает пламя, его плоть вспыхивает, как трут. \nКак бы вам ни нравилось наблюдать, как каждая частичка плоти превращается в пепел, ваше время в этом мире еще не закончилось. Вы оставляете зверя позади, еще больше разбрасывая искры среди остатков каравана.\nТеперь вы наблюдаете, как перед вашими глазами горит только что построенная гробница демона, а крики монстра внутри подобны музыке для ваших ушей."
 POD_anteshuntset.190.a:0 "Действительно ли кошмар закончился?"
 POD_anteshuntset.190.desc:0 "Ваш удар был методичным, ваш выпад точным. Вокруг тела монстра вспыхивает пламя, его плоть вспыхивает, как трут. \nКак бы вам ни нравилось наблюдать, как каждая частичка плоти превращается в пепел, ваше время в этом мире еще не закончилось. Вы оставляете зверя позади, еще больше распространяя искры среди остатков каравана. \nДля всех остальных вы добились своего; вы убили [Glossary('допотопного','game_concept_antediluvian_desc')], но не можете избавиться от мучительного чувства, что что-то не так..."
 POD_anteshunttroile.16.a:0 "Roma Invicta!"
 POD_new_objective_unlocked_tt:0 "Открыта новая цель."
 artemis_insights_tt:0 "Артемида Ортия, первая на стенах, поделилась с вами своей историей."
