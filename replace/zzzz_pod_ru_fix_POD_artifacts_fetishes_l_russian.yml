l_russian:
 artifact_bog_render_description:0 "Один из самых известных и древних лабрисов Чёрных фурий. Говорят, этому могучему фетишу суждено принять участие в битве, которая спустя многие столетия изменит мир."
 artifact_bog_render_name:0 "[fetish_artifact_icon]Рассекатель болот"
 artifact_bow_artemis_description:0 "Этот лук, созданный с помощью одного из духов выводка Пегаса, подвластен лишь Девам Чёрных фурий. Он идеально подходит для охоты и служит грозным оружием войны, особенно со стрелами против духов Порчи или посеребрёнными стрелами."
 artifact_bow_artemis_name:0 "[fetish_artifact_icon]Лук Артемиды"
 artifact_bridle_artemis_description:0 "«Моим дочерям, становящимся Матерями, — чтобы они могли обуздать Вильд внутри нас»."
 artifact_bridle_artemis_name:0 "[fetish_artifact_icon]Узда Артемиды"
 artifact_cavern_torc_description:0 "В эту гривну заключён дух летучей мыши. Носящий её Гару способен видеть под землёй в кромешной тьме и чувствовать опасности, затаившиеся поблизости."
 artifact_cavern_torc_name:0 "[fetish_artifact_icon]Пещерная гривна"
 artifact_cloak_artemis_description:0 "«Моим младшим дочерям — чтобы они могли обмануть взор человека»."
 artifact_cloak_artemis_name:0 "[fetish_artifact_icon]Плащ Артемиды"
 artifact_fertility_charm_description:0 "Чёрные фурии заключают в эти небольшие амулеты духов плодовитых животных, например кроликов или лягушек. Амулет повышает вероятность беременности, однако его силы недостаточно, чтобы повлиять на вероятность рождения Гару."
 artifact_fertility_charm_name:0 "[fetish_artifact_icon]Амулет плодородия"
 artifact_golden_bow_artemis_description:0 "#bold Преобразует урон в [POD_aggravated_damage|E].#!\n\n«Моим дочерям-воительницам — чтобы они могли разить врагов Природы»."
 artifact_golden_bow_artemis_name:0 "[fetish_artifact_icon]Золотой лук Артемиды"
 artifact_hammer_king_brennus_description:0 "Говорят, что этот гигантский древний молот принадлежал Бреннусу, последнему королю Белых завывателей. Легенды утверждают, что он сражался до последнего вздоха против своих павших родственников, когда они спустились в безумие Черной Спирали. Действительно ли это оружие принадлежит ему, остается неизвестным, но даже сейчас оно вселяет страх в слуг Вирма."
 artifact_hammer_king_brennus_name:0 "[fetish_artifact_icon]Молот короля Бреннуса"
 artifact_labrys_isthmene_description:0 "Этот лабрис посвящён Горгоне битвы и подвластен лишь женщинам. В их руках он наносит серьёзный урон и позволяет направлять через него дар «Дух схватки»."
 artifact_labrys_isthmene_name:0 "[fetish_artifact_icon]Лабрис Истмены"
 artifact_lash_furies_description:0 "Говорят, эти плети вырезаны из кишок великого чудовища Вирма — или, по другим источникам, Немейского льва. Они служат скорее орудием пытки, чем оружием. Удар плети сопровождается вспышкой мучительной боли и раскрывает одну из постыдных тайн жертвы."
 artifact_lash_furies_name:0 "[fetish_artifact_icon]Плеть фурий"
 artifact_loom_artemis_description:0 "«Моим дочерям-ремесленницам — чтобы они могли ткать гобелены мудрости»."
 artifact_loom_artemis_name:0 "[fetish_artifact_icon]Ткацкий станок Артемиды"
 artifact_pandora_box_description:0 "Названный в честь печально известного греческого мифа, этот ящик позволяет как заточать, так и освобождать духов Порчи. Произнеся приказ на древнегреческом, Чёрная фурия вступает с духом в поединок воли, надеясь заключить его в ящике. При неудаче вместо этого могут вырваться на свободу уже пленённые духи."
 artifact_pandora_box_name:0 "[fetish_artifact_icon]Ящик Пандоры"
 artifact_quiver_silvered_arrows_description:0 "Чёрные фурии создали эти стрелы во времена открытой войны с другими племенами, прежде всего с Потомками Фенрира. Их невозможно сломать; они острее обычных стрел, а серебро, разумеется, позволяет наносить тяжёлые раны."
 artifact_quiver_silvered_arrows_name:0 "[fetish_artifact_icon]Колчан посеребрённых стрел"
 artifact_salve_artemis_description:0 "«Моим мудрейшим дочерям — чтобы они могли врачевать раны своих сестёр»."
 artifact_salve_artemis_name:0 "[fetish_artifact_icon]Мазь Артемиды"
 artifact_stag_klaive_description:0 "Этот драгоценный клейв Фианна из семьи Рис содержит духа оленя в дополнение к духу войны, обычно заключённому в великих клейвах. Благодаря этому его владелец обретает несравненную подвижность в бою."
 artifact_stag_klaive_name:0 "[fetish_artifact_icon]Олений клейв"
