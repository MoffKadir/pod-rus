 recognition_from_the_dreaming_objective_decision_desc:0 "Мы зарекомендовали себя выдающимися среди простолюдинов, но нам все еще не хватает уважаемого положения дворян. Если бы я достиг поистине легендарного величия, мои подвиги поднимут престиж всего моего дома. Наша история станет неотъемлемой частью анналов [UmbraGlossary('arcadia')], мифом среди мифов."
