 sidhe_inert_cold_iron_objective_decision:0 "Инертное холодное железо"
 sidhe_inert_cold_iron_objective_decision_confirm:0 "Трансмутируйте парадигму!"
 sidhe_inert_cold_iron_objective_decision_custom1:0 "Вы, должно быть, принадлежите к дому [GetDynastyByID( 'POD_fae_dynasty_dougal' ).GetBaseName]."
 sidhe_inert_cold_iron_objective_decision_custom2:0 "Вы [completely_control|E] Кузница Дугала в Стрэтчкруахе ([GetTitleByKey('c_lennox').GetNameNoTier]), а также в окружающем герцогстве [GetTitleByKey('d_galloway').GetNameNoTier]."
 sidhe_inert_cold_iron_objective_decision_custom3:0 "Вы — Кузница Доблести [completely_control|E] ([GetTitleByKey('c_warwickshire').GetNameNoTier]), а также герцогства [GetTitleByKey('d_valiant_forge').GetNameNoTier] и [GetTitleByKey('d_hereford').GetNameNoTier]."
 sidhe_inert_cold_iron_objective_decision_custom4:0 "Вы [completely_control|E] Затерянная кузница Вулкана ([GetTitleByKey('c_messina').GetNameNoTier]), а также герцогство [GetTitleByKey('d_sicily').GetNameNoTier]."
 sidhe_inert_cold_iron_objective_decision_custom5:0 "Вы тратите 10000 золота или [completely_control|E] хотя бы на один из этих золотых рудников: [GetTitleByKey('b_turoc').GetNameNoTier], [GetTitleByKey('b_abrudbanya').GetNameNoTier], [GetTitleByKey('c_chalkidike').GetNameNoTier], [GetTitleByKey('c_allaqi').GetNameNoTier], [GetTitleByKey('b_wasulu').GetNameNoTier], [GetTitleByKey('b_diakha').GetNameNoTier], [GetTitleByKey('b_goundafa').GetNameNoTier]."
 sidhe_inert_cold_iron_objective_decision_desc:0 "Фейри изо всех сил пытаются понять, почему Холодное железо причиняет им вред. Это может привести к окончательному уничтожению духа Фейри. [GetScriptedCharacterByHistoryID('POD_fae_character_04').GetFirstName] отдал свою жизнь, чтобы попытаться ослабить хватку холодного железа, сжимающую фейри. Многие верят, что железо представляет силу Раскола; философское разделение между человечеством и [UmbraGlossary('dreaming')] воплотилось... во плоти. Она образовалась не какой-то «вещью», а как «естественный» эффект, когда Банальность достигла критического уровня. Фейри должны изучить Холодное железо и каким-то образом сделать его инертным."
 sidhe_inert_cold_iron_objective_decision_effect1:0 "Холодное железо станет инертным и больше не будет угрожать духам фей. Феи больше не смогут становиться целями происков убийства."
 sidhe_inert_cold_iron_objective_decision_effect2:0 "#X Этот [decision|E] является взаимоисключающим с #V $destroy_order_of_reason_objective_decision$#!!#!"
 sidhe_inert_cold_iron_objective_decision_tooltip:0 "Вы измените научную \"реальность\", ища способ трансмутировать или иным образом изменить свойства холодного железа, чтобы сделать его инертным."
