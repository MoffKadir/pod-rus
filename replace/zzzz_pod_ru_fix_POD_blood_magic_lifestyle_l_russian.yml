l_russian:
 BS_BONFIRE_PERK_EFFECT:0 "[PODImprovesCombatMove('POD_combat_move_fire_control')].\n#flavor На этом уровне тауматург может поджечь сам воздух, создавая различные формы из воспламененного воздуха.#!"
 BS_CAMPFIRE_PERK_EFFECT:0 "#flavor Тауматург может одним прикосновением вызвать возгорание легковоспламеняющегося объекта. Созданный таким образом огонь повредит все, включая заклинателя.#!"
 BS_CANDLE_PERK_EFFECT:0 "[PODUnlocksCombatMove('POD_combat_move_fire_control')].\n#flavor Сородич может заключить временный союз со своим величайшим врагом и вызвать на кончике пальца небольшой огонь, похожий на свечу. Огонь не обжигает ни заклинателя, ни кого-либо еще, но вызывает стандартные психологические реакции у других вампиров.#!"
 BS_INFERNO_PERK_EFFECT:0 "[PODUnlocksCombatMove('POD_combat_move_inferno')].\n#flavor В моменты больших неприятностей заклинатель может зажечь собственное витэ и выпустить его в мир величественным огненным адом, созданный таким образом огонь нанесет огромный ущерб всему, включая заклинателя.#!"
 BS_PALM_OF_FIRE_PERK_EFFECT:0 "[PODImprovesCombatMove('POD_combat_move_fire_control')].\n#flavor Вампир может поджечь собственную ладонь, огонь не наносит урон заклинателю, но нанесет урон любому, кто к нему прикоснется.#!"
 BS_PERMANENCY_PERK_EFFECT:0 "Улучшите [GetPerk('summon_the_simplest_form_perk').GetName(GetNullCharacter)] [bs_spell|E], увеличив максимальное значение [durability|E] до #V 25#!.\n#flavor. На этом уровне заклинателю больше не нужно расходовать Силу воли, чтобы поддерживать существование объекта. Объект является постоянным, хотя можно создавать только простые объекты.#!"
 COMMAND_WIND_PERK_EFFECT:0 "Улучшите боевой [modifier|E] от [GetPerk('control_fog_perk').GetName(GetNullCharacter)], отдав вместо этого [GetModifier('command_wind_modifier').GetNameWithTooltip].\n[PODImprovesCombatMove('POD_combat_move_weather_control')].\n#flavor. Вампир может после довольно утомительного ритуала отдать одну команду близлежащим ветрам, увеличивая их скорость до 50 километров в час. Каждая последующая команда требует дополнительного расхода витэ и силы воли.#!"
 DOMINATE_LIGHTNING_PERK_EFFECT:0 "Улучшите боевой [modifier|E] от [GetPerk('control_fog_perk').GetName(GetNullCharacter)], давая вместо этого [GetModifier('dominate_lightning_modifier').GetNameWithTooltip].\n[PODImprovesCombatMove('POD_combat_move_weather_control')].\n#flavor С помощью этой способности высококвалифицированный тауматург может вызвать молнию, чтобы поразить своих врагов; независимо от погоды и любых внешних условий.#!"
 MANIPULATE_RAIN_PERK_EFFECT:0 "Улучшите боевой [modifier|E] от [GetPerk('control_fog_perk').GetName(GetNullCharacter)], давая вместо этого [GetModifier('manipulate_rain_modifier').GetNameWithTooltip].\n#flavor. Используя неестественную силу крови, сородичи могут манипулировать облаками на небесах, чтобы вызвать дождь, или наоборот.#!"
 SUMMON_STORM_PERK_EFFECT:0 "Улучшите боевой [modifier|E] от [GetPerk('control_fog_perk').GetName(GetNullCharacter)], предоставив вместо него [GetModifier('summon_storm_modifier').GetNameWithTooltip].\n#flavor. Призвав врожденную силу крови, заклинатель может вызвать мощную бурю с ясного неба. После вызова шторма он избегает любых попыток дальнейшего контроля или смягчения последствий, пока не закончится сам. #!"
 blood_magic_rego_elementum_visible:0 "Рего Элементум"
 bs_bonfire_perk_name:0 "Большой костёр"
 bs_campfire_perk_name:0 "Костер"
 bs_candle_perk_name:0 "Свеча"
 bs_inferno_perk_name:0 "Инферно"
 bs_palm_of_fire_perk_name:0 "Ладонь огня"
 bs_permanency_perk_name:0 "Постоянство"
 command_wind_perk_name:0 "Контроль ветра"
 dominate_lightning_perk_name:0 "Управление молнией"
 manipulate_rain_perk_name:0 "Контроль дождя"
 summon_storm_perk_name:0 "Управление бурей"
