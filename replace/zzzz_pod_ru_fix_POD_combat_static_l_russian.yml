 aggravated:0 "[POD_aggravated_box]"
 game_concept_cold_damage:0 "Урон от холода"
 game_concept_cold_damage_desc:0 "$BULLET_WITH_TAB$[POD_aggravated_damage_with_box|E] против #bold $POD_splat_mortal_plural_with_icon$#!: их плоть не выдерживает лютого холода.\n$BULLET_WITH_TAB$[POD_superficial_damage_with_box|E] против других [splats|E].\n$BULLET_WITH_TAB$Нет дополнительных множителей урона или невосприимчивости.\n\n#weak Эта стихия особенно тяжело поражает смертных, но даже нежить не защищена от острых кристаллов льда, разрывающих плоть.#!"
 game_concept_cold_damage_icon:0 "@pod_combat_cold_icon!"
 game_concept_cold_damage_short:0 "#L;color:{0.55,0.85,1.00} Холод#!"
 game_concept_cold_damage_short_with_icon:0 "$game_concept_cold_damage_icon$$game_concept_cold_damage_short$"
 game_concept_cold_iron_damage:0 "Урон от холодного железа"
 game_concept_cold_iron_damage_desc:0 "$BULLET_WITH_TAB$[POD_aggravated_damage_with_box|E] против #bold $POD_splat_fae_plural_with_icon$#! и #bold $POD_splat_changeling_plural_with_icon$#!: [banality|E] этого металла оставляет на них страшные дымящиеся раны.\n$BULLET_WITH_TAB$[POD_superficial_damage_with_box|E] против других [splats|E].\n$BULLET_WITH_TAB$Нет дополнительных множителей урона или невосприимчивости.\n\n#weak Оружие, изготовленное старинным способом из кованого железа. Оно тяжелее и хрупче стали, но именно эта примитивность способна погубить душу феи.#!"
 game_concept_cold_iron_damage_icon:0 "@pod_combat_cold_iron_icon!"
 game_concept_cold_iron_damage_short:0 "#L;color:{0.65,0.70,0.78} Холодное железо#!"
 game_concept_cold_iron_damage_short_with_icon:0 "$game_concept_cold_iron_damage_icon$$game_concept_cold_iron_damage_short$"
 game_concept_fire_damage:0 "Урон от огня"
 game_concept_fire_damage_desc:0 "$BULLET_WITH_TAB$[POD_aggravated_damage_with_box|E] против #bold любого [splat|E] с телом.#! Ожоги не заживают за одну ночь.\n$BULLET_WITH_TAB$[POD_superficial_damage_with_box|E] против #bold $POD_splat_wraith_plural_with_icon$#! и #bold $POD_splat_spirit_plural_with_icon$#!, поскольку они бестелесны.\n$BULLET_WITH_TAB$#bold [GetTrait('bushi').GetName(GetNullCharacter)]#! получают #bold двойной урон#! из-за $glossary_clan_curse$.\n$BULLET_WITH_TAB$Некоторые редкие достоинства дают #bold невосприимчивость#! к огню.\n\n#weak Древнейшее орудие человечества отгоняет тьму — в прямом и переносном смысле. Даже крестьянин может защититься от чудовищ, размахивая факелом.#!"
 game_concept_fire_damage_icon:0 "@pod_combat_fire_icon!"
 game_concept_fire_damage_short:0 "#L;color:{1.00,0.55,0.20} Огонь#!"
 game_concept_fire_damage_short_with_icon:0 "$game_concept_fire_damage_icon$$game_concept_fire_damage_short$"
 game_concept_gold_damage:0 "Урон от золота"
 game_concept_gold_damage_desc:0 "$BULLET_WITH_TAB$[POD_aggravated_damage_with_box|E] против #bold $POD_splat_mokole_plural_with_icon$#! и #bold $POD_splat_corax_plural_with_icon$#!: только они уязвимы к солнечному металлу.\n$BULLET_WITH_TAB$[POD_superficial_damage_with_box|E] против других [splats|E].\n$BULLET_WITH_TAB$Нет дополнительных множителей урона или невосприимчивости.\n\n#weak Моколе тщательно скрывают свою слабость перед металлом Гелиоса. Им остаётся лишь надеяться, что болтливые коракс поступают так же.#!"
 game_concept_gold_damage_icon:0 "@pod_combat_gold_icon!"
 game_concept_gold_damage_short:0 "#L;color:{1.00,0.75,0.20} Золото#!"
 game_concept_gold_damage_short_with_icon:0 "$game_concept_gold_damage_icon$$game_concept_gold_damage_short$"
 game_concept_holy_damage:0 "Священный урон"
 game_concept_holy_damage_desc:0 "$BULLET_WITH_TAB$[POD_aggravated_damage_with_box|E] против #bold $POD_splat_vampire_plural_with_icon$#!, #bold $POD_splat_abomination_plural_with_icon$#!, #bold $POD_splat_demon_plural_with_icon$#!, #bold $POD_splat_kueijin_plural_with_icon$#!, #bold $POD_splat_wraith_plural_with_icon$#! и #bold $POD_splat_fae_plural_with_icon$#!: они отшатываются от проявлений [Glossary('Истинной Веры','game_concept_true_faith_desc')].\n$BULLET_WITH_TAB$[POD_superficial_damage_with_box|E] против #bold $POD_splat_changeling_plural_with_icon$#!.\n$BULLET_WITH_TAB$Другие [splats|E] #bold невосприимчивы#!.\n\n#weak Вот, имя Господа идёт издали, горит гнев Его, и пламя Его сильно; уста Его исполнены негодования, и язык Его как огонь поядающий.#!"
 game_concept_holy_damage_icon:0 "@pod_combat_holy_icon!"
 game_concept_holy_damage_short:0 "#L;color:{1.00,0.95,0.65} Святость#!"
 game_concept_holy_damage_short_with_icon:0 "$game_concept_holy_damage_icon$$game_concept_holy_damage_short$"
 game_concept_lightning_damage:0 "Урон от молнии"
 game_concept_lightning_damage_desc:0 "$BULLET_WITH_TAB$[POD_aggravated_damage_with_box|E] против #bold каждого [splat|E]#!. Живая плоть, мёртвая плоть и духовная материя одинаково проводят ток.\n$BULLET_WITH_TAB$Нет дополнительных множителей урона или невосприимчивости.\n\n#weak Любимое оружие Сусаноо, Бога Бурь. Сверхъестественная молния или обычная — ничто не может противостоять её разрушительной силе.#!"
 game_concept_lightning_damage_icon:0 "@pod_combat_lightning_icon!"
 game_concept_lightning_damage_short:0 "#L;color:{1.00,0.95,0.35} Молния#!"
 game_concept_lightning_damage_short_with_icon:0 "$game_concept_lightning_damage_icon$$game_concept_lightning_damage_short$"
 game_concept_pod_combat_accuracy:0 "Точность"
 game_concept_pod_combat_action_points:0 "Очки действий"
 game_concept_pod_combat_action_points_desc:0 "#bold Очки действий (ОД)#! — основной ресурс во время [pod_combat_encounters_with_icon|E].\n\nПо умолчанию каждый раунд начинается с [EmptyScope.ScriptValue('pod_combat_base_ap_base')|V0] очков действий. Некоторые [pod_combat_moves|E] могут прибавлять, отнимать или возвращать ОД.\n\nНеиспользованные ОД сгорают в конце вашего хода."
 game_concept_pod_combat_ap:0 "ОД"
 game_concept_pod_combat_dodge:0 "Уклонение"
 game_concept_pod_combat_dodge_desc:0 "#bold Стойка уклонения#!. Когда атака проверяет уклонение, она автоматически промахивается независимо от [pod_combat_hit_chance|E] атакующего, а уклонение расходуется.\n\n#weak Приём, от которого нельзя уклониться, обходит уклонение, не расходуя его; приём, снимающий уклонение, удаляет стойку до применения прочих эффектов.#!"
 game_concept_pod_combat_dodge_with_icon:0 "@pod_combat_dodge_icon!Уклонение"
 game_concept_pod_combat_dodged:0 "Уклонился"
 game_concept_pod_combat_dodged_with_icon:0 "@pod_combat_dodge_icon!Уклонился"
 game_concept_pod_combat_dodging:0 "Уклоняется"
 game_concept_pod_combat_dodging_with_icon:0 "@pod_combat_dodge_icon!Уклоняется"
 game_concept_pod_combat_encounter:0 "Боевая схватка"
 game_concept_pod_combat_encounter_desc:0 "Пошаговая тактическая мини-игра, где два или больше персонажей решают разногласия насилием.\n\nБойцы по очереди тратят [pod_combat_action_points|E] на [pod_combat_moves|E], пока враг не окажется [pod_combat_knocked_out|E].\n\nРазнообразные [pod_combat_moves|E] открываются благодаря свойствам [splat|E], достоинствам и другим источникам. Они могут наносить урон [POD_health_track|E] или [pod_combat_morale|E], накладывать усиления и ослабления, давать стойки вроде [pod_combat_guard_with_icon|E], [pod_combat_dodge_with_icon|E] или [pod_combat_stealth_with_icon|E] и многое другое.\n\n[prowess_i][prowess|E] очень важна в бою, поскольку определяет [pod_combat_hit_chance|E] и [pod_combat_initiative|E].\n\n#I Подробнее о механике боя можно узнать через кнопку #bold Справка#! в боевом интерфейсе.#!"
 game_concept_pod_combat_encounter_with_icon:0 "@pod_combat_encounter_icon!Боевая схватка"
 game_concept_pod_combat_encounters:0 "Боевые схватки"
 game_concept_pod_combat_encounters_with_icon:0 "@pod_combat_encounter_icon!Боевые схватки"
 game_concept_pod_combat_guard:0 "Защита"
 game_concept_pod_combat_guard_desc:0 "#bold Защитная стойка#!. Если атака, проверяющая защиту, иначе достигла бы цели, она превращается в заблокированный удар и не наносит урон [POD_health_track|E]. Защита расходуется, когда блокирует эту атаку.\n\n#weak Приём, игнорирующий защиту, может попасть в цель, не расходуя её.#!"
 game_concept_pod_combat_guard_with_icon:0 "@pod_combat_guard_icon!Защита"
 game_concept_pod_combat_guarded:0 "Под защитой"
 game_concept_pod_combat_guarded_with_icon:0 "@pod_combat_guard_icon!Под защитой"
 game_concept_pod_combat_guarding:0 "Защищается"
 game_concept_pod_combat_guarding_with_icon:0 "@pod_combat_guard_icon!Защищается"
 game_concept_pod_combat_hit:0 "Попадание"
 game_concept_pod_combat_hit_chance:0 "Шанс попадания"
 game_concept_pod_combat_hit_chance_desc:0 "Для [pod_combat_moves|E], требующих #bold проверки попадания#!, вероятность попадания — процентный шанс успешно пройти эту проверку. Основа начинается с [EmptyScope.ScriptValue('pod_combat_hit_chance_base_base')|0]% и изменяется на половину разницы между вашей [prowess|E] и доблестью выбранной цели; затем учитываются действующие усиления и ослабления попадания и бонус [pod_combat_stealth_with_icon|E] +[EmptyScope.ScriptValue('pod_combat_stealth_hit_base_bonus')|0]%.\n\n[pod_combat_dodge_with_icon|E] и [pod_combat_stealth_with_icon|E] проверяются до попадания, а [pod_combat_guard_with_icon|E] может заблокировать атаку, которая иначе достигла бы цели. [soak_damage|E] и способность воздействовать на бестелесных духов — также отдельные этапы. Ни одна из этих защит не меняет отображаемый процент.\n\nВероятность попадания при проверке ограничена диапазоном от [EmptyScope.ScriptValue('pod_combat_hit_chance_min_base')|0]% до [EmptyScope.ScriptValue('pod_combat_hit_chance_max_base')|0]%. Приёмы с пометкой #bold Без проверки попадания#! пропускают лишь эту проверку; любая другая защита, которую они не игнорируют, всё ещё может их остановить."
 game_concept_pod_combat_init:0 "Иниц."
 game_concept_pod_combat_initiative:0 "Инициатива"
 game_concept_pod_combat_initiative_desc:0 "Проверка, определяющая [pod_combat_turn_order|E]. Чем выше инициатива, тем раньше действует боец.\n\nКаждый боец проходит проверку один раз при вступлении в бой и сохраняет результат до его конца: очерёдность одна на всю схватку, а не новая каждый раунд. Проверка учитывает [prowess|E] и вид бойца; достоинства и свойства изменяют её. Быстрые бойцы (со сверхъестественными дисциплинами скорости и свойствами быстроты) могут атаковать раньше, чем медленные враги успеют отреагировать.\n\nОслабления инициативы от приёмов меняют результат на #bold один раунд#!, а затем исчезают. Применив их вовремя, вы получаете ровно один ход раньше более быстрого врага."
 game_concept_pod_combat_knocked_out:0 "выбыл из боя"
 game_concept_pod_combat_knocked_out_desc:0 "Боец #bold выбывает из боя#! и покидает [pod_combat_encounter_with_icon|E], если происходит одно из следующего:\n$BULLET_WITH_TAB$Его [POD_health_track|E] полностью заполняется\n$BULLET_WITH_TAB$Его [pod_combat_morale|E] падает до #N нуля#!\n$BULLET_WITH_TAB$Он умирает, становится #N недееспособным#!, впадает в $pod_torpor$ или оказывается заточён в Царстве Теней либо Бездне\n\nВы побеждаете, когда все враги выбывают. Если вы выбываете сами, вы проигрываете, даже если союзники ещё сражаются."
 game_concept_pod_combat_morale:0 "Боевой дух"
 game_concept_pod_combat_morale_desc:0 "#bold Психическая стойкость#! бойца во время [pod_combat_encounters_with_icon|E]. Боевой дух обычно начинает с полного значения и снижается от прямых ментальных атак, запугивания и другого давления. Каждая ячейка ранения, нанесённая ударом после [soak_damage|E], также отнимает #N [EmptyScope.ScriptValue('pod_combat_morale_from_hp_base_ratio')|0]#! боевого духа.\n\nКогда боец [pod_combat_knocked_out|E], каждый выживший союзник теряет #N [EmptyScope.ScriptValue('pod_combat_ally_down_morale_penalty')|0]#! боевого духа от потрясения. Эта потеря не опускает боевой дух ниже 1, поэтому само потрясение не может вывести кого-либо из боя.\n\nВне тренировок каждый живой боец получает в конце боя #N [EmptyScope.ScriptValue('pod_combat_morale_base_stress_multiplier')|0]#! [static_stress|E] за каждое недостающее очко боевого духа. Восстановление боевого духа до завершения схватки уменьшает это долговременное напряжение. Тренировочные бои не оставляют психического напряжения."
 game_concept_pod_combat_morale_icon:0 "@stress_icon!"
 game_concept_pod_combat_move:0 "Боевой прием"
 game_concept_pod_combat_move_desc:0 "#I Используйте [decision|E] #bold [SelectLocalization(IsInGame,'pod_combat_configure_moves_link_ingame','pod_combat_configure_moves')]#!, чтобы выбрать набор приёмов перед боем.#!\n\nЭто способности, применяемые во время [pod_combat_encounters_with_icon|E]. Боевые приёмы делятся на четыре категории:\n\n#color_red;bold АТК (Атака):#! наносят урон [POD_health_track|E]. Некоторые имеют [POD_damage_types|E], например [fire_damage_short_with_icon] или [silver_damage_short_with_icon].\n\n#color_light_blue;bold ЗАЩ (Защита):#! исцеляют, улучшают [soak_damage|E] или [pod_combat_hit_chance|E] либо дают стойки вроде [pod_combat_guard_with_icon|E], [pod_combat_dodge_with_icon|E] или [pod_combat_stealth_with_icon|E].\n\n#color_porple;bold КОН (Контроль):#! наносят урон [pod_combat_morale|E], ослабляют [soak_damage|E] или [pod_combat_hit_chance|E] врага либо отнимают его [pod_combat_ap|E].\n\n#color_pwr_orange;bold СИЛ (Сила):#! мощные завершающие приёмы, часто имеющие ограничения.\n\nМожно выбрать по #bold [EmptyScope.ScriptValue('pod_combat_max_per_category_base')|V0]#! приёма каждой категории, всего #bold [EmptyScope.ScriptValue('pod_combat_max_equipped_base')|V0]#!.\n\nБоевые приёмы расходуют [pod_combat_action_points|E] #V (ОД)#! и могут требовать дополнительных затрат, таких как [hunger_with_icon|E] или [gold_i][gold|E]."
 game_concept_pod_combat_moves:0 "Боевые приемы"
 game_concept_pod_combat_stealth:0 "Скрытность"
 game_concept_pod_combat_stealth_desc:0 "#bold Скрытая стойка#!, дающая +[EmptyScope.ScriptValue('pod_combat_stealth_hit_base_bonus')|0]% к [pod_combat_hit_chance|E], пока действует. Скрытность исчезает при первом из следующих событий:\n$TAB$- Боец использует приём, наносящий урон здоровью или требующий враждебного контакта\n$TAB$- Входящая атака проверяет скрытность и автоматически промахивается\n\nАтаки, наносящие только урон боевому духу, не расходуют скрытность атакующего.\n\n#weak Приём, от которого нельзя уклониться, обходит скрытность, не расходуя её. Приём, снимающий скрытность, удаляет стойку до применения прочих эффектов.#!"
 game_concept_pod_combat_stealth_with_icon:0 "@pod_combat_stealth_icon!Скрытность"
 game_concept_pod_combat_stealthed:0 "Скрывается"
 game_concept_pod_combat_stealthed_with_icon:0 "@pod_combat_stealth_icon!Скрывается"
 game_concept_pod_combat_turn:0 "Ход"
 game_concept_pod_combat_turn_order:0 "Очерёдность ходов"
 game_concept_pod_combat_turn_order_desc:0 "Установленная очерёдность действий бойцов, с номерами от 1 (первый) до N (последний). Определяется [pod_combat_initiative|E] каждого бойца.\n\nПорядок задаётся в начале боя и сохраняется до конца, позволяя планировать на несколько ходов вперёд. Он меняется лишь при изменении инициативы: её ослабление сдвигает цель на один раунд, а присоединившийся к схватке боец входит в очерёдность со следующего раунда.\n\nЕсли бойцов трое или больше, порядок показан полосой портретов вверху окна боя. Действующий боец выделен; после хода или поражения портреты тускнеют. Номер бойца указан в строке [pod_combat_initiative|E] подсказки при наведении на его карточку."
 game_concept_poison_damage:0 "Урон от яда"
 game_concept_poison_damage_desc:0 "$BULLET_WITH_TAB$[POD_aggravated_damage_with_box|E] против #bold $POD_splat_mortal_plural_with_icon$#!: яд разлагает их живую плоть.\n$BULLET_WITH_TAB$#bold $POD_splat_vampire_plural_with_icon$#! и #bold $POD_splat_kueijin_plural_with_icon$#! #bold невосприимчивы#!: у нежити нет живого тела, которое можно отравить.\n$BULLET_WITH_TAB$[POD_superficial_damage_with_box|E] против других [splats|E].\n\n#weak Излюбленное оружие леди Юл, Маэльджин Токсинов. Его часто клеймят орудием предателей и трусов. Но что толку в чести, когда на кону ваша жизнь?#!"
 game_concept_poison_damage_icon:0 "@pod_combat_poison_icon!"
 game_concept_poison_damage_short:0 "#L;color:{0.55,0.80,0.30} Яд#!"
 game_concept_poison_damage_short_with_icon:0 "$game_concept_poison_damage_icon$$game_concept_poison_damage_short$"
 game_concept_silver_damage:0 "Урон серебра"
 game_concept_silver_damage_desc:0 "$BULLET_WITH_TAB$[POD_aggravated_damage_with_box|E] против #bold $POD_splat_werewolf_plural_with_icon$#! и большинства других #bold $glossary_fera$#!: их регенерация отказывает при ранениях #italic металлом \"$glossary_luna$\"#!.\n$BULLET_WITH_TAB$[POD_superficial_damage_with_box|E] против других [splats|E].\n$BULLET_WITH_TAB$Нет дополнительных множителей урона или невосприимчивости.\n\n#weak Серебряное оружие может уравнять шансы против оборотня, но не обольщайтесь: даже без регенерации они остаются величайшими машинами убийства Геи.#!"
 game_concept_silver_damage_icon:0 "@pod_combat_silver_icon!"
 game_concept_silver_damage_short:0 "#L;color:{0.85,0.85,0.95} Серебро#!"
 game_concept_silver_damage_short_with_icon:0 "$game_concept_silver_damage_icon$$game_concept_silver_damage_short$"
 game_concept_sun_damage:0 "Урон от солнечного света"
 game_concept_sun_damage_desc:0 "$BULLET_WITH_TAB$[POD_aggravated_damage_with_box|E] против #bold $POD_splat_vampire_plural_with_icon$#!, #bold $POD_splat_abomination_plural_with_icon$#! и #bold $POD_splat_kueijin_plural_with_icon$#! — проклятых солнцем. Некоторые $POD_splat_kueijin_plural$ [Glossary('Дхармы','podgloss.dharma')] переносят его как поверхностный урон.\n$BULLET_WITH_TAB$Другие [splats|E] #bold невосприимчивы#!: солнечный свет не ранит живых и тех, кто не проклят.\n$BULLET_WITH_TAB$#bold #TOOLTIP:GAME_TRAIT,setite,[GetNullCharacter] #L Сетиты#!#! и [GetTrait('bushi').GetName(GetNullCharacter)]#! получают #bold двойной урон#! из-за $glossary_clan_curse$.\n\n#weak Солнце разносит Божье тепло по всему Его творению. Как же уместно, что проклятые Им больше не могут его принять.#!"
 game_concept_sun_damage_icon:0 "@pod_combat_sun_icon!"
 game_concept_sun_damage_short:0 "#L;color:{1.00,0.92,0.50} Солнечный свет#!"
 game_concept_sun_damage_short_with_icon:0 "$game_concept_sun_damage_icon$$game_concept_sun_damage_short$"
 interaction_debug_combat:0 "#D ОТЛАДКА: #BER Боевая мини-игра#!#!"
 pod_artifact_desc_and_weapon_override:0 "[PODWeaponOverrideSelfText][Artifact.GetDesc]"
 pod_combat.0001.a:0 "» Ходы и выбор цели"
 pod_combat.0001.b:0 "» Как читать ход боя"
 pod_combat.0001.c:0 "» Нападение, защита и эффекты"
 pod_combat.0001.d:0 "» Исходы и управление"
 pod_combat.0001.desc:0 "[pod_combat_encounters_with_icon|E] проходят пошагово: каждый боец тратит [pod_combat_action_points|E] на [pod_combat_moves|E], а вы выбираете из заранее подготовленного набора. Вы побеждаете, когда каждый враг [pod_combat_knocked_out|E]. Если этого не произошло, вы проигрываете, как только ваш персонаж падёт, даже если союзники ещё сражаются. Каждая синяя надпись в окне боя снабжена подсказкой при наведении — пользуйтесь ими, если нужно освежить память.\n\nВыберите тему ниже, чтобы узнать подробности. Это меню можно вновь открыть кнопкой #bold Справка#! в любой момент."
 pod_combat.0001.t:0 "Обзор боевой системы"
 pod_combat.0100.desc:0 "#bold ВАШ ХОД#!\nВ начале каждого раунда у вас #bold [GuiScope.ScriptValue('pod_combat_base_ap')|0]#! [pod_combat_action_points|E] (больше или меньше, если очки действий были усилены, отняты или возвращены). Тратьте ОД на приёмы на панели; те, на которые не хватает очков, отображаются серым. Закончив, нажмите #bold Завершить ход#! — неиспользованные ОД сгорают.\n\nМногие приёмы также расходуют #bold сверхъестественную энергию#!: Кровь у вампиров, Гнозис у перевёртышей, Пафос или Ангст у призраков, Гламур у подменышей и так далее. Она берётся из обычного запаса вашего вида, поэтому частое использование дорогих дисциплин истощает вас во время боя и оставляет без сил после него. Некоторые приёмы также расходуют золото, благочестие, престиж или [static_stress|E].\n\nЧтобы выбрать приёмы для панели, перед боем откройте [GetDecision('pod_combat_configure_moves').GetName|V] через [decision|E]. Можно взять не более четырёх приёмов каждой категории (#color_red АТК#! / #color_light_blue ЗАЩ#! / #color_porple КОН#! / #color_pwr_orange СИЛ#!). Включите #bold Показать все приёмы#!, чтобы увидеть ещё не открытые: у каждого указано, каких свойств, сил или достоинств вам не хватает.\n\n#bold ВЫБОР ЦЕЛИ#!\nНажмите на #bold карточку#! союзника или врага (либо его портрет в полосе очерёдности), чтобы сделать его текущей целью. На карточке появится отметка @check_icon! #bold Цель#!, а вверху окна — сама цель и ваша [pod_combat_hit_chance|E] против неё. Атакующие приёмы направлены на выбранного врага, поддержка (исцеление, усиления) — на выбранного союзника; приёмы для себя не учитывают выбранную цель. Некоторые приёмы #bold действуют по области#! и затрагивают сразу всех врагов или всех союзников независимо от выбора. При смене цели вероятность попадания пересчитывается по вашей [prowess|E] относительно её доблести, действующим модификаторам попадания и вашему бонусу [pod_combat_stealth_with_icon|E]. Эффекты цели — [pod_combat_guard_with_icon|E], [pod_combat_dodge_with_icon|E], [pod_combat_stealth_with_icon|E] и [soak_damage|E] — проверяются отдельно и этот процент не меняют.\n\n#bold КОГО АТАКУЕТ ИИ#!\nНа карточке каждого бойца под управлением ИИ есть строка #bold Атакует#! с именем последней атакованной цели. Она есть и у врагов, и у ваших союзников под управлением ИИ (ваша цель указана вверху). Это противник, на котором боец #italic сосредоточился#!: он обычно продолжает бить ту же жертву, но это не гарантия — ИИ может переключиться, чтобы добить почти поверженного врага. Строка пуста до первого хода бойца и пока он #bold подчинён#! (его приоритет на этот ход сбрасывается). Следите за ней, чтобы понять, кому грозит нападение нескольких врагов, и вывести уязвимого союзника из-под удара.\n\n#bold ОЧЕРЁДНОСТЬ ХОДОВ#!\nЕсли бойцов трое или больше, вверху проходит #bold полоса очерёдности ходов#! с портретами: слева направо в порядке действий. Каждый боец один раз определяет [pod_combat_initiative|E] при вступлении в бой и сохраняет её, поэтому очерёдность остаётся неизменной всю схватку и позволяет планировать на несколько ходов вперёд. Изменить её может лишь ослабление инициативы, и только на один раунд. Действующий боец выделен золотом; портреты тускнеют после хода или поражения, а при большом числе участников полоса прокручивается вбок. Новые бойцы могут присоединиться к начавшейся схватке — например, призванный некромантом призрак или прибывшее подкрепление. Они входят в очерёдность со следующего раунда."
 pod_combat.0100.t:0 "Ходы и выбор цели"
 pod_combat.0101.desc:0 "#bold КАРТОЧКИ БОЙЦОВ#!\nКарточка каждого бойца показывает:\n• [POD_health_track|E] — ячейки ранений, заполняющиеся при получении ударов.\n• [pod_combat_morale|E] — самообладание, отдельное от здоровья. Прямые ментальные атаки снижают его; каждая ячейка ранения, нанесённая ударом после поглощения, также отнимает #bold [GuiScope.ScriptValue('pod_combat_morale_from_hp_base_ratio')|0]#! боевого духа.\n• [prowess|E] / [pod_combat_hit|E] / [soak_damage|E] — показатели нападения и защиты.\nНаведите курсор на карточку для подробностей, включая [pod_combat_init|E] бойца и его номер [pod_combat_turn|E] в очерёдности.\nЗначки внизу карточки показывают действующие стойки и состояния (защита, уклонение, скрытность, ответный удар, горение, ошеломление, подчинение). Наведите на любой из них, чтобы узнать подробности.\n\n#bold ЖУРНАЛ БОЯ#!\nПрокручиваемая панель под приёмами записывает все значимые события по порядку; новейшие находятся сверху. Каждая строка показывает действующего бойца, приём, цель и все его последствия: урон, исцеление, истощение, состояния, отдачу и ответные удары, а также остановившие их промахи, блоки и поглощение. Союзники выделены золотом, враги — красным: прокрутив журнал, можно быстро восстановить картину боя.\n\nНесколько особенностей строк:\n• Атаки #bold по области#! создают #bold отдельную строку для каждой цели#!, показывая, кому что досталось (например, \"Митра → Все враги (Стив)\").\n• Когда срабатывает стойка вроде ответного удара, вызвавшая его строка получает пометку #bold + Ответный удар#! рядом с основным результатом.\n• Отметки обрамляют бой: \"— Бой начинается —\" внизу, \"— Начинается раунд 2 —\" при смене раунда, а после завершения — \"— Бой окончен · Победа —\" или \"— Бой окончен · Поражение —\" вверху."
 pod_combat.0101.t:0 "Как читать ход боя"
 pod_combat.0102.desc:0 "#bold ПОПАДАНИЕ#!\nПодсказка приёма указывает, какие этапы защиты он пропускает. Обычная физическая атака прежде всего должна быть способна воздействовать на бестелесного духа. Затем [pod_combat_stealth_with_icon|E] или [pod_combat_dodge_with_icon|E] позволяют избежать её, проверка [pod_combat_hit_chance|E] может дать промах, а [pod_combat_guard_with_icon|E] — заблокировать удар, который иначе достиг бы цели. После этого [soak_damage|E] проверяется отдельно для каждой единицы урона: обычно тяжёлый удар ослабляется, а не предотвращается целиком.\n\n#bold Без проверки попадания#! пропускает лишь процентную проверку; #bold невозможно уклониться#! обходит уклонение и скрытность; #bold воздействует на бестелесных духов#! позволяет поразить духа даже там, где это иначе невозможно; #bold игнорирует защиту#! проходит сквозь защиту. #bold Снимает защиту#! или #bold снимает уклонение / скрытность#! удаляет соответствующую стойку до применения прочих эффектов приёма. Сверхъестественные и ментальные атаки обычно пропускают проверку попадания и защиты, но уклонение и скрытность всё ещё позволяют избежать их.\n\n#bold ТИПЫ УРОНА#!\n• [Concept('POD_superficial_damage','поверхностный урон')|E]: может поглощаться по единице и заживает между боями.\n• [Concept('POD_aggravated_damage','серьёзный урон')|E]: по умолчанию не поглощается и заживает медленно. Стихийные атаки — [fire_damage_short|E], [cold_damage_short|E], [lightning_damage_short|E], [sun_damage_short|E], [silver_damage_short|E], [gold_damage_short|E], [holy_damage_short|E], [balefire_damage_short|E], [poison_damage_short|E] и [cold_iron_damage_short|E] — наносят серьёзный урон только уязвимым к ним видам; некоторые виды полностью #bold невосприимчивы#!. Наведите на тип урона, чтобы узнать об уязвимостях.\nНекоторые приёмы — #bold высасывающие атаки#!: они исцеляют вас, но лишь если после поглощения атака нанесла урон здоровью. Другие при использовании #bold ранят и вас#!: безрассудные атаки в полную силу, жертвующие частью вашего здоровья ради более тяжёлого удара.\n\n#bold ЗАЩИТНАЯ ТАКТИКА#!\nМожно заранее накопить защитные эффекты: они сохраняются до первой проверки. Нередко лучший ход — подготовить защиту вместо нападения:\n• [pod_combat_guard_with_icon|E] — блокирует следующую атаку, проверяющую защиту, которая иначе попала бы в цель.\n• [pod_combat_dodge_with_icon|E] — предотвращает следующую атаку, проверяющую уклонение; приёмы, от которых нельзя уклониться, не расходуют его.\n• [pod_combat_stealth_with_icon|E] — +[GuiScope.ScriptValue('pod_combat_stealth_hit_bonus')|0]% к попаданию, пока действует; расходуется при следующем приёме, наносящем урон здоровью или требующем враждебного контакта, либо при уходе от атаки.\n• #bold Ответный удар при попадании / промахе#! — атакует того, кто испытывает вашу защиту. Подсказка приёма указывает точный ответный эффект и тип урона: поверхностный или серьёзный.\n\n#bold УСИЛЕНИЯ И ОСЛАБЛЕНИЯ#!\nВременные эффекты попадания и поглощения бывают малыми, средними и большими. Усиления и ослабления попадания, а также ослабления поглощения добавляют или отнимают #bold 10 / 20 / 30#! процентных пунктов. Усиления поглощения вместо этого уменьшают оставшийся после текущего поглощения урон на #bold 10 / 20 / 30%#!, поэтому отображаемая прибавка зависит от текущего поглощения бойца.\n\nЭффекты на раунд и на весь бой занимают отдельные ячейки, как и усиления с ослаблениями, поэтому могут действовать одновременно. При одинаковом показателе, направлении и длительности текущий эффект заменяется только строго более сильным; равный или слабый ничего не добавляет. Усиление на раунд исчезает в начале следующего хода владельца, а ослабление сохраняется весь его следующий ход и исчезает в конце. Эффекты на весь бой действуют до его завершения.\n\n#bold НЕДУГИ И КОНТРОЛЬ#!\nНекоторые приёмы оставляют не только раны:\n• #bold Периодический урон#! срабатывает в конце каждого раунда несколько раундов подряд; каждый раз отмечается значком типа урона. Ментальные недуги вместо этого снижают [pod_combat_morale|E]; недуги без указанного типа просто ранят. На карточке жертвы появляется значок состояния: наведите на него, чтобы узнать урон и число оставшихся раундов.\n• #bold Ошеломление и оглушение#! — некоторые атаки отнимают очки действий цели на следующий ход. При полном истощении этот ход начинается с #bold 0 ОД#!; доступные приёмы за 0 ОД всё ещё можно использовать.\n• #bold Подчинение#! — некоторые ментальные силы похищают следующий ход бойца и обращают его против своих. Сильная ментальная защита предотвращает это, если заклинатель не способен её пробить; #bold ваш#! персонаж никогда не может стать марионеткой."
 pod_combat.0102.t:0 "Нападение, защита и эффекты"
 pod_combat.0103.desc:0 "#bold ВЫБЫВАНИЕ ИЗ БОЯ#!\nБоец выбывает из схватки, если происходит одно из следующего:\n• Его [POD_health_track|E] полностью заполняется.\n• Его [pod_combat_morale|E] падает до нуля.\n• Он умирает, становится #N недееспособным#!, впадает в оцепенение или оказывается заточён в Царстве Теней либо Бездне.\nКаждое падение потрясает выживших: каждый оставшийся союзник теряет #bold [GuiScope.ScriptValue('pod_combat_ally_down_morale_penalty')|0]#! [pod_combat_morale|E], но этот шок не может снизить боевой дух ниже 1. Вы #bold побеждаете#!, как только врагов не остаётся. В противном случае, если #bold ваш персонаж#! выбывает, вы сразу проигрываете, даже если союзники ещё сражаются.\n\n#bold ПОСЛЕ БОЯ#!\nВне тренировок каждый живой боец получает #bold [GuiScope.ScriptValue('pod_combat_morale_stress_multiplier')|0]#! [static_stress|E] за каждое недостающее в конце боя очко [pod_combat_morale|E]. Восстановление боевого духа до завершения уменьшает эти долговременные последствия. Раны сохраняются в соответствии с режимом поединка, а потраченная на приёмы сверхъестественная энергия и прочие ресурсы не возвращаются. Выбранный набор приёмов сохраняется между боями.\n\n#bold РЕЖИМЫ ПОЕДИНКА#!\nПравила смертности задаёт событие, вызвавшее бой:\n• #bold Смертельный#!: раны сохраняются; действуют обычные правила PoD для ран, смерти и выживания отдельных видов. Некоторые исходные события гарантируют смерть проигравшего.\n• #bold Несмертельный#!: раны действуют как обычно и могут вывести бойца из строя, но смерть от ран предотвращается. В конце боя полностью заполненная шкала ранений исцеляется так, чтобы осталась одна пустая ячейка.\n• #bold Тренировка#!: урон, исцеление и боевой дух действуют во время схватки и определяют, кто падёт, но затем состояние ранений каждого бойца восстанавливается до исходного, а недостающий боевой дух не оставляет психического напряжения. Обычная стоимость приёмов всё равно уплачивается; полученная при определённых условиях энергия может сохраниться.\n\n#bold КНОПКИ ОКНА#!\n• #bold Завершить ход#!: закончить свой ход и передать очередь следующему бойцу по инициативе. Неиспользованные ОД сгорают.\n• #bold Автоматический исход#!: пропустить оставшуюся часть боя. Текущая [prowess|E] выживших бойцов каждой стороны суммируется; к ней прибавляется случайное число от нуля до этой суммы. Побеждает большее значение; ничья решается в вашу пользу. Боевой дух проигравшего предводителя падает до нуля, вызывая максимальное психическое напряжение от его потери вне тренировок, если предводитель выживет.\n  Пропуск боя не проходит бесследно. В заключительной схватке каждый ещё стоящий боец получает ранения, включая победителей. Тяжесть зависит от решительности исхода: при близком результате обе стороны страдают примерно поровну; разгром оставляет победителей почти невредимыми, а проигравших — тяжело израненными. [soak_damage|E] проверяется как обычно, поэтому стойкий боец может полностью избежать урона. Тренировочные поединки освобождены от этого.\n  Есть исключение: если ещё стоит враг, которому вы #bold никак не можете навредить#! — бестелесный дух, которого никто на вашей стороне не способен поразить, — никакая сумма не принесёт победы. Автоматический исход тогда означает сдачу без проверки. Кнопка остаётся доступной именно потому, что другого выхода из такой схватки нет; подсказка предупреждает об этом заранее. Обратное также верно, но лишь когда неуязвим #bold ваш собственный персонаж#!: бестелесный союзник не спасёт вас, поскольку вы проигрываете в момент падения своего персонажа.\n• #bold Завершить бой#!: закрыть окно после определения исхода (после победы или поражения заменяет «Завершить ход» и «Автоматический исход»).\n• Флажок #bold Автоматическая смена ходов#!: если включён, все ходы ИИ в раунде отыгрываются одним щелчком, а не по очереди.\n• #bold Справка#!: вновь открыть это руководство в любой момент.\n\nПосле определения победителя появляется вариант #bold $pod_combat.9995.a$#!; выбрав его, вы возвращаетесь к событию, вызвавшему бой. Уйти из поединка на полпути нельзя: доведите его до конца или воспользуйтесь автоматическим исходом."
 pod_combat.0103.t:0 "Исходы и управление"
 pod_combat.0200.a:0 "Сначала проверить свои приёмы."
 pod_combat.0200.b:0 "Начать бой со стандартными приёмами."
 pod_combat.0200.desc:0 "Скоро начнётся пошаговая [pod_combat_encounter_with_icon|E]. Каждый раунд вы тратите [pod_combat_action_points|E] на выбранные [pod_combat_moves|E]; схватка заканчивается, когда каждый враг #italic (или вы)#! оказывается [pod_combat_knocked_out|E]. Подробнее о механике можно узнать через кнопку #bold Справка#! в окне боя.\n\nВы ещё не меняли набор [pod_combat_move|E] для этого персонажа, поэтому рекомендуем сделать это сейчас. Позже вы сможете воспользоваться [decision|E] [GetDecision('pod_combat_configure_moves').GetName] в любой момент вне боя."
