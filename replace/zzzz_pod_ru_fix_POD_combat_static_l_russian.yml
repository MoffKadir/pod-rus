 pod_combat_auto_resolve:0 "Автоматический исход"
 pod_combat_auto_resolve_desc:0 "Пропустить оставшуюся часть боя. Победитель определяется сравнением доблести.\n\nВ заключительной схватке каждый, кто ещё держится на ногах, рискует получить рану. Тяжесть зависит от исхода: явный победитель уйдёт почти невредимым, проигравшей стороне достанется сильнее всего. На тренировочные поединки это не распространяется.[GetPlayer.Custom('PODCombatAutoResolveVerdict')]"
 pod_combat_auto_resolve_forced_loss_tt:0 "\n\n@warning_icon!#X Ваша сторона не способна причинить вред бестелесному духу. Автоматический исход означает поражение, а ваши люди понесут самые тяжёлые последствия.#!"
 pod_combat_auto_resolve_forced_win_tt:0 "\n\n#P Враги не способны причинить вред вашей бестелесной форме, поэтому автоматический исход принесёт вам победу.#!"
