 pod_combat_debug_proxy_desc:0 "Управляйте боем, в котором сами не участвуете: за вашу сторону сражаются придворные, а вы играете за их предводителя. Вас нельзя ранить; ваш представитель может погибнуть."
 pod_combat_debug_proxy_interaction:0 "Отладка: бой через представителя"
 pod_combat_debug_reinforce_desc:0 "Отладка: 1 на 1 против этого персонажа, затем союзник (ваш вассал) присоединяется во 2-м раунде и враг (его вассал) в 3-м раунде — проверяет отложенное подкрепление."
 pod_combat_debug_reinforce_interaction:0 "Бой с подкреплениями"
