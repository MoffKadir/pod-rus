 pod_combat_debug_big_desc:0 "Отладка: создайте большую схватку — вы и ваши вассалы против этого персонажа и его вассалов, до выбранного числа участников с каждой стороны — для проверки команд произвольного размера под нагрузкой. Бойцы за первыми рядами доступны через прокрутку панелей союзников и врагов."
 pod_combat_debug_big_interaction:0 "Большая схватка"
 pod_combat_debug_big_size_12:0 "Размер команды: 12 человек с каждой стороны."
