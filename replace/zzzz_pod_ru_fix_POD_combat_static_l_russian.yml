 pod_combat_debug_invalid_toast:0 "Отладочный бой: дуэль недействительна (тот же атакующий/защитник?)."
 pod_combat_debug_nonfatal_desc:0 "Отладка: несмертельная дуэль 1 на 1 — раны наносятся, но ничья шкала здоровья не заполняется полностью."
 pod_combat_debug_nonfatal_interaction:0 "Несмертельный бой"
 pod_combat_debug_nosummon_desc:0 "Отладка: поединок один на один с запретом призыва — все приёмы призыва недоступны обеим сторонам."
 pod_combat_debug_nosummon_interaction:0 "Бой без призыва"
 pod_combat_debug_nv1_desc:0 "Отладка: сразитесь с этим персонажем вместе со своей котерией."
 pod_combat_debug_nv1_interaction:0 "Бой многие против одного"
 pod_combat_debug_nvn_desc:0 "Отладка: ваша котерия против этого персонажа и его рыцарей."
 pod_combat_debug_nvn_interaction:0 "Бой многие против многих"
