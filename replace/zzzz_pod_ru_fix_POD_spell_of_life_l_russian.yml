 spell_of_life_stage4_custom_decision_desc:0 "Последним шагом к созданию [Concept('POD_spell_of_life', 'Заклинание Жизни')|E] является привязка заклинания к пространству внутри [UmbraGlossaryLocalized('shadowlands','Загробный мир')], где ваши души будут находиться до тех пор, пока они не возродятся заново. Поскольку у вас нет союзников с собственными [UmbraGlossary('shadow_realm')], вам придется выкроить собственное пространство для Заклинания Жизни. Это будет сложно, так как против вас выступят [umbra|E] и все его жители.$spell_of_life_stage4_warning$"
