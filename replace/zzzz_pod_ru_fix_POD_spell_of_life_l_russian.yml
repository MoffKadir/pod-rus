 spell_of_life_stage4_amenti_decision_desc:0 "Последним шагом к созданию [Concept('POD_spell_of_life', 'Заклинание Жизни')|E] является привязка заклинания к пространству внутри [UmbraGlossaryLocalized('shadowlands','Загробный мир')], чтобы наши души могли обитать до тех пор, пока не возродятся заново. В то время как другим, возможно, придется выкроить свое собственное пространство, наши хорошие отношения с Первой Династией Бессмертных и их сторонниками, такими как Кеминтири, предоставили более легкую альтернативу. Если бы мы могли отправиться в [UmbraGlossaryLocalized('dark_kingdom_of_sand','Аменти')], мы могли бы встретиться с агентами Осириса и убедить их предоставить нам дом в [UmbraGlossaryLocalized('dark_kingdom_of_sand','Аменти')].\n\n#warning. Этот последний этап несет в себе некоторую опасность, и Судьи Маат дадут вам только один шанс высказать свои аргументы.#!"
 spell_of_life_stage4_amenti_decision_tooltip:0 "Возможно, мы сможем найти дом в [UmbraGlossaryLocalized('dark_kingdom_of_sand','Аменти')]."
