 POD_CHANGE_CHARACTER_SHADOW_REALM_FORCE_ADD:0 "Вы #P получаете#! $VALUE|0V$ ед. военной мощи"
 POD_CHANGE_CHARACTER_SHADOW_REALM_FORCE_SUBTRACT:0 "Вы #N теряете#! $VALUE|0V$ ед. военной мощи"
 POD_CHANGE_SPECTRE_SHADOW_REALM_FORCE_ADD:0 "[umbra|E] и #TOOLTIP:GAME_TRAIT,spectre,[GetNullCharacter] #L Спектры#!#! #N приобретают #! $VALUE|0V$ очков военной мощи"
