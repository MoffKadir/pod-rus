 spell_of_life_stage4_hades_decision_confirm:0 "Наточите свои мечи!"
 spell_of_life_stage4_hades_decision_desc:0 "Последним шагом к созданию [Concept('POD_spell_of_life', 'Заклинание Жизни')|E] является привязка заклинания к пространству внутри [UmbraGlossaryLocalized('shadowlands','Загробный мир')], чтобы наши души могли обитать до тех пор, пока не возродятся заново. После ваших усилий по оказанию ему помощи, Кабирус согласился позволить вам использовать [UmbraGlossary('hades')] в качестве нашего [UmbraGlossary('shadow_realm')]. Это избавит от необходимости выделять собственное пространство для Заклинания Жизни. Однако [UmbraGlossary('hades')] не так стабилен, как египетский [UmbraGlossaryLocalized('dark_kingdom_of_sand','Аменти')], и вызывает серьезные проблемы при воскрешении после смерти. Такие проблемы будут только усугубляться увеличением количества жильцов, как только вы начнете его использовать. Если вы надеетесь использовать [UmbraGlossary('hades')], вам нужно будет улучшить этот мир. $spell_of_life_stage4_warning$"
 spell_of_life_stage4_hades_decision_pomegranate:0 "У вас должен быть [GetPODArtifactName('pomegranate_link')]"
 spell_of_life_stage4_hades_decision_tooltip:0 "Возможно, мы сможем найти дом в [UmbraGlossary('hades')]."
 spell_of_life_stage4_success_hunted_caveat:0 "Если вы добьетесь успеха, вы получите [GetModifier('hunted_down_eternity_modifier').GetNameWithTooltip]."
 spell_of_life_stage4_success_sol_caveat:0 "Если вы добьетесь успеха, вы получите полное Заклинание Жизни."
 spell_of_life_stage4_warning:0 "\n\n#warning Ваши шансы на успех в этом квесте абсурдно низки. Не пытайтесь сделать это, если вы заботитесь о благополучии своего персонажа.\nДаже сохранение и загрузка игры ради удачного исхода вас не спасут.\nВас предупредили.#!"
 spell_of_life_starter_decision:0 "Поиск [Concept('POD_spell_of_life', 'Заклинания Жизни')|E]"
 spell_of_life_starter_decision_confirm:0 "Приступим."
 spell_of_life_starter_decision_desc:0 "Многие искали способ вечного возрождения, чистую форму бессмертия, лишенную слабостей и проклятий, присущих другим вариантам. Один проверенный метод, Заклинание Жизни, используется #TOOLTIP:GAME_TRAIT,mummy,[GetNullCharacter] #L Мумиями#!#! Запада. Хотя это может занять всю жизнь, и вы должны быть готовы пожертвовать всем, поиск истинного бессмертия может оказаться стоящим. \n\n#R Ваши шансы на успех в этом поиске абсурдно низки. Не пытайтесь сделать это, если вы заботитесь о благополучии своего персонажа. \nДаже сохранение и перезагрузка игры на случай, если шансы не спасут вас позже. Вас предупредили.#!"
