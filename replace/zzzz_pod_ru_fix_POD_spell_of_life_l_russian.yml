 POD_can_select_custom_religion_tenet_tt:0 "[current_location.GetName] #bold не#! находится в регионе [homeland_region.GetName] #bold И#! [current_culture.GetName|U] [culture|E] #bold не#! имеет [heritage|E] из этого региона. Выполните хотя бы одно требование, чтобы выбрать [POD_homeland|E]."
 POD_mummy_spell_of_life.1.a:0 "У меня есть книги для торговли."
 POD_mummy_spell_of_life.1.b:0 "Я поддержу ваши военные усилия."
 POD_mummy_spell_of_life.1.c:0 "Я обеспечу топливо для ваших экспериментов."
 POD_mummy_spell_of_life.1.c.fuel_experiments:0 "Уровень [development|E] всех графств в [de_jure|E] [duchy|E] вашей столицы снизится на 5, и они получат модификатор [GetModifier('extinguish_life_modifier').GetNameWithTooltip] на 1 год."
 POD_mummy_spell_of_life.1.d:0 "Как член Внутреннего Совета, я требую доступа"
 POD_mummy_spell_of_life.1.desc:0 "Чтобы продолжить наши исследования способов вечного возрождения, нам понадобится доступ к Тайным письменам Кабира. Нынешний владелец, [writings_cabirus_owner.GetFirstName], любезно согласился дать нам аудиенцию. Однако [writings_cabirus_owner.GetSheHe] захочет что-то в обмен на предоставление нам доступа к артефакту."
 POD_mummy_spell_of_life.1.e:0 "Стоимость слишком высока"
 POD_mummy_spell_of_life.1.t:0 "Запрос доступа"
 POD_mummy_spell_of_life.10.a:0 "Я отправлюсь к его двору."
 POD_mummy_spell_of_life.10.b:0 "Если подумать..."
 POD_mummy_spell_of_life.10.desc:0 "$POD_debate_debate_strength_header$Только Гор владеет Заклинанием Жизни. Он очень давно не создавал новую Мумию с Заклинанием. Он определенно не поделится с вами Заклинанием в нынешнем положении дел. \n\nОднако вашей предыдущей услуги было достаточно, чтобы он дал вам аудиенцию. Если бы вы могли представить достаточно убедительные аргументы, вы могли бы получить его помощь в своих поисках, что существенно облегчило бы задачу.$POD_debate_debate_explanation_footer$"
 POD_mummy_spell_of_life.10.t:0 "Аудиенция у Гора"
 POD_mummy_spell_of_life.11.a:0 "Орудие хранителя действует по закону. Сделай меня таким орудием."
 POD_mummy_spell_of_life.11.b:0 "Если ты откажешь всем, Заклинанием завладеют лишь недостойные."
 POD_mummy_spell_of_life.11.c:0 "Цена — само Заклинание; большей цены быть не может."
 POD_mummy_spell_of_life.11.desc:0 "$POD_debate_debate_strength_header$\"Итак... вы молодой щенок, который стремится изучить Заклинание Жизни. Ваша служба заслужила вам аудиенцию, но не более того. \n\"Помните, я не простой торговец. Меня невозможно купить. Я не стану #italic просто#! продавать Заклинание Жизни. Я хранитель могущественных знаний. Отдать вам Заклинание Жизни — все равно, что вручить корону неиспытанному правителю. Некоторые дураки могут даже использовать его, пытаясь стать равными Осирису или Судьям Маат. Так много глупцов ищут божественности, силы, которая сделает их более великими. По правде говоря, Заклинание связывает вас с последствиями, которых вы не можете избежать, за вами будут наблюдать силы, от которых не скрыться, и судить вас за каждое восстановленное вами дыхание. \n\n\"Какой ответ вы предлагаете? \""
 POD_mummy_spell_of_life.11.t:0 "Аудиенция: хранитель или торговец?"
 POD_mummy_spell_of_life.12.a:0 "Я сражался с Сетитами, чтобы захватить Верхний Египет. Я их не боюсь."
 POD_mummy_spell_of_life.12.b:0 "Я не неонат. Я знаю, что делают годы."
 POD_mummy_spell_of_life.12.desc:0 "$POD_debate_debate_strength_header$\"На протяжении многих тысячелетий я вел одну войну — войну против хаоса и предателей. Те, кому даровано вечное возрождение благодаря Заклинанию Жизни моей матери, призваны помочь этой войне. И все же были предатели и трусы, которые отказались от нашего дела. Столетия возрождения сделали их апатичными и трусливыми. Некоторые покончили с собой, бросив нас. Другие заботились только о своем дальнейшем, кратковременном существовании и удовольствиях и поэтому ушли в пустыню, чтобы скитаться. \n\" Насколько больше эта ответственность лежит на том, кто владеет самим Заклинанием? Каким существом вы будете через столетие, пять, сто? Останетесь ли вы верны? Будете ли вы искать облегчения в истинной смерти? Будете ли вы бежать в страхе, когда впервые увидите Дитя Сета, будь то кровосос или бессмертный? \""
 POD_mummy_spell_of_life.12.t:0 "Аудиенция: А что насчет трусости?"
 POD_mummy_spell_of_life.13.a:0 "Я могу противостоять чему угодно, пыткам или удовольствиям."
 POD_mummy_spell_of_life.13.b:0 "Я осторожен и умею хранить секреты."
 POD_mummy_spell_of_life.13.c:0 "Возьми моё Истинное Имя как залог верности."
 POD_mummy_spell_of_life.13.c.prohibited_from_teaching:0 "Гор запрещает вам обучать других Заклинанию Жизни."
 POD_mummy_spell_of_life.13.desc:0 "$POD_debate_debate_strength_header$\"Возможно, вы предадите меня более откровенно, хм? Кеминтири когда-то служила среди последователей моей матери, но она была шпионкой Сета. Вы шпион? Когда она поделилась со мной своими истинными намерениями, я простил ее. Однако Сет схватил ее и пытал много-много лун. Хотя ей придется пострадать за многие другие свои преступления, я признаю, что она не отдала ему Заклинание. Можете ли вы сказать то же самое? А как насчет македонского шпиона, который внедрился в ряды жрецов моей матери в мое отсутствие? Ему почти удалось украсть Заклинание Жизни, чему помешало только его собственное высокомерие. Это создало мерзости, которые другие называют проклятыми мумиями. \n\n\" Попадетесь ли вы на такую ​​уловку? Проникнут ли шпионы в ряды ваших последователей, чтобы украсть Заклинание Жизни? Что, если Сет предложит вам миллион золотых монет или все удовольствия, которые может предложить этот мир? Он не лишен своей силы. Искушит ли вас такое предложение? Вы дадите ему Заклинание Жизни?\""
 POD_mummy_spell_of_life.13.t:0 "Аудиенция: А что насчет Предательства?"
 POD_mummy_spell_of_life.14.a:0 "Я бы никогда!"
 POD_mummy_spell_of_life.14.b:0 "Судьи распознают недостойных."
 POD_mummy_spell_of_life.14.c:0 "Ты будешь наставлять меня."
 POD_mummy_spell_of_life.14.desc:0 "$POD_debate_debate_strength_header$\"В мое отсутствие жрецы моей матери предлагали вечное возрождение многим недостойным. Вместо того, чтобы сохранять лучших и самых ярких, они позволили политике и деньгам определять их решения. Даже когда они выбирали тех, кто заслуживал этого в данный момент, они игнорировали долгосрочную устойчивость выбранных. Умы и храбрость многих таких избранных были подорваны тысячелетиями. \n\n\"Проявите ли вы такую ​​степень #italic мудрости #!? Возможно, в силу вашей молодости вам не хватает перспективы? Позволите ли вы личным чувствам и эмоциям влиять на вас? Пренебрежёте ли вы их пригодностью ради сохранения близких и дорогих вам людей?\""
 POD_mummy_spell_of_life.14.t:0 "Аудиенция: взгляд сквозь века?"
 POD_mummy_spell_of_life.15.a:0 "Обучение Заклинанию сдержит их число по сравнению с независимым открытием."
 POD_mummy_spell_of_life.15.b:0 "Если вы научите меня, вы будете контролировать то, что будет дальше."
 POD_mummy_spell_of_life.15.c:0 "Отвергать новых защитников — больший вред для Маат."
 POD_mummy_spell_of_life.15.desc:0 "$POD_debate_debate_strength_header$\"Заклинание Жизни — это гораздо больше, чем просто заклинание. Мумии существуют вне естественного порядка вещей. Неправильно снова и снова возвращаться в одно и то же тело. Мы причиняем меньше вреда, чем мертвецы, которые сохраняются за счет крови или жизни. Мы — защитники Маат, баланса, в [Glossary('вечной войне','podgloss.warofbalance')]. Мы выслеживаем и убиваем тех, кто пытается разрушить его и внести хаос. И все же, в силу самого своего существования, мы являемся препятствиями на пути его восстановления. В небольших количествах ущерб незначителен и во многом компенсируется нашей войной. У нас есть механизмы, позволяющие контролировать ущерб и осторожно высвобождать яд. Однако придет время, когда Маат потребует, чтобы мы убили себя и прекратили циклы перерождения. С каждой новой Мумией мы завязываем и скручиваем цикл смерти, насылая парадокс нашего существования на Подземный мир. Каждая новая Мумия все больше нарушает равновесие и истончает Завесу, отделяющую Подземный мир от земель живых. Каждая новая Мумия приближает день нашего конца, момент, когда ущерб, который мы наносим, ​​слишком велик и слишком необратим. \n\n\"Давая вам Заклинание Жизни, я гарантирую, что новые мумии будут созданы, потому что нет другой причины продолжать его. Почему я должен идти на такой риск и помогать вам? Компенсируете ли вы нанесенный ущерб?\""
 POD_mummy_spell_of_life.15.t:0 "Аудиенция: Сохранение Маат?"
 POD_mummy_spell_of_life.16.a:0 "Я благодарен за ваше наставничество."
 POD_mummy_spell_of_life.16.desc:0 "\"Хорошо... ваши аргументы убедительны. Если вы проявите себя и продемонстрируете свою приверженность войне, я помогу вам в поисках Заклинания Жизни. Я не дам вам Заклинание. Только приобретя его самостоятельно, вы сможете по-настоящему оценить и понять его. Тем не менее, я дам некоторые рекомендации, которые помогут вам собрать воедино осколки знаний, разбросанные во все стороны. \""
 POD_mummy_spell_of_life.16.t:0 "Аудиенция: Успех"
 POD_mummy_spell_of_life.17.a:0 "Очень хорошо, я вернусь позже."
 POD_mummy_spell_of_life.17.desc:0 "\"Дурак! Я охранял Маат более шести тысячелетий! Думаете, таких красивых слов будет достаточно, чтобы меня поколебать? Считаете ли вы меня политиком, который будет следовать за ветром перемен? Считаете ли вы меня торговцем, который изменит свое мнение в связи с золотом? \n\n\"Возможно, через несколько лет или десятилетий вы проявите большую мудрость. Тогда возвращайтесь!\""
 POD_mummy_spell_of_life.17.t:0 "Аудиенция: Провал"
 POD_mummy_spell_of_life.2.a:0 "Так много потеряно, так быстро."
 POD_mummy_spell_of_life.2.a.tt:0 "Изменились требования к решению \"$spell_of_life_stage1_cabirus_phase1_decision$\""
 POD_mummy_spell_of_life.2.desc:0 "Посредством жесткого контроля Гор надеялся сохранить тайны бессмертия, чтобы никто, недостойный этого дара, не получил его. Однако тайны имеют свойство становиться известными. Согласно легендам, молодая мумия по имени Кабир отправился в Грецию в шестом веке до нашей эры и продал книгу смертному волшебнику, который вернулся домой и медленно скопировал ее сам. Затем текст был передан нескольким другим смертным волшебникам, и было создано несколько мумий на основе версии великого обряда Осириса, сохранившейся в том, что стало #italic Тайными письменами Кабира#!. На протяжении веков Гор и его слуги выследили и сожгли почти каждую копию. Однако получить все копии им не удалось. Одна осталась в безопасности в великой горной крепости Цеорис, цитадели клана вампиров Тремере. Они потерпели неудачу... до сих пор. \n\nПока пожары инквизиции бушуют по всей Европе, неонаты, фуроры, Бруха и многие другие восстали против своих старейшин в ходе того, что сейчас называется Восстанием анархов. Среди хаоса Гор увидел возможность. Собрав свои войско из вампиров, фера и мумий, он проложил себе путь через залы Цеориса. Хотя они и не были проклятыми отродьями его дяди, их темная магия, жестокие эксперименты и безрассудная жажда знаний сделали их немногим более достойными Великого Обряда. Когда его магия принесла солнечный свет в затемненные залы, он двинулся вперед, не упиваясь им, как некоторые из его товарищей, а просто принимая необходимость. С каждым взмахом его клинок отделял их головы от отвратительных тел, и он приближался к их скрытому хранилищу. Их заклинания и ритуалы не могли причинить ему вреда, и даже защита хранилища не смогла его остановить. С щелчком хищное пламя вспыхнуло вокруг конкретной книги, последней копии текста, созданного дураком так давно. Когда страницы горели и скручивались сами собой, когда пепел падал на стол и дым наполнял его ноздри, когда огонь потрескивал и пламя распространялось, легкая улыбка ползла по его лицу."
 POD_mummy_spell_of_life.2.t:0 "Последняя копия уничтожена"
 POD_mummy_spell_of_life.20.a:0 "Соберите нашу семью."
 POD_mummy_spell_of_life.20.c:0 "Созвать последователей нашего пути."
 POD_mummy_spell_of_life.20.d:0 "Если подумать..."
 POD_mummy_spell_of_life.20.desc:0 "Поиски Заклинания Жизни — дело непростое и потребует от нас огромного внимания. Если бы вы могли заручиться поддержкой наших товарищей, у вас было бы больше времени и ресурсов, которые можно было бы посвятить своим усилиям. Даже обещания невмешательства было бы достаточно. \n\n Вопрос в том, кого вызывать. Вы можете пригласить только самых сильных, поэтому вы не можете выбирать, кого конкретно пригласить. Вместо этого вы должны подумать, кто с наибольшей вероятностью согласится на ваше предложение. Кто окажет наибольшую помощь?"
 POD_mummy_spell_of_life.20.t:0 "Совет: кого созвать?"
 POD_mummy_spell_of_life.21.a:0 "Все садитесь. Нам предстоит многое сделать."
 POD_mummy_spell_of_life.21.b:0 "Если подумать..."
 POD_mummy_spell_of_life.21.desc:0 "$POD_debate_debate_strength_header$Прошло некоторое время. Однако вы наконец-то созвали совет из 5 представителей. Продолжение исследования потребует много времени и ресурсов. Вам нужно убедить их присоединиться к вашим усилиям и посвятить свои ресурсы вашему делу. Такое обещание ускорит ваши усилия и поможет оградить вас от внешних сил. Даже обещание невмешательства могло бы снизить риск. В конце концов, вы же не хотите иметь дело с родственниками-идиотами, пытающимися украсть ваши исследования. $POD_debate_debate_explanation_footer$"
 POD_mummy_spell_of_life.21.t:0 "Совет: пора начинать"
 POD_mummy_spell_of_life.22.a:0 "С тех пор инструменты, знания и магия изменились."
 POD_mummy_spell_of_life.22.b:0 "Это заклинание со многими слоями и вариантами."
 POD_mummy_spell_of_life.22.c:0 "Они работали порознь. Поэтому я и созвал вас..."
 POD_mummy_spell_of_life.22.desc:0 "$POD_debate_debate_strength_header$\"Заклинание Жизни — это пустая трата времени, поиски еще более глупые, чем поиск Грааля. Очень, очень немногие когда-либо владели Заклинанием Жизни, и каждый из них получил его от другого. Исида, одна из величайших магов в истории, получила его в подарок от существа, которого она звала Тот. Гор, один из двоих, кто знает это в нынешнюю эпоху, научился этому от своей матери. Кабир, другой из двоих, практиковал неполную и ошибочную версию, модифицированную на основе копии, подаренной ему неизвестным ишмаэлитом. Несколько других подтвержденных обладателей пришли из Культа Исиды и прошли аналогичное обучение у других. Все остальное — всего лишь слухи. \nМногие, многие пытались получить его другими способами. Сет провел бесчисленные столетия в поисках Заклинания. Будь то проникновение в Культ Исиды, пытки держателя Заклинания Жизни или проведение экспериментов невероятного масштаба, он, [Glossary('каинит','game_concept_cainite_desc')] [Glossary('допотопный','game_concept_antediluvian_desc')], каждый раз терпел неудачу. Лучшее, что ему удалось, — это глубоко испорченные Проклятые мумии. Сами проклятые мумии провели столетия в одних и тех же бесплодных поисках. Несколько ишмаэлитов тоже пытались. Ближе всего они когда-либо подходили к заклинанию, создающему вампиров. \n\n\"Вы действительно верите, что можете создать Заклинание Жизни, не имея его в дар? Считаете ли вы себя таким особенным, таким непохожим, что добьетесь успеха там, где многие великие потерпели неудачу? \""
 POD_mummy_spell_of_life.22.t:0 "Совет: Там, где другие потерпели неудачу"
 POD_mummy_spell_of_life.23.a:0 "Это решение проблемы выживания, а не отвлечение от него."
 POD_mummy_spell_of_life.23.b:0 "Вы уже принимаете рискованные исследования, соответствующие вашим традициям."
 POD_mummy_spell_of_life.23.c:0 "Это требует меньше, чем вы думаете."
 POD_mummy_spell_of_life.23.desc:0 "$POD_debate_debate_strength_header$\"Вы хотите золота? Ресурсов? Рабочей силы? Доступ к нашим библиотекам? Самое ценное, даже для нас, время? Возможно, вы не заметили, но наш вид постоянно находится в состоянии войны, внутренней и внешней. Охотники становятся все более решительными, настойчивыми и многочисленными. Некоторые из самых старых среди нас исчезли, закончили свою жизнь или были выслежены. Наши соперники запускают все более сложные политические махинации. Наши собственные планы и исследования требуют все больших затрат. Вы не можете всерьез ожидать, что мы будем рисковать тем немногим, что у нас есть, ради какого-то эзотерического занятия, которое может принести только неудачу. Даже если мы признаем, что Заклинание Жизни теоретически возможно, альтернативные издержки неприемлемы. \""
 POD_mummy_spell_of_life.23.t:0 "Совет: Какова цена?"
 POD_mummy_spell_of_life.24.a:0 "У меня много золота."
 POD_mummy_spell_of_life.24.b:0 "Я буду в долгу перед вами."
 POD_mummy_spell_of_life.24.c:0 "Я одолжу вам свои силы."
 POD_mummy_spell_of_life.24.desc:0 "$POD_debate_debate_strength_header$\"У нас есть свои дела, свои собственные базы власти, владения, верные последователи. Нам придется пожертвовать некоторыми из наших ресурсов, чтобы помочь вам, ослабляя себя и создавая бреши. Если вы потерпите неудачу, мы потратим драгоценное время, деньги и усилия на глупую затею. Однако давайте оставим это в стороне и скажем, что мы принимаем ваши аргументы. Если вам это удастся... ну, это уже другая проблема. Мы ослабим себя, чтобы сделать вас сильнее. Теперь вы конкурент или меньше. После этого вы можете стать соперником, способным свергнуть нас. Для сравнения, мы бы ничего не получили. Почему бы нам не потребовать ресурсы? Почему бы нам не украсть у вас Заклинание? Проще говоря, какая нам от этого выгода? \""
 POD_mummy_spell_of_life.24.t:0 "Совет: Какова награда?"
 POD_mummy_spell_of_life.25.a:0 "Их давно нет. Нет причин их бояться."
 POD_mummy_spell_of_life.25.b:0 "Мои рыцари и я будем стоять твердо."
 POD_mummy_spell_of_life.25.c:0 "Мы все вместе должны противостоять им."
 POD_mummy_spell_of_life.25.desc:0 "$POD_debate_debate_strength_header$\"Многие другие искали Заклинание Жизни, очень многие другие. Такие существа живут долго, обладают мощными способностями и не откажутся от своих поисков. Если вам удастся добиться успеха там, где они потерпели неудачу, это может привлечь внимание могущественных существ. Их внимание приносит не что иное, как катастрофу для вас... и для нас, если мы должны вам помочь. Верите ли вы, что таким силам можно противостоять? Что вы сможете противостоять таким силам? Возможно, вы думаете, что они будут слишком напуганы, чтобы вмешиваться? \""
 POD_mummy_spell_of_life.25.t:0 "Совет: навстречу катастрофе?"
 POD_mummy_spell_of_life.26.a:0 "Я благодарю вас за вашу помощь."
 POD_mummy_spell_of_life.26.desc:0 "\"Хорошо... ваши аргументы убедительны. Мы предоставим вам некоторые ресурсы для продолжения ваших экспериментов, хотя мы не будем полностью посвящать себя начинанию, которое почти гарантированно провалится. Не тратьте их зря.\""
 POD_mummy_spell_of_life.26.t:0 "Совет: Успех"
 POD_mummy_spell_of_life.27.a:0 "Ладно, поговорим позже."
 POD_mummy_spell_of_life.27.desc:0 "\"Дурак! Вы просите слишком многого за слишком мало. Мы не будем поддерживать вашу глупость. \n\n\"Возможно, через несколько лет или десятилетий вы докажете, что способны представить убедительные аргументы. Тогда созовите нас!\""
 POD_mummy_spell_of_life.27.t:0 "Совет: Провал"
 POD_mummy_spell_of_life.3.a:0 "Мои поиски еще не окончены..."
 POD_mummy_spell_of_life.3.desc:0 "Теперь, когда вы достигли базового понимания Заклинания Жизни, ваш наставник больше не может ничему вас научить. Наставник говорит вам, что магией нужно овладевать самостоятельно, а не преподавать в классе. Возможно, дело лишь в нежелании раскрывать вам дальнейшие подробности, но результат тот же. Вам придется путешествовать по всему миру, чтобы собирать древние записи, учиться на ошибках других и учиться у тех, кто частично понимает Заклинание. В конце концов, услышать один и тот же урок из разных уст часто бывает полезно при попытке освоить тему. Кроме того, вам нужно будет тратить время на исследования, медленный перевод записей и проведение экспериментов. \n\n#help Чтобы достичь 90 [trait_level_track_xp|E] в Заклинании Жизни и прогрессировать дальше, вам нужно будет накапливать его пассивно и выполняя [journeys|E]. Чтобы узнать больше, см. $POD_story_spell_of_life_explanation$ [story_cycle|E] и описание черты Искатель Вечного Возрождения под вашим персонажем. #!"
 POD_mummy_spell_of_life.3.desc.b:0 "Теперь, когда вы достигли базового понимания Заклинания Жизни, одними экспериментами уже не продвинуться дальше. Магия – это то, что нужно осваивать на практике, а не преподавать в классе. Вам придется путешествовать по всему миру, чтобы собирать древние записи, учиться на ошибках других и учиться у тех, кто частично понимает Заклинание. В конце концов, услышать один и тот же урок из разных уст часто бывает полезно при попытке освоить тему. Кроме того, вам нужно будет тратить время на исследования, медленный перевод записей и проведение большего количества экспериментов. \n\n#help Чтобы достичь 90 [trait_level_track_xp|E] в Заклинании Жизни и прогрессировать дальше, вам нужно будет накапливать его пассивно и выполняя [journeys|E]. Чтобы узнать больше, см. $POD_story_spell_of_life_explanation$ [story_cycle|E] и описание черты Искатель Вечного Возрождения под вашим персонажем. #!"
 POD_mummy_spell_of_life.3.t:0 "Одно завершено, другое начато"
 POD_mummy_spell_of_life.30.a:0 "Держаться. Держаться! ДЕРЖАТЬСЯ!"
 POD_mummy_spell_of_life.30.b:0 "Пожалуйста! Дайте мне жить! Я прошу вас!"
 POD_mummy_spell_of_life.30.desc:0 "Гор всегда был хранителем Заклинания Жизни, единственным из ныне живущих, кто знает полное Заклинание. Он живет по своему кодексу Ват Хор и применяет его в мире. Принцип 6 запрещает создание мумий, что по сути ограничивает доступ к Заклинанию Жизни. Он охотится за Тайными письменами Кабира, в которых содержится лишь неполная информация о Заклинании Жизни. Вы подошли очень близко к созданию полного Заклинания Жизни, привлекая на себя ярость Гора в размерах, далеко превосходящих все, что когда-либо вызывали письмена Кабира. \n\nТеперь Гор и его последователи-мумии прибыли к вашему пристанищу, планируя атаковать днём, когда они будут наиболее сильны под золотым светом Ра. Они формируют ряды, готовясь сокрушить вашу оборону. Их мечи блестят в полуденном солнце, жаждущие пролить вашу кровь. Их магия собирается вокруг них, искажая местность, как жаркий туман над факелом или каменной крышей летом. По неслышимому сигналу они атакуют. У вас нет другого выбора, кроме как противостоять их нападению."
 POD_mummy_spell_of_life.30.kemintiri_begging:0 "Поддержка Кеминтири говорит о вашей надежности"
 POD_mummy_spell_of_life.30.kemintiri_fight:0 "Поддержка Кеминтири уменьшила силы, выставленные против вас."
 POD_mummy_spell_of_life.30.stage3.failure:0 "Вы падаете, как пшеница перед косой"
 POD_mummy_spell_of_life.30.stage3.success:0 "Каким-то образом, несмотря на все это, вы торжествуете"
 POD_mummy_spell_of_life.30.stage3.successful_groveling:0 "Гор принимает ваши жалкие просьбы"
 POD_mummy_spell_of_life.30.stage3.successful_groveling.tt:0 "Ваш прогресс в квесте «Заклинание Жизни» будет сброшен. Хотя вы сохраните заработанную ранее поддержку, вам придется снова выбрать новый путь принятия решений, чтобы прогрессировать."
 POD_mummy_spell_of_life.30.stage3.successful_sale:0 "Вы передаете им свои исследования в обмен на то, что вас оставят в покое."
 POD_mummy_spell_of_life.30.t:0 "Нападение Гора"
 POD_mummy_spell_of_life.300.a:0 "Хм, интересная мысль..."
 POD_mummy_spell_of_life.300.desc:0 "Вы получаете письмо от Гора. В этом нет ничего необычного или удивительного, поскольку именно так вы общались, работая над углублением своего точного понимания Заклинания Жизни. Однако на этот раз письмо не содержит ни намека, ни сбивающего с толку, но, в конечном итоге, содержательного документа, который предшествует большинству известных вам цивилизаций. \n\n\"Судя по вашим успехам, вы должны приближаться к моменту, когда вы привязываете свое Заклинание к определенному теневому миру. Хотя поначалу я не решался терпеть или поддерживать ваши поиски, когда придет время, я рекомендую вам посетить Аменти. Я считаю, что вы заслужили право представить свое дело Судьям Маат.\""
 POD_mummy_spell_of_life.300.t:0 "Письмо Гора"
 POD_mummy_spell_of_life.31.a:0 "Держаться. Держаться! ДЕРЖАТЬСЯ!"
 POD_mummy_spell_of_life.31.b:0 "Пожалуйста! Дайте мне жить! Я прошу вас!"
 POD_mummy_spell_of_life.31.desc:0 "Гор всегда был хранителем Заклинания Жизни, единственным из ныне живущих, кто знает полное Заклинание. Он живет по своему кодексу Ват Хор и применяет его в мире. Принцип 6 запрещает создание мумий, что по сути ограничивает доступ к Заклинанию Жизни. Он охотится за Тайными письменами Кабира, в которых содержится лишь неполная информация о Заклинании Жизни. Хотя Гор может отсутствовать, вы очень близко подошли к созданию полного Заклинания Жизни, которое привлекло к вам ярость последователей Гора в масштабах, далеко превосходящих все, что когда-либо вызывали письмена Кабира. \n\nТеперь Шемсу-Геру прибыли к вашему пристанищу, планируя атаковать днём, когда они будут наиболее сильны под золотым светом Ра. Они формируют ряды, готовясь сокрушить вашу оборону. Их мечи блестят в полуденном солнце, жаждущие пролить вашу кровь. Их магия собирается вокруг них, искажая местность, как жаркий туман над факелом или каменной крышей летом. По неслышимому сигналу они атакуют. У вас нет другого выбора, кроме как противостоять их нападению."
 POD_mummy_spell_of_life.31.stage3.successful_groveling:0 "Ваши жалкие просьбы приняты"
 POD_mummy_spell_of_life.31.t:0 "Нападение Шемсу-Геру"
 POD_mummy_spell_of_life.32.a:0 "Ты думаешь украсть мою работу?!"
 POD_mummy_spell_of_life.32.b:0 "Вот! Забирай и оставь меня в покое!"
 POD_mummy_spell_of_life.32.desc:0 "Некогда маги дома Тремер, входившего в Орден Гермеса, искали разные способы обрести бессмертие. Первые исследования привели их к вампиризму, однако некоторые так и не отказались от дальнейших поисков. Селестин, главный библиотекарь и исследователь, не чуждый полевой работе, особенно заинтересовался мумиями. Ему даже удалось раздобыть один из последних — если не последний — экземпляров Тайных писаний Кабира. Вы почти восстановили Заклинание Жизни и тем самым привлекли его пристальное внимание. В надежде обрести бессмертие без вампирских проклятий сюда прибыли многочисленные «полевые исследователи» Тремер и их слуги-горгульи. Селестин выступает вперёд:\n\n«Мы с вами коллеги. Чтобы зайти так далеко в изучении Заклинания Жизни, нужно обладать выдающимся умом. Вы наверняка понимаете, что мы гораздо сильнее вас и способны разнести ваше убежище своими дисциплинами. Но кровопролитие ни к чему. Отдайте нам свои исследования, и мы оставим вас в покое, позволив продолжить работу»."
 POD_mummy_spell_of_life.32.t:0 "Предложение Селестина"
 POD_mummy_spell_of_life.320.a:0 "Интересное предложение..."
 POD_mummy_spell_of_life.320.desc:0 "На протяжении тысячелетий Кабир подвергался давлению со всех сторон со стороны тех, кто искал его знаний, или тех, кто хотел убить его за то, что он обладал ими. Совсем недавно это был клан вампиров Тремер. Учитывая ваше постоянно улучшающееся понимание Заклинания Жизни, они, скорее всего, обратили бы на вас свое внимание. К счастью, вы разрушили их базу власти и предотвратили любые сосредоточенные усилия по приобретению знаний Кабира или ваших исследований. Хотя Кабир всегда неохотно использовал свои способности, опасаясь привлечь внимание, ослабление Тремер позволило ему действовать более свободно. С разрозненными отрядами легко справится обладатель такой силы, как он. Кроме того, Кабир предложил вам возможность связать ваше Заклинание Жизни с Аидом, используя его в качестве теневого царства. Хотя ему потребуется стабилизация и расширение, такие усилия будут проще, чем создание собственного королевства."
 POD_mummy_spell_of_life.320.t:0 "Помощь Кабира"
 POD_mummy_spell_of_life.33.a:0 "Ты думаешь украсть мою работу?!"
 POD_mummy_spell_of_life.33.b:0 "Вот! Забирай и оставь меня в покое!"
 POD_mummy_spell_of_life.33.desc:0 "Некогда маги дома Тремер, входившего в Орден Гермеса, искали разные способы обрести бессмертие. Первые исследования привели их к вампиризму, однако некоторые так и не отказались от дальнейших поисков. Главный библиотекарь Тремер особенно заинтересовался мумиями и даже раздобыл один из последних — если не последний — экземпляров Тайных писаний Кабира. Сам он здесь не присутствует, но вы почти восстановили Заклинание Жизни и тем самым привлекли пристальное внимание всего клана. В надежде обрести бессмертие без вампирских проклятий сюда прибыли многочисленные «полевые исследователи» Тремер и их слуги-горгульи. Один из них выступает вперёд:\n\n«Мы с вами коллеги. Чтобы зайти так далеко в изучении Заклинания Жизни, нужно обладать выдающимся умом. Вы наверняка понимаете, что мы гораздо сильнее вас и способны разнести ваше убежище своими дисциплинами. Но кровопролитие ни к чему. Отдайте нам свои исследования, и мы оставим вас в покое, позволив продолжить работу»."
 POD_mummy_spell_of_life.33.t:0 "Предложение клана Тремер"
 POD_mummy_spell_of_life.34.a:0 "Найдите её! Обыщите всё до последнего уголка..."
 POD_mummy_spell_of_life.34.b:0 "Сожгите исследование и молитесь, чтобы она оставила нас в покое!"
 POD_mummy_spell_of_life.34.desc:0 "Хотя им не хватает подавляющего фанатизма Гора и Шемсу-Геру, Дети Осириса и Культ Исиды, тем не менее, преданы защите тайны Заклинания Жизни. Несмотря на то, что Сет неоднократно внедрял в их ряды шпионов и едва не отнял у них Заклинание Жизни, они остаются верными миссии по предотвращению злоупотреблений им. Сама Кеминтири сильно пострадала от рук Сета, отказываясь предоставить ему какую-либо информацию об этом. \n\nТеперь они обнаружили ваши исследования и выступают против вас. Там, где другие могут напасть на ваше убежище с армией, они послали убийц и саму Кеминтири, чтобы остановить ваши исследования. К несчастью для вас, это означает уничтожение и вас."
 POD_mummy_spell_of_life.34.horus_begging:0 "Поддержка Гора говорит о вашей надежности."
 POD_mummy_spell_of_life.34.horus_fight:0 "Поддержка Гора уменьшила количество убийц, посланных против вас."
 POD_mummy_spell_of_life.34.stage3.successful_groveling:0 "Вы просыпаетесь живыми: видимо, вам даровали пощаду"
 POD_mummy_spell_of_life.34.t:0 "Удар Кеминтири"
 POD_mummy_spell_of_life.340.a:0 "Спасибо за вашу поддержку"
 POD_mummy_spell_of_life.340.desc:0 "Когда вы выходите из тронного зала, по спине внезапно пробегает покалывание, а тени в коридоре начинают двигаться. Они текут внутрь, отходя от боков и покрывая пол. Они начинают сливаться в лужу, а затем поднимаются вверх, принимая гуманоидную форму. Сначала это выглядит как манекен с грубыми чертами, затем статуя с более точными разрезами, а затем, наконец, превращается в плоть кого-то, кого вы узнаете: Кеминтири. \n\n\"Я благодарю вас за то, что помогли мне восстановить мою память. Чтобы отплатить за услугу, знайте, что я говорила от вашего имени среди последователей Осириса и Исиды. Они не помешают вашим поискам Заклинания Жизни. Кроме того, вы получите возможность поговорить с Судьями Маат и сделать Аменти своим домом.\""
 POD_mummy_spell_of_life.340.t:0 "Поддержка Кеминтири"
 POD_mummy_spell_of_life.35.a:0 "Найдите их! Обыщите всё до последнего уголка..."
 POD_mummy_spell_of_life.35.b:0 "Сожгите исследование и молитесь, чтобы нас оставили в покое!"
 POD_mummy_spell_of_life.35.desc:0 "Хотя им не хватает подавляющего фанатизма Гора и Шемсу-Геру, Дети Осириса и Культ Исиды, тем не менее, преданы защите тайны Заклинания Жизни. Хотя Сет неоднократно внедрял в их ряды шпионов и едва не отнял у них Заклинание Жизни, они остаются верными миссии по предотвращению злоупотреблений им. \n\nТеперь они обнаружили ваши исследования и выступают против вас. В то время как другие могут атаковать ваше убежище с армией, они послали убийц, чтобы остановить ваши исследования. К несчастью для вас, это означает уничтожение и вас."
 POD_mummy_spell_of_life.35.t:0 "Удар Детей Осириса"
 POD_mummy_spell_of_life.36.a:0 "Готовьте оборону..."
 POD_mummy_spell_of_life.36.b:0 "Просто возьми это..."
 POD_mummy_spell_of_life.36.desc:0 "Сет, древний допотопный, провел многие тысячелетия в поисках Заклинания Жизни, которое наделило его племянника силой. Произошли неописуемые ужасы. В его экспериментах погибло бесчисленное количество людей. Чтобы украсть его, были разработаны бесчисленные интриги. Ближе всего он подошел к этому, обманом заставив Никлоса, верховного жреца культа Исиды, принять одного из слуг Сета в качестве своего протеже. Тем не менее, даже это представляло собой лишь частичную версию Заклинания Жизни, ведущую к чудовищам, известным как проклятые мумии. Хотя Сет, возможно, и отступил, его потомки не отказались от его поисков. Теперь Куфур ам-Херу, Чемпион Сета, стоит перед вашим убежищем с великим войском. \n\n\"Отдайте нам Заклинание Жизни, и мы, возможно, позволим вам продолжить ваши исследования. Сопротивляйтесь, и мы извлечем нужные нам знания из разбитых фрагментов вашего разума. Мы получим то, что хотим; все, что меняется, это то, сколько времени это займет.\"\n\n#clickable Сила вашего [coterie|E] – [GetPlayer.MakeScope.GetVariable('total_character_coterie_stewardship').GetValue|V0].\nСила вражеской [coterie|E] – [GetPlayer.MakeScope.GetVariable('total_opponent_coterie_stewardship').GetValue|V0].#!"
 POD_mummy_spell_of_life.36.t:0 "Осада Куфура-ам-Херу"
 POD_mummy_spell_of_life.360.a:0 "Хорошо. Эти воры не выиграют от моей работы!"
 POD_mummy_spell_of_life.360.desc:0 "Ваш канцлер и начальник шпионской сети сообщают о том, что Сетиты и проклятые мумии мобилизуются против вас. Поскольку вы ближе всего к получению Заклинания Жизни со времен самого Сета, они видят потенциал для завершения его поисков. Однако вы обращаетесь к своим союзникам и сторонникам. Используя свои предыдущие соглашения, вы можете прямо или косвенно оказывать на Сетитов как дипломатическое, так и военное давление. Даже странники, у которых нет территории, которую можно было бы защитить, не имеют возможности нанести вам удар."
 POD_mummy_spell_of_life.360.t:0 "Поддержка союзников"
 POD_mummy_spell_of_life.37.a:0 "Готовьте оборону..."
 POD_mummy_spell_of_life.37.b:0 "Просто возьми это..."
 POD_mummy_spell_of_life.37.desc:0 "Сет, древний допотопный, провел многие тысячелетия в поисках Заклинания Жизни, которое наделило его племянника силой. Произошли неописуемые ужасы. В его экспериментах погибло бесчисленное количество людей. Чтобы украсть его, были разработаны бесчисленные интриги. Ближе всего он подошел к этому, обманом заставив Никлоса, верховного жреца культа Исиды, принять одного из слуг Сета в качестве своего протеже. Тем не менее, даже это представляло собой лишь частичную версию Заклинания Жизни, ведущую к чудовищам, известным как проклятые мумии. Хотя Сет, возможно, и отступил, его потомки не отказались от его поисков. Теперь Сетиты стоят перед вашим убежищем, собравшись как великое войско. \n\n\"Отдайте нам Заклинание Жизни, и мы, возможно, позволим вам продолжить ваши исследования. Сопротивляйтесь, и мы извлечем нужные нам знания из разбитых фрагментов вашего разума. Мы получим то, что хотим; все, что меняется, это то, сколько времени это займет.\"\n\n#clickable Сила вашего [coterie|E] – [GetPlayer.MakeScope.GetVariable('total_character_coterie_stewardship').GetValue|V0].\nСила вражеской [coterie|E] – [GetPlayer.MakeScope.GetVariable('total_opponent_coterie_stewardship').GetValue|V0].#!"
 POD_mummy_spell_of_life.37.t:0 "Осада Сетитов"
 POD_mummy_spell_of_life.4.a:0 "Действительно, странная новость..."
 POD_mummy_spell_of_life.4.desc:0 "Что-то происходит... меняется... рвется. В Завесе, который висит между материальными и теневыми землями, появляются разрывы. Штормы проносятся по землям мертвых, их недостаточно, чтобы ознаменовать новую эпоху, но они все еще уносят множество духов в темные места. Звери поднимаются, монстры распространяются, а духи собираются. \n\nЗатмение скрывает лик Солнца, отбрасывая тени, несущие смысл. Мужчины и женщины, дети и старики, смертные всех мастей, встречая вас, произносят странные вещи, их глаза сверкают золотом, а в их голосах слышится бремя веков, немыслимое для таких, как они. Куда бы вы ни посмотрели, появляются загадочные сообщения, выжженные на стенах и говорящие о беспокойных мертвецах. То, что вы можете извлечь, указывает на то, что создание вами мумий и использование магии вечного возрождения наносит ущерб... #bold ЕЙ#!."
 POD_mummy_spell_of_life.4.t:0 "Предупреждение о необходимости остановиться"
 POD_mummy_spell_of_life.40.a:0 "Мы ждем Анубиса."
 POD_mummy_spell_of_life.40.b:0 "Давайте вернемся, прежде чем дверь закроется."
 POD_mummy_spell_of_life.40.critical.failure.effect.desc:0 "Спектры подавляют вас, заставляя отступить."
 POD_mummy_spell_of_life.40.desc:0 "$POD_debate_debate_strength_header$С помощью двух ваших друзей-призраков вы открыли дверь в [UmbraGlossaryLocalized('dark_kingdom_of_sand','Аменти')]. К сожалению, постоянно меняющееся, непостижимое море песка и воды окружает вас со всех сторон, и кажется, что вода меняется с песком местами, когда вы фокусируете на ней свое внимание. Тени скрывают большую часть его во тьме, скрывая от вашего взгляда неизвестные опасности и сокровища. Что-то, что вы можете воспринимать только как ураган воспоминаний и чистой энергии, кружится вокруг вас, сотрясая вас. Плазма и безымянные материалы обрушиваются на вашу голову. Ваши шаги не продвигаются вперед, поскольку дюны движутся вместе с вами, океан отступает и наступает, ветры борются с вами и странные звери нападают на вас. Впереди вас ждет только один ясный путь — река, которую вы считаете [UmbraGlossary('river_of_death')]. Вы не сможете продолжить без помощи Анубиса. Пока он не прибудет, чтобы исследовать ваш необычный вход, вы должны отбиваться от любых монстров, которые могут таиться среди песчаных морей.$POD_debate_debate_explanation_footer$"
 POD_mummy_spell_of_life.40.effect.success.desc:0 "Вы держите оборону до его прибытия"
 POD_mummy_spell_of_life.40.t:0 "Аудиенция у Судей Маат"
 POD_mummy_spell_of_life.41.a:0 "Я не связан договорами с Хароном."
 POD_mummy_spell_of_life.41.b:0 "Взвесьте мое сердце и примите решение."
 POD_mummy_spell_of_life.41.c:0 "Я хочу защитить Нетер-Хертет. Пусть судьи сочтут меня недостойным."
 POD_mummy_spell_of_life.41.desc:0 "$POD_debate_debate_strength_header$Через часы?... дни?... над [UmbraGlossary('river_of_death')] появляются огромные ворота из темного, стеклянного камня. Когда вы протягиваете руку, чтобы коснуться ручки, странное существо поднимается из зыбучих песков слева от вас. Даже больше, чем у большинства #TOOLTIP:GAME_TRAIT,wraith,[GetNullCharacter] #L Призраков#!#!, его тело кажется жидким и твердым, текучим, но сохраняющим форму. Эта форма представляет собой частично трансформированный $POD_splat_garou$ с головой шакала. Цвет его кожи — цвет смолы, темный, как сама смерть. Он несет светящийся фонарь, подвешенный на длинном шесте. Голосом, похожим на оползень в полом колодце, он говорит: \n\n\"Почему бы мне не казнить вас немедленно за то, что вы осмелились вторгнуться в пределы [UmbraGlossary('neter_khertet')], куда не осмеливаются ступать даже призраки [UmbraGlossary('dark_kingdom_of_iron')]? Почему я вообще должен рассматривать возможность сопроводить вас к Судьям Маат?\""
 POD_mummy_spell_of_life.41.t:0 "Аудиенция: Прибытие Анубиса"
 POD_mummy_spell_of_life.42.a:0 "Я не неонат. Мне по силам сопротивляться порче веков."
 POD_mummy_spell_of_life.42.b:0 "Мне не устоять против вашего приговора."
 POD_mummy_spell_of_life.42.c:0 "Я останусь верным, как это делали другие до меня."
 POD_mummy_spell_of_life.42.desc:0 "$POD_debate_debate_strength_header$Ворота распахиваются, и Анубис проводит вас. Идя по земле, вы оглядываетесь вокруг. [UmbraGlossaryLocalized('dark_kingdom_of_sand','Аменти')] несет в себе отголоски живых земель, созданных страстями и желаниями, возложенными на великие города, гробницы и храмы Королевства. Однако это гораздо больше, чем просто руины или отголоски. Субстанция Королевства легко обрабатывается его жителями. Тысячелетия времени дали Судьям Маат и Шемсу-Геру, которые вернулись более чем достаточно времени, чтобы создать ошеломляющую демонстрацию величия. Вдали возвышаются невероятные вершины из золота и белого известняка, простирающиеся над окружающими вас дюнами. Без каких-либо заметных изменений, 42 человека теперь окружают вас и Анубиса, одетые в богато украшенные шендыты и держащие в руках фараонские посохи. Они говорят по очереди, каждый произносит следующее предложение. \n\n\"Заклинание Жизни не просто воскрешает. Оно удерживает душу в бесчисленных циклах. Вас не выковали, не обучили и не превратили в сосуд, способный поддерживать эту архитектуру. Даровать вам возрождение означало бы вызвать ваше собственное разложение. Если не завтра, то через сто, тысячу, десять тысяч лет. Хотя мы могли бы бросить вас в Амемайт, зачем нам идти на такой риск? До этого момента вы можете причинить много вреда. Хуже того, вы ищете перерождения не только для баланса, но и для продолжения себя, воли, идентичности. Аменти – это инструменты Маат, а не выжившие. Ваше желание жить делает вас уязвимыми для нашептываний наших врагов. Одна жизнь — даже праведная — не перевесит долгую память на весах и не докажет вашу способность сохранять стойкость.\""
 POD_mummy_spell_of_life.42.t:0 "Аудиенция: сохраните ли вы верность?"
 POD_mummy_spell_of_life.43.a:0 "Я обнаружил большую часть Заклинания Жизни."
 POD_mummy_spell_of_life.43.b:0 "Я тоже тактик с хорошей репутацией."
 POD_mummy_spell_of_life.43.c:0 "Мало кто из мастеров может сравниться с моей работой."
 POD_mummy_spell_of_life.43.desc:0 "$POD_debate_debate_strength_header$\"Когда процесс правильно управлялся и контролировался, Шемсу-Геру были выбраны, потому что они доказали свою ценность. Их навыки заслуживали сохранения. Их служение Маат было истинным и охватило многие воплощения. Амен Хал, Хетч-Абеху и Нейт были опытными солдатами и тактиками, проявившими себя на поле боя. Саху-Ра был несравненным писцом и мастером. Тьехену показал себя магом с огромным потенциалом. Мерит-неферу была необычайно искусной и верной торговкой. Хотя она была царицей, имеющей политическое значение, Неферухаит была выбрана за ее ученость, эрудицию и жажду знаний. \n\nЧто в вас заслуживает сохранения? Что вы сделали, чтобы заслужить место среди Шемсу-Геру?\""
 POD_mummy_spell_of_life.43.t:0 "Аудиенция: Вы достойны?"
 POD_mummy_spell_of_life.44.a:0 "Я разрешаю конфликты, а не вызываю их."
 POD_mummy_spell_of_life.44.b:0 "Моя лояльность еще больше стабилизирует этот баланс."
 POD_mummy_spell_of_life.44.desc:0 "$POD_debate_debate_strength_header$\"Ваши убеждения и воспоминания не связаны с крестовым походом. Помимо Бессмертных, вы храните верность неизвестным нам силам. Вы можете вовлечь их в свои планы. Вы можете вовлечь нас во внешние конфликты, отвлекая от критического крестового похода против потомков Сета. \n\nНе менее важно и то, что баланс между Аменти тщательно поддерживается. Некоторые, так называемые ишмаэлиты, сошли с правильного пути. Однако они еще многие столетия были верны войне, прежде чем стали предателями. Ваше присутствие в этом месте восстановления разрушило бы наше тщательно сохраняемое единство целей. Среди Бессмертных возродятся древние распри и расколы, усугубленные вашей внешней лояльностью. Они перенаправят свои клинки от глоток Сетитов к глоткам друг друга. Подобная фракционность и отвлечение внимания означают катастрофу.\""
 POD_mummy_spell_of_life.44.t:0 "Аудиенция: не отвлечёте ли вы нас?"
 POD_mummy_spell_of_life.45.a:0 "Я умею определять достойных."
 POD_mummy_spell_of_life.45.b:0 "Я могу защитить Заклинание. Что еще имеет значение?"
 POD_mummy_spell_of_life.45.desc:0 "$POD_debate_debate_strength_header$\"Допустим, мы принимаем ваши аргументы и разрешаем вам использовать эту сферу. Затем вы привяжете свое Заклинание Жизни к [UmbraGlossaryLocalized('dark_kingdom_of_sand','Аменти')]. Однако такое действие позволит любому, на кого вы направите свое Заклинание Жизни, войти в наше царство в непомерном количестве, количестве, которое нарушит баланс. Вы бы всегда отбирали в наши ряды только достойных? Искатели, просители, интриганы – все обратятся к вам. Неисчислимое количество амбициозных людей будет охотиться за вами. Вы бы исполнили их все желания, будь то бессмертие или само Заклинание? Проявите ли вы должную проницательность при выборе тех, кому будет даровано вечное возрождение? Останетесь ли вы стойким защитником секрета заклинания или его украдут, если вы доверитесь тому, кто этого не заслуживает? Каждый новый Бессмертный разрушает Маат и должен работать над его восстановлением. Разрушите ли вы Маат, предложив вечное возрождение слишком многим?\""
 POD_mummy_spell_of_life.45.t:0 "Аудиенция: просители и интриганы"
 POD_mummy_spell_of_life.46.a:0 "Спасибо, буду использовать с умом."
 POD_mummy_spell_of_life.46.desc:0 "Судьи поворачиваются друг к другу и, кажется, спорят между собой. Несмотря на то, что они не уходят и вы можете видеть, как шевелятся их губы, вы не можете их услышать или определить, что они говорят, по движениям их губ. В какой-то момент к их разговору присоединяется Анубис. Кажется, что земля почти трясется, хотя его слова тоже неясны. В конце концов они поворачиваются к вам. \n\n\"Очень хорошо. Мы предоставим вам разрешение использовать [UmbraGlossaryLocalized('dark_kingdom_of_sand','Аменти')] для регенерации до тех пор, пока вы не будете готовы снова обитать в своем теле. Анубис предоставит вам информацию, необходимую для изменения вашего Заклинания Жизни по мере необходимости.\""
 POD_mummy_spell_of_life.46.t:0 "Аудиенция: Успех"
 POD_mummy_spell_of_life.47.a:0 "Хорошо, я принимаю ваш приговор."
 POD_mummy_spell_of_life.47.b:0 "Вы, дряхлые дураки, вспомните этот день, когда я свергну ваши троны."
 POD_mummy_spell_of_life.47.desc:0 "Судьи поворачиваются друг к другу и, кажется, спорят между собой. Несмотря на то, что они не уходят и вы можете видеть, как шевелятся их губы, вы не можете их услышать или определить, что они говорят, по движениям их губ. В какой-то момент к их разговору присоединяется Анубис. Кажется, что земля почти трясется, хотя его слова тоже неясны. В конце концов они поворачиваются к вам. \n\n\"Мы рассмотрели ваши слова и обнаружили, что им недостает мудрости. Если мы позволим вам восстановиться в [UmbraGlossaryLocalized('dark_kingdom_of_sand','Аменти')], это обеспечит в конечном итоге нашу гибель и гибель самой Маат. В качестве любезности мы позволим вам уйти с миром, в сопровождении Анубиса. Однако, если вы вернетесь, Анубис позаботится о том, чтобы вы больше не перебивали нас своими бесполезными словами. \"\n Хищная улыбка расползается по шакалообразной морде Анубиса, обнажая его острые зубы."
 POD_mummy_spell_of_life.47.t:0 "Аудиенция: Провал"
 POD_mummy_spell_of_life.5.a:0 "На этом все и заканчивается..."
 POD_mummy_spell_of_life.5.a.tt:0 "Мир подходит к концу, поскольку [umbra|E] продолжает сливаться с Землями Плоти. #X Игра окончена, мир, который вы знали, заканчивается.#!"
 POD_mummy_spell_of_life.5.desc:0 "Возможно, это следствие несдержанности, того, что некоторые вещи не спрятаны. Возможно, это была ваша цель с самого начала, когда вы искали магию вечного возрождения. В конце концов, это не имеет значения. Так мало что уже имеет значение.\n\nСуществует много историй о конце времени и много названий для него. Некоторые видели поток крови, очищающий мир. Другие предсказывали появление аватара абсолютного зла. Мало кто был прав в том, что это закончится разрывом завесы между мирами.\n\nТо, что когда-то было разрывами, теперь превратилось в огромные дыры, от которых от Завесы остались лишь клочья занавеси. Разломы в бесконечной пропасти источают тошнотворный зеленый туман, пожирающий землю. Бродят кошмары, обретшие форму всех наших страхов, страхов, обретших новую жизнь в эти мрачные дни. Живые тени, остатки тех, кто сдался внутренней тьме, бродят по затянутым туманом долинам и окутанным туманом лесам. Формы, разум, тело и дух которых одержимы ужасами, недоступными пониманию смертных, бродят по землям, соблазняя и искушая. Невиданный ранее шторм поглощает земли мёртвых, бросая их в пасть, не знающую насыщения. От таких ветров треснули даже печати на самой Бездне. Ярость ветров распространяется даже на материальный мир, поглощая солнечный свет и позволяя свободно передвигаться тем, кто боится его лучей. Те, чьи тела давно превратились в прах, бродят по землям в поисках тел, которые можно украсть, чтобы стать неживыми бессмертными, пирующими кровью и дыханием. Воды становятся красными от крови, когда источники бездны открываются. Саранча с золотыми коронами, лицами людей, зубами львов и хвостами скорпионов опустошает земли, распространяясь такими огромными стаями, что одних их крыльев достаточно, чтобы оглушить мертвых.\n\nСреди ужасов смертные слышат голоса в своей голове и видят сообщения на стенах, наделяя их силой совершать подвиги, которые даже бессмертные с трудом смогут повторить. Первой среди их целей являются Бессмертные, те, кто возрождается вечно и чье создание привело к этому. С каждым ударом они стремятся залатать разрывы. Продолжают распространяться слухи о двух странных светящихся крылатых существах, которые помогают этим охотникам и пытаются вновь отделить мёртвых от живых. Только время покажет, принесут ли их усилия плоды, но это уже история для другого дня..."
 POD_mummy_spell_of_life.5.t:0 "Путешествие долгого дня в ночь"
 POD_mummy_spell_of_life.50.a:0 "Пришло время начать."
 POD_mummy_spell_of_life.50.b:0 "Это слишком рискованно."
 POD_mummy_spell_of_life.50.desc:0 "Когда [GetScriptedCharacterByHistoryID('792600').GetFirstName] впервые создал свою версию Заклинания Жизни, он столкнулся с проблемой невозможности войти в [UmbraGlossaryLocalized('dark_kingdom_of_sand','Аменти')], древнеегипетское царство мертвых, где мумии находят время, чтобы восстановить себя между каждой смертью. Таким образом, он получил очень небольшую часть [UmbraGlossary('shadowlands')], которую он назвал \"Аид\" как свой собственный [UmbraGlossary('shadow_realm')], и каким-то образом сумел убедить Харона, владыку [UmbraGlossaryLocalized('shadowlands','Загробного мира')], принять этот анклав. Некоторые легенды приписывают этот успех их общему микенскому происхождению, а в одном тексте говорится, что Кабир имеет связь с перевозчиками, многие из которых тоже являются микенцами. Независимо от правды, [UmbraGlossary('hades')] по-прежнему является жалкой копией [UmbraGlossaryLocalized('dark_kingdom_of_sand','Аменти')] и едва ли способен помочь мумиям достичь истинного бессмертия. \n\nЕсли мы тоже хотим использовать [UmbraGlossary('hades')], нам нужно будет расширить его территорию и стабилизировать ее. Учитывая трудности, с которыми столкнулся [GetScriptedCharacterByHistoryID('792600').GetFirstName], это будет непростая задача. Нужно будет удовлетворить требования правителей [UmbraGlossaryLocalized('shadowlands','Загробного мира')], чтобы они не действовали против нас. #TOOLTIP:GAME_TRAIT,spectre,[GetNullCharacter] #L Спектры#!#! придется отодвинуть назад. Новому царству потребуются защитники. Так много дел нужно сделать... \n\n #R В этой битве используется показатель «Военная сила». Начальное значение определяется доблестью вашей, ваших воителей и вашей [coterie|E]. Она будет увеличиваться или уменьшаться во время самого конфликта.\nВаша начальная военная мощь — [GetPlayer.MakeScope.GetVariable('character_shadow_realm_force').GetValue|0]#!."
 POD_mummy_spell_of_life.50.t:0 "Победа над мертвецами"
 POD_mummy_spell_of_life.51.a:0 "Для начала объясню почему..."
 POD_mummy_spell_of_life.51.b:0 "Я верю, что мы сможем прийти к соглашению."
 POD_mummy_spell_of_life.51.critical.failure.effect.desc:0 "Упрямые глупцы..."
 POD_mummy_spell_of_life.51.desc:0 "$POD_mummy_spell_of_life_stage4_umbra_battles_strengths$Каким-то образом Кабир убедил Харона разрешить создание анклава. Никто не знает, как он этого добился. К счастью, вам не нужно его убеждать, поскольку анклав уже создан. Вам нужно поговорить с местным правителем, чтобы разрешить расширение [UmbraGlossary('hades')]. Маршалы наблюдают и координируют патрули в регионе, чтобы именно они столкнулись с [UmbraGlossary('hades')]. Инспекторы и министры руководят административной частью местной бюрократии. Однако ни у одного из них нет полномочий санкционировать расширение. Встреча с местным Советом Анакреонов — ваш лучший шанс убедить тех, у кого достаточно власти, чтобы гарантировать это дело. \n\nС помощью Кабира и ваших союзных призраков вы можете добраться до ближайшего некрополя и начать заполнять формы для запроса аудиенции. Формы и процедуры занимают несколько дней. Затем клерк вручает вам номер, который объявят, когда придёт время вашей аудиенции. Номер 10 712 461.\n\nПосле нескольких недель ожидания вы предстанете перед Советом и начнете излагать свое дело."
 POD_mummy_spell_of_life.51.effect.success.critical.desc:0 "Они нам помогут!"
 POD_mummy_spell_of_life.51.effect.success.desc:0 "Удалось убедить!"
 POD_mummy_spell_of_life.51.t:0 "Ласковые речи"
 POD_mummy_spell_of_life.52.a:0 "Моих связанных призраков будет достаточно."
 POD_mummy_spell_of_life.52.b:0 "Мои исследования должны найти решение."
 POD_mummy_spell_of_life.52.c:0 "Мы придем к соглашению."
 POD_mummy_spell_of_life.52.critical.failure.effect.desc:0 "Еле-еле, но хватит..."
 POD_mummy_spell_of_life.52.desc:0 "$POD_mummy_spell_of_life_stage4_umbra_battles_strengths$После смерти призрак попадает в загробный мир в коконе из плазмы, называемом оболочкой. Пока оболочка не снята, она удерживает его в покорном, спокойном, похожем на сон состоянии, в котором он почти не осознаёт окружающего. В это время призрак крайне уязвим для нападений, преобразований, порабощения, ваяния или перековки души. Снять оболочку может лишь другой призрак, но у нас нет ни стигийских жнецов, ни помощи Анубиса. Кабир нашёл одного согласившегося призрака, который с тех пор снимает оболочки. Однако одного его недостаточно для наплыва мумий, который можете создать вы. Нужна большая группа постоянных жителей [UmbraGlossary('hades')], которые будут снимать оболочки.\n\nК сожалению, у призраков странная экономика. Они торгуют изделиями из перекованных душ, кристаллами пламени души, жидким пафосом, порошком тоски, реликвиями, стигийской бумагой, плазмой [UmbraGlossary('sunless_sea')], рудой смерти и подобными вещами. Мы не можем эффективно и регулярно добывать всё это для оплаты их труда. Придётся найти иной способ получить и удержать их на службе."
 POD_mummy_spell_of_life.52.effect.success.desc:0 "Удалось убедить!"
 POD_mummy_spell_of_life.52.t:0 "Получение местной помощи"
 POD_mummy_spell_of_life.53.a:0 "Я сделаю это самостоятельно."
 POD_mummy_spell_of_life.53.b:0 "Наверняка есть доступный вариант."
 POD_mummy_spell_of_life.53.c:0 "Стоимость не проблема."
 POD_mummy_spell_of_life.53.critical.failure.effect.desc:0 "Мы в безопасности, но не отрезаны..."
 POD_mummy_spell_of_life.53.d:0 "Безумная затея."
 POD_mummy_spell_of_life.53.desc:0 "$POD_mummy_spell_of_life_stage4_umbra_battles_strengths$Древние записи свидетельствуют, что [UmbraGlossaryLocalized('dark_kingdom_of_sand','Аменти')] и [UmbraGlossaryLocalized('shadowlands','Загробный мир')] были втянуты в войну, длившуюся бесчисленные десятилетия или даже столетия. Она закончилась лишь тогда, когда Анубис добился заключения договора. До этого [UmbraGlossary('neter_khertet')] быстро пал, но жители [UmbraGlossaryLocalized('dark_kingdom_of_sand','Аменти')], уступавшие противнику размерами и численностью, всё же сумели удержать позиции. Воспроизведя некоторые из их укреплений, вы сможете выдержать любые нападения Спектров. Даже если анакреоны изменят своё решение, вы продержитесь до разрешения этой проблемы.\n\nОдним из их величайших достижений стало отделение [UmbraGlossaryLocalized('dark_kingdom_of_sand','Аменти')] от остального [UmbraGlossaryLocalized('shadowlands','Загробного мира')]. Теперь это было самостоятельное царство, а не просто место внутри более обширного мира. Попасть туда можно было лишь по тщательно поддерживаемым и охраняемым путям. Подобная система позволила бы вам ограничить доступ в [UmbraGlossary('hades')] и уменьшить угрозу извне. Однако это не будет ни просто, ни дёшево и, возможно, окажется вовсе неосуществимым. Ведь прежде такое удавалось лишь Осирису — невероятно могущественному вампиру, каким-то образом превзошедшему свою вампирскую природу, — и Анубису, призраку, понимавшему природу [Concept('umbra', 'Умбры')|E] глубже, чем Паромщики."
 POD_mummy_spell_of_life.53.effect.success.desc:0 "Это сработало!"
 POD_mummy_spell_of_life.53.t:0 "Отсечь себя от мира"
 POD_mummy_spell_of_life.54.a:0 "Вызовите мастеров."
 POD_mummy_spell_of_life.54.b:0 "Достать лучшие материалы для ремесла."
 POD_mummy_spell_of_life.54.c:0 "Подготовьте экстрасенсов."
 POD_mummy_spell_of_life.54.critical.failure.effect.desc:0 "Еле-еле..."
 POD_mummy_spell_of_life.54.desc:0 "$POD_mummy_spell_of_life_stage4_umbra_battles_strengths$Древние записи свидетельствуют, что [UmbraGlossaryLocalized('dark_kingdom_of_sand','Аменти')] и [UmbraGlossaryLocalized('shadowlands','Загробный мир')] были втянуты в войну, длившуюся бесчисленные десятилетия или даже столетия. Она закончилась лишь тогда, когда Анубис добился заключения договора. До этого [UmbraGlossary('neter_khertet')] быстро пал, но жители [UmbraGlossaryLocalized('dark_kingdom_of_sand','Аменти')], уступавшие противнику размерами и численностью, всё же сумели удержать позиции. Воспроизведя некоторые из их укреплений, вы сможете выдержать любые нападения Спектров. Даже если анакреоны изменят своё решение, вы продержитесь до разрешения этой проблемы.\n\nАрмия [UmbraGlossaryLocalized('dark_kingdom_of_sand','Аменти')] состояла из огромных легионов ушабти. Эти оживлённые статуи были неутомимыми работниками в мирное время и неустанными бойцами на войне. Тщательно подобранные слова силы, начертанные на их телах, наделяли могуществом обычные творения из дерева, металла и камня. Вы могли бы создать собственные конструкции или привязать призраков, чтобы получить подобную защиту. Если повезёт, их хватит не только для несения караула."
 POD_mummy_spell_of_life.54.effect.success.desc:0 "Взгляните на мою армию!"
 POD_mummy_spell_of_life.54.t:0 "Неутомимая Орда"
 POD_mummy_spell_of_life.55.a:0 "Поговорите со священниками."
 POD_mummy_spell_of_life.55.b:0 "Мы возродим эллинистическую культуру."
 POD_mummy_spell_of_life.55.desc:0 "$POD_mummy_spell_of_life_stage4_umbra_battles_strengths$[UmbraGlossaryLocalized('shadowlands','Загробный мир')] — это царство воспоминаний. Реликвии и места исчезают, когда о них забывают. Как греческое царство мёртвых, [UmbraGlossary('hades')] неразрывно связан с греческой религией. С подъемом христианства и упадком эллинистической культуры [UmbraGlossary('hades')] пришёл в упадок вместе с ней. Это во многом способствовало общему упадку и нестабильности [UmbraGlossary('shadow_realm')]. \n\nК нашему счастью, христианство использует греческое слово \"Аид\" для обозначения места временного содержания душ, как хороших, так и плохих, в ожидании суда. Из трех частей христианского Аида одну нишу иногда называют Тартаром. Если бы вы могли укрепить эту связь, вы могли бы утвердить [UmbraGlossary('hades')] в сознании смертных и тем самым стабилизировать его до тех пор, пока христианство остается в народном сознании. К сожалению, такое действие ослабило бы нашу связь с нашим греческим наследием."
 POD_mummy_spell_of_life.55.t:0 "Сохранение воспоминаний"
 POD_mummy_spell_of_life.56.a:0 "Подойдите к ним слева..."
 POD_mummy_spell_of_life.56.b:0 "Некоторые из вас могут погибнуть..."
 POD_mummy_spell_of_life.56.c:0 "Это не стоит риска."
 POD_mummy_spell_of_life.56.critical.failure.effect.desc:0 "Весь отряд погиб, мой господин."
 POD_mummy_spell_of_life.56.desc:0 "$POD_mummy_spell_of_life_stage4_umbra_battles_strengths$Время пришло. Нынешние границы [UmbraGlossary('hades')] были защищены и стабилизированы, насколько это было возможно. Ваши силы готовы выступить вперед и отбросить орды спектров. Ваши призраки готовы захватить территорию и вернуть наши души, когда придет время. Ваши солдаты собираются, чтобы удерживать захваченную территорию. \n\n[UmbraGlossary('hades')] всегда существовал в изолированной области [UmbraGlossaryLocalized('shadowlands','Загробного мира')], позволяя спектрам свирепствовать за ее пределами. Прежде чем начнется нападение, существует возможность отправить рейдовые отряды, чтобы преследовать их. Если бы это сработало, рейды уменьшили бы их численность и облегчили бы предстоящий конфликт. Однако такие рейды влекут за собой большие риски."
 POD_mummy_spell_of_life.56.effect.success.desc:0 "Их ряды поредели, мой господин."
 POD_mummy_spell_of_life.56.t:0 "Налётчики"
 POD_mummy_spell_of_life.57.a:0 "Мы не можем остановиться сейчас! ВПЕРЕД!"
 POD_mummy_spell_of_life.57.b:0 "Призвать наши резервы! Всех до единого!"
 POD_mummy_spell_of_life.57.desc:0 "$POD_mummy_spell_of_life_stage4_umbra_battles_strengths$Это последняя битва. Если к концу ваша военная мощь окажется ниже, чем у противостоящих вам сил, ваш путь закончится здесь. #!\n\nВы выводите свои войска из защищенного анклава [UmbraGlossary('hades')]. Вас ждет бесконечная орда спектров, которые, кажется, постоянно атакуют возведенную вами защиту. Их бледные, вытянутые формы сразу же ощущают ваше появление и начинают устремляться к вашей армии. Концентрированное присутствие порчи Забвения представляет собой ощутимый смрад, загрязняющий воздух. Подавляющее большинство представляют собой скелетные фигуры с когтями, способными разрывать плоть, или с ледяным черным огнем, горящим в их глазах. Несколько зверей размером с ребенка бегают между ног, безумно хохоча. В первых рядах маршируют дикие, звероподобные монстры с множеством рядов акульих зубов и разорванными массами тканей, свисающими с деформированных скелетов. Их похоть, ненависть и страсть легко видны, и кажется, будто они исходят из их неповоротливых форм. Все они жаждут вкусить крови живых, украсть хоть каплю этой жизненной силы и причинить боль и разрушения. Несмотря на эту жажду, они действуют согласованно, как единая масса, а не рвутся вперед. Несколько существ с неоднородными, просачивающимися поражениями и опухолями гонят их вперед организованными формированиями в соответствии с каким-то скрытым планом. \n\nПока ими командуют и фокусируют внимание, эти обычные спектры не обладают независимым разумом и не способны к стратегическому реагированию на быстрые действия. Если у вас есть время и пространство для маневра, своевременный натиск может разрушить орду и позволить вашим силам сокрушить часть из них. В качестве альтернативы можно было бы призвать ваши резервы, которые до сих пор в основном оставались в мире смертных. Хотя они будут служить не более чем пушечным мясом, это все равно может иметь значение."
 POD_mummy_spell_of_life.57.t:0 "Битва началась"
 POD_mummy_spell_of_life.58.a:0 "Пути назад нет..."
 POD_mummy_spell_of_life.58.b:0 "В атаку!"
 POD_mummy_spell_of_life.58.c:0 "Даже если это будет стоить мне ума!"
 POD_mummy_spell_of_life.58.critical.failure.effect.desc:0 "Одинокие и ровные пески простираются далеко..."
 POD_mummy_spell_of_life.58.d:0 "Любой ценой!"
 POD_mummy_spell_of_life.58.desc:0 "$POD_mummy_spell_of_life_stage4_umbra_battles_strengths$Орда начинает слабеть. В их рядах открываются бреши, позволяя вам еще глубже проникнуть в их порядки. Только одно препятствие стоит на пути расширения [UmbraGlossary('hades')], предводитель спектров. \n\nПрорубившись через бесчисленных спектров, вы видите человека в маске, созданной по образцу греческой маски трагедии. Существо одето в рваные черные одежды, испещренные белыми пятнами проказы, и держит в руках сломанную косу. Потускневшие и зазубренные шипы торчат из мантии, и вязкая черная жидкость медленно капает и разбрызгивается на землю, где кажется, что она шипит. Его защищают многочисленные зияющие пасти и злые когти, скрепленные переплетением сухожилий и туго натянутой кожи. Полупрозрачные щупальца появляются из некоторых опухолевых масс плоти, кружась и убивая любого спектра, который подойдет слишком близко, отражая их едва сдерживаемую жестокость. Вы и ваши союзники приближаетесь к грандиозному противостоянию. \n\nКаждый удар носящего косу точен, и его удары обрушиваются на ваши силы так же неизбежно, как энтропия. Кажется, что каждый пораженный солдат распадается на однородную каплю углерода, некоторых металлов и медленно расширяющееся облако газов, хотя даже они быстро разлагаются на невидимые компоненты, прежде чем они тоже уничтожаются полностью. Это резко контрастирует с чудовищами, чьи сокрушительные удары обрушиваются вокруг вас. Каждый удар прикрывает перемещение их хозяина, позволяя использовать более сложные стратегии. Хотя звери демонстрируют множество эмоций, ни одна из этих эмоций не дает вам понимания, которое можно было бы прочитать, или слабостей, которыми можно было бы воспользоваться. Вам удается сбросить маску, но это мало помогает. Почерневшее, безглазое и безротое лицо этой живой тени мало что раскрывает, кроме неизбежных объятий всего сущего в объятиях Бездны. \n\nДаже когда ваши силы окружают вас и начинают догонять орду спектров, нет никаких сомнений в том, что это будет битва за ваше существование, борьба, которая подтолкнет вас к вашим пределам. Если это существо победит, битва обернётся против вашей армии, и надежды на успех будет мало."
 POD_mummy_spell_of_life.58.effect.failure.desc:0 "Сладкое небытие Пустоты..."
 POD_mummy_spell_of_life.58.effect.success.desc:0 "Они все падают..."
 POD_mummy_spell_of_life.58.final_check:0 "Сравнит вашу военную мощь с силой спектров, чтобы определить окончательные результаты."
 POD_mummy_spell_of_life.58.t:0 "Святой поглощённых Тенью"
 POD_mummy_spell_of_life.59.a:0 "Эта руна туда подходит, теперь мне просто нужно..."
 POD_mummy_spell_of_life.59.desc:0 "После нескольких часов (?) боя вы, наконец, прикончите последнего зверя и заставите носителя косы отступить. Затем, всего за мгновение, его тело начинает смещаться, распушаться, искажаться, сморщиваться и складываться, пока оно просто... не исчезает. Когда вы переводите дыхание (по крайней мере, это успокаивающий жест), вы на мгновение оглядываетесь вокруг. Вы видите, как уничтожают последних спектров. Ваши солдаты уже начинают возводить оборону и укрепления, чтобы удерживать территорию, пока ваши люди не смогут ее должным образом обеспечить. \n\nНесколько дней спустя вы наблюдаете, как перед вами стабилизируются новые границы [UmbraGlossary('hades')]. Его границы становятся четкими, отбрасывая вездесущие бури душ и полностью заявляя права на землю. Призраки готовы собрать и помочь любым мумиям, которые могут прибыть сюда. С этим пришло время вернуться домой и закончить последнюю часть Заклинания Жизни."
 POD_mummy_spell_of_life.59.t:0 "Наконец-то победа"
 POD_mummy_spell_of_life.60.a:0 "Пришло время начать."
 POD_mummy_spell_of_life.60.b:0 "Это слишком рискованно."
 POD_mummy_spell_of_life.60.desc:0 "Когда [GetScriptedCharacterByHistoryID('792600').GetFirstName] впервые создал свою версию Заклинания Жизни, он столкнулся с проблемой невозможности войти в [UmbraGlossaryLocalized('dark_kingdom_of_sand','Аменти')], древнеегипетское царство мертвых, где мумии находят время, чтобы восстановить себя между каждой смертью. Таким образом, он получил очень небольшую часть [UmbraGlossary('shadowlands')], которую он назвал \"Аид\" как свой собственный [UmbraGlossary('shadow_realm')], и каким-то образом сумел убедить Харона, владыку [UmbraGlossaryLocalized('shadowlands','Загробного мира')], принять этот анклав. Несмотря на это, [UmbraGlossary('hades')] по-прежнему остается жалкой копией [UmbraGlossaryLocalized('dark_kingdom_of_sand','Аменти')].\n\nНесмотря на его недостатки, вам придется повторить подвиг Кабира по созданию нового [UmbraGlossary('shadow_realm')]. Учитывая трудности, с которыми столкнулся Кабир, это будет непростая задача. У вас нет такой связи с Хароном, чтобы получить разрешение, поэтому стигийское правительство нужно будет обойти или успокоить, чтобы оно не действовало против нас. #TOOLTIP:GAME_TRAIT,spectre,[GetNullCharacter] #L Спектры#!#! необходимо будет отодвинуть назад. Заклинания должны быть подготовлены для захвата и удержания территории. Новому царству потребуются защитники. К сожалению, вам придется утвердиться до того, как стигийская бюрократия обнаружит ваше присутствие и оправится достаточно, чтобы атаковать. Кроме того, простое ваше присутствие будет привлекать все большие орды спектров, пока работа не будет завершена, поэтому любые задержки сделают финальную битву сложнее. Так много дел, так мало времени...\n\n#R В этом сражении используется показатель «Военная сила». Начальное значение определяется доблестью вашей, ваших воителей и вашей [coterie|E]. Оно будет повышаться или понижаться в ходе самого конфликта.\nВаша стартовая военная мощь — [GetPlayer.MakeScope.GetVariable('character_shadow_realm_force').GetValue|0]#!."
 POD_mummy_spell_of_life.60.desc.b:0 "Когда [GetScriptedCharacterByHistoryID('792600').GetFirstName] впервые создал свою версию Заклинания Жизни, он столкнулся с проблемой невозможности войти в [UmbraGlossaryLocalized('dark_kingdom_of_sand','Аменти')], древнеегипетское царство мертвых, где мумии находят время, чтобы восстановить себя между каждой смертью. Таким образом, он получил очень небольшую часть [UmbraGlossary('shadowlands')], которую он назвал \"Аид\" как свой собственный [UmbraGlossary('shadow_realm')], и каким-то образом сумел убедить Харона, владыку [UmbraGlossaryLocalized('shadowlands','Загробного мира')], принять этот анклав. Несмотря на это, [UmbraGlossary('hades')] по-прежнему остается жалкой копией [UmbraGlossaryLocalized('dark_kingdom_of_sand','Аменти')].\n\nНесмотря на его недостатки, вам придется повторить подвиг Кабира по созданию нового [UmbraGlossary('shadow_realm')]. Учитывая трудности, с которыми столкнулся Кабир, это будет непростая задача. У вас нет такой связи с Хароном, чтобы получить разрешение, поэтому стигийское правительство нужно будет обойти или успокоить, чтобы оно не действовало против нас. #TOOLTIP:GAME_TRAIT,spectre,[GetNullCharacter] #L Спектры#!#! необходимо будет отодвинуть назад. Из-за недавнего Великого Водоворота их особенно много, хотя отвлечение Стигии может нам помочь. Заклинания должны быть подготовлены для захвата и удержания территории. Новому царству потребуются защитники. К сожалению, вам придется утвердиться до того, как стигийская бюрократия обнаружит ваше присутствие и оправится достаточно, чтобы атаковать. Кроме того, простое ваше присутствие будет привлекать все большие орды спектров, пока работа не будет завершена, поэтому любые задержки сделают финальную битву сложнее. Так много дел, так мало времени...\n\n#R В этом сражении используется показатель «Военная сила». Начальное значение определяется доблестью вашей, ваших воителей и вашей [coterie|E]. Оно будет повышаться или понижаться в ходе самого конфликта.\nВаша стартовая военная мощь — [GetPlayer.MakeScope.GetVariable('character_shadow_realm_force').GetValue|0]#!."
 POD_mummy_spell_of_life.60.t:0 "Победа над мертвецами"
 POD_mummy_spell_of_life.61.a:0 "Моя держава сильна."
 POD_mummy_spell_of_life.61.b:0 "Наш тыл должен быть защищён."
 POD_mummy_spell_of_life.61.critical.failure.effect.desc:0 "Мы стоим вместе?"
 POD_mummy_spell_of_life.61.desc:0 "$POD_mummy_spell_of_life_stage4_umbra_battles_strengths$Вы готовитесь к отъезду в [umbra|E]. Однако было бы глупо думать, что ваши усилия, даже в случае успеха, будут быстрыми, и вы не сможете вернуться даже на короткое время, поскольку такие проекты нельзя остановить, пока они не будут завершены. Призраки, выступающие против вашего плана, могут войти в [Glossary('земли Плоти','game_concept_skinlands_desc')] и угрожать вашему королевству. Гораздо более проблематично то, что ваши соперники, враги и нелояльные вассалы наверняка обрушатся на ваши силы. Некоторые будут стремиться к вашему исследованию Заклинания Жизни, в то время как другие просто попытаются узурпировать ваше влияние в ваше отсутствие. Такие атаки перережут линии связи и снабжения, заключив вас в ловушку [UmbraGlossaryLocalized('shadowlands','Загробного мира')] и лишив вас возможности получить помощь. \n\nЭто оставляет вам два варианта. Вы можете уйти и надеяться, что ваше царство выживет без вашего непосредственного надзора. В качестве альтернативы вы можете разместить здесь часть своих сил для охраны тыла, прекрасно зная, что на другой стороне их не будет хватать."
 POD_mummy_spell_of_life.61.effect.success.desc:0 "Мы стоим вместе!"
 POD_mummy_spell_of_life.61.t:0 "Ночной дозор"
 POD_mummy_spell_of_life.610.a:0 "Мой народ остается стойким и лояльным."
 POD_mummy_spell_of_life.610.b:0 "Мои агенты знают верных и могут убить остальных."
 POD_mummy_spell_of_life.610.c:0 "Мой тактический гений обеспечивает победу в бою."
 POD_mummy_spell_of_life.610.critical.failure.effect.desc:0 "Вернись сюда с этим! НЕТ! Не делай этого!"
 POD_mummy_spell_of_life.610.d:0 "Единоборство определит достойного претендента."
 POD_mummy_spell_of_life.610.desc:0 "После нескольких часов (?) боя вы, наконец, прикончите последнего зверя и заставите носителя косы отступить. Затем, всего за мгновение, его тело начинает смещаться, распушаться, искажаться, сморщиваться и складываться, пока оно просто... не исчезает. Когда вы переводите дыхание (по крайней мере, это успокаивающий жест), вы на мгновение оглядываетесь вокруг. Вы видите, как уничтожают последних спектров. Ваши солдаты уже начинают возводить оборону и укрепления, чтобы удерживать территорию, пока ваши люди не смогут ее должным образом защитить. \n\nНесколько дней спустя вы почувствуете, как ваш новый [UmbraGlossary('shadow_realm')] стабилизируется вокруг вас. Его границы становятся четкими, отодвигая вездесущие бури душ. С этим настало время вернуться домой. \n\nК сожалению, ваше длительное отсутствие и предполагаемая смерть или ослабление высвободили фракции внутри вашего двора, в то время как ваши соперники ведут борьбу за вашу территорию. Все королевство находится в хаосе, поскольку различные силы пытаются одержать верх. Что еще хуже, все они придерживаются одной и той же идеи: устранение вас сейчас, пока вы остаетесь ослабленным, даст им самые серьезные права на все, что останется после того, как этот водоворот насилия наконец прекратится. В одном последнем конфликте ваша потрепанная армия должна найти в себе силы и харизму, чтобы собрать воедино любые остатки лоялистов и напомнить этим дуракам, почему этот трон с самого начала принадлежал вам. Только тогда у вас будет время закончить «Заклинание Жизни»."
 POD_mummy_spell_of_life.610.e:0 "Народ со мной. Никто не устоит перед его волной."
 POD_mummy_spell_of_life.610.effect.success.desc:0 "Вы восстанавливаете некое подобие порядка"
 POD_mummy_spell_of_life.610.f:0 "Вы не первый в истории, кто пытается это сделать, поэтому я подготовился."
 POD_mummy_spell_of_life.610.t:0 "Живой кошмар"
 POD_mummy_spell_of_life.62.a:0 "Обыщите архивы!"
 POD_mummy_spell_of_life.62.b:0 "Наймите еще библиотекарей в помощь мне."
 POD_mummy_spell_of_life.62.critical.failure.effect.desc:0 "Столько задержек..."
 POD_mummy_spell_of_life.62.desc:0 "$POD_mummy_spell_of_life_stage4_umbra_battles_strengths$Ваши обширные исследования открыли интересную возможность. [UmbraGlossaryLocalized('dark_kingdom_of_sand','Аменти')] был построен внутри [UmbraGlossary('neter_khertet')], старого египетского подземного мира. [Glossary('Какури','podgloss.kakuri')] был подземным миром айнов до того, как [Glossary('Эмма-О','podgloss.emmao')], когда-то хранитель мертвых айнов, превратил его в [UmbraGlossaryLocalized('yomi_wan','ад Йоми')], соответствующий [Glossary('повелителю Яма','podgloss.yamaking')]. Эти прецеденты показывают, что местные царства мёртвых обладают огромным потенциалом в качестве плацдарма для более крупных начинаний. Они сравнительно свободны от спектров и могут опираться на местные верования, чтобы обеспечить определенную стабильность. Кроме того, их наставники, смотрители и опекуны дополнили бы наши собственные усилия. \n\nХотя господство христианства уничтожило большинство таких сфер, некоторые все еще остаются. Стигия может претендовать на все западные подземные миры, но [UmbraGlossary('umi')] аналогичным образом претендует на весь Тихий океан, и ему так и не удалось раздавить все независимые миры духов. Ваше безумное стремление сформировать независимый [UmbraGlossary('shadow_realm')] потерпит неудачу, если вы не обнаружите местное царство мёртвых и не защитите его должным образом. Таким образом, единственный вопрос заключается в том, сколько времени это займет."
 POD_mummy_spell_of_life.62.effect.success.desc:0 "Нашел!"
 POD_mummy_spell_of_life.62.t:0 "Местные царства мёртвых"
 POD_mummy_spell_of_life.620.a:0 "Предлагаем защиту небольшого региона."
 POD_mummy_spell_of_life.620.critical.failure.effect.desc:0 "Столько задержек..."
 POD_mummy_spell_of_life.620.desc:0 "$POD_mummy_spell_of_life_stage4_umbra_battles_strengths$После смерти призрак попадает в загробный мир в коконе из плазмы, называемом оболочкой. Пока оболочка не снята, она удерживает его в покорном, спокойном, похожем на сон состоянии, в котором он почти не осознаёт окружающего. В это время призрак крайне уязвим для нападений, преобразований, порабощения, ваяния или перековки души. Снять оболочку может лишь другой призрак, но у нас нет ни стигийских жнецов, ни помощи Анубиса.\n\nМестное царство мёртвых, который вы будете использовать, представляет интересную возможность: нашего собственного Анубиса. В таком царстве уже будет много постоянных жителей, и им будет управлять и охранять бог смерти. Он может собирать только что прибывшие сюда мумии и дополнять ваши оборонительные усилия. Однако его преданность принадлежит его народу, поэтому вам придётся склонить его на свою сторону. Это будет нелегко, поскольку он может рассматривать вас как силу вторжения, немногим лучше, чем властная бюрократия Стигии. Одна вещь, которая может помочь в вашем случае, это то, что вам не нужна всё его царство, по крайней мере, на начальном этапе."
 POD_mummy_spell_of_life.620.desc.b:0 "$POD_mummy_spell_of_life.620.desc$ Еще одна помощь – это хаос, вызванный недавним Великим Водоворотом. Наплыв спектров заставит их еще больше нуждаться в вашей поддержке."
 POD_mummy_spell_of_life.620.effect.success.desc:0 "Они согласны"
 POD_mummy_spell_of_life.620.t:0 "Боги Смерти"
 POD_mummy_spell_of_life.63.a:0 "Приготовьте приманку и найдите мне призрака, который её забросит."
 POD_mummy_spell_of_life.63.b:0 "Мы усугубим хаос Великого Водоворота."
 POD_mummy_spell_of_life.63.critical.failure.effect.desc:0 "Ваш агент пойман"
 POD_mummy_spell_of_life.63.desc:0 "$POD_mummy_spell_of_life_stage4_umbra_battles_strengths$Древние записи указывают на то, что [UmbraGlossaryLocalized('dark_kingdom_of_sand','Аменти')] и Стигия были вовлечены в войну на протяжении бесчисленных десятилетий или столетий. [UmbraGlossary('neter_khertet')] быстро пал, и война закончилась только тогда, когда Анубис преподнес невероятный подарок Паромщикам. \n\nЭто было давно, а Стигия только еще больше затвердела. Вне всякого сомнения, Стигия не допустит ни создания нового [UmbraGlossary('shadow_realm')], ни независимости подчинённого царства мёртвых. Они могут послать против вас свои силы или еще больше спровоцировать против вас спектров. В любом случае их вмешательство сильно осложнит ситуацию. Однако, чтобы Стигия могла действовать против вас, им необходимо вовремя обнаружить ваши действия, вмешаться и иметь силы для действий. \n\nЭто интересная возможность ослабить обоих потенциальных врагов. Если вы найдёте «приманку» для спектров, можно направить их на соседние некрополи. Однако, если вашего агента поймают, это может раскрыть ваши намерения, и они могут обернуться против вас."
 POD_mummy_spell_of_life.63.effect.success.desc:0 "Ваш агент сбегает незамеченным"
 POD_mummy_spell_of_life.63.t:0 "Рыбалка на хаос"
 POD_mummy_spell_of_life.630.a:0 "Изваяния могут пронзить Завесу."
 POD_mummy_spell_of_life.630.b:0 "Отдайте его заключенным... а затем казните их."
 POD_mummy_spell_of_life.630.c:0 "Приведите пленников и приготовьте ритуал."
 POD_mummy_spell_of_life.630.d:0 "Где мой экстрасенс?"
 POD_mummy_spell_of_life.630.desc:0 "$POD_mummy_spell_of_life_stage4_umbra_battles_strengths$Хотя близлежащие Некрополи и стигийские бюрократы могут отвлечься, они все равно представляют угрозу. Ваши действия незаконны и никогда не будут допущены публично. Однако их смерть не сделала этих призраков неподкупными. Маршалы наблюдают и координируют патрули в регионе, чтобы именно они могли вас встретить. Инспекторы и министры руководят административной частью местной бюрократии и управляют разведывательными сетями. Удачно сделанная взятка обеспечит перенаправление патрулей вокруг вашей территории, чтобы задержать официальное раскрытие. Больше взяток гарантирует, что первоначальные атаки против нас будут символическими. \n\nТеперь, стоимость такой услуги будет высокой. У призраков странная экономика. Они торгуют изделиями из перекованных душ, кристаллами огня души, жидким пафосом, порошком тоски, стигийской бумагой, плазмой [UmbraGlossary('sunless_sea')], рудой смерти и подобными предметами, но эти предметы недостижимы или недостаточно стоят. Реликвии, воспоминания, обретшие форму, когда они пересекли Завесу, — идеальный вариант. Они не ломаются, заменяют расходные предметы, их невозможно связать с нами, и их можно легко обменять на другие нужные предметы. \n\nЕсли у вас есть способности, вы, возможно, сможете их изготовить. Десятина мертвых ясно дает понять, что реликвии иногда могут быть созданы из предметов, прижатых к глазам мертвых, даже если они не были греками и не исповедовали греческую религию. Некоторые виды магии могут устранить неопределенность этого процесса или даже устранить необходимость жертвоприношений."
 POD_mummy_spell_of_life.630.e:0 "Вызовите экстрасенса к моему двору."
 POD_mummy_spell_of_life.630.t:0 "Подкуп"
 POD_mummy_spell_of_life.64.a:0 "Я сделаю это самостоятельно."
 POD_mummy_spell_of_life.64.b:0 "Наверняка есть доступный вариант."
 POD_mummy_spell_of_life.64.c:0 "Стоимость не проблема."
 POD_mummy_spell_of_life.64.critical.failure.effect.desc:0 "Привязан к реальности..."
 POD_mummy_spell_of_life.64.d:0 "Безумная затея."
 POD_mummy_spell_of_life.64.desc:0 "$POD_mummy_spell_of_life_stage4_umbra_battles_strengths$Древние записи указывают на то, что [UmbraGlossaryLocalized('dark_kingdom_of_sand','Аменти')] и Стигия были вовлечены в войну на протяжении бесчисленных десятилетий или столетий. [UmbraGlossary('neter_khertet')] быстро пал, и война закончилась только тогда, когда Анубис преподнес Паромщикам невероятный подарок. Если вы скопируете некоторые защитные механизмы [UmbraGlossaryLocalized('dark_kingdom_of_sand','Аменти')], вы сможете противостоять любым нападениям спектров. Даже если Стигия неизбежно обратит на вас внимание, вы сможете выжить, пока проблема не будет решена. \n\nОдним из их величайших подвигов было отрезать [UmbraGlossaryLocalized('dark_kingdom_of_sand','Аменти')] от остальной части [UmbraGlossaryLocalized('shadowlands','Загробного мира')]. Это больше не было простым местом внутри более крупного королевства. Скорее, оно стало отдельным царством, доступным только по тщательно поддерживаемым и контролируемым путям. Имитация такой системы позволит вам ограничить доступ к вашему новому [UmbraGlossary('shadow_realm')], ограничив угрозу, исходящую от внешних сил. Однако осуществить это будет непросто, недёшево и, возможно, вовсе невозможно. В конце концов, ранее это было сделано только Осирисом, вампиром огромной силы, который каким-то образом превзошел свою вампирскую природу, и Анубисом, призраком, который продемонстрировал большее понимание природы [umbra|E], чем Паромщики."
 POD_mummy_spell_of_life.64.desc.b:0 "$POD_mummy_spell_of_life.64.desc$К счастью, недавний Великий Водоворот немного ослабил [umbra|E] и сделал вмешательство в него проще, чем обычно."
 POD_mummy_spell_of_life.64.effect.success.desc:0 "Вы свободно плывёте по морю без солнца..."
 POD_mummy_spell_of_life.64.t:0 "Отсечь себя от мира"
 POD_mummy_spell_of_life.640.a:0 "Вызовите мастеров."
 POD_mummy_spell_of_life.640.b:0 "Достать лучшие материалы для ремесла."
 POD_mummy_spell_of_life.640.c:0 "Подготовьте экстрасенсов."
 POD_mummy_spell_of_life.640.critical.failure.effect.desc:0 "Еле-еле..."
 POD_mummy_spell_of_life.640.desc:0 "$POD_mummy_spell_of_life_stage4_umbra_battles_strengths$Древние записи указывают на то, что [UmbraGlossaryLocalized('dark_kingdom_of_sand','Аменти')] и Стигия были вовлечены в войну на протяжении бесчисленных десятилетий или столетий. [UmbraGlossary('neter_khertet')] быстро пал, и война закончилась только тогда, когда Анубис преподнес Паромщикам невероятный подарок. Если вы скопируете некоторые защитные механизмы [UmbraGlossaryLocalized('dark_kingdom_of_sand','Аменти')], вы сможете противостоять любым нападениям спектров. Даже если Стигия неизбежно обратит на вас внимание, вы сможете выжить, пока проблема не будет решена. \n\nАрмия [UmbraGlossaryLocalized('dark_kingdom_of_sand','Аменти')] состояла из огромных легионов Ушабти. Эти оживлённые статуи служили неутомимой рабочей силой в мирное время и неустанной силой на войне. Тщательно выбранные слова силы, вписанные в их тела, придали силу этим обычным конструкциям из дерева, металла и камня. Мы могли бы создавать собственные конструкции или связывать призраков, чтобы создать аналогичную защитную силу. Если повезёт, их хватит не только для несения караула."
 POD_mummy_spell_of_life.640.effect.success.desc:0 "Взгляните на мою армию!"
 POD_mummy_spell_of_life.640.t:0 "Неутомимая Орда"
 POD_mummy_spell_of_life.65.a:0 "Вспомни, кем ты был..."
 POD_mummy_spell_of_life.65.b:0 "Это не стоит потраченного времени."
 POD_mummy_spell_of_life.65.critical.failure.effect.desc:0 "Пустая трата времени..."
 POD_mummy_spell_of_life.65.desc:0 "$POD_mummy_spell_of_life_stage4_umbra_battles_strengths$[UmbraGlossaryLocalized('shadowlands','Загробный мир')] собирает души на протяжении веков и тысячелетий. В частности, призраками обычно становятся те, у кого есть незавершенные дела или насильственная смерть. Можно с уверенностью сказать, что среди них есть некоторые из ваших бывших чемпионов и союзников. Если их завербовать, они станут верными и могущественными помощниками. Их помощь будет неоценима, поскольку она пополнит ваши силы в предстоящей битве и позаботится о вашем [UmbraGlossary('shadow_realm')] в будущем. Однако нет никаких сомнений в том, что их разум и корпус будут сильно ослаблены. Чтобы найти и восстановить их, потребуется драгоценное время."
 POD_mummy_spell_of_life.65.effect.success.desc:0 "С возвращением"
 POD_mummy_spell_of_life.65.t:0 "Ушедшие, но не забытые"
 POD_mummy_spell_of_life.66.a:0 "Во-первых, вам нужно будет..."
 POD_mummy_spell_of_life.66.b:0 "Некоторые из вас могут погибнуть..."
 POD_mummy_spell_of_life.66.c:0 "Это не стоит риска."
 POD_mummy_spell_of_life.66.critical.failure.effect.desc:0 "Весь отряд погиб, мой господин."
 POD_mummy_spell_of_life.66.desc:0 "$POD_mummy_spell_of_life_stage4_umbra_battles_strengths$Время пришло. Ваши силы готовы выступить вперед и отбросить орды спектров. Ваши призраки готовы захватить территорию и вернуть наши души, когда придет время. Местный бог смерти добавил свою силу к вашей магии. Ваши солдаты собираются, чтобы удерживать захваченную территорию.\n\nИзбранное вами за удалённость от центров стигийской власти царство мёртвых всегда существовал в изолированной области, позволяя спектрам свирепствовать за его пределами. Прежде чем начнется нападение, существует возможность отправить рейдовые отряды, чтобы преследовать их. Если бы это сработало, рейды уменьшили бы их численность и облегчили бы предстоящий конфликт. Однако такие рейды влекут за собой большие риски."
 POD_mummy_spell_of_life.66.effect.success.desc:0 "Их ряды поредели, мой господин."
 POD_mummy_spell_of_life.66.t:0 "Налётчики"
 POD_mummy_spell_of_life.67.a:0 "Мы не можем остановиться сейчас! ВПЕРЕД!"
 POD_mummy_spell_of_life.67.b:0 "Призвать наши резервы! Всех до единого!"
 POD_mummy_spell_of_life.67.critical.failure.effect.desc:0 "Одинокие и ровные пески простираются далеко..."
 POD_mummy_spell_of_life.67.desc:0 "$POD_mummy_spell_of_life_stage4_umbra_battles_strengths$Это последняя битва. Если к концу ваша военная мощь окажется ниже, чем у противостоящих вам сил, ваш путь закончится здесь. #!\n\nВы выводите свои силы из защищенного анклава выбранного вами подземного мира. Вас ждет бесконечная орда спектров, которые, кажется, постоянно атакуют возведенную вами защиту. Их бледные, вытянутые формы сразу же ощущают ваше появление и начинают устремляться к вашей армии. Концентрированное присутствие порчи Забвения представляет собой ощутимый смрад, загрязняющий воздух. Подавляющее большинство представляют собой скелетные фигуры с когтями, способными разрывать плоть, или с ледяным черным огнем, горящим в их глазах. Несколько зверей размером с ребенка бегают между ног, безумно хохоча. В первых рядах маршируют дикие, звероподобные монстры с множеством рядов акульих зубов и разорванными массами тканей, свисающими с деформированных скелетов. Их похоть, ненависть и страсть легко видны, и кажется, будто они исходят из их неповоротливых форм. Все они жаждут вкусить крови живых, украсть хоть каплю этой жизненной силы и причинить боль и разрушения. Несмотря на эту жажду, они действуют согласованно, как единая масса, а не рвутся вперед. Несколько существ с неоднородными, просачивающимися поражениями и опухолями гонят их вперед организованными формированиями в соответствии с каким-то скрытым планом. \n\nПока ими командуют и фокусируют внимание, эти обычные спектры не обладают независимым разумом и не способны к стратегическому реагированию на быстрые действия. Если у вас есть время и пространство для маневра, своевременный натиск может разрушить орду и позволить вашим силам сокрушить часть из них. В качестве альтернативы можно было бы призвать ваши резервы, которые до сих пор в основном оставались в мире смертных. Хотя они будут служить не более чем пушечным мясом, это все равно может иметь значение."
 POD_mummy_spell_of_life.67.t:0 "Битва началась"
 POD_mummy_spell_of_life.670.a:0 "Пути назад нет..."
 POD_mummy_spell_of_life.670.b:0 "В атаку!"
 POD_mummy_spell_of_life.670.c:0 "Даже если это будет стоить мне ума!"
 POD_mummy_spell_of_life.670.critical.failure.effect.desc:0 "Одинокие и ровные пески простираются далеко..."
 POD_mummy_spell_of_life.670.d:0 "Любой ценой!"
 POD_mummy_spell_of_life.670.desc:0 "$POD_mummy_spell_of_life_stage4_umbra_battles_strengths$Орда начинает слабеть. В их рядах открываются бреши, позволяя вам еще глубже проникнуть в их порядки. Только одно препятствие стоит на пути создания [UmbraGlossary('shadow_realm')], предводитель спектров. \n\nПрорубившись сквозь бесчисленных спектров, вы видите человека в маске, созданной по образцу греческой маски трагедии. Существо одето в рваные черные одежды, испещренные белыми пятнами проказы, и держит в руках сломанную косу. Потускневшие и зазубренные шипы торчат из мантии, и вязкая черная жидкость медленно капает и разбрызгивается на землю, где кажется, что она шипит. Его защищают многочисленные зияющие пасти и злые когти, скрепленные переплетением сухожилий и туго натянутой кожи. Полупрозрачные щупальца появляются из некоторых опухолевых масс плоти, кружась и убивая любого спектра, который подойдет слишком близко, отражая их едва сдерживаемую жестокость. Вы и ваши союзники приближаетесь к грандиозному противостоянию. \n\nКаждый удар носящего косу точен, и его удары обрушиваются на ваши силы так же неизбежно, как энтропия. Кажется, что каждый пораженный солдат распадается на однородную каплю углерода, некоторых металлов и медленно расширяющееся облако газов, хотя даже они быстро разлагаются на невидимые компоненты, прежде чем они тоже уничтожаются полностью. Это резко контрастирует с чудовищами, чьи сокрушительные удары обрушиваются вокруг вас. Каждый удар прикрывает перемещение их хозяина, позволяя использовать более сложные стратегии. Хотя звери демонстрируют множество эмоций, ни одна из этих эмоций не дает вам понимания, которое можно было бы прочитать, или слабостей, которыми можно было бы воспользоваться. Вам удается сбросить маску, но это мало помогает. Почерневшее, безглазое и безротое лицо этой живой тени мало что раскрывает, кроме неизбежных объятий всего сущего в объятиях Бездны. \n\nДаже когда ваши силы окружают вас и начинают догонять орду спектров, нет никаких сомнений в том, что это будет битва за ваше существование, борьба, которая подтолкнет вас к вашим пределам."
 POD_mummy_spell_of_life.670.effect.failure.desc:0 "Сладкое небытие Пустоты..."
 POD_mummy_spell_of_life.670.effect.success.desc:0 "Они все падают..."
 POD_mummy_spell_of_life.670.final_check:0 "Сравнит вашу военную мощь с силой спектров, чтобы определить окончательные результаты."
 POD_mummy_spell_of_life.670.t:0 "Святой поглощённых Тенью"
 POD_mummy_spell_of_life.68.a:0 "Эта руна туда подходит, теперь мне просто нужно..."
 POD_mummy_spell_of_life.68.desc:0 "После нескольких часов (?) боя вы, наконец, прикончите последнего зверя и заставите носителя косы отступить. Затем, всего за мгновение, его тело начинает смещаться, распушаться, искажаться, сморщиваться и складываться, пока оно просто... не исчезает. Когда вы переводите дыхание (по крайней мере, это успокаивающий жест), вы на мгновение оглядываетесь вокруг. Вы видите, как уничтожают последних спектров. Ваши солдаты уже начинают возводить оборону и укрепления, чтобы удерживать территорию, пока ваши люди не смогут ее должным образом защитить. \n\nНесколько дней спустя вы наблюдаете, как перед вами стабилизируются новые границы вашего личного [UmbraGlossary('shadow_realm')]. Его границы становятся четкими, отбрасывая вездесущие бури душ и полностью заявляя права на землю. Призраки готовы собрать и помочь любым мумиям, которые могут прибыть сюда. С этим пришло время вернуться домой и закончить последнюю часть Заклинания Жизни."
 POD_mummy_spell_of_life.68.t:0 "Наконец-то победа"
 POD_mummy_spell_of_life.70.a:0 "Спасибо, мой господин."
 POD_mummy_spell_of_life.70.desc:0 "Вы прибываете на аудиенцию к Гору. \"Приветствую, милорд. Я знаю, что вы подвергли сомнению мои действия и мотивы. Вы считаете, что я нарушил Принцип 6 вашего кодекса. В течение долгого времени я отслеживал все зацепки, связанные с Заклинанием Жизни, которое когда-то использовалось для создания нас, Шемсу-Геру. Я собрал различные исторические и магические записи, в которых сохранились некоторые подробности Заклинания. Я провел время в [umbra|E], чтобы определить правильную связь между [UmbraGlossary('shadow_realm')] и Заклинанием Жизни. Завершив исследование, я получил большую часть сохранившихся записей. Я намеренно искал альтернативные источники помимо вас, чтобы получить как можно более широкую коллекцию. Теперь я передаю все это вам на уничтожение и прошу стереть Заклинание Жизни из моих воспоминаний. \"\n\n На мгновение Гор сидит, тихо рассматривая вас. \"После первого нападения на вашу могилу я подумывал о нескончаемой череде нападений, пока вы не падете перед своими более лояльными братьями и ваши исследования не будут сожжены. Я рад, что отказался от этого, ведь сегодня вы искупили свою вину. Я благодарю вас за вашу службу и с радостью уничтожу эти записи. Однако ваши действия демонстрируют большую мудрость. Там, где многие другие потерпели неудачу, вы продемонстрировали, что можете ответственно использовать Заклинание Жизни. Хотя я запрещаю вам обучать Заклинанию других, я позволю вам сохранить воспоминания о нем и использовать его по своему усмотрению. Вы доказали, что достойны этого внимания. Я даже помогу усовершенствовать ваше Заклинание Жизни. Кроме того, я издам среди Шемсу-Геру указ о вашей защите, оберегая столь верного помощника в войне против Сета и предотвращая кражу ваших знаний. Молодец, мой добрый и верный слуга.\""
 POD_mummy_spell_of_life.70.desc.b:0 "Вы прибываете на аудиенцию к Гору. \"Приветствую, милорд. Как вы знаете, я потратил много времени на поиск всех зацепок, связанных с Заклинанием Жизни, которое когда-то использовалось для создания Шемсу-Геру. С вашей помощью я попытался понять Заклинание. Я собрал различные исторические и магические записи, в которых сохранились некоторые подробности Заклинания. Я провел время в [umbra|E], чтобы определить правильную связь между [UmbraGlossary('shadow_realm')] и Заклинанием Жизни. Завершив исследование, я получил большую часть сохранившихся записей. Теперь я передаю все это вам на уничтожение и прошу стереть Заклинание Жизни из моих воспоминаний. \"\n\n На мгновение Гор сидит, тихо рассматривая вас. \"Хотя я когда-то сомневался в целесообразности разрешения ваших поисков, теперь я вижу, что мое решение помочь вам в работе было правильным. Я благодарю вас за вашу службу и с радостью уничтожу эти записи. Однако ваши действия демонстрируют большую мудрость. Там, где многие другие потерпели неудачу, вы продемонстрировали, что можете ответственно использовать Заклинание Жизни. Хотя я запрещаю вам обучать Заклинанию других, я позволю вам сохранить воспоминания о нем и использовать его по своему усмотрению. Вы доказали, что достойны этого внимания. Я даже помогу усовершенствовать ваше Заклинание Жизни. Кроме того, я издам среди Шемсу-Геру указ о вашей защите, оберегая столь верного помощника в войне против Сета и предотвращая кражу ваших знаний. Молодец, мой добрый и верный слуга.\""
 POD_mummy_spell_of_life.70.t:0 "Милость Гора"
 POD_mummy_spell_of_life.71.a:0 "Я объявлю твое имя."
 POD_mummy_spell_of_life.71.desc:0 "\"Кто тревожит мой сон?\"\n\n\"Мой господин. Я здесь, чтобы предложить вам Заклинание Жизни, похищенное у выводка Гора.\"\n\n\"Вы преуспели там, где все прочие мои потомки потерпели неудачу. Что ж, вас ждёт награда.\"\n\n\"С-спасибо, мой господин.\"\n\nВы чувствуете рывок внутри разума, а затем — совершенную ясность и покой: к вашему сознанию присоединяется нечто новое.\n\n\"Малкав поступил глупо, уничтожив своё материальное тело, но и у более слабой формы связи есть преимущества. Теперь ваш разум един с моим, и вы сможете лучше служить мне. Вернитесь к своим собратьям. Напомните им об их предназначении и подготовьте путь для меня. Моё пробуждение близко. Я вернусь во главе великого воинства Бессмертных, чтобы вознаградить верных и проклясть врагов.\""
 POD_mummy_spell_of_life.71.t:0 "Вестник Сета"
 POD_mummy_spell_of_life.72.a:0 "Остаётся лишь пировать! Пировать! ПИРОВАТЬ!"
 POD_mummy_spell_of_life.72.desc:0 "Вы насыщаетесь ужасом, страданиями и агонией своих пленников. При этом вы чувствуете странную связь через дух, который слился с вами. Ваше знание Заклинания Жизни течет через ваш разум и по этой связи к вашему скрытому хозяину. \n\nПосле завершения передачи странные вибрации распространяются по миру, когда баланс рушится. Чистая ярость, безумие и злоба проникают в смертных по всему миру. Их наполняет мучительный голод, жадность и похоть. Безнадежность поглощает их, заставляя искать удовлетворения перед неизбежным крахом всего. Губители сливаются с душами смертных, как и вы когда-то, трансформируя их с помощью недавно завершенного Заклинания Жизни. Вы можете почувствовать, как шторм без сравнения проносится через [UmbraGlossaryLocalized('shadowlands','Загробный мир')]. Бесконечные осколки джиннов и душ проскальзывают сквозь барьер, позволяя вам насытиться ими. В [UmbraGlossary('pod_realm_labyrinth')] прорываются дыры, позволяя армиям спектров несравненных размеров выйти наружу. Среди хаоса пробуждаются древние потомки и слуги вашего хозяина. Ваш хозяин поднимается из-под [UmbraGlossary('well_of_the_void')], пробуждаясь, чтобы поглотить сам мир."
 POD_mummy_spell_of_life.72.t:0 "Последний пир"
 POD_mummy_spell_of_life.80.a:0 "Выбрать это название."
 POD_mummy_spell_of_life.80.b:0 "Придерживайтесь имени по умолчанию #italic ([GetPlayer.Custom('PODGetDefaultCustomMummyDynastyName')])#!."
 POD_mummy_spell_of_life.80.desc:0 "После вашего успеха пришло время назвать вашу новую династию #TOOLTIP:GAME_TRAIT,mummy,[GetNullCharacter]  #L Бессмертных#!#!. Шемсу-Геру получили от Гора бессмертие и следовали его кодексу. Кабири были созданы Заклинанием Жизни Кабира. Апепну были созданы ошибочными ритуалами Сета. \n\nКак вы хотите назвать тех, кому вы даруете вечное возрождение через свою версию Заклинания? Возможно, вы назовете себя Инанна-эне или Бальдаром в честь богов, которые умерли и возродились заново. Возможно, вы назовете себя в честь групп, практиковавших мумификацию, таких как болотные или дымовые мумии, или в честь проклятых странников из бесчисленных сказок. Возможно, вы назовете себя в честь нетленных святых, монахов-аскетов и великих алхимиков, от Баруха до Терезы и от Сокушинбуцу до Фламеля, чьи тела никогда не разлагались и которые, как говорят некоторые, все еще ходят среди нас. Есть много имен, которые вы могли бы использовать."
 POD_mummy_spell_of_life.80.t:0 "Новое имя"
 POD_mummy_spell_of_life.81.a:0 "Выбрать это название."
 POD_mummy_spell_of_life.81.b:0 "Придерживайтесь имени по умолчанию #italic ([GetPlayer.Custom('PODGetDefaultCustomMummyDynastyShadowRealm')])#!."
 POD_mummy_spell_of_life.81.desc:0 "После вашего успеха пришло время назвать ваш новый [UmbraGlossary('shadow_realm')]. После своей смерти Шемсу-Геру возвращаются в [UmbraGlossaryLocalized('dark_kingdom_of_sand','Аменти')], пока не возродятся заново. Кабири отправляются в [UmbraGlossary('hades')].\n\nТеперь, когда вы создали свое собственное царство, как вы хотите назвать это царство, куда души ваших последователей будут возвращаться для отдыха между перерождениями? Возможно, вы назовете его Хельхейм, Шеол, Йоми, Иркалла, Туонела, Зеленые острова, Обитель Песни, Горы Бессмертных, Преисподняя, ​​Лимбо, Зал ожидания, Земля возвращения или Залы покоя. Есть много загробных жизней и имен, которые вы можете использовать."
 POD_mummy_spell_of_life.81.t:0 "Новое Царство"
 POD_mummy_spell_of_life.82.a:0 "Провозгласите наш новый путь!"
 POD_mummy_spell_of_life.82.alignment:0 "Направленность"
 POD_mummy_spell_of_life.82.b:0 "Более простой путь подойдет..."
 POD_mummy_spell_of_life.82.b.tt:0 "Вы оформляете [GetFaithByKey('custom_mummy_dynasty').GetName] [faith|E]:"
 POD_mummy_spell_of_life.82.desc:0 "Благодаря вашему успеху пришло время построить путь, который поведет ваших последователей в будущее, кодекс, который будет управлять их действиями, позицию, которая определит их место в Войне за Равновесие, землю, которую они назовут своим домом. Выбирайте мудро, ведь ваши слова будут высечены в камне и неизменны на протяжении веков."
 POD_mummy_spell_of_life.82.flexibility:0 "Гибкость"
 POD_mummy_spell_of_life.82.framework:0 "Рамочная основа"
 POD_mummy_spell_of_life.82.mummy_caveat:0 "Примите [decision|E] «$spell_of_life_find_new_home_decision$», чтобы присоединиться к новой династии."
 POD_mummy_spell_of_life.82.practice:0 "Практика"
 POD_mummy_spell_of_life.82.radical:0 "Радикальный"
 POD_mummy_spell_of_life.82.splat_caveat:0 "Только $POD_splat_mummy_plural$ могут присоединиться к вашей новой династии. Возможно, вы могли бы стать одним из них..."
 POD_mummy_spell_of_life.82.t:0 "Новый путь"
 POD_mummy_spell_of_life_42_b_note:0 "Ваш шанс на успех увеличивается, если судьи сильнее вас."
 POD_mummy_spell_of_life_bound_wraith_strength_bonus:0 "Получите силу за каждого связанного призрака."
 POD_mummy_spell_of_life_cabiri:0 "Получите возможность создавать мумии Кабири."
 POD_mummy_spell_of_life_cant_teach_spell_of_life:0 "Больше не может обучать Заклинанию Жизни."
 POD_mummy_spell_of_life_custom_mummy_dynasty:0 "Получите возможность создавать мумии новой династии."
 POD_mummy_spell_of_life_hades_start_battle_tt:0 "Военная мощь [umbra|E] и #TOOLTIP:GAME_TRAIT,spectre,[GetNullCharacter] #L Спектров#!#! #italic оценивается#! в #V 1800#!"
 POD_mummy_spell_of_life_independent_start_battle_tt:0 "Военная мощь [umbra|E] и #TOOLTIP:GAME_TRAIT,spectre,[GetNullCharacter] #L Спектров#!#! #italic оценивается#! в #V 2300#!"
