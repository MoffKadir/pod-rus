 POD_mummy_spell_of_life_make_only_shemsuheru:0 "Теперь ваше Заклинание Жизни создаёт Шемсу-Геру, если ещё не делало этого."
 POD_mummy_spell_of_life_shemsu_heru:0 "Получите возможность создавать мумии Шемсу-Геру."
 POD_mummy_spell_of_life_stage4_umbra_battles_strengths:0 "#clickable Ваша текущая военная мощь [GetPlayer.MakeScope.GetVariable('character_shadow_realm_force').GetValue|V0]\nВоенная мощь [umbra|E] и #TOOLTIP:GAME_TRAIT,spectre,[GetNullCharacter] #L Спектров#!#! оценивается в [GetPlayer.MakeScope.GetVariable('spectre_shadow_realm_force').GetValue|V0]#!\n\n"
 POD_mummy_spell_of_life_total_intrigue_check:0 "Совокупное значение [intrigue|E] вашей [coterie|E] будет сравнено с вражеским. Противник получает бонус за масштаб влияния, определяемый распространением его [faith|E]."
 POD_mummy_spell_of_life_total_learning_check:0 "Совокупное значение [learning|E] вашей [coterie|E] будет сравнено с вражеским. Противник получает бонус за масштаб влияния, определяемый распространением его [faith|E]."
 POD_mummy_spell_of_life_total_prowess_check:0 "Совокупное значение [prowess|E] вашей [coterie|E] будет сравнено с вражеским. Противник получает бонус за масштаб влияния, определяемый распространением его [faith|E]."
 POD_mummy_spell_of_life_total_stewardship_check:0 "Совокупное значение [stewardship|E] вашей [coterie|E] будет сравнено с вражеским. Противник получает бонус за масштаб влияния, определяемый распространением его [faith|E]."
 POD_newborn_mummy_modifier:0 "Новорожденный"
 POD_newborn_mummy_modifier_desc:0 "#help Будет потерян после смерти#!\nВы новичок в мире $POD_splat_mummy_plural$. Вы еще не прошли цикл перерождения и не провели много времени в своей новой форме."
 blessing_of_horus_modifier:0 "Благословение Гора"
 blessing_of_horus_modifier_desc:0 "В награду за вашу выдающуюся службу и преданность Гор благословил вас великой силой, которая возрастает вместе с вашим рвением и преданностью."
 faith_route_tooltip:0 "Использовать #TOOLTIP:GAME_TRAIT,beatific,[GetNullCharacter] #L свою веру#!#!, чтобы временно стать смертным, прежде чем применять магию мумификации."
 herald_of_set_modifier:0 "Вестник Сета"
 herald_of_set_modifier_desc:0 "Имеющий уши да слышит. Пришествие нашего Владыки Сета близко. Все вы, неверные, трепещите и отчаивайтесь."
 recreate_setite_empire_effect_tooltip:0 "С помощью Сета вы воссоздаете Империю Сетитов [title|E]."
 request_access_writings_cabirus_decision:0 "Запросить доступ к тайным писаниям Кабируса"
 request_access_writings_cabirus_decision_confirm:0 "Узнаем цену"
 request_access_writings_cabirus_decision_desc:0 "Чтобы продолжить наши исследования способов вечного возрождения, нам понадобится доступ к Тайным Писаниям Кабируса. К счастью, мы можем либо убедить их нынешнего владельца, либо использовать наше влияние, чтобы потребовать доступа. Однако они могут потребовать плату за такой доступ."
 request_access_writings_cabirus_decision_effect:0 "Получите доступ к [GetPODArtifactName('writings_cabirus_link')]"
 request_access_writings_cabirus_decision_tooltip:0 "Возможно, мы могли бы запросить доступ, а не воровать его."
 set_mind_control_tooltip:0 "Ваша личность меняется, когда разум Сета поглощает ваш."
 sets_herald_tooltip:0 "Все [GetTrait('setite').GetName(GetNullCharacter)] и поклонники Сета будут иметь более высокий шанс принять вассальную зависимость от вас."
 spell_of_life_abandon_vampirism_decision:0 "Откажитесь от вампиризма ради вечного возрождения"
 spell_of_life_abandon_vampirism_decision.second_step:0 "Как я этого добьюсь?"
 spell_of_life_abandon_vampirism_decision.tt.faith_route:0 "Через мою веру\n#low $spell_of_life_abandon_vampirism_decision.tt.faith_route_desc$#!"
 spell_of_life_abandon_vampirism_decision.tt.faith_route_desc:0 "Стать смертным на время"
 spell_of_life_abandon_vampirism_decision.tt.mummy_maker_betrays:0 "Вас предали, и вы остались призраком"
 spell_of_life_abandon_vampirism_decision.tt.vampgen:0 "Проклятие Каина пытается и безуспешно испортить магию."
 spell_of_life_abandon_vampirism_decision.tt.wraith_maker_betrays:0 "Вас предали, оставив вас связанным призраком"
 spell_of_life_abandon_vampirism_decision.tt.wraith_maker_succeeds:0 "Воскрешение удалось, но вы остались призраком."
 spell_of_life_abandon_vampirism_decision.tt.wraith_route:0 "Через существование призраком\n#low $spell_of_life_abandon_vampirism_decision.tt.wraith_route_desc$#!"
 spell_of_life_abandon_vampirism_decision.tt.wraith_route_desc:0 "Временно станьте призраком"
 spell_of_life_abandon_vampirism_decision_beatific_xp:0 "Есть #color_white 100#! [GetTrait('beatific').GetName(GetNullCharacter)] [trait_level_track_xp|E]"
 spell_of_life_abandon_vampirism_decision_confirm:0 "Начните ритуал"
 spell_of_life_abandon_vampirism_decision_crazy:0 "Нужно быть безумцем, ненавидеть себя или быть фанатиком"
 spell_of_life_abandon_vampirism_decision_desc:0 "Хотя вампиризм может иметь некоторые преимущества, он несет в себе множество проклятий. Однако ваши знания предлагают альтернативную форму бессмертия, которая дает меньше недостатков: вечное возрождение. \n\nК сожалению, нежить, подобная вампирам, не может стать мумией. Кроме того, вампиры не могут использовать магию, подобную Заклинанию Жизни. Таким образом, вам нужно будет найти способ обойти такие проблемы... и определить, готовы ли вы это сделать. В конце концов, вы должны умереть во время ритуала, поэтому вам нужно будет найти доверенного человека для его выполнения. \n\n#warning Если вы выживете, вы станете Мумией, которая радикально изменит ваш игровой процесс, выведет из строя ваши здания и потенциально уничтожит ваши титулы в высших мирах. \n Это может нанести вред вашей кампании, если вы к этому не готовы. #!"
 spell_of_life_abandon_vampirism_decision_effects:0 "Если вас не предали #weak (определяется мнением о вас некроманта и заклинателя) #!, вы станете Мумией"
 spell_of_life_abandon_vampirism_decision_hates_being_vampire:0 "Ненавижу быть [GetTrait('vampire').GetName(GetNullCharacter)]"
 spell_of_life_abandon_vampirism_decision_kemintiri:0 "[GetScriptedCharacterByHistoryID('790512').GetFirstName] обладает уникальным пониманием магии Мумии, что дает [GetScriptedCharacterByHistoryID('790512').GetHerHim] преимущество после вступления в их ряды."
 spell_of_life_abandon_vampirism_decision_religion:0 "Должен следовать религии, которая отдает приоритет экспериментам или рассматривает вампиризм как проклятие."
 spell_of_life_abandon_vampirism_decision_sh_mode:0 "Нужно считать смешение сверхъестественных видов интересным и возможным"
 spell_of_life_abandon_vampirism_decision_sol_knower:0 "По крайней мере #color_white 1#! [courtier|E] должен знать Заклинание Жизни или эликсир вечной жизни."
 spell_of_life_abandon_vampirism_decision_sol_knower_ex:0 "$spell_of_life_abandon_vampirism_decision_sol_knower$ #weak ([mummy_maker.GetFirstName])#!"
 spell_of_life_abandon_vampirism_decision_sol_learner:0 "По крайней мере, #color_white 1#! [courtier|E] должны быть способны понимать Заклинание Жизни или эликсир вечной жизни (в зависимости от того, чему вы можете их научить)."
 spell_of_life_abandon_vampirism_decision_sol_learner_ex:0 "$spell_of_life_abandon_vampirism_decision_sol_learner$ #weak ([mummy_maker.GetFirstName])#!"
 spell_of_life_abandon_vampirism_decision_tooltip:0 "У вампиризма много проклятий, но существуют альтернативные источники бессмертия."
 spell_of_life_abandon_vampirism_decision_wraith_summoner:0 "По крайней мере, #color_white 1#! [courtier|E] может вызвать призрака."
 spell_of_life_abandon_vampirism_decision_wraith_summoner_ex:0 "$spell_of_life_abandon_vampirism_decision_wraith_summoner$ #weak ([wraith_maker.GetFirstName])#!"
 spell_of_life_correcting_your_form_decision:0 "Исправление вашей формы"
 spell_of_life_correcting_your_form_decision_confirm:0 "Ничто не удержит меня"
 spell_of_life_correcting_your_form_decision_desc:0 "Вы получили увеличенную продолжительность жизни благодаря неполной форме магии, дарующей бессмертие. По мере расширения ваших знаний о магии появляется возможность исправить свою испорченную форму и улучшить текущий источник бессмертия. К сожалению, такая магия позволяет вам только улучшить свою собственную форму, а не улучшать несовершенные тела других."
 spell_of_life_correcting_your_form_decision_tooltip:0 "Ваше бессмертие нуждается в некоторых улучшениях."
 spell_of_life_coterie_diplomacy_duel:0 "[diplomacy_i] [GetPlayer.Custom('PODCoterie')] [diplomacy|E] Задача:"
 spell_of_life_coterie_intrigue_duel:0 "[intrigue_i] [GetPlayer.Custom('PODCoterie')] [intrigue|E] Задача:"
 spell_of_life_coterie_learning_duel:0 "[learning_i] [GetPlayer.Custom('PODCoterie')] [learning|E] Задача:"
 spell_of_life_coterie_martial_duel:0 "[martial_i] [GetPlayer.Custom('PODCoterie')] [martial|E] Задача:"
 spell_of_life_coterie_prowess_duel:0 "[prowess_i] [GetPlayer.Custom('PODCoterie')] [prowess|E] Задача:"
 spell_of_life_coterie_stewardship_duel:0 "[stewardship_i] [GetPlayer.Custom('PODCoterie')] [stewardship|E] Задача:"
 spell_of_life_decision_must_know_sol:0 "Знать полное Заклинание Жизни #weak (Имейте 100 [trait_level_track_xp|E] в $trait_track_spell_of_life$ [GetTrait('eternal_rebirth_seeker').GetName(GetNullCharacter)])#!"
 spell_of_life_ending_the_hunt_decision:0 "Завершить охоту"
 spell_of_life_ending_the_hunt_decision_confirm:0 "Наконец-то мир..."
 spell_of_life_ending_the_hunt_decision_custom1:0 "Не должно быть #TOOLTIP:GAME_TRAIT,eternal_rebirth_seeker,[GetNullCharacter] #L Искателей Заклинания Жизни#!#!, которые не являются $POD_splat_mummy_plural$, не являются безмозглыми и не являются вашими членами [friend|E], [best_friend|E], [coterie|E], [lover|E] или [soulmate|E]."
 spell_of_life_ending_the_hunt_decision_custom1_ex:0 "$spell_of_life_ending_the_hunt_decision_custom1$ #weak ([example.GetFirstName])#!"
 spell_of_life_ending_the_hunt_decision_custom2:0 "У вас должно быть больше [prowess|E], чем [GetScriptedCharacterByHistoryID('505094').GetFirstName] #weak (#V [GetPlayer.GetProwess]#! vs #V [GetScriptedCharacterByHistoryID('505094').GetProwess]#!)#!"
 spell_of_life_ending_the_hunt_decision_desc:0 "Слишком многие ищут вашу голову, ваши знания или и то, и другое. Если бы вы могли устранить лидеров самых могущественных фракций и большинство искателей, вы могли бы положить конец этой угрозе своему существованию. Вам больше не придется постоянно оглядываться через плечо, ожидая, пока следующая группа выследит вас. В качестве дополнительного преимущества смерть таких ключевых фигур повергнет их фракции в хаос, оставив вам возможность укрепить свою власть."
 spell_of_life_ending_the_hunt_decision_remove_eternally_hunted:0 "Все последователи вашей веры больше не будут [GetModifier('hunted_down_eternity_modifier').GetNameWithTooltip]."
 spell_of_life_ending_the_hunt_decision_tooltip:0 "Может ли охота наконец закончиться?"
 spell_of_life_establish_ourselves_decision:0 "Пятая династия"
 spell_of_life_establish_ourselves_decision_confirm:0 "Мы Пятая Династия!"
 spell_of_life_establish_ourselves_decision_custom1:0 "Должно быть как минимум #V 25#! округов с [GetFaithByKey('custom_mummy_dynasty').GetName] [faith|E]."
 spell_of_life_establish_ourselves_decision_custom2:0 "Должно существовать не менее #V 5#! [GetTrait('custom_mummy_dynasty').GetName(GetPlayer)] $POD_splat_mummy$ правителей."
 spell_of_life_establish_ourselves_decision_desc:0 "Мы заново открыли для себя Заклинание Жизни. Мы создали новый [UmbraGlossary('shadow_realm')], [GetPlayer.Custom('PODGetCustomMummyDynastyShadowRealm')]. Мы основали [GetTrait('custom_mummy_dynasty').GetName(GetPlayer)] на основе этого заклинания, базирующегося в этом мире. Однако Шемсу-Геру, Ишмаэлиты, Кабири и Апепну считают нас не более чем выскочками, вмешивающимися в игру, которую мы слишком молоды, чтобы понять. \n\nКак мало они знают. Мы превзойдем древних дураков. Мы докажем, что достойны быть причисленными к их числу!"
 spell_of_life_establish_ourselves_decision_effect1:0 "Все [GetTrait('custom_mummy_dynasty').GetName(GetPlayer)] $POD_splat_mummy_plural$ получат [GetModifier('custom_mummy_dynasty_secured_future_modifier').GetNameWithTooltip]"
 spell_of_life_establish_ourselves_decision_tooltip:0 "Сегодня выскочки. Завтра, победители!"
 spell_of_life_find_new_home_decision:0 "Поиск нового дома"
 spell_of_life_find_new_home_decision_confirm:0 "К новым начинаниям!"
 spell_of_life_find_new_home_decision_desc:0 "После долгих исследований вы получили версию «Заклинания Жизни». Однако он предназначен для привязки душ к другому [UmbraGlossary('shadow_realm')], отличному от того, куда вы отправляетесь после смерти. Хотя вы не можете модифицировать Заклинание Жизни, чтобы использовать тот же [UmbraGlossary('shadow_realm')], что и ваша собственная душа, у вас должна быть возможность повторно привязать свою душу к другому миру, наложив на себя Заклинание Жизни с небольшой модификацией."
 spell_of_life_find_new_home_decision_tooltip:0 "Ваше Заклинание Жизни связано с другим Царством Теней, отличным от вашей собственной души."
 spell_of_life_give_to_apophis_decision:0 "Преподнести мир на золотом блюде"
 spell_of_life_give_to_apophis_decision_confirm:0 "Конец наступил."
 spell_of_life_give_to_apophis_decision_desc:0 "[UmbraGlossaryLocalized('oblivion','Апофис')] ищет Заклинание Жизни. Подайте Заклинание на пиру и наблюдайте, как мир поглощается магией Заклинания Жизни. Пришло время [UmbraGlossaryLocalized('oblivion','Апофис')] насладиться миром."
 spell_of_life_give_to_apophis_decision_prisoners:0 "Получите не менее #color_white 25#! пленников с не менее #color_white 50#! [prowess|E], чтобы полакомиться ими."
 spell_of_life_give_to_apophis_decision_tooltip:0 "Пир Апофиса"
 spell_of_life_give_to_horus_decision:0 "Передать Заклинание Жизни Гору"
 spell_of_life_give_to_horus_decision_confirm:0 "Попросить аудиенцию"
 spell_of_life_give_to_horus_decision_desc:0 "Принцип 6 Кодекса Гора запрещает использование Заклинания Жизни или создание новых мумий. Если бы вы были верным последователем Гора, вы бы передали ему все свои исследования и позволили бы ему удалить знания из ваших воспоминаний. Такой подарок, скорее всего, искупит вас в его глазах за любые совершенные вами запрещенные действия. Кроме того, Гор всегда награждал великие дела в соответствии с оказанными услугами."
 spell_of_life_give_to_horus_decision_tooltip:0 "Верный Шемсу-Геру сдаст свое Заклинание Жизни."
 spell_of_life_give_to_kemintiri_decision:0 "Используйте Заклинание Жизни на Кеминтири."
 spell_of_life_give_to_kemintiri_decision_confirm:0 "Давайте поговорим с последней жрицей Исиды."
 spell_of_life_give_to_kemintiri_decision_desc:0 "Когда-то Кеминтири была жрицей Исиды, но Сет даровал ей Становление только для того, чтобы наказать ее за верность. С того момента она провела значительное количество времени в охоте на Сетитов. Верная учению Исиды, она не желала давать вам Заклинание Жизни только ради себя. Однако, учитывая вашу дружбу с ней и ваши новые знания о Заклинании, не составит труда убедить ее позволить вам наложить на нее Заклинание Жизни."
 spell_of_life_give_to_kemintiri_decision_tooltip:0 "Становление некогда было для Кеминтири пыткой. Возможно, она заинтересуется способом избавиться от вампиризма."
 spell_of_life_give_to_set_decision:0 "Отдать Заклинание Жизни Сету"
 spell_of_life_give_to_set_decision_confirm:0 "Я слуга Сета"
 spell_of_life_give_to_set_decision_desc:0 "Сет провел тысячелетия в поисках Заклинания Жизни и придумал невероятное количество заговоров, чтобы украсть его. Там, где он потерпел неудачу, вы преуспели и теперь у вас есть возможность дать ему это. Если вы достаточно услужливы, он будет вам благодарен и щедро вознаградит вас, а не накажет из ревности."
 spell_of_life_give_to_set_decision_tooltip:0 "Сет ищет Заклинание Жизни, и у вас есть возможность отдать его ему."
 spell_of_life_joining_the_league_decision:0 "Вступление в Лигу"
 spell_of_life_joining_the_league_decision_confirm:0 "Спасибо за прием"
 spell_of_life_joining_the_league_decision_custom1:0 "Не должно быть [GetTrait('shemsuheru').GetName(GetPlayer)] $POD_splat_mummy_plural$ из [GetFaithByKey('code_of_horus').GetName] [faith|E], чей [opinion|E] о вас ниже #V 25#!"
 spell_of_life_joining_the_league_decision_custom1_ex:0 "$spell_of_life_joining_the_league_decision_custom1$ #weak ([example.GetFirstName])#!"
 spell_of_life_joining_the_league_decision_desc:0 "Несмотря на поддержку его дела, Гор не простит вашего существования. Однако альтернативы существуют. \n\nКогда он в последний раз отсутствовал какое-то время, его последователи развратились и начали проигрывать войну. Если это произойдет снова, они встретят вас с распростертыми объятиями, а по возвращении Гор, возможно, не захочет вас изгонять. Возможно, вы могли бы ускорить такие дела."
 spell_of_life_joining_the_league_decision_tooltip:0 "Нам следует рассмотреть возможность вступления в Осирианскую Лигу."
 spell_of_life_preserving_roots_decision:0 "Сохранение наших корней"
 spell_of_life_preserving_roots_decision_confirm:0 "Остаться в памяти смертных"
 spell_of_life_preserving_roots_decision_custom1:0 "Не менее #V 10#! графств должны иметь вашу [culture|E]"
 spell_of_life_preserving_roots_decision_custom2:0 "Должно существовать не менее #V 5#! $POD_splat_mummy$ правителей вашей [culture|E]"
 spell_of_life_preserving_roots_decision_desc:0 "[GetPlayer.Custom('PODGetCustomMummyDynastyShadowRealm')] был основан на определенной культуре на определенной земле, придав эти характеристики [GetTrait('custom_mummy_dynasty').GetName(GetPlayer)] и необратимо привязав [UmbraGlossary('shadow_realm')] к этой конкретной культурной памяти. Однако с каждым годом то, что когда-то было великой цивилизацией, постепенно теряется в песках времени. Мы не можем этого допустить, поскольку именно наши воспоминания делают нас людьми и сохраняют наш новый дом."
 spell_of_life_preserving_roots_decision_effect1:0 "[GetTrait('custom_mummy_dynasty').GetName(GetPlayer)] $POD_splat_mummy_plural$ воскреснет в два раза быстрее #weak (5 лет вместо 10)#!"
 spell_of_life_preserving_roots_decision_tooltip:0 "Придать сил сердцам"
 spell_of_life_stabilize_new_realm_decision:0 "Стабилизировать [GetPlayer.Custom('PODGetCustomMummyDynastyShadowRealm')]"
 spell_of_life_stabilize_new_realm_decision_confirm:0 "Я возьму судейский молоток"
 spell_of_life_stabilize_new_realm_decision_desc:0 "В отличие от более авторитетного [UmbraGlossaryLocalized('dark_kingdom_of_sand','Аменти')], вашему недавно основанному [UmbraGlossary('shadow_realm')] не хватает стабильности. Воскрешение — опасное путешествие со многими рисками. Без судей могут появляться новые Бессмертные и действовать без надзора. [GetPlayer.Custom('PODGetCustomMummyDynastyShadowRealm')] должен быть стабилизирован."
 spell_of_life_stabilize_new_realm_decision_effect1:0 "Все [GetTrait('custom_mummy_dynasty').GetName(GetPlayer)] $POD_splat_mummy_plural$ больше не будут получать двойную потерю памяти после смерти."
 spell_of_life_stabilize_new_realm_decision_effect2:0 "Все [GetTrait('custom_mummy_dynasty').GetName(GetPlayer)] $POD_splat_mummy_plural$ получат [GetTrait('integrity').GetName(GetNullCharacter)]"
 spell_of_life_stabilize_new_realm_decision_faith_followers:0 "У [GetFaithByKey('custom_mummy_dynasty').GetName] есть как минимум 10 последователей."
 spell_of_life_stabilize_new_realm_decision_tooltip:0 "Наше место для покоя"
 spell_of_life_stabilize_new_realm_decision_wraith_friends:0 "Имеет не менее 5 [GetTrait('wraith').GetName(GetNullCharacter)] [friends|E] или других положительных [relations|E]."
 spell_of_life_stage1_cabirus_phase1_decision:0 "Прочтите тайные писания Кабируса."
 spell_of_life_stage1_cabirus_phase1_decision_alt_confirm:0 "Мало какие знания утрачены безвозвратно."
 spell_of_life_stage1_cabirus_phase1_decision_alt_desc:0 "«Тайные писания Кабируса» когда-то представляли собой полную, но плохо переведенную версию оригинальной книги Кабируса. Перед своим разрушением они описали внутреннюю работу [Concept('POD_spell_of_life', 'Заклинание Жизни')|E] Осириса и могли бы дать некоторые полезные сведения, поэтому Гор позаботился о его уничтожении. \n\nХотя оригинальная рукопись утеряна, фрагменты сохранились в виде истлевших папирусов, поврежденных пергаментов, палимпсестов, выдержек на черепках, надписей на разрушающихся зданиях, устных записей, учебников магов и лекционарии, комментарии и записанные дебаты. Если будет собрано достаточное количество материалов, правильная текстовая критика может позволить реконструировать сочинения Кабируса. $spell_of_life_stage1_do_multiple_stages$"
 spell_of_life_stage1_cabirus_phase1_decision_confirm:0 "Означает ли \"ebol\" \"выход \" или \"смерть\"?"
 spell_of_life_stage1_cabirus_phase1_decision_desc:0 "«Тайные писания Кабируса» представляют собой полную, но плохо переведенную версию оригинальной книги Кабируса. Тем не менее, они описывают внутреннюю работу [Concept('POD_spell_of_life', 'Заклинание Жизни')|E] Осириса и могли бы дать некоторые полезные сведения, если бы у нас был к ним доступ и знания для его использования. $spell_of_life_stage1_do_multiple_stages$ $spell_of_life_stage1_warning$"
 spell_of_life_stage1_cabirus_phase1_decision_tooltip:0 "Если бы мы могли перевести сочинения Кабируса, мы могли бы получить некоторое представление."
 spell_of_life_stage1_cabirus_phase1_decision_university:0 "На одном из ваших [counties|E] установлены университетские [building|E], [GetBuilding('black_college_01').GetName], [GetBuilding('library_malta_01').GetName], [GetBuilding('vienna_chantry_01').GetName], [GetBuilding('erciyes_01').GetName] или одна из их улучшенных версий."
 spell_of_life_stage1_cabirus_phase1_decision_writing_access:0 "Иметь доступ к [GetPODArtifactName('writings_cabirus_link')]"
 spell_of_life_stage1_cabirus_phase2_decision:0 "Поговорите с Кабирусом"
 spell_of_life_stage1_cabirus_phase2_decision_confirm:0 "Давайте поговорим с ним"
 spell_of_life_stage1_cabirus_phase2_decision_desc:0 "Книги не могут конкурировать с первоначальным автором. Если бы мы смогли убедить [GetScriptedCharacterByHistoryID('792600').GetFirstName] помочь нам, обратившись к его академической стороне, мы могли бы многое узнать о [Concept('POD_spell_of_life', 'Заклинание Жизни')|E]. При этом нам нужно больше узнать о магии, если мы надеемся понять его уроки."
 spell_of_life_stage1_cabirus_phase2_decision_tooltip:0 "Книги не могут конкурировать с оригиналом."
 spell_of_life_stage1_cabirus_phase3_decision:0 "Ослабить давление"
 spell_of_life_stage1_cabirus_phase3_decision_confirm:0 "Вернемся к нашим урокам"
 spell_of_life_stage1_cabirus_phase3_decision_desc:0 "Соседние Тремеры отнимают слишком много времени Кабируса в своих поисках бессмертия, заставляя его постоянно двигаться. Если бы мы ослабили их влияние, у него могло бы быть больше времени, чтобы помочь нам, хотя его беспокойство по поводу Гора не позволит ему дать нам полное Заклинание Жизни."
 spell_of_life_stage1_cabirus_phase3_decision_effect:0 "Со временем ваши отношения с ним могут позволить вам войти в [UmbraGlossary('hades')]."
 spell_of_life_stage1_cabirus_phase3_decision_no_emperor_requirement:0 "Никакой #TOOLTIP:GAME_TRAIT,tremere,[GetNullCharacter] #L Тремер#!#! или последователь [GetReligionByKey('codeoftremere_religion').GetName] [faith|E] не может владеть Империей [title|E]"
 spell_of_life_stage1_cabirus_phase3_decision_tooltip:0 "Кабирус находится под слишком сильным давлением со стороны Тремеров."
 spell_of_life_stage1_decision_completion_message_desc:0 "Вы открыли следующую цель на этом пути."
 spell_of_life_stage1_decision_completion_message_title:0 "Ваше понимание углубляется"
 spell_of_life_stage1_do_multiple_stages:0 "#help \n\nХотя это и сложнее, вы можете обнаружить, что завершение пути предлагает дополнительные награды на более позднем этапе.#!"
 spell_of_life_stage1_hide_requirement:0 ""
 spell_of_life_stage1_horus_phase1_decision:0 "Добиться аудиенции"
 spell_of_life_stage1_horus_phase1_decision_alexandria:0 "Вы или [GetScriptedCharacterByHistoryID('792593').GetFirstName] [completely_control|E] [GetTitleByKey('d_alexandria').GetNameNoTier]"
 spell_of_life_stage1_horus_phase1_decision_cairo:0 "Вы или [GetScriptedCharacterByHistoryID('792593').GetFirstName] [completely_control|E] [GetTitleByKey('d_cairo').GetNameNoTier]"
 spell_of_life_stage1_horus_phase1_decision_confirm:0 "Мы дарим вам... Верхний Египет!"
 spell_of_life_stage1_horus_phase1_decision_delta:0 "Вы или [GetScriptedCharacterByHistoryID('792593').GetFirstName] [completely_control|E] [GetTitleByKey('d_delta').GetNameNoTier]"
 spell_of_life_stage1_horus_phase1_decision_desc:0 "Принцип 6 Кодекса Гора гласит: \"Старайтесь не создавать других, подобных нам. \" Убедить его нарушить Кодекс практически невозможно. Однако преимущества невыразимы, поскольку он является единственным владельцем полного и безупречного [Concept('POD_spell_of_life', 'Заклинание Жизни')|E]. Прежде чем мы сможем убедить его, нам нужно заслужить у него аудиенцию. Возможно, подарок подойдет. $spell_of_life_stage1_do_multiple_stages$ $spell_of_life_stage1_warning$"
 spell_of_life_stage1_horus_phase1_decision_tooltip:0 "Чтобы убедить Гора, нам нужно заслужить у него аудиенцию."
 spell_of_life_stage1_horus_phase2_decision:0 "Великий спор"
 spell_of_life_stage1_horus_phase2_decision_confirm:0 "Отправиться к его двору"
 spell_of_life_stage1_horus_phase2_decision_desc:0 "Если мы сможем подружиться с Гором, нашего дара или предыдущей услуги будет достаточно, чтобы завоевать у него аудиенцию. Это будет нелегко, но никто не знает о [Concept('POD_spell_of_life', 'Заклинание Жизни')|E] больше, чем он."
 spell_of_life_stage1_horus_phase2_decision_tooltip:0 "Наш дар принёс нам аудиенцию. Воспользуемся ею сполна."
 spell_of_life_stage1_horus_phase3_bonus_xp:0 "Каждый раз, когда вы завершаете [journey|E], прозрения Гора дают #color_white 5.00#! дополнительных [trait_level_track_xp|E] в Заклинании Жизни #weak ([GetTrait('eternal_rebirth_seeker').GetName( GetPlayer )])#!."
 spell_of_life_stage1_horus_phase3_decision:0 "Доказать свою достойность"
 spell_of_life_stage1_horus_phase3_decision_confirm:0 "И вот песок стал красным..."
 spell_of_life_stage1_horus_phase3_decision_desc:0 "Наши аргументы убедили Гора, соизволив предоставить нам возможность доказать, что мы верные союзники его делу. Дети Сета и предатели должны пасть перед нашим клинком. Только тогда Гор поможет нам в поисках Заклинания Жизни, хотя и не даст нам всего. Только приобретя его самостоятельно, мы можем продемонстрировать, что достойны его использовать."
 spell_of_life_stage1_horus_phase3_decision_effect:0 "Со временем ваши отношения с ним могут позволить вам войти в [UmbraGlossaryLocalized('dark_kingdom_of_sand','Аменти')]."
 spell_of_life_stage1_horus_phase3_decision_no_emperor_requirement:0 "Никакой #TOOLTIP:GAME_TRAIT,setite,[GetNullCharacter] #L Сетит#!#! или последователь [faith|E] с [GetDoctrineType('special_doctrine_set_pillars_kindred').GetBaseName] или [GetDoctrineType('special_doctrine_set_corrupted_kindred').GetBaseName] [doctrine|E] не может владеть Империей [title|E]"
 spell_of_life_stage1_horus_phase3_decision_tooltip:0 "Чтобы получить знания Гора, мы должны доказать, что достойны"
 spell_of_life_stage1_kemintiri_phase1_decision:0 "Восстановление утраченных воспоминаний"
 spell_of_life_stage1_kemintiri_phase1_decision_confirm:0 "Я говорю о начале времен..."
 spell_of_life_stage1_kemintiri_phase1_decision_desc:0 "Будучи когда-то жрицей Исиды и обладательницей [Concept('POD_spell_of_life', 'Заклинание Жизни')|E], Кеминтири многое потеряла за время, проведенное под нежной опекой Сета #EMP#!. Если бы мы смогли заслужить ее доверие и восстановить остатки ее прошлой жизни, мы, возможно, смогли бы помочь восстановить некоторые из этих утраченных воспоминаний. $spell_of_life_stage1_do_multiple_stages$ $spell_of_life_stage1_warning$"
 spell_of_life_stage1_kemintiri_phase1_decision_tooltip:0 "Кеминтири когда-то знала Заклинание Жизни. Возможно, она вспомнит его..."
 spell_of_life_stage1_kemintiri_phase2_decision:0 "Давно потерянные друзья"
 spell_of_life_stage1_kemintiri_phase2_decision_bubasti_requirement:0 "[GetFaithByKey('bubasti').GetName] — это ваш участник [friend|E], [best_friend|E], [coterie|E], [lover|E] или [soulmate|E]."
 spell_of_life_stage1_kemintiri_phase2_decision_confirm:0 "Многое из того, что когда-то было, потеряно, но это осталось..."
 spell_of_life_stage1_kemintiri_phase2_decision_desc:0 "Читая артефакт, который она помогла написать, в воспоминаниях Кеминтири осталось слишком много пробелов. Однако она упомянула, что другие пытались помочь ей в прошлом, и вы знаете, что многие истории из ее прошлого сохранились в определенных традициях. Если бы мы смогли связаться и завоевать доверие этих людей, они, возможно, смогли бы восстановить то, что Кеминтири потерялаа, включая знания о [Concept('POD_spell_of_life', 'Заклинание Жизни')|E]."
 spell_of_life_stage1_kemintiri_phase2_decision_effect:0 "[GetScriptedCharacterByHistoryID('790512').GetFirstName] выучит Заклинание Жизни."
 spell_of_life_stage1_kemintiri_phase2_decision_khetamon_requirement:0 "[GetScriptedCharacterByHistoryID('791151').GetFirstName], который когда-то был близок к исцелению психики Кеминтири, активен и либо находится в вашем [court|E], либо является вашим участником [friend|E], [best_friend|E], [coterie|E], [lover|E] или [soulmate|E]."
 spell_of_life_stage1_kemintiri_phase2_decision_osiris_requirement:0 "Участник [house|E] [GetDynastyHouseByID('house_osiris').GetName] является вашим участником [friend|E], [best_friend|E], [coterie|E], [lover|E] или [soulmate|E]."
 spell_of_life_stage1_kemintiri_phase2_decision_silent_strider_requirement:0 "#TOOLTIP:RELIGION,silentstrider_religion #L Безмолвный странник#!#!#! — ваш [friend|E], [best_friend|E], участник [coterie|E], [lover|E] или [soulmate|E]"
 spell_of_life_stage1_kemintiri_phase2_decision_sobek_requirement:0 "#TOOLTIP:FAITH,children_sobek #L Дитя Собека#!#!#! — ваш [friend|E], [best_friend|E], участник [coterie|E], [lover|E] или [soulmate|E]"
 spell_of_life_stage1_kemintiri_phase2_decision_tooltip:0 "Мы не первые, кто пытается помочь Кеминтири. Возможно, остальные могут быть полезны."
 spell_of_life_stage1_kemintiri_phase3_decision:0 "Месть лучше всего подавать холодной"
 spell_of_life_stage1_kemintiri_phase3_decision_confirm:0 "Месть, затем уроки"
 spell_of_life_stage1_kemintiri_phase3_decision_desc:0 "Хотя большая часть ее воспоминаний вернулась и она помнит достаточно [Concept('POD_spell_of_life', 'Заклинание Жизни')|E], чтобы помочь нам, Кеминтири сообщила нам, что она не может уделять время обучению нас, пока не отомстит. Та-урт и весь ее [house|E] должны быть уничтожены. Только тогда она переключит свое внимание на другие дела."
 spell_of_life_stage1_kemintiri_phase3_decision_effect:0 "Со временем ваши отношения с ней могут позволить вам войти в [UmbraGlossaryLocalized('dark_kingdom_of_sand','Аменти')]."
 spell_of_life_stage1_kemintiri_phase3_decision_tawaret_landed:0 "Ни один вампир-член [house|E] [GetDynastyHouseByID('house_tawaret').GetName] не является [ruler|E]."
 spell_of_life_stage1_kemintiri_phase3_decision_tawaret_landed_ex:0 "$spell_of_life_stage1_kemintiri_phase3_decision_tawaret_landed$ #weak ([landed_tawaret_example.GetFirstName])#!"
 spell_of_life_stage1_kemintiri_phase3_decision_tawaret_living:0 "5 или менее членов [house|E] [GetDynastyHouseByID('house_tawaret').GetName] живы, активны и являются вампирами."
 spell_of_life_stage1_kemintiri_phase3_decision_tawaret_living_ex:0 "$spell_of_life_stage1_kemintiri_phase3_decision_tawaret_living$ #weak ([living_tawaret_example.GetFirstName])#!"
 spell_of_life_stage1_kemintiri_phase3_decision_tooltip:0 "Кеминтири нужно отомстить, прежде чем она захочет нас учить."
 spell_of_life_stage1_setite_phase1_decision:0 "Первые эксперименты в перерождении"
 spell_of_life_stage1_setite_phase1_decision_bean_nighe_caul:0 "Должен быть экипирован артефакт $artifact_bean_nighe_caul_name$"
 spell_of_life_stage1_setite_phase1_decision_confirm:0 "Начнем эксперименты..."
 spell_of_life_stage1_setite_phase1_decision_desc:0 "Хотя существует множество способов достижения вечного возрождения, [Concept('POD_spell_of_life', 'Заклинание Жизни')|E] — проверенный подход. Хотя всем остальным он был подарен, такие дары — не единственный способ его получить. Как Сет и другие пытались до вас, при наличии достаточного количества экспериментов и подопытных мы могли бы провести реверс-инжиниринг самостоятельно. $spell_of_life_stage1_do_multiple_stages$ $spell_of_life_stage1_warning$"
 spell_of_life_stage1_setite_phase1_decision_execution_effect:0 "Все заключенные, использованные для наших экспериментов, умрут."
 spell_of_life_stage1_setite_phase1_decision_mummy_prisoner:0 "Иметь как минимум #color_white 1#! [prisoner|E], то есть [GetTrait('mummy').GetName(GetNullCharacter)]."
 spell_of_life_stage1_setite_phase1_decision_sorcery_prisoner:0 "Иметь как минимум #color_white 5#! [prisoners|E], чтобы #italic мог #! выучить #TOOLTIP:GAME_TRAIT,sorcerer,[GetNullCharacter] #L Волшебство#!#! #weak ([GetTrait('bastet').GetName(GetNullCharacter)] или [mortal_like_splats|E])#!"
 spell_of_life_stage1_setite_phase1_decision_tooltip:0 "Эксперименты будут продолжаться, пока мое моральное состояние не улучшится."
 spell_of_life_stage1_setite_phase2_decision:0 "Созвать Совет"
 spell_of_life_stage1_setite_phase2_decision_confirm:0 "Соберите их!"
 spell_of_life_stage1_setite_phase2_decision_debate:0 "Если у вас есть хотя бы #color_white 5#! членов вашего [dynasty|E] или [faith|E], вы пригласите их на совет."
 spell_of_life_stage1_setite_phase2_decision_desc:0 "Погоня за [Concept('POD_spell_of_life', 'Заклинание Жизни')|E] — непростая задача, требующая огромного внимания. Если бы мы могли заручиться поддержкой наших товарищей, у нас было бы больше времени и ресурсов, которые можно было бы посвятить нашим усилиям. Даже обещания невмешательства было бы достаточно."
 spell_of_life_stage1_setite_phase2_decision_dynasty_members:0 "Как минимум #color_white 5#! членов вашей [dynasty|E] должны владеть землями"
 spell_of_life_stage1_setite_phase2_decision_faith_members:0 "Как минимум #color_white 5#! последователей вашей [faith|E] должны владеть землями"
 spell_of_life_stage1_setite_phase2_decision_house_head:0 "#color_white Вы#! возглавляете #color_white свой#! [house|E]"
 spell_of_life_stage1_setite_phase2_decision_tooltip:0 "Возможно, мы могли бы получить помощь или, по крайней мере, предотвратить вмешательство."
 spell_of_life_stage1_setite_phase3_bonus_xp:0 "Ваши обширные эксперименты дают #color_white 1.00#! дополнительный пассивный [trait_level_track_xp|E] в Заклинании Жизни #weak ([GetTrait('eternal_rebirth_seeker').GetName( GetPlayer )])#!"
 spell_of_life_stage1_setite_phase3_decision:0 "Расширенные эксперименты в перерождении"
 spell_of_life_stage1_setite_phase3_decision_big_3_prisoner:0 "Заключите в тюрьму хотя бы #color_white 1#! или [GetScriptedCharacterByHistoryID('792600').GetFirstName], [GetScriptedCharacterByHistoryID('792593').GetFirstName], [GetScriptedCharacterByHistoryID('790512').GetFirstName] или другого персонажа, который изучил полное Заклинание Жизни."
 spell_of_life_stage1_setite_phase3_decision_big_3_prisoner_no_mummies:0 "Заключите в тюрьму любого #color_white 1#! или [GetScriptedCharacterByHistoryID('790512').GetFirstName] или другого персонажа, познавшего полное Заклинание Жизни."
 spell_of_life_stage1_setite_phase3_decision_confirm:0 "Пусть эксперименты продолжаются..."
 spell_of_life_stage1_setite_phase3_decision_desc:0 "Мы приближаемся, очень близко к следующему этапу понимания. Однако кое-что о ядре Заклинания Жизни до сих пор ускользает от нас. Очевидно, что нам нужно больше текстов, больше ресурсов и больше испытуемых. Но стоимость несущественна. Что такое несколько жизней по сравнению со всей вечностью, моей вечностью."
 spell_of_life_stage1_setite_phase3_decision_fallback_prisoner:0 "Заключите в тюрьму любого #color_white 1#! [GetScriptedCharacterByHistoryID('792870').GetFirstName], [GetScriptedCharacterByHistoryID('792804').GetFirstName], [GetScriptedCharacterByHistoryID('792605').GetFirstName], [GetTrait('ferryman').GetName(GetNullCharacter)] или другого персонажа, познавшего полное Заклинание Жизни."
 spell_of_life_stage1_setite_phase3_decision_fallback_prisoner_no_mummies:0 "Заключите в тюрьму хотя бы #color_white 1#! или [GetScriptedCharacterByHistoryID('792870').GetFirstName], [GetTrait('ferryman').GetName(GetNullCharacter)] или другого персонажа, который знает полное Заклинание Жизни."
 spell_of_life_stage1_setite_phase3_decision_grand_city:0 "Иметь [grand_city|E]"
 spell_of_life_stage1_setite_phase3_decision_knowledgeable_people:0 "Заключите в тюрьму любого #color_white 1#! из [GetScriptedCharacterByHistoryID('792600').GetFirstName], [GetScriptedCharacterByHistoryID('792593').GetFirstName], [GetScriptedCharacterByHistoryID('790512').GetFirstName], [GetScriptedCharacterByHistoryID('792870').GetFirstName], [GetScriptedCharacterByHistoryID('792804').GetFirstName], [GetScriptedCharacterByHistoryID('792605').GetFirstName], [GetTrait('ferryman').GetName(GetNullCharacter)] или другого персонажа, который знает часть Заклинания Жизни #weak (Имейте более 15 [trait_level_track_xp|E] в $trait_track_spell_of_life$ [GetTrait('eternal_rebirth_seeker').GetName(GetNullCharacter)])#!."
