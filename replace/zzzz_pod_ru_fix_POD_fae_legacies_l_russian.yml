 POD_can_obtain_inanimae_dynasty_perk_friends:0 "Вам нужен как минимум [SCOPE.GetValue('required_friends')|V0] [Concept( 'friend', SelectLocalization( EqualTo_CFixedPoint( SCOPE.GetValue('required_friends'), '(CFixedPoint)1' ), 'game_concept_friend', 'game_concept_friends' ) )|E] #weak ([THIS.Char.MakeScope.ScriptValue('POD_num_of_friends')|0])#!"
