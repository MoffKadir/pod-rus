 scathach_legacy_track_name:0 "Наследие дома Скатхах"
 varich_legacy_1_name:0 "Предвидение в азартных играх"
 varich_legacy_1_perk:0 "#flavor Сами Грёзы даровали нам силу предсказывать исход событий.#!"
 varich_legacy_2_name:0 "Предвидение"
 varich_legacy_2_perk:0 "#flavor Мы знаем то, чего большинству знать не следует. #!"
 varich_legacy_3_name:0 "Прогноз будущего"
 varich_legacy_3_perk:0 "#flavor Мы видим, что нас ждет впереди.#!"
 varich_legacy_4_name:0 "Ясное будущее"
 varich_legacy_4_perk:0 "#flavor Наше видение будущего поистине великолепно.#!"
