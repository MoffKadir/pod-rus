 POD_can_obtain_inanimae_dynasty_perk_secrets_known:0 "Вам необходимо знать как минимум [SCOPE.GetValue('required_secrets_known')|V0] [Concept( 'secret', SelectLocalization( EqualTo_CFixedPoint( SCOPE.GetValue('required_secrets_known'), '(CFixedPoint)1' ), 'game_concept_secret', 'game_concept_secrets' ) )|E] #weak ([SCOPE.GetValue('secrets_known')|0])#!"
 POD_can_obtain_leanhaun_dynasty_perk_friends:0 "Вам нужен как минимум [SCOPE.GetValue('required_friends')|V0] [Concept( 'friend', SelectLocalization( EqualTo_CFixedPoint( SCOPE.GetValue('required_friends'), '(CFixedPoint)1' ), 'game_concept_friend', 'game_concept_friends' ) )|E]"
 POD_can_obtain_liam_dynasty_perk_total_epiphanies_quality:0 "Ваш [relations|E] должен иметь комбинацию [epiphanies_quality|E] не ниже [SCOPE.GetValue('required_total_epiphanies_quality')|V0] #weak ([GetPlayer.MakeScope.ScriptValue('total_epiphanies_quality')|0])#!."
 POD_can_obtain_scathach_dynasty_perk_knight_prowess:0 "Сумма [prowess|E] вашего [knights|E] должна превышать [SCOPE.GetValue('required_knight_prowess')|V0] #weak ([SCOPE.GetValue('total_knight_prowess')|0])#!."
 POD_can_obtain_varich_dynasty_perk_no_sluagh:0 "В вашем [realm|E] не может быть [GetTrait('sluagh').GetName(GetPlayer)] [vassals|E]"
 POD_dynasty_perk_fae_tooltip:0 "Для приобретения этого [dynasty_perk|E] вы должны соответствовать дополнительным требованиям:"
 POD_dynasty_perk_fae_tooltip_gui:0 "[GetScriptedGui(Concatenate('POD_dynasty_perk_tooltip_', SCOPE.GetFlagName('saved_tooltip'))).IsValidTooltip(GuiScope.SetRoot(GetPlayer.MakeScope).AddScope('perk_level', MakeScopeValue(SCOPE.GetValue('perk_level'))).End)]"
 aesin_legacy_1_name:0 "Зов природы"
 aesin_legacy_1_perk:0 "#flavor Дом Ас объявил о своей власти над дикой природой. Сами Грёзы направят диких животных исполнять нашу волю.#!"
 aesin_legacy_2_name:0 "Слуги дома Ас"
 aesin_legacy_2_perk:0 "#flavor «Сама природа — наши владения. Так провозгласили Грёзы!»#!"
 aesin_legacy_3_name:0 "Достойная добыча"
 aesin_legacy_3_perk:0 "Базовая стоимость [gold|E] Стоимость [GetActivityType('activity_hunt').GetName] [activity|E]: #P -50%#!.\n#flavor Мы знаем, как устроена активная охота, особенно в дикой природе.#!"
 aesin_legacy_4_name:0 "Бой на любой местности"
 aesin_legacy_4_perk:0 "[decision|E]: Получите новое свойство или накапливайте [trait_level_track_xp|E] в [commander_trait|E], основанном на природе. \n#flavor Природа — наш дом, мы знаем о ней все, и она знает все о нас. #!"
 aesin_legacy_5_name:0 "Опытные скальды"
 aesin_legacy_5_perk:0 "[decision|E]: Получите новое свойство или накапливайте [trait_level_track_xp|E] в [GetTrait('lifestyle_poet').GetName(GetNullCharacter)] [trait|E].\n#flavor Красотой природы нужно делиться!#!"
 aesin_legacy_track_desc:0 "Дом Природы."
 aesin_legacy_track_name:0 "Наследие дома Ас"
 ailil_legacy_1_name:0 "Используйте любую возможность"
 ailil_legacy_1_perk:0 "[casus_belli|E] Стоимость: #P -30%#!\n#flavor Любая возможность должна быть использована, независимо от ее стоимости.#!"
 ailil_legacy_2_name:0 "Клятвы, которые связывают"
 ailil_legacy_2_perk:0 "#flavor Клятвы необходимо уважать, только тогда сильный может стать могущественным.#!"
 ailil_legacy_3_name:0 "Вдохновляющие лидеры"
 ailil_legacy_3_perk:0 "#flavor Наше правление должно вдохновлять остальных: кто-то должен подавать пример.#!"
 ailil_legacy_4_name:0 "Мастера светской беседы"
 ailil_legacy_4_perk:0 "#flavor Мы умеем разговаривать с людьми, поскольку наши амбиции требуют, чтобы другие следовали за нами. #!"
 ailil_legacy_5_name:0 "Безудержные амбиции"
 ailil_legacy_5_perk:0 "#flavor Наша цель – слава и победа!#!"
 ailil_legacy_track_desc:0 "Дом амбиций"
 ailil_legacy_track_name:0 "Наследие дома Эйлиль"
 balor_legacy_1_name:0 "Кровь Фомори"
 balor_legacy_1_perk:0 "#flavor Мы не похожи на других, В наших жилах течет кровь Фомори. И они будут бояться этого.#!"
 balor_legacy_2_name:0 "Устранить всю оппозицию"
 balor_legacy_2_perk:0 "[decision|E]: Получите новое свойство или накапливайте [trait_level_track_xp|E] в [GetTrait('reckless').GetName(GetNullCharacter)] или [GetTrait('aggressive_attacker').GetName(GetNullCharacter)] [trait|E].\n#flavor Никто не устоит перед нами. Они все умрут!#!"
 balor_legacy_3_name:0 "Совершенно безжалостный"
 balor_legacy_3_perk:0 "#flavor Слово «Безжалостный» должно быть нашим именем, нашим титулом. #!"
 balor_legacy_4_name:0 "Король Ужаса"
 balor_legacy_4_perk:0 "#flavor Нас все будут бояться, если не за кровь в наших жилах, то за наше прошлое.#!"
 balor_legacy_5_name:0 "Склонность к Неблагим"
 balor_legacy_5_perk:0 "$improve_ravaging$\n#flavor Жить по Неблагому кодексу — единственный достойный путь для фей. #!"
 balor_legacy_track_desc:0 "Дом страха"
 balor_legacy_track_name:0 "Наследие дома Балор"
 beaumayn_legacy_1_name:0 "Оккультисты"
 beaumayn_legacy_1_perk:0 "Базовая стоимость [gold|E] Стоимость [GetActivityType('activity_pilgrimage').GetName] [activity|E]: #P -50%#!.\n#flavor Мы знаем оккультное, как наше собственное прошлое, ничто не должно быть скрыто.#!"
 beaumayn_legacy_2_name:0 "Дар пророчества"
 beaumayn_legacy_2_perk:0 "#flavor Сами Грёзы даровали нам пророческий дар. Мы знаем, что грядёт.#!"
 beaumayn_legacy_3_name:0 "Предвидение"
 beaumayn_legacy_3_perk:0 "#flavor Ничто сокрытое не останется для нас незамеченным.#!"
 beaumayn_legacy_4_name:0 "Склонность к Благим"
 beaumayn_legacy_4_perk:0 "$improve_reverie$\n#flavor Жить по Благому кодексу — единственный достойный путь для фей. #!"
 beaumayn_legacy_5_name:0 "Мастера оккультизма"
 beaumayn_legacy_5_perk:0 "#flavor Сами Грёзы откроют нам тайны оккультного.#!"
 beaumayn_legacy_track_desc:0 "Дом Пророков"
 beaumayn_legacy_track_name:0 "Наследие дома Бомейн"
 common_fae_legacy_1_name:0 "Грёзы в Осеннем мире"
 common_fae_legacy_1_perk:0 "#flavor Даже в Осеннем мире мы все еще мечтаем о лучшем мире.#!"
 common_fae_legacy_2_name:0 "Волшебники Грёз"
 common_fae_legacy_2_perk:0 "#flavor Несмотря на то, что Осенний мир забрал у нас, мы продолжаем привносить в это место волшебство.#!"
 common_fae_legacy_3_name:0 "Преодоление осенних ограничений"
 common_fae_legacy_3_perk:0 "[GetPlayer.Custom('PODFaeLegacyInanimaeBanality')].\n#flavor Осенний мир суров для нас, но мы все равно существуем.#!"
 common_fae_legacy_4_name:0 "Верность нашей природе"
 common_fae_legacy_4_perk:0 "Улучшите [revelry|E], удвоив полученный Гламур.\n#flavor В конце концов, мы — феи.#!"
 common_fae_legacy_5_name:0 "Признанные Грёзами"
 common_fae_legacy_5_perk:0 "[GetPlayer.Custom('PODFaeLegacyNobleHouse')]\nБольше не нужно содержать [grace_i][umbra|E] исследователей.\n@grace_icon![umbra_sense|E]: #P +20%#!\n#flavor Купаясь в славе Грёз, мы будем благородными!#!"
 common_fae_legacy_track_desc:0 "Из Грёз в Осенний мир"
 common_fae_legacy_track_name:0 "Волшебный народ"
 daireann_legacy_1_name:0 "Хорошо обученные алхимики"
 daireann_legacy_1_perk:0 "#flavor Страсть к алхимии нам не чужда.#!"
 daireann_legacy_2_name:0 "Утонченная вежливость"
 daireann_legacy_2_perk:0 "#flavor Каждый Фейри знает, что двор Дайреанн великолепен.#!"
 daireann_legacy_3_name:0 "Обильные праздники"
 daireann_legacy_3_perk:0 "Получите [GetModifier('POD_daireann_legacy_3_modifier').GetNameWithTooltip] после [GetActivityType('activity_feast').GetName] [activity|E].\n#flavor Мы с большим удовольствием организуем пиршества.#!"
 daireann_legacy_4_name:0 "Не навреди"
 daireann_legacy_4_perk:0 "[decision|E]: Получите или приобретите [trait_level_track_xp|E] в [GetTrait('lifestyle_physician').GetName(GetNullCharacter)] [trait|E].\n#flavor Познать жизнь — значит принять участие в величайшей страсти, которая только существует.#!"
 daireann_legacy_5_name:0 "Кроме тех, кто может причинить вред"
 daireann_legacy_5_perk:0 "$unlock_brewing_node$ [GetModifier('alchemy_antidepresants_2_modifier').GetNameWithTooltip]\n$unlock_brewing_node$ [GetModifier('alchemy_aphrodisiac_3_modifier').GetNameWithTooltip]\n$unlock_brewing_node$ [GetModifier('alchemy_poison_3_modifier').GetNameWithTooltip]\n$unlock_brewing_node$ [GetModifier('alchemy_antibiotics_2_modifier').GetNameWithTooltip]\n$unlock_brewing_node$ Добавьте [modifier|E], увеличив случайный [skill|E] на 1 ([GetModifier('alchemy_stimulant_diplomacy_modifier').GetNameWithTooltip])\n#flavor Само сновидение раскрыло нам тайну алхимических искусств.#!"
 daireann_legacy_track_desc:0 "Дом страсти"
 daireann_legacy_track_name:0 "Наследие дома Дайреанн"
 danaan_legacy_1_name:0 "Исследователи Умбры"
 danaan_legacy_1_perk:0 "#flavor Мы знаем Умбру как свои пять пальцев.#!"
 danaan_legacy_2_name:0 "Чувство Умбры"
 danaan_legacy_2_perk:0 "#flavor Понимание того, где человек находится в Умбре, — это то, что мы все знаем. #!"
 danaan_legacy_3_name:0 "Пакты с Химерой"
 danaan_legacy_3_perk:0 "#flavor Химеры Грёз — наши союзники.#!"
 danaan_legacy_4_name:0 "Склонность к Благим"
 danaan_legacy_4_perk:0 "$improve_reverie$\n#flavor Жить по Благому кодексу — единственный достойный путь для фей. #!"
 danaan_legacy_5_name:0 "Мастера тродов"
 danaan_legacy_5_perk:0 "Улучшите линию [GetBuilding('trods_02').GetName] [building|E], удвоив модификатор содержания [POD_chimera_maa|E] [modifier|E].\n#flavor Мы знаем, как использовать троды таким образом, чтобы значительно повысить их эффективность.#!"
 danaan_legacy_track_desc:0 "Дом Грёз"
 danaan_legacy_track_name:0 "Наследие дома Данаан"
 dougal_legacy_1_name:0 "Хорошо обученный мастер"
 dougal_legacy_1_perk:0 "#flavor Создание чего-то, что можно держать в руках и греться в его славе, — величайшее удовольствие в жизни. #!"
 dougal_legacy_2_name:0 "Бережливый мастер"
 dougal_legacy_2_perk:0 "Сократите затраты на изготовление [gold|E] на 25%.\n#flavor Мы знаем, как срезать углы, не влияя на конечный результат.#!"
 dougal_legacy_3_name:0 "Качественные инструменты"
 dougal_legacy_3_perk:0 "Базовая [durability|E] выкованных [artifacts|E]: #P +20#!.\n#flavor У хорошего мастера всегда под рукой хорошие инструменты.#!"
 dougal_legacy_4_name:0 "Склонность к Благим"
 dougal_legacy_4_perk:0 "$improve_reverie$\n#flavor Жить по Благому кодексу — единственный достойный путь для фей. #!"
 dougal_legacy_5_name:0 "Трудолюбие"
 dougal_legacy_5_perk:0 "#flavor Члены Дома Дугал широко известны как прилежные работники, и мы прилагаем большие усилия, чтобы поддерживать эту репутацию.#!"
 dougal_legacy_track_desc:0 "Дом Работы"
 dougal_legacy_track_name:0 "Наследие дома Дугал"
 eiluned_legacy_1_name:0 "Стремление к знаниям"
 eiluned_legacy_1_perk:0 "#flavor Мы стремимся к знаниям, а не к объяснениям, как смертные мыслители. #!"
 eiluned_legacy_2_name:0 "Держать карты при себе"
 eiluned_legacy_2_perk:0 "#flavor То, что мы знаем, не должно распространяться свободно, #!"
 eiluned_legacy_3_name:0 "Щит знаний"
 eiluned_legacy_3_perk:0 "[banality_with_icon|E] от Разума: #P -20%#!\n#flavor Наши знания защитят нас от неверия.#!"
 eiluned_legacy_4_name:0 "Магические эксперты"
 eiluned_legacy_4_perk:0 "Сложность [bunk_with_icon|E]: #P -20%#!.\n#flavor Магические искусства — это то, о чем мы, Эйлунд, много знаем.#!"
 eiluned_legacy_5_name:0 "Волшебные знания"
 eiluned_legacy_5_perk:0 "Через [character_interaction|E], выберите один путь [sorcery_lifestyle|E], чтобы разблокировать его. \n#flavor Тайны магии смертных непостижимы для нас, Фейри, но это не значит, что мы не можем воспроизвести некоторые из них. #!"
 eiluned_legacy_track_desc:0 "Дом знаний"
 eiluned_legacy_track_name:0 "Наследие дома Эйлунд"
 fae_feared_legacy_1_name:0 "Искусные выдумщики"
 fae_feared_legacy_1_perk:0 "[fabricate_claim|E] [councillor_task|E] Скорость: #P +50% #! быстрее\n#flavor Фабрикация притязаний — тоже творческий труд, и нам очень нравится им заниматься. #!"
 fae_feared_legacy_2_name:0 "Кричащая слава"
 fae_feared_legacy_2_perk:0 "Получите [prestige|E] от пыток [characters|E], сумма зависит от ранга жертвы. \n#flavor Ибо мы знаем, что крики могут нести информацию о том, что мы можем сделать с врагами Грёз. #!"
 fae_feared_legacy_3_name:0 "Слава от страха"
 fae_feared_legacy_3_perk:0 "#flavor Страх может сделать даже мелкого графа серьёзной угрозой.#!"
 fae_feared_legacy_4_name:0 "Мастера интриг"
 fae_feared_legacy_4_perk:0 "#flavor Мы кое-что знаем о интригах, поскольку это наш долг. #!"
 fae_feared_legacy_5_name:0 "Самые грозные среди Блудных"
 fae_feared_legacy_5_perk:0 "#flavor Ибо мы — кошмар Блудных.#!"
 fae_feared_legacy_track_desc:0 "Дом, которого боятся Блудные"
 fae_feared_legacy_track_name:0 "[GetPlayer.GetDynasty.GetNameNoTooltip]"
 fae_loved_legacy_1_name:0 "Нас любят везде, где бы мы ни были..."
 fae_loved_legacy_1_perk:0 "#flavor Любимые Грёзами, любимые всеми остальными.#!"
 fae_loved_legacy_2_name:0 "...Особенно нашими вассалами"
 fae_loved_legacy_2_perk:0 "#flavor Наши вассалы тоже родом из Грёз, и они тоже нас любят.#!"
 fae_loved_legacy_3_name:0 "Мастера многозадачности"
 fae_loved_legacy_3_perk:0 "#flavor Разве хороший друг не умеет поддерживать сразу множество отношений? #!"
 fae_loved_legacy_4_name:0 "Лучшие друзья"
 fae_loved_legacy_4_perk:0 "#flavor Способность поддерживать множество отношений – наша гордость.#!"
 fae_loved_legacy_5_name:0 "Самый любимый среди любимых"
 fae_loved_legacy_5_perk:0 "#flavor Во всем остальном Нас любят там, откуда мы родом. #!"
 fae_loved_legacy_track_desc:0 "Дом, любимый Грёзами"
 fae_loved_legacy_track_name:0 "[GetPlayer.GetDynasty.GetNameNoTooltip]"
 fae_mighty_legacy_1_name:0 "Рыцарская слава"
 fae_mighty_legacy_1_perk:0 "#flavor Мы — Рыцари Грез, и наши рыцари не менее важны, чем мы сами. #!"
 fae_mighty_legacy_2_name:0 "Боевой клич"
 fae_mighty_legacy_2_perk:0 "В начале [war|E] раздайте [GetModifier('POD_dynasty_battle_cry_modifier').GetNameWithTooltip] [modifier|E] всем дружественным [knights|E] на 5 лет. \n#flavor «За Грёзы!» — кричим мы, стремясь к славе!#!"
 fae_mighty_legacy_3_name:0 "Мастера меча"
 fae_mighty_legacy_3_perk:0 "[decision|E]: Получите новое свойство или накапливайте [trait_level_track_xp|E] в [GetTrait('lifestyle_blademaster').GetName(GetPlayer)] [trait|E].\n#flavor Мы знаем, как обращаться с клинком, потому что он нужен нам, чтобы охранять Грёзы.#!"
 fae_mighty_legacy_4_name:0 "Могучие товарищи"
 fae_mighty_legacy_4_perk:0 "Все члены [coterie|E] получат [GetModifier('POD_dynasty_mighty_companions_modifier').GetNameWithTooltip] [modifier|E], пока они не уйдут. \n#flavor Один Фейри не может защитить все Грёзы, но кто сказал, что мы одни? #!"
 fae_mighty_legacy_5_name:0 "Могущественнейшие из фей"
 fae_mighty_legacy_5_perk:0 "#flavor Ибо мы — Стражи Грёз.#!"
 fae_mighty_legacy_track_desc:0 "Стражи Грёз"
 fae_mighty_legacy_track_name:0 "[GetPlayer.GetDynasty.GetNameNoTooltip]"
 fae_respected_legacy_1_name:0 "Настоящие короли"
 fae_respected_legacy_1_perk:0 "#flavor Мы короли, и наша слава будет распространяться.#!"
 fae_respected_legacy_2_name:0 "Верные вассалы"
 fae_respected_legacy_2_perk:0 "#flavor Наши вассалы знают свое место и помогают нам, как следует.#!"
 fae_respected_legacy_3_name:0 "Мастера управления доменом"
 fae_respected_legacy_3_perk:0 "Улучшите [GetCourtPositionType('imperial_envoy_court_position').GetName()], [GetCourtPositionType('imperial_chancellor_court_position').GetName()] и [GetCourtPositionType('imperial_minister_court_position').GetName()] [aptitude|E] на #P 20#!.\n#flavor Мы знаем, как править и как управлять большим доменом.#!"
 fae_respected_legacy_4_name:0 "Величайший из дворов"
 fae_respected_legacy_4_perk:0 "[GetPlayer.Custom('PODFaeLegacyRoyalCourt')].\n#flavor Двор короля – это то, что показывает миру свою мощь, мы не можем отставать.#!"
 fae_respected_legacy_5_name:0 "Императоры среди королей"
 fae_respected_legacy_5_perk:0 "#flavor Ибо мы — короли. Не самих Грёз, а всего, что им принадлежит!#!"
 fae_respected_legacy_track_desc:0 "Следуя по пути короля Артура"
 fae_respected_legacy_track_name:0 "[GetPlayer.GetDynasty.GetNameNoTooltip]"
 fae_warriors_legacy_1_name:0 "Слава Грёз"
 fae_warriors_legacy_1_perk:0 "Получите [prestige|E] от выигранных [wars|E], сумма зависит от наивысшего ранга [title|E].\n#flavor За славу, за Грёзы!#!"
 fae_warriors_legacy_2_name:0 "Но мы не одиноки"
 fae_warriors_legacy_2_perk:0 "#flavor Мы не ослеплены нашей миссией, У нас есть союзники внутри нашего вида.#!"
 fae_warriors_legacy_3_name:0 "Ибо наши притязания справедливы"
 fae_warriors_legacy_3_perk:0 "Стоимость [casus_belli|E]: #P -30%#!\n#flavor Ибо мы — Грёзы, и наше дело правое.#!"
 fae_warriors_legacy_4_name:0 "Расширение нашего домена"
 fae_warriors_legacy_4_perk:0 "Открывает [casus_belli|E] #V $invasion_war$#!.\nСокращает промежуток между войнами #V $invasion_war$#! со #N 100#! до #P 50#! лет.\n#flavor Наша миссия — расширять земли, доступные влиянию Грёз.#!"
 fae_warriors_legacy_5_name:0 "Величайшие воины Грёз"
 fae_warriors_legacy_5_perk:0 "#flavor Ибо мы — полководцы Грёз, стремящиеся к победе!#!"
 fae_warriors_legacy_track_desc:0 "Полководцы Грёз"
 fae_warriors_legacy_track_name:0 "[GetPlayer.GetDynasty.GetNameNoTooltip]"
 fae_wise_legacy_1_name:0 "Ученые имен"
 fae_wise_legacy_1_perk:0 "Получите #P 200#! [piety|E] и #P 200#! [prestige|E] при изучении нового языка.\n#flavor Языки имеют вес, вес, который мы должны знать. #!"
 fae_wise_legacy_2_name:0 "Эксперты-волшебники"
 fae_wise_legacy_2_perk:0 "#flavor Мудрые Фейри знают, что силу нельзя игнорировать. #!"
 fae_wise_legacy_3_name:0 "Изучение путей мечтателей"
 fae_wise_legacy_3_perk:0 "В качестве [character_interaction|E] выберите ванильный [lifestyle|E], который будет получать 100 очков опыта каждый год. \n#flavor Мечтатели знают кое-что, то, что мы тоже можем знать.#!"
 fae_wise_legacy_4_name:0 "Мастера обучения"
 fae_wise_legacy_4_perk:0 "#flavor Мы, Блудные дети, медленно адаптируемся и учимся. Но это можно изменить.#!"
 fae_wise_legacy_5_name:0 "Самый мудрый среди мудрых"
 fae_wise_legacy_5_perk:0 "#flavor Ибо мы храним знания Грёз.#!"
 fae_wise_legacy_track_desc:0 "Дом Мудрости"
 fae_wise_legacy_track_name:0 "[GetPlayer.GetDynasty.GetNameNoTooltip]"
 fiona_legacy_1_name:0 "Безграничная страсть"
 fiona_legacy_1_perk:0 "#flavor Быть Фионой — значит любить и быть любимой. #!"
 fiona_legacy_2_name:0 "Любовь народа"
 fiona_legacy_2_perk:0 "#flavor Даже самые банальные смертные будут к нам привязаны. Таково обещание Грёз.#!"
 fiona_legacy_3_name:0 "Постоянные пирушки"
 fiona_legacy_3_perk:0 "Стоимость опций [GetActivityType('activity_feast').GetName] [activity|E] снижена на: #P 50%#!.\n#flavor Мы знаем, что значит веселиться на вечеринках, в конце концов, мы делаем это постоянно!#!"
 fiona_legacy_4_name:0 "Борьба за славу"
 fiona_legacy_4_perk:0 "[decision|E]: Получите новое свойство или накапливайте [trait_level_track_xp|E] в [GetTrait('reckless').GetName(GetNullCharacter)] [trait|E].\n#flavor Мы сражаемся за славу и умрем за нее.#!"
 fiona_legacy_5_name:0 "Любовь ко всем"
 fiona_legacy_5_perk:0 "#flavor Знать нас — значит любить нас.#!"
 fiona_legacy_track_desc:0 "Дом любви"
 fiona_legacy_track_name:0 "Наследие дома Фиона"
 gwydion_legacy_1_name:0 "Земельный контроль"
 gwydion_legacy_1_perk:0 "#flavor Быть хорошим правителем сложно, но это наш долг. #!"
 gwydion_legacy_2_name:0 "Процветающие земли"
 gwydion_legacy_2_perk:0 "#flavor Земля под нашим командованием будет процветать!#!"
 gwydion_legacy_3_name:0 "Восхищение вассалов"
 gwydion_legacy_3_perk:0 "#flavor Никто не может управлять империями в одиночку, знание того, как разделить власть, - это то, что должны знать все хорошие правители. #!"
 gwydion_legacy_4_name:0 "Рожденный править"
 gwydion_legacy_4_perk:0 "#flavor Нам, дому Гвидион, суждено править. Таков указ Грёз!#!"
 gwydion_legacy_5_name:0 "Плоды справедливого правления"
 gwydion_legacy_5_perk:0 "#flavor Все хорошее в конце концов должно вернуться к нам.#!"
 gwydion_legacy_track_desc:0 "Дом дворян"
 gwydion_legacy_track_name:0 "Наследие дома Гвидион"
 improve_ravaging:0 "Улучшите [ravaging|E], дав #P +1#! Гламур независимо от [epiphanies_quality|E]."
 improve_reverie:0 "Улучшите [reverie|E], действуя так, как если бы все [Concept('relation', 'Особые отношения')|E] имели #P дополнительное очко #! [epiphanies_quality|E]."
 inanimae_legacy_1_name:0 "Рождённые огнём"
 inanimae_legacy_1_perk:0 "Каждый [nemesis|E], [best_friend|E] и [soulmate|E] улучшает или дает [modifier|E], давая #P +0.75#! [prestige|E] и #P +0.2#! [dynasty_prestige|E].\n#flavor Мы все произошли из огня человеческой мысли...#!"
 inanimae_legacy_2_name:0 "Созданный ветром"
 inanimae_legacy_2_perk:0 "#flavor ...Обретшие облик под ветрами непредсказуемых Грёз...#!"
 inanimae_legacy_3_name:0 "Воспитанный водой"
 inanimae_legacy_3_perk:0 "[decision|E]: Получите свойство [GetTrait('lifestyle_herbalist').GetName(GetNullCharacter)] или [GetTrait('lifestyle_physician').GetName(GetNullCharacter)] [trait|E] либо [trait_level_track_xp|E] для уже имеющегося свойства.\n#flavor ...Вскормленные текучими водами самой обыденной реальности...#!"
 inanimae_legacy_4_name:0 "Закаленный камнем"
 inanimae_legacy_4_perk:0 "#flavor ...Закалено этим... #!"
 inanimae_legacy_5_name:0 "Чтобы мы могли расти"
 inanimae_legacy_5_perk:0 "$cantrip_hard_bunk$ Воскресить $POD_splat_wraith$ как $POD_splat_mortal$\n$cantrip_hard_bunk$ Предоставить [GetModifier('cantrip_renewal_modifier').GetNameWithTooltip] всем [de_jure|E] [counties|E] [title|E]\n$cantrip_hard_bunk$ Полностью восстановить [artifact|E] [durability|E]\n#flavor ...Но даже тогда мы все равно будем расти в будущее.#!"
 inanimae_legacy_track_desc:0 "Рожденный из стихий"
 inanimae_legacy_track_name:0 "Наследие Неодушевлённых"
 leanhaun_legacy_1_name:0 "Покровители великих"
 leanhaun_legacy_1_perk:0 "[gold|E] или [prestige|E] Стоимость найма Великого Человека: #P -25%#!\n#flavor Великие художники и смертные должны быть вознаграждены за свою работу, даже если это только для того, чтобы дать нам больше Гламура.#!"
 leanhaun_legacy_2_name:0 "Величайший из друзей"
 leanhaun_legacy_2_perk:0 "Открывает [GetScheme('befriend').GetTypeName] [scheme|E].\nВсе ваши [friends|E] получат [GetModifier('POD_leanhaun_legacy_2_modifier').GetNameWithTooltip] [modifier|E].\n#flavor Мы знаем, что значит быть другом.#!"
 leanhaun_legacy_3_name:0 "Знания смертных"
 leanhaun_legacy_3_perk:0 "Улучшите [GetDynastyPerk('leanhaun_legacy_2').GetName], дав вместо него [GetModifier('POD_leanhaun_legacy_3_modifier').GetNameWithTooltip].\n#flavor Разум смертных не является для нас загадкой.#!"
 leanhaun_legacy_4_name:0 "Законодатели культуры"
 leanhaun_legacy_4_perk:0 "#P +25%#! Скорость преобразования культуры.\n#flavor Направлять человечество в желаемом направлении сложно, но мы, Лианнан, с этим справились.#!"
 leanhaun_legacy_5_name:0 "Склонность к Неблагим"
 leanhaun_legacy_5_perk:0 "$improve_ravaging$\n#flavor Жить по Неблагому кодексу — единственный достойный путь для фей. #!"
 leanhaun_legacy_track_desc:0 "Дом проклятых художников"
 leanhaun_legacy_track_name:0 "Наследие дома Лианнан"
 liam_legacy_1_name:0 "Союзники против Банальности"
 liam_legacy_1_perk:0 "#V $glamour_quests_name$#! [journey|E] Скорость: #P +50%#!\n#flavor Нас всех атакует неверие, но мы не беззащитны!#!"
 liam_legacy_2_name:0 "Связи с низами"
 liam_legacy_2_perk:0 "#flavor Связи бесценны, кем бы ни были наши знакомые и откуда бы они ни происходили. #!"
 liam_legacy_3_name:0 "Величайшие враги банальности"
 liam_legacy_3_perk:0 "Поиски Гламура снимают вдвое больше [banality|E].\n#flavor Быть Лиамом — значит быть маяком в борьбе с самой Банальностью.#!"
 liam_legacy_4_name:0 "Поклонение смертных"
 liam_legacy_4_perk:0 "#flavor Все смертные будут любить нас!#!"
 liam_legacy_5_name:0 "Склонность к Благим"
 liam_legacy_5_perk:0 "$improve_reverie$\n#flavor Жить по Благому кодексу — единственный достойный путь для фей. #!"
 liam_legacy_track_desc:0 "Дом смертных"
 liam_legacy_track_name:0 "Наследие дома Лиам"
 scathach_legacy_1_name:0 "Непреклонный"
 scathach_legacy_1_perk:0 "#flavor Мы не уступим! Мы не сдадимся!#!"
 scathach_legacy_2_name:0 "Мастера скрытности"
 scathach_legacy_2_perk:0 "#flavor Тени во дворе, нас не видно.#!"
 scathach_legacy_3_name:0 "Известные командиры"
 scathach_legacy_3_perk:0 "[decision|E]: Получите новое свойство или накапливайте [trait_level_track_xp|E] за один [commander_trait|E].\n#flavor. Мы знаем все виды войны.#!"
 scathach_legacy_4_name:0 "Безжалостные нападающие"
 scathach_legacy_4_perk:0 "#flavor Вперёд! К славе и победе!#!"
 scathach_legacy_5_name:0 "Универсальные дуэлянты"
 scathach_legacy_5_perk:0 "#flavor Искусство дуэлей – это то, что мы очень глубоко понимаем. #!"
