 uktena_adj:0 "Уктенск"
 uktena_desc:0 "Хотя племя мудрецов, шаманов и ведьм входит в число Трёх братьев с далёкой земли, оно не ограничивается тем континентом. Некоторые перебрались по льду в Сибирь или вдоль Алеутской гряды через Берингов пролив.\nУктена поселились вместе со своей роднёй и после первых столкновений с европейскими племенами держались настороженно. Лишь когда хан собирает свои армии, в том числе и родню Уктена, заметное число представителей мудрого племени вступает в контакт с давно потерянными сородичами."
 uktena_religion:0 "@werewolf_icon! Уктена"
 uktena_religion_adherent:0 "Уктена"
 uktena_religion_adherent_plural:0 "Уктена"
 uktena_religion_adj:0 "Уктенск"
 uktena_religion_desc:0 "Хотя племя мудрецов, шаманов и ведьм входит в число Трёх братьев с далёкой земли, оно не ограничивается тем континентом. Некоторые перебрались по льду в Сибирь или вдоль Алеутской гряды через Берингов пролив.\nУктена поселились вместе со своей роднёй и после первых столкновений с европейскими племенами держались настороженно. Лишь когда хан собирает свои армии, в том числе и родню Уктена, заметное число представителей мудрого племени вступает в контакт с давно потерянными сородичами."
