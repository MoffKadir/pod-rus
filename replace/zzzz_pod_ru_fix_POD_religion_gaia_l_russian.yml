 whitehowler_religion_adherent_plural:0 "Белые завыватели"
 whitehowler_religion_adj:0 "Белые завыватели"
 whitehowler_religion_desc:0 "Белые завыватели были одним из первоначальных шестнадцати племён гару. Ныне племя вымерло: уцелевшие подчинились Вирму и стали Танцорами Чёрной спирали. Они славились неистовой преданностью друг другу и тесной связью с миром духов. Говорят, Белые завыватели были особенно искусны в бою, и многие другие племена их боялись. Несмотря на гибель племени, наследие Белых завывателей живёт в историях и легендах Нации гару."
