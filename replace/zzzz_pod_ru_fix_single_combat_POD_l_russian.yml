l_russian:
 single_combat.0031.desc.opponent_response.POD_bark_mudpuppy:0 "[sc_victor.GetFirstNameNoTooltip] #italic кричит #! с неожиданной силой."
 single_combat.0031.desc.opponent_response.POD_bark_mudpuppy.fatality:0 "Шум так сильно разрывает мою кожу, что повсюду открываются раны, как будто меня порезали ножами бесчисленное количество раз. Пока я сжимаю зубы от боли, [sc_victor.GetFirstNameNoTooltip] наносит удар, а [sc_victor.GetHerHis] [sc_victor.Custom('signature_weapon')] попадает в мое горло."
 single_combat.0031.desc.opponent_response.POD_bark_mudpuppy.injury:0 "Шум так сильно разрывает мою кожу, что повсюду открываются раны, как будто меня порезали ножами бесчисленное количество раз. Пока я стиснул зубы от боли, [sc_victor.GetFirstNameNoTooltip] готовит [sc_victor.GetHerselfHimself] к удару, и я понимаю, что полностью побежден."
 single_combat.0031.desc.opponent_response.POD_clap_of_thunder:0 "[sc_victor.GetFirstNameNoTooltip] хлопает [sc_victor.GetHerHis] в ладоши."
 single_combat.0031.desc.opponent_response.POD_clap_of_thunder.fatality:0 "Я дезориентирован, поскольку от грохота у меня звенит в ушах, а в глазах помутнело. Без осознания моего окружения и того, что делает мой противник, моя жизнь бесцеремонно обрывается."
 single_combat.0031.desc.opponent_response.POD_clap_of_thunder.injury:0 "Я дезориентирован, поскольку от грохота у меня звенит в ушах, а в глазах помутнело. Когда я пришёл в себя, [sc_victor.GetFirstNameNoTooltip] уже воспользовался моей потерей концентрации и обезоружил меня."
 single_combat.0031.desc.opponent_response.POD_dragon_slash:0 "[sc_victor.GetFirstNameNoTooltip] выглядит серьезным, поскольку [sc_victor.GetSheHe] запускает в меня [sc_victor.GetHerselfHimself] с яростным натиском атак когтями."
 single_combat.0031.desc.opponent_response.POD_dragon_slash.fatality:0 "У меня нет ответа на беспощадные оскорбления [sc_victor.GetHerHis]. [sc_victor.GetSheHe|U] продолжает идти и идти, никогда не останавливаясь, даже когда [sc_victor.GetSheHe] отрывает мне руки, выпотрошивает меня и избивает меня до смерти собственным позвоночником."
 single_combat.0031.desc.opponent_response.POD_dragon_slash.injury:0 "У меня нет ответа на безжалостное нападение [sc_victor.GetHerHis], и когда [sc_victor.GetSheHe] вступает в борьбу и швыряет меня на пол, я вынужден признать поражение."
 single_combat.0031.desc.opponent_response.POD_dragons_breath:0 "[sc_victor.GetFirstNameNoTooltip] глубоко вдыхает и выдыхает огромный сгусток пламени прямо на меня."
 single_combat.0031.desc.opponent_response.POD_dragons_breath.fatality:0 "Боль неописуема, море огня окутывает меня и обжигает там, где я стою. Последнее, что я вижу, это свое мерцающее отражение в беззаботных глазах рептилии [sc_victor.GetFirstNamePossessiveNoTooltip]."
 single_combat.0031.desc.opponent_response.POD_dragons_breath.injury:0 "Я уворачиваюсь, чтобы не превратиться в хрустящую корочку, но пламя все равно захватывает меня и оставляет болезненные ожоги. Мне нужно отключиться, прежде чем следующая атака превратит меня в кучу пепла."
 single_combat.0031.desc.sc_attacker.POD_bark_mudpuppy:0 "Я повышаю голос и изо всех сил ревую на [sc_victor.GetFirstNameNoTooltip], но [sc_victor.GetSheHe] легко отмахивается от атаки."
 single_combat.0031.desc.sc_attacker.POD_bark_mudpuppy.fatality:0 "[sc_victor.GetSheHe|U] просто театрально напрягает мышцы [sc_victor.GetHerHis] и перерезает мне горло, пока я прихожу в себя, и этим я замолкаю навсегда."
 single_combat.0031.desc.sc_attacker.POD_bark_mudpuppy.injury:0 "[sc_victor.GetSheHe|U] просто театрально напрягает мышцы [sc_victor.GetHerHis] и бьет меня кулаком по горлу, пока я прихожу в себя, и на этом дуэль окончена."
 single_combat.0031.desc.sc_attacker.POD_clap_of_thunder:0 "Я хлопаю в ладоши, издавая звучный раскат грома, но [sc_victor.GetFirstNameNoTooltip] кажется невозмутимым."
 single_combat.0031.desc.sc_attacker.POD_clap_of_thunder.fatality:0 "[sc_victor.GetSheHe|U] отмахивается от шума и запускает серию быстрых контратак, проливающих кровь, и, когда мое самообладание так пошатнулось, эта дуэль почти окончена."
 single_combat.0031.desc.sc_attacker.POD_clap_of_thunder.injury:0 "[sc_victor.GetSheHe|U] отмахивается от шума и начинает стремительную контратаку, которая выбивает меня из равновесия и кладет конец этой дуэли."
 single_combat.0031.desc.sc_attacker.POD_dragon_slash:0 "Я бросаюсь на [sc_victor.GetFirstNameNoTooltip] серией плавных, хорошо выполненных ударов когтями, но безрезультатно."
 single_combat.0031.desc.sc_attacker.POD_dragon_slash.fatality:0 "[sc_victor.GetSheHe|U] использует мою собственную инерцию против меня, когда [sc_victor.GetSheHe] отходит в сторону и поднимает оружие [sc_victor.GetHerHis], и когда оно опускается мне на шею, все, что я могу думать, это: какой прекрасный наглядный урок чрезмерной самоуверенности."
 single_combat.0031.desc.sc_attacker.POD_dragon_slash.injury:0 "[sc_victor.GetSheHe|U] использует мою собственную инерцию против меня, когда [sc_victor.GetSheHe] делает шаг в сторону и бьет меня по затылку, как мастер боевых искусств, отчитывающий ученика [sc_victor.GetHerHis]."
 single_combat.0031.desc.sc_attacker.POD_dragons_breath:0 "Я глубоко вдыхаю и выдыхаю массивный сгусток пламени в направлении [sc_victor.GetFirstNameNoTooltip], но [sc_victor.GetSheHe] легко уклоняется."
 single_combat.0031.desc.sc_attacker.POD_dragons_breath.fatality:0 "\"Может быть, я перестарался с этой атакой. \" - моя последняя мысль, когда [sc_victor.GetSheHe] сокращает расстояние и вонзает оружие [sc_victor.GetHerHis] мне в горло."
 single_combat.0031.desc.sc_attacker.POD_dragons_breath.injury:0 "\"Может быть, я перестарался с этой атакой. \" - моя последняя мысль, поскольку [sc_victor.GetSheHe] сокращает расстояние и сбивает меня с ног."
 single_combat.0041.desc.opponent_response.POD_bark_mudpuppy:0 "[sc_loser.GetFirstNameNoTooltip] кричит изо всех сил [sc_loser.GetHerHis], и хотя шум нападает на меня, я продолжаю."
 single_combat.0041.desc.opponent_response.POD_bark_mudpuppy.fatality:0 "Я сокращаю дистанцию и заставляю [sc_loser.GetHerHim] замолчать, сдавливая [sc_loser.GetHerHis] горло. [sc_loser.GetSheHe|U] больше никогда не будет кричать."
 single_combat.0041.desc.opponent_response.POD_bark_mudpuppy.injury:0 "Я сокращаю дистанцию и заставляю [sc_loser.GetHerHim] замолчать, перерезав горло. Больше не кричи, пожалуйста."
 single_combat.0041.desc.opponent_response.POD_clap_of_thunder:0 "[sc_loser.GetFirstNameNoTooltip] хлопает [sc_loser.GetHerHis] в ладоши и с оглушительным шумом делает отважную попытку вывести меня из равновесия, но я непоколебим."
 single_combat.0041.desc.opponent_response.POD_clap_of_thunder.fatality:0 "Похоже, что раскат грома повлиял на [sc_loser.GetHerHim] больше, чем на меня, и мои быстрые контратаки не встречают большого сопротивления. Через несколько мгновений мой [sc_victor.Custom('signature_weapon')] впивается в плоть, и дуэль окончена."
 single_combat.0041.desc.opponent_response.POD_clap_of_thunder.injury:0 "Похоже, что раскат грома повлиял на [sc_loser.GetHerHim] больше, чем на меня, и мои быстрые контратаки не встречают большого сопротивления. Дуэль закончилась в считанные секунды."
 single_combat.0041.desc.opponent_response.POD_dragon_slash:0 "[sc_loser.GetFirstNameNoTooltip] запускает в меня [sc_loser.GetHerselfHimself] серией плавных, хорошо выполненных ударов когтями [sc_loser.GetHerHis], но [sc_loser.GetSheHe] не замечает, как поступательный импульс [sc_loser.GetHerHis] оставляет [sc_loser.GetHerselfHimself] широко открытым."
 single_combat.0041.desc.opponent_response.POD_dragon_slash.fatality:0 "Слишком легко отойти в сторону и обрушить оружие на незащищенную шею [sc_loser.GetHerHis]. К чести [sc_loser.GetHerHis], тело [sc_loser.GetHerHis] продолжает некоторое время скользить вперед, что является свидетельством силы, стоящей за атакой."
 single_combat.0041.desc.opponent_response.POD_dragon_slash.injury:0 "Все, что мне нужно сделать, это шагнуть в сторону и ударить [sc_loser.GetHerHim] по затылку, как будто я мастер боевых искусств, отчитывающий ученика [sc_victor.GetHerHis]."
 single_combat.0041.desc.opponent_response.POD_dragons_breath:0 "[sc_loser.GetFirstNameNoTooltip] выдыхает в мою сторону бессильную вспышку пламени, больше похожую на ряженого, исполняющего трюки, чем на свирепого дракона."
 single_combat.0041.desc.opponent_response.POD_dragons_breath.fatality:0 "Я воспользовался чрезмерными обязательствами [sc_loser.GetHerHis] и вонзил [sc_loser.GetHerHis] в горло, пока оно еще светилось. Дракон убит."
 single_combat.0041.desc.opponent_response.POD_dragons_breath.injury:0 "Я воспользовался чрезмерными обязательствами [sc_loser.GetHerHis] и сбил [sc_loser.GetHerHim] без сознания, пока горло [sc_loser.GetHerHis] все еще пылало."
 single_combat.0041.desc.sc_attacker.POD_acre_flesh.fatality:0 "Это причиняет сильную боль. Достаточную, чтобы отвлечь врага от следующего удара. На этот раз боль продлится недолго."
 single_combat.0041.desc.sc_attacker.POD_acre_flight.fatality:0 "Или даже превзойти врага, оттесняя его назад. И ещё дальше. Пока отступать станет некуда."
 single_combat.0041.desc.sc_attacker.POD_bark_mudpuppy:0 "Я повышаю голос и изо всех сил реву на [sc_loser.GetFirstNameNoTooltip], направляя единственный крик на оружие, разрывающее плоть."
 single_combat.0041.desc.sc_attacker.POD_bark_mudpuppy.fatality:0 "[sc_loser.GetSheHe|U] стиснул зубы [sc_loser.GetHerHis], раны открылись по всей коже [sc_loser.GetHerHis], и потеря концентрации достаточна, чтобы позволить мне пронзить горло [sc_loser.GetHerHis] своим оружием."
 single_combat.0041.desc.sc_attacker.POD_bark_mudpuppy.injury:0 "[sc_loser.GetSheHe|U] стиснул зубы [sc_loser.GetHerHis], раны открылись по всей коже [sc_loser.GetHerHis], и потеря концентрации достаточна, чтобы позволить мне приставить оружие к горлу [sc_loser.GetHerHis]."
 single_combat.0041.desc.sc_attacker.POD_clap_of_thunder:0 "Я хлопаю в ладоши, и внезапный резонансный звук грома совершенно оглушает [sc_loser.GetFirstNameNoTooltip]."
 single_combat.0041.desc.sc_attacker.POD_clap_of_thunder.fatality:0 "[sc_loser.GetSheHe|U] не сопротивляется, поскольку я легко обезглавливаю [sc_loser.GetHerHim] и довожу эту дуэль до разочаровывающего завершения."
 single_combat.0041.desc.sc_attacker.POD_clap_of_thunder.injury:0 "[sc_loser.GetSheHe|U] не сопротивляется, а я обезоруживаю [sc_loser.GetHerHim] и довожу эту дуэль до разочаровывающего завершения."
 single_combat.0041.desc.sc_attacker.POD_dragon_slash:0 "Вспоминая свою тренировку, я бросаюсь на [sc_loser.GetFirstNameNoTooltip] серией плавных, хорошо выполненных ударов когтями, сочетая уравновешенное мастерство с грубой силой."
 single_combat.0041.desc.sc_attacker.POD_dragon_slash.fatality:0 "[sc_loser.GetSheHe|U] не реагирует на мое нападение и не сопротивляется, даже когда я отрываю [sc_loser.GetHerHis] руки, выпотрошу [sc_loser.GetHerHim] и забиваю [sc_loser.GetHerHim] до смерти собственным позвоночником [sc_loser.GetHerHis]."
 single_combat.0041.desc.sc_attacker.POD_dragon_slash.injury:0 "[sc_loser.GetSheHe|U] вскоре отступает и не сопротивляется, даже когда я бросаюсь в захват и швыряю [sc_loser.GetHerHis] на пол. Я выиграл."
 single_combat.0041.desc.sc_attacker.POD_dragons_breath:0 "Я глубоко вдыхаю и выдыхаю массивный сгусток пламени прямо в [sc_loser.GetFirstNameNoTooltip]."
 single_combat.0041.desc.sc_attacker.POD_dragons_breath.fatality:0 "[sc_loser.GetSheHe|U] оказывается прямо в центре огненного моря, и я слышу отчаянные крики боли [sc_loser.GetHerHis], а затем тишину."
 single_combat.0041.desc.sc_attacker.POD_dragons_breath.injury:0 "[sc_loser.GetSheHe|U] уклоняется, но едва ли слишком поздно. Пламя охватило [sc_loser.GetHerHim] с фланга, и у моего противника не было другого выбора, кроме как нанести удар, прежде чем мой следующий выдох нанесет еще больший урон."
 single_combat.0041.desc.sc_attacker.POD_long_neck.fatality:0 "Я этого не делаю, и мой противник ранен. Настолько серьезно, что остальная часть боя - это определенное дело."
 single_combat.0041.desc.sc_attacker.POD_murnau_arcana.fatality:0 "Удар взрывается прямо перед лицом врага. А затем взрывается и само лицо."
 single_combat.0041.desc.sc_attacker.POD_oculi_trust.fatality:0 "Враг быстро отступает под моим неумолимым натиском. Загнанный в угол, он беспомощно падает на землю."
 single_combat.0041.desc.sc_attacker.POD_unleash_dogs.fatality:0 "В отместку я бросаю во врага одну из его же собак. Враг рефлекторно ловит её, давая мне более чем достаточно времени для решающего удара."
 single_combat.0041.desc.sc_defender.POD_bark_mudpuppy:0 "Я повышаю голос и изо всех сил реву на [sc_loser.GetFirstNameNoTooltip], что настолько сбивает [sc_loser.GetHerHim], что он допускает фатальную ошибку."
 single_combat.0041.desc.sc_defender.POD_clap_of_thunder:0 "Я хлопаю в ладоши, и внезапный резонансный раскат грома потряс [sc_loser.GetFirstNameNoTooltip] до глубины души."
 single_combat.0041.desc.sc_defender.POD_dragon_slash:0 "Я бросаюсь на [sc_loser.GetFirstNameNoTooltip] серией плавных, хорошо выполненных ударов когтями, и ответ [sc_loser.GetHerHis] оказывается совершенно неэффективным."
 single_combat.0041.desc.sc_defender.POD_dragons_breath:0 "Я выдыхаю массивный сгусток пламени в общем направлении [sc_loser.GetFirstNamePossessiveNoTooltip], что вызывает у [sc_loser.GetHerHim] панику."
