 game_concept_POD_aggravated_box:0 "@health_track_aggravated_damage_icon!"
 game_concept_POD_damage_immunities:0 "Невосприимчивости"
 game_concept_POD_damage_immunity:0 "Иммунитет"
 game_concept_POD_damage_immunity_desc:0 "#bold Immunity#! означает, что [POD_damage_type|E] вообще ничего вам не делает. [pod_combat_moves|E] и способности вне боя этого типа не наносят [POD_damage|E], и события, связанные с этим типом урона, не приводят к смерти. \n\nВ отличие от [soak_damage|E], который никогда не может достичь 100%, невосприимчивость гарантирована. \n\nСм. список [POD_damage_types|E] для [splat|E] по умолчанию. виды невосприимчивости. Дополнительные виды невосприимчивости можно получить из таких источников, как [perks|E], [artifacts|E] или [doctrines|E]."
 game_concept_POD_damage_type:0 "Тип урона"
 game_concept_POD_damage_type_desc:0 "Каждый [splat|E] по-своему уязвим к определённым типам [POD_damage|E] и невосприимчив к другим.\n\nТипы урона чаще всего встречаются в [pod_combat_encounters_with_icon|E], но действуют повсюду, включая события основной игры. Например, персонаж, невосприимчивый к огню, не получает урона в событиях, где его обжигает пламя.\n\nТипы урона:\n$BULLET_WITH_TAB$[fire_damage_short_with_icon]\n$BULLET_WITH_TAB$[cold_damage_short_with_icon]\n$BULLET_WITH_TAB$[lightning_damage_short_with_icon]\n$BULLET_WITH_TAB$[sun_damage_short_with_icon]\n$BULLET_WITH_TAB$[silver_damage_short_with_icon]\n$BULLET_WITH_TAB$[gold_damage_short_with_icon]\n$BULLET_WITH_TAB$[holy_damage_short_with_icon]\n$BULLET_WITH_TAB$[balefire_damage_short_with_icon]\n$BULLET_WITH_TAB$[poison_damage_short_with_icon]\n$BULLET_WITH_TAB$[cold_iron_damage_short_with_icon]"
 game_concept_POD_damage_types:0 "Типы урона"
 game_concept_POD_elixir_of_eternal_life:0 "Эликсир вечной жизни"
 game_concept_POD_elixir_of_eternal_life_desc:0 "Эликсир вечной жизни, пожалуй, самая востребованная сила в $pod_wod$, позволяющая создавать поистине бессмертных существ, чаще всего известных как $POD_splat_mummy_plural$. Там, где Заклинание Жизни — это сокрытая тайна, эликсир вечной жизни — это утерянное знание, предназначенное для повторного открытия в бесконечном цикле, поскольку сам акт открытия является свидетельством вашего достоинства познать его. Даже его меньшие формы обладают [Glossary('бессмертие','podgloss.xianren')], которому позавидовали бы большинство сверхъестественных существ, создавая бесчисленные легенды о бессмертных и аскетах по всему Поднебесной. Однако немногие искали эликсир, поскольку никто не может выпить его, не присягнув хозяину. Остерегайтесь тех, кто жаждет, скорее всего, утонет. \n\nЕсли вы захотите изучить эликсир вечной жизни и причислить себя к таким легендам, вам придется столкнуться со многими проблемами. Залы истории ждут вас!"
 game_concept_POD_immune_to_damage:0 "Невосприимчивость"
 game_concept_POD_spell_of_life:0 "Заклинание Жизни"
 game_concept_POD_spell_of_life_desc:0 "Возможно, самая востребованная сила в $pod_wod$, Заклинание Жизни позволяет создавать поистине бессмертных существ, чаще всего известных как $POD_splat_mummy_plural$. Будь то в [Glossary('поиск равновесия','podgloss.warofbalance')], создание бессмертной армии или просто достижение истинного бессмертия, многие пролили кровь, сражались и умерли, чтобы понять это чудо, когда-то созданное Исидой и Анубисом, чудо, которое они сами не могли бы усовершенствовать на протяжении тысячелетий. Бесконечная охота Сета за ним привела к созданию [Glossary('вечная война','podgloss.warofbalance')] и неполной, украденной и испорченной версии, которая создала #TOOLTIP:GAME_TRAIT,banemummy,[GetNullCharacter] #L Проклятые мумии#!#!. Почти полная версия, либо обученная Кабиру, либо украденная им, создала #TOOLTIP:GAME_TRAIT,cabiri,[GetNullCharacter] #L Кабири#!#!. \n\nЕсли вы хотите изучить Заклинание Жизни и причислить себя к таким легендарным личностям, вам придется столкнуться со многими проблемами. Залы истории ждут вас!"
 game_concept_POD_superficial_box:0 "@health_track_damage_icon!"
 game_concept_POD_undamaged_box:0 "@health_track_empty_icon!"
 game_concept_antiquity_faiths:0 "Античность"
 game_concept_antiquity_faiths_desc:0 "[SelectLocalization( IsInGame, 'game_concept_antiquity_faiths_desc_ingame', 'game_concept_antiquity_faiths_desc_outofgame' )]"
 game_concept_antiquity_faiths_desc_ingame:0 "Некоторые [characters|E] внутри $pod_wod$ практикуют [faiths|E], которые либо восходят к древним временам, либо боготворят их. В [princes_of_darkness|E] эти [faiths|E]: \n$BULLET_WITH_TAB$[GetReligionByKey('talmahera_religion').GetName] [faiths|E]\n$BULLET_WITH_TAB$[GetReligionByKey('roadofset_religion').GetName] [faiths|E]\n$BULLET_WITH_TAB$[GetReligionByKey('roadofzarathustra_religion').GetName] [faiths|E]\n$BULLET_WITH_TAB$[GetReligionByKey('amenti_religion').GetName] [faiths|E]\n$BULLET_WITH_TAB$@vampire_icon! [GetFaithByKey('childofosiris').GetName]\n$BULLET_WITH_TAB$@vampire_icon! [GetFaithByKey('viamithras').GetName]\n$BULLET_WITH_TAB$@vampire_icon! [GetFaithByKey('eternalsenate').GetName]\n$BULLET_WITH_TAB$@vampire_icon! [GetFaithByKey('shatteredspear').GetName]\n$BULLET_WITH_TAB$@vampire_icon! [GetFaithByKey('pathofwatchfulgods').GetName]\n$BULLET_WITH_TAB$@vampire_icon! [GetFaithByKey('viaentelechia').GetName]\n$BULLET_WITH_TAB$@vampire_icon! [GetFaithByKey('helenacult').GetName]"
 game_concept_antiquity_faiths_desc_outofgame:0 "Некоторые [characters|E] внутри $pod_wod$ практикуют [faiths|E], которые либо восходят к древним временам, либо боготворят их. В [princes_of_darkness|E] эти [faiths|E]: \n$BULLET_WITH_TAB$$talmahera_religion$ [faiths|E]\n$BULLET_WITH_TAB$$roadofset_religion$ [faiths|E]\n$BULLET_WITH_TAB$$roadofzarathustra_religion$ [faiths|E]\n$BULLET_WITH_TAB$$amenti_religion$ [faiths|E]\n$BULLET_WITH_TAB$$childofosiris$\n$BULLET_WITH_TAB$$viamithras$\n$BULLET_WITH_TAB$$eternalsenate$\n $BULLET_WITH_TAB$$shatteredspear$\n$BULLET_WITH_TAB$$pathofwatchfulgods$\n$BULLET_WITH_TAB$$viaentelechia$\n$BULLET_WITH_TAB$$helenacult$"
 game_concept_baghdad_antiquity:0 "Багдад, сердце древности"
 game_concept_baghdad_antiquity_desc:0 "Великий город Багдад расположен на реке Тигр, его древний фундамент прочно укоренился. Город является домом для величайших смертных умов того времени и является одним из величайших городов ислама. Однако его гордое наследие и статус привели его к самоуспокоенности, только великий переворот позволил бы городу сформироваться сверхъестественным. \n#help Приближается великий шторм... #!\n\nПосле определенных событий Багдад может стать одной из четырех версий: \n$BULLET_WITH_TAB$Багдад, Драгоценность Аллаха: Доступно подписчикам [muslim_derived_faiths|E]. Город может снова стать сияющей жемчужиной ислама, великие памятники династии Аббасидов будут восстановлены и вновь обретут свою законную славу. \n\n$BULLET_WITH_TAB$Ctesiphon, Феникс: доступен последователям [antiquity_faiths|E]. Они видят Багдад и вспоминают древний город Ктесифон, славную столицу Сасанидской империи, готовую формироваться по своему желанию. \n\n$BULLET_WITH_TAB$Вавилон, Город Греха: доступен для @demon_icon! Demonic, @vampire_icon! через Diabolis и @vampire_icon! через Hyron. [faiths|E]. Эти демонические силы видят в нем древний город Вавилон. Достопримечательности города настолько глубоко пропитаны грехом, что само их Присутствие наделяет силой обитающих в нем демонов. \n\n$BULLET_WITH_TAB$Восстановленный Багдад: Доступно всем остальным. Здесь Багдад перестраивается в более современный город, без каких-либо грандиозных проектов сверхъестественного.$grand_city_incompatible_tooltip$"
 game_concept_balefire_damage_icon:0 "@wyrm_icon!"
 game_concept_balefire_damage_short:0 "#L;color:{0.55,0.95,0.40} Жертвенное пламя#!"
 game_concept_balefire_damage_short_with_icon:0 "$game_concept_balefire_damage_icon$$game_concept_balefire_damage_short$"
 game_concept_banality:0 "Банальность"
 game_concept_banality_desc:0 "#flavor Банальность — противовес Гламуру. Где Гламур дарует тепло, она несёт холод; где он приносит изобилие — голод, где надежду — безразличие. Это не просто отчаяние, а пустота, неподвижность, отсутствие стремления видеть в жизни что-либо кроме череды бессмысленных привычных действий. Даже печаль и утрата — чувства, полные Гламура и вдохновения. Всё, чего касается Банальность, содрогается и умирает, хотя внешне и продолжает жить.#!\n\nВ [princes_of_darkness|E] Банальность — [trait|E] с растущим уровнем. #bold Каждый год#! все $POD_splat_fae$ и $POD_splat_changeling_plural$ получают Банальность из нескольких источников. Накопив 100 Банальности, китэйн #N;bold развоплощаются (@death_icon!умирают)#!.\n\nСуществует #bold 5#! источников: #weak (подробнее см. подсказки)#!\n$BULLET_WITH_TAB$$game_concept_banality_realm_disbelief$ — Банальность за [counties|E], где [faith|E] враждебна феям или оттесняет их на обочину.\n$BULLET_WITH_TAB$$game_concept_banality_local_disbelief$ — Банальность за нахождение в [county|E], где [faith|E] враждебна феям или оттесняет их на обочину.\n$BULLET_WITH_TAB$$game_concept_banality_reason$ — Банальность за нахождение в [county|E]; её количество зависит от [era|E] местной [culture|E].\n$BULLET_WITH_TAB$$game_concept_banality_fae_hunting$ — Банальность за существование Инквизиции.\n$BULLET_WITH_TAB$$game_concept_banality_despair$ — Банальность за Чёрную смерть.\n\n#P Снизить#! Банальность проще: для этого достаточно завершить [journey|E].\n\n[Glossary('Раскол','game_concept_shattering_desc')] тесно связан с Банальностью. Когда развоплотятся #V 25%#! от числа $POD_splat_fae$ на начало игры, начнётся [Glossary('Раскол','game_concept_shattering_desc')], который нанесёт огромный удар всем живущим феям: они получат [GetModifier('POD_shattering_1_modifier').GetNameWithTooltip] на 50 лет, а $POD_splat_fae$ под управлением ИИ сбегут в [UmbraGlossary('dreaming')]"
 game_concept_banality_despair:0 "#bold;underline;TOOLTIP:game_concept_banality_despair_tt Отчаяние#!"
 game_concept_banality_despair_tt:0 "Одноразовое событие: как только сработает Черная Смерть, все Фейри, живущие в этот момент, получат #N +50#! Банальность."
 game_concept_banality_fae_hunting:0 "#bold;underline;TOOLTIP:game_concept_banality_fae_hunting_tt Охота на фей#!"
 game_concept_banality_fae_hunting_tt:0 "[SelectLocalization( IsInGame, 'game_concept_banality_fae_hunting_tt_ingame', 'game_concept_banality_fae_hunting_tt_outofgame' )]"
 game_concept_banality_fae_hunting_tt_ingame:0 "Каждый [county|E], контролируемый [GetFaithByKey('shadowinquisition').GetName], ежегодно дает всем Фейри [EmptyScope.ScriptValue('yearly_banality_inquisition')|2N=] Банальность."
 game_concept_banality_fae_hunting_tt_outofgame:0 "Каждый [county|E], контролируемый Теневой Инквизицией, ежегодно дает всем Фейри [EmptyScope.ScriptValue('yearly_banality_inquisition')|2N=] Банальность."
 game_concept_banality_local_disbelief:0 "#bold;underline;TOOLTIP:game_concept_banality_local_disbelief_tt Местное неверие#!"
 game_concept_banality_local_disbelief_tt:0 "В сценарии [county|E], в котором вы сейчас находитесь, есть [faith|E], который либо враждебен, либо маргинализирует Фейри, и вы получите Банальность.\n\nТочное количество полученной Банальности основано на [faith|E] [county|E], а точнее на Гламуре. [doctrine|E]:\n$BULLET_WITH_TAB$[GetDoctrine('doctrine_glamour_accepted').GetBaseName] дает #V 0#! Банальность каждый год. \n$BULLET_WITH_TAB$[GetDoctrine('doctrine_glamour_shunned').GetBaseName] дает [EmptyScope.ScriptValue('yearly_banality_disbelief_county_location_half')|N1=] Банальность каждый год. \n$BULLET_WITH_TAB$[GetDoctrine('doctrine_glamour_crime').GetBaseName] дает [EmptyScope.ScriptValue('yearly_banality_disbelief_county_location_full')|N0=] Банальность каждый год. \n$BULLET_WITH_TAB$[GetDoctrine('doctrine_glamour_evil').GetBaseName] дает [EmptyScope.ScriptValue('yearly_banality_disbelief_county_location_evil')|N0=] Банальность каждый год."
 game_concept_banality_realm_disbelief:0 "#bold;underline;TOOLTIP:game_concept_banality_realm_disbelief_tt Неверие во владениях#!"
 game_concept_banality_realm_disbelief_tt:0 "Каждый [county|E] в вашем [realm|E], который следует за [faith|E], отличным от [GetReligionFamily('rf_fae').GetName] [religion|E], даст вам Банальность.\n\nТочное количество указанной Банальности основано на [faith|E] [county|E], а точнее на Гламуре. [doctrine|E]:\n$BULLET_WITH_TAB$[GetDoctrine('doctrine_glamour_accepted').GetBaseName] дает #V 0#! Банальность каждый год. \n$BULLET_WITH_TAB$[GetDoctrine('doctrine_glamour_shunned').GetBaseName] дает [EmptyScope.ScriptValue('yearly_banality_disbelief_county_half')|N1=] Бан каждый год.\n$BULLET_WITH_TAB$[GetDoctrine('doctrine_glamour_crime').GetBaseName] дает [EmptyScope.ScriptValue('yearly_banality_disbelief_county_full')|N0=] Банальность каждый год. \n$BULLET_WITH_TAB$[GetDoctrine('doctrine_glamour_evil').GetBaseName] дает [EmptyScope.ScriptValue('yearly_banality_disbelief_county_evil')|N1=] Банальность каждый год."
 game_concept_banality_reason:0 "#bold;underline;TOOLTIP:game_concept_banality_reason_tt Разум#!"
 game_concept_banality_reason_tt:0 "Единственный источник Банальности, который невозможно полностью остановить без цели.\n\nКаждый год вы будете получать Банальность на основе [era|E] или [culture|E] в [county|E], в котором вы сейчас находитесь: \n$BULLET_WITH_TAB$[GetCultureEraType('culture_era_final_nights').GetName]: [EmptyScope.ScriptValue('yearly_banality_final_nights')|0N=].\n$BULLET_WITH_TAB$[GetCultureEraType('culture_era_gothic_victorian').GetName]: [EmptyScope.ScriptValue('yearly_banality_gothic_victorian')|0N=].\n$BULLET_WITH_TAB$[GetCultureEraType('culture_era_dark_fantastic').GetName]: [EmptyScope.ScriptValue('yearly_banality_dark_fantastic')|0N=].\n$BULLET_WITH_TAB$[GetCultureEraType('culture_era_late_medieval').GetName]: [EmptyScope.ScriptValue('yearly_banality_late_medieval')|0N=].\n$BULLET_WITH_TAB$[GetCultureEraType('culture_era_high_medieval').GetName]: [EmptyScope.ScriptValue('yearly_banality_high_medieval')|0N=].\n$BULLET_WITH_TAB$[GetCultureEraType('culture_era_early_medieval').GetName]: [EmptyScope.ScriptValue('yearly_banality_early_medieval')|0N=].\n\nЛюбой [era|E], не упомянутый здесь, не дает никакой банальности."
 game_concept_banality_with_icon:0 "@banality_icon!Банальность"
 game_concept_blood_inception:0 "Зарождение в крови"
 game_concept_blood_inception_desc:0 "[SelectLocalization( IsInGame, 'game_concept_blood_inception_desc_ingame', 'game_concept_blood_inception_desc_outofgame' )]"
 game_concept_blood_inception_desc_ingame:0 "Ритуал прямого обращения, проводимый над заключенным в тюрьму вампиром. Асакку открывает вену и кормит заключенного до тех пор, пока сущности не будет где жить. \n\nA Взаимодействие с персонажем разблокируется, как только вы станете Асакку. Цели должны быть [imprisoned|E] $POD_splat_vampire_plural$ без [Glossary('Истинная вера','game_concept_true_faith_desc')]. Ритуал полностью обходит [soul_infection|E]. Заключенный появляется как [GetTrait('POD_asakku_asakku').GetName( GetNullCharacter )] с верой [GetFaithByKey('corruptedway').GetName] и [GetTrait('vicissitude').GetName( GetNullCharacter )], если ее у них нет."
 game_concept_blood_inception_desc_outofgame:0 "Ритуал прямого обращения, проводимый над заключённым вампиром. Асакку вскрывает вену и поит узника кровью, пока тот не станет вместилищем сущности.\n\nВзаимодействие становится доступным, когда вы становитесь Асакку. Цели — [imprisoned|E] существа «$POD_splat_vampire_plural$» без [Glossary('Истинной веры','game_concept_true_faith_desc')]. Ритуал полностью обходит [soul_infection|E]. Узник становится [GetTrait('POD_asakku_asakku').GetName( GetNullCharacter )], принимает веру $corruptedway$ и получает свойство [GetTrait('vicissitude').GetName( GetNullCharacter )], если прежде его не было."
 game_concept_bunk_with_icon:0 "@changeling_icon!Банк"
 game_concept_cantrip_with_icon:0 "@changeling_icon!Заклятие"
 game_concept_court_leader:0 "Лидер двора"
 game_concept_court_leader_desc:0 "У каждого из китэйнов [Concept('religion', 'Дворы')] есть формальный (в большинстве случаев) лидер, которому другие $POD_splat_fae$ доверяют в определении позиции всего [Concept('religion', 'Двор')]."
 game_concept_delirium:0 "Делирий"
 game_concept_delirium_desc:0 "Делирий — это непреодолимый инстинктивный страх, который поражает людей, которые видят $glossary_fera$ в различных формах. Их [GetTrait('kinfolk').GetName(GetNullCharacter)] естественным образом невосприимчивы к нему. \nДелириум применяется к персонажам, когда они сталкиваются с Фера, командующим [army|E], или в [pod_combat_encounters|E]. \n\nДелириум бывает двух уровней: \n$BULLET_WITH_TAB$[GetModifier('POD_delirium_modifier').GetNameWithTooltip], который в основном применяется боевыми формами Фера, такими как [GetModifier('POD_werewolf_form_crinos_modifier').GetNameWithTooltip].\n$BULLET_WITH_TAB$[GetModifier('POD_reduced_delirium_modifier').GetNameWithTooltip] от меньших форм оборотней, таких как [GetModifier('POD_bastet_form_chatro_modifier').GetNameWithTooltip].\n\nБольшинство сверхъестественных существ невосприимчивы, и только [mortal_like_splats|E] (кроме $POD_splat_kinfolk_plural$) подвержен Делириуму.\nДругое на знаки могут повлиять, если у Феры есть способ обойти иммунитет, такой как [GetPerk('ancient_terror_perk').GetName(GetNullCharacter)]. На самих Фера это никогда не повлияет."
 game_concept_easy_bunk:0 "#glow_color:{0.0,1.0,0.0,0.3} Простой#! банк"
 game_concept_epiphanies:0 "Прозрения"
 game_concept_epiphanies_desc:0 "#flavor Прозрения — общее название способов, которыми китэйн получают Гламур от смертных или создают его сами.#!\n\nВ [princes_of_darkness|E] прозрения — основной способ добычи Гламура для фей. Сейчас существует #bold 3#! способа:\n$BULLET_WITH_TAB$[reverie|E] — благороднейший способ: Гламур рождается из творчества смертных.\n$BULLET_WITH_TAB$[revelry|E] — самый естественный способ: Гламур рождается из собственной природы феи.\n$BULLET_WITH_TAB$[ravaging|E] — самый тёмный способ: фея похищает весь творческий потенциал смертного ради Гламура."
 game_concept_epiphanies_quality:0 "Качество"
 game_concept_epiphanies_quality_desc:0 "Не все $POD_splat_mortal_plural$ одинаковы: одни от природы более творческие, а другие склонны к банальности. Поэтому в глазах китэйн некоторые $POD_splat_mortal_plural$ желаннее прочих.\n\nУ каждого $POD_splat_mortal$ [character|E] есть #bold качество#!, определяющее, сколько пользы принесут применённые к нему [reverie|E] и [ravaging|E].\n\nВажнейшие факторы, определяющие качество [character|E]:\n$BULLET_WITH_TAB$Уровень [trait|E] «[GetTrait('intellect_good_2').GetName(GetPlayer)]».\n$BULLET_WITH_TAB$Способы снятия стресса: отрицательные понижают качество, а положительные повышают.\n$BULLET_WITH_TAB$Некоторые положительные [traits|E], например «[GetTrait('lifestyle_poet').GetName(GetPlayer)]» или «[GetTrait('shrewd').GetName(GetPlayer)]».[AddLocalizationIf(HasDlcFeature( 'royal_court' ), 'game_concept_epiphanies_quality_desc_inspiration')]"
 game_concept_epiphanies_quality_desc_inspiration:0 "\n$BULLET_WITH_TAB$[inspiration|E]."
 game_concept_exceptional_bunk:0 "#glow_color:{1.0,0.0,0.0,1.0} Исключительный#! банк"
 game_concept_hard_bunk:0 "#glow_color:{1.0,0.0,0.0,0.5} Сложный#! банк"
 game_concept_hollr_bjarkarey:0 "Бьяркарей, Воющий берег"
 game_concept_hollr_bjarkarey_desc:0 "Пропитанный кровью город Бьяркарей непоколебимо стоит как последний бастион Асов. Многие стремятся взять ее под контроль, чтобы либо укрепить последний бастион Старой Веры, либо сокрушить ее раз и навсегда. Существует три версии города: \n\n$BULLET_WITH_TAB$Hollr Bjarkarey: доступен любому $POD_splat_vampire$, следующему через Einherjar или Via Aesigard. Бьяркарей по-прежнему остается убежищем для северян, которые все еще следуют старым путям и бросают вызов Белому Христу. \n\n$BULLET_WITH_TAB$Hvítakristr Бьяркарей: доступен [GetTrait('ventrue').GetName(GetNullCharacter)] или любому $POD_splat_vampire$, следующему Дороге Небес или Кровавому гностицизму. Эта версия представляет собой Бьяркарея, который был побежден Крестом и теперь распространяет слово Божье, или Каин. \n\n$BULLET_WITH_TAB$ Зал Ульфа: доступен всем остальным. Хотя сам Бьяркарей, возможно, не имеет большого значения или власти, знаменитый Зал Ульфа по-прежнему делает его желанным местом силы для любого амбициозного мужчины или женщины.$grand_city_incompatible_tooltip$"
 game_concept_maeljingifts_lifestyle:0 "Дары Маэлджинов"
 game_concept_maeljingifts_lifestyle_desc:0 "Маэлджины — могущественные инкарны-бейны, служащие Вирмам Побуждения. Когда требуется прямое вмешательство, они становятся глазами, ушами, голосами, а порой и руками своих повелителей."
 game_concept_mortal_like_splat:0 "Вид, близкий к смертным"
 game_concept_mortal_like_splat_desc:0 "Некоторые [splats|E] либо полностью люди, либо наделены небольшой долей сверхъестественной крови, которая наделяет их незначительными способностями. В [princes_of_darkness|E] это: \n$EFFECT_LIST_BULLET$$POD_splat_mortal_plural_with_icon$\n$EFFECT_LIST_BULLET$$POD_splat_hunter_plural_with_icon$\n$EFFECT_LIST_BULLET$$POD_splat_ghoul_plural_with_icon$ и $POD_splat_revenant_plural_with_icon$\n$EFFECT_LIST_BULLET$$POD_splat_dhampyr_plural_with_icon$\n$EFFECT_LIST_BULLET$$POD_splat_kinfolk_plural_with_icon$\n$EFFECT_LIST_BULLET$$POD_splat_kinain_plural_with_icon$\n$EFFECT_LIST_BULLET$$POD_splat_laham_plural_with_icon$ и $POD_splat_nephilim_plural_with_icon$\n\nЭти персонажи, как правило, имеют те же сильные и слабые стороны, что и обычные люди. Они могут изучить #TOOLTIP:GAME_TRAIT,sorcerer,[GetNullCharacter] #L Волшебство#!#! благодаря своему человеческому стремлению и относительно неповреждённому Аватару, а также могут посещать университет. Однако на них влияет [delirium|E] (кроме родичей). Некоторые задачи могут потребовать от вас поиска смертных персонажей или экспериментов с ними."
 game_concept_mortal_like_splats:0 "Виды, близкие к смертным"
 game_concept_passive_cantrip:0 "Пассивное заклятие"
 game_concept_passive_cantrip_desc:0 "#bold Пассивные заклятия#! — особый тип [cantrips|E], которые срабатывают автоматически, без [character_interaction|E]. В отличие от обычных [cantrips|E], пассивные #italic требуют для работы#! соответствующую [fae_realm|E]. Обычные [cantrips|E] при её отсутствии лишь получают штраф к стоимости."
 game_concept_passive_cantrip_with_icon:0 "@changeling_icon!Пассивное заклятие"
 game_concept_princes_of_darkness:0 "Князья тьмы"
 game_concept_ravaging:0 "Опустошение"
 game_concept_ravaging_desc:0 "#flavor Опустошение считается самым тёмным способом добычи Гламура: его буквально вырывают из души смертного. Это наносит непоправимый вред разуму жертвы. Благие считают его ненужным злом и осуждают тех, кто его практикует; Неблагих же это ничуть не беспокоит.#!\n\nВ [princes_of_darkness|E] опустошение — [character_interaction|E] с $POD_splat_mortal_plural$, при котором фея получает Гламур и опыт [lifestyle|E] в зависимости от [epiphanies_quality|E] у $POD_splat_mortal$, ценой снижения [epiphanies_quality|E] у $POD_splat_mortal$.[AddLocalizationIf(HasDlcFeature( 'royal_court' ), 'game_concept_ravaging_desc_inspiration')]"
 game_concept_ravaging_desc_inspiration:0 " Если $POD_splat_mortal$ имеет [inspired|E], то [inspiration|E] будет удалено вместо снижения базового [epiphanies_quality|E]."
 game_concept_receive_into_the_dream:0 "Принять в Мечту"
 game_concept_receive_into_the_dream_desc:0 "После Второй Мечты Михаил может взять вампира, у которого уже есть Кодекс Наследий, и приобщить его к собственной крови. Это повторное Становление, а не просто обращение. Получатель попадает в клан [GetTrait('baali').GetName(GetNullCharacter)] и в собственный дом Михаила. Это работает за счет благочестия и его собственного витэ, и получить его может только вампир, который уже следует Кодексу."
 game_concept_reduced_delirium:0 "Ослабленный делириум"
 game_concept_revelry:0 "Празднество"
 game_concept_revelry_desc:0 "#flavor Все феи сотканы из грёз человечества, которые дали им причину существовать — основную идею, лежащую в основе их природы. Хотя феи не обязаны ей следовать, они могут получать Гламур, совершая поступки, соответствующие их киту.#!\n\nВ [princes_of_darkness|E] все китэйн могут получать 1 Гламур каждые 2 года, если выполняют особые условия своего кита. Подробнее см. [traits|E] китов."
 game_concept_reverie:0 "Мечтание"
 game_concept_reverie_desc:0 "#flavor Мечтание считается благороднейшим способом добычи Гламура. Фея помогает смертному развивать творческий дар и вдохновляет Мечтателя обратиться к Грёзам. Вдохновлённый смертный затем создаёт произведение, наполненное Гламуром.#!\n\nВ [princes_of_darkness|E] мечтание автоматически даёт Гламур от всех $POD_splat_mortal$, с которыми у вас есть [relations|E], раз в несколько лет. Промежуток между получениями Гламура зависит от [epiphanies_quality|E] у $POD_splat_mortal$.\n\nКаждый случай мечтания, независимо от [epiphanies_quality|E] у $POD_splat_mortal$, даёт 1 Гламур, 20 опыта [realm_lifestyle|E] и 10 опыта [common_arts_lifestyle|E]."
 game_concept_roma_aeterna:0 "Вечный Рим"
 game_concept_soul_infection:0 "Заражение души"
 game_concept_soul_infection_desc:0 "[SelectLocalization( IsInGame, 'game_concept_soul_infection_desc_ingame', 'game_concept_soul_infection_desc_outofgame' )]"
 game_concept_soul_infection_desc_ingame:0 "Состояние-носитель заразы Асакку. Предоставляется вампирам через Заражение Души [scheme|E] или засеивается другими событиями, связанными с Асакку. \n\nA черта, которая пассивно накапливает Порчу Асакку каждые три года (+1 или +2/+3 с [GetTrait('vicissitude').GetName( GetNullCharacter )] / [GetTrait('vicissitudeadvanced').GetName( GetNullCharacter )]). На глубине 25 носитель трансформируется в полноценного [GetTrait('POD_asakku_asakku').GetName( GetNullCharacter )] и обретает веру [GetFaithByKey('corruptedway').GetName]. Цели с [Glossary('Истинная вера','game_concept_true_faith_desc')] не могут быть заражены, а модификатор устойчивости к заражению души блокирует новые попытки."
 game_concept_soul_infection_desc_outofgame:0 "Состояние-носитель заразы Асакку. Предоставляется вампирам через Заражение Души [scheme|E] или засеивается другими событиями, связанными с Асакку. \n\nA черта, которая пассивно накапливает Порчу Асакку каждые три года (+1 или +2/+3 с [GetTrait('vicissitude').GetName( GetNullCharacter )] / [GetTrait('vicissitudeadvanced').GetName( GetNullCharacter )]). На глубине 25 носитель трансформируется в полноценного [GetTrait('POD_asakku_asakku').GetName( GetNullCharacter )] и обретает веру $corruptedway$. Цели с [Glossary('Истинная вера','game_concept_true_faith_desc')] не могут быть заражены, а модификатор устойчивости к заражению души блокирует новые попытки."
 game_concept_standard_bunk:0 "#glow_color:{1.0,0.8,0.0,0.3} Обычный#! банк"
 game_concept_suspicion_with_icon:0 "@masquerade_icon:color_goldy_yellow! Подозрение"
 game_concept_translation_minigame:0 "Перевод"
 game_concept_translation_minigame_desc:0 "Перевод — это мини-игра, вдохновленная такими играми, как Wordle и Bulls & Cows.\n$BULLET_WITH_TAB$Вы выиграете, угадав правильный ответ\n$BULLET_WITH_TAB$Каждая догадка должна состоять из 5 букв, но не обязательно должна быть словом.\n$BULLET_WITH_TAB$Используйте клавиатуру события, чтобы ввести догадку\n$BULLET_WITH_TAB$Использовать \"<-\" как backspace\n$BULLET_WITH_TAB$Последующие предположения не обязательно должны включать правильные буквы\n$BULLET_WITH_TAB$Нажмите \"Давайте попробуем\", чтобы отправить свое предположение\n$BULLET_WITH_TAB$Буквы в правильном положении: выделены зеленым \n$BULLET_WITH_TAB$Буквы, которые есть в ответе, но находятся в неправильном положении, выделены желтым \n$BULLET_WITH_TAB$Буквы, которых нет в ответе, выделены серым цветом\n$BULLET_WITH_TAB$У вас 6 догадок\n$BULLET_WITH_TAB$Ответы могут быть во множественном числе, прошедшем времени, существительные, собственные существительные, географические названия, глаголы, прилагательные, наречия и многое другое.\n$BULLET_WITH_TAB$Буквы в ответе могут встречаться более одного раза\n$BULLET_WITH_TAB$Ответы будут тематическими в зависимости от награды в мини-игре."
 game_concept_victorious_cairo:0 "Каир, Победоносный"
 game_concept_victorious_cairo_desc:0 "Иногда ее называют Умм ад-Дунья («Матерь мира»). Первоначально город Фустат, этот регион был застроен персами, римлянами, византийцами и, наконец, арабами, которые окрестили его Аль-Кахира («Победоносный»). Существует три версии города: \n\n$BULLET_WITH_TAB$Древний Каир: доступен всем членам $glossary_osirian_league$ и Измаильтянам #TOOLTIP:GAME_TRAIT,mummy,[GetNullCharacter] #L Mummies#!. Получите уникальные силы, собрав Осирианцев в священном Каире. Вам потребуются все участники с навыками [councillors|E], чтобы раскрыть весь потенциал города. \n#warning Настоятельно рекомендуется играть на третьей закладке. Эта версия также полностью отключена в первой закладке. #!\n\n$BULLET_WITH_TAB$Vampiric Cairo: Доступен #TOOLTIP:GAME_TRAIT,vampire,[GetNullCharacter] #L вампирам #!. Создавайте и расширяйте $glossary_khittas$, чтобы расширить Каир и повысить эффективность ваших [councillors|E] и [court_positions|E]. Веры с Столпами [Glossary('Аширры','game_concept_ashirra_desc')] [doctrine|el] получают дополнительные бонусы за построение Хитт, ориентированных на Аширру. Сетиты могут перестроить свои храмы, чтобы создать свою собственную Дорогу Сета. [faith|El].\n\n$BULLET_WITH_TAB$Исламский Каир: доступен всем остальным. Но только охотники Ихван ас-Сафа могут раскрыть истинный потенциал этого города.$grand_city_semi_incompatible_tooltip$"
 passive_cantrip_actor:0 "[passive_cantrip_with_icon|E] #weak (#medium $fae_actor_realm$#! [fae_realm|E])#!:"
 passive_cantrip_fae:0 "[passive_cantrip_with_icon|E] #weak (#medium $fae_fae_realm$#! [fae_realm|E])#!:"
 passive_cantrip_nature:0 "[passive_cantrip_with_icon|E] #weak (#medium $fae_nature_realm$#! [fae_realm|E])#!:"
 passive_cantrip_prop:0 "[passive_cantrip_with_icon|E] #weak (#medium $fae_prop_realm$#! [fae_realm|E])#!:"
