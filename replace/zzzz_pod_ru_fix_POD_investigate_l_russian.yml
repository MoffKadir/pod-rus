 POD_investigate.1.t.a:0 "Энциклопедия Вампирика"
 POD_investigate.desc.505130:0 "Уроженец Уэруика, этот Вентру и Антониус (тогда его звали Антиорикс) прибыли в Галлию примерно во время основания Массилии. Быстро утвердившись, они правили эдуями, пока Антиорикс не встал на сторону Рима и не привел к падению Галлии. Уэруик бежал в Германию, где переименовал себя в Эрика Эйгермана.\n\nСтав первым известным $pod_cainite$, проживавшим на территории современного Берлина, он открыто правил регионом до конца 12 века, когда его выследил и тяжело ранил охотник Карл Шрект. Говорят, что теперь, в $pod_torpor$, Эйрик по-прежнему влияет на регион Бранденбург, следя за тем, чтобы Вентру его рода всегда контролировали там.\n\nТеория, что Эйрик является [Glossary('сир','game_concept_Sire_desc')] знаменитого Хардештадта, является спорной, поскольку сам этот человек никогда ее не подтверждал. Тем не менее, информированные партии считают его наиболее вероятным кандидатом, что также объясняет, как молодой и политически изолированный Хардештадт смог добиться своего гегемонистского правления над Германией за столь короткое время.\n\nБудущая судьба в Канон\n\nТонкое влияние Эйрика обеспечит господство Вентру над Берлином на столетия. Однако прибытие нового Малкавианского Принца в 2017 году его сильно разочарует, и берлинские вампиры вскоре будут мучиться образами разрушения, когда старый Саксонский шевелится..."
 POD_investigate.desc.505147:0 "Готзон был священником, и его сверстники считали его крестоносцем Господа (некоторые даже называли его \"инквизитором\"). На самом деле его крестовых походов было много. Если бы его спросили, он, вероятно, сказал бы только, что он выполняет работу Господа, но работа, которую требует Бог, действительно кровава. Язычники, еретики, даже демоны и инферналисты – все пали перед ним. Готзон никогда не отвечал на прямые вопросы о своих планах и доверял Богу, который направит его во всем.\n\nПравда в том, что Готзон нашел Бога только после того, как его нашли тени. По причине, которую он теперь уже помнит, Готзон был частью Ласомбра, которые провели ужасающий ритуал «Крик, убивающий свет», вызвавший затмение мира. После этого дня он пообещал себе никогда больше не использовать свои темные силы и вместо этого сосредоточиться на своей благочестивой работе.\n\nХардештадт и Готцон были давними товарищами, когда встретили молодого рыцаря по имени Юрген фон Верден. Оба $pod_cainites$ хотели $pod_Embrace$ многообещающего смертного, но не смогли прийти к пониманию, кто из них лучше подходит, чтобы наложить на него проклятие Каина.\n\nВ конце концов, пара решила, что Юрген сам будет выбирать, будет ли он выполнять Божью работу, следуя учениям Готцона по Дороге Небес, или броситься на путь славы по Дороге Королей, которую предпочитают Вентру Хардештадт.\n\nРыцарь хотел стать победителем, даже если он объяснял это тем, что на самом деле служит воле Бога. Готзон был глубоко разочарован исходом событий, но, тем не менее, согласился. Однако он не отказался от своего протеже и последовал за Юргеном в его приключениях, выступая в роли его духовника, терпеливо пытаясь обратить Отпрыска на Виа Каэли.\n\nБудущая судьба в Канон\n\nДружба Готзона с Юргеном будет продолжаться какое-то время, Ласомбра будет помогать ему в своей загадочной манере, пока преданность Юргена своей любви к Розамунде не разлучит их.\nСсора приведет к разрыву их связи и закончится тем, что Юрген изгонит своего духовника из своих земель."
 POD_investigate.desc.555040:0 "Рожденный в ревенантской семье Басарабов, Драгомир всегда был немного нестабильным. Чрезмерно чувствительный ребенок, его, казалось, трясло от каждого оползня и каждого среза близлежащих деревьев. Поскольку он был весьма умен и смотрел на своего деда с большой любовью, его небольшое отклонение было упущено из виду как естественная связь правителя с землями его предков.\nНа самом деле Драгомир переживал призыв Купалы поступить на службу демону.\n\nПолучив образование рыцаря и воеводы, Драгомир несколько лет служил своему деду (старшему Цимисху по имени Винтила Басараб) в качестве личного помощника. Наконец, Винтила $pod_Embrace$d Драгомира обучила его нескольким дисциплинам Цимисхов. Однако, получив Становление, Драгомир стал еще более странным. Его связь с землей привела его по темным путям к безумию. Его психическое заболевание еще сильнее проявилось в Купаловскую ночь.\nПытаясь вылечить его, Винтила попыталась провести особый ритуал в Купалову ночь. Это не удалось, оставив старшего Цимисха истощенным и во власти своего обезумевшего ребенка. Драгомир диаблеризировал свой [Glossary('сир','game_concept_Sire_desc')], увеличивая генерацию, в то время как сущность его сира объединялась с его собственной, отправляя его через край в полномасштабное безумие.\n\nДрагомир с тех пор существует один, за исключением одного гуля, отрезанного от мира. Купала пытался убедить молодого $pod_cainite$ путешествовать и распространять влияние демона, но вина Драгомира за смерть его сира не позволяет ему сделать это.\n\nБудущая судьба в Канон\n\nДрагомир становится все более и более невменяемым в первые ночи Шабаша и безрассудного потворства ему. Вместо того, чтобы позволить ему скомпрометировать свои планы (у него появляется одиозная привычка кричать во все горло, когда достаточно просто поговорить), несколько товарищей Цимисхов бросают Драгомира в руки инквизиции."
 POD_investigate.desc.710101:0 "Перс $pod_cainite$, впечатленный рассказами о тогдашнем Вавилоне в Египте, Набонид пришел искать своего хозяина, Агониста, для наставничества. Согласно легенде, эти двое тихо собрались в скромных покоях Агониста внутри крепости, разговаривая приглушенными голосами в теплую египетскую ночь. На рассвете, поговорив о многом, Набонид предложил покинуть Вавилон, если его милостивый хозяин того пожелает. Агонист отказался, вместо этого предложив расширенное гостеприимство своему маловероятному персидскому гостю и тем самым вступив в партнерство, которое перерастет в то, о чем ни один из них никогда не мечтал. \n\nВ 450 году нашей эры Набонид покинул Вавилон, чтобы вернуться на свою родину впервые за почти тысячу лет. Дела в Египте кипели, и у Набонида были срочные дела на востоке. \n\nПравда заключалась в том, что Набонид был одним из основателей секретной фракции, известной как Таль'махе'Ра, в частности ее ветви Хранителей Знаний, и что секта вступила в период гражданской войны. Набонид оказался перенапряжен, двое его детей остались в Вавилоне и не смогли сдержать Последователей Сета. Поэтому он выбрал $pod_Embrace$ знаменитую Антару, чтобы руководить регионом вместо себя. Несмотря на несколько неудач с тех пор, Набонид продолжает служить терпеливым наставником часто конфликтующего поэта-воина."
 POD_investigate.desc.790198:0 "Мария Изабелла д'Агостино родилась в семье влиятельных купцов в Генуе и выросла с чувствами человека, рожденного править. Генуя начала свой рост как торговая держава, и богатство, принесенное дому д'Агостино, позволило купить ей слуг, богатые шелковые одежды из Константинополя и все вещи, которые она стала считать своей законной обязанностью.\n\nХотя ее учили, что подобающее место женщины — это жена, мать и хозяйка домашнего хозяйства, Мария была очарована торговлей и искусством коммерции. У нее проявились способности к математике и бизнесу, что многие в ее семье считали неприличным. Отец, однако, потворствовал ей, не в последнюю очередь потому, что ей нужен был более способный ученик, чем ее придурок, старший брат Рожерио, номинальный наследник.\n\nКогда ее отец внезапно умер, а брат попытался продать ее семье Фиески, Мария нанесла ему удар ножом в сердце. В ночь перед казнью ее посетил тот, кто станет ее [Glossary('сир','game_concept_Sire_desc')].\n\nВскоре она преуспела как Ласомбра, взяв под контроль власть и богатство своей семьи из тени, пока старейшины Ласомбра не заметили ее талант и не отправили ее в Святую Землю, чтобы поддержать там свои интересы. Однако, несмотря на все свои усилия, она не смогла помешать влиянию Юргена фон Вердена и захвату Акры.\nЭта неудача привела к тому, что ее перенаправили в рушащийся византийский мир, где она теперь полна решимости доказать, что достойна больших ожиданий своих старших."
 POD_investigate.desc.790263:0 "Еретик-епископ Аквитании Ранульф, британский Тореадор в седьмом поколении, прикрепленный к двору Плантагенетов в Аквитании, просто ищет власти, как для своего $pod_clan$ в целом, так и конкретно против конкурирующего Тореадора в Британии.\nХозяин большой сети еретических церквей в Аквитании и Гаскони, он пробрался на престол, когда Тореадор проникли в папскую бюрократию в 1130-х годах. Он несет ответственность за Королевство Англии и его владения во Франции.\n\nВлияние епископа когда-то распространялось на юг Франции с известными центрами в Ажене, Бордо и Сен-Ирей-ла-Перш. Ранульф имел прочные связи с Тулузой, но Альбигойский крестовый поход и медленное падение каинитской ереси вынудили его переехать в Базас, где он остается последним (относительно) крупным еретическим присутствием во Франции после смерти парижского епископа Сен-Лисского."
 POD_investigate.desc.790285:0 "Биндусара родился примерно во времена Чандрагупты Маурья в Паталипутре как член касты кшатриев. Ни его [Glossary('сир','game_concept_Sire_desc')], ни обстоятельства его знакомства с молодым воином неизвестны, но когда внук Чандрагупты, Ашока, взошел на трон и основал свою первую великую Индийскую империю, мафусаил Вентру уже был рядом с ним. \n\nОн долго не интересовался политическими интригами того времени и покинул Индию ради оккультных тайн мира. Он добрался до Римской империи и там наблюдал за историками. Он путешествовал больше, чем большинство других членов его клана, проводил и финансировал раскопки, а также вкладывал деньги в усилия грабителей могил. \n\nВ Эрджиесе он изучал Книгу Нод с помощью каппадокийцев. В Египте он посетил Огненный двор Неферу, чтобы найти ответы на свои вопросы. Хотя многие утверждают, что Вентру движимы только жаждой власти, они могут обвинить Биндусару в том, что им доминирует жажда знаний и понимания.\n\nБудущая судьба в Каноне\n\nСегодня Биндусара проживает в Александрии, изучая закономерности Джихада и предзнаменования Геенны. Он нажил себе врагов среди Мнемозины, Инконню и Иокастианцев."
 POD_investigate.desc.790308:0 "Возможно, самый известный софист в свои смертные дни, Критий, острый вопрос и остроумие, позволили ему быть изгнанным из Афин. За день до своего отъезда он встретил своего самого большого поклонника, Бруха Менеле. \nЗанимаясь энергичными дебатами о природе жизни, смерти и роли философии в обоих случаях. Критий стал жертвой своего собственного метода и понял, что его собственные указы и философия реальны, существенны и стоят того, чтобы за них умереть. Или, возможно, впервые ради этого стоит жить. Признав поражение, Менеле предложил Критию новый выбор: умереть за правду прямо здесь и сейчас или жить вечно и вести себя как овод по отношению к миру. Критий выбрал $pod_Embrace$.\n\n. Пара путешествовала по миру, пока не прибыла в Карфаген. Они использовали город, чтобы спланировать новый золотой век Сородичей и смертных, когда короли-философы будут править с логикой, уважением и демократическими дебатами. Критий быстро увлекся великим замыслом и страстно посвятил себя этому делу. К сожалению, он исследовал Китай, когда услышал известие о падении Карфагена, а также слухи о смерти его [Glossary('сир','game_concept_Sire_desc')]. \n\nС тех пор Критий был бесцелен, отчаявшись увидеть, как Бруха превращаются в головорезов и бандитов вместо королей-философов прошлого.\n\nБудущая судьба в Канон\n\nКритиас переедет в Новый Мир без его ведома из-за тонкого призыва Мелен. Поселившись в Чикаго, он будет участвовать в тамошней политике и основать Школу Энтелехии... до настоящей смерти Менеле и разрыва его кровных связей. \n\nКритиас впадет в панику из-за осознания того, что Менеле мог манипулировать им на протяжении тысячелетий, что вынуждает его принимать решительные и неприятные меры, чтобы убедиться, что его жизнь по-прежнему принадлежит ему."
 POD_investigate.desc.790396:0 "Известно, что Теотукапис активно действовала в Дамаске, оказывая помощь местным Ассамитам, искавшим Баали, у которого, по слухам, было большое логово под городом. Она работала вместе с ассамитским визирем Махмудом аль-Асраном, к которому позже обратилась по просьбе своих старейшин.\n\nПоследователи Сета хотели объединиться с Детьми Хакима, чтобы очистить Детей Иуды, еретическую секту, возникшую в Константинополе и упивавшуюся демонолатрией, превратив Сета в еще одного адского зверя на службе сатане. Поскольку ересь распространилась по Европе после падения Константинополя с угрожающей скоростью, Иерофанты стремились натравить Ассамитов против них самих и последовавших за ними Баали.\n\nВзамен клан предложил Аламуту помощь в снятии кровавого проклятия Баали, наложенного в 636 году нашей эры, а также поддержку в вдохновении арабского населения на изгнание неверных с Ближнего Востока."
 POD_investigate.desc.790430:0 "Старый и злобный феодальный барон Франции, правящий своими подданными, выдавая себя за смертного дворянина, Вольгирре — мелкий и садистский человек, не имеющий большого значения для действий истинных сил в регионе. Большинство считают его немногим лучше Цимисха и пятном царственного поведения французского Тореадора. \n\nПо правде говоря, влияние барона Волгирре на клан Тореадор большинством недооценивается. Жестокий и садистский, он на протяжении веков поддавался многим самым низменным побуждениям клана как настоящий Барон, так же, как это делали Цимисхи на родине своих предков. Известно, что он также изучал их искусство создания плоти, передав это необычное мастерство некоторым линиям своих собственных детей. На протяжении веков он владел $pod_Embraced$ и убил десятки детей.\nВ то время как большинство Тореадор презирали бы Барона публично, у некоторых в частном порядке свои убежища и охотничьи угодья завалены телами своих жертв, как и он сам.\n\nБудущая судьба в Каноне\n\nА сам Волгирре будет встретит заслуженную судьбу от рук одного из своих детей, его род намного переживет его. Волгирре Тореадор станут собственной родословной, воплощая в Шабаше свое ужасающее видение \"art\" на протяжении столетий."
 POD_investigate.desc.790474:0 "Мастер эфемерного искусства снов и магии разума, Тереза не осознавала трансформацию своего дома до тех пор, пока сама не нашла свой $pod_Embrace$d во время завета в 1139 году. Зная, что ее старый Дом проклял себя своим решением, Совету пришлось заключить ее в кровные узы за подработку.\nЕе отправили в Грецию, чтобы основать там часовню, но когда ей приснился ужасный кошмар, показавший ей диаблеризацию Саулота и последующее остракизм Салюбри, она уехала в Константинополь, где ее приветствовал Джезу, и она встретила Салюбри Ахмета, который послал ей видения во сне, которые она испытала.\n\nЭкспериментируя со снами, тауматургическими ритуалами и путями, она стала членом Круга Снов, скрываясь от Абеториуса, посланного посланником Цеориса. Однако, чтобы завершить свое развитие Пути Снов, она в конце концов диаблеризировала Ахмета, когда потеряла свою душу из-за опасностей магии крови."
 POD_investigate.desc.790813:0 "Деметрий был среди греческих колонистов, основавших древний портовый город Массилия задолго до прихода к власти Рима. Выдающийся член клана Вентру, Деметриус на протяжении столетий занимал пост принца Массилии после того, как отобрал у Бруха территорию, присоединенную к Карфагену. \n\nОднако, когда столетия спустя весь юг Франции попал под власть Рима, Массилия довольно долго оставалась свободным городом. Однако в конце концов, когда Юлий Цезарь завоевал Галлию, спасения уже не было, и хотя он работал со своими товарищами по клану в Риме, помогая им при необходимости, автономия его любимого города исчезла, когда римские войска штурмовали его ворота в первом веке до нашей эры. - пренебрежение, которое Деметрий никогда бы не простил. \n\nОн пришел в ярость и обвинил одного из старейших Вентру в Риме, Гая Фабрициуса, в том, что тот не смог превратить Юлия Цезаря в пешку. Поначалу Гай не питал к греку никакой неприязни, но быстро взял на себя вражду в отместку за постоянные нападения Деметрия. \n\nДеметрию пришлось бежать из города в 838 году, когда он был разграблен сарацинами, и едва избежать окончательной смерти от рук убийц, подосланных Фабрицием. Отправившись к своему [Glossary('сир','game_concept_Sire_desc')] Александру за помощью, он вместо этого был быстро изгнан в наказание за свою слабость. С тех пор он нашел убежище у Тита Брута Цезаря и замышляет свое возвращение на трон Марселя или даже самой Франции. \n\nБудущая судьба в Каноне\n\nДеметрий не достигнет ни одной из этих целей и вместо этого будет тлеть в своей вражде против Фабриция. Их ярость распространится даже на их потомков, потомков их потомков и так далее. Хотя оба они считаются каинитами могущественного поколения, они, как известно, вымещают свою агрессию на скромных неонатах, которые могут претендовать на происхождение соперника. Зачастую соперник даже не подозревает о существовании бедного потомка."
 POD_investigate.desc.790856:0 "О Симоне мало что известно, кроме того, что он, вероятно, родился на Ближнем Востоке во времена римской оккупации и что он был человеком высокой образованности. \n\nВ один неопределенный момент после падения Рима Симон завладел пещерой (в которой хранились старые наскальные рисунки доантичного периода) на Мальте и использовал ее для хранения книг и свитков. Его библиотека обширна и включает не только тексты на латыни, греческом, иврите, арабском и арамейском языках, но также архаические письменности кельтов и даже тексты на енохианском языке. У Саймона также есть небольшая коллекция текстов о демонологии, эротике, войне и оккультизме, которую он скрывает от остальной части своей коллекции. Часть пещеры закрыта, и Саймон не проявил желания идти дальше. \n\nПутешественники, желающие войти в библиотеку, должны искать аудиенции у Саймона, который не идет на встречу и при необходимости будет защищать свою коллекцию. Он лишь изредка покидает свою пещеру, чтобы отправиться в итальянские города для обсуждения более серьезных дел, избегая дворов себе подобных. Саймон также проявлял интерес к растущим университетам, часто снабжая их текстами из своей коллекции с неизвестными намерениями. \n\nНаконец, он также известен как один из немногих друзей Салюбри, которые все еще остались у Салюбри в эти тяжелые времена. Некоторые из них пришли к нему, чтобы убедиться, что их наследие выживет, поскольку Саймон записывает на бумагу свое героическое прошлое, рассказанное их собственными словами."
 POD_investigate.desc.790942:0 "Единственная дочь власской соблазнительницы и славянского военачальника, Кара была рождена для величия. Когда проявилась темная кровь ее матери, она принесла кровную клятву под Владимиром Рустовичем, в то время честолюбивым боярином на границе. Она провела десятилетия на его службе, с одинаковым рвением изучая военное искусство и куртуазные игры. Когда Владимир $pod_Embrace$ напал на нее, она уже была силой, с которой нужно было считаться.\n\nС тех пор она работала главным дипломатическим посланником своего сэра. Будучи мадьяркой по происхождению и хорошо разбирающейся в западном рыцарстве, Кара может с легкостью перемещаться по дворам за пределами Трансильвании, а также рассчитывать на помощь семьи Власи, которая служит ей рыцарями или придворными.\n\nПо слухам, Кара стояла за похищением Нова Арпада и сыграла ключевую роль в препятствовании влиянию лорда Юргена на Святую Землю.\n\nБудучи благородного происхождения, Кара всегда ведет себя как королева-воин или леди-рыцарь. Она позволяет другим Цимисхам хихикать, как униженным дуракам, но сама будет делать то, что необходимо, и править так, как ее заставили. Она жестока, когда это служит ее целям; она добра, когда должна быть; она всегда верна себе и своему господину.\n\nБудущая судьба в Канон\n\nКара продолжит сражаться на стороне Рустовича и последует за ним в Шабаш. В конечном итоге она будет поймана оборотнями в Валахии и разорвана в клочья, вновь разжигая вражду легендарных масштабов между Владимиром и оборотнями Повелителей теней."
 POD_investigate.desc.790967:0 "Гаринол родился где-то в конце 11 века. До того, как он обратился в христианство, Гаринол воспитывался как последователь культа Митры в смертной жизни. После того, как в детстве он увидел, как его семья умерла от чумы, у него началось увлечение болезнями. Как и большинство детей-сирот, он был отдан на попечение Церкви. Гаринол принял христианство и стал монахом. \n\nЕго увлечение смертью, однако, не прекратилось, поскольку он убивал мелких животных и пытался воскресить их из мертвых. Хотя сверстники понятия не имели о его хобби, его действия не остались незамеченными. Брат Жерве, каппадокийец, $pod_Embrace$ встретил 22-летнего Гаринола и пригласил его в склеп под аббатством. Со временем Гаринол стал аббатом. Затем он стал советником и союзником пражского князя Вентру Рудольфа Брандла, хотя в первую очередь он оставался преданным своему $pod_clan$.\n\n. Аббат Гариноль имел большое влияние на церковные дела Праги и пользовался уважением среди смертных церковных лидеров как учёный учёный и святой лидер. Даже если они и покинули его компанию, чувствуя себя немного утомленными. Встреча \n с Пражским големом в Еврейском квартале вызвала у него одержимость каббалистической магией и раскрытием секретов ремесла големов, чтобы расширить знания его $pod_clan$ в области оживления безжизненных. С этой целью он развил отношения с Йозефом Цви (владельцем Еврейского квартала, который позже сменил Вентру на посту принца Праги). Еще более ужасно то, что он начал тайно похищать невинных смертных, чтобы экспериментировать со своими новыми теориями. \n\nГаринол также взял на себя долг перед Кристофом Ромуальдом за раскрытие и прекращение заговора его ребенка Меркурио, долг, который он погасил, попросив другого своего ребенка, Серену, сопровождать Кристофа.\n\nБудущая судьба в Канон\n\nВ конечном итоге Гаринол был вынужден бежать из Старого Света и отправиться в Новый Свет, пытаясь избежать Последней Смерти или $pod_diablerie$ от своих двоюродных братьев по клану Джованни. Однако его корабль так и не прибыл, и Гаринол был потерян из-за $pod_torpor$ на дне Атлантического океана, в то время как глубоководные рыбы пожирали его плоть."
 POD_investigate.desc.791015:0 "В свои смертные дни человек, который впоследствии стал Ротриэлем, жил в хараппском городе бронзового века Дхолавире на Индийском субконтиненте. Его любознательная душа, а также его успехи в обращении с мечом привлекли к нему внимание странствующего воина Салюбри по имени Эзраэль, который взял его в качестве телохранителя, а затем в ученики. \n\nКогда Эзраэль предложил молодому человеку $pod_Embrace$ и Кровь, он появился под именем Ротриэль. Он доблестно сражался против последователей Молоха и полчищ Хоразина, часто выступая в роли телохранителя Целителей своего клана. Говорят, что ему выпала честь однажды сидеть и учиться у ног самого Саулота. \n\nВо время своих путешествий он встретил младшего ребенка своего [Glossary('сир','game_concept_Sire_desc')] по имени Махтиэль, с которым у него сложились узы, ставшие легендарными среди его сверстников. Хотя их любовь и преданность друг другу были безграничны, когда Салюбри [Glossary('допотопного','game_concept_antediluvian_desc')] был [Glossary('подвергнут диаблери','game_concept_diablerie_desc')] Тремером, Ротриэль был среди немногих, кто отрекся от насилия, полагая, что сохранение наследия своего предка будет более важным, чем месть за него. Ротриэль решила искать Голконду, расстроив Матиэля и вызвав разногласия, которые в конечном итоге заставили ее покинуть их убежище на месяц. Когда она вернулась, Ротриэля уже не было.\n\nБудущая судьба в Канон\n\nРотриэль подружится с Даникой Рутвен и поможет ей отвоевать замок Хунедоара у Тремер. Однако он не выживет в битве, его смерть вызовет огненную агонию, которая настроит горгулий против их хозяев и поразит Махтиэля ужасным горем."
 POD_investigate.desc.791041:0 "О земной жизни Пенелопы известно мало подробностей, и она утверждает, что мало что помнит о своем существовании до $pod_Embrace$. Что известно, так это то, что она была спартанской рабыней, которую заставили служить в Риме, когда она была молодой девушкой. Бальдассаре, проживавший в Риме до своей кончины от рук обиженного Носферату в 1101 году, купил молодого раба. Он $pod_Embrace$ встретил ее вскоре после этого, когда ей было двадцать с небольшим. \n\nВ начале своей не-жизни Пенелопа оставила своего сира и отправилась в Равенну в компании Луция Корнелия Сципиона, римского Бруха. Его искусная риторика, возвышенные идеалы и развратное обаяние привлекли тихого, идеалистичного каппадокийца, и они быстро стали не только любовниками, но и друзьями. Они провели почти два столетия в Равенне, повышая свой статус в обществе $pod_cainite$ и дергая за ниточки Равенны через свою группу. \n\nПенелопа и Люциус переехали в Гамбург и потратили годы на установление мирного сосуществования со смертными, жившими там. На протяжении веков их любовная связь постепенно сошла на нет, поскольку Пенелопа стала более заинтересована в присоединении к своим товарищам по клану в исследованиях и открытиях, желая подкрепить свои идеалистические убеждения о необходимости прогресса действиями. Однако они по-прежнему хорошо работали вместе, и эта пара была широко известна как истинная власть в Гамбурге, учитывая, что Мидиан, принц Малкавиан, был явно неспособен править. \n\nТолько эти двое знают правду: что Мидиан диаблеризировал посетителей и галлюцинировал, что его жертвы остались как часть великого двора, которого у него никогда не было. \n\nПока либо Люциус, либо Люциус или Пенелопа могла бы легко уничтожить Мидиан и заявить права на город Гамбург, но Луций не желает становиться принцем. Что касается Пенелопы, то безумный принц представляет собой интересное исследование, и Ученый не может отрицать ее заинтересованности в его действиях. В результате она обнаружила, что отвлекает тех, кто слишком близко подошёл к тайне Мидиана, и даже зашла так далеко, что совершила убийство, чтобы сохранить тайну. Теперь она беспокоится о том, что произойдет, если Люциус когда-нибудь узнает о ее собственных действиях."
 POD_investigate.desc.791061:0 "Бар «Зловещий», известный как кучка заблудших неудачников, является домом, возможно, для самых неуместных Сеттитов.\n\nФранцузская Жюлиота де Сост снаружи выглядит как прекрасная роза, застрявшая на холодном и суровом севере. Жюлиота мало интересуется властью, но ей нужны деньги и ресурсы, если она хочет добиться своей конечной цели - проникнуть в один из французских дворов $pod_cainite$. Жюлиота блондинка, восхитительно красива (этот факт только усиливается ее мастерством Присутствия) и совсем не выше того, чтобы использовать свою внешность или любое другое преимущество, которое она может иметь, чтобы получить то, что она хочет.\n\nБудущая судьба в Канон\n\nДжулиота сыграла важную роль в первых успехах Бара Синистер против Зала Ульфа, собирая разведданные, отравляя деревенский колодец и соблазняя местного священника.\nОднако она совершит ту же ошибку, что и другие, посчитав последнего выжившего из магов, очевидно скромного ученика Гуннара, легкой добычей для их объединенной мощи.\nЕе обезглавленное тело превратилось в пепел в результате указанной ошибки."
 POD_investigate.desc.791206:0 "Представьте себе идеального рыцаря, образец галантности, ума и грации, заслуживший похвалу самой матриарха Салианны. Годевин снаружи и есть тот самый человек. Говорят, что он происходит от королей Меровингов, но с умом и умением правил Нойоном с начала 12 века. \n\nНа самом деле все немного сложнее. \n\nГодевин - член таинственных Детей Эннамару, родословной инферналистов, контролируемых их одноименным демоном. Полностью преданные своему нечестивому хозяину, Дети играют в долгую игру, пытаясь увеличить свою численность и влияние, пока не наступит день расплаты. Этот день станет славным временем, когда Эннамару поднимется, чтобы возвестить геенну вампирам и оставить своих верных детей наследниками мира."
 POD_investigate.desc.791266:0 "Внебрачный ребенок Гийома IX, Гильем де Питьеус изменил свое имя на Эблес, имя, которое использовалось для обозначения бастардов в его семье. Очень строгое религиозное и административное образование рухнуло, когда Эблса обнаружили в страстных отношениях с женщиной из ткани и отправили в Святую Землю для покаяния. Он вернулся изменившимся после ужасов, которые он увидел и совершил там. \n\nУтешение пришло в образе Прометея Вентру Гая Марцелла, который разделял печаль и мечты Эблса. $pod_Embraced$ Гая, Эблс вскоре сам по себе стал влиятельным политическим зверем, возглавив (немногочисленных, но преданных своему делу) Прометеев Франции. Изгнание Александра открывает новые возможности для амбициозных Вентру. Он планирует завоевать владения Этьена де Пуатье, а затем вступить в союз с Эсклармонд, чтобы завершить крах вампирической Франции и положить начало ее возрождению в нечто новое и лучшее, достойное старого Карфагена. \n\n С помощью своего престижного [Glossary('сир','game_concept_Sire_desc')] и многообещающих союзов с Квентином де Санлисом и Эсклармонд Эблс быстро становится важным влиятельным игроком во Франции. Возможно, слишком быстро угроза действовать опрометчиво и недавно сделать себя мишенью заставила его ограничить свои публичные выступления и вместо этого действовать через своего гуля, Филиппа де Дува."
 POD_investigate.desc.791342:0 "До Маджинардо положение римского эдилила, хозяина зданий и логовищ, пришло в такое же упадок, как и сам Вечный город. Марко [Glossary('сир','game_concept_Sire_desc')] Маджинардо немного разбирался в каменном и столярном деле, но больше всего можно было рассчитывать на то, что он будет держать рот на замке, поскольку эдил традиционно клянется хранить свои знания в секрете. Однако он не был очень опытным строителем; убежища и катакомбы разрушались по мере старения, а каппадокийцы и Носферату, соперничающие друг с другом, восстанавливали и разрушали постройки в войне за подземный город. Услышав о его славе как архитектора, в 1032 году Марко $pod_Embraced$ Маджинардо в Равенне и подарил его Кретею. \n\nЗа прошедшие столетия новый эдил обновил множество подземных пространств и даже прорвался в места, о которых забыли даже старейшины. В ходе этого процесса он практически завершил битву за Подгород, поскольку обе стороны осознали, что под их грубым присмотром они потеряли больше, чем могли получить в результате победы. Однако мир открыл новые тайные пространства и слухи об угрозах в темноте, из которой бегут крысы и черви. \n\nЛицо вампира напоминает треснувший и разбитый мрамор, искажая черты лица мужчины двадцати лет."
 POD_investigate.desc.791355:0 "Однажды ночью саамский охотник и разведчик по имени Кирте пришел с севера, стремясь присоединиться к королеве Вальборг и остановить продвижение христианства. Однако в глубине души она идеалистка и романтик, и ее сердце обливается кровью из-за страданий смертных. \nОна возненавидела своего сюзерена и в глубине души желает увидеть, как Окончательная Смерть заберет ее - или, возможно, просто покинуть северные земли и отправиться в далекий Миклагард, чтобы искать счастья в Варяжской гвардии Базилевса. Она поможет любому, кто приедет в Бьяркарей и увидит падение королевы. Ее действия плохо скрывают ее опасения. Хотя Валборг и ее двор, уже знакомые с Кирте, видят в них просто часть личности Зилота, новая кровь может признать их такими, какие они есть."
 POD_investigate.desc.791365:0 "Амбросио Виталис, монах Ласомбра, недавно прибыл в Скандинавию по заданию из Рима, чтобы провести учет $pod_cainites$ в «замерзших пустошах». (Он скорее подозревает, что, возможно, рассердил кого-то выше по положению, но не уверен, кого именно.) \n\nСовершенно случайно Виталис бродил возле анклава, но вместо того, чтобы встретить Окончательную Смерть под клыками Эйрика, он нашел другого старшего Гангрела. Эта прекрасная каинитка — Ульфсдоттир, дитя самого Всевышнего — собиралась покинуть Свободное Государство, пока не встретила неоната Ласомбра. Теперь она обеспечивает ему безопасный проезд в Свободное Государство и выезд из него, и ей нравится говорить с ним о Западной Европе, христианстве и других мирских вопросах. Ульфсдоттир прекрасно понимает, что однажды ночью ей, возможно, придется убить Виталиса, но она надеется, что в этом не будет необходимости. Ее дикие чувства несколько изменились, поскольку она наблюдала, как Длиннозуб все больше выходит из-под контроля, но она категорически против того, чтобы оставить Одина ради Христа — по крайней мере, сегодня вечером. \n\nОднако, если Верный монах Ласомбра продолжит влиять на нее, Свободное Государство может потерять одного из своих самых важных защитников."
 POD_investigate.desc.791388:0 "Висенте был амбициозным человеком, сыном богатого купца. Он воочию видел, как мужчин легко можно подкупить, запугать или уговорить, и это произвело на мальчика большое впечатление.\n\nВсе изменилось в 1164 году. Обычная поездка обернулась ужасом, когда бандиты настигли караван и устроили ему кровавый хаос. Висенте видел, как его гордый отец молил сохранить ему жизнь, и видел, как вождь бандитов смеялся, сбивая старшего де Кардону. Сам Висенте отделался отрубленной правой рукой и израненным лицом, подарком бандитов.\n\nВисенте пережил травмы и даже сумел восстановить коммерческую империю своего отца. Однако его никогда не любили так, как его отца; вместо этого его задумчивое поведение, дикий характер и настойчивое желание отомстить даже за воображаемые обиды сделали его очень непопулярным человеком.\n\nЭто сочетание настойчивости, достижений и странных личных привычек быстро привлекло к нему внимание Ласомбра, и в 1182 году он был принят в клан. Однако вместо того, чтобы продолжать расширять свои торговые операции, Висенте позволил им ускользнуть. Вместо этого он начал лоббировать своих старейшин, чтобы они распространили свою власть на Португалию. Хотя это имело для них определенную привлекательность, они увидели, что Висенте лоббирует то, что это было: прозрачная попытка добиться какой-то мести.\n\nВ конце концов сир Висенте устал от его капризного ребенка и дал ему ровно столько веревки, чтобы он мог повеситься. Висенте было приказано отправиться в Лиссабон и не возвращаться, пока вся Португалия не окажется в руках Ласомбры. Однако сам Висенте решил, что это означает, что его сир признает его ценность. Сочетая большие надежды и злобные мысли о мести, он переехал и приступил к дестабилизации португальских Бруха.\n\nБудущая судьба в Канон\n\nПлан Висенте относительно Силвеша сработал без сучка и задоринки, катапультируя этого неопытного манипулятора на пост лорда южной Португалии. Мухаммад ибн Фарук становится доверенным советником, и Висенте так и не осознает, что он стал пешкой или что его товарищ по клану \"\" на самом деле является замаскированным Баали. Однако дитя Висенте Родриго Тока знает и представляет доказательства этого Amici Noctis. Он совершает $pod_diablerie$ и занимает место Висенте в Португалии."
 POD_investigate.desc.791410:0 "Мириам родилась в Малаге в первые дни существования зависимого эмирата и была единственным ребенком визиря города. Этот период был отмечен ожесточенными распрями, и Мириам научилась политике на коленях своего отца. \n Однако вместе с враждующими фракциями пришли враждующие $pod_cainites$, которые также искали какое-либо преимущество. Аиша впервые заметила Мириам во время отчаянного бегства через Малагу, но когда она вернулась позже, она начала готовить Мириам к жизни в тени. В 736 году она была $pod_Embrace$d и вскоре стала главным советником Аиши. Однако долгие годы с Аишей быстро наскучили. \nТайно Мириам добивалась и получила разрешение положить конец существованию своего сира, и в 934 году она это сделала. \n\nРастущая Тайфа с ее мелкими королями и мелкими ссорами предложила ей идеальную шахматную доску для игры в политику. Соответственно, она поселилась в Кордове и начала плести паутину союза, предательства и обмана. \n\nГоворят, что когда один из Детей Хакима, который путешествовал по следам Альморавидов, оказался достаточно глуп, чтобы угрожать ей, она спокойно обездвижила его, а затем сообщила ему, что он будет ее пленником, пока вторжение не отступит. На самом деле это правда, и глубоко внутри ее покоев с несчастным видом ждет сарацинский воин. Но тот же воин был орудием визиря Умара ар-Рашида, еще одного мастера интриг. \n\nХотя несправедливо говорить, что конфликт между Мириам и Умаром является причиной нестабильности, которая угрожает Тайфе, ни один из них не колеблется использовать его в своих интересах. Ее мало волнует конечный результат. Скорее, она заботится об игре и о победе над Умаром. \n\nБудущая судьба в Канон\n\nС падением Насридов в 1492 году Мириам наконец смягчается и освобождает своего пленника, получив клятву, что он не будет мстить. Он этого не делает. Однако многие из его сверстников так и делают."
 POD_investigate.desc.791444:0 "Элоизе, дочери и единственному ребенку дворянина в Карлайле, суждено было удачно выйти замуж и унаследовать поместье своего отца. Упрекая всех женихов, она проводила время, пытаясь изучить методы, с помощью которых она могла бы сохранить власть своего отца для себя, а не уступить ее мужу. В конце концов, мать Элоизы родила сына, и любое наследство тут же превратилось в простое приданое. \n\nИнтеллект и амбиции вынудили Элоизу вести неудовлетворенную жизнь, не имея возможности добиться успеха в мире, где доминируют богатство и, что более важно, мужчины. Запугав одного потенциального мужа разговорами о философии, она привлекла внимание Харриса Бошана, главного советника своего поклонника. \nВ разгар обучения Элоизы Харрис был уничтожен соперником $pod_cainite$, и девушка сбежала в Йорк в поисках убежища. \n\nПотенциал новичка был немедленно признан Джоном, бароном Йоркским, который усыновил ее как свою собственную. дитя и готовил ее к величию. За десять лет образцовой службы барону Элоиза дослужилась до должности сенешаля, вызвав гнев многих $pod_cainites$, намного старше ее. Частично для того, чтобы увидеть, как она справляется с ответственностью, а частично для того, чтобы вывести ее из все более враждебного окружения, Джон назначил Элоизу своим представителем Мерлинды в Дареме. \nМолодая и дерзкая, попытки Элоизы обмануть Мерлинду пока не увенчались успехом, хотя ее бдительность по-прежнему дает ей больше понимания английских Тремер, чем многие другие."
 POD_investigate.desc.791748:0 "Донья Игнасия — беженка от политических игр, в которые играют враждующие дома Ласомбра; как и сам Сент-Джеймс, она прибыла на холмы Компостелы со священным мандатом и желанием осуществить его. Дона была воспитана в железных традициях долга и веры — долга прежде всего перед своим отцом, который обожал свою единственную дочь, не балуя ее, а затем перед мужем, которого отец выбрал для нее, мужчиной, который ценил свою дочь за отточенный ум и стальной истинный дух, заключенный в ее прекрасной плоти; и, прежде всего, вера в справедливого и милосердного Бога.\n\nВера доны Игнасии была разбита, когда, несмотря на все ее молитвы и усилия, муж, которого она горячо любила, напал на врагов, чьи козни сначала погубили, а затем убили его, оставив ее вдовой и без даже его ребенка, который мог бы быть ее утешением. Дона Игнасия, к которой обратился личный представитель самого Родрига де Наварры, была завербована отцом Oculi Dei в качестве его специального агента в Компостеле, на выполнение которой она вложила свою значительную личную энергию и огромное количество горя и горечи. Де Наварра намекнул ей, что, если она копнет достаточно глубоко, она почти наверняка обнаружит правду о несчастной кончине своего мужа; на данный момент ни один из них не знает, насколько точно это предположение.\n\nБудущая судьба в Канон\n\nИз-за ее ограниченного прямого участия Игнасия будет избавлена от ужасной участи инквизиторов Компостела после их конфликта с оборотнями Звездного поля.\nОднако эта внезапная изоляция сделает ее легкой добычей для ее маловероятный поклонник, принц вампиров Рейнальдо де Рубио."
 POD_investigate.desc.791772:0 "Аиша вела тихую жизнь в Антиохии, когда Ахмет Мечтатель забрел во время своего продолжительного тура по региону. По словам Ахмета, он осознал ее врожденную способность исцелять и $pod_Embrace$ ударил ее. По другим рассказам, Ахмет увидел в ней то, чего ему не хватало; огромное удовольствие помогать и заботиться о других людях. \n\nЕе отношения с Ахметом радикально изменились в 1133 году, когда Тремер диаблеризировал Саулота, заставив Ахмета усомниться в своих целях и методах. Тем не менее Ахмет и Аиша продолжали путешествие до 1140 года, когда первый решил вернуться в Константинополь. Там он и остается, мечтая о поисках Голконды. Аиша пришла к выводу, что ее [Glossary('сир','game_concept_Sire_desc')] предал Божье призвание. Поэтому она порвала с ним и его Кругом Мечты в Константинополе и направилась в Иерусалим. \n\n Пока она работает среди больных жителей города, она также служит контактным лицом для выживших Салюбри. По сути, она управляет подпольем Салюбри, доставляя других своих $pod_clan$ в безопасные места и передавая информацию и сообщения, пока люди бродят по городу. Салюбри ориентированы на безопасность, друзей и надежных союзников. В конце концов, кто удостоверится, что паломник покинул город, следуя в том же направлении, откуда он вошел? \n\nОднако в Иерусалиме слишком много $pod_cainites$, слишком много виляющих языков, чтобы Тремер могла остаться незамеченной. В 1216 году они нашли ее.\nТем не менее, ей удалось спасти многих своих собратьев, по крайней мере, на какое-то время."
 POD_investigate.desc.791787:0 "Выйдя из Флоренции, Братья Плага — трое каппадокийцев, посвятивших себя эпидемиологии и назвавших себя Карнифекс, Джентилман и Холиман, — распространились за пределы страны, лично исследуя сообщения о широко распространенных эпидемиях и расследуя рассказы о скотах и каинитах, страдающих от загадочных болезней или травм. Братья Плага изучают тайны тела и устанавливают связи с вопросами души. Культ холодно зацикливается на понимании того, являются ли смертные, страдающие пагубными болезнями, духовно неполноценными или чума является произвольным уравнителем. Что особенно важно, они хотят знать, могут ли духи передавать разрушительные последствия чумы и оспы, поскольку каиниты, похоже, способны делать это после питания от пораженной жертвы.\n\nБратья Плага рассматривают тайны болезней, выздоровления и смерти как философию, пытаясь приписать высшую цель разрушительным волнам эпидемий, которые очищают владения от корма. Культ делится на три школы. Эти трое соперничают за истинное понимание и каждое столетие собираются, чтобы обсудить свои открытия.\n\nИстощенный ребенок получает титул Холимана. Он обучает своих собратьев-кападокийцев идее, что чума — это Божье наказание смертным за недостаток веры, а каинитам — за их ленивое, паразитическое существование. Его фракция верит в чистоту крещения через Божьи элементы. Погружение в воду, хождение сквозь огонь, вдыхание дыма и погребение в земле приближают все существа к смерти и Богу.\n\nБог безупречен, поэтому смертные и каиниты также могут быть такими же, если избавятся от слабости. Клан Каппадокийец располагает сильным контингентом ярых Верных на Виа Каэли и связанных с ней Путях, в том числе среди каинитов Ереси. Каппадокийцы, следующие учению Холимана, находят евангелический способ оставаться верными своей вере, несмотря на кощунственную Некромантию."
 POD_investigate.desc.791788:0 "Выйдя из Флоренции, Братья Плага — трое каппадокийцев, посвятивших себя эпидемиологии и назвавших себя Карнифекс, Джентилман и Холиман, — распространились за пределы страны, лично исследуя сообщения о широко распространенных эпидемиях и расследуя рассказы о скотах и каинитах, страдающих от загадочных болезней или травм. Братья Плага изучают тайны тела и устанавливают связи с вопросами души. Культ холодно зацикливается на понимании того, являются ли смертные, страдающие пагубными болезнями, духовно неполноценными или чума является произвольным уравнителем. Крайне важно, они хотят знать, могут ли духи передавать разрушительные последствия чумы и оспы, поскольку Каиниты, по-видимому, способны делать это после кормления пораженной жертвы. \n\n Братья Плага преследуют тайны болезней, выздоровления и смерти как философию, пытаясь приписать высшую цель разрушительным волнам чумы, которые стирают домены с корма. Культ делится на три школы. Эти трое соперничают за истинное понимание, и каждое столетие собираются, чтобы обсудить свои открытия. \n\n Джентилмен в маске с клювом решительно разделяет веру и науку. Его последователи верят, что живое разложение — это состояние тела, и посвящают себя Распаду Могилы и Пути Сумеречного Сада. Джентилман приказывает своим последователям загонять больных и умирающих не для предотвращения распространения болезней, а для их изучения и контроля. \n\n Фракция Джентилмана $pod_Embrace$ из рядов больных пытается сохранить болезнь в бессмертной оболочке. Фракция Джентилмана пытается проникнуть в понимание чумы Юстиниана, проказы и натуральной оспы. Они рассекают тела еще живых, пробуют кровь тех, у кого разные симптомы, и подвергают больных животных другим людям разного возраста, пола и расы. Сочувствуя планам Предвестников, Джентилмен вынашивает планы по развязыванию новой чумы, благодаря которой и его фракция, и Предвестники получат непревзойденные знания и материальную власть."
 POD_investigate.desc.791789:0 "Выйдя из Флоренции, Братья Плага — трое каппадокийцев, посвятивших себя эпидемиологии и назвавших себя Карнифекс, Джентилман и Холиман, — распространились за пределы страны, лично исследуя сообщения о широко распространенных эпидемиях и расследуя рассказы о скотах и каинитах, страдающих от загадочных болезней или травм. Братья Плага изучают тайны тела и устанавливают связи с вопросами души. Культ холодно зацикливается на понимании того, являются ли смертные, страдающие пагубными болезнями, духовно неполноценными или чума является произвольным уравнителем. Крайне важно, они хотят знать, могут ли духи передавать разрушительные последствия чумы и оспы, поскольку Каиниты, по-видимому, способны делать это после кормления пораженной жертвы. \n\n Братья Плага преследуют тайны болезней, выздоровления и смерти как философию, пытаясь приписать высшую цель разрушительным волнам чумы, которые стирают домены с корма. Культ делится на три школы. Эти трое соперничают за истинное понимание, и каждое столетие собираются, чтобы обсудить свои открытия. \n\nТочка зрения мумифицированного Карнифекса — это точка зрения естественной философии. Его фракция учит Некромантии как аспекту природы. Земля использует чуму как оружие для устранения вреда, а каиниты так же естественны, как скоты. В школе Карнифекса учат каппадокийцев, а боги слабее живого мира. Хотя многие вампиры считают их нигилистами, его фракция демонстрирует необычное преобладание в плане самоанализа и связи с человечеством. \n\nХотя фракция действует как убийцы и ученые-некроманты, они также невротически защищают свои стада, стремясь укрепить скот против гнева природы. Карнифекс считает, что природу невозможно приручить, но ее можно сбалансировать, а аномальные элементы требуют отбраковки, чтобы сохранить чистоту."
 POD_investigate.desc.791822:0 "Некоторые говорят, что Сармис все видел и знает. По крайней мере, этому есть некоторое подтверждение, поскольку Равнос могут со знанием дела рассказать о завоеваниях Александра, падении Карфагена или даже о Троянской войне. Терпеливый учёный убежден, что он сможет найти Голконду, если он никогда не прекратит свой поиск знаний. \n\nЖивя вдали от большинства $pod_cainites$, Сармис в основном ищет общества смертных или своих собственных книг, по общему мнению, он является автором нескольких тысяч исторических хроник. Все эти записи можно найти в этой \"Великой Книге\", магическом гримуаре, который появляется, когда он необходим, а это чаще всего происходит, поскольку Сармис всегда стремится записать на бумаге истории самых скромных простолюдинов или величайших из королей. \n\nМало кто знает, что Сармис был проклят. Превратившись в вампира давным-давно во Фракии, неизвестная магия заставляет людей вести себя вокруг него иррационально и агрессивно, чем дольше он остается в одном месте. Хотя он понятия не имеет о происхождении этого проклятия, Сармис очень хорошо о нем помнит и поэтому всегда в движении, его единственный страх состоит в том, что это может быть лишь верхушкой айсберга, скрывающим гораздо более темную правду..."
 POD_investigate.desc.792064:0 "Феличе де Беренгар — Ласомбра в восьмом поколении, связанная кровью (человеческой или вампирической) почти с каждым благородным домом Лангедока, Арагона и Наварры. Ее $pod_Embrace$ в 914 году н. э. появилась после того, как ее интуитивное презрение к христианству – и ее непревзойденное умение скрывать это – произвели впечатление на магистра во дворе Септимании. Ее недовольство Церковью проистекает из ее клеветы на женщин, и она с удовольствием использует свои связи и огромный интеллект, чтобы извратить ее работу в еретических целях. \nОна курирует Паи де Катары и Испанию. По ее предложению катары-альбигойцы позволили женщинам играть заметную роль в своей церкви, что совершенно противоположно тому, на что могли бы указывать сексуальные фобии их теологии."
 POD_investigate.desc.792124:0 "Ясмина, своеобразная нищая бродяга, умеющая всегда выходить на первое место, однажды ночью удача отвернулась от нее, когда ее растоптала лошадь. $pod_Embrace$d Варсика, который давно заметил ее и считал, что ее потенциал слишком велик, чтобы тратить его на такую ​​бессмысленную смерть, Ясмина стала для Варсика основным источником информации о том, что происходит на улицах Иерусалима. Она инструмент Варсика — она не игрушка и не коллега. Она даже не настолько умна, чтобы быть очень интересным собеседником, но ее невинная наивность и новизна мира восхищают и заряжают его энергией. \n\nЯсмина рада помочь - по крайней мере, Варсик говорит ей, что она помогает ему, передавая истории, которые ей рассказывают паломники на улице. И ей удается увидеть интересные места и путешествовать, и она почти всегда может найти дорогу обратно туда, где остановился Варсик. Иногда особо приятные люди приглашают ее домой, в общежитие или больницу, и она кормится и даже находит красивые блестящие безделушки, чтобы отвезти их Варсику. Хоть жажда крови, которая иногда овладевает девушкой, пугает ее, Ясмина рада, что Варсик спас ее от смерти и привел во тьму. Он сказал ей, что теперь она может быть молодой и веселиться вечно. \n\nОднако иногда она осознает, насколько долгим может быть «навсегда». \n\nБудущая судьба в Канон\n\nЯсмина — «пони с одним трюком». Пока Варсик процветает, с Ясминой все будет в порядке. Когда его уловки наконец настигают его, ей тоже не удается избежать пожара."
 POD_investigate.desc.792147:0 "Честер Джайлс был простолюдином по происхождению, лесником по профессии и Бруха по $pod_Embrace$. Ничто из этого не было его выбором. По его словам, стать последователем Пути Зверя было первым важным решением, которое он когда-либо принял для себя. \n\nОн двинулся с Первым крестовым походом на Святую Землю, где вскоре стал одним из ночных ужасов сарацин. В конце концов, убийца Бану Хаким был отправлен выследить и убить его. Ассамит, благородный воин по имени Масуд, объявил о своем намерении, и эти двое охотились друг на друга на улицах и переулках Иерусалима в течение двух недель, прежде чем Честер поверг Масуда. \nБитва между Честером и Масудом стала темой нескольких песен Feral. Христианин $pod_cainites$ утверждает, что он и Масуд сражались в одиночку; Сарацины утверждают, что ему помогли и что он устроил засаду на Масуда. В любом случае, Честер забрал Зверя Масуда и продолжает свою охоту с удвоенной энергией. \nНекоторые утверждают, что его мало заботит дело святой Церкви, а только резня и смерть. \n\nОн привлек небольшое количество последователей из диких животных. Они ценят его простой подход и его разумный союз с власть имущими, который позволил ему делать все, что ему заблагорассудится, не опасаясь репрессий."
 POD_investigate.desc.792273:0 "В великой схеме французской политики Жанна — незначительный игрок, и она это знает. Считавшаяся более полезной пешкой среди своих лучших, Жанна начала свою карьеру, связанная кровными узами Савиарра и посланная с небольшими поручениями.\nОна вскоре доказала свой талант к интригам и шпионажу, что немного подняло ее в глазах тогдашнего могущественного Савиарра. Она давала ей все более и более сложные миссии, думая, что это поможет талантам Жанны неуклонно расти. \n\nПо правде говоря, Жанна напугана. Еретики, крестоносцы, лорды-вампиры, ее собственная любовница... она готова пойти на любое предательство, пытки или резню, лишь бы спасти свою шкуру. \n\nПосланная Савиарром шпионить и препятствовать приходу Эсклармонды к власти на юге Франции, Жанна кровью связала наемника-гуля Фолча и попыталась использовать его, чтобы устроить засаду. будущая королева Золотых дворов. Провал его попытки оставил у Жанны двух могущественных врагов: разъяренного ее неудачей Савиарра и озлобленного ее предательством Фольха.\nЖеанна с тех пор находится в бегах.\n\nБудущая судьба в Канон\n\nШпионка, слишком одаренная, чтобы когда-либо получить домен, Жанна будет \" завербовал \" Салианной для шпионажа за Инквизицией. Когда ситуация повернется против ее новой хозяйки, Жанна сбежит и едва избежит захвата Салианной, решившей избавиться от нее, прежде чем ее секреты могут быть раскрыты. Найдя убежище у Беатрикс, она станет ключевым участником восхождения будущей Королевы Нежити Франции."
 POD_investigate.desc.792302:0 "Пытаясь искупить грехи своего хамского [Glossary('сир','game_concept_Sire_desc')], Родриго предпринимает удивительную попытку стать Ласомброй Ласомбры. Он вежлив, дьявольски грациозен, горд и официален, и он никогда не менее чем чрезвычайно вежлив с теми, кто выше его. В социальных ситуациях он совершенно ясно дает понять, что, несмотря на величайшее уважение к отношениям сир-ребёнок, он считает Висенте идиотом. \nВсе это приносит ему очки перед Амичи Ноктисом, которые в частном порядке называют Току «розой на навозной куче Лиссабона». \n\nВ жизни Тока был богатым и привилегированным ребенком, чей отец торговал с семьей де Кардона. Он видел свободу Висенте и завидовал ей, а также считал обязательным поддерживать деловые отношения, когда его отец и Висенте скончались. \nДе Кардона помнил об этом и, когда он был $pod_Embrace$d, стремился отплатить за предполагаемые услуги, оказанные ему Токой. \n\nРодриго хорошо осознает пренебрежение, которое другие испытывают к его [Glossary('сир','game_concept_Sire_desc')], и он уже давно разочаровался в фигуре, которую когда-то считал такой героической. Он быстро дистанцируется от де Кардоны, как политически, так и географически. \nВ настоящее время он живет в Сантарене и, если бы осмелился, переехал бы еще дальше. Однако Тока очень опасается растущей паранойи де Кардоны и движется очень медленно, чтобы не вызвать необдуманных действий своего [Glossary('сир','game_concept_Sire_desc')]. \n\nБудущая судьба в Канон\n\nКогда Висенте заключит сделку с дьяволом, Родриго будет там, чтобы сообщить об этом Амичи Ноктису. Он будет вознагражден Португалией и, что еще слаще, кровью своего глупого [Glossary('сир','game_concept_Sire_desc')]."
 POD_investigate.desc.792312:0 "Вентру, обладающая значительной властью и влиянием, Мервинн Хейворд пробилась к известному положению во дворе Веруса. Однако Хейворд неверно истолковал недавние действия Веруса и чувствует себя преданным из-за того, что барон Честерский тайно обратился за помощью к неопытным посторонним, незнакомым с их местной политикой и обычаями. Придворная Вентру твердо верит, что она должна стать преемницей Веруса, и потратила большую часть своей не-жизни, работая над этой целью. \nХотя она недавно появилась во дворе Веруса, она десятилетиями тщательно планировала свое восхождение. \n\nНепревзойденный придворный, Мервинн Хейворд использует свою собственную сеть шпионов. Она пришла к ошибочному выводу, что ее тысячелетний принц не пригоден для правления, поскольку его недавние действия более запутаны и беспорядочны, чем обычно. Хуже того, недавно она получила от своего [Glossary('сир','game_concept_Sire_desc')] тревожные новости. Если утверждения Мариуса верны, то Марк Вер не поддерживает Традиции должным образом, поскольку он считает своего [Glossary('сир','game_concept_Sire_desc')] богом! \nЕсли лидер-неудачник не желает наказывать неверующих, нарушающих Первую Традицию, потому что он сам дурак, поклоняющийся язычеству, Хейворд убежден, что это богохульство делает всех в Честере уязвимыми для нападений язычников и злодеи.\n\nБудущая судьба в Канон\n\n Жестокий заговор Мервинн против Веруса обернется неприятными последствиями, закончившимися ее изгнанием с Авалона."
 POD_investigate.desc.792314:0 "$pod_cainites$ по всему баронству Авалона шепчут о легендарном отравителе, тени во тьме, которая заставляет исчезать как людей, так и вампиров. Мин-Нефрет приближается к своим целям разными способами, но ее репутация опережает ее… как и слухи. \n\nВполне вероятно, что Мин-Нефрет — одно из многих обличий, которые носит убийца, чтобы помешать любому, будь то скот или каинит, который может преследовать ее. Ее происхождение неизвестно, подробности не-жизни Мин-Нефрет — всего лишь тени, следующие за ней. Однако одно можно сказать наверняка: Мин-Нефрет считает, что роль любого принца несет в себе больше ответственности, чем понимает большинство $pod_cainites$. \n\nНикому не верная, Мин-Нефрет появляется перед принцами во времена раздоров, чтобы предложить свои услуги. Хотя многие могут бояться ее, им следует задать вопрос: \"На чьей стороне она решила встать? И, что более важно, почему?\" Редкостью даже среди членов клана Бруха является то, что о Мин-Нефрет мало что известно, так как она не убивает безнаказанно. Скорее, она уважает Традиции и уделяет больше внимания внутриклановой политике, чем многие могли бы подозревать.\nКакую смерть она ищет, она делает с благословения Принца."
 POD_investigate.desc.792523:0 "Аневрин ап Рис — молодой Гару, рожденный в уважаемой семье героев Гару. Его обряд посвящения прошел всего несколько месяцев, а он еще не присоединился к стае. Аневрин ждет, проводя время, тренируясь со своим дядей и другими воинами септа и общаясь с духами. \n\nВскоре после обряда посвящения в домашнюю септу Аневрина прибыли гости из материковой Европы, стая французских Фенриров, охотившихся на Бэйна, сбежавшего через Ла-Манш. Их Теург, Ивонна Скрытые Голоса, оказала сильное влияние на молодого Аневрина, хотя он с трудом может признать масштабы этого влияния. С момента битвы, в которой ее стая и несколько Гару из его септа выследили и убили Бэйна, он не мог забыть о ее лице и, что еще хуже, не мог сдержать улыбку, когда думал о ней. \n\nДядя Анерина - могучая Фианна Арун, который до недавнего времени так гордился своим племянником, что подарил ему могущественный Оленьий Клейв. Теперь, когда он увидел, как его племянник потерял сознание из-за женщины Фенрира, он готов забрать это обратно. Недавно он рассказал Аневрину, что у него родился недостойный сын и что он намерен найти и убить его. \n\nПосле этого откровения видения Аневрина, которые раньше включали в себя только оленя и волка, идущих вместе, теперь показали ему оленя, волка и огромного неповоротливого зверя с бараньими рогами. Аневрин решил, что он должен найти своего кузена раньше, чем это сделает дядя... даже если для этого придется опозорить дядю, раскрыв его грех."
 POD_investigate.desc.792618:0 "Эта цыганская женщина из клана Торену сопровождала свою кумпанию в Восточную Европу в конце XII века. Изидор Торену, Равнос, путешествовал с ними и возглавлял группу. Делизбета была его гулем.\nОна также была одарена истинной магией, пробудившись к своим пророческим способностям. Она выступала в роли предсказательницы для группы. Проведя некоторое время в Константинополе и Буда-Пеште, кумпания разведала территорию Трансильвании в поисках нового дома для своего народа.\n\nБудущая судьба в Канон\n\nТо, что казалось раем, оказалось кошмаром, когда они переехали в этот район и были быстро порабощены. Несмотря на то, что Делизбета умолял не винить себя, отчаяние из-за своей роли в том, что его народ оказался в таком положении, заставило Изидора попытаться покончить с собственной не-жизнью. Прежде чем прыгнуть в огонь Самайна, Изидор заключил Делизбьету в объятия, сделав ее Равносом и уничтожив ее Аватар.\nОн поручил ей присматривать за кланом Торену, а затем прыгнул насмерть.\n\nРасстроенная смертью Изидора, Делизбета решила стать лучшим опекуном, каким только могла. С ее помощью многие из порабощенных цыган оторвались и снова стали странствующими людьми. Сейчас Делизбета путешествует по Трансильвании вместе с большей частью своей семьи. Она продолжает совершать гадания по ночам."
 POD_investigate.desc.792764:0 "Сарисель когда-то была членом Дома Судеб, одним из ангелов, ответственных за создание узоров между гранями творения. Он работал в тесном тандеме с Диким Домом, изобретая способы распространения семян растениями, поскольку всегда считал неуклюжий метод полового размножения чьей-то ленью.\n\nКогда началось восстание, многие из служивших ему ангелов были удивлены, увидев его присоединение. Они всегда считали его лоялистом. Действительно, будучи проклятым как один из Неберу, он кричал, что ему вообще не следовало присоединяться к восстанию. Люцифер не изгнал его из-за слабости, но остальная часть воинства с этого момента относилась к нему как к дезертиру. Тем не менее, после падения Цивилизации Пепла, он был брошен в Ад, как и остальные Падшие. \n\nДаже сегодня Сарисель не знает, как небольшой клике китайских волшебников удалось его вызвать, но он не из тех, кто смотрит дареному коню в зубы. Освободившись из ада за несколько столетий до рождения Христа, Саризель привязался к зелёному саду и пожинал урожай веры от волшебников и их потомков. Его приход к власти был намного медленнее, чем у более могущественных Привязанных к Земле в других цивилизациях, но Сарисель также не оказался под угрозой исчезновения с появлением христианства.\nКак дуб из желудя, Дьявол рос медленно, обучая своих последователей использовать растения в качестве инструментов для предсказания и ядов, ожидая удобного случая.\n\nБудущая судьба в Канон\n\nSarisel выдержит и будет медленно набирать силу до 20-го века. Готовясь раскрыть свой козырь, орхидею души \"\", Саризель будет ждать идеального момента, чтобы объявить миру о своем Присутствии."
 POD_investigate.desc.795017:0 "Философски потерянный после впадения в немилость $pod_kueijin$, Риян однажды ночью оказался на поляне острова Хонсю. Духи ками пожалели его, дали ему Чи и пещеру, чтобы укрыться от солнца. \nОни также старались направлять его, давая ему набор простых правил, которым он должен следовать, чтобы восстановить свой сломленный дух. Однако они не были сплоченными и добрыми учителями, часто избивая Риана противоречивыми уроками ночь за ночью. Однако он все еще процветал, медленно восстанавливая чувство собственного достоинства. Затем он решил путешествовать, что не понравилось его собственническим духовным учителям. Таким образом, он обнаружил, что большинство духовных существ, с которыми он сталкивался, избегали его. Хуже того, за ним также охотились другие $pod_kueijin$, поскольку он не следовал \"proper\" [Glossary('дхармы','podgloss.dharma')], которому учили Пяти Августейших Дворов. Считавшийся врагом по обе стороны завесы, Риян знал, что должен действовать. \n\nЕго отсрочка пришла в форме обучения тому, как изменить ситуацию с духами, охотящимися за ним, используя свои собственные обряды, чтобы связать и подчинить их. Тем не менее, Райан жаждал общения. Избегаемый Августовскими Дворами, презираемый духами и не желающий подчиняться [Glossary('повелителей Яма','podgloss.yamaking')], он, наконец, нашел свой ответ, разыскивая и обучая недавно выпущенный $pod_kueijin$ в своем своеобразном [Glossary('дхармы','podgloss.dharma')], который он назвал Духом Живой Земли. Он также научил их затаиваться и опасаться своих врагов, будь они мирскими или нет.\n\nС тех пор так и сложилось положение вещей: Райан действует для своих последователей скорее как независимый наставник, чем как настоящий лидер.\n\nБудущая судьба в Канон\n\nНа пороге В 20 веке Риян соберет своих старейших и самых просвещенных последователей. Он не оставит ни заключительных слов, ни заключительного урока, по-видимому, удовлетворенный тем, что другие достигли духовного роста после него. Затем он просто исчезнет, ​​возможно, сам возвысившись как [Glossary('бодхисаттвы','podgloss.bodhisattva')]."
 POD_investigate.desc.795111:0 "Возможно, самый старший из действующих существ, Моколе-Мбембе, Коронующий сын Двух Пальцев, был первым Моколе, родившимся после эпохи Королей Динозавров. Основанный Конголезским Клатчем на озере Теле в глубине Африки, легенды гласят, что благодаря продлевающим жизнь Дарам и сну Сну Дракона Моколе-Мбембе продлил свою жизнь до настоящего времени, хотя большую часть ее жизни прожил в [umbra|E].\n\nОн защитил дом Моколе в джунглях смертельными духами лихорадки, чтобы спасти свой народ. Он видел взлеты и падения Первого Города, затем Египта, Шумера и Рима, и вместе со своими собратьями из Сородичи произвел на свет бесчисленное множество детенышей. Он научил свою линию быть мудрыми, но также и воинами, поскольку врагов Матери можно перехитрить лишь определенное количество раз. Его копье, по-видимому, несущее в себе часть его силы, является одновременно несравненным оружием и символом гордости за свой народ. \n\nКак и такие старые существа, как он, Моколе-Мбембе не мыслит одновременно с другими и побуждает себя действовать только в избранных случаях. Однако когда он это делает, мир видит проблеск былой славы древних королей-динозавров."
 POD_investigate.desc.795132:0 "Никогда не знавший своего [Glossary('сир','game_concept_Sire_desc')], Джовирдас был вынужден старейшиной Цимисхов Висей служить в качестве Тисиацкого Гейдаса (\"шериф\"). Гейдас - дитя Висьи и некомпетентный принц-марионетка, оставляющий Джовирдасу фактически выполнять административную работу домена, при этом возмущаясь властью Гейдаса и Висьи над ним.\n\nБудущая судьба в Канон\n\nПрибытие Юргена фон Вердена изменит судьбу Джовирдаса. Вентру смирили Гейдаса и Висью, оставив Джовирдасу возможность убить первого и освободиться от его оков. Затем он был полностью готов к тому, чтобы его в свою очередь убил Юрген, но вместо этого немец попросил его принести присягу на верность, заинтригованный тем фактом, что Джовирдас, по-видимому, сам изучил Дорогу Королей. \nБывший шериф примет и поделится своим опытом Дороги с Юргеном, прежде чем его более формально обучит супруга Вентру, Розамунда из Ислингтона. Он продолжит служить лояльной оперативной базой для следующих кампаний Юргена в регионе."
 POD_investigate.desc.795161:0 "Один из самых могущественных демонов, призванных высокомерными инферналистами римского культа Меркурия, Нубарус считается Великим Визирем одного из адских регионов. Вызванный во время неудачного ритуала, приведшего к гибели призывателей, перед уходом он пометил простого солдата Валериуса своим якорем. На Земле он переключается между формой человека и вороны и известен как щедрый покровитель, предоставляющий мощные инвестиции тем, кто служит его делу. \n\nВокруг тех, кто равен его положению, он является непревзойденным политиком. Те, кто ниже его, рассматриваются как слуги, над которыми нужно доминировать, будь то силой или коррупцией. Все, что он делает, является частью структуры, ведущей к его конечной цели. Есть только один уровень, эрцгерцоги, выше власти Нубаруса, и он мечтает о том дне, когда он достигнет этой высокой группы. \n\nБудущая судьба в Канон\n\nЯкорем Нубаруса, Валериусом, будет $pod_Embrace$d в клан Тремер. Демон воспользуется этой возможностью, сломав разум Валериуса и сделав его очень полезным инструментом для распространения своих культов на новые рубежи."
 POD_investigate.desc.795166:0 "«Где запрещено ступать, вы должны идти. Всё, что запрещено произносить, ты будешь говорить. Что бы ни было табу, ты будешь наслаждаться этим». Итак, Люцифер атаковал Серебряный Легион; так поступил Бельфегор Осквернитель. Она спроектировала свой дворец, чтобы разместить там свою паству и помочь ей в экспериментах над ней. \n\nДворец был построен в кратере вулкана, закрытом для ее удобства. Каменные стены были закалены и заточены до бритвенной остроты на своей высоте. между ними мерцала непрерывная буря огня, молний и ядовитых паров, создавая завесу смертоносных радуг. Внутри располагались сотни квадратных миль плодородной земли и сверкающее озеро, которое изящными изгибами охватывали крылья и колоннады из камня телесного цвета. \n Они шли вниз по земле и поднимались к стенам, пока все владения не стали поистине ее дворцом. Это казалось бы прекрасным, пока наблюдатель не учуял зловонный запах ветра, не услышал крики, доносившиеся с полей и павильонов, и не заметил странные устройства и реальную структуру здания в центре кратера. \n\nБельфегор проверял способность людей передавать черты своему потомству. Она разработала ритуалы, чтобы ускорить этот процесс и повлиять на него. в ее пастве были чудеса красоты и силы, ужасно уродливые и полуживотные химеры, сохраняющие человеческую способность к вере. Хотя шторм и прочность его стен были главной защитой дворца, она также разводила людей для битвы и размещала эти силы в нижних частях стен. \n\nПод поверхностью кратера находились уровни, не предназначенные для людей, в которых ни один человек не мог выжить. Они предназначались для крайних пределов удовольствия Осквернителя, а также образовывали внутреннее защитное кольцо из участков огня, кислоты и леденящего холода. За ними находились ее собственные покои, где развлекались только ее самые доверенные союзники, которые воплощали чудеса скульптуры и сочетания света, тени и цвета в живых картинах, в которых участвовала гостья. \n\nТаков был Дворец Вздохов, разрушенный Небесным Воинством так же основательно, что сам вулкан превратился в руины, разбрасывающие равнину пепла."
 POD_investigate.desc.795193:0 "Фортунато является загадкой даже для других Очей Бога в Компостеле. Многие считают его самым старым пауком в паутине городской экономики и политики, но никто никогда не встречался с ним (или с ней) лицом к лицу. Фортунато общается исключительно посредством закодированной корреспонденции, попадающей в руки грамотных Глаз и в виде символов и граффити, оставленных там, где неграмотный их непременно найдет.\n\nОн (или она), несомненно, самый знающий Глаз в городе; даже дона Игнасия несколько напугана очевидным интеллектом, который сообщает все его (или ее) наблюдения о темной стороне Компостелы, ее истории, политике и месте в быстро меняющемся мире иберийского общества.\n\nФортунато не без причины чрезвычайно хорошо информирован. Фортунато тайно действовал в доме каинитского принца Компостелы почти десять лет, накапливая информацию, оценивая сильные и слабые стороны, медленно, но верно шагая по лабиринту власти и влияния, который в конечном итоге может открыть гораздо больше, чем дом Рейнальдо де Рубио. Именно по просьбе Фортунато донья Игнасия была принята на работу в Oculi Dei, когда стало очевидно, что принц вампиров имел на нее планы; Фортунато планирует использовать это увлечение, чтобы погрузиться во тьму глубже, чем когда-либо прежде погружалось Око Бога.\n\nБудущая судьба в Канон\n\nБлагодаря отсутствию его прямого участия Фортунато будет избавлен от ужасной участи инквизиторов Компостела после их конфликта с оборотнями Звездного поля. Оказавшись во дворе принца без какой-либо поддержки, он (или она) задается вопросом, могла ли сама война быть организована Рейнальдо гениальным ходом."
 POD_investigate.desc.795200:0 "По слухам, Собек имел форму массивного крокодила-альбиноса и упоминается во «Фрагментах Исиды» как вождь крокодилового народа, жившего на реке Нил во времена, когда боги ходили по Земле. Он объединился с вампиром Ваджетом и Сынами Бубасти, чтобы защитить Исиду и ее сына Гора, когда пара искала убежища на острове Чеммис после заключения Осириса в тюрьму. В конце концов Сет нашел их и взял пару богов в плен. \n\nЕсли Собек вообще все еще существует, старейшины Последователей Сета ходят слухи, что он является мерзостью Моколе, оторванной от благодати $glossary_helios$ темной магией, наложенной Сетом, и проклятым существовать как нечестивая насмешка над всем, что представляет собой его вид. for.\n\nОн, как полагают, дремлет в Основном Храме Файюма, окруженный свитой одурманенных крокодилов. Говорят, что одному из этих крокодилов более тысячи лет, и он передает пророчества от ребенка Сета Абд'ал-Собеку, культу Сетитов, сосредоточенному вокруг поклонения ему. \n\nХем-Ка Собк, группа магов-убийц, также до сих пор почитает его, хотя больше в его старой форме как дофараонское крокодиловое божество. В прежние времена они также служили культистами Моколе, поскольку считали их \"Детями Собека\"."
