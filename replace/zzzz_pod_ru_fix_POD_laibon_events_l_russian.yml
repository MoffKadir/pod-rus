l_russian:
 pod_laibon.100.a:0 "Рассудите спор лично."
 pod_laibon.100.a.failure:0 "Ваше суждение не соответствует действительности. Смертные разочарованы."
 pod_laibon.100.a.success:0 "Ваше суждение мудро и справедливо. Смертные впечатлены."
 pod_laibon.100.b:0 "Делегируйте смертному советнику."
 pod_laibon.100.c:0 "У вас есть дела поважнее. Отправьте их прочь."
 pod_laibon.100.desc:0 "Смертный из вашего домена ищет аудиенции. Проситель приносит спор, на который нет простого ответа: земельный конфликт между двумя семьями, обвинение целителя в колдовстве, просьба вмешаться в засуху, обратившись к духам. По старинке, Лайбон — это больше, чем правитель: они являются живым мостом между сообществом и силами, которые управляют его судьбой. Смертный не знает, кто вы, но знает лишь то, что ваше суждение имеет вес, на который не может претендовать ни один обычный старейшина. Отвернуться от них — значит позволить живому миру ускользнуть немного дальше от вашей власти."
 pod_laibon.100.t:0 "Смертный проситель"
 pod_laibon.101.a:0 "Слушайте и следуйте за голосом в уединении."
 pod_laibon.101.a.failure:0 "Голос ведет вас кругами. Вы возвращаетесь ни с чем, кроме беспокойства."
 pod_laibon.101.a.success:0 "Голос может раскрыть скрытую правду о соседнем правителе."
 pod_laibon.101.b:0 "Признайте голос, но оставайтесь на месте."
 pod_laibon.101.c:0 "Отгородиться от голоса. Мир духов полон обманщиков и лжецов."
 pod_laibon.101.desc:0 "В предрассветные часы вы что-то слышите, но не ушами, а глубже. Голос, который может быть предком, духом земли или вашим собственным [Glossary('Зверем','game_concept_beast_desc')], говорящим на языках, которые вы почти понимаете. Он предлагает фрагмент знаний, но требует вашего внимания. Лайбоны всегда ходили между миром живых и миром духов – эти голоса не являются ни галлюцинацией, ни благословением, а чем-то более древним, чем любая из этих категорий. Ваши старейшины предупреждали, что Лайбон, игнорирующий голоса Оруна, делает это на свой страх и риск, но тот, кто следует каждому шепоту во тьму, редко возвращается целым."
 pod_laibon.101.t:0 "Голоса на ветру"
 pod_laibon.102.a:0 "Проведите ритуал сами, почитая и живых, и мертвых."
 pod_laibon.102.b:0 "Сосредоточьте собрание на политических вопросах."
 pod_laibon.102.c:0 "Сосредоточьте собрание на духовном общении."
 pod_laibon.102.desc:0 "Вы устраиваете собрание местных Лайбонов, не формальный Сбор Наследий, а неформальную встречу у костра. Делятся историями, обсуждаются споры и соблюдаются старые ритуалы. Козла приносят в жертву, его кровь делят между участниками и призывают предков. Эти небольшие собрания — источник жизненной силы общества Лайбон — напоминание о том, что нежить все еще связана обязательствами живого сообщества, к которому они когда-то принадлежали. Узы, выкованные в огне, часто сильнее, чем те, что были принесены к присяге на официальных собраниях, а долги, вспоминаемые в дыму подношений, редко остаются неоплаченными."
 pod_laibon.102.t:0 "Встреча у костра"
 pod_laibon.103.a:0 "Наблюдайте за ними из тени. Обеспечьте им процветание."
 pod_laibon.103.a.message:0 "Потомок прибыл"
 pod_laibon.103.a.success:0 "Смертного приведут к вашему двору для подготовки к Становлению."
 pod_laibon.103.b:0 "Даровать Становление. В потомке течёт ваша кровь; он заслуживает дара вечной жизни."
 pod_laibon.103.c:0 "Они вас не касаются."
 pod_laibon.103.desc:0 "В ваших владениях появляется смертный, поразительно похожий на человека, которого вы знали при жизни, потомок вашей смертной семьи, несущий вашу кровь много веков назад. Проситель не знает, кто вы, но в их глазах мелькает узнавание. Это одно из самых дезориентирующих ощущений, которые может испытать Лайбон – видеть собственный жест, собственный смех, тот же наклон головы, чтобы лучше слушать, заключенный в тело, которое все еще дышит и стареет. Предки говорят, что такие совпадения никогда не бывают случайными. Что-то неразрешенное протекло в крови, ожидая подходящего момента, чтобы заняться этим."
 pod_laibon.103.t:0 "Смертный потомок"
 pod_laibon.104.a:0 "Подойдите и предложите ему кровь."
 pod_laibon.104.a.failure:0 "Дух яростно отвергает ваше подношение."
 pod_laibon.104.a.success:0 "Дух принимает ваше подношение. Его благословение окутывает вас, как доспехи."
 pod_laibon.104.b:0 "Наблюдать за ним издалека. Извлечь урок из его присутствия."
 pod_laibon.104.c:0 "Прогоните его. Духам, требующим кровавых подношений, нельзя доверять рядом с вашими владениями."
 pod_laibon.104.desc:0 "Рядом с вашим убежищем появляется дух, не призрак, а нечто более древнее. Он принимает форму огромного животного: льва, змеи, паука, орла. Он наблюдает за вами глазами, которые видят сквозь плоть. Оно чего-то хочет. Духи животных — древнейшие посланники Оруна — они существовали ещё до духов предков, предшествовали даже первому Лайбону, и словами они не занимаются. Дух, который ищет вас лично, — это не тот вопрос, который вы можете оставить без ответа. Чего бы оно ни хотело, тот факт, что оно пришло к вам, а не ждало вызова, означает, что переговоры уже начались."
 pod_laibon.104.t:0 "Дух-Зверь"
 pod_laibon.105.a:0 "Прогуляйтесь среди них во время праздника. Присутствовать."
 pod_laibon.105.b:0 "Возьмите свою долю, большую десятину от излишка."
 pod_laibon.105.c:0 "Берите то, что вам нужно, излишки означают, что можно будет питаться кровью большего числа смертных без последствий."
 pod_laibon.105.desc:0 "Смертные в ваших владениях провели хороший сезон. Урожай богатый, торговые пути проложены, дети здоровы. Ваше управление, каким бы косвенным оно ни было, удерживает хищников на расстоянии. Сообщество процветает. Лайбон лучше других понимает, что процветающие смертные являются основой всего: они являются источником крови, Айе, связи с живым миром, который отделяет вас от пустых мертвецов, которые плывут по Оруну, и у них не осталось ничего, что могло бы их укрепить. Сегодня ночью гремят барабаны, и огни ярки. Вы хорошо выполнили свою работу."
 pod_laibon.105.t:0 "Урожай"
 pod_laibon.106.a:0 "Оставьте свое подношение и медитируйте на перекрестке."
 pod_laibon.106.b:0 "Возьмите подношение. Власть существует для того, чтобы брать."
 pod_laibon.106.c:0 "Возьмите подношение, но не задерживайтесь: перекрестки привлекают вещи похуже, чем духи предков."
 pod_laibon.106.desc:0 "В полночь вы попадаете на перекресток, место, где пути сходятся и граница между Айе и Оруном становится тоньше. Кто-то оставил подношение — глиняный горшок, пучок перьев, резная фигурка. Оно предназначено для вас. Или для кого-то, подобного вам. Перекрестки всегда были пограничными местами — священными для духов, опасными для неосторожных и необычайно привлекательными для тех, кто уже существует на границе между мирами. Подношение предполагает, что кто-то знает, что вы проходите этим путем. Совершенно другой вопрос, хотят ли они сделать вам подарок, предложить сделку или отвлечь ваше внимание от того, что делают поблизости."
 pod_laibon.106.t:0 "Дух Перекрестка"
 pod_laibon.107.a:0 "Видение показывает мир смертных, ваши владения, какими они могли бы быть, процветающими и защищенными."
 pod_laibon.107.b:0 "Видение показывает духовный мир; огромный, светящийся и зовущий вас."
 pod_laibon.107.c:0 "Задайте вопрос фигуре. Это действительно Кагн или что-то с его лицом?"
 pod_laibon.107.c.failure:0 "Улыбка фигуры становится холодной. Вы обидели то, чего не понимаете."
 pod_laibon.107.c.success:0 "Фигура улыбается. Это и то и другое, и ни то ни другое. Вас захлёстывает понимание."
 pod_laibon.107.desc:0 "Вам снится сон — редкость для вампиров. Во сне вы видите фигуру, которая может быть Кагном, Первым Лайбоном, или это может быть ваш собственный [Glossary('Зверь','game_concept_beast_desc')] с лицом Кагна. Он говорит на языке, древнем всех, что вы знаете, но вы понимаете. Он показывает вам видение. Говорят, что Кагн был первым, кто обнаружил баланс между Айе и Оруном и заплатил огромную цену за это знание. Является ли он истинным предком, духовной конструкцией или мифом, который кровь использует для объяснения своей собственной природы, - это спор, который старейшие Лайбоны вели на протяжении веков, но безрезультатно. Никто из них не оспаривает то, что сон о нем означает, что что-то скоро изменится."
 pod_laibon.107.t:0 "Сон о Кагне"
 pod_laibon.108.a:0 "Разобраться со смертным лично. Подчинить или заставить замолчать."
 pod_laibon.108.a.failure:0 "Вам не удалось сдержать ситуацию. Шепотки превратились в слухи."
 pod_laibon.108.a.success:0 "Смертный забывает. Шепот умирает."
 pod_laibon.108.b:0 "Временно отстранитесь от смертных дел. Пусть слухи умрут."
 pod_laibon.108.c:0 "Подыграть подозрениям. Пусть считают вас духом предка."
 pod_laibon.108.desc:0 "Проявляется ваша растущая связь с духовным миром. Смертный в ваших владениях, священник или мудрая женщина, заметил что-то неладное. Подозрения ещё не обрели имени, но начинаются слухи. Секрет находится под угрозой. Маскарад более сложен для Лайбона, чем для Сородичей, которые полностью прячутся - ожидается, что Лайбон будет фигурой духовного авторитета, а это означает, что некоторые сверхъестественные качества уже предполагается. Но существует грань между тем, чтобы быть уважаемым духовным работником, и быть признанным одним из нежити, и кто-то в ваших владениях только что подошел слишком близко к ней."
 pod_laibon.108.t:0 "Нарушение маскарада"
 pod_laibon.109.a:0 "Восстановите могилу и совершите старые обряды."
 pod_laibon.109.b:0 "Общайтесь с духами, но оставьте могилу такой, какая она есть."
 pod_laibon.109.c:0 "Могила находится на ценной земле. Очистите его и постройте что-нибудь полезное."
 pod_laibon.109.desc:0 "Вы обнаруживаете или вспоминаете место захоронения своих смертных предков. Могила старая, заросшая, возможно, забытая живыми. Но духи оттуда не ушли. Для Лайбона мертвые не исчезают — они сохраняются в Оруне, в самой земле, в крови потомков, которые несут их вперед, сами того не подозревая. Забытая могила — это рана в памяти общества, а духи забытых умерших могут стать беспокойными, что усложнит жизнь каждого. Вы должны этим людям что-то. Другое дело, решите ли вы выплатить этот долг."
 pod_laibon.109.t:0 "Могила предка"
 pod_laibon.200.a:0 "Вмешайтесь лично. Восстановите порядок среди Лайбонов и смертных."
 pod_laibon.200.b:0 "Разрешить только спор Лайбонов. Смертные разберутся сами."
 pod_laibon.200.desc:0 "Спор между вашими вассалами грозит перекинуться в мир смертных, воюющие Лайбоны небрежно питаются, нарушает торговлю и пугает смертных, поддерживающих владения. Как Гурухи, это ваша ответственность. Земля ваша, и ее нужно защищать. Гурухи являются правителями не только благодаря завоеваниям — они являются правителями, потому что они приняли договор с землей и людьми, которые на ней работают. Когда земля страдает, за это отвечают Гурухи: перед смертными, перед другими Наследиями и предками, наблюдающими за происходящим с Оруна. Ты не просил эту корону. Вы носите его несмотря ни на что."
 pod_laibon.200.t:0 "Вес короны"
 pod_laibon.201.a:0 "Шагните во тьму. Пусть он покажет вам, что находится за пределами."
 pod_laibon.201.b:0 "Командуйте тенями, но не входите. Соблюдайте дистанцию."
 pod_laibon.201.desc:0 "Тени в вашем убежище движутся сами по себе — тянутся, хватаются, шепчут. Они, конечно, не живые, но и не пустые. Тьма — это дверь в Орун, и она всегда открыта для вас. Другие Сородичи, повелевающие тьмой, рассматривают ее как оружие – инструмент страха и сокрытия. Вы знаете это по-другому. Тени — это не пустое пространство, а субстанция границы между мирами, и то, что вы ими формируете, касается чего-то, что существует по обе стороны завесы. Сегодня вечером они более активны, чем обычно. Что-то прижалось к дверному проему с другой стороны."
 pod_laibon.201.t:0 "Тьма внутри"
 pod_laibon.202.a:0 "Слушай Зверя. Учитесь у животного мира."
 pod_laibon.202.b:0 "Используйте проницательность Зверя для получения практической выгоды."
 pod_laibon.202.desc:0 "Ваш [Glossary('Зверь','game_concept_beast_desc')] шевелится не от голода или ярости, а от разговора. Он показывает вам кое-что через чувства животных: модели миграции антилоп гну, территориальные метки леопарда, социальные связи стада слонов. Здесь есть урок, если вы можете его прочитать. Лайбоны не говорят о [Glossary('Звере','game_concept_beast_desc')] так, как это делают европейские Сородичи – не как о демоне, которого нужно заключить в клетку, а как о старшем я, части вас, которая помнит то, что человечество забыло, когда построило свой первый город. Является ли это понимание мудростью или удобной ложью, которую подсказывает кровь, чтобы вы чувствовали себя комфортно с тем, кем вы являетесь, — это вопрос, на который каждый Лайбон в конечном итоге должен ответить для себя."
 pod_laibon.202.t:0 "Совет Зверя"
 pod_laibon.203.a:0 "Сражайся за свой народ. Смертные, находящиеся под моей защитой, находятся под угрозой."
 pod_laibon.203.b:0 "Борьба за честь. Воинственный дух моих предков требует совершенства."
 pod_laibon.203.c:0 "Полностью отдайтесь ярости. Ничего не скрывайте."
 pod_laibon.203.desc:0 "Ваша ярость нарастает, знакомый огонь, который определяет ваше наследие. Но ярость бесформенна без направления. Что движет тобой сегодня вечером? Воины Наследия Лайбона всегда понимали, что гнев и побуждение к действию — это не только проклятие, но и дар, но там, где Бруха сражаются за философию, воин Лайбон сражается за что-то более древнее и непосредственное: защиту, справедливость, честь, обретшую форму через действие. Несмотря на это, грань между праведной яростью и простой жаждой насилия [Glossary('Зверя','game_concept_beast_desc')] сегодня тоньше, чем вчера. Убедитесь, что вы знаете, на чьей стороне вы стоите."
 pod_laibon.203.t:0 "Требования Ярости"
 pod_laibon.204.a:0 "Призовите предков. Пусть духи руководят моим суждением."
 pod_laibon.204.a.failure:0 "Предки молчат. Ваше суждение колеблется."
 pod_laibon.204.a.success:0 "Предки говорят ясно. Справедливость восторжествовала."
 pod_laibon.204.b:0 "Судить только по доказательствам и показаниям. Как это делают смертные."
 pod_laibon.204.desc:0 "Перед вами предстает дело - Лайбон обвиняется в небрежном питании, подвергающем опасности Тайну. Доказательства неясны. Обвинитель силен. Обвиняемый заявляет о своей невиновности. Как Шанго, ваше суждение несет в себе тяжесть шторма. Шанго являются арбитрами Лайбона, и эта роль им не была предоставлена, но она была заработана столетиями разрешения споров, которые никто другой не мог разрешить, не начав войну. Когда Шанго произносит приговор, его слова несут в себе авторитет каждого предка, стоявшего на вашем месте до вас. Эта власть ничего не значит, если вы не используете ее осторожно."
 pod_laibon.204.t:0 "Дилемма Штормового Судьи"
 pod_laibon.205.a:0 "Потворствуйте себе с осторожностью. Наслаждайтесь удовольствиями смертного мира, не разрушая его."
 pod_laibon.205.a.failure:0 "Твой аппетит взял над тобой верх. Сообщество запомнит."
 pod_laibon.205.a.success:0 "Вы находитесь на грани между снисходительностью и сдержанностью. Смертные ничего не заметили."
 pod_laibon.205.b:0 "Направьте голод в духовный мир. Вместо этого ищите сверхъестественное удовольствие."
 pod_laibon.205.desc:0 "Вас манит порок. Мир смертных предлагает свои удовольствия — фестиваль, рынок, собрание прекрасных и желающих смертных. Ваше тело жаждет наслаждений. Это и ваша связь с живым миром, и то, что может ее разорвать. Иштарри всегда понимали то, что отказываются признавать более аскетические Сородичи: удовольствие – это не слабость, это привязь. Вампир, который ничего не чувствует к смертным радостям, уже начал дрейфовать к пустым местам между мирами. Но есть разница между осознанным наслаждением и полным погружением в свои желания, и сегодня эта разница кажется очень тонкой."
 pod_laibon.205.t:0 "Порок распространяется"
 pod_laibon.206.a:0 "Защитите караван."
 pod_laibon.206.b:0 "Верните оберег духа."
 pod_laibon.206.c:0 "Заключите сделку, по которой охранники каравана сопроводят вас в рощу, решая обе проблемы."
 pod_laibon.206.c.failure:0 "Сделка разваливается. Вы справляетесь с остатками того и другого, но не удовлетворяете никого полностью."
 pod_laibon.206.c.success:0 "Твой серебряный язык творит чудеса. Обе работы выполнены, оба клиента довольны."
 pod_laibon.206.desc:0 "Вы попадаете на перепутье в прямом и переносном смысле. Смертному каравану нужна защита от бандитов. Старейшине Лайбона нужен дух-оберег, добытый из священной рощи. Оба прибыльны. Время позволяет только одно. Раманга всегда занимали это пространство между мирами — переговорщики, посредники, те, кто понимает, что мир смертных и мир Лайбона не так уж разделены, как думают другие. Каждый выбор, подобный этому, — это небольшой акт торговли между этими двумя мирами, и ваша репутация в обоих зависит от того, как вы с ним справитесь. Хитрость заключается в том, чтобы обе стороны заплатили вам должным образом."
 pod_laibon.206.t:0 "Посредник на перепутье"
 pod_laibon.207.a:0 "Откройте себя глубинам земли."
 pod_laibon.207.b:0 "Сопротивляйтесь. Ты вампир, а не корень."
 pod_laibon.207.desc:0 "Во время вашего погребального покоя говорит земля. Не на словах, а на ощущениях. Вес камня, движение корней, медленный пульс вещей, которые были старыми, когда человечество было молодо. Глубинный Орун давит на ваше сознание. Наглоперы всегда считали, что самая древняя часть духовного мира находится не в небе или на горизонте, а под ногами – там, где мертвые возвращаются на землю, а земля поглощает все, что когда-либо было живым. Большинство Лайбонов спят над землей, ближе к знакомому им миру. Вы спите под ним, а это значит, что вы слышите то, чего не видят они."
 pod_laibon.207.t:0 "Земля помнит"
 pod_laibon.208.a:0 "Послушайте ее. Поделитесь тем, что вы знаете о мертвых, в обмен на то, что она знает о живых."
 pod_laibon.208.b:0 "Заботьтесь о ее нуждах. Она стареет, и ее магия обходится ей дорого."
 pod_laibon.208.c:0 "Попросите ее помочь вам связаться с конкретным предком посредством комбинированного ритуала."
 pod_laibon.208.c.failure:0 "Ритуал затихает и исчезает. Предок не отвечает."
 pod_laibon.208.c.success:0 "Комбинированный ритуал удался. Предок говорит через границу миров."
 pod_laibon.208.desc:0 "Ваша Бомкази приходит к вам в сумерках, как всегда. Кормление — это ритуал, более древний, чем любой из вас: жизнь, дарованная для поддержания смерти. Но сегодня вечером она задерживается после этого. Ей есть чем поделиться. Бомкази уникальны для Лайбона — женщины, которые добровольно связывают свою кровь с вампиром, регулярно отдавая ее в обмен на защиту, положение и место на краю света между живыми и мертвыми. Отношения – это не собственность, не совсем. Это завет между двумя людьми, каждый из которых по-своему решил жить за пределами обычных границ человеческой жизни."
 pod_laibon.208.t:0 "Дар Бомкази"
 pod_laibon.209.a:0 "Спускайтесь во тьму. Пусть он покажет вам, что существовало до появления миров."
 pod_laibon.209.b:0 "Откройтесь тьме, но держите одну руку на мире."
 pod_laibon.209.c:0 "Откажитесь от этого. Вместо этого охотьтесь. Найдите смертного, зверя, что-нибудь реальное."
 pod_laibon.209.desc:0 "Охота окончена. Лес молчит. В тишине после убийства в вас шевелится что-то, что не является [Glossary('Зверем','game_concept_beast_desc')] — или, возможно, это был [Glossary('Зверь','game_concept_beast_desc')] до того, как у него появилось имя. Первобытная тьма, породившая вашего основателя, шевелится в вашей крови. Оно не говорит. Он просто есть — огромный, терпеливый и старше своих предков. Бонсам не обсуждают это открыто даже между собой. Принципы общества Лайбон были построены на понимании того, что Айе и Орун уравновешивают друг друга. То, что шевелится в вашей крови, предшествует этому балансу – третья вещь, которую невозможно классифицировать. Научиться жить рядом с ним и не быть поглощенным им – это первый и последний урок вашего Наследия."
 pod_laibon.209.t:0 "Тьма раньше"
 pod_laibon.210.a:0 "Отправьте связанного призрака, чтобы украсть тексты, прежде чем кто-либо другой сможет их получить."
 pod_laibon.210.b:0 "Отправляйтесь к ученому сами. Подходите как товарищ, ищущий знаний."
 pod_laibon.210.b.failure:0 "Ученый видит ваш фасад насквозь. Вы уходите с фрагментами, а не с целым."
 pod_laibon.210.b.success:0 "Ученый впечатлен вашей эрудицией. Партнерство рождается."
 pod_laibon.210.c:0 "Воскресите мертвых в городе учёных. Спросите тех, кто писал тексты при жизни."
 pod_laibon.210.desc:0 "До вас доходит слух — смертный ученый в далеком городе приобрел коллекцию текстов. Среди них, возможно, есть фрагмент чего-то более древнего: записи Лайбона до того, как были записаны Принципы. Подобные знания не остаются скрытыми надолго. Мертвые шепчут, что ты должен идти первым. Мла Вату были изгнаны из старого порядка по причинам, которые разные Наследия объясняют по-разному, в зависимости от того, кого вы спрашиваете - но никто не оспаривает то, что вы понимаете знание как силу так, как другие предпочитают оставлять теоретическими. Если существуют записи о том, кем были Лайбоны до того, как их сформировали Принципы, вы намерены прочитать их, прежде чем кто-либо еще получит возможность решить, что это значит."
 pod_laibon.210.t:0 "Дилемма ученого"
 pod_laibon.300.a:0 "Вы по обе стороны."
 pod_laibon.300.desc:0 "Это происходит между одним ударом сердца и следующим, хотя ваше сердце больше не бьется. Два мира совпадают. Вы видите их обоих одновременно: деревню смертных, спящую в лунном свете, и деревню духов, мерцающую за ней, живых и мертвых, идущих одними и теми же путями, разделенных завесой, тонкой, как дыхание. Каждому Лайбону говорят, что это возможно. Очень немногие живут достаточно долго, чтобы стоять здесь и знать, что это такое. Старейшины говорят, что сам Кагн однажды стоял на этом же перекрестке и видел перед собой все творение - и свет, и тьму, и живых, и мертвых - и понимал, что ни одно из них не было более реальным, чем другое."
 pod_laibon.300.t:0 "Откровение Странника"
 pod_laibon.301.a:0 "Дотянись до Айе. Помните о живых; лицо, имя, неоплаченный долг."
 pod_laibon.301.a.failure:0 "Память рушится. Больше не за что держаться. Зверь забирает то, что осталось."
 pod_laibon.301.a.success:0 "Всплывают воспоминания, теплые, яркие, настоящие. Живой мир тянет вас назад."
 pod_laibon.301.b:0 "Доберитесь до Оруна. Обращение к предкам. Попросите их ответить."
 pod_laibon.301.b.failure:0 "Тишина. Предки отвернулись. Зверь выходит вперед."
 pod_laibon.301.b.success:0 "Голос отвечает с другой стороны. Предки не оставили вас."
 pod_laibon.301.c:0 "Сдавайтесь. Вы слишком устали, чтобы сражаться."
 pod_laibon.301.desc:0 "Тишина теперь полная. Никакого шепота от предков. Никакого тепла от живых. Вы стоите в месте, которое не является ни Айе, ни Оруном – пустоте между мирами, где ничего не растет и ничто не умирает. [Glossary('Зверь','game_concept_beast_desc')] наблюдает за тобой из этой пустоты, терпеливо как камень. Оно ждало этого. Лайбоны называют это Пустотой – не место, а состояние, духовный эквивалент незаживающей раны. Остальные Сородичи падают под властью [Glossary('Зверя','game_concept_beast_desc')] от голода и ярости. Лайбон может провалиться из-за отсутствия: просто позвольте обоим соединениям погаснуть до тех пор, пока не останется ничего, кроме хищника, носящего ваше лицо, ожидающего разрешения полностью взять на себя управление."
 pod_laibon.301.t:0 "Пустота"
 pod_laibon.400.a:0 "Что такое Айе – живой мир?"
 pod_laibon.400.b:0 "Что такое Орун – мир духов?"
 pod_laibon.400.c:0 "Как работает этот баланс?"
 pod_laibon.400.d:0 "Я понимаю."
 pod_laibon.400.desc.aye_none:0 "#bold Айе:#! Вы #bold отключены#! от мира живых. Смертные не чувствуют вашего Присутствия.\n"
 pod_laibon.400.desc.aye_tier1:0 "#bold Айе:#! У вас есть #bold скромная#! связь с живым миром. Смертные что-то чувствуют, но не могут это назвать.\n"
 pod_laibon.400.desc.aye_tier2:0 "#bold Айе:#! Ваша связь с живым миром #bold сильная#!. Смертные вокруг вас процветают под вашим влиянием.\n"
 pod_laibon.400.desc.aye_tier3:0 "#bold Айе:#! Вы #bold Дитя Айе#!, глубоко укоренившееся в живом мире. Смертные чувствуют ваш авторитет своими костями.\n"
 pod_laibon.400.desc.hollow:0 "\n#bold Вы — Пустой#! — оторванный от обоих миров, дрейфующий в пустоте между ними. [Glossary('Зверь','game_concept_beast_desc')] наблюдает и ждет."
 pod_laibon.400.desc.intro:0 "Вы погружаетесь в тишину и обращаете свое осознание внутрь, к месту, где кровь встречается с духом. Каждый Лайбон ходит между двумя мирами; #bold Айе#!, мир живых, и #bold Орун#!, мир духов и предков. Ваша сила проистекает из баланса, который вы сохраняете между ними.\n\n"
 pod_laibon.400.desc.orun_none:0 "#bold Орун:#! Вы #bold отключены#! от духовного мира. Предки молчат.\n"
 pod_laibon.400.desc.orun_tier1:0 "#bold Орун:#! У вас есть #bold скромная #! связь с миром духов. Предки шевелятся, когда вы рядом.\n"
 pod_laibon.400.desc.orun_tier2:0 "#bold Орун:#! Ваша связь с миром духов #bold сильная#!. Предки шепчут указания в предрассветные часы.\n"
 pod_laibon.400.desc.orun_tier3:0 "#bold Орун:#! Вы #bold Дитя Оруна#! - мир духов отвечает на ваш зов. Предки идут рядом с тобой.\n"
 pod_laibon.400.desc.walker:0 "\n#bold Вы — Странник между мирами #! — вы овладели и Айе, и Оруном, стоя на перекрестке самого существования."
 pod_laibon.400.t:0 "Два мира"
 pod_laibon.401.a:0 "Расскажи мне больше о двух мирах."
 pod_laibon.401.b:0 "Я видел достаточно."
 pod_laibon.401.desc.factors:0 "\n\n#bold Что усиливает Айе:#!\n- Дисциплины Присутствия и Доминирования\n- Поддержание стада и участие в делах смертных \n- Благоприятное наследие Айе (Гурухи, Иштарри) и пути веры \n- События, которые связывают вас со смертным мир\n\n#bold Что ослабляет Айе:#!\n- Безумие Зверя и потеря контроля\n- Безрассудное убийство или истощение смертных\n- Естественное разложение с течением времени - Айе необходимо активно поддерживать"
 pod_laibon.401.desc.intro:0 "#bold Айе#! — ваша связь с миром смертных; земля, люди, живой пульс вашего владения. Сильный в Айе ​​Лайбон правит не посредством одного страха, а посредством Присутствия. Смертные подчиняются, потому что чувствуют тяжесть вашей власти. Сама земля признает вас своим хранителем. \n\nПо мере роста вашего Айе вы получаете влияние на мнение смертных, управление и стабильность вашего домена. На пике вы можете Призвать Власть Живого; сила, которая требует повиновения как от смертных, так и от Лайбона.\n\n"
 pod_laibon.401.desc.none:0 "#bold Текущее положение: #! Вы #bold отключены #! от Айе. Без этой связи вы понесете штрафы за свое влияние на смертных."
 pod_laibon.401.desc.tier1:0 "#bold Текущее положение: #! Ваш Айе - #bold скромный #! - фундамент, но есть куда расти дальше."
 pod_laibon.401.desc.tier2:0 "#bold Текущее положение: #! Ваш Айе - #bold сильный #! - вы хорошо укоренились в мире живых, но еще не достигли своего пика."
 pod_laibon.401.desc.tier3:0 "#bold Текущее положение: #! Вы достигли самого высокого уровня Айе - #bold Дитя Айе#!. Живой мир в вашем распоряжении."
 pod_laibon.401.t:0 "Живой мир"
 pod_laibon.402.desc.factors:0 "\n\n#bold Что усиливает Орун:#!\n- Дисциплины «Власть над Тенью» и «Некромантия»\n- Питание вампирами и кровные узы\n- Наследия, благоприятствующие Оруну (Раманга, Наглопер, Бонсам, Импундулу, Мла Вату) и пути веры\n- События, которые соединяют вас с духовным миром\n\n#bold Что ослабляет Орун:#!\n- Естественное угасание со временем. Орун необходимо активно поддерживать\n- Пренебрежение духовным миром в пользу забот смертных."
 pod_laibon.402.desc.intro:0 "#bold Орун#! — ваша связь с миром за завесой, царством предков, духов и мёртвых. Лайбон с сильным Оруном идёт рядом с незримыми существами. Предки делятся своими тайнами, духи даруют свою силу, а граница между жизнью и смертью почти исчезает.\n\nПо мере роста Оруна вы обретаете доблесть, ужас и устойчивость к враждебным проискам. На высшем уровне вам доступно Общение с предками — ритуал, который вырывает тайны из мира духов и окутывает вас силой мёртвых.\n\n"
 pod_laibon.402.desc.none:0 "#bold Текущее положение:#! Вы #bold утратили связь#! с Оруном. Без этой связи вы уязвимы и ослаблены."
 pod_laibon.402.desc.tier1:0 "#bold Текущее положение:#! Ваш Орун #bold умеренный#! — духи отзываются, но их голоса едва слышны."
 pod_laibon.402.desc.tier2:0 "#bold Текущее положение:#! Ваш Орун #bold силён#! — предки говорят ясно, но глубочайшие тайны всё ещё скрыты."
 pod_laibon.402.desc.tier3:0 "#bold Текущее положение: #! Вы достигли высшего уровня Оруна — #bold Дитя Оруна#!. Духовный мир отвечает на ваш зов."
 pod_laibon.402.t:0 "Духовный мир"
 pod_laibon.403.desc.affinity:0 "#bold Наследие и вера:#! Ваше наследие Лайбона (клан) и путь веры подталкивают ваш баланс. Наследие, поддерживающее Айе, такое как Гурухи и Иштарри, естественным образом тянет вас к живому миру. Наследия, благоприятствующие Оруну, такие как Раманга и Наглопер, тянут вас к духам. Сбалансированные наследства, такие как Осебо и Акунансе, оставляют выбор за вами. Ваш путь веры работает аналогичным образом — выберите тот, который соответствует вашему желаемому пути, или тот, который уравновешивает ваше наследие. \n\n"
 pod_laibon.403.desc.decay:0 "#bold Ежегодный распад: #! И Айе, и Орун со временем естественным образом разрушаются. Чем выше ваш уровень, тем быстрее он распадается. Вы должны активно развивать свои связи, иначе рискуете их потерять. Если обе оси опускаются ниже первого порога, вы становитесь #bold Пустым#! — оторванным от обоих миров и подвергающимся суровым наказаниям, пока не пробьетесь обратно. \n\n"
 pod_laibon.403.desc.intro:0 "Система Айе/Орун отслеживает ваше духовное положение по двум осям. Каждый из них варьируется от пустого до полного, с пороговыми значениями на трех уровнях. Ваше наследие, ваша вера, ваши дисциплины и ваш выбор – все это определяет ваше положение.\n\n"
 pod_laibon.403.desc.special:0 "#bold Мастерство:#! Если вы одновременно достигнете высшего уровня в Айе и Оруне, вы станете #bold Странником между мирами#!. Это редкое состояние духовной гармонии даёт проницательность, спокойствие и уважение равных вам. \n\n#bold Способности уровня 3:#! Достижение высшего уровня по любой оси открывает мощное решение. Дитя Айе может принять решение «Призвать власть живых» для усиления влияния на смертных. Дитя Оруна может принять решение «Общение с предками», чтобы вырвать тайны из мира духов. \n\n#bold Дисциплины:#! «Присутствие» и «Доминирование» пассивно усиливают Айе. «Власть над Тенью» и «Некромантия» пассивно усиливают Орун.\n\n#bold Питание и безумие Зверя:#! Поддержание стада усиливает Айе. Питание вампирами или кровные узы усиливают Орун. Убийство или осушение смертных ослабляет Айе. Впадение в безумие перемещает вас к Оруну."
 pod_laibon.403.t:0 "Баланс"
