l_russian:
 POD_mummy_resurrection.2.a.tt.evil:0 "Вас ждёт весьма #italic болезненный#! урок от Учителя"
 POD_mummy_resurrection.2.a.tt.forgiveness:0 "Ваша услуга считается... приемлемой."
 POD_mummy_resurrection.2.d:0 "Я судья!"
 POD_mummy_resurrection.2.d.tt:0 "Вы заявляете о себе идеально и без изъянов. Никакой проверки не производится"
 POD_mummy_resurrection.2.desc.custom:0 "Вы были убиты. Теперь вы окажетесь в [UmbraGlossaryLocalized('shadowlands','Загробный мир')] и должны предстать перед судом, чтобы доказать, что вы достойны воскресения. \nВсе начинается с ожидания, пока вас не найдут призраки, поклявшиеся собирать души, когда это царство было впервые основано, прежде чем предстать перед тем, кто стабилизировал [GetPlayer.Custom('PODGetCustomMummyDynastyShadowRealm')] и утвердился в качестве судьи [GetTrait('custom_mummy_dynasty').GetName(GetPlayer)]."
 POD_mummy_resurrection.2.desc.evil:0 "Вы были убиты. Теперь вы окажетесь в [UmbraGlossaryLocalized('shadowlands','Загробный мир')] и должны предстать перед судом, чтобы доказать, что вы достойны воскрешения. \nВы были призваны обратно прямо в объятия Мастера. Время, проведенное вами на их службе, будет оценено с учетом вашей недавней неспособности остаться в живых. Необходимо выделить время для того, чтобы убедиться, что вы правильно усвоили урок."
 POD_mummy_resurrection.2.desc.wutian:0 "Вы были убиты. Теперь вы окажетесь в [UmbraGlossaryLocalized('shadowlands','Загробный мир')] и должны предстать перед судом, чтобы доказать, что вы достойны воскресения. \nСтоя перед Вратами Небес, вы ожидаете Восьми Бессмертных, которые оценят, усердно ли вы работали над выполнением порученного вам задания и дела Небес в своей прошлой жизни."
 POD_mummy_resurrection.2.e:0 "Я Девятый!"
 POD_mummy_resurrection.2.t.custom:0 "Весы Единого"
 POD_mummy_resurrection.2.t.evil:0 "Весы Мастера"
 POD_mummy_resurrection.2.t.wutian:0 "Весы Восьмерых"
 podmummy.3.desc:0 "Внезапно, без помпы и дыма, перед вами оказывается мужчина, одетый в белое одеяние. На его лице нет шрамов возраста, но тяжесть и разочарование в глазах с лихвой компенсируют это. Возможно, для большинства он незнаком, но вы хорошо его знаете, потому что именно его лицо вы видите всякий раз, когда возвращаетесь к Вратам Рая. \n\n\"Наше зрение не потускнело с возрастом, и мы не стали более снисходительными с течением времени. Во всех случаях, за исключением некоторых, мы даем каждому Ву Тянь целую жизнь, чтобы совершать ошибки и каяться. Однако существуют определенные нарушения Небесных Мандатов, которые необходимо устранить, прежде чем можно будет создать настоящие ужасы. Вы продали свою душу темной силе, душу, которую вы добровольно связали с небесными поисками. Теперь... теперь ты предпочел власть долгу и поэтому потеряешь эту власть.\""
 podmummy.3.t:0 "Нарушенные мандаты"
 podmummy.6000.a:0 "[GetDynastyHouseByID( 'house_white_lotus_society' ).GetBaseName]"
 podmummy.6000.b:0 "[GetDynastyHouseByID( 'house_twilight_scholars' ).GetBaseName]"
 podmummy.6000.c:0 "[GetDynastyHouseByID( 'house_jade_sentinels' ).GetBaseName]"
 podmummy.6000.d:0 "[GetDynastyHouseByID( 'house_celestial_arrows' ).GetBaseName]"
 podmummy.6000.desc:0 "Когда вы впервые стали Ву Тянь, ваша личность определила ваш выбор между династиями [GetDynastyByID( 'POD_mummy_dynasty_xianlung' ).GetBaseName] и [GetDynastyByID( 'POD_mummy_dynasty_wufeng' ).GetBaseName]. Однако вечность – это очень долгое время, и того, что когда-то тянуло тебя на один путь, больше нет. Изменив баланс своего аспекта, вы можете выбрать новый путь, приняв на себя его преимущества и недостатки."
 podmummy.6000.e:0 "[GetDynastyHouseByID( 'house_righteous_peach_blossoms' ).GetBaseName]"
 podmummy.6000.f:0 "[GetDynastyHouseByID( 'house_brotherhood_of_the_scarlet_lantern' ).GetBaseName]"
 podmummy.6000.t:0 "Новый путь"
 podmummy.6001.desc.wufeng:0 "Ваша душа попадает в мир Ян, страну дикости. Вдалеке в бушующем море хаоса жужжат огромные насекомые. Как лесной пожар, тебя охватывает бурлящая и капризная энергия. Из безумия улетает золотой феникс. Поприветствовав вас, феникс готовится открыть портал к Вратам Небес. Когда вы пройдете через него, в вашу нынешнюю сущность вольётся дух, подчеркивая то, что уже есть. Однако сначала вы должны выбрать свой аспект, который повлияет на вашу роль в планах Небес. По мнению дракона, хотя ваша душа предрасположена к задачам [GetDynastyByID( 'POD_mummy_dynasty_wufeng' ).GetBaseName], возможно, вы осознаете дисбаланс внутри себя и ищете перемен. \n\nК какому дому вы присоединитесь? Какие задачи вы желаете?"
 podmummy.6001.desc.xianlung:0 "Ваша душа переходит в мир Инь, страну отстраненности. Вдали горбатые духи бредут под неподвижной, безоблачной пустотой вдоль дорог, словно гладкие черные осколки костей. Из тишины вылетает золотой дракон. Поприветствовав вас, дракон готовится открыть портал к Вратам Небес. Когда вы пройдете через него, в вашу нынешнюю сущность вольётся дух, подчеркивая то, что уже есть. Однако сначала вы должны выбрать свой аспект, который повлияет на вашу роль в планах Небес. По мнению дракона, хотя ваша душа предрасположена к задачам [GetDynastyByID( 'POD_mummy_dynasty_xianlung' ).GetBaseName], возможно, вы осознаете дисбаланс внутри себя и ищете перемен. \n\nК какому дому вы присоединитесь? Какие задачи вы желаете?"
 podmummy.6001.t:0 "Выбор аспекта"
 podmummy_3_wutian_witch:0 "@warning_icon! #X Стать [GetTrait('witch').GetName(GetPlayer)] — это серьезное нарушение Десяти Небесных Мандатов, которыми связаны все Ву Тянь! #!"
