 nick_chronicler_desc:0 "Ни одно дело не должно остаться ненаписанным."
 tenet_anachoresis_default_desc:0 "Удалившись от мирского общества в пустыню, верующие могут достичь духовной чистоты, победить страсти и приблизиться к истине через уединенную молитву и аскетическое дисциплинирование."
 tenet_anachoresis_default_name:0 "Одиночная Медитация"
 tenet_aniconism_desc:0 "Эта вера процветает за счет уничтожения личной собственности. Никакие артефакты не застрахованы от последователей этой группы, поскольку они пытаются достичь просветления (или просто следуют своим низменным побуждениям), разбивая все, что попадает в их руки."
 tenet_aniconism_name:0 "Беспричинное разрушение"
 tenet_be_fruitful_and_multiply_default_desc:0 "Дети — наша надежда, наше будущее и наше любящее бремя. Без них мы ничто, а с ними, надеюсь, мы — все."
 tenet_celestial_hierarchy_default_desc:0 "В вещах есть порядок. Правители правят, а советники дают советы. Нет ничего постыдного в том, чтобы выполнять свою роль из-за кулис власти."
 tenet_confession_default_desc:0 "Через исповедь грешники могут получить отпущение грехов и примириться с верой."
 tenet_divine_liturgy_default_desc:0 "Литургия, поемая, письменная или устная, является основным выражением нашей веры."
 tenet_divine_liturgy_default_name:0 "Литургические традиции"
 tenet_divine_marriage_desc:0 "Наше происхождение является источником гордости, уважения и силы. Поддержание этого имеет первостепенное значение, даже если для этого потребуются некоторые... неортодоксальные пары."
 tenet_divine_marriage_name:0 "Чистая родословная"
 tenet_extinction_of_dharma_desc:0 "Демоны ходят по земле под видом благочестивых и набожных; тот, кто убьет одного, сделает один шаг к просветлению; тот, кто убьет десять, сделает десять шагов к просветлению."
 tenet_extinction_of_dharma_name:0 "Бич правоверных"
 tenet_harmonious_society_desc:0 "Все должно быть сбалансировано: личность, природа, общество. Истинно верующие задают темп, и мы следуем их пению."
 tenet_hesychasm_default_desc:0 "Благодаря внутреннему спокойствию, созерцательной молитве и размышляющему терпению верующий может пережить мимолетный момент как совершенное существо."
 tenet_hesychasm_default_name:0 "Медитативное просветление"
 tenet_household_gods_desc:0 "Мы почитаем наших #EMP Lares#! и #EMP Genii#! — духов-защитников, которые охраняют наши жилища. Мы помним Богов Греции и Рима. Смертные забыли, но мы не забудем."
 tenet_hyperdulia_default_desc:0 "В нашей вере доминируют женщины. В мире, который в основном отвечает прихотям людей, мы научились яростно защищать себя и свое вероучение."
 tenet_hyperdulia_default_name:0 "Верные женщины"
 tenet_miaphysitism_default_desc:0 "Ложь – прерогатива заблудших душ. Высказанная истина – это победа, одержанная во имя нашего вероучения."
 tenet_miaphysitism_default_name:0 "Честность до отказа"
 tenet_miles_christi_default_desc:0 "Наше вероучение имеет сильные боевые традиции. Наши самые уважаемые члены часто оказываются на передовой борьбы с теми, кто может нам угрожать."
 tenet_miles_christi_default_name:0 "Воины веры"
 tenet_monophysitism_default_desc:0 "Наше вероучение и наши богословы, как известно, нелегко принимают расхождения. Истина – это просто правда, и ее обсуждение – пустая трата времени."
 tenet_monophysitism_default_name:0 "Упрямое Крид"
 tenet_mortification_of_the_flesh_default_desc:0 "Верующие умерщвляют плоть и ее греховные похоти, превознося свои страдания для очищения души и достижения духовного совершенства."
 tenet_ora_et_labora_default_desc:0 "Наши цели могут быть достигнуты только упорным трудом. Праздность — враг души, надо быть прилежным и в мыслях, и в делах."
 tenet_ora_et_labora_default_name:0 "Трудолюбивое кредо"
 tenet_original_sin_default_desc:0 "Никто не совершенен и не может без ошибок следовать вероучению на протяжении всего своего существования. Тем не менее, стремление к этому идеалу является краеугольным камнем нашего учения."
 tenet_pacifism_desc:0 "Мы знаем наших истинных врагов и будем сражаться с ними, когда это необходимо, но война не в нашей природе. Когда кровопролитие не нужно, мы сосредотачиваемся на улучшении нашего собственного общества."
 tenet_pacifism_name:0 "Наносите удар целенаправленно"
 tenet_pastoral_isolation_name:0 "Изоляция"
 tenet_philanthropia_default_desc:0 "Сострадание – это не слабость. Действительно, нужна сила, чтобы заглянуть за пределы себя и протянуть руку помощи менее удачливым."
 tenet_pure_land_desc:0 "Время полумер прошло. Мы поразим наших врагов праведным гневом и яростью. Покаяние в наших грехах может прийти позже."
 tenet_pure_land_name:0 "Чистая Земля"
 tenet_scholasticism_default_desc:0 "Благодаря строгим интеллектуальным исследованиям и диалектическому методу можно примирить веру и разум и достичь более глубокого понимания божественной истины."
 tenet_simony_default_desc:0 "Золото играет уважаемую роль в нашем вероучении. Накопление и разумное расходование денег действительно считается благочестивым поступком."
 tenet_simony_default_name:0 "Молитвы о золоте"
 tenet_transubstantiation_default_desc:0 "Наши законные претензии, наши места поклонения, наши праздники... во всем мы стремимся оставаться верными нашему вероучению."
 tenet_transubstantiation_default_name:0 "Ревностный взгляд"
