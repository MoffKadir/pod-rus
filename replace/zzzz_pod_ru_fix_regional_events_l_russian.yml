l_russian:
 podregionalevents.24.a:0 "Гея зовет нас!"
 podregionalevents.24.desc:0 "Тревожные новости достигли вас из отдаленного района Франции. Было замечено, что клика печально известного Красного Круга, магов-инферналистов, стремящихся уничтожить вам подобных, вмешивается в то, что выглядит истощенным Каэрном. Дальнейшие расследования местных Гару раскрыли историю этого места.\n\nДавным-давно могущественный слуга $glossary_wyrm$, Ткач Снов, был призван недобросовестным шаманом. Местному Каерну, населенному Белыми Войниками, беженцами от Великой Зимы, не оставалось иного выбора, кроме как провести мощный ритуал по заключению духа и самих себя, пожертвовав энергией Каэрна.\n\nТеперь Красный Круг медленно истощает силу тюрьмы, усиливая себя, одновременно ослабляя ограничения Ткача Снов. Встревоженные духи повсюду ищут стаю, способную остановить их, прежде чем произойдет худшее. Местные Гару уже согласились предоставить всем желающим проход по лунному мосту, поэтому расстояние до этого места не имеет значения.\n\nПолные надежды теурги также указывают на потенциальную награду за этот великий квест. Духи Белых Войников также заключены в тюрьму и, если бы их благополучно освободили, это могло бы привести к возрождению затерянного племени Льва. Если добавить к этому уничтожение самого Ткача Снов, это действительно станет великой победой Геи."
 podregionalevents.24.t:0 "Тюрьма Ткача Снов"
