l_russian:
 POD_asakku_andeleon_brood:0 "Выводок Анделеона"
 POD_asakku_andeleon_brood_desc:0 "Те, кого вы развратили, движутся по миру как продолжение вашей воли. Больше рук, больше глаз, больше вас."
 POD_asakku_consolidated_network:0 "Консолидированная сеть"
 POD_asakku_consolidated_network_desc:0 "Выводок смыкает ряды. Его члены охраняют подступы друг к другу; при враждебных действиях любой путь нападения уже находится под наблюдением глаз, о которых никто не подозревал."
 POD_asakku_hunted:0 "Преследование Элиуд"
 POD_asakku_hunted_desc:0 "Элиуд наметили к уничтожению персонажа $pod_cainite$. Их камуты обмениваются разведданными, и будущие операции против этой цели станут эффективнее."
 POD_asakku_inner_babble:0 "Внутренний лепет"
 POD_asakku_inner_babble_desc:0 "Постоянный ропот мыслей сущности создает стену шума, через которую не могут проникнуть враждебные замыслы. Те, кто проникает в ваш разум, находят не тишину, а хор. \n Предоставляет #P Сильную ментальную защиту#!."
 POD_asakku_occultation:0 "затемнение"
 POD_asakku_occultation_desc:0 "Сущность внутри учит вас прятаться способами, не имеющими ничего общего с тенями. Вас становится трудно воспринимать даже тем, кто точно знает, куда смотреть."
 POD_asakku_phase1_reward:0 "Основание"
 POD_asakku_phase1_reward_desc:0 "Первые семена пустили корни. Другие уже несут инфекцию, и вы можете почувствовать каждого из них, слабые пульсации на грани сознания. Сущность удовлетворена таким образом, что это не имеет ничего общего с удовлетворением. Она просто признаёт прогресс."
 POD_asakku_phase3_reward:0 "Чистка западных узурпаторов"
 POD_asakku_phase3_reward_desc:0 "Западное направление Теневого крестового похода завершено. Камуты, которые охотились на вас, ушли, умерли или изменились. Голос в ваших мыслях не удовлетворен. Это означало бы конец."
 POD_asakku_phase4_reward:0 "Восточная расплата"
 POD_asakku_phase4_reward_desc:0 "Восток готов. Элиуды ушли. Истинная Рука продолжает, уменьшенная и озадаченная. У Наблюдателя есть то, за чем он пришел. Победа для вас или для них? Возможно, на данный момент это не имеет значения."
 POD_asakku_press_advantage:0 "Развить успех"
 POD_asakku_press_advantage_desc:0 "Элиуды пошатнулись, и вы не намерены позволить им прийти в себя. Сущность реализует ваши планы с острой настойчивостью."
 POD_asakku_sinister_mastery_1:0 "Зловещее мастерство"
 POD_asakku_sinister_mastery_1_desc:0 "Влияние сущности обостряет ваши инстинкты Изменчивости. Холерические искусства теперь стали более естественными."
 POD_asakku_sinister_mastery_2:0 "Зловещее мастерство (вознесение)"
 POD_asakku_sinister_mastery_2_desc:0 "Владение существа плотью глубже любой дисциплины. Ваше понимание Изменчивости превосходит то, что мог бы предложить любой учитель."
 POD_asakku_soul_infection_resistant:0 "Сопротивление заражению души"
 POD_asakku_soul_infection_resistant_desc:0 "Персонаж $pod_cainite$ едва избежал нежелательного вторжения чуждой сущности. В ближайшем будущем такие попытки будут встречать большую осторожность."
 POD_asakku_spread_wider:0 "Распространение шире"
 POD_asakku_spread_wider_desc:0 "Инфекция распространяется дальше и быстрее. Терпение сущности уступило место целеустремленности, и семена, которые вы посадите, пускают корни прежде, чем почва успеет возразить."
 POD_asakku_vicissitude_taint:0 "Скверна Изменчивости"
 POD_asakku_vicissitude_taint_desc:0 "Кровь погрузилась в саму землю. Земля становится странной, оборонительной, враждебной по отношению к посторонним, живой, не имеющей ничего общего с природой."
