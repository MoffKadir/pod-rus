l_russian:
 glossary_bastet_karoush:0 "[Glossary('Каруш', 'glossary_bastet_karoush_tt')]"
 glossary_bastet_karoush_tt:0 "Каруш - это свод законов [GetTrait('bastet').GetName(GetNullCharacter)|l].\n\n#italic Почитай себя\nЧти своё слово\nЧти своих родных и себе подобных\nЧти свою землю\nЧти свою тишину#!"
 glossary_celestine:0 "[Glossary('Целестин', 'glossary_celestine_tt')]"
 glossary_celestine_tt:0 "В мифологии [Glossary('фера', 'glossary_fera_tt')] #bold целестины#! — это небесные духи. В небесной иерархии они стоят сразу после Геи и [Glossary('Триады', 'glossary_triat_tt')]. По силе они не уступают древним богам.\n\nИстинный облик целестинов невозможно вообразить. Они разумны и обладают высоким интеллектом. Общение и взаимодействие между целестинами и низшими существами возможно только через аватары. Эти аватары представляют собой аспекты самих целестинов в обличьях, понятных низшим существам. Каждый аватар содержит лишь малую толику истинной силы целестина, но это всё равно делает их одними из самых могущественных существ в духовном мире.\n\nЦелестины обитают на небесах. За каждой планетой в нашей Солнечной системе, за каждым масштабным астрономическим явлением стоит духовное присутствие, обитающее в духовном мире, как в [UmbraGlossaryLocalized('aetherial_realm','Неземной сфере')], так и в холодном, враждебном и безразличном безумии [UmbraGlossaryLocalized('deep_umbra','Глубокой Умбры')]."
 glossary_helios:0 "[Glossary('Гелиос', 'glossary_helios_tt')]"
 glossary_helios_lord_sun:0 "[Glossary('Владыка-Солнце', 'glossary_helios_tt')]"
 glossary_helios_sun:0 "[Glossary('Солнце', 'glossary_helios_tt')]"
 glossary_helios_tt:0 "#bold Гелиос#! — [Glossary('целестин', 'glossary_celestine_tt')] и воплощение Солнца Земли. В отличие от своей сестры [Glossary('Луны', 'glossary_luna_tt')], он благословляет только два вида [Glossary('фера', 'glossary_fera_tt')].\n\nГелиосу поклонялись первые [GetTrait('mokole').GetName(GetNullCharacter)|l] в Эпоху королей. Он не лишил их своей благосклонности, и по сей день оборотни-ящеры чтят его. #TOOLTIP:GAME_TRAIT,corax,[GetNullCharacter] #L Кораксы#!#! тоже его дети и почитают его во всех своих поступках.\n\nТе, кому покровительствует Гелиос, уязвимы перед золотом, так же как те, кому покровительствует Луна, уязвимы перед серебром. Из-за этого моколе уязвимы и перед серебром, и перед золотом. Кораксы, напротив, уязвимы только перед золотом, так как Гелиос лишил их уязвимости перед серебром, когда даровал им своё покровительство."
 glossary_luna:0 "[Glossary('Луна', 'glossary_luna_tt')]"
 glossary_luna_seline:0 "[Glossary('Селин', 'glossary_luna_tt')]"
 glossary_luna_tt:0 "#bold Луна#!, также известная как Сияющая Госпожа и Селин, — [Glossary('целестин', 'glossary_celestine_tt')], духовное воплощение земной Луны.\n\nЛуна имеет огромное значение для #TOOLTIP:GAME_TRAIT,werewolf,[GetNullCharacter] #L гару#!#!. Она служит им проводником и покровительницей. Она — источник их сверхъестественной [Glossary('ярости', 'glossary_rage_tt')]. Кроме того, именно по её постоянно меняющемуся лику можно определить покровительство вервольфа при рождении.\n\nЛуна также покровительствует большинству [Glossary('фера', 'glossary_fera_tt')], но они не получают её лунных покровительств."
 glossary_mokole_duties:0 "[Glossary('Обязательства', 'glossary_mokole_duties_tt')]"
 glossary_mokole_duties_tt:0 "Обязательства - это свод законов [GetTrait('mokole').GetName(GetNullCharacter)|l].\n\n#italic Уничтожай падших\nНе позволяй тени омрачить себя\nЗащищай пруд\nНе поднимай Вуаль\nИспытай кладку\nВсе от Геи\nПомни#!"
 glossary_rage:0 "[Glossary('Ярость', 'glossary_rage_tt')]"
 glossary_rage_tt:0 "#bold Ярость#! — это мистический источник первобытного гнева, дарованный [Glossary('фера', 'glossary_fera_tt')] [Glossary('Луной', 'glossary_luna_tt')]. Она позволяет им двигаться с огромной скоростью, не обращать внимания на тяжёлые раны и совершать множество других сверхъестественных подвигов. Однако этот дар делает фера уязвимыми для серебра.\n\nОднако некоторые фера не обладают яростью. У [GetTrait('ananasi').GetName(GetNullCharacter)|l] и [GetTrait('nuwisha').GetName(GetNullCharacter)|l] нет ярости, а значит, и уязвимости к серебру. У #TOOLTIP:GAME_TRAIT,corax,[GetNullCharacter] #L кораксов#!#! есть ярость, но их покровитель [Glossary('Гелиос', 'glossary_helios_tt')] защитил их от этой слабости."
 glossary_werewolf_dark_litany:0 "[Glossary('Тёмная Литания', 'glossary_werewolf_dark_litany_tt')]"
 glossary_werewolf_dark_litany_tt:0 "Тёмная Литания - это свод законов, который соблюдают #TOOLTIP:RELIGION,blackspiraldancer_religion #L Танцоры Чёрной спирали#!#!.\n\n#italic Служи [Glossary('Вирму', 'glossary_wyrm_tt')] во всех ликах его\nЧти землю брата своего\nРази тех, кто не с нами\nПочитай всех служителей Вирма\nПервый кусок добычи — старшим\nВсё, что не запрещено, дозволено\nНе поднимай Вуаль\nМожешь бросить вожаку вызов в мирное время\nНе бросай вожаку вызов во время войны\nНе наводи беды на яму деяниями своими#!"
 glossary_werewolf_litany:0 "[Glossary('Литания', 'glossary_werewolf_litany_tt')]"
 glossary_werewolf_litany_tt:0 "Литания - это свод законов, который соблюдают #TOOLTIP:GAME_TRAIT,werewolf,[GetNullCharacter] #L гару#!#!.\n\n#italic Сражайся с [Glossary('Вирмом', 'glossary_wyrm_tt')] повсюду и всегда, не давай Вирму плодиться\nЧти чужие земли\nПодчиняйся старшим\nНе презирай стоящих ниже тебя, ибо все от Геи\nПервый кусок добычи — старшим\nНе вкушай плоти человеческой\nНе поднимай Вуаль\nМожешь бросить вожаку вызов в мирное время\nНе бросай вожаку вызов во время войны\nНе навлеки беду на каэрн#!"
 glossary_wyrm_hydra:0 "[Glossary('Гидра', 'glossary_wyrm_tt')]"
 iberia_glossary.yzebel:0 "Павшая провидица и военачальница иберийских Бруха. Верующая в утопию, независимо от происхождения, мечту, которую она обещала как «Новый Карфаген». Объединившись с новообращёнными Ласомбра, Иберия истекала кровью в своей вражде со старейшинами Ласомбра, что положило начало возвышению римских Вентру. Ослабевшая, израненная в бесконечной борьбе, Изебель в последний раз выступила против налётчиков Вентру. Среди глубоких источников Порту пророчица встретила свой конец: её зарубили топором и диаблеризировали."
 pod_clans:0 "[Glossary('Кланы','game_concept_Clan_desc')]"
 podgloss.warofbalance:0 "В легендах говорится о вечной войне, известной под многими названиями на протяжении веков: Джихад аль-Маати, Тифонический поход, Война возвращенцев, Война отцов, Эонический конфликт, Последняя битва Равновесия и Энтропии, Война за равновесие.\n\nТысяча лет прошла между сотворением Гора и появлением следующей группы бессмертных. В это время, когда Сутех укреплял свою власть в Кемете, Гор начал создавать то, что впоследствии будет названо Осирианской лигой: объединение мужчин и женщин, смертных и бессмертных, которые поклялись противостоять Сутеху и [Glossary('Апофису', 'glossary_wyrm_tt')]. Опухоль Сутеха разрослась, и его приспешники расползлись по земле. Тлетворное влияние Апофиса, одного из воплощений безумного [Glossary('Вирма', 'glossary_wyrm_corruption')], было поистине безграничным. Они пытались нарушить равновесие, называемое Маат, погрузив мир в хаос и зло. Немногие могли видеть это, кроме Гора. Он боролся с влиянием Сутеха и Апофиса, где бы оно ни проявлялось. Он возглавлял армии сородичей, бессмертных, фера и фей против приспешников Змея. #italic Так утверждает одна сторона.#!\n\nИ всё же борьба продолжается. Сутех всё ещё сражается с Гором на протяжении многих лет. Маат, само равновесие и справедливость, по-прежнему висит на волоске, который так легко можно оборвать.\n\nКто знает, что таит в себе будущее. Возможно, Сутех освободит мир от цепей Вечности. Возможно, Апофис поглотит мир. Возможно, Гор отомстит за своего отца. Возможно, справедливость восторжествует над злом. Возможно, будет восстановлено равновесие между созиданием и разрушением. Возможно, многие устанут и прекратят конфликт. Возможно, война сама по себе поддерживает равновесие. Время покажет. Рано или поздно, время всегда покажет."
 podgloss.xianren:0 "Кимия, Амброзия, Амрита, Ганьлу, Ааб-и-Хаят, Сома, Аква-де-Вида, Вода жизни, Омолаживающая вода, Танцующие путники, Райская река, Источник молодости, эликсир Белого зайца, Источник нектара, Целебная прорубь Бимини, сок золотистого персика или яблока, Воды Хебы, Источник молодости Бейры, фонтан пресвитера Иоанна, источник Геродота, трава Гильгамеша, которая «старика сделает юнцом», которую можно найти только под водой, желание Александра Македонского. Эликсир вечной жизни известен под многими названиями, слухи о нём распространяются по торговым путям.\n\nТе же слухи ходят и среди #TOOLTIP:GAME_TRAIT,mummy,[GetNullCharacter] #L мумий#!#!, появившихся на свет в результате личных исследований, культивирования и приготовления эликсиров, а не в результате обычного ритуала. Эликсир, который когда-либо получали немногие, эти бессмертные, создавшие себя сами, почтенные старейшины, иногда известные как Сяньжэнь, столь же уникальны, как и методы, использованные при их создании. Для некоторых погребальные курганы в западных предгорьях Синьцзяна стали утробами матери. Другие просто перестали стареть или сбалансировали потоки жизненной энергии настолько, что могли поддерживать себя вечно. Некоторые делали упор на улучшение своей физической формы, в то время как другие обращались за помощью к духам или открывали секреты бессмертия в своих отношениях с другими людьми. Некоторые отказывались от всех знаний о зле и таким образом предотвращали старение своего сердца. В то время как одни обращались к боевым искусствам, чтобы отточить своё тело, другие полагались на медитацию или зелья. Скрытые мастера нашли способ перемещаться между царствами жизни и смерти, наполненные энергией духа дракона или феникса, существа, которое служит им временным покровителем, как назвали бы его Бессмертные на западе. Несмотря на различия, все пути дают эликсир вечной жизни, независимо от того, сделан ли он из крови или кровавых лепестков.\n\nХодят слухи, что [Concept('akuma', 'акума')|E] владеют алхимией праведного Дракона и Феникса и что они вечно возрождаются в знакомом цикле: Бессмертные, известные как #TOOLTIP:GAME_TRAIT,wukuei,[GetNullCharacter] #L ву-куэй#!#!. Вместо того, чтобы служить Восьми Бессмертным и вернуться к вратам Небес после каждой жизни, #TOOLTIP:GAME_TRAIT,wukuei,[GetNullCharacter] #L ву-куэй#!#! падают ниц к стопам [Glossary('повелителей Яма','podgloss.yamaking')]. В конце концов, так мало существ по-настоящему свободны."
