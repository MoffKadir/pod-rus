l_russian:
 ancestors_grave_development_modifier:0 "Очищенная Земля Предков"
 ancestors_grave_development_modifier_desc:0 "Расчищенная земля была использована продуктивно, хотя духи этого не одобряют."
 aye_disconnected_modifier:0 "Утраченная связь с Айе"
 aye_disconnected_modifier_desc:0 "Вы потеряли связь с миром живых. Смертные чувствуют в вас что-то глубоко неправильное."
 beasts_counsel_modifier:0 "Совет Зверя"
 beasts_counsel_modifier_desc:0 "Ваш Зверь поделился своим пониманием законов дикой природы."
 commune_with_ancestors_modifier:0 "Общение с Предками"
 commune_with_ancestors_modifier_desc:0 "Предки ответили. Их сила течет через вас, и их взгляд показывает то, что другие скрывают."
 fury_prowess_modifier:0 "Ярость Осебо"
 fury_prowess_modifier_desc:0 "Воинственные духи твоих предков придают силу твоей руке."
 fury_unleashed_modifier:0 "Ярость на свободе"
 fury_unleashed_modifier_desc:0 "Вы полностью отдались ярости. Власть опьяняет и опасна."
 gathering_fire_modifier:0 "Огонь собрания"
 gathering_fire_modifier_desc:0 "Огонь собрания всё ещё горит в памяти тех, кто на нём присутствовал."
 guruhi_beauty_1_modifier:0 "Отвратительный Гурухи"
 guruhi_beauty_2_modifier:0 "Непривлекательный Гурухи"
 guruhi_beauty_3_modifier:0 "Человекоподобный Гурухи"
 guruhi_beauty_4_modifier:0 "Сияющий Гурухи"
 guruhi_crown_modifier:0 "Вес Короны"
 guruhi_crown_modifier_desc:0 "Ваше личное вмешательство восстановило порядок среди ваших вассалов."
 harvest_celebration_modifier:0 "Страж урожая"
 harvest_celebration_modifier_desc:0 "Смертные помнят ваше присутствие на празднике. Вы — их защитник."
 invoke_authority_of_the_living_modifier:0 "Авторитет живых"
 invoke_authority_of_the_living_modifier_desc:0 "Вы говорите голосом живого мира. Смертные подчиняются, потому что им приказывает сама земля."
 laibon_vassal_authority_modifier:0 "Айе: власть сюзерена"
 laibon_vassal_authority_modifier_desc:0 "Ваш господин говорит с авторитетом живого мира. Даже мертвые слушают."
 masquerade_breach_modifier:0 "Нарушение Маскарада"
 masquerade_breach_modifier_desc:0 "Слухи распространились среди смертных. Что-то не так с их господином."
 mortal_petitioner_failure_modifier:0 "Несправедливый арбитр"
 mortal_petitioner_failure_modifier_desc:0 "Ваша попытка вынести приговор заставила смертных опасаться вашего авторитета."
 mortal_petitioner_success_modifier:0 "Справедливый арбитр"
 mortal_petitioner_success_modifier_desc:0 "Ваше справедливое суждение заслужило уважение смертных в ваших владениях."
 orun_disconnected_modifier:0 "Утраченная связь с Оруном"
 orun_disconnected_modifier_desc:0 "Мир духов отвернулся от вас. Ваши предки молчат. Вы одни во тьме."
 scholars_insight_modifier:0 "Взгляд ученого"
 scholars_insight_modifier_desc:0 "Древние знания открыли новые пути понимания."
 spirit_beast_wound_modifier:0 "Рана духа-зверя"
 spirit_beast_wound_modifier_desc:0 "Отказ духа-зверя оставил рану, которая не поддаётся исцелению."
 spirit_blessed_modifier:0 "Благословенный Духом"
 spirit_blessed_modifier_desc:0 "Великий дух признал вас. Его сила сохраняется в вашей крови."
 vice_spreads_failure_modifier:0 "Безудержный порок"
 vice_spreads_failure_modifier_desc:0 "Ваша снисходительность оставила след в обществе. Смертные насторожены."
